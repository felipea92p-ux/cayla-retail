# CI — los verificadores que Vercel no corre.
#
# POR QUÉ EXISTE. Hasta el 2026-09-09 el único gate real de este repo era `pnpm build`, y
# se corría cuando alguien se acordaba. `pnpm typecheck` existía pero devolvía verde sin
# revisar nada (0 tareas; arreglado en `afab818`). Un gate que depende de la memoria de una
# persona no es un gate: es una intención.
#
# POR QUÉ NO CORRE `build`. Vercel ya construye en cada push a main, con el mismo Next y el
# mismo lockfile, y `next.config.ts` no tiene `ignoreBuildErrors`. Repetirlo acá agrega
# minutos y no agrega señal. Lo que Vercel NO corre —y por eso está acá— es lint y pruebas.
#
# LO QUE ESTE CI NO PUEDE DECIR. No toca base de datos: `migraciones:verificar` necesita el
# Postgres local y no corre acá. O sea que verde significa "el código tipa, pasa lint, las
# pruebas pasan y ninguna tabla del volcado de producción quedó sin pájaro", nunca "las
# migraciones están aplicadas" ni "la pantalla se ve bien".
# Misma disciplina que ADR-0026: un verificador vale por lo que declara que NO revisó.
#
# OBLIGATORIO DESDE 2026-09-25: si falla, el PR sale en rojo y el ruleset `main-protegida`
# no deja fusionarlo (CONTRIBUTING.md §2).
# `pruebas-postgres`, abajo, SÍ levanta Postgres real
# (`npx supabase start`) y corre `caja:verificar` + `scripts/pruebas/*.mjs` contra él.
# Nació el 2026-09-17 como piloto con `continue-on-error: true`: ADR-0066 temía que "cada
# PR futuro saldría rojo por Docker, no por el código". Se midió antes de quitarlo: de 79
# corridas, 20 fallaron y 19 fueron fallas reales del código (una sola de infraestructura,
# el límite de descargas de Docker Hub). Una de ellas, en `pruebas:roles`, salió en rojo
# dos veces en su propio PR (#397, 2026-09-25) y aun así se fusionó porque el job no
# bloqueaba; 7 PR más la heredaron hasta que se arregló a mano. Si falla SOLO por infraestructura
# («toomanyrequests», «failed to pull»), se vuelve a correr el job; no se apaga la prueba.

name: CI

# El equipo trabaja con ramas y PR (CONTRIBUTING.md §2): el PR corre todo antes de fusionar. El push a main ya NO lo repite
# entero (ADR-0345): el ruleset exige la rama al día, así que el PR corrió sobre el mismo árbol que queda en main. Solo corre
# lo que el PR no corrió: la base entera si el PR era «solo web», y todo si el commit llegó directo, sin PR.
on:
  push:
    branches: [main]
  pull_request:

# Dos pushes seguidos a un PR: el primero se cancela. Sin esto, corregir un typo hace correr lo
# mismo dos veces y el resultado que llega segundo puede ser el del commit viejo.
#
# CANCELAR TIENE QUE CANCELAR (ADR-0286, 2026-09-29). `always()` sigue ejecutando el paso aunque la corrida se cancele, y
# los pasos de aquí lo llevaban todos: el push nuevo pedía cancelar la corrida vieja y esta terminaba igual sus ~7 minutos
# de pruebas, mientras la nueva esperaba en el grupo. Medido en 42 corridas: 12 esperaron entre 17 s y 5 min, y en las 12 la
# espera fue lo que le quedaba de vida a la corrida «cancelada». Por eso todos los pasos usan `!cancelled()`: corren
# aunque otro falle (lo que se quería) y se detienen cuando se cancela (lo que no pasaba).
#
# `main` no se cancela: cada commit de `main` tiene su propio grupo (por SHA) y se verifica entero. ADR-0259 da por hecho
# que `main` ya pasó el job completo; con un grupo compartido, el merge siguiente cancelaría al anterior de verdad.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cuánto del job de Postgres hace falta (ADR-0259): `nada` si el PR solo cambia documentos, `web` si además solo toca
  # apps/web, `completo` en cualquier otro caso y en todo push a main. Dos commits: en un PR, HEAD^1 es el main de hoy.
  alcance:
    name: Qué toca el PR
    runs-on: ubuntu-latest
    outputs:
      alcance: ${{ steps.medir.outputs.alcance }}
      verificar: ${{ steps.medir.outputs.verificar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: medir
        run: node scripts/ci/alcance.mjs

  verificar:
    name: Tipos, lint y pruebas
    # En un push a `main` que viene de un PR este job ya corrió sobre el mismo árbol (el ruleset exige la rama al día: ADR-0345)
    # y `alcance` dice `verificar=no`. Con `!cancelled()` y `!= 'no'` y no `== 'si'`: si `alcance` falla, su salida llega
    # vacía y el job corre; nunca se salta por no saber. En un PR `alcance` siempre dice `si`.
    needs: alcance
    if: ${{ !cancelled() && needs.alcance.outputs.verificar != 'no' }}
    runs-on: ubuntu-latest
    steps:
      # Dos commits: el candado de la bitácora compara el PR contra el main de hoy (HEAD^1 del merge del PR).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # La versión de pnpm sale de `packageManager` en package.json — no se repite acá.
      # Dos números que hay que acordarse de mover juntos terminan distintos.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: instalar
        run: pnpm install --frozen-lockfile

      # `apps/web/tsconfig.json` incluye `.next/types/**`, que solo existe después de un
      # build o un `dev`. En un clon limpio —o sea acá— esos archivos no están, así que
      # `tsc` no vería los tipos de ruta de Next y el verde cubriría menos que en la
      # máquina de Felipe. `next typegen` los genera en 3,5 s sin construir nada.
      - name: Tipos de ruta de Next
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: pnpm --filter web exec next typegen

      # Los tres corren SIEMPRE aunque uno falle, pero solo si la instalación funcionó
      # (si no hay node_modules, los tres fallarían por la misma razón y el informe sería
      # ruido). Un push malo devuelve así el diagnóstico completo en una vuelta: sin esto,
      # arreglar el lint solo sirve para descubrir que además fallaban las pruebas.
      - name: Tipos
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: pnpm lint

      - name: Pruebas
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: pnpm test

      # El aviario (ADR-0104): ninguna tabla de producción sin pájaro, ninguna con dos, y
      # `docs/datos/generado/AVIARIO.md` al día. Tampoco toca base de datos: lee el volcado
      # de producción commiteado, así que su alarma es tan fresca como ese volcado. No
      # necesita node_modules, por eso corre aunque la instalación falle.
      - name: Aviario
        if: ${{ !cancelled() }}
        run: node scripts/datos/aviario.mjs --verificar

      # Versiones de migración únicas: Supabase usa el prefijo numérico como llave del
      # historial, y dos archivos con el mismo prefijo rompen `supabase start` y `db reset`
      # (2026-09-17 x2, 2026-09-18, 2026-09-30). Solo lee nombres de archivo; no necesita node_modules.
      # Corre también en `pull_request`: el choque entre dos ramas se ve en la segunda, si su CI corre DESPUÉS de que la
      # primera entró a main. El 2026-09-30 no fue así (#643 pasó antes de que se fusionara #642): ver versiones.mjs.
      - name: Versiones de migración
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/migraciones/versiones.test.mjs
          node scripts/migraciones/versiones.mjs

      # Ninguna migración nueva usa `drop trigger`: en Supabase toma en exclusiva auth y storage hasta el final de la
      # pegada y choca con el Asesor de seguridad (40P01, ADR-0195). Pasó el 2026-09-27 (`20260927190000`, #538).
      # Las 22 que ya lo tenían quedan en su legado. Solo lee archivos; no necesita node_modules.
      - name: Migraciones sin drop trigger
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/migraciones/sin-drop-trigger.test.mjs
          node scripts/migraciones/sin-drop-trigger.mjs

      # Las pruebas del check «SQL pegado» (el check en sí corre en `sql-pegado.yml`, también al editar el cuerpo del
      # PR). Aquí porque una de ellas lee la plantilla del formulario, y ese workflow solo baja scripts/migraciones.
      # deriva-diaria.test.mjs simula `deriva-diaria.yml` paso a paso (bash, jq y curl, que el runner trae).
      - name: Pruebas del check SQL pegado y de la deriva
        if: ${{ !cancelled() }}
        run: node --test scripts/migraciones/sql-pegado.test.mjs scripts/migraciones/deriva.test.mjs scripts/migraciones/deriva-diaria.test.mjs

      # Números de ADR únicos: cada sesión numera su ADR como "el siguiente" de su `main` y,
      # con ramas paralelas, dos eligen el mismo (0074 y 0105 siguen repetidos en
      # `main`; el 2026-09-17 hubo seis choques). Solo lee nombres de archivo; no necesita
      # node_modules. Corre también en `pull_request`: el choque entre dos ramas se ve en la
      # segunda. Las pruebas del detector van primero, para que un candado roto no diga "todo bien".
      - name: Números de ADR
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/adr/numeros.test.mjs scripts/reservar/reservar.test.mjs scripts/abrir-pr/choques.test.mjs
          node scripts/adr/numeros.mjs

      # Una entrada nueva de bitácora o de backlog vive en su propio archivo (ADR-0259): BITACORA.md y BACKLOG.md eran los
      # dos archivos más tocados del repo y cada PR chocaba ahí con el anterior. Van también las pruebas de «qué toca el
      # PR», que decide cuánto corre el job de Postgres. Solo leen archivos; no necesitan node_modules.
      - name: Bitácora y backlog, una entrada por archivo
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/docs/entradas-por-archivo.test.mjs scripts/ci/alcance.test.mjs scripts/ci/pruebas-postgres.test.mjs
          node scripts/docs/entradas-por-archivo.mjs

      # El escáner de sugerencias (skill `/sugerir`, ADR-0290): `apps/web/lib/sugerir.test.ts` lo importa como la única definición
      # de «ejemplo estático», así que si el escáner se rompe, esa prueba dejaría de ver los placeholders sin avisar. Va con
      # el de la Guía de foco, que le presta el grafo de imports. Solo leen archivos; no necesitan node_modules.
      - name: Escáner de sugerencias y de la guía de foco
        if: ${{ !cancelled() }}
        run: node --test scripts/sugerir/escanear.test.mjs scripts/focus/escanear.test.mjs

      # `/chaos`: el catálogo de ataques y el detector de invariantes. Solo la parte pura (sin Docker); las consultas contra la base
      # las corre `node scripts/chaos/invariantes.mjs --autoprueba` en local.
      - name: Catálogo de caos e invariantes
        if: ${{ !cancelled() }}
        run: node --test scripts/chaos/invariantes.test.mjs scripts/chaos/catalogo.test.mjs

      # La lectura de código de `pnpm datos:comparar` (la que escribe `DRIFT.md`): que un nombre de función entre comillas
      # en una pantalla —en un ternario, en un ayudante— cuente como «la pantalla la usa», y que un comentario NO. Sin esto
      # `DRIFT.md` decía «función que sobra y habría que retirar» de funciones en uso (Proveedores, Categorías, Cierre de
      # mes). Lee el código con el parser de TypeScript (dependencia de la raíz), así que necesita la instalación: solo
      # corre si salió bien (no hay base de datos).
      - name: Lectura de código de datos:comparar
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: node --test scripts/datos/comparar-lectura.test.mjs scripts/datos/comparar.test.mjs

  # PARTIDO EN TANDAS (ADR-0381, 2026-10-12). Las ~180 pruebas corrían en serie sobre una base: 8–11 min, y el ruleset exige
  # la rama al día con main, así que un PR que tardaba 10 min ya estaba atrasado otra vez. Ahora corren en 4 jobs a la vez,
  # cada uno con su PROPIA base (`supabase start` + todas las migraciones), y `scripts/ci/pruebas-postgres.mjs` decide qué
  # prueba va en qué tanda equilibrando por duración medida. La lista de pruebas, con el comentario de qué vigila cada una,
  # vive en ese script (antes eran ~180 pasos aquí). El check obligatorio «Pruebas de RPC contra Postgres» es el job de
  # abajo, que junta las tandas: el ruleset y Vercel siguen viendo el mismo nombre.
  pruebas-postgres-tandas:
    name: Postgres · tanda ${{ matrix.tanda }}
    needs: alcance
    # Un PR que solo cambia documentos deja la base y la web iguales a las de main: las tandas se saltan y el job que las
    # junta da verde. Con `!cancelled()` y no `success()`: si `alcance` falla, su salida llega vacía y corren COMPLETAS;
    # nunca se salta por no saber (ADR-0259).
    if: ${{ !cancelled() && needs.alcance.outputs.alcance != 'nada' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Una tanda roja no cancela las otras: el diagnóstico completo llega en una vuelta.
      fail-fast: false
      # Un PR «solo web» corre UNA tanda (las pruebas que leen la web); todo lo demás, las cuatro. El número de tandas es
      # `TANDAS` de pruebas-postgres.mjs (lo vigila su prueba).
      matrix:
        tanda: ${{ fromJSON(needs.alcance.outputs.alcance == 'web' && '[1]' || '[1,2,3,4]') }}
    # SOLO LA BASE (ADR-0286, Parte 2). Las pruebas de este job hablan con el contenedor `supabase_db_cayla-retail` por
    # `docker exec … psql`; ninguna usa la API, auth, storage ni el panel. Levantarlos costaba ~60 de los ~88 s de
    # `supabase start` (bajar 7 imágenes, con reintentos por «Rate exceeded») sin que nada los llamara. Se excluyen los siete
    # que este CLI baja y se fija su versión: los nombres de `-x` son de esta versión, y con `npx supabase` a secas un
    # renombre del CLI pondría el CI en rojo sin que cambie el código. Para subirla: cambiar el número aquí, en una PR.
    # Si una prueba futura necesita uno de esos servicios (RLS por la API con un JWT real, storage), sácalo de SIN_SERVICIOS.
    env:
      SUPABASE_CLI: supabase@2.118.0
      SIN_SERVICIOS: gotrue,kong,mailpit,postgres-meta,postgrest,storage-api,studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: instalar
        run: pnpm install --frozen-lockfile

      # Gitignored a propósito (CONTRIBUTING.md §1, ADR-0033): sin este stub, `retail` no
      # tiene la identidad mínima de Dynamic que necesita para resolver personas/auth.
      - name: Stub local de Dynamic
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: cp supabase/0000_local_stub_dynamic.sql.example supabase/migrations/0000_local_stub_dynamic.sql

      # En un PR «solo web» este paso no corre, y con él se saltan las pruebas de la tanda (piden `steps.supabase`): la
      # base es la de main, que ya las pasó. Corre en su lugar el paso siguiente.
      - id: supabase
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' && needs.alcance.outputs.alcance != 'web' }}
        run: npx "$SUPABASE_CLI" start -x "$SIN_SERVICIOS"

      # PR «solo web» (ADR-0259): el mismo Postgres, pero solo las pruebas que leen apps/web (~2 min en vez de ~6). Cuáles
      # son lo deduce el script leyendo cada prueba y lo que importa: una prueba nueva que lea la web entra sola.
      - name: Solo las pruebas que leen la web (el PR solo cambia apps/web)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' && needs.alcance.outputs.alcance == 'web' }}
        run: |
          npx "$SUPABASE_CLI" start -x "$SIN_SERVICIOS"
          node scripts/ci/pruebas-web.mjs

      # Las pruebas de esta tanda. Todas corren aunque una falle; el resumen de la corrida dice cuál falló y cuánto tardó cada una.
      - name: Pruebas de la tanda
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: node scripts/ci/pruebas-postgres.mjs --tanda "${{ matrix.tanda }}/${{ strategy.job-total }}"

      # Huellas del catálogo de main (`scripts/migraciones/deriva.sql`): prueba que la consulta corre sobre la base del CI
      # y, en un push a main, las guarda como artefacto para compararlas con las de producción (`deriva.mjs`): qué SQL de
      # main falta pegar y qué arreglo vive solo en producción (el 2026-09-27 se publicaron 6 cambios sin su SQL). Solo en
      # la tanda 1 (un artefacto por corrida, como antes).
      - name: Huellas de main (deriva)
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' && matrix.tanda == 1 }}
        run: |
          docker exec -i supabase_db_cayla-retail psql -U postgres -d postgres -At -q -v ON_ERROR_STOP=1 < scripts/migraciones/deriva.sql > "$RUNNER_TEMP/huellas-main.tsv"
          lineas=$(wc -l < "$RUNNER_TEMP/huellas-main.tsv")
          echo "huellas de main: $lineas objetos"
          test "$lineas" -gt 1000
          # Cada línea es «grupo<TAB>clave<TAB>huella»: una línea suelta (un «SET» sin -q) rompería la comparación.
          awk -F'\t' 'NF != 3 || length($3) != 12 || $3 !~ /^[0-9a-f]+$/ { print "línea rara: " $0; malo = 1 } END { exit malo }' "$RUNNER_TEMP/huellas-main.tsv"

      - name: Guardar huellas de main
        if: ${{ github.event_name == 'push' && steps.supabase.outcome == 'success' && matrix.tanda == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: huellas-main
          path: ${{ runner.temp }}/huellas-main.tsv
          retention-days: 30

  # El check que exige el ruleset `main-protegida` (y que Vercel puede estar esperando): verde solo si TODAS las tandas
  # salieron bien, o si no tenían que correr (PR solo de documentos, o push a main que ya corrió en su PR, ADR-0345). Con
  # `!cancelled()`: corre aunque una tanda falle, para decir que falló; si la corrida se cancela, se cancela con ella.
  pruebas-postgres:
    name: Pruebas de RPC contra Postgres
    needs: [alcance, pruebas-postgres-tandas]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Juntar las tandas
        env:
          ALCANCE: ${{ needs.alcance.outputs.alcance }}
          TANDAS: ${{ needs.pruebas-postgres-tandas.result }}
        run: |
          echo "alcance=$ALCANCE · tandas=$TANDAS"
          if [ "$ALCANCE" = "nada" ] && [ "$TANDAS" = "skipped" ]; then echo "✓ Nada que correr: solo documentos, o ya corrió en su PR."; exit 0; fi
          if [ "$TANDAS" = "success" ]; then echo "✓ Todas las tandas pasaron."; exit 0; fi
          echo "::error::Las pruebas de Postgres no pasaron (tandas: $TANDAS). Mira la tanda en rojo y su resumen."
          exit 1
