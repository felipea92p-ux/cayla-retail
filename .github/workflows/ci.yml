      - name: pruebas:club-permisos
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:club-permisos

      # Club de clientas, tanda 1c (ADR-0288 D-5): el cumpleaños con un canje por año. `registrar_venta` con
