# CI — los verificadores que Vercel no corre: tipos, lint, pruebas, y la base desde cero.
#
# POR QUÉ EXISTE. Hasta el 2026-09-09 el único gate real de este repo era `pnpm build`, y
# se corría cuando alguien se acordaba. `pnpm typecheck` existía pero devolvía verde sin
# revisar nada (0 tareas; arreglado en `afab818`). Un gate que depende de la memoria de una
# persona no es un gate: es una intención.
#
# POR QUÉ NO CORRE `build`. Vercel ya construye en cada push a main, con el mismo Next y el
# mismo lockfile, y `next.config.ts` no tiene `ignoreBuildErrors`. Repetirlo acá agrega
# minutos y no agrega señal. Lo que Vercel NO corre —y por eso está acá— es lint y pruebas.
#
# POR QUÉ LEVANTA LA BASE (desde el 2026-09-11). Hasta ese día este CI no tocaba Postgres, y
# un merge entró a main con dos migraciones numeradas `0054`: verde acá, y `npx supabase db
# reset` muerto en local con `schema_migrations_pkey` — la contabilidad del propio CLI se
# niega a aplicar dos archivos de la misma versión. Nadie lo vio hasta el primer `db reset`
# a mano (PR #5). El job `migraciones` hace exactamente eso, en un Postgres recién nacido:
# aplica `0001`→la última y corre `seed.sql`. Es el mismo comando que atrapó el problema.
#
# LO QUE ESTE CI NO PUEDE DECIR. Verde significa "el código tipa, pasa lint, las pruebas
# pasan y las migraciones corren desde cero en local". Nunca "las migraciones están
# aplicadas EN PRODUCCIÓN" (eso se pega a mano, ver CLAUDE.md) ni "la pantalla se ve bien".
# Misma disciplina que ADR-0026: un verificador vale por lo que declara que NO revisó.

name: CI

# Felipe trabaja directo sobre main, así que el push es el disparo que importa. El de PR
# queda armado para el día que haya ramas — no cuesta nada hoy.
on:
  push:
    branches: [main]
  pull_request:

# Dos pushes seguidos: el primero se cancela. Sin esto, corregir un typo hace correr lo
# mismo dos veces y el resultado que llega segundo puede ser el del commit viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de `packageManager` en package.json — no se repite acá.
      # Dos números que hay que acordarse de mover juntos terminan distintos.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: instalar
        run: pnpm install --frozen-lockfile

      # `apps/web/tsconfig.json` incluye `.next/types/**`, que solo existe después de un
      # build o un `dev`. En un clon limpio —o sea acá— esos archivos no están, así que
      # `tsc` no vería los tipos de ruta de Next y el verde cubriría menos que en la
      # máquina de Felipe. `next typegen` los genera en 3,5 s sin construir nada.
      - name: Tipos de ruta de Next
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm --filter web exec next typegen

      # Los tres corren SIEMPRE aunque uno falle, pero solo si la instalación funcionó
      # (si no hay node_modules, los tres fallarían por la misma razón y el informe sería
      # ruido). Un push malo devuelve así el diagnóstico completo en una vuelta: sin esto,
      # arreglar el lint solo sirve para descubrir que además fallaban las pruebas.
      - name: Tipos
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm lint

      - name: Pruebas
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm test

  migraciones:
    name: Migraciones desde cero
    runs-on: ubuntu-latest
    # Paralelo a `verificar`, a propósito: un lint roto no debería esconder que la base no
    # levanta, ni al revés. Cada uno cuenta su propia verdad.
    #
    # Sin `pnpm install`: `scripts/migraciones/verificar.mjs` usa solo módulos `node:` y el
    # CLI de Supabase llega como binario. El job se ahorra el minuto de dependencias.
    #
    # Docker es lo que tarda (bajar la imagen de Postgres 17). Si se cuelga, 15 minutos es
    # mucho más de lo que un `db reset` sano necesita (~1 min) y mucho menos que las 6 horas
    # que GitHub deja correr un job por defecto.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Misma versión que la máquina de Felipe (`npx supabase --version`). Si se sube acá,
      # se sube allá: dos CLI distintos pueden aplicar la misma carpeta de formas distintas
      # (imagen de Postgres, formato de `schema_migrations`), y el verde dejaría de
      # significar "lo mismo que en local".
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      # Solo Postgres. `supabase start` levantaría además Auth, la API, Studio, Mailpit…;
      # para aplicar migraciones sobra con el contenedor de la base — y `config.toml` ya
      # apaga la mitad de esos servicios en local.
      - name: Postgres desde cero
        run: supabase db start

      # El comando que atrapó el problema del 11-sep. Falla con cualquier migración rota Y
      # con dos archivos de la misma versión (`schema_migrations_pkey`). Al final corre
      # `supabase/seed.sql`, que mueve las tablas a `retail` como en producción.
      - name: Aplicar 0001 → última, y el seed
        run: supabase db reset

      # Deriva: cada cuerpo de función que quedó en la base tiene un archivo del repo que
      # lo explica. Hoy es INFORME, no gate: el script solo sale con error si no puede leer
      # la base. Los archivos `0015`/`0027` ya salen marcados por deriva vieja (políticas de
      # `storage.objects`, una función borrada después) y no van a dejar de estarlo — para
      # convertirlo en gate hace falta un modo estricto que sepa ignorarlos. Está en BACKLOG.
      - name: Qué promete cada archivo
        run: node scripts/migraciones/verificar.mjs
