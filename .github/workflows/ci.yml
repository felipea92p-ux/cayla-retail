# CI — los verificadores que Vercel no corre.
#
# POR QUÉ EXISTE. Hasta el 2026-09-09 el único gate real de este repo era `pnpm build`, y
# se corría cuando alguien se acordaba. `pnpm typecheck` existía pero devolvía verde sin
# revisar nada (0 tareas; arreglado en `afab818`). Un gate que depende de la memoria de una
# persona no es un gate: es una intención.
#
# POR QUÉ NO CORRE `build`. Vercel ya construye en cada push a main, con el mismo Next y el
# mismo lockfile, y `next.config.ts` no tiene `ignoreBuildErrors`. Repetirlo acá agrega
# minutos y no agrega señal. Lo que Vercel NO corre —y por eso está acá— es lint y pruebas.
#
# LO QUE ESTE CI NO PUEDE DECIR. No toca base de datos: `migraciones:verificar` necesita el
# Postgres local y no corre acá. O sea que verde significa "el código tipa, pasa lint, las
# pruebas pasan y ninguna tabla del volcado de producción quedó sin pájaro", nunca "las
# migraciones están aplicadas" ni "la pantalla se ve bien".
# Misma disciplina que ADR-0026: un verificador vale por lo que declara que NO revisó.
#
# PILOTO DESDE 2026-09-17 (Felipe pidió revisitar ADR-0026/ADR-0066 al crecer a 4 scripts
# de RPC sin cubrir por este job). `pruebas-postgres`, abajo, SÍ levanta Postgres real
# (`npx supabase start`) y corre `caja:verificar` + `scripts/pruebas/*.mjs` contra él.
# ADR-0066 los había dejado fuera de CI a propósito ("cada PR futuro saldría rojo por
# Docker, no por el código") sin haberse visto correr nunca en un runner real — por eso
# el job entero lleva `continue-on-error: true`: no bloquea ningún push mientras se
# confirma que la mecánica funciona igual que en el Postgres local de cada quien (y
# `main` hoy no exige ningún check para mergear de todos modos — CONTRIBUTING.md §2). Se
# saca esa línea cuando haya 2-3 corridas verdes reales.

name: CI

# Felipe trabaja directo sobre main, así que el push es el disparo que importa. El de PR
# queda armado para el día que haya ramas — no cuesta nada hoy.
on:
  push:
    branches: [main]
  pull_request:

# Dos pushes seguidos: el primero se cancela. Sin esto, corregir un typo hace correr lo
# mismo dos veces y el resultado que llega segundo puede ser el del commit viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de `packageManager` en package.json — no se repite acá.
      # Dos números que hay que acordarse de mover juntos terminan distintos.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: instalar
        run: pnpm install --frozen-lockfile

      # `apps/web/tsconfig.json` incluye `.next/types/**`, que solo existe después de un
      # build o un `dev`. En un clon limpio —o sea acá— esos archivos no están, así que
      # `tsc` no vería los tipos de ruta de Next y el verde cubriría menos que en la
      # máquina de Felipe. `next typegen` los genera en 3,5 s sin construir nada.
      - name: Tipos de ruta de Next
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm --filter web exec next typegen

      # Los tres corren SIEMPRE aunque uno falle, pero solo si la instalación funcionó
      # (si no hay node_modules, los tres fallarían por la misma razón y el informe sería
      # ruido). Un push malo devuelve así el diagnóstico completo en una vuelta: sin esto,
      # arreglar el lint solo sirve para descubrir que además fallaban las pruebas.
      - name: Tipos
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm lint

      - name: Pruebas
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: pnpm test

      # El aviario (ADR-0104): ninguna tabla de producción sin pájaro, ninguna con dos, y
      # `docs/datos/generado/AVIARIO.md` al día. Tampoco toca base de datos: lee el volcado
      # de producción commiteado, así que su alarma es tan fresca como ese volcado. No
      # necesita node_modules, por eso corre aunque la instalación falle.
      - name: Aviario
        if: ${{ always() }}
        run: node scripts/datos/aviario.mjs --verificar

      # Versiones de migración únicas: Supabase usa el prefijo numérico como llave del
      # historial, y dos archivos con el mismo prefijo rompen `supabase start` y `db reset`
      # (2026-09-17 x2, 2026-09-18). Solo lee nombres de archivo; no necesita node_modules.
      # Corre también en `pull_request`: el choque entre dos ramas se ve en la segunda.
      - name: Versiones de migración
        if: ${{ always() }}
        run: node scripts/migraciones/versiones.mjs

      # Números de ADR únicos: cada sesión numera su ADR como "el siguiente" de su `main` y,
      # con ramas paralelas, dos eligen el mismo (0074 y 0105 siguen repetidos en
      # `main`; el 2026-09-17 hubo seis choques). Solo lee nombres de archivo; no necesita
      # node_modules. Corre también en `pull_request`: el choque entre dos ramas se ve en la
      # segunda. Las pruebas del detector van primero, para que un candado roto no diga "todo bien".
      - name: Números de ADR
        if: ${{ always() }}
        run: |
          node --test scripts/adr/numeros.test.mjs
          node scripts/adr/numeros.mjs

  pruebas-postgres:
    name: Pruebas de RPC contra Postgres (piloto, no bloquea)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: instalar
        run: pnpm install --frozen-lockfile

      # Gitignored a propósito (CONTRIBUTING.md §1, ADR-0033): sin este stub, `retail` no
      # tiene la identidad mínima de Dynamic que necesita para resolver personas/auth.
      - name: Stub local de Dynamic
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: cp supabase/0000_local_stub_dynamic.sql.example supabase/migrations/0000_local_stub_dynamic.sql

      - id: supabase
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        run: npx supabase start

      # Los cinco corren siempre que Postgres haya levantado, aunque uno falle — mismo
      # criterio que tipos/lint/pruebas arriba: un push malo trae el diagnóstico completo
      # en una vuelta, no uno por uno.
      - name: caja:verificar
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm caja:verificar

      - name: pruebas:registrar-cambio
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:registrar-cambio

      - name: pruebas:aprobar-devolucion-caja
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:aprobar-devolucion-caja

      - name: pruebas:registrar-venta
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:registrar-venta

      # Movimientos con «Referencia» (ADR-0127): el número del traslado/conteo viaja en cada fila,
      # «Traslado 24» / «Boleta B001-000184» / «F001-210» encuentran su proceso, y la lista y las
      # tarjetas de arriba cuentan lo mismo. Cada caso termina en ROLLBACK.
      - name: pruebas:fn-movimientos-referencias
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:fn-movimientos-referencias

      # Resumen de Inventario v2 (ADR-0121): días con stock reconstruidos del ledger,
      # demanda por FK, costo verificado. Cada caso termina en ROLLBACK.
      - name: pruebas:fn-resumen-variantes
        if: ${{ always() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:fn-resumen-variantes
