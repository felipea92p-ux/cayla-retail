      - name: pruebas:candado-lider
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm pruebas:candado-lider

      # Cierre con traslado y apertura verificada (ADR-0186): el esperado que ve quien cierra es el mismo que
