<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punto de Venta · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Punto de Venta (2026-09-26)
   Pregunta: ¿cómo se ve /vender si (1) se conecta con las pantallas que
   trabajan de la mano con él (Caja, Apartados, Cambios, Devoluciones,
   Historial, Proformas, Clientas, Pedidos no atendidos) y (2) el celular
   deja de ser «el escritorio apilado»?
   Todo es conmutable desde la barra negra (no existe en el ERP): «Hoy»
   reproduce la pantalla actual; «Propuesta» enciende lo que marques.
   Tokens = los de apps/web/app/globals.css (ADR-0169). Datos inventados.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);
  --m-efectivo:#d19a12;--m-tarjeta:#525a64;--m-yape:#6d3fa3;--m-plin:#1c6b56;--m-transf:#2f6aa3;
  --ease:cubic-bezier(.32,.72,.24,1);--bar:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd5c6}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
input{outline:none}
.serif{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:15px;height:15px}svg.ic.xs{width:13px;height:13px}svg.ic.l{width:22px;height:22px}
@keyframes sube{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes hoja{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes lado{from{transform:translate3d(100%,0,0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:sticky;top:0;z-index:100;background:var(--tinta);color:var(--crema);font-size:13px}
.spk-f{display:flex;align-items:center;gap:14px;padding:8px 16px;overflow-x:auto;white-space:nowrap;min-height:var(--bar)}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.75)}
.spk select{height:30px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);background:rgba(245,240,232,.06);color:var(--crema);padding:0 8px;font-size:13px}
.spk select option{color:var(--tinta);background:var(--crema)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.7)}
.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk-op{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px 10px;border-top:1px solid rgba(245,240,232,.12);font-size:12.5px}
.spk-op label{cursor:pointer}.spk-op input{accent-color:var(--rojo)}
.spk-op.off{display:none}
.spk .sep{width:1px;height:22px;background:rgba(245,240,232,.18);flex:none}

.escena{padding:28px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.leyenda{max-width:1320px;width:100%;font-size:13px;color:var(--t80);background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px}
.leyenda b{font-weight:600}
.scroll-x{width:100%;overflow-x:auto;display:flex}
.scroll-x>.desk{margin:0 auto}

/* ---------- marco de escritorio ---------- */
.desk{width:1320px;height:840px;flex:none;position:relative;overflow:hidden;border-radius:14px;background:var(--crema);border:1px solid var(--t30);box-shadow:0 30px 60px -30px rgba(26,26,24,.45)}
.erp-top{height:56px;border-bottom:1px solid var(--t10);display:flex;align-items:center;padding:0 24px;gap:12px;color:var(--t65);font-size:12px}
.erp-top .sede{margin-left:auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);color:var(--tinta)}
.pos{position:absolute;inset:76px 24px 20px;display:flex;flex-direction:column;border:1px solid var(--sand);border-radius:18px;background:var(--crema);overflow:hidden}
.pos-cab{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 20px;background:var(--papel);border-bottom:1px solid var(--sand)}
.pos-cab .lugar{color:var(--taupe);font-size:11px;white-space:nowrap}
.pos-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.cat{min-height:0;overflow-y:auto;padding:16px 20px 24px}
.tk{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--sand);background:var(--papel)}

/* accesos */
.acc{display:flex;align-items:center;gap:4px;margin-left:auto}
.acc a,.acc button.a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px;border-radius:8px;border:1px solid var(--sand);background:var(--crema);font-size:12.5px;color:var(--t80);text-decoration:none;position:relative;white-space:nowrap}
.acc a:hover{border-color:var(--taupe);color:var(--tinta)}
.acc .n{min-width:18px;height:18px;border-radius:9px;background:var(--tinta);color:var(--crema);font-size:10.5px;font-weight:600;display:inline-grid;place-items:center;padding:0 5px}
.acc.min a{border:0;background:none;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:600;color:var(--t80);height:32px;padding:0 10px;border-radius:6px}
.acc.min a:hover{background:rgba(232,224,208,.6)}
.acc.hoy a{border:0;background:none;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--t65);font-weight:500;padding:0 7px}
.btn-caja{height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(26,26,24,.28);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin-left:6px;white-space:nowrap}
.resumen{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:999px;background:var(--hueso);font-size:12.5px;cursor:pointer;white-space:nowrap}
.resumen b{font-weight:600}
.resumen .meta{width:54px;height:5px;border-radius:9px;background:rgba(26,26,24,.12);overflow:hidden}.resumen .meta i{display:block;height:100%;width:62%;background:var(--verde)}
.resumen .pct{color:var(--verde);font-weight:600;font-size:11.5px}

/* buscador */
.busca-f{display:flex;gap:10px;align-items:stretch;position:relative}
.busca{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);color:var(--t50);font-size:15.5px}
.busca.foco{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(184,65,45,.12);color:var(--tinta)}
.busca .cam{margin-left:auto;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--hueso);color:var(--tinta)}
.sinreg{height:52px;padding:0 16px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fila-filtros{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:12px;color:var(--t65)}
.switch{width:36px;height:20px;border-radius:10px;background:var(--tinta);position:relative;flex:none}.switch::after{content:"";position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--crema)}
.ocultas{margin-left:auto;font-size:11.5px}
.ocultas a{color:var(--tinta);text-decoration:underline;text-underline-offset:2px}
.pills{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.pill{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--sand);background:var(--papel);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t80);white-space:nowrap;display:inline-flex;align-items:center}
.pill.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}

/* catálogo */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid.denso{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:10px;cursor:pointer;position:relative;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.card:hover{border-color:var(--taupe)}
.card:active{transform:translateY(1px)}
.foto{aspect-ratio:4/5;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.foto .ini{font-family:'EB Garamond',serif;font-size:28px;color:rgba(26,26,24,.28)}
.denso .foto{aspect-ratio:1/1}
.foto .catn{position:absolute;left:8px;bottom:7px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:rgba(26,26,24,.55);background:rgba(251,248,242,.75);padding:2px 6px;border-radius:4px}
.foto .cnt{position:absolute;right:7px;top:7px;min-width:22px;height:22px;border-radius:11px;background:var(--tinta);color:var(--crema);font-size:11px;font-weight:600;display:grid;place-items:center}
.card h4{font-weight:500;font-size:15px;margin-top:9px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.denso .card h4{font-size:13.5px;margin-top:7px}
.card .col{font-size:12px;color:var(--t65)}
.tallas{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.t{min-width:26px;height:24px;padding:0 6px;border-radius:6px;border:1px solid var(--sand);background:var(--hueso);font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-grid;place-items:center}
.t.x{background:none;border-style:dashed;color:var(--t30);text-decoration:line-through}
.t.alm{background:none;border-style:dashed;border-color:rgba(116,80,26,.45);color:var(--ambar);text-decoration:none}
.denso .t{min-width:22px;height:21px;font-size:10px;padding:0 4px}
.card .pie{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.card .pr{font-weight:600;font-size:15px}.denso .card .pr{font-size:13.5px}
.card .st{font-size:11px;color:var(--t65);white-space:nowrap}

/* ticket */
.tk-cab{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--sand)}
.tk-cab h3{font-family:'EB Garamond',serif;font-weight:500;font-size:23px}
.btn-espera{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(26,26,24,.25);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.esperas{display:flex;gap:6px;padding:8px 20px;scrollbar-width:none;border-bottom:1px solid var(--sand);overflow-x:auto;background:var(--crema)}
.esp{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px dashed rgba(26,26,24,.25);border-radius:999px;background:var(--papel);font-size:12px;cursor:pointer;white-space:nowrap}
.esp b{font-weight:600;font-size:12.5px}.esp span{color:var(--t65);font-size:11px}
.esp .ret{color:var(--tinta);text-decoration:underline;text-underline-offset:2px;font-size:11px;font-weight:600}
.cli{margin:12px 20px 0;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--crema);border:1px solid var(--sand);cursor:pointer}
.cli.vacia{border-style:dashed;color:var(--t65);font-size:13px}
.cli .av{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px;flex:none;color:var(--tinta)}
.cli .d{min-width:0;flex:1}.cli .d b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cli .d span{font-size:11.5px;color:var(--t65)}
.cli .cambiar{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.tk-items{flex:1;min-height:0;overflow-y:auto}
.it{padding:14px 20px;border-bottom:1px solid var(--sand)}
.it .r1{display:flex;align-items:flex-start;gap:8px}
.it h5{font-size:15px;font-weight:600}
.it .sku{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--t65)}
.it .camp{font-size:11.5px;color:var(--t65)}
.it .acts{margin-left:auto;display:flex;gap:12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--rojo-p);white-space:nowrap}
.it .r2{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px}
.qty{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:1px solid var(--sand);border-radius:8px;background:var(--hueso)}
.it .tachado{text-decoration:line-through;color:var(--t50);font-size:12px}
.it .imp{margin-left:auto;font-weight:600}
.tk-acc{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;border-top:1px solid var(--sand)}
.chipb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--sand);background:var(--crema);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--t80);white-space:nowrap}
.chipb.nuevo{border-color:rgba(76,93,110,.45)}
.chipb .dsc{color:var(--rojo-p)}
.tk-pie{padding:12px 20px 16px;border-top:1px solid var(--sand)}
.tot{display:flex;align-items:flex-end;gap:12px}
.tot .desg{font-size:12px;color:var(--t65);line-height:1.6}
.tot .gran{margin-left:auto;text-align:right}
.tot .gran .lbl{font-size:10px;color:var(--t65)}
.tot .gran .v{font-family:'EB Garamond',serif;font-size:40px;line-height:1;font-weight:500}
.adm-banner{margin-top:10px;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--sand);border-radius:10px;background:var(--hueso);font-size:12.5px}
.adm-chip{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:rgba(76,93,110,.12);color:var(--pizarra);font-size:10.5px;font-weight:600;letter-spacing:.04em;margin-top:4px}
.cobrar{margin-top:12px;width:100%;height:54px;border-radius:12px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.cobrar .m{margin-left:auto;font-family:'EB Garamond',serif;font-size:21px;letter-spacing:0;text-transform:none;font-weight:500}

/* overlays */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(3px);z-index:50;animation:velo .2s var(--ease) both;display:flex;align-items:flex-start;justify-content:center;padding-top:70px}
.velo.der{justify-content:flex-end;padding:0}
.velo.abajo{align-items:flex-end;padding:0}
.hojam{width:440px;max-height:calc(100% - 100px);overflow-y:auto;background:var(--crema);border-radius:22px;padding:22px 24px;animation:sube .38s var(--ease) both;position:relative}
.hojam.ancha{width:520px}
.lado{width:420px;height:100%;background:var(--crema);animation:lado .32s var(--ease) both;display:flex;flex-direction:column;border-left:1px solid var(--sand)}
.hojam h3,.lado h3{font-family:'EB Garamond',serif;font-weight:500;font-size:22px}
.hojam .baj{font-size:12.5px;color:var(--t65);margin-top:2px}
.cerrar{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--t65)}
.nuevo-tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;background:rgba(76,93,110,.13);color:var(--pizarra);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;vertical-align:middle}
.lbl-f{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t65);margin:16px 0 7px;display:block}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb{border:1px solid var(--sand);border-radius:12px;background:var(--papel);padding:11px 13px;cursor:pointer;text-align:left}
.tb b{font-family:'EB Garamond',serif;font-size:19px;font-weight:500;display:block}
.tb span{font-size:11.5px;color:var(--t65)}
.tb.x{border-style:dashed;background:none}.tb.x b{color:var(--t50);text-decoration:line-through}
.tb.x.otra b{text-decoration:none;color:var(--t65)}
.tb.x.otra span{color:var(--ambar)}
.tb.sel{border:1.5px solid var(--tinta);border-style:solid}
.otras{margin-top:12px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);overflow:hidden;animation:sube .3s var(--ease) both}
.otras .t1{padding:11px 14px;font-size:12.5px;border-bottom:1px solid var(--sand)}
.otras .t1 b{font-weight:600}
.ot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--sand);font-size:13px}
.ot .q{color:var(--t65);font-size:12px}
.ot .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.btn.p{background:var(--tinta);color:var(--crema)}
.btn.s{border:1px solid rgba(26,26,24,.25);background:var(--papel)}
.btn.g{height:44px;font-size:11px;width:100%}
.otras .pie2{padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t65);background:var(--crema)}
.drop{position:absolute;left:0;right:170px;top:58px;z-index:40;background:var(--papel);border:1px solid var(--sand);border-radius:14px;box-shadow:0 18px 40px -20px rgba(26,26,24,.35);overflow:hidden;animation:sube .22s var(--ease) both}
.drop .g{padding:7px 14px 5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--t65);background:var(--crema);border-bottom:1px solid var(--sand)}
.dr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--sand)}
.dr b{font-weight:600;font-size:14px}.dr .s2{font-size:11.5px;color:var(--t65)}
.dr .der{margin-left:auto;text-align:right}.dr .der b{font-size:13.5px}
.dr .ok{font-size:11.5px;color:var(--verde)}.dr .al{font-size:11.5px;color:var(--ambar)}.dr .no{font-size:11.5px;color:var(--rojo-p)}
.dr.apag{opacity:.55}
.campo{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:10px;background:var(--hueso);border:1px solid transparent;font-size:14px}
.campo.foco{border-color:var(--rojo);background:var(--papel)}
.campo .ph{color:var(--t50)}
.campo .chev{margin-left:auto;color:var(--t50)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{font-size:11.5px;color:var(--t65);margin-top:5px}
.precio{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;border-radius:14px;border:1px solid var(--sand);background:var(--papel)}
.precio .v{font-family:'EB Garamond',serif;font-size:30px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--hueso)}
.seg2 button{height:52px;border-radius:9px;font-size:12.5px;text-align:left;padding:0 12px;line-height:1.25}
.seg2 button b{display:block;font-weight:600;font-size:13px}
.seg2 button span{font-size:11px;color:var(--t65)}

    <div style="padding:14px 22px;border-top:1px solid var(--sand);display:flex;gap:8px"><a class="btn s" style="flex:1;height:40px;text-decoration:none;color:var(--tinta)" href="#">${ic('history','s')} Historial completo</a><a class="btn s" style="flex:1;height:40px;text-decoration:none;color:var(--tinta)" href="#">${ic('wallet','s')} Ir a Caja</a></div>`;

/* =========================== escritorio =========================== */
function escritorio(){
  const tituloEscena = {talla:'Toca una tarjeta: la talla agotada ya no es un callejón sin salida.',buscador:'Escribiendo «c» en el buscador.',clienta:'Fila «Clienta» arriba del ticket.',apartar:'Desde el ticket, sin ir a otra pantalla.',sinreg:'Prenda sin registrar.',espera:'Tickets en espera con nombre.',ventas:'La píldora «Hoy» abre las ventas del día (hoy están al fondo del catálogo).',mas:'«Más» guarda lo de menos uso (Historial, Proformas) y el cierre de caja; en el celular guarda los seis.'}[S.escena];
  const grid = `<div class="grid ${on('denso')?'denso':''}">${(on('denso')?PROD:PROD.slice(0,8)).map(tarjeta).join('')}</div>`;
  const ventasFondo = !on('resumen') ? `<div style="margin-top:22px;border-top:1px solid var(--sand);padding-top:14px"><span class="lbl" style="color:var(--t65)">Ventas de hoy ^</span><div class="lista-mini" style="margin-top:8px"><div class="placa" style="padding:18px"><i class="serif">4 ventas hoy en Tienda TRU (hay que bajar hasta aquí para verlas)</i></div></div></div>` : '';
  let ov = '';

  if(e==='clienta'||e==='apartar'||e==='sinreg'||e==='espera'||e==='mas') {
    const cont = {clienta:escenaClienta,apartar:escenaApartar,sinreg:()=>escenaSinReg(false),espera:escenaEspera,mas:escenaMas}[e]();
    ov = `<div class="velo" onclick="if(event.target===this){S.escena='ninguna';pinta()}"><div class="hojam ${e==='apartar'?'ancha':''}"><button class="cerrar" onclick="S.escena='ninguna';pinta()">${ic('x')}</button>${cont}</div></div>`;

    : `<div class="velo" onclick="if(event.target===this){S.escena='ninguna';pinta()}"><div class="hojam"><div class="placa"><b>Hoy: al fondo del catálogo</b>«Ventas de hoy» está debajo de la última tarjeta. Enciende «Resumen de hoy arriba».</div></div></div>`;
  return `${tituloEscena?`<div class="leyenda"><b>Escena:</b> ${tituloEscena}</div>`:''}
  <div class="scroll-x"><div class="desk">
    <div class="erp-top">${ic('side','s')}<span class="sede" style="margin-left:auto;border:0;background:none;color:var(--t65)">${ic('history','s')} ACTIVIDAD</span><span class="sede" style="margin-left:0">TIENDA TRU ${ic('chev','xs')}</span></div>
    <div class="pos">
      <div class="pos-cab"><span class="lbl lugar">Venta en tienda · Tienda TRU</span>${resumenPill(false)}${accesosDesk()}</div>
      <div class="pos-body">
        <section class="cat">
          <div class="busca-f"><div class="busca ${e==='buscador'?'foco':''}" onclick="S.escena='buscador';pinta()">${ic('barcode')}${e==='buscador'?'<span style="color:var(--tinta)">c</span>':'Escanea la etiqueta o busca la prenda'}</div>
            <button class="sinreg" onclick="S.escena='sinreg';pinta()">${P()?ic('plus','s'):''}Prenda sin registrar</button>

function telefono(modo, soloVista){
  const tot = TICKET.reduce((a,t)=>a+t.pf,0);
  const e = soloVista ? 'ninguna' : S.escena;
  const mTicket = soloVista ? false : S.mTicket;
  const tab = soloVista ? 'catalogo' : S.mTab;
  const cab = `<div class="m-top">${ic('menu','s')} CAYLA<span class="sede">TIENDA TRU ${ic('chev','xs')}</span></div>
    <div class="m-cab"><span class="lbl lugar">Venta · TRU</span>${resumenPill(true)}
      ${P()&&S.op.accesos==='barra'?`<button class="m-mas" ${on('resumen')?'':'style="margin-left:auto"'} onclick="S.escena='mas';pinta()">${ic('grid','xs')} Más<span style="min-width:16px;height:16px;border-radius:8px;background:var(--tinta);color:var(--crema);font-size:9.5px;display:inline-grid;place-items:center;padding:0 4px">4</span></button>`
        : !P()?`<button class="m-mas" style="margin-left:auto">Cerrar caja</button>`:''}</div>
    ${P()&&S.op.accesos==='minimo'?`<div class="m-min"><a href="#">Caja</a><a href="#">Cambios</a><a href="#">Devol.</a></div>`:''}`;
  const buscador = `<div class="m-sticky"><div class="m-busca"><div class="busca ${e==='buscador'?'foco':''}" onclick="S.escena='buscador';pinta()">${ic('barcode','s')}<span style="flex:1;${e==='buscador'?'color:var(--tinta)':''}">${e==='buscador'?'c':'Escanea o busca'}</span>${on('camara')?`<span class="cam">${ic('scan','s')}</span>`:''}</div>
      <button class="m-sr" onclick="S.escena='sinreg';pinta()" title="Prenda sin registrar">${ic('plus','s')}</button></div>
      <div class="pills">${CATS.map((c,i)=>`<span class="pill ${i===0?'on':''}">${c}</span>`).join('')}</div></div>`;
  const catalogo = `<div class="m-filtro"><span class="switch"></span>SOLO CON STOCK<span style="margin-left:auto">33 ocultas</span></div>
    <div class="m-grid">${PROD.slice(0,8).map(tarjeta).join('')}</div>`;
  const tabs = modo==='pestanas' ? `<div class="m-tabs"><button class="${tab==='catalogo'?'on':''}" onclick="S.mTab='catalogo';pinta()">${ic('grid','xs')} Catálogo</button><button class="${tab==='ticket'?'on':''}" onclick="S.mTab='ticket';pinta()">${ic('bag','xs')} Ticket <span class="n">2</span></button></div>` : '';
  let cuerpo;
  if(modo==='pestanas' && tab==='ticket') cuerpo = `${cab}${tabs}<div class="m-ticket-in">${ticket(true)}</div>`;
  else if(modo==='apilado') cuerpo = `${cab}${buscador}${catalogo}<div class="bajo-apilado"><div class="tk-cab" style="background:var(--papel)">${ic('bag')}<h3>Ticket actual</h3></div>${ticket(true)}</div>`;
  else cuerpo = `${cab}${tabs}${buscador}${catalogo}${modo==='barra'?'<div style="height:84px"></div>':''}`;
  const barraCobro = modo==='barra' && !mTicket ? `<div class="m-barra" onclick="S.mTicket=true;S.escena='ninguna';pinta()"><span class="c">${ic('bag','s')}<span class="n">2</span></span><span class="tx">2 prendas · Blusa Carlita, Top Aurora<b>${sol(tot)}</b></span><span class="ir">Ver ticket ${ic('chevu','xs')}</span></div>` : '';
  let hoja = '';
  if(mTicket) hoja = `<div class="m-velo" onclick="if(event.target===this){S.mTicket=false;pinta()}"><div class="m-hoja tk-m"><div class="asa"></div><div style="display:flex;align-items:center;gap:8px;padding:4px 18px 8px">${ic('bag')}<h3>Ticket actual</h3><button class="btn-espera" onclick="S.escena='espera';S.mTicket=false;pinta()">${ic('pause','xs')} En espera · ${P()?2:1}</button></div>${ticket(true)}</div></div>`;
  if(e!=='ninguna' && e!=='buscador'){
    const cont = {talla:escenaTalla,clienta:escenaClienta,apartar:escenaApartar,sinreg:()=>escenaSinReg(true),espera:escenaEspera,mas:escenaMas,ventas:null}[e];
    if(e==='ventas') hoja = on('resumen') ? `<div class="m-velo" onclick="if(event.target===this){S.escena='ninguna';pinta()}"><div class="m-hoja" style="height:88%"><div class="asa"></div><div style="display:flex;flex-direction:column;min-height:0;flex:1">${escenaVentas()}</div></div></div>`

    else hoja = `<div class="m-velo" onclick="if(event.target===this){S.escena='ninguna';pinta()}"><div class="m-hoja"><div class="asa"></div><div class="cuerpo">${cont()}</div></div></div>`;

  return `<div class="tel"><div class="pant"><div class="pscroll">${cuerpo}</div>${barraCobro}${drop}${hoja}</div></div>`;
}

/* =========================== otros POS =========================== */
function otros(){

  return `<div class="doc">
    <span class="lbl sobre">Referentes · cómo resuelven lo mismo</span>
    <h1>Cómo lo hacen otros puntos de venta</h1>
    <p class="bajada">Cinco POS de retail que se usan en tienda física y en el celular. Sale de su documentación pública y de su uso conocido (no se revisó en vivo hoy); cada fila dice qué tomamos para CAYLA y qué no.</p>
    <h2>Lo que se repite en todos</h2>
    <div class="tarjetas">
      <div class="tj"><h4>La clienta va arriba del carrito</h4><p>Shopify POS, Square, Lightspeed y Odoo muestran «Agregar cliente» en la cabecera del carrito, <i>antes</i> de cobrar. Así el historial, los puntos y el comprobante salen solos.</p><div class="toma"><b>Tomamos:</b> fila «Clienta» opcional arriba del ticket, con la ficha de clienta que ya existe en la base.</div></div>
      <div class="tj"><h4>Stock de otras tiendas en la ficha</h4><p>Shopify POS («ver inventario en otras ubicaciones»), Lightspeed y Odoo muestran cuánto hay en las otras sedes al tocar un producto agotado, y ofrecen pedirlo o enviarlo.</p><div class="toma"><b>Tomamos:</b> la talla agotada dice dónde sí hay y deja pedirla al almacén, pedir un traslado o apartarla.</div></div>
      <div class="tj"><h4>Guardar el carrito con nombre</h4><p>Square («tickets abiertos»), Loyverse y Shopify («guardar carrito») piden un nombre corto para retomarlo. Nadie tiene «en espera · 1» sin decir de quién es.</p><div class="toma"><b>Tomamos:</b> tickets en espera con nombre («Probador 2») y hora, visibles en el ticket.</div></div>
      <div class="tj"><h4>Apartado y proforma desde el carrito</h4><p>Lightspeed («layaway» y «special order») y Odoo («cotización») convierten el carrito en un apartado o una cotización sin rehacerlo en otra pantalla.</p><div class="toma"><b>Tomamos:</b> «Apartar» y «Proforma» junto a «Dejar en espera».</div></div>
      <div class="tj"><h4>En el celular, el cobro es una barra fija</h4><p>Shopify POS Go, Square para celular y Odoo en pantalla chica: grilla a pantalla completa y abajo una barra «Ver carrito · total» que sube como hoja. Nadie apila el carrito debajo del catálogo.</p><div class="toma"><b>Tomamos:</b> variante A (barra fija). La B (pestañas) es la segunda opción.</div></div>
      <div class="tj"><h4>Accesos configurables, no enlaces sueltos</h4><p>Shopify POS tiene una «grilla inteligente» de atajos en la pantalla de venta; Square, un menú «Más». Los atajos llevan un contador cuando hay algo pendiente.</p><div class="toma"><b>Tomamos:</b> barra de 6 accesos con contador en escritorio y un «Más» en el celular. <b>No tomamos:</b> que cada tienda los reordene (hoy es una sola marca).</div></div>
    </div>
    <h2>Comparación por función</h2>
    <div style="overflow-x:auto"><table class="tabla">
      <tr><th>Función</th><th>Shopify POS</th><th>Square Retail</th><th>Lightspeed Retail</th><th>Odoo PdV</th><th>Loyverse</th><th>CAYLA propuesta</th></tr>
      ${f('Cliente en el carrito',si('arriba del carrito'),si(),si(),si('botón Cliente'),si(),si('fila Clienta, opcional'))}
      ${f('Stock en otras sedes',si('en la ficha'),pa('por tienda'),si(),si('por almacén'),no(),si('en la talla agotada'))}
      ${f('Pedir lo que no hay',si('enviar al cliente'),no(),si('pedido especial'),pa('vía Inventario'),no(),si('pedir al almacén / traslado'))}
      ${f('Registrar «no había»',no(),no(),pa('pedido especial'),no(),no(),si('pedidos no atendidos'))}
      ${f('Apartado desde el carrito',pa('con apps'),no(),si('layaway'),pa('abono'),no(),si('Apartar'))}
      ${f('Cotización desde el carrito',pa('borrador'),pa('factura'),si('presupuesto'),si(),no(),si('Proforma'))}
      ${f('Carritos en espera con nombre',si(),si('tickets abiertos'),si(),si('órdenes'),si(),si('con nombre y hora'))}
      ${f('Ventas del día a la vista',pa('en otra pantalla'),si('resumen'),pa(),si('sesión'),si('recibos'),si('píldora «Hoy»'))}
      ${f('Escanear con la cámara',si(),si(),si('app'),si(),si(),si('en el celular'))}
      ${f('Celular: carrito como',si('barra + hoja'),si('barra + hoja'),pa('pantalla aparte'),si('botón Revisar'),si('barra'),si('barra + hoja (A)'))}
    </table></div>
    <div class="nota-doc">Lo que <b>ninguno</b> hace y CAYLA sí necesita: la prenda «en el almacén» como estado propio (ni vendible aquí ni agotada), y anotar lo que se pidió y no había para que Compras decida qué reponer. Esas dos piezas ya existen en la base: solo falta sacarlas al mostrador.</div>
  </div>`;
