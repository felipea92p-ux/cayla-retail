<!doctype html>
<html lang="es">
<head>

<title>Apartados v2 · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=EB+Garamond:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Tokens: copia de apps/web/app/globals.css (ADR-0169). Ningún hex fuera de aquí. */
:root{
  --crema:#f5f0e8;--papel:#fbf8f2;--tinta:#1a1a18;--rojo:#b8412d;--rojo-profundo:#8b2a1f;--sand:#e8e0d0;
  --taupe:#805c4c;--hueso:#eae1d2;--pizarra:#4c5d6e;--verde:#48603f;--ambar:#74501a;
  --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;--serif:"EB Garamond",ui-serif,Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.32,.72,.24,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--crema);color:var(--tinta);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.disp{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
.mono{font-family:var(--mono)}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.t60{color:rgb(26 26 24/.6)}.t50{color:rgb(26 26 24/.5)}.taupe{color:var(--taupe)}.rojo{color:var(--rojo-profundo)}.verde{color:var(--verde)}.ambar{color:var(--ambar)}.piz{color:var(--pizarra)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:13px;height:13px}svg.i.l{width:20px;height:20px}svg.i.xl{width:28px;height:28px}

/* ——— Barra de la DEMO (no es producto) ——— */
.demo{position:sticky;top:0;z-index:60;background:var(--tinta);color:var(--crema);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:12.5px}
.demo b{font-weight:600}
.demo .grupo{display:flex;align-items:center;gap:8px}
.demo .seg{display:inline-flex;border:1px solid rgb(245 240 232/.25);border-radius:999px;padding:2px}
.demo .seg button{padding:5px 12px;border-radius:999px;font-size:12px;color:rgb(245 240 232/.75)}
.demo .seg button[aria-pressed=true]{background:var(--crema);color:var(--tinta)}
.demo .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:rgb(245 240 232/.85)}
.demo .etq{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgb(245 240 232/.55)}

/* ——— Escritorio ——— */
.escritorio{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 50px)}
.lateral{border-right:1px solid var(--sand);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;letter-spacing:.32em;font-weight:600;font-size:14px}
.logo i{width:26px;height:22px;border:1.6px solid var(--rojo);border-radius:0 60% 0 60%;display:inline-block}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:rgb(26 26 24/.8);font-size:14.5px}
.nav.hijo{padding-left:32px}
.nav.activo{background:var(--sand);color:var(--tinta)}
.cabecera{height:64px;border-bottom:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.pildora{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--sand);border-radius:10px;background:var(--papel)}
.contenido{padding:28px 32px 48px}

/* ——— Hoja de Apartados ——— */
.hoja{background:var(--papel);border:1px solid var(--sand);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 170px)}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--sand);padding:0 24px;min-height:64px;flex-wrap:wrap}
.pestanas{display:flex;gap:24px;align-items:center}
.pestana{position:relative;height:64px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:rgb(26 26 24/.55)}
.pestana[aria-current=page]{color:var(--tinta)}
.pestana[aria-current=page]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--tinta)}
.insignia{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:999px;background:var(--rojo);color:var(--papel);font-size:10px;letter-spacing:0;padding:0 4px;margin-left:6px}
.dos{display:grid;grid-template-columns:minmax(0,1fr) 420px;flex:1;min-height:0}
.izq{padding:24px;border-right:1px solid var(--sand);display:flex;flex-direction:column;gap:16px;min-width:0}
.der{display:flex;flex-direction:column;min-width:0}
.der-cab{padding:18px 22px;border-bottom:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between;gap:10px}
.der-cuerpo{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.der-pie{border-top:1px solid var(--sand);padding:18px 22px;display:flex;flex-direction:column;gap:12px;background:var(--papel)}

.buscador{display:flex;align-items:center;gap:10px;height:54px;border:1px solid var(--sand);border-radius:14px;padding:0 16px;background:var(--papel)}
.buscador:focus-within{border-color:var(--taupe)}
.buscador input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.buscador input::placeholder{color:rgb(26 26 24/.45)}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.b-prim{background:var(--tinta);color:var(--crema)}
.b-prim[disabled]{background:rgb(26 26 24/.45);cursor:not-allowed}
.b-sec{border:1px solid var(--sand);background:var(--papel)}
.b-sec:hover{border-color:var(--taupe)}
.b-sutil{color:rgb(26 26 24/.7);height:32px;padding:0 8px}
.b-grande{height:56px;border-radius:12px;justify-content:space-between;padding:0 20px}
.b-chico{height:32px;padding:0 10px;border-radius:9px;font-size:10px}
.icono-b{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--sand);border-radius:12px;background:var(--papel)}

.tarjeta{border:1px solid var(--sand);border-radius:16px;background:var(--papel)}
.nota{background:var(--hueso);border-radius:12px;padding:10px 12px;font-size:12.5px;color:rgb(26 26 24/.75)}
.aviso{border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.aviso.piz{background:rgb(76 93 110/.08);color:var(--pizarra)}
.aviso.ambar{background:rgb(116 80 26/.08);color:var(--ambar)}
.aviso.verde{background:rgb(72 96 63/.08);color:var(--verde)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--hueso);color:rgb(26 26 24/.75);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.chip.sinpunto::before{display:none}
.chip.verde{background:rgb(72 96 63/.1);color:var(--verde)}
.chip.ambar{background:rgb(116 80 26/.1);color:var(--ambar)}
.chip.rojo{background:rgb(184 65 45/.1);color:var(--rojo-profundo)}
.chip.piz{background:rgb(76 93 110/.1);color:var(--pizarra)}
.fijo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--pizarra);border:1px dashed var(--pizarra);border-radius:6px;padding:1px 6px;vertical-align:middle;background:var(--papel)}
.m-pie .fijo{align-self:flex-start}
.telefono .aviso.lote{flex-direction:column;align-items:stretch}
.nuevo{display:inline-flex;align-items:center;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--rojo-profundo);border:1px solid rgb(184 65 45/.35);border-radius:6px;padding:1px 6px;vertical-align:middle}

.foto{flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--serif);color:rgb(26 26 24/.55);position:relative;overflow:hidden}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgb(255 255 255/.35),transparent 55%)}
.lista{border:1px solid var(--sand);border-radius:16px;overflow:hidden;background:var(--papel)}
.lista > * + *{border-top:1px solid var(--sand)}
.fila{display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;width:100%}
button.fila:hover{background:rgb(245 240 232/.7)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo > span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:rgb(26 26 24/.65)}
.caja{height:44px;border:1px solid transparent;background:var(--hueso);border-radius:10px;padding:0 12px;outline:0;width:100%}
.caja:focus{border-color:var(--taupe);background:var(--papel)}
.caja.error{border-color:var(--rojo)}
.err{font-size:12px;color:var(--rojo-profundo)}
.medios{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--hueso);border-radius:14px;padding:4px}
.medio{height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:rgb(26 26 24/.6)}
.medio[aria-pressed=true]{background:var(--papel);color:var(--tinta);box-shadow:0 1px 2px rgb(26 26 24/.08)}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapido{height:32px;padding:0 12px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;background:var(--papel)}
.rapido[aria-pressed=true]{border-color:var(--tinta)}
.barra{height:6px;border-radius:99px;background:var(--sand);overflow:hidden}
.barra i{display:block;height:100%;background:var(--tinta);border-radius:99px;transition:width .4s var(--ease)}
.pasos{display:flex;gap:6px}.pasos i{height:3px;flex:1;border-radius:9px;background:var(--sand)}.pasos i.h{background:var(--tinta)}.pasos i.a{background:var(--rojo)}
.segm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--hueso);border-radius:12px;padding:4px;gap:4px}
.segm button{height:38px;border-radius:9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgb(26 26 24/.6)}
.segm button[aria-pressed=true]{background:var(--papel);color:var(--tinta);box-shadow:0 1px 2px rgb(26 26 24/.08)}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--sand);border-radius:16px;overflow:hidden}
.cifra{padding:16px 20px}
.cifra + .cifra{border-left:1px solid var(--sand)}
.cifra b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin:6px 0 2px}
.filtro{height:36px;padding:0 14px;border:1px solid var(--sand);border-radius:999px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;background:var(--papel)}
.filtro[aria-pressed=true]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.linea-tiempo{position:relative;display:flex;justify-content:space-between;padding-top:6px}
.linea-tiempo::before{content:"";position:absolute;left:6px;right:6px;top:12px;height:1px;background:var(--sand)}
.hito{position:relative;display:flex;flex-direction:column;gap:2px;font-size:12px;z-index:1}
.hito i{width:12px;height:12px;border-radius:99px;border:1.5px solid var(--tinta);background:var(--papel);margin-bottom:6px}
.hito.lleno i{background:var(--tinta)}.hito.venc i{border-color:var(--rojo)}.hito.abono i{border-color:var(--verde);background:var(--verde)}
.hito.der{align-items:flex-end;text-align:right}.hito.cen{align-items:center;text-align:center}
.popover{position:absolute;z-index:30;background:var(--papel);border:1px solid var(--sand);border-radius:14px;box-shadow:0 12px 32px rgb(26 26 24/.14);padding:8px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.check:hover{background:var(--crema)}
.check input{margin-top:3px;accent-color:var(--tinta)}
.interruptor{width:34px;height:20px;border-radius:99px;background:var(--sand);position:relative;flex:none;transition:background .2s var(--ease)}
.interruptor::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:var(--papel);transition:transform .25s var(--ease);box-shadow:0 1px 2px rgb(26 26 24/.2)}
.interruptor[aria-checked=true]{background:var(--tinta)}
.interruptor[aria-checked=true]::after{transform:translateX(14px)}
.estante{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;background:var(--hueso);border-radius:7px;padding:2px 8px}

/* ——— Modales (ADR-0136: velo con desenfoque → hoja que sube 18 px → cascada) ——— */
.velo{position:fixed;inset:0;z-index:80;background:rgb(26 26 24/.32);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;animation:velo .22s var(--ease) both}
.velo.lado{justify-content:flex-end;padding:0;align-items:stretch}
.modal{width:100%;max-width:440px;background:var(--crema);border-radius:22px;box-shadow:0 30px 80px rgb(26 26 24/.25);display:flex;flex-direction:column;max-height:88vh;animation:hoja .42s var(--ease) both}
.modal.ancho{max-width:560px}
.velo.lado .modal{max-width:420px;border-radius:22px 0 0 22px;max-height:none;height:100%;animation:lado .42s var(--ease) both}
.m-cab{padding:22px 24px 8px}
.m-cuerpo{padding:8px 24px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.m-pie{padding:14px 24px 20px;border-top:1px solid var(--sand);display:flex;flex-direction:column;gap:8px;background:var(--crema);border-radius:0 0 22px 22px}
.cascada > *{animation:cae .5s var(--ease) both}
.cascada > *:nth-child(2){animation-delay:55ms}.cascada > *:nth-child(3){animation-delay:110ms}.cascada > *:nth-child(4){animation-delay:165ms}.cascada > *:nth-child(5){animation-delay:220ms}.cascada > *:nth-child(6){animation-delay:275ms}
@keyframes velo{from{opacity:0}}
@keyframes hoja{from{opacity:0;transform:translateY(18px) scale(.965)}}
@keyframes lado{from{opacity:.4;transform:translateX(40px)}}
@keyframes cae{from{opacity:0;transform:translateY(6px)}}
@keyframes vuela{0%{opacity:0;transform:translateY(-10px) scale(.96)}100%{opacity:1;transform:none}}
.entra{animation:vuela .36s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ——— Celular ——— */
.escena{display:flex;justify-content:center;gap:40px;padding:28px 16px 60px;flex-wrap:wrap}
.telefono{width:390px;height:820px;border-radius:48px;border:11px solid var(--tinta);background:var(--crema);position:relative;overflow:hidden;flex:none;box-shadow:0 30px 60px rgb(26 26 24/.18)}
.telefono .pantalla{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column}
.telefono .muesca{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:99px;background:var(--tinta);z-index:70}
.estado-os{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 4px;font-size:12px;font-weight:600}
.cel-cab{position:sticky;top:0;z-index:20;background:var(--crema);border-bottom:1px solid var(--sand);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none}
.cel-pestanas{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--sand);background:var(--papel);position:sticky;top:52px;z-index:19}
.cel-pestanas .pestana{height:44px}
.cel-cuerpo{padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.cel-barra{position:sticky;bottom:0;z-index:25;background:var(--tinta);color:var(--crema);padding:12px 16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.cel-barra .boton{background:var(--crema);color:var(--tinta);height:46px}
.cel-barra .boton[disabled]{opacity:.45}
.cel-tabs{position:sticky;bottom:0;z-index:25;background:var(--papel);border-top:1px solid var(--sand);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px 24px;margin-top:auto}
.cel-tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:6px 0;color:rgb(26 26 24/.5);position:relative}
.cel-tabs button[aria-current=page]{color:var(--tinta)}
.cel-tabs .insignia{position:absolute;top:0;right:30%}
.telefono .velo{position:absolute;padding:0;align-items:flex-end}
.telefono .modal{max-width:none;border-radius:24px 24px 0 0;max-height:92%;animation:sube .42s var(--ease) both}
.telefono .m-pie{border-radius:0;padding-bottom:28px}
.telefono .velo.lado .modal{height:92%;border-radius:24px 24px 0 0}
@keyframes sube{from{transform:translateY(40px);opacity:.3}}
.camara{position:absolute;inset:0;z-index:90;background:#0e0e0d;color:var(--crema);display:flex;flex-direction:column;animation:velo .2s var(--ease) both}
.visor{flex:1;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgb(128 92 76/.45),transparent 60%),linear-gradient(180deg,#2a2622,#141311)}
.marco{width:220px;height:220px;border-radius:26px;position:relative}
.marco::before,.marco::after{content:"";position:absolute;inset:0;border-radius:26px;border:3px solid var(--crema);clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.marco::after{clip-path:none;border:0;background:linear-gradient(180deg,transparent 48%,rgb(184 65 45/.9) 50%,transparent 52%);animation:barre 2.2s ease-in-out infinite}
@keyframes barre{0%,100%{transform:translateY(-38%)}50%{transform:translateY(38%)}}
.bandeja{background:var(--crema);color:var(--tinta);border-radius:22px 22px 0 0;padding:14px 16px 28px;display:flex;flex-direction:column;gap:10px}

/* Leyenda de la escena del celular */
.leyenda{max-width:360px;display:flex;flex-direction:column;gap:14px;padding-top:30px}
.leyenda h2{margin:0;font-size:30px}
.leyenda ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:rgb(26 26 24/.75)}
</style>
</head>

  if (S.clientaModo === 'nueva') {
    return `<div class="col gap10"><div class="aviso piz">${ic('persona')}<div>No está en la base. Con el DNI traemos su nombre del padrón (ADR-0008) y queda registrada al confirmar.</div></div>${camposManuales(false)}</div>`;
  }
  return `
  <div class="col gap8">
    <label class="campo"><span>DNI o celular de la clienta ${nuevo()}</span>
      <div class="buscador" style="height:48px;background:var(--hueso);border-color:transparent">${ic('persona')}<input data-in="clientaQ" inputmode="numeric" value="${esc(S.clientaQ)}" placeholder="8 dígitos de DNI o 9 de celular"></div></label>
    <div class="row gap8 wrap"><button class="rapido" data-a="probarClienta">Probar: 72345678 (ya es clienta)</button><button class="rapido" data-a="clientaNueva">Clienta nueva</button></div>
  </div>`;
}

function camposManuales(conDni) {
  const m = S.manual;
  const errDni = m.dni && !/^\d{8}$/.test(m.dni) ? 'El DNI tiene 8 dígitos.' : '';
  const errCel = m.cel && !/^9\d{8}$/.test(m.cel.replace(/\s/g, '')) ? 'El celular empieza con 9 y tiene 9 dígitos.' : '';
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <label class="campo"><span>Nombres</span><input class="caja" data-in="m.nombres" value="${esc(m.nombres)}"></label>
    <label class="campo"><span>Apellidos</span><input class="caja" data-in="m.apellidos" value="${esc(m.apellidos)}"></label>
    <label class="campo"><span>Celular · WhatsApp</span><input class="caja mono ${errCel ? 'error' : ''}" data-in="m.cel" inputmode="numeric" placeholder="9 dígitos" value="${esc(m.cel)}">${errCel ? `<span class="err">${errCel}</span>` : ''}</label>
    <label class="campo"><span>DNI ${conDni ? '(recomendado)' : ''} ${fijo(5, 'El DNI se valida con 8 dígitos y el celular con 9 (empieza en 9) antes de guardar.')}</span><input class="caja mono ${errDni ? 'error' : ''}" data-in="m.dni" inputmode="numeric" placeholder="8 dígitos" value="${esc(m.dni)}">${errDni ? `<span class="err">${errDni}</span>` : ''}</label>
  </div>`;
}

const MEDIOS = [['efectivo', 'Efectivo'], ['tarjeta', 'Tarjeta'], ['yape', 'Yape'], ['plin', 'Plin'], ['transferencia', 'Transf.']];
const medios = (clave, act) => `<div class="medios">${MEDIOS.map(([m, t]) => `<button class="medio" data-a="${act}" data-m="${m}" aria-pressed="${S[clave] === m}">${ic(m === 'transferencia' ? 'banco' : m)}${t}</button>`).join('')}</div>`;

function bloqueAdelanto() {
  const total = totalTicket();
  const min = +(total * 0.3).toFixed(2);
  const ad = Math.min(S.adelanto, total);
  return `
  <div class="col gap10">
    <p class="row gap6 t60" style="margin:0;font-size:12.5px">${ic('cartera', 's')} Adelanto · cómo paga hoy</p>
    ${medios('medio', 'medio')}
    <div class="row between tarjeta" style="padding:10px 14px"><span class="row gap8">${ic('tarjeta')} ${MEDIOS.find((x) => x[0] === S.medio)[1]}</span><span class="row gap6"><span class="t50">S/</span><input data-in="adelanto" class="num" style="width:80px;text-align:right;border:0;border-bottom:1px solid var(--sand);background:transparent;outline:0;font-size:16px" value="${ad}"></span></div>
    <div class="rapidos">${[[0.3, '30%'], [0.5, 'La mitad'], [1, 'Todo']].map(([k, t]) => `<button class="rapido" data-a="rapido" data-v="${(total * k).toFixed(2)}" aria-pressed="${Math.abs(ad - total * k) < 0.01}">${t} · ${money(total * k)}</button>`).join('')}</div>
    <div class="barra"><i style="width:${(ad / total) * 100}%"></i></div>
    <div class="row between" style="font-size:12.5px"><span class="t60">Deja ${money(ad)}</span><span class="t60">Saldo ${money(total - ad)}</span></div>
    ${ad < min ? `<p class="err" style="margin:0">El adelanto mínimo es el 30 % (${money(min)}).</p>` : ''}
    ${on('abonos') ? `
    <div class="tarjeta" style="padding:12px 14px">
      <div class="row between gap10"><div><p style="margin:0;font-weight:600">Puede abonar en partes ${nuevo()}</p><p class="t60" style="margin:2px 0 0;font-size:12.5px">Paga cuando quiera antes del sáb, 3 oct. Cada abono sale con su boleta de anticipo.</p></div>
      <button class="interruptor" role="switch" aria-checked="${S.planAbonos}" data-a="planAbonos"></button></div>
      ${S.planAbonos ? `<div class="row gap6 wrap" style="margin-top:10px">${[1, 2, 3].map((k) => `<span class="chip sinpunto">Sugerido ${k}: ${money((total - ad) / 3)}</span>`).join('')}</div>` : ''}
    </div>` : ''}
  </div>`;
}

function bloqueDevolucion() {
  return `
  <div class="col gap8">
    <p class="row gap6 t60" style="margin:0;font-size:12.5px">${ic('atras', 's')} Si no recoge, le devolvemos por</p>
    <div class="segm">${['yape', 'plin', 'transferencia'].map((m) => `<button data-a="devol" data-m="${m}" aria-pressed="${S.devol === m}">${m}</button>`).join('')}</div>
    <label class="check" style="padding:6px 0"><input type="checkbox" ${S.acepta ? 'checked' : ''} data-a="acepta"><span>Le leí las condiciones: recoge hasta el <b>sáb, 3 oct</b> con su boleta o DNI; si no, se le devuelve el 100 % por ${S.devol}.</span></label>
  </div>`;
}

function bloqueEstante() {
  if (!on('estante')) return '';
  return `<div class="aviso piz">${ic('estante')}<div class="grow"><b>Va al estante <span class="estante">A-05</span></b> ${nuevo()}<br><span style="font-size:12.5px">Al confirmar, las prendas pasan del piso a «Apartados · A-05». Existencias lo muestra así y la etiqueta sale con ese número.</span></div></div>`;
}

const responsable = () => `<div class="row between tarjeta" style="padding:10px 14px;font-size:13px"><span class="row gap8 t60">${ic('persona', 's')} ¿Quién está atendiendo?</span><span class="row gap6"><b>Rosa Mamani</b>${ic('abajo', 's')}</span></div>`;

/* ============================================================
   Pestaña APARTAR
   ============================================================ */
function vistaApartar() {
  const total = totalTicket();
  const n = prendasTicket();
  const izq = `
    ${buscador()}
    ${S.q ? '' : recienEscaneada()}
    ${S.q ? '' : `<div><p class="label t60" style="margin:6px 0 10px">Escaneadas hace poco</p><div class="row gap8 wrap">${['v2', 'v7', 'v6'].map((id) => { const p = porId(id); return `<button class="tarjeta row gap10" style="padding:8px 12px 8px 8px;max-width:230px" data-a="recien" data-id="${id}">${foto(p, 36)}<span style="text-align:left;min-width:0"><b class="trunc" style="display:block;font-size:13px;font-weight:600">${esc(p.ref)}</b><span class="t60" style="font-size:12px">${p.color} · ${p.talla} · ${p.aqui ? p.aqui + ' disp.' : 'no queda'}</span></span></button>`; }).join('')}</div></div>`}`;

  if (S.paso === 0) {
    return `<div class="dos"><div class="izq">${izq}</div>
    <aside class="der">
      <div class="der-cab"><h2 class="disp row gap8" style="margin:0;font-size:23px">${ic('marca', 'l')} Por apartar</h2><span class="t60" style="font-size:13px">${n} ${n === 1 ? 'prenda' : 'prendas'}</span></div>
      <div class="der-cuerpo" style="padding-top:4px">${lineasTicket()}
        ${n ? `<label class="campo"><span style="text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:400" class="row gap6">Nota del apartado (opcional)</span><input class="caja" placeholder="Viene el sábado, quiere probársela otra vez…"></label>` : ''}</div>
      <div class="der-pie"><div class="row between" style="align-items:flex-end"><p class="t60" style="margin:0;font-size:12.5px">Precio congelado<br>hasta el sáb, 3 oct</p><div style="text-align:right"><p class="label t60" style="margin:0">Total</p><b class="disp num" style="font-size:38px;line-height:1">${money(total)}</b></div></div>
        <button class="boton b-prim b-grande" ${n ? '' : 'disabled'} data-a="siguiente"><span class="row gap8">${ic('marca')} Apartar</span><span class="disp num" style="font-size:19px;letter-spacing:0;text-transform:none">${money(total)}</span></button>
        <p class="t50" style="margin:0;text-align:center;font-size:12px">${n ? 'Sigue: los datos de la clienta y el adelanto.' : 'Agrega una prenda para apartar.'}</p></div>
    </aside></div>`;
  }
  // Paso 1: clienta + adelanto
  const ad = Math.min(S.adelanto, total);
  const listo = ad >= total * 0.3 && S.acepta && (on('clienta') ? S.clientaModo !== 'buscar' : true);
  return `<div class="dos"><div class="izq">${izq}</div>
  <aside class="der">
    <div class="der-cab"><button class="label t60 row gap4" style="font-size:10.5px" data-a="volver">${ic('atras', 's')} Ticket</button><div style="text-align:right"><h2 class="disp row gap8" style="margin:0;font-size:23px;justify-content:flex-end">${ic('marca', 'l')} Apartado</h2><p class="t60" style="margin:0;font-size:12.5px">${n} prendas · recoger hasta el sáb, 3 oct</p></div></div>
    <div class="der-cuerpo cascada">
      <div class="pasos"><i class="h"></i><i class="a"></i><i></i></div>
      <div class="col gap8"><p class="row gap6 t60" style="margin:0;font-size:12.5px">${ic('persona', 's')} La clienta</p>${bloqueClienta()}</div>
      <div class="segm"><button aria-pressed="${S.comprobante === 'boleta'}" data-a="comp" data-m="boleta">Boleta</button><button aria-pressed="${S.comprobante === 'factura'}" data-a="comp" data-m="factura">Factura</button></div>
      ${bloqueAdelanto()}
      ${bloqueEstante()}
      ${bloqueDevolucion()}
    </div>
    <div class="der-pie">
      <div class="row between" style="align-items:flex-end"><div style="font-size:12.5px" class="t60">Total prendas <b class="num" style="color:var(--tinta)">${money(total)}</b><br>Saldo al recoger <b class="num" style="color:var(--tinta)">${money(total - ad)}</b></div><div style="text-align:right"><p class="label t60" style="margin:0">Adelanto hoy</p><b class="disp num" style="font-size:36px;line-height:1">${money(ad)}</b></div></div>
      ${responsable()}
      <button class="boton b-prim b-grande" ${listo ? '' : 'disabled'} data-a="confirmar"><span class="row gap8">${ic('marca')} Confirmar apartado</span><span class="disp num" style="font-size:19px;letter-spacing:0;text-transform:none">${money(ad)}</span></button>
      <p class="t50" style="margin:0;text-align:center;font-size:12px">${listo ? 'Todo listo.' : on('clienta') && S.clientaModo === 'buscar' ? 'Busca a la clienta por DNI o celular.' : 'Revisa el adelanto y las condiciones.'}</p>
    </div>
  </aside></div>`;
}

/* ============================================================
   Pestaña ENTREGAR
   ============================================================ */
function vistaEntregar() {
  const a = APT.find((x) => x.cod === S.elegido);
  const lista = abiertos();
  const izq = !a ? `
    <div class="row gap8"><label class="buscador grow">${ic('buscar', 'l')}<input placeholder="${cel() ? 'Nombre, DNI, celular o boleta' : 'Nombre, DNI, celular o N.° de boleta de la clienta'}"></label>${on('qr') ? `<button class="icono-b" style="height:54px;width:54px" data-a="camara" title="Escanear el QR de su boleta">${ic('camara', 'l')}</button>` : ''}</div>
    ${on('qr') ? `<p class="t60" style="margin:-6px 0 0;font-size:12.5px">La boleta de anticipo lleva el QR del apartado: al escanearlo se abre su saldo (como el recojo con QR de Oechsle). ${nuevo()}</p>` : ''}
    <p class="label t60" style="margin:4px 0 0">Por recoger en Tienda TRU · ${lista.length}</p>
    <div class="lista">${lista.map(filaEntregar).join('')}</div>` : detalleEntregar(a);
  return `<div class="dos"><div class="izq">${izq}</div><aside class="der">${a ? panelSaldo(a) : `<div class="der-cab"><h2 class="disp row gap8" style="margin:0;font-size:23px">${ic('cartera', 'l')} Saldo</h2></div><div class="der-cuerpo" style="justify-content:center;text-align:center"><p class="disp" style="font-size:20px;margin:0">Elige un apartado</p><p class="t60" style="margin:4px 0 0">Sus datos ya están: aquí solo se cobra lo que falta.</p></div>`}</aside></div>`;
}

const iniciales = (n) => n.split(' ').map((w) => w[0]).slice(0, 2).join('');
function chipEstado(a) {
  if (a.estado === 'camino') return `<span class="chip piz">En camino desde ${a.sede}</span>`;
  if (a.estado === 'vencida') return `<span class="chip rojo">Venció ayer</span>`;
  if (a.estado === 'devolver') return `<span class="chip rojo">Devolver adelanto</span>`;
  if (a.estado === 'cerrada') return `<span class="chip sinpunto">Entregado</span>`;
  if (a.estado === 'porvencer') return `<span class="chip ambar">${a.dias === 1 ? 'Vence mañana' : `Vence en ${a.dias} días`}</span>`;
  return `<span class="chip verde">Quedan ${a.dias} días</span>`;
}
function filaEntregar(a) {
  return `<button class="fila" data-a="elegir" data-cod="${a.cod}"><span class="foto" style="width:38px;height:38px;border-radius:99px;background:var(--hueso);font-size:14px">${iniciales(a.clienta)}</span>
    <span class="grow"><span class="row gap8"><b style="font-weight:600">${a.clienta}</b><span class="mono t50" style="font-size:11px">${a.cod}</span></span><span class="t60 trunc" style="display:block;font-size:12.5px">${a.lineas.map((l) => { const p = porId(l.id); return `${p.ref} ${p.color} · ${p.talla}`; }).join(' · ')}</span></span>
    <span style="text-align:right">${chipEstado(a)}<br><span style="font-size:12.5px">saldo <b class="num">${money(saldo(a))}</b></span></span></button>`;
}

function detalleEntregar(a) {
  const abonos = a.pagos.filter((p) => p.tipo === 'Abono');
  return `
  <label class="buscador">${ic('buscar', 'l')}<input placeholder="Nombre, DNI, celular o N.° de boleta de la clienta"></label>
  <article class="tarjeta entra" style="padding:20px">
    <div class="row gap12" style="align-items:flex-start;flex-wrap:wrap">
      <span class="foto" style="width:48px;height:48px;border-radius:99px;background:var(--hueso);font-size:17px">${iniciales(a.clienta)}</span>
      <div class="grow"><h3 class="disp" style="margin:0;font-size:25px">${a.clienta} ${a.club ? '<span class="chip verde" style="vertical-align:middle">Club</span>' : ''}</h3><p class="t60" style="margin:0;font-size:12.5px">${a.cel} · DNI ${a.dni || '—'} · atendió ${a.asesora}</p></div>
      <div style="${cel() ? 'width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px' : 'text-align:right'}">${chipEstado(a)}<p class="mono t50" style="margin:${cel() ? '0' : '4px 0 0'};font-size:11px">${a.cod} · B004-000030</p>
        <button class="b-sutil label" style="font-size:10px;padding:0" data-a="deselegir">Otra clienta</button></div>
    </div>
    <div class="linea-tiempo" style="margin:20px 0 6px">
      <div class="hito"><i></i><b>Apartó</b><span class="t60">${a.pagos[0].f}</span></div>
      ${abonos.map((p) => `<div class="hito cen abono"><i></i><b>Abonó ${money(p.v)}</b><span class="t60">${p.f}</span></div>`).join('')}
      <div class="hito cen lleno"><i></i><b>Hoy</b><span class="t60">${HOY}</span></div>
      <div class="hito der venc"><i></i><b>Vence</b><span class="t60">${a.vence}</span></div>
    </div>
    <div style="border-top:1px solid var(--sand);margin-top:14px">${a.lineas.map((l) => { const p = porId(l.id); return `
      <div class="row gap12" style="padding:12px 0;border-bottom:1px solid var(--sand)">${foto(p, 42)}<div class="grow"><p style="margin:0;font-weight:600">${esc(p.ref)}</p><p class="t60" style="margin:0;font-size:12.5px">${p.color} · ${p.talla} · <span class="mono" style="font-size:11px">${p.cod}</span> · ${l.n} u. ${fijo(3, 'Antes se leía «· 1 u.» porque el SKU venía vacío: ahora sale color, talla y código.')}</p></div>
      ${on('estante') && a.estante ? `<span class="estante">${ic('estante', 's')} ${a.estante}</span>` : ''}<b class="num">${money(p.precio * l.n)}</b></div>`; }).join('')}</div>
    ${on('editar') ? `<div class="row gap8" style="margin-top:12px"><button class="boton b-sec b-chico" data-a="editar">${ic('lapiz', 's')} Editar prendas</button><span class="t60" style="font-size:12.5px">${cel() ? '' : 'Sumar otra, quitar una o cambiar la talla '}${nuevo()}</span></div>` : ''}
    <div class="nota row gap8" style="margin-top:14px">${ic('escudo', 's')}<span>Antes de entregar: la prenda está en ${on('estante') && a.estante ? `el estante <b>${a.estante}</b>` : '«Apartados»'} con la etiqueta ${a.cod}, y el DNI de quien recoge coincide con el de la boleta.</span></div>
  </article>`;
}

function panelSaldo(a) {
  const s = saldo(a);
  return `
  <div class="der-cab"><h2 class="disp row gap8" style="margin:0;font-size:23px">${ic('cartera', 'l')} Saldo</h2><span class="mono t60" style="font-size:12px">${a.cod}</span></div>
  <div class="der-cuerpo cascada">
    <div class="nota" style="padding:14px 16px;background:var(--crema);border:1px solid var(--sand)">
      <div class="row between" style="font-size:13px"><span>Total de las prendas</span><span class="num">${money(a.total)}</span></div>
      ${a.pagos.map((p) => `<div class="row between" style="font-size:13px;margin-top:6px"><span>${p.tipo === 'Abono' ? 'Abonó' : 'Adelantó'} con ${p.m} · ${p.f}</span><span class="num">-${money(p.v)}</span></div>`).join('')}
      <div class="row between" style="border-top:1px solid var(--sand);margin-top:10px;padding-top:10px;font-size:15px;color:var(--tinta)"><span>Falta pagar</span><b class="num">${money(s)}</b></div>
    </div>
    <p class="t60" style="margin:0;font-size:12.5px">Cómo paga el saldo</p>
    ${medios('medioSaldo', 'medioSaldo')}
    <p class="row gap6 t60" style="margin:0;font-size:12.5px">${ic('impr', 's')} Sale la boleta final por el saldo, que descuenta ${a.pagos.length > 1 ? 'los anticipos' : 'el anticipo'}. No se piden datos otra vez.</p>
    ${on('abonos') && a.estado !== 'camino' ? `<div class="tarjeta row between gap10" style="padding:12px 14px"><div><p style="margin:0;font-weight:600">¿Viene solo a abonar? ${nuevo()}</p><p class="t60" style="margin:2px 0 0;font-size:12.5px">Paga una parte, la prenda se queda guardada.</p></div><button class="boton b-sec b-chico" data-a="abonar">${ic('cartera', 's')} Abonar</button></div>` : ''}
    ${a.estado === 'camino' ? `<div class="aviso piz">${ic('camion')}<div>La prenda viene de Tienda ${a.sede}. Se entrega cuando llegue: Traslados avisa aquí.</div></div>` : ''}
  </div>
  <div class="der-pie">
    <div class="row between" style="align-items:flex-end"><div class="t60" style="font-size:12.5px">Total <b class="num" style="color:var(--tinta)">${money(a.total)}</b><br>Ya pagó <b class="num" style="color:var(--tinta)">-${money(pagado(a))}</b></div><div style="text-align:right"><p class="label t60" style="margin:0">Saldo</p><b class="disp num" style="font-size:36px;line-height:1">${money(s)}</b></div></div>
    ${responsable()}
    <button class="boton b-prim b-grande" ${S.medioSaldo && a.estado !== 'camino' ? '' : 'disabled'} data-a="entregar"><span class="row gap8">${ic('bolsa')} Entregar y cobrar</span><span class="disp num" style="font-size:19px;letter-spacing:0;text-transform:none">${money(s)}</span></button>
    <p class="t50" style="margin:0;text-align:center;font-size:12px">${a.estado === 'camino' ? 'Espera a que llegue la prenda.' : S.medioSaldo ? 'Listo: entrega la prenda y la boleta.' : 'Elige cómo paga el saldo.'}</p>
  </div>`;
}

/* ============================================================
   Pestaña TODOS
   ============================================================ */
function vistaTodos() {
  const ab = abiertos();
  const custodia = ab.reduce((s, a) => s + pagado(a), 0);
  const devolver = APT.filter((a) => a.estado === 'devolver');
  const pronto = APT.filter((a) => ['porvencer', 'vencida'].includes(a.estado));
  const porAvisar = pronto.filter((a) => !S.avisadas.has(a.cod));
  const filtros = { necesitan: 'Necesitan algo', recoger: 'Por recoger', camino: 'En camino', cerrados: 'Cerrados', todos: 'Todos' };
  if (!on('otraSede')) delete filtros.camino;
  const ver = APT.filter((a) => S.filtro === 'todos' ? true : S.filtro === 'necesitan' ? ['porvencer', 'vencida', 'devolver'].includes(a.estado) : S.filtro === 'recoger' ? ['vigente', 'porvencer', 'vencida'].includes(a.estado) : S.filtro === 'camino' ? a.estado === 'camino' : a.estado === 'cerrada');
  const c = S.cols;
  return `
  <div class="col gap16" style="padding:${cel() ? '0' : '24px'}">
    <div class="cifras" style="${cel() ? 'grid-template-columns:1fr 1fr' : ''}">
      <div class="cifra"><span class="label t60">Por recoger</span><b>${ab.length}</b><span class="t60" style="font-size:12.5px">${ab.reduce((s, a) => s + a.lineas.reduce((t, l) => t + l.n, 0), 0)} prendas guardadas</span></div>

      <div class="cifra" style="${cel() ? 'border-top:1px solid var(--sand)' : ''}"><span class="label t60">Vencen en 2 días</span><b>${pronto.filter((a) => a.estado === 'porvencer').length}</b><span class="t60" style="font-size:12.5px">Buen momento para escribirles</span></div>
    </div>

    ${on('lote') && porAvisar.length ? `
    <div class="aviso ambar entra lote" style="align-items:center;flex-wrap:wrap">${cel() ? '' : ic('campana', 'l')}<div class="grow"><b>${porAvisar.length} clientas por avisar hoy</b> · ${pronto.length - porAvisar.length} ya avisada${pronto.length - porAvisar.length === 1 ? '' : 's'} ${nuevo()}<br><span style="font-size:12.5px">Vencen pronto o ya vencieron. Se abre WhatsApp con el mensaje listo, una tras otra.</span></div>

      </div>
      ${S.colsAbierto ? `<div class="popover entra" style="top:48px;right:0;width:280px">
        <p class="label t60" style="margin:6px 10px 4px">Qué ver en cada apartado ${nuevo()}</p>

      </div>` : ''}
    </div>

    <div class="lista">${ver.length ? ver.map((a) => filaTodos(a)).join('') : `<div style="text-align:center;padding:36px"><p class="disp" style="font-size:20px;margin:0">Todo al día</p><p class="t60" style="margin:4px 0 0">Ningún apartado en este filtro.</p></div>`}</div>
  </div>`;
}

function filaTodos(a) {
  const c = S.cols;
  const avisada = S.avisadas.has(a.cod);
  const accion = a.estado === 'devolver' ? `<button class="boton b-prim b-chico" data-a="nada">Devolver ${money(pagado(a))}</button>` : a.estado === 'cerrada' ? '' : `<button class="boton b-prim b-chico" data-a="irEntregar" data-cod="${a.cod}" ${a.estado === 'camino' ? 'disabled' : ''}>Entregar</button>`;
  const prendas = a.lineas.map((l) => { const p = porId(l.id); return `${p.ref} ${p.color} · ${p.talla}`; }).join(', ');
  if (cel()) {
    return `<div style="padding:14px 14px 12px">
      <div class="row gap10"><span class="foto" style="width:36px;height:36px;border-radius:99px;background:var(--hueso);font-size:13px">${iniciales(a.clienta)}</span><div class="grow"><b style="font-weight:600">${a.clienta}</b><p class="t60 mono" style="margin:0;font-size:11px">${a.cod}${c.contacto ? ' · ' + a.cel : ''}</p></div>${chipEstado(a)}</div>
      ${c.prendas ? `<p class="t60" style="margin:8px 0 0;font-size:12.5px">${prendas}</p>` : ''}
      <div class="row between" style="margin-top:10px;gap:8px">
        <span style="font-size:12.5px">${c.pagado ? `<b class="num">${money(pagado(a))}</b> <span class="t60">de ${money(a.total)}</span>` : ''} ${c.estante && on('estante') && a.estante ? `<span class="estante">${a.estante}</span>` : ''}</span>
        <span class="row gap6">${a.estado !== 'cerrada' ? `<button class="icono-b" style="width:36px;height:36px;${avisada ? 'color:var(--verde)' : ''}" data-a="avisar" data-cod="${a.cod}">${ic(avisada ? 'check' : 'chat', 's')}</button>` : ''}${accion}</span>
      </div></div>`;
  }
  return `<div class="row gap16" style="padding:14px 18px">
    <span class="foto" style="width:38px;height:38px;border-radius:99px;background:var(--hueso);font-size:14px">${iniciales(a.clienta)}</span>
    <div style="width:190px;min-width:0"><b style="font-weight:600" class="trunc">${a.clienta}</b><p class="t60 mono" style="margin:0;font-size:11px">${c.contacto ? a.cel + ' · ' : ''}${a.cod}</p></div>
    ${c.prendas ? `<div class="grow row gap6" style="min-width:0">${a.lineas.map((l) => foto(porId(l.id), 26)).join('')}<span class="t60 trunc" style="font-size:12.5px">${prendas}</span></div>` : '<div class="grow"></div>'}
    ${c.estante && on('estante') ? `<div style="width:62px">${a.estante ? `<span class="estante">${a.estante}</span>` : ''}</div>` : ''}
    ${c.asesora ? `<div class="t60" style="width:110px;font-size:12.5px">${a.asesora}</div>` : ''}
    ${c.pagado ? `<div style="width:150px;font-size:13px"><b class="num">${money(pagado(a))}</b> <span class="t60">de ${money(a.total)}</span>${on('abonos') && a.pagos.length > 1 ? `<br><span class="verde" style="font-size:11.5px">${a.pagos.length - 1} abono</span>` : !['cerrada', 'devolver'].includes(a.estado) ? `<br><span class="t60" style="font-size:12px">saldo ${money(saldo(a))}</span>` : ''}</div>` : ''}
    ${c.vence ? `<div style="width:150px">${chipEstado(a)}<p class="t60" style="margin:4px 0 0;font-size:11.5px">${a.estado === 'camino' ? 'llega el lun, 28 set' : 'vence ' + a.vence}</p></div>` : ''}
    <div class="row gap6" style="width:170px;justify-content:flex-end">${a.estado !== 'cerrada' ? `<button class="icono-b" style="width:36px;height:36px;${avisada ? 'color:var(--verde);border-color:rgb(72 96 63/.4)' : ''}" title="${avisada ? 'Avisada hoy' : 'Escribirle por WhatsApp'}" data-a="avisar" data-cod="${a.cod}">${ic(avisada ? 'check' : 'chat', 's')}</button>` : ''}${accion}</div>
  </div>`;
}

          <div class="grow"><p class="label t60" style="margin:0">Recoger hasta</p><p style="margin:2px 0 6px">sáb, 3 oct · 7 días</p><div class="row gap4">${[1, 2, 3, 4, 5, 6, 7].map((i) => `<i style="height:4px;flex:1;border-radius:9px;background:${i === 1 ? 'var(--tinta)' : i === 7 ? 'var(--rojo)' : 'var(--sand)'}"></i>`).join('')}</div><p class="t60" style="margin:6px 0 0;font-size:11.5px">${on('lote') ? 'Entra a «por avisar» el jue, 1 oct.' : 'El aviso para escribirle sale el jue, 1 oct.'}</p></div></div>
        <div class="tarjeta" style="padding:14px;font-size:13px"><div class="row between"><span class="mono">Boleta B004–000031 · anticipo</span><span class="t60" style="font-size:12px">Pendiente de enviar</span></div>
          <div class="row between" style="border-top:1px solid var(--sand);margin-top:10px;padding-top:10px"><span>${MEDIOS.find((x) => x[0] === S.medio)[1]}</span><span class="num">${money(ad)}</span></div>
          ${on('qr') ? `<p class="row gap6 piz" style="margin:10px 0 0;font-size:12.5px">${ic('scan', 's')} La boleta lleva el QR del apartado: al volver, se escanea y abre su saldo.</p>` : ''}<p class="t60" style="margin:10px 0 0;font-size:12.5px">Clienta: <b style="color:var(--tinta)">${on('clienta') ? 'Daniela Edrf Ramos · Club' : S.manual.nombres || 'dani'}</b> · si no recoge: ${S.devol} 933 333 332</p></div>
        <div class="tarjeta" style="padding:14px"><p class="label t60" style="margin:0 0 6px">Ahora, con la prenda en la mano</p>
          ${[`Pega la etiqueta «APARTADO · APT-TRU-0008» en la prenda.`, on('estante') ? `Guárdala en el estante <b>A-05</b> de Apartados.` : `Guárdala en «Apartados» del almacén, no en el piso.`, `Envía la boleta por WhatsApp al 933 333 332.`].map((t) => `<label class="check" style="padding:6px 0"><input type="checkbox"><span>${t}</span></label>`).join('')}</div>
      </div>
      <div class="m-pie">${fijo(4, 'Los botones viven en un pie fijo: con la pantalla baja ya no se cortan.')}

        <p class="t50" style="margin:0;text-align:center;font-size:11.5px">Enter imprime · Esc sigue sin imprimir</p></div>

  }
  if (m === 'abonar') {

    return `<div class="velo" data-a="velo"><div class="modal" style="position:relative" data-stop>
      <div class="m-cab">${cerrar}<h3 class="disp" style="margin:0;font-size:24px">Abonar a cuenta</h3><p class="t60" style="margin:2px 0 0;font-size:13px">${a.clienta} · ${a.cod} · la prenda sigue guardada</p></div>
      <div class="m-cuerpo cascada">
        <div class="row between tarjeta" style="padding:14px"><span class="t60">Falta pagar hoy</span><b class="disp num" style="font-size:24px">${money(s)}</b></div>
        ${medios('abonoMedio', 'abonoMedio')}
        <div class="row between tarjeta" style="padding:10px 14px"><span>Abona</span><span class="row gap6"><span class="t50">S/</span><input data-in="abono" class="num" style="width:90px;text-align:right;border:0;border-bottom:1px solid var(--sand);background:transparent;outline:0;font-size:18px" value="${v}"></span></div>

        <div class="tarjeta" style="padding:14px;font-size:13px">

      </div>
      <div class="m-pie">${responsable()}<button class="boton b-prim" data-a="guardarEdicion">${ic('check', 's')} Guardar cambios</button></div>
    </div></div>`;

  if (m === 'lote') {

    </div></div>`;
  }
  if (m === 'opciones') {
    const grupos = [...new Set(FUNCIONES.map((f) => f.g))];
    return `<div class="velo lado" data-a="velo"><div class="modal" style="position:relative" data-stop>

function celApartar() {
  const total = totalTicket(); const n = prendasTicket(); const ad = Math.min(S.adelanto, total);
  const pasos = S.forma === 'pasos';
  if (!pasos) {
    // Apilado: todo en una columna, como hoy, con barra «Ver ticket» (o sin barra si hay pestañas abajo).
    return `<div class="cel-cuerpo">${buscador()}${S.q ? '' : recienEscaneada()}
      <div class="tarjeta" style="padding:4px 14px 14px" id="ticket"><div class="row between" style="padding:12px 0 0"><h3 class="disp row gap8" style="margin:0;font-size:21px">${ic('marca')} Por apartar</h3><span class="t60">${n} prendas</span></div>${lineasTicket(true)}</div>
      <div class="tarjeta" style="padding:14px;display:flex;flex-direction:column;gap:14px"><p class="row gap6 t60" style="margin:0;font-size:12.5px">${ic('persona', 's')} La clienta</p>${bloqueClienta()}${bloqueAdelanto()}${bloqueEstante()}${bloqueDevolucion()}${responsable()}
        <button class="boton b-prim b-grande" data-a="confirmar"><span class="row gap8">${ic('marca')} Confirmar</span><span class="disp num" style="font-size:18px;letter-spacing:0">${money(ad)}</span></button></div>
    </div>${S.forma === 'apilado' && n ? `<div class="cel-barra"><span class="label" style="font-size:11px">${n} prendas · ${money(total)}</span><span class="label row gap4" style="font-size:11px">Ver ticket ${ic('abajo', 's')}</span></div>` : ''}`;
  }
  // Pasos: una pantalla por paso y barra fija con el botón que sigue.
  const p = S.pasoCel;
  const titulos = ['Prendas', 'La clienta', 'Adelanto'];
  const tope = `<div class="col gap8"><div class="row between"><span class="label t60">Paso ${p + 1} de 3 · ${titulos[p]}</span>${p ? `<button class="label t60 row gap4" style="font-size:10.5px" data-a="celAtras">${ic('atras', 's')} Atrás</button>` : ''}</div><div class="pasos">${[0, 1, 2].map((i) => `<i class="${i < p ? 'h' : i === p ? 'a' : ''}"></i>`).join('')}</div></div>`;
  let cuerpo = '';
  let barra = '';
  if (p === 0) {
    cuerpo = `${buscador()}
      ${on('qr') && !S.q ? `<button class="tarjeta row gap12" style="padding:14px;text-align:left" data-a="camara"><span class="icono-b" style="background:var(--tinta);color:var(--crema);border-color:var(--tinta)">${ic('camara', 'l')}</span><span class="grow"><b>Escanear con la cámara</b> ${nuevo()}<br><span class="t60" style="font-size:12.5px">Apunta al QR de la etiqueta, sin pistola.</span></span>${ic('derecha')}</button>` : ''}
      ${S.q ? '' : recienEscaneada()}
      <div><p class="label t60" style="margin:6px 0 0">Por apartar · ${n}</p>${lineasTicket(true)}</div>`;
    barra = `<div class="cel-barra"><div><p class="label" style="margin:0;font-size:10px;color:rgb(245 240 232/.6)">${n} prendas</p><b class="disp num" style="font-size:24px">${money(total)}</b></div><button class="boton" ${n ? '' : 'disabled'} data-a="celSig">Clienta ${ic('flecha', 's')}</button></div>`;
  } else if (p === 1) {
    cuerpo = `${bloqueClienta()}<div class="segm"><button aria-pressed="${S.comprobante === 'boleta'}" data-a="comp" data-m="boleta">Boleta</button><button aria-pressed="${S.comprobante === 'factura'}" data-a="comp" data-m="factura">Factura</button></div>
      <div class="nota">Precio congelado hasta el sáb, 3 oct. La clienta recoge con su boleta o DNI.</div>`;
    const ok = on('clienta') ? S.clientaModo !== 'buscar' : true;
    barra = `<div class="cel-barra"><div><p class="label" style="margin:0;font-size:10px;color:rgb(245 240 232/.6)">${n} prendas</p><b class="disp num" style="font-size:24px">${money(total)}</b></div><button class="boton" ${ok ? '' : 'disabled'} data-a="celSig">Adelanto ${ic('flecha', 's')}</button></div>`;
  } else {
    cuerpo = `${bloqueAdelanto()}${bloqueEstante()}${bloqueDevolucion()}${responsable()}`;
    const listo = ad >= total * 0.3 && S.acepta;
    barra = `<div class="cel-barra"><div><p class="label" style="margin:0;font-size:10px;color:rgb(245 240 232/.6)">Adelanto hoy · saldo ${money(total - ad)}</p><b class="disp num" style="font-size:24px">${money(ad)}</b></div><button class="boton" ${listo ? '' : 'disabled'} data-a="confirmar">${ic('check', 's')} Confirmar</button></div>`;
  }
  return `<div class="cel-cuerpo cascada" style="padding-bottom:10px">${tope}${cuerpo}</div>${barra}`;
}

function telefono() {

    <div class="cel-cab"><span class="row gap10">${ic('menu', 'l')}<span class="label" style="font-size:11px">Apartados · TRU</span></span><span class="row gap12">${on('actividad') ? `<button data-a="actividad">${ic('historia', 'l')}</button>` : ''}<button data-a="opciones">${ic('ajustes', 'l')}</button></span></div>
    ${S.forma !== 'tabs' ? `<nav class="cel-pestanas">${tabs.map(([k, t, , n]) => `<button class="pestana" data-a="tab" data-k="${k}" aria-current="${S.tab === k ? 'page' : 'false'}">${t}${n ? `<span class="insignia">${n}</span>` : ''}</button>`).join('')}</nav>` : ''}
    ${cuerpo}
    ${S.forma === 'tabs' ? `<nav class="cel-tabs">${tabs.map(([k, t, i, n]) => `<button data-a="tab" data-k="${k}" aria-current="${S.tab === k ? 'page' : 'false'}">${ic(i, 'l')}${t}${n ? `<span class="insignia">${n}</span>` : ''}</button>`).join('')}</nav>` : ''}

const FORMAS = {

  apilado: ['Apilado + «Ver ticket»', ['El orden de hoy, en una sola columna.', 'La barra «Ver ticket» (la de Vender) baja al ticket.', 'Es el cambio más chico, pero el formulario del adelanto sigue siendo largo.']],
  tabs: ['Pestañas abajo', ['Apartar / Entregar / Todos quedan a la altura del pulgar.', 'Se siente como una app, pero choca con el cajón lateral ☰ (ADR-0206): hay dos menús.', 'El botón que guarda vuelve a quedar al final del contenido.']],
};

/* ============================================================
   Pintar y eventos
   ============================================================ */
function pintar() {
  const foco = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.in : null;
  const pos = foco ? document.activeElement.selectionStart : null;
  const scroll = document.getElementById('pantalla')?.scrollTop;
  document.getElementById('app').innerHTML = barraDemo() + (cel() ? escenaCelular() : escritorio());
  if (scroll != null && document.getElementById('pantalla')) document.getElementById('pantalla').scrollTop = scroll;
  if (foco) { const el = document.querySelector(`[data-in="${foco}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

function aplicarPreset(k) { S.preset = k; FUNCIONES.forEach((f) => (S.f[f.k] = PRESETS[k].on.includes(f.k))); }
function agregar(id) {
  const p = porId(id);
  if (p.aqui === 0 && !on('otraSede')) { S.recien = id; S.q = ''; return; }
  if (p.aqui === 0) { S.recien = id; S.q = ''; return; }
  const l = S.ticket.find((x) => x.id === id);
  if (l) l.n = Math.min(l.n + 1, p.aqui); else S.ticket.push({ id, n: 1 });
  S.recien = id; S.q = '';
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'velo' && e.target.closest('[data-stop]')) return;
  const d = el.dataset; const a = d.a;
  const acciones = {
    demo: () => { if (d.k === 'preset') aplicarPreset(d.v); else S[d.k] = d.v; if (d.k === 'device') S.modal = null; },
    marcar: () => (S.marcar = el.checked),
    opciones: () => (S.modal = 'opciones'),
    preset: () => aplicarPreset(d.k),
    func: () => { S.f[d.k] = !S.f[d.k]; S.preset = Object.keys(PRESETS).find((k) => FUNCIONES.every((f) => PRESETS[k].on.includes(f.k) === S.f[f.k])) || 'propio'; },
    tab: () => { S.tab = d.k; S.colsAbierto = false; },
    limpiarQ: () => (S.q = ''),
    agregar: () => agregar(d.id),
    recien: () => (S.recien = d.id),
    talla: () => (S.recien = d.id),
    quitar: () => S.ticket.splice(+d.i, 1),
    menos: () => { const l = S.ticket[+d.i]; l.n > 1 ? l.n-- : S.ticket.splice(+d.i, 1); },
    masn: () => { const l = S.ticket[+d.i]; const p = porId(l.id); if (l.traslado || l.n < p.aqui) l.n++; },
    traslado: () => { if (!S.ticket.find((x) => x.id === d.id)) S.ticket.push({ id: d.id, n: 1, traslado: d.sede }); },
    siguiente: () => (S.paso = 1),
    volver: () => (S.paso = 0),
    comp: () => (S.comprobante = d.m),
    medio: () => (S.medio = d.m),
    rapido: () => (S.adelanto = +d.v),
    planAbonos: () => (S.planAbonos = !S.planAbonos),
    devol: () => (S.devol = d.m),
    acepta: () => (S.acepta = el.checked),
    probarClienta: () => { S.clientaQ = '72345678'; S.clientaModo = 'encontrada'; },
    clientaNueva: () => (S.clientaModo = 'nueva'),
    otraClienta: () => { S.clientaModo = 'buscar'; S.clientaQ = ''; },
    confirmar: () => (S.modal = 'registrado'),
    nuevoApartado: () => { S.modal = null; S.ticket = []; S.paso = 0; S.pasoCel = 0; S.clientaModo = 'buscar'; S.clientaQ = ''; S.recien = null; },
    cerrar: () => { S.modal = null; },
    velo: () => { S.modal = null; },
    elegir: () => { S.elegido = d.cod; S.medioSaldo = null; },
    deselegir: () => (S.elegido = null),
    irEntregar: () => { S.elegido = d.cod; S.tab = 'entregar'; S.medioSaldo = null; },
    medioSaldo: () => (S.medioSaldo = d.m),
    abonoMedio: () => (S.abonoMedio = d.m),
    entregar: () => (S.modal = 'entregado'),
    cerrarEntrega: () => { S.modal = null; S.elegido = null; },
    abonar: () => { S.abono = 30; S.modal = 'abonar'; },
    abonoRapido: () => (S.abono = +d.v),
    confirmarAbono: () => { const ap = APT.find((x) => x.cod === S.elegido); ap.pagos.push({ f: HOY, m: MEDIOS.find((x) => x[0] === S.abonoMedio)[1], v: Math.min(S.abono, saldo(ap)), tipo: 'Abono' }); S.modal = null; },
    editar: () => { const ap = APT.find((x) => x.cod === S.elegido); S.edicion = ap.lineas.map((l) => ({ ...l })); S.modal = 'editar'; },
    editTalla: () => { const l = S.edicion[+d.i]; if (l.id !== d.id) { l.id = d.id; l.cambio = true; } },
    editQuitar: () => S.edicion.splice(+d.i, 1),
    editSumar: () => { if (!S.edicion.find((l) => l.id === 'v5')) S.edicion.push({ id: 'v5', n: 1, nueva: true }); },
    guardarEdicion: () => { const ap = APT.find((x) => x.cod === S.elegido); ap.lineas = S.edicion.map(({ id, n }) => ({ id, n })); ap.total = +ap.lineas.reduce((s, l) => s + porId(l.id).precio * l.n, 0).toFixed(2); S.modal = null; },
    filtro: () => (S.filtro = d.k),
    cols: () => (S.colsAbierto = !S.colsAbierto),
    col: () => (S.cols[d.k] = el.checked),
    colsDef: () => (S.cols = { ...COLS_DEF }),
    avisar: () => { S.avisadas.has(d.cod) ? S.avisadas.delete(d.cod) : S.avisadas.add(d.cod); },
    lote: () => { const cola = APT.filter((x) => ['porvencer', 'vencida'].includes(x.estado)); S.lotePos = Math.max(0, cola.findIndex((x) => !S.avisadas.has(x.cod))); S.modal = 'lote'; },
    loteIr: () => (S.lotePos = +d.i),
    loteEnviar: () => { const cola = APT.filter((x) => ['porvencer', 'vencida'].includes(x.estado)); S.avisadas.add(cola[S.lotePos].cod); const sig = cola.findIndex((x) => !S.avisadas.has(x.cod)); if (sig < 0) S.modal = null; else S.lotePos = sig; },
    loteSaltar: () => { const cola = APT.filter((x) => ['porvencer', 'vencida'].includes(x.estado)); S.lotePos = (S.lotePos + 1) % cola.length; },
    actividad: () => (S.modal = 'actividad'),
    camara: () => (S.camara = true),
    cerrarCamara: () => (S.camara = false),
    simular: () => { if (S.tab === 'entregar') { S.elegido = 'APT-TRU-0006'; S.medioSaldo = null; S.camara = false; return; }  const sig = ['v3', 'v5', 'v6', 'v8'].find((id) => !S.ticket.find((l) => l.id === id)); if (sig) agregar(sig); },
    celSig: () => (S.pasoCel = Math.min(2, S.pasoCel + 1)),
    celAtras: () => (S.pasoCel = Math.max(0, S.pasoCel - 1)),
    nada: () => {},
  };
  if (acciones[a]) { acciones[a](); pintar(); }
});

document.addEventListener('input', (e) => {
  const k = e.target.dataset.in;
  if (!k) return;
  const v = e.target.value;
  if (k === 'q') S.q = v;
  else if (k === 'clientaQ') { S.clientaQ = v.replace(/\D/g, ''); if (S.clientaQ.length >= 8) S.clientaModo = S.clientaQ === '72345678' || S.clientaQ.startsWith('9') ? 'encontrada' : 'nueva'; }
  else if (k === 'adelanto') S.adelanto = +v || 0;
  else if (k === 'abono') S.abono = +v || 0;
  else if (k.startsWith('m.')) S.manual[k.slice(2)] = v;
  pintar();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.modal || S.camara)) { S.modal = null; S.camara = false; pintar(); } });

/* Estado inicial por la URL, para capturar o compartir una vista: #device=cel&forma=pasos&tab=todos&preset=completo&paso=1 */
(function desdeUrl() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('device')) S.device = h.get('device');
  if (h.get('forma')) S.forma = h.get('forma');
  if (h.get('tab')) S.tab = h.get('tab');
  if (h.get('preset')) aplicarPreset(h.get('preset'));
  if (h.get('paso')) { S.paso = +h.get('paso'); S.pasoCel = +h.get('paso'); }
  if (h.get('clienta')) S.clientaModo = 'encontrada';
  if (h.get('elegido')) { S.elegido = h.get('elegido'); S.medioSaldo = 'yape'; }
  if (h.get('modal')) S.modal = h.get('modal');
})();
pintar();
</script>
