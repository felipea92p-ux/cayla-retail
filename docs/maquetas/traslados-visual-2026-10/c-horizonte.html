<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traslados · C · Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
/* ====================================================================
   OPCIÓN C · «HORIZONTE» — los traslados sobre una línea de tiempo, como un tablero de trenes.
   Una raya vertical dice AHORA; a la izquierda lo que ya pasó, a la derecha lo que viene.
   Arriba el carril de lo que LLEGA a tu sede, abajo el de lo que SALE. Cada caja es una barra que
   va de cuándo salió a cuándo llega; el camión está hoy en su barra. Lo atrasado se ve como un
   tramo rayado más allá de su hora. Se reconoce CUÁNDO antes de leer una palabra.
   ==================================================================== */
.bandeja{margin-top:22px}
.bandeja-t{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.bandeja-t h2{font-family:var(--serif);font-weight:400;font-size:24px}
.bandeja-t .n{font-family:var(--serif);font-size:24px;color:var(--t50)}
.bandeja .tareas.compactas{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.horizonte{margin-top:22px;overflow:hidden}
.hz-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 18px 12px}
.hz-top h2{font-family:var(--serif);font-weight:400;font-size:22px}
.hz-herr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hz-ley{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--t65)}
.hz-ley i{display:inline-block;width:26px;height:6px;border-radius:6px;vertical-align:middle;margin-right:5px}
.hz-ley .l1{background:var(--t80)}
.hz-ley .l2{border:1.5px dashed var(--t35);height:7px}
.hz-ley .l3{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ambar) 60%,transparent) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--ambar)}
.zoom{display:flex;border:1px solid var(--sand);border-radius:9px;overflow:hidden;background:var(--papel)}
.zoom button{padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--t65)}
.zoom button+button{border-left:1px solid var(--sand)}
.zoom button[aria-pressed=true]{background:var(--tinta);color:var(--crema)}

.hz{overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--sand) transparent;border-top:1px solid var(--sand);scroll-behavior:smooth}
.hz.arrastra{cursor:grabbing;scroll-behavior:auto;user-select:none}
.hz-lienzo{position:relative;--pxh:6.5;width:calc(var(--horas) * var(--pxh) * 1px + 60px);transition:width .5s var(--ease);padding-bottom:6px}
.x{left:calc(var(--a) * var(--pxh) * 1px + 20px)}
.hz-dias{position:relative;height:56px;border-bottom:1px solid var(--sand)}
.hz-dia{position:absolute;top:0;height:56px;width:calc(24 * var(--pxh) * 1px);border-left:1px solid var(--sand);padding:13px 10px 0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t50);white-space:nowrap;transition:left .5s var(--ease),width .5s var(--ease)}
.hz-dia.hoy{color:var(--tinta)}
.hz-dia.hoy b{font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.02em;text-transform:none;margin-right:6px}
.hz-noche{position:absolute;top:56px;bottom:0;width:calc(12 * var(--pxh) * 1px);background:color-mix(in srgb,var(--hueso) 42%,transparent);transition:left .5s var(--ease),width .5s var(--ease);pointer-events:none}
.hz-dias,.carril{z-index:1}

.carril{position:relative;padding:12px 0 10px}
.carril+.carril{border-top:1px solid var(--sand)}
.carril-t{position:sticky;left:14px;display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--papel);border:1px solid var(--c-ln);z-index:6;margin-bottom:6px}
.carril-t .sello{--sz:30px}
.carril-t b{font-weight:600;font-size:13px}
.carril-t span{font-family:var(--serif);font-size:20px;color:var(--c);line-height:1}
.filas{position:relative;height:calc(var(--n) * 64px)}
.vacio-c{position:sticky;left:14px;display:inline-block;color:var(--t50);font-size:12.5px;padding:10px 4px 18px}

.hz-item{position:absolute;top:calc(var(--r) * 64px);transition:left .5s var(--ease);width:0;height:60px}
.hz-et{position:absolute;left:0;top:0;z-index:6;background:color-mix(in srgb,var(--papel) 88%,transparent);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:3px 10px 3px 3px;border-radius:99px;font-size:12.5px;transition:background .25s var(--ease),box-shadow .25s;opacity:0;transform:translateY(5px)}
.hz-et:hover,.hz-item.on .hz-et{background:var(--c-bg);box-shadow:inset 0 0 0 1px var(--c-ln)}
.hz-et .sello{--sz:26px;border-radius:8px}
.hz-et b{font-weight:700}
.hz-et .de{color:var(--t65)}
.hz-et .pila{margin-left:2px}
.hz-et .estado{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tramo{position:absolute;top:36px;height:8px;border-radius:8px;left:calc((var(--sa) - var(--a)) * var(--pxh) * 1px);width:calc((var(--sb) - var(--sa)) * var(--pxh) * 1px);transition:left .5s var(--ease),width .5s var(--ease);transform-origin:left;transform:scaleX(0)}
.tramo.viajo{background:var(--c)}
.tramo.falta{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c-ln);background-image:none;border-radius:8px;height:8px;outline:0}
.tramo.falta{border:1.5px dashed var(--c-ln);box-shadow:none}
.tramo.tarde{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ambar) 55%,transparent) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--ambar)}
.tramo.espera{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 7px);opacity:.75}
.hz-mk{position:absolute;top:40px;left:calc((var(--m) - var(--a)) * var(--pxh) * 1px);width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--papel);color:var(--c);box-shadow:0 0 0 1.5px var(--c-ln),0 6px 12px -8px color-mix(in srgb,var(--sombra) 45%,transparent);display:grid;place-items:center;opacity:0;transition:left .5s var(--ease);z-index:2}
.hz-mk svg{width:15px;height:15px}
.hz-mk.lleno{background:var(--c);color:var(--papel);box-shadow:none}
.hz-mk.tarde{color:var(--ambar);box-shadow:0 0 0 2px var(--ambar)}
.hz-mk.tarde:after{content:"";position:absolute;inset:-2px;border-radius:50%;--c:var(--ambar)}
.go .hz-mk.tarde:after{animation:late 1.1s 1.4s 3 var(--ease)}
.hz-eta{position:absolute;top:48px;left:calc((var(--e) - var(--a)) * var(--pxh) * 1px);transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--t65);white-space:nowrap;opacity:0;transition:left .5s var(--ease)}
.hz-eta:before{content:"";display:block;width:1px;height:6px;background:var(--t35);margin:0 auto 1px}
.hz-eta.tarde{color:var(--ambar)}

.hz-ahora{position:absolute;top:32px;bottom:0;width:0;border-left:2px solid var(--tinta);z-index:5;transform-origin:top;transform:scaleY(0);transition:left .5s var(--ease);pointer-events:none}
.hz-ahora span{position:absolute;top:0;left:-1px;transform:translateX(-50%);background:var(--tinta);color:var(--crema);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap}

/* entrada (una vez): la raya de ahora baja, las barras crecen desde su salida, el camión corre hasta hoy */
.go .hz-ahora{animation:ahora .7s var(--ease) forwards}
.go .hz-et{animation:et .45s var(--ease) forwards;animation-delay:calc(var(--k) * 60ms + 150ms)}
.go .tramo{animation:tramo .85s var(--ease) forwards;animation-delay:calc(var(--k) * 60ms + 250ms)}
.go .tramo.falta,.go .tramo.tarde,.go .tramo.espera{animation-delay:calc(var(--k) * 60ms + 650ms)}
.go .hz-mk{animation:mk 1s var(--ease) forwards;animation-delay:calc(var(--k) * 60ms + 250ms)}
.go .hz-eta{animation:et .4s var(--ease) forwards;animation-delay:calc(var(--k) * 60ms + 800ms)}
.quieto .hz-ahora{transform:none}.quieto .hz-et,.quieto .hz-mk,.quieto .hz-eta{opacity:1;transform:none}.quieto .tramo{transform:none}
@keyframes ahora{to{transform:none}}
@keyframes et{to{opacity:1;transform:none}}
@keyframes tramo{to{transform:scaleX(1)}}
@keyframes mk{from{left:0;opacity:0}20%{opacity:1}to{opacity:1}}
.hz-item.flash .hz-et{animation:flash 1.4s var(--ease)}

@container vista (max-width:760px){
  .bandeja .tareas.compactas{grid-template-columns:1fr}
  .hz-top{padding:14px 14px 10px}
  .hz-ley{display:none}
  .hz-et .pila,.hz-et .de{display:none}
}
</style>
</head>
<body>
<script src="comun.js"></script>
<script>
/* El eje: del viernes 2 a la medianoche del jueves 8 (7 días). Todo se mide en HORAS desde el inicio,
   y los píxeles salen de --pxh en CSS: cambiar el zoom solo cambia esa variable y todo se acomoda. */
const INICIO = M.T(-4, '00:00'), DIAS = 7, HORAS = DIAS * 24;
const h = d => (d - INICIO) / 3600e3;
const ZOOM = { semana:6.5, tres:15 };
const est = { zoom:'semana', scroll:null };

M.montar({ opcion:'C', nombre:'Horizonte', dibujar(raiz){
  const s = M.sede, tareas = M.tareas(s), ahora = h(M.AHORA);
  raiz.innerHTML = M.encabezado({ frase: 'Cuándo sale y cuándo llega cada caja.' }) + `
    <section class="bandeja rev">
      <div class="bandeja-t"><h2>Hoy te toca</h2><span class="n num">${tareas.length || ''}</span></div>
      ${tareas.length ? `<div class="tareas compactas">${tareas.map((x, i) => M.tareaHTML(x, i)).join('')}</div>` : `<div class="tareas-vacio s-cerrado"><span class="sello" data-go>${M.glifo('cerrado')}</span><b style="font-family:var(--serif);font-weight:400;font-size:19px">Nada pendiente en ${M.SEDES[s].corto}</b></div>`}
    </section>
    <section class="tarjeta horizonte rev">
      <div class="hz-top"><h2>El horizonte</h2>
        <div class="hz-herr">
          <span class="hz-ley"><span><i class="l1"></i>viajó</span><span><i class="l2"></i>falta</span><span><i class="l3"></i>atraso</span></span>
          <div class="zoom" role="group" aria-label="Cuánto tiempo ver"><button data-z="semana" aria-pressed="${est.zoom === 'semana'}">Semana</button><button data-z="tres" aria-pressed="${est.zoom === 'tres'}">3 días</button></div>
          <button class="btn" id="ir-ahora">${M.ic('reloj')}Ir a ahora</button>
        </div></div>
      <div class="hz" id="hz"><div class="hz-lienzo" id="lienzo" data-go style="--horas:${HORAS};--pxh:${ZOOM[est.zoom]}"></div></div>
    </section>`;

  const lienzo = M.$('#lienzo', raiz), hz = M.$('#hz', raiz);
  /* días y noches (de 20:00 a 08:00 la tienda está cerrada: una banda hueso) */
  let html = '<div class="hz-dias">';
  for (let d = 0; d < DIAS; d++) {
    const fecha = new Date(INICIO.getTime() + d * 864e5), hoy = M.dia(fecha) === 'hoy';
    html += `<div class="hz-dia x ${hoy ? 'hoy' : ''}" style="--a:${d * 24}">${hoy ? `<b>Hoy</b>${M.diaLargo(fecha)}` : M.dia(fecha) === 'ayer' ? 'ayer · ' + M.diaLargo(fecha) : M.dia(fecha) === 'mañana' ? 'mañana · ' + M.diaLargo(fecha) : M.diaLargo(fecha)}</div>`;
  }
  html += '</div>';
  for (let d = -1; d < DIAS; d++) html += `<div class="hz-noche x" style="--a:${d * 24 + 20}"></div>`;

  /* cada traslado: qué tramos dibuja y dónde va su marca */
  const tramos = t => {
    const sit = M.situacion(t, s), a = h(t.salio), e = h(t.eta);
    const llegada = t.confirmado || t.cerrado || t.inicioConteo || null;
    const T = [];
    let mk = null, mkGlifo = null, mkLleno = false, tarde = false;
    if (sit === 'anulado') { const z = h(t.anulado); T.push(['espera', a, Math.max(z, a + 2)]); mk = Math.max(z, a + 2); mkGlifo = 'anulado'; mkLleno = true; }
    else if (sit === 'cerrado' || sit === 'dif') { const z = h(llegada); T.push(['viajo', a, z]); if (t.cerrado && t.confirmado && sit === 'dif') T.push(['espera', h(t.confirmado), h(t.cerrado)]); mk = h(t.cerrado); mkGlifo = sit; mkLleno = true; }
    else if (sit === 'revisar' || sit === 'contando') { const z = h(llegada); T.push(['viajo', a, z]); T.push(['espera', z, ahora]); mk = ahora; mkGlifo = sit; }
    else { /* en camino */
      if (ahora > e) { T.push(['viajo', a, e]); T.push(['tarde', e, ahora]); tarde = true; mk = ahora; }
      else { T.push(['viajo', a, ahora]); T.push(['falta', ahora, e]); mk = ahora; }
      mkGlifo = sit === 'camino' ? 'sale' : sit;
    }
    const fin = Math.max(...T.map(x => x[2]), mk);
    return { sit, a, e, T, mk, mkGlifo, mkLleno, tarde, fin, abierto: M.abierto(t) };
  };
  /* filas: dos cajas no se pisan (la etiqueta ocupa ~200 px al zoom más chico) */
  const carril = (lista) => {
    const filas = [], out = [];
    lista.sort((x, y) => x.salio - y.salio).forEach(t => {
      const tr = tramos(t), ini = tr.a, fin = Math.max(tr.fin + 9, tr.a + 215 / ZOOM.semana);
      let r = filas.findIndex(f => f < ini - 1);
      if (r < 0) { r = filas.length; filas.push(fin); } else filas[r] = fin;
      out.push({ t, tr, r });
    });
    return { items: out, n: Math.max(1, filas.length) };
  };
  let k = 0;
  const itemHTML = ({ t, tr, r }) => {
    const sitCls = tr.sit === 'llega' && tr.tarde ? 'atraso' : tr.sit;
    const c = M.cifra(t, s);
    return `<div class="hz-item x s-${sitCls}" data-foco="${t.num}" style="--a:${tr.a};--r:${r};--k:${k++}">
      <button class="hz-et" data-num="${t.num}" data-go-hover title="Traslado ${t.num}"><span class="sello" data-go>${M.glifo(tr.sit === 'camino' ? 'sale' : tr.sit)}</span><b>${t.num}</b><span class="de">${t.a === s ? M.SEDES[t.de].del : 'a ' + M.SEDES[t.a].corto}</span>${M.pila(t.lineas, 20, 2)}<span class="estado">${tr.abierto ? c.big + ' ' + c.small : M.nombreSit(t, s)}</span></button>
      ${tr.T.map(([tipo, sa, sb]) => `<span class="tramo ${tipo}" style="--sa:${sa};--sb:${Math.max(sb, sa + .4)}"></span>`).join('')}
      ${tr.abierto && !tr.tarde && (tr.sit === 'llega' || tr.sit === 'sale') ? `<span class="hz-eta" style="--e:${tr.e}">${M.dia(t.eta) === 'hoy' ? '' : M.dia(t.eta) + ' '}${M.hora(t.eta)}</span>` : ''}
      <span class="hz-mk ${tr.mkLleno ? 'lleno' : ''} ${tr.tarde ? 'tarde' : ''}" style="--m:${tr.mk}">${M.glifo(tr.mkGlifo)}</span>
    </div>`;
  };
  const llegan = carril(M.TR.filter(t => t.a === s)), salen = carril(M.TR.filter(t => t.de === s));
  const nL = llegan.items.filter(x => x.tr.abierto).length, nS = salen.items.filter(x => x.tr.abierto).length;
  html += `
    <div class="carril s-llega"><div class="carril-t"><span class="sello" data-go>${M.glifo('llega')}</span><b>Llegan a ${M.SEDES[s].corto}</b><span class="num">${nL}</span></div>
      ${llegan.items.length ? `<div class="filas" style="--n:${llegan.n}">${llegan.items.map(itemHTML).join('')}</div>` : `<div class="vacio-c">Nada viene hacia ti esta semana.</div>`}</div>
    <div class="carril s-sale"><div class="carril-t"><span class="sello" data-go>${M.glifo('sale')}</span><b>Salen de ${M.SEDES[s].corto}</b><span class="num">${nS}</span></div>
      ${salen.items.length ? `<div class="filas" style="--n:${salen.n}">${salen.items.map(itemHTML).join('')}</div>` : `<div class="vacio-c">No enviaste nada esta semana.</div>`}</div>
    <div class="hz-ahora x" style="--a:${ahora}"><span>Ahora · ${M.hora(M.AHORA)}</span></div>`;
  lienzo.innerHTML = html;
  if (M.quieto) lienzo.classList.add('quieto');

  /* dónde se para la vista: «ahora» al 62 % del ancho, como quien mira hacia lo que viene */
  const xAhora = () => ahora * ZOOM[est.zoom] + 20;
  const centrar = suave => { hz.style.scrollBehavior = suave ? 'smooth' : 'auto'; hz.scrollLeft = Math.max(0, xAhora() - hz.clientWidth * 0.62); };
  const quieto = M.quieto;
  requestAnimationFrame(() => { if (quieto && est.scroll != null) { hz.style.scrollBehavior = 'auto'; hz.scrollLeft = est.scroll; } else centrar(false); });
  hz.addEventListener('scroll', () => { est.scroll = hz.scrollLeft; }, { passive:true });
  M.$('#ir-ahora', raiz).onclick = () => centrar(true);
  M.$$('[data-z]', raiz).forEach(b => b.onclick = () => {
    est.zoom = b.dataset.z; M.$$('[data-z]', raiz).forEach(x => x.setAttribute('aria-pressed', x === b));
    /* mantener «ahora» quieto en la pantalla mientras todo se estira */
    const antes = xAhora() - hz.scrollLeft;
    lienzo.style.setProperty('--pxh', ZOOM[est.zoom]);
    const t0 = performance.now();
    const seguir = now => { hz.style.scrollBehavior = 'auto'; const pxh = parseFloat(getComputedStyle(M.$('.hz-ahora', lienzo)).left); hz.scrollLeft = Math.max(0, pxh - antes); if (now - t0 < 560) requestAnimationFrame(seguir); };
    requestAnimationFrame(seguir);
  });
  /* arrastrar para moverse en el tiempo (con mouse; con el dedo ya se desliza solo) */
  let arr = null;
  hz.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.target.closest('button')) return; arr = { x:e.clientX, s:hz.scrollLeft }; hz.classList.add('arrastra'); hz.setPointerCapture(e.pointerId); });
  hz.addEventListener('pointermove', e => { if (arr) hz.scrollLeft = arr.s - (e.clientX - arr.x); });
  const soltar = () => { arr = null; hz.classList.remove('arrastra'); };
  hz.addEventListener('pointerup', soltar); hz.addEventListener('pointercancel', soltar);
  /* pasar por una caja la resalta */
  M.$$('.hz-item', lienzo).forEach(it => { it.addEventListener('pointerenter', () => it.classList.add('on')); it.addEventListener('pointerleave', () => it.classList.remove('on')); });
}});
</script>
</body>
</html>
