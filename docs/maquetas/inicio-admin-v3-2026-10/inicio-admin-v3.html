<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inicio del Admin · v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE v3 · Inicio del Admin · «Observatorio» (2026-10-03)
   Felipe eligió la A de la v2. Cambios pedidos:
   1. Se muestra en CLARO. El oscuro queda listo (mismas piezas, otros
      tokens) para cuando el ERP tenga modo oscuro.
   2. Al elegir TRU, AQP o LIM, el mapa hace zoom y el contorno del Perú
      se transforma en el de su departamento (La Libertad, Arequipa, Lima);
      el mapa se corre a la izquierda y a la derecha se abre la tienda.
   3. En ese panel, recomendaciones interactivas: ritmo comparado, horas
      pico, productos por categoría, equipo y stock.
   Tokens = apps/web/app/globals.css (ADR-0169). Datos inventados que cuadran.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t15:rgba(26,26,24,.15);--t10:rgba(26,26,24,.1);--t06:rgba(26,26,24,.055);
--c80:rgba(245,240,232,.82);--c60:rgba(245,240,232,.62);--c40:rgba(245,240,232,.42);--c20:rgba(245,240,232,.2);--c10:rgba(245,240,232,.1);
--ease:cubic-bezier(.32,.72,.24,1);--salida:cubic-bezier(.4,0,1,1);--spk:46px;--alto:800px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d8cfbf}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.l{width:22px;height:22px}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:sticky;top:0;z-index:300;background:var(--tinta);color:var(--crema);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}.seg button{height:30px;padding:0 11px;font-size:12.5px;color:rgba(245,240,232,.72)}.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.78);font-size:12.5px;cursor:pointer}
.spk .acc{height:30px;padding:0 11px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);color:var(--crema);font-size:12.5px}
.spk .acc:hover{background:rgba(245,240,232,.08)}
.spk .acc.lleno{border-style:solid;background:rgba(245,240,232,.1)}

/* ---------- escena y dispositivos ---------- */
.escena{display:flex;justify-content:center;align-items:flex-start}
.escena.dev{padding:24px 16px 40px}
.disp{position:relative;flex:none}
.disp.escritorio{width:100%;height:calc(100dvh - var(--spk))}
.disp.tablet{width:834px;max-width:100%;height:max(640px,min(1080px,calc(100dvh - var(--spk) - 48px)));border-radius:30px;background:#1b1a18;padding:12px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}
.disp.celular{width:391px;height:max(640px,min(812px,calc(100dvh - var(--spk) - 48px)));border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}

/* ---------- tema: CLARO hoy; OSCURO listo para cuando el ERP tenga modo oscuro ---------- */
.marco{--fondo:var(--crema);--sup:var(--papel);--sup2:var(--hueso);--borde:var(--sand);--linea:var(--t10);--tx:var(--tinta);--tx2:var(--t65);--tx3:var(--t50);
  --urg:var(--rojo);--ok:var(--verde);--warn:var(--ambar);--info:var(--pizarra);--foco:var(--tinta);--resto:color-mix(in oklab,var(--taupe) 45%,transparent);--fantasma:color-mix(in oklab,var(--sand) 75%,var(--taupe) 25%);--brillo:color-mix(in oklab,var(--taupe) 70%,transparent);--lavado:color-mix(in oklab,var(--tinta) 5.5%,transparent);
  /* el mapa */
  --m-tierra:color-mix(in oklab,var(--hueso) 75%,var(--papel));--m-tierra2:var(--papel);--m-costa:color-mix(in oklab,var(--taupe) 75%,transparent);--m-ret:color-mix(in oklab,var(--tinta) 5%,transparent);--m-ret2:color-mix(in oklab,var(--tinta) 3%,transparent);
  --m-nodo:var(--papel);--m-nodo-b:color-mix(in oklab,var(--tinta) 70%,transparent);--m-halo:var(--taupe);--m-halo-op:.22;--m-arco:color-mix(in oklab,var(--taupe) 40%,transparent);--m-mar:color-mix(in oklab,var(--taupe) 38%,transparent);--m-dep:color-mix(in oklab,var(--taupe) 55%,transparent)}
.marco.oscuro{--fondo:var(--tinta);--sup:color-mix(in oklab,var(--tinta) 93%,var(--crema));--sup2:color-mix(in oklab,var(--tinta) 86%,var(--crema));--borde:rgba(245,240,232,.11);--linea:rgba(245,240,232,.08);--tx:var(--crema);--tx2:var(--c60);--tx3:var(--c40);
  --urg:color-mix(in oklab,var(--rojo) 72%,var(--crema));--ok:color-mix(in oklab,var(--verde) 42%,var(--crema));--warn:color-mix(in oklab,var(--ambar) 38%,var(--crema));--info:color-mix(in oklab,var(--pizarra) 42%,var(--crema));--foco:var(--crema);--resto:rgba(245,240,232,.28);--fantasma:rgba(245,240,232,.1);--brillo:rgba(245,240,232,.55);--lavado:rgba(245,240,232,.06);
  --m-tierra:rgba(245,240,232,.075);--m-tierra2:rgba(245,240,232,.02);--m-costa:rgba(245,240,232,.34);--m-ret:rgba(245,240,232,.045);--m-ret2:rgba(245,240,232,.03);
  --m-nodo:color-mix(in oklab,var(--tinta) 86%,var(--crema));--m-nodo-b:rgba(245,240,232,.55);--m-halo:var(--crema);--m-halo-op:.16;--m-arco:rgba(245,240,232,.16);--m-mar:rgba(245,240,232,.16);--m-dep:rgba(245,240,232,.4)}
.marco{position:relative;width:100%;height:100%;display:flex;background:var(--fondo);color:var(--tx);overflow:hidden;container:app/inline-size;transition:background .6s var(--ease),color .6s}
.tablet .marco{border-radius:20px}.celular .marco{border-radius:39px}

/* ---------- el ERP: lateral y barra ---------- */
.lat{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--linea);padding:14px 0 16px;background:var(--fondo);z-index:5;transition:background .6s}
.lat .logo{height:46px;display:grid;place-items:center;margin-bottom:20px}
.lat .logo svg{height:27px;width:auto}
.lat nav{display:flex;flex-direction:column;gap:6px;flex:1}
.lat nav a{width:48px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--tx3);position:relative;transition:background .25s var(--ease),color .25s}
.lat nav a:hover{background:var(--lavado);color:var(--tx)}
.lat nav a.on{background:var(--sup2);color:var(--tx)}
.lat nav a.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--rojo)}
.yo{width:38px;height:38px;border-radius:50%;background:var(--taupe);color:var(--crema);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.03em}
.col{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--borde) transparent;scroll-behavior:smooth}
.barra{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:12px;padding:0 24px 0 26px;border-bottom:1px solid var(--linea);background:color-mix(in oklab,var(--fondo) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.barra .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3)}
.barra .ico:hover{background:var(--lavado);color:var(--tx)}
.buscar{height:38px;display:flex;align-items:center;gap:10px;padding:0 9px 0 14px;border-radius:999px;background:var(--sup2);color:var(--tx3);font-size:13px}
.buscar kbd{font:600 10px 'DM Sans';border:1px solid var(--borde);border-radius:5px;padding:1px 5px;background:var(--sup);color:var(--tx3)}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:14px}
.barra .act{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.13em;font-weight:600;color:var(--tx3);text-transform:uppercase}
.barra .sede{height:34px;padding:0 12px;border:1px solid var(--borde);border-radius:8px;background:var(--sup);display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}
.barra .m-only{display:none}
.cont{container:cont/inline-size;padding:30px 40px 60px}
.cont>.m{max-width:1880px;margin:0 auto}
@container app (max-width:760px){
  .lat{display:none}
  .barra{padding:0 12px;height:56px;gap:6px}
  .barra .d-only{display:none}
  .barra .m-only{display:flex}
  .cont{padding:20px 16px 48px}
}

/* ---------- avisos y tooltip ---------- */
.toasts{position:absolute;top:72px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:340px;padding:11px 14px;border-radius:12px;background:var(--tinta);color:var(--crema);font-size:13px;box-shadow:0 14px 30px -14px rgba(26,26,24,.55);animation:avisoE .42s var(--ease) both}
.oscuro .toast{background:var(--crema);color:var(--tinta)}
.toast.sale{animation:avisoS .22s var(--salida) both}
@keyframes avisoE{from{opacity:0;transform:translate3d(0,-10px,0) scale(.97)}}
@keyframes avisoS{to{opacity:0;transform:translate3d(0,-6px,0)}}
.tip{position:absolute;z-index:70;pointer-events:none;background:var(--tinta);color:var(--crema);font-size:12px;line-height:1.45;padding:8px 11px;border-radius:9px;box-shadow:0 12px 26px -12px rgba(26,26,24,.6);opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s var(--ease);max-width:260px}
.oscuro .tip{background:var(--crema);color:var(--tinta)}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700;font-size:13.5px}
.tip .fila{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip .fila i{width:12px;height:0;border-top:2px solid currentColor;opacity:.45}
.tip .fila.f i{opacity:1}
.tip .fila.d i{border-top-style:dashed}

/* ---------- piezas comunes ---------- */
.entrando .ent{animation:sube .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@keyframes sube{from{opacity:0;transform:translate3d(0,16px,0)}}
@keyframes aparece{from{opacity:0}}
.revelar{opacity:0;transform:translate3d(0,28px,0) scale(.99)}
.revelar.visto{opacity:1;transform:none;transition:opacity .8s var(--ease) var(--rd,0ms),transform .9s var(--ease) var(--rd,0ms)}
.lbl{text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:10.5px;color:var(--tx3)}
.tj{background:var(--sup);border:1px solid var(--borde);border-radius:20px;padding:20px 22px;position:relative;min-width:0;transition:background .6s,border-color .6s}
.tcab{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:14px}
.tcab .lbl{color:var(--tx2)}
.luz::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(260px circle at var(--mx,-600px) var(--my,-600px),var(--brillo),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.luz:hover::after{opacity:1}
.oscuro .luz::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,-600px) var(--my,-600px),rgba(245,240,232,.055),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.oscuro .luz:hover::before{opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--lavado);color:var(--tx2)}
.chip>i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in oklab,var(--warn) 14%,transparent);color:var(--warn)}
.chip.urg{background:color-mix(in oklab,var(--urg) 12%,transparent);color:var(--urg)}
.chip.info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.punto.no{background:var(--tx3)}
.bucle .punto.late::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:late 2.4s var(--ease) infinite}
@keyframes late{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.8);opacity:0}}
.k{font-variant-numeric:tabular-nums}
.k.cambio{animation:destello 1.6s var(--ease)}
@keyframes destello{0%,35%{color:var(--ok)}}
[data-a]{transition-property:width,height,left,top,r,transform,opacity,stroke-dashoffset,stroke-dasharray,grid-template-columns;transition-duration:.95s;transition-timing-function:var(--ease)}
.rapido [data-a]{transition-duration:110ms!important;transition-timing-function:linear!important;transition-delay:0ms!important}
.fallo{display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--tx2);font-size:13px}
.fallo svg{color:var(--warn)}
.fallo b{color:var(--tx);font-weight:600}
.fallo button{font-size:12.5px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sup2);color:var(--taupe);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;position:relative}
.oscuro .av{color:var(--tx2)}
.avs{display:flex}.avs .av{width:24px;height:24px;font-size:8.5px;border:2px solid var(--sup);margin-left:-7px}.avs .av:first-child{margin-left:0}

/* odómetro */
.odo{display:inline-flex;align-items:flex-start;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;line-height:1.08}
.odo .dg{display:inline-block;height:1.08em;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.odo .tira{display:flex;flex-direction:column}
.odo .tira span{display:block;height:1.08em;line-height:1.08;text-align:center}
.odo .sep{display:inline-block;height:1.08em}
.rapido .odo .tira{transition-duration:110ms!important;transition-delay:0ms!important}

/* controles con indicador que se desliza */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sd{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:4px;border-radius:999px;background:var(--sup2);border:1px solid var(--borde)}
.sd button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:color .35s var(--ease)}
.sd button.on{color:var(--fondo)}
.sd button:not(.on):hover{color:var(--tx)}
.sd.chico button{height:28px;padding:0 11px;font-size:12px}
.sd-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:999px;background:var(--foco);z-index:0}
.sd-ind[data-a]{transition-duration:.55s}
.repetir{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-radius:999px;border:1px solid var(--borde);font-size:12.5px;font-weight:600;color:var(--tx);transition:background .25s,border-color .25s,opacity .25s}
.repetir .ic{width:26px;height:26px;padding:6px;border-radius:50%;background:var(--foco);color:var(--fondo);stroke-width:2}
.repetir:hover{border-color:var(--foco)}
.repetir:disabled{opacity:.4;cursor:not-allowed}
.repetir.va{background:var(--foco);color:var(--fondo)}.repetir.va .ic{background:var(--fondo);color:var(--foco)}
.reloj-rep{font-variant-numeric:tabular-nums}

.anillo{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.anillo circle{fill:none}
.an-f{stroke:var(--linea)}.an-v{stroke:var(--foco);stroke-linecap:round}
.an-v.ok{stroke:var(--ok)}
.anillo [data-a]{transition-duration:1.4s}

.graf{position:relative}
.graf>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.graf path,.graf line{vector-effect:non-scaling-stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.graf .rej{stroke:var(--linea);stroke-width:1}
.graf .meta{stroke:var(--ok);stroke-width:1.3;stroke-dasharray:6 5}
.graf .ln{stroke:var(--resto);stroke-width:1.6}
.graf .ln.f{stroke:var(--foco);stroke-width:2.6}
.graf .ln.ant{stroke:var(--tx3);stroke-width:1.4;stroke-dasharray:2 5}
.graf .ln.cmp{stroke:var(--taupe);stroke-width:1.8;stroke-dasharray:7 4}
.oscuro .graf .ln.cmp{stroke:var(--c60)}
.graf .ar{fill:var(--lavado);stroke:none}
.revela{clip-path:inset(-30% 100% -30% 0);transition:clip-path 1.6s var(--ease) .15s}
.revela.ya{clip-path:inset(-30% -4% -30% 0)}
.rapido .revela{transition:none}

/* ---------- «Por revisar» ---------- */
.det{display:grid;gap:14px}
.det-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.det-cab b{font-family:'EB Garamond',serif;font-size:26px;font-weight:500;line-height:1}
.det-cab .cerrar{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--borde);display:grid;place-items:center;color:var(--tx2)}
.det-cab .cerrar:hover{color:var(--tx);border-color:var(--tx)}
.dv{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 60px;align-items:center;gap:6px 0;font-size:12px;color:var(--tx2)}
.dv .eje{height:22px;border-left:1px solid var(--tx3)}
.dv i{display:block;height:12px;border-radius:3px}
.dv .neg{justify-self:end;background:var(--urg);border-radius:4px 0 0 4px}
.dv .pos{justify-self:start;background:var(--ok);border-radius:0 4px 4px 0}
.dv .v{text-align:right;font-weight:600;color:var(--tx)}
.hb{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;align-items:center;gap:8px 10px;font-size:12px;color:var(--tx2)}
.hb .pista{height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.hb .pista i{display:block;height:100%;border-radius:5px;background:var(--foco)}
.hb b{text-align:right;color:var(--tx);font-weight:600}
.sem7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:6px;height:96px;border-bottom:1px solid var(--linea);padding-bottom:6px}
.sem7 div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--tx3)}
.sem7 .bola{border-radius:50%;background:var(--warn);display:grid;place-items:center;color:var(--fondo);font-size:10.5px;font-weight:700}
.sem7 .hoyd{color:var(--tx);font-weight:700}
.rutas{display:grid;gap:12px}
.ruta{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--tx)}
.ruta .via{position:relative;height:2px;background:var(--linea)}
.ruta .via.camino{background:var(--info)}
.ruta .via em{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--info)}
.bucle .ruta .via em{animation:viaje 3.2s var(--ease) infinite}
@keyframes viaje{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 10px);opacity:0}}
.ruta .via.prep{background:repeating-linear-gradient(90deg,var(--tx3) 0 5px,transparent 5px 10px)}
.ruta small{grid-column:1/-1;font-weight:400;color:var(--tx3);margin-top:-6px}
.det-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.det-pie b{color:var(--tx)}
.ir{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:10px;background:var(--foco);color:var(--fondo);font-size:12.5px;font-weight:700;transition:background .25s}
.ir:hover{background:var(--rojo-p);color:var(--crema)}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.32,.72,.24,1)}
.orbes{display:flex;flex-wrap:wrap;gap:18px 22px;justify-content:center;padding:6px 0 4px}
.orbe{display:flex;flex-direction:column;align-items:center;gap:8px;width:104px;text-align:center}
.orbe .c{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-content:center;justify-items:center;gap:2px;background:var(--sup);border:1px solid var(--borde);transition:transform .45s var(--ease),border-color .3s,background .3s}
.orbe:hover .c{transform:translateY(-4px) scale(1.04);border-color:var(--tx3)}
.orbe .c svg.ring{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);overflow:visible}
.orbe .c svg.ring circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.orbe .c .ic{color:var(--tx2)}
.orbe .c b{font-family:'EB Garamond',serif;font-size:30px;font-weight:500;line-height:1}
.orbe>.t{font-size:11.5px;color:var(--tx2);line-height:1.3}
.bucle .orbe.urg .c{animation:respira 3s var(--ease) infinite}
@keyframes respira{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--urg) 34%,transparent)}70%,100%{box-shadow:0 0 0 14px color-mix(in oklab,var(--urg) 0%,transparent)}}
.orbe.urg .c .ic{color:var(--urg)}
.orbe.ok{width:78px}.orbe.ok .c{width:64px;height:64px;opacity:.75}.orbe.ok .c .ic{color:var(--ok)}
.orbe.abierto .c{border-color:var(--tx)}
.orbe.tenue{opacity:.35}
.a-det{margin-top:12px}

/* =====================================================================
   OBSERVATORIO
   ===================================================================== */
.mA{display:grid;gap:22px}
.a-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap}
.a-sobre{display:flex;align-items:center;gap:10px}
.a-total{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(56px,6cqw,100px);letter-spacing:-.025em;margin-top:6px;display:block}
.a-meter{margin-top:10px;width:min(520px,100%)}
.a-meter .pista{position:relative;height:6px;border-radius:3px;background:var(--linea)}
.a-meter .pista i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--foco)}
.a-meter .pista em{position:absolute;top:-6px;bottom:-6px;width:1.5px;background:var(--ok)}
.a-meter .pie{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.a-meter .pie b{color:var(--tx);font-weight:600}

/* la tarjeta principal: mapa a la izquierda, panel a la derecha. Al elegir una tienda, las columnas se reparten distinto
   (el mapa se corre a la izquierda) y la transición la hace el propio grid. */
.heroe{display:grid;padding:0;overflow:clip;grid-template-columns:minmax(0,1fr)}
.h-mapa{position:relative;min-width:0}
.h-panel{position:relative;padding:24px 26px;border-top:1px solid var(--linea);min-width:0}
@container cont (min-width:1000px){
  .h-panel{border-top:0;border-left:1px solid var(--linea)}
  .a-mapa-in{height:100%;min-height:max(560px,calc(var(--alto) - 310px))}
  .pn-in.global{height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .pn-in.global .raya{margin:18px 0}
  .zoom .a-mapa-in{position:sticky;top:60px;max-height:calc(var(--alto) - 60px)}
}
/* El mapa ocupa todo su lado de la tarjeta, a cualquier tamaño: el encuadre (viewBox) se calcula con la proporción real
   del espacio, así nunca quedan márgenes vacíos. En una columna, alto según el ancho; en dos, el alto de la fila. */
.a-mapa-in{position:relative;width:100%;height:clamp(380px,96cqw,660px);overflow:hidden}
.a-mapa-in>svg{position:absolute;inset:0;width:100%;height:100%}
.a-mapa-in .ret{stroke:var(--m-ret);stroke-width:1;vector-effect:non-scaling-stroke}
.a-mapa-in .ret2{stroke:var(--m-ret2);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transition:opacity 1s var(--ease)}
.zoom .a-mapa-in .ret2{opacity:1}
.a-mapa-in .forma{fill:url(#tierra);stroke:var(--m-costa);stroke-width:1.4;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.entrando .a-mapa-in .forma{stroke-dasharray:3000;animation:trazo 2.6s var(--ease) .2s both}
@keyframes trazo{from{stroke-dashoffset:3000;fill-opacity:0}60%{fill-opacity:0}}
.a-mapa-in .guia{stroke:var(--m-arco);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
.a-mapa-in .glow{fill:var(--m-halo);opacity:var(--m-halo-op);filter:url(#halo)}
.a-mapa-in .nodo{fill:var(--m-nodo);stroke:var(--m-nodo-b);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .5s,stroke .5s}
.a-mapa-in .nodo.f{fill:var(--foco);stroke:var(--foco)}
.a-mapa-in .anr{fill:none;stroke:var(--foco);stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);vector-effect:non-scaling-stroke}
.a-mapa-in .anr.ok{stroke:var(--ok)}
.a-mapa-in .anf{fill:none;stroke:var(--linea);stroke-width:2.6;vector-effect:non-scaling-stroke}
.a-mapa-in .onda{fill:none;stroke:var(--foco);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:onda 1.6s var(--ease) forwards;vector-effect:non-scaling-stroke}
@keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.a-mapa-in .latido{fill:none;stroke:var(--foco);stroke-width:1;transform-box:fill-box;transform-origin:center;opacity:0;vector-effect:non-scaling-stroke}
.bucle .a-mapa-in .latido{animation:latidoMapa 3.4s var(--ease) infinite}
@keyframes latidoMapa{0%{transform:scale(1);opacity:.4}100%{transform:scale(2.4);opacity:0}}
.a-mapa-in .arco{fill:none;stroke:var(--m-arco);stroke-width:1.2;vector-effect:non-scaling-stroke}
.a-mapa-in .arco.prep{stroke-dasharray:3 5}
.a-mapa-in .estela{fill:none;stroke:var(--info);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.16 1.2;stroke-dashoffset:.16;vector-effect:non-scaling-stroke}
.bucle .a-mapa-in .estela{animation:estela 3.4s linear infinite}
@keyframes estela{from{stroke-dashoffset:.16}to{stroke-dashoffset:-.84}}
.a-mapa-in .cometa{fill:var(--info)}
.a-mapa-in .taller{fill:var(--m-nodo);stroke:var(--m-nodo-b);stroke-width:1.3;vector-effect:non-scaling-stroke}
.a-mapa-in .marca{transition:opacity .6s var(--ease)}
.a-mapa-in .marca.oculta{opacity:0;pointer-events:none}
.zoom .a-mapa-in .marca.otra{opacity:.45}
.a-mapa-in .mar{font-family:'EB Garamond',serif;font-style:italic;fill:var(--m-mar);font-size:22px;letter-spacing:.2em;transition:opacity .6s}
.zoom .a-mapa-in .mar{opacity:0}
.entrando .a-mapa-in .nodo-g{animation:nodoE .9s var(--ease) both;animation-delay:calc(1100ms + var(--d) * 160ms);transform-box:fill-box;transform-origin:center}
@keyframes nodoE{from{opacity:0;transform:scale(.3)}}
.a-et{position:absolute;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:3px;padding:8px 12px;border-radius:12px;border:1px solid transparent;transition:background .3s,border-color .3s,opacity .5s}
.a-et:hover{background:var(--sup);border-color:var(--borde)}
.a-et .lbl{white-space:nowrap}
.a-et b{font-family:'EB Garamond',serif;font-size:clamp(20px,1.7cqw,26px);font-weight:500;line-height:1.05}
.a-et .p{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2)}
.a-et .p i{display:block;width:44px;height:3px;border-radius:2px;background:var(--linea);overflow:hidden}
.a-et .p i i{height:100%;background:var(--foco);border-radius:2px}
.entrando .a-et{animation:sube .7s var(--ease) both;animation-delay:calc(1300ms + var(--d) * 160ms)}
.refoco .a-et{animation:aparece .6s var(--ease) both .9s}
.a-et-t{position:absolute;transform:translateY(-50%);font-size:11.5px;color:var(--tx2);white-space:nowrap;pointer-events:none}
.a-et-t b{display:block;font-family:'EB Garamond',serif;font-size:18px;font-weight:500;color:var(--tx)}
.a-tk{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);max-width:calc(100% - 28px)}
.a-tk span{white-space:nowrap}
.a-tk .nuevo{animation:sube .6s var(--ease) both}
/* en zoom: nombre del departamento, ciudad, volver y mini mapa de ubicación */
.dep{position:absolute;left:24px;top:22px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.dep b{font-family:'EB Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(28px,2.6cqw,40px);line-height:1;color:var(--tx)}
.dep span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.refoco .dep{animation:depE 1s var(--ease) both .75s}
@keyframes depE{from{opacity:0;transform:translate3d(-14px,0,0);letter-spacing:.06em}}
.ciudad{position:absolute;transform:translate(16px,-50%);display:flex;flex-direction:column;gap:1px;pointer-events:none;white-space:nowrap}
.ciudad b{font-size:12px;font-weight:700;letter-spacing:.06em}
.ciudad span{font-size:11.5px;color:var(--tx2)}
.refoco .ciudad{animation:aparece .6s var(--ease) both 1.3s}
.volver{position:absolute;right:20px;top:20px;height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:999px;background:color-mix(in oklab,var(--sup) 85%,transparent);border:1px solid var(--borde);font-size:12px;font-weight:600;backdrop-filter:blur(8px);transition:border-color .25s}
.volver:hover{border-color:var(--tx)}
.refoco .volver{animation:aparece .5s var(--ease) both .6s}
.ubic{position:absolute;left:20px;bottom:20px;width:62px;height:66px;border-radius:10px;background:color-mix(in oklab,var(--sup) 80%,transparent);border:1px solid var(--borde);padding:5px;backdrop-filter:blur(6px)}
.ubic svg{width:100%;height:100%}
.ubic .pe{fill:none;stroke:var(--tx3);stroke-width:12}
.ubic .dp{fill:var(--foco);stroke:none}
.refoco .ubic{animation:sube .6s var(--ease) both 1.1s}

/* panel: global (Toda CAYLA) */
.pn-in>*{min-width:0}
.refoco .pn-in>*{animation:panelE .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 380ms)}
@keyframes panelE{from{opacity:0;transform:translate3d(26px,0,0)}}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kp>div{padding:2px 14px 4px 0;min-width:0}
.kp>div+div{border-left:1px solid var(--linea);padding-left:16px}
.kp b{display:block;font-family:'EB Garamond',serif;font-size:clamp(26px,2.2cqw,34px);font-weight:500;line-height:1.1;margin-top:6px}
.kp small{display:block;font-size:12px;color:var(--tx3)}
.spark{height:30px;margin-top:8px}
@container cont (min-width:1500px){.spark{height:46px}.kp b{font-size:40px}.rk-f{padding:13px 10px}.dl{gap:14px}}
.raya{height:1px;background:var(--linea);margin:20px 0}
.rk{display:grid;gap:6px}
.rk-f{display:grid;grid-template-columns:30px 56px minmax(0,1fr) 54px;align-items:center;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:12px;text-align:left;transition:background .3s}
.rk-f:hover{background:var(--lavado)}
.rk-n{font-family:'EB Garamond',serif;font-size:26px;line-height:1;color:var(--tx3)}
.rk-f:first-child .rk-n{color:var(--tx)}
.rk-s{font-size:12px;font-weight:700;letter-spacing:.06em}
.rk-s small{display:block;font-weight:400;letter-spacing:0;color:var(--tx3);font-size:11px}
.rk-b{position:relative;height:8px;border-radius:4px;background:var(--linea)}
.rk-b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--foco)}
.rk-b em{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ok);opacity:.7}
.rk-v{text-align:right;font-weight:700;font-size:13.5px}
.rk-v small{display:block;font-weight:400;color:var(--tx3);font-size:11px}
.rk-ir{color:var(--tx3);transition:transform .3s var(--ease),color .3s}
.rk-f:hover .rk-ir{color:var(--tx);transform:translateX(3px)}
.dl{display:grid;gap:10px}
.dl-f{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 52px;align-items:center;font-size:12px;font-weight:700}
.dl-f .eje{position:relative;height:14px}
.dl-f .eje.izq{border-right:1px solid var(--tx3)}
.dl-f i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.dl-f .izq i{right:0;background:var(--warn);border-radius:4px 0 0 4px}
.dl-f .der i{left:0;background:var(--ok);border-radius:0 4px 4px 0}
.dl-f .v{text-align:right}

/* panel: una tienda */
.t-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.t-cab h2{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(28px,2.4cqw,36px);line-height:1.05}
.t-cab p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin-top:6px}
.t-nav{display:flex;gap:6px;flex:none}
.t-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--borde);display:grid;place-items:center;color:var(--tx2);transition:border-color .25s,color .25s,background .25s}
.t-nav button:hover{border-color:var(--tx);color:var(--tx);background:var(--sup2)}
.t-kpi{display:flex;align-items:center;gap:20px;margin-top:18px;flex-wrap:wrap}
.t-kpi .big{font-family:'EB Garamond',serif;font-size:clamp(40px,3.6cqw,56px);font-weight:500;letter-spacing:-.02em;line-height:1}
.t-an{position:relative;width:72px;height:72px;flex:none}
.t-an b{position:absolute;inset:0;display:grid;place-content:center;font-family:'EB Garamond',serif;font-size:19px;font-weight:500;text-align:center;line-height:1}
.t-an b small{display:block;font-family:'DM Sans';font-size:9.5px;color:var(--tx3);margin-top:2px}
.t-mini{display:flex;gap:18px;flex-wrap:wrap}
.t-mini div{display:flex;flex-direction:column;font-size:11px;color:var(--tx3)}
.t-mini b{font-size:17px;font-weight:700;color:var(--tx)}
.t-tabs{margin:20px 0 16px}
.t-cuerpo{min-height:300px}
.t-cuerpo.de-der{animation:deDer .5s var(--ease) both}.t-cuerpo.de-izq{animation:deIzq .5s var(--ease) both}
.t-cuerpo.de-der>*,.t-cuerpo.de-izq>*{animation:sube .55s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 60ms)}
@keyframes deDer{from{opacity:0;transform:translate3d(30px,0,0)}}
@keyframes deIzq{from{opacity:0;transform:translate3d(-30px,0,0)}}
.ritmo{height:clamp(170px,15cqw,220px);margin:6px 0 28px}
.ritmo .eje{position:absolute;left:0;right:0;top:calc(100% + 9px);font-size:10.5px;color:var(--tx3)}
.ritmo .eje span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ritmo .eje span:first-child{transform:none}.ritmo .eje span:last-child{transform:translateX(-100%)}
.ritmo .yl{position:absolute;left:0;font-size:10.5px;color:var(--ok);font-weight:600;transform:translateY(-120%)}
.ritmo .pt{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--foco);border:2px solid var(--sup)}
.ritmo .pt-l{position:absolute;transform:translate(10px,-50%);font-family:'EB Garamond',serif;font-size:18px;white-space:nowrap}
.ritmo .capa{position:absolute;inset:0;cursor:crosshair}
.ritmo .cruz{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--tx3);opacity:0;transition:opacity .15s;pointer-events:none}
.ritmo .capa:hover~.cruz{opacity:1}
.cmp-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2)}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{width:16px;height:0;border-top:2.5px solid var(--foco)}
.ley i.ant{border-top:2px dotted var(--tx3)}.ley i.cmp{border-top:2px dashed var(--taupe)}
.hm{display:grid;grid-template-columns:22px repeat(11,minmax(0,1fr));gap:3px;align-items:center}
.hm span{font-size:10px;color:var(--tx3);text-align:center}
.hm i{display:block;aspect-ratio:1.9;border-radius:4px;background:color-mix(in oklab,var(--foco) var(--p),transparent);transition:transform .25s var(--ease)}
.hm i:hover{transform:scale(1.18);outline:1.5px solid var(--foco);outline-offset:1px}
.nuevo .hm i{animation:celda .55s var(--ease) both;animation-delay:calc((var(--r) + var(--c)) * 26ms + 200ms)}
@keyframes celda{from{opacity:0;transform:scale(.3)}}
.hm-ley{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--tx3);justify-content:flex-end;margin-top:8px}
.hm-ley b{display:block;width:90px;height:7px;border-radius:4px;background:linear-gradient(90deg,color-mix(in oklab,var(--foco) 6%,transparent),var(--foco))}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--borde);font-size:12px;font-weight:600;color:var(--tx2);transition:background .3s var(--ease),color .3s,border-color .3s}
.pill:hover{color:var(--tx);border-color:var(--tx3)}
.pill.on{background:var(--foco);border-color:var(--foco);color:var(--fondo)}
.cats{display:grid;gap:8px;margin:16px 0 18px}
.cat{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12px;color:var(--tx2);text-align:left;padding:3px 0;border-radius:6px}
.cat .pista{height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.cat .pista i{display:block;height:100%;border-radius:5px;background:var(--resto);transition:background .4s}
.cat.on .pista i,.cats.todas .cat .pista i{background:var(--foco)}
.cat.on{color:var(--tx);font-weight:700}
.cat b{text-align:right;color:var(--tx);font-weight:600}
.prods{display:grid;gap:10px}
.prod{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px}
.prod .sw{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:15px;color:var(--t30)}
.prod b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod small{display:block;font-size:12px;color:var(--tx3)}
.prod .u{text-align:right;font-family:'EB Garamond',serif;font-size:20px;line-height:1}
.prod .u small{display:inline;font-family:'DM Sans';font-size:11px;color:var(--tx3)}
.eq{display:grid;gap:12px}
.eq-f{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px}
.eq-f .n{font-size:13px;font-weight:600}
.eq-f .n small{font-weight:400;color:var(--tx3);font-size:11.5px;margin-left:6px}
.eq-f .pista{grid-column:2;height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin-top:6px}
.eq-f .pista i{display:block;height:100%;border-radius:4px;background:var(--resto)}
.eq-f:first-child .pista i{background:var(--foco)}
.eq-f .v{grid-row:1/3;grid-column:3;text-align:right;font-family:'EB Garamond',serif;font-size:20px;line-height:1}
.eq-f .v small{display:block;font-family:'DM Sans';font-size:11px;color:var(--tx3);margin-top:3px}

function remuestrear(geo,N=160){

  const out=[];let i=0,acc=0;for(let k=0;k<N;k++){const t=k*L/N;while(acc+seg[i]<t){acc+=seg[i];i++}const f=seg[i]?(t-acc)/seg[i]:0;out.push([P2[i][0]+(P2[i+1][0]-P2[i][0])*f,P2[i][1]+(P2[i+1][1]-P2[i][1])*f])}

  const app=$('#app');
  app.addEventListener('pointermove',e=>{
    const l=e.target.closest('.luz');if(l){const r=l.getBoundingClientRect();l.style.setProperty('--mx',e.clientX-r.left+'px');l.style.setProperty('--my',e.clientY-r.top+'px')}
    const d=e.target.closest('[data-tip]');if(d&&!e.target.closest('.capa')){const h=textoTip(d.getAttribute('data-tip'));if(h)mostrarTip(h,e.clientX,e.clientY)}else if(!e.target.closest('.capa'))ocultarTip()});
  app.addEventListener('pointerleave',ocultarTip);
  medir();pintar(true)}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Escape'&&S.foco!=='TODAS')enfocar('TODAS');if(S.foco!=='TODAS'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const i=ORDEN.indexOf(S.foco);enfocar(ORDEN[(i+(e.key==='ArrowRight'?1:2))%3])}});
window.addEventListener('resize',()=>{medir();const antes=S.ancho;anchoHeroe();if(antes!==undefined&&antes!==S.ancho)pintar(false)});
barra();montar();programarVivo();
</script>
