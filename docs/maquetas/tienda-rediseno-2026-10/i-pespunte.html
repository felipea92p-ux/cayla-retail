<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I · Pespunte — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Libre+Franklin:wght@400;500;600&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── I · PESPUNTE ─ inspirada en la manera de las casas del oficio: marfil, tabaco y un celeste, Caslon de toda la vida y una
   Franklin sobria. La firma es el pespunte: cada borde es una costura que se cose sola al aparecer y «corre» bajo el mouse;
   los colores son muestras de tela cortadas con tijera de zigzag; y al separar, tus prendas entran a una caja que se cierra
   y se sella con su número. Nada se cuenta como hecho a mano: la costura es un lenguaje, no una promesa. ── */
#lienzo {
  --marfil: #f5f0e6; --lino: #ebe3d4; --tabaco: #6b4a2f; --tinta: #22190f; --cielo: #8fafc4; --cielo-texto: #3e6580; --linea: #dccfb9; --gris: #6a5b4c;
  --gutter: clamp(16px, 4cqi, 64px);
  background: var(--marfil); color: var(--tinta); overflow-x: clip;
  font: 400 15px/1.65 "Libre Franklin", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 1.5px solid var(--tabaco); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.k-cap { font-weight: 600; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.k-display { margin: 0; font-family: "Libre Caslon Display", Georgia, serif; font-weight: 400; line-height: .92; letter-spacing: -.015em; font-size: clamp(72px, 12cqi, 190px); }
.k-titulo { margin: 0; font-family: "Libre Caslon Display", Georgia, serif; font-weight: 400; line-height: 1.02; font-size: clamp(36px, 4.6cqi, 66px); }
.k-cursiva { font-family: "Libre Caslon Text", Georgia, serif; font-style: italic; }
.k-nombre { font-family: "Libre Caslon Text", Georgia, serif; }
.k-gris { color: var(--gris); }
.k-cielo { color: var(--cielo-texto); }
.k-num { font-variant-numeric: tabular-nums; }

/* La costura: un trazo punteado (la puntada) que se descubre con una máscara que avanza */
.k-cosido { position: relative; }
.k-costura { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.k-costura .puntada { fill: none; stroke: var(--tabaco); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 7 5; }
.k-costura.clara .puntada { stroke: var(--marfil); }
/* El subrayado a lápiz */
.k-trazo { display: inline-block; position: relative; }
.k-trazo svg { position: absolute; left: -2%; right: -2%; bottom: -.12em; width: 104%; height: .32em; overflow: visible; }
.k-trazo path { fill: none; stroke: var(--cielo); stroke-width: 3; stroke-linecap: round; }

.k-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--marfil) 92%, transparent); backdrop-filter: blur(10px); }
.k-cab::after { content: ""; position: absolute; left: var(--gutter); right: var(--gutter); bottom: 0; height: 1px; background: repeating-linear-gradient(90deg, var(--tabaco) 0 7px, transparent 7px 12px); opacity: .6; }
.k-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.k-cab nav:last-child { justify-content: flex-end; }
.k-cab a { text-decoration: none; }
.k-cab nav a { padding: 4px 0; background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) no-repeat 0 100% / 0% 1px; }
.k-cab nav a:hover { background-size: 100% 1px; }
.k-logo { display: flex; align-items: center; gap: 10px; }
.k-logo img { width: 30px; height: auto; }
.k-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.k-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.k-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.k-ir-bolsa b { display: inline-block; font-weight: 600; }

.k-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 30px; border: 0; border-radius: 6px; background: var(--tabaco); color: var(--marfil) !important; font-weight: 500; text-decoration: none; cursor: pointer; }
.k-btn::after { content: ""; position: absolute; inset: 5px; border-radius: 3px; pointer-events: none; border: 1px dashed color-mix(in srgb, var(--marfil) 70%, transparent); }
.k-btn:hover { background: var(--tinta); }
.k-btn--claro { background: transparent; color: var(--tabaco) !important; box-shadow: inset 0 0 0 1px var(--tabaco); }
.k-btn--claro::after { border-color: color-mix(in srgb, var(--tabaco) 55%, transparent); }
.k-btn--claro:hover { background: var(--lino); }
.k-btn[data-hecho="si"] { background: var(--tinta); }
.k-link { text-decoration: none; padding-bottom: 2px; background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) no-repeat 0 100% / 100% 1px; }
.k-link:hover { color: var(--tabaco); }

.k-tela { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--lino); border-radius: 6px; overflow: hidden; text-decoration: none; }
.k-tela img { width: 100%; height: 100%; object-fit: contain; padding: 12%; mix-blend-mode: multiply; }
.k-fig { margin: 0; }
.k-pie-foto { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding-top: 14px; }
.k-pie-foto .k-nombre { font-size: 20px; text-decoration: none; }
.k-pie-foto .k-cap { grid-column: 1 / -1; color: var(--gris); }
.k-dispo { grid-column: 1 / -1; font-size: 13px; color: var(--gris); }

.k-seccion { padding: clamp(72px, 10cqi, 150px) var(--gutter) 0; }
.k-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(30px, 4cqi, 56px); }
.k-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; }

/* Portada: el tablero de muestras */
.k-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(28px, 5cqi, 96px); align-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) 0; }
.k-hero .k-cap { display: block; margin-bottom: 24px; }
.k-hero .k-cursiva { display: block; font-size: clamp(26px, 3cqi, 42px); margin-top: 14px; }
.k-hero p { max-width: 36ch; margin: 28px 0 30px; font-size: 17px; }
.k-tablero { position: relative; aspect-ratio: 1 / .92; border-radius: 10px; background: var(--lino); }
.k-tablero > figure { position: absolute; margin: 0; width: 38%; padding: 10px 10px 12px; border-radius: 6px; background: var(--marfil); box-shadow: 0 18px 30px -22px #22190f80; }
.k-tablero > figure .k-tela { background: var(--lino); }
.k-tablero > figure figcaption { padding: 10px 4px 0; font-size: 13px; }
.k-tablero > :nth-child(1) { left: 6%; top: 8%; rotate: -4deg; }
.k-tablero > :nth-child(2) { left: 34%; top: 22%; rotate: 2.5deg; z-index: 2; }
.k-tablero > :nth-child(3) { right: 5%; top: 6%; rotate: 5deg; }
.k-alfiler { position: absolute; left: calc(50% - 6px); top: -6px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d4e3ee, var(--cielo) 60%, #5d7f97); box-shadow: 0 3px 4px -1px #0005; z-index: 3; }
.k-pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(14px, 2cqi, 28px); }
/* Cada paso es una etiqueta tejida, de esas que van cosidas por dentro de la ropa */
.k-paso { position: relative; padding: 30px 24px 26px; border-radius: 4px; background: var(--lino); }
.k-paso .k-cursiva { display: block; font-size: 46px; line-height: 1; color: var(--tabaco); margin-bottom: 14px; }
.k-paso h3 { margin: 0 0 8px; font-family: "Libre Caslon Text", serif; font-weight: 400; font-size: 20px; }
.k-paso p { margin: 0; color: var(--gris); }
.k-club { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6cqi, 112px); align-items: center; margin: clamp(72px, 10cqi, 150px) var(--gutter) 0; padding: clamp(40px, 6cqi, 88px); border-radius: 10px; background: var(--tabaco); color: var(--marfil); }
.k-club .k-gris { color: #e2d3bf; }
.k-club ul { list-style: none; margin: 26px 0 32px; padding: 0; }
.k-club li { padding: 14px 0; border-top: 1px dashed #f5f0e655; }
.k-club li b { display: block; font-family: "Libre Caslon Text", serif; font-weight: 400; font-size: 19px; }
.k-club .k-btn { background: var(--marfil); color: var(--tabaco) !important; }
.k-club .k-btn::after { border-color: color-mix(in srgb, var(--tabaco) 50%, transparent); }
.k-etiqueta-club { justify-self: center; display: grid; justify-items: center; gap: 8px; width: min(380px, 100%); padding: 34px 28px; border-radius: 4px; background: var(--marfil); color: var(--tinta); text-align: center; }
.k-etiqueta-club .k-titulo { font-size: 34px; }
.k-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2cqi, 28px); }
.k-tienda { padding: clamp(28px, 4cqi, 48px); border-radius: 8px; background: var(--lino); }
.k-tienda h3 { margin: 0 0 14px; font-family: "Libre Caslon Display", serif; font-weight: 400; font-size: clamp(44px, 5.6cqi, 84px); line-height: 1; }
.k-tienda p { margin: 0 0 4px; }
.k-tienda .k-acciones { margin-top: 22px; }
.k-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 104px) var(--gutter) 40px; margin-top: clamp(72px, 10cqi, 150px); background: repeating-linear-gradient(90deg, var(--tabaco) 0 7px, transparent 7px 12px) no-repeat top / calc(100% - 2 * var(--gutter)) 1px; background-position: var(--gutter) 0; }
.k-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.k-pie a { text-decoration: none; }
.k-pie a:hover { color: var(--tabaco); }

/* Catálogo */
.k-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(36px, 5cqi, 72px) var(--gutter) 24px; }
.k-filtros { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 32px; padding: 0 var(--gutter) 10px; }
.k-filtros > div { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.k-filtros button { position: relative; padding: 8px 0 12px; border: 0; background: none; cursor: pointer; color: var(--gris); }
.k-filtros button svg { position: absolute; left: -3px; right: -3px; bottom: 2px; width: calc(100% + 6px); height: 8px; overflow: visible; }
.k-filtros button path { fill: none; stroke: var(--cielo); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 140; stroke-dashoffset: 140; }
.k-filtros button:hover, .k-filtros button[aria-pressed="true"] { color: var(--tinta); }
.k-filtros button[aria-pressed="true"] path { stroke-dashoffset: 0; }
.k-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(40px, 5cqi, 72px) clamp(20px, 3cqi, 44px); padding: clamp(32px, 4cqi, 52px) var(--gutter) 0; }
.k-rejilla [hidden] { display: none; }

/* Prenda */
.k-ficha { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: clamp(28px, 4cqi, 56px) var(--gutter) 0; align-items: start; }
.k-ficha-foto .k-tela { border-radius: 10px; }
.k-panel { position: sticky; top: 104px; display: grid; gap: 24px; padding: clamp(24px, 3cqi, 40px); border-radius: 10px; background: var(--lino); }
.k-panel h1 { margin: 6px 0 0; font-family: "Libre Caslon Display", serif; font-weight: 400; font-size: clamp(40px, 4.6cqi, 64px); line-height: 1; }
.k-panel .k-precio { font-family: "Libre Caslon Text", serif; font-size: 24px; }
.k-campo { display: grid; gap: 10px; }
.k-campo-cab { display: flex; justify-content: space-between; }
.k-opciones { display: flex; flex-wrap: wrap; gap: 10px; }
/* Las muestras de color: cuadros de tela cortados con tijera de zigzag */
.k-muestra { display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; box-shadow: inset 0 0 0 1px transparent; }
.k-muestra i { width: 38px; height: 38px; clip-path: var(--zigzag); }
.k-muestra:hover { box-shadow: inset 0 0 0 1px var(--linea); }
.k-muestra[aria-pressed="true"] { background: var(--marfil); box-shadow: inset 0 0 0 1px var(--tabaco); }
.k-talla { position: relative; min-width: 52px; height: 46px; padding: 0 14px; border: 0; border-radius: 6px; background: var(--marfil); cursor: pointer; font-weight: 500; }
.k-talla::after { content: ""; position: absolute; inset: 4px; border-radius: 3px; border: 1px dashed var(--linea); pointer-events: none; }
.k-talla:hover::after { border-color: var(--tabaco); }
.k-talla[aria-pressed="true"] { background: var(--tabaco); color: var(--marfil); }
.k-talla[aria-pressed="true"]::after { border-color: color-mix(in srgb, var(--marfil) 70%, transparent); }
.k-stock { display: grid; margin: 0; }
.k-stock div { display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px dashed var(--linea); }
.k-stock div:last-child { border-bottom: 1px dashed var(--linea); }
.k-stock dd { margin: 0; font-family: "Libre Caslon Text", serif; }
.k-aviso { min-height: 1.6em; margin: -10px 0 0; font-size: 14px; }
.k-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 44px); }

/* Bolsa y la caja */
.k-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); padding: 0 var(--gutter); align-items: start; }
.k-linea { display: grid; grid-template-columns: 110px 1fr auto; gap: 22px; padding: 20px 0; border-bottom: 1px dashed var(--linea); align-items: start; }
.k-linea:first-child { border-top: 1px dashed var(--linea); }
.k-linea .k-nombre { font-size: 22px; text-decoration: none; }
.k-linea .k-cap { display: block; margin-top: 6px; color: var(--gris); }
.k-linea [data-hay-aqp] { display: block; margin-top: 8px; font-size: 13px; color: var(--gris); }
.k-linea [data-falta="true"] { color: var(--cielo-texto); font-weight: 500; }
.k-quitar { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--gris); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.k-resumen { position: sticky; top: 104px; display: grid; gap: 22px; padding: 30px; border-radius: 10px; background: var(--lino); }
.k-tienda-op { display: grid; gap: 2px; width: 100%; padding: 16px 18px; border: 0; border-radius: 6px; background: var(--marfil); text-align: left; cursor: pointer; box-shadow: inset 0 0 0 1px transparent; }
.k-tienda-op:hover { box-shadow: inset 0 0 0 1px var(--linea); }
.k-tienda-op[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--tabaco); }
.k-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px dashed var(--gris); }
.k-total b { font-family: "Libre Caslon Display", serif; font-weight: 400; font-size: 34px; }
.k-listo { display: grid; gap: 16px; justify-items: center; text-align: center; }
.k-caja { position: relative; width: 210px; height: 150px; margin: 10px 0 6px; perspective: 700px; }
.k-caja-base { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; border-radius: 4px; background: var(--tabaco); }
.k-caja-base::after { content: ""; position: absolute; inset: 7px; border-radius: 2px; border: 1px dashed color-mix(in srgb, var(--marfil) 60%, transparent); }
.k-caja-tapa { position: absolute; left: -8px; right: -8px; top: 22px; height: 34px; border-radius: 4px; background: var(--tinta); transform-origin: 50% 100%; }
.k-sello { position: absolute; left: calc(50% - 38px); top: 66px; z-index: 2; display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; background: var(--marfil); color: var(--tabaco); font-family: "Libre Caslon Display", serif; font-size: 22px; box-shadow: 0 0 0 4px var(--marfil), 0 0 0 5px var(--tabaco); }
.k-sello img { width: 22px; margin-bottom: -4px; }
.k-listo h2 { margin: 0; font-family: "Libre Caslon Display", serif; font-weight: 400; font-size: 34px; line-height: 1.05; }
.k-listo p { margin: 0; }
.k-mensaje { margin: 0; padding: 14px 16px; border-radius: 6px; background: var(--marfil); font-size: 14px; text-align: left; white-space: pre-line; }

/* Entrar */
.k-entrar { display: grid; justify-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) 0; }
.k-form { position: relative; display: grid; gap: 18px; width: min(460px, 100%); padding: clamp(32px, 4cqi, 52px); border-radius: 10px; background: var(--lino); }
.k-form h1 { text-align: center; font-size: clamp(56px, 7cqi, 96px); }
.k-form label { display: grid; gap: 6px; }
.k-form input { height: 52px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--marfil); box-shadow: inset 0 0 0 1px var(--linea); font: inherit; color: inherit; }
.k-form input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--tabaco); }
.k-form .k-btn { width: 100%; }

/* El hilo que cruza arriba al cambiar de pantalla, y el que va de «Agregar» a la bolsa */
.k-hilo-pantalla { position: fixed; left: 0; right: 0; top: 0; z-index: 400; height: 2px; pointer-events: none; background: repeating-linear-gradient(90deg, #6b4a2f 0 8px, transparent 8px 13px); transform-origin: 0 50%; transform: scaleX(0); opacity: 0; }
.k-vuelo { position: fixed; inset: 0; z-index: 300; pointer-events: none; width: 100vw; height: 100vh; }
.k-vuelo path { fill: none; stroke: #6b4a2f; stroke-width: 1.6; stroke-linecap: round; }

@media (prefers-reduced-motion: no-preference) {
  .k-cab nav a { transition: background-size .6s cubic-bezier(.76,0,.24,1); }
  .k-btn { transition: background-color .4s; }
  .k-btn--claro { transition: background-color .4s; }
  .k-tela img { transition: transform 1.3s cubic-bezier(.2,.7,.2,1); }
  .k-fig:hover .k-tela img { transform: scale(1.045) rotate(-.6deg); }
  /* Bajo el mouse, la puntada corre como la de una máquina de coser */
  .k-fig:hover .k-costura .puntada, .k-btn:hover .k-costura .puntada { animation: k-corre .9s linear infinite; }
  @keyframes k-corre { to { stroke-dashoffset: -24; } }
  .k-filtros button path { transition: stroke-dashoffset .8s cubic-bezier(.65,0,.35,1); }
  .k-talla, .k-muestra, .k-tienda-op, .k-form input { transition: background-color .35s, color .35s, box-shadow .35s; }

  .k-letras .letra { display: inline-block; opacity: 0; transform: translateY(.3em); transition: opacity .9s, transform 1.2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.1s + var(--l, 0) * 60ms); }
  .listo .k-letras .letra { opacity: 1; transform: none; }
  .k-entra { opacity: 0; transform: translateY(12px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.6s + var(--s, 0) * 110ms); }
  .listo .k-entra { opacity: 1; transform: none; }
  .k-trazo path { stroke-dasharray: 260; stroke-dashoffset: 260; transition: stroke-dashoffset 1.2s cubic-bezier(.65,0,.35,1) 1.1s; }
  .listo .k-trazo path { stroke-dashoffset: 0; }
  /* Las muestras se colocan en el tablero una por una, como quien las prende con alfiler */
  .k-tablero > figure { opacity: 0; translate: 0 -40px; transition: opacity 1s, translate 1.3s cubic-bezier(.2,.7,.2,1), rotate 1.6s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.5s + var(--c, 0) * 220ms); }
  .k-tablero > :nth-child(1) { rotate: -14deg; } .k-tablero > :nth-child(2) { rotate: 10deg; } .k-tablero > :nth-child(3) { rotate: 16deg; }
  .listo .k-tablero > figure { opacity: 1; translate: 0 0; }
  .listo .k-tablero > :nth-child(1) { rotate: -4deg; } .listo .k-tablero > :nth-child(2) { rotate: 2.5deg; } .listo .k-tablero > :nth-child(3) { rotate: 5deg; }
  .k-alfiler { transform: translateY(-14px) scale(.4); opacity: 0; transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .3s; transition-delay: calc(1.2s + var(--c, 0) * 220ms); }
  .listo .k-alfiler { transform: none; opacity: 1; }
  [data-revela].k-sube { opacity: 0; transform: translateY(24px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 120ms); }
  [data-revela].k-sube.visto { opacity: 1; transform: none; }
  .k-fig[data-revela] { opacity: 0; transform: translateY(30px); transition: opacity 1s, transform 1.2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 110ms); }
  .k-fig.visto { opacity: 1; transform: none; }
  .k-panel > * { opacity: 0; transform: translateY(14px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.3s + var(--f, 0) * 75ms); }
  .listo .k-panel > * { opacity: 1; transform: none; }
  .k-ficha-foto { opacity: 0; transform: rotate(-2deg) translateY(20px); transition: opacity 1.1s, transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .listo .k-ficha-foto { opacity: 1; transform: none; }
  .k-bolsa-cuerpo .k-linea { animation: k-sube-k 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--i, 0) * 110ms); }
  .k-resumen { animation: k-sube-k 1s .3s cubic-bezier(.2,.7,.2,1) both; }
  /* La caja: la base sube, la tapa cae y se cierra, y el sello se estampa con el número */
  .k-listo:not([hidden]) .k-caja-base { animation: k-sube-k .7s cubic-bezier(.2,.7,.2,1) both; }
  .k-listo:not([hidden]) .k-caja-tapa { animation: k-tapa 1s .45s cubic-bezier(.3,.7,.3,1) both; }
  .k-listo:not([hidden]) .k-sello { animation: k-sello .7s 1.25s cubic-bezier(.2,.7,.2,1) both; }
  .k-listo:not([hidden]) > :not(.k-caja) { animation: k-sube-k .8s 1.5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes k-tapa { from { transform: translateY(-90px) rotateX(70deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
  @keyframes k-sello { from { transform: scale(1.8) rotate(-30deg); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-8deg); } }
  .k-form { animation: k-sube-k 1s .15s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes k-sube-k { from { opacity: 0; transform: translateY(24px); } }

  /* De una pantalla a otra: la nueva aparece mientras un hilo se cose de lado a lado arriba */
  ::view-transition-old(root) { animation: .45s ease both k-vt-sale; }
  ::view-transition-new(root) { animation: .8s cubic-bezier(.2,.7,.2,1) .1s both k-vt-entra; }
  @keyframes k-vt-sale { to { opacity: 0; } }
  @keyframes k-vt-entra { from { opacity: 0; transform: translateY(14px); } }
}
@media (prefers-reduced-motion: reduce) { .k-hilo-pantalla { display: none; } .k-listo .k-sello { transform: rotate(-8deg); } }

@container lienzo (max-width: 760px) {
  .k-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .k-cab nav:first-child { display: none; }
  .k-menu { display: block; grid-column: 1; grid-row: 1; }
  .k-logo { grid-column: 2; justify-self: center; }
  .k-cab nav:last-child a:not(.k-ir-bolsa) { display: none; }
  .k-hero, .k-club, .k-ficha, .k-bolsa-cuerpo { grid-template-columns: 1fr; }
  .k-tablero { aspect-ratio: 1 / 1.05; }
  .k-tablero > figure { width: 46%; }
  .k-tablero > :nth-child(2) { left: 28%; top: 38%; }
  .k-pasos { grid-template-columns: 1fr 1fr; }
  .k-club { margin-left: 12px; margin-right: 12px; padding: 32px 22px; }
  .k-tiendas { grid-template-columns: 1fr; }
  .k-pie { grid-template-columns: 1fr 1fr; }
  .k-pie > :first-child { grid-column: 1 / -1; }
  .k-rejilla, .k-vacon { grid-template-columns: 1fr 1fr; gap: 30px 14px; }
  .k-vacon > :nth-child(3) { display: none; }
  .k-pie-foto { grid-template-columns: 1fr; }
  .k-pie-foto .k-nombre { font-size: 17px; }
  .k-dispo { display: none; }
  .k-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--gutter)); }
  .k-filtros button { white-space: nowrap; }
  .k-panel, .k-resumen { position: static; }
  .k-linea { grid-template-columns: 84px 1fr; }
  .k-linea > .k-precio-linea { grid-column: 2; }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA, M = window.MOV;
  // El borde de tijera de zigzag de las muestras: 8 dientes por lado.
  const zigzag = (() => { const n = 8, p = []; for (let i = 0; i <= n; i++) p.push(`${(i / n) * 100}% ${i % 2 ? 6 : 0}%`); for (let i = 0; i <= n; i++) p.push(`${i % 2 ? 94 : 100}% ${(i / n) * 100}%`); for (let i = n; i >= 0; i--) p.push(`${(i / n) * 100}% ${i % 2 ? 94 : 100}%`); for (let i = n; i >= 0; i--) p.push(`${i % 2 ? 6 : 0}% ${(i / n) * 100}%`); return `polygon(${p.join(", ")})`; })();
  const trazo = `<svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 40 3, 80 11, 120 6 S 180 3, 198 7"/></svg>`;
  const lapiz = `<svg viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true"><path d="M2 5 C 22 2, 40 7, 60 4 S 88 3, 98 5"/></svg>`;
  const logo = `<a class="k-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="k-cab k-cap">
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="k-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="k-ir-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="k-pie">
      <div>${logo}<p class="k-gris" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="k-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="k-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="k-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const obra = (p, i, conCuenta) => `
    <figure class="k-fig" data-revela data-id="${p.id}" style="--i:${i}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="k-tela k-cosido" href="#prenda/${p.id}" data-costura="6"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="k-pie-foto">
        <a class="k-nombre" href="#prenda/${p.id}">${p.nombre}</a>
        ${conCuenta ? `<span class="k-num">${C.precio(p.precio)}</span>` : `<a class="k-link" href="#entrar">Ver precio</a>`}
        <span class="k-cap">${C.nombreCat(p.cat)}</span>
        ${conCuenta ? `<span class="k-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;

  const pantallas = {
    portada() {
      const tab = ["tiana", "kalessi", "luna"].map(C.prenda);
      return `${cab()}
      <section class="k-hero">
        <div>
          <span class="k-cap k-gris k-entra">Llegó en los últimos 30 días</span>
          <h1 class="k-display k-letras" data-letras>Lo nuevo</h1>
          <span class="k-cursiva k-entra">en <span class="k-trazo">Arequipa y Trujillo${trazo}</span></span>
          <p class="k-entra" style="--s:1">Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="k-acciones k-entra" style="--s:2"><a class="k-btn" href="#entrar">Crear mi cuenta</a><a class="k-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        <div class="k-tablero k-cosido" data-costura="12">${tab.map((p, c) => `<figure style="--c:${c}"><i class="k-alfiler" aria-hidden="true" style="--c:${c}"></i><a class="k-tela" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a><figcaption class="k-nombre">${p.nombre}</figcaption></figure>`).join("")}</div>
      </section>
      <section class="k-seccion">
        <div class="k-seccion-cab"><h2 class="k-titulo k-sube" data-revela>En las tiendas</h2><a class="k-link k-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="k-rejilla" style="padding:0">${["alba", "strend", "cuello-v"].map((x, i) => obra(C.prenda(x), i, false)).join("")}</div>
      </section>
      <section class="k-seccion">
        <div class="k-seccion-cab"><h2 class="k-titulo k-sube" data-revela>Así se <span class="k-cursiva">separa</span></h2><span class="k-cap k-gris">Sin pagar en la web</span></div>
        <div class="k-pasos">${C.pasos.map(([t, d], i) => `<div class="k-paso k-cosido k-sube" data-revela data-costura="7" style="--i:${i}"><span class="k-cursiva">${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="k-club k-cosido" data-costura="10" data-costura-clara>
        <div class="k-sube" data-revela><span class="k-cap k-gris">Club CAYLA</span><h2 class="k-titulo" style="margin-top:16px">Tu cuenta ya es <span class="k-cursiva">tu membresía</span></h2>
          <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span class="k-gris">${d}</span></li>`).join("")}</ul>
          <a class="k-btn" href="#entrar">Crear mi cuenta</a></div>
        <div class="k-etiqueta-club k-cosido k-sube" data-revela data-costura="7" aria-hidden="true" style="--i:1"><span class="k-cap">CAYLA</span><span class="k-titulo">Tu nombre</span><span class="k-cursiva k-gris">miembro del Club</span></div>
      </section>
      <section class="k-seccion">
        <div class="k-seccion-cab"><h2 class="k-titulo k-sube" data-revela>Nuestras <span class="k-cursiva">tiendas</span></h2><span class="k-cap k-gris">Recoge en la que te quede cerca</span></div>
        <div class="k-tiendas">${C.tiendas.map((t, i) => `<div class="k-tienda k-cosido k-sube" data-revela data-costura="9" style="--i:${i}"><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="k-gris">${t.horario}</p><div class="k-acciones"><a class="k-btn k-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="k-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="k-cat-cab"><h1 class="k-display k-letras" data-letras style="font-size:clamp(60px,9cqi,140px)">Ropa</h1><span class="k-cap k-gris"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="k-filtros k-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}${lapiz}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}${lapiz}</button>`).join("")}</div>
      </div>
      <div class="k-rejilla">${C.prendas.map((p, i) => obra(p, i % 3, true)).join("")}</div>
      <p class="k-seccion k-gris" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      return `${cab()}
      <section class="k-ficha">
        <div class="k-ficha-foto"><div class="k-tela k-cosido" data-costura="10"><img class="k-foto-principal" src="${C.foto(p)}" alt="${p.nombre}"></div></div>
        <div class="k-panel k-cosido" data-costura="8">
          <div><a class="k-cap k-gris" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="k-precio k-num">${C.precio(p.precio)}</div>
          <div class="k-campo"><span class="k-cap">Color</span>
            <div class="k-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="k-muestra" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex};--zigzag:${zigzag}"></i>${n}</button>`).join("")}</div></div>
          <div class="k-campo"><div class="k-campo-cab"><span class="k-cap">Talla</span><a class="k-link k-gris" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="k-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="k-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="k-stock"><span class="k-cap" style="margin-bottom:8px">En tienda</span>${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "k-gris"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="k-btn" data-agregar="${p.id}"><span data-texto>Agregar a la bolsa</span></button>
          <p class="k-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="k-gris" style="margin:-14px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="k-seccion"><div class="k-seccion-cab"><h2 class="k-titulo k-sube" data-revela>Va <span class="k-cursiva">con</span></h2></div><div class="k-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="k-cat-cab"><h1 class="k-display k-letras" data-letras style="font-size:clamp(56px,8.4cqi,130px)">Tu bolsa</h1><span class="k-cap k-gris">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="k-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:22px 0;border-top:1px dashed var(--linea)">Tu bolsa está vacía. <a class="k-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="k-linea" style="--i:${i}">
            <a class="k-tela" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="k-nombre" href="#prenda/${p.id}">${p.nombre}</a><span class="k-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="k-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="k-num k-precio-linea">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="k-resumen k-cosido" data-costura="8">
          <div data-antes-de-separar style="display:grid;gap:22px">
            <div class="k-campo"><span class="k-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="k-tienda-op" data-valor="${t.id}" aria-pressed="false"><b class="k-nombre" style="font-size:20px;font-weight:400">${t.ciudad}</b><span class="k-gris">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="k-total"><span>Total <span class="k-gris">· pagas al recoger</span></span><b class="k-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="k-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="k-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p class="k-gris" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="k-listo" data-confirmacion hidden>
            <div class="k-caja" aria-hidden="true"><div class="k-caja-base"></div><div class="k-caja-tapa"></div><div class="k-sello"><img src="cayla-isotipo.png" alt=""><span data-numero>${C.deEjemplo.numero}</span></div></div>
            <span class="k-cap k-gris">Separación N.º ${C.deEjemplo.numero} · por confirmar</span>
            <h2 tabindex="-1">Te la guardamos en <span class="k-cursiva" data-tienda-elegida></span></h2>
            <p class="k-gris">Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="k-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="k-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      return `${cab()}
      <section class="k-entrar">
        <form class="k-form k-cosido" data-costura="10" novalidate>
          <h1 class="k-display">Entrar</h1>
          <p class="k-gris" style="margin:-6px 0 6px;text-align:center">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p>
          <label><span class="k-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="k-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="k-btn" type="submit">Entrar</button>
          <a class="k-link k-gris" href="#entrar" style="justify-self:center">Olvidé mi contraseña</a>
          <p style="margin:6px 0 0;padding-top:18px;border-top:1px dashed var(--gris);text-align:center">¿Todavía no tienes cuenta?</p>
          <a class="k-btn k-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de I ──
  const ns = "http://www.w3.org/2000/svg";
  let serie = 0;
  // Cada caja marcada con data-costura recibe su pespunte: un rectángulo punteado a esa distancia del borde, que se cose solo
  // al aparecer (una máscara lo descubre de punta a punta) y que corre bajo el mouse.
  function coser(lienzo) {
    const io = !M.calma() && "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      const m = e.target.querySelector(":scope > .k-costura .mascara");
      if (m) m.animate([{ strokeDashoffset: m.style.strokeDashoffset }, { strokeDashoffset: 0 }], { duration: 1600, delay: 250, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
    }), { threshold: 0.25 }) : null;
    lienzo.querySelectorAll("[data-costura]").forEach((el) => {
      if (el.querySelector(":scope > .k-costura")) return;
      const d = Number(el.dataset.costura), r = el.getBoundingClientRect(), w = r.width, h = r.height;
      if (!w || !h) return;
      const radio = Math.min(10, parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0);
      const id = "k-m" + serie++;
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "k-costura" + ("costuraClara" in el.dataset ? " clara" : ""));
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("aria-hidden", "true");
      const caja = `x="${d}" y="${d}" width="${w - 2 * d}" height="${h - 2 * d}" rx="${Math.max(0, radio - d / 2)}"`;
      svg.innerHTML = `<defs><mask id="${id}" maskUnits="userSpaceOnUse"><rect class="mascara" ${caja} fill="none" stroke="#fff" stroke-width="5"/></mask></defs><rect class="puntada" ${caja} mask="url(#${id})"/>`;
      el.appendChild(svg);
      const m = svg.querySelector(".mascara"), L = 2 * (w + h - 4 * d);
      if (io) { m.style.strokeDasharray = L; m.style.strokeDashoffset = L; io.observe(el); }
    });
  }

  // El hilo que se cose arriba de la pantalla en cada cambio.
  function hiloDePantalla() {
    if (M.calma()) return;
    let h = document.querySelector(".k-hilo-pantalla");
    if (!h) { h = document.createElement("i"); h.className = "k-hilo-pantalla"; h.setAttribute("aria-hidden", "true"); document.body.appendChild(h); }
    h.animate([{ transform: "scaleX(0)", opacity: 1 }, { transform: "scaleX(1)", opacity: 1, offset: 0.7 }, { transform: "scaleX(1)", opacity: 0 }], { duration: 1100, easing: "cubic-bezier(.65,0,.35,1)" });
  }

  // Al agregar, un hilo punteado va del botón a la bolsa de la cabecera.
  function hiloABolsa(boton) {
    const destino = document.querySelector("#lienzo .k-ir-bolsa b");
    if (M.calma() || !destino) return Promise.resolve();
    const a = boton.getBoundingClientRect(), b = destino.getBoundingClientRect();
    const x1 = a.left + a.width / 2, y1 = a.top, x2 = b.left + b.width / 2, y2 = b.top + b.height / 2;
    const svg = document.createElementNS(ns, "svg"), id = "k-m" + serie++;
    svg.setAttribute("class", "k-vuelo"); svg.setAttribute("viewBox", `0 0 ${innerWidth} ${innerHeight}`);
    const d = `M ${x1} ${y1} C ${x1 - 120} ${y1 - 260}, ${x2 + 60} ${y2 + 200}, ${x2} ${y2}`;
    svg.innerHTML = `<defs><mask id="${id}" maskUnits="userSpaceOnUse"><path d="${d}" fill="none" stroke="#fff" stroke-width="6"/></mask></defs><path d="${d}" stroke-dasharray="7 5" mask="url(#${id})"/>`;
    document.body.appendChild(svg);
    const m = svg.querySelector("mask path"), L = m.getTotalLength();
    m.style.strokeDasharray = L;
    return m.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0, offset: 0.6 }, { strokeDashoffset: -L }], { duration: 1300, easing: "cubic-bezier(.65,0,.35,1)" }).finished.then(() => svg.remove());
  }

  function montar(pantalla, lienzo, { primera }) {
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll("[data-letras]").forEach((h) => M.letras(h));
    lienzo.querySelectorAll(".k-panel > *").forEach((x, i) => x.style.setProperty("--f", i));
    requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    M.revelar(lienzo);
    document.fonts.ready.then(() => coser(lienzo));
    if (!primera) hiloDePantalla();
    if (pantalla === "bolsa") { const t = lienzo.querySelector("[data-total]"); if (t) M.contar(t, Number(t.dataset.total), 1300, (n) => C.precio(Math.round(n))); }
  }

  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", () => M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")));
  document.addEventListener("cayla:agregado", (e) => {
    const b = e.detail.boton, texto = b.querySelector("[data-texto]");
    texto.textContent = "Agregada a tu bolsa";
    hiloABolsa(b).then(() => M.latir(document.querySelector("#lienzo .k-ir-bolsa b")));
    setTimeout(() => { texto.textContent = "Agregar a la bolsa"; delete b.dataset.hecho; }, 2600);
  });
  document.addEventListener("cayla:separado", (e) => M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1300, (n) => String(Math.round(n)).padStart(4, "0")));

  window.DIRECCION = { nombre: "I · Pespunte", pantallas, montar, transicion: true };
})();
</script>
