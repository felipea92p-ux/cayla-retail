<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Cochinilla — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Hanken+Grotesk:wght@400;500;600&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── C · COCHINILLA ─ la evolución de la tienda oscura de hoy: en vez de casi negro, el vino profundo de la cochinilla
   (el rojo de los tejidos peruanos) con su rosa. Las prendas cuelgan de un riel, como en el piso de la boutique. ── */
#lienzo {
  --vino: #3a0d17; --granate: #551522; --rosa: #e8b4bc; --algodon: #f4ece4; --humo: #cdb0b3; --riel: #b98189; --linea: #ffffff21;
  --gap: clamp(14px, 2.4cqi, 36px); --gutter: clamp(16px, 4cqi, 64px); --cuerda: 26px;
  background: var(--vino); color: var(--algodon); overflow-x: clip;
  font: 400 15px/1.6 "Hanken Grotesk", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 2px solid var(--rosa); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.c-display { margin: 0; font-family: "Gilda Display", Georgia, serif; font-weight: 400; line-height: .95; letter-spacing: -.01em; font-size: clamp(56px, 10cqi, 150px); }
.c-titulo { margin: 0; font-family: "Gilda Display", Georgia, serif; font-weight: 400; line-height: 1; font-size: clamp(34px, 4.4cqi, 64px); }
.c-cap { font-weight: 600; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.c-humo { color: var(--humo); }
.c-rosa { color: var(--rosa); }
.c-num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.c-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--vino) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--linea); }
.c-cab nav { display: flex; gap: 26px; }
.c-cab nav:last-child { justify-content: flex-end; }
.c-cab nav a { text-decoration: none; color: var(--humo); transition: color .3s; }
.c-cab nav a:hover { color: var(--algodon); }
.c-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.c-logo img { width: 30px; height: auto; }
.c-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.c-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.c-menu i { display: block; height: 1.5px; background: currentColor; margin: 5px 0; }

.c-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 30px; border: 1px solid var(--rosa); border-radius: 999px; background: var(--rosa); color: var(--vino) !important; font-weight: 600; text-decoration: none; cursor: pointer; transition: background .3s, color .3s; }
.c-btn:hover { background: transparent; color: var(--rosa) !important; }
.c-btn--hueco { background: transparent; color: var(--rosa) !important; }
.c-btn--hueco:hover { background: var(--rosa); color: var(--vino) !important; }
.c-btn[data-hecho="si"] { background: transparent; color: var(--rosa) !important; }
.c-link { text-decoration: none; color: var(--rosa); border-bottom: 1px solid color-mix(in srgb, var(--rosa) 45%, transparent); padding-bottom: 1px; transition: border-color .3s; }
.c-link:hover { border-color: var(--rosa); }

/* El riel: la firma de esta dirección. Cada prenda cuelga de su tramo; juntos forman un riel continuo. */
.c-riel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 48px var(--gap); }
.c-riel [hidden] { display: none; }
.c-percha { position: relative; margin: 0; padding-top: var(--cuerda); }
.c-percha::before { content: ""; position: absolute; top: 0; left: calc(var(--gap) / -2 - 1px); right: calc(var(--gap) / -2 - 1px); height: 2px; background: var(--riel); }
.c-percha::after { content: ""; position: absolute; top: 2px; left: 50%; width: 1px; height: calc(var(--cuerda) - 2px); background: var(--riel); }
.c-tela { display: block; position: relative; aspect-ratio: 4 / 5; background: var(--algodon); border-radius: 3px; overflow: hidden; text-decoration: none; transform-origin: 50% calc(-1 * var(--cuerda)); }
.c-tela img { width: 100%; height: 100%; object-fit: contain; padding: 9%; mix-blend-mode: multiply; }
.c-etiqueta { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-top: 14px; }
.c-etiqueta b { font-weight: 500; }
.c-etiqueta .c-humo { grid-column: 1 / -1; font-size: 13px; }

.c-seccion { padding: clamp(72px, 10cqi, 140px) var(--gutter) 0; }
.c-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(32px, 4cqi, 56px); }

/* Portada */
.c-hero { padding: clamp(48px, 7cqi, 104px) var(--gutter) 0; text-align: center; }
.c-hero .c-cap { display: block; margin-bottom: 24px; }
.c-hero .c-riel { grid-template-columns: repeat(5, 1fr); margin: clamp(40px, 6cqi, 80px) 0 0; text-align: left; }
.c-hero p { max-width: 40ch; margin: 40px auto 28px; color: var(--humo); font-size: 17px; }
.c-acciones { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 28px; }
.c-banda { margin-top: clamp(72px, 10cqi, 140px); padding: clamp(56px, 8cqi, 112px) var(--gutter); background: var(--granate); }
.c-pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(20px, 3cqi, 48px); }
.c-paso span { display: block; font-family: "Gilda Display", serif; font-size: 64px; line-height: 1; color: var(--rosa); margin-bottom: 18px; }
.c-paso h3 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
.c-paso p { margin: 0; color: var(--humo); }
.c-club { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6cqi, 112px); align-items: center; }
.c-club ul { list-style: none; margin: 28px 0 36px; padding: 0; display: grid; gap: 0; }
.c-club li { padding: 16px 0; border-top: 1px solid var(--linea); }
.c-club li b { display: block; font-weight: 500; }
.c-club li span { color: var(--humo); }
/* La tarjeta del Club: un objeto real de su mundo, en rosa cochinilla */
.c-tarjeta { position: relative; aspect-ratio: 1.586; max-width: 520px; width: 100%; justify-self: center; padding: clamp(20px, 3cqi, 36px); border-radius: 18px; background: linear-gradient(140deg, var(--rosa), color-mix(in srgb, var(--rosa) 70%, var(--granate))); color: var(--vino); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 40px 80px -40px #000a; transform: rotate(-3deg); }
.c-tarjeta .marca { font-family: "EB Garamond", serif; font-weight: 500; font-size: clamp(16px, 2cqi, 24px); letter-spacing: .24em; }
.c-tarjeta .nombre { font-family: "Gilda Display", serif; font-size: clamp(20px, 2.6cqi, 32px); }
.c-tarjeta img { position: absolute; right: 24px; top: 22px; width: 44px; }
.c-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.c-tienda { padding: clamp(24px, 3cqi, 40px); background: var(--granate); border-radius: 6px; }
.c-tienda h3 { margin: 0 0 16px; }
.c-tienda p { margin: 0 0 4px; }
.c-tienda .c-acciones { justify-content: flex-start; margin-top: 22px; }
.c-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 96px) var(--gutter) 40px; margin-top: clamp(72px, 10cqi, 140px); border-top: 1px solid var(--linea); }
.c-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.c-pie a { text-decoration: none; color: var(--humo); }
.c-pie a:hover { color: var(--algodon); }

/* Catálogo */
.c-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(40px, 6cqi, 80px) var(--gutter) 28px; }
.c-filtros { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; padding: 0 var(--gutter) 8px; }
.c-filtros > div { display: flex; flex-wrap: wrap; gap: 8px; }
.c-filtros button { height: 38px; padding: 0 18px; border: 1px solid color-mix(in srgb, var(--rosa) 40%, transparent); border-radius: 999px; background: transparent; color: var(--humo); cursor: pointer; transition: border-color .25s, background .25s, color .25s; }
.c-filtros button:hover { border-color: var(--rosa); color: var(--algodon); }
.c-filtros button[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); color: var(--vino); }
.c-catalogo { padding: 48px var(--gutter) 0; }

/* Prenda */
.c-ficha { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: clamp(24px, 4cqi, 56px) var(--gutter) 0; align-items: start; }
.c-ficha .c-percha::before { left: calc(-1 * var(--gutter)); right: -8%; }
.c-ficha-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.c-ficha-mini .c-tela { aspect-ratio: 4 / 5; }
.c-datos { position: sticky; top: 96px; display: grid; gap: 28px; padding-top: var(--cuerda); }
.c-datos h1 { margin: 8px 0 0; font-family: "Gilda Display", serif; font-weight: 400; font-size: clamp(40px, 4.6cqi, 64px); line-height: 1; }
.c-precio { font-family: "Gilda Display", serif; font-size: 30px; }
.c-grupo { display: grid; gap: 12px; }
.c-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.c-talla { min-width: 56px; height: 46px; padding: 0 16px; border: 1px solid color-mix(in srgb, var(--rosa) 40%, transparent); border-radius: 999px; background: transparent; cursor: pointer; transition: border-color .25s, background .25s, color .25s; }
.c-talla:hover { border-color: var(--rosa); }
.c-talla[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); color: var(--vino); }
.c-color { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 7px; border: 1px solid color-mix(in srgb, var(--rosa) 40%, transparent); border-radius: 999px; background: transparent; cursor: pointer; }
.c-color i { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px #ffffff40; }
.c-color[aria-pressed="true"] { border-color: var(--rosa); box-shadow: inset 0 0 0 1px var(--rosa); }
.c-stock { display: grid; gap: 0; margin: 0; }
.c-stock div { display: flex; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--linea); }
.c-stock div:last-child { border-bottom: 1px solid var(--linea); }
.c-stock dd { margin: 0; }
.c-aviso { min-height: 1.6em; margin: -14px 0 0; font-size: 14px; color: var(--rosa); }

/* Bolsa */
.c-bolsa { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); padding: 0 var(--gutter); align-items: start; }
.c-linea { display: grid; grid-template-columns: 112px 1fr auto; gap: 20px; padding: 18px; margin-bottom: 10px; background: var(--granate); border-radius: 6px; }
.c-linea .c-tela { aspect-ratio: 4 / 5; }
.c-linea h3 { margin: 0; font-family: "Gilda Display", serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
.c-linea [data-hay-aqp] { display: block; margin-top: 10px; font-size: 13px; color: var(--humo); }
.c-linea [data-falta="true"] { color: var(--rosa); }
.c-quitar { margin-top: 10px; padding: 0; border: 0; background: none; color: var(--humo); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.c-resumen { position: sticky; top: 96px; display: grid; gap: 22px; padding: 30px; background: var(--granate); border-radius: 6px; }
.c-tienda-op { display: grid; gap: 2px; width: 100%; padding: 14px 18px; border: 1px solid color-mix(in srgb, var(--rosa) 30%, transparent); border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
.c-tienda-op:hover { border-color: var(--rosa); }
.c-tienda-op[aria-pressed="true"] { border-color: var(--rosa); box-shadow: inset 0 0 0 1px var(--rosa); }
.c-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--linea); }
.c-total b { font-family: "Gilda Display", serif; font-weight: 400; font-size: 34px; }
.c-listo { display: grid; gap: 14px; }
.c-listo h2 { margin: 0; font-family: "Gilda Display", serif; font-weight: 400; font-size: 38px; line-height: 1.05; }
.c-listo p { margin: 0; }
.c-mensaje { margin: 0; padding: 14px 16px; border-radius: 6px; background: var(--vino); color: var(--humo); font-size: 14px; white-space: pre-line; }

/* Entrar */
.c-entrar { display: grid; justify-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) 0; }
.c-entrar .c-riel { grid-template-columns: repeat(3, 1fr); width: min(560px, 100%); }
.c-form { display: grid; gap: 20px; width: min(460px, 100%); margin-top: -40px; padding: clamp(28px, 4cqi, 44px); background: var(--granate); border-radius: 8px; position: relative; }
.c-form h1 { font-size: clamp(40px, 5cqi, 64px); text-align: center; }
.c-form label { display: grid; gap: 8px; }
.c-form input { height: 52px; padding: 0 18px; border: 1px solid color-mix(in srgb, var(--rosa) 30%, transparent); border-radius: 6px; background: var(--vino); font: inherit; color: var(--algodon); }
.c-form input::placeholder { color: color-mix(in srgb, var(--humo) 70%, transparent); }
.c-form input:focus { outline: none; border-color: var(--rosa); }
.c-form .c-btn { width: 100%; }

/* Movimiento: al llegar, las prendas bajan por su cuerda y se asientan. Al pasar el mouse, la prenda se mece una sola vez. */
@media (prefers-reduced-motion: no-preference) {
  .c-cuelga .c-tela { animation: c-cuelga 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms + .15s); }
  @keyframes c-cuelga { from { opacity: 0; transform: translateY(-16px) rotate(2deg); } }
  .c-percha:hover .c-tela, .c-percha:focus-within .c-tela { animation: c-mece 1.3s ease-in-out; }
  @keyframes c-mece { 0% { transform: rotate(0); } 30% { transform: rotate(1.4deg); } 65% { transform: rotate(-.6deg); } 100% { transform: rotate(0); } }
}

/* Celular */
@container lienzo (max-width: 760px) {
  .c-cab { grid-template-columns: 40px 1fr auto; height: 58px; }
  .c-cab nav:first-child { display: none; }
  .c-menu { display: block; grid-column: 1; grid-row: 1; }
  .c-logo { grid-column: 2; justify-self: center; }
  .c-cab nav:last-child a:not(.c-ir-bolsa) { display: none; }
  .c-riel, .c-hero .c-riel { grid-template-columns: 1fr 1fr; gap: 36px 14px; }
  .c-hero .c-riel > :nth-child(n + 5) { display: none; }
  .c-pasos, .c-club, .c-tiendas, .c-ficha, .c-bolsa { grid-template-columns: 1fr; }
  .c-pasos { gap: 28px; }
  .c-paso { display: grid; grid-template-columns: 52px 1fr; }
  .c-paso span { font-size: 44px; grid-row: span 2; margin: 0; }
  .c-tarjeta { order: -1; transform: rotate(-2deg); }
  .c-pie { grid-template-columns: 1fr 1fr; }
  .c-pie > :first-child { grid-column: 1 / -1; }
  .c-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .c-filtros button { white-space: nowrap; }
  .c-datos, .c-resumen { position: static; }
  .c-linea { grid-template-columns: 84px 1fr; }
  .c-linea > .c-num { grid-column: 2; }
  .c-etiqueta { grid-template-columns: 1fr; }
  .c-ficha .c-percha::before { right: calc(-1 * var(--gutter)); }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script>
(function () {
  const C = window.CAYLA;
  const logo = `<a class="c-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="c-cab">
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="c-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="c-ir-bolsa" href="#bolsa" style="color:var(--algodon)">Bolsa · <span data-cuenta-bolsa>0</span></a></nav>
    </header>`;
  const pie = () => `
    <footer class="c-pie">
      <div>${logo}<p class="c-humo" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="c-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="c-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="c-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const percha = (p, i, conPrecio, conEtiqueta = true) => `
    <figure class="c-percha" style="--i:${i}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="c-tela" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      ${conEtiqueta ? `<figcaption class="c-etiqueta">
        <a href="#prenda/${p.id}" style="text-decoration:none"><b>${p.nombre}</b></a>
        ${conPrecio ? `<span class="c-num">${C.precio(p.precio)}</span>` : `<a class="c-link" href="#entrar">Ver precio</a>`}
        ${conPrecio ? `<span class="c-humo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>` : ""}
    </figure>`;

  const pantallas = {
    portada() {
      return `${cab()}
      <section class="c-hero">
        <span class="c-cap c-rosa">Llegó en los últimos 30 días</span>
        <h1 class="c-display">Lo nuevo de CAYLA</h1>
        <div class="c-riel c-cuelga">${C.prendas.slice(0, 5).map((p, i) => percha(p, i, false)).join("")}</div>
        <p>Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
        <div class="c-acciones"><a class="c-btn" href="#entrar">Crear mi cuenta</a><a class="c-link" href="#entrar">Ya tengo cuenta</a></div>
      </section>
      <section class="c-banda">
        <div class="c-seccion-cab"><h2 class="c-titulo">Así se separa</h2><span class="c-cap c-humo">Sin pagar en la web</span></div>
        <div class="c-pasos">${C.pasos.map(([t, d], i) => `<div class="c-paso"><span>${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="c-seccion c-club">
        <div><span class="c-cap c-rosa">Club CAYLA</span><h2 class="c-titulo" style="margin-top:16px">Crea tu cuenta y ya eres parte del Club</h2>
          <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ul>
          <a class="c-btn" href="#entrar">Crear mi cuenta</a></div>
        <div class="c-tarjeta" aria-hidden="true"><img src="cayla-isotipo.png" alt=""><span class="marca">CAYLA</span><div><span class="c-cap" style="opacity:.75">Miembro del Club</span><div class="nombre">Tu nombre aquí</div></div></div>
      </section>
      <section class="c-seccion">
        <div class="c-seccion-cab"><h2 class="c-titulo">Nuestras tiendas</h2><span class="c-cap c-humo">Recoge en la que te quede cerca</span></div>
        <div class="c-tiendas">${C.tiendas.map((t) => `<div class="c-tienda"><h3 class="c-titulo">${t.ciudad}</h3><p>${t.direccion}</p><p class="c-humo">${t.horario}</p><div class="c-acciones"><a class="c-btn c-btn--hueco" href="#portada">WhatsApp ${t.whatsapp}</a><a class="c-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="c-cat-cab"><h1 class="c-display" style="font-size:clamp(52px,8cqi,120px)">Ropa</h1><span class="c-humo"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="c-filtros" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="c-catalogo"><div class="c-riel c-cuelga">${C.prendas.map((p, i) => percha(p, i % 4, true)).join("")}</div></div>
      <p class="c-seccion c-humo" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 4);
      return `${cab()}
      <section class="c-ficha">
        <div>
          <div class="c-percha c-cuelga"><div class="c-tela"><img src="${C.foto(p)}" alt="${p.nombre}"></div></div>
          ${p.foto.length > 1 ? `<div class="c-ficha-mini">${p.foto.map((_, i) => `<div class="c-tela"><img src="${C.foto(p, i)}" alt="${p.nombre}, foto ${i + 1}"></div>`).join("")}</div>` : ""}
        </div>
        <div class="c-datos">
          <div><a class="c-cap c-rosa" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="c-precio c-num">${C.precio(p.precio)}</div>
          <div class="c-grupo"><span class="c-cap c-humo">Color</span><div class="c-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="c-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="c-grupo"><div style="display:flex;justify-content:space-between"><span class="c-cap c-humo">Talla</span><a class="c-link" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="c-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="c-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="c-stock">${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "c-humo"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="c-btn" data-agregar="${p.id}">Agregar a la bolsa</button>
          <p class="c-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="c-humo" style="margin:-16px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="c-seccion"><div class="c-seccion-cab"><h2 class="c-titulo">Va con</h2></div><div class="c-riel">${va.map((x, i) => percha(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="c-cat-cab"><h1 class="c-display" style="font-size:clamp(48px,7cqi,104px)">Tu bolsa</h1><span class="c-humo">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="c-bolsa">
        <div>${bolsa.length === 0 ? `<p class="c-linea" style="display:block">Tu bolsa está vacía. <a class="c-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="c-linea">
            <a class="c-tela" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><h3>${p.nombre}</h3><span class="c-humo">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="c-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="c-num">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="c-resumen">
          <div data-antes-de-separar style="display:grid;gap:22px">
            <div class="c-grupo"><span class="c-cap c-humo">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="c-tienda-op" data-valor="${t.id}" aria-pressed="false"><b style="font-weight:500">${t.ciudad}</b><span class="c-humo">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="c-total"><span>Total<br><span class="c-humo">Pagas al recoger</span></span><b class="c-num">${C.precio(total)}</b></div>
            <button class="c-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="c-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p class="c-humo" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="c-listo" data-confirmacion hidden>
            <span class="c-cap c-rosa">Separación N.º ${C.deEjemplo.numero} · por confirmar</span>
            <h2 tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
            <p class="c-humo">Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="c-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="c-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      return `${cab()}
      <section class="c-entrar">
        <div class="c-riel c-cuelga">${["olenka", "cuello-v", "luna"].map((x, i) => percha(C.prenda(x), i, false, false)).join("")}</div>
        <form class="c-form" novalidate>
          <h1 class="c-display">Entrar</h1>
          <p class="c-humo" style="margin:-8px 0 4px;text-align:center">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p>
          <label><span class="c-cap c-humo">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="c-cap c-humo">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="c-btn" type="submit">Entrar</button>
          <a class="c-link" href="#entrar" style="justify-self:center">Olvidé mi contraseña</a>
          <p style="margin:8px 0 0;padding-top:20px;border-top:1px solid var(--linea);text-align:center">¿Todavía no tienes cuenta?</p>
          <a class="c-btn c-btn--hueco" href="#entrar">Crear mi cuenta</a>
        </form>
      </section>
      ${pie()}`;
    },
  };

  window.DIRECCION = { nombre: "C · Cochinilla", pantallas };
})();
</script>
<script src="marco.js"></script>
</body>
</html>
