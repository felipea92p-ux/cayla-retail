<!doctype html>
<html lang="es">
<head>

<title>F · Friso — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ── F · FRISO ─ el adobe del norte. Arena y espresso, mayúsculas finas de Italiana con Jost. La firma: un friso escalonado,
   como los de Chan Chan en Trujillo, que se dibuja línea por línea; los marcos de las fotos tienen las esquinas escalonadas y
   se abren desde el centro; una luz de sol recorre el muro despacio. Tono sobre tono, nunca de souvenir. ── */
@property --m { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
@property --s { syntax: "<length>"; inherits: false; initial-value: 12px; }
#lienzo {
  --adobe: #d9cdbd; --arena: #eee7dc; --espresso: #2a211b; --barro: #5e4c3e; --linea: #c3b4a2; --totora: #4e5a3a; --sol: #f6ebda;
  --gutter: clamp(16px, 4cqi, 64px);
  background: var(--adobe); color: var(--espresso); overflow-x: clip;
  font: 400 15.5px/1.65 "Jost", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 1.5px solid var(--totora); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.f-cap { font-weight: 500; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.f-display { margin: 0; font-family: "Italiana", Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; line-height: .9; font-size: clamp(64px, 12.5cqi, 200px); }
.f-titulo { margin: 0; font-family: "Italiana", Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: .08em; line-height: 1; font-size: clamp(32px, 4.2cqi, 62px); }
.f-nombre { font-family: "Italiana", Georgia, serif; font-weight: 400; letter-spacing: .04em; }
.f-tenue { color: var(--barro); }
.f-num { font-variant-numeric: tabular-nums; }

/* El friso: una greca escalonada entre dos líneas, tono sobre tono */
.f-friso { display: block; width: 100%; height: 30px; overflow: visible; color: var(--espresso); }
.f-friso path { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: square; opacity: .62; }
.f-friso path.luz { stroke: var(--arena); opacity: .9; transform: translate(1px, 1px); }

.f-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 70px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--adobe) 90%, transparent); backdrop-filter: blur(12px); }
.f-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 34px); }
.f-cab nav:last-child { justify-content: flex-end; }
.f-cab a { text-decoration: none; }
.f-cab nav a { position: relative; padding: 6px 0; }
.f-cab nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, currentColor 50%, transparent 0) 0 0 / 8px 1px repeat-x, linear-gradient(90deg, transparent 50%, currentColor 0) 0 3px / 8px 1px repeat-x; transform: scaleX(0); transform-origin: 0 50%; }
.f-cab nav a:hover::after { transform: scaleX(1); }
.f-cab-friso { position: sticky; top: 70px; z-index: 9; padding: 0 var(--gutter); background: color-mix(in srgb, var(--adobe) 90%, transparent); }
.f-cab-friso .f-friso { height: 14px; }
.f-logo { display: flex; align-items: center; gap: 10px; }
.f-logo img { width: 30px; height: auto; }
.f-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.f-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.f-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.f-ir-bolsa b { display: inline-block; font-weight: 500; }

.f-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 30px; border: 1px solid var(--espresso); background: var(--espresso); color: var(--arena) !important; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; text-decoration: none; cursor: pointer; overflow: hidden; isolation: isolate; clip-path: polygon(8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px), 0 8px, 4px 8px, 4px 4px, 8px 4px); }
.f-btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--totora); transform: translateY(101%); }
.f-btn:hover::before { transform: none; }
.f-btn--claro { background: transparent; color: var(--espresso) !important; clip-path: none; }
.f-btn--claro:hover { color: var(--arena) !important; }
.f-btn[data-hecho="si"]::before { transform: none; }
.f-link { text-decoration: none; padding-bottom: 3px; background: linear-gradient(var(--linea), var(--linea)) no-repeat 0 100% / 100% 1px, linear-gradient(var(--espresso), var(--espresso)) no-repeat 0 100% / 0% 1px; }
.f-link:hover { background-size: 100% 1px, 100% 1px; }

/* El marco escalonado: dos escalones en cada esquina. --m lo cierra hacia el centro; --s es el tamaño del escalón. */
.f-marco { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--arena); text-decoration: none; overflow: hidden;
  --m: 0%; --s: 12px;
  clip-path: polygon(calc(var(--m) + 2 * var(--s)) var(--m), calc(100% - var(--m) - 2 * var(--s)) var(--m), calc(100% - var(--m) - 2 * var(--s)) calc(var(--m) + var(--s)), calc(100% - var(--m) - var(--s)) calc(var(--m) + var(--s)), calc(100% - var(--m) - var(--s)) calc(var(--m) + 2 * var(--s)), calc(100% - var(--m)) calc(var(--m) + 2 * var(--s)), calc(100% - var(--m)) calc(100% - var(--m) - 2 * var(--s)), calc(100% - var(--m) - var(--s)) calc(100% - var(--m) - 2 * var(--s)), calc(100% - var(--m) - var(--s)) calc(100% - var(--m) - var(--s)), calc(100% - var(--m) - 2 * var(--s)) calc(100% - var(--m) - var(--s)), calc(100% - var(--m) - 2 * var(--s)) calc(100% - var(--m)), calc(var(--m) + 2 * var(--s)) calc(100% - var(--m)), calc(var(--m) + 2 * var(--s)) calc(100% - var(--m) - var(--s)), calc(var(--m) + var(--s)) calc(100% - var(--m) - var(--s)), calc(var(--m) + var(--s)) calc(100% - var(--m) - 2 * var(--s)), var(--m) calc(100% - var(--m) - 2 * var(--s)), var(--m) calc(var(--m) + 2 * var(--s)), calc(var(--m) + var(--s)) calc(var(--m) + 2 * var(--s)), calc(var(--m) + var(--s)) calc(var(--m) + var(--s)), calc(var(--m) + 2 * var(--s)) calc(var(--m) + var(--s))); }
.f-marco img { width: 100%; height: 100%; object-fit: contain; padding: 11%; mix-blend-mode: multiply; }
.f-fig { margin: 0; }
.f-pie-foto { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding-top: 14px; }
.f-pie-foto .f-nombre { font-size: 22px; text-decoration: none; }
.f-pie-foto .f-cap { grid-column: 1 / -1; color: var(--barro); }
.f-dispo { grid-column: 1 / -1; font-size: 13px; color: var(--barro); }

.f-seccion { padding: clamp(72px, 10cqi, 140px) var(--gutter) 0; }
.f-seccion-cab { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px 24px; margin-bottom: clamp(28px, 4cqi, 56px); }
.f-seccion-cab .f-friso { grid-column: 1 / -1; height: 16px; }
.f-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }

/* Portada: el muro de adobe con su luz de sol */
.f-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 4cqi, 72px); align-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) clamp(40px, 5cqi, 72px); overflow: hidden; }
.f-hero::before { content: ""; position: absolute; inset: -20% -40%; pointer-events: none; background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--sol) 75%, transparent) 50%, transparent 65%); mix-blend-mode: soft-light; }
.f-hero > * { position: relative; }
.f-hero .f-cap { display: block; margin-bottom: 26px; }
.f-hero p { max-width: 36ch; margin: 30px 0 30px; font-size: 17px; }
.f-par { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(14px, 2cqi, 28px); align-items: start; }
.f-par > :last-child { margin-top: clamp(60px, 10cqi, 160px); }
.f-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 48px); }
.f-pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.f-paso { padding: 8px clamp(14px, 2cqi, 28px) 0; border-left: 1px solid var(--linea); }
.f-paso:first-child { border-left: 0; padding-left: 0; }
.f-paso .f-romano { display: block; font-family: "Italiana", serif; font-size: 64px; line-height: 1; margin-bottom: 16px; color: var(--totora); }
.f-paso h3 { margin: 0 0 8px; font-weight: 500; font-size: 17px; }
.f-paso p { margin: 0; color: var(--barro); }
.f-club { margin: clamp(72px, 10cqi, 140px) var(--gutter) 0; padding: 28px clamp(24px, 5cqi, 80px); background: var(--arena); }
.f-club-cuerpo { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6cqi, 112px); align-items: center; padding: clamp(32px, 5cqi, 72px) 0; }
.f-club ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.f-club li { padding: 18px 0; border-top: 1px solid var(--linea); }
.f-club li b { display: block; font-weight: 500; }
.f-club p { margin: 18px 0 30px; max-width: 34ch; }
.f-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4cqi, 64px); }
.f-tienda h3 { margin: 0 0 14px; font-family: "Italiana", serif; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(44px, 6cqi, 96px); line-height: .95; }
.f-tienda p { margin: 0 0 4px; }
.f-tienda .f-acciones { margin-top: 22px; }
.f-pie { padding: 0 var(--gutter) 40px; margin-top: clamp(72px, 10cqi, 140px); }
.f-pie-cuerpo { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding-top: clamp(40px, 6cqi, 80px); }
.f-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.f-pie a { text-decoration: none; }
.f-pie a:hover { color: var(--totora); }

/* Catálogo */
.f-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(36px, 5cqi, 72px) var(--gutter) 24px; }
.f-filtros { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px 32px; padding: 0 var(--gutter) 6px; }
.f-filtros > div { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.f-filtros button { position: relative; padding: 10px 0; border: 0; background: none; cursor: pointer; color: var(--barro); }
.f-filtros button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 4px; background: linear-gradient(90deg, var(--espresso) 50%, transparent 0) 0 0 / 8px 1px repeat-x, linear-gradient(90deg, transparent 50%, var(--espresso) 0) 0 3px / 8px 1px repeat-x; transform: scaleX(0); transform-origin: 0 50%; }
.f-filtros button:hover { color: var(--espresso); }
.f-filtros button[aria-pressed="true"] { color: var(--espresso); }
.f-filtros button[aria-pressed="true"]::after { transform: scaleX(1); }
.f-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(40px, 5cqi, 72px) clamp(20px, 3cqi, 48px); padding: clamp(36px, 5cqi, 56px) var(--gutter) 0; }
.f-rejilla [hidden] { display: none; }

/* Prenda */
.f-ficha { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 120px); padding: clamp(28px, 4cqi, 56px) var(--gutter) 0; align-items: start; }
.f-ficha .f-marco { --s: 18px; }
.f-galeria-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.f-galeria-mini .f-marco { --s: 6px; }
.f-panel { position: sticky; top: 110px; display: grid; gap: 26px; }
.f-panel h1 { margin: 8px 0 0; font-family: "Italiana", serif; font-weight: 400; text-transform: uppercase; letter-spacing: .05em; font-size: clamp(40px, 4.6cqi, 66px); line-height: .98; }
.f-panel .f-precio { font-family: "Italiana", serif; font-size: 30px; letter-spacing: .04em; }
.f-campo { display: grid; gap: 12px; }
.f-campo-cab { display: flex; justify-content: space-between; }
.f-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.f-talla { position: relative; min-width: 54px; height: 48px; padding: 0 16px; border: 1px solid var(--linea); background: transparent; cursor: pointer; overflow: hidden; isolation: isolate; }
.f-talla::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--espresso); transform: translateY(101%); }
.f-talla:hover { border-color: var(--espresso); }
.f-talla[aria-pressed="true"] { color: var(--arena); border-color: var(--espresso); }
.f-talla[aria-pressed="true"]::before { transform: none; }
.f-color { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 7px; border: 1px solid var(--linea); background: transparent; cursor: pointer; }
.f-color i { width: 30px; height: 30px; box-shadow: inset 0 0 0 1px #0002; }
.f-color[aria-pressed="true"] { border-color: var(--espresso); }
.f-stock { display: grid; margin: 0; }
.f-stock div { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--linea); }
.f-stock div:last-child { border-bottom: 1px solid var(--linea); }
.f-stock dd { margin: 0; }
.f-aviso { min-height: 1.6em; margin: -12px 0 0; font-size: 14px; }
.f-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 48px); }

/* Bolsa */
.f-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: 0 var(--gutter); align-items: start; }
.f-linea { display: grid; grid-template-columns: 116px 1fr auto; gap: 22px; padding: 22px 0; border-bottom: 1px solid var(--linea); align-items: start; }
.f-linea .f-marco { --s: 7px; }
.f-linea .f-nombre { font-size: 24px; text-decoration: none; }
.f-linea .f-cap { display: block; margin-top: 4px; color: var(--barro); }
.f-linea [data-hay-aqp] { display: block; margin-top: 10px; font-size: 13px; color: var(--barro); }
.f-linea [data-falta="true"] { color: var(--totora); font-weight: 500; }
.f-quitar { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--barro); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.f-resumen { position: sticky; top: 110px; display: grid; gap: 22px; padding: 30px; background: var(--arena); }
.f-tienda-op { display: grid; gap: 2px; width: 100%; padding: 16px 18px; border: 1px solid var(--linea); background: var(--adobe); text-align: left; cursor: pointer; }
.f-tienda-op:hover { border-color: var(--espresso); }
.f-tienda-op[aria-pressed="true"] { border-color: var(--espresso); box-shadow: inset 0 0 0 1px var(--espresso); }
.f-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--linea); }
.f-total b { font-family: "Italiana", serif; font-weight: 400; font-size: 34px; }
.f-listo { display: grid; gap: 14px; justify-items: start; }
.f-listo svg { width: 76px; height: 76px; }
.f-listo svg path { fill: none; stroke: var(--totora); stroke-width: 1.5; stroke-linejoin: miter; }
.f-listo h2 { margin: 0; font-family: "Italiana", serif; font-weight: 400; text-transform: uppercase; letter-spacing: .05em; font-size: 34px; line-height: 1.02; }
.f-listo p { margin: 0; }
.f-mensaje { margin: 0; padding: 14px 16px; background: var(--adobe); font-size: 14px; white-space: pre-line; }

/* Entrar */
.f-entrar { display: grid; justify-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) 0; }
.f-form { position: relative; display: grid; gap: 20px; width: min(470px, 100%); padding: clamp(36px, 5cqi, 56px); background: var(--arena); }
.f-form > svg.f-borde { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; overflow: visible; }
.f-form > svg.f-borde rect { fill: none; stroke: var(--linea); stroke-width: 1; }
.f-form h1 { text-align: center; font-size: clamp(52px, 6.4cqi, 92px); }
.f-form label { display: grid; gap: 8px; position: relative; }
.f-form input { height: 52px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--linea); background: linear-gradient(var(--espresso), var(--espresso)) no-repeat 0 100% / 0% 1px; font: inherit; color: inherit; }
.f-form input:focus { outline: none; background-size: 100% 1px; }
.f-form .f-btn { width: 100%; }

@media (prefers-reduced-motion: no-preference) {
  .f-cab nav a::after, .f-filtros button::after { transition: transform .7s cubic-bezier(.76,0,.24,1); }
  .f-btn::before, .f-talla::before { transition: transform .55s cubic-bezier(.76,0,.24,1); }
  .f-btn, .f-talla { transition: color .45s, border-color .3s; }
  .f-link { transition: background-size .7s cubic-bezier(.76,0,.24,1); }
  .f-form input { transition: background-size .8s cubic-bezier(.76,0,.24,1); }
  .f-marco { transition: --s .6s cubic-bezier(.2,.7,.2,1); }
  .f-fig:hover .f-marco { --s: 20px; }
  .f-marco img { transition: transform 1.3s cubic-bezier(.2,.7,.2,1); }
  .f-fig:hover .f-marco img { transform: scale(1.04); }

  /* La luz del sol recorre el muro, despacio, de un lado al otro */
  .f-hero::before { animation: f-sol 16s ease-in-out infinite alternate; }
  @keyframes f-sol { from { transform: translateX(-30%); } to { transform: translateX(30%); } }
  /* El titular: las letras suben y se juntan */
  .f-letras .letra { display: inline-block; opacity: 0; transform: translateY(.4em); transition: opacity .9s, transform 1.3s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.2s + var(--l, 0) * 55ms); }
  .listo .f-letras .letra { opacity: 1; transform: none; }
  .f-letras { letter-spacing: .4em; transition: letter-spacing 1.8s cubic-bezier(.2,.7,.2,1) .2s; }
  .listo .f-letras { letter-spacing: .06em; }
  .f-entra { opacity: 0; transform: translateY(14px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.8s + var(--s2, 0) * 110ms); }
  .listo .f-entra { opacity: 1; transform: none; }
  /* Cada marco se abre desde el centro, escalón por escalón */
  .f-fig[data-revela] .f-marco { --m: 50%; transition: --m 1.4s cubic-bezier(.76,0,.24,1), --s .6s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 130ms), 0s; }
  .f-fig.visto .f-marco { --m: 0%; }
  .f-fig[data-revela] .f-marco img { transform: scale(1.15); transition: transform 2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 130ms); }
  .f-fig.visto .f-marco img { transform: none; }
  .f-fig.visto:hover .f-marco img { transform: scale(1.04); transition-delay: 0s; }
  .f-fig[data-revela] .f-pie-foto { opacity: 0; transform: translateY(10px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.6s + var(--i, 0) * 130ms); }
  .f-fig.visto .f-pie-foto { opacity: 1; transform: none; }
  .f-hero .f-marco { --m: 50%; transition: --m 1.6s cubic-bezier(.76,0,.24,1); transition-delay: calc(.5s + var(--c, 0) * 220ms); }
  .listo .f-hero .f-marco { --m: 0%; }
  [data-revela].f-sube { opacity: 0; transform: translateY(24px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 120ms); }
  [data-revela].f-sube.visto { opacity: 1; transform: none; }
  .f-paso .f-romano { transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .f-paso:hover .f-romano { transform: translateY(-6px); }
  .f-panel > * { opacity: 0; transform: translateY(14px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.3s + var(--f, 0) * 80ms); }
  .listo .f-panel > * { opacity: 1; transform: none; }
  .f-ficha .f-marco { --m: 50%; transition: --m 1.5s cubic-bezier(.76,0,.24,1) .1s, --s .6s; }
  .listo .f-ficha .f-marco { --m: 0%; }
  .f-bolsa-cuerpo .f-linea { animation: f-sube-k 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.2s + var(--i, 0) * 120ms); }
  .f-resumen { animation: f-sube-k 1s .35s cubic-bezier(.2,.7,.2,1) both; }
  .f-listo:not([hidden]) { animation: f-sube-k .9s cubic-bezier(.2,.7,.2,1) both; }
  .f-listo:not([hidden]) svg path { stroke-dasharray: 340; stroke-dashoffset: 340; animation: f-traza 1.6s .15s cubic-bezier(.65,0,.35,1) forwards; }
  .f-listo:not([hidden]) svg path + path { stroke-dasharray: 60; stroke-dashoffset: 60; animation-delay: 1.3s; animation-duration: .6s; }
  .f-form > :not(svg) { animation: f-sube-k .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.4s + var(--f, 0) * 80ms); }
  .f-form > svg.f-borde rect { stroke-dasharray: var(--largo, 2000); stroke-dashoffset: var(--largo, 2000); animation: f-traza 2s .1s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes f-sube-k { from { opacity: 0; transform: translateY(24px); } }
  @keyframes f-traza { to { stroke-dashoffset: 0; } }

  /* De una pantalla a otra: la nueva sube como una escalera de adobe */
  ::view-transition-old(root) { animation: .7s ease both f-vt-sale; }
  ::view-transition-new(root) { animation: 1s cubic-bezier(.76,0,.24,1) both f-vt-escalera; }
  @keyframes f-vt-sale { to { opacity: .35; } }
  @keyframes f-vt-escalera {
    from { clip-path: polygon(0 100%, 25% 100%, 25% 112%, 50% 112%, 50% 124%, 75% 124%, 75% 136%, 100% 136%, 100% 240%, 0 240%); }
    to { clip-path: polygon(0 -36%, 25% -36%, 25% -24%, 50% -24%, 50% -12%, 75% -12%, 75% 0%, 100% 0%, 100% 240%, 0 240%); }
  }
}

@container lienzo (max-width: 760px) {
  .f-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .f-cab-friso { top: 60px; }
  .f-cab nav:first-child { display: none; }
  .f-menu { display: block; grid-column: 1; grid-row: 1; }
  .f-logo { grid-column: 2; justify-self: center; }
  .f-cab nav:last-child a:not(.f-ir-bolsa) { display: none; }
  .f-hero, .f-club-cuerpo, .f-ficha, .f-bolsa-cuerpo { grid-template-columns: 1fr; }
  .f-sala, .f-vacon { grid-template-columns: 1fr 1fr; }
  .f-sala > :nth-child(3), .f-vacon > :nth-child(3) { display: none; }
  .f-pasos { grid-template-columns: 1fr 1fr; gap: 28px 0; }
  .f-paso:nth-child(3) { border-left: 0; padding-left: 0; }
  .f-club { margin-left: 0; margin-right: 0; }
  .f-club ul { grid-template-columns: 1fr; }
  .f-tiendas { grid-template-columns: 1fr; }
  .f-pie-cuerpo { grid-template-columns: 1fr 1fr; }
  .f-pie-cuerpo > :first-child { grid-column: 1 / -1; }
  .f-rejilla { grid-template-columns: 1fr 1fr; gap: 32px 14px; }
  .f-marco { --s: 7px; }
  .f-pie-foto { grid-template-columns: 1fr; }
  .f-pie-foto .f-nombre { font-size: 18px; }
  .f-dispo { display: none; }
  .f-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .f-filtros button { white-space: nowrap; }
  .f-panel, .f-resumen { position: static; }
  .f-linea { grid-template-columns: 84px 1fr; }
  .f-linea > .f-precio-linea { grid-column: 2; }
  .f-resumen { padding: 24px 20px; margin: 0 calc(-1 * var(--gutter)); }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA, M = window.MOV;
  const friso = (clase = "") => `<svg class="f-friso ${clase}" data-friso aria-hidden="true"></svg>`;
  const logo = `<a class="f-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="f-cab f-cap">
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="f-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="f-ir-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>
    <div class="f-cab-friso">${friso()}</div>`;
  const pie = () => `
    <footer class="f-pie">${friso()}
      <div class="f-pie-cuerpo">
        <div>${logo}<p class="f-tenue" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
        <div><span class="f-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
        <div><span class="f-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
        <div><span class="f-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
      </div>
    </footer>`;
  const obra = (p, i, conCuenta) => `
    <figure class="f-fig" data-revela data-id="${p.id}" style="--i:${i}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="f-marco" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="f-pie-foto">
        <a class="f-nombre" href="#prenda/${p.id}">${p.nombre}</a>
        ${conCuenta ? `<span class="f-num">${C.precio(p.precio)}</span>` : `<a class="f-link" href="#entrar">Ver precio</a>`}
        <span class="f-cap">${C.nombreCat(p.cat)}</span>
        ${conCuenta ? `<span class="f-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;
  const cabSeccion = (titulo, derecha) => `<div class="f-seccion-cab"><h2 class="f-titulo f-sube" data-revela>${titulo}</h2>${derecha}${friso()}</div>`;
  const romanos = ["I", "II", "III", "IV"];

  const pantallas = {
    portada() {
      const [a, b] = ["kalessi", "tiana"].map(C.prenda);
      return `${cab()}
      <section class="f-hero">
        <div>
          <span class="f-cap f-tenue f-entra">Llegó en los últimos 30 días</span>
          <h1 class="f-display f-letras" data-letras>Lo nuevo</h1>
          <p class="f-entra" style="--s2:1">Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="f-acciones f-entra" style="--s2:2"><a class="f-btn" href="#entrar">Crear mi cuenta</a><a class="f-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        <div class="f-par">${[a, b].map((p, c) => `<figure class="f-fig" style="margin:0"><a class="f-marco" href="#prenda/${p.id}" style="--c:${c}"><img src="${C.foto(p)}" alt="${p.nombre}"></a><figcaption class="f-pie-foto"><a class="f-nombre" href="#prenda/${p.id}">${p.nombre}</a><a class="f-link" href="#entrar">Ver precio</a></figcaption></figure>`).join("")}</div>
      </section>
      <section class="f-seccion">
        ${cabSeccion("En las tiendas", `<a class="f-link f-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a>`)}
        <div class="f-sala">${["alba", "strend", "luna"].map((x, i) => obra(C.prenda(x), i, false)).join("")}</div>
      </section>
      <section class="f-seccion">
        ${cabSeccion("Así se separa", `<span class="f-cap f-tenue">Sin pagar en la web</span>`)}
        <div class="f-pasos">${C.pasos.map(([t, d], i) => `<div class="f-paso f-sube" data-revela style="--i:${i}"><span class="f-romano">${romanos[i]}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="f-club">
        ${friso()}
        <div class="f-club-cuerpo">
          <div class="f-sube" data-revela><span class="f-cap f-tenue">Club CAYLA</span><h2 class="f-titulo" style="margin-top:14px">Tu cuenta ya es tu membresía</h2><p>Al crear tu cuenta entras al Club. No hay que llenar nada más.</p><a class="f-btn" href="#entrar">Crear mi cuenta</a></div>
          <ul>${C.club.map(([t, d], i) => `<li class="f-sube" data-revela style="--i:${i}"><b>${t}</b><span class="f-tenue">${d}</span></li>`).join("")}</ul>
        </div>
        ${friso()}
      </section>
      <section class="f-seccion">
        ${cabSeccion("Nuestras tiendas", `<span class="f-cap f-tenue">Recoge en la que te quede cerca</span>`)}
        <div class="f-tiendas">${C.tiendas.map((t, i) => `<div class="f-tienda f-sube" data-revela style="--i:${i}"><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="f-tenue">${t.horario}</p><div class="f-acciones"><a class="f-btn f-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="f-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="f-cat-cab"><h1 class="f-display f-letras" data-letras style="font-size:clamp(56px,9cqi,140px)">Ropa</h1><span class="f-cap f-tenue f-entra"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="f-filtros f-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div style="padding:0 var(--gutter)">${friso()}</div>
      <div class="f-rejilla">${C.prendas.map((p, i) => obra(p, i % 3, true)).join("")}</div>
      <p class="f-seccion f-tenue" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      return `${cab()}
      <section class="f-ficha">
        <div>
          <div class="f-marco"><img src="${C.foto(p)}" alt="${p.nombre}"></div>
          ${p.foto.length > 1 ? `<div class="f-galeria-mini">${p.foto.map((_, i) => `<div class="f-marco"><img src="${C.foto(p, i)}" alt="${p.nombre}, foto ${i + 1}"></div>`).join("")}</div>` : ""}
        </div>
        <div class="f-panel">
          <div><a class="f-cap f-tenue" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="f-precio f-num">${C.precio(p.precio)}</div>
          ${friso()}
          <div class="f-campo"><span class="f-cap">Color</span>
            <div class="f-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="f-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="f-campo"><div class="f-campo-cab"><span class="f-cap">Talla</span><a class="f-link f-tenue" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="f-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="f-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="f-stock"><span class="f-cap" style="margin-bottom:8px">En tienda</span>${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "f-tenue"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="f-btn" data-agregar="${p.id}"><span data-texto>Agregar a la bolsa</span></button>
          <p class="f-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="f-tenue" style="margin:-16px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="f-seccion">${cabSeccion("Va con", "")}<div class="f-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="f-cat-cab"><h1 class="f-display f-letras" data-letras style="font-size:clamp(52px,8cqi,124px)">Tu bolsa</h1><span class="f-cap f-tenue f-entra">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="f-bolsa-cuerpo">
        <div>${friso()}${bolsa.length === 0 ? `<p style="padding:22px 0">Tu bolsa está vacía. <a class="f-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="f-linea" style="--i:${i}">
            <a class="f-marco" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="f-nombre" href="#prenda/${p.id}">${p.nombre}</a><span class="f-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="f-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="f-num f-precio-linea">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="f-resumen">
          <div data-antes-de-separar style="display:grid;gap:22px">
            <div class="f-campo"><span class="f-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="f-tienda-op" data-valor="${t.id}" aria-pressed="false"><b class="f-nombre" style="font-size:22px;text-transform:uppercase">${t.ciudad}</b><span class="f-tenue">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="f-total"><span>Total <span class="f-tenue">· pagas al recoger</span></span><b class="f-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="f-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="f-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p class="f-tenue" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="f-listo" data-confirmacion hidden>
            <svg viewBox="0 0 76 76" aria-hidden="true"><path d="M38 2 L46 2 L46 10 L54 10 L54 18 L62 18 L62 26 L70 26 L70 34 L74 34 L74 42 L70 42 L70 50 L62 50 L62 58 L54 58 L54 66 L46 66 L46 74 L30 74 L30 66 L22 66 L22 58 L14 58 L14 50 L6 50 L6 42 L2 42 L2 34 L6 34 L6 26 L14 26 L14 18 L22 18 L22 10 L30 10 L30 2 Z"/><path d="M25 39 L34 48 L52 29"/></svg>
            <span class="f-cap f-tenue">Separación N.º <span data-numero>${C.deEjemplo.numero}</span> · por confirmar</span>
            <h2 tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
            <p>Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="f-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="f-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      return `${cab()}
      <section class="f-entrar">
        <form class="f-form" novalidate>
          <svg class="f-borde" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%"/></svg>
          <h1 class="f-display">Entrar</h1>
          <p class="f-tenue" style="margin:-6px 0 6px;text-align:center">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p>
          <label><span class="f-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="f-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="f-btn" type="submit">Entrar</button>
          <a class="f-link f-tenue" href="#entrar" style="justify-self:center">Olvidé mi contraseña</a>
          ${friso()}
          <p style="margin:0;text-align:center">¿Todavía no tienes cuenta?</p>
          <a class="f-btn f-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de F ──
  // El friso: una greca escalonada (escalón de 7 px) entre dos líneas, a lo ancho de su caja. Se dibuja al llegar a él.
  function dibujarFrisos(lienzo) {
    const ns = "http://www.w3.org/2000/svg";
    lienzo.querySelectorAll("svg[data-friso]").forEach((svg) => {
      const W = Math.max(40, Math.round(svg.getBoundingClientRect().width)), H = svg.getBoundingClientRect().height || 30;
      const s = Math.max(3, Math.round(H / 4.3)), base = H - 3, unidad = s * 6;
      let d = `M 0 ${base}`;
      for (let x = 0; x + unidad <= W; x += unidad) d += ` h ${s} v ${-s} h ${s} v ${-s} h ${s} v ${s} h ${s} v ${s} h ${2 * s}`;
      const greca = d + ` H ${W}`, lineas = `M 0 1 H ${W} M 0 ${H - 0.5} H ${W}`;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.innerHTML = "";
      for (const clase of ["luz", ""]) for (const dd of [lineas, greca]) { const p = document.createElementNS(ns, "path"); p.setAttribute("d", dd); if (clase) p.setAttribute("class", clase); svg.appendChild(p); }
      if (M.calma()) return;
      svg.querySelectorAll("path").forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
      svg.dataset.revela = "";
      svg.classList.add("f-friso-espera");
    });
    if (M.calma() || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      e.target.querySelectorAll("path").forEach((p, i) => p.animate([{ strokeDashoffset: p.style.strokeDashoffset }, { strokeDashoffset: 0 }], { duration: 2200 + i * 150, delay: 120 * i, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" }));
    }), { threshold: 0.2 });
    lienzo.querySelectorAll("svg.f-friso-espera").forEach((s) => io.observe(s));
  }

  function montar(pantalla, lienzo) {
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll("[data-letras]").forEach((h) => M.letras(h));
    lienzo.querySelectorAll(".f-panel > *, .f-form > :not(svg)").forEach((x, i) => x.style.setProperty("--f", i));
    requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    M.revelar(lienzo);
    // El friso se mide con las letras ya cargadas (cambian el ancho de las cajas): se dibuja una sola vez.
    document.fonts.ready.then(() => dibujarFrisos(lienzo));
    const borde = lienzo.querySelector(".f-borde rect");
    if (borde) borde.style.setProperty("--largo", Math.ceil(borde.getTotalLength()));
    if (pantalla === "bolsa") { const t = lienzo.querySelector("[data-total]"); if (t) M.contar(t, Number(t.dataset.total), 1300, (n) => C.precio(Math.round(n))); }
  }

  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", () => M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")));
  document.addEventListener("cayla:agregado", (e) => {
    const b = e.detail.boton, texto = b.querySelector("[data-texto]");
    texto.textContent = "Agregada a tu bolsa";
    M.volar(document.querySelector("#lienzo .f-ficha .f-marco img"), document.querySelector("#lienzo .f-ir-bolsa b")).then(() => M.latir(document.querySelector("#lienzo .f-ir-bolsa b")));
    setTimeout(() => { texto.textContent = "Agregar a la bolsa"; delete b.dataset.hecho; }, 2600);
  });
  document.addEventListener("cayla:separado", (e) => M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1500, (n) => String(Math.round(n)).padStart(4, "0")));
  addEventListener("resize", () => { const l = document.getElementById("lienzo"); l.querySelectorAll("svg[data-friso]").forEach((s) => s.classList.remove("f-friso-espera")); dibujarFrisos(l); });

  window.DIRECCION = { nombre: "F · Friso", pantallas, montar, transicion: true };
})();
</script>
<script src="marco.js"></script>
</body>
