<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K · Sedes — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Work+Sans:wght@400;500;600&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── K · SEDES ─ los colores de CAYLA en clave de cartografía: el mapa fino de la costa del Perú, en la tinta pizarra de la
   marca, con Trujillo y Arequipa marcadas en rojo (los dos únicos rojos de la pantalla) y sus coordenadas reales. Spectral y
   Work Sans. La costa se dibuja sola, cada sede late con lo que tiene y, al elegir dónde recoges, un marcador viaja hasta ella.
   El mapa es una ilustración: la costa está trazada a mano alzada desde coordenadas aproximadas, no es cartografía exacta. ── */
#lienzo {
  --crema: #f5f0e8; --papel: #fbf8f2; --hueso: #eae1d2; --sand: #e8e0d0; --tinta: #1a1a18; --taupe: #805c4c;
  --rojo: #b8412d; --rojo-profundo: #8b2a1f; --verde: #48603f; --ambar: #74501a; --pizarra: #4c5d6e;
  --gutter: clamp(16px, 4cqi, 64px);
  background: var(--crema); color: var(--tinta); overflow-x: clip;
  font: 400 15px/1.6 "Work Sans", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.m-cap { font-weight: 600; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; }
.m-display { margin: 0; font-family: "Spectral", Georgia, serif; font-weight: 300; line-height: .92; letter-spacing: -.02em; font-size: clamp(70px, 11cqi, 180px); }
.m-titulo { margin: 0; font-family: "Spectral", Georgia, serif; font-weight: 300; line-height: 1.02; font-size: clamp(34px, 4.4cqi, 64px); }
.m-titulo em, .m-display em { font-style: italic; }
.m-nombre { font-family: "Spectral", Georgia, serif; font-weight: 400; }
.m-coord { font-family: "Spectral", Georgia, serif; font-style: italic; font-size: 13px; color: var(--taupe); font-variant-numeric: tabular-nums; }
.m-taupe { color: var(--taupe); }
.m-num { font-variant-numeric: tabular-nums; }
.m-hay { color: var(--verde); }
.m-ultima { color: var(--ambar); }

/* El mapa: costa, retícula y océano en pizarra; las sedes en rojo, con su anillo que late */
.m-mapa { display: block; width: 100%; height: auto; overflow: visible; }
.m-mapa .reticula { fill: none; stroke: var(--pizarra); stroke-width: .6; stroke-dasharray: 2 5; opacity: .35; }
.m-mapa .costa { fill: none; stroke: var(--pizarra); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.m-mapa .costa-eco { fill: none; stroke: var(--pizarra); stroke-width: .7; opacity: .35; }
.m-mapa .ruta { fill: none; stroke: var(--pizarra); stroke-width: 1.2; stroke-dasharray: 1 6; stroke-linecap: round; }
.m-mapa .sede { fill: var(--rojo); }
.m-mapa .anillo { fill: none; stroke: var(--rojo); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; }
.m-mapa .marcador { fill: var(--tinta); }
.m-mapa text { font-family: "Work Sans", sans-serif; font-size: 12px; fill: var(--tinta); }
.m-mapa .oceano { font-family: "Spectral", serif; font-style: italic; font-size: 22px; fill: var(--pizarra); letter-spacing: .14em; }
.m-mapa .grado { font-family: "Spectral", serif; font-style: italic; font-size: 11px; fill: var(--pizarra); }
.m-mapa .ciudad { font-weight: 600; letter-spacing: .2em; font-size: 11px; }

.m-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 70px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--crema) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--sand); }
.m-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.m-cab nav:last-child { justify-content: flex-end; }
.m-cab a { text-decoration: none; }
.m-cab nav a { padding: 4px 0; background: linear-gradient(var(--tinta), var(--tinta)) no-repeat 0 100% / 0% 1px; }
.m-cab nav a:hover { background-size: 100% 1px; }
.m-logo { display: flex; align-items: center; gap: 10px; }
.m-logo img { width: 30px; height: auto; }
.m-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.m-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.m-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.m-ir-bolsa b { display: inline-block; font-weight: 600; }

.m-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 28px; border: 1px solid var(--tinta); border-radius: 4px; background: var(--tinta); color: var(--crema) !important; font-weight: 500; text-decoration: none; cursor: pointer; }
.m-btn:hover { background: var(--rojo-profundo); border-color: var(--rojo-profundo); }
.m-btn--claro { background: transparent; color: var(--tinta) !important; border-color: var(--taupe); }
.m-btn--claro:hover { background: var(--tinta); border-color: var(--tinta); color: var(--crema) !important; }
.m-btn[data-hecho="si"] { background: var(--rojo-profundo); border-color: var(--rojo-profundo); }
.m-link { text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid var(--sand); }
.m-link:hover { border-color: var(--tinta); }

.m-papel { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--papel); overflow: hidden; text-decoration: none; }
.m-papel img { width: 100%; height: 100%; object-fit: contain; padding: 11%; mix-blend-mode: multiply; }
.m-fig { margin: 0; }
.m-pie-foto { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding-top: 12px; }
.m-pie-foto .m-nombre { font-size: 21px; line-height: 1.2; text-decoration: none; }
.m-pie-foto .m-cap { grid-column: 1 / -1; color: var(--taupe); }
/* La leyenda de cada prenda: un punto lleno donde hay, un aro donde no */
.m-leyenda { grid-column: 1 / -1; display: flex; gap: 14px; margin-top: 4px; font-size: 12.5px; color: var(--taupe); }
.m-leyenda span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--tinta); vertical-align: 0; }
.m-leyenda span.no::before { background: transparent; box-shadow: inset 0 0 0 1.2px var(--taupe); }

.m-seccion { padding: clamp(72px, 10cqi, 150px) var(--gutter) 0; }
.m-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(30px, 4cqi, 56px); }
.m-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; }

/* Portada: el texto y el mapa */
.m-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); align-items: center; padding: clamp(36px, 5cqi, 72px) var(--gutter) 0; }
.m-hero .m-cap { display: block; margin-bottom: 22px; }
.m-hero p { max-width: 36ch; margin: 26px 0 30px; font-size: 17px; }
.m-carta { position: relative; padding: clamp(14px, 2cqi, 28px); background: var(--papel); }
.m-carta-pie { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid var(--sand); }
.m-vitrina-sede { position: absolute; display: flex; gap: 8px; }
.m-vitrina-sede .m-papel { width: 74px; background: var(--hueso); box-shadow: 0 10px 18px -14px #1a1a1880; }
.m-ruta-pasos { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; padding-top: 46px; }
.m-ruta-pasos::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 0; border-top: 1.4px dotted var(--pizarra); }
.m-paso { position: relative; }
.m-paso::before { content: ""; position: absolute; left: 0; top: -44px; width: 22px; height: 22px; border-radius: 50%; background: var(--crema); box-shadow: inset 0 0 0 1.5px var(--tinta); }
.m-paso.llegado::before { box-shadow: inset 0 0 0 1.5px var(--tinta), inset 0 0 0 6px var(--crema), inset 0 0 0 11px var(--tinta); }
.m-paso .m-nombre { display: block; font-style: italic; font-size: 42px; line-height: 1; margin-bottom: 10px; }
.m-paso h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.m-paso p { margin: 0; color: var(--taupe); }
.m-club { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6cqi, 112px); align-items: center; margin-top: clamp(72px, 10cqi, 150px); padding: clamp(56px, 8cqi, 112px) var(--gutter); background: var(--hueso); }
.m-club ul { list-style: none; margin: 26px 0 32px; padding: 0; }
.m-club li { padding: 14px 0; border-top: 1px solid var(--sand); }
.m-club li b { display: block; font-family: "Spectral", serif; font-weight: 400; font-size: 19px; }
/* El pasaporte del Club, con su sello */
.m-pasaporte { position: relative; justify-self: center; display: grid; align-content: space-between; width: min(420px, 100%); aspect-ratio: 1.42; padding: 28px; background: var(--papel); box-shadow: inset 0 0 0 1px var(--sand); }
.m-pasaporte .m-nombre { font-size: 30px; font-weight: 300; }
.m-sello { position: absolute; right: 24px; top: 22px; display: grid; place-items: center; width: 108px; height: 108px; border-radius: 50%; border: 1.5px solid var(--tinta); color: var(--tinta); text-align: center; rotate: -12deg; }
.m-sello::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px dashed var(--tinta); }
.m-sello span { font-weight: 600; font-size: 9.5px; letter-spacing: .2em; line-height: 1.5; text-transform: uppercase; }
.m-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3cqi, 44px); }
.m-tienda { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: center; padding: clamp(20px, 3cqi, 36px); background: var(--papel); }
.m-tienda h3 { margin: 0 0 6px; font-family: "Spectral", serif; font-weight: 300; font-size: clamp(40px, 4.6cqi, 66px); line-height: 1; }
.m-tienda p { margin: 0 0 4px; }
.m-tienda .m-acciones { margin-top: 18px; }
.m-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 104px) var(--gutter) 40px; margin-top: clamp(72px, 10cqi, 150px); border-top: 1px solid var(--sand); }
.m-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.m-pie a { text-decoration: none; }
.m-pie a:hover { text-decoration: underline; text-underline-offset: 4px; }

/* Catálogo */
.m-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(36px, 5cqi, 72px) var(--gutter) 24px; }
.m-filtros { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 28px; padding: 14px var(--gutter); border-top: 1px solid var(--sand); border-bottom: 1px solid var(--sand); }
.m-filtros [role="group"] { position: relative; display: flex; flex-wrap: wrap; gap: 4px 20px; }
.m-filtros button { padding: 8px 0; border: 0; background: none; cursor: pointer; color: var(--taupe); }
.m-filtros button:hover, .m-filtros button[aria-pressed="true"] { color: var(--tinta); }
.m-filtros .indicador { position: absolute; left: 0; top: 0; border-bottom: 1.5px solid var(--tinta); pointer-events: none; }
.m-filtros [data-filtro-tienda]::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px currentColor; }
.m-filtros [data-filtro-tienda][aria-pressed="true"]::before { background: currentColor; }
.m-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(40px, 5cqi, 72px) clamp(20px, 3cqi, 44px); padding: clamp(32px, 4cqi, 52px) var(--gutter) 0; }
.m-rejilla [hidden] { display: none; }

/* Prenda */
.m-ficha { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: clamp(28px, 4cqi, 56px) var(--gutter) 0; align-items: start; }
.m-panel { position: sticky; top: 100px; display: grid; gap: 22px; }
.m-panel h1 { margin: 6px 0 0; font-family: "Spectral", serif; font-weight: 300; font-size: clamp(40px, 4.8cqi, 68px); line-height: 1; }
.m-panel .m-precio { font-family: "Spectral", serif; font-size: 26px; }
.m-campo { display: grid; gap: 10px; }
.m-campo-cab { display: flex; justify-content: space-between; }
.m-opciones { display: flex; flex-wrap: wrap; gap: 6px; }
.m-talla { min-width: 52px; height: 46px; padding: 0 14px; border: 1px solid var(--sand); border-radius: 4px; background: transparent; cursor: pointer; }
.m-talla:hover { border-color: var(--taupe); }
.m-talla[aria-pressed="true"] { background: var(--tinta); color: var(--crema); border-color: var(--tinta); }
.m-color { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 6px; border: 1px solid var(--sand); border-radius: 4px; background: transparent; cursor: pointer; }
.m-color i { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
.m-color[aria-pressed="true"] { border-color: var(--tinta); }
.m-mini { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 16px; background: var(--papel); }
.m-mini dl { display: grid; gap: 10px; margin: 0; }
.m-mini dt { font-size: 12px; color: var(--taupe); }
.m-mini dd { margin: 0; font-family: "Spectral", serif; font-size: 20px; }
.m-aviso { min-height: 1.6em; margin: -10px 0 0; font-size: 14px; }
.m-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 44px); }

/* Bolsa */
.m-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); padding: 0 var(--gutter); align-items: start; }
.m-linea { display: grid; grid-template-columns: 110px 1fr auto; gap: 22px; padding: 20px 0; border-bottom: 1px solid var(--sand); align-items: start; }
.m-linea:first-child { border-top: 1px solid var(--sand); }
.m-linea .m-nombre { font-size: 22px; text-decoration: none; }
.m-linea .m-cap { display: block; margin-top: 6px; color: var(--taupe); }
.m-linea [data-hay-aqp] { display: block; margin-top: 8px; font-size: 13px; color: var(--taupe); }
.m-linea [data-falta="true"] { color: var(--ambar); }
.m-quitar { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--taupe); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.m-resumen { position: sticky; top: 100px; display: grid; gap: 20px; padding: 28px; background: var(--papel); }
.m-resumen .m-mapa { max-height: 240px; overflow: hidden; }
.m-tienda-op { display: grid; gap: 2px; width: 100%; padding: 14px 16px; border: 1px solid var(--sand); border-radius: 4px; background: var(--crema); text-align: left; cursor: pointer; }
.m-tienda-op:hover { border-color: var(--taupe); }
.m-tienda-op[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.m-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 16px; border-top: 1px solid var(--sand); }
.m-total b { font-family: "Spectral", serif; font-weight: 400; font-size: 32px; }
.m-listo { position: relative; display: grid; gap: 14px; }
.m-listo .m-sello { position: relative; right: auto; top: auto; justify-self: start; width: 120px; height: 120px; }
.m-listo h2 { margin: 0; font-family: "Spectral", serif; font-weight: 300; font-size: 34px; line-height: 1.05; }
.m-listo p { margin: 0; }
.m-mensaje { margin: 0; padding: 14px 16px; background: var(--hueso); font-size: 14px; white-space: pre-line; }

/* Entrar */
.m-entrar { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5cqi, 96px); align-items: center; padding: clamp(40px, 6cqi, 88px) var(--gutter) 0; }
.m-form { display: grid; gap: 18px; width: min(440px, 100%); }
.m-form h1 { margin-bottom: 4px; font-size: clamp(56px, 7cqi, 104px); }
.m-form label { display: grid; gap: 6px; }
.m-form input { height: 50px; padding: 0 16px; border: 1px solid var(--sand); border-radius: 4px; background: var(--hueso); font: inherit; color: inherit; }
.m-form input:focus { outline: none; border-color: var(--tinta); background: var(--papel); }
.m-form .m-btn { width: 100%; }

@media (prefers-reduced-motion: no-preference) {
  .m-cab nav a { transition: background-size .6s cubic-bezier(.76,0,.24,1); }
  .m-btn { transition: background-color .4s, border-color .4s, color .4s; }
  .m-papel img { transition: transform 1.3s cubic-bezier(.2,.7,.2,1); }
  .m-fig:hover .m-papel img { transform: scale(1.04); }
  .m-filtros .indicador { transition: transform .6s cubic-bezier(.2,.7,.2,1), width .6s cubic-bezier(.2,.7,.2,1); }
  .m-talla, .m-tienda-op { transition: background-color .35s, color .35s, border-color .3s, box-shadow .3s; }
  /* Las sedes laten, despacio, todo el tiempo: es lo único que se mueve sin que lo pidas */
  .m-mapa .anillo { animation: m-late 3.2s cubic-bezier(.2,.7,.2,1) infinite; }
  .m-mapa .anillo.dos { animation-delay: 1.6s; }
  @keyframes m-late { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(3.2); } }
  .m-letras .letra { display: inline-block; opacity: 0; transform: translateY(.3em); transition: opacity .9s, transform 1.2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.15s + var(--l, 0) * 60ms); }
  .listo .m-letras .letra { opacity: 1; transform: none; }
  .m-entra { opacity: 0; transform: translateY(12px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.6s + var(--s, 0) * 100ms); }
  .listo .m-entra { opacity: 1; transform: none; }
  .m-carta { opacity: 0; transform: translateY(18px) rotate(-1deg); transition: opacity 1s .2s, transform 1.4s cubic-bezier(.2,.7,.2,1) .2s; }
  .listo .m-carta { opacity: 1; transform: none; }
  .m-vitrina-sede .m-papel { opacity: 0; transform: translateY(10px); transition: opacity .8s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(3.4s + var(--v, 0) * 140ms); }
  .listo .m-vitrina-sede .m-papel { opacity: 1; transform: none; }
  [data-revela].m-sube { opacity: 0; transform: translateY(24px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 110ms); }
  [data-revela].m-sube.visto { opacity: 1; transform: none; }
  .m-fig[data-revela] .m-papel { clip-path: inset(0 0 100% 0); transition: clip-path 1.2s cubic-bezier(.76,0,.24,1); transition-delay: calc(var(--i, 0) * 110ms); }
  .m-fig.visto .m-papel { clip-path: inset(0); }
  .m-fig[data-revela] .m-pie-foto { opacity: 0; transition: opacity .9s; transition-delay: calc(.5s + var(--i, 0) * 110ms); }
  .m-fig.visto .m-pie-foto { opacity: 1; }
  .m-paso::before { transition: box-shadow .6s cubic-bezier(.2,.7,.2,1); }
  .m-sello.estampa { animation: m-estampa .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes m-estampa { from { opacity: 0; transform: scale(1.8); } 60% { opacity: 1; } to { transform: none; } }
  .m-panel > * { opacity: 0; transform: translateY(14px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.25s + var(--f, 0) * 75ms); }
  .listo .m-panel > * { opacity: 1; transform: none; }
  .m-bolsa-cuerpo .m-linea { animation: m-sube-k 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--i, 0) * 110ms); }
  .m-resumen { animation: m-sube-k 1s .3s cubic-bezier(.2,.7,.2,1) both; }
  .m-listo:not([hidden]) > :not(.m-sello) { animation: m-sube-k .8s .5s cubic-bezier(.2,.7,.2,1) both; }
  .m-form > * { animation: m-sube-k .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.3s + var(--f, 0) * 75ms); }
  @keyframes m-sube-k { from { opacity: 0; transform: translateY(22px); } }
  /* De una pantalla a otra: el mapa se aleja y la nueva se acerca */
  ::view-transition-old(root) { animation: .5s cubic-bezier(.4,0,1,1) both m-vt-sale; }
  ::view-transition-new(root) { animation: .8s cubic-bezier(.2,.7,.2,1) .1s both m-vt-entra; }
  @keyframes m-vt-sale { to { opacity: 0; transform: scale(1.04); } }
  @keyframes m-vt-entra { from { opacity: 0; transform: scale(.97); } }
}

@container lienzo (max-width: 760px) {
  .m-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .m-cab nav:first-child { display: none; }
  .m-menu { display: block; grid-column: 1; grid-row: 1; }
  .m-logo { grid-column: 2; justify-self: center; }
  .m-cab nav:last-child a:not(.m-ir-bolsa) { display: none; }
  .m-hero, .m-club, .m-ficha, .m-bolsa-cuerpo, .m-entrar { grid-template-columns: 1fr; }
  .m-vitrina-sede .m-papel { width: 54px; }
  .m-ruta-pasos { grid-template-columns: 1fr 1fr; row-gap: 56px; }
  .m-tiendas { grid-template-columns: 1fr; }
  .m-tienda { grid-template-columns: 96px 1fr; }
  .m-pie { grid-template-columns: 1fr 1fr; }
  .m-pie > :first-child { grid-column: 1 / -1; }
  .m-rejilla, .m-vacon { grid-template-columns: 1fr 1fr; gap: 30px 14px; }
  .m-vacon > :nth-child(3) { display: none; }
  .m-pie-foto { grid-template-columns: 1fr; }
  .m-pie-foto .m-nombre { font-size: 18px; }
  .m-filtros [role="group"]:first-child { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--gutter)); }
  .m-filtros button { white-space: nowrap; }
  .m-panel, .m-resumen { position: static; }
  .m-linea { grid-template-columns: 84px 1fr; }
  .m-linea > .m-precio-linea { grid-column: 2; }
  .m-entrar > .m-carta { display: none; }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA, M = window.MOV;
  // ── El mapa: la costa del Perú a mano alzada desde coordenadas aproximadas (longitud, latitud), en una proyección simple. ──
  const COSTA = [[-80.45, -3.55], [-80.95, -4.1], [-81.3, -4.6], [-81.15, -5.1], [-80.85, -5.6], [-80.2, -6.2], [-79.9, -6.8], [-79.55, -7.4], [-79.1, -8.1], [-78.65, -9.0], [-78.2, -9.9], [-77.7, -10.9], [-77.2, -11.8], [-76.85, -12.5], [-76.3, -13.4], [-76.0, -14.1], [-75.3, -15.1], [-74.5, -15.8], [-73.4, -16.3], [-72.4, -16.8], [-71.5, -17.5], [-70.9, -17.9], [-70.4, -18.35]];
  const P = ([lon, lat]) => [(lon + 82) * 60, (-lat - 3) * 60];
  const SEDES = { tru: { lonlat: [-79.03, -8.11], coord: "8°06′ S · 79°02′ O" }, aqp: { lonlat: [-71.54, -16.41], coord: "16°24′ S · 71°32′ O" } };
  const curva = (pts) => pts.map((p, i) => (i ? "L" : "M") + P(p).map((n) => n.toFixed(1)).join(" ")).join(" ");
  const [tx, ty] = P(SEDES.tru.lonlat), [ax, ay] = P(SEDES.aqp.lonlat);
  const RUTA = `M ${tx} ${ty} C ${tx + 260} ${ty + 80}, ${ax - 120} ${ay - 320}, ${ax} ${ay}`;
  function mapa({ vista = "0 0 760 960", conVitrinas = false, rotulos = true, clase = "", conMarcador = false, anillos = { tru: 1, aqp: 1 } } = {}) {
    const ret = [];
    for (let lat = -4; lat >= -18; lat -= 2) { const y = (-lat - 3) * 60; ret.push(`M 0 ${y} H 760`); }
    for (let lon = -81; lon <= -70; lon += 2) { const x = (lon + 82) * 60; ret.push(`M ${x} 0 V 960`); }
    const sede = (k, txt, dx, dy, ancla) => { const [x, y] = P(SEDES[k].lonlat), r = anillos[k] ?? 1; return `<circle class="anillo" cx="${x}" cy="${y}" r="${6 * r}"/><circle class="anillo dos" cx="${x}" cy="${y}" r="${6 * r}"/><circle class="sede" cx="${x}" cy="${y}" r="6"/>${rotulos ? `<text class="ciudad" x="${x + dx}" y="${y + dy}" text-anchor="${ancla}">${txt}</text><text class="grado" x="${x + dx}" y="${y + dy + 16}" text-anchor="${ancla}">${SEDES[k].coord}</text>` : ""}`; };
    return `<svg class="m-mapa ${clase}" viewBox="${vista}" aria-hidden="true">
      <path class="reticula" d="${ret.join(" ")}"/>
      ${rotulos ? `<text class="grado" x="6" y="${(8 - 3) * 60 - 6}">8° S</text><text class="grado" x="6" y="${(16 - 3) * 60 - 6}">16° S</text><text class="oceano" x="150" y="700" transform="rotate(-62 150 700)">Océano Pacífico</text>` : ""}
      <path class="costa-eco" d="${curva(COSTA.map(([a, b]) => [a + 0.35, b]))}"/>
      <path class="costa" data-trazo d="${curva(COSTA)}"/>
      <path class="ruta" data-ruta d="${RUTA}"/>
      ${sede("tru", "TRUJILLO", 18, -8, "start")}${sede("aqp", "AREQUIPA", 14, -2, "start")}
      ${conMarcador ? `<circle class="marcador" data-marcador r="9" cx="${tx}" cy="${ty}"/>` : ""}
    </svg>`;
  }

  const logo = `<a class="m-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="m-cab m-cap">
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="m-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="m-ir-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="m-pie">
      <div>${logo}<p class="m-taupe" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="m-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="m-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="m-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const obra = (p, i, conCuenta) => `
    <figure class="m-fig" data-revela data-id="${p.id}" style="--i:${i}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="m-papel" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="m-pie-foto">
        <a class="m-nombre" href="#prenda/${p.id}">${p.nombre}</a>
        ${conCuenta ? `<span class="m-num">${C.precio(p.precio)}</span>` : `<a class="m-link" href="#entrar">Ver precio</a>`}
        <span class="m-cap">${C.nombreCat(p.cat)}</span>
        ${conCuenta ? `<span class="m-leyenda"><span class="${p.stock.tru ? "" : "no"}">Trujillo</span><span class="${p.stock.aqp ? "" : "no"}">Arequipa</span></span>` : ""}
      </figcaption>
    </figure>`;
  const recorte = (k) => { const [x, y] = P(SEDES[k].lonlat); return `${x - 130} ${y - 150} 260 300`; };

  const pantallas = {
    portada() {
      const vit = (k, ids, estilo) => `<div class="m-vitrina-sede" style="${estilo}">${ids.map((x, v) => { const p = C.prenda(x); return `<a class="m-papel" href="#prenda/${p.id}" style="--v:${v}" title="${p.nombre}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>`; }).join("")}</div>`;
      return `${cab()}
      <section class="m-hero">
        <div>
          <span class="m-cap m-taupe m-entra">Llegó en los últimos 30 días</span>
          <h1 class="m-display m-letras" data-letras>Lo nuevo</h1>
          <p class="m-entra" style="--s:1">Lo que llegó a nuestras tiendas de Trujillo y Arequipa. Crea tu cuenta para ver precios, tallas y cuánto hay en cada una.</p>
          <div class="m-acciones m-entra" style="--s:2"><a class="m-btn" href="#entrar">Crear mi cuenta</a><a class="m-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        <div class="m-carta" data-mapa-portada>
          ${mapa()}
          ${vit("tru", ["kalessi", "tiana"], "left:40%;top:7%")}
          ${vit("aqp", ["alba", "luna"], "left:42%;top:66%")}
          <div class="m-carta-pie"><span class="m-cap">Nuestras tiendas</span><span class="m-coord">Recoge en la que te quede cerca</span></div>
        </div>
      </section>
      <section class="m-seccion">
        <div class="m-seccion-cab"><h2 class="m-titulo m-sube" data-revela>En las <em>tiendas</em></h2><a class="m-link m-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="m-rejilla" style="padding:0">${["strend", "cuello-v", "olenka"].map((x, i) => obra(C.prenda(x), i, false)).join("")}</div>
      </section>
      <section class="m-seccion">
        <div class="m-seccion-cab"><h2 class="m-titulo m-sube" data-revela>Así se <em>separa</em></h2><span class="m-cap m-taupe">Sin pagar en la web</span></div>
        <div class="m-ruta-pasos" data-ruta-pasos>${C.pasos.map(([t, d], i) => `<div class="m-paso"><span class="m-nombre">${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="m-club">
        <div class="m-sube" data-revela><span class="m-cap m-taupe">Club CAYLA</span><h2 class="m-titulo" style="margin-top:16px">Tu cuenta es tu <em>pasaporte</em></h2>
          <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span class="m-taupe">${d}</span></li>`).join("")}</ul>
          <a class="m-btn" href="#entrar">Crear mi cuenta</a></div>
        <div class="m-pasaporte" aria-hidden="true"><span class="m-cap">CAYLA · Club</span><div><span class="m-coord">Miembro desde 2026</span><div class="m-nombre">Tu nombre aquí</div></div><div class="m-sello" data-sello><span>Club<br>CAYLA<br>Trujillo<br>Arequipa</span></div></div>
      </section>
      <section class="m-seccion">
        <div class="m-seccion-cab"><h2 class="m-titulo m-sube" data-revela>Nuestras <em>tiendas</em></h2><span class="m-cap m-taupe">Recoge en la que te quede cerca</span></div>
        <div class="m-tiendas">${["tru", "aqp"].map((k, i) => { const t = C.tiendas.find((x) => x.id === k); return `<div class="m-tienda m-sube" data-revela style="--i:${i}">${mapa({ vista: recorte(k), rotulos: false, clase: "solo-" + k, anillos: { tru: k === "tru" ? 1 : 0, aqp: k === "aqp" ? 1 : 0 } })}<div><span class="m-coord">${SEDES[k].coord}</span><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="m-taupe">${t.horario}</p><div class="m-acciones"><a class="m-btn m-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="m-link" href="#portada">Cómo llegar</a></div></div></div>`; }).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="m-cat-cab"><h1 class="m-display m-letras" data-letras style="font-size:clamp(60px,9cqi,140px)">Ropa</h1><span class="m-cap m-taupe"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="m-filtros m-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["tru", "Trujillo"], ["aqp", "Arequipa"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="m-rejilla">${C.prendas.map((p, i) => obra(p, i % 3, true)).join("")}</div>
      <p class="m-seccion m-taupe" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      const clase = (n) => (n <= 0 ? "m-taupe" : n === 1 ? "m-ultima" : "m-hay");
      return `${cab()}
      <section class="m-ficha">
        <div><div class="m-papel"><img src="${C.foto(p)}" alt="${p.nombre}"></div></div>
        <div class="m-panel">
          <div><a class="m-cap m-taupe" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="m-precio m-num">${C.precio(p.precio)}</div>
          <div class="m-campo"><span class="m-cap">Color</span>
            <div class="m-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="m-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="m-campo"><div class="m-campo-cab"><span class="m-cap">Talla</span><a class="m-link m-taupe" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="m-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="m-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <div class="m-mini">${mapa({ rotulos: false, anillos: { tru: Math.min(2.4, 0.5 + p.stock.tru * 0.4), aqp: Math.min(2.4, 0.5 + p.stock.aqp * 0.4) } })}
            <dl><div><dt>Trujillo</dt><dd class="${clase(p.stock.tru)}">${C.stockFrase(p.stock.tru)}</dd></div><div><dt>Arequipa</dt><dd class="${clase(p.stock.aqp)}">${C.stockFrase(p.stock.aqp)}</dd></div></dl></div>
          <button class="m-btn" data-agregar="${p.id}"><span data-texto>Agregar a la bolsa</span></button>
          <p class="m-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="m-taupe" style="margin:-14px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="m-seccion"><div class="m-seccion-cab"><h2 class="m-titulo m-sube" data-revela>Va <em>con</em></h2></div><div class="m-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="m-cat-cab"><h1 class="m-display m-letras" data-letras style="font-size:clamp(56px,8.4cqi,130px)">Tu bolsa</h1><span class="m-cap m-taupe">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="m-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:22px 0;border-top:1px solid var(--sand)">Tu bolsa está vacía. <a class="m-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="m-linea" style="--i:${i}">
            <a class="m-papel" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="m-nombre" href="#prenda/${p.id}">${p.nombre}</a><span class="m-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="m-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="m-num m-precio-linea">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="m-resumen">
          <div data-antes-de-separar style="display:grid;gap:20px">
            <div class="m-campo"><span class="m-cap">Recógelo en</span>
              ${mapa({ vista: "60 200 700 700", conMarcador: true, rotulos: true })}
              <div data-grupo="tienda" style="display:grid;gap:8px">${["tru", "aqp"].map((k) => { const t = C.tiendas.find((x) => x.id === k); return `<button class="m-tienda-op" data-valor="${t.id}" aria-pressed="false"><b class="m-nombre" style="font-size:20px">${t.ciudad}</b><span class="m-taupe">${t.direccion}</span></button>`; }).join("")}</div></div>
            <div class="m-total"><span>Total <span class="m-taupe">· pagas al recoger</span></span><b class="m-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="m-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="m-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p class="m-taupe" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="m-listo" data-confirmacion hidden>
            <div class="m-sello" aria-hidden="true"><span>Separado<br><b data-numero style="font-size:15px;letter-spacing:.1em">${C.deEjemplo.numero}</b><br>CAYLA</span></div>
            <span class="m-cap m-taupe">Separación N.º ${C.deEjemplo.numero} · por confirmar</span>
            <h2 tabindex="-1">Te la guardamos en <em data-tienda-elegida></em></h2>
            <p class="m-taupe">Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="m-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="m-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      return `${cab()}
      <section class="m-entrar">
        <form class="m-form" novalidate>
          <span class="m-cap m-taupe">Tu cuenta CAYLA</span>
          <h1 class="m-display m-letras" data-letras>Entrar</h1>
          <p class="m-taupe" style="margin:-6px 0 6px">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p>
          <label><span class="m-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="m-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="m-btn" type="submit">Entrar</button>
          <a class="m-link m-taupe" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <p style="margin:6px 0 0;padding-top:18px;border-top:1px solid var(--sand)">¿Todavía no tienes cuenta?</p>
          <a class="m-btn m-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
        <div class="m-carta">${mapa()}<div class="m-carta-pie"><span class="m-cap">Trujillo · Arequipa</span><span class="m-coord">Dos tiendas, una cuenta</span></div></div>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de K ──
  let quitar = [];
  const limpiar = () => { quitar.forEach((f) => f()); quitar = []; };

  // La costa y la ruta se dibujan solas, de norte a sur, cuando el mapa aparece.
  function dibujarMapas(lienzo) {
    const mapas = [...lienzo.querySelectorAll(".m-mapa")];
    if (M.calma() || !mapas.length) return;
    mapas.forEach((svg) => {
      svg.querySelectorAll("[data-trazo], [data-ruta]").forEach((p) => { const L = p.getTotalLength(); p.dataset.largo = L; p.style.strokeDasharray = p.matches("[data-ruta]") ? "" : L; p.style.strokeDashoffset = p.matches("[data-ruta]") ? "" : L; if (p.matches("[data-ruta]")) p.style.opacity = "0"; });
      svg.querySelectorAll(".sede, .anillo, text").forEach((x) => (x.style.opacity = "0"));
    });
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      const svg = e.target, costa = svg.querySelector("[data-trazo]"), ruta = svg.querySelector("[data-ruta]");
      costa.animate([{ strokeDashoffset: costa.dataset.largo }, { strokeDashoffset: 0 }], { duration: 2400, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
      svg.querySelectorAll("text").forEach((x, i) => x.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 1400 + i * 80, fill: "forwards" }));
      svg.querySelectorAll(".sede").forEach((x, i) => x.animate([{ opacity: 0, transform: "scale(0)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 1700 + i * 500, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" }));
      svg.querySelectorAll(".anillo").forEach((x) => setTimeout(() => (x.style.opacity = ""), 2400));
      if (ruta) ruta.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1200, delay: 2600, fill: "forwards" });
    }), { threshold: 0.3 });
    mapas.forEach((m) => { m.querySelectorAll(".sede").forEach((x) => { x.style.transformBox = "fill-box"; x.style.transformOrigin = "center"; }); io.observe(m); });
    quitar.push(() => io.disconnect());
  }

  // Los pasos: la ruta llega a cada uno mientras bajas.
  function ruta(lienzo) {
    const caja = lienzo.querySelector("[data-ruta-pasos]");
    if (!caja) return;
    const pasos = [...caja.children];
    if (M.calma()) { pasos.forEach((p) => p.classList.add("llegado")); return; }
    let pedido = false;
    const mirar = () => { pedido = false; const r = caja.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight * 0.8 - r.top) / (innerHeight * 0.6))); pasos.forEach((x, i) => x.classList.toggle("llegado", p >= (i + 0.3) / pasos.length)); };
    const alBajar = () => { if (!pedido) { pedido = true; requestAnimationFrame(mirar); } };
    addEventListener("scroll", alBajar, { passive: true }); quitar.push(() => removeEventListener("scroll", alBajar)); mirar();
  }

  // El sello del pasaporte se estampa cuando lo ves.
  function sellos(lienzo) {
    const s = lienzo.querySelector("[data-sello]");
    if (!s || M.calma()) return;
    s.style.opacity = "0";
    const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { io.disconnect(); s.style.opacity = ""; s.classList.add("estampa"); } }, { threshold: 0.6 });
    io.observe(s); quitar.push(() => io.disconnect());
  }

  // Elegir dónde recoges: el marcador viaja por la ruta hasta esa ciudad.
  let enRuta = 0;
  function moverMarcador(destino) {
    const svg = document.querySelector("#lienzo .m-resumen .m-mapa"), m = svg && svg.querySelector("[data-marcador]"), r = svg && svg.querySelector("[data-ruta]");
    if (!m || !r) return;
    const L = r.getTotalLength(), hasta = destino === "aqp" ? 1 : 0, desde = enRuta;
    enRuta = hasta;
    const pos = (k) => r.getPointAtLength(L * k);
    if (M.calma()) { const p = pos(hasta); m.setAttribute("cx", p.x); m.setAttribute("cy", p.y); return; }
    const t0 = performance.now(), ms = 1100;
    const paso = (t) => { const k = Math.min(1, (t - t0) / ms), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, p = pos(desde + (hasta - desde) * e); m.setAttribute("cx", p.x); m.setAttribute("cy", p.y); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  }

  function montar(pantalla, lienzo) {
    limpiar();
    enRuta = 0;
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll("[data-letras]").forEach((h) => M.letras(h));
    lienzo.querySelectorAll(".m-panel > *, .m-form > *").forEach((x, i) => x.style.setProperty("--f", i));
    requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    M.revelar(lienzo);
    lienzo.querySelectorAll('.m-filtros [role="group"]').forEach((g) => M.indicador(g));
    dibujarMapas(lienzo); ruta(lienzo); sellos(lienzo);
    if (pantalla === "bolsa") { const t = lienzo.querySelector("[data-total]"); if (t) M.contar(t, Number(t.dataset.total), 1300, (n) => C.precio(Math.round(n))); }
  }

  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", (e) => { M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")); M.indicador(e.detail.boton.closest('[role="group"]')); });
  document.addEventListener("cayla:elegido", (e) => { if (e.detail.grupo === "tienda") moverMarcador(e.detail.boton.dataset.valor); });
  document.addEventListener("cayla:agregado", (e) => {
    const b = e.detail.boton, texto = b.querySelector("[data-texto]");
    texto.textContent = "Agregada a tu bolsa";
    M.volar(document.querySelector("#lienzo .m-ficha .m-papel img"), document.querySelector("#lienzo .m-ir-bolsa b")).then(() => M.latir(document.querySelector("#lienzo .m-ir-bolsa b")));
    setTimeout(() => { texto.textContent = "Agregar a la bolsa"; delete b.dataset.hecho; }, 2600);
  });
  document.addEventListener("cayla:separado", (e) => { const s = e.detail.listo.querySelector(".m-sello"); s.classList.remove("estampa"); void s.offsetWidth; s.classList.add("estampa"); M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1300, (n) => String(Math.round(n)).padStart(4, "0")); });
  addEventListener("resize", () => document.querySelectorAll('#lienzo .m-filtros [role="group"]').forEach((g) => M.indicador(g)));

  window.DIRECCION = { nombre: "K · Sedes", pantallas, montar, transicion: true };
})();
</script>
<script src="marco.js"></script>
</body>
