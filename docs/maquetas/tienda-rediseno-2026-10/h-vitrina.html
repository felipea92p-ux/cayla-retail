<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H · Vitrina — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;600&family=Manrope:wght@400;500;600&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── H · VITRINA ─ inspirada en la manera del modernismo italiano: planos de color (camel, negro y blanco hueso) armados como
   una arquitectura, mayúsculas geométricas abiertas, una sola gota de rojo laca. La firma: la portada es una vitrina. Los
   planos entran deslizándose, cada prenda descansa en su nicho sobre un pedestal y un reflejo de vidrio cruza una vez. ── */
#lienzo {
  --hueso: #f3f1ec; --camel: #c49a6c; --camel-claro: #e3cdb2; --negro: #151311; --gris: #5e5953; --laca: #a3201e; --linea: #d9d3c8;
  --gutter: clamp(16px, 4cqi, 64px);
  background: var(--hueso); color: var(--negro); overflow-x: clip;
  font: 400 15px/1.6 "Manrope", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 2px solid var(--laca); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.v-cap { font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.v-display { margin: 0; font-family: "Josefin Sans", sans-serif; font-weight: 200; text-transform: uppercase; letter-spacing: .14em; line-height: .98; font-size: clamp(48px, 8.4cqi, 140px); }
.v-titulo { margin: 0; font-family: "Josefin Sans", sans-serif; font-weight: 300; text-transform: uppercase; letter-spacing: .16em; line-height: 1.05; font-size: clamp(26px, 3.2cqi, 46px); }
.v-gris { color: var(--gris); }
.v-num { font-variant-numeric: tabular-nums; }

.v-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; padding: 0 var(--gutter); background: var(--hueso); border-bottom: 1px solid var(--negro); }
.v-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.v-cab nav:last-child { justify-content: flex-end; }
.v-cab a { text-decoration: none; }
.v-cab nav a { padding: 6px 0; background: linear-gradient(var(--negro), var(--negro)) no-repeat 0 100% / 0% 2px; }
.v-cab nav a:hover { background-size: 100% 2px; }
.v-logo { display: flex; align-items: center; gap: 10px; }
.v-logo img { width: 30px; height: auto; }
.v-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.v-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.v-menu i { display: block; height: 1.5px; background: currentColor; margin: 5px 0; }
.v-ir-bolsa { display: inline-flex; align-items: center; gap: 8px; }
.v-ir-bolsa b { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; background: var(--negro); color: var(--hueso); font-weight: 500; font-size: 11px; }

.v-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; border: 0; background: var(--negro); color: var(--hueso) !important; font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; cursor: pointer; overflow: hidden; isolation: isolate; }
.v-btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--laca); transform: scaleY(0); transform-origin: 50% 100%; }
.v-btn:hover::before { transform: scaleY(1); }
.v-btn--claro { background: var(--hueso); color: var(--negro) !important; box-shadow: inset 0 0 0 1px var(--negro); }
.v-btn--claro:hover { color: var(--hueso) !important; }
.v-btn--claro::before { background: var(--negro); }
.v-link { text-decoration: none; padding-bottom: 3px; background: linear-gradient(currentColor, currentColor) no-repeat 0 100% / 100% 1px; }
.v-link:hover { background-size: 0% 1px; background-position: 100% 100%; }

/* El nicho: un hueco en la pared con su sombra; la prenda descansa sobre un pedestal */
.v-nicho { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--camel-claro); overflow: hidden; text-decoration: none; box-shadow: inset 0 26px 36px -24px #0000006b, inset 0 -8px 16px -12px #00000033; }
.v-nicho::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(to bottom, #ffffff70, #ffffff00 58%); opacity: 0; }
.v-nicho img { position: absolute; left: 10%; right: 10%; bottom: 15%; width: 80%; height: 74%; object-fit: contain; object-position: 50% 100%; mix-blend-mode: multiply; z-index: 1; }
.v-pedestal { position: absolute; left: 22%; right: 22%; bottom: 9%; height: 7%; background: linear-gradient(to bottom, #f3f1ec, #ddd4c6); box-shadow: 0 10px 18px -8px #00000059; }
.v-pedestal::after { content: ""; position: absolute; left: -6%; right: -6%; top: 100%; height: 26px; background: radial-gradient(closest-side, #0000003d, #00000000); }
.v-fig { margin: 0; }
.v-pie-foto { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding-top: 14px; }
.v-pie-foto b { font-weight: 600; }
.v-pie-foto a { text-decoration: none; }
.v-pie-foto .v-cap { grid-column: 1 / -1; color: var(--gris); }
.v-dispo { grid-column: 1 / -1; font-size: 13px; color: var(--gris); }

.v-seccion { padding: clamp(72px, 10cqi, 140px) var(--gutter) 0; }
.v-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(28px, 4cqi, 52px); }
.v-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; }

/* Portada: la vitrina */
.v-vitrina { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 68px; min-height: calc(100vh - 68px); overflow: hidden; border-bottom: 1px solid var(--negro); }
.v-vitrina::after { content: ""; position: absolute; inset: -30% -60%; z-index: 5; pointer-events: none; background: linear-gradient(112deg, #ffffff00 42%, #ffffff42 48%, #ffffff14 52%, #ffffff00 58%); transform: translateX(-70%); }
.v-plano-camel { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 26px; padding: clamp(28px, 5cqi, 80px); background: var(--camel); }
.v-plano-camel p { max-width: 34ch; margin: 0; font-size: 17px; }
.v-plano-camel .v-cap { color: var(--negro); }
.v-gota { position: absolute; top: clamp(28px, 5cqi, 80px); right: clamp(28px, 5cqi, 80px); width: 22px; height: 22px; background: var(--laca); }
.v-hueco { position: relative; display: grid; align-content: center; padding: clamp(24px, 4cqi, 56px); background: var(--hueso); }
.v-hueco .v-nicho { aspect-ratio: 3 / 4; }
.v-hueco figcaption { display: flex; justify-content: space-between; padding-top: 14px; }
.v-plano-negro { position: relative; display: grid; place-items: center; background: var(--negro); color: var(--hueso); }
.v-plano-negro span { writing-mode: vertical-rl; transform: rotate(180deg); }
.v-banda { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--camel); }
.v-banda .v-fig { padding: clamp(18px, 3cqi, 40px); border-right: 1px solid #15131126; }
.v-banda .v-fig:last-child { border-right: 0; }
.v-pasos { display: grid; grid-template-columns: repeat(4, 1fr); }
.v-paso { position: relative; display: grid; align-content: space-between; gap: 40px; min-height: 260px; padding: clamp(20px, 3cqi, 36px); }
.v-paso:nth-child(1) { background: var(--camel-claro); }
.v-paso:nth-child(2) { background: var(--camel); }
.v-paso:nth-child(3) { background: var(--negro); color: var(--hueso); }
.v-paso:nth-child(3) p { color: #c9c3ba; }
.v-paso:nth-child(4) { background: var(--hueso); box-shadow: inset 0 0 0 1px var(--negro); }
.v-paso .v-numero { font-family: "Josefin Sans", sans-serif; font-weight: 200; font-size: 76px; line-height: .8; }
.v-paso h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
.v-paso p { margin: 0; color: var(--gris); }
.v-paso:nth-child(2) p { color: #3b3631; }
.v-club { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6cqi, 112px); align-items: center; margin-top: clamp(72px, 10cqi, 140px); padding: clamp(56px, 8cqi, 112px) var(--gutter); background: var(--negro); color: var(--hueso); }
.v-club .v-gris { color: #c9c3ba; }
.v-club ul { list-style: none; margin: 28px 0 34px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.v-club li { padding: 16px 0; border-top: 1px solid #ffffff24; }
.v-club li b { display: block; font-weight: 600; }
.v-club .v-btn { background: var(--camel); color: var(--negro) !important; }
.v-tarjeta { justify-self: center; display: grid; align-content: space-between; width: min(440px, 100%); aspect-ratio: 1.586; padding: 28px; background: var(--camel); color: var(--negro); }
.v-tarjeta .v-gota { position: static; width: 16px; height: 16px; }
.v-tiendas { display: grid; grid-template-columns: 1fr 1fr; }
.v-tienda { padding: clamp(28px, 4cqi, 56px); }
.v-tienda:first-child { background: var(--camel); }
/* Sobre camel, el gris no alcanza para leer (2,8 a 1): ahí el texto tenue es un marrón casi negro (4,7 a 1) */
.v-tienda:first-child .v-gris, .v-banda .v-pie-foto .v-cap, .v-banda .v-dispo, .v-resumen .v-gris { color: #3b3631; }
.v-tienda:last-child { background: var(--negro); color: var(--hueso); }
.v-tienda:last-child .v-gris { color: #c9c3ba; }
.v-tienda:last-child .v-btn--claro { background: var(--negro); color: var(--hueso) !important; box-shadow: inset 0 0 0 1px var(--hueso); }
.v-tienda h3 { margin: 0 0 18px; font-family: "Josefin Sans", sans-serif; font-weight: 200; text-transform: uppercase; letter-spacing: .1em; font-size: clamp(40px, 5.4cqi, 84px); line-height: 1; }
.v-tienda p { margin: 0 0 4px; }
.v-tienda .v-acciones { margin-top: 24px; }
.v-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 104px) var(--gutter) 40px; border-top: 1px solid var(--negro); margin-top: clamp(72px, 10cqi, 140px); }
.v-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.v-pie a { text-decoration: none; }
.v-pie a:hover { color: var(--laca); }

/* Catálogo */
.v-cat-cab { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 0; border-bottom: 1px solid var(--negro); }
.v-cat-cab > div:first-child { padding: clamp(36px, 5cqi, 72px) var(--gutter) 24px; background: var(--camel); }
.v-cat-cab > div:last-child { display: grid; place-items: center; height: 100%; padding: 0 clamp(20px, 4cqi, 56px); background: var(--negro); color: var(--hueso); }
.v-filtros { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 28px; padding: 14px var(--gutter); border-bottom: 1px solid var(--linea); }
.v-filtros [role="group"] { position: relative; display: flex; flex-wrap: wrap; gap: 2px; }
.v-filtros button { position: relative; z-index: 1; height: 38px; padding: 0 14px; border: 0; background: none; cursor: pointer; color: var(--gris); }
.v-filtros button:hover { color: var(--negro); }
.v-filtros button[aria-pressed="true"] { color: var(--hueso); }
.v-filtros .indicador { position: absolute; left: 0; top: 0; z-index: 0; background: var(--negro); pointer-events: none; }
.v-rejilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(32px, 4cqi, 56px) clamp(14px, 2cqi, 28px); padding: clamp(32px, 4cqi, 52px) var(--gutter) 0; }
.v-rejilla [hidden] { display: none; }

/* Prenda */
.v-ficha { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); border-bottom: 1px solid var(--negro); }
.v-ficha-vitrina { padding: clamp(24px, 4cqi, 64px); background: var(--camel); }
.v-ficha-vitrina .v-nicho { aspect-ratio: 4 / 4.6; }
.v-panel { position: sticky; top: 68px; align-self: start; display: grid; gap: 24px; padding: clamp(24px, 4cqi, 64px); }
.v-panel h1 { margin: 6px 0 0; font-family: "Josefin Sans", sans-serif; font-weight: 300; text-transform: uppercase; letter-spacing: .1em; font-size: clamp(32px, 3.6cqi, 52px); line-height: 1.04; }
.v-panel .v-precio { font-family: "Josefin Sans", sans-serif; font-weight: 300; font-size: 30px; letter-spacing: .06em; }
.v-campo { display: grid; gap: 10px; }
.v-campo-cab { display: flex; justify-content: space-between; }
.v-opciones { position: relative; display: flex; flex-wrap: wrap; gap: 6px; }
.v-talla { position: relative; z-index: 1; min-width: 52px; height: 48px; padding: 0 14px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--linea); cursor: pointer; font-family: "Josefin Sans", sans-serif; font-weight: 600; letter-spacing: .1em; }
.v-talla:hover { box-shadow: inset 0 0 0 1px var(--negro); }
.v-talla[aria-pressed="true"] { color: var(--hueso); }
[data-grupo="talla"] .indicador { position: absolute; left: 0; top: 0; z-index: 0; background: var(--negro); pointer-events: none; }
.v-color { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 6px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--linea); cursor: pointer; }
.v-color i { width: 32px; height: 32px; box-shadow: inset 0 0 0 1px #0002; }
.v-color[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--negro); }
.v-stock { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
.v-stock div { padding: 14px 16px; }
.v-stock div:first-child { background: var(--camel-claro); }
.v-stock div:last-child { background: var(--negro); color: var(--hueso); }
.v-stock dt { font-size: 12px; opacity: .8; }
.v-stock dd { margin: 4px 0 0; font-family: "Josefin Sans", sans-serif; font-weight: 300; font-size: 22px; letter-spacing: .04em; }
.v-aviso { min-height: 1.6em; margin: -10px 0 0; font-size: 14px; }
.v-vacon { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(14px, 2cqi, 28px); }

/* Bolsa */
.v-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); padding: 32px var(--gutter) 0; align-items: start; }
.v-linea { display: grid; grid-template-columns: 112px 1fr auto; gap: 22px; padding: 18px 0; border-bottom: 1px solid var(--linea); align-items: start; }
.v-linea:first-child { border-top: 1px solid var(--negro); }
.v-linea .v-nicho { aspect-ratio: 4 / 5; }
.v-linea h3 { margin: 0; font-family: "Josefin Sans", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .08em; font-size: 18px; }
.v-linea .v-cap { display: block; margin-top: 6px; color: var(--gris); }
.v-linea [data-hay-aqp] { display: block; margin-top: 8px; font-size: 13px; color: var(--gris); }
.v-linea [data-falta="true"] { color: var(--laca); }
.v-quitar { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--gris); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.v-resumen { position: sticky; top: 100px; display: grid; gap: 22px; padding: 30px; background: var(--camel); }
.v-tienda-op { display: grid; gap: 2px; width: 100%; padding: 16px 18px; border: 0; background: var(--hueso); text-align: left; cursor: pointer; }
.v-tienda-op:hover { box-shadow: inset 0 0 0 1px var(--negro); }
.v-tienda-op[aria-pressed="true"] { background: var(--negro); color: var(--hueso); }
.v-tienda-op[aria-pressed="true"] .v-gris { color: #c9c3ba; }
.v-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid #15131133; }
.v-total b { font-family: "Josefin Sans", sans-serif; font-weight: 300; font-size: 32px; letter-spacing: .04em; }
.v-listo { display: grid; gap: 0; }
.v-listo > * { padding: 22px; }
.v-listo .v-listo-num { background: var(--negro); color: var(--hueso); }
.v-listo .v-listo-num b { display: block; font-family: "Josefin Sans", sans-serif; font-weight: 200; font-size: 54px; letter-spacing: .1em; line-height: 1; margin-top: 8px; }
.v-listo .v-listo-texto { background: var(--hueso); display: grid; gap: 14px; }
.v-listo h2 { margin: 0; font-family: "Josefin Sans", sans-serif; font-weight: 300; text-transform: uppercase; letter-spacing: .08em; font-size: 26px; line-height: 1.15; }
.v-listo p { margin: 0; }
.v-mensaje { margin: 0; padding: 14px 16px; background: var(--camel-claro); font-size: 14px; white-space: pre-line; }

/* Entrar */
.v-entrar { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 68px); border-bottom: 1px solid var(--negro); }
.v-entrar-plano { position: relative; display: grid; align-content: end; gap: 20px; padding: clamp(28px, 5cqi, 80px); background: var(--negro); color: var(--hueso); overflow: hidden; }
.v-entrar-plano .v-nicho { position: absolute; right: 12%; top: 12%; width: 38%; background: var(--camel-claro); }
.v-form { display: grid; align-content: center; gap: 20px; width: min(440px, 100%); margin: 0 auto; padding: 48px var(--gutter); }
.v-form label { display: grid; gap: 8px; }
.v-form input { height: 52px; padding: 0 16px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--linea); font: inherit; color: inherit; }
.v-form input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--negro); }
.v-form .v-btn { width: 100%; }

@media (prefers-reduced-motion: no-preference) {
  .v-cab nav a { transition: background-size .5s cubic-bezier(.76,0,.24,1); }
  .v-btn::before { transition: transform .55s cubic-bezier(.76,0,.24,1); }
  .v-btn { transition: color .45s; }
  .v-link { transition: background-size .6s cubic-bezier(.76,0,.24,1); }
  .v-nicho::before { transition: opacity .7s; }
  .v-fig:hover .v-nicho::before, .v-hueco:hover .v-nicho::before { opacity: 1; }
  .v-nicho img { transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .v-fig:hover .v-nicho img { transform: translateY(-4%); }
  .v-pedestal::after { transition: transform 1.2s cubic-bezier(.2,.7,.2,1), opacity 1.2s; }
  .v-fig:hover .v-pedestal::after { transform: scaleX(.82); opacity: .7; }
  .v-filtros .indicador, [data-grupo="talla"] .indicador { transition: transform .55s cubic-bezier(.76,0,.24,1), width .55s cubic-bezier(.76,0,.24,1), height .55s; }
  .v-filtros button, .v-talla { transition: color .45s, box-shadow .3s; }
  .v-tienda-op { transition: background-color .4s, color .4s, box-shadow .3s; }
  .v-form input { transition: box-shadow .35s; }

  /* La vitrina se arma: cada plano entra deslizándose desde su lado, y un reflejo de vidrio cruza una vez */
  .v-plano-camel { clip-path: inset(0 100% 0 0); transition: clip-path 1.3s cubic-bezier(.76,0,.24,1) .1s; }
  .v-hueco { clip-path: inset(100% 0 0 0); transition: clip-path 1.2s cubic-bezier(.76,0,.24,1) .45s; }
  .v-plano-negro { clip-path: inset(0 0 100% 0); transition: clip-path 1.1s cubic-bezier(.76,0,.24,1) .7s; }
  .listo .v-plano-camel, .listo .v-hueco, .listo .v-plano-negro { clip-path: inset(0); }
  .v-gota { transform: scale(0); transition: transform .8s cubic-bezier(.2,.7,.2,1) 1.4s; }
  .listo .v-gota { transform: none; }
  .listo .v-vitrina::after { animation: v-reflejo 2.6s 1.5s cubic-bezier(.4,0,.2,1) both; }
  @keyframes v-reflejo { from { transform: translateX(-70%); } to { transform: translateX(70%); } }
  .v-hueco .v-nicho img { opacity: 0; transform: translateY(-14%); transition: opacity 1s 1.2s, transform 1.4s cubic-bezier(.2,.7,.2,1) 1.2s; }
  .listo .v-hueco .v-nicho img { opacity: 1; transform: none; }
  .v-letras .letra { display: inline-block; opacity: 0; transform: translateX(-.4em); transition: opacity .7s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.6s + var(--l, 0) * 50ms); }
  .listo .v-letras .letra { opacity: 1; transform: none; }
  .v-entra { opacity: 0; transform: translateY(12px); transition: opacity .8s, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(1s + var(--s, 0) * 100ms); }
  .listo .v-entra { opacity: 1; transform: none; }
  /* Al bajar: cada nicho se abre desde abajo y la prenda baja hasta su pedestal */
  .v-fig[data-revela] .v-nicho { clip-path: inset(100% 0 0 0); transition: clip-path 1.1s cubic-bezier(.76,0,.24,1); transition-delay: calc(var(--i, 0) * 110ms); }
  .v-fig.visto .v-nicho { clip-path: inset(0); }
  .v-fig[data-revela] .v-nicho img { opacity: 0; translate: 0 -16%; transition: opacity .9s, translate 1.3s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.45s + var(--i, 0) * 110ms); }
  .v-fig.visto .v-nicho img { opacity: 1; translate: 0 0; }
  .v-fig[data-revela] .v-pie-foto { opacity: 0; transition: opacity .8s; transition-delay: calc(.6s + var(--i, 0) * 110ms); }
  .v-fig.visto .v-pie-foto { opacity: 1; }
  /* Un panel del color de la pared se levanta y descubre cada paso (el recorte no va en el paso: el detector no lo vería) */
  .v-paso[data-revela]::after { content: ""; position: absolute; inset: 0; background: var(--hueso); transform-origin: 50% 0; transition: transform 1s cubic-bezier(.76,0,.24,1); transition-delay: calc(var(--i, 0) * 130ms); }
  .v-paso.visto::after { transform: scaleY(0); }
  [data-revela].v-sube { opacity: 0; transform: translateY(24px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 120ms); }
  [data-revela].v-sube.visto { opacity: 1; transform: none; }
  .v-tienda[data-revela] > * { opacity: 0; transform: translateY(20px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: .25s; }
  .v-tienda.visto > * { opacity: 1; transform: none; }
  .v-panel > * { opacity: 0; transform: translateX(20px); transition: opacity .8s, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.4s + var(--f, 0) * 70ms); }
  .listo .v-panel > * { opacity: 1; transform: none; }
  .v-ficha-vitrina { clip-path: inset(0 100% 0 0); transition: clip-path 1.2s cubic-bezier(.76,0,.24,1); }
  .listo .v-ficha-vitrina { clip-path: inset(0); }
  .v-ficha-vitrina .v-nicho img { opacity: 0; translate: 0 -12%; transition: opacity 1s .8s, translate 1.4s cubic-bezier(.2,.7,.2,1) .8s; }
  .listo .v-ficha-vitrina .v-nicho img { opacity: 1; translate: 0 0; }
  .v-bolsa-cuerpo .v-linea { animation: v-entra-k .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--i, 0) * 110ms); }
  .v-resumen { animation: v-plano-k 1.1s .25s cubic-bezier(.76,0,.24,1) both; }
  /* La separación se arma con tres planos que entran uno tras otro */
  .v-listo:not([hidden]) > * { animation: v-plano-k .9s cubic-bezier(.76,0,.24,1) both; }
  .v-listo:not([hidden]) > :nth-child(2) { animation-delay: .2s; }
  .v-entrar-plano { clip-path: inset(0 100% 0 0); transition: clip-path 1.2s cubic-bezier(.76,0,.24,1); }
  .listo .v-entrar-plano { clip-path: inset(0); }
  .v-form > * { animation: v-entra-k .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.5s + var(--f, 0) * 70ms); }
  @keyframes v-entra-k { from { opacity: 0; transform: translateY(20px); } }
  @keyframes v-plano-k { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }

  /* De una pantalla a otra: las puertas de la vitrina se abren desde el centro */
  ::view-transition-old(root) { animation: .6s cubic-bezier(.76,0,.24,1) both v-vt-sale; }
  ::view-transition-new(root) { animation: .9s cubic-bezier(.76,0,.24,1) both v-vt-puertas; }
  @keyframes v-vt-sale { to { opacity: .5; } }
  @keyframes v-vt-puertas { from { clip-path: inset(0 50% 0 50%); } to { clip-path: inset(0); } }
}

@container lienzo (max-width: 760px) {
  .v-cab { grid-template-columns: 40px 1fr auto; height: 58px; }
  .v-cab nav:first-child { display: none; }
  .v-menu { display: block; grid-column: 1; grid-row: 1; }
  .v-logo { grid-column: 2; justify-self: center; }
  .v-cab nav:last-child a:not(.v-ir-bolsa) { display: none; }
  .v-vitrina { grid-template-columns: 1fr; min-height: 0; }
  .v-plano-negro { min-height: 56px; }
  .v-plano-negro span { writing-mode: horizontal-tb; transform: none; }
  .v-plano-camel { min-height: 420px; }
  .v-banda, .v-tiendas { grid-template-columns: 1fr; }
  .v-banda .v-fig { border-right: 0; border-bottom: 1px solid #15131126; }
  .v-pasos { grid-template-columns: 1fr 1fr; }
  .v-paso { min-height: 200px; }
  .v-club, .v-ficha, .v-bolsa-cuerpo, .v-entrar { grid-template-columns: 1fr; }
  .v-club ul { grid-template-columns: 1fr; }
  .v-pie { grid-template-columns: 1fr 1fr; }
  .v-pie > :first-child { grid-column: 1 / -1; }
  .v-rejilla, .v-vacon { grid-template-columns: 1fr 1fr; gap: 28px 12px; }
  .v-vacon > :nth-child(n + 3) { display: none; }
  .v-pie-foto { grid-template-columns: 1fr; }
  .v-dispo { display: none; }
  .v-filtros [role="group"]:first-child { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--gutter)); }
  .v-filtros button { white-space: nowrap; }
  .v-panel, .v-resumen { position: static; }
  .v-linea { grid-template-columns: 84px 1fr; }
  .v-linea > .v-precio-linea { grid-column: 2; }
  .v-entrar-plano { min-height: 300px; }
  .v-cat-cab { grid-template-columns: 1fr; }
  .v-cat-cab > div:last-child { padding: 14px var(--gutter); justify-items: start; }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA, M = window.MOV;
  const logo = `<a class="v-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="v-cab v-cap">
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="v-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="v-ir-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="v-pie">
      <div>${logo}<p class="v-gris" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="v-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="v-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="v-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const nicho = (p, extra = "") => `<a class="v-nicho" href="#prenda/${p.id}" ${extra}><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"><i class="v-pedestal" aria-hidden="true"></i></a>`;
  const obra = (p, i, conCuenta) => `
    <figure class="v-fig" data-revela data-id="${p.id}" style="--i:${i}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      ${nicho(p)}
      <figcaption class="v-pie-foto">
        <a href="#prenda/${p.id}"><b>${p.nombre}</b></a>
        ${conCuenta ? `<span class="v-num">${C.precio(p.precio)}</span>` : `<a class="v-link" href="#entrar">Ver precio</a>`}
        <span class="v-cap">${C.nombreCat(p.cat)}</span>
        ${conCuenta ? `<span class="v-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;

  const pantallas = {
    portada() {
      const h = C.prenda("kalessi");
      return `${cab()}
      <section class="v-vitrina">
        <div class="v-plano-camel" data-plano="0.04">
          <i class="v-gota" aria-hidden="true"></i>
          <span class="v-cap v-entra">Llegó en los últimos 30 días</span>
          <h1 class="v-display v-letras" data-letras>Lo nuevo</h1>
          <p class="v-entra" style="--s:1">Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="v-acciones v-entra" style="--s:2"><a class="v-btn" href="#entrar">Crear mi cuenta</a><a class="v-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        <figure class="v-hueco" data-plano="-0.03" style="margin:0">${nicho(h)}<figcaption class="v-cap"><span>${h.nombre}</span><a class="v-link" href="#entrar">Ver precio</a></figcaption></figure>
        <div class="v-plano-negro v-cap" data-plano="0.09"><span>Arequipa · Trujillo</span></div>
      </section>
      <section class="v-seccion">
        <div class="v-seccion-cab"><h2 class="v-titulo v-sube" data-revela>En las tiendas</h2><a class="v-link v-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="v-banda">${["alba", "tiana", "luna"].map((x, i) => obra(C.prenda(x), i, false)).join("")}</div>
      </section>
      <section class="v-seccion">
        <div class="v-seccion-cab"><h2 class="v-titulo v-sube" data-revela>Así se separa</h2><span class="v-cap v-gris">Sin pagar en la web</span></div>
        <div class="v-pasos">${C.pasos.map(([t, d], i) => `<div class="v-paso" data-revela style="--i:${i}"><span class="v-numero">${i + 1}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join("")}</div>
      </section>
      <section class="v-club">
        <div class="v-sube" data-revela><span class="v-cap v-gris">Club CAYLA</span><h2 class="v-titulo" style="margin-top:16px">Tu cuenta ya es tu membresía</h2>
          <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span class="v-gris">${d}</span></li>`).join("")}</ul>
          <a class="v-btn" href="#entrar">Crear mi cuenta</a></div>
        <div class="v-tarjeta v-sube" data-revela aria-hidden="true"><div style="display:flex;justify-content:space-between;align-items:center"><span class="v-cap">CAYLA</span><i class="v-gota"></i></div><div><span class="v-cap" style="opacity:.7">Miembro del Club</span><div style="font-family:'Josefin Sans';font-weight:300;font-size:30px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px">Tu nombre aquí</div></div></div>
      </section>
      <section class="v-seccion" style="padding-left:0;padding-right:0">
        <div class="v-seccion-cab" style="padding:0 var(--gutter)"><h2 class="v-titulo v-sube" data-revela>Nuestras tiendas</h2><span class="v-cap v-gris">Recoge en la que te quede cerca</span></div>
        <div class="v-tiendas">${C.tiendas.map((t, i) => `<div class="v-tienda" data-revela style="--i:${i}"><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="v-gris">${t.horario}</p><div class="v-acciones"><a class="v-btn v-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="v-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="v-cat-cab"><div><h1 class="v-display v-letras" data-letras style="font-size:clamp(48px,8cqi,124px)">Ropa</h1></div><div class="v-cap"><span><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div></div>
      <div class="v-filtros v-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="v-rejilla">${C.prendas.map((p, i) => obra(p, i % 4, true)).join("")}</div>
      <p class="v-seccion v-gris" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 4);
      return `${cab()}
      <section class="v-ficha">
        <div class="v-ficha-vitrina">${nicho(p, 'data-principal')}</div>
        <div class="v-panel">
          <div><a class="v-cap v-gris" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="v-precio v-num">${C.precio(p.precio)}</div>
          <div class="v-campo"><span class="v-cap">Color</span>
            <div class="v-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="v-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="v-campo"><div class="v-campo-cab"><span class="v-cap">Talla</span><a class="v-link v-gris" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="v-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="v-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="v-stock">${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd>${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="v-btn" data-agregar="${p.id}"><span data-texto>Agregar a la bolsa</span></button>
          <p class="v-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="v-gris" style="margin:-14px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="v-seccion"><div class="v-seccion-cab"><h2 class="v-titulo v-sube" data-revela>Va con</h2></div><div class="v-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="v-cat-cab"><div><h1 class="v-display v-letras" data-letras style="font-size:clamp(44px,7cqi,108px)">Tu bolsa</h1></div><div class="v-cap"><span>${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div></div>
      <section class="v-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:22px 0;border-top:1px solid var(--negro)">Tu bolsa está vacía. <a class="v-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="v-linea" style="--i:${i}">
            ${nicho(p)}
            <div><h3>${p.nombre}</h3><span class="v-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="v-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="v-num v-precio-linea">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="v-resumen">
          <div data-antes-de-separar style="display:grid;gap:22px">
            <div class="v-campo"><span class="v-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:6px">${C.tiendas.map((t) => `<button class="v-tienda-op" data-valor="${t.id}" aria-pressed="false"><b style="font-family:'Josefin Sans';font-weight:600;letter-spacing:.14em;text-transform:uppercase">${t.ciudad}</b><span class="v-gris">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="v-total"><span>Total <span style="opacity:.75">· pagas al recoger</span></span><b class="v-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="v-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="v-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p style="margin:0;font-size:13px;opacity:.8">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="v-listo" data-confirmacion hidden>
            <div class="v-listo-num v-cap">Separación · por confirmar<b data-numero>${C.deEjemplo.numero}</b></div>
            <div class="v-listo-texto">
              <h2 tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
              <p class="v-gris">Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
              <button class="v-btn" data-whatsapp>Mandar por WhatsApp</button>
              <p class="v-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
            </div>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      const p = C.prenda("cuello-v");
      return `${cab()}
      <section class="v-entrar">
        <div class="v-entrar-plano">${nicho(p)}<span class="v-cap" style="color:#c9c3ba">Tu cuenta CAYLA</span><h1 class="v-display v-letras" data-letras style="font-size:clamp(48px,6.6cqi,104px)">Entrar</h1><p style="margin:0;max-width:30ch;color:#c9c3ba">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p></div>
        <form class="v-form" novalidate>
          <label><span class="v-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="v-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="v-btn" type="submit">Entrar</button>
          <a class="v-link v-gris" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <p style="margin:12px 0 0;padding-top:20px;border-top:1px solid var(--linea)">¿Todavía no tienes cuenta?</p>
          <a class="v-btn v-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de H ──
  let quitar = [];
  const limpiar = () => { quitar.forEach((f) => f()); quitar = []; };

  // Los planos de la vitrina se mueven a distinto ritmo al bajar: la vitrina tiene fondo.
  function planos(lienzo) {
    const ps = [...lienzo.querySelectorAll("[data-plano]")];
    if (!ps.length || M.calma() || lienzo.clientWidth < 760) return;
    let pedido = false;
    const mover = () => { pedido = false; ps.forEach((p) => (p.style.translate = `0 ${scrollY * Number(p.dataset.plano) * -1}px`)); };
    const alBajar = () => { if (!pedido) { pedido = true; requestAnimationFrame(mover); } };
    addEventListener("scroll", alBajar, { passive: true });
    quitar.push(() => removeEventListener("scroll", alBajar));
  }

  function montar(pantalla, lienzo) {
    limpiar();
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll("[data-letras]").forEach((h) => M.letras(h));
    lienzo.querySelectorAll(".v-panel > *, .v-form > *").forEach((x, i) => x.style.setProperty("--f", i));
    requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    M.revelar(lienzo);
    lienzo.querySelectorAll('.v-filtros [role="group"], [data-grupo="talla"]').forEach((g) => M.indicador(g));
    planos(lienzo);
    if (pantalla === "bolsa") { const t = lienzo.querySelector("[data-total]"); if (t) M.contar(t, Number(t.dataset.total), 1200, (n) => C.precio(Math.round(n))); }
  }

  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", (e) => { M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")); M.indicador(e.detail.boton.closest('[role="group"]')); });
  document.addEventListener("cayla:elegido", (e) => { const g = e.detail.boton.closest("[data-grupo]"); if (g.dataset.grupo === "talla") M.indicador(g); });
  // Al agregar: la prenda se levanta del pedestal y vuela a la bolsa; el pedestal queda vacío un momento.
  document.addEventListener("cayla:agregado", (e) => {
    const b = e.detail.boton, texto = b.querySelector("[data-texto]"), img = document.querySelector("#lienzo [data-principal] img");
    texto.textContent = "Agregada a tu bolsa";
    if (img && !M.calma()) img.animate([{ opacity: 1 }, { opacity: 0, offset: 0.2 }, { opacity: 0, offset: 0.75 }, { opacity: 1 }], { duration: 1600 });
    M.volar(img, document.querySelector("#lienzo .v-ir-bolsa b")).then(() => M.latir(document.querySelector("#lienzo .v-ir-bolsa b")));
    setTimeout(() => { texto.textContent = "Agregar a la bolsa"; delete b.dataset.hecho; }, 2600);
  });
  document.addEventListener("cayla:separado", (e) => M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1400, (n) => String(Math.round(n)).padStart(4, "0")));
  addEventListener("resize", () => document.querySelectorAll('#lienzo .v-filtros [role="group"], #lienzo [data-grupo="talla"]').forEach((g) => M.indicador(g)));

  window.DIRECCION = { nombre: "H · Vitrina", pantallas, montar, transicion: true };
})();
</script>
<script src="marco.js"></script>
</body>
