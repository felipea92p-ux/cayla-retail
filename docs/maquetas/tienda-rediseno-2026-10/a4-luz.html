<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 · Luz — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── A4 · LUZ ─ la galería de A en clave romántica: muro de sillar con su grano, la cursiva grande de Newsreader y la luz
   de sala. Una luz cálida sigue al mouse por el muro, las prendas flotan a distintas profundidades, cada foto «se revela»
   al llegar a ella (de borrosa a nítida) y elegir algo dibuja su trazo. Con «reducir movimiento», todo queda quieto. ── */
#lienzo {
  --sillar: #e8e4dd; --lienzo: #dcd6cc; --basalto: #23211f; --piedra: #5f5b54; --linea: #cdc6ba; --cochinilla: #9e1d32; --luz: #fff6e6;
  --ancho: "wdth" 125; --gutter: clamp(16px, 4cqi, 64px); --lx: 70%; --ly: 30%;
  background-color: var(--sillar); color: var(--basalto); overflow-x: clip;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .13  0 0 0 0 .12  0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
  font: 400 15px/1.65 "Archivo", system-ui, sans-serif; font-variation-settings: "wdth" 100;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 1.5px solid var(--cochinilla); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.l-cap { font-variation-settings: var(--ancho); font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.l-serif { font-family: "Newsreader", Georgia, serif; font-optical-sizing: auto; }
.l-display { margin: 0; font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300; line-height: .88; letter-spacing: -.03em; font-size: clamp(72px, 13cqi, 210px); }
.l-titulo { margin: 0; font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300; line-height: 1; letter-spacing: -.015em; font-size: clamp(34px, 4.4cqi, 64px); }
.l-nombre { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; }
.l-tenue { color: var(--piedra); }
.l-num { font-variant-numeric: tabular-nums; }

.l-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--sillar) 86%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--linea); }
.l-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.l-cab nav:last-child { justify-content: flex-end; }
.l-cab nav a { text-decoration: none; padding: 6px 0; background: linear-gradient(currentColor, currentColor) no-repeat 50% 100% / 0% 1px; }
.l-cab nav a:hover { background-size: 100% 1px; }
.l-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.l-logo img { width: 30px; height: auto; }
.l-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.l-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.l-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.l-ir-bolsa b { position: relative; display: inline-block; font-weight: 500; }
.l-ir-bolsa b::after { content: ""; position: absolute; inset: -7px -9px; border-radius: 50%; border: 1px solid var(--cochinilla); opacity: 0; }

.l-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 30px; border: 1px solid var(--basalto); border-radius: 999px; background: var(--basalto); color: var(--sillar) !important; text-decoration: none; cursor: pointer; overflow: hidden; isolation: isolate; }
.l-btn::before { content: ""; position: absolute; left: var(--bx, 50%); top: var(--by, 50%); z-index: -1; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--sillar); transform: scale(0); }
.l-btn:hover { color: var(--basalto) !important; }
.l-btn:hover::before { transform: scale(60); }
.l-btn--claro { background: transparent; color: var(--basalto) !important; }
.l-btn--claro::before { background: var(--basalto); }
.l-btn--claro:hover { color: var(--sillar) !important; }
.l-btn svg { width: 18px; height: 18px; display: none; }
.l-btn.hecho svg { display: block; }
.l-btn.hecho svg path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.l-link { text-decoration: none; padding-bottom: 2px; background: linear-gradient(var(--linea), var(--linea)) no-repeat 0 100% / 100% 1px, linear-gradient(var(--basalto), var(--basalto)) no-repeat 0 100% / 0% 1px; }
.l-link:hover { background-size: 100% 1px, 100% 1px; }

/* La obra: la foto (blanca) se funde con el lienzo; un brillo sigue al mouse por la tela */
.l-obra { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--lienzo); overflow: hidden; text-decoration: none; }
.l-obra img { width: 100%; height: 100%; object-fit: contain; padding: 9%; mix-blend-mode: multiply; }
.l-obra::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--sx, 50%) var(--sy, 30%), color-mix(in srgb, var(--luz) 70%, transparent), transparent 46%); mix-blend-mode: soft-light; opacity: 0; }
.l-obra:hover::after { opacity: 1; }
.l-cedula { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding-top: 14px; }
.l-cedula .l-nombre { font-size: 22px; line-height: 1.2; text-decoration: none; }
.l-cedula .l-cap { grid-column: 1 / -1; color: var(--piedra); }
.l-dispo { grid-column: 1 / -1; margin-top: 4px; font-size: 13px; color: var(--piedra); }

.l-seccion { padding: clamp(72px, 10cqi, 150px) var(--gutter) 0; }
.l-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(32px, 5cqi, 64px); }
.l-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }

/* Portada: la luz de sala sobre el muro y tres prendas a distintas profundidades */
.l-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(24px, 4cqi, 72px); align-items: center; min-height: calc(100vh - 116px); padding: clamp(32px, 5cqi, 72px) var(--gutter); }
.l-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(42% 60% at var(--lx) var(--ly), color-mix(in srgb, var(--luz) 85%, transparent), transparent 70%); }
.l-hero > * { position: relative; }
.l-hero .l-cap { display: block; margin-bottom: 22px; }
.l-hero .l-display > span { display: block; }
.l-hero .l-display > span + span { padding-left: .55em; }
.l-hero p { max-width: 34ch; margin: 34px 0 32px; font-size: 17px; }
.l-trazo { display: block; width: min(320px, 60%); height: 1px; margin-top: 30px; background: var(--basalto); transform-origin: 0 50%; }
.l-escena { position: relative; aspect-ratio: 1 / 1.02; }
.l-escena > figure { position: absolute; margin: 0; will-change: transform; }
.l-escena .atras { left: 0; top: 4%; width: 40%; }
.l-escena .centro { left: 26%; top: 14%; width: 48%; z-index: 2; }
.l-escena .delante { right: 0; bottom: 0; width: 34%; z-index: 3; }
.l-escena figcaption { padding-top: 10px; }
.l-escena .l-nombre { font-size: 18px; }
.l-salon { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(20px, 3cqi, 48px); align-items: start; }
.l-salon > :nth-child(even) { margin-top: clamp(40px, 7cqi, 120px); }
.l-pasos { display: grid; gap: 0; border-top: 1px solid var(--linea); }
.l-paso { display: grid; grid-template-columns: clamp(80px, 12cqi, 180px) 1fr 1.4fr; gap: 24px; align-items: baseline; padding: 28px 0; border-bottom: 1px solid var(--linea); }
.l-paso .l-num-paso { font-family: "Newsreader", serif; font-style: italic; font-weight: 300; font-size: clamp(54px, 7cqi, 96px); line-height: .8; color: var(--piedra); }
.l-paso h3 { margin: 0; font-family: "Newsreader", serif; font-weight: 400; font-size: 24px; }
.l-paso p { margin: 0; color: var(--piedra); }
.l-club { position: relative; display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6cqi, 120px); padding: clamp(56px, 8cqi, 112px) var(--gutter); margin-top: clamp(72px, 10cqi, 150px); background: var(--lienzo); overflow: hidden; }
.l-club::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(38% 70% at var(--lx) var(--ly), color-mix(in srgb, var(--luz) 75%, transparent), transparent 70%); }
.l-club > * { position: relative; }
.l-club ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.l-club li { padding: 20px 0; border-top: 1px solid var(--linea); }
.l-club li b { display: block; font-family: "Newsreader", serif; font-weight: 400; font-size: 20px; margin-bottom: 4px; }
.l-club p { margin: 20px 0 32px; max-width: 36ch; }
.l-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4cqi, 64px); }
.l-tienda { padding-top: 24px; border-top: 1px solid var(--basalto); }
.l-tienda h3 { margin: 0 0 16px; font-family: "Newsreader", serif; font-style: italic; font-weight: 300; font-size: clamp(44px, 5.6cqi, 84px); line-height: .95; }
.l-tienda p { margin: 0 0 4px; }
.l-tienda .l-acciones { margin-top: 20px; }
.l-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 112px) var(--gutter) 40px; margin-top: clamp(72px, 10cqi, 150px); border-top: 1px solid var(--linea); }
.l-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.l-pie a { text-decoration: none; }

/* Catálogo */
.l-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(40px, 6cqi, 80px) var(--gutter) 28px; }
.l-filtros { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px 32px; margin: 0 var(--gutter); padding: 16px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.l-filtros > div { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.l-filtros button { border: 0; padding: 8px 0; cursor: pointer; color: var(--piedra); background: linear-gradient(var(--basalto), var(--basalto)) no-repeat 0 100% / 0% 1px; }
.l-filtros button:hover { color: var(--basalto); }
.l-filtros button[aria-pressed="true"] { color: var(--basalto); background-size: 100% 1px; }
.l-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(40px, 5cqi, 72px) clamp(20px, 3cqi, 48px); padding: clamp(40px, 5cqi, 64px) var(--gutter) 0; }
.l-rejilla [hidden] { display: none; }

/* Prenda */
.l-ruta { padding: 24px var(--gutter) 0; }
.l-ruta a { text-decoration: none; }
.l-ficha { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 120px); padding: 24px var(--gutter) 0; align-items: start; }
.l-galeria-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.l-panel { position: sticky; top: 96px; display: grid; gap: 28px; }
.l-panel h1 { margin: 0; font-size: clamp(40px, 4.8cqi, 68px); line-height: 1; letter-spacing: -.02em; font-weight: 300; }
.l-panel .l-precio { font-family: "Newsreader", serif; font-size: 26px; margin-top: 10px; }
.l-campo { display: grid; gap: 12px; }
.l-campo-cab { display: flex; justify-content: space-between; }
.l-opciones { display: flex; flex-wrap: wrap; gap: 10px; }
/* La talla elegida se rodea con un trazo que se dibuja */
.l-talla { position: relative; width: 52px; height: 52px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; box-shadow: inset 0 0 0 1px var(--linea); }
.l-talla:hover { box-shadow: inset 0 0 0 1px var(--basalto); }
.l-talla svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
.l-talla circle { fill: none; stroke: var(--basalto); stroke-width: 1.5; stroke-dasharray: 152; stroke-dashoffset: 152; }
.l-talla[aria-pressed="true"] circle { stroke-dashoffset: 0; }
.l-talla[aria-pressed="true"] { font-weight: 600; }
.l-color { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 7px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; box-shadow: inset 0 0 0 1px var(--linea); }
.l-color i { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
.l-color[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--basalto); }
.l-stock { display: grid; margin: 0; }
.l-stock div { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--linea); }
.l-stock div:last-child { border-bottom: 1px solid var(--linea); }
.l-stock dd { margin: 0; }
.l-aviso-campo { min-height: 1.6em; margin: -12px 0 0; font-size: 14px; }
.l-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 48px); }

/* Bolsa */
.l-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: 0 var(--gutter); align-items: start; }
.l-linea { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; padding: 24px 0; border-top: 1px solid var(--linea); align-items: start; }
.l-linea:last-child { border-bottom: 1px solid var(--linea); }
.l-linea .l-nombre { font-size: 24px; text-decoration: none; }
.l-linea .l-cap { display: block; margin-top: 4px; color: var(--piedra); }
.l-linea [data-hay-aqp] { display: block; margin-top: 10px; font-size: 13px; color: var(--piedra); }
.l-linea [data-falta="true"] { color: var(--cochinilla); }
.l-quitar { margin-top: 12px; border: 0; background: none; padding: 0; color: var(--piedra); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.l-resumen { position: sticky; top: 96px; display: grid; gap: 24px; padding: 32px; background: var(--lienzo); border-radius: 4px; }
.l-tienda-op { display: grid; gap: 2px; width: 100%; text-align: left; padding: 16px 18px; border: 0; border-radius: 4px; background: var(--sillar); cursor: pointer; box-shadow: inset 0 0 0 1px var(--linea); }
.l-tienda-op:hover { box-shadow: inset 0 0 0 1px var(--basalto); }
.l-tienda-op[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--basalto); }
.l-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; border-top: 1px solid var(--linea); }
.l-total b { font-family: "Newsreader", serif; font-weight: 400; font-size: 30px; }
.l-listo { padding: 32px; background: var(--sillar); border-radius: 4px; display: grid; gap: 16px; justify-items: start; }
.l-listo svg { width: 64px; height: 64px; }
.l-listo svg circle, .l-listo svg path { fill: none; stroke: var(--basalto); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.l-listo h2 { margin: 0; font-size: 36px; line-height: 1.05; font-weight: 300; }
.l-listo p { margin: 0; }
.l-mensaje { margin: 0; padding: 16px 18px; background: var(--lienzo); font-size: 14px; white-space: pre-line; border-radius: 4px; }

/* Entrar */
.l-entrar { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 7cqi, 140px); padding: clamp(40px, 7cqi, 96px) var(--gutter) 0; align-items: center; }
.l-entrar::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(40% 60% at var(--lx) var(--ly), color-mix(in srgb, var(--luz) 80%, transparent), transparent 70%); }
.l-entrar > * { position: relative; }
.l-form { display: grid; gap: 22px; max-width: 420px; }
.l-form h1 { margin-bottom: 8px; font-size: clamp(56px, 7cqi, 104px); }
.l-form label { display: grid; gap: 8px; }
.l-form input { height: 52px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--linea); background: linear-gradient(var(--basalto), var(--basalto)) no-repeat 0 100% / 0% 1px; font: inherit; color: inherit; }
.l-form input:focus { outline: none; background-size: 100% 1px; }
.l-form .l-btn { width: 100%; }

@media (prefers-reduced-motion: no-preference) {
  .l-cab nav a, .l-link, .l-filtros button { transition: background-size .7s cubic-bezier(.76,0,.24,1), color .4s; }
  .l-btn { transition: color .5s; }
  .l-btn::before { transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .l-obra::after { transition: opacity .6s; }
  .l-obra img { transition: transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .l-fig:hover .l-obra img { transform: scale(1.035); }
  .l-talla { transition: box-shadow .3s, font-weight .3s; }
  .l-talla circle { transition: stroke-dashoffset .9s cubic-bezier(.65,0,.35,1); }
  .l-form input { transition: background-size .8s cubic-bezier(.76,0,.24,1); }
  .l-btn.hecho svg path { animation: l-traza .6s .1s cubic-bezier(.65,0,.35,1) forwards; }
  .l-ir-bolsa b.destello::after { animation: l-destello .9s cubic-bezier(.2,.7,.2,1); }
  @keyframes l-destello { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.6); } }
  @keyframes l-traza { to { stroke-dashoffset: 0; } }

  /* El titular se arma letra a letra desde el desenfoque, y debajo se traza una línea */
  .l-letras .letra { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(.12em); transition: opacity 1.1s, filter 1.4s, transform 1.4s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.15s + var(--l, 0) * 70ms); }
  .listo .l-letras .letra { opacity: 1; filter: none; transform: none; }
  .l-trazo { transform: scaleX(0); transition: transform 1.6s cubic-bezier(.76,0,.24,1) 1.1s; }
  .listo .l-trazo { transform: none; }
  .l-entra { opacity: 0; filter: blur(6px); transform: translateY(14px); transition: opacity 1s, filter 1.1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.7s + var(--s, 0) * 110ms); }
  .listo .l-entra { opacity: 1; filter: none; transform: none; }
  /* La escena: cada prenda aparece a su profundidad */
  .l-escena > figure > .l-capa { opacity: 0; transform: translateY(40px) scale(.97); transition: opacity 1.4s, transform 1.8s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.5s + var(--e, 0) * 220ms); }
  .listo .l-escena > figure > .l-capa { opacity: 1; transform: none; }
  /* Cada foto se revela al llegar a ella: de borrosa y velada a nítida, como una foto que aparece */
  .l-fig[data-revela] .l-obra img { filter: blur(16px) brightness(1.18); opacity: 0; transform: scale(1.06); transition: filter 1.6s cubic-bezier(.2,.7,.2,1), opacity 1.2s, transform 1.8s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 120ms); }
  .l-fig.visto .l-obra img { filter: none; opacity: 1; transform: none; }
  .l-fig[data-revela] .l-cedula { opacity: 0; transform: translateY(8px); transition: opacity .9s, transform 1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.6s + var(--i, 0) * 120ms); }
  .l-fig.visto .l-cedula { opacity: 1; transform: none; }
  .l-fig.visto:hover .l-obra img { transform: scale(1.035); transition-delay: 0s; }
  [data-revela].l-desenfoca { opacity: 0; filter: blur(8px); transform: translateY(18px); transition: opacity 1.1s, filter 1.3s, transform 1.3s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 120ms); }
  [data-revela].l-desenfoca.visto { opacity: 1; filter: none; transform: none; }
  .l-paso .l-num-paso { transition: color .6s; }
  .l-paso:hover .l-num-paso { color: var(--cochinilla); }
  .l-panel > * { opacity: 0; filter: blur(6px); transition: opacity .9s, filter 1s; transition-delay: calc(.2s + var(--f, 0) * 80ms); }
  .listo .l-panel > * { opacity: 1; filter: none; }
  .l-bolsa-cuerpo .l-linea { animation: l-aparece 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--i, 0) * 120ms); }
  .l-resumen { animation: l-aparece 1.1s .35s cubic-bezier(.2,.7,.2,1) both; }
  .l-listo:not([hidden]) { animation: l-aparece .9s cubic-bezier(.2,.7,.2,1) both; }
  .l-listo:not([hidden]) svg circle { stroke-dasharray: 190; stroke-dashoffset: 190; animation: l-traza 1.1s .2s cubic-bezier(.65,0,.35,1) forwards; }
  .l-listo:not([hidden]) svg path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: l-traza .6s 1.05s cubic-bezier(.65,0,.35,1) forwards; }
  .l-form > * { animation: l-aparece 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--f, 0) * 80ms); }
  .l-entrar figure { animation: l-flota 9s ease-in-out infinite alternate; }
  @keyframes l-aparece { from { opacity: 0; filter: blur(8px); transform: translateY(18px); } }
  @keyframes l-flota { from { transform: translateY(-8px); } to { transform: translateY(8px); } }

  /* De una pantalla a otra: la vieja se desenfoca y la nueva se aclara */
  ::view-transition-old(root) { animation: .5s cubic-bezier(.4,0,1,1) both l-vt-sale; }
  ::view-transition-new(root) { animation: .8s cubic-bezier(.2,.7,.2,1) .1s both l-vt-entra; }
  @keyframes l-vt-sale { to { opacity: 0; filter: blur(10px); } }
  @keyframes l-vt-entra { from { opacity: 0; filter: blur(12px); } }
}

@container lienzo (max-width: 760px) {
  .l-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .l-cab nav:first-child { display: none; }
  .l-menu { display: block; grid-column: 1; grid-row: 1; }
  .l-logo { justify-self: center; grid-column: 2; }
  .l-cab nav:last-child a:not(.l-ir-bolsa) { display: none; }
  .l-hero, .l-ficha, .l-bolsa-cuerpo, .l-entrar, .l-club { grid-template-columns: 1fr; }
  .l-hero { min-height: 0; padding-top: 28px; }
  .l-hero p { margin: 22px 0 26px; }
  .l-escena { margin-top: 12px; }
  .l-salon { grid-template-columns: 1fr 1fr; }
  .l-salon > :nth-child(even) { margin-top: 40px; }
  .l-paso { grid-template-columns: 64px 1fr; }
  .l-paso p { grid-column: 2; }
  .l-club ul { grid-template-columns: 1fr; }
  .l-tiendas { grid-template-columns: 1fr; }
  .l-pie { grid-template-columns: 1fr 1fr; }
  .l-pie > :first-child { grid-column: 1 / -1; }
  .l-rejilla { grid-template-columns: 1fr 1fr; gap: 32px 14px; }
  .l-cedula { grid-template-columns: 1fr; }
  .l-cedula .l-nombre { font-size: 18px; }
  .l-dispo { display: none; }
  .l-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .l-filtros button { white-space: nowrap; }
  .l-panel, .l-resumen { position: static; }
  .l-vacon { grid-template-columns: 1fr 1fr; }
  .l-vacon > :nth-child(3) { display: none; }
  .l-linea { grid-template-columns: 88px 1fr; }
  .l-linea > .l-precio { grid-column: 2; }
  .l-entrar > figure { display: none; }
  .l-resumen { padding: 24px 20px; margin: 0 calc(-1 * var(--gutter)); }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA, M = window.MOV;
  const logo = `<a class="l-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const visto = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const cab = () => `
    <header class="l-cab">
      <nav class="l-cap" aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="l-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav class="l-cap" aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="l-ir-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="l-pie">
      <div>${logo}<p class="l-tenue" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="l-cap">Ayuda</span><ul><li><a class="l-link" href="#portada">Cómo separar</a></li><li><a class="l-link" href="#portada">Cambios y devoluciones</a></li><li><a class="l-link" href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="l-cap">Tu cuenta</span><ul><li><a class="l-link" href="#entrar">Crear mi cuenta</a></li><li><a class="l-link" href="#entrar">Entrar</a></li><li><a class="l-link" href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="l-cap">CAYLA</span><ul><li><a class="l-link" href="#portada">Club CAYLA</a></li><li><a class="l-link" href="#portada">Privacidad</a></li><li><a class="l-link" href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const obra = (p, i, conPrecio, revela = true) => `
    <figure class="l-fig" ${revela ? "data-revela" : ""} data-id="${p.id}" style="--i:${i};margin:0" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="l-obra" href="#prenda/${p.id}" data-brillo><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="l-cedula">
        <a class="l-nombre" href="#prenda/${p.id}">${p.nombre}</a>
        ${conPrecio ? `<span class="l-precio l-num">${C.precio(p.precio)}</span>` : `<a class="l-link l-precio" href="#entrar">Ver precio</a>`}
        <span class="l-cap">${C.nombreCat(p.cat)} · ${p.colores.length === 1 ? p.colores[0][0] : p.colores.length + " colores"}${conPrecio ? ` · ${p.tallas[0]}–${p.tallas[p.tallas.length - 1]}` : ""}</span>
        ${conPrecio ? `<span class="l-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;

  const pantallas = {
    portada() {
      const [atras, centro, delante] = ["tiana", "kalessi", "luna"].map(C.prenda);
      const salon = ["alba", "strend", "cuello-v", "olenka"].map(C.prenda);
      const capa = (p, clase, prof, e) => `<figure class="${clase}" data-prof="${prof}"><div class="l-capa" style="--e:${e}"><a class="l-obra" href="#prenda/${p.id}" data-brillo><img src="${C.foto(p)}" alt="${p.nombre}"></a><figcaption><a class="l-nombre" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a></figcaption></div></figure>`;
      return `${cab()}
      <section class="l-hero" data-luz>
        <div>
          <span class="l-cap l-tenue l-entra">Llegó en los últimos 30 días</span>
          <h1 class="l-display" aria-label="Lo nuevo"><span class="l-letras" data-letras>Lo</span><span class="l-letras" data-letras>nuevo</span></h1>
          <i class="l-trazo" aria-hidden="true"></i>
          <p class="l-entra" style="--s:1">Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="l-acciones l-entra" style="--s:2"><a class="l-btn" href="#entrar">Crear mi cuenta</a><a class="l-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        <div class="l-escena">${capa(atras, "atras", 0.35, 0)}${capa(centro, "centro", 0.7, 1)}${capa(delante, "delante", 1.1, 2)}</div>
      </section>
      <section class="l-seccion">
        <div class="l-seccion-cab"><h2 class="l-titulo l-desenfoca" data-revela>En las tiendas</h2><a class="l-link l-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="l-salon">${salon.map((p, i) => obra(p, i, false)).join("")}</div>
      </section>
      <section class="l-seccion">
        <div class="l-seccion-cab"><h2 class="l-titulo l-desenfoca" data-revela>Así se separa</h2><span class="l-cap l-tenue">Sin pagar en la web</span></div>
        <div class="l-pasos">${C.pasos.map(([t, d], i) => `<div class="l-paso l-desenfoca" data-revela style="--i:${i}"><span class="l-num-paso">${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="l-club" data-luz>
        <div class="l-desenfoca" data-revela><span class="l-cap l-tenue">Club CAYLA</span><h2 class="l-titulo" style="margin-top:16px">Tu cuenta ya es tu membresía</h2><p>Al crear tu cuenta entras al Club. No hay que llenar nada más.</p><a class="l-btn" href="#entrar">Crear mi cuenta</a></div>
        <ul>${C.club.map(([t, d], i) => `<li class="l-desenfoca" data-revela style="--i:${i}"><b>${t}</b><span class="l-tenue">${d}</span></li>`).join("")}</ul>
      </section>
      <section class="l-seccion">
        <div class="l-seccion-cab"><h2 class="l-titulo l-desenfoca" data-revela>Nuestras tiendas</h2><span class="l-cap l-tenue">Recoge en la que te quede cerca</span></div>
        <div class="l-tiendas">${C.tiendas.map((t, i) => `<div class="l-tienda l-desenfoca" data-revela style="--i:${i}"><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="l-tenue">${t.horario}</p><div class="l-acciones"><a class="l-btn l-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="l-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="l-cat-cab"><h1 class="l-display l-letras" data-letras style="font-size:clamp(64px,10cqi,150px)">Ropa</h1><span class="l-cap l-tenue l-entra"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="l-filtros l-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="l-rejilla">${C.prendas.map((p, i) => obra(p, i % 3, true)).join("")}</div>
      <p class="l-seccion l-tenue" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      return `${cab()}
      <div class="l-ruta l-cap l-tenue"><a class="l-link" href="#catalogo">Ropa</a> &nbsp;/&nbsp; <a class="l-link" href="#catalogo">${C.nombreCat(p.cat)}</a></div>
      <section class="l-ficha">
        <div class="l-fig" data-revela>
          <div class="l-obra" data-brillo><img src="${C.foto(p)}" alt="${p.nombre}"></div>
          ${p.foto.length > 1 ? `<div class="l-galeria-mini">${p.foto.map((_, i) => `<div class="l-obra"><img src="${C.foto(p, i)}" alt="${p.nombre}, foto ${i + 1}"></div>`).join("")}</div>` : ""}
        </div>
        <div class="l-panel">
          <div><h1 class="l-nombre">${p.nombre}</h1><div class="l-precio l-num">${C.precio(p.precio)}</div></div>
          <div class="l-campo"><div class="l-campo-cab"><span class="l-cap">Color</span></div>
            <div class="l-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="l-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="l-campo"><div class="l-campo-cab"><span class="l-cap">Talla</span><a class="l-link l-tenue" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="l-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="l-talla" data-valor="${t}" aria-pressed="false">${t}<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24.25"/></svg></button>`).join("")}</div></div>
          <dl class="l-stock"><span class="l-cap" style="margin-bottom:8px">En tienda</span>${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "l-tenue"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="l-btn" data-agregar="${p.id}">${visto}<span data-texto>Agregar a la bolsa</span></button>
          <p class="l-aviso-campo" data-aviso role="status" aria-live="polite"></p>
          <p class="l-tenue" style="margin:-16px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="l-seccion"><div class="l-seccion-cab"><h2 class="l-titulo l-desenfoca" data-revela>Va con</h2></div><div class="l-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="l-cat-cab"><h1 class="l-display l-letras" data-letras style="font-size:clamp(60px,9cqi,136px)">Tu bolsa</h1><span class="l-cap l-tenue l-entra">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="l-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:24px 0;border-top:1px solid var(--linea)">Tu bolsa está vacía. <a class="l-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="l-linea" style="--i:${i}">
            <a class="l-obra" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="l-nombre" href="#prenda/${p.id}">${p.nombre}</a><span class="l-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="l-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="l-precio l-num">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="l-resumen">
          <div data-antes-de-separar style="display:grid;gap:24px">
            <div class="l-campo"><span class="l-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="l-tienda-op" data-valor="${t.id}" aria-pressed="false"><b class="l-serif" style="font-weight:400;font-size:20px">${t.ciudad}</b><span class="l-tenue">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="l-total"><span>Total <span class="l-tenue">· pagas al recoger</span></span><b class="l-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="l-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="l-aviso-campo" data-aviso role="status" aria-live="polite" style="margin:-12px 0 0"></p>
            <p class="l-tenue" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="l-listo" data-confirmacion hidden>
            <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M20 33l8 8 16-17"/></svg>
            <span class="l-cap l-tenue">Separación N.º <span data-numero>${C.deEjemplo.numero}</span> · por confirmar</span>
            <h2 class="l-nombre" tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
            <p>Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="l-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="l-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      const p = C.prenda("rayas");
      return `${cab()}
      <section class="l-entrar" data-luz>
        <form class="l-form" novalidate>
          <h1 class="l-display">Entrar</h1>
          <p class="l-tenue" style="margin:-8px 0 4px">Con tu cuenta ves precios, tallas y cuánto hay en cada tienda.</p>
          <label><span class="l-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="l-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="l-btn" type="submit">Entrar</button>
          <a class="l-link l-tenue" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <p style="margin:12px 0 0;padding-top:20px;border-top:1px solid var(--linea)">¿Todavía no tienes cuenta?</p>
          <a class="l-btn l-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
        <figure style="margin:0"><div class="l-obra" data-brillo><img src="${C.foto(p)}" alt=""></div>
          <figcaption class="l-cedula"><span class="l-nombre">Con tu cuenta</span><span class="l-cap">Ves precios, tallas y cuánto hay en cada tienda</span></figcaption></figure>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de A4 ──
  let quitar = [];
  const limpiar = () => { quitar.forEach((f) => f()); quitar = []; };

  // La luz de sala: sigue al mouse por el muro (portada, club, entrar). Quieta, se queda arriba a la derecha.
  function luz(lienzo) {
    const zonas = [...lienzo.querySelectorAll("[data-luz]")];
    if (!zonas.length) return;
    quitar.push(M.seguir((x, y) => {
      zonas.forEach((z) => {
        const r = z.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;
        z.style.setProperty("--lx", ((x - r.left) / r.width) * 100 + "%");
        z.style.setProperty("--ly", ((y - r.top) / r.height) * 100 + "%");
      });
    }));
  }

  // La escena: cada prenda se mueve según su profundidad, con el mouse y al bajar.
  function profundidad(lienzo) {
    const capas = [...lienzo.querySelectorAll("[data-prof]")];
    if (!capas.length || M.calma()) return;
    let mx = 0, my = 0;
    const pintar = () => capas.forEach((c) => { const k = Number(c.dataset.prof); c.style.transform = `translate3d(${mx * k * -22}px, ${my * k * -16 - scrollY * k * 0.12}px, 0)`; });
    quitar.push(M.seguir((x, y) => { mx = x / innerWidth - 0.5; my = y / innerHeight - 0.5; pintar(); }));
    const alBajar = () => requestAnimationFrame(pintar);
    addEventListener("scroll", alBajar, { passive: true });
    quitar.push(() => removeEventListener("scroll", alBajar));
    pintar();
  }

  // El brillo sobre la tela: sigue al mouse dentro de cada foto.
  function brillo(lienzo) {
    if (M.calma()) return;
    const mover = (e) => { const o = e.target.closest("[data-brillo]"); if (!o) return; const r = o.getBoundingClientRect(); o.style.setProperty("--sx", ((e.clientX - r.left) / r.width) * 100 + "%"); o.style.setProperty("--sy", ((e.clientY - r.top) / r.height) * 100 + "%"); };
    lienzo.addEventListener("pointermove", mover, { passive: true });
  }

  // El relleno de los botones nace donde entra el mouse.
  function botones(lienzo) {
    lienzo.addEventListener("pointerover", (e) => { const b = e.target.closest(".l-btn"); if (!b) return; const r = b.getBoundingClientRect(); b.style.setProperty("--bx", e.clientX - r.left + "px"); b.style.setProperty("--by", e.clientY - r.top + "px"); });
  }

  let conBrillo = false;
  function montar(pantalla, lienzo) {
    limpiar();
    // El brillo y el relleno de los botones escuchan al lienzo, que es el mismo en todas las pantallas: se registran una vez.
    if (!conBrillo) { brillo(lienzo); botones(lienzo); conBrillo = true; }
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll("[data-letras]").forEach((h) => M.letras(h));
    lienzo.querySelectorAll(".l-panel > *, .l-form > *").forEach((x, i) => x.style.setProperty("--f", i));
    requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    M.revelar(lienzo);
    luz(lienzo); profundidad(lienzo);
    if (pantalla === "bolsa") { const t = lienzo.querySelector("[data-total]"); if (t) M.contar(t, Number(t.dataset.total), 1300, (n) => C.precio(Math.round(n))); }
  }

  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", () => M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")));
  // Al agregar: el botón dibuja su visto, dice que quedó, y la cuenta de la bolsa da un destello.
  document.addEventListener("cayla:agregado", (e) => {
    const b = e.detail.boton, texto = b.querySelector("[data-texto]");
    b.classList.remove("hecho"); void b.offsetWidth; b.classList.add("hecho");
    texto.textContent = "Agregada a tu bolsa";
    const cuenta = document.querySelector("#lienzo .l-ir-bolsa b");
    cuenta.classList.remove("destello"); void cuenta.offsetWidth; cuenta.classList.add("destello");
    M.latir(cuenta);
    setTimeout(() => { texto.textContent = "Agregar a la bolsa"; b.classList.remove("hecho"); }, 2800);
  });
  document.addEventListener("cayla:separado", (e) => M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1500, (n) => String(Math.round(n)).padStart(4, "0")));

  window.DIRECCION = { nombre: "A4 · Luz", pantallas, montar, transicion: true };
})();
</script>
<script src="marco.js"></script>
</body>
