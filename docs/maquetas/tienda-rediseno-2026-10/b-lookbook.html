<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Lookbook — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Schibsted+Grotesk:wght@400;500;600&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── B · LOOKBOOK ─ la tienda como una revista de moda. Papel blanco, tinta, una serif de titulares en grande y, detrás de
   cada prenda, un campo de SU propio color: la ropa pone el color de la página. Se abre con un look, con sus créditos. ── */
#lienzo {
  --papel: #f7f6f3; --tinta: #121211; --gris: #5f5e5a; --linea: #dcdad5; --acento: #b3122b; --base-campo: #f0eee9;
  --gutter: clamp(16px, 3.4cqi, 56px);
  background: var(--papel); color: var(--tinta);
  font: 400 15px/1.55 "Schibsted Grotesk", system-ui, sans-serif;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

.b-serif { font-family: "Newsreader", Georgia, serif; font-optical-sizing: auto; }
.b-display { margin: 0; font-family: "Newsreader", Georgia, serif; font-weight: 300; line-height: .86; letter-spacing: -.035em; font-size: clamp(64px, 12.5cqi, 200px); }
.b-display em, .b-titulo em { font-style: italic; font-weight: 300; }
.b-titulo { margin: 0; font-family: "Newsreader", Georgia, serif; font-weight: 400; line-height: .95; letter-spacing: -.025em; font-size: clamp(38px, 5.4cqi, 80px); }
.b-cap { font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.b-gris { color: var(--gris); }
.b-num { font-variant-numeric: tabular-nums; }

/* Cabecera: logo a la izquierda, el índice al centro */
.b-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; height: 64px; padding: 0 var(--gutter); background: var(--papel); border-bottom: 1px solid var(--tinta); }
.b-cab nav { display: flex; gap: 28px; justify-content: center; }
.b-cab nav a, .b-cuenta a { text-decoration: none; }
.b-cab nav a:hover, .b-cuenta a:hover { text-decoration: underline; text-underline-offset: 4px; }
.b-cuenta { display: flex; gap: 24px; }
.b-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.b-logo img { width: 28px; height: auto; }
.b-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 20px; letter-spacing: .22em; margin-right: -.22em; }
.b-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.b-menu i { display: block; height: 1.5px; background: currentColor; margin: 5px 0; }

.b-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 26px; border: 1px solid var(--tinta); border-radius: 999px; background: var(--tinta); color: var(--papel) !important; font-weight: 500; text-decoration: none; cursor: pointer; transition: background .3s, color .3s; }
.b-btn:hover { background: var(--papel); color: var(--tinta) !important; }
.b-btn--hueco { background: transparent; color: var(--tinta) !important; }
.b-btn--hueco:hover { background: var(--tinta); color: var(--papel) !important; }
.b-btn[data-hecho="si"] { background: var(--papel); color: var(--tinta) !important; }
.b-flecha { text-decoration: none; font-weight: 500; border-bottom: 1px solid currentColor; padding-bottom: 1px; }

/* El campo: el color de la prenda, aguado sobre el papel. La foto (fondo blanco) se funde con él. */
.b-campo { position: relative; display: block; aspect-ratio: 4 / 5; background: color-mix(in srgb, var(--c) 20%, var(--base-campo)); overflow: hidden; text-decoration: none; transition: background .6s; }
a.b-campo:hover, .b-pieza:hover .b-campo { background: color-mix(in srgb, var(--c) 32%, var(--base-campo)); }
.b-campo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 8%; mix-blend-mode: multiply; }
.b-pie { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
.b-pie b { font-weight: 500; }

.b-seccion { padding: clamp(72px, 10cqi, 150px) var(--gutter) 0; }
.b-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(28px, 4cqi, 56px); }

/* Portada: el look Nº 1, como una doble página */
.b-look { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); min-height: calc(100vh - 64px); border-bottom: 1px solid var(--tinta); }
.b-look-foto { position: relative; background: color-mix(in srgb, var(--c2) 26%, var(--base-campo)); overflow: hidden; }
.b-look-foto img { position: absolute; mix-blend-mode: multiply; object-fit: contain; }
.b-look-foto .uno { left: 6%; top: 6%; width: 52%; height: 60%; }
.b-look-foto .dos { right: 4%; bottom: 3%; width: 50%; height: 82%; }
.b-look-texto { display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding: clamp(28px, 4cqi, 64px); border-left: 1px solid var(--tinta); }
.b-look-numero { font-family: "Newsreader", serif; font-style: italic; font-weight: 300; font-size: clamp(72px, 10cqi, 150px); line-height: .8; color: var(--acento); }
.b-creditos { list-style: none; margin: 0; padding: 0; }
.b-creditos li { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid var(--linea); }
.b-creditos li:last-child { border-bottom: 1px solid var(--linea); }
.b-creditos li::after { content: ""; order: 2; flex: 1; border-bottom: 1px dotted var(--gris); transform: translateY(-4px); }
.b-creditos .n { order: 1; }
.b-creditos .p { order: 3; }
.b-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
.b-nuevo { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(14px, 2cqi, 28px); }
.b-nuevo > :first-child { grid-column: span 2; grid-row: span 2; }
.b-nuevo > :first-child .b-campo { aspect-ratio: auto; height: calc(100% - 34px); }
.b-looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(14px, 2cqi, 28px); }
.b-look-carta { text-decoration: none; }
.b-look-carta .b-campo { aspect-ratio: 1; }
.b-look-carta .b-campo img { width: 58%; padding: 6%; }
.b-look-carta .b-campo img + img { left: auto; right: 0; }
.b-look-carta h3 { margin: 12px 0 0; font-family: "Newsreader", serif; font-weight: 400; font-size: 26px; letter-spacing: -.01em; }
.b-look-carta h3 em { color: var(--acento); }
.b-separa { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6cqi, 112px); }
.b-separa ol { list-style: none; margin: 0; padding: 0; }
.b-separa li { display: grid; grid-template-columns: 64px 1fr; gap: 4px 16px; padding: 20px 0; border-top: 1px solid var(--linea); }
.b-separa li:last-child { border-bottom: 1px solid var(--linea); }
.b-separa li > span { grid-row: span 2; font-family: "Newsreader", serif; font-style: italic; font-weight: 300; font-size: 48px; line-height: .9; }
.b-separa li b { font-weight: 500; }
.b-separa li p { margin: 0; color: var(--gris); }
.b-club { margin-top: clamp(72px, 10cqi, 150px); padding: clamp(56px, 8cqi, 120px) var(--gutter); background: var(--tinta); color: var(--papel); }
.b-club .b-titulo { max-width: 14ch; }
.b-club ul { list-style: none; margin: clamp(40px, 5cqi, 72px) 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.b-club li { padding-top: 16px; border-top: 1px solid #ffffff40; }
.b-club li b { display: block; font-weight: 500; margin-bottom: 6px; }
.b-club li span { color: #c9c8c3; }
.b-club .b-btn { background: var(--papel); color: var(--tinta) !important; border-color: var(--papel); }
.b-club .b-btn:hover { background: transparent; color: var(--papel) !important; }
.b-tiendas { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--tinta); }
.b-tienda { padding: 28px 0 0; }
.b-tienda + .b-tienda { padding-left: clamp(20px, 3cqi, 48px); border-left: 1px solid var(--tinta); }
.b-tienda h3 { margin: 0 0 20px; font-family: "Newsreader", serif; font-weight: 300; font-size: clamp(56px, 8cqi, 120px); line-height: .9; letter-spacing: -.035em; }
.b-tienda p { margin: 0 0 4px; }
.b-tienda .b-acciones { margin-top: 20px; }
.b-pie-pagina { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: 48px var(--gutter); margin-top: clamp(72px, 10cqi, 150px); border-top: 1px solid var(--tinta); }
.b-pie-pagina ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.b-pie-pagina a { text-decoration: none; }
.b-pie-pagina a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Catálogo */
.b-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(32px, 5cqi, 72px) var(--gutter) 24px; }
.b-filtros { position: sticky; top: 64px; z-index: 5; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; padding: 12px var(--gutter); background: var(--papel); border-top: 1px solid var(--tinta); border-bottom: 1px solid var(--linea); }
.b-filtros > div { display: flex; flex-wrap: wrap; gap: 6px; }
.b-filtros button { height: 36px; padding: 0 16px; border: 1px solid var(--linea); border-radius: 999px; background: transparent; cursor: pointer; transition: border-color .25s, background .25s, color .25s; }
.b-filtros button:hover { border-color: var(--tinta); }
.b-filtros button[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--papel); }
.b-rejilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px clamp(14px, 2cqi, 28px); padding: 32px var(--gutter) 0; grid-auto-flow: dense; }
.b-rejilla [hidden] { display: none; }
.b-rejilla > .b-grande { grid-column: span 2; grid-row: span 2; }
.b-rejilla > .b-grande .b-campo { aspect-ratio: auto; height: calc(100% - 52px); }
.b-pieza { margin: 0; }
.b-pieza .b-meta { display: block; margin-top: 2px; font-size: 13px; color: var(--gris); }

/* Prenda */
.b-ficha { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); border-bottom: 1px solid var(--tinta); }
.b-ficha-fotos { display: grid; gap: 2px; border-right: 1px solid var(--tinta); }
.b-ficha-fotos .b-campo { aspect-ratio: 4 / 5; }
.b-ficha-datos { position: sticky; top: 64px; align-self: start; display: grid; gap: 28px; padding: clamp(28px, 4cqi, 64px); }
.b-ficha-datos h1 { margin: 6px 0 0; font-family: "Newsreader", serif; font-weight: 300; letter-spacing: -.03em; line-height: .95; font-size: clamp(44px, 5.4cqi, 80px); }
.b-precio-grande { font-family: "Newsreader", serif; font-size: 30px; font-weight: 400; }
.b-grupo { display: grid; gap: 12px; }
.b-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.b-talla { min-width: 56px; height: 44px; padding: 0 16px; border: 1px solid var(--linea); border-radius: 999px; background: transparent; cursor: pointer; transition: border-color .25s; }
.b-talla:hover { border-color: var(--tinta); }
.b-talla[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.b-color { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border: 1px solid var(--linea); border-radius: 999px; background: transparent; cursor: pointer; }
.b-color i { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
.b-color[aria-pressed="true"] { border-color: var(--tinta); }
.b-stock { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.b-stock div { padding: 14px 16px; }
.b-stock div + div { border-left: 1px solid var(--linea); }
.b-stock b { display: block; font-family: "Newsreader", serif; font-weight: 400; font-size: 22px; margin-top: 2px; }
.b-aviso { min-height: 1.5em; margin: -14px 0 0; font-size: 14px; }
.b-en-look { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(24px, 4cqi, 64px); align-items: start; }
.b-en-look .b-nuevo { grid-template-columns: repeat(2, 1fr); }
.b-en-look .b-nuevo > :first-child { grid-column: auto; grid-row: auto; }
.b-en-look .b-nuevo > :first-child .b-campo { height: auto; aspect-ratio: 4 / 5; }

/* Bolsa */
.b-bolsa { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 5cqi, 96px); padding: 0 var(--gutter); align-items: start; }
.b-linea { display: grid; grid-template-columns: 112px 1fr auto; gap: 20px; padding: 20px 0; border-top: 1px solid var(--linea); }
.b-linea:first-child { border-top-color: var(--tinta); }
.b-linea:last-child { border-bottom: 1px solid var(--linea); }
.b-linea h3 { margin: 0; font-family: "Newsreader", serif; font-weight: 400; font-size: 26px; letter-spacing: -.01em; line-height: 1.1; }
.b-linea [data-hay-aqp] { display: block; margin-top: 8px; font-size: 13px; color: var(--gris); }
.b-linea [data-falta="true"] { color: var(--acento); }
.b-quitar { margin-top: 10px; padding: 0; border: 0; background: none; color: var(--gris); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.b-resumen { position: sticky; top: 88px; display: grid; gap: 22px; padding: 28px; border: 1px solid var(--tinta); border-radius: 20px; }
.b-tienda-op { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 18px; border: 1px solid var(--linea); border-radius: 14px; background: transparent; text-align: left; cursor: pointer; }
.b-tienda-op:hover { border-color: var(--tinta); }
.b-tienda-op[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: var(--papel); }
.b-tienda-op[aria-pressed="true"] .b-gris { color: #c9c8c3; }
.b-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--linea); }
.b-total b { font-family: "Newsreader", serif; font-weight: 400; font-size: 34px; }
.b-listo { display: grid; gap: 14px; }
.b-listo h2 { margin: 0; font-family: "Newsreader", serif; font-weight: 300; font-size: 40px; line-height: 1; letter-spacing: -.02em; }
.b-listo h2 em { color: var(--acento); }
.b-listo p { margin: 0; }
.b-mensaje { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--base-campo); font-size: 14px; white-space: pre-line; }

/* Entrar */
.b-entrar { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 64px); border-bottom: 1px solid var(--tinta); }
.b-entrar-foto { position: relative; display: flex; align-items: flex-end; padding: clamp(24px, 4cqi, 56px); background: color-mix(in srgb, var(--c) 22%, var(--base-campo)); overflow: hidden; }
.b-entrar-foto img { position: absolute; inset: 0; margin: auto; width: 70%; height: 80%; object-fit: contain; mix-blend-mode: multiply; }
.b-entrar-foto p { position: relative; margin: 0; max-width: 16ch; font-family: "Newsreader", serif; font-size: clamp(30px, 3.4cqi, 48px); font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.b-form { display: grid; align-content: center; gap: 20px; width: min(440px, 100%); margin: 0 auto; padding: clamp(40px, 6cqi, 80px) var(--gutter); }
.b-form label { display: grid; gap: 8px; }
.b-form input { height: 52px; padding: 0 18px; border: 1px solid var(--linea); border-radius: 14px; background: #fff; font: inherit; color: inherit; }
.b-form input:focus { outline: none; border-color: var(--tinta); }
.b-form .b-btn { width: 100%; }

/* Un solo momento orquestado: al llegar, la doble página se arma (campo, prendas, titular). Después, quieta. */
@media (prefers-reduced-motion: no-preference) {
  .b-arma .b-look-foto { animation: b-campo 1.1s cubic-bezier(.7,0,.2,1) both; }
  .b-arma .b-look-foto img { animation: b-sube 1s cubic-bezier(.2,.7,.2,1) both; }
  .b-arma .b-look-foto .uno { animation-delay: .45s; }
  .b-arma .b-look-foto .dos { animation-delay: .6s; }
  .b-arma .b-look-texto > * { animation: b-sube .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.5s + var(--i, 0) * 110ms); }
  @keyframes b-campo { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0); } }
  @keyframes b-sube { from { opacity: 0; transform: translateY(22px); } }
}

/* Celular */
@container lienzo (max-width: 760px) {
  .b-cab { grid-template-columns: 40px 1fr auto; height: 56px; }
  .b-cab nav { display: none; }
  .b-menu { display: block; }
  .b-logo { justify-self: center; }
  .b-cuenta a:not(.b-ir-bolsa) { display: none; }
  .b-look, .b-ficha, .b-bolsa, .b-entrar, .b-separa, .b-en-look { grid-template-columns: 1fr; }
  .b-look { min-height: 0; }
  .b-look-foto { aspect-ratio: 4 / 5; }
  .b-look-texto, .b-ficha-datos { border-left: 0; border-top: 1px solid var(--tinta); }
  .b-ficha-fotos { border-right: 0; }
  .b-nuevo { grid-template-columns: 1fr 1fr; }
  .b-nuevo > :first-child { grid-column: span 2; grid-row: auto; }
  .b-nuevo > :first-child .b-campo { height: auto; aspect-ratio: 4 / 5; }
  .b-looks { grid-template-columns: 1fr 1fr; }
  .b-looks > :nth-child(3) { display: none; }
  .b-club ul { grid-template-columns: 1fr 1fr; }
  .b-tiendas { grid-template-columns: 1fr; }
  .b-tienda + .b-tienda { padding-left: 0; border-left: 0; border-top: 1px solid var(--tinta); margin-top: 32px; }
  .b-pie-pagina { grid-template-columns: 1fr 1fr; }
  .b-pie-pagina > :first-child { grid-column: 1 / -1; }
  .b-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .b-filtros button { white-space: nowrap; }
  .b-rejilla { grid-template-columns: 1fr 1fr; gap: 28px 12px; }
  .b-pie { flex-direction: column; gap: 0; }
  .b-ficha-datos, .b-resumen { position: static; }
  .b-entrar-foto { min-height: 340px; }
  .b-linea { grid-template-columns: 88px 1fr; }
  .b-linea > .b-num { grid-column: 2; }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script>
(function () {
  const C = window.CAYLA;
  const color = (p) => p.colores[0][1];
  // El fondo de un look toma el color de su prenda más clara: con la más oscura, una prenda blanca se funde con el fondo.
  const luz = (hex) => { const n = parseInt(hex.slice(1), 16); return 0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255); };
  const masClara = (ps) => ps.reduce((a, b) => (luz(color(b)) > luz(color(a)) ? b : a));
  const logo = `<a class="b-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="b-cab">
      <button class="b-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#portada">Looks</a><a href="#portada">Tiendas</a></nav>
      <div class="b-cuenta"><a href="#entrar">Entrar</a><a class="b-ir-bolsa" href="#bolsa">Bolsa (<span data-cuenta-bolsa>0</span>)</a></div>
    </header>`;
  const pie = () => `
    <footer class="b-pie-pagina">
      <div>${logo}<p class="b-gris" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="b-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="b-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="b-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const pieza = (p, conPrecio, extra = "") => `
    <figure class="b-pieza ${extra}" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="b-campo" href="#prenda/${p.id}" style="--c:${color(p)}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption>
        <div class="b-pie"><a href="#prenda/${p.id}" style="text-decoration:none"><b>${p.nombre}</b></a>${conPrecio ? `<span class="b-num">${C.precio(p.precio)}</span>` : `<a class="b-flecha" href="#entrar">Ver precio</a>`}</div>
        ${conPrecio ? `<span class="b-meta">${p.colores.length > 1 ? p.colores.length + " colores" : p.colores[0][0]} · Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;
  const tituloLook = (l) => l.titulo.replace(/ y /, " <em>y</em> ");

  const pantallas = {
    portada() {
      const l = C.looks[0], [p1, p2] = l.prendas.map(C.prenda);
      const nuevo = C.prendas.filter((p) => !l.prendas.includes(p.id)).slice(0, 5);
      return `${cab()}
      <section class="b-look b-arma">
        <div class="b-look-foto" style="--c2:${color(masClara([p1, p2]))}">
          <img class="uno" src="${C.foto(p1)}" alt="${p1.nombre}"><img class="dos" src="${C.foto(p2)}" alt="${p2.nombre}">
        </div>
        <div class="b-look-texto">
          <div style="--i:0"><span class="b-cap" style="display:block;margin-bottom:22px">Look</span><div class="b-look-numero">Nº ${l.n}</div></div>
          <h1 class="b-display" style="--i:1;font-size:clamp(56px,7.2cqi,120px)">${tituloLook(l)}</h1>
          <div style="--i:2">
            <ul class="b-creditos">${[p1, p2].map((p) => `<li><a class="n" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a><a class="p b-flecha" href="#entrar">Ver precio</a></li>`).join("")}</ul>
            <p class="b-gris" style="margin:18px 0 24px">Lo nuevo de Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
            <div class="b-acciones"><a class="b-btn" href="#entrar">Crear mi cuenta</a><a class="b-flecha" href="#entrar">Ya tengo cuenta</a></div>
          </div>
        </div>
      </section>
      <section class="b-seccion">
        <div class="b-seccion-cab"><h2 class="b-titulo">Lo <em>nuevo</em></h2><a class="b-flecha" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="b-nuevo">${nuevo.map((p) => pieza(p, false)).join("")}</div>
      </section>
      <section class="b-seccion">
        <div class="b-seccion-cab"><h2 class="b-titulo">Más <em>looks</em></h2><a class="b-flecha" href="#portada">Arma el tuyo</a></div>
        <div class="b-looks">${C.looks.slice(1).map((lk) => { const ps = lk.prendas.map(C.prenda); return `
          <a class="b-look-carta" href="#prenda/${ps[0].id}">
            <div class="b-campo" style="--c:${color(masClara(ps))}">${ps.map((p) => `<img src="${C.foto(p)}" alt="" loading="lazy">`).join("")}</div>
            <h3><em>Nº ${lk.n}</em> &nbsp;${lk.titulo}</h3><span class="b-gris">${ps.map((p) => p.nombre).join(" + ")}</span>
          </a>`; }).join("")}</div>
      </section>
      <section class="b-seccion b-separa">
        <h2 class="b-titulo">Separas <em>sin pagar.</em><br>Pagas al recoger.</h2>
        <ol>${C.pasos.map(([t, d], i) => `<li><span>${i + 1}</span><b>${t}</b><p>${d}</p></li>`).join("")}</ol>
      </section>
      <section class="b-club">
        <span class="b-cap" style="color:#c9c8c3">Club CAYLA</span>
        <h2 class="b-titulo" style="margin-top:18px">Tu cuenta es tu <em>membresía.</em></h2>
        <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ul>
        <a class="b-btn" href="#entrar">Crear mi cuenta</a>
      </section>
      <section class="b-seccion">
        <div class="b-seccion-cab"><h2 class="b-titulo">Nuestras <em>tiendas</em></h2><span class="b-gris">Recoge en la que te quede cerca</span></div>
        <div class="b-tiendas">${C.tiendas.map((t) => `<div class="b-tienda"><h3>${t.ciudad}</h3><p>${t.direccion}</p><p class="b-gris">${t.horario}</p><div class="b-acciones"><a class="b-btn b-btn--hueco" href="#portada">WhatsApp ${t.whatsapp}</a><a class="b-flecha" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="b-cat-cab"><h1 class="b-display">Ropa</h1><span class="b-gris"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="b-filtros" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="b-rejilla">${C.prendas.map((p, i) => pieza(p, true, i === 0 || i === 7 ? "b-grande" : "")).join("")}</div>
      <p class="b-seccion b-gris" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const look = C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0];
      const otras = look.prendas.filter((x) => x !== p.id).map(C.prenda);
      return `${cab()}
      <section class="b-ficha">
        <div class="b-ficha-fotos">${p.foto.map((_, i) => `<div class="b-campo" style="--c:${color(p)}"><img src="${C.foto(p, i)}" alt="${p.nombre}${p.foto.length > 1 ? ", foto " + (i + 1) : ""}"></div>`).join("")}</div>
        <div class="b-ficha-datos">
          <div><a class="b-cap b-gris" href="#catalogo" style="text-decoration:none">${C.nombreCat(p.cat)}</a><h1>${p.nombre}</h1></div>
          <div class="b-precio-grande b-num">${C.precio(p.precio)}</div>
          <div class="b-grupo"><span class="b-cap">Color</span><div class="b-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="b-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="b-grupo"><div style="display:flex;justify-content:space-between"><span class="b-cap">Talla</span><a class="b-flecha b-gris" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="b-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="b-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <div class="b-stock">${C.tiendas.map((t) => `<div><span class="b-cap b-gris">${t.ciudad}</span><b>${C.stockFrase(p.stock[t.id])}</b></div>`).join("")}</div>
          <button class="b-btn" data-agregar="${p.id}" style="width:100%">Agregar a la bolsa</button>
          <p class="b-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="b-gris" style="margin:-14px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
        </div>
      </section>
      <section class="b-seccion b-en-look">
        <div><span class="b-cap" style="display:block;margin-bottom:24px">Completa el look</span><div class="b-look-numero" style="margin-bottom:20px">Nº ${look.n}</div><h2 class="b-titulo" style="font-size:clamp(32px,3.6cqi,52px)">${tituloLook(look)}</h2></div>
        <div class="b-nuevo">${otras.map((x) => pieza(x, true)).join("")}</div>
      </section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="b-cat-cab"><h1 class="b-display" style="font-size:clamp(56px,9cqi,150px)">Tu <em>bolsa</em></h1><span class="b-gris">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="b-bolsa">
        <div>${bolsa.length === 0 ? `<p style="padding:20px 0;border-top:1px solid var(--tinta)">Tu bolsa está vacía. <a class="b-flecha" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="b-linea">
            <a class="b-campo" href="#prenda/${p.id}" style="--c:${color(p)}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><h3>${p.nombre}</h3><span class="b-gris">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="b-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="b-num">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="b-resumen">
          <div data-antes-de-separar style="display:grid;gap:22px">
            <div class="b-grupo"><span class="b-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="b-tienda-op" data-valor="${t.id}" aria-pressed="false"><b style="font-weight:500">${t.ciudad}</b><span class="b-gris">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="b-total"><span>Total<br><span class="b-gris">Pagas al recoger</span></span><b class="b-num">${C.precio(total)}</b></div>
            <button class="b-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="b-aviso" data-aviso role="status" aria-live="polite" style="margin:-10px 0 0"></p>
            <p class="b-gris" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="b-listo" data-confirmacion hidden>
            <span class="b-cap b-gris">Separación Nº ${C.deEjemplo.numero} · por confirmar</span>
            <h2 tabindex="-1">Te la guardamos en <em data-tienda-elegida></em></h2>
            <p>Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="b-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="b-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación Nº ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      const p = C.prenda("amarre");
      return `${cab()}
      <section class="b-entrar">
        <div class="b-entrar-foto" style="--c:${color(p)}"><img src="${C.foto(p)}" alt=""><p>Con tu cuenta ves precios, tallas y <em>cuánto hay en tu tienda.</em></p></div>
        <form class="b-form" novalidate>
          <h1 class="b-display" style="font-size:clamp(48px,6cqi,88px)">Entrar</h1>
          <label><span class="b-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="b-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="b-btn" type="submit">Entrar</button>
          <a class="b-flecha b-gris" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <p style="margin:16px 0 0;padding-top:20px;border-top:1px solid var(--linea)">¿Todavía no tienes cuenta?</p>
          <a class="b-btn b-btn--hueco" href="#entrar">Crear mi cuenta</a>
        </form>
      </section>
      ${pie()}`;
    },
  };

  window.DIRECCION = { nombre: "B · Lookbook", pantallas };
})();
</script>
<script src="marco.js"></script>
</body>
</html>
