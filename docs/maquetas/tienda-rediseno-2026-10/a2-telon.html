<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 · Telón — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── A2 · TELÓN ─ la misma galería de A (muro de yeso frío, cada prenda con su cédula), contada como cine: un telón
   que se levanta, titulares que suben desde detrás de su línea, obras que se descubren como una luz que se enciende, y la
   foto que viaja de la lista a la prenda. Todo una vez, nada en bucle; con «reducir movimiento», quieto. ── */
#lienzo {
  --muro: #ecebe7; --lienzo: #e1ded7; --grafito: #1c1c1a; --piedra: #615e57; --linea: #cbc7be; --cochinilla: #9e1d32;
  --ancho: "wdth" 125; --gutter: clamp(16px, 4cqi, 64px);
  background: var(--muro); color: var(--grafito);
  font: 400 15px/1.65 "Archivo", system-ui, sans-serif; font-variation-settings: "wdth" 100;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 1.5px solid var(--cochinilla); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

/* Letra */
.t-cap { font-variation-settings: var(--ancho); font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.t-display { margin: 0; font-variation-settings: var(--ancho); font-weight: 200; text-transform: uppercase; letter-spacing: .02em; line-height: .9; font-size: clamp(54px, 11.5cqi, 168px); }
.t-titulo { margin: 0; font-variation-settings: var(--ancho); font-weight: 250; text-transform: uppercase; letter-spacing: .06em; line-height: 1.05; font-size: clamp(22px, 2.6cqi, 34px); }
.t-nombre { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.005em; }
.t-tenue { color: var(--piedra); }
.t-num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.t-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 72px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--muro) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
.t-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.t-cab nav:last-child { justify-content: flex-end; }
.t-cab nav a { text-decoration: none; padding: 6px 0; border-bottom: 1px solid transparent; transition: border-color .4s; }
.t-cab nav a:hover { border-color: currentColor; }
.t-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.t-logo img { width: 30px; height: auto; }
.t-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.t-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.t-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.t-bolsa b { font-weight: 500; }

/* Botones: negro grafito, sin esquinas, como una señalética de galería */
.t-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; border: 1px solid var(--grafito); background: var(--grafito); color: var(--muro) !important; text-decoration: none; cursor: pointer; transition: background .4s, color .4s; }
.t-btn:hover { background: transparent; color: var(--grafito) !important; }
.t-btn--claro { background: transparent; color: var(--grafito) !important; }
.t-btn--claro:hover { background: var(--grafito); color: var(--muro) !important; }
.t-btn[data-hecho="si"] { background: transparent; color: var(--grafito) !important; }
.t-link { text-decoration: none; border-bottom: 1px solid var(--linea); padding-bottom: 2px; transition: border-color .4s; }
.t-link:hover { border-color: var(--grafito); }

/* La obra: la foto (blanca) se funde con el lienzo; así las 13 fotos parecen hechas en el mismo estudio */
.t-obra { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--lienzo); overflow: hidden; text-decoration: none; }
.t-obra img { width: 100%; height: 100%; object-fit: contain; padding: 9%; mix-blend-mode: multiply; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.t-obra:hover img { transform: scale(1.03); }
/* La cédula: la firma de esta dirección. Nombre, qué es, tallas y precio, como en la pared de un museo. */
.t-cedula { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding-top: 14px; }
.t-cedula .t-nombre { font-size: 21px; line-height: 1.2; }
.t-cedula .t-cap { grid-column: 1 / -1; color: var(--piedra); }
.t-cedula .t-precio { font-size: 15px; align-self: baseline; }

.t-seccion { padding: clamp(64px, 10cqi, 140px) var(--gutter) 0; }
.t-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(32px, 5cqi, 64px); }

/* Portada */
.t-hero { display: grid; grid-template-columns: 1fr minmax(0, 40%); gap: clamp(24px, 5cqi, 96px); align-items: end; padding: clamp(40px, 7cqi, 96px) var(--gutter) 0; }
.t-hero-texto { padding-bottom: 8px; }
.t-hero-texto .t-cap { display: block; margin-bottom: 28px; }
.t-hero-texto p { max-width: 34ch; margin: 32px 0 36px; font-size: 17px; }
.t-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
/* La sala: tres obras colgadas a la altura de los ojos. La línea es el eje del muro, como en una galería. */
.t-sala { position: relative; display: grid; grid-template-columns: 1.15fr 1fr 1.15fr; gap: clamp(20px, 4cqi, 72px); align-items: center; }
.t-sala::before { content: ""; position: absolute; left: calc(-1 * var(--gutter)); right: calc(-1 * var(--gutter)); top: 38%; height: 1px; background: var(--linea); }
.t-sala > * { position: relative; }
.t-sala > :nth-child(2) { width: 86%; justify-self: center; }
.t-pasos { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--linea); }
.t-paso { padding: 28px 24px 0 0; }
.t-paso + .t-paso { padding-left: 24px; border-left: 1px solid var(--linea); }
.t-paso .t-nombre { display: block; font-size: 52px; line-height: 1; margin-bottom: 18px; }
.t-paso h3 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
.t-paso p { margin: 0; color: var(--piedra); }
.t-club { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6cqi, 120px); padding: clamp(48px, 7cqi, 96px) var(--gutter); margin-top: clamp(64px, 10cqi, 140px); background: var(--lienzo); }
.t-club ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.t-club li { padding: 20px 0; border-top: 1px solid var(--linea); }
.t-club li b { display: block; font-weight: 500; margin-bottom: 4px; }
.t-club p { margin: 20px 0 32px; max-width: 36ch; }
.t-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4cqi, 64px); }
.t-tienda { padding-top: 24px; border-top: 1px solid var(--grafito); }
.t-tienda h3 { margin: 0 0 16px; }
.t-tienda p { margin: 0 0 4px; }
.t-tienda .t-acciones { margin-top: 20px; }
.t-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 112px) var(--gutter) 40px; margin-top: clamp(64px, 10cqi, 140px); border-top: 1px solid var(--linea); }
.t-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.t-pie a { text-decoration: none; }
.t-pie a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Catálogo */
.t-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(40px, 6cqi, 80px) var(--gutter) 28px; }
.t-filtros { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px 32px; margin: 0 var(--gutter); padding: 16px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.t-filtros > div { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.t-filtros button { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--piedra); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
.t-filtros button:hover { color: var(--grafito); }
.t-filtros button[aria-pressed="true"] { color: var(--grafito); border-color: var(--grafito); }
.t-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(36px, 5cqi, 72px) clamp(20px, 3cqi, 48px); padding: clamp(40px, 5cqi, 64px) var(--gutter) 0; }
.t-rejilla [hidden] { display: none; }
.t-dispo { grid-column: 1 / -1; margin-top: 6px; font-size: 13px; color: var(--piedra); }

/* Prenda */
.t-ruta { padding: 24px var(--gutter) 0; }
.t-ruta a { text-decoration: none; }
.t-ficha { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 120px); padding: 24px var(--gutter) 0; align-items: start; }
.t-galeria { display: grid; gap: 12px; }
.t-galeria-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.t-panel { position: sticky; top: 96px; display: grid; gap: 28px; }
.t-panel h1 { margin: 0; font-size: clamp(36px, 4.2cqi, 56px); line-height: 1.05; }
.t-panel .t-precio { font-size: 20px; margin-top: 10px; }
.t-campo { display: grid; gap: 12px; }
.t-campo-cab { display: flex; justify-content: space-between; }
.t-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.t-talla { min-width: 52px; height: 48px; padding: 0 14px; border: 1px solid var(--linea); background: transparent; cursor: pointer; transition: border-color .3s, background .3s; }
.t-talla:hover { border-color: var(--grafito); }
.t-talla[aria-pressed="true"] { background: var(--grafito); color: var(--muro); border-color: var(--grafito); }
.t-color { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 8px; border: 1px solid var(--linea); background: transparent; cursor: pointer; }
.t-color i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
.t-color[aria-pressed="true"] { border-color: var(--grafito); }
.t-stock { display: grid; gap: 0; margin: 0; }
.t-stock div { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--linea); }
.t-stock div:last-child { border-bottom: 1px solid var(--linea); }
.t-stock dd { margin: 0; }
.t-aviso { min-height: 1.6em; margin: -12px 0 0; font-size: 14px; }
.t-mas details { border-top: 1px solid var(--linea); padding: 16px 0; }
.t-mas details:last-child { border-bottom: 1px solid var(--linea); }
.t-mas summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.t-mas summary::after { content: "+"; font-weight: 300; }
.t-mas details[open] summary::after { content: "–"; }
.t-mas p { margin: 12px 0 0; color: var(--piedra); max-width: 44ch; }
.t-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 48px); }

/* Bolsa */
.t-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: 0 var(--gutter); align-items: start; }
.t-linea { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; padding: 24px 0; border-top: 1px solid var(--linea); align-items: start; }
.t-linea:last-child { border-bottom: 1px solid var(--linea); }
.t-linea .t-nombre { font-size: 22px; }
.t-linea .t-cap { display: block; margin-top: 4px; color: var(--piedra); }
.t-linea [data-hay-aqp] { display: block; margin-top: 10px; font-size: 13px; color: var(--piedra); }
.t-linea [data-falta="true"] { color: var(--cochinilla); }
.t-quitar { margin-top: 12px; border: 0; background: none; padding: 0; color: var(--piedra); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.t-resumen { position: sticky; top: 96px; display: grid; gap: 24px; padding: 32px; background: var(--lienzo); }
.t-tienda-opcion { display: grid; gap: 2px; width: 100%; text-align: left; padding: 16px 18px; border: 1px solid var(--linea); background: var(--muro); cursor: pointer; transition: border-color .3s; }
.t-tienda-opcion:hover { border-color: var(--grafito); }
.t-tienda-opcion[aria-pressed="true"] { border-color: var(--grafito); box-shadow: inset 0 0 0 1px var(--grafito); }
.t-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; border-top: 1px solid var(--linea); }
.t-total b { font-weight: 400; font-size: 26px; }
.t-listo { padding: 32px; background: var(--muro); border: 1px solid var(--grafito); display: grid; gap: 16px; }
.t-listo h2 { margin: 0; font-size: 34px; line-height: 1.1; }
.t-listo p { margin: 0; }
.t-mensaje { margin: 0; padding: 16px 18px; background: var(--lienzo); font-size: 14px; white-space: pre-line; }

/* Entrar */
.t-entrar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 7cqi, 140px); padding: clamp(40px, 7cqi, 96px) var(--gutter) 0; align-items: center; }
.t-form { display: grid; gap: 22px; max-width: 420px; }
.t-form h1 { margin-bottom: 8px; font-size: clamp(40px, 6cqi, 72px); }
.t-form label { display: grid; gap: 8px; }
.t-form input { height: 52px; padding: 0 16px; border: 1px solid var(--linea); background: transparent; font: inherit; color: inherit; transition: border-color .3s; }
.t-form input:focus { outline: none; border-color: var(--grafito); }
.t-form .t-btn { width: 100%; }
.t-o { display: flex; align-items: center; gap: 16px; color: var(--piedra); }
.t-o::before, .t-o::after { content: ""; flex: 1; height: 1px; background: var(--linea); }

/* Entrada: las obras aparecen una vez, despacio. Nada se mueve después. */
@media (prefers-reduced-motion: no-preference) {
  .t-aparece { animation: t-aparece 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes t-aparece { from { opacity: 0; transform: translateY(10px); } }
}
@media (prefers-reduced-motion: reduce) { .t-obra img { transition: none; } }

/* ── MOVIMIENTO DE A2 ── */
/* El telón de la entrada: el logo asoma y el telón se levanta. Solo la primera vez que se abre la tienda. */
.t-telon { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #1c1c1a; color: #ecebe7; }
.t-telon > div { display: flex; align-items: center; gap: 16px; }
.t-telon img { width: 46px; }
.t-telon span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 32px; letter-spacing: .28em; margin-right: -.28em; }
@media (prefers-reduced-motion: reduce) { .t-telon { display: none; } }

/* Lo que existe con o sin movimiento: la lupa, las cajas de texto con línea, la foto que viaja tiene nombre */
.t-renglon { display: block; }
.t-vt-foto { view-transition-name: prenda-foto; }
.t-lupa { cursor: zoom-in; }
.t-lupa.lupa-activa img { transform: scale(2.1) !important; }
.t-form input { border: 0; border-bottom: 1px solid var(--linea); padding: 0 2px; background: linear-gradient(var(--grafito), var(--grafito)) no-repeat left bottom / 0% 1px; }
.t-form input:focus { background-size: 100% 1px; }
.t-filtros [role="group"] { position: relative; }
.t-filtros .indicador { position: absolute; left: 0; top: 0; border-bottom: 1px solid var(--grafito); pointer-events: none; }
.t-filtros button[aria-pressed="true"] { border-color: transparent; }
[data-grupo="talla"] .indicador { position: absolute; left: 0; top: 0; background: var(--grafito); z-index: 0; pointer-events: none; }
[data-grupo="talla"] .t-talla { position: relative; z-index: 1; }
[data-grupo="talla"] .t-talla[aria-pressed="true"] { background: transparent; color: var(--muro); }
.t-cedula .t-nombre { background: linear-gradient(currentColor, currentColor) no-repeat 0 100% / 0% 1px; }
.t-fig:hover .t-cedula .t-nombre { background-size: 100% 1px; }
.t-cab.compacta { height: 58px; }
.t-cab.compacta .t-logo img { width: 26px; }
.t-tienda { position: relative; border-top-color: transparent; }
.t-tienda::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--grafito); transform-origin: 0 50%; }

/* Botones: el relleno se corre como una cortina, de izquierda a derecha */
.t-btn { background: linear-gradient(var(--muro), var(--muro)) no-repeat left / 0% 100%, var(--grafito); }
.t-btn:hover { background: linear-gradient(var(--muro), var(--muro)) no-repeat left / 100% 100%, var(--grafito); color: var(--grafito) !important; }
.t-btn--claro, .t-btn[data-hecho="si"] { background: linear-gradient(var(--grafito), var(--grafito)) no-repeat left / 0% 100%, transparent; color: var(--grafito) !important; }
.t-btn--claro:hover, .t-btn[data-hecho="si"]:hover { background: linear-gradient(var(--grafito), var(--grafito)) no-repeat left / 100% 100%, transparent; color: var(--muro) !important; }

@media (prefers-reduced-motion: no-preference) {
  .t-telon > div { animation: t-asoma 1.1s .15s cubic-bezier(.2,.7,.2,1) both; }
  .t-telon.sube { transform: translateY(-100%); transition: transform 1.2s cubic-bezier(.76,0,.24,1); }
  .t-telon.sube > div { opacity: 0; transform: translateY(-40px); transition: opacity .5s, transform .9s cubic-bezier(.76,0,.24,1); }
  @keyframes t-asoma { from { opacity: 0; transform: translateY(16px); letter-spacing: .6em; } }

  .t-btn, .t-btn--claro { transition: background-size .75s cubic-bezier(.76,0,.24,1), color .5s; }
  .t-form input { transition: background-size .8s cubic-bezier(.76,0,.24,1); }
  .t-cedula .t-nombre { transition: background-size .8s cubic-bezier(.76,0,.24,1); }
  .t-cab { transition: height .55s cubic-bezier(.2,.7,.2,1); }
  .t-cab .t-logo img { transition: width .55s cubic-bezier(.2,.7,.2,1); }
  .t-filtros .indicador { transition: transform .65s cubic-bezier(.2,.7,.2,1), width .65s cubic-bezier(.2,.7,.2,1); }
  [data-grupo="talla"] .indicador { transition: transform .6s cubic-bezier(.2,.7,.2,1), width .6s cubic-bezier(.2,.7,.2,1), opacity .3s; }
  [data-grupo="talla"] .t-talla { transition: color .45s, border-color .3s; }
  .t-lupa img { transition: transform .6s cubic-bezier(.2,.7,.2,1) !important; }

  /* El titular: cada renglón sube desde detrás de su línea */
  .t-renglon { display: block; overflow: hidden; padding-bottom: .07em; margin-bottom: -.07em; }
  .t-renglon > span { display: block; transform: translateY(110%); transition: transform 1.35s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.15s + var(--r, 0) * 140ms); }
  .listo .t-renglon > span { transform: none; }
  .t-hero-texto > :not(h1) { opacity: 0; transform: translateY(16px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: .75s; }
  .listo .t-hero-texto > :not(h1) { opacity: 1; transform: none; }
  /* La obra del titular se descubre de arriba abajo mientras la foto se acerca hasta su lugar */
  .t-hero .t-obra { clip-path: inset(0 0 100% 0); transition: clip-path 1.6s cubic-bezier(.76,0,.24,1) .35s; }
  .t-hero .t-obra img { transform: scale(1.38); transition: transform 2.8s cubic-bezier(.2,.7,.2,1) .35s; }
  .t-hero .t-cedula { opacity: 0; transition: opacity 1s 1.4s; }
  .listo .t-hero .t-obra { clip-path: inset(0); }
  .listo .t-hero .t-obra img { transform: none; }
  .listo .t-hero .t-cedula { opacity: 1; }
  .listo .t-hero .t-obra:hover img { transform: scale(1.045); transition: transform 1.5s cubic-bezier(.2,.7,.2,1); }

  /* Las demás obras se descubren al llegar a ellas: una luz que se enciende de abajo hacia arriba */
  .t-fig[data-revela] .t-obra { clip-path: inset(100% 0 0 0); transition: clip-path 1.3s cubic-bezier(.76,0,.24,1); transition-delay: calc(var(--i, 0) * 110ms); }
  .t-fig[data-revela] .t-obra img { transform: scale(1.22); transition: transform 2.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 110ms); }
  .t-fig[data-revela] .t-cedula { opacity: 0; transform: translateY(10px); transition: opacity .9s, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.55s + var(--i, 0) * 110ms); }
  .t-fig.visto .t-obra { clip-path: inset(0); }
  .t-fig.visto .t-obra img { transform: none; }
  .t-fig.visto .t-cedula { opacity: 1; transform: none; }
  .t-fig.visto .t-obra:hover img { transform: scale(1.045); transition: transform 1.5s cubic-bezier(.2,.7,.2,1); }

  /* Los títulos de sección se enfocan: las letras se juntan */
  .t-titulo[data-revela] { opacity: 0; letter-spacing: .34em; transition: opacity 1.1s, letter-spacing 1.7s cubic-bezier(.2,.7,.2,1); }
  .t-titulo.visto { opacity: 1; letter-spacing: .06em; }
  /* El eje del muro se traza de lado a lado */
  .t-sala::before { transform: scaleX(0); transform-origin: 0 50%; transition: transform 1.9s cubic-bezier(.76,0,.24,1) .2s; }
  .t-sala.visto::before { transform: none; }
  .t-paso[data-revela] { opacity: 0; transform: translateY(22px); transition: opacity .9s, transform 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 150ms); }
  .t-paso.visto { opacity: 1; transform: none; }
  .t-club[data-revela] > * { opacity: 0; transform: translateY(24px); transition: opacity 1s, transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .t-club[data-revela] > :last-child { transition-delay: .2s; }
  .t-club.visto > * { opacity: 1; transform: none; }
  .t-club li { transition: padding-left .5s cubic-bezier(.2,.7,.2,1); }
  .t-club li:hover { padding-left: 10px; }
  .t-tienda::before { transform: scaleX(0); transition: transform 1.5s cubic-bezier(.76,0,.24,1); }
  .t-tienda[data-revela] > * { opacity: 0; transform: translateY(14px); transition: opacity .9s .4s, transform 1s .4s cubic-bezier(.2,.7,.2,1); }
  .t-tienda.visto::before { transform: none; }
  .t-tienda.visto > * { opacity: 1; transform: none; }

  /* Los títulos de pantalla entran letra a letra, desde el desenfoque */
  .t-letras .letra { display: inline-block; opacity: 0; transform: translateY(.25em); filter: blur(10px); transition: opacity .9s, transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1.1s; transition-delay: calc(.1s + var(--l, 0) * 55ms); }
  .listo .t-letras .letra { opacity: 1; transform: none; filter: none; }

  /* Prenda: los datos entran en cascada */
  .t-panel > * { opacity: 0; transform: translateY(14px); transition: opacity .8s, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(.25s + var(--f, 0) * 70ms); }
  .listo .t-panel > * { opacity: 1; transform: none; }

  /* Bolsa: las prendas llegan desde la derecha, el resumen sube, la separación se descubre como un telón */
  .t-bolsa-cuerpo .t-linea { animation: t-entra-der 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--i, 0) * 120ms); }
  .t-resumen { animation: t-sube 1s .3s cubic-bezier(.2,.7,.2,1) both; }
  .t-listo:not([hidden]) { animation: t-cortina 1.2s cubic-bezier(.76,0,.24,1) both; }
  .t-tienda-opcion { transition: border-color .4s, box-shadow .4s, transform .5s cubic-bezier(.2,.7,.2,1); }
  .t-tienda-opcion:hover { transform: translateX(6px); }
  @keyframes t-entra-der { from { opacity: 0; transform: translateX(48px); } }
  @keyframes t-sube { from { opacity: 0; transform: translateY(28px); } }
  @keyframes t-cortina { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }

  /* Entrar: el formulario entra en cascada y la obra de al lado se acerca despacio */
  .t-form > * { animation: t-sube .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--f, 0) * 80ms); }
  .t-entrar figure .t-obra img { animation: t-lento 18s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes t-lento { from { transform: scale(1.14); } }

  /* De una pantalla a otra: la página se funde y la foto de la prenda viaja a su lugar */
  ::view-transition-old(root) { animation: .42s cubic-bezier(.4,0,1,1) both t-vt-sale; }
  ::view-transition-new(root) { animation: .75s cubic-bezier(.2,.7,.2,1) .08s both t-vt-entra; }
  ::view-transition-group(prenda-foto) { animation-duration: .95s; animation-timing-function: cubic-bezier(.65,0,.2,1); }
  ::view-transition-old(prenda-foto), ::view-transition-new(prenda-foto) { height: 100%; }
  @keyframes t-vt-sale { to { opacity: 0; } }
  @keyframes t-vt-entra { from { opacity: 0; transform: translateY(20px); } }
}

/* Celular */
@container lienzo (max-width: 760px) {
  .t-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .t-cab nav:first-child { display: none; }
  .t-menu { display: block; grid-column: 1; grid-row: 1; }
  .t-logo { justify-self: center; grid-column: 2; }
  .t-cab nav:last-child a:not(.t-bolsa) { display: none; }
  .t-hero, .t-ficha, .t-bolsa-cuerpo, .t-entrar, .t-club { grid-template-columns: 1fr; }
  .t-hero { padding-top: 32px; }
  .t-hero-texto p { margin: 24px 0 28px; }
  .t-sala { grid-template-columns: 1fr 1fr; }
  .t-sala::before { display: none; }
  .t-sala > :nth-child(2) { width: 100%; }
  .t-sala > :nth-child(3) { display: none; }
  .t-pasos { grid-template-columns: 1fr; border-top: 0; }
  .t-paso, .t-paso + .t-paso { padding: 24px 0; border-left: 0; border-top: 1px solid var(--linea); display: grid; grid-template-columns: 56px 1fr; }
  .t-paso .t-nombre { font-size: 40px; grid-row: span 2; }
  .t-club ul { grid-template-columns: 1fr; }
  .t-tiendas { grid-template-columns: 1fr; }
  .t-pie { grid-template-columns: 1fr 1fr; }
  .t-pie > :first-child { grid-column: 1 / -1; }
  .t-rejilla { grid-template-columns: 1fr 1fr; gap: 32px 14px; }
  .t-cedula { grid-template-columns: 1fr; }
  .t-cedula .t-nombre { font-size: 17px; }
  .t-dispo { display: none; }
  .t-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .t-filtros button { white-space: nowrap; }
  .t-panel, .t-resumen { position: static; }
  .t-vacon { grid-template-columns: 1fr 1fr; }
  .t-vacon > :nth-child(3) { display: none; }
  .t-linea { grid-template-columns: 88px 1fr; }
  .t-linea > .t-precio { grid-column: 2; }
  .t-entrar > figure { display: none; }
  .t-resumen { padding: 24px 20px; margin: 0 calc(-1 * var(--gutter)); }
}
</style>
</head>
<body>
<div class="t-telon" aria-hidden="true"><div><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></div></div>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script src="movimiento.js"></script>
<script>
(function () {
  const C = window.CAYLA;
  const logo = `<a class="t-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="t-cab">
      <nav class="t-cap" aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="t-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav class="t-cap" aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="t-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="t-pie">
      <div>${logo}<p class="t-tenue" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="t-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="t-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="t-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const obra = (p, i, conPrecio, revela = true) => `
    <figure class="t-fig" ${revela ? "data-revela" : ""} data-id="${p.id}" style="--i:${i};margin:0" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="t-obra" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="t-cedula">
        <a class="t-nombre" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a>
        ${conPrecio ? `<span class="t-precio t-num">${C.precio(p.precio)}</span>` : `<a class="t-link t-precio" href="#entrar">Ver precio</a>`}
        <span class="t-cap">${C.nombreCat(p.cat)} · ${p.colores.length === 1 ? p.colores[0][0] : p.colores.length + " colores"}${conPrecio ? ` · ${p.tallas[0]}–${p.tallas[p.tallas.length - 1]}` : ""}</span>
        ${conPrecio ? `<span class="t-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;

  const pantallas = {
    portada() {
      const [h, ...resto] = C.prendas;
      return `${cab()}
      <section class="t-hero">
        <div class="t-hero-texto">
          <span class="t-cap t-tenue">Llegó en los últimos 30 días</span>
          <h1 class="t-display"><span class="t-renglon" style="--r:0"><span>Lo</span></span><span class="t-renglon" style="--r:1"><span>nuevo</span></span></h1>
          <p>Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="t-acciones"><a class="t-btn" href="#entrar">Crear mi cuenta</a><a class="t-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        ${obra(h, 1, false, false)}
      </section>
      <section class="t-seccion">
        <div class="t-seccion-cab"><h2 class="t-titulo" data-revela>En las tiendas</h2><a class="t-link t-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="t-sala" data-revela>${[resto[0], resto[2], resto[1]].map((p, i) => obra(p, i + 2, false)).join("")}</div>
      </section>
      <section class="t-seccion">
        <div class="t-seccion-cab"><h2 class="t-titulo" data-revela>Así se separa</h2><span class="t-cap t-tenue">Sin pagar en la web</span></div>
        <div class="t-pasos">${C.pasos.map(([t, d], i) => `<div class="t-paso" data-revela style="--i:${i}"><span class="t-nombre">${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="t-club" data-revela>
        <div><span class="t-cap t-tenue">Club CAYLA</span><h2 class="t-titulo" style="margin-top:16px">Tu cuenta ya es<br>tu membresía</h2><p>Al crear tu cuenta entras al Club. No hay que llenar nada más.</p><a class="t-btn" href="#entrar">Crear mi cuenta</a></div>
        <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span class="t-tenue">${d}</span></li>`).join("")}</ul>
      </section>
      <section class="t-seccion">
        <div class="t-seccion-cab"><h2 class="t-titulo" data-revela>Nuestras tiendas</h2><span class="t-cap t-tenue">Recoge en la que te quede cerca</span></div>
        <div class="t-tiendas">${C.tiendas.map((t) => `<div class="t-tienda" data-revela><h3 class="t-titulo">${t.ciudad}</h3><p>${t.direccion}</p><p class="t-tenue">${t.horario}</p><div class="t-acciones"><a class="t-btn t-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="t-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="t-cat-cab"><h1 class="t-display" style="font-size:clamp(48px,8cqi,120px)">Ropa</h1><span class="t-cap t-tenue"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="t-filtros t-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="t-rejilla">${C.prendas.map((p, i) => obra(p, i % 6, true)).join("")}</div>
      <p class="t-seccion t-tenue" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      return `${cab()}
      <div class="t-ruta t-cap t-tenue"><a href="#catalogo">Ropa</a> &nbsp;/&nbsp; <a href="#catalogo">${C.nombreCat(p.cat)}</a></div>
      <section class="t-ficha">
        <div class="t-galeria">
          <div class="t-obra t-lupa t-vt-foto" data-lupa><img src="${C.foto(p)}" alt="${p.nombre}"></div>
          ${p.foto.length > 1 ? `<div class="t-galeria-mini">${p.foto.map((_, i) => `<div class="t-obra"><img src="${C.foto(p, i)}" alt="${p.nombre}, foto ${i + 1}"></div>`).join("")}</div>` : ""}
        </div>
        <div class="t-panel">
          <div><h1 class="t-nombre">${p.nombre}</h1><div class="t-precio t-num">${C.precio(p.precio)}</div></div>
          <div class="t-campo"><div class="t-campo-cab"><span class="t-cap">Color</span></div>
            <div class="t-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="t-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="t-campo"><div class="t-campo-cab"><span class="t-cap">Talla</span><a class="t-link t-tenue" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="t-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="t-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="t-stock"><span class="t-cap" style="margin-bottom:8px">En tienda</span>${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "t-tenue"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="t-btn" data-agregar="${p.id}">Agregar a la bolsa</button>
          <p class="t-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="t-tenue" style="margin:-16px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
          <div class="t-mas">
            <details><summary>Medidas y calce</summary><p>Las medidas de cada talla, tomadas sobre la prenda.</p></details>
            <details><summary>Cambios y devoluciones</summary><p>Igual que en tienda: cámbiala en cualquier tienda CAYLA.</p></details>
          </div>
        </div>
      </section>
      <section class="t-seccion"><div class="t-seccion-cab"><h2 class="t-titulo" data-revela>Va con</h2></div><div class="t-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="t-cat-cab"><h1 class="t-display" style="font-size:clamp(44px,7cqi,104px)">Tu bolsa</h1><span class="t-cap t-tenue">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="t-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:24px 0;border-top:1px solid var(--linea)">Tu bolsa está vacía. <a class="t-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="t-linea">
            <a class="t-obra" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="t-nombre" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a><span class="t-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="t-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="t-precio t-num">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="t-resumen">
          <div data-antes-de-separar style="display:grid;gap:24px">
            <div class="t-campo"><span class="t-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="t-tienda-opcion" data-valor="${t.id}" aria-pressed="false"><b style="font-weight:500">${t.ciudad}</b><span class="t-tenue">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="t-total"><span>Total <span class="t-tenue">· pagas al recoger</span></span><b class="t-num" data-total="${total}">${C.precio(total)}</b></div>
            <button class="t-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="t-aviso" data-aviso role="status" aria-live="polite" style="margin:-12px 0 0"></p>
            <p class="t-tenue" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="t-listo" data-confirmacion hidden>
            <span class="t-cap t-tenue">Separación N.º <span data-numero>${C.deEjemplo.numero}</span> · por confirmar</span>
            <h2 class="t-nombre" tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
            <p>Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="t-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="t-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      const p = C.prenda("rayas");
      return `${cab()}
      <section class="t-entrar">
        <form class="t-form" novalidate>
          <h1 class="t-display">Entrar</h1>
          <label><span class="t-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="t-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="t-btn" type="submit">Entrar</button>
          <a class="t-link t-tenue" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <div class="t-o t-cap">¿Todavía no tienes cuenta?</div>
          <a class="t-btn t-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
        <figure style="margin:0"><div class="t-obra"><img src="${C.foto(p)}" alt=""></div>
          <figcaption class="t-cedula"><span class="t-nombre">Con tu cuenta</span><span class="t-cap">Ves precios, tallas y cuánto hay en cada tienda</span></figcaption></figure>
      </section>
      ${pie()}`;
    },
  };

  // ── Movimiento de A2 ──
  const M = window.MOV;
  let ultimaPrenda = null, mirarScroll = null;

  // El telón: solo la primera vez que se abre la tienda (no en cada cambio de pantalla, ni en la vista previa).
  function telon(primera, lienzo) {
    const listo = () => requestAnimationFrame(() => requestAnimationFrame(() => lienzo.classList.add("listo")));
    const t = document.querySelector(".t-telon");
    if (!t) return listo();
    if (!primera || M.calma() || location.search.includes("previa")) { t.remove(); return listo(); }
    setTimeout(() => {
      t.classList.add("sube");
      setTimeout(listo, 250);
      t.addEventListener("transitionend", () => t.remove(), { once: true });
    }, 1150);
  }

  // La cabecera se hace más baja al bajar por la página.
  function cabecera(lienzo) {
    if (mirarScroll) removeEventListener("scroll", mirarScroll);
    const cab = lienzo.querySelector(".t-cab");
    mirarScroll = () => cab.classList.toggle("compacta", scrollY > 48);
    addEventListener("scroll", mirarScroll, { passive: true });
    mirarScroll();
  }

  // La lupa: al pasar el mouse sobre la foto de la prenda, se acerca adonde apuntas (para ver la tela).
  function lupa(caja) {
    if (!caja || M.calma() || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    const img = caja.querySelector("img");
    caja.addEventListener("pointerenter", () => caja.classList.add("lupa-activa"));
    caja.addEventListener("pointerleave", () => caja.classList.remove("lupa-activa"));
    caja.addEventListener("pointermove", (e) => {
      const r = caja.getBoundingClientRect();
      img.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
    });
  }

  // Antes de cambiar de pantalla: la foto que tocaste es la que viaja hasta la ficha.
  function antesDeCambiar(r) {
    document.querySelectorAll("#lienzo .t-obra").forEach((o) => (o.style.viewTransitionName = ""));
    if (r.pantalla !== "prenda" || !r.id) return;
    const origen = document.querySelector(`#lienzo [data-id="${r.id}"] .t-obra`);
    const principal = document.querySelector("#lienzo .t-vt-foto");
    if (!origen) return;
    if (principal) principal.style.viewTransitionName = "none";
    origen.style.viewTransitionName = "prenda-foto";
  }

  function montar(pantalla, lienzo, { primera, id }) {
    lienzo.classList.remove("listo");
    lienzo.querySelectorAll(".t-cat-cab .t-display").forEach((h) => { M.letras(h); h.classList.add("t-letras"); });
    lienzo.querySelectorAll(".t-panel > *, .t-form > *").forEach((x, i) => x.style.setProperty("--f", i));
    lienzo.querySelectorAll(".t-bolsa-cuerpo .t-linea").forEach((l, i) => l.style.setProperty("--i", i));
    telon(primera, lienzo);
    cabecera(lienzo);
    M.revelar(lienzo);
    lienzo.querySelectorAll('.t-filtros [role="group"], [data-grupo="talla"]').forEach((g) => M.indicador(g));
    if (pantalla === "prenda") { lupa(lienzo.querySelector("[data-lupa]")); ultimaPrenda = id; }
    else if (ultimaPrenda) {
      // Al volver de una prenda, su foto viaja de regreso a su lugar en la lista.
      const o = lienzo.querySelector(`[data-id="${ultimaPrenda}"] .t-obra`);
      if (o) o.style.viewTransitionName = "prenda-foto";
      ultimaPrenda = null;
    }
    if (pantalla === "bolsa") {
      const total = lienzo.querySelector("[data-total]");
      if (total) M.contar(total, Number(total.dataset.total), 1200, (n) => C.precio(Math.round(n)));
    }
  }

  document.addEventListener("cayla:elegido", (e) => {
    const g = e.detail.boton.closest("[data-grupo]");
    if (g.dataset.grupo === "talla") M.indicador(g);
  });
  // Al filtrar, lo que queda se desliza a su nuevo lugar (se mide antes de que el marco esconda nada).
  document.addEventListener("click", (e) => { if (e.target.closest("[data-filtro],[data-filtro-tienda]")) M.flipAntes(document.querySelectorAll("#lienzo [data-cat]")); }, true);
  document.addEventListener("cayla:filtrado", (e) => { M.flipDespues(document.querySelectorAll("#lienzo [data-cat]")); M.indicador(e.detail.boton.closest('[role="group"]')); });
  // Al agregar, la foto vuela a la bolsa, la cuenta late y el botón dice que quedó.
  document.addEventListener("cayla:agregado", (e) => {
    const destino = document.querySelector("#lienzo .t-bolsa b");
    M.volar(document.querySelector("#lienzo .t-vt-foto img"), destino).then(() => M.latir(destino));
    const b = e.detail.boton, texto = b.textContent;
    b.textContent = "Agregada a tu bolsa";
    setTimeout(() => (b.textContent = texto), 2200);
  });
  // Al separar, el número de la separación cuenta hasta el suyo.
  document.addEventListener("cayla:separado", (e) => {
    M.contar(e.detail.listo.querySelector("[data-numero]"), Number(C.deEjemplo.numero), 1400, (n) => String(Math.round(n)).padStart(4, "0"));
  });
  addEventListener("resize", () => document.querySelectorAll('#lienzo .t-filtros [role="group"], #lienzo [data-grupo="talla"]').forEach((g) => M.indicador(g)));

  window.DIRECCION = { nombre: "A2 · Telón", pantallas, montar, antesDeCambiar, transicion: true };

})();
</script>
<script src="marco.js"></script>
</body>
