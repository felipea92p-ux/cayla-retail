<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Muro — Rediseño de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marco.css">
<style>
/* ── A · MURO ─ lujo silencioso: la tienda como una galería. Cada prenda es una obra colgada en un muro de yeso frío,
   con su cédula de museo. El rojo cochinilla casi no aparece: lo carga el colibrí. ── */
#lienzo {
  --muro: #ecebe7; --lienzo: #e1ded7; --grafito: #1c1c1a; --piedra: #615e57; --linea: #cbc7be; --cochinilla: #9e1d32;
  --ancho: "wdth" 125; --gutter: clamp(16px, 4cqi, 64px);
  background: var(--muro); color: var(--grafito);
  font: 400 15px/1.65 "Archivo", system-ui, sans-serif; font-variation-settings: "wdth" 100;
}
#lienzo *, #lienzo *::before, #lienzo *::after { box-sizing: border-box; }
#lienzo a { color: inherit; }
#lienzo :focus-visible { outline: 1.5px solid var(--cochinilla); outline-offset: 3px; }
#lienzo img { display: block; max-width: 100%; }
:where(#lienzo) button { font: inherit; color: inherit; }

/* Letra */
.a-cap { font-variation-settings: var(--ancho); font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.a-display { margin: 0; font-variation-settings: var(--ancho); font-weight: 200; text-transform: uppercase; letter-spacing: .02em; line-height: .9; font-size: clamp(54px, 11.5cqi, 168px); }
.a-titulo { margin: 0; font-variation-settings: var(--ancho); font-weight: 250; text-transform: uppercase; letter-spacing: .06em; line-height: 1.05; font-size: clamp(22px, 2.6cqi, 34px); }
.a-nombre { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.005em; }
.a-tenue { color: var(--piedra); }
.a-num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.a-cab { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 72px; padding: 0 var(--gutter); background: color-mix(in srgb, var(--muro) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
.a-cab nav { display: flex; gap: clamp(14px, 2.4cqi, 32px); }
.a-cab nav:last-child { justify-content: flex-end; }
.a-cab nav a { text-decoration: none; padding: 6px 0; border-bottom: 1px solid transparent; transition: border-color .4s; }
.a-cab nav a:hover { border-color: currentColor; }
.a-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.a-logo img { width: 30px; height: auto; }
.a-logo span { font-family: "EB Garamond", serif; font-weight: 500; font-size: 21px; letter-spacing: .22em; margin-right: -.22em; }
.a-menu { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 10px 8px; }
.a-menu i { display: block; height: 1px; background: currentColor; margin: 5px 0; }
.a-bolsa b { font-weight: 500; }

/* Botones: negro grafito, sin esquinas, como una señalética de galería */
.a-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; border: 1px solid var(--grafito); background: var(--grafito); color: var(--muro) !important; text-decoration: none; cursor: pointer; transition: background .4s, color .4s; }
.a-btn:hover { background: transparent; color: var(--grafito) !important; }
.a-btn--claro { background: transparent; color: var(--grafito) !important; }
.a-btn--claro:hover { background: var(--grafito); color: var(--muro) !important; }
.a-btn[data-hecho="si"] { background: transparent; color: var(--grafito) !important; }
.a-link { text-decoration: none; border-bottom: 1px solid var(--linea); padding-bottom: 2px; transition: border-color .4s; }
.a-link:hover { border-color: var(--grafito); }

/* La obra: la foto (blanca) se funde con el lienzo; así las 13 fotos parecen hechas en el mismo estudio */
.a-obra { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--lienzo); overflow: hidden; text-decoration: none; }
.a-obra img { width: 100%; height: 100%; object-fit: contain; padding: 9%; mix-blend-mode: multiply; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.a-obra:hover img { transform: scale(1.03); }
/* La cédula: la firma de esta dirección. Nombre, qué es, tallas y precio, como en la pared de un museo. */
.a-cedula { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding-top: 14px; }
.a-cedula .a-nombre { font-size: 21px; line-height: 1.2; }
.a-cedula .a-cap { grid-column: 1 / -1; color: var(--piedra); }
.a-cedula .a-precio { font-size: 15px; align-self: baseline; }

.a-seccion { padding: clamp(64px, 10cqi, 140px) var(--gutter) 0; }
.a-seccion-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(32px, 5cqi, 64px); }

/* Portada */
.a-hero { display: grid; grid-template-columns: 1fr minmax(0, 40%); gap: clamp(24px, 5cqi, 96px); align-items: end; padding: clamp(40px, 7cqi, 96px) var(--gutter) 0; }
.a-hero-texto { padding-bottom: 8px; }
.a-hero-texto .a-cap { display: block; margin-bottom: 28px; }
.a-hero-texto p { max-width: 34ch; margin: 32px 0 36px; font-size: 17px; }
.a-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
/* La sala: tres obras colgadas a la altura de los ojos. La línea es el eje del muro, como en una galería. */
.a-sala { position: relative; display: grid; grid-template-columns: 1.15fr 1fr 1.15fr; gap: clamp(20px, 4cqi, 72px); align-items: center; }
.a-sala::before { content: ""; position: absolute; left: calc(-1 * var(--gutter)); right: calc(-1 * var(--gutter)); top: 38%; height: 1px; background: var(--linea); }
.a-sala > * { position: relative; }
.a-sala > :nth-child(2) { width: 86%; justify-self: center; }
.a-pasos { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--linea); }
.a-paso { padding: 28px 24px 0 0; }
.a-paso + .a-paso { padding-left: 24px; border-left: 1px solid var(--linea); }
.a-paso .a-nombre { display: block; font-size: 52px; line-height: 1; margin-bottom: 18px; }
.a-paso h3 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
.a-paso p { margin: 0; color: var(--piedra); }
.a-club { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6cqi, 120px); padding: clamp(48px, 7cqi, 96px) var(--gutter); margin-top: clamp(64px, 10cqi, 140px); background: var(--lienzo); }
.a-club ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.a-club li { padding: 20px 0; border-top: 1px solid var(--linea); }
.a-club li b { display: block; font-weight: 500; margin-bottom: 4px; }
.a-club p { margin: 20px 0 32px; max-width: 36ch; }
.a-tiendas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4cqi, 64px); }
.a-tienda { padding-top: 24px; border-top: 1px solid var(--grafito); }
.a-tienda h3 { margin: 0 0 16px; }
.a-tienda p { margin: 0 0 4px; }
.a-tienda .a-acciones { margin-top: 20px; }
.a-pie { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; padding: clamp(56px, 8cqi, 112px) var(--gutter) 40px; margin-top: clamp(64px, 10cqi, 140px); border-top: 1px solid var(--linea); }
.a-pie ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.a-pie a { text-decoration: none; }
.a-pie a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Catálogo */
.a-cat-cab { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: clamp(40px, 6cqi, 80px) var(--gutter) 28px; }
.a-filtros { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px 32px; margin: 0 var(--gutter); padding: 16px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.a-filtros > div { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.a-filtros button { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--piedra); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
.a-filtros button:hover { color: var(--grafito); }
.a-filtros button[aria-pressed="true"] { color: var(--grafito); border-color: var(--grafito); }
.a-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(36px, 5cqi, 72px) clamp(20px, 3cqi, 48px); padding: clamp(40px, 5cqi, 64px) var(--gutter) 0; }
.a-rejilla [hidden] { display: none; }
.a-dispo { grid-column: 1 / -1; margin-top: 6px; font-size: 13px; color: var(--piedra); }

/* Prenda */
.a-ruta { padding: 24px var(--gutter) 0; }
.a-ruta a { text-decoration: none; }
.a-ficha { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 120px); padding: 24px var(--gutter) 0; align-items: start; }
.a-galeria { display: grid; gap: 12px; }
.a-galeria-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.a-panel { position: sticky; top: 96px; display: grid; gap: 28px; }
.a-panel h1 { margin: 0; font-size: clamp(36px, 4.2cqi, 56px); line-height: 1.05; }
.a-panel .a-precio { font-size: 20px; margin-top: 10px; }
.a-campo { display: grid; gap: 12px; }
.a-campo-cab { display: flex; justify-content: space-between; }
.a-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.a-talla { min-width: 52px; height: 48px; padding: 0 14px; border: 1px solid var(--linea); background: transparent; cursor: pointer; transition: border-color .3s, background .3s; }
.a-talla:hover { border-color: var(--grafito); }
.a-talla[aria-pressed="true"] { background: var(--grafito); color: var(--muro); border-color: var(--grafito); }
.a-color { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 8px; border: 1px solid var(--linea); background: transparent; cursor: pointer; }
.a-color i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
.a-color[aria-pressed="true"] { border-color: var(--grafito); }
.a-stock { display: grid; gap: 0; margin: 0; }
.a-stock div { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--linea); }
.a-stock div:last-child { border-bottom: 1px solid var(--linea); }
.a-stock dd { margin: 0; }
.a-aviso { min-height: 1.6em; margin: -12px 0 0; font-size: 14px; }
.a-mas details { border-top: 1px solid var(--linea); padding: 16px 0; }
.a-mas details:last-child { border-bottom: 1px solid var(--linea); }
.a-mas summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.a-mas summary::after { content: "+"; font-weight: 300; }
.a-mas details[open] summary::after { content: "–"; }
.a-mas p { margin: 12px 0 0; color: var(--piedra); max-width: 44ch; }
.a-vacon { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 3cqi, 48px); }

/* Bolsa */
.a-bolsa-cuerpo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 6cqi, 112px); padding: 0 var(--gutter); align-items: start; }
.a-linea { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; padding: 24px 0; border-top: 1px solid var(--linea); align-items: start; }
.a-linea:last-child { border-bottom: 1px solid var(--linea); }
.a-linea .a-nombre { font-size: 22px; }
.a-linea .a-cap { display: block; margin-top: 4px; color: var(--piedra); }
.a-linea [data-hay-aqp] { display: block; margin-top: 10px; font-size: 13px; color: var(--piedra); }
.a-linea [data-falta="true"] { color: var(--cochinilla); }
.a-quitar { margin-top: 12px; border: 0; background: none; padding: 0; color: var(--piedra); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.a-resumen { position: sticky; top: 96px; display: grid; gap: 24px; padding: 32px; background: var(--lienzo); }
.a-tienda-opcion { display: grid; gap: 2px; width: 100%; text-align: left; padding: 16px 18px; border: 1px solid var(--linea); background: var(--muro); cursor: pointer; transition: border-color .3s; }
.a-tienda-opcion:hover { border-color: var(--grafito); }
.a-tienda-opcion[aria-pressed="true"] { border-color: var(--grafito); box-shadow: inset 0 0 0 1px var(--grafito); }
.a-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; border-top: 1px solid var(--linea); }
.a-total b { font-weight: 400; font-size: 26px; }
.a-listo { padding: 32px; background: var(--muro); border: 1px solid var(--grafito); display: grid; gap: 16px; }
.a-listo h2 { margin: 0; font-size: 34px; line-height: 1.1; }
.a-listo p { margin: 0; }
.a-mensaje { margin: 0; padding: 16px 18px; background: var(--lienzo); font-size: 14px; white-space: pre-line; }

/* Entrar */
.a-entrar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 7cqi, 140px); padding: clamp(40px, 7cqi, 96px) var(--gutter) 0; align-items: center; }
.a-form { display: grid; gap: 22px; max-width: 420px; }
.a-form h1 { margin-bottom: 8px; font-size: clamp(40px, 6cqi, 72px); }
.a-form label { display: grid; gap: 8px; }
.a-form input { height: 52px; padding: 0 16px; border: 1px solid var(--linea); background: transparent; font: inherit; color: inherit; transition: border-color .3s; }
.a-form input:focus { outline: none; border-color: var(--grafito); }
.a-form .a-btn { width: 100%; }
.a-o { display: flex; align-items: center; gap: 16px; color: var(--piedra); }
.a-o::before, .a-o::after { content: ""; flex: 1; height: 1px; background: var(--linea); }

/* Entrada: las obras aparecen una vez, despacio. Nada se mueve después. */
@media (prefers-reduced-motion: no-preference) {
  .a-aparece { animation: a-aparece 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes a-aparece { from { opacity: 0; transform: translateY(10px); } }
}
@media (prefers-reduced-motion: reduce) { .a-obra img { transition: none; } }

/* Celular */
@container lienzo (max-width: 760px) {
  .a-cab { grid-template-columns: 40px 1fr auto; height: 60px; }
  .a-cab nav:first-child { display: none; }
  .a-menu { display: block; grid-column: 1; grid-row: 1; }
  .a-logo { justify-self: center; grid-column: 2; }
  .a-cab nav:last-child a:not(.a-bolsa) { display: none; }
  .a-hero, .a-ficha, .a-bolsa-cuerpo, .a-entrar, .a-club { grid-template-columns: 1fr; }
  .a-hero { padding-top: 32px; }
  .a-hero-texto p { margin: 24px 0 28px; }
  .a-sala { grid-template-columns: 1fr 1fr; }
  .a-sala::before { display: none; }
  .a-sala > :nth-child(2) { width: 100%; }
  .a-sala > :nth-child(3) { display: none; }
  .a-pasos { grid-template-columns: 1fr; border-top: 0; }
  .a-paso, .a-paso + .a-paso { padding: 24px 0; border-left: 0; border-top: 1px solid var(--linea); display: grid; grid-template-columns: 56px 1fr; }
  .a-paso .a-nombre { font-size: 40px; grid-row: span 2; }
  .a-club ul { grid-template-columns: 1fr; }
  .a-tiendas { grid-template-columns: 1fr; }
  .a-pie { grid-template-columns: 1fr 1fr; }
  .a-pie > :first-child { grid-column: 1 / -1; }
  .a-rejilla { grid-template-columns: 1fr 1fr; gap: 32px 14px; }
  .a-cedula { grid-template-columns: 1fr; }
  .a-cedula .a-nombre { font-size: 17px; }
  .a-dispo { display: none; }
  .a-filtros > div:first-child { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); scrollbar-width: none; }
  .a-filtros button { white-space: nowrap; }
  .a-panel, .a-resumen { position: static; }
  .a-vacon { grid-template-columns: 1fr 1fr; }
  .a-vacon > :nth-child(3) { display: none; }
  .a-linea { grid-template-columns: 88px 1fr; }
  .a-linea > .a-precio { grid-column: 2; }
  .a-entrar > figure { display: none; }
  .a-resumen { padding: 24px 20px; margin: 0 calc(-1 * var(--gutter)); }
}
</style>
</head>
<body>
<main id="lienzo"></main>
<script src="datos.js"></script>
<script>
(function () {
  const C = window.CAYLA;
  const bolsaSvg = "";
  const logo = `<a class="a-logo" href="#portada" aria-label="CAYLA, ir a la portada"><img src="cayla-isotipo.png" alt=""><span>CAYLA</span></a>`;
  const cab = () => `
    <header class="a-cab">
      <nav class="a-cap" aria-label="Tienda"><a href="#catalogo">Lo nuevo</a><a href="#catalogo">Ropa</a><a href="#catalogo">Looks</a></nav>
      <button class="a-menu" aria-label="Abrir el menú"><i></i><i></i></button>
      ${logo}
      <nav class="a-cap" aria-label="Tu cuenta"><a href="#portada">Tiendas</a><a href="#entrar">Entrar</a><a class="a-bolsa" href="#bolsa">Bolsa <b data-cuenta-bolsa>0</b></a></nav>
    </header>`;
  const pie = () => `
    <footer class="a-pie">
      <div>${logo}<p class="a-tenue" style="max-width:30ch;margin-top:16px">Separa online, confirma por WhatsApp y recoge en tu tienda.</p></div>
      <div><span class="a-cap">Ayuda</span><ul><li><a href="#portada">Cómo separar</a></li><li><a href="#portada">Cambios y devoluciones</a></li><li><a href="#portada">Nuestras tiendas</a></li></ul></div>
      <div><span class="a-cap">Tu cuenta</span><ul><li><a href="#entrar">Crear mi cuenta</a></li><li><a href="#entrar">Entrar</a></li><li><a href="#entrar">Olvidé mi contraseña</a></li></ul></div>
      <div><span class="a-cap">CAYLA</span><ul><li><a href="#portada">Club CAYLA</a></li><li><a href="#portada">Privacidad</a></li><li><a href="#portada">Términos del Club</a></li></ul></div>
    </footer>`;
  const obra = (p, i, conPrecio) => `
    <figure class="a-aparece" style="--i:${i};margin:0" data-cat="${p.cat}" data-aqp="${p.stock.aqp}" data-tru="${p.stock.tru}">
      <a class="a-obra" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}" loading="lazy"></a>
      <figcaption class="a-cedula">
        <a class="a-nombre" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a>
        ${conPrecio ? `<span class="a-precio a-num">${C.precio(p.precio)}</span>` : `<a class="a-link a-precio" href="#entrar">Ver precio</a>`}
        <span class="a-cap">${C.nombreCat(p.cat)} · ${p.colores.length === 1 ? p.colores[0][0] : p.colores.length + " colores"}${conPrecio ? ` · ${p.tallas[0]}–${p.tallas[p.tallas.length - 1]}` : ""}</span>
        ${conPrecio ? `<span class="a-dispo">Arequipa ${C.stockTexto(p.stock.aqp)} · Trujillo ${C.stockTexto(p.stock.tru)}</span>` : ""}
      </figcaption>
    </figure>`;

  const pantallas = {
    portada() {
      const [h, ...resto] = C.prendas;
      return `${cab()}
      <section class="a-hero">
        <div class="a-hero-texto">
          <span class="a-cap a-tenue">Llegó en los últimos 30 días</span>
          <h1 class="a-display a-aparece">Lo<br>nuevo</h1>
          <p>Lo que llegó a Arequipa y Trujillo. Crea tu cuenta para ver precios, tallas y cuánto hay en cada tienda.</p>
          <div class="a-acciones"><a class="a-btn" href="#entrar">Crear mi cuenta</a><a class="a-link" href="#entrar">Ya tengo cuenta</a></div>
        </div>
        ${obra(h, 1, false)}
      </section>
      <section class="a-seccion">
        <div class="a-seccion-cab"><h2 class="a-titulo">En las tiendas</h2><a class="a-link a-cap" href="#catalogo">Ver las ${C.prendas.length} prendas</a></div>
        <div class="a-sala">${[resto[0], resto[2], resto[1]].map((p, i) => obra(p, i + 2, false)).join("")}</div>
      </section>
      <section class="a-seccion">
        <div class="a-seccion-cab"><h2 class="a-titulo">Así se separa</h2><span class="a-cap a-tenue">Sin pagar en la web</span></div>
        <div class="a-pasos">${C.pasos.map(([t, d], i) => `<div class="a-paso"><span class="a-nombre">${i + 1}</span><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>
      <section class="a-club">
        <div><span class="a-cap a-tenue">Club CAYLA</span><h2 class="a-titulo" style="margin-top:16px">Tu cuenta ya es<br>tu membresía</h2><p>Al crear tu cuenta entras al Club. No hay que llenar nada más.</p><a class="a-btn" href="#entrar">Crear mi cuenta</a></div>
        <ul>${C.club.map(([t, d]) => `<li><b>${t}</b><span class="a-tenue">${d}</span></li>`).join("")}</ul>
      </section>
      <section class="a-seccion">
        <div class="a-seccion-cab"><h2 class="a-titulo">Nuestras tiendas</h2><span class="a-cap a-tenue">Recoge en la que te quede cerca</span></div>
        <div class="a-tiendas">${C.tiendas.map((t) => `<div class="a-tienda"><h3 class="a-titulo">${t.ciudad}</h3><p>${t.direccion}</p><p class="a-tenue">${t.horario}</p><div class="a-acciones"><a class="a-btn a-btn--claro" href="#portada">WhatsApp ${t.whatsapp}</a><a class="a-link" href="#portada">Cómo llegar</a></div></div>`).join("")}</div>
      </section>
      ${pie()}`;
    },

    catalogo() {
      return `${cab()}
      <div class="a-cat-cab"><h1 class="a-display" style="font-size:clamp(48px,8cqi,120px)">Ropa</h1><span class="a-cap a-tenue"><b data-cuenta-prendas>${C.prendas.length}</b> prendas</span></div>
      <div class="a-filtros a-cap" data-filtros>
        <div role="group" aria-label="Qué buscas">${C.categorias.map(([k, n], i) => `<button data-filtro="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
        <div role="group" aria-label="En qué tienda">${[["todas", "Todas las tiendas"], ["aqp", "Arequipa"], ["tru", "Trujillo"]].map(([k, n], i) => `<button data-filtro-tienda="${k}" aria-pressed="${i === 0}">${n}</button>`).join("")}</div>
      </div>
      <div class="a-rejilla">${C.prendas.map((p, i) => obra(p, i % 6, true)).join("")}</div>
      <p class="a-seccion a-tenue" data-sin-resultados hidden style="padding-top:24px">No hay prendas de este tipo en esa tienda. Prueba con «Todas las tiendas»: la tienda puede pedirla a la otra.</p>
      ${pie()}`;
    },

    prenda({ id }) {
      const p = C.prenda(id);
      const va = [...new Set((C.looks.find((l) => l.prendas.includes(p.id)) || C.looks[0]).prendas.concat(C.prendas.filter((x) => x.cat !== p.cat).map((x) => x.id)))].filter((x) => x !== p.id).slice(0, 3);
      return `${cab()}
      <div class="a-ruta a-cap a-tenue"><a href="#catalogo">Ropa</a> &nbsp;/&nbsp; <a href="#catalogo">${C.nombreCat(p.cat)}</a></div>
      <section class="a-ficha">
        <div class="a-galeria">
          <div class="a-obra"><img src="${C.foto(p)}" alt="${p.nombre}"></div>
          ${p.foto.length > 1 ? `<div class="a-galeria-mini">${p.foto.map((_, i) => `<div class="a-obra"><img src="${C.foto(p, i)}" alt="${p.nombre}, foto ${i + 1}"></div>`).join("")}</div>` : ""}
        </div>
        <div class="a-panel">
          <div><h1 class="a-nombre">${p.nombre}</h1><div class="a-precio a-num">${C.precio(p.precio)}</div></div>
          <div class="a-campo"><div class="a-campo-cab"><span class="a-cap">Color</span></div>
            <div class="a-opciones" data-grupo="color">${p.colores.map(([n, hex], i) => `<button class="a-color" data-valor="${n}" aria-pressed="${i === 0}"><i style="background:${hex}"></i>${n}</button>`).join("")}</div></div>
          <div class="a-campo"><div class="a-campo-cab"><span class="a-cap">Talla</span><a class="a-link a-tenue" href="#prenda/${p.id}">Guía de tallas</a></div>
            <div class="a-opciones" data-grupo="talla" role="group" aria-label="Talla">${p.tallas.map((t) => `<button class="a-talla" data-valor="${t}" aria-pressed="false">${t}</button>`).join("")}</div></div>
          <dl class="a-stock"><span class="a-cap" style="margin-bottom:8px">En tienda</span>${C.tiendas.map((t) => `<div><dt>${t.ciudad}</dt><dd class="${p.stock[t.id] ? "" : "a-tenue"}">${C.stockFrase(p.stock[t.id])}</dd></div>`).join("")}</dl>
          <button class="a-btn" data-agregar="${p.id}">Agregar a la bolsa</button>
          <p class="a-aviso" data-aviso role="status" aria-live="polite"></p>
          <p class="a-tenue" style="margin:-16px 0 0">No pagas nada en la web: separas, la tienda te la guarda y pagas al recoger.</p>
          <div class="a-mas">
            <details><summary>Medidas y calce</summary><p>Las medidas de cada talla, tomadas sobre la prenda.</p></details>
            <details><summary>Cambios y devoluciones</summary><p>Igual que en tienda: cámbiala en cualquier tienda CAYLA.</p></details>
          </div>
        </div>
      </section>
      <section class="a-seccion"><div class="a-seccion-cab"><h2 class="a-titulo">Va con</h2></div><div class="a-vacon">${va.map((x, i) => obra(C.prenda(x), i, true)).join("")}</div></section>
      ${pie()}`;
    },

    bolsa({ bolsa }) {
      const total = bolsa.reduce((s, l) => s + C.prenda(l.id).precio, 0);
      return `${cab()}
      <div class="a-cat-cab"><h1 class="a-display" style="font-size:clamp(44px,7cqi,104px)">Tu bolsa</h1><span class="a-cap a-tenue">${bolsa.length} ${bolsa.length === 1 ? "prenda" : "prendas"}</span></div>
      <section class="a-bolsa-cuerpo">
        <div>${bolsa.length === 0 ? `<p style="padding:24px 0;border-top:1px solid var(--linea)">Tu bolsa está vacía. <a class="a-link" href="#catalogo">Ver la ropa</a></p>` : bolsa.map((l, i) => { const p = C.prenda(l.id); return `
          <div class="a-linea">
            <a class="a-obra" href="#prenda/${p.id}"><img src="${C.foto(p)}" alt="${p.nombre}"></a>
            <div><a class="a-nombre" href="#prenda/${p.id}" style="text-decoration:none">${p.nombre}</a><span class="a-cap">${l.color} · Talla ${l.talla}</span>
              <span data-hay-aqp="${p.stock.aqp}" data-hay-tru="${p.stock.tru}">Elige la tienda para ver si hay</span>
              <button class="a-quitar" data-quitar="${i}">Quitar</button></div>
            <span class="a-precio a-num">${C.precio(p.precio)}</span>
          </div>`; }).join("")}</div>
        <aside class="a-resumen">
          <div data-antes-de-separar style="display:grid;gap:24px">
            <div class="a-campo"><span class="a-cap">Recógelo en</span>
              <div data-grupo="tienda" style="display:grid;gap:8px">${C.tiendas.map((t) => `<button class="a-tienda-opcion" data-valor="${t.id}" aria-pressed="false"><b style="font-weight:500">${t.ciudad}</b><span class="a-tenue">${t.direccion}</span></button>`).join("")}</div></div>
            <div class="a-total"><span>Total <span class="a-tenue">· pagas al recoger</span></span><b class="a-num">${C.precio(total)}</b></div>
            <button class="a-btn" data-separar ${bolsa.length ? "" : "disabled"}>Separar</button>
            <p class="a-aviso" data-aviso role="status" aria-live="polite" style="margin:-12px 0 0"></p>
            <p class="a-tenue" style="margin:0;font-size:13px">Puedes tener hasta 3 separaciones abiertas a la vez.</p>
          </div>
          <div class="a-listo" data-confirmacion hidden>
            <span class="a-cap a-tenue">Separación N.º ${C.deEjemplo.numero} · por confirmar</span>
            <h2 class="a-nombre" tabindex="-1">Te la guardamos en <span data-tienda-elegida></span></h2>
            <p>Mándala por WhatsApp: la tienda la confirma y te guarda las prendas. Pagas al recoger.</p>
            <button class="a-btn" data-whatsapp>Mandar por WhatsApp</button>
            <p class="a-mensaje" data-mensaje hidden>Hola, CAYLA <span data-tienda-elegida></span>. Quiero confirmar mi separación N.º ${C.deEjemplo.numero}:
${bolsa.map((l) => `· ${C.prenda(l.id).nombre} (${l.color}, talla ${l.talla})`).join("\n")}</p>
          </div>
        </aside>
      </section>
      ${pie()}`;
    },

    entrar() {
      const p = C.prenda("rayas");
      return `${cab()}
      <section class="a-entrar">
        <form class="a-form" novalidate>
          <h1 class="a-display">Entrar</h1>
          <label><span class="a-cap">Correo</span><input type="email" autocomplete="email" placeholder="tucorreo@gmail.com"></label>
          <label><span class="a-cap">Contraseña</span><input type="password" autocomplete="current-password"></label>
          <button class="a-btn" type="submit">Entrar</button>
          <a class="a-link a-tenue" href="#entrar" style="justify-self:start">Olvidé mi contraseña</a>
          <div class="a-o a-cap">¿Todavía no tienes cuenta?</div>
          <a class="a-btn a-btn--claro" href="#entrar">Crear mi cuenta</a>
        </form>
        <figure style="margin:0"><div class="a-obra"><img src="${C.foto(p)}" alt=""></div>
          <figcaption class="a-cedula"><span class="a-nombre">Con tu cuenta</span><span class="a-cap">Ves precios, tallas y cuánto hay en cada tienda</span></figcaption></figure>
      </section>
      ${pie()}`;
    },
  };

  window.DIRECCION = { nombre: "A · Muro", pantallas };
})();
</script>
<script src="marco.js"></script>
</body>
</html>
