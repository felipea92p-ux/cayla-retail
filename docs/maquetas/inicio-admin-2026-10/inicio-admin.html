<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inicio del Admin · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Inicio del Admin (2026-10-03)
   Pedido de Felipe: el Inicio de hoy es pobre y poco estético. Que sea
   sofisticado, elegante y sobre todo funcional; que ocupe todo el espacio,
   muy responsive y con muchas animaciones. Tres maquetas para elegir:
   A Portada · B Mosaico · C Mesa.
   Tokens = apps/web/app/globals.css (ADR-0169). Datos inventados que
   cuadran entre sí (las sedes suman el total; los medios de pago, también).
   Responsive por el ancho REAL del marco (container queries): el mismo
   código se ve a todo el ancho, en tablet y a 375 px.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--m-ef:#d19a12;--m-tar:#525a64;--m-yape:#6d3fa3;--m-plin:#1c6b56;--m-tr:#2f6aa3;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t15:rgba(26,26,24,.15);--t10:rgba(26,26,24,.1);--t06:rgba(26,26,24,.055);
--c80:rgba(245,240,232,.82);--c60:rgba(245,240,232,.62);--c40:rgba(245,240,232,.42);--c20:rgba(245,240,232,.2);--c10:rgba(245,240,232,.1);
--ease:cubic-bezier(.32,.72,.24,1);--salida:cubic-bezier(.4,0,1,1);--spk:46px;--alto:800px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d8cfbf}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
.serif{font-family:'EB Garamond',Georgia,serif}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--taupe)}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.l{width:20px;height:20px}
.k{font-variant-numeric:tabular-nums}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:sticky;top:0;z-index:300;background:var(--tinta);color:var(--crema);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}.seg button{height:30px;padding:0 11px;font-size:12.5px;color:rgba(245,240,232,.72)}.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.78);font-size:12.5px;cursor:pointer}
.spk .acc{height:30px;padding:0 11px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);color:var(--crema);font-size:12.5px}
.spk .acc:hover{background:rgba(245,240,232,.08)}
.spk .acc.lleno{border-style:solid;background:rgba(245,240,232,.1)}

/* ---------- escena y dispositivos ---------- */
.escena{display:flex;justify-content:center;align-items:flex-start}
.escena.dev{padding:24px 16px 40px}
.disp{position:relative;flex:none}
.disp.escritorio{width:100%;height:calc(100dvh - var(--spk))}
.disp.tablet{width:834px;max-width:100%;height:max(640px,min(1080px,calc(100dvh - var(--spk) - 48px)));border-radius:30px;background:#1b1a18;padding:12px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}
.disp.celular{width:391px;height:max(640px,min(812px,calc(100dvh - var(--spk) - 48px)));border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}
.marco{position:relative;width:100%;height:100%;display:flex;background:var(--crema);overflow:hidden;container:app/inline-size}
.tablet .marco{border-radius:20px}.celular .marco{border-radius:39px}

/* ---------- el ERP: lateral y barra ---------- */
.lat{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--t10);padding:14px 0 16px;background:var(--crema);z-index:5}
.lat .logo{height:46px;display:grid;place-items:center;margin-bottom:20px}
.lat .logo svg{height:27px;width:auto}
.lat nav{display:flex;flex-direction:column;gap:6px;flex:1}
.lat nav a{width:48px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--t65);position:relative;transition:background .25s var(--ease),color .25s}
.lat nav a:hover{background:var(--t06);color:var(--tinta)}
.lat nav a.on{background:var(--hueso);color:var(--tinta)}
.lat nav a.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--rojo)}
.yo{width:38px;height:38px;border-radius:50%;background:var(--taupe);color:var(--crema);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.03em}
.col{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--t15) transparent}
.barra{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:12px;padding:0 24px 0 26px;border-bottom:1px solid var(--t10);background:color-mix(in oklab,var(--crema) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.barra .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--t65)}
.barra .ico:hover{background:var(--t06);color:var(--tinta)}
.buscar{height:38px;display:flex;align-items:center;gap:10px;padding:0 9px 0 14px;border-radius:999px;background:var(--hueso);color:var(--t65);font-size:13px}
.buscar kbd{font:600 10px 'DM Sans';border:1px solid var(--sand);border-radius:5px;padding:1px 5px;background:var(--papel);color:var(--t65)}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:14px}
.barra .act{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.13em;font-weight:600;color:var(--t65);text-transform:uppercase}
.barra .sede{height:34px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}
.barra .m-only{display:none}
.cont{container:cont/inline-size;padding:34px 40px 56px}
.cont.sinpad{padding:0}
.cont>.m{max-width:1880px;margin:0 auto}
.fijo{display:none;position:absolute;left:14px;right:14px;bottom:14px;z-index:25;height:54px;border-radius:14px;background:var(--tinta);color:var(--crema);border:1px solid var(--c20);align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;box-shadow:0 14px 30px -14px rgba(26,26,24,.6)}
@container app (max-width:760px){
  .lat{display:none}
  .barra{padding:0 12px;height:56px;gap:6px}
  .barra .d-only{display:none}
  .barra .m-only{display:flex}
  .fijo{display:flex}
  .cont{padding:22px 16px 110px}
  .cont.sinpad{padding:0 0 100px}
  .cab-vender{display:none!important}
}

/* ---------- avisos de éxito (esquina superior derecha, ADR-0149) ---------- */
.toasts{position:absolute;top:72px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:340px;padding:11px 14px;border-radius:12px;background:var(--tinta);color:var(--crema);font-size:13px;box-shadow:0 14px 30px -14px rgba(26,26,24,.55);animation:avisoE .42s var(--ease) both}
.toast svg{color:var(--sand)}
.toast.sale{animation:avisoS .22s var(--salida) both}
@keyframes avisoE{from{opacity:0;transform:translate3d(0,-10px,0) scale(.97)}}
@keyframes avisoS{to{opacity:0;transform:translate3d(0,-6px,0)}}

/* ---------- piezas comunes ---------- */
.entrando .ent{animation:sube .62s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 60ms)}
@keyframes sube{from{opacity:0;transform:translate3d(0,14px,0)}}
@keyframes aparece{from{opacity:0}}
.hilo{width:28px;height:1px;background:var(--taupe);display:inline-block;flex:none;transform-origin:left}
.entrando .hilo{animation:raya .8s var(--ease) both}
@keyframes raya{from{transform:scaleX(0)}}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--t06);color:var(--t80);vertical-align:middle}
.chip>i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.verde{background:color-mix(in oklab,var(--verde) 12%,transparent);color:var(--verde)}
.chip.ambar{background:color-mix(in oklab,var(--ambar) 11%,transparent);color:var(--ambar)}
.chip.pizarra{background:color-mix(in oklab,var(--pizarra) 11%,transparent);color:var(--pizarra)}
.chip.rojo{background:color-mix(in oklab,var(--rojo) 9%,transparent);color:var(--rojo)}
.urg-t{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--rojo);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:background .25s var(--ease),border-color .25s,color .25s,transform .2s var(--ease);white-space:nowrap}
.btn.prim{background:var(--tinta);color:var(--crema)}.btn.prim:hover{background:var(--rojo-p)}
.btn.sec{border-color:var(--sand);background:transparent}.btn.sec:hover{border-color:color-mix(in oklab,var(--taupe) 40%,transparent);background:color-mix(in oklab,var(--sand) 50%,transparent)}
.btn:active{transform:scale(.98)}
.btn.chico{height:34px;padding:0 13px;font-size:12.5px;border-radius:9px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tinta)}
.lnk svg{transition:transform .3s var(--ease)}.lnk:hover svg{transform:translateX(3px)}
.nota{background:color-mix(in oklab,var(--hueso) 85%,transparent);border-radius:16px;padding:14px 18px;font-size:13px;line-height:1.6;color:var(--taupe)}
.nota b{color:var(--tinta);font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--hueso);color:var(--taupe);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;position:relative;letter-spacing:.02em}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--verde);border:2px solid var(--papel)}
.punto{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block;position:relative;flex:none}
.bucle .punto.late::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:late 2.4s var(--ease) infinite}
@keyframes late{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.8);opacity:0}}
.k.cambio{animation:destello 1.6s var(--ease)}
@keyframes destello{0%,35%{color:var(--verde)}}
[data-flota]{position:relative}
.flota{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font:600 12.5px 'DM Sans';color:var(--verde);white-space:nowrap;pointer-events:none;animation:flota 1.5s var(--ease) both;z-index:4}
@keyframes flota{0%{opacity:0;transform:translate(-50%,8px)}22%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-30px)}}
.sw{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:20px;color:var(--t30);flex:none}
.fallo{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:color-mix(in oklab,var(--hueso) 70%,transparent);font-size:13px;color:var(--t80)}
.fallo svg{color:var(--ambar);margin-top:2px}
.fallo b{display:block;font-weight:600;color:var(--tinta)}
.fallo small{display:block;color:var(--t65);margin:2px 0 8px;font-size:12.5px}
.vacio{font-size:13px;color:var(--t65);padding:6px 0}
.tcab{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;margin-bottom:14px}
.tcab .lbl{color:var(--tinta);display:inline-flex;align-items:center;gap:8px}
.pista{font-size:12px;color:var(--t50)}
.ajustar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--taupe)}
.ajustar:hover{color:var(--tinta)}
[data-a]{transition-property:width,height,left,top,stroke-dashoffset,stroke-dasharray;transition-duration:.9s;transition-timing-function:var(--ease)}

/* gráfico de línea (A) — svg estirado + etiquetas en HTML para que no se deformen */
.graf{position:relative}
.graf>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.graf path{vector-effect:non-scaling-stroke;fill:none;stroke-linejoin:round;stroke-linecap:round}
.graf .rej{stroke:var(--t10);stroke-width:1}
.graf .linea{stroke:var(--tinta);stroke-width:2.2}
.graf .area{fill:color-mix(in oklab,var(--tinta) 7%,transparent);stroke:none}
.graf .lw{stroke:var(--taupe);stroke-width:1.4;stroke-dasharray:2 5}
.graf .meta{stroke:var(--verde);stroke-width:1.2;stroke-dasharray:7 5}
.graf .proy{stroke:var(--tinta);stroke-width:1.8;stroke-dasharray:1 6;opacity:.6}
.revela{clip-path:inset(-20% 100% -20% 0);transition:clip-path 1.5s var(--ease) .2s}
.revela.ya{clip-path:inset(-20% -3% -20% 0)}
.entrando .graf .tarde{animation:aparece .6s 1.2s both}
.ahora{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--tinta);border:2.5px solid var(--crema);box-shadow:0 0 0 1px var(--tinta);z-index:2}
.bucle .ahora::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--tinta);animation:onda 2.6s var(--ease) infinite}
@keyframes onda{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.etq{position:absolute;font-size:11.5px;white-space:nowrap;pointer-events:none;z-index:2}
.etq-meta{right:0;color:var(--verde);font-weight:600;transform:translateY(calc(-100% - 3px))}
.etq-ahora{transform:translate(-50%,calc(-100% - 14px));font-weight:600;background:var(--crema);padding:1px 7px;border-radius:6px}
.etq-proy{right:0;color:var(--t65);transform:translateY(calc(-100% - 3px))}
.ejes{position:absolute;left:0;right:0;top:calc(100% + 10px);height:14px;font-size:11px;color:var(--t50)}
.ejes span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ejes span:first-child{transform:none}.ejes span:last-child{transform:translateX(-100%)}
.ley-g{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--t65)}
.ley-g span{display:inline-flex;align-items:center;gap:6px}
.ley-g i{display:inline-block;width:16px;height:0;border-top:2px solid var(--tinta)}
.ley-g i.lw{border-top:2px dotted var(--taupe)}.ley-g i.mt{border-top:1.5px dashed var(--verde)}.ley-g i.py{border-top:2px dotted var(--t50)}

/* anillo y dona (B, C) */
.anillo{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.anillo circle{fill:none;stroke-width:9}
.an-f{stroke:var(--sand)}.an-v{stroke:var(--tinta);stroke-dasharray:100;stroke-linecap:round}
.an-v.ok{stroke:var(--verde)}
.anillo.claro .an-f{stroke:var(--c10)}.anillo.claro .an-v{stroke:var(--crema)}
.anillo [data-a]{transition-duration:1.3s}
.dona{width:100%;height:100%;transform:rotate(-90deg)}
.dona circle{fill:none;stroke-width:15}
.dona .df{stroke:var(--sand)}
.dona [data-a]{transition-duration:1s}

/* =====================================================================
   A · PORTADA — la portada de un diario: titular, bajada y columnas con filetes
   ===================================================================== */
.a-l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a-vivo{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--t65)}
.a-fila{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;margin-top:12px}
.a-hola{font-family:'EB Garamond',serif;font-size:clamp(36px,4cqw,56px);font-weight:500;line-height:1;letter-spacing:-.015em}
.a-rol{margin-top:10px;font-size:15px;color:var(--taupe)}
.a-acc{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.a-ir{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--t80);border:1px solid transparent;transition:border-color .25s var(--ease),background .25s var(--ease),color .25s}
.a-ir:hover{border-color:var(--sand);background:var(--papel);color:var(--tinta)}
.a-ir b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hueso);font-size:10.5px;display:grid;place-items:center;color:var(--tinta)}
.a-acc .btn{margin-left:10px}
.a-filete{margin-top:22px;display:grid;gap:3px}
.a-filete i{display:block;height:1px;background:var(--tinta);transform-origin:left}
.a-filete i:first-child{height:2px}
.entrando .a-filete i{animation:raya 1.15s var(--ease) both}.entrando .a-filete i+i{animation-delay:.14s}
.a-lead{display:grid;gap:14px;padding:30px 0 26px;border-bottom:1px solid var(--t15)}
.a-titular{font-family:'EB Garamond',serif;font-size:clamp(30px,3.5cqw,52px);font-weight:500;line-height:1.08;letter-spacing:-.012em;text-wrap:balance}
.a-titular .w{display:inline-block}
.entrando .a-titular .w{animation:palabra .8s var(--ease) both;animation-delay:calc(200ms + var(--w) * 45ms)}
.refoco .a-titular .w{animation:palabra .6s var(--ease) both;animation-delay:calc(var(--w) * 30ms)}
@keyframes palabra{from{opacity:0;transform:translate3d(0,.32em,0);filter:blur(6px)}}
.a-bajada{font-size:16px;line-height:1.65;color:var(--t80);max-width:64ch;text-wrap:pretty}
.a-bajada b{color:var(--tinta);font-weight:600}
.a-bajada .btn{margin:10px 0 0;display:flex;width:max-content}
.refoco .a-bajada{animation:aparece .5s var(--ease) both}
.a-tele{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--t80);padding-top:12px;border-top:1px solid var(--t10);min-width:0}
.a-tele .lbl{flex:none}
.a-tele-v{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.a-tele-t{display:inline-block}
.a-tele-t b{font-weight:600}
.a-tele-t.nuevo{animation:tele .65s var(--ease) both}
@keyframes tele{from{transform:translateY(110%);opacity:0}}
.a-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.a-sec{grid-column:1/-1;padding:24px 0 26px;border-bottom:1px solid var(--t15);min-width:0}
.a-graf{height:clamp(190px,22cqw,310px);margin:4px 0 40px}
.a-cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--t15)}
.a-cifras>div{padding:14px 14px 4px 0}
.a-cifras b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(28px,2.4cqw,38px);line-height:1.1;margin-top:4px}
.a-cifras small{display:block;font-size:12px;color:var(--t65);margin-top:2px}
.a-lista{list-style:none}
.a-item{display:grid;grid-template-columns:54px minmax(0,1fr) 20px;align-items:center;gap:16px;width:100%;padding:13px 0;border-bottom:1px solid var(--t10);text-align:left}
.a-lista li:last-child .a-item{border-bottom:0}
.a-n{font-family:'EB Garamond',serif;font-size:40px;line-height:1;text-align:right;font-weight:500}
.a-item.urg .a-n{color:var(--rojo)}
.a-txt b{font-weight:500;font-size:15px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color .3s}
.a-item:hover .a-txt b{text-decoration-color:var(--sand)}

.aldia{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--t65);padding-top:13px;border-top:1px solid var(--t10);margin-top:2px;line-height:1.55}

.a-tabla{display:grid;gap:2px}
.a-fs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(50px,1.6fr) 44px minmax(74px,auto);align-items:center;gap:4px 14px;padding:11px 12px;margin:0 -12px;border-radius:10px;text-align:left;transition:background .25s var(--ease)}
.a-fs:hover{background:var(--t06)}
.a-fs.sel{background:var(--hueso)}
.a-fs.todas{border-bottom:1px solid var(--t10);border-radius:10px 10px 0 0;padding-bottom:13px;margin-bottom:4px}
.a-fs-n{font-family:'EB Garamond',serif;font-size:21px;line-height:1.1;min-width:0}

.a-fs-p{font-size:13px;font-weight:600;text-align:right}

.a-fs-m small{display:block;font-size:11.5px;color:var(--t50)}
.a-taller{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--t65);padding:12px 0 0;margin-top:6px;border-top:1px dashed var(--t15)}
.a-taller b{color:var(--tinta);font-weight:600}
.a-pila{display:flex;gap:3px;height:12px;margin:4px 0 18px}
.a-pila i{display:block;height:100%;border-radius:3px;min-width:0}
.leyenda{list-style:none;display:grid;gap:8px}
.leyenda li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 38px;gap:10px;align-items:center;font-size:13px}
.leyenda li>i{width:10px;height:10px;border-radius:3px}
.leyenda b{font-weight:600}
.leyenda small{color:var(--t50);text-align:right;font-size:12px}
.a-eq{display:grid;gap:14px 24px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.a-eq-g{grid-column:1/-1;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--t50);margin-top:2px}
.a-per{display:flex;gap:12px;align-items:flex-start;min-width:0}
.a-per b{font-weight:500;font-size:14px}
.a-per small{display:block;font-size:12px;color:var(--t50)}
.a-per em{display:block;font-family:'EB Garamond',serif;font-style:italic;font-size:15.5px;color:var(--t80);line-height:1.3;margin-top:2px}
.a-top-l{list-style:none;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

@container cont (min-width:520px){.a-cifras{grid-template-columns:repeat(4,minmax(0,1fr))}.a-cifras>div+div{border-left:1px solid var(--t10);padding-left:18px}}

  .a-pagos{grid-column:10/13;padding-left:28px;padding-right:0;border-left:1px solid var(--t15)}

@container cont (max-width:519.98px){

/* =====================================================================
   B · MOSAICO — centro de mando en tarjetas que se acomodan al ancho
   ===================================================================== */
.mB{display:flex;flex-direction:column;gap:22px}
.b-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap}
.b-sobre{display:flex;align-items:center;gap:10px}
.b-cab h1{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(34px,3.4cqw,46px);line-height:1.05;margin-top:10px;letter-spacing:-.01em}
.b-frase{margin-top:8px;font-size:15px;color:var(--t65)}
.b-frase b{color:var(--tinta);font-weight:600}
.b-cab-der{display:flex;align-items:center;gap:20px}
.b-reloj{display:flex;align-items:baseline;gap:8px}
.b-reloj b{font-family:'EB Garamond',serif;font-size:42px;font-weight:500;line-height:1}
.b-reloj small{font-size:13px;color:var(--t65)}
.b-reloj .punto{align-self:center;margin-right:2px}
.b-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hoy" "caja" "toca" "ritmo" "sedes" "vivo" "pagos" "equipo" "top" "acc"}
.b-hoy{grid-area:hoy}.b-ritmo{grid-area:ritmo}.b-caja{grid-area:caja}.b-toca{grid-area:toca}.b-sedes{grid-area:sedes}.b-pagos{grid-area:pagos}.b-vivo{grid-area:vivo}.b-equipo{grid-area:equipo}.b-top{grid-area:top}.b-acc{grid-area:acc}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:18px;padding:20px 22px;min-width:0;position:relative;transition:border-color .3s var(--ease)}
.card:hover{border-color:color-mix(in oklab,var(--taupe) 32%,var(--sand))}
.entrando .mB .card,.entrando .mC .card{animation:crece .72s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 90ms)}
@keyframes crece{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}}
.b-hoy{display:flex;flex-direction:column;gap:16px;padding:22px 24px 16px}
.b-hoy-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--sand);font-size:12px;font-weight:600;color:var(--t65);transition:background .25s var(--ease),color .25s,border-color .25s}
.pill:hover{color:var(--tinta);background:color-mix(in oklab,var(--sand) 40%,transparent)}
.pill.on{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.b-hoy-mid{display:flex;align-items:center;justify-content:space-between;gap:18px}
.b-big{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(50px,5.2cqw,80px);line-height:.95;letter-spacing:-.02em;display:inline-block}
.b-sub{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px;font-size:13px;color:var(--t65)}
.b-anillo{position:relative;width:clamp(112px,10.5cqw,156px);aspect-ratio:1;flex:none}
.anillo-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.anillo-c b{font-family:'EB Garamond',serif;font-size:clamp(26px,2.4cqw,32px);font-weight:500;line-height:1}
.anillo-c small{font-size:11.5px;color:var(--t65);margin-top:4px}
.b-barras{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:clamp(90px,9cqw,136px);align-items:end;margin-top:4px}
.b-col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.b-lw{position:absolute;left:0;right:0;bottom:0;border:1px dashed color-mix(in oklab,var(--taupe) 45%,transparent);border-bottom:0;border-radius:7px 7px 0 0}
.b-hv{position:relative;width:60%;background:color-mix(in oklab,var(--tinta) 70%,var(--papel));border-radius:5px 5px 0 0}
.b-col.cur .b-hv{background:var(--tinta)}
.b-col em{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;white-space:nowrap;background:var(--papel);padding:0 4px;border-radius:4px}
.b-ejes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--t50);text-align:center;margin-top:-8px}
.b-ejes .cur{color:var(--tinta);font-weight:700}
.b-ejes small{font-size:inherit}
@container cont (max-width:979.98px){.b-ejes .sufijo{display:none}}
.b-ritmo .n,.b-caja .n{font-family:'EB Garamond',serif;font-size:clamp(30px,2.8cqw,40px);line-height:1;font-weight:500;margin-top:8px}
.b-ritmo .n small{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--t65);font-weight:400;margin-left:4px}
.b-ritmo p,.b-caja p{font-size:13px;color:var(--t65);margin-top:8px}
.b-proy{margin-top:16px}
.b-proy-bar{position:relative;height:8px;border-radius:4px;background:var(--sand)}
.b-proy-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.b-proy-bar i.py{background:color-mix(in oklab,var(--tinta) 22%,transparent)}
.b-proy-bar i.hv{background:var(--tinta)}
.b-proy-bar em{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--verde);border-radius:1px}
.b-proy small{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--t65);margin-top:8px}
.b-caja .fila{display:flex;align-items:center;justify-content:space-between;gap:8px}

.b-toca-l{list-style:none;display:grid;gap:2px}

.b-tarea.hoy .b-ic{background:color-mix(in oklab,var(--ambar) 10%,transparent);color:var(--ambar)}
.b-tarea.semana .b-ic{background:color-mix(in oklab,var(--pizarra) 10%,transparent);color:var(--pizarra)}
.b-t b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.b-t small{display:block;font-size:12px;color:var(--t65);line-height:1.4;margin-top:2px}
.b-cnt{min-width:26px;height:22px;padding:0 7px;border-radius:11px;background:var(--hueso);font-size:12px;font-weight:700;display:grid;place-items:center}
.b-tarea.urg .b-cnt{background:var(--rojo);color:var(--crema)}
.b-chev{color:var(--t30);transition:transform .3s var(--ease),color .3s}
.b-tarea:hover .b-chev{transform:translateX(3px);color:var(--tinta)}
.b-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.b-tile{display:flex;flex-direction:column;gap:6px;padding:14px 16px 12px;border:1px solid var(--sand);border-radius:14px;background:var(--crema);text-align:left;min-width:0;transition:border-color .3s var(--ease),background .3s var(--ease),transform .3s var(--ease)}
.b-tile:hover{border-color:color-mix(in oklab,var(--taupe) 40%,var(--sand));transform:translateY(-2px)}
.b-tile.sel{border-color:var(--tinta);background:var(--papel)}
.b-tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.b-tile-n{font-family:'EB Garamond',serif;font-size:30px;font-weight:500;line-height:1.05}
.b-tbar{height:5px;border-radius:3px;background:var(--sand);overflow:hidden}
.b-tbar i{display:block;height:100%;background:var(--tinta);border-radius:3px}
.b-tile-pie{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--t65)}
.b-spark{height:38px;margin:4px 0 2px}
.b-spark .linea{stroke-width:1.6}
.b-spark .meta{stroke-width:1}
.b-tile-eq{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t65)}
.avs{display:flex}.avs .av{width:22px;height:22px;font-size:8.5px;border:2px solid var(--crema);margin-left:-6px}.avs .av:first-child{margin-left:0}
.b-tile.taller{cursor:default;background:transparent;border-style:dashed}
.b-tile.taller:hover{transform:none}
.b-pagos-in{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.b-dona{position:relative;width:136px;height:136px;flex:none}
.b-dona .anillo-c b{font-size:21px}
.b-pagos .leyenda{flex:1;min-width:170px}
.b-feed{list-style:none;display:grid}
.b-feed li{display:grid;grid-template-columns:40px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;margin:0 -6px;border-bottom:1px solid var(--t10);font-size:13px;border-radius:8px}
.b-feed li:last-child{border-bottom:0}
.b-feed .h{font-size:11.5px;color:var(--t50);font-variant-numeric:tabular-nums}
.b-feed .av{width:28px;height:28px;font-size:9.5px}
.b-feed p{line-height:1.35;color:var(--t80);min-width:0}
.b-feed p b{color:var(--tinta);font-weight:600}
.tag{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--t65);border:1px solid var(--sand);border-radius:6px;padding:2px 6px}
.b-feed li.nuevo{animation:filaNueva 1.8s var(--ease) both}
@keyframes filaNueva{0%{opacity:0;transform:translateY(-12px);background:var(--hueso)}22%{opacity:1;transform:none;background:var(--hueso)}100%{background:transparent}}
.b-eq{display:grid;gap:12px}
.b-eq .a-per em{font-size:14.5px}
.b-top-l{list-style:none;display:grid;gap:11px}
.b-top-l li{display:grid;grid-template-columns:42px minmax(0,1.3fr) minmax(60px,1fr) 30px;gap:12px;align-items:center}
.b-top-l .sw{width:42px;height:42px;border-radius:10px;font-size:15px}
.b-top-l b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-top-l small{display:block;font-size:12px;color:var(--t50)}
.b-tb{height:6px;border-radius:3px;background:var(--sand);overflow:hidden}
.b-tb i{display:block;height:100%;background:var(--tinta);border-radius:3px}
.b-top-l .u{font-weight:600;text-align:right;font-size:13px}
.b-acc{display:flex;flex-direction:column}
.b-acc-g{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));grid-auto-rows:minmax(104px,1fr);gap:10px}
.b-acc-t{justify-content:space-between}
.b-acc-t{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:14px;border:1px solid var(--sand);border-radius:14px;background:var(--crema);transition:border-color .3s var(--ease),background .3s}
.b-acc-t:hover{border-color:var(--tinta);background:var(--papel)}
.b-acc-t .icc{width:38px;height:38px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;transition:transform .35s var(--ease),background .3s,color .3s}
.b-acc-t:hover .icc{transform:translateY(-3px);background:var(--tinta);color:var(--crema)}

    "hoy hoy hoy hoy hoy hoy ritmo ritmo ritmo toca toca toca"

    "sedes sedes sedes sedes sedes sedes sedes sedes sedes toca toca toca"

/* =====================================================================
   C · MESA — panel oscuro con el pulso del día + «Lo primero» y la línea del día
   ===================================================================== */
.mC{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(var(--alto) - 60px)}
.c-panel{background:var(--tinta);color:var(--crema);align-self:start;position:relative}
.c-in{display:flex;flex-direction:column;gap:22px;padding:26px 20px 24px}
.entrando .c-panel{animation:telon 1s var(--ease) both}
@keyframes telon{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.entrando .cpe{animation:sube .62s var(--ease) both;animation-delay:calc(300ms + var(--i) * 80ms)}
.c-reloj .lbl{color:var(--c60)}
.c-hora{font-family:'EB Garamond',serif;font-size:64px;font-weight:500;line-height:1;margin-top:8px;letter-spacing:-.02em}
.c-hora small{font-family:'DM Sans',sans-serif;font-size:15px;color:var(--c60);margin-left:8px;letter-spacing:0}
.c-reloj p{font-size:13px;color:var(--c60);margin-top:8px;display:flex;align-items:center;gap:8px}
.c-hero{display:flex;align-items:center;gap:20px}
.c-anillo{position:relative;width:128px;aspect-ratio:1;flex:none}
.c-anillo .anillo-c small{color:var(--c60)}
.c-total{min-width:0}
.c-total b{font-family:'EB Garamond',serif;font-size:44px;font-weight:500;line-height:1;display:inline-block}
.c-total small{display:block;font-size:13px;color:var(--c60);margin-top:8px}
.c-linea-p{font-size:13.5px;color:var(--c60);line-height:1.6;margin-top:-4px}
.c-linea-p b{color:var(--crema);font-weight:600}
.c-total .btn{margin-top:12px;background:var(--crema);color:var(--tinta)}
.c-total .btn:hover{background:var(--hueso)}
.c-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--c10);border-bottom:1px solid var(--c10)}
.c-mini div{padding:12px 0;min-width:0}.c-mini div+div{border-left:1px solid var(--c10);padding-left:12px}
.c-mini small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c40);font-weight:600;white-space:nowrap}
.c-mini b{font-family:'EB Garamond',serif;font-size:22px;font-weight:500}
.c-sedes{display:grid;gap:3px}
.c-sedes>.lbl{color:var(--c40);margin-bottom:6px}
.c-sf{display:grid;grid-template-columns:92px minmax(0,1fr) 42px;gap:12px;align-items:center;padding:9px 10px;margin:0 -10px;border-radius:10px;font-size:13px;color:var(--c80);text-align:left;transition:background .25s var(--ease),color .25s}
.c-sf:hover{background:var(--c10);color:var(--crema)}
.c-sf.sel{background:var(--crema);color:var(--tinta)}
.c-sb{height:4px;border-radius:2px;background:var(--c20);overflow:hidden}.c-sb i{display:block;height:100%;background:var(--crema);border-radius:2px}
.c-sf.sel .c-sb{background:var(--sand)}.c-sf.sel .c-sb i{background:var(--tinta)}
.c-sf b{text-align:right;font-weight:600}
.c-taller{font-size:12px;color:var(--c60);display:flex;gap:8px;align-items:center;padding:10px 0 0;line-height:1.4}
.c-vender{height:52px;border-radius:12px;background:var(--crema);color:var(--tinta);display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;transition:background .25s var(--ease);flex:none}
.c-vender:hover{background:var(--hueso)}
.c-panel .k.cambio{animation:none}
.c-trabajo{container:trab/inline-size;padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.c-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.c-cab h1{font-family:'EB Garamond',serif;font-size:clamp(34px,3.2cqw,46px);font-weight:500;line-height:1.05;letter-spacing:-.01em}
.c-cab p{margin-top:8px;font-size:15px;color:var(--t65)}
.c-cab p b{color:var(--tinta);font-weight:600}
.c-acc{display:flex;gap:6px;flex-wrap:wrap}
.c-acc a{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--t80);transition:background .25s var(--ease),border-color .25s,color .25s}
.c-acc a:hover{border-color:var(--tinta);color:var(--tinta);background:var(--papel)}
.c-acc a b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hueso);font-size:10.5px;display:grid;place-items:center}
.c-foco-cab{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.c-foco-cab .lbl{color:var(--tinta)}
.c-pos{font-size:12px;color:var(--t50)}
.c-nav{margin-left:auto;display:flex;gap:6px}
.c-nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--sand);display:grid;place-items:center;transition:background .25s,border-color .25s}
.c-nav button:hover{border-color:var(--tinta);background:var(--papel)}
.c-fc{background:var(--papel);border:1px solid var(--sand);border-radius:20px;padding:24px 26px 22px 30px;position:relative;overflow:hidden}
.c-fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--t15)}
.c-fc.urg::before{background:var(--rojo)}.c-fc.hoy::before{background:var(--ambar)}.c-fc.semana::before{background:var(--pizarra)}
.c-fc-top{display:flex;align-items:flex-start;gap:18px}
.c-fc-n{font-family:'EB Garamond',serif;font-size:clamp(56px,6cqw,84px);line-height:.85;font-weight:500}
.c-fc.urg .c-fc-n{color:var(--rojo)}
.c-fc h3{font-family:'EB Garamond',serif;font-size:clamp(24px,2.6cqw,32px);font-weight:500;line-height:1.1;margin-bottom:6px}
.c-fc-ex{font-size:14.5px;color:var(--t80);max-width:70ch;margin-top:14px;line-height:1.6}
.c-tw{overflow-x:auto;margin-top:16px}
.c-tabla{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.c-tabla th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t50);font-weight:600;padding:0 14px 8px 0;border-bottom:1px solid var(--sand);white-space:nowrap}
.c-tabla td{padding:9px 14px 9px 0;border-bottom:1px solid var(--t10);white-space:nowrap}
.c-tabla tr:last-child td{border-bottom:0}
.c-tabla td.neg{color:var(--rojo-p);font-weight:600}.c-tabla td.pos{color:var(--verde);font-weight:600}
.c-fc-pie{font-size:13px;color:var(--t65);margin-top:10px}.c-fc-pie b{color:var(--tinta);font-weight:600}
.c-fc-acc{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.c-fc.de-der{animation:deDer .5s var(--ease) both}.c-fc.de-izq{animation:deIzq .5s var(--ease) both}
.c-fc.de-der>*,.c-fc.de-izq>*{animation:sube .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
@keyframes deDer{from{opacity:0;transform:translate3d(36px,0,0)}}
@keyframes deIzq{from{opacity:0;transform:translate3d(-36px,0,0)}}
.c-cola{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.c-ci{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;color:var(--t80);transition:background .25s var(--ease),border-color .25s,color .25s}
.c-ci:hover{border-color:var(--tinta);color:var(--tinta)}
.c-ci i{width:7px;height:7px;border-radius:50%;background:var(--pizarra)}.c-ci.urg i{background:var(--rojo)}.c-ci.hoy i{background:var(--ambar)}
.c-ci b{font-weight:700}
.c-ci.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.c-ci.on i{box-shadow:0 0 0 2px var(--tinta),0 0 0 3px var(--c40)}
.c-linea{padding:20px 22px 16px}
.c-l-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.c-ley{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--t65)}
.c-ley span{display:inline-flex;align-items:center;gap:6px}
.c-ley .lv{width:3px;height:12px;background:var(--tinta);border-radius:2px}.c-ley .lc{width:9px;height:9px;border-radius:2px;background:var(--verde)}.c-ley .lo{width:9px;height:9px;border-radius:50%;background:var(--pizarra)}
.c-ls{overflow-x:auto;overflow-y:hidden;margin:0 -22px;padding:0 22px;scrollbar-width:thin}
.c-l{position:relative;min-width:700px;padding:30px 0 12px}
.c-horas{display:grid;grid-template-columns:62px minmax(0,1fr);height:18px}
.c-horas div{position:relative}
.c-horas div span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--t50);white-space:nowrap}
.c-horas div span:first-child{transform:none}.c-horas div span:last-child{transform:translateX(-100%)}
.c-lane{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;height:50px;border-top:1px solid var(--t10)}
.c-lane-n{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--t50)}
.c-lane.sel .c-lane-n{color:var(--tinta)}
.c-pista{position:relative;height:100%}
.c-lane.sel .c-pista{background:linear-gradient(90deg,color-mix(in oklab,var(--hueso) 0%,transparent),color-mix(in oklab,var(--hueso) 70%,transparent))}
.c-band{position:absolute;top:9px;bottom:9px;border-radius:6px;background:color-mix(in oklab,var(--sand) 75%,transparent)}
.c-v{position:absolute;bottom:11px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--tinta);transform-origin:bottom}
.c-v::before{content:"";position:absolute;inset:-6px -5px}
.c-o{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--pizarra);border:2px solid var(--papel)}
.c-o.caja{border-radius:3px;background:var(--verde)}
.c-o.apartado{background:var(--ambar)}.c-o.cambio{background:var(--taupe)}.c-o.taller{background:var(--tinta)}

[data-tip]:hover{z-index:6}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--crema);font:500 11.5px 'DM Sans';padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;animation:aparece .2s var(--ease)}
.entrando .c-v{animation:tick .45s var(--ease) both;animation-delay:calc(560ms + var(--d) * 1ms)}
.entrando .c-o,.entrando .c-band{animation:aparece .5s var(--ease) both;animation-delay:calc(480ms + var(--d) * 1ms)}
.c-v.nuevo{animation:tickNuevo 1.6s var(--ease) both}

@keyframes tickNuevo{0%{transform:scaleY(0);background:var(--verde)}35%{transform:scaleY(1);background:var(--verde)}100%{background:var(--tinta)}}

.bucle .c-ahora::before{content:"";position:absolute;bottom:-8px;left:-8.75px;width:16px;height:16px;border-radius:50%;border:1px solid var(--tinta);animation:onda 2.6s var(--ease) infinite}

.c-fila{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function generarVentas(cajas,gente){
  const r=rng(20261003),out=[];let id=0;
  const pesos=[['ef',.26],['tar',.36],['yape',.28],['plin',.06],['tr',.04]];
  for(const s of ORDEN){
    const sl=SLOTS[s],hs=Object.keys(sl).map(Number),tot=hs.reduce((a,h)=>a+sl[h],0),extra=TICKETS[s]-hs.length;
    // al menos un ticket por hora y el resto por mayor resto, para que los tickets cuadren exactos
    const raw=hs.map(h=>extra*sl[h]/tot),k=raw.map(x=>1+Math.floor(x));
    raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).slice(0,TICKETS[s]-k.reduce((a,b)=>a+b,0)).forEach(([,i])=>k[i]++);
    hs.forEach((h,i)=>{
      const n=k[i],w=Array.from({length:n},()=>.55+r()),sw=w.reduce((a,b)=>a+b,0);
      const desde=Math.max(h*60,cajas[s].desde+3),hasta=Math.min(h*60+59,1059);
      const ts=Array.from({length:n},()=>Math.round(desde+r()*(hasta-desde))).sort((a,b)=>a-b);
      let resto=sl[h];
      for(let j=0;j<n;j++){
        const m=j===n-1?resto:Math.round(sl[h]*w[j]/sw);resto-=m;
        const quienes=gente[s].filter(p=>p.desde<=ts[j]);const q=quienes[Math.floor(r()*quienes.length)]||gente[s][0];
        out.push({id:'v'+(id++),sede:s,t:ts[j],monto:m,prendas:Math.max(1,Math.min(4,Math.round(m/85))),metodo:'tar',quien:q.n});
      }
    });
    // Medio de pago: cada ticket (del más grande al más chico) va al medio que más lejos está de su parte habitual,
    // para que el reparto se parezca al de una tienda real (efectivo 26 %, tarjeta 36 %, Yape 28 %, Plin 6 %, transferencia 4 %).
    const mias=out.filter(v=>v.sede===s).sort((a,b)=>b.monto-a.monto),falta=Object.fromEntries(pesos.map(([k,w])=>[k,w*tot]));
    mias.forEach(v=>{const k=Object.keys(falta).sort((a,b)=>falta[b]-falta[a])[0];v.metodo=k;falta[k]-=v.monto});
  }
  return out.sort((a,b)=>a.t-b.t);
}

  const abiertas=ss.filter(s=>DIA.cajas[s].abierta).length;
  const sh=share(S.now),lwNow=lwFull*sh,rest=Math.max(0,CIERRA-Math.max(S.now,ABRE)),falta=Math.max(0,meta-total);
  const proy=total>0&&sh>.12?Math.round(total/sh/10)*10:null;
  const pagos={};MET.forEach(m=>pagos[m.k]=0);vs.forEach(v=>pagos[v.metodo]+=v.monto);
  const horas=Array(12).fill(0);vs.forEach(v=>{const i=Math.floor(v.t/60)-9;if(i>=0&&i<12)horas[i]+=v.monto});
  const lwHoras=Array.from({length:12},(_,i)=>lwFull*(SHARE[i+1]-SHARE[i]));
  return {F,ss,vs,total,tickets,prendas,medio:tickets?total/tickets:null,meta,pct:meta?total/meta*100:0,falta,rest,ritmo:rest>0&&abiertas?falta/(rest/60):null,

}

// Curva monótona (Fritsch–Carlson): suaviza la escalera de ventas sueltas sin inventar bajadas, porque lo acumulado nunca baja.
function suave(pts){
  const p=pts.filter((q,i)=>i===0||Math.abs(q[0]-pts[i-1][0])>.01||Math.abs(q[1]-pts[i-1][1])>.01),n=p.length,f=v=>v.toFixed(2);
  if(n<3)return 'M'+p.map(q=>f(q[0])+' '+f(q[1])).join(' L');
  const dx=[],m=[];for(let i=0;i<n-1;i++){dx.push(p[i+1][0]-p[i][0]);m.push(dx[i]>1e-6?(p[i+1][1]-p[i][1])/dx[i]:0)}
  const t=[m[0]];for(let i=1;i<n-1;i++)t.push(m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2);t.push(m[n-2]);
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],h=a*a+b*b;if(h>9){const k=3/Math.sqrt(h);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  let d=`M${f(p[0][0])} ${f(p[0][1])}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${f(p[i][0]+h)} ${f(p[i][1]+t[i]*h)} ${f(p[i+1][0]-h)} ${f(p[i+1][1]-t[i+1]*h)} ${f(p[i+1][0])} ${f(p[i+1][1])}`}
  return d;
}

function moverTrazo(e,from,to,kind){const t0=performance.now(),dura=750,ease=x=>1-Math.pow(1-x,3);
  const paso=now=>{const x=Math.min(1,(now-t0)/dura),k=ease(x);e.setAttribute('d',trazo(from.map((p,i)=>[p[0]+(to[i][0]-p[0])*k,p[1]+(to[i][1]-p[1])*k]),kind));if(x<1)requestAnimationFrame(paso)};

function retrasoDe(e){const c=e.closest('[style*="--i"]');const i=c?parseFloat(c.style.getPropertyValue('--i'))||0:0;return 220+i*60}
function animar(root,prev,entrada){
  const rm=reducido();

    if(!entrada&&ant!==undefined&&Math.round(ant)!==Math.round(to))e.classList.add('cambio');
    if(rm||from===to)return;contar(e,from,to,e.dataset.f,entrada?1100:700,entrada?retrasoDe(e):0)});
  const pend=[];
  $$('[data-a]',root).forEach(e=>{const fin=JSON.parse(e.dataset.fin),from=entrada?JSON.parse(e.dataset.ini):prev.a[e.dataset.a];
    if(rm||!from||igual(from,fin))return;e.style.transition='none';for(const k in from)e.style.setProperty(k,from[k]);pend.push([e,fin])});

}

        <section class="card" style="--i:4"><div class="tcab"><span class="lbl">Equipo de hoy · ${c.F==='TODAS'?'CAYLA':c.F}</span><span class="pista">${equipo(S.foco).length} en turno</span></div>${equipoHTML(S.foco,'c-eq')}</section>
        <section class="card" style="--i:5"><div class="tcab"><span class="lbl">Cómo pagan · ${c.F==='TODAS'?'CAYLA':c.F}</span></div>${pagosHTML(c,'pila')}</section>
        <section class="card" style="--i:6"><div class="tcab"><span class="lbl">${tp.k==='hoy'?'Lo que más sale hoy':'Lo que más salió ayer'}</span><span class="pista">toda CAYLA</span></div><ol class="c-tp">${tp.lista.map(p=>`<li>${sw(p)}<div><b>${p.n}</b><small>${p.c} · ${fmtS(p.u*p.precio)}</small></div><span class="u">${K('tu-'+p.ini,p.u,'n')}</span></li>`).join('')}</ol></section>
      </div>
      <p class="nota ent" style="--i:7"><b>Cifras de hoy hasta las ${hora12(S.now)}</b>; se actualizan solas. La línea del día sale de Actividad (ADR-0207): cada raya es una venta y cada punto, un traslado, un apartado o un cambio. Un dato que no se pudo leer lo dice: nunca se dibuja como 0.</p>
    </div>
  </div>`}};
function moverFoco(d){const L=toca();S.focoC=((S.focoC+d)%L.length+L.length)%L.length;const f=$('#c-foco');if(f)f.innerHTML=focoHTML(d>0?'de-der':'de-izq')}
function irFoco(j){const d=j>=S.focoC?1:-1;S.focoC=j;const f=$('#c-foco');if(f)f.innerHTML=focoHTML(d>0?'de-der':'de-izq')}

/* =====================================================================
   ACCIONES
   ===================================================================== */
function enfocar(s){if(S.foco===s)return;S.foco=s;pintar(false)}
function reintentar(){S.falla=false;barra();pintar(false)}
function abrirCaja(s){
  if(DIA.cajas[s].abierta)return;
  const p=GENTE[s][0];
  if(!DIA.gente[s].some(x=>x.n===p.n)){DIA.gente[s].push({...p,desde:S.now-2});DIA.otros.push({id:`a-${s}-x${S.now}`,t:S.now-2,sede:s,quien:p.n,tipo:'asist',txt:'marcó asistencia'})}
  DIA.cajas[s]={abierta:true,desde:S.now,quien:p.n,fondo:200};
  DIA.otros.push({id:`c-${s}-x${S.now}`,t:S.now,sede:s,quien:p.n,tipo:'caja',txt:'abrió caja con S/ 200'});
  pintar(false);avisar(`Caja de ${SEDES[s].nombre} abierta con S/ 200`);
}
function llegaVenta(){
  const abiertas=ORDEN.filter(s=>DIA.cajas[s].abierta);if(!abiertas.length){avisar('Ninguna caja está abierta');return}
  if(S.now>=CIERRA-2){avisar('Las tiendas ya cerraron');return}
  const q=COLA[S.sim%COLA.length];S.sim++;
  const sede=abiertas.includes(q.sede)?q.sede:abiertas[S.sim%abiertas.length];
  S.now=Math.min(CIERRA-2,S.now+2+(S.sim%3));
  const gente=DIA.gente[sede].filter(p=>p.desde<=S.now),quien=(gente[S.sim%gente.length]||GENTE[sede][0]).n,pr=PRENDAS[q.p],monto=pr.precio*q.q;
  DIA.ventas.push({id:'v'+(DIA.nid++),sede,t:S.now,monto,prendas:q.q,metodo:q.met,quien});DIA.unid[q.p]+=q.q;
  pintar(false);
  if(!reducido())$$('[data-flota]').filter(e=>e.dataset.flota===sede||e.dataset.flota==='TODAS').forEach(e=>{const f=document.createElement('span');f.className='flota';f.textContent='+'+fmtS(monto);e.appendChild(f);setTimeout(()=>f.remove(),1600)});
}
function avisar(txt){const c=$('#toasts');if(!c)return;const t=document.createElement('div');t.className='toast';t.innerHTML=`${ic('check','s')}<span>${txt}</span>`;c.appendChild(t);setTimeout(()=>{t.classList.add('sale');setTimeout(()=>t.remove(),260)},2600)}
let vivoT=null;
function programarVivo(){clearInterval(vivoT);if(S.vivo)vivoT=setInterval(()=>{if(!document.hidden)llegaVenta()},9000)}

/* =====================================================================
   BARRA DEL SPIKE, PANEL «LA IDEA» Y MONTAJE
   ===================================================================== */
function barra(){
  const seg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button class="${S[k]===v?'on':''}" onclick="cambia('${k}','${v}')">${t}</button>`).join('')}</div>`;
  const chk=(k,t)=>`<label><input type="checkbox" ${S[k]?'checked':''} onchange="alternar('${k}',this.checked)" style="accent-color:var(--rojo)"> ${t}</label>`;
  $('#spk').innerHTML=`<span class="tag">Spike · Inicio del Admin</span>
  ${seg('m',[['A','A · Portada'],['B','B · Mosaico'],['C','C · Mesa']])}
  ${seg('vista',[['escritorio','Todo el ancho'],['tablet','Tablet 834'],['celular','Celular 375']])}
  ${seg('momento',[['manana','9:40 a. m. · antes de abrir'],['tarde','5:40 p. m. · en marcha']])}
  ${chk('vivo','Ventas en vivo')}${chk('bucle','Movimiento continuo')}${chk('rm','Movimiento reducido')}${chk('falla','Falla una lectura')}
  <button class="acc lleno" onclick="llegaVenta()">+ Llega una venta</button>
  <button class="acc" onclick="pintar(true)">↺ Ver la entrada otra vez</button>
  <button class="acc" onclick="verIdea()">ⓘ La idea de ${S.m}</button>`;
  medir();
}
function cambia(k,v){
  S[k]=v;
  if(k==='momento'){DIA=escenario(v);S.now=v==='tarde'?1060:580;S.sim=0;S.focoC=0;S.vistos=new Set()}
  barra();if(k==='vista'||k==='m'){montar();if(S.idea)ideaHTML()}else pintar(true);
}
function alternar(k,v){S[k]=v;if(k==='vivo')programarVivo();if(k==='bucle'||k==='rm'){const a=$('#app');a.classList.toggle('bucle',S.bucle);a.classList.toggle('rm',S.rm);if(k==='rm')pintar(true)}if(k==='falla')pintar(false)}
function verIdea(){S.idea=!S.idea;ideaHTML();$('#idea').classList.toggle('abierta',S.idea)}
function ideaHTML(){const M=MAQ[S.m];$('#idea').innerHTML=`<button class="cerrar" onclick="verIdea()" aria-label="Cerrar">${ic('x','s')}</button>
  <span class="lbl">La idea</span><h2>${M.nombre}</h2><p style="margin-top:8px">${M.idea}</p>
  <h3>Movimiento</h3><ul>${M.mov.map(x=>`<li>${x}</li>`).join('')}</ul>
  <p class="ojo"><b>En bucle</b> (solo con «Movimiento continuo»): ${M.bucle} La regla de movimiento (ADR-0136) solo admite bucles que sean señal; si se elige así, queda escrito como excepción.</p>
  <h3>Prueba esto</h3><ul>
    <li>Toca una sede (o «Toda CAYLA»): sus cifras pasan arriba, contando.</li>
    <li>«+ Llega una venta», o deja «Ventas en vivo» encendido (llega una cada 9 s).</li>
    <li>Cambia a <b>9:40 a. m.</b>: así se ve antes de abrir, con la caja de LIM cerrada. Ábrela desde la pantalla.</li>
    <li>«Falla una lectura»: «Cómo pagan» dice que no pudo leer, en vez de mostrar 0.</li>
    <li>Achica la ventana o elige Tablet o Celular: se reacomoda por el ancho real, y en el celular «Vender» queda fijo abajo.</li></ul>
  <h3>Igual en las tres</h3><ul>
    <li>Los mismos datos: ventas de hoy contra la meta de la sede y el sábado pasado, «Te toca» con lo urgente arriba, las cuatro sedes con el Taller, equipo, medios de pago y lo que más sale.</li>
    <li>Solo tokens de la paleta. El rojo solo marca lo urgente.</li>
    <li>Nada se re-anima al cambiar de sede o al llegar una venta: solo se re-asienta lo que cambió.</li></ul>`}
function medir(){const s=$('#spk');if(s)document.documentElement.style.setProperty('--spk',s.offsetHeight+'px');const a=$('#app');if(a)a.style.setProperty('--alto',a.clientHeight+'px')}
function montar(){
  const esc=$('#esc');esc.className='escena'+(S.vista==='escritorio'?'':' dev');
  const nav=[['inicio','Inicio',1],['bolsa','Ventas'],['caja3d','Inventario'],['capas','Catálogo'],['camion','Compras'],['cartera','Finanzas'],['premio','Clientes'],['barras','Rendimiento']];
  esc.innerHTML=`<div class="disp ${S.vista}"><div class="marco ${S.bucle?'bucle':''} ${S.rm?'rm':''}" id="app">
    <aside class="lat"><div class="logo">${ISO}</div><nav>${nav.map(([i,t,on])=>`<a class="${on?'on':''}" title="${t}" onclick="${on?'':`irA('${t}')`}">${ic(i)}</a>`).join('')}</nav><span class="yo" title="Felipe Alvarez">FA</span></aside>
    <div class="col" id="col">
      <header class="barra">
        <button class="ico m-only" aria-label="Menú" onclick="irA('el menú lateral (cajón)')">${ic('menu')}</button>
        <span class="m-only" style="height:22px">${ISO.replace('<svg','<svg style="height:22px;width:auto"')}</span>
        <button class="ico d-only" aria-label="Plegar menú">${ic('panel')}</button>
        <button class="buscar d-only" onclick="irA('Buscar')">${ic('lupa','s')} Buscar… <kbd>Ctrl</kbd><kbd>K</kbd></button>
        <div class="der"><button class="ico m-only" aria-label="Buscar">${ic('lupa')}</button><a class="act d-only" onclick="irA('Actividad')">${ic('historia','s')} Actividad</a><button class="sede" onclick="avisar('El selector de sede no cambia en la maqueta: usa las sedes del Inicio')">Tienda LIM ${ic('abajo','s')}</button></div>
      </header>
      <main class="cont" id="cont"></main>
    </div>
    <button class="fijo" onclick="irA('Punto de Venta')">${ic('bolsa')} Vender</button>
    <div class="toasts" id="toasts"></div>
  </div></div>`;
  medir();pintar(true);
}
document.addEventListener('keydown',e=>{if(S.m!=='C'||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')moverFoco(1);if(e.key==='ArrowLeft')moverFoco(-1)});
window.addEventListener('resize',medir);
barra();montar();programarVivo();
</script>
</body>
</html>
