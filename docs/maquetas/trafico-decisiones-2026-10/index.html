<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="claude:viewport-fit-sides" content="cover" />
<title>Tráfico de la tienda web</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* Maqueta v3 «Observatorio de la tienda web» · Tienda web ▸ Tráfico (evolución de ADR-0495).
   Tres direcciones sobre los MISMOS tokens del ERP (globals.css + tema.css): crema, papel, tinta, rojo, verde, ámbar, pizarra.
   Los datos son inventados con semilla fija; nada sale de la base. */
:root {
  --crema: #f5f0e8; --papel: #fbf8f2; --hueso: #eae1d2; --sand: #e8e0d0;
  --tinta: #1a1a18; --tinta60: #5b544c; --taupe: #805c4c; --borde: #96786a;
  --rojo: #b8412d; --rojo2: #8b2a1f; --verde: #48603f; --ambar: #74501a; --pizarra: #4c5d6e;
  --fija-osc: #1a1a18; --fija-cla: #f5f0e8; --ambar-sobre-osc: #e4b968; --verde-sobre-osc: #9ccb8d;
  --serif: "EB Garamond", ui-serif, Georgia, serif; --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(0.32, 0.72, 0.24, 1);
  --barra-bg: #111110; --barra-fg: #f5f0e8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --crema: #1c1a17; --papel: #26241f; --hueso: #33302a; --sand: #403b34; --tinta: #f5f0e8; --tinta60: #b9b2a7;
    --taupe: #c4a898; --borde: #8d7a6e; --rojo: #e8806a; --rojo2: #f29a86; --verde: #9ccb8d; --ambar: #e4b968; --pizarra: #a2b8cd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --crema: #1c1a17; --papel: #26241f; --hueso: #33302a; --sand: #403b34; --tinta: #f5f0e8; --tinta60: #b9b2a7;
  --taupe: #c4a898; --borde: #8d7a6e; --rojo: #e8806a; --rojo2: #f29a86; --verde: #9ccb8d; --ambar: #e4b968; --pizarra: #a2b8cd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--crema); color: var(--tinta); font: 400 14px/1.5 var(--sans); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
b, strong { font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

/* ---- barra de la maqueta (no es del diseño) ---- */
.mq { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--barra-bg); color: var(--barra-fg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 12px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.mq-t { font-weight: 600; letter-spacing: .02em; }
.mq-g { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.mq-g > span { opacity: .6; margin-right: 4px; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.mq-b { background: transparent; border: 1px solid rgb(245 240 232 / .28); color: var(--barra-fg); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
.mq-b[aria-pressed="true"] { background: #f5f0e8; color: #1a1a18; border-color: #f5f0e8; }
.mq-nota { opacity: .65; margin-left: auto; }
@media (max-width: 640px) { .mq { position: static; } .mq-nota { margin-left: 0; } .mq-g:has([data-mq="ancho"]) { display: none; } }
.escenario { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.marco { margin: 0 auto; width: 100%; border: 1px solid var(--sand); border-radius: 14px; overflow: hidden; background: var(--crema); }


/* categorías: los colores de método de pago del ERP reutilizados para los caminos (a confirmar con Felipe) */
:root { --c-ig: #6d3fa3; --c-wa: #1c6b56; --c-di: #525a64; --c-tt: #2f6aa3; --c-go: #b88410; --c-qr: #805c4c; --c-ot: #9a8b7b; --brillo: rgb(255 255 255 / .9); --elev: 0 14px 34px -22px rgb(26 26 24 / .28); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-ig: #b793e0; --c-wa: #5fc7a8; --c-di: #a9b4c0; --c-tt: #7fb2e5; --c-go: #e8b84a; --c-qr: #c4a898; --c-ot: #b9ad9f; --brillo: rgb(255 255 255 / .06); --elev: 0 14px 34px -20px rgb(0 0 0 / .7); } }
:root[data-theme="dark"] { --c-ig: #b793e0; --c-wa: #5fc7a8; --c-di: #a9b4c0; --c-tt: #7fb2e5; --c-go: #e8b84a; --c-qr: #c4a898; --c-ot: #b9ad9f; --brillo: rgb(255 255 255 / .06); --elev: 0 14px 34px -20px rgb(0 0 0 / .7); }
.mq { position: static; }

.erp { container: erp / inline-size; position: relative; background: radial-gradient(1100px 380px at 12% -80px, color-mix(in srgb, var(--tinta) 5%, transparent), transparent 70%), var(--crema); color: var(--tinta); padding: 30px 40px 64px; min-height: 600px; font-size: 14.5px; line-height: 1.5; }
.erp .linea { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--tinta60); }
.erp .linea i { width: 28px; height: 1px; background: var(--taupe); opacity: .6; }
.cabp { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.erp h1 { font: 500 46px/1.05 var(--serif); margin: 6px 0 4px; letter-spacing: -.01em; }
.erp .frase { margin: 0; color: var(--tinta60); font-size: 15.5px; }
.ic { flex: none; display: block; }
kbd { font: 500 10.5px var(--sans); border: 1px solid var(--sand); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--tinta60); background: var(--papel); }

/* barra de filtros pegada arriba, con vidrio */
.barra { position: sticky; top: 0; z-index: 15; margin: 18px -40px 18px; padding: 10px 40px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; background: color-mix(in srgb, var(--crema) 80%, transparent); backdrop-filter: blur(14px) saturate(1.3); border-block: 1px solid color-mix(in srgb, var(--sand) 70%, transparent); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--hueso); }
.seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font-size: 13.5px; font-weight: 500; color: var(--tinta60); display: inline-flex; align-items: center; gap: 7px; transition: background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--papel); color: var(--tinta); box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 0 0 1px var(--sand); }
@media (hover: hover) { .seg button:hover:not([aria-pressed="true"]) { color: var(--tinta); } }
.seg small { font-size: 11px; opacity: .6; }
.pill { height: 40px; padding: 0 14px; border: 1px solid var(--borde); border-radius: 999px; background: transparent; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; white-space: nowrap; list-style: none; transition: background .2s var(--ease); }
.pill::-webkit-details-marker { display: none; }
.pill[aria-pressed="true"] { border-color: var(--tinta); background: color-mix(in srgb, var(--tinta) 7%, transparent); }
@media (hover: hover) { .pill:hover { background: var(--hueso); } }
.pop { position: relative; }
.pop-l { position: absolute; z-index: 30; top: 46px; left: 0; min-width: 220px; background: var(--papel); border: 1px solid var(--sand); border-radius: 14px; padding: 6px; box-shadow: var(--elev); }
.pop-l button { display: flex; width: 100%; justify-content: space-between; gap: 12px; border: 0; background: transparent; padding: 9px 12px; border-radius: 9px; text-align: left; font-size: 14px; }
@media (hover: hover) { .pop-l button:hover { background: var(--hueso); } }
.pop-l button[aria-current="true"] { font-weight: 600; }
.pop-l em { font-style: normal; color: var(--tinta60); font-variant-numeric: tabular-nums; }
.puesto { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--tinta); color: var(--crema); border: 0; font-size: 13.5px; }
.barra .der { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--tinta60); }
.vivo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--verde); margin-right: 7px; animation: late 2.2s ease-in-out infinite; }
@keyframes late { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--verde) 45%, transparent); } 60%, 100% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--verde) 0%, transparent); } }

/* tarjetas */
.card { position: relative; background: var(--papel); border: 1px solid var(--sand); border-radius: 20px; box-shadow: inset 0 1px 0 var(--brillo), var(--elev); min-width: 0; }
.card .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 0; }
.card .cab h3 { margin: 0; font: 500 20px/1.2 var(--serif); }
.card .cab small { color: var(--tinta60); font-size: 12.5px; }
.card .cuerpo { padding: 14px 22px 22px; }
.lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta60); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--hueso); color: var(--tinta); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--verde); background: color-mix(in srgb, var(--verde) 14%, var(--papel)); }
.chip.al { color: var(--ambar); background: color-mix(in srgb, var(--ambar) 15%, var(--papel)); }
.chip.in { color: var(--pizarra); background: color-mix(in srgb, var(--pizarra) 14%, var(--papel)); }
.chip.sp0::before { display: none; }
.dlt { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dlt.up { color: var(--verde); } .dlt.dn { color: var(--ambar); } .dlt.eq { color: var(--tinta60); }
.g { display: grid; gap: 16px; margin-top: 16px; } .g > * { min-width: 0; }
.g8 { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); } .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* 1 · fila de cifras que elige el gráfico (patrón Plausible) */
.hero { overflow: hidden; }
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--sand); }
.kp { position: relative; text-align: left; padding: 18px 22px 14px; border: 0; border-right: 1px solid var(--sand); background: transparent; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: background .2s var(--ease); }
.kp:last-child { border-right: 0; }
.kp .n { font: 500 40px/1.05 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kp .fila { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kp svg.sp { width: 100%; height: 30px; margin-top: 4px; display: block; }
.sp path.l { fill: none; stroke: var(--tinta60); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.sp path.a { fill: color-mix(in srgb, var(--tinta) 7%, transparent); stroke: none; }
.kp[aria-selected="true"] { background: color-mix(in srgb, var(--tinta) 5%, transparent); }
.kp[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--tinta); }
.kp[aria-selected="true"] .sp path.l { stroke: var(--tinta); }
@media (hover: hover) { .kp:hover { background: color-mix(in srgb, var(--tinta) 4%, transparent); } }
.kp.fijo { cursor: default; }
.hbody { display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.hgraf { padding: 18px 22px 14px; min-width: 0; }
.hgraf .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.hgraf .top h3 { margin: 0; font: 500 20px var(--serif); }
.leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--tinta60); }
.leyenda i { display: inline-block; width: 20px; height: 0; border-top: 2.6px solid var(--tinta); vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.mini-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--hueso); }
.mini-seg button { white-space: nowrap; height: 28px; padding: 0 11px; border: 0; border-radius: 999px; background: transparent; font-size: 12.5px; color: var(--tinta60); }
.mini-seg button[aria-pressed="true"] { background: var(--papel); color: var(--tinta); box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 0 0 1px var(--sand); }
.lect { padding: 22px; border-left: 1px solid var(--sand); display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--hueso) 55%, transparent), transparent 70%); }
.lect .medalla { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--verde) 16%, var(--papel)); color: var(--verde); }
.lect .medalla.al { background: color-mix(in srgb, var(--ambar) 18%, var(--papel)); color: var(--ambar); } .lect .medalla.eq { background: var(--hueso); color: var(--tinta60); }
.lect h2 { margin: 0; font: 500 28px/1.12 var(--serif); text-wrap: balance; }
.lect p { margin: 0; color: var(--tinta60); font-size: 14.5px; } .lect p b { color: var(--tinta); font-weight: 600; }
.lect .datos { display: grid; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--sand); }
.lect .dato { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13.5px; } .lect .dato span { color: var(--tinta60); } .lect .dato b { font-variant-numeric: tabular-nums; font-weight: 600; }

.chart { position: relative; width: 100%; } .chart svg { display: block; overflow: visible; }
.chart text { font: 400 12px var(--sans); fill: var(--tinta60); }
.chart .gr { stroke: var(--sand); stroke-width: 1; stroke-dasharray: 1 4; }
.chart .l-cur { fill: none; stroke: var(--tinta); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.chart .guia { stroke: var(--tinta); stroke-width: 1; opacity: .3; }
.chart .dot { fill: var(--tinta); stroke: var(--papel); stroke-width: 3; }
.chart .dot.p { fill: var(--papel); stroke: var(--taupe); stroke-width: 2; }
.halo { paint-order: stroke; stroke: var(--papel); stroke-width: 4px; stroke-linejoin: round; }
.tip { position: absolute; pointer-events: none; z-index: 6; background: var(--tinta); color: var(--crema); border-radius: 12px; padding: 10px 13px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; opacity: 0; transition: opacity .12s; transform: translate(-50%, -100%); box-shadow: 0 12px 28px -10px rgb(0 0 0 / .5); }
.tip b { font-variant-numeric: tabular-nums; } .tip .t { display: block; font-weight: 600; margin-bottom: 2px; }
.flag { cursor: help; }

/* sankey */
.sk .rb { fill-opacity: .46; transition: fill-opacity .2s var(--ease); }
.sk:hover .rb { fill-opacity: .12; } .sk .rb:hover { fill-opacity: .9; }
.sk .nd { cursor: pointer; }
.apil { display: grid; gap: 14px; }
.apil .f { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.apil .b { display: flex; height: 18px; border-radius: 6px; overflow: hidden; gap: 2px; }
.apil .b i { display: block; height: 100%; }

/* qué hacer */
.hacer { display: grid; }
.hr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 22px; border: 0; border-top: 1px solid var(--sand); background: transparent; text-align: left; width: 100%; transition: background .2s var(--ease); }
.hr:first-child { border-top: 0; }
@media (hover: hover) { .hr:hover { background: color-mix(in srgb, var(--tinta) 4%, transparent); } .hr:hover .go { transform: translateX(3px); } }
.hr .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--hueso); }
.hr .ico.al { background: color-mix(in srgb, var(--ambar) 16%, var(--papel)); color: var(--ambar); } .hr .ico.ok { background: color-mix(in srgb, var(--verde) 14%, var(--papel)); color: var(--verde); } .hr .ico.in { background: color-mix(in srgb, var(--pizarra) 14%, var(--papel)); color: var(--pizarra); }
.hr h4 { margin: 0; font: 600 14.5px/1.3 var(--sans); } .hr p { margin: 1px 0 0; color: var(--tinta60); font-size: 13px; }
.hr .imp { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--tinta60); white-space: nowrap; }
.hr .imp b { font: 500 20px/1 var(--serif); color: var(--verde); font-variant-numeric: tabular-nums; }
.go { transition: transform .25s var(--ease); }
.pulso-c { animation: pulsoc 1.4s var(--ease) 1; } @keyframes pulsoc { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tinta) 35%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* tabla de prendas */
.tp { width: 100%; }
.tph, .tpr { display: grid; grid-template-columns: minmax(0, 2.2fr) 88px 110px minmax(0, 1.3fr) 84px 108px; gap: 14px; align-items: center; padding: 10px 22px; }
.tph { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--tinta60); border-bottom: 1px solid var(--sand); padding-block: 8px; }
.tph button { border: 0; background: transparent; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.tph button[aria-pressed="true"] { color: var(--tinta); font-weight: 600; }
.tpr { border-top: 1px solid var(--sand); min-height: 64px; transition: background .2s var(--ease); }
.tpr:first-of-type { border-top: 0; }
@media (hover: hover) { .tpr:hover { background: color-mix(in srgb, var(--tinta) 4%, transparent); } }
.pn { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pn .t { width: 38px; height: 46px; border-radius: 9px; display: grid; place-items: center; font: 500 18px var(--serif); color: #f5f0e8; flex: none; border: 1px solid color-mix(in srgb, var(--tinta) 14%, transparent); }
.pn b { display: block; font-weight: 600; } .pn small { color: var(--tinta60); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; } .num small { display: block; font-weight: 400; color: var(--tinta60); font-size: 11.5px; }
.rate { display: grid; gap: 4px; } .rate .bar { height: 6px; border-radius: 99px; background: var(--hueso); position: relative; } .rate .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--tinta); } .rate .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta60); border-radius: 2px; } .rate span { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

.fil { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--sand); width: 100%; background: transparent; text-align: left; font-size: 14px; border-radius: 0; }
.fil:first-of-type { border-top: 0; } .fil .n { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.fil[aria-current="true"] { background: color-mix(in srgb, var(--tinta) 6%, transparent); }
@media (hover: hover) { .fil:hover { background: color-mix(in srgb, var(--tinta) 5%, transparent); } }
.mapa { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 24px; align-items: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dh { font-size: 11px; color: var(--tinta60); text-align: center; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 2px; }
.cal .d { min-height: 52px; border-radius: 9px; padding: 5px 7px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; line-height: 1.1; }
.cal .d b { font: 500 14px/1 var(--serif); text-align: right; font-variant-numeric: tabular-nums; }
.cal .d.off { opacity: .5; } .cal .d.fut { border: 1px dashed var(--sand); color: var(--tinta60); }
.cal .d.hoy { background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / .22) 0 3px, transparent 3px 7px); outline: 2px solid var(--rojo2); outline-offset: 1px; }
.nota-hueso { margin-top: 26px; font-size: 12.5px; color: var(--tinta60); text-align: center; }
.entra .card { animation: sube .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes sube { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    const avg = por.map((a, w) => (cnt[w] ? a / cnt[w] : 0)), ord = [0, 1, 2, 3, 4, 5, 6].sort((a, b) => avg[b] - avg[a]);
    return `<section class="card" style="--i:8" data-nuevo><div class="cab"><h3>${sep ? "Septiembre" : "Octubre"}, día por día</h3><small>Más oscuro, más gente</small></div><div class="cuerpo"><p style="margin:0 0 12px;font-size:14px;color:var(--tinta60)">Entra más gente los <b style="color:var(--tinta)">${DIAN[ord[0]]} y ${DIAN[ord[1]]}</b>.</p><div class="cal">${out}</div></div></section>`;
  }
  const pagina = (D) => cabecera(D) + barra(D) + heroCard(D) + `<div class="g g8">${calorCard(D)}${vienenCard(D)}</div><div style="margin-top:16px">${recCard(D)}</div><div class="g g8">${prendasCard(D)}${tallasCard(D)}</div><div class="g g6">${atencionCard(D)}${calCard(D)}</div><p class="nota-hueso">Datos de ejemplo inventados para esta maqueta. Los bordes rojos (botón «Marcar lo nuevo») son datos que hoy la base no entrega.</p>`;

  /* ---------- gráficos ---------- */
  function ritmoData(D) {
    const s = D.s, n = s.prev.length, cur = [], prev = []; let a = 0, b = 0;
    for (let i = 0; i < n; i++) { b += s.prev[i]; prev.push(b); if (s.cur[i] != null) { a += s.cur[i]; cur.push(a); } else cur.push(null); }
    const o = { cur, prev, n };
    if (D.p.nombre === "Hoy") { const k = NOW_H, ratio = cur[k] / Math.max(1, prev[k]); o.k = k; o.proj = []; o.lo = []; o.hi = []; for (let i = k; i < n; i++) { const inc = prev[i] - prev[k]; o.proj.push(cur[k] + inc * ratio); o.lo.push(cur[k] + inc * ratio * .88); o.hi.push(cur[k] + inc * ratio * 1.12); } o.final = Math.round(o.proj[o.proj.length - 1]); }
    return o;
  }
  function drawHero(el, D) {
    const k = st.metric, cum = st.cum && k !== "C", W = el.clientWidth || 640, H = +el.dataset.h || 340, narrow = W < 460, m = { l: 44, r: 16, t: 28, b: 28 }, S = seriesDe(D, k, cum), n = S.prev.length, hoy = D.key === "hoy";
    const R = cum && hoy && k === "E" ? ritmoData(D) : null, vals = S.cur.concat(S.prev, R ? R.hi : []).filter((x) => x != null), isC = k === "C";
    let mx = niceMax(Math.max(...vals) * 1.08), mn = 0;
    if (isC) { const lo = Math.min(...vals.filter((x) => x > 0)); mn = Math.max(0, Math.floor(lo * .8 / 2) * 2); mx = Math.ceil(Math.max(...vals) * 1.1 / 2) * 2; }
    const x = (i) => m.l + (W - m.l - m.r) * (n === 1 ? 0 : i / (n - 1)), y = (v) => m.t + (H - m.t - m.b) * (1 - (v - mn) / (mx - mn));
    let g = "";
    for (let q = 0; q <= 4; q++) { const v = mn + (mx - mn) * q / 4; g += `<line class="gr" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 10}" y="${y(v) + 4}" text-anchor="end">${isC ? v.toFixed(0) : fmt(v)}</text>`; }
    const step = D.p.tipo === "h" ? (narrow ? 8 : 3) : Math.ceil(n / (narrow ? 4 : 7)); let xl = "";
    for (let i = 0; i < n; i += step) xl += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${D.p.tipo === "h" ? S.labels ? S.labels[i] : D.s.labels[i] : D.s.labels[i].replace(/^\S+ /, "")}</text>`;
    const curPts = []; S.cur.forEach((v, j) => { if (v != null) curPts.push([x(j), y(v)]); });
    const prevPts = S.prev.map((v, j) => [x(j), y(v)]), last = curPts[curPts.length - 1];
    /* en un período que incluye hoy, el último día está a medias: punteado y con el punto hueco, para que no parezca una caída */
    const parcial = D.p.tipo === "d" && D.p.end === 0 && !cum && !isC && curPts.length > 2, solid = parcial ? curPts.slice(0, -1) : curPts, lastS = solid[solid.length - 1];
    const area = `${smooth(solid)} L${lastS[0]} ${y(mn)} L${curPts[0][0]} ${y(mn)}Z`;
    let proj = "", ann = "";
    if (R) {
      const hi = R.hi.map((v, j) => [x(R.k + j), y(v)]), lo = R.lo.map((v, j) => [x(R.k + j), y(v)]);
      proj = `<path d="${hi.map((q, j) => `${j ? "L" : "M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" ")} ${lo.slice().reverse().map((q) => `L${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" ")}Z" fill="var(--tinta)" fill-opacity=".09"/><path class="l-cur" style="stroke-dasharray:3 6;stroke-width:2.2" d="${R.proj.map((v, j) => `${j ? "L" : "M"}${x(R.k + j).toFixed(1)} ${y(v).toFixed(1)}`).join(" ")}"/><line class="guia" style="stroke-dasharray:3 4" x1="${x(15.67)}" x2="${x(15.67)}" y1="${m.t}" y2="${y(mn)}"/>`;
      ann = `<text class="halo" x="${x(n - 1)}" y="${y(R.final) - 14}" text-anchor="end" style="font-weight:600;fill:var(--tinta)">Cierre esperado: ${fmt(R.final)}</text><text class="halo" x="${last[0] - 12}" y="${last[1] - 14}" text-anchor="end" style="font-weight:600;fill:var(--tinta)">Ahora: ${fmt(S.cur[R.k])}</text>`;
    } else if (cum || isC) {
      const cEnd = S.cur[n - 1] != null ? S.cur[n - 1] : last && S.cur[S.cur.length - 1], pEnd = S.prev[n - 1], up = cEnd >= pEnd, f = (v) => (isC ? v.toFixed(1).replace(".", ",") + "%" : fmt(v));
      ann = `<text class="halo" x="${x(n - 1)}" y="${y(cEnd) + (up ? -14 : 24)}" text-anchor="end" style="font-weight:600;fill:var(--tinta)">${f(cEnd)}</text><text class="halo" x="${x(n - 1)}" y="${y(pEnd) + (up ? 24 : -14)}" text-anchor="end" style="fill:var(--taupe);font-weight:500">${f(pEnd)}</text>`;
    }
    const ev = eventosDe(D).map((e) => { const cx = x(e.i); return `<g class="flag"><title>${e.t}</title><line class="guia" style="stroke-dasharray:2 4" x1="${cx}" x2="${cx}" y1="${m.t - 6}" y2="${y(mn)}"/><path d="M${cx} ${m.t - 14}l6 6-6 6-6-6z" fill="var(--tinta)" stroke="var(--papel)" stroke-width="2"/></g>`; }).join("");
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRICAS.find((q) => q.k === k).n}, comparado con ${D.p.cmp}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--tinta)" stop-opacity=".2"/><stop offset="1" stop-color="var(--tinta)" stop-opacity="0"/></linearGradient></defs>${g}${xl}${proj}<path d="${area}" fill="url(#ga)"/><path d="${smooth(prevPts)}" fill="none" stroke="var(--taupe)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5"/><path class="l-cur" d="${smooth(solid)}"/>${parcial ? `<path class="l-cur" style="stroke-dasharray:2 5" d="M${lastS[0]} ${lastS[1]} L${last[0]} ${last[1]}"/><text class="halo" x="${last[0] - 10}" y="${last[1] + 26}" text-anchor="end">hoy, hasta las 3:40 pm</text>` : ""}<circle class="dot${parcial ? " p" : ""}" cx="${last[0]}" cy="${last[1]}" r="6"/>${ann}<g class="hv" style="display:none"><line class="guia" y1="${m.t}" y2="${y(mn)}"/><circle class="dot p" r="5"/><circle class="dot" r="5.5"/></g><rect class="ov" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>${ev}</svg><div class="tip"></div>`;
    const svg = el.firstChild, hv = svg.querySelector(".hv"), tip = el.querySelector(".tip"), line = hv.querySelector("line"), dots = hv.querySelectorAll("circle"), lab = D.s.labels, fv = (v) => (isC ? v.toFixed(1).replace(".", ",") + "%" : fmt(v));
    const mover = (e) => {
      const r = svg.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; let j = Math.round((px - m.l) / (W - m.l - m.r) * (n - 1)); j = Math.max(0, Math.min(n - 1, j));
      const cv = S.cur[j], pv = S.prev[j], cx = x(j); hv.style.display = ""; line.setAttribute("x1", cx); line.setAttribute("x2", cx); dots[0].setAttribute("cx", cx); dots[0].setAttribute("cy", y(pv));
      if (cv != null) { dots[1].style.display = ""; dots[1].setAttribute("cx", cx); dots[1].setAttribute("cy", y(cv)); } else dots[1].style.display = "none";
      const pn = hoy ? "Ayer a esa hora" : D.p.tipo === "h" ? "Lunes de antes" : "Días de antes";
      tip.innerHTML = `<span class="t">${lab[j]}</span>${cv != null ? `${hoy ? "Hoy" : D.p.nombre}: <b>${fv(cv)}</b><br>` : ""}${pn}: <b>${fv(pv)}</b>${cv != null && pv ? `<br>${cv >= pv ? "▲" : "▼"} ${Math.round(Math.abs(pct(cv, pv)))}%` : ""}`;
      tip.style.left = Math.max(80, Math.min(W - 80, cx)) + "px"; tip.style.top = (y(Math.max(cv || 0, pv)) - 12) + "px"; tip.style.opacity = 1;
    };
    const rect = svg.querySelector(".ov"); rect.addEventListener("pointermove", mover); rect.addEventListener("pointerdown", mover);
    rect.addEventListener("pointerleave", () => { hv.style.display = "none"; tip.style.opacity = 0; });
  }
  /* Sankey: cada cinta es la gente de un camino que llegó hasta cierto paso. El ancho es el número de personas. */

  function niceMax(v) { const q = Math.max(v, 4) / 4, m = Math.pow(10, Math.floor(Math.log10(q))), r = q / m, s = [1, 1.5, 2, 2.5, 3, 4, 5, 10].filter((z) => z >= r - 1e-9)[0]; return s * m * 4; }

  /* ---------- estado, render, eventos ---------- */
  const st = { dv: "camino", aten: "reponer", per: "hoy", camino: "", ciudad: "", metric: "E", cum: false, sort: "v", tema: "auto", ancho: "100%", nuevo: false };
  const erp = $("#erp"), marco = $("#marco"); let Dcur = null;
  function render(replay) {
    const y0 = window.scrollY;
    Dcur = calc(st.per, { camino: st.camino || null, ciudad: st.ciudad || null });
    erp.className = "erp" + (replay ? " entra" : "");
    erp.innerHTML = pagina(Dcur);
    paint();
    if (replay) setTimeout(() => erp.classList.remove("entra"), 1500); else window.scrollTo(0, y0);
  }
  function paint() {
    erp.querySelectorAll("[data-chart]").forEach((el) => ({ hero: drawHero, mapa: drawMapa })[el.dataset.chart](el, Dcur));
  }
  function ui() {
    document.querySelectorAll("[data-mq]").forEach((b) => { const k = b.dataset.mq; if (k === "nuevo") { b.setAttribute("aria-pressed", st.nuevo); return; } b.setAttribute("aria-pressed", String(st[k === "tema" ? "tema" : "ancho"] === b.dataset.v)); });
    document.body.classList.toggle("mq-nuevo", st.nuevo);
    marco.style.maxWidth = st.ancho === "100%" ? "none" : st.ancho + "px";
    const r = document.documentElement; if (st.tema === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", st.tema);
  }
  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-mq]");
    if (m) { const k = m.dataset.mq; if (k === "nuevo") st.nuevo = !st.nuevo; else if (k === "tema") st.tema = m.dataset.v; else st.ancho = m.dataset.v; ui(); if (k === "ancho") setTimeout(paint, 30); return; }
    const a = e.target.closest("[data-act]"); if (!a || !erp.contains(a)) return;
    const act = a.dataset.act, v = a.dataset.v;
    if (act === "per") st.per = v; else if (act === "camino") st.camino = st.camino === v ? "" : v; else if (act === "ciudad") st.ciudad = st.ciudad === v ? "" : v;
    else if (act === "metric") st.metric = v; else if (act === "cum") st.cum = v === "1"; else if (act === "sort") st.sort = v; else if (act === "aten") st.aten = v; else if (act === "dv") st.dv = v;
    else if (act === "ir") { const t = $({ rec: "#c-rec", cam: "#c-cam", pr: "#c-pr", hm: "#c-hm" }[v]); if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.remove("pulso-c"); void t.offsetWidth; t.classList.add("pulso-c"); } return; }
    render(false);
  });
  document.addEventListener("keydown", (e) => { if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return; const k = KEYS[e.key.toLowerCase()]; if (k) { st.per = k; render(false); } });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(paint, 120); });
  document.addEventListener("pointerover", (e) => {
    const c = e.target.closest(".hc"), tip = $("#tip-hm"); if (!tip) return;
    if (!c) { tip.style.opacity = 0; return; }
    const card = tip.parentElement.getBoundingClientRect(), r = c.getBoundingClientRect(), [a, b] = c.dataset.t.split("|");
    tip.innerHTML = `<span class="t">${a}</span>${b}`; tip.style.left = (r.left - card.left + r.width / 2) + "px"; tip.style.top = (r.top - card.top - 8) + "px"; tip.style.opacity = 1;
  });
  ui(); render(true);
})();
</script>
