<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opción 3 · Tres preguntas · Nueva oferta o promoción</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · Opción 3 «Tres preguntas» · formulario de «Nueva oferta o promoción» (2026-10-23)
   Un asistente de UNA pregunta por pantalla: 1 ¿Qué le das al cliente? · 2 ¿En qué prendas y dónde? · 3 ¿Cuándo? (+ Revisa y guarda).
   Las preguntas 2 y 3 ya vienen contestadas con los valores de fábrica; una «etiqueta» al costado se va armando con cada respuesta.
   Tokens = los de ../index.html (ADR-0169), claro y oscuro. Datos de la campaña «Aniversario CAYLA» de producción; cifras y ofertas, inventadas. Hoy simulado = 23 oct 2026.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);
--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t10:rgba(245,240,232,.1);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.m{width:20px;height:20px}svg.l{width:24px;height:24px}
@keyframes sube{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sale{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fundir{from{opacity:0}to{opacity:1}}
@keyframes subeh{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulsa{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tinta) 28%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
/* ---- barra de la maqueta ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk .go{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(245,240,232,.35);font-size:12.5px;color:#f5f0e8}
.spk .go:hover{background:rgba(245,240,232,.12)}
.escena{padding:18px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ley{max-width:1180px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t80)}.ley b{font-weight:600}
.ley .ej{display:inline-block;margin:4px 6px 0 0;padding:1px 8px;border-radius:999px;background:var(--hueso);font-size:11px;color:var(--taupe);font-weight:600}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.marco,.sx>.tel{margin:0 auto}
.marco{container-type:inline-size;flex:none;position:relative;overflow:hidden;background:var(--crema);box-shadow:0 30px 60px -30px var(--sombra)}
.marco.desk{width:1180px;height:780px;border-radius:14px;border:1px solid var(--t30)}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px var(--sombra);flex:none}
.marco.cel{width:375px;height:796px;border-radius:39px}
.pant{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
/* ---- piezas (las mismas de ../index.html) ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:background .2s,transform .2s,color .2s;white-space:nowrap}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.n{font-size:13.5px;letter-spacing:0;text-transform:none;height:38px}
.btn.chico{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px;letter-spacing:0;text-transform:none}
.btn.grande{height:56px;font-size:15px;border-radius:14px}
.volver{width:40px;height:40px;border-radius:50%;border:1px solid var(--t30);display:grid;place-items:center;flex:none}.volver:hover{background:var(--hueso)}.volver.oculto{visibility:hidden}
.enl{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe);font-size:13px;text-align:left}.enl:hover{color:var(--rojo-p)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.nodot::before{display:none}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.r{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 12%,transparent)}.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.chip.t{background:var(--tinta);color:var(--crema)}
.pil{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;font-weight:500;transition:background .2s}
.pil:hover{background:var(--hueso)}.pil.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.nota{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80);display:flex;gap:9px;align-items:flex-start}
.nota .ic{margin-top:2px;color:var(--taupe);flex:none}
.nota.am{background:color-mix(in srgb,var(--ambar) 13%,transparent)}.nota.am .ic{color:var(--ambar)}.nota.ok{background:color-mix(in srgb,var(--verde) 12%,transparent)}
.lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--sombra);animation:sale .3s var(--ease) both}
.opc{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 13px;border-radius:12px;border:1px solid var(--sand);background:var(--hueso);font-size:13px;transition:background .2s;text-align:left}
.opc:hover{background:var(--sand)}.opc.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.opc small{font-size:11.5px;opacity:.7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pq{display:inline-flex;align-items:center;border:1px solid var(--sand);background:var(--hueso);border-radius:12px;height:48px;overflow:hidden;max-width:100%}
.pq button{width:44px;height:100%;display:grid;place-items:center;flex:none}.pq button:hover{background:var(--sand)}.pq button:disabled{opacity:.3;pointer-events:none}
.pq b,.pq input{min-width:96px;text-align:center;font-family:'EB Garamond',serif;font-size:26px;font-weight:500;white-space:nowrap}
.pq input{width:112px;border:0;background:transparent;outline:0;padding:0 4px}.pq:focus-within{background:var(--papel);border-color:var(--tinta)}
.campo{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--sand);border-radius:12px;background:var(--hueso);transition:background .2s,border-color .2s}
.campo:focus-within{background:var(--papel);border-color:var(--tinta)}.campo input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14.5px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dosc label{display:block}.dosc label span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-bottom:5px}
.sublbl{font-size:12px;font-weight:600;color:var(--t65);margin:12px 0 6px}.sublbl span{font-weight:400}
.sec-of{display:flex;gap:10px;align-items:center}.sec-of b{font-family:'EB Garamond',serif;font-weight:500;font-size:22px}
.cn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hueso);font-size:11px;font-weight:700}
/* ---- el ERP de fondo (solo para que se vea dónde está la hoja) ---- */
.erp{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%;background:var(--crema)}
.lat{position:sticky;top:0;align-self:start;height:780px;border-right:1px solid var(--sand);background:var(--papel);padding:16px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.lat .logo{font-weight:700;letter-spacing:.16em;color:var(--rojo);font-size:17px;padding:2px 10px 12px}
.lat .g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--t50);padding:12px 10px 4px}
.lat a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;color:var(--t80);cursor:default}
.lat a.sub{padding-left:22px}.lat a.on{background:var(--tinta);color:var(--crema);font-weight:600}
.mtop{display:none}
.cont{min-width:0}
.enc{padding:22px 28px 0}
.enc .sede{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--taupe);display:flex;align-items:center;gap:12px}
.enc .sede::after{content:"";flex:1;height:1px;background:var(--taupe);opacity:.4;min-width:40px}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:6px}
.enc p{color:var(--t65);margin-top:4px;max-width:600px}
.cuerpo{padding:18px 28px 44px}
.tarj{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.tarj .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--sand)}
.pest{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--sand);border-radius:12px;background:var(--papel);max-width:100%}
.pest button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:9px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t65)}
.pest button.on{background:var(--tinta);color:var(--crema)}
.pest .gl{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hueso);color:var(--tinta);font-size:11px;letter-spacing:0}
.pest button.on .gl{background:var(--crema);color:var(--tinta)}
.fo{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--sand)}.fo:last-child{border:0}
.fo b{font-size:14px;font-weight:600}.fo small{display:block;color:var(--t65);font-size:12px}.fo .btn{margin-left:auto}
/* ---- la hoja «Configuración» (ADR-0136: velo con desenfoque, la hoja sube y crece) ---- */
.velo{position:absolute;inset:0;z-index:40;display:grid;place-items:stretch center;padding:22px}
.velo-fondo{position:absolute;inset:0;background:color-mix(in srgb,#000 48%,transparent);backdrop-filter:blur(3px)}
.hoja{position:relative;display:flex;flex-direction:column;width:min(1080px,100%);max-height:100%;background:var(--papel);border:1px solid var(--sand);border-radius:20px;overflow:hidden}
.velo.entra .velo-fondo{animation:fundir .3s var(--ease) both}.velo.entra .hoja{animation:subeh .38s var(--ease) both}
.hoja-cab{padding:22px 28px 8px}.hoja-cab h2{font-family:'EB Garamond',serif;font-weight:500;font-size:26px;line-height:1.15}.hoja-cab p{color:var(--t65);font-size:14px;margin-top:2px}
.hoja-cuerpo{overflow:auto;padding:4px 28px 16px;flex:1;min-height:0}
.hoja-pie{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 28px;border-top:1px solid var(--sand);background:var(--papel);flex:none}
.hoja-pie .falta{margin:0 auto 0 6px;flex:1;min-width:0;font-size:12.5px;color:var(--t65);line-height:1.35}.hoja-pie .falta b{color:var(--ambar);font-weight:600}
/* ====================================================================
   Opción 3 · el asistente (clases t3-)
   ==================================================================== */
.t3-cuerpo{display:flex;flex-direction:column}
.t3-camp{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;margin:4px 0 12px;padding:8px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80);flex:none}
.t3-camp .ic{color:var(--taupe)}.t3-camp b{font-weight:600}.t3-camp .enl{margin-left:auto;font-size:12.5px}
.t3-g{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;flex:1 1 auto;min-height:420px}
.t3-rail{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding-right:2px}
.t3-rl{display:flex;flex-direction:column;gap:8px}
.t3-tog{display:none;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);font-size:13px;font-weight:600;width:100%}
.t3-gt{display:flex;gap:10px;align-items:center}.t3-gt b{font-family:'EB Garamond',serif;font-weight:500;font-size:20px}
.t3-rw{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.t3-reg{display:grid;gap:4px;text-align:left;padding:9px 12px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);transition:background .2s,border-color .2s;width:100%}
.t3-reg:hover{background:var(--hueso)}.t3-reg.recien{background:color-mix(in srgb,var(--verde) 9%,transparent)}
.t3-reg.edit{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta);background:var(--papel)}
.t3-reg b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t3-reg .m{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.t3-reg small{font-size:11.5px;color:var(--t65);line-height:1.3}
.t3-reg small.hist{display:flex;gap:4px;align-items:center;color:var(--taupe)}
.t3-rw .espera{font-size:11.5px;color:var(--ambar);padding-left:4px}
.t3-hint{font-size:12px;color:var(--t65);line-height:1.4}
.t3-wz{display:flex;flex-direction:column;min-height:0;background:var(--crema);border:1px solid var(--sand);border-radius:16px;padding:14px 20px 16px}
.t3-top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;margin-bottom:8px;flex:none}
.t3-dots{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t3-d{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 5px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;color:var(--t80);transition:background .2s}
.t3-d b{width:20px;height:20px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:11px}
.t3-d:hover:not([aria-disabled="true"]){background:var(--hueso)}
.t3-d.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.t3-d.on b{background:var(--crema);color:var(--tinta)}
.t3-d.ok b{background:var(--verde);color:var(--crema)}.t3-d.on.ok b{background:var(--verde);color:var(--crema)}
.t3-d[aria-disabled="true"]{cursor:default;color:var(--t65)}
.t3-cols{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:22px;flex:1;min-height:0}
.t3-q{min-width:0;min-height:0;overflow:auto;padding:2px 4px 6px 2px;margin:-2px -4px -6px -2px}
.t3-q.ent>*{animation:sube .35s var(--ease) both}
.t3-q h2{font-family:'EB Garamond',serif;font-weight:500;font-size:28px;line-height:1.12}
.t3-q .baj{color:var(--taupe);font-size:13.5px;margin-top:2px}
.t3-fams{display:grid;gap:8px;margin-top:14px}
.t3-fam{display:grid;grid-template-columns:40px 1fr auto;gap:0 12px;align-items:center;text-align:left;padding:9px 14px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);transition:background .2s,border-color .2s}
.t3-fam:hover{background:var(--hueso);border-color:var(--t30)}
.t3-fam .ico{width:40px;height:40px;border-radius:12px;background:var(--hueso);display:grid;place-items:center;color:var(--taupe);grid-row:1/3}
.t3-fam b{grid-column:2;grid-row:1;font-size:14.5px;font-weight:600;line-height:1.3}.t3-fam small{grid-column:2;grid-row:2;font-size:12.5px;color:var(--t65);line-height:1.3}
.t3-fam .go{grid-column:3;grid-row:1/3;color:var(--t50)}
.t3-fams.pulsa .t3-fam{animation:pulsa .6s var(--ease) 1}
.t3-gp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.t3-gp .pil{justify-content:center;padding:0 8px}
.t3-sub{margin-top:10px}.t3-sub .lbl{display:block;margin-bottom:4px}
.t3-cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px 14px;margin-top:10px}
.t3-c .t3-cl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-bottom:5px}
.t3-c.ancho{grid-column:1/-1}
.t3-ayuda{margin-top:8px;font-size:12.5px;color:var(--t65);display:flex;gap:8px;line-height:1.4}.t3-ayuda .ic{color:var(--taupe);margin-top:1px}
.t3-rs{display:grid;gap:8px;margin-top:14px}
.t3-r{display:grid;grid-template-columns:40px 1fr;gap:0 12px;padding:10px 14px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);align-items:center}
.t3-r .ico{width:40px;height:40px;border-radius:12px;background:var(--hueso);display:grid;place-items:center;color:var(--taupe);grid-row:1/4}
.t3-r .lbl{font-size:10.5px;line-height:1.2}.t3-r b{font-size:15px;font-weight:600;line-height:1.3}.t3-r small{font-size:12.5px;color:var(--t65);line-height:1.3}
.t3-big{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:16px}
.t3-pn{display:grid;gap:10px;margin-top:12px}
.t3-pg .lbl{display:block;margin-bottom:6px}
.t3-pg .sublbl{margin:10px 0 6px}
.t3-der{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--hueso);font-size:13px}

<script>
/* =========================== datos (copiados de ../index.html) =========================== */
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const HOY = '2026-10-23';
const CATS = [
  {id:'blusas',   n:'Blusas',     prendas:18, unid:96,  v30:62,  ej:{n:'Blusa Carlita',      p:90,   c:38, col:'#ece6dc'}},
  {id:'vestidos', n:'Vestidos',   prendas:11, unid:54,  v30:30,  ej:{n:'Vestido Lucía',      p:159,  c:70, col:'#b9c9a8'}},
  {id:'pantalones',n:'Pantalones',prendas:9,  unid:70,  v30:41,  ej:{n:'Jean Palazzo',       p:129,  c:52, col:'#a9bfd6'}},

];
const SEDES = ['TRU','AQP','LIM'];

const ANIV = {id:'aniversario', n:'Aniversario CAYLA', desde:'2026-10-01', hasta:'2026-10-25', manu:339, prendas:339, unid:1210, v30:410, modelos:61, ej:'blusas', hist:[]};

const GATO = {id:'gato', n:'Día Internacional del Gato', desde:'2026-10-24', hasta:'2026-10-30', manu:7, prendas:7, unid:7, v30:3, modelos:5, ej:'polos', hist:[]};

let CAMPANA = ANIV;
/* Quién guarda qué: el líder guarda borrador o activa; quien solo ve Insignias deja un borrador y un líder la activa. */
const ROLES = {lider:{t:'Líder', act:true}, etq:{t:'Con Insignias', act:false}};
const REG = {basta:{t:'Arreglo de basta gratis',sub:'lo hace el taller',costo:6}, bolsa:{t:'Bolsa de regalo',sub:'empaque',costo:1.5}, panuelo:{t:'Pañuelo de regalo',sub:'accesorio',costo:4}};
/* «cond» es lo que el cliente tiene que hacer: sin condición = oferta, con condición = promoción. */
const TIPOS = {

};
const LIM = {pct:[5,70,5], qty:[2,6,1], precio:[20,500,5], pct2:[10,100,10], nth:[2,6,1], lleva:[2,6,1], m:[1,5,1], min:[100,600,50], desc:[10,100,5]};
const limites = (W,f) => (W.tipo==='club_cupon'&&f==='pct') ? [5,30,5] : f==='m' ? [1,W.lleva-1,1] : LIM[f];
const base = o => Object.assign({camp:null,liq:false,tipo:'pct',cats:[],sedes:[...SEDES],dias:0,pct:20,qty:2,precio:59.9,pct2:50,nth:2,lleva:3,m:2,min:300,desc:30,regalo:'basta',horas:24,mult:2,mezcla:false,partes:['blusas','faldas'],acum:true,nocats:[],claure:false,borrador:false,hist:[],tope:0,vendidas:0,sem:[0,1,2,3,4,5,6]}, o);
const CAMP = [
  base({id:'c1',camp:'halloween',n:'Casacas · −30 %',tipo:'pct',pct:30,cats:['casacas'],desde:'2026-10-12',hasta:'2026-10-31',vendidas:29}),
  base({id:'c2',camp:'aniversario',n:'2 polos por S/ 59.90',tipo:'combo',qty:2,precio:59.9,cats:['polos'],desde:'2026-10-01',hasta:'2026-10-25'}),
  base({id:'c3',camp:'aniversario',n:'S/ 30 menos desde S/ 300',tipo:'monto',min:300,desc:30,cats:['all'],desde:'2026-10-15',hasta:'2026-10-25'}),
  base({id:'c4',camp:'aniversario',n:'Puntos dobles · fin de semana',tipo:'club_puntos',mult:2,cats:['all'],desde:'2026-10-24',hasta:'2026-10-25'}),
  base({id:'c5',camp:'aniversario',n:'Toda la campaña · −10 %',tipo:'pct',pct:10,cats:['e:aniversario'],desde:'2026-10-01',hasta:'2026-10-25',vendidas:12,legado:true}),
  base({id:'c6',camp:'madre',n:'Blusas y vestidos · −20 %',tipo:'pct',pct:20,cats:['blusas','vestidos'],desde:'2026-05-04',hasta:'2026-05-10'}),
  base({id:'c7',camp:'gato',n:'Prendas del Gato · −10 %',tipo:'pct',pct:10,cats:['e:gato'],desde:'2026-10-24',hasta:'2026-10-30'}),
  base({id:'c9',camp:'navidad',n:'Vestidos · −15 %',tipo:'pct',pct:15,cats:['vestidos'],desde:'2026-12-11',hasta:'2026-12-25',borrador:true}),
  /* Una oferta de días sueltos (inventada, para ver cómo se lee en la lista): los polos al 2x1 solo martes y jueves. */
  base({id:'c10',camp:'halloween',n:'Polos · 2x1 · mar y jue',tipo:'nxm',lleva:2,m:1,cats:['polos'],desde:'2026-10-26',hasta:'2026-10-31',sem:[1,3]})
];
/* Orden de la lista «Ya registradas»: las de la semilla en este orden; las nuevas, arriba. */
const ordenar = () => CAMP.forEach((c,i)=>{ if(c.ord===undefined) c.ord = 100-i; });
ordenar();
let ORD = 200;
const SNAP = JSON.stringify(CAMP);
/* Los 15 tipos, agrupados en 5 respuestas en palabras de tienda. El primero de cada grupo es el que viene elegido. */
const GRUPOS = [
  {k:'rebaja', corto:'Una rebaja',      t:'Una rebaja',                  s:'20 % menos, S/ 10 menos o un precio único', ic:'tag',    tipos:['pct','soles','precio']},
  {k:'varias', corto:'Llevar varias',   t:'Llevar varias y pagar menos', s:'3x2, 2 polos por S/ 59.90, la 2.ª al 50 %…', ic:'layers', tipos:['nxm','combo','segunda','volumen','look']},

const grupoDe = t => GRUPOS.find(g=>g.tipos.includes(t));
const FORMA = {pct:'Un % menos',soles:'Soles menos en cada prenda',precio:'Un precio único',nxm:'3x2, 2x1…',combo:'Varias por un precio',segunda:'La 2.ª con descuento',volumen:'Más prendas, más descuento',look:'Un conjunto',monto:'Soles menos',montopct:'Un % menos',regalo:'Un regalo',club_pct:'% menos para miembros',club_puntos:'Puntos extra',club_cupon:'Cupón de bienvenida',club_privada:'Compra privada'};
const AYUDA = {
  pct:'El precio baja un porcentaje. El cliente no tiene que hacer nada.',
  soles:'Cada prenda baja la misma cantidad de soles.',
  precio:'Todas las prendas elegidas pasan a valer lo mismo.',
  nxm:'Ej. 3x2: llevas 3 y pagas 2. También sirve 2x1.',
  combo:'Llevando varias, el total tiene un precio fijo. Ej. 2 polos por S/ 59.90.',
  segunda:'Una de las prendas lleva descuento. Ej. la 2.ª al 50 %, o la 4.ª gratis.',
  volumen:'Desde cierta cantidad, todas bajan. Ej. 3 o más, 15 % menos.',
  look:'Prendas distintas que juntas salen más baratas. Ej. blusa + falda.',
  monto:'Si la compra llega al monto, se resta esa cantidad de soles.',
  montopct:'Si la compra llega al monto, baja un porcentaje.',
  regalo:'Si la compra llega al monto, el cliente se lleva un regalo.',
  club_pct:'Un porcentaje menos, solo para quien es miembro del Club.',
  club_cupon:'Un cupón para quien se une al Club: vale en su 1.ª compra.',
  club_privada:'Los miembros compran antes que el resto de los clientes.',
  club_puntos:'Los miembros acumulan más puntos por cada sol.'
};
/* =========================== utilidades =========================== */
const $ = s => document.querySelector(s);
const fmt = n => 'S/ ' + Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round(n*100)/100;
const sol = n => Number.isInteger(n) ? 'S/ '+n : fmt(n);
const plural = (n,s,p) => n+' '+(n===1?s:p);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const lista = a => a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' y '+a[a.length-1];
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
/* El precio rebajado baja al .90 más cercano hacia abajo (ADR-0182). «Gratis» no pasa por esa regla. */
const rebaja = (p,pct) => r2(Math.floor(p*(1-pct/100)-0.9+1e-9)+0.9);
const rebajaP = (p,pct) => pct>=100 ? 0 : rebaja(p,pct);
const precioSug = W => r2(Math.round(W.qty*(catsDe(W)[0]||CATS[3]).ej.p*.75/5)*5-.1);
const precioLook = W => r2(Math.round(W.partes.reduce((t,id)=>t+CATS.find(c=>c.id===id).ej.p,0)*.8/5)*5-.1);
const D = s => new Date(s+'T00:00:00');
const campanaDe = id => ETQS.find(e=>e.id===id);
const reglasDe = id => CAMP.filter(c=>c.camp===id);
const fechaTxt = s => { const d=D(s); return d.getDate()+' '+MES[d.getMonth()]; };
const diasEntre = (a,b) => Math.round((D(b)-D(a))/864e5);
const estadoDe = c => c.borrador ? 'Borrador' : c.desde>HOY ? 'Programada' : c.hasta<HOY ? 'Terminada' : 'Vigente';
const fam = c => TIPOS[c.tipo].cond==='ninguna' ? 'Oferta' : 'Promoción';
const etqGrupo = e => ({id:'e:'+e.id, n:e.n, etq:true, prendas:e.prendas, unid:e.unid, v30:e.v30, ej:CATS.find(c=>c.id===e.ej).ej});
const catsDe = c => { const t = c.cats.includes('all') ? CATS : [...CATS.filter(x=>c.cats.includes(x.id)), ...ETQS.filter(e=>c.cats.includes('e:'+e.id)).map(etqGrupo)]; return (c.nocats||[]).length ? t.filter(x=>!c.nocats.includes(x.id)) : t; };
const catsTxt = c => c.cats.includes('all') ? 'Todo' : (catsDe(c).length<=2 ? catsDe(c).map(x=>x.etq?'Toda la campaña':x.n).join(' y ') : catsDe(c).length+' grupos');
/* Unas reglas miran PRENDAS y otras miran la COMPRA entera (el monto, el regalo, el cupón y los puntos): estas se saltan la pregunta 2. */
const deCompra = t => ['monto','montopct','regalo','club_cupon','club_puntos'].includes(t);
const esPrecio = c => ['pct','soles','precio','combo','segunda','nxm','volumen','look'].includes(c.tipo);
const unitario = (s,p) => s.tipo==='pct' ? rebaja(p,s.pct) : s.tipo==='soles' ? r2(Math.max(0,p-s.desc)) : s.tipo==='precio' ? s.precio : p;
const ic = (n,c='') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const chipEstado = e => `<span class="chip ${e==='Vigente'?'v':e==='Programada'?'p':e==='Borrador'?'a':''}">${e}</span>`;
const chipFam = f => `<span class="chip nodot ${f==='Oferta'?'t':'p'}">${f}</span>`;
const sedesTxt = s => s.length===SEDES.length ? 'Las 3 tiendas' : s.join(' · ');
const todasCamp = W => W.cats.some(x=>x.startsWith('e:'));
const salta2 = W => deCompra(W.tipo);
const esCant = W => ['combo','segunda','nxm','volumen'].includes(W.tipo);

/* =========================== cálculos (copiados de ../index.html) =========================== */
function alcance(s){
  const f = {0:1,60:.5,90:.3,120:.15}[s.dias]||1;
  const cs = catsDe(s), e = campanaDe(s.camp);
  let prendas = Math.round(cs.reduce((t,c)=>t+c.prendas,0)*f), unid = Math.round(cs.reduce((t,c)=>t+c.unid,0)*f);
  if(e && !deCompra(s.tipo)){ prendas = Math.min(prendas,Math.round(e.prendas*f)); unid = Math.min(unid,Math.round(e.unid*f)); }
  return {prendas, unid, f};
}
function costoEst(s){
  const cs = catsDe(s), f = alcance(s).f, sf = s.sedes.length/SEDES.length;
  let t = 0;
  for(const c of cs){
    const u = c.v30*f*sf, p = c.ej.p;
    if(['pct','soles','precio'].includes(s.tipo)) t += u*Math.max(0,p-unitario(s,p));
    else if(s.tipo==='combo') t += (u*.5/s.qty)*(s.qty*p-s.precio);
    else if(s.tipo==='segunda') t += (u*.5/s.nth)*(p*s.pct2/100);
    else if(s.tipo==='nxm') t += (u*.5/s.lleva)*((s.lleva-s.m)*p);
    else if(s.tipo==='volumen') t += (u*.5)*(p*s.pct/100);
  }
  if(s.tipo==='look') t = Math.min(...cs.map(c=>c.v30))*.3*sf*Math.max(0,cs.reduce((a,c)=>a+c.ej.p,0)-s.precio);
  if(s.tipo==='monto') t = 40*sf*s.desc;
  if(s.tipo==='montopct') t = 40*sf*(s.pct/100)*(s.min+12);
  if(s.tipo==='club_pct') t = 30*sf*(s.pct/100)*90;
  if(s.tipo==='regalo') t = 35*sf*REG[s.regalo].costo;
  if(s.tipo==='club_cupon') t = 12*(s.pct/100)*140;
  if(s.tipo==='club_puntos') t = 3000*(s.mult-1)*0.05;
  if(s.tipo==='club_privada') t = 0;
  /* Con días sueltos, solo cuentan los días que caen en sus fechas. */
  const fd = semDe(s).length<7 ? (()=>{ const r = rigenN(s); return r.total ? r.rige/r.total : 1; })() : 1;
  return Math.round(t*fd/10)*10;
}
const nombreBase = s => s.tipo==='monto' ? `${sol(s.desc)} menos desde ${sol(s.min)}`
  : s.tipo==='montopct' ? `${s.pct} % menos desde ${sol(s.min)}`
  : s.tipo==='regalo' ? `${REG[s.regalo].t} desde ${sol(s.min)}`
  : s.tipo.startsWith('club') ? `${TIPOS[s.tipo].da(s)} · Club`
  : `${catsTxt(s)} · ${TIPOS[s.tipo].da(s)}`;
const defNombre = s => nombreBase(s) + (diasCorto(s) ? ' · '+diasCorto(s) : '');
function cruces(s){
  if(!esPrecio(s)) return [];
  return CAMP.filter(c=>estadoDe(c)!=='Terminada' && esPrecio(c) && c.id!==s.editId && c.desde<=s.hasta && s.desde<=c.hasta && semDe(c).some(d=>semDe(s).includes(d)) &&
    (c.cats.includes('all')||s.cats.includes('all')||c.cats.some(x=>s.cats.includes(x))||(c.camp===s.camp&&(c.cats.some(x=>x.startsWith('e:'))||s.cats.some(x=>x.startsWith('e:'))))) && c.sedes.some(x=>s.sedes.includes(x)));
}
/* Los avisos: SOLO los que piden decidir algo (ámbar) y dos informativos útiles (cruce y monto). Nada de verificaciones en verde. */
function avisos(s){
  const out = [], ec = campanaDe(s.camp);
  const sem = semDe(s);
  if(sem.length>0 && sem.length<7 && D(s.hasta) >= D(s.desde)){
    const {rige:nr,total} = rigenN(s);
    if(nr===0) out.push({k:'nunca',t:'a',x:`En esas fechas no cae ${sem.length===1?`ningún ${SEMN[sem[0]]}`:`ninguno de esos días (${lista(sem.map(i=>SEMN[i]))})`}.`,s:`Del ${fechaTxt(s.desde)} al ${fechaTxt(s.hasta)} la oferta no regiría nunca. Cambia los días o las fechas.`});
    if(esPrecio(s)) out.push({k:'papel',t:'i',x:'El papel colgado no cambia cada día.',s:'Antes de activarla, decide con el líder qué dirá la etiqueta.'});
  }
  if(D(s.hasta) < D(s.desde)) out.push({k:'orden',t:'a',x:'La fecha de término es anterior a la de inicio.'});
  else if(ec && (s.desde<ec.desde||s.hasta>ec.hasta)) out.push({k:'fuera',t:'a',x:`Las fechas se salen de «${ec.n}» (${fechaTxt(ec.desde)} – ${fechaTxt(ec.hasta)}).`,s:'Una oferta no puede regir fuera de su campaña.',act:'encajar'});
  if(esPrecio(s)){
    if(s.cats.length && alcance(s).prendas===0) out.push({k:'vacia',t:'a',x:'Todavía no alcanza ninguna prenda.',s:'Márcalas en «Prendas» o suma categorías en «La campaña».'});
    if(s.tipo==='combo'){
      const sin = catsDe(s).filter(c=>s.precio>=s.qty*c.ej.p);
      if(sin.length) out.push({k:'combo',t:'a',x:`El paquete no es una rebaja en ${sin.map(c=>c.n).join(', ')}.`,s:`${s.qty} cuestan ${fmt(s.qty*sin[0].ej.p)} por separado y el paquete ${fmt(s.precio)}. Un precio de paquete que no baja el precio es el engaño que Indecopi sanciona.`});
    }
    if(s.tipo==='look'){
      const suma = s.partes.reduce((t,id)=>t+CATS.find(c=>c.id===id).ej.p,0);
      if(s.partes.length<2) out.push({k:'look',t:'a',x:'Un conjunto necesita al menos 2 prendas distintas.'});
      else if(s.precio>=suma) out.push({k:'look',t:'a',x:'El conjunto no es una rebaja.',s:`Por separado cuestan ${fmt(suma)} y el conjunto ${fmt(s.precio)}. Es el engaño que Indecopi sanciona.`});
    }
    const jean = (s.cats.includes('all')||s.cats.includes('pantalones')) && !s.excl.includes('jean');
    if(jean) out.push({k:'jean',t:'a',x:'Jean Palazzo subió de S/ 119 a S/ 129 hace 6 días.',s:'Si la rebajas ahora, el «antes» no es un precio normal y Indecopi puede tomarlo como engaño.',act:'excl'});
    if(s.tipo==='precio'){
      const sin = catsDe(s).filter(c=>s.precio>=c.ej.p);
      if(sin.length) out.push({k:'precio',t:'a',x:`A ${fmt(s.precio)} no es una rebaja en ${sin.map(c=>c.n).join(', ')}.`,s:`Su precio de lista es ${fmt(sin[0].ej.p)}. Es el engaño que Indecopi sanciona.`});
    }
    if(['pct','soles','precio'].includes(s.tipo)){
      const bajo = catsDe(s).filter(c=>unitario(s,c.ej.p)<c.ej.c);
      if(bajo.length) out.push({k:'costo',t:'a',x:`Queda por debajo del costo: ${bajo.map(c=>c.n).join(', ')}.`,s:'No se bloquea, pero pierdes plata en cada prenda: avísale al contador.'});
    }
    const cr = cruces(s);
    if(cr.length) out.push({k:'cruce',t:'i',x:`Se cruza con «${cr[0].n}»${cr.length>1?` y ${cr.length-1} más`:''}.`,s:'En cada prenda gana la que deja al cliente con el mejor precio; no se suman.'});
  } else if(s.tipo==='monto'||s.tipo==='montopct'){
    out.push({k:'monto',t:'i',x:'El monto se cuenta sobre lo que el cliente paga,',s:'después de las demás ofertas. Una prenda ya rebajada cuenta con su precio rebajado.'});
  } else if(s.tipo==='regalo'){
    out.push({k:'regalo',t:'a',x:'Un regalo es una transferencia gratuita.',s:'Pregúntale al contador cómo se declara en la boleta antes de activarlo.'});
  }
  if(s.claure) out.push({k:'claure',t:'a',x:'Entran las prendas de Claurè.',s:'Es otra empresa: confirma con su dueña que acepta el descuento.'});
  return out;
}

/* =========================== frases en palabras de tienda =========================== */
const extras = W => [ (W.nocats||[]).length ? `menos ${W.nocats.map(id=>CATS.find(c=>c.id===id).n.toLowerCase()).join(' y ')}` : '', W.dias ? `solo lo que lleva ${W.dias}+ días en el piso` : '', W.claure ? 'con prendas de Claurè' : ''].filter(Boolean);
function prendasEn(W){
  if(W.tipo==='look') return 'dentro de las prendas de la campaña';
  const ex = extras(W);
  const b = todasCamp(W) ? 'en todas las prendas de la campaña' : (catsDe(W).length ? 'solo en '+lista(catsDe(W).map(c=>c.n)) : 'en ninguna categoría todavía');
  return b + (ex.length ? ` (${ex.join(', ')})` : '');
}
function prendasDe(W){ return todasCamp(W) ? 'de la campaña' : (catsDe(W).length ? 'de '+lista(catsDe(W).map(c=>c.n)) : 'de ninguna categoría'); }
function prendasCorto(W){
  if(salta2(W)) return 'Toda la compra';
  if(W.tipo==='look') return lista(W.partes.map(id=>CATS.find(c=>c.id===id).n));
  const b = todasCamp(W) ? 'Todas las de la campaña' : (catsDe(W).length ? lista(catsDe(W).map(c=>c.n)) : 'Elige categorías');
  const ex = extras(W);
  return b + (ex.length ? ' · '+ex.join(' · ') : '');
}
/* Los días de la semana de una oferta: 0 = lunes … 6 = domingo. «Todos» = rige cada día de sus fechas. */
const SEMTODOS = [0,1,2,3,4,5,6];
const SEMN = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const SEMP = ['lunes','martes','miércoles','jueves','viernes','sábados','domingos'];
const SEM3 = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const semDe = W => W.sem || SEMTODOS;
/* Qué día de la semana cae en cada fecha entre «desde» y «hasta» (con setDate: un cambio de hora no corre un día). */
function semDelRango(W){
  const r = []; if(!W.desde || !W.hasta || W.hasta<W.desde) return r;
  const n = Math.min(diasEntre(W.desde,W.hasta),400), d = D(W.desde);
  for(let i=0;i<=n;i++){ r.push((d.getDay()+6)%7); d.setDate(d.getDate()+1); }
  return r;
}
/* Cuántos días de sus fechas rige de verdad: los que caen en los días elegidos. */
const rigenN = W => { const sem = semDe(W), r = semDelRango(W); return {rige:r.filter(d=>sem.includes(d)).length, total:r.length}; };
const contiguos = s => s.length>=3 && s.every((x,i)=>i===0||x===s[i-1]+1);
/* «los martes y jueves» · «de lunes a viernes» · «los sábados y domingos»; vacío si rige todos los días. */
function diasTxt(W){
  const s = [...semDe(W)].sort((a,b)=>a-b);
  if(s.length===7) return '';
  if(!s.length) return 'ningún día';
  if(s.join()==='5,6') return 'los sábados y domingos';
  if(contiguos(s)) return `de ${SEMN[s[0]]} a ${SEMN[s[s.length-1]]}`;
  return 'los '+lista(s.map(i=>SEMP[i]));
}
/* «mar y jue» · «lun a vie» · «fin de semana»: para el nombre y la lista. */
function diasCorto(W){
  const s = [...semDe(W)].sort((a,b)=>a-b);
  if(s.length===7) return '';
  if(!s.length) return 'sin días';
  if(s.join()==='5,6') return 'fin de semana';
  if(contiguos(s)) return `${SEM3[s[0]]} a ${SEM3[s[s.length-1]]}`.toLowerCase();
  return lista(s.map(i=>SEM3[i].toLowerCase()));
}
/* Una oferta con días sueltos solo vale si al menos uno de sus días cae dentro de sus fechas. */
const semOk = W => { const s = semDe(W); return s.length===7 || (s.length>0 && rigenN(W).rige>0); };
const rangoTxt = W => W.desde===W.hasta ? `el ${fechaTxt(W.desde)}` : `del ${fechaTxt(W.desde)} al ${fechaTxt(W.hasta)}`;
const rige = W => `Rige ${W.sedes.length===SEDES.length?'en las 3 tiendas':W.sedes.length?'solo en '+lista(W.sedes):'en ninguna tienda todavía'}${diasTxt(W)?', '+diasTxt(W):''}, ${rangoTxt(W)}.`;
function oracion(W){
  const pe = prendasEn(W), pd = prendasDe(W), mz = W.mezcla ? ', de cualquiera de las elegidas' : ', del mismo modelo';
  const p = {
    pct:`${W.pct} % menos ${pe}.`,
    soles:`${sol(W.desc)} menos en cada prenda ${pd}.`,
    precio:`Todas las prendas ${pd} a ${fmt(W.precio)}.`,
    combo:`${W.qty} por ${fmt(W.precio)} ${pe}${mz}.`,
    segunda:`La ${W.nth}.ª ${W.pct2>=100?'gratis':`con ${W.pct2} % menos`} ${pe}${mz}.`,
    nxm:`${W.lleva}x${W.m}: lleva ${W.lleva} y paga ${W.m} ${pe}${mz}.`,
    volumen:`${W.pct} % menos desde ${W.qty} prendas ${pe}${mz}.`,
    look:`${lista(W.partes.map(id=>CATS.find(c=>c.id===id).n.toLowerCase()))} juntas por ${fmt(W.precio)}.`,
    monto:`${sol(W.desc)} menos en compras desde ${sol(W.min)}.`,
    montopct:`${W.pct} % menos en compras desde ${sol(W.min)}.`,
    regalo:`${REG[W.regalo].t} en compras desde ${sol(W.min)}.`,
    club_pct:`${W.pct} % menos para los miembros del Club ${pe}.`,
    club_cupon:`${W.pct} % menos en la 1.ª compra de un miembro nuevo.`,
    club_privada:`Los miembros del Club compran ${W.horas} horas antes ${pe}.`,
    club_puntos:`Los miembros ganan puntos x${W.mult} en toda la compra.`
  }[W.tipo];
  return {que:cap(p), rige:rige(W)};
}

/* =========================== estado =========================== */
function fechasDeCampana(W){ const e = campanaDe(W.camp); W.desde = e.desde>HOY ? e.desde : HOY; W.hasta = e.hasta; }
const nuevoW = () => { const W = Object.assign(base({}), {camp:CAMPANA.id, elegido:false, editId:null, nombre:'', nombreMan:false, excl:[], desde:HOY, hasta:CAMPANA.hasta, precioMan:false, catsMem:null, semSolo:false, cats:['e:'+CAMPANA.id]}); fechasDeCampana(W); return W; };
const S0 = () => ({paso:1, vis:{1:false,2:false,3:false}, abre2:false, mas2:false, masq3:false, cedo:false, nota3:'', verTodas:false, regsAb:false, recien:null, toast:null, ent:true, pulso:false, W:nuevoW()});
const S = Object.assign({dev:'escritorio', tema:'claro', rol:'lider', abierta:true, mAnim:true}, S0());

/* =========================== los tres pasos =========================== */
function stepper(f,txt,W,typed){
  const [mn,mx,st] = limites(W,f);
  const mid = typed ? `<input data-f="num" data-n="${f}" value="${esc(txt)}" inputmode="decimal" autocomplete="off" aria-label="Escribe el valor (hoy ${esc(txt)})" onfocus="this.select()">` : `<b>${txt}</b>`;
  return `<div class="pq"><button data-a="step" data-n="${f}" data-d="${-st}" ${W[f]<=mn?'disabled':''} aria-label="Menos">${ic('minus')}</button>${mid}<button data-a="step" data-n="${f}" data-d="${st}" ${W[f]>=mx?'disabled':''} aria-label="Más">${ic('plus')}</button></div>`;
}
/* Solo los 1 a 3 contadores del tipo elegido, con la oración viva en la etiqueta. */
function controles(W){
  const c = (l,h,x='') => `<div class="t3-c ${x}"><span class="t3-cl">${l}</span>${h}</div>`;
  const st = (f,l,txt,typed) => c(l,stepper(f,txt,W,typed));
  const ch = (l,h) => c(l,`<div class="chips">${h}</div>`,'ancho');
  switch(W.tipo){
    case 'pct': return st('pct','Cuánto menos',`−${W.pct} %`);
    case 'soles': return st('desc','Soles menos en cada prenda',sol(W.desc),true);
    case 'precio': return st('precio','Todas a',fmt(W.precio),true);
    case 'nxm': return st('lleva','Lleva',`${W.lleva} prendas`) + st('m','Paga',plural(W.m,'prenda','prendas'));
    case 'combo': return st('qty','Cuántas lleva',`${W.qty} prendas`) + st('precio','Por cuánto',fmt(W.precio),true);
    case 'segunda': return st('nth','Cuál lleva descuento',`La ${W.nth}.ª`) + st('pct2','Cuánto menos',W.pct2>=100?'Gratis':`−${W.pct2} %`);
    case 'volumen': return st('qty','Desde cuántas',`${W.qty} prendas`) + st('pct','Cuánto menos en todas',`−${W.pct} %`);
    case 'look': return ch('Qué prendas lo forman · elige 2 o 3', CATS.map(x=>`<button class="opc ${W.partes.includes(x.id)?'on':''}" data-a="parte" data-v="${x.id}">${x.n}</button>`).join('')) + st('precio','Precio del conjunto',fmt(W.precio),true);
    case 'monto': return st('min','Desde cuánto',sol(W.min),true) + st('desc','Cuántos soles menos',sol(W.desc),true);
    case 'montopct': return st('min','Desde cuánto',sol(W.min),true) + st('pct','Cuánto menos',`−${W.pct} %`);
    case 'regalo': return st('min','Desde cuánto',sol(W.min),true) + ch('Qué se regala', Object.entries(REG).map(([k,v])=>`<button class="opc ${W.regalo===k?'on':''}" data-a="regalo" data-v="${k}">${v.t} <small>${v.sub}</small></button>`).join(''));
    case 'club_pct': case 'club_cupon': return st('pct','Cuánto menos',`−${W.pct} %`);
    case 'club_privada': return ch('Cuántas horas antes', [12,24,48].map(h=>`<button class="opc ${W.horas===h?'on':''}" data-a="horas" data-v="${h}">${h} horas</button>`).join(''));
    case 'club_puntos': return ch('Puntos por cada sol', [2,3].map(m=>`<button class="opc ${W.mult===m?'on':''}" data-a="mult" data-v="${m}">x${m} <small>${m} puntos por cada S/ 1</small></button>`).join(''));
  }
  return '';
}
function q1(W){
  const h = `<h2>¿Qué le das al cliente?</h2><p class="baj">${W.elegido?'Ajusta los números. Lo demás ya viene contestado.':'Elige lo que más se parezca. Los detalles vienen después.'}</p>`;
  if(!W.elegido) return h + `<div class="t3-fams ${S.pulso?'pulsa':''}" role="radiogroup" aria-label="Qué le das al cliente">${GRUPOS.map(g=>`<button class="t3-fam" role="radio" aria-checked="false" data-a="grupo" data-v="${g.k}"><span class="ico">${ic(g.ic,'m')}</span><b>${g.t}</b><small>${g.s}</small><span class="go">${ic('right','s')}</span></button>`).join('')}</div>`;

    case 'paso': { const n = +v; if(!W.elegido && n>1){ S.pulso = true; S.paso = 1; break; } if(n===2 && salta2(W)) break; if(n===3) S.vis[3] = true; S.paso = n; S.abre2 = false; S.ent = true; break; }
    /* ---- lo ya registrado ---- */
    case 'activar': { if(!ROLES[S.rol].act) break; const c = CAMP.find(x=>x.id===v); c.borrador = false; S.recien = v; avisar(`Activada: «${c.n}». ${c.desde>HOY?'Empieza el '+fechaTxt(c.desde):'Ya rige'}.`); break; }
    case 'editar': { const c = CAMP.find(x=>x.id===v); if(!c) break;
      S.W = Object.assign(nuevoW(), JSON.parse(JSON.stringify(c)), {editId:c.id, camp:CAMPANA.id, elegido:true, nombre:c.n, nombreMan:c.n!==defNombre(c), excl:[], catsMem:null, semSolo:semDe(c).length<7});
      Object.assign(S,{paso:1, vis:{1:false,2:false,3:false}, abre2:false, mas2:false, masq3:false, cedo:false, nota3:'', ent:true}); break; }
    case 'nueva': Object.assign(S,S0(),{recien:S.recien,verTodas:S.verTodas}); break;
  }
  render();
}
document.addEventListener('click', e=>{ const b = e.target.closest('[data-a]'); if(!b || b.disabled) return; act(b.dataset.a, b.dataset.v, b); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.abierta){ act('cerrar'); } });
document.addEventListener('change', e=>{
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  const W = S.W; S.ent = false;
  if(f==='num'){ const n = e.target.dataset.n; let x = parseFloat(String(e.target.value).replace(',','.').replace(/[^0-9.]/g,''));
    if(!isNaN(x)){ const [mn,mx] = limites(W,n); x = Math.min(mx,Math.max(mn,x)); W[n] = n==='precio' ? Math.round(x*10)/10 : Math.round(x); if(n==='precio') W.precioMan = true; }
    render(); return; }
  if(f==='nombre'){ W.nombre = e.target.value; W.nombreMan = true; render(); return; }
  if(f==='desde'||f==='hasta'){ W[f] = e.target.value || W[f]; render(); }
});
render();
</script>
