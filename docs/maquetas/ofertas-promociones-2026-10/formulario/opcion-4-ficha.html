<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opción 4 · La ficha que se toca · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · «Nueva oferta o promoción» · OPCIÓN 4 · LA FICHA QUE SE TOCA (2026-10-23)
   No hay formulario: hay una ficha ya armada que se lee como una frase. Cada pastilla se toca y abre un editor chico de ESA sola parte.
   Todo trae valor de fábrica, así que Guardar está disponible desde el primer segundo: se corrige, no se llena.
   Tokens = los de ../index.html (apps/web/app/globals.css, ADR-0169), claro y oscuro. Ningún hex nuevo en el formulario.
   Hoy simulado = 23 oct 2026. Los nombres, las fechas y las prendas de las campañas salen de producción (solo lectura); las cifras y las ofertas, salvo el −10 % de Aniversario, son INVENTADAS.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);
--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--oscuro:#171614;--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t10:rgba(245,240,232,.1);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.m{width:20px;height:20px}svg.l{width:24px;height:24px}
.serif{font-family:'EB Garamond',serif;font-weight:500}
.num{font-variant-numeric:tabular-nums}
@keyframes sube{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sale{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fundir{from{opacity:0}to{opacity:1}}
@keyframes subeh{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes destella{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tinta) 30%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- barra de la maqueta ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk .go{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(245,240,232,.35);font-size:12.5px;color:#f5f0e8}
.spk .go:hover{background:rgba(245,240,232,.12)}
.escena{padding:18px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ley{max-width:1180px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t80)}.ley b{font-weight:600}
.ley .ej{display:inline-block;margin:2px 0 0 6px;padding:1px 8px;border-radius:999px;background:var(--hueso);font-size:11px;color:var(--taupe);font-weight:600}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.marco,.sx>.tel{margin:0 auto}
/* ---- marcos ---- */
.marco{container-type:inline-size;flex:none;position:relative;overflow:hidden;background:var(--crema);box-shadow:0 30px 60px -30px var(--sombra)}
.marco.desk{width:1180px;height:780px;border-radius:14px;border:1px solid var(--t30)}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px var(--sombra);flex:none}
.marco.cel{width:375px;height:796px;border-radius:39px}
.pant{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
.pant:not(.anim) *{animation:none!important}
/* ---- piezas ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:background .2s,transform .2s,color .2s}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.n{font-size:13.5px;letter-spacing:0;text-transform:none;height:38px}
.btn.chico{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px;letter-spacing:0;text-transform:none}
.btn.sutil{background:var(--hueso);border-color:transparent;color:var(--tinta)}.btn.sutil:hover{background:var(--sand);color:var(--tinta)}
.enl{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe);font-size:13px}.enl:hover{color:var(--rojo-p)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.nodot::before{display:none}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.r{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 12%,transparent)}.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.chip.t{background:var(--tinta);color:var(--crema)}
.nota{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80);display:flex;gap:9px;align-items:flex-start}
.nota .ic{margin-top:2px;color:var(--taupe)}
.nota.am{background:color-mix(in srgb,var(--ambar) 13%,transparent)}.nota.am .ic{color:var(--ambar)}
.foto{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:22px;color:rgba(26,26,24,.55)}
.lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--sombra);animation:sale .3s var(--ease) both}
/* ---- ERP de fondo: lateral + cabecera + una tarjeta ---- */
.erp{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%;background:var(--crema)}
.lat{position:sticky;top:0;align-self:start;height:780px;border-right:1px solid var(--sand);background:var(--papel);padding:16px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.lat .logo{font-weight:700;letter-spacing:.16em;color:var(--rojo);font-size:17px;padding:2px 10px 12px}
.lat .g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--t50);padding:12px 10px 4px}
.lat a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;color:var(--t80);cursor:default}
.lat a.sub{padding-left:22px}.lat a.on{background:var(--tinta);color:var(--crema);font-weight:600}
.mtop{display:none}
.cont{min-width:0}
.enc{display:flex;gap:14px 24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:22px 28px 0}
.enc .sede{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--taupe);display:flex;align-items:center;gap:12px}
.enc .sede::after{content:"";flex:1;height:1px;background:var(--taupe);opacity:.4;min-width:40px}
.enc .iz{flex:1;min-width:260px}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:6px}
.enc p{color:var(--t65);margin-top:4px;max-width:600px}
.cuerpo{padding:18px 28px 44px}
.tarj{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.tarj .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--sand)}
/* ---- campos de la hoja (las mismas piezas de ../index.html) ---- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.opc{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 13px;border-radius:12px;border:1px solid var(--sand);background:var(--hueso);font-size:13px;transition:background .2s}
.opc:hover{background:var(--sand)}.opc.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.opc small{font-size:11.5px;opacity:.7}
.opc.chico{min-height:30px;padding:3px 10px;font-size:12.5px;border-radius:9px}
.pop .atj{gap:6px;margin-top:2px}.pop .atj .opc{flex:0 0 auto}
.opc:disabled{opacity:.5;cursor:not-allowed}.opc:disabled:hover{background:var(--hueso)}
.pq{display:inline-flex;align-items:center;border:1px solid var(--sand);background:var(--hueso);border-radius:12px;height:48px;overflow:hidden}
.pq button{width:44px;height:100%;display:grid;place-items:center}.pq button:hover{background:var(--sand)}.pq button:disabled{opacity:.3;pointer-events:none}
.pq b{min-width:96px;text-align:center;font-family:'EB Garamond',serif;font-size:26px;font-weight:500}
.campo{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--sand);border-radius:12px;background:var(--hueso);transition:background .2s,border-color .2s}
.campo:focus-within{background:var(--papel);border-color:var(--tinta)}.campo input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14.5px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dosc label{display:block}.dosc label span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-bottom:5px}
.sublbl{font-size:12px;font-weight:600;color:var(--t65);margin:12px 0 6px}.sublbl span{font-weight:400}
.ejs{margin-top:10px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);overflow:hidden}
.ejs div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--sand);font-size:13px}.ejs div:last-child{border:0}
.ejs div b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.ejs s{color:var(--t50);margin-right:6px;font-weight:400}
.vp{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center}
.vp h5{font-size:14px;font-weight:600}.vp .co{font-size:12px;color:var(--t65)}
.vp .pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:2px}.vp .pr s{color:var(--t50);font-size:13px}.vp .pr b{font-size:19px;font-weight:700}
.dtochip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;background:var(--tinta);color:var(--crema);font-size:11px;font-weight:700}
/* ---- la hoja «Configuración» de una campaña (ADR-0136: velo con desenfoque, la hoja sube y crece) ---- */
.velo{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:22px}
.velo-fondo{position:absolute;inset:0;background:color-mix(in srgb,#000 48%,transparent);backdrop-filter:blur(3px)}
.hoja{position:relative;display:flex;flex-direction:column;width:min(1080px,100%);max-height:100%;background:var(--papel);border:1px solid var(--sand);border-radius:20px;overflow:hidden}
.velo.entra .velo-fondo{animation:fundir .3s var(--ease) both}.velo.entra .hoja{animation:subeh .38s var(--ease) both}
.hoja-cab{padding:20px 28px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}.hoja-cab h2{font-family:'EB Garamond',serif;font-weight:500;font-size:26px;line-height:1.15}.hoja-cab p{color:var(--t65);font-size:13px}
.strip{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;padding:8px 12px;background:var(--hueso);border-radius:10px;width:fit-content;max-width:100%;flex-wrap:wrap}.strip .ic{color:var(--taupe)}.strip .sf{display:inline-flex;gap:8px;align-items:center}.strip .sf+.sf{padding-left:14px;border-left:1px solid var(--t30)}
.hoja-cuerpo{overflow:auto;padding:4px 28px 14px;flex:1;min-height:0}
.hoja-pie{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 28px;border-top:1px solid var(--sand);background:var(--papel)}
.hoja-pie .falta{margin-right:auto;font-size:12.5px;color:var(--t65);text-align:left}.hoja-pie .falta b{color:var(--ambar);font-weight:600}
.hoja-pie button.falta{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ambar)}.hoja-pie button.falta:hover{color:var(--tinta)}
.regs{display:grid;gap:6px}
.reg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:7px 12px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);transition:background .2s}
button.reg:hover{background:var(--hueso)}.reg.recien{background:color-mix(in srgb,var(--verde) 9%,transparent)}
.reg .rn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reg .rn small{color:var(--t65);font-size:12px}
.regs.cortas .reg{padding:5px 12px}.regs.cortas .rn{display:flex;gap:12px;align-items:baseline;min-width:0}.regs.cortas .rn b{flex:none;max-width:55%}.regs.cortas .rn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lh{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}.lh .lh-s{font-size:12px;color:var(--t65)}.lh .enl{margin-left:auto;font-size:12.5px}
.reg-w{display:flex;gap:8px;align-items:stretch}.reg-w .reg{flex:1;min-width:0}.reg-w .btn.chico{align-self:center;white-space:nowrap}
.reg.edit{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta);background:var(--papel)}
.reg .hist{display:flex;gap:4px;align-items:center;margin-top:2px;color:var(--taupe)}.reg .hist .ic{flex:none}
.espera{align-self:center;font-size:11.5px;color:var(--ambar);white-space:nowrap;padding-right:4px}
.sec-of{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;margin:2px 0 10px}.sec-of b{font-family:'EB Garamond',serif;font-weight:500;font-size:23px}
.cn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hueso);font-size:11px;font-weight:700}
.sg{font-size:11px;font-weight:600;color:var(--taupe);padding:1px 8px;border-radius:999px;background:var(--hueso)}

/* ====================================================================
   LA FICHA QUE SE TOCA (lo propio de esta opción)
   ==================================================================== */
.sub-f{color:var(--t65);font-size:13px}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) 312px;border:1px solid var(--sand);border-radius:18px;background:var(--papel)}
.fi-izq{padding:14px 20px 12px;min-width:0}
.fi-der{padding:14px 18px;border-left:1px dashed var(--t30);display:flex;flex-direction:column;gap:10px;background:var(--crema);border-radius:0 18px 18px 0;min-width:0}
.fi-der .lbl{font-size:10.5px}
.fr-l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--t50);margin:0 0 10px}
.fr-l:not(:first-child){margin-top:12px}
.frase{display:flex;flex-wrap:wrap;align-items:center;gap:12px 8px;font-size:14px}
.frase .sep{color:var(--t50);padding:0 3px}
.frase .fx{color:var(--t80);padding:0 2px}
/* una pastilla: se ve como texto de la frase y se nota que se toca (pastilla + flechita) */
.fp{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 11px 0 14px;border-radius:999px;border:1px solid var(--sand);background:var(--hueso);font-size:14px;font-weight:500;color:var(--tinta);text-align:left;transition:background .2s,border-color .2s,box-shadow .2s}
.fp:hover{background:var(--sand)}
.fp .ic{opacity:.5;margin-top:1px}
.fp[aria-expanded="true"]{background:var(--papel);border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.fp[aria-expanded="true"] .ic{opacity:.9}
.fp.tipo{background:var(--tinta);color:var(--crema);border-color:var(--tinta);font-weight:600}
.fp.tipo:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:var(--crema)}
.fp.tipo[aria-expanded="true"]{background:var(--tinta);color:var(--crema);box-shadow:0 0 0 3px color-mix(in srgb,var(--tinta) 14%,transparent)}
.fp.sigue,.trio.sigue{border-color:var(--tinta);background:color-mix(in srgb,var(--tinta) 6%,var(--papel));box-shadow:0 0 0 3px color-mix(in srgb,var(--tinta) 10%,transparent)}
.trio{position:relative;display:inline-flex;gap:6px;padding:0;border-radius:999px}
.trio.sigue{background:transparent;border-color:transparent;box-shadow:none}
.trio.sigue .tg{border-color:var(--tinta);box-shadow:0 0 0 3px color-mix(in srgb,var(--tinta) 10%,transparent)}
.sg-t{position:absolute;left:12px;top:-10px;height:17px;padding:0 8px;border-radius:999px;background:var(--tinta);color:var(--crema);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:17px;pointer-events:none;white-space:nowrap}
.destella{animation:destella .9s var(--ease) 1}
/* las tiendas: se prenden y se apagan ahí mismo, sin abrir nada */
.tg{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--sand);background:var(--hueso);font-size:13px;font-weight:700;letter-spacing:.05em;transition:background .2s,border-color .2s}
.tg:hover{background:var(--sand)}
.tg.on .ic{color:var(--verde)}
.tg:not(.on){background:transparent;border-style:dashed;border-color:var(--t30);color:var(--t65);text-decoration:line-through;text-decoration-thickness:1px}
.fi-pie{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--sand);font-size:12.5px;color:var(--t65)}
.fi-pie .nom{margin-left:auto;display:inline-flex;gap:6px;align-items:center;color:var(--t80);text-align:left}
.fi-pie .nom b{font-weight:600;color:var(--tinta)}
.fi-pie .nom:hover b{text-decoration:underline;text-underline-offset:3px}
.fi-pie .nom .ic{opacity:.55}
.fi-der .cede{width:100%;gap:6px;white-space:nowrap}.fi-der .cede b{font-weight:600}.fi-der .cede .mut{font-size:12px;color:var(--t65);font-weight:400}.fi-der .cede .ic{margin-left:auto}
.fi-der .cap{font-size:12px;color:var(--t65)}
.avisos{margin-top:10px}
.avisos .nota{margin-top:0;display:grid;gap:0;padding:0}
.av{display:flex;gap:9px;align-items:flex-start;padding:10px 12px}
.av+.av{border-top:1px solid color-mix(in srgb,var(--tinta) 12%,transparent)}
.av .ic{margin-top:2px;flex:none}

const $ = s => document.querySelector(s);

const precioLook = W => r2(Math.round(W.partes.reduce((t,id)=>t+CATS.find(c=>c.id===id).ej.p,0)*.8/5)*5-.1);

const catsDe = c => { const t = c.cats.includes('all') ? CATS : [...CATS.filter(x=>c.cats.includes(x.id)), ...ETQS.filter(e=>c.cats.includes('e:'+e.id)).map(etqGrupo)]; return (c.nocats||[]).length ? t.filter(x=>!c.nocats.includes(x.id)) : t; };
const catsTxt = c => c.cats.includes('all') ? 'Todo' : (catsDe(c).length<=2 ? catsDe(c).map(x=>x.etq?'Toda la campaña':x.n).join(' y ') : catsDe(c).length+' grupos');
const deCompra = t => ['monto','montopct','regalo','club_cupon','club_puntos'].includes(t);
const esPrecio = c => ['pct','soles','precio','combo','segunda','nxm','volumen','look'].includes(c.tipo);
const unitario = (s,p) => s.tipo==='pct' ? rebaja(p,s.pct) : s.tipo==='soles' ? r2(Math.max(0,p-s.desc)) : s.tipo==='precio' ? s.precio : p;

function alcance(s){
  const f = {0:1,60:.5,90:.3,120:.15}[s.dias]||1;
  const cs = catsDe(s), e = campanaDe(s.camp);
  let prendas = Math.round(cs.reduce((t,c)=>t+c.prendas,0)*f), unid = Math.round(cs.reduce((t,c)=>t+c.unid,0)*f);
  if(e && !deCompra(s.tipo)){ prendas = Math.min(prendas,Math.round(e.prendas*f)); unid = Math.min(unid,Math.round(e.unid*f)); }
  return {prendas, unid, f};
}
function costoEst(s){
  const cs = catsDe(s), f = alcance(s).f, sf = s.sedes.length/SEDES.length;
  let t = 0;
  for(const c of cs){
    const u = c.v30*f*sf, p = c.ej.p;
    if(['pct','soles','precio'].includes(s.tipo)) t += u*Math.max(0,p-unitario(s,p));
    else if(s.tipo==='combo') t += (u*.5/s.qty)*Math.max(0,s.qty*p-s.precio);
    else if(s.tipo==='segunda') t += (u*.5/s.nth)*(p*s.pct2/100);
    else if(s.tipo==='nxm') t += (u*.5/s.n)*((s.n-s.m)*p);
    else if(s.tipo==='volumen') t += (u*.5)*(p*s.pct/100);
  }
  if(s.tipo==='look') t = cs.length ? Math.min(...cs.map(c=>c.v30))*.3*sf*Math.max(0,cs.reduce((a,c)=>a+c.ej.p,0)-s.precio) : 0;
  if(s.tipo==='monto') t = 40*sf*s.desc;
  if(s.tipo==='montopct') t = 40*sf*(s.pct/100)*(s.min+12);
  if(s.tipo==='club_pct') t = 30*sf*(s.pct/100)*90;
  if(s.tipo==='regalo') t = 35*sf*REG[s.regalo].costo;
  if(s.tipo==='club_cupon') t = 12*(s.pct/100)*140;
  if(s.tipo==='club_puntos') t = 3000*(s.mult-1)*0.05;
  if(s.tipo==='club_privada') t = 0;
  return Math.round(t/10)*10;
}
const defNombre = s => s.tipo==='monto' ? `${sol(s.desc)} menos desde ${sol(s.min)}`
  : s.tipo==='montopct' ? `${s.pct} % menos desde ${sol(s.min)}`
  : s.tipo==='regalo' ? `${REG[s.regalo].t} desde ${sol(s.min)}`
  : s.tipo.startsWith('club') ? `${TIPOS[s.tipo].da(s)} · Club`
  : `${catsTxt(s)} · ${TIPOS[s.tipo].da(s)}`;
function cruces(s){
  if(!esPrecio(s)) return [];
  return CAMP.filter(c=>c.id!==s.editId && estadoDe(c)!=='Terminada' && esPrecio(c) && c.desde<=s.hasta && s.desde<=c.hasta &&
    (c.cats.includes('all')||s.cats.includes('all')||c.cats.some(x=>s.cats.includes(x))||(c.camp===s.camp&&(c.cats.some(x=>x.startsWith('e:'))||s.cats.some(x=>x.startsWith('e:'))))) && c.sedes.some(x=>s.sedes.includes(x)));
}

    if(W.tipo==='combo'){

    if(jean) out.push({t:'a',k:'jean',x:'Jean Palazzo subió de S/ 119 a S/ 129 hace 6 días',s:'Si la rebajas ahora, el «antes» no es un precio normal y Indecopi puede tomarlo como engaño. Cuántos días de precio estable hacen falta lo confirma un abogado.',act:['excl','Sacarla de la oferta']});
    if(['pct','soles','precio'].includes(W.tipo)){
      const bajo = catsDe(W).filter(c=>unitario(W,c.ej.p)<c.ej.c);
      if(bajo.length) out.push({t:'a',k:'costo',x:`Por debajo del costo: ${bajo.map(c=>c.n).join(', ')}`,s:'No se bloquea, pero quedas en pérdida por prenda: pásale al contador cuánto se desvaloriza el stock.'});

    if(cr.length) out.push({t:'i',k:'cruce:'+cr.map(c=>c.id).join(','),x:`Se cruza con ${cr.slice(0,2).map(c=>`«${c.n}»`).join(' y ')}${cr.length>2?` y ${cr.length-2} más`:''}`,s:'Si una prenda cae en dos ofertas, gana la que deja al cliente con el mejor precio: una sola por prenda. No se suman.'});
  } else if(W.tipo==='regalo'){
    out.push({t:'a',k:'regalo',x:'Un regalo es una transferencia gratuita',s:'Pregúntale al contador cómo se declara en la boleta antes de activarlo.'});

  return out.sort((a,b)=>(a.t==='a'?0:1)-(b.t==='a'?0:1) || (b.act?1:0)-(a.act?1:0));
}

        ${nt(sf?`«${camp.n}» no tiene fechas todavía: aquí rige solo por las que elijas.`:`Va dentro de <b>«${camp.n}»</b> y toma sus fechas (nunca antes de hoy ni fuera de ellas). Si luego cambian las de la campaña, esta conserva las suyas.`)}`;
      listo = true; break; }
    case 'suma': tit = 'Con las demás ofertas'; ancho = 440; listo = false;
      cuerpo = `<div class="chips"><button class="opc dos ${W.acum?'on':''}" data-a="acum" data-v="1">Se suma<small>primero la prenda, luego el ticket, al final el cupón del Club</small></button><button class="opc dos ${!W.acum?'on':''}" data-a="acum" data-v="0">No se suma<small>si la prenda lleva esta oferta, no recibe las demás</small></button></div>`+nt('Si dos ofertas caben en la misma prenda, gana la mejor para el cliente: una sola por prenda.'); break;
    case 'nombre': tit = 'Cómo se llama'; ancho = 400;
      cuerpo = `<div class="campo"><input value="${esc(W.nombreMan&&W.nombre.trim()?W.nombre:defNombre(W))}" data-f="nombre" aria-label="Nombre de la oferta" data-foco></div>`+nt('Se arma solo con lo que elegiste. Cámbialo solo si quieres reconocerla mejor en la lista.')+(W.nombreMan?`<div class="nt"><button class="enl" data-a="nombreauto">Volver al nombre automático</button></div>`:''); break;
    case 'cede': {
      tit = 'Lo que cedes'; ancho = 460; listo = true;
      if(faltan(W).length){ cuerpo = `<div class="nt" style="margin-top:0">Todavía no se puede calcular: falta <b>${faltan(W)[0].x}</b>.</div>`; break; }
      const cd = costoDet(W);
      const despues = [];
      if(['cantidad','monto'].includes(TIPOS[W.tipo].cond)) despues.push('Devolución: la oferta se pierde; lo que se queda vuelve a su precio y se descuenta del reintegro.');
      despues.push('Cambio de talla o color: la prenda nueva va a precio normal.','Apartado: se cobra el precio del día en que retira.');
      if(esPrecio(W)) despues.push('Etiquetas de papel: el sistema avisa reimprimirlas la víspera de que empiece y de que termine.');
      cuerpo = `<div class="pop-cede"><b class="gr">≈ ${fmt(cd.tot).replace('.00','')}</b><div class="nt" style="margin-top:2px">${cd.txt}</div>${cd.filas.map(r=>`<div class="cr"><span>${r.a}<small>${r.b}</small></span><span>${r.c}</span></div>`).join('')}${nt('Es una estimación, no una promesa: se calcula con las ventas de los últimos 30 días en las tiendas elegidas.')}
        <div class="sublbl" style="margin-top:12px">Qué pasa después de vender</div>${despues.map(t=>`<div class="nt" style="margin-top:4px">· ${t}</div>`).join('')}</div>`;
      break; }
  }
  return `<div class="pop-v" data-a="popcerrar"></div><div class="pop ${S.popAnim?'anima':''}" id="pop" role="dialog" aria-label="${esc(tit)}" style="--pw:${ancho}px" tabindex="-1"><div class="pop-h"><b>${tit}</b><button class="pop-x" data-a="popcerrar" aria-label="Cerrar este editor">${ic('x','s')}</button></div>${cuerpo}${listo?`<div class="pop-f"><button class="btn n chico" data-a="popcerrar">Listo</button></div>`:''}</div>`;
}
/* El editor se cuelga de su pastilla (en el celular es una hoja desde abajo). */
function posPop(){
  const pop = $('#pop'); if(!pop) return;
  const marco = document.querySelector('.marco'), mr = marco.getBoundingClientRect();
  if(marco.clientWidth<=760) return;
  const a = document.querySelector(`[data-pill="${S.pop}"]`); if(!a) return;
  const ar = a.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = ar.left-mr.left; left = Math.max(10,Math.min(left,mr.width-w-10));
  let top = ar.bottom-mr.top+8;
  if(top+h>mr.height-10){ const t2 = ar.top-mr.top-h-8; top = t2>=10 ? t2 : Math.max(10,mr.height-h-10); }
  pop.style.left = left+'px'; pop.style.top = top+'px';
}
/* Deja la pastilla a la vista dentro del cuerpo de la hoja (sin mover la página). */
function verPill(id){
  const cu = document.querySelector('.hoja-cuerpo'), a = document.querySelector(`[data-pill="${id}"]`); if(!cu||!a) return;
  const c = cu.getBoundingClientRect(), r = a.getBoundingClientRect();
  if(r.top<c.top+8) cu.scrollTop -= (c.top+8-r.top);
  else if(r.bottom>c.bottom-8) cu.scrollTop += (r.bottom-c.bottom+8);
}

/* =========================== marco, barra, render =========================== */
function barra(){
  $('#spk').innerHTML = `<span class="tag">Maqueta · Formulario · Opción 4</span>
  <div class="seg"><button class="${S.dev==='escritorio'?'on':''}" data-a="dev" data-v="escritorio">Escritorio</button><button class="${S.dev==='celular'?'on':''}" data-a="dev" data-v="celular">Celular</button></div>
  <div class="seg"><button class="${S.tema==='claro'?'on':''}" data-a="tema" data-v="claro">Claro</button><button class="${S.tema==='oscuro'?'on':''}" data-a="tema" data-v="oscuro">Oscuro</button></div>
  <span class="tag">Ver como</span><div class="seg">${Object.entries(ROLES).map(([k,r])=>`<button class="${S.rol===k?'on':''}" data-a="rol" data-v="${k}">${r.t}</button>`).join('')}</div>
  <button class="go" data-a="reiniciar">Reiniciar</button><span style="margin-left:auto;color:rgba(245,240,232,.6);font-size:12px">Campañas de producción · cifras inventadas · hoy = vie 23 oct 2026</span>`;
  $('#ley').innerHTML = LEY;
}
function render(){
  document.documentElement.dataset.tema = S.tema;
  barra();
  const mb = document.querySelector('.hoja-cuerpo'); const mst = mb && !S.mAnim ? mb.scrollTop : 0;
  const html = vFondo();
  const modal = S.cfg ? modalCfg() : ''; S.mAnim = false;
  const pop = S.cfg && S.pop ? popHTML() : '';
  const marco = `<div class="marco ${S.dev==='escritorio'?'desk':'cel'}"><div class="pant ${S.anim?'anim':''}">${html}</div>${modal}${pop}${S.toast?`<div class="toast">${S.toast}</div>`:''}</div>`;
  $('#esc').innerHTML = S.dev==='escritorio' ? marco : `<div class="tel">${marco}</div>`;
  const nb = document.querySelector('.hoja-cuerpo'); if(nb) nb.scrollTop = mst;
  if(nb && S.mScroll){ nb.scrollTop = 0; S.mScroll = false; }
  if(S.verPill){ verPill(S.verPill); S.verPill = null; }
  posPop(); S.popAnim = false;
  if(S.destello){ const el = document.querySelector(`[data-pill="${S.destello}"] .tg, [data-pill="${S.destello}"]`); if(el){ el.classList.remove('destella'); void el.offsetWidth; el.classList.add('destella'); } S.destello = null; }
  if(S.focoPop){ const el = document.querySelector('.pop [data-foco]') || document.querySelector('.pop .pq button:not(:disabled)') || document.querySelector('.pop .opc.on') || document.querySelector('.pop .opc:not(:disabled)'); if(el) el.focus({preventScroll:true}); S.focoPop = false; }
  if(S.focoPill){ const el = document.querySelector(`[data-pill="${S.focoPill}"]`); if(el) el.focus({preventScroll:true}); S.focoPill = null; }
  mide();
}
/* Cuando solo cambia la ficha (un campo de texto o de fecha del editor), se redibuja ella y el pie, no el editor: así el clic siguiente no se pierde. */
function renderFicha(){
  const f = $('#fichaw'), p = $('#piew'); if(!f||!p){ render(); return; }
  f.innerHTML = fichaHTML()+avisosHTML(); p.innerHTML = pieHTML(); posPop();
}
let tt;
function avisar(t){ S.toast = t; clearTimeout(tt); tt = setTimeout(()=>{S.toast=null; S.anim=false; render();}, 3200); }

/* =========================== acciones =========================== */
function fechasDeCampana(W){ const e = campanaDe(W.camp); if(e && !sinFechas(e)){ W.desde = e.desde>HOY ? e.desde : HOY; W.hasta = e.hasta; } }
function encajar(W){
  const e = campanaDe(W.camp); if(!e || sinFechas(e)) return;
  const ini = e.desde>HOY ? e.desde : HOY;
  if(W.desde<ini || W.desde>e.hasta) W.desde = ini;
  if(W.hasta>e.hasta || W.hasta<W.desde) W.hasta = e.hasta;
}
function selTipo(W,k){
  const e = campanaDe(W.camp);
  W.sel = k; Object.assign(W, {mezcla:false, precioMan:false}, DEF[k], DEF[k].partes ? {partes:[...DEF[k].partes], cats:[...DEF[k].cats]} : {});
  if(!DEF[k].cats) W.cats = e ? ['e:'+e.id] : [];
  if(k==='combo') W.precio = precioSug(W);
  if(k==='look') W.precio = precioLook(W);
}
/* Al cambiar de tipo se conserva lo ya corregido (las prendas, las tiendas, las fechas, la suma): la persona corrige, no vuelve a empezar. */
function cambiarTipo(W,k){
  const antes = {tipo:W.tipo, cats:[...W.cats]};
  selTipo(W,k);
  if(!DEF[k].cats && !deCompra(antes.tipo) && antes.tipo!=='look' && antes.cats.length && !antes.cats.includes('all')){
    W.cats = antes.cats;
    if(k==='combo') W.precio = precioSug(W);
  }
}
function abrirCfg(id){
  S.W = nuevoW(); S.W.camp = id; S.cfg = id; S.mAnim = true; S.pop = null; S.verTodas = false; S.prMas = false; S.avOk = {}; S.verAv = false; S.recien = null;
  selTipo(S.W,'pct'); fechasDeCampana(S.W);
}
const listo = W => faltan(W).length===0;
function guardarRegla(W,borrador){
  const n = W.nombreMan && W.nombre.trim() ? W.nombre.trim() : defNombre(W), id = 'n'+(CAMP.length+1), cn_ = campanaDe(S.cfg).n;
  const c = base(Object.assign({}, W, {id, n, borrador, vendidas:0, hist:[], cats:[...W.cats], partes:[...W.partes], nocats:[...W.nocats]})); delete c.editId; CAMP.push(c);
  S.recien = id; S.cfg = null; S.pop = null;
  return {c,n,cn:cn_};
}
function act(a,v,el){
  const W = S.W; S.anim = false; S.popAnim = false;
  switch(a){
    case 'dev': S.dev = v; S.pop = null; break;
    case 'tema': S.tema = v; break;
    case 'rol': S.rol = v; break;
    case 'reiniciar': Object.assign(S,{cfg:null,pop:null,recien:null,toast:null,W:nuevoW(),verTodas:false,prMas:false,avOk:{},verAv:false,anim:true});
      CAMP.splice(0,CAMP.length,...JSON.parse(SNAP).map(o=>base(o))); abrirCfg('aniversario'); break;
    case 'cfgabrir': abrirCfg(v||'aniversario'); break;
    case 'cfgcerrar': S.cfg = null; S.pop = null; break;
    case 'cfgcampana': avisar('En la versión real abre «Cambiar fechas» y «Prendas» de la campaña: es la parte de arriba de la hoja de hoy, sin cambios.'); break;
    case 'vermas': S.verTodas = !S.verTodas; break;
    case 'verav': S.verAv = !S.verAv; break;
    case 'avok': S.avOk[v] = true; break;
    /* ---- las pastillas ---- */
    case 'pill': if(S.pop===v){ S.pop = null; S.focoPill = v; } else { S.pop = v; S.popAnim = true; S.focoPop = true; S.prMas = false; } break;
    case 'popcerrar': S.focoPill = S.pop; S.pop = null; break;
    case 'falta': if(v==='sedes'){ S.pop = null; S.verPill = 'sedes'; S.destello = 'sedes'; } else { S.pop = v; S.popAnim = true; S.focoPop = true; S.verPill = v; } break;
    case 'tipo': cambiarTipo(W,v); S.pop = null; S.focoPill = 'tipo'; break;
    case 'step': { const f = el.dataset.f, d = +el.dataset.d; const [mn,mx] = limites(W,f); W[f] = r2(Math.min(mx,Math.max(mn,W[f]+d))); if(f==='precio'){ W.precio = Math.round(W.precio*10)/10; W.precioMan = true; }
      if(f==='n' && W.m>=W.n) W.m = W.n-1;
      if(f==='qty' && W.tipo==='combo' && !W.precioMan) W.precio = precioSug(W);
      break; }
    case 'atajo': { const f = el.dataset.f; W[f] = +v; if(el.dataset.c==='1'){ S.pop = null; S.focoPill = f; } break; }
    case 'cuentan': W.mezcla = v==='1'; S.pop = null; S.focoPill = 'cuentan'; break;
    case 'regalo': W.regalo = v; S.pop = null; S.focoPill = 'regalo'; break;
    case 'horas': W.horas = +v; S.pop = null; S.focoPill = 'horas'; break;
    case 'mult': W.mult = +v; S.pop = null; S.focoPill = 'mult'; break;
    case 'parte': { W.partes = tgl(W.partes,v); if(W.partes.length>3) W.partes = W.partes.slice(0,3); W.cats = [...W.partes]; if(!W.precioMan && W.partes.length>=2) W.precio = precioLook(W); break; }
    /* Prendas: si hoy son «todas», tocar una categoría la elige y cierra (el camino corto); ya en «solo algunas», cada toque suma o quita. */
    case 'cat': { const todas = W.cats.some(x=>x.startsWith('e:'));
      if(v.startsWith('e:')){ W.cats = [v]; S.pop = null; S.focoPill = 'prendas'; }
      else if(todas || !W.cats.length){ W.cats = [v]; S.pop = null; S.focoPill = 'prendas'; }
      else W.cats = tgl(W.cats,v);
      if(W.tipo==='combo' && !W.precioMan) W.precio = precioSug(W);
      break; }
    case 'prmas': S.prMas = !S.prMas; break;
    case 'nocat': W.nocats = tgl(W.nocats,v); break;
    case 'claure': W.claure = !W.claure; break;
    case 'dias': W.dias = +v; break;
    case 'sede': W.sedes = tgl(W.sedes,v); break;
    case 'rango': { const [d,h] = v.split(','); W.desde = d; W.hasta = h; W.fechasMan = true; S.pop = null; S.focoPill = 'fechas'; break; }
    case 'acum': W.acum = v==='1'; S.pop = null; S.focoPill = 'suma'; break;
    case 'nombreauto': W.nombreMan = false; W.nombre = ''; S.pop = null; S.focoPill = 'nombre'; break;
    /* ---- los arreglos de los avisos ---- */
    case 'excl': W.excl = [...W.excl,'jean']; break;
    case 'encajar': encajar(W); W.fechasMan = true; break;
    case 'fechasCamp': fechasDeCampana(W); break;
    case 'poner': W.precio = +v; W.precioMan = true; break;
    /* ---- guardar ---- */
    case 'cfgborrador': case 'cfgactivar': { if(!S.cfg || !listo(W)) break;
      const activa = a==='cfgactivar' && ROLES[S.rol].act, r = guardarRegla(W,!activa);
      avisar(activa ? `Activada dentro de «${r.cn}»: «${r.n}». ${r.c.desde>HOY?'Empieza el '+fechaTxt(r.c.desde):'Ya rige'}.` : `Guardada como borrador dentro de «${r.cn}»: «${r.n}». ${ROLES[S.rol].act?'Actívala cuando quieras.':'Un líder tiene que activarla.'}`); break; }
    case 'activar': { if(!ROLES[S.rol].act) break; const c = CAMP.find(x=>x.id===v); c.borrador = false; S.recien = v; avisar(`Activada: «${c.n}». ${c.desde>HOY?'Empieza el '+fechaTxt(c.desde):'Ya rige'}.`); break; }
    case 'editar': { const c = CAMP.find(x=>x.id===v); if(!c) break;
      S.W = Object.assign(nuevoW(), JSON.parse(JSON.stringify(c)), {editId:c.id, camp:S.cfg, sel:c.tipo, nombre:c.n, nombreMan:c.n!==defNombre(c)}); S.pop = null; S.avOk = {}; S.mScroll = true; break; }
    case 'cfgnueva': { const id = S.cfg; S.W = nuevoW(); S.W.camp = id; selTipo(S.W,'pct'); fechasDeCampana(S.W); S.pop = null; S.mScroll = true; break; }
    case 'cfgcambios': { const c = CAMP.find(x=>x.id===W.editId); if(!c || !listo(W)) break;
      const antes = `${TIPOS[c.tipo].da(c)} · ${fechaTxt(c.desde)} – ${fechaTxt(c.hasta)}`;
      Object.keys(base({})).filter(x=>!['hist','vendidas','borrador','camp'].includes(x)).forEach(x=>{ c[x] = Array.isArray(W[x]) ? [...W[x]] : W[x]; });
      c.n = W.nombreMan && W.nombre.trim() ? W.nombre.trim() : defNombre(W); c.hist = [...c.hist, `${antes}, hasta el ${fechaTxt(HOY)}`]; c.legado = false;
      S.recien = c.id; S.cfg = null; S.pop = null;
      avisar(`Cambios guardados en «${c.n}»: valen desde ahora; lo ya vendido no cambia y queda en el historial.`); break; }
  }
  render();
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]');
  /* Un toque fuera del editor lo cierra (y, si cayó en otra cosa, esa cosa hace lo suyo en el mismo toque). */
  if(S.pop && !e.target.closest('.pop') && !(b && b.dataset.a==='pill')){ S.pop = null; if(!b || b.classList.contains('velo-fondo')){ S.anim = false; render(); return; } }
  if(!b) return;
  act(b.dataset.a, b.dataset.v, b);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(S.pop){ S.focoPill = S.pop; S.pop = null; S.anim = false; render(); }
  else if(S.cfg){ S.anim = false; act('cfgcerrar'); }
});
document.addEventListener('change', e=>{
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  const W = S.W;
  if(f==='nombre'){ const t = e.target.value.trim(); W.nombre = t; W.nombreMan = !!t && t!==defNombre(W); renderFicha(); return; }
  if(f==='desde'||f==='hasta'){ if(!e.target.value) return; W[f] = e.target.value; W.fechasMan = true; renderFicha(); }
});
window.addEventListener('resize', posPop);
document.addEventListener('scroll', posPop, true);
