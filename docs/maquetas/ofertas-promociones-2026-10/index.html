<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insignias · ofertas y promociones · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · Ofertas y promociones dentro de la Configuración de una campaña, en Catálogo ▸ Insignias (2026-10-23)
   Una sola pieza, la regla de precio, dentro de una campaña de Insignias: a qué prendas y dónde + qué reciben + qué tiene que hacer el cliente (opcional) + cuándo.
   Sin condición = OFERTA (baja el precio). Con condición = PROMOCIÓN (un beneficio a cambio de algo).
   Tokens = apps/web/app/globals.css (ADR-0169), claro y oscuro. Hoy simulado = 23 oct 2026. Los nombres, las fechas y las prendas marcadas de las campañas salen de producción (solo lectura, 2026-10-23); las cifras de ventas y todas las ofertas, salvo el −10 % de Aniversario, son INVENTADAS.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);
--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--oscuro:#171614;--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t10:rgba(245,240,232,.1);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.m{width:20px;height:20px}svg.l{width:24px;height:24px}
.serif{font-family:'EB Garamond',serif;font-weight:500}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
@keyframes sube{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sale{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- barra de la maqueta ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk .go{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(245,240,232,.35);font-size:12.5px;color:#f5f0e8}
.spk .go:hover{background:rgba(245,240,232,.12)}
.paso{background:var(--papel);border-bottom:1px solid var(--sand);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center}
.paso button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid var(--sand);background:var(--crema);font-size:12.5px;color:var(--t80)}
.paso button b{width:20px;height:20px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:11px;font-weight:700}
.paso button.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.paso button.on b{background:var(--crema);color:var(--tinta)}
.escena{padding:18px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ley{max-width:1180px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t80)}.ley b{font-weight:600}
.ley .ej{display:inline-block;margin:2px 0 0 6px;padding:1px 8px;border-radius:999px;background:var(--hueso);font-size:11px;color:var(--taupe);font-weight:600}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.marco,.sx>.tel{margin:0 auto}
/* ---- marcos ---- */
.marco{container-type:inline-size;flex:none;position:relative;overflow:hidden;background:var(--crema);box-shadow:0 30px 60px -30px var(--sombra)}
.marco.desk{width:1180px;height:780px;border-radius:14px;border:1px solid var(--t30)}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px var(--sombra);flex:none}
.marco.cel{width:375px;height:796px;border-radius:39px}
.pant{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
.pant:not(.anim) *{animation:none!important}
.erp.caja{display:block;height:100%}
.meta-b .bar i,.prog i{transition:width .4s var(--ease)}
/* ---- piezas ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:background .2s,transform .2s,color .2s}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.n{font-size:13.5px;letter-spacing:0;text-transform:none;height:38px}
.btn.chico{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px;letter-spacing:0;text-transform:none}
.btn.ancho{width:100%}
.volver{width:40px;height:40px;border-radius:50%;border:1px solid var(--t30);display:grid;place-items:center;flex:none}.volver:hover{background:var(--hueso)}.volver.oculto{visibility:hidden}
.enl{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe);font-size:13px}.enl:hover{color:var(--rojo-p)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.nodot::before{display:none}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.r{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 12%,transparent)}.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.chip.t{background:var(--tinta);color:var(--crema)}
.pil{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;font-weight:500;transition:background .2s}
.pil:hover{background:var(--hueso)}.pil.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.pil .cn{font-size:11px;opacity:.7}
.nota{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80);display:flex;gap:9px;align-items:flex-start}
.nota .ic{margin-top:2px;color:var(--taupe)}
.nota.am{background:color-mix(in srgb,var(--ambar) 13%,transparent)}.nota.ok{background:color-mix(in srgb,var(--verde) 12%,transparent)}
.foto{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:22px;color:rgba(26,26,24,.55)}
.lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--sombra);animation:sale .3s var(--ease) both}
/* ---- ERP: lateral + cabecera ---- */
.erp{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%;background:var(--crema)}
.lat{position:sticky;top:0;align-self:start;height:780px;border-right:1px solid var(--sand);background:var(--papel);padding:16px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.lat .logo{font-weight:700;letter-spacing:.16em;color:var(--rojo);font-size:17px;padding:2px 10px 12px}
.lat .g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--t50);padding:12px 10px 4px}
.lat a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;color:var(--t80);cursor:default}
.lat a.sub{padding-left:22px}.lat a.on{background:var(--tinta);color:var(--crema);font-weight:600}
.lat a .nuevo{margin-left:auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--hueso);color:var(--tinta)}
.lat a.on .nuevo{background:var(--crema);color:var(--tinta)}
.mtop{display:none}
.cont{min-width:0}
.enc{display:flex;gap:14px 24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:22px 28px 0}
.enc .sede{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--taupe);display:flex;align-items:center;gap:12px}
.enc .sede::after{content:"";flex:1;height:1px;background:var(--taupe);opacity:.4;min-width:40px}
.enc .iz{flex:1;min-width:260px}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:6px}
.enc p{color:var(--t65);margin-top:4px;max-width:600px}
.enc .acc{display:flex;gap:8px;align-items:center}
.cuerpo{padding:18px 28px 44px}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cifra{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:14px 16px}
.cifra small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.cifra b{display:block;font-family:'EB Garamond',serif;font-size:34px;line-height:1.1;font-weight:500;margin-top:4px}.cifra span{font-size:12.5px;color:var(--t65)}
.tarj{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.tarj .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--sand)}
.tarj .cab .gr{margin-left:auto;display:inline-flex;border:1px solid var(--sand);border-radius:10px;background:var(--hueso);padding:3px}
.tarj .cab .gr button{height:28px;padding:0 12px;border-radius:7px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t65);display:inline-flex;gap:6px;align-items:center}
.tarj .cab .gr button.on{background:var(--tinta);color:var(--crema)}
.sugs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.sug{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;padding:14px 16px;border:1px solid var(--sand);border-radius:14px;background:var(--papel)}
.sug .ico{width:40px;height:40px;border-radius:12px;background:var(--hueso);display:grid;place-items:center;color:var(--taupe);grid-row:span 3}
.sug b{font-size:14px;font-weight:600}.sug small{color:var(--t65);font-size:12.5px;line-height:1.4}.sug .btn{justify-self:start;margin-top:6px}
.sug .lbl{color:var(--taupe)}
.fila{display:grid;grid-template-columns:minmax(0,2.3fr) 104px minmax(0,1.4fr) 138px 132px 108px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--sand);transition:background .2s;animation:entra .45s var(--ease) both}
.fila:last-child{border-bottom:0}.fila:hover{background:var(--crema)}.fila.recien{background:color-mix(in srgb,var(--verde) 9%,transparent)}
.fila.enc-t{background:var(--crema);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--t65);animation:none;padding-top:9px;padding-bottom:9px}
.fila .nm{min-width:0}.fila .nm b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fila small{display:block;color:var(--t65);font-size:12px;line-height:1.35}
.fila .da{font-weight:600;font-size:14px}
.fila .ap{display:flex;gap:4px;flex-wrap:wrap}.sedecha{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--hueso)}
.prog{display:block;height:4px;border-radius:999px;background:var(--hueso);margin-top:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--tinta);border-radius:inherit;transform-origin:left;animation:llena .9s var(--ease) .1s both}
.pie-t{padding:12px 16px;border-top:1px solid var(--sand);font-size:12.5px;color:var(--t65);display:flex;gap:8px;align-items:center}
/* calendario */
.gantt{padding:6px 16px 14px;overflow-x:auto}
.gm{display:grid;grid-template-columns:200px minmax(520px,1fr);align-items:center}
.gm .meses{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--t65);padding:8px 0 26px}
.gm .meses span{padding-left:6px;border-left:1px solid var(--sand)}
.gm .et{font-size:13px;font-weight:600;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;height:46px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--sand)}.gm .et small{font-weight:400;color:var(--t65);font-size:11.5px}
.gm .pista{position:relative;height:46px;background-image:linear-gradient(to right,var(--sand) 1px,transparent 1px);background-size:calc(100%/12) 100%;border-bottom:1px solid var(--sand)}
.barra-g{position:absolute;top:13px;height:20px;border-radius:7px;background:var(--tinta);color:var(--crema);font-size:10.5px;font-weight:700;padding:0 7px;line-height:20px;overflow:hidden;white-space:nowrap;animation:llena .7s var(--ease) both;transform-origin:left}
.barra-g.p{background:var(--pizarra)}.barra-g.prog-e{opacity:.62;outline:1px dashed currentColor;outline-offset:-1px}.barra-g.fin{opacity:.35}
.hoy-l{position:absolute;top:-2px;bottom:-1px;width:0;border-left:2px dashed var(--tinta);z-index:2}
.gm .hoy-t{position:absolute;top:30px;transform:translateX(-50%);z-index:3;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--tinta);color:var(--crema);padding:1px 6px;border-radius:5px}
/* ---- asistente ---- */
.wz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 28px 44px;align-items:start}
.wz-pasos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wz-p{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 6px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;color:var(--t80)}
.wz-p b{width:22px;height:22px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:11px}
.wz-p.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.wz-p.on b{background:var(--crema);color:var(--tinta)}
.wz-p.ok b{background:var(--verde);color:var(--crema)}
.pc{background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:20px 22px;animation:sube .35s var(--ease) both}
.pc h2{font-family:'EB Garamond',serif;font-weight:500;font-size:27px;line-height:1.15}
.pc .baj{color:var(--taupe);font-size:13.5px;margin-top:3px}
.metas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.meta{text-align:left;display:grid;grid-template-columns:40px 1fr;gap:3px 12px;padding:14px;border:1px solid var(--sand);border-radius:14px;background:var(--crema);transition:background .2s,border-color .2s}
.meta:hover{background:var(--hueso)}.meta.on{background:var(--papel);border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.meta .ico{width:40px;height:40px;border-radius:12px;background:var(--hueso);display:grid;place-items:center;color:var(--taupe);grid-row:span 3}
.meta.on .ico{background:var(--tinta);color:var(--crema)}
.meta b{font-size:14.5px;font-weight:600;line-height:1.25}.meta small{color:var(--t65);font-size:12.5px;line-height:1.35}.meta .ej{font-size:12px;color:var(--taupe);font-weight:600}
.casos{margin-top:18px}.casos .lbl{display:block;margin-bottom:8px}.casos .fila-c{display:flex;gap:8px;flex-wrap:wrap}
.casos .pil small{color:var(--t65);font-size:11.5px;font-weight:400}
.grupo{margin-top:20px}.grupo>.tit{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.grupo>.tit b{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--t65)}
.grupo>.tit .sg{font-size:11px;font-weight:600;color:var(--taupe);padding:1px 8px;border-radius:999px;background:var(--hueso)}
.grupo>.tit .hc{font-size:11px;font-weight:700;color:var(--verde)}
.grupo.sigue{border-radius:14px;padding:12px 14px;margin-left:-14px;margin-right:-14px;background:color-mix(in srgb,var(--tinta) 4%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--tinta) 8%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.opc{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 13px;border-radius:12px;border:1px solid var(--sand);background:var(--hueso);font-size:13px;transition:background .2s}
.opc:hover{background:var(--sand)}.opc.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.opc small{font-size:11.5px;opacity:.7}
.pq{display:inline-flex;align-items:center;border:1px solid var(--sand);background:var(--hueso);border-radius:12px;height:48px;overflow:hidden}
.pq button{width:44px;height:100%;display:grid;place-items:center}.pq button:hover{background:var(--sand)}.pq button:disabled{opacity:.3;pointer-events:none}
.pq b{min-width:96px;text-align:center;font-family:'EB Garamond',serif;font-size:26px;font-weight:500}
.campo{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--sand);border-radius:12px;background:var(--hueso);transition:background .2s,border-color .2s}
.campo:focus-within{background:var(--papel);border-color:var(--tinta)}.campo input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14.5px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dosc label{display:block}.dosc label span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-bottom:5px}
.ejs{margin-top:12px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);overflow:hidden}
.ejs div{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--sand);font-size:13px}.ejs div:last-child{border:0}

const alcanceTxt = c => { if(c.cats.includes('all')) return 'Todo el catálogo'; const p = catsDe(c).map(x=>x.etq?`las prendas de «${x.n}»`:x.n); return (p.length<=2 ? p.join(' y ') : p.slice(0,2).join(', ')+` y ${p.length-2} más`) + ((c.nocats||[]).length ? ` (sin ${c.nocats.map(id=>CATS.find(x=>x.id===id).n.toLowerCase()).join(', ')})` : ''); };

/* =========================== cálculos =========================== */
function alcance(s){
  const f = {0:1,60:.5,90:.3,120:.15}[s.dias]||1;
  const cs = catsDe(s), e = campanaDe(s.camp);
  let prendas = Math.round(cs.reduce((t,c)=>t+c.prendas,0)*f), unid = Math.round(cs.reduce((t,c)=>t+c.unid,0)*f);
  /* Una oferta de prendas no llega más allá de las prendas de su campaña: con una categoría elegida, es lo de esa categoría DENTRO de la campaña. */
  if(e && !deCompra(s.tipo)){ prendas = Math.min(prendas,Math.round(e.prendas*f)); unid = Math.min(unid,Math.round(e.unid*f)); }
  return {prendas, unid, f};
}
function costoEst(s){
  const cs = catsDe(s), f = alcance(s).f, sf = s.sedes.length/SEDES.length;
  let t = 0;
  for(const c of cs){
    const u = c.v30*f*sf, p = c.ej.p;
    if(['pct','soles','precio'].includes(s.tipo)) t += u*Math.max(0,p-unitario(s,p));
    else if(s.tipo==='combo') t += (u*.5/s.qty)*(s.qty*p-s.precio);
    else if(s.tipo==='segunda') t += (u*.5/s.nth)*(p*s.pct2/100);
    else if(s.tipo==='nxm') t += (u*.5/s.n)*((s.n-s.m)*p);
    else if(s.tipo==='volumen') t += (u*.5)*(p*s.pct/100);
  }
  if(s.tipo==='look') t = Math.min(...cs.map(c=>c.v30))*.3*sf*Math.max(0,cs.reduce((a,c)=>a+c.ej.p,0)-s.precio);
  if(s.tipo==='monto') t = 40*sf*s.desc;
  if(s.tipo==='montopct') t = 40*sf*(s.pct/100)*(s.min+12);
  if(s.tipo==='club_pct') t = 30*sf*(s.pct/100)*90;
  if(s.tipo==='regalo') t = 35*sf*REG[s.regalo].costo;
  if(s.tipo==='club_cupon') t = 12*(s.pct/100)*140;
  if(s.tipo==='club_puntos') t = 3000*(s.mult-1)*0.05;
  if(s.tipo==='club_privada') t = 0;
  return Math.round(t/10)*10;
}
const defNombre = s => s.tipo==='monto' ? `${sol(s.desc)} menos desde ${sol(s.min)}`
  : s.tipo==='montopct' ? `${s.pct} % menos desde ${sol(s.min)}`
  : s.tipo==='regalo' ? `${REG[s.regalo].t} desde ${sol(s.min)}`
  : s.tipo.startsWith('club') ? `${TIPOS[s.tipo].da(s)} · Club`
  : `${catsTxt(s)} · ${TIPOS[s.tipo].da(s)}`;
function cruces(s){
  if(!esPrecio(s)) return [];
  return CAMP.filter(c=>estadoDe(c)!=='Terminada' && esPrecio(c) && c.desde<=s.hasta && s.desde<=c.hasta &&
    (c.cats.includes('all')||s.cats.includes('all')||c.cats.some(x=>s.cats.includes(x))||(c.camp===s.camp&&(c.cats.some(x=>x.startsWith('e:'))||s.cats.some(x=>x.startsWith('e:'))))) && c.sedes.some(x=>s.sedes.includes(x)));
}
function revisar(s){
  const out = [];
  const fin = D(s.hasta) >= D(s.desde);
  out.push(fin ? {t:'v',x:`Dice cuándo empieza y cuándo termina`,s:`${fechaTxt(s.desde)} al ${fechaTxt(s.hasta)} · ${diasEntre(s.desde,s.hasta)+1} días`} : {t:'a',x:'La fecha de término es anterior a la de inicio'});
  const ec = campanaDe(s.camp);
  if(!ec) out.push({t:'a',x:'Elige la campaña',s:'Toda oferta o promoción vive dentro de una campaña de Insignias'});
  else if(sinFechas(ec)) out.push({t:'a',x:`«${ec.n}» no tiene fechas todavía`,s:'Ponle fechas arriba, en «La campaña»; mientras tanto esta oferta rige solo por las fechas que elijas aquí.'});
  else if(s.desde<ec.desde||s.hasta>ec.hasta) out.push({t:'a',x:`Las fechas se salen de «${ec.n}» (${fechaTxt(ec.desde)} – ${fechaTxt(ec.hasta)})`,s:'Una oferta no puede regir fuera de su campaña. Ajústala o cambia de campaña.',act:'encajar'});
  else out.push({t:'v',x:`Va dentro de «${ec.n}»`,s:`Hereda sus fechas (${fechaTxt(ec.desde)} – ${fechaTxt(ec.hasta)}) y ${ec.prendas?`sus ${ec.prendas} prendas`:'no tiene prendas'}. Si luego cambian las fechas de la campaña, esta oferta conserva las suyas.`});
  if(esPrecio(s)){
    out.push({t:'v',x:`La tienda dirá cuántas unidades quedan (${alcance(s).unid} hoy)`,s:'Sin tope: bastan las fechas. Indecopi pide decir cuántas hay, y el sistema da la cifra.'});
    if(s.cats.length && alcance(s).prendas===0) out.push({t:'a',x:'Todavía no alcanza ninguna prenda',s:`${catsDe(s).filter(c=>c.etq&&c.prendas===0).map(c=>`«${c.n}»`).join(', ')||'La campaña'} no tiene prendas marcadas. Márcalas en «Prendas» o suma categorías en «La campaña».`});
    if(s.tipo==='combo'){
      const sin = catsDe(s).filter(c=>s.precio>=s.qty*c.ej.p);
      if(sin.length) out.push({t:'a',x:`El paquete no es una rebaja en ${sin.map(c=>c.n).join(', ')}`,s:`${s.qty} cuestan ${fmt(s.qty*sin[0].ej.p)} por separado y el paquete ${fmt(s.precio)}. Un precio de paquete que no baja el precio es el engaño que Indecopi sanciona.`});
    }
    if(s.tipo==='look'){
      const suma = s.partes.reduce((t,id)=>t+CATS.find(c=>c.id===id).ej.p,0);
      if(s.partes.length<2) out.push({t:'a',x:'Un conjunto necesita al menos 2 prendas distintas',s:'Elige cuáles lo forman.'});
      else if(s.precio>=suma) out.push({t:'a',x:'El conjunto no es una rebaja',s:`Por separado cuestan ${fmt(suma)} y el conjunto ${fmt(s.precio)}. Un precio de conjunto que no baja el precio es el engaño que Indecopi sanciona.`});
    }
    const jean = (s.cats.includes('all')||s.cats.includes('pantalones')) && !s.excl.includes('jean');
    if(jean) out.push({t:'a',x:'Jean Palazzo subió de S/ 119 a S/ 129 hace 6 días',s:'Si la rebajas ahora, el «antes» no es un precio normal y Indecopi puede tomarlo como engaño. Cuántos días de precio estable hacen falta lo confirma un abogado.',act:'excl'});
    else if(s.excl.includes('jean')) out.push({t:'v',x:'Jean Palazzo quedó fuera de la oferta',s:'Su precio subió hace poco; puedes sumarla más adelante'});
    else out.push({t:'v',x:'El precio «antes» fue el precio normal los últimos 30 días',s:'Sale del historial de cambios de precio de cada prenda'});
    if(s.tipo==='precio'){
      const sin = catsDe(s).filter(c=>s.precio>=c.ej.p);
      if(sin.length) out.push({t:'a',x:`A ${fmt(s.precio)} no es una rebaja en ${sin.map(c=>c.n).join(', ')}`,s:`Su precio de lista es ${fmt(sin[0].ej.p)}. Un «precio especial» que no baja el precio es el engaño que Indecopi sanciona.`});
    }
    if(['pct','soles','precio'].includes(s.tipo)){
      const bajo = catsDe(s).filter(c=>unitario(s,c.ej.p)<c.ej.c);
      out.push(bajo.length ? {t:'a',x:`Por debajo del costo: ${bajo.map(c=>c.n).join(', ')}`,s:'No se bloquea, pero quedas en pérdida por prenda: pásale al contador cuánto se desvaloriza el stock.'} : {t:'v',x:'Ninguna prenda queda por debajo de su costo'});
    }
    const cr = cruces(s);
    if(cr.length) out.push({t:'i',x:`Se cruza con «${cr[0].n}»${cr.length>1?` y ${cr.length-1} más`:''}`,s:'Si una prenda cae en dos ofertas, gana la que deja al cliente con el mejor precio: una sola por prenda. No se suman.'});
  } else if(s.tipo==='monto'||s.tipo==='montopct'){
    out.push({t:'i',x:'El monto se cuenta sobre lo que el cliente paga',s:'Después de las demás ofertas: una prenda ya rebajada cuenta con su precio rebajado'});
    out.push({t:'i',x:'Si devuelve prendas y baja del monto, la oferta se pierde',s:'Lo que se queda vuelve a su precio y esa diferencia se descuenta de lo que se le devuelve (decidido).'});
  } else if(s.tipo==='regalo'){
    out.push({t:'i',x:s.regalo==='basta'?'El arreglo lo hace el taller':'El regalo sale del stock de empaque',s:s.regalo==='basta'?'Costo real para CAYLA: ≈ S/ 6, no el precio de lista del servicio':'Una línea en S/ 0 solo vale en empaque'});
    out.push({t:'a',x:'Un regalo es una transferencia gratuita',s:'Pregúntale al contador cómo se declara en la boleta antes de activarlo.'});
  } else {
    out.push({t:'i',x:'Solo se aplica a quien se identifica como miembro',s:'Sin DNI, la caja no puede darlo'});
  }
  if(s.claure) out.push({t:'a',x:'Entran las prendas de Claurè',s:'Lo elegiste a propósito. Es otra empresa: confirma con su dueña que acepta el descuento.'});
  out.push({t:'i',x:s.acum?'Se suma con el ticket y el Club, en orden':'No acumulable',s:s.acum?'Primero la prenda, luego el ticket y al final el cupón del Club.':'Si una prenda lleva esta oferta, no recibe las demás.'});
  const despues = [];
  if(['cantidad','monto'].includes(TIPOS[s.tipo].cond)) despues.push('Devolución: la oferta se pierde; lo que se queda vuelve a su precio y se descuenta del reintegro.');
  despues.push('Cambio de talla o color: la prenda nueva va a precio normal.','Apartado: se cobra el precio del día en que retira.');
  if(esPrecio(s)) despues.push('Etiquetas de papel: el sistema avisa reimprimirlas la víspera de que empiece y de que termine.');
  out.push({t:'i',x:'Lo que pasa después de vender',s:despues.join(' ')});
  return out;
}
function ticket(){
  const q = S.cart.polos, g = Math.floor(q/2);
  const casaca = rebaja(219,30), polosP = r2(g*59.9+(q%2)*39.9), polosL = r2(q*39.9), falda = S.cart.falda?99:0;
  const sub = r2(casaca+polosP+falda), monto = sub>=300?30:0, total = r2(sub-monto);
  const lista = r2(219+polosL+falda);
  return {q,casaca,polosP,polosL,falda,sub,monto,total,lista,ahorro:r2(lista-total)};
}

const fechaLarga = s => { const d = D(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const TXT_VISTA = {

/* Las pilas, en el orden en que se leen: rigen hoy (la que termina antes, arriba), lo que viene, guardadas (sin fechas y las que ya pasaron) y desactivadas. */
function pilas(v){
  const todas = deVista(v), act = todas.filter(e=>e.activo), apag = todas.filter(e=>!e.activo).sort(porNombre);
  let p;
  if(v==='campanas'){
    const T = t => act.filter(e=>tramo(e)===t);
    p = [{c:'ahora',t:'Rigen hoy',tono:'viva',p:T('ahora').sort((a,b)=>a.hasta.localeCompare(b.hasta))},
         {c:'viene',t:'Lo que viene',tono:'viene',p:T('proximas').sort((a,b)=>a.desde.localeCompare(b.desde))},
         {c:'guardadas',t:'Guardadas',tono:'guardada',p:[...T('sin_fechas').sort(porNombre),...T('pasaron').sort((a,b)=>a.desde.localeCompare(b.desde))]},
         {c:'apagadas',t:'Desactivadas',tono:'apagada',p:apag}];

  }
  return p.filter(x=>x.p.length);

function marca(e){

function bajada(e){
  const t = tramo(e);
  if(t==='ahora') return `hasta el ${fechaLarga(e.hasta)}`;
  if(t==='proximas') return `empieza el ${fechaLarga(e.desde)}`;
  if(t==='pasaron') return `${fechaTxt(e.desde)} – ${fechaTxt(e.hasta)}`;
  if(e.estilo==='campana') return 'ponle cuándo rige';
  return e.desc!==null ? `${e.desc} % de descuento` : 'sin fechas: rige siempre';
}
/* El chip del pase abierto (chipDeTarjeta): una vigente sin prendas no cambia ningún precio, y lo dice. */
function chipsPase(e){
  const t = tramo(e), alc = e.modelos + e.catIds.length;
  if(t==='sin_fechas') return [];
  if(t==='ahora') return alc===0 ? [['Vigente',''],['Sin prendas','a']] : [['Vigente','v']];
  if(t==='proximas'){ const n = diasEntre(HOY,e.desde), cu = n===1 ? 'Mañana' : `En ${n} días`; return alc===0 ? [[cu,''],['Sin preparar','a']] : [[cu,'p']]; }
  return [[`Pasó el ${fechaTxt(e.hasta)}`,'']];
}
const puedeEditar = e => e.estilo==='campana' ? ROLES[S.rol].camp : (ROLES[S.rol].ins && ROLES[S.rol].vistas===4);

function accionesPase(e,conGuia){
  const t = tramo(e), vivas = vivasDe(e), P = ROLES[S.rol];
  if(!puedeEditar(e)) return `<p style="font-size:12px;color:var(--t65)">Solo lo cambia quien tiene el módulo ${e.estilo==='campana'?'Campañas o Insignias':'Insignias'}.</p>`;
  if(!e.activo) return `<button class="btn n sutil chico" data-a="reactivar" data-v="${e.id}">${ic('undo','s')} Reactivar</button>`;
  const esC = e.estilo==='campana', pasada = t==='pasaron';
  const imprime = esC ? vivas.some(esPrecio) && t!=='proximas' : e.desc!==null && t!=='proximas';
  return `<button class="btn n sutil chico" data-a="prendas">Prendas</button>`
    + (pasada ? `<button class="btn n sutil chico" data-a="repcamp" data-v="${e.id}" title="Repetir en 2027: abre la campaña con las fechas de 2027">Repetir</button>` : `<button class="btn n sutil chico" data-a="${esC?'cfgabrir':'simple'}" data-v="${e.id}" ${conGuia?'data-guia="configurar"':''} title="${esC?'Sus fechas, sus prendas y sus ofertas y promociones':'Su descuento, sus fechas y sus categorías'}">Configurar</button>`)
    + (imprime ? `<button class="btn n sec chico" data-a="imprimir">${ic('tag','s')} Etiquetas de precio</button>` : '')
    + (esC && pasada && reglasDe(e.id).length ? `<button class="btn n sec chico" data-a="vista" data-v="resultado">¿Valió la pena?</button>` : '')
    + (esC && P.fin && vivas.length ? `<button class="btn n sec chico" data-a="webdiseno">Diseño web ${ic('right','s')}</button>` : '')
    + `<button class="btn n peligro chico" style="margin-left:auto" data-a="desactivar" data-v="${e.id}">Desactivar</button>`;
}

function pase(e,tono,i,abierto){
  const m = marca(e), t = tramo(e), vivas = vivasDe(e), chips = chipsPase(e), borr = vivasDe(e).filter(c=>c.borrador).length;
  const dia = t==='ahora' ? diasEntre(e.desde,HOY)+1 : 0, tot = t==='ahora' ? diasEntre(e.desde,e.hasta)+1 : 0;
  const tercera = e.estilo==='campana' ? `<div><strong>${vivas.length||'—'}</strong>ofertas y promociones</div>` : `<div><strong>${e.desc!==null?e.desc+' %':'—'}</strong>descuento</div>`;
  const grande = (e.activo && (t==='ahora'||t==='proximas') && e.desde && e.hasta) ? `<div class="sl-grande" style="--i:1"><b>${t==='ahora'?diasEntre(HOY,e.hasta):diasEntre(HOY,e.desde)}</b><span>${t==='ahora'?(diasEntre(HOY,e.hasta)===1?'día para que termine':'días para que termine'):'días para que empiece'}</span></div>` : '';
  return `<article class="sl-pase ${abierto?'sl-abierto':''}" data-id="${e.id}" data-tono="${tono}" data-sl-grupo="${e.estilo}" style="--i:${i}">
    <button type="button" class="sl-cab" aria-expanded="${abierto}" data-a="pase" data-v="${e.id}">${sello(e,i)}<span class="min" style="min-width:0"><span class="sl-cab-nombre">${e.n}</span><span class="sl-cab-bajada">${bajada(e)}</span></span><span class="sl-cab-marca">${m.c!==null?m.c:''}${m.t?`<small>${m.t}</small>`:''}</span></button>
    <div class="sl-cuerpo" ${abierto?'':'inert'}><div><div class="sl-perfo"></div><div class="sl-dentro">
      ${(e.activo&&(chips.length||borr))?`<div class="chips-r" style="--i:0">${chips.map(([x,c])=>`<span class="chip ${c}">${x}</span>`).join('')}${borr?`<span class="chip a" title="Las guardó alguien sin permiso para activarlas">${plural(borr,'borrador espera','borradores esperan')} a un líder</span>`:''}</div>`:''}
      ${grande}
      ${t==='ahora'&&e.activo?`<div style="--i:2"><span class="sl-barra"><i style="width:${Math.round(dia/tot*100)}%"></i></span><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--t65)" class="num"><span>${fechaTxt(e.desde)}</span><span>hoy, día ${dia} de ${tot}</span><span>${fechaTxt(e.hasta)}</span></div></div>`:''}
      <div class="sl-datos" style="--i:3"><div><strong>${e.v30||'—'}</strong>vendidas en 30 días</div><div><strong>${e.unid||'—'}</strong>en las tiendas</div>${tercera}</div>
      <div class="sl-acc" style="--i:4">${accionesPase(e,abierto)}</div>
    </div></div></div></article>`;
}

/* Las prendas del pase abierto (su vitrina): modelo y color; sin foto, la baldosa de su color. */
const POOL = [['Blusa Carlita','#ece6dc','B'],['Vestido Lucía','#b9c9a8','V'],['Jean Palazzo','#a9bfd6','J'],['Polo Básico','#d8c3a5','P'],['Casaca Aurora','#4a4744','C'],['Falda Midi Sara','#e3c1b8','F'],['Blusa Emma','#c9b6d6','B'],['Vestido Alba','#e8c9a0','V'],['Polo Rayas','#a8bcb0','P'],['Casaca Luna','#6b5b52','C'],['Falda Plisada','#c9a9a0','F'],['Blusa Lazo','#f0d9d0','B']];
function modelosDe(e){
  const off = [...e.id].reduce((a,c)=>a+c.charCodeAt(0),0) % POOL.length;
  return Array.from({length:e.modelos},(_,k)=>{ const [nm,col,l] = POOL[(off+k)%POOL.length]; return {nm:k>=POOL.length?`${nm} ${Math.floor(k/POOL.length)+1}`:nm,col,l,u:(k*7+3)%11+1}; });
}
/* Dos filas como mucho; si sobran prendas, la última casilla dice cuántas (Felipe, 2026-10-22). */
const lookbookVisible = (total,cols,filas=2) => { const c = Math.max(1,cols)*filas; return total<=c ? {visibles:total,resto:0} : {visibles:c-1,resto:total-(c-1)}; };

function fraseDe(e){
  const t = tramo(e), n = e.modelos, cats = e.catIds.map(id=>CATS.find(c=>c.id===id).n), toda = cats.length ? ` y toda ${cats.join(', ')}` : '', hay = n>0||cats.length>0, vivas = vivasDe(e);
  if(e.estilo!=='campana') return hay ? `${plural(n,'prenda','prendas')}${toda} · ${plural(e.unid,'unidad','unidades')} en las tiendas.` : (e.desc!==null ? `Un ${e.desc} % que todavía no llega a ninguna prenda.` : 'Ninguna prenda la lleva todavía.');
  const of = vivas.length ? `con ${plural(vivas.length,'oferta o promoción','ofertas y promociones')}` : 'a su precio de siempre';
  if(t==='ahora') return hay ? `${plural(n,'prenda','prendas')}${toda}, ${of}.` : (vivas.length ? `Tiene ${plural(vivas.length,'oferta o promoción','ofertas y promociones')}, pero todavía no llega a ninguna prenda.` : 'Rige hoy, pero todavía no está en ninguna prenda.');
  if(t==='proximas') return hay ? `${plural(n,'prenda lista','prendas listas')}${toda}, ${of}.` : 'Todavía sin prendas: prepárala antes de que empiece.';
  if(t==='pasaron') return `Pasó el ${fechaTxt(e.hasta)}. «Repetir» la vuelve a armar con las fechas del próximo año.`;
  return 'Todavía sin fechas: ponle cuándo rige en «Configurar».';
}
/* «Lo que ya tiene»: fechas y prendas son lo que la hace funcionar; las ofertas y promociones son opcionales (una campaña puede ser solo de vitrina). */
function loQueTiene(e){
  const cats = e.catIds.map(id=>CATS.find(c=>c.id===id).n), llega = e.modelos>0||cats.length>0, vivas = vivasDe(e), borr = vivas.filter(c=>c.borrador).length;
  return [
    {k:'fechas',n:'Fechas',hecho:!sinFechas(e),op:false,d:sinFechas(e)?'sin fechas':`${fechaTxt(e.desde)} – ${fechaTxt(e.hasta)}`},
    {k:'prendas',n:'Prendas',hecho:llega,op:false,d:llega?[e.modelos?plural(e.modelos,'prenda','prendas'):'',cats.length?`toda ${cats.join(', ')}`:''].filter(Boolean).join(' + '):'ninguna todavía'},
    {k:'ofertas',n:'Ofertas y promociones',hecho:vivas.length>0,op:true,d:vivas.length?`${plural(vivas.length,'registrada','registradas')}${borr?` · ${plural(borr,'borrador','borradores')}`:''}`:'ninguna todavía',sub:vivas}
  ];
}
function detalle(e){
  const t = tramo(e), tiles = modelosDe(e), cats = e.catIds, esC = e.estilo==='campana';
  const kicker = !e.activo ? 'Desactivada' : t==='ahora' ? `Rige hoy · hasta el ${fechaLarga(e.hasta)}` : t==='proximas' ? `Empieza el ${fechaLarga(e.desde)}` : t==='pasaron' ? `Pasó el ${fechaTxt(e.hasta)}` : esC ? 'Sin fechas' : TXT_VISTA[VISTA_DE(e)].n;
  const editable = puedeEditar(e) && e.activo;
  const cup = lookbookVisible(tiles.length,S.cols), vis = tiles.slice(0,cup.visibles);
  const claro = c => ['#4a4744','#6b5b52'].includes(c) ? 'rgba(245,240,232,.7)' : 'rgba(26,26,24,.5)';
  const look = tiles.length ? `<div class="sl-lookbook" style="--i:3;--sl-n:${tiles.length}" ${tiles.length<S.cols?'data-pocas':''}>
      ${vis.map((m,j)=>`<div class="sl-prenda" style="--j:${j}"><div class="sl-prenda-foto"><div class="sl-tile serif" style="background:${m.col};color:${claro(m.col)};font-size:30px">${m.l}</div></div><span class="sl-prenda-nombre" title="${m.nm}">${m.nm}</span><span class="sl-prenda-dato">${m.u} u</span></div>`).join('')}
      ${cup.resto>0?`<${editable?'button type="button" data-a="prendas"':'div'} class="sl-mas" style="--j:${vis.length}"><span><b>+${cup.resto}</b>prendas más</span></${editable?'button':'div'}>`:''}</div>`
    : (!cats.length ? `<div class="sl-vacio" style="--i:3">${ic('tag')}<b>${esC?'Esta campaña todavía no tiene prendas':'Ninguna prenda lleva esta insignia'}</b><p>${esC&&t==='ahora'&&vivasDe(e).length?`Rige con ${plural(vivasDe(e).length,'oferta o promoción','ofertas y promociones')}, pero mientras no tenga prendas no rebaja nada en caja ni en la web.`:'Márcalas en «Prendas» o elige sus categorías en «Configurar».'}</p>${editable?`<button class="btn" data-a="prendas">${ic('plus','s')} Elegir prendas</button>`:''}</div>` : '');
  const listo = esC && t!=='pasaron' ? `<div class="sl-listo" style="--i:4"><div class="lbl" style="padding:14px 0 6px;font-size:10px">Lo que ya tiene</div>${loQueTiene(e).map((x,i)=>`<div class="sl-listo-fila" data-estado="${x.hecho?'hecho':x.op?'opcional':'falta'}" style="--i:${i}"><span class="sl-listo-marca" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="${x.hecho?'M6 12.5l4 4L18 8.5':x.op?'M8 12h8':'M12 7v6M12 16.5v.1'}" stroke-width="2.2"/></svg></span><span>${x.n}</span><span class="sl-listo-detalle">${x.d}</span></div>${x.sub&&x.sub.length?x.sub.map(c=>`<div class="sl-listo-fila" style="padding:7px 0 7px 34px;font-size:12.5px;border-bottom:1px dashed var(--sand)"><span>${chipFam(fam(c))} ${c.n}</span><span class="sl-listo-detalle">${c.borrador?'borrador · ':''}${fechaTxt(c.desde)} – ${fechaTxt(c.hasta)}</span></div>`).join(''):''}`).join('')}</div>` : '';
  return `<div class="sl-kick" style="--i:0">${kicker}</div>
    <h2 class="sl-titular" style="margin-top:12px;--i:1"><span>${e.n}</span></h2>
    <p class="sl-frase" style="margin-top:10px;--i:2">${fraseDe(e)}</p>
    <div style="margin-top:24px">${look}</div>
    <div style="margin-top:24px">${listo}</div>`;
}

function vInsignias(){
  const P = ROLES[S.rol];
  if(!P.ins) return vSinAcceso('Insignias','Insignias o Campañas');
  const vistas = Object.keys(TXT_VISTA).slice(0, P.vistas);
  if(!vistas.includes(S.vi)) S.vi = vistas[0];
  const v = S.vi, ps = pilas(v), todas = ps.flatMap(x=>x.p);
  const abierto = todas.find(e=>e.id===S.abierto[v]) || todas[0] || null;
  const puedeCrear = v==='campanas' ? P.camp : P.vistas===4;
  const nuevo = v==='campanas' ? 'Nueva campaña' : 'Nueva insignia';
  const acc = `${v==='campanas'&&P.fin?`<button class="btn sec">Cómo se ven en la web ${ic('right','s')}</button>`:''}${puedeCrear?`<button class="btn" data-a="nuevacamp" data-v="${v}">${ic('plus','s')} ${nuevo}</button>`:''}`;
  const pest = vistas.length>1 ? `<div class="pest" role="tablist" aria-label="Qué insignias ver">${vistas.map(k=>`<button role="tab" aria-selected="${k===v}" class="${k===v?'on':''}" data-a="vi" data-v="${k}">${ic(TXT_VISTA[k].ic,'s')} ${TXT_VISTA[k].n} <span class="gl">${deVista(k).filter(e=>e.activo).length}</span></button>`).join('')}</div>` : '';
  const enLinea = S.dev==='celular';
  let i = 0;
  const pila = x => `<section class="sl-pila" aria-label="${x.t}"><h3 class="sl-pila-titulo">${x.t}<span class="gl">${x.p.length}</span></h3>${x.p.map(e=>{ const ab = abierto && abierto.id===e.id; return pase(e,x.tono,i++,ab) + (enLinea && ab ? `<div class="sl-detalle sl-detalle-en-linea">${detalle(e)}</div>` : ''); }).join('')}</section>`;
  const cuerpo = ps.length ? `<div class="sl-marco" key="${v}"><div class="sl-billetera"><div>${ps.map(pila).join('')}</div>${abierto&&!enLinea?`<aside class="sl-detalle" aria-live="polite">${detalle(abierto)}</aside>`:''}</div></div>`
    : `<div class="sl-vacio">${ic('tag')}<b>Todavía no hay ${v==='campanas'?'campañas':'insignias de '+TXT_VISTA[v].n}</b><p>${v==='campanas'?'Crea la primera con su nombre y después ponle sus fechas, sus prendas y sus ofertas y promociones.':'Crea uno y márcalo en sus prendas.'}</p></div>`;
  return `<div class="erp">${lateral('Insignias')}<div class="cont">${enc('Insignias','Lo que se le marca a una prenda. Primero las campañas; con las pestañas, las demás insignias.',acc,false,'Catálogo')}
  <div class="cuerpo">${pest}<p style="margin:${pest?'16px':'0'} 0 18px;max-width:60ch;font-family:'EB Garamond',serif;font-style:italic;font-size:19px;line-height:1.3;color:var(--t65)">${TXT_VISTA[v].frase}</p>${cuerpo}</div></div></div>`;
}

/* Liquidación: la fila propia del menú (módulo «liquidacion»), como hoy. Dos secciones de la misma pantalla: las prendas del catálogo liquidadas por color y talla
   (otra sesión: maqueta liquidacion-catalogo-2026-10) y las piezas sueltas fuera del inventario (ADR-0379). Ninguna es de una campaña. */
function vLiquidacion(){
  const P = ROLES[S.rol];
  if(!P.liq) return vSinAcceso('Liquidación','Liquidación');
  if(S.det==='etiquetar') return vEtiquetar();
  const t = S.ltab, nC = LIQCAT.filter(x=>x.est!=='Terminada').length, nP = PIEZAS.filter(p=>p.est==='disponible').length;
  const pest = `<div class="pest" role="tablist" aria-label="Secciones de Liquidación"><button role="tab" aria-selected="${t==='catalogo'}" class="${t==='catalogo'?'on':''}" data-a="ltab" data-v="catalogo">Prendas del catálogo <span class="gl">${nC}</span></button><button role="tab" aria-selected="${t==='piezas'}" class="${t==='piezas'?'on':''}" data-a="ltab" data-v="piezas">Piezas sueltas <span class="gl">${nP}</span></button></div><div style="height:14px"></div>`;
  const acc = t==='catalogo' ? `<button class="btn" data-a="liqflujo">${ic('plus','s')} Liquidar una prenda</button>` : `<button class="btn" data-a="etiquetar">${ic('plus','s')} Etiquetar una prenda</button>`;
  return `<div class="erp">${lateral('Liquidación')}<div class="cont">${enc('Liquidación','Lo que se vende para siempre a otro precio: prendas del catálogo por color y talla, o piezas sueltas fuera del inventario.',acc)}
  <div class="cuerpo">${pest}${t==='catalogo'?cuerpoLiqCat():cuerpoPiezas()}</div></div></div>`;
}
function cuerpoLiqCat(){
  const filas = LIQCAT.map((x,i)=>`<div class="fila liq" style="animation-delay:${i*40}ms" data-a="liqfila" data-v="${i}">
    <div class="nm"><b>${x.d}</b><small>desde el ${x.desde}</small></div><div class="c-cod mono">${x.tienda}</div>
    <div class="c-pr num"><b>${fmt(x.precio)}</b><s>${fmt(x.normal)}</s></div><div class="c-cu"><small>${plural(x.stock,'unidad','unidades')}</small></div>
    <div class="c-es">${x.est==='Revisar'?'<span class="chip a">Revisar</span>':'<span class="chip v">Vigente</span>'}</div></div>`).join('');
  return `<div class="regla">${ic('lock','s')}<span><b>Venta final:</b> sin cambio ni devolución. Termina sola cuando la variante se queda sin stock en la tienda, o cuando alguien la termina a mano. <b>No es de ninguna campaña</b> y no tiene fechas.</span></div>
  <div class="tarj"><div class="fila liq enc-t"><span>Prenda</span><span>Tienda</span><span style="text-align:right">Precio</span><span>Stock</span><span style="text-align:right">Estado</span></div>${filas}</div>
  <div class="nota">${ic('info','s')}<span><b>Revisar</b> quiere decir que llegó mercadería después de registrarla: quien la recibe decide si la liquidación termina o se mantiene. Se registra con «Liquidar una prenda» (buscas la prenda, eliges color y talla, pones un precio por tienda que no baje del costo, y se imprime la etiqueta de siempre con «LIQUIDACIÓN»). Esa pantalla se maquetó aparte: <b>liquidacion-catalogo-2026-10</b>.</span></div>`;
}

/* Detalle de «Piezas sueltas»: la tabla de las prendas que NO están en el inventario (ADR-0379). Mismas cifras, filtros y columnas que la pantalla real. */
function cuerpoPiezas(){
  const f = S.liqf;
  const d = PIEZAS.filter(p=>p.est==='disponible'), v = PIEZAS.filter(p=>p.est==='vendida'), r = PIEZAS.filter(p=>p.est==='retirada');
  const reb = d.filter(p=>p.ini>p.precio).length;
  const lista = f==='vendidas' ? v : f==='retiradas' ? r : f==='rebajadas' ? d.filter(p=>p.ini>p.precio) : d;
  const chipDe = p => p.est==='disponible' ? (p.ini>p.precio?'<span class="chip a">Precio bajado</span>':'<span class="chip v">A la venta</span>') : p.est==='vendida' ? '<span class="chip p">Vendida</span>' : '<span class="chip">Retirada</span>';
  const filas = lista.map((p,i)=>`<div class="fila liq ${S.recien===p.cod?'recien':''}" style="animation-delay:${i*40}ms" data-a="pieza" data-v="${p.cod}">
    <div class="nm"><b>${p.d}</b><small>${p.cat} · ${p.sede}</small></div>
    <div class="c-cod mono">${p.cod}</div>
    <div class="c-pr num"><b>${fmt(p.precio)}</b>${p.ini>p.precio?`<s>${fmt(p.ini)}</s>`:''}</div>
    <div class="c-cu"><small>${p.est==='disponible'?(p.dias?`hace ${p.dias} días`:'hoy'):p.cuando}</small></div>
    <div class="c-es">${chipDe(p)}</div></div>`).join('');
  const cif = (k,t,b,s) => `<button class="cifra ${f===k?'act':''}" data-a="liqf" data-v="${k}"><small>${t}</small><b>${b}</b><span>${s}</span></button>`;
  return `<div class="regla">${ic('lock','s')}<span><b>Venta final:</b> sin cambio ni devolución. Son prendas que no están en el inventario: no cuentan en Existencias, Análisis ni Frescura.</span></div>
  <div class="cifras tres">
    ${cif('disponibles','A la venta',d.length,`${fmt(d.reduce((t,p)=>t+p.precio,0))} si se venden todas`)}
    ${cif('rebajadas','Precio bajado',reb,'a la venta con una etiqueta nueva')}
    ${cif('vendidas','Vendidas este mes',v.length,`${fmt(v.reduce((t,p)=>t+p.precio,0))} cobrados`)}</div>
  <div style="height:14px"></div>
  <div class="tarj"><div class="cab">
    ${[['disponibles','Disponibles',d.length],['vendidas','Vendidas',v.length],['retiradas','Retiradas',r.length]].map(([k,t,n])=>`<button class="pil ${f===k||(f==='rebajadas'&&k==='disponibles')?'on':''}" data-a="liqf" data-v="${k}">${t} <span class="cn">${n}</span></button>`).join('')}</div>

  const bloqueCamp = `<div class="cmp">
      <div><span class="lbl">Cuándo rige</span><div class="val">${sinFechas(camp)?'Sin fechas todavía':`${fechaTxt(camp.desde)} – ${fechaTxt(camp.hasta)}<small>${plural(dias,'día','días')}${camp.hist&&camp.hist.length?` · edición anterior: ${camp.hist[camp.hist.length-1]}`:''}</small>`}</div>

/* «Nueva campaña»: solo su nombre. Antes de crearla se busca una parecida: dos «Black Friday» harían que «¿Valió la pena?» partiera en dos lo que es una sola campaña. */
const norm = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
const parecida = n => { const a = norm(n); if(a.length<4) return null; return ETQS.find(e=>{ const b = norm(e.n); return b.includes(a)||a.includes(b); })||null; };
const okCC = () => S.CC.n.trim().length>=3 && !parecida(S.CC.n);
const avisoCC = () => { const p = parecida(S.CC.n); return p ? `<div class="nota am">${ic('alert','s')}<span><b>Ya existe «${p.n}».</b> Úsala en vez de crear otra parecida: así «¿Valió la pena?» suma todo lo de esa campaña. <button class="btn n sec chico" style="margin-left:6px" data-a="cfgabrir" data-v="${p.id}">Configurar «${p.n}»</button></span></div>` : ''; };
function modalNueva(){
  const CC = S.CC, camp = S.nueva==='campanas', esc = t => t.replace(/"/g,'&quot;');
  return `<div class="velo ${S.mAnim?'entra':''}"><div class="velo-fondo" data-a="nclose"></div>
    <div class="hoja mediana" role="dialog" aria-modal="true" aria-label="${camp?'Nueva campaña':'Nueva insignia'}">
      <div class="hoja-cab"><h2>${camp?'Nueva campaña':'Nueva insignia'}</h2><p>${camp?'Después le pones sus fechas, sus prendas y sus ofertas y promociones con «Configurar».':'Queda disponible de inmediato para cualquier prenda.'}</p></div>
      <div class="hoja-cuerpo"><div class="grupo" style="margin-top:6px"><div class="tit"><b>Nombre</b></div><div class="campo"><input data-f="ccn" value="${esc(CC.n)}" placeholder="${camp?'Ej. Día del Padre, Cierre de verano':'Ej. Edición limitada, Básico'}" aria-label="Nombre" autofocus></div></div><div id="cc-aviso">${camp?avisoCC():''}</div></div>
      <div class="hoja-pie"><button class="btn sec" data-a="nclose">Cancelar</button><button class="btn" id="cc-ok" data-a="ncrear" ${okCC()?'':'disabled'}>Crear ${camp?'campaña':'insignia'}</button></div>
    </div></div>`;
}

function stepper(f,txt,W){
  const [mn,mx,st] = limites(W,f);
  return `<div class="pq"><button data-a="step" data-f="${f}" data-d="${-st}" ${W[f]<=mn?'disabled':''} aria-label="Menos">${ic('minus')}</button><b>${txt}</b><button data-a="step" data-f="${f}" data-d="${st}" ${W[f]>=mx?'disabled':''} aria-label="Más">${ic('plus')}</button></div>`;
}
function beneficio(W){
  const T = TIPOS[W.tipo];
  const grp = (t,html,extra='') => `<div class="grupo"><div class="tit"><b>${t}</b>${extra}</div>${html}</div>`;
  const nota = t => `<div style="color:var(--t65);font-size:12px">${t}</div>`;
  /* El ejemplo sigue a la categoría elegida (ADR-0290): con faldas, la muestra es una falda, no un polo. */
  const cs = catsDe(W).length ? catsDe(W) : CATS, pj = cs[0].ej;
  /* En las promociones por cantidad, qué prendas se cuentan: las del mismo modelo o cualquiera de las elegidas (el descuento va a la más barata). */
  const cuentan = grp('Cuáles prendas cuentan',`<div class="chips"><button class="opc ${!W.mezcla?'on':''}" data-a="mezcla" data-v="0">Del mismo modelo <small>cualquier color o talla</small></button><button class="opc ${W.mezcla?'on':''}" data-a="mezcla" data-v="1">Cualquiera de las elegidas <small>el descuento va a la de menor precio</small></button></div>`);
  let f = '';
  if(W.tipo==='pct'){
    f = grp('Descuento',stepper('pct',`−${W.pct} %`,W)) + `<div class="ejs">${cs.slice(0,3).map(c=>`<div><span>${c.ej.n}</span><b><s>${fmt(c.ej.p)}</s>${fmt(unitario(W,c.ej.p))}</b></div>`).join('')}${nota('El precio baja al .90 más cercano, igual que en la caja y en la base.')}</div>`;
  } else if(W.tipo==='soles'){
    f = grp('Cuántos soles menos en cada prenda',stepper('desc',sol(W.desc),W)) + `<div class="ejs">${cs.slice(0,3).map(c=>`<div><span>${c.ej.n}</span><b><s>${fmt(c.ej.p)}</s>${fmt(unitario(W,c.ej.p))}</b></div>`).join('')}</div>`;
  } else if(W.tipo==='precio'){
    f = grp('A cuánto se venden todas',stepper('precio',fmt(W.precio),W)) + `<div class="ejs">${cs.slice(0,3).map(c=>`<div><span>${c.ej.n}</span><b><s>${fmt(c.ej.p)}</s>${fmt(unitario(W,c.ej.p))}</b></div>`).join('')}${nota('Todas las prendas elegidas, sin importar su precio de lista.')}</div>`;
  } else if(W.tipo==='combo'){
    f = grp('Cuántas lleva',stepper('qty',`${W.qty} prendas`,W)) + grp('Por cuánto',stepper('precio',fmt(W.precio),W)) + cuentan + `<div class="ejs"><div><span>${W.qty} × ${pj.n}</span><b><s>${fmt(W.qty*pj.p)}</s>${fmt(W.precio)}</b></div>${nota(`Se repite por cada ${W.qty} ${mm(W)}; la que sobra va a precio normal. El precio sugerido sigue a la cantidad hasta que lo cambies.`)}</div>`;
  } else if(W.tipo==='segunda'){
    f = grp('Cuál lleva el descuento',stepper('nth',`La ${W.nth}.ª prenda`,W)) + grp('Cuánto se descuenta',stepper('pct2',W.pct2>=100?'Gratis':`−${W.pct2} %`,W)) + cuentan + `<div class="ejs"><div><span>${W.nth} × ${pj.n}</span><b><s>${fmt(W.nth*pj.p)}</s>${fmt(r2((W.nth-1)*pj.p+rebajaP(pj.p,W.pct2)))}</b></div>${nota(`Se repite: con ${2*W.nth} prendas ${mm(W)}, la ${W.nth}.ª y la ${2*W.nth}.ª llevan el descuento.`)}</div>${W.pct2>=100?`<div class="nota">${ic('info','s')}<span>«La ${W.nth}.ª gratis» es lo mismo que <b>${W.nth}x${W.nth-1}</b>.</span></div>`:''}`;
  } else if(W.tipo==='nxm'){
    f = grp('Cuántas lleva',stepper('n',`${W.n} prendas`,W)) + grp('Cuántas paga',stepper('m',plural(W.m,'prenda','prendas'),W)) + cuentan + `<div class="ejs"><div><span>${W.n}x${W.m} · ${W.n} × ${pj.n}</span><b><s>${fmt(W.n*pj.p)}</s>${fmt(W.m*pj.p)}</b></div>${nota(`Se repite por cada ${W.n} ${mm(W)}.`)}</div>${W.n-W.m===1?`<div class="nota">${ic('info','s')}<span><b>${W.n}x${W.m}</b> es lo mismo que «la ${W.n}.ª gratis». Se ofrecen aparte porque así lo dicen los clientes; en la caja es una sola regla.</span></div>`:''}`;
  } else if(W.tipo==='volumen'){
    f = grp('A partir de cuántas prendas',stepper('qty',`${W.qty} prendas`,W)) + grp('Cuánto se descuenta en todas',stepper('pct',`−${W.pct} %`,W)) + cuentan + `<div class="ejs"><div><span>${W.qty} × ${pj.n}</span><b><s>${fmt(W.qty*pj.p)}</s>${fmt(r2(W.qty*unitario({tipo:'pct',pct:W.pct},pj.p)))}</b></div>${nota(`Con ${W.qty} o más prendas ${mm(W)}, el descuento va en cada una; no se reinicia.`)}</div>`;
  } else if(W.tipo==='look'){
    const pts = W.partes.map(id=>CATS.find(c=>c.id===id)), suma = pts.reduce((t,c)=>t+c.ej.p,0);
    f = grp('Qué prendas forman el conjunto',`<div class="chips">${CATS.map(c=>`<button class="opc ${W.partes.includes(c.id)?'on':''}" data-a="parte" data-v="${c.id}">${c.n}</button>`).join('')}</div>`,'<span class="sg">elige 2 o 3</span>') + grp('Precio del conjunto',stepper('precio',fmt(W.precio),W)) + `<div class="ejs"><div><span>${pts.map(c=>c.ej.n).join(' + ')}</span><b><s>${fmt(suma)}</s>${fmt(W.precio)}</b></div>${nota('Se arma con una prenda de cada tipo; si la clienta lleva más, lo que sobra va a precio normal.')}</div>`;
  } else if(W.tipo==='monto'){
    f = grp('Desde cuánto',stepper('min',fmt(W.min),W)) + grp('Cuánto se descuenta',stepper('desc',fmt(W.desc),W)) + `<div class="ejs"><div><span>Compra de ${fmt(W.min+12)}</span><b><s>${fmt(W.min+12)}</s>${fmt(W.min+12-W.desc)}</b></div></div>`;
  } else if(W.tipo==='montopct'){
    f = grp('Desde cuánto',stepper('min',fmt(W.min),W)) + grp('Cuánto se descuenta en la compra',stepper('pct',`−${W.pct} %`,W)) + `<div class="ejs"><div><span>Compra de ${fmt(W.min+12)}</span><b><s>${fmt(W.min+12)}</s>${fmt(r2((W.min+12)*(1-W.pct/100)))}</b></div>${nota('El porcentaje se calcula sobre lo que el cliente paga después de las demás ofertas.')}</div>`;
  } else if(W.tipo==='regalo'){
    f = grp('Desde cuánto',stepper('min',fmt(W.min),W)) + grp('Qué se regala',`<div class="chips">${Object.entries(REG).map(([k,v])=>`<button class="opc ${W.regalo===k?'on':''}" data-a="regalo" data-v="${k}">${v.t} <small>${v.sub}</small></button>`).join('')}</div>`);
  } else if(W.tipo==='club_pct'){
    f = grp('Cuánto menos para los miembros',stepper('pct',`−${W.pct} %`,W));
  } else if(W.tipo==='club_cupon'){
    f = grp('Descuento en su primera compra',stepper('pct',`−${W.pct} %`,W));
  } else if(W.tipo==='club_privada'){
    f = grp('Cuántas horas antes',`<div class="chips">${[12,24,48].map(h=>`<button class="opc ${W.horas===h?'on':''}" data-a="horas" data-v="${h}">${h} horas</button>`).join('')}</div>`);
  } else if(W.tipo==='club_puntos'){
    f = grp('Multiplicador de puntos',`<div class="chips">${[2,3].map(m=>`<button class="opc ${W.mult===m?'on':''}" data-a="mult" data-v="${m}">x${m} <small>${m} puntos por cada S/ 1</small></button>`).join('')}</div>`);
  }
  const quien = grp('Qué tiene que hacer el cliente',`<div class="cond">${ic(T.cond==='ninguna'?'check':T.cond==='club'?'star':T.cond==='monto'?'wallet':'layers','m')}<span><b>${T.quien(W)}</b></span></div>`,'<span class="sg">lo deduce el sistema</span>');
  return f + quien + `<div class="derivado">${ic('info','s')}<span>Sin condición es una <b>oferta</b>; con condición es una <b>promoción</b>. Esta es una <b>${fam(W).toLowerCase()}</b>.</span></div>`;
}
function lado(W,T){

  <div class="caja-l ced"><span class="lbl">Lo que cedes</span><b>≈ ${fmt(costo)}</b><span>${costo?'si vendes como en los últimos 30 días':'esta oferta no baja ningún precio'}. Es una estimación, no una promesa.</span></div>`;

/* =========================== acciones =========================== */
/* Las fechas de una oferta caben dentro de las de su campaña y no empiezan antes de hoy. */
function fechasDeCampana(W){ const e = campanaDe(W.camp); if(e && !sinFechas(e)){ W.desde = e.desde>HOY ? e.desde : HOY; W.hasta = e.hasta; } }
function encajar(W){
  const e = campanaDe(W.camp); if(!e || sinFechas(e)) return;
  const ini = e.desde>HOY ? e.desde : HOY;
  if(W.desde<ini || W.desde>e.hasta) W.desde = ini;
  if(W.hasta>e.hasta || W.hasta<W.desde) W.hasta = e.hasta;
}
/* Abre la Configuración de una campaña con una oferta nueva en blanco (−20 % sobre las prendas marcadas, con las fechas de la campaña) o con un preajuste. */
function abrirCfg(id,pend){
  S.W = nuevoW(); S.W.camp = id; S.cfg = id; S.simple = null; S.nueva = false; S.rep = null; S.cfgFechas = false; S.catPanel = false; S.mAnim = true;
  selTipo(S.W,'pct'); fechasDeCampana(S.W);
  if(pend){ selTipo(S.W,pend.sel); Object.assign(S.W,pend.set||{}); encajar(S.W); }
}
/* «Repetir» una campaña que ya pasó: sigue siendo la MISMA campaña (Felipe, 2026-10-21), con las fechas del año siguiente y su historial; lo que se registró el año pasado queda como la edición anterior. */
function repetirCamp(id,pend){
  const e = campanaDe(id), sig = s => s.replace(/^2026/,'2027');
  if(e.desde && e.desde.startsWith('2026') && e.hasta<HOY){ e.hist = [...(e.hist||[]), `${fechaTxt(e.desde)} – ${fechaTxt(e.hasta)} de 2026`]; e.desde = sig(e.desde); e.hasta = sig(e.hasta); }
  const r0 = reglasDe(id)[0];
  abrirCfg(id, pend || (r0 ? {sel:r0.tipo, set:{pct:r0.pct,cats:[...r0.cats],desc:r0.desc,precio:r0.precio,qty:r0.qty,min:r0.min}} : null));
  S.rep = e.hist.length ? id : null;
  return e;
}
const listo = W => W.cats.length>0 && W.sedes.length>0 && !(W.tipo==='look' && W.partes.length<2);
/* Guardar una oferta nueva: como borrador (quien ve Insignias) o activada (solo un líder). */
function guardarRegla(W,borrador){
  const n = W.nombreMan && W.nombre.trim() ? W.nombre.trim() : defNombre(W), id = 'n'+(CAMP.length+1), cn = campanaDe(S.cfg).n;
  const c = base(Object.assign({}, W, {id, n, borrador, vendidas:0, hist:[], cats:[...W.cats], partes:[...W.partes], nocats:[...W.nocats]})); delete c.editId; CAMP.push(c);
  S.recien = id; S.abierto.campanas = S.cfg; S.cfg = null; S.rep = null;
  return {c,n,cn};
}
/* Abrir un pase: el cuerpo baja y sube (transición del CSS) sin redibujar la pantalla; en el celular, el pase en grande va debajo y sí se redibuja. */
function abrirPase(id){
  S.abierto[S.vi] = id;
  if(S.dev==='celular') return;
  document.querySelectorAll('.sl-pase').forEach(el=>{ const on = el.dataset.id===id; el.classList.toggle('sl-abierto',on); el.querySelector('.sl-cab').setAttribute('aria-expanded',on); const c = el.querySelector('.sl-cuerpo'); if(on) c.removeAttribute('inert'); else c.setAttribute('inert',''); });
  const det = document.querySelector('.sl-detalle');
  if(det){ det.innerHTML = detalle(porId(id)); det.classList.remove('swap'); void det.offsetWidth; det.classList.add('swap'); }
  medirLook();
}
/* Cuántas prendas entran por fila en el pase en grande lo decide el ancho (como en la pantalla real: la grilla es auto-fill y la pantalla hace la cuenta del navegador). */
function medirLook(){
  const lb = document.querySelector('.sl-lookbook'); if(!lb) return;
  const cs = getComputedStyle(lb), min = parseFloat(cs.getPropertyValue('--sl-min')), gap = parseFloat(cs.getPropertyValue('--sl-hueco'));
  const c = Math.max(1,Math.floor((lb.getBoundingClientRect().width+gap)/(min+gap)));
  if(c!==S.cols){ S.cols = c; S.anim = false; S.arriba = false; render(); }
}
/* Las animaciones de entrada solo corren al cambiar de pantalla o de vista: no en cada toque de un − o un +. */
const ENTRAN = ['vista','nuevacamp','reiniciar','repetir','repcamp','det','etiquetar','eguardar','rol','liqf','vi','ltab','liqflujo','piezasdesde','ncrear'];
const ARRIBA = ['vista','reiniciar','repetir','repcamp','det','etiquetar','eguardar','rol','vi','ltab','liqflujo','piezasdesde','ncrear'];
function act(a,v,el){
  const W = S.W;
  S.anim = ENTRAN.includes(a); S.arriba = ARRIBA.includes(a);
  switch(a){
    case 'dev': S.dev = v; break;
    case 'tema': S.tema = v; break;
    case 'vista': S.cfg = null; S.simple = null; S.nueva = false; S.rep = null; S.det = null; S.porque = null; S.recien = null;
      if(v==='config'){ S.vista = 'insignias'; S.vi = 'campanas'; abrirCfg('aniversario'); } else S.vista = v; break;
    case 'reiniciar': Object.assign(S,{vista:'insignias',vi:'campanas',abierto:{},ltab:'catalogo',rol:'lider',det:null,cfg:null,simple:null,nueva:false,rep:null,cfgFechas:false,catPanel:false,mAnim:false,CC:nuevoCC(),E:nuevoE(),liqf:'disponibles',recien:null,porque:null,cart:{polos:2,falda:false},W:nuevoW()});
      CAMP.splice(0,CAMP.length,...JSON.parse(SNAP.camp).map(o=>base(o))); ETQS.splice(0,ETQS.length,...JSON.parse(SNAP.etqs)); INSIG.splice(0,INSIG.length,...JSON.parse(SNAP.insig));
      for(let i=PIEZAS.length-1;i>=0;i--) if(PIEZAS[i].nueva) PIEZAS.splice(i,1); break;
    case 'det': S.det = v||null; S.recien = null; break;
    case 'vi': S.vi = v; break;
    case 'pase': abrirPase(v); if(S.dev!=='celular') return; break;
    case 'ltab': S.ltab = v; S.det = null; break;
    case 'rol': S.rol = v; S.det = null; S.cfg = null; S.simple = null; S.nueva = false;
      if((S.vista==='insignias' && !ROLES[v].ins) || (S.vista==='liquidacion' && !ROLES[v].liq)) S.vista = vistaInicial(); break;
    case 'liqf': S.liqf = v; break;
    case 'prendas': avisar('En la versión real abre «Prendas»: marcar las prendas sueltas de la campaña. Es la hoja de hoy, sin cambios.'); break;
    case 'imprimir': avisar('En la versión real abre «Etiquetas de precio» con las prendas de esta campaña. El papel dice el precio que cobra la caja ese día.'); break;
    case 'webdiseno': avisar('En la versión real lleva a Tienda web ▸ Campañas: el diseño de esta campaña en la tienda online. Es el que existe hoy.'); break;
    case 'desactivar': { const e = porId(v); e.activo = false; avisar(`${e.n} desactivada.${e.estilo==='campana'&&vivasDe(e).length ? ' Sus ofertas y promociones dejan de cobrarse en la caja y en la web desde ahora; si hay etiquetas de papel colgadas, hay que reimprimirlas.' : ''}`); break; }
    case 'reactivar': { const e = porId(v); e.activo = true; S.abierto[S.vi] = v; avisar(`${e.n} reactivada.`); break; }
    case 'nuevacamp': S.nueva = v||'campanas'; S.CC = nuevoCC(); S.mAnim = true; break;
    case 'nclose': S.nueva = false; break;
    case 'ncrear': { if(!okCC()) break; const nom = S.CC.n.trim(), id = 'x'+(ETQS.length+INSIG.length+1), esC = S.nueva==='campanas';
      if(esC){ ETQS.push(camp0({id,n:nom,desde:null,hasta:null,creada:true})); S.vi = 'campanas'; } else { INSIG.push(ins0({id,n:nom,estilo:ESTILO_VISTA[S.nueva],creada:true})); S.vi = S.nueva; }
      S.abierto[S.vi] = id; S.nueva = false; S.CC = nuevoCC();
      avisar(esC ? `Campaña «${nom}» creada. Ahora ponle sus fechas, sus prendas y sus ofertas y promociones con «Configurar».` : `Insignia «${nom}» creada. Ya se puede marcar en las prendas.`); break; }
    case 'simple': S.simple = v; S.cfg = null; S.nueva = false; S.mAnim = true; break;
    case 'simplecerrar': S.simple = null; break;
    case 'piezasdesde': S.cfg = null; S.vista = 'liquidacion'; S.ltab = 'catalogo'; S.det = null; break;
    case 'etiquetar': S.vista = 'liquidacion'; S.ltab = 'piezas'; S.det = 'etiquetar'; S.E = nuevoE(); break;
    case 'ecat': S.E.cat = v; break;
    case 'esede': S.E.sede = v; S.E.sedeOk = true; break;
    case 'eprecio': S.E.precio = Math.min(150,Math.max(10,S.E.precio+ +el.dataset.d)); S.E.precioOk = true; break;
    case 'eguardar': { if(faltanE().length) break;
      const cat = CATS.find(c=>c.id===S.E.cat), cod = codigoE();
      PIEZAS.unshift({cod, d:S.E.d.trim(), cat:cat.n, sede:S.E.sede, precio:S.E.precio, ini:S.E.precio, est:'disponible', dias:0, nueva:true});
      S.recien = cod; S.liqf = 'disponibles'; S.det = null; S.ltab = 'piezas'; S.E = nuevoE();
      avisar(`Guardada. Se imprime la etiqueta ${cod}: ya se puede vender escaneándola.`); break; }
    case 'pieza': avisar('En la versión real abre la pieza: cambiar su precio (imprime una etiqueta nueva y la vieja deja de valer), reimprimirla o retirarla.'); break;
    /* ---- la Configuración de una campaña ---- */
    case 'cfgabrir': abrirCfg(v); break;
    case 'cfgcerrar': S.cfg = null; S.simple = null; S.nueva = false; S.rep = null; break;
    case 'cfgfechas': S.cfgFechas = !S.cfgFechas; break;
    case 'catpanel': S.catPanel = !S.catPanel; break;
    case 'campcat': { const e = campanaDe(S.cfg); e.catIds = e.catIds.includes(v) ? e.catIds.filter(x=>x!==v) : [...e.catIds,v]; recalc(e); break; }
    case 'campcatall': { const e = campanaDe(S.cfg); e.catIds = e.catIds.length===CATS.length ? [] : CATS.map(c=>c.id); recalc(e); break; }
    case 'kind': if(kindDe(W.sel)!==v) selTipo(W, v==='oferta' ? 'pct' : 'combo'); break;
    case 'tipo': selTipo(W,v); break;
    case 'mezcla': W.mezcla = v==='1'; break;
    case 'encajar': encajar(W); W.fechasMan = true; break;
    case 'cat': if(v.startsWith('e:')){ W.cats = [v]; } else { W.cats = W.cats.filter(x=>x!=='all' && !x.startsWith('e:')); W.cats = W.cats.includes(v) ? W.cats.filter(x=>x!==v) : [...W.cats,v]; }
      if(W.tipo==='combo' && !W.precioMan) W.precio = precioSug(W);
      break;
    case 'catfiltro': W.cats = W.cats.filter(x=>x!=='all' && !x.startsWith('e:')); break;
    case 'dias': W.dias = +v; break;
    case 'sede': W.sedes = W.sedes.includes(v) ? W.sedes.filter(x=>x!==v) : [...W.sedes,v]; break;
    case 'step': { const f = el.dataset.f, d = +el.dataset.d; const [mn,mx] = limites(W,f); W[f] = r2(Math.min(mx,Math.max(mn,W[f]+d))); if(f==='precio'){ W.precio = Math.round(W.precio*10)/10; W.precioMan = true; }
      if(f==='n' && W.m>=W.n) W.m = W.n-1;
      if(f==='qty' && W.tipo==='combo' && !W.precioMan) W.precio = precioSug(W);   /* el precio del paquete acompaña a la cantidad hasta que la persona lo toca */
      break; }
    case 'regalo': W.regalo = v; break;
    case 'horas': W.horas = +v; break;
    case 'mult': W.mult = +v; break;
    case 'rango': { const [d,h] = v.split(','); W.desde = d; W.hasta = h; W.fechasMan = true; break; }
    case 'excl': W.excl = [...W.excl,'jean']; break;
    case 'cfgborrador': case 'cfgactivar': { if(!S.cfg || !listo(W)) break;
      const activa = a==='cfgactivar' && ROLES[S.rol].act, r = guardarRegla(W,!activa);
      avisar(activa ? `Activada dentro de «${r.cn}»: «${r.n}». ${r.c.desde>HOY?'Empieza el '+fechaTxt(r.c.desde):'Ya rige'}.` : `Guardada como borrador dentro de «${r.cn}»: «${r.n}». ${ROLES[S.rol].act?'Actívala cuando quieras.':'Un líder tiene que activarla.'}`); break; }
    case 'activar': { if(!ROLES[S.rol].act) break; const c = CAMP.find(x=>x.id===v); c.borrador = false; S.recien = v; avisar(`Activada: «${c.n}». ${c.desde>HOY?'Empieza el '+fechaTxt(c.desde):'Ya rige'}.`); break; }
    case 'editar': { const c = CAMP.find(x=>x.id===v); if(!c) break;
      S.W = Object.assign(nuevoW(), JSON.parse(JSON.stringify(c)), {editId:c.id, camp:S.cfg, sel:c.tipo, nombre:c.n, nombreMan:c.n!==defNombre(c)}); S.mScroll = true; break; }
    case 'cfgnueva': { const id = S.cfg; S.W = nuevoW(); S.W.camp = id; selTipo(S.W,'pct'); fechasDeCampana(S.W); S.mScroll = true; break; }
    case 'cfgcambios': { const c = CAMP.find(x=>x.id===W.editId); if(!c || !listo(W)) break;
      const antes = `${TIPOS[c.tipo].da(c)} · ${fechaTxt(c.desde)} – ${fechaTxt(c.hasta)}`;
      Object.keys(base({})).filter(x=>!['hist','vendidas','borrador','camp'].includes(x)).forEach(x=>{ c[x] = Array.isArray(W[x]) ? [...W[x]] : W[x]; });
      c.n = W.nombreMan && W.nombre.trim() ? W.nombre.trim() : defNombre(W); c.hist = [...c.hist, `${antes}, hasta el ${fechaTxt(HOY)}`]; c.legado = false;
      S.recien = c.id; S.abierto.campanas = c.camp; S.cfg = null; S.rep = null;
      avisar(`Cambios guardados en «${c.n}»: valen desde ahora; lo ya vendido no cambia y queda en el historial.`); break; }
    case 'acum': W.acum = v==='1'; break;
    case 'nocat': W.nocats = W.nocats.includes(v) ? W.nocats.filter(x=>x!==v) : [...W.nocats,v]; break;
    case 'claure': W.claure = !W.claure; break;
    case 'parte': { W.partes = W.partes.includes(v) ? W.partes.filter(x=>x!==v) : (W.partes.length<3 ? [...W.partes,v] : W.partes); W.cats = [...W.partes];
      if(!W.precioMan && W.partes.length>=2) W.precio = precioLook(W); break; }
    case 'liqflujo': if(ROLES[S.rol].liq){ S.cfg = null; S.vista = 'liquidacion'; S.ltab = 'catalogo'; S.det = null; } avisar('En la versión real abre «Liquidar una prenda»: buscas la prenda, eliges color y talla, pones un precio por tienda (nunca bajo el costo) y se imprime la etiqueta con «LIQUIDACIÓN». Esa pantalla está maquetada aparte: liquidacion-catalogo-2026-10.'); break;
    case 'liqfila': avisar('En la versión real abre la liquidación: terminarla a mano, o decidir si se mantiene cuando llega mercadería.'); break;
    case 'polo': S.cart.polos = Math.max(0,Math.min(6,S.cart.polos+ +v)); break;
    case 'falda': S.cart.falda = v==='1'; break;
    case 'porque': S.porque = S.porque===v ? null : v; break;
    case 'cobrar': avisar('Demo: aquí se cobra y se emite el comprobante.'); break;
    case 'repcamp': { const e = repetirCamp(v); avisar(`«${e.n}» pasó a sus fechas de 2027; la edición anterior queda en su historial. Se abrió con lo que tuvo.`); break; }
    case 'repetir': { const e = repetirCamp('madre',{sel:'pct',set:{pct:20,cats:['blusas']}}); avisar(`«${e.n}» pasó a sus fechas de 2027 (la de 2026 queda en su historial) y se abrió con las blusas al −20 %.`); break; }
  }
  render();
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  act(b.dataset.a, b.dataset.v, b);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (S.cfg||S.simple||S.nueva)){ S.anim = false; act('cfgcerrar'); } });
document.addEventListener('input', e=>{
  const fd = e.target.dataset && e.target.dataset.f;
  if(fd==='ccn'){ S.CC.n = e.target.value; const ok = $('#cc-ok'), av = $('#cc-aviso'); if(ok) ok.disabled = !okCC(); if(av) av.innerHTML = S.nueva==='campanas' ? avisoCC() : ''; return; }
  if(fd!=='edesc') return;
  S.E.d = e.target.value;
  const f = faltanE(), pv = $('#etq-d'), ok = $('#etq-ok'), fl = $('#etq-falta');
  if(pv) pv.textContent = S.E.d.trim() || (S.E.cat ? CATS.find(c=>c.id===S.E.cat).n+' · talla' : 'Descripción de la prenda');
  if(ok) ok.disabled = f.length>0;
  if(fl) fl.innerHTML = faltaE(f);
});
document.addEventListener('change', e=>{
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  const W = S.W;
  /* Al salir del campo de texto (no mientras escribe) la marca del grupo pasa a «hecho»; se cambia en su lugar, sin redibujar, para no perder el clic que provocó el cambio. */
  if(f==='edesc'){ const g = e.target.closest('.grupo'), tag = g && g.querySelector('.tit').lastElementChild; if(tag && S.E.d.trim()){ g.classList.remove('sigue'); tag.className = 'hc'; tag.textContent = '✓ hecho'; } return; }
  if(f==='nombre'){ W.nombre = e.target.value; W.nombreMan = true; avisar('Nombre guardado.'); return; }
  if(f==='cdesde'||f==='chasta'){ const c = campanaDe(S.cfg); if(c){ c[f==='cdesde'?'desde':'hasta'] = e.target.value || null; } S.anim = false; S.arriba = false; render(); return; }
  if(f==='desde'||f==='hasta'){ W[f] = e.target.value; W.fechasMan = true; S.anim = false; S.arriba = false; render(); }
});
render();
</script>
