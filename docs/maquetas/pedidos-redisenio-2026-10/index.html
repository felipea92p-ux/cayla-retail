<div class="marco" role="toolbar" aria-label="Controles de la maqueta">
  <div class="grupo-m">
    <b>Maqueta · Pedidos web</b>
    <span class="dato">Datos inventados · No guarda nada</span>
  </div>
  <div class="grupo-m">
    <label>Pantalla
      <select id="m-escenario" aria-label="Qué pantalla ver">
        <option value="pedidos">Día con pedidos</option>
        <option value="tranquilo">Día tranquilo</option>
        <option value="nada">Sin pedidos todavía</option>
        <option value="cargando">Cargando</option>
        <option value="error">No se pudo leer</option>
        <option value="sedesintienda">Sede sin tienda</option>
        <option value="nocarga">Pedido que no abre</option>
      </select>
    </label>
    <label>Sede
      <select id="m-sede" aria-label="Qué sede ver">
        <option value="tru">Tienda TRU</option>
        <option value="lim">Tienda LIM (dos empresas)</option>
      </select>
    </label>
    <span class="seg-m" role="group" aria-label="Vista">
      <button type="button" id="m-esc" aria-pressed="true">Escritorio</button>
      <button type="button" id="m-cel" aria-pressed="false">Celular</button>
    </span>
    <span class="seg-m" role="group" aria-label="Tema">
      <button type="button" id="m-claro" aria-pressed="true">Claro</button>
      <button type="button" id="m-oscuro" aria-pressed="false">Oscuro</button>
    </span>
    <button type="button" class="bm" id="m-caja" aria-pressed="true" title="Si la caja está cerrada, el efectivo no se puede cobrar">Caja abierta</button>
    <button type="button" class="bm" id="m-red" aria-pressed="false" title="El próximo guardado pierde la respuesta">Cortar internet al guardar</button>
    <button type="button" class="bm" id="m-resaltar" aria-pressed="false">Resaltar lo nuevo</button>
    <button type="button" class="bm" id="m-cambia">Qué cambia</button>
    <button type="button" class="bm" id="m-reiniciar">Reiniciar</button>
  </div>
</div>

<div class="mesa">
  <div class="aparato" id="aparato">
    <div class="pantalla" id="pantalla">
      <div class="erp">
        <aside class="lateral" id="lateral" aria-label="Menú"></aside>
        <div class="cuerpo-erp">
          <div class="barra-sup" id="barra-sup"></div>
          <main id="vista"></main>
        </div>
      </div>
    </div>
    <div id="capas"></div>
    <div id="avisos" aria-live="polite"></div>
  </div>
</div>
