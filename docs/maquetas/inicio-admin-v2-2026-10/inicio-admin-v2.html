<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inicio del Admin · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL v2 · Inicio del Admin (2026-10-03)
   Felipe descartó las tres primeras (inicio-admin-2026-10): el Admin NO
   vende; quiere ver cómo va el negocio, comparar tiendas y ver lo que hay
   que revisar, lo más visual posible y con poco texto, con un diseño más
   sofisticado y animaciones mucho más fuertes.
   Tres maquetas: A Observatorio · B Carrera · C Reloj.
   Reglas de gráficos: énfasis (la sede elegida en tinta, las demás en
   segundo plano) en vez de un color por tienda; etiquetas directas;
   rejilla en línea fina; punteado solo para la meta y el ritmo ideal.
   Tokens = apps/web/app/globals.css (ADR-0169). Datos inventados que cuadran.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t15:rgba(26,26,24,.15);--t10:rgba(26,26,24,.1);--t06:rgba(26,26,24,.055);
--c80:rgba(245,240,232,.82);--c60:rgba(245,240,232,.62);--c40:rgba(245,240,232,.42);--c20:rgba(245,240,232,.2);--c10:rgba(245,240,232,.1);
--ease:cubic-bezier(.32,.72,.24,1);--salida:cubic-bezier(.4,0,1,1);--spk:46px;--alto:800px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d8cfbf}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
.serif{font-family:'EB Garamond',Georgia,serif}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.l{width:22px;height:22px}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:sticky;top:0;z-index:300;background:var(--tinta);color:var(--crema);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}.seg button{height:30px;padding:0 11px;font-size:12.5px;color:rgba(245,240,232,.72)}.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.78);font-size:12.5px;cursor:pointer}
.spk .acc{height:30px;padding:0 11px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);color:var(--crema);font-size:12.5px}
.spk .acc:hover{background:rgba(245,240,232,.08)}
.spk .acc.lleno{border-style:solid;background:rgba(245,240,232,.1)}

/* ---------- escena y dispositivos ---------- */
.escena{display:flex;justify-content:center;align-items:flex-start}
.escena.dev{padding:24px 16px 40px}
.disp{position:relative;flex:none}
.disp.escritorio{width:100%;height:calc(100dvh - var(--spk))}
.disp.tablet{width:834px;max-width:100%;height:max(640px,min(1080px,calc(100dvh - var(--spk) - 48px)));border-radius:30px;background:#1b1a18;padding:12px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}
.disp.celular{width:391px;height:max(640px,min(812px,calc(100dvh - var(--spk) - 48px)));border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}

/* ---------- tema: claro (B, C) y oscuro (A) salen de los mismos tokens ---------- */
.marco{--fondo:var(--crema);--sup:var(--papel);--sup2:var(--hueso);--borde:var(--sand);--linea:var(--t10);--tx:var(--tinta);--tx2:var(--t65);--tx3:var(--t50);
  --urg:var(--rojo);--ok:var(--verde);--warn:var(--ambar);--info:var(--pizarra);--foco:var(--tinta);--resto:color-mix(in oklab,var(--taupe) 48%,transparent);--fantasma:color-mix(in oklab,var(--sand) 80%,var(--taupe) 20%);--brillo:color-mix(in oklab,var(--taupe) 70%,transparent);--lavado:color-mix(in oklab,var(--tinta) 6%,transparent)}
.marco.oscuro{--fondo:var(--tinta);--sup:color-mix(in oklab,var(--tinta) 93%,var(--crema));--sup2:color-mix(in oklab,var(--tinta) 86%,var(--crema));--borde:rgba(245,240,232,.11);--linea:rgba(245,240,232,.08);--tx:var(--crema);--tx2:var(--c60);--tx3:var(--c40);
  --urg:color-mix(in oklab,var(--rojo) 72%,var(--crema));--ok:color-mix(in oklab,var(--verde) 42%,var(--crema));--warn:color-mix(in oklab,var(--ambar) 38%,var(--crema));--info:color-mix(in oklab,var(--pizarra) 42%,var(--crema));--foco:var(--crema);--resto:rgba(245,240,232,.28);--fantasma:rgba(245,240,232,.1);--brillo:rgba(245,240,232,.55);--lavado:rgba(245,240,232,.06)}
.marco{position:relative;width:100%;height:100%;display:flex;background:var(--fondo);color:var(--tx);overflow:hidden;container:app/inline-size;transition:background .5s var(--ease)}
.tablet .marco{border-radius:20px}.celular .marco{border-radius:39px}

/* ---------- el ERP: lateral y barra ---------- */
.lat{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--linea);padding:14px 0 16px;background:var(--fondo);z-index:5}
.lat .logo{height:46px;display:grid;place-items:center;margin-bottom:20px}
.lat .logo svg{height:27px;width:auto}
.lat nav{display:flex;flex-direction:column;gap:6px;flex:1}
.lat nav a{width:48px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--tx3);position:relative;transition:background .25s var(--ease),color .25s}
.lat nav a:hover{background:var(--lavado);color:var(--tx)}
.lat nav a.on{background:var(--sup2);color:var(--tx)}
.lat nav a.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--rojo)}
.yo{width:38px;height:38px;border-radius:50%;background:var(--taupe);color:var(--crema);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.03em}
.col{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--borde) transparent}
.barra{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:12px;padding:0 24px 0 26px;border-bottom:1px solid var(--linea);background:color-mix(in oklab,var(--fondo) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.barra .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3)}
.barra .ico:hover{background:var(--lavado);color:var(--tx)}
.buscar{height:38px;display:flex;align-items:center;gap:10px;padding:0 9px 0 14px;border-radius:999px;background:var(--sup2);color:var(--tx3);font-size:13px}
.buscar kbd{font:600 10px 'DM Sans';border:1px solid var(--borde);border-radius:5px;padding:1px 5px;background:var(--sup);color:var(--tx3)}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:14px}
.barra .act{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.13em;font-weight:600;color:var(--tx3);text-transform:uppercase}
.barra .sede{height:34px;padding:0 12px;border:1px solid var(--borde);border-radius:8px;background:var(--sup);display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}
.barra .m-only{display:none}
.cont{container:cont/inline-size;padding:30px 40px 60px}
.cont>.m{max-width:1880px;margin:0 auto}
@container app (max-width:760px){
  .lat{display:none}
  .barra{padding:0 12px;height:56px;gap:6px}
  .barra .d-only{display:none}
  .barra .m-only{display:flex}
  .cont{padding:20px 16px 48px}
}

/* ---------- avisos y tooltip ---------- */
.toasts{position:absolute;top:72px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:340px;padding:11px 14px;border-radius:12px;background:var(--tinta);color:var(--crema);font-size:13px;box-shadow:0 14px 30px -14px rgba(26,26,24,.55);animation:avisoE .42s var(--ease) both}
.oscuro .toast{background:var(--crema);color:var(--tinta)}
.toast.sale{animation:avisoS .22s var(--salida) both}
@keyframes avisoE{from{opacity:0;transform:translate3d(0,-10px,0) scale(.97)}}
@keyframes avisoS{to{opacity:0;transform:translate3d(0,-6px,0)}}
.tip{position:absolute;z-index:70;pointer-events:none;background:var(--tinta);color:var(--crema);font-size:12px;line-height:1.45;padding:8px 11px;border-radius:9px;box-shadow:0 12px 26px -12px rgba(26,26,24,.6);opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s var(--ease);max-width:260px}
.oscuro .tip{background:var(--crema);color:var(--tinta)}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700;font-size:13.5px}
.tip .fila{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip .fila i{width:12px;height:0;border-top:2px solid currentColor;opacity:.5}
.tip .fila.f i{opacity:1}

/* ---------- piezas comunes ---------- */
.entrando .ent{animation:sube .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@keyframes sube{from{opacity:0;transform:translate3d(0,16px,0)}}
@keyframes aparece{from{opacity:0}}
.revelar{opacity:0;transform:translate3d(0,28px,0) scale(.99)}
.revelar.visto{opacity:1;transform:none;transition:opacity .8s var(--ease) var(--rd,0ms),transform .9s var(--ease) var(--rd,0ms)}
.lbl{text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:10.5px;color:var(--tx3)}
.tj{background:var(--sup);border:1px solid var(--borde);border-radius:20px;padding:20px 22px;position:relative;min-width:0}
.tcab{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:16px}
.tcab .lbl{color:var(--tx2)}
.luz::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(240px circle at var(--mx,-600px) var(--my,-600px),var(--brillo),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.luz:hover::after{opacity:1}
.oscuro .luz::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,-600px) var(--my,-600px),rgba(245,240,232,.055),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.oscuro .luz:hover::before{opacity:1}
.inclina{transition:transform .45s var(--ease);transform-style:preserve-3d;will-change:transform}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--lavado);color:var(--tx2)}
.chip>i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in oklab,var(--warn) 14%,transparent);color:var(--warn)}
.chip.urg{background:color-mix(in oklab,var(--urg) 12%,transparent);color:var(--urg)}
.chip.info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.punto.no{background:var(--tx3)}
.bucle .punto.late::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:late 2.4s var(--ease) infinite}
@keyframes late{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.8);opacity:0}}
.k{font-variant-numeric:tabular-nums}
.k.cambio{animation:destello 1.6s var(--ease)}
@keyframes destello{0%,35%{color:var(--ok)}}
[data-a]{transition-property:width,height,left,top,r,transform,stroke-dashoffset,stroke-dasharray,opacity;transition-duration:.95s;transition-timing-function:var(--ease)}
.rapido [data-a]{transition-duration:110ms!important;transition-timing-function:linear!important;transition-delay:0ms!important}
.fallo{display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--tx2);font-size:13px}
.fallo svg{color:var(--warn)}
.fallo b{color:var(--tx);font-weight:600}
.fallo button{font-size:12.5px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:6px;margin-top:4px}

/* odómetro: cada dígito es una tira 0-9 (×3) que rueda */
.odo{display:inline-flex;align-items:flex-start;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;line-height:1.08}
.odo .dg{display:inline-block;height:1.08em;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.odo .tira{display:flex;flex-direction:column}
.odo .tira span{display:block;height:1.08em;line-height:1.08;text-align:center}
.odo .sep{display:inline-block;height:1.08em}
.rapido .odo .tira{transition-duration:110ms!important;transition-delay:0ms!important}

/* controles: periodo + sede, con indicador que se desliza */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sd{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:4px;border-radius:999px;background:var(--sup2);border:1px solid var(--borde)}
.sd button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:color .35s var(--ease)}
.sd button.on{color:var(--fondo)}
.sd button:not(.on):hover{color:var(--tx)}
.sd-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:999px;background:var(--foco);z-index:0}
.sd-ind[data-a]{transition-duration:.55s}
.repetir{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-radius:999px;border:1px solid var(--borde);font-size:12.5px;font-weight:600;color:var(--tx);transition:background .25s,border-color .25s,opacity .25s}
.repetir .ic{width:26px;height:26px;padding:6px;border-radius:50%;background:var(--foco);color:var(--fondo);stroke-width:2}
.repetir:hover{border-color:var(--foco)}
.repetir:disabled{opacity:.4;cursor:not-allowed}
.repetir.va{background:var(--foco);color:var(--fondo)}.repetir.va .ic{background:var(--fondo);color:var(--foco)}
.reloj-rep{font-variant-numeric:tabular-nums}

/* anillo de meta */
.anillo{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.anillo circle{fill:none}
.an-f{stroke:var(--linea)}.an-v{stroke:var(--foco);stroke-linecap:round}
.an-v.ok{stroke:var(--ok)}
.anillo [data-a]{transition-duration:1.4s}

/* gráficos estirados (svg) con etiquetas en HTML */
.graf{position:relative}
.graf>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.graf path,.graf line{vector-effect:non-scaling-stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.graf .rej{stroke:var(--linea);stroke-width:1}
.graf .meta{stroke:var(--ok);stroke-width:1.3;stroke-dasharray:6 5}
.graf .ideal{stroke:var(--tx3);stroke-width:1.2;stroke-dasharray:1 5}
.graf .ln{stroke:var(--resto);stroke-width:1.6;transition:stroke .45s var(--ease),stroke-width .45s}
.graf .ln.f{stroke:var(--foco);stroke-width:2.6}
.graf .ar{fill:var(--lavado);stroke:none}
.revela{clip-path:inset(-30% 100% -30% 0);transition:clip-path 1.7s var(--ease) .15s}
.revela.ya{clip-path:inset(-30% -4% -30% 0)}
.rapido .revela{transition:none}

/* ---------- «Por revisar»: detalle compartido ---------- */
.det{display:grid;gap:14px}
.det-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.det-cab b{font-family:'EB Garamond',serif;font-size:26px;font-weight:500;line-height:1}
.det-cab .cerrar{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--borde);display:grid;place-items:center;color:var(--tx2)}
.det-cab .cerrar:hover{color:var(--tx);border-color:var(--tx)}
.dv{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 60px;align-items:center;gap:6px 0;font-size:12px;color:var(--tx2)}
.dv .eje{height:22px;border-left:1px solid var(--tx3)}
.dv i{display:block;height:12px;border-radius:3px}
.dv .neg{justify-self:end;background:var(--urg);border-radius:4px 0 0 4px}
.dv .pos{justify-self:start;background:var(--ok);border-radius:0 4px 4px 0}
.dv .v{text-align:right;font-weight:600;color:var(--tx)}
.hb{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;align-items:center;gap:8px 10px;font-size:12px;color:var(--tx2)}
.hb .pista{height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.hb .pista i{display:block;height:100%;border-radius:5px;background:var(--foco)}
.hb b{text-align:right;color:var(--tx);font-weight:600}
.sem7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:6px;height:96px;border-bottom:1px solid var(--linea);padding-bottom:6px}
.sem7 div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--tx3)}
.sem7 .bola{border-radius:50%;background:var(--warn);display:grid;place-items:center;color:var(--fondo);font-size:10.5px;font-weight:700}
.sem7 .hoyd{color:var(--tx);font-weight:700}
.rutas{display:grid;gap:12px}
.ruta{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--tx)}
.ruta .via{position:relative;height:2px;background:var(--linea)}
.ruta .via.camino{background:linear-gradient(90deg,var(--info),var(--info)) no-repeat;background-size:100% 2px}
.ruta .via em{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--info)}
.bucle .ruta .via em{animation:viaje 3.2s var(--ease) infinite}
@keyframes viaje{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 10px);opacity:0}}
.ruta .via.prep{background:repeating-linear-gradient(90deg,var(--tx3) 0 5px,transparent 5px 10px)}
.ruta small{grid-column:1/-1;font-weight:400;color:var(--tx3);margin-top:-6px}
.det-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.det-pie b{color:var(--tx)}
.ir{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:10px;background:var(--foco);color:var(--fondo);font-size:12.5px;font-weight:700;transition:background .25s}
.ir:hover{background:var(--rojo-p);color:var(--crema)}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.32,.72,.24,1)}

/* =====================================================================
   A · OBSERVATORIO — oscuro, el negocio sobre el mapa
   ===================================================================== */
.mA{display:grid;gap:22px}
.a-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap}
.a-sobre{display:flex;align-items:center;gap:10px}
.a-total{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(58px,6.4cqw,104px);letter-spacing:-.025em;margin-top:6px;display:block}
.a-meter{margin-top:10px;width:min(520px,100%)}
.a-meter .pista{position:relative;height:6px;border-radius:3px;background:var(--linea)}
.a-meter .pista i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--foco)}
.a-meter .pista em{position:absolute;top:-6px;bottom:-6px;width:1.5px;background:var(--ok)}

/* =====================================================================
   C · RELOJ — claro: el día como una esfera; cada anillo, una tienda
   ===================================================================== */
.mC{display:grid;gap:20px}
.c-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}
.c-cab h1{font-family:'EB Garamond',serif;font-weight:500;font-size:clamp(34px,3.4cqw,48px);line-height:1.05;margin-top:8px;letter-spacing:-.01em}

.c-dial{display:grid;place-items:center;padding:18px}
.c-dial-in{position:relative;width:min(100%,max(320px,calc(var(--alto) - 320px)),720px);aspect-ratio:1}
.c-dial-in>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.c-dial .anl.f{fill:var(--tx)}
.c-dial .pasado{fill:none;stroke:color-mix(in oklab,var(--tinta) 3.5%,transparent)}
.c-dial .aguja line{stroke:var(--tinta);stroke-width:1.6}

.c-dial .aguja[data-a]{transition-duration:1.6s}
.bucle .c-dial .aguja .eco{fill:none;stroke:var(--tinta);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:latidoMapa 2.8s var(--ease) infinite}

/* =====================================================================
   ESTADO
   ===================================================================== */
const S={m:'A',vista:'escritorio',momento:'tarde',periodo:'hoy',foco:'TODAS',vivo:true,bucle:true,rm:false,falla:false,now:1060,sim:0,alerta:null,idea:false,replay:false,rapido:false,vistos:new Set()};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const reducido=()=>S.rm||matchMedia('(prefers-reduced-motion: reduce)').matches;
const ISO=`<svg viewBox="0 0 223 150" fill="none" stroke="#b8412d" stroke-width="9" stroke-linejoin="round" aria-hidden="true"><path d="M3,6 C45,14 95,28 118,50 C134,64 136,96 124,112 C110,130 80,138 47,146 L68,102"/><path d="M3,6 C10,40 40,70 70,80 C85,85 100,87 112,87"/><path d="M104,40 C102,22 118,6 140,5 C155,4 165,10 172,16 L220,12"/><path d="M172,16 C156,22 144,38 134,62"/></svg>`;

/* =====================================================================
   DATOS INVENTADOS (cuadran entre sí)
   Hoy es sábado 3 de octubre. Las tiendas abren 10:00–21:00.
   ===================================================================== */
const ORDEN=['TRU','AQP','LIM'];
const SEDES={
  TRU:{nombre:'Tienda TRU',ciudad:'Trujillo',meta:3000,base:2850,tm:150,tend:.03,lon:-79.03,lat:-8.11},
  AQP:{nombre:'Tienda AQP',ciudad:'Arequipa',meta:2500,base:2400,tm:145,tend:.05,lon:-71.54,lat:-16.41},
  LIM:{nombre:'Tienda LIM',ciudad:'Lima',meta:2500,base:2000,tm:158,tend:.08,lon:-77.04,lat:-12.05}};
const T0=600,T1=1260;           // 10:00 → 21:00
const HOY=59;                   // índice de hoy en el historial de 60 días
// Parte del día que un sábado típico ya vendió a las 9, 10, … 21 h.
const SHARE=[0,0,.04,.10,.19,.30,.40,.50,.61,.72,.82,.91,1];
const share=t=>{const a=540;if(t<=a)return 0;if(t>=1260)return 1;const h=(t-a)/60,i=Math.floor(h),f=h-i;return SHARE[i]+(SHARE[i+1]-SHARE[i])*f};
const FDIA=[1.19,.78,.82,.86,.92,1.08,1.35];   // dom, lun, …, sáb
const GENTE={TRU:['Rosa Quispe','Ana Flores','Diego Ramos'],AQP:['Lucía Mamani','Sofía Torres'],LIM:['Carla Vega','Marco Díaz']};
const SLOTS={TRU:{10:180,11:320,12:410,13:520,14:380,15:450,16:560,17:360},AQP:{10:150,11:260,12:340,13:420,14:300,15:390,16:380,17:220},LIM:{10:60,11:120,12:210,13:260,14:330,15:240,16:380,17:290}};
const TICKETS={TRU:21,AQP:17,LIM:12};
const APERTURA={TRU:592,AQP:605,LIM:620};
const TONOS=[['#e7dccb','#d9c9b0'],['#ece2d4','#ddd0bc'],['#dfe2dc','#c9cfc4'],['#dde1e6','#c7ced6'],['#e9dfd6','#d8c6b8']];
const PRENDAS=[{n:'Polo Básico',c:'Arena',precio:39,ini:'PB',tono:0,hoy:11},{n:'Blusa Lucía',c:'Blanco',precio:90,ini:'BL',tono:1,hoy:9},{n:'Jean Baggy',c:'Azul claro',precio:99,ini:'JB',tono:3,hoy:7},{n:'Vestido Mar',c:'Esmeralda',precio:129,ini:'VM',tono:2,hoy:5},{n:'Blazer Sol',c:'Beige',precio:159,ini:'BZ',tono:4,hoy:3},{n:'Bailarina Alba',c:'Coral',precio:79,ini:'BA',tono:0,hoy:2}];
const COLA=[{sede:'LIM',p:3,q:1},{sede:'TRU',p:1,q:2},{sede:'AQP',p:2,q:1},{sede:'LIM',p:0,q:3},{sede:'TRU',p:4,q:1},{sede:'AQP',p:5,q:1},{sede:'LIM',p:1,q:1},{sede:'TRU',p:0,q:2}];
const ALERTAS=[
  {k:'aperturas',niv:'urg',n:5,ic:'dolar',t:'Aperturas con diferencia',por:{TRU:2,AQP:2,LIM:1},edad:7,ir:'Caja ▸ Aperturas por revisar'},
  {k:'regularizar',niv:'urg',n:31,ic:'etiqueta',t:'Prendas por regularizar',por:{TRU:14,AQP:9,LIM:8},edad:6,ir:'Prendas sin registrar'},
  {k:'traslados',niv:'hoy',n:2,ic:'flecha',t:'Traslados',por:{TRU:1,LIM:1},edad:1,ir:'Inventario ▸ Traslados'},
  {k:'apartados',niv:'hoy',n:1,ic:'marca',t:'Apartado por vencer',por:{AQP:1},edad:6,ir:'Ventas ▸ Apartados'},
  {k:'facturas',niv:'semana',n:3,ic:'doc',t:'Facturas por vencer',por:null,edad:2,ir:'Compras ▸ Por pagar'},
  {k:'fotos',niv:'semana',n:12,ic:'camara',t:'Fotos que faltan',por:{TRU:5,AQP:4,LIM:3},edad:4,ir:'Catálogo ▸ Fotos que faltan'},
  {k:'sunat',niv:'ok',n:0,ic:'sunat',t:'SUNAT al día',ir:'Ventas ▸ Comprobantes'},
  {k:'devoluciones',niv:'ok',n:0,ic:'cambio',t:'Devoluciones al día',ir:'Posventa ▸ Devoluciones'}];
const NIVEL_COLOR={urg:'var(--urg)',hoy:'var(--warn)',semana:'var(--info)',ok:'var(--ok)'};

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 60 días por sede: venta y tickets de cada día cerrado (hoy se calcula aparte, en vivo).
function genHist(){const r=rng(9031),H={};
  for(const s of ORDEN){const d=SEDES[s];H[s]=[];
    for(let i=0;i<60;i++){const dow=((6-(HOY-i))%7+7)%7;
      const v=Math.round(d.base*FDIA[dow]*(1+(r()-.5)*.24)*(1+d.tend*(i-30)/30)/10)*10;
      H[s].push({v,t:Math.max(1,Math.round(v/(d.tm*(1+(r()-.5)*.1))))})}}
  // el sábado pasado, fijo, para que la comparación de hoy sea limpia
  H.TRU[HOY-7]={v:4250,t:28};H.AQP[HOY-7]={v:3190,t:22};H.LIM[HOY-7]={v:2400,t:15};
  return H}
const HIST=genHist();
function generarVentas(apert){
  const r=rng(20261003),out=[];let id=0;
  for(const s of ORDEN){
    if(!apert[s])continue;
    const sl=SLOTS[s],hs=Object.keys(sl).map(Number),tot=hs.reduce((a,h)=>a+sl[h],0),extra=TICKETS[s]-hs.length;
    const raw=hs.map(h=>extra*sl[h]/tot),k=raw.map(x=>1+Math.floor(x));
    raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).slice(0,TICKETS[s]-k.reduce((a,b)=>a+b,0)).forEach(([,i])=>k[i]++);
    hs.forEach((h,i)=>{const n=k[i],w=Array.from({length:n},()=>.55+r()),sw=w.reduce((a,b)=>a+b,0);
      const desde=Math.max(h*60,apert[s]+3),hasta=Math.min(h*60+59,1059),ts=Array.from({length:n},()=>Math.round(desde+r()*(hasta-desde))).sort((a,b)=>a-b);
      let resto=sl[h];for(let j=0;j<n;j++){const m=j===n-1?resto:Math.round(sl[h]*w[j]/sw);resto-=m;
        out.push({id:'v'+(id++),sede:s,t:ts[j],monto:m,prendas:Math.max(1,Math.min(4,Math.round(m/85))),quien:GENTE[s][Math.floor(r()*GENTE[s].length)]})}});
  }
  return out.sort((a,b)=>a.t-b.t)}
function escenario(m){
  const tarde=m==='tarde';
  const abiertas=tarde?{TRU:592,AQP:605,LIM:620}:{TRU:572,AQP:null,LIM:null};
  return {abiertas,ventas:tarde?generarVentas(abiertas):[],unid:PRENDAS.map(p=>tarde?p.hoy:0),nid:100,
    turno:tarde?{TRU:3,AQP:2,LIM:2}:{TRU:2,AQP:0,LIM:0}};
}
let DIA=escenario('tarde');

/* =====================================================================
   CÁLCULOS: una sede (o toda CAYLA) en un periodo
   ===================================================================== */
const sum=(a,f)=>a.reduce((s,x)=>s+(f?x[f]:x),0);
const fechaDe=i=>{const d=new Date(2026,9,3);d.setDate(d.getDate()-(HOY-i));return d};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DSEM=['D','L','M','M','J','V','S'];
function calc(F,P=S.periodo){
  const ss=F==='TODAS'?ORDEN:[F],sh=share(S.now);
  const vh=DIA.ventas.filter(v=>ss.includes(v.sede)&&v.t<=S.now);
  const hoyV=sum(vh,'monto'),hoyT=vh.length,hoyP=sum(vh,'prendas'),metaD=ss.reduce((a,s)=>a+SEDES[s].meta,0);
  const dia=i=>i===HOY?hoyV:ss.reduce((a,s)=>a+HIST[s][i].v,0),tk=i=>i===HOY?hoyT:ss.reduce((a,s)=>a+HIST[s][i].t,0);
  const r={F,ss,metaD,abiertas:ss.filter(s=>DIA.abiertas[s]&&DIA.abiertas[s]<=S.now).length,turno:ss.reduce((a,s)=>a+DIA.turno[s],0)};
  if(P==='hoy'){
    const lwF=dia(HOY-7);
    Object.assign(r,{n:1,total:hoyV,tickets:hoyT,prendas:hoyP,meta:metaD,prev:lwF*sh,
      slots:Array.from({length:11},(_,i)=>sum(vh.filter(v=>Math.floor(v.t/60)===10+i),'monto')),
      fant:Array.from({length:11},(_,i)=>lwF*(SHARE[i+2]-SHARE[i+1])),
      etq:Array.from({length:11},(_,i)=>{const h=10+i;return h===12?'12':String(h>12?h-12:h)}),
      cur:Math.max(0,Math.min(10,Math.floor(S.now/60)-10)),
      // carrera: % de la meta del día acumulado, un punto por hora; lo que viene después de «ahora» se junta en «ahora»
      acum:Array.from({length:12},(_,i)=>{const t=Math.min(T0+60*i,S.now);return [(t-T0)/(T1-T0),sum(vh.filter(v=>v.t<=t),'monto')/metaD*100]}),
      ideal:Array.from({length:12},(_,i)=>[i/11,share(T0+60*i)*100]),xNow:Math.max(0,(S.now-T0)/(T1-T0))});
  }else{

function dialHTML(){
  const cs=Object.fromEntries(ORDEN.map(s=>[s,calc(s)])),n=cs.TRU.slots.length,span=(ANG1-ANG0)/n;
  const mx=Math.max(...ORDEN.flatMap(s=>cs[s].slots.map((v,i)=>Math.max(v,cs[s].fant[i]))),1);
  const anillos={TRU:[236,50],AQP:[176,50],LIM:[116,50]};
  let barras='';
  ORDEN.forEach(s=>{const [r0,band]=anillos[s],c=cs[s],f=esFoco(s),w=Math.max(2.5,Math.min(16,(2*Math.PI*(r0+band/2)*span/360)*.34));
    c.slots.forEach((v,i)=>{const a=ANG0+span*(i+.5),[x0,y0]=polar(r0,a),[x1,y1]=polar(r0+band,a);const gv=c.fant[i]/mx,vv=v/mx;
      const lab=S.periodo==='hoy'?`${hora12((10+i)*60)}`:(()=>{const d=fechaDe(HOY-n+1+i);return `${d.getDate()} ${MES[d.getMonth()]}`})();
      barras+=`<line class="rb g" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${w.toFixed(1)}" pathLength="1" style="stroke-dasharray:${gv.toFixed(3)} 1"/>`;
      barras+=`<line class="rb v ${f?'f':''} ${i===c.cur?'cur':''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${w.toFixed(1)}" pathLength="1" onclick="enfocar('${s}')" data-tip="DIAL:${s}:${lab}:${Math.round(v)}" ${A('db-'+s+'-'+i,{'stroke-dasharray':`${vv.toFixed(3)} 1`},{'stroke-dasharray':'0 1'},500+i*(n>12?18:60)+ORDEN.indexOf(s)*120)}/>`})});
  const etiquetasAn=ORDEN.map(s=>{const [r0,band]=anillos[s],[x,y]=polar(r0+band/2,ANG0-4);return `<text class="anl ${S.foco===s?'f':''}" x="${(x-4).toFixed(1)}" y="${(y+6).toFixed(1)}" onclick="enfocar('${s}')">${s} ${fmtP(cs[s].pct)}</text>`}).join('');
  const horas=S.periodo==='hoy'?[10,12,14,16,18,20,21].map(h=>{const a=ANG0+span*(h-10),[x,y]=polar(300,a);return `<text class="hora" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${h===12?'12':h>12?h-12:h}</text>`}).join(''):cs.TRU.etq.map((t,i)=>{if(!t)return '';const a=ANG0+span*(i+.5),[x,y]=polar(300,a);return `<text class="hora" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${t}</text>`}).join('');
  const marcas=Array.from({length:n+1},(_,i)=>{const a=ANG0+span*i,[x0,y0]=polar(286,a),[x1,y1]=polar(292,a);return `<line class="marca" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`}).join('');
  const hoyP=S.periodo==='hoy',fr=hoyP?Math.max(0,Math.min(1,(S.now-T0)/(T1-T0))):1,angAhora=ANG0+(ANG1-ANG0)*fr;
  const tot=calc(S.foco),pct=Math.min(100,tot.pct);
  return `<div class="c-dial-in">
    <svg viewBox="-320 -320 640 640" aria-label="Ventas por ${hoyP?'hora':'día'} y por tienda">
      ${hoyP?`<circle class="pasado" r="200" stroke-width="186" pathLength="100" transform="rotate(${ANG0-90})" ${A('pas',{'stroke-dasharray':`${(fr*300/360*100).toFixed(2)} 100`},{'stroke-dasharray':'0 100'},400)}/>`:''}
      ${marcas}${horas}${barras}${etiquetasAn}
      <g class="centro-an"><circle r="98" stroke="var(--linea)" stroke-width="3"/><circle r="98" pathLength="100" stroke="${tot.pct>=100?'var(--ok)':'var(--foco)'}" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" ${A('cpa',{'stroke-dasharray':`${pct.toFixed(2)} 100`},{'stroke-dasharray':'0 100'},600)}/></g>
      ${hoyP?`<g class="aguja" ${A('agu',{transform:`rotate(${angAhora.toFixed(2)}deg)`},{transform:`rotate(${ANG0}deg)`},400)}><line x1="0" y1="-104" x2="0" y2="-290"/><circle cy="-290" r="4"/><circle class="eco" cy="-290" r="4"/></g>`:''}
    </svg>
    <div class="c-centro" style="${tot.total>=100000?'--esc:.74':tot.total>=10000?'--esc:.88':''}"><span class="lbl">${nombreFoco(S.foco)}</span>${O('tot',tot.total)}<small><b>${K('pct',tot.pct,'p')}</b> de la meta</small></div>
  </div>`;
}
function dumbbellHTML(){const cs=ORDEN.map(s=>calc(s)),mx=Math.max(...cs.map(c=>Math.max(c.total,c.prev)),1)*1.08;
  return `<div class="db">${cs.map((c,i)=>{const a=c.prev/mx*100,b=c.total/mx*100;return `<div class="db-f" data-tip="DB:${c.F}"><span>${c.F}</span><span class="pista"><i class="une ${b<a?'baja':''}" ${A('du-'+c.F,{left:Math.min(a,b).toFixed(1)+'%',width:Math.abs(b-a).toFixed(1)+'%'},{left:a.toFixed(1)+'%',width:'0%'},500+i*120)}></i><i class="ant" style="left:${a.toFixed(1)}%"></i><i class="act" ${A('dd-'+c.F,{left:b.toFixed(1)+'%'},{left:a.toFixed(1)+'%'},500+i*120)}></i></span><span class="v">${c.delta===null?'—':K('dv-'+c.F,c.delta,'v')}</span></div>`}).join('')}</div>`}
function lollipopHTML(){const cs=ORDEN.map(s=>calc(s)),t=calc('TODAS'),mx=Math.max(...cs.map(c=>c.medio||0),1)*1.15;
  return `<div class="lp">${cs.map((c,i)=>{const w=(c.medio||0)/mx*100;return `<div class="lp-f ${esFoco(c.F)?'f':''}"><span>${c.F}</span><span class="pista"><i ${A('lpi-'+c.F,{width:w.toFixed(1)+'%'},{width:'0%'},400+i*110)}></i><em ${A('lpe-'+c.F,{left:w.toFixed(1)+'%'},{left:'0%'},400+i*110)}></em>${t.medio?`<span class="prom" style="left:${(t.medio/mx*100).toFixed(1)}%"></span>`:''}</span><span class="v">${c.medio?fmtS(c.medio):'—'}</span></div>`}).join('')}</div>`}
function edadesHTML(){const ab=S.alerta;
  return `<div class="edades">${ALERTAS.filter(a=>a.niv!=='ok').map(a=>{if(ab===a.k)return `<div class="ed ancho ${a.niv}" style="${vt(a.k)}">${detalleHTML(a)}</div>`;const r=a.niv==='ok'?1:Math.min(1,(a.edad||1)/7);
    return `<button class="ed ${a.niv}" style="${vt(a.k)}" onclick="abrirAlerta('${a.k}')" data-tip="AL:${a.k}"><span class="an"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" stroke="var(--linea)"/><circle cx="30" cy="30" r="26" pathLength="100" stroke="${NIVEL_COLOR[a.niv]}" ${A('ea-'+a.k,{'stroke-dasharray':`${(r*100).toFixed(1)} 100`},{'stroke-dasharray':'0 100'},300)}/></svg>${ic(a.ic)}</span>${a.niv==='ok'?'':`<b>${K('en-'+a.k,a.n,'n')}</b>`}<span class="t">${a.t}</span>${a.niv==='ok'?'':`<small>${a.edad} ${a.edad===1?'día':'días'} esperando</small>`}</button>`}).join('')}${alDia('ed')}</div>`}
MAQ.C={nombre:'C · Reloj',oscuro:false,
  idea:'El día como una esfera de reloj. Cada anillo es una tienda (TRU afuera, LIM adentro) y cada rayo, una hora: su largo es lo que vendió. La sombra detrás de cada rayo es el periodo anterior y la aguja marca la hora. A la derecha, tres comparaciones entre tiendas y abajo, lo que hay que revisar.',
  mov:['Los rayos crecen hora por hora, anillo por anillo, y la aguja barre hasta ahora mientras la zona del día ya vivido se sombrea.','En el centro, el total rueda como odómetro y el anillo de meta se cierra.','Al cambiar a 7 o 30 días, la esfera pasa a tener un rayo por día.','Las comparaciones (puesto, antes y ahora, ticket medio) crecen y se deslizan; el ranking se reordena con un deslizamiento.','Cuando llega una venta, crece el rayo de esa hora y la aguja avanza.','«Repetir el día» hace girar la aguja de 10:00 a ahora mientras los rayos crecen.','El círculo de cada aviso se llena según cuánto lleva esperando; al tocarlo se abre en su lugar.'],
  bucle:'el eco de la punta de la aguja y el punto de las tiendas abiertas.',
  pinta(){
    const tit=S.periodo==='hoy'?'El día de CAYLA':S.periodo==='7d'?'La semana de CAYLA':'El mes de CAYLA';
    return `<div class="m mC">
    <header class="c-cab ent" style="--i:0"><div><span class="lbl">${saludo()}, Felipe · ${periodoTxt()}</span><h1>${tit}</h1></div>${controles()}</header>
    <div class="c-main">
      <section class="tj luz c-dial ent" style="--i:1">${dialHTML()}</section>
      <div class="c-side">
        <section class="tj luz ent" style="--i:2"><div class="tcab"><span class="lbl">Ranking · % de la meta</span></div>${rankingHTML()}</section>
        <section class="tj luz ent" style="--i:3"><div class="tcab"><span class="lbl">Antes y ahora · ${vsTxt()}</span><span class="lbl" style="color:var(--tx3)">○ antes ● ahora</span></div>${dumbbellHTML()}</section>
        <section class="tj luz ent" style="--i:4"><div class="tcab"><span class="lbl">Ticket medio</span><span class="lbl" style="color:var(--tx3)">┊ CAYLA</span></div>${lollipopHTML()}</section>
        <section class="tj luz ent" style="--i:5"><div class="tcab"><span class="lbl">Taller</span></div>${tallerHTML()}</section>
      </div>
    </div>
    <section class="${rev(0)}"><div class="tcab"><span class="lbl">Por revisar</span></div>${edadesHTML()}</section>
  </div>`}};

/* =====================================================================
   TOOLTIP (uno solo, para HTML y SVG)
   ===================================================================== */
function mostrarTip(html,x,y){const t=$('#tip'),app=$('#app');if(!t||!app)return;const r=app.getBoundingClientRect();t.innerHTML=html;t.classList.add('on');
  const w=t.offsetWidth,h=t.offsetHeight;let lx=x-r.left+14,ly=y-r.top-h-12;if(lx+w>r.width-8)lx=x-r.left-w-14;if(ly<8)ly=y-r.top+16;t.style.left=lx+'px';t.style.top=ly+'px'}
function ocultarTip(){const t=$('#tip');t&&t.classList.remove('on')}
function textoTip(k){
  const [tipo,a,b,c]=k.split(':');
  if(ORDEN.includes(k)){const x=calc(k);return `<b>${fmtS(x.total)}</b> · ${SEDES[k].nombre}<br>${fmtP(x.pct)} de ${fmtS(x.meta)} · ${x.tickets} tickets<br>Ticket medio ${x.medio?fmtS(x.medio):'—'} · ${x.delta===null?'sin comparación':fmtV(x.delta)+' '+vsTxt()}<br>${DIA.turno[k]} en turno`}
  if(k==='TALLER')return `<b>Taller</b><br>4 órdenes en curso · 1 atrasada`;
  if(tipo==='AL'){const al=ALERTAS.find(x=>x.k===a);return `<b>${al.n||'✓'}</b> ${al.t}${al.por?'<br>'+ORDEN.filter(s=>al.por[s]).map(s=>`${s} ${al.por[s]}`).join(' · '):''}<br><span style="opacity:.7">Toca para ver</span>`}
  if(tipo==='BAR'){const x=calc(a),i=+b;const et=S.periodo==='hoy'?`${hora12((10+i)*60)}`:(()=>{const d=fechaDe(HOY-x.n+1+i);return `${d.getDate()} ${MES[d.getMonth()]}`})();return `<b>${fmtS(x.slots[i])}</b> · ${a} · ${et}<br><span style="opacity:.7">Antes: ${fmtS(x.fant[i])}</span>`}
  if(tipo==='DIAL')return `<b>${fmtS(+c.split(':').pop()||0)}</b> · ${a}`;
  if(tipo==='DB'){const x=calc(a);return `<b>${fmtS(x.total)}</b> ahora · ${a}<br>${fmtS(x.prev)} ${vsTxt().replace('vs ','')}`}
  return '';
}

/* =====================================================================
   ACCIONES
   ===================================================================== */
function enfocar(s){if(S.foco===s)return;S.foco=s;pintar(false)}
function ponerPeriodo(p){if(S.periodo===p||S.replay)return;S.periodo=p;pintar(false)}
function reintentar(){S.falla=false;barra();pintar(false)}
function irA(destino){avisar(`Llevaría a ${destino}`)}
function avisar(txt){const c=$('#toasts');if(!c)return;const t=document.createElement('div');t.className='toast';t.innerHTML=`${ic('check','s')}<span>${txt}</span>`;c.appendChild(t);setTimeout(()=>{t.classList.add('sale');setTimeout(()=>t.remove(),260)},2600)}
function llegaVenta(){
  if(S.replay)return;
  const ab=ORDEN.filter(s=>DIA.abiertas[s]&&DIA.abiertas[s]<=S.now);if(!ab.length){avisar('Ninguna tienda abrió caja todavía');return}
  if(S.now>=T1-2){avisar('Las tiendas ya cerraron');return}
  const q=COLA[S.sim%COLA.length];S.sim++;const sede=ab.includes(q.sede)?q.sede:ab[S.sim%ab.length];
  S.now=Math.min(T1-2,S.now+2+(S.sim%3));const pr=PRENDAS[q.p],monto=pr.precio*q.q;
  DIA.ventas.push({id:'v'+(DIA.nid++),sede,t:S.now,monto,prendas:q.q,quien:GENTE[sede][S.sim%GENTE[sede].length]});DIA.unid[q.p]+=q.q;
  pintar(false);
  if(!reducido())$$(`[data-pulso="${sede}"]`).forEach(g=>{if(g.tagName==='g'){const c=g.querySelector('.nodo');if(!c)return;const o=document.createElementNS('http://www.w3.org/2000/svg','circle');o.setAttribute('class','onda');o.setAttribute('cx',c.getAttribute('cx'));o.setAttribute('cy',c.getAttribute('cy'));o.setAttribute('r',parseFloat(getComputedStyle(c).r)||10);g.appendChild(o);setTimeout(()=>o.remove(),1700)}else{g.animate([{boxShadow:'0 0 0 0 color-mix(in oklab,var(--ok) 45%,transparent)'},{boxShadow:'0 0 0 14px transparent'}],{duration:1200,easing:'ease-out'})}});
}
// «Repetir el día»: la hora corre de 10:00 a ahora en ~7 s y todo se re-asienta en cada paso.
let repT=null;
function repetirDia(){
  if(S.periodo!=='hoy')return;
  if(S.replay){window.__finRep&&window.__finRep();return}
  const real=S.now;S.replay=true;S.rapido=true;S.alerta=null;$('#app').classList.add('rapido');ocultarTip();
  S.now=Math.min(572,real);pintar(false);
  const paso=Math.max(3,Math.round((real-S.now)/62));
  repT=setInterval(()=>{S.now=Math.min(real,S.now+paso);pintar(false);if(S.now>=real)fin()},110);
  function fin(){clearInterval(repT);S.now=real;S.replay=false;S.rapido=false;$('#app').classList.remove('rapido');pintar(false)}
  window.__finRep=fin;
}
let vivoT=null;
function programarVivo(){clearInterval(vivoT);if(S.vivo)vivoT=setInterval(()=>{if(!document.hidden&&!S.replay)llegaVenta()},9000)}

/* =====================================================================
   BARRA DEL SPIKE, «LA IDEA» Y MONTAJE
   ===================================================================== */
function barra(){
  const seg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button class="${S[k]===v?'on':''}" onclick="cambia('${k}','${v}')">${t}</button>`).join('')}</div>`;
  const chk=(k,t)=>`<label><input type="checkbox" ${S[k]?'checked':''} onchange="alternar('${k}',this.checked)" style="accent-color:var(--rojo)"> ${t}</label>`;
  $('#spk').innerHTML=`<span class="tag">Spike v2 · Inicio del Admin</span>
  ${seg('m',[['A','A · Observatorio'],['B','B · Carrera'],['C','C · Reloj']])}
  ${seg('vista',[['escritorio','Todo el ancho'],['tablet','Tablet 834'],['celular','Celular 375']])}
  ${seg('momento',[['manana','9:40 a. m.'],['tarde','5:40 p. m.']])}
  ${chk('vivo','Ventas en vivo')}${chk('bucle','Movimiento continuo')}${chk('rm','Movimiento reducido')}${chk('falla','Falla una lectura')}
  <button class="acc lleno" onclick="llegaVenta()">+ Llega una venta</button>
  <button class="acc" onclick="pintar(true)">↺ Ver la entrada otra vez</button>
  <button class="acc" onclick="verIdea()">ⓘ La idea de ${S.m}</button>`;
  medir();
}
function cambia(k,v){
  if(S.replay&&window.__finRep)window.__finRep();
  S[k]=v;
  if(k==='momento'){DIA=escenario(v);S.now=v==='tarde'?1060:580;S.sim=0;S.alerta=null;S.vistos=new Set()}
  barra();if(k==='vista'||k==='m'){S.alerta=null;montar();if(S.idea)ideaHTML()}else pintar(true);
}
function alternar(k,v){S[k]=v;if(k==='vivo')programarVivo();if(k==='bucle'||k==='rm'){const a=$('#app');a.classList.toggle('bucle',S.bucle);a.classList.toggle('rm',S.rm);pintar(true)}if(k==='falla')pintar(false)}
function verIdea(){S.idea=!S.idea;ideaHTML();$('#idea').classList.toggle('abierta',S.idea)}
function ideaHTML(){const M=MAQ[S.m];$('#idea').innerHTML=`<button class="cerrar" onclick="verIdea()" aria-label="Cerrar">${ic('x','s')}</button>
  <span class="lbl" style="color:var(--taupe)">La idea</span><h2>${M.nombre}</h2><p style="margin-top:8px">${M.idea}</p>
  <h3>Movimiento</h3><ul>${M.mov.map(x=>`<li>${x}</li>`).join('')}</ul>
  <p class="ojo"><b>En bucle</b> (solo con «Movimiento continuo»): ${M.bucle} La regla de movimiento (ADR-0136) solo admite bucles que sean señal; si se elige así, queda escrito como excepción.</p>
  <h3>Prueba esto</h3><ul>
    <li><b>Hoy · 7 días · 30 días</b>: todo se recalcula y cambia de forma, sin volver a entrar.</li>
    <li><b>Toda CAYLA · TRU · AQP · LIM</b>, o tocar una tienda: esa queda en tinta y las demás pasan a segundo plano.</li>
    <li><b>▶ Repetir el día</b> (en «Hoy»): el día pasa de 10:00 a ahora en 7 segundos.</li>
    <li>Toca un aviso de «Por revisar»: se abre en su lugar con un gráfico chico.</li>
    <li>«+ Llega una venta», o deja «Ventas en vivo» (una cada 9 s).</li>
    <li>Pasa el mouse por las tiendas, las barras y los rayos: cada uno dice su cifra.</li>
    <li>«Falla una lectura»: el Taller dice que no pudo leer, en vez de mostrar 0.</li></ul>
  <h3>Igual en las tres</h3><ul>
    <li>Sin «Vender» ni cajas por abrir: el Admin mira, no opera.</li>
    <li>Una sola fila de filtros arriba (periodo y tienda) que manda sobre toda la pantalla.</li>
    <li>Énfasis en vez de un color por tienda: la elegida en tinta, las demás en segundo plano, siempre con su nombre al lado.</li>
    <li>Rojo solo para lo urgente; verde, ámbar y pizarra solo como estado y con su texto.</li></ul>`}
function medir(){const s=$('#spk');if(s)document.documentElement.style.setProperty('--spk',s.offsetHeight+'px');const a=$('#app');if(a)a.style.setProperty('--alto',a.clientHeight+'px')}
function montar(){
  const esc=$('#esc');esc.className='escena'+(S.vista==='escritorio'?'':' dev');
  const nav=[['inicio','Inicio',1],['pulso','Salud del negocio'],['bolsa','Ventas'],['caja3d','Inventario'],['capas','Catálogo'],['camion','Compras'],['cartera','Finanzas'],['premio','Clientes'],['barras','Rendimiento']];
  esc.innerHTML=`<div class="disp ${S.vista}"><div class="marco ${MAQ[S.m].oscuro?'oscuro':''} ${S.bucle?'bucle':''} ${S.rm?'rm':''}" id="app">
    <aside class="lat"><div class="logo">${ISO}</div><nav>${nav.map(([i,t,on])=>`<a class="${on?'on':''}" title="${t}" onclick="${on?'':`irA('${t}')`}">${ic(i)}</a>`).join('')}</nav><span class="yo" title="Felipe Alvarez">FA</span></aside>
    <div class="col" id="col">
      <header class="barra">
        <button class="ico m-only" aria-label="Menú" onclick="irA('el menú lateral (cajón)')">${ic('menu')}</button>
        <span class="m-only" style="height:22px">${ISO.replace('<svg','<svg style="height:22px;width:auto"')}</span>
        <button class="ico d-only" aria-label="Plegar menú">${ic('panel')}</button>
        <button class="buscar d-only" onclick="irA('Buscar')">${ic('lupa','s')} Buscar… <kbd>Ctrl</kbd><kbd>K</kbd></button>
        <div class="der"><button class="ico m-only" aria-label="Buscar">${ic('lupa')}</button><a class="act d-only" onclick="irA('Actividad')">${ic('historia','s')} Actividad</a><button class="sede" onclick="avisar('La vista de toda la empresa (CAYLA Global, ADR-0275)')">CAYLA Global ${ic('abajo','s')}</button></div>
      </header>
      <main class="cont" id="cont"></main>
    </div>
    <div class="toasts" id="toasts"></div><div class="tip" id="tip" role="tooltip"></div>
  </div></div>`;
  const app=$('#app');
  // luz que sigue al puntero, inclinación 3D y tooltip: un solo oyente para todo
  app.addEventListener('pointermove',e=>{
    const l=e.target.closest('.luz');if(l){const r=l.getBoundingClientRect();l.style.setProperty('--mx',e.clientX-r.left+'px');l.style.setProperty('--my',e.clientY-r.top+'px')}
    const t=e.target.closest('.inclina');if(t&&!reducido()&&!S.rapido){const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*7).toFixed(2)}deg) translateZ(0)`}
    const d=e.target.closest('[data-tip]');if(d&&!e.target.closest('.capa')){const h=textoTip(d.getAttribute('data-tip'));if(h)mostrarTip(h,e.clientX,e.clientY)}else if(!e.target.closest('.capa'))ocultarTip();
  });
  app.addEventListener('pointerout',e=>{const t=e.target.closest('.inclina');if(t&&!t.contains(e.relatedTarget))t.style.transform=''},true);
  app.addEventListener('pointerleave',ocultarTip);
  medir();pintar(true);
}
window.addEventListener('resize',medir);
barra();montar();programarVivo();
</script>
