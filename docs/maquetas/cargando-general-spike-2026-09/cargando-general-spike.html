<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cargando general · spike visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Loader general de navegación (2026-09-21)
   Hoy: al elegir una opción del menú no pasa NADA visible hasta que
   Next monta `(app)/loading.tsx`, que es un «Cargando…» de 11 px. Con la
   base lenta parece que el clic no se registró.

   Tres capas, de menos a más ruido — cada una entra SOLO si la espera lo pide:
     1. Al instante (0 ms): hilo rojo bajo la cabecera + la fila del menú «se toma».
        Es la respuesta al clic. Siempre. Si la carga es rápida, es lo único que se ve.
     2. A los 250 ms: el contenido pasa a la silueta de la pantalla (esqueleto) y,
        según la variante, una señal de «cargando <sección>». 250 ms evita el
        parpadeo de las cargas rápidas.
     3. A los 4 s: la señal admite que está tardando (igual que el aviso de sede).

   Reglas (ADR-0136): sin rebote, nada decorativo, lo único en bucle es la señal
   de «estoy trabajando». Todo se apaga con prefers-reduced-motion.
   Tokens = los de globals.css. NO es una implementación.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf6ec;--taupe-p:#805c4c;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t10:rgba(26,26,24,.10);--t07:rgba(26,26,24,.07);--t04:rgba(26,26,24,.04);
  --ease:cubic-bezier(.32,.72,.24,1);--ease-out:cubic-bezier(.4,0,1,1);
  --lat:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.disp{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.tab{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}

/* ---------- panel de control del spike (no es parte del ERP) ---------- */
.ctl{position:relative;z-index:80;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;padding:10px 20px;background:var(--tinta);color:#f5f0e8;font-size:13px}
.ctl b{font-weight:600;margin-right:8px;color:#e8e0d0}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:13px;color:rgba(245,240,232,.7)}
.seg button[aria-pressed=true]{background:var(--papel);color:var(--tinta)}
.ctl .hint{margin-left:auto;color:rgba(245,240,232,.6);font-size:12px}

/* ---------- el ERP en miniatura ---------- */
.app{position:relative;min-height:calc(100vh - 90px)}
.lateral{position:absolute;top:0;bottom:0;left:0;width:var(--lat);background:var(--papel);border-right:1px solid var(--t10);padding:22px 12px;z-index:40}
.lateral .marca{display:flex;align-items:center;gap:10px;padding:0 10px 20px}
.lateral .marca img{height:28px;width:auto}
.lateral .marca span{font-size:26px;letter-spacing:.02em}
.riel{position:absolute;left:0;width:2px;height:36px;background:var(--rojo);border-radius:2px;transition:transform .3s var(--ease),opacity .2s}
.fila{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--t65);text-align:left;transition:background .2s var(--ease),color .2s}
.fila:hover{background:var(--t04);color:var(--tinta)}
.fila svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fila[aria-current=page]{color:var(--tinta);font-weight:600}
/* Capa 1b · la fila «se toma»: el icono se cambia por un arco que gira. Es la
   respuesta MÁS cercana al dedo/mouse: aparece en el mismo cuadro del clic. */
.fila .arco{display:none;width:18px;height:18px;flex:none}
.fila .arco circle{fill:none;stroke-width:2}
.fila .arco .p{stroke:var(--sand)}
.fila .arco .g{stroke:var(--rojo);stroke-linecap:round;stroke-dasharray:22 66;transform-origin:50% 50%;animation:gira .9s linear infinite}
.fila.pendiente{color:var(--tinta);background:rgba(184,65,45,.08);cursor:progress}
.fila.pendiente svg.ic{display:none}
.fila.pendiente .arco{display:block}

.cab{position:absolute;top:0;left:var(--lat);right:0;height:56px;z-index:30;background:rgba(245,240,232,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--t10);display:flex;align-items:center;justify-content:flex-end;padding:0 32px}
.pastilla{border:1px solid var(--sand);border-radius:6px;background:var(--papel);padding:7px 10px;text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}

/* Capa 1a · el hilo: vive pegado al borde inferior de la cabecera. Avanza rápido y
   se frena cerca del 85 %, porque no sabemos cuánto falta — al llegar los datos
   salta a 100 % y se va. Nunca retrocede y nunca «termina solo». */
.hilo{position:absolute;left:0;right:0;bottom:-1px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
.hilo i{display:block;height:100%;width:100%;background:var(--rojo);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 8px rgba(184,65,45,.45)}
.hilo.on{opacity:1}
.hilo.on i{animation:avanza 12s cubic-bezier(.08,.6,.2,1) forwards}
.hilo.fin{opacity:0;transition:opacity .3s var(--ease) .12s}
.hilo.fin i{animation:none;transform:scaleX(1);transition:transform .15s linear}
@keyframes avanza{0%{transform:scaleX(0)}100%{transform:scaleX(.86)}}

main{margin-left:var(--lat);padding:92px 40px 60px;position:relative}
.pag{max-width:920px;margin:0 auto}
.pag h1{font-size:42px;line-height:1.05;letter-spacing:-.01em}
.pag .sub{margin-top:6px;color:var(--t65);font-size:14px}
.pag .cabecera{margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--papel);border:1px solid var(--sand);border-radius:12px;padding:16px 18px}
.kpi .n{font-size:38px;line-height:1;margin-bottom:6px}
.kpi .e{font-size:12px;color:var(--t65)}
.tabla{background:var(--papel);border:1px solid var(--sand);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 110px 90px;gap:12px;padding:13px 18px;border-top:1px solid var(--t07);align-items:center;font-size:14px}
.tr:first-child{border-top:0}
.tr span:last-child{text-align:right}
.llega > *{animation:cascada .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*55ms)}
@keyframes cascada{from{opacity:0;transform:translate3d(0,10px,0)}}

/* La pantalla vieja mientras se decide: queda, atenuada y sin recibir clics
   (en el ERP real Next la mantiene hasta montar loading.tsx). */
.pag.espera{opacity:.55;pointer-events:none;transition:opacity .25s var(--ease)}

/* Capa 2 · silueta. Mismas medidas que la pantalla real → al llegar nada salta. */
.sk{display:block;border-radius:5px;background:var(--t10);animation:resp 1.5s ease-in-out infinite}
@keyframes resp{50%{opacity:.5}}
.silueta{animation:aparece .3s var(--ease) both}
.silueta .cabecera .sk:nth-child(1){height:11px;width:64px;margin-bottom:12px}
.silueta .cabecera .sk:nth-child(2){height:38px;width:280px;margin-bottom:12px}
.silueta .cabecera .sk:nth-child(3){height:12px;width:360px;max-width:100%}
.silueta .kpi .sk:nth-child(1){height:11px;width:70px;margin-bottom:14px}
.silueta .kpi .sk:nth-child(2){height:32px;width:110px;margin-bottom:10px}
.silueta .kpi .sk:nth-child(3){height:10px;width:90px}
.silueta .tr .sk{height:13px}
@keyframes aparece{from{opacity:0}to{opacity:1}}

/* Capa 2 · la señal de «cargando <sección>».
   V2 «Silueta»: una línea con el arco y el nombre, arriba de la silueta — discreta.
   V3 «Tarjeta»: hoja central con isotipo, como el aviso de sede pero SIN velo ni bloqueo
   (navegar no es cambiar de datos de otra tienda: no hay riesgo de leer cifras equivocadas). */
.senal{display:none}
.v-silueta .senal.s1{display:flex}
.v-tarjeta .senal.s2{display:flex}
.s1{align-items:center;gap:10px;margin-bottom:18px;color:var(--taupe-p);animation:aparece .3s var(--ease) both}
.s1 svg{width:16px;height:16px;flex:none}
.s1 circle{fill:none;stroke-width:2.2}
.s1 .p{stroke:var(--sand)}
.s1 .g{stroke:var(--rojo);stroke-linecap:round;stroke-dasharray:22 66;transform-origin:50% 50%;animation:gira .9s linear infinite}
.s1 .tx{font-size:13px}
.s1 .tx b{font-weight:600;color:var(--tinta)}
.s2{position:absolute;left:0;right:0;top:130px;justify-content:center;z-index:10;pointer-events:none}
.hoja{width:min(340px,calc(100% - 32px));background:var(--papel);border-radius:20px;padding:22px 24px 20px;box-shadow:0 22px 44px -22px rgba(80,50,20,.5);outline:1px solid var(--t07);text-align:center;position:relative;overflow:hidden;animation:hoja .42s var(--ease) both}
.rueda{position:relative;width:60px;height:60px;margin:0 auto 12px;display:grid;place-items:center}
.rueda img{width:32px;height:auto}
.rueda svg{position:absolute;inset:0;width:100%;height:100%}
.rueda circle{fill:none;stroke-width:2}
.rueda .p{stroke:var(--sand)}
.rueda .g{stroke:var(--rojo);stroke-linecap:round;stroke-dasharray:46 137;transform-origin:50% 50%;animation:gira 1.1s linear infinite}
.hoja .lbl{color:var(--taupe-p)}
.hoja .nom{font-size:26px;line-height:1.15;margin-top:6px}
.hoja .tx2{margin-top:6px;font-size:13px;color:var(--t65)}
.hoja .barra{position:absolute;inset:auto 0 0 0;height:2px;overflow:hidden}
.hoja .barra i{display:block;height:100%;width:33%;background:var(--rojo);animation:barrido 1.1s linear infinite}
@keyframes hoja{from{opacity:0;transform:translate3d(0,18px,0) scale(.965)}to{opacity:1;transform:none}}
@keyframes barrido{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes gira{to{transform:rotate(360deg)}}
/* Capa 3 */
.tarda{color:var(--rojo-p)}

/* Registro: lo que el spike ve pasar, para que se lea la línea de tiempo */
.reg{position:fixed;right:16px;bottom:16px;z-index:70;width:250px;background:var(--tinta);color:#e8e0d0;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.6;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.reg h4{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#a47865;margin-bottom:4px}
.reg div{display:flex;justify-content:space-between;gap:10px;opacity:.35;transition:opacity .2s}
.reg div.hecho{opacity:1}
.reg div.hecho b{color:#e8956f}
.reg b{font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:820px){
  :root{--lat:0px}
  .lateral{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  main{padding:88px 16px 60px}.cab{padding:0 16px}
  .reg{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hilo.on i{animation:none;transform:scaleX(.6)}
  .fila .arco .g,.s1 .g,.rueda .g,.hoja .barra i{animation:none}
  .sk{animation:none}
  .llega > *,.silueta,.hoja,.s1{animation:none}
}
</style>
</head>
<body>

<div class="ctl">
  <span><b>Qué tan lenta está la base</b>
    <span class="seg" id="segVel">
      <button data-v="200" aria-pressed="false">Rápida · 0,2 s</button>
      <button data-v="1500" aria-pressed="true">Normal · 1,5 s</button>
      <button data-v="7000" aria-pressed="false">Lenta · 7 s</button>
    </span></span>
  <span><b>Señal de la espera</b>
    <span class="seg" id="segVar">
      <button data-v="hilo" aria-pressed="false">1 · Solo hilo</button>
      <button data-v="silueta" aria-pressed="true">2 · Silueta + línea</button>
      <button data-v="tarjeta" aria-pressed="false">3 · Silueta + tarjeta</button>
    </span></span>
  <span class="hint">Haz clic en cualquier opción del menú</span>
</div>

<div class="app" id="app">
  <aside class="lateral">
    <div class="marca"><img src="cayla-isotipo.png" alt=""><span class="disp">CAYLA</span></div>
    <nav id="nav" style="position:relative"></nav>
  </aside>

  <header class="cab">
    <span class="pastilla">Tienda Lima</span>
    <div class="hilo" id="hilo"><i></i></div>
  </header>

  <main>
    <div id="zona" class="v-silueta"></div>
  </main>
</div>

<aside class="reg" id="reg" aria-hidden="true">
  <h4>Línea de tiempo del clic</h4>
  <div data-k="0"><span>Hilo + fila «tomada»</span><b>0 ms</b></div>
  <div data-k="1"><span>Silueta de la pantalla</span><b>250 ms</b></div>
  <div data-k="2"><span>«Está tardando…»</span><b>4 s</b></div>
  <div data-k="3"><span>Llegan los datos</span><b id="regFin">—</b></div>
</aside>

<script>
const ICONOS={
  inicio:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  vender:'<path d="M5 7h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  inv:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  compras:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  caja:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  mov:'<path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/>'
};
const SECCIONES=[
  {id:'inicio',   n:'Inicio',      sub:'Cómo va tu tienda hoy.',                 k:['Ventas de hoy','Tickets','Ticket promedio','Por atender'], v:['S/ 4 820','37','S/ 130','3'], f:['Resumen del día','Cierre de caja pendiente','Traslado por recibir','Meta semanal']},
  {id:'vender',   n:'Vender',      sub:'Catálogo y ticket en un solo lugar.',     k:['Boletas hoy','Facturas','Apartados','Descuentos'], v:['31','6','4','S/ 210'], f:['Polo Pima · Negro','Vestido Lino · Arena','Chaqueta Alpaca · Gris','Bufanda Baby · Rojo']},
  {id:'inv',      n:'Inventario',  sub:'Existencias de la sede.',                 k:['Prendas','Variantes','Stock bajo','Sin stock'], v:['1 284','312','18','4'], f:['Polo Pima · S','Polo Pima · M','Vestido Lino · M','Chaqueta Alpaca · L','Bufanda Baby · Única']},
  {id:'compras',  n:'Compras',     sub:'Comprobantes, por pagar y recibidas.',    k:['Por pagar','Vencen 7 días','Del mes','Recibidas'], v:['S/ 12 340','S/ 3 100','S/ 28 900','14'], f:['F001-2231 · Textil Sur','F001-2230 · Botones SAC','B003-118 · Hilos Andes','F002-0912 · Etiquetas Perú']},
  {id:'caja',     n:'Caja',        sub:'Apertura, movimientos y cierre.',         k:['Efectivo','Yape / Plin','Tarjeta','Diferencia'], v:['S/ 1 950','S/ 1 210','S/ 1 660','S/ 0'], f:['Apertura 09:00','Venta B003-1241','Retiro a banco','Venta B003-1242']},
  {id:'mov',      n:'Movimientos', sub:'Todo lo que entró y salió del stock.',    k:['Hoy','Ventas','Traslados','Ajustes'], v:['58','37','9','2'], f:['Venta · Polo Pima M','Traslado · Lima → AQP','Ajuste · Conteo','Recepción · Lote 88']}
];
const $=s=>document.querySelector(s);
const nav=$('#nav'), zona=$('#zona'), hilo=$('#hilo');

let actual='inv', vel=1500, variante='silueta';
let pendiente=null;        // {id, timers[]}

// ---- menú ----
const ALTO=40, GAP=2;
nav.innerHTML='<span class="riel" id="riel"></span>'+SECCIONES.map(s=>
  `<button class="fila" data-id="${s.id}" style="margin-top:${GAP}px">
     <svg class="ic" viewBox="0 0 24 24">${ICONOS[s.id]}</svg>
     <svg class="arco" viewBox="0 0 24 24"><circle class="p" cx="12" cy="12" r="9"/><circle class="g" cx="12" cy="12" r="9"/></svg>
     <span>${s.n}</span></button>`).join('');
function marcarActual(){
  nav.querySelectorAll('.fila').forEach(b=>{ if(b.dataset.id===actual) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const i=SECCIONES.findIndex(s=>s.id===actual);
  $('#riel').style.transform=`translateY(${i*(ALTO+GAP)+GAP+2}px)`;
}

// ---- páginas ----
function pagina(s,llega){
  return `<div class="pag ${llega?'llega':''}">
    <div class="cabecera" style="--k:0"><div class="lbl" style="color:var(--taupe-p);margin-bottom:8px">${s.n}</div><h1 class="disp">${s.n}</h1><p class="sub">${s.sub}</p></div>
    <div class="kpis" style="--k:1">${s.k.map((k,i)=>`<div class="kpi"><div class="n disp tab">${s.v[i]}</div><div class="e">${k}</div></div>`).join('')}</div>
    <div class="tabla" style="--k:2">${s.f.map((f,i)=>`<div class="tr"><span>${f}</span><span class="tab" style="color:var(--t65)">${(i*7+12)%40+3} u.</span><span class="tab">S/ ${(i*37+59)%300+40}</span></div>`).join('')}</div>
  </div>`;
}
function silueta(s){
  return `<div class="pag silueta">
    <div class="cabecera"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
    <div class="kpis">${[0,1,2,3].map(()=>`<div class="kpi"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>`).join('')}</div>
    <div class="tabla">${[92,74,88,61,83].map(w=>`<div class="tr"><span class="sk" style="width:${w}%"></span><span class="sk" style="width:60px"></span><span class="sk" style="width:60px;justify-self:end"></span></div>`).join('')}</div>
  </div>`;
}
const arcoMini='<svg viewBox="0 0 24 24"><circle class="p" cx="12" cy="12" r="9"/><circle class="g" cx="12" cy="12" r="9"/></svg>';
function senales(s){
  return `<div class="senal s1" role="status">${arcoMini}<span class="tx">Cargando <b>${s.n}</b>…<span class="tarda" id="tarda"></span></span></div>
  <div class="senal s2" role="status"><div class="hoja">
    <div class="rueda"><img src="cayla-isotipo.png" alt=""><svg viewBox="0 0 64 64"><circle class="p" cx="32" cy="32" r="29"/><circle class="g" cx="32" cy="32" r="29"/></svg></div>
    <div class="lbl">Cargando</div><div class="nom disp">${s.n}</div>
    <div class="tx2" id="tarda2">Trayendo los datos de la sede…</div>
    <div class="barra"><i></i></div></div></div>`;
}

// ---- registro ----
const reg=[...document.querySelectorAll('#reg div')];
const regFin=$('#regFin');
function regReset(){reg.forEach(d=>d.classList.remove('hecho'));regFin.textContent='—'}
function regMarca(k){reg[k].classList.add('hecho')}

// ---- hilo ----
function hiloIniciar(){
  hilo.classList.remove('fin','on'); void hilo.offsetWidth;
  hilo.querySelector('i').style.transition='';
  hilo.classList.add('on');
}
function hiloTerminar(){
  hilo.classList.remove('on'); hilo.classList.add('fin');
  setTimeout(()=>hilo.classList.remove('fin'),600);
}

// ---- navegar ----
function limpiar(){ if(pendiente){pendiente.timers.forEach(clearTimeout); nav.querySelector(`.fila[data-id="${pendiente.id}"]`)?.classList.remove('pendiente'); pendiente=null;} }

function ir(id){
  if(id===actual && !pendiente) return;
  limpiar(); regReset();
  const s=SECCIONES.find(x=>x.id===id);
  const t0=performance.now();
  pendiente={id,timers:[]};
  const T=(fn,ms)=>pendiente.timers.push(setTimeout(fn,ms));

  // Capa 1 — al instante
  nav.querySelector(`.fila[data-id="${id}"]`).classList.add('pendiente');
  hiloIniciar(); regMarca(0);
  zona.querySelector('.pag')?.classList.add('espera');

  // Capa 2 — a los 250 ms, solo si sigue esperando
  if(variante!=='hilo'){
    T(()=>{
      zona.className='v-'+variante;
      zona.innerHTML=(variante==='silueta'?senales(s):'')+silueta(s)+(variante==='tarjeta'?senales(s):'');
      regMarca(1);
    },250);
  } else { T(()=>regMarca(1),250); }

  // Capa 3 — a los 4 s
  T(()=>{
    const a=$('#tarda'), b=$('#tarda2');
    if(a) a.textContent=' Está tardando más de lo normal, un momento…';
    if(b) b.textContent='Está tardando más de lo normal, un momento…';
    regMarca(2);
  },4000);

  // Llegan los datos
  T(()=>{
    const ms=Math.round(performance.now()-t0);
    hiloTerminar();
    nav.querySelector(`.fila[data-id="${id}"]`).classList.remove('pendiente');
    actual=id; marcarActual();
    zona.className='v-'+variante;
    zona.innerHTML=pagina(s,true);
    regMarca(3); regFin.textContent=ms+' ms';
    pendiente=null;
  },vel);
}

nav.addEventListener('click',e=>{const b=e.target.closest('.fila'); if(b) ir(b.dataset.id)});
function seg(id,cb){
  const el=$(id);
  el.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); cb(b.dataset.v)});
}
seg('#segVel',v=>{vel=+v});
seg('#segVar',v=>{variante=v; zona.className='v-'+v});

marcarActual();
zona.className='v-'+variante;
zona.innerHTML=pagina(SECCIONES.find(s=>s.id===actual),false);
</script>
</body>
</html>
