<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprobantes conectado · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   DEMO COMPARATIVO · Comprobantes conectado, computadora y celular
   (2026-09-26). Sirve para ELEGIR con la barra oscura (no existe en el
   ERP): con qué vista entra quien no es líder, cómo se ordenan las
   acciones en celular y si una proforma se puede apartar. Las dos
   vistas se dibujan juntas y comparten estado: lo que abres en una se
   abre en la otra. Tokens = los de apps/web/app/globals.css (ADR-0169).
   Datos inventados. No toca código del ERP.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);--t06:rgba(26,26,24,.06);
  --ease:cubic-bezier(.32,.72,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:#ddd5c6;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.serif{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--t65)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* barra del demo */
.spk{position:sticky;top:0;z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;font-size:12.5px}
.spk .tit{font-family:'EB Garamond',serif;font-size:19px;margin-right:6px;align-self:center}
.spk .g{display:flex;flex-direction:column;gap:4px}
.spk .g>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;color:rgba(245,240,232,.75);white-space:nowrap}
.seg button+button{border-left:1px solid rgba(245,240,232,.18)}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--tinta);font-weight:600}

.escena{display:grid;grid-template-columns:minmax(0,1fr) 395px;gap:28px;padding:24px;align-items:start}
@media (max-width:1180px){.escena{grid-template-columns:1fr}.marco-tel{justify-self:center;position:static!important}}
.rot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--t65);margin:0 0 8px 4px}
.porque{margin-top:14px;background:var(--papel);border:1px dashed var(--taupe);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--t80)}
.porque b{font-weight:600;color:var(--tinta)}
.porque ul{margin:6px 0 0 18px}.porque li{margin-top:3px}
.porque h4{font-family:'EB Garamond',serif;font-weight:400;font-size:18px;color:var(--tinta);margin-bottom:4px}
.porque .gp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.porque .gp>div{background:var(--crema);border-radius:8px;padding:8px 10px}

/* marco computadora */
.pc{background:var(--crema);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(26,26,24,.35);display:grid;grid-template-columns:210px minmax(0,1fr);height:880px;position:relative}
.pc .side{border-right:1px solid var(--t10);display:flex;flex-direction:column;padding:20px 10px;gap:2px;font-size:14px}
.pc .logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.pc .logo img{height:28px}.pc .logo span{letter-spacing:.26em;font-weight:600;font-size:13px}
.pc .fila{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:8px;color:var(--t80)}
.pc .fila.sub{padding-left:30px;font-size:13.5px}
.pc .fila.act{background:rgba(232,224,208,.8);color:var(--tinta);font-weight:500;box-shadow:inset 2px 0 0 var(--rojo)}
.pc .fila .ic{color:var(--t50)}
.pc .yo{margin-top:auto;border-top:1px solid var(--t10);padding:14px 10px 0;font-size:13px}
.pc .yo small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t65)}
.pc .der{display:flex;flex-direction:column;min-width:0}
.pc .top{height:52px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:12px;padding:0 24px;flex:none}
.pc .top .esp{flex:1}
.chipcab{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);font-size:11px;letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.pc .cuerpo{overflow-y:auto;padding:24px 30px 40px;flex:1}

/* marco celular */
.marco-tel{position:sticky;top:84px}
.tel{width:375px;height:800px;border-radius:40px;border:10px solid #1a1a18;background:var(--crema);overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(26,26,24,.45)}
.tel .top{height:54px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(245,240,232,.95);position:absolute;inset:0 0 auto 0;z-index:5}
.tel .top img{height:22px}.tel .top .esp{flex:1}
.tel .cuerpo{position:absolute;inset:54px 0 0 0;overflow-y:auto;padding:16px 14px 110px}
.tel.con-barra .cuerpo{padding-bottom:96px}
.barra-inf{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--papel);border-top:1px solid var(--sand);display:grid;grid-template-columns:repeat(3,1fr);z-index:6;padding-bottom:8px}
.barra-inf button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--t65)}
.barra-inf button.act{color:var(--tinta);font-weight:600}
.barra-inf button.act .ic{color:var(--rojo)}

/* piezas */
h1{font-family:'EB Garamond',Georgia,serif;font-weight:400;line-height:1.05}
.pc h1{font-size:44px;margin-top:6px}.tel h1{font-size:30px;margin-top:4px}
.hilo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.hilo::before{content:"";width:28px;height:1px;background:var(--taupe)}
.bajada{color:var(--t80);font-size:14px;margin-top:4px;max-width:520px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:99px;padding:2px 10px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-verde{background:rgba(72,96,63,.12);color:var(--verde)}
.c-ambar{background:rgba(116,80,26,.12);color:var(--ambar)}
.c-rojo{background:rgba(184,65,45,.10);color:var(--rojo-p)}
.c-pizarra{background:rgba(76,93,110,.12);color:var(--pizarra)}
.c-sand{background:var(--hueso);color:var(--taupe)}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.btn-p{background:var(--tinta);color:var(--crema)}
.btn-s{border:1px solid var(--sand);background:var(--papel)}
.btn-e{color:var(--rojo);padding:0 6px;height:30px}
.btn-g{height:48px;border-radius:12px;font-size:14.5px}
.tel .btn{height:44px}
.pest{display:inline-flex;gap:2px;padding:4px;border:1px solid var(--sand);border-radius:12px;background:var(--papel);max-width:100%;overflow-x:auto}
.pest button{height:34px;padding:0 14px;border-radius:9px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pest button.act{background:var(--tinta);color:var(--crema);font-weight:500}
.pest .n{font-size:11px;min-width:18px;height:18px;border-radius:99px;background:var(--hueso);color:var(--taupe);display:inline-grid;place-items:center;padding:0 5px}
.pest .act .n{background:rgba(245,240,232,.2);color:var(--crema)}
.buscar{display:flex;align-items:center;gap:10px;height:44px;border:1px solid var(--sand);border-radius:12px;background:var(--papel);padding:0 14px;color:var(--t50);font-size:14px}
.buscar.gr{height:52px;font-size:15px}
.cifras{display:flex;border:1px solid var(--sand);border-radius:14px;background:var(--papel);padding:12px 6px}
.cifras>div{flex:1;text-align:center;padding:0 10px}.cifras>div+div{border-left:1px solid var(--sand)}
.cifras .v{font-family:'EB Garamond',serif;font-size:30px;line-height:1.1}
.cifras .d{font-size:12px;color:var(--t65)}
.tel .cifras .v{font-size:24px}
.nota{background:var(--hueso);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--t80)}
.aviso{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;font-size:13.5px}
.aviso.ambar{background:rgba(116,80,26,.10);color:var(--ambar)}
.aviso b{font-weight:600}
.sec-t{font-family:'EB Garamond',serif;font-size:22px;margin:0 0 2px}
.sec-d{font-size:13px;color:var(--t65)}

/* lista de comprobantes */
.lista .it{display:grid;align-items:center;gap:10px 16px;padding:12px 18px;border-top:1px solid var(--t10);width:100%}
.lista .it:first-child{border-top:0}
.lista .it:hover{background:var(--t06)}
.lista .it.sel{background:rgba(232,224,208,.6)}
.pc .lista .it{grid-template-columns:58px minmax(0,1.5fr) minmax(0,1fr) 100px 130px 104px}
.pc .lista .cab{display:grid;grid-template-columns:58px minmax(0,1.5fr) minmax(0,1fr) 100px 130px 104px;gap:16px;padding:8px 18px;border-bottom:1px solid var(--t10)}
.hora{font-family:'EB Garamond',serif;font-size:18px;line-height:1}
.hora small{display:block;font-family:'DM Sans';font-size:11px;color:var(--t50);margin-top:3px}
.doc{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc b{font-weight:600}
.buscar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tel .pest button{padding:0 11px;font-size:13.5px}
.meta{font-size:12px;color:var(--t65);margin-top:1px}
.monto{font-family:'EB Garamond',serif;font-size:19px;text-align:right}
.acc{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.mini{height:30px;padding:0 10px;border-radius:7px;font-size:12.5px;border:1px solid var(--sand);background:var(--papel);display:inline-flex;align-items:center;gap:6px}
.mini.ic-only{width:30px;padding:0;justify-content:center}
.tel .lista .it{grid-template-columns:minmax(0,1fr) auto;padding:14px 14px;min-height:72px}
.tel .lista .der2{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tel .fila-botones{grid-column:1/-1;display:flex;gap:8px}
.tel .fila-botones .btn{flex:1;height:44px}
.ligado{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--pizarra);background:rgba(76,93,110,.08);border-radius:6px;padding:1px 6px;margin-top:3px}

/* hoja / cajón */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(2px);z-index:20;animation:fade .2s var(--ease)}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--crema);border-radius:22px 22px 0 0;z-index:21;padding:10px 16px 22px;animation:sube .32s var(--ease)}
.hoja .asa{width:40px;height:4px;border-radius:9px;background:var(--t30);margin:0 auto 12px}
.cajon{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--crema);border-left:1px solid var(--sand);z-index:21;overflow-y:auto;padding:22px 24px;animation:entra .3s var(--ease);box-shadow:-20px 0 40px -20px rgba(26,26,24,.25)}
@keyframes sube{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes entra{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.velo,.hoja,.cajon{animation:none}}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.accion{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--sand);background:var(--papel);font-size:14px;text-align:left}
.accion small{display:block;font-size:11.5px;color:var(--t65);line-height:1.3}
.accion.prim{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.accion.prim small{color:rgba(245,240,232,.7)}
.accion .ic{color:var(--taupe)}.accion.prim .ic{color:var(--crema)}
.accion.ancho{grid-column:1/-1}
.mas{margin-top:12px;border-top:1px solid var(--t10);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--t65)}
.prendas{margin-top:12px}
.prendas .p{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--t10);font-size:13.5px}
.prendas .p span:last-child{font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:10px}
.kv dt{color:var(--t65)}.kv dd{text-align:right}

/* series */
.series{display:grid;gap:12px}
.pc .series{grid-template-columns:repeat(4,minmax(0,1fr))}
.serie{padding:14px 16px}
.serie .cod{font-family:'EB Garamond',serif;font-size:26px;line-height:1.1;margin-top:4px}
.serie .pie{border-top:1px solid var(--t10);margin-top:10px;padding-top:8px;font-size:12.5px;color:var(--t65)}
.falta{border:1px dashed var(--t30);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--t80);display:flex;flex-direction:column;justify-content:center;gap:8px}

/* otros sistemas */
.otros{padding:24px;max-width:1200px;margin:0 auto}
.otros table{width:100%;border-collapse:collapse;background:var(--papel);border:1px solid var(--sand);border-radius:14px;overflow:hidden;font-size:13px}
.otros th,.otros td{text-align:left;padding:9px 12px;border-top:1px solid var(--t10);vertical-align:top}
.otros th{background:var(--hueso);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);border-top:0}
.otros h2{font-family:'EB Garamond',serif;font-weight:400;font-size:30px;margin:0 0 6px}
.otros h3{font-family:'EB Garamond',serif;font-weight:400;font-size:22px;margin:22px 0 8px}
.otros .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.otros .dos{grid-template-columns:1fr}}
.otros .card{padding:14px 18px}
.otros ul{margin-left:18px}.otros li{margin-top:6px;font-size:13.5px}
.otros a{color:var(--pizarra)}
.si{color:var(--verde);font-weight:600}.no{color:var(--rojo-p);font-weight:600}.fut{color:var(--ambar);font-weight:600}
.ya{color:var(--pizarra);font-weight:600}
</style>
</head>

<div class="spk" id="spk"></div>
<div id="raiz"></div>

     ${contenido('pc')}</div></div>
   ${st.sel?detalle('pc'):''}${st.selProf?hojaApartar('pc'):''}</div>`;
}
function tel(){
  const v = vistaActual();
  const barraInf = st.movil==='B' ? `<nav class="barra-inf">${vistasDe().slice(0,3).map(x=>`<button class="${x===v?'act':''}" onclick="set('vista','${x}')">${ic({hoy:'hoy',emitidos:'doc',series:'doc',porenviar:'enviar',proformas:'prof'}[x])}${NOMBRE[x]}</button>`).join('')}</nav>` : '';
  const colabHoy = st.rol==='colab' && st.entrada==='A';
  return `<div class="tel ${st.movil==='B'?'con-barra':''}"><div class="top"><span>${ic('menu')}</span><img src="${LOGO}" alt=""><span class="esp"></span><span class="chipcab" style="height:30px">TRU ▾</span></div>
    <div class="cuerpo">${cabecera('tel')}
      <div style="margin:14px 0 12px;display:flex;flex-direction:column;gap:10px">${colabHoy?buscador('tel',true):''}${pestanas('tel')}${colabHoy?'':buscador('tel')}</div>
      ${contenido('tel')}</div>
    ${barraInf}${st.sel?detalle('tel'):''}${st.selProf?hojaApartar('tel'):''}</div>`;
}

// ── Por qué (bajo cada escena) ─────────────────────────────────
function porque(){
  const E = {
    A:`<h4>1A · «Hoy» para la colaboradora</h4>Entra a lo que usa: los comprobantes de hoy de su sede y un buscador de todos los meses. Series se esconde (solo es del líder); si a una tienda le falta serie, sale un aviso arriba.
       <div class="gp"><div><b>Ganas:</b> 0 toques hasta la boleta de hoy; la búsqueda no depende del mes.</div><div><b>Pagas:</b> dos entradas según rol; «Hoy» + «Emitidos» parecidos para el líder.</div></div>`,
    B:`<h4>1B · Emitidos para todos</h4>Una sola entrada; la lista del mes con filtros. Series sigue visible (solo lectura para la colaboradora).
       <div class="gp"><div><b>Ganas:</b> una sola pantalla que probar; el líder no cambia su costumbre.</div><div><b>Pagas:</b> la colaboradora baja entre boletas del mes para llegar a las de hoy.</div></div>`,
    C:`<h4>1C · Series como hoy</h4>Nada cambia en la entrada; solo mejoran las pestañas.
       <div class="gp"><div><b>Ganas:</b> cero trabajo de rol.</div><div><b>Pagas:</b> en celular, 9 tarjetas que no usa antes de llegar a algo útil.</div></div>`,
  }[st.entrada];
  const M = {
    A:`<h4>2A · Tocar la tarjeta abre una hoja</h4>La fila solo dice qué es, de quién, cuánto y su estado. Al tocarla sube la hoja: WhatsApp a la clienta, PDF, Cambio, Devolución, Imprimir e Historial en botones de 52 px; XML, CDR y Anular van a «Más».
       <div class="gp"><div><b>Ganas:</b> lista limpia y botones grandes; la misma hoja sirve en computadora como cajón.</div><div><b>Pagas:</b> un toque más para lo más común (PDF o WhatsApp).</div></div>`,
    B:`<h4>2B · Barra inferior fija</h4>Como Apartados (PR #482): pestañas abajo, al alcance del pulgar, más la misma hoja por comprobante.
       <div class="gp"><div><b>Ganas:</b> cambiar de vista con el pulgar.</div><div><b>Pagas:</b> choca con ADR-0206 (en celular el menú es el ☰, sin barra de navegación) y resta 72 px de lista.</div></div>`,
    C:`<h4>2C · Botones grandes en cada fila</h4>PDF y WhatsApp visibles en cada tarjeta; lo demás en «⋯».
       <div class="gp"><div><b>Ganas:</b> reenviar sin abrir nada.</div><div><b>Pagas:</b> cada fila mide el doble: caben 4 en pantalla en vez de 7.</div></div>`,
  }[st.movil];
  const P = st.prof==='A'
   ? `<h4>3A · Proforma: Cobrar + Apartar</h4>«Apartar» lleva la proforma a Apartados con sus prendas, su clienta y el precio cotizado; allí se cobra el abono. Prueba el botón en la pestaña Proformas. Una cobrada enlaza a su boleta.
      <div class="gp"><div><b>Ganas:</b> el ciclo cotizar → separar → cobrar sin volver a escanear.</div><div><b>Pagas:</b> Apartados tiene que aceptar <code>?proforma=</code> (hoy acepta <code>?prendas=</code>); decidir qué pasa si el stock ya no alcanza.</div></div>`
   : `<h4>3B · Proforma: solo Cobrar</h4>Como hoy. La cobrada sí enlaza a su boleta.
      <div class="gp"><div><b>Ganas:</b> nada nuevo que construir.</div><div><b>Pagas:</b> la clienta que cotizó y quiere separar se vuelve a armar a mano en Apartados.</div></div>`;
  return `<div class="porque">${E}</div><div class="porque">${M}</div><div class="porque">${P}</div>
   <div class="porque"><h4>Lo que va en todas las opciones</h4><ul>
   <li><b>Ver la venta</b> desde cada comprobante (cajón en computadora, hoja en celular): prendas, pago, vendedora y sede.</li>
   <li><b>Cambio y Devolución</b> desde un comprobante aceptado, con la boleta ya buscada en Posventa.</li>
   <li><b>WhatsApp al número de la clienta</b>; si no hay número, se pide y se guarda.</li>
   <li><b>Nota de crédito ↔ devolución ↔ boleta:</b> prueba B004-000029 («Tiene NC01…») y NC01-000001 («Corrige…»).</li>
   <li><b>«Por reintentar» pasa a «Por enviar»</b> y muestra también las boletas que nunca se intentaron (hoy hay 3 así en producción que la pantalla no muestra).</li>
   <li>Las series dicen <b>«7 emitidos · va en el 37»</b> en vez de «32 números usados».</li></ul></div>`;
}

// ── Otras empresas (se llena con la investigación) ─────────────
const H = {
  shopRec:'https://help.shopify.com/en/manual/sell-in-person/shopify-pos/receipt-management/managing-receipts',
  shopOrd:'https://help.shopify.com/en/manual/sell-in-person/shopify-pos/order-management',

  sqRec:'https://squareup.com/help/us/en/article/6139-print-receipts',
  sqRef:'https://squareup.com/help/us/en/article/6116-process-refunds',
  sqBus:'https://squareup.com/help/us/en/article/5145-transaction-search',
  lsHist:'https://x-series-support.lightspeedhq.com/hc/en-us/articles/25534095402907-Using-the-sales-history',
  lsPrint:'https://x-series-support.lightspeedhq.com/hc/en-us/articles/25534036856219-Printing-or-emailing-sales-receipts',
  nfWa:'https://www.nubefact.com/blog/nubefact/como-enviar-un-comprobante-de-pago-por-whatsapp',

  alRes:'https://ayuda.alegra.com/per/estado-de-tus-resumenes-diarios-de-boletas',
  bsNc:'https://ayuda.bsale.com.pe/support/solutions/articles/151000016782',

  bsDesp:'https://ayuda.bsale.com.pe/support/solutions/articles/151000212744',
  sqDep:'https://squareup.com/help/us/en/article/6581-request-deposits-with-square-invoices',
};
const a = (k,t)=>`<a href="${H[k]}" target="_blank" rel="noopener">${t}</a>`;
function otros(){
  const filas = [
    ['Reenviar el comprobante al contacto guardado (WhatsApp/correo)', `${a('shopRec','Shopify POS')} · ${a('sqRec','Square')} · ${a('nfWa','Nubefact')} (solo si SUNAT ya aceptó) · ${a('alWa','Alegra')}`, 'Hoy WhatsApp sale <b>sin número</b>', '<span class="si">Implementar</span> (WhatsApp a la clienta)'],
    ['Cambio / devolución desde el comprobante', `${a('shopOrd','Shopify POS')} · ${a('sqRef','Square')} · ${a('lsHist','Lightspeed')} · ${a('bsPos','Bsale')}`, 'No hay: se copia el número a mano', '<span class="si">Implementar</span>'],
    ['Ver la venta desde el comprobante', 'Shopify, Square, Lightspeed: el recibo <i>es</i> el detalle de la venta', 'No hay (el detalle existe en Historial y Caja)', '<span class="si">Implementar</span>'],
    ['Buscar por clienta o número sin depender del mes', `${a('shopBus','Shopify')} (con rango de fechas) · ${a('sqBus','Square')} (solo el último año)`, 'Solo el mes cargado', '<span class="si">Implementar</span> (y por DNI: ninguno lo confirma, es ventaja nuestra)'],
    ['Imprimir de nuevo (ticket o A4)', `${a('sqRec','Square')} · ${a('lsPrint','Lightspeed')} · Bsale`, 'PDF de Lucode; ticket 80 mm solo al cobrar', '<span class="si">Implementar</span> «Imprimir de nuevo»'],
    ['Estado SUNAT simple por comprobante', `${a('alEst','Alegra')} (Aceptada / En proceso / Rechazada) · Nubefact (✓ o ✗)`, 'Ya lo tiene (chips)', '<span class="ya">Ya está</span>'],
    ['Aviso de comprobantes sin enviar', `${a('alRes','Alegra')} (fechas pendientes) · Nubefact «Monitoreo › Consistencia»`, 'Hay aviso, pero <b>no ve los que nunca se intentaron</b>', '<span class="si">Corregir</span> («Por enviar»)'],
    ['Cotización → venta o → apartado', `Alegra (a factura con un clic) · ${a('sqDep','Square')} (abonos en factura) · Lightspeed (layaway)`, 'Cobrar sí; Apartar no', '<span class="si">Implementar</span> «Apartar» (decide Felipe)'],
    ['Nota de crédito ligada al original', `${a('bsNc','Bsale')} (y se usa como pago en otra venta) · Alegra`, 'Existe en la base, no se ve', '<span class="si">Implementar</span> el enlace'],
    ['Descarga masiva XML/PDF para el contador', 'Bsale (ZIP de 25) · Nubefact (Excel por fecha)', 'No hay', '<span class="fut">Futuro</span>: en Finanzas › Impuestos, no aquí'],
    ['Filtro por vendedora y sede', 'Square (solo en el panel web) · Shopify (sede propia por defecto, otras con permiso)', 'Filtro de tienda sí; vendedora no', '<span class="si">Mostrar</span> la vendedora en la fila; filtro, después'],
    ['Enviar cotización con enlace de pago', 'Shopify «Email cart»', 'No hay pasarela', '<span class="fut">Futuro</span> (sin pasarela no aplica)'],
    ['Guía de remisión', `${a('bsDesp','Bsale')}: módulo aparte «Despacho»`, 'No hay', '<span class="no">No aquí</span>: va en Traslados'],
  ];
  return `<div class="otros"><h2>Qué hacen otros sistemas con sus comprobantes</h2>
   <p class="sec-d" style="max-width:760px">Tres POS de retail (Shopify, Square, Lightspeed) y tres facturadores SUNAT (Nubefact, Alegra, Bsale), revisados en sus centros de ayuda el 2026-09-26. La idea que se repite: <b>el comprobante vive dentro de la venta</b>. Desde ahí se reenvía, se devuelve y se reimprime. Los papeles técnicos (XML, CDR, resúmenes diarios) quedan fuera de la vista de la vendedora.</p>
   <table style="margin-top:16px"><thead><tr><th>Función</th><th>Quién la tiene</th><th>CAYLA hoy</th><th>Qué hacemos</th></tr></thead>
   <tbody>${filas.map(f=>`<tr>${f.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>
   <div class="dos" style="margin-top:20px">
    <div class="card"><h3 style="margin-top:0">Implementamos</h3><ul>
     <li><b>WhatsApp a la clienta</b>, solo con el comprobante aceptado (como Nubefact).</li>
     <li><b>Cambio y Devolución dentro del comprobante</b> (Shopify, Square, Lightspeed, Bsale).</li>
     <li><b>Ver la venta</b>: el comprobante abre su venta.</li>
     <li><b>Búsqueda de todos los meses</b> por número, nombre o DNI, con la sede propia por defecto.</li>
     <li><b>«Por enviar»</b> con lo que nunca se intentó, y el aviso solo para el líder (como Alegra y Nubefact).</li>
     <li><b>Proforma → Apartar</b>, si Felipe lo aprueba (Lightspeed y su <i>layaway</i>).</li>
     <li><b>Imprimir de nuevo</b> el ticket.</li></ul></div>
    <div class="card"><h3 style="margin-top:0">Quitamos de la vista de la vendedora</h3><ul>
     <li><b>XML y CDR como enlaces en cada fila</b>: pasan a «Más». En Alegra y Bsale son cosa del administrador, no de la caja.</li>
     <li><b>Series como pantalla de entrada</b> para quien no es líder: queda en solo lectura o se esconde.</li>
     <li><b>«El día de pasar a la SUNAT real»</b>: solo lo ve el líder.</li>
     <li>No sumamos: resumen diario, guía de remisión ni enlace de pago (sin pasarela).</li></ul></div>
   </div>
   <p class="sec-d" style="margin-top:14px"><b>Sin verificar:</b> los filtros exactos del historial de Lightspeed (la página respondió 403); si Bsale reenvía por WhatsApp; si alguno busca por DNI o RUC; y si Shopify o Square tienen apartados nativos en tienda. Defontana y Siigo no se revisaron.</p></div>`;
}


function dibujar(){
  document.getElementById('spk').innerHTML = barra();
  if (st.pantalla==='otros') { document.getElementById('raiz').innerHTML = otros(); return; }
  document.getElementById('raiz').innerHTML = `<div class="escena"><div><div class="rot">Computadora · ${st.rol==='colab'?'colaboradora':'líder'}</div>${pc()}${porque()}</div>
    <div class="marco-tel"><div class="rot">Celular · 375 px</div>${tel()}<p class="sec-d" style="margin:10px 4px;max-width:375px">Toca una boleta para abrir sus acciones. Prueba B004-000034 (sin enviar) y B004-000029 (con nota de crédito).</p></div></div>`;
}
dibujar();
