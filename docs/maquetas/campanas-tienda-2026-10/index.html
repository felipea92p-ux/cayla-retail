<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campañas de la tienda web · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · Campañas de la tienda web (2026-10-20)
   Tienda web ▸ Campañas (módulo nuevo en el ERP) + cómo se ve la tienda durante la campaña.
   ERP = tokens de apps/web/app/globals.css (ADR-0169, claro y oscuro). Tienda = apps/tienda/app/globals.css («A · Muro»).
   TODOS los datos (campañas, cifras, precios, fechas) son de EJEMPLO; las fotos de las prendas son las de la portada pública.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);
--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t10:rgba(245,240,232,.1);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.m{width:20px;height:20px}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.serif{font-family:'EB Garamond',serif;font-weight:500}
@keyframes sube{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}}@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
/* ---- barra de la maqueta (no es parte del diseño) ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk select{height:30px;border-radius:8px;border:1px solid rgba(245,240,232,.25);background:#171614;color:#f5f0e8;padding:0 8px;font-size:12.5px}
.escena{padding:16px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ley{max-width:1180px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t80)}.ley b{font-weight:600}
.ley .ej{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--hueso);font-size:11px;color:var(--taupe);font-weight:600}
.ctl{max-width:1180px;width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--t80)}
.ctl .grp{display:inline-flex;gap:0;border:1px solid var(--sand);border-radius:999px;overflow:hidden;background:var(--papel)}
.ctl .grp button{height:30px;padding:0 13px;font-size:12.5px}.ctl .grp button.on{background:var(--tinta);color:var(--crema);font-weight:600}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.marco,.sx>.tel{margin:0 auto}
.marco{container-type:inline-size;flex:none;position:relative;overflow:hidden;background:var(--crema);box-shadow:0 30px 60px -30px var(--sombra)}
.marco.desk{width:1180px;height:780px;border-radius:14px;border:1px solid var(--t30)}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px var(--sombra);flex:none}
.marco.cel{width:375px;height:796px;border-radius:39px}
.pant{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
/* ---- botones, chips, campos (ERP) ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:13.5px;transition:background .2s,transform .2s,border-color .2s}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.chico{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.enl{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe);font-size:13px}.enl:hover{color:var(--rojo-p)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.r{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 12%,transparent)}.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}.chip.nodot::before{display:none}
.nota{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80);display:flex;gap:9px;align-items:flex-start}.nota>.ic{margin-top:2px;color:var(--taupe)}
.nota.ok{background:color-mix(in srgb,var(--verde) 12%,transparent)}.nota.am{background:color-mix(in srgb,var(--ambar) 13%,transparent)}
/* ---- cabecera de pantalla (EncabezadoPagina) ---- */
.lid{padding:22px 28px 90px;max-width:1180px;margin:0 auto}
.enc{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.enc-s{display:flex;align-items:center;gap:10px;color:var(--taupe)}.enc-s .hilo{width:34px;height:1px;background:var(--taupe);opacity:.6}.enc-s .t{color:var(--t65)}
.vol{width:34px;height:34px;border-radius:50%;border:1px solid var(--t30);display:grid;place-items:center;color:var(--tinta)}.vol:hover{background:var(--hueso)}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:8px}
.enc p{color:var(--t65);margin-top:4px;max-width:640px}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.cifra{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:14px 16px}
.cifra small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.cifra b{display:block;font-family:'EB Garamond',serif;font-size:34px;line-height:1.1;font-weight:500;margin-top:4px}.cifra span{font-size:12.5px;color:var(--t65)}
.tarjeta{background:var(--papel);border:1px solid var(--sand);border-radius:16px;overflow:hidden;margin-top:16px}
.tarjeta .tb{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--sand);flex-wrap:wrap}
.pil{display:inline-flex;gap:6px;flex-wrap:wrap}.pil button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;font-weight:500}
.pil button:hover{background:var(--hueso)}.pil button.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.th,.tr{display:grid;grid-template-columns:minmax(0,2.3fr) 90px 80px 130px 120px 112px;gap:14px;align-items:center;padding:12px 16px}
.th{background:var(--crema);border-bottom:1px solid var(--sand);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t65);padding-top:9px;padding-bottom:9px}
.tr{border-bottom:1px solid var(--sand);transition:background .2s;animation:entra .4s var(--ease) both;cursor:pointer}.tr:last-child{border:0}.tr:hover{background:var(--crema)}
.tr .nm{display:flex;gap:12px;align-items:center;min-width:0}.tr .nm b{display:block;font-weight:600}.tr .nm small{display:block;color:var(--t65);font-size:12px}
.mini{width:42px;height:42px;border-radius:10px;flex:none;position:relative;overflow:hidden;border:1px solid var(--t10)}
.mini i{position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-radius:50%}
.mini.sin{background:var(--hueso);display:grid;place-items:center;color:var(--t50)}
.num{font-variant-numeric:tabular-nums}
/* línea del tiempo */
.tl{padding:14px 16px 16px}
.tl-m{display:grid;grid-template-columns:31fr 30fr 31fr;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t65);margin-left:150px}
.tl-m span{border-left:1px solid var(--sand);padding-left:8px}
.tl-f{display:flex;align-items:center;height:34px;position:relative}
.tl-f>small{width:150px;flex:none;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tl-p{position:relative;flex:1;height:100%}
.tl-p b{position:absolute;top:7px;height:20px;border-radius:6px;border:1px solid var(--t30);font-size:10.5px;font-weight:700;display:grid;place-items:center;overflow:hidden;white-space:nowrap}
.tl-hoy{position:absolute;top:22px;bottom:14px;width:2px;background:var(--rojo);z-index:2}
.tl-hoy::before{content:"HOY";position:absolute;top:-17px;left:-12px;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--rojo-p)}
/* ---- editor ---- */
.ed{display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.stp{background:var(--papel);border:1px solid var(--sand);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.stp.open{border-color:var(--t30)}.stp.blq{opacity:.55}
.stp>header{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.stp>header .n{width:26px;height:26px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;transition:background .3s,color .3s}
.stp.hecho>header .n{background:var(--verde);color:var(--crema)}.stp.ahora>header .n{background:var(--tinta);color:var(--crema)}
.stp>header b{font-weight:600;font-size:14.5px;display:block}.stp>header small{display:block;color:var(--t65);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.stp>header .tx{flex:1;min-width:0}
.stp .cuerpo{padding:2px 16px 16px;animation:entra .35s var(--ease) both}
.stp.ahora{box-shadow:0 0 0 3px color-mix(in srgb,var(--tinta) 9%,transparent)}
.pls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);transition:border-color .2s,background .2s,transform .2s}
.pl:hover{background:var(--hueso);transform:translateY(-1px)}.pl.on{border-color:var(--tinta);background:var(--papel);box-shadow:0 0 0 1px var(--tinta)}
.pl .m{height:54px;border-radius:8px;display:flex;align-items:flex-end;justify-content:space-between;padding:7px 9px;margin-bottom:6px;overflow:hidden;position:relative}
.pl .m b{font:500 15px 'Archivo';font-variation-settings:'wdth' 125;text-transform:uppercase;letter-spacing:.02em}.pl .m i{width:14px;height:14px;border-radius:50%;align-self:flex-start}
.pl>b{font-weight:600;font-size:13px}.pl>small{color:var(--t65);font-size:11.5px;line-height:1.3}
.lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t65);margin:14px 0 6px}.lab:first-child{margin-top:4px}
.lab em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--t50)}
.opc{display:flex;flex-wrap:wrap;gap:6px}.opc button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--sand);background:var(--crema);font-size:12.5px;font-weight:500;transition:background .2s}
.opc button:hover{background:var(--hueso)}.opc button.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.pale{display:grid;gap:6px}.pale button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);text-align:left;font-weight:500}
.pale button.on{border-color:var(--tinta);background:var(--papel);box-shadow:0 0 0 1px var(--tinta)}.pale .pt{display:flex;margin-left:auto}.pale .pt i{width:22px;height:22px;border-radius:50%;border:1px solid var(--t30);margin-left:-6px}
.caja{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--sand);border-radius:10px;background:var(--hueso);transition:background .2s,border-color .2s}
.caja:focus-within{background:var(--papel);border-color:var(--tinta)}.caja input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px}.caja .cnt{font-size:11.5px;color:var(--t50);font-variant-numeric:tabular-nums}
.caja input[type=color]{width:26px;height:26px;padding:0;border:0;background:none;flex:none;flex-basis:26px}
.cont{display:grid;gap:5px;margin-top:10px}.cont div{display:flex;align-items:center;gap:8px;font-size:12.5px}.cont div b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.cont .ic{width:15px;height:15px}.cont .ok .ic{color:var(--verde)}.cont .no .ic{color:var(--rojo-p)}.cont .no b{color:var(--rojo-p)}
.fotoel{display:grid;gap:6px}.fotoel button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 11px;border:1px solid var(--sand);border-radius:12px;background:var(--crema);font-size:13px}
.fotoel button.on{border-color:var(--tinta);background:var(--papel);box-shadow:0 0 0 1px var(--tinta)}.fotoel small{display:block;color:var(--t65);font-size:11.5px}
.tgs{display:grid}.tg{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sand)}.tg:last-child{border:0}
.tg .tx{flex:1;min-width:0}.tg b{display:block;font-weight:600;font-size:13.5px}.tg small{display:block;color:var(--t65);font-size:12px;line-height:1.35}
.sw{width:42px;height:24px;border-radius:999px;background:var(--hueso);border:1px solid var(--t30);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--tinta);transition:transform .25s var(--ease)}
.sw.on{background:var(--tinta)}.sw.on::after{transform:translateX(18px);background:var(--crema)}
.pvc{position:sticky;top:0;background:var(--papel);border:1px solid var(--sand);border-radius:16px;overflow:hidden}
.pvt{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--sand)}
.pvt .pil button{height:28px;padding:0 11px;font-size:12px}.pvt .gap{margin-left:auto;display:flex;gap:8px;align-items:center}
.pvhost{position:relative;height:468px;overflow:auto;background:var(--lienzo)}
.pvsz{position:relative;margin:0 auto}.pvsc{position:absolute;left:0;top:0;transform-origin:0 0}
.pie-ed{position:sticky;bottom:0;margin:0 -28px;padding:12px 28px;background:color-mix(in srgb,var(--crema) 94%,transparent);border-top:1px solid var(--sand);display:flex;gap:14px;align-items:center;backdrop-filter:blur(6px);z-index:20}
.pie-ed .fl{flex:1;min-width:0;font-size:13px;color:var(--t80)}.pie-ed .fl button{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe)}
.pie-ed .gd{font-size:12px;color:var(--t65);display:flex;align-items:center;gap:5px}
/* hoja */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.34);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:48px;animation:velo .2s both}
:root[data-tema="oscuro"] .velo{background:rgba(0,0,0,.55)}
.hj{width:520px;max-width:calc(100% - 24px);background:var(--papel);border:1px solid var(--sand);border-radius:22px;padding:22px 24px;animation:sube .38s var(--ease) both;position:relative;max-height:calc(100% - 64px);overflow:auto}
.hj h3{font-family:'EB Garamond',serif;font-weight:500;font-size:25px;line-height:1.15}.hj .baj{font-size:13px;color:var(--taupe);margin-top:3px}
.pie{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.hechos{border:1px solid var(--sand);border-radius:12px;background:var(--crema);overflow:hidden;margin-top:14px}
.hechos div{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--sand);font-size:13px}.hechos div:last-child{border:0}.hechos span{margin-left:auto;font-weight:600;text-align:right}
.hechos div.c{color:var(--t80)}.hechos div.c .ic{color:var(--verde);margin-top:1px}
.hecho-ok{text-align:center;padding:10px 0 2px}.hecho-ok .big{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--verde) 16%,transparent);color:var(--verde);display:grid;place-items:center;margin:0 auto 10px}
.hecho-ok .big svg{width:26px;height:26px;stroke-dasharray:30;animation:dib .6s .1s var(--ease) both}@keyframes dib{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.aviso{position:absolute;right:16px;top:14px;z-index:90;background:var(--tinta);color:var(--crema);padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:9px;align-items:center;animation:sube .35s var(--ease) both;max-width:300px}
/* ====================================================================  TIENDA  (apps/tienda · «A · Muro»)  */
.st{--f:#ecebe7;--p:#f4f3f0;--h:#e1ded7;--s:#cbc7be;--i:#1c1c1a;--tp:#615e57;--r:#9e1d32;--foto:#e1ded7;
 container:st/inline-size;font-family:'Archivo',system-ui,sans-serif;background:var(--f);color:var(--i);position:relative;min-height:100%;font-size:14px;line-height:1.45}
:root[data-tema="oscuro"] .st{--f:#161615;--p:#1f1f1d;--h:#262624;--s:#3a3936;--i:#ecebe7;--tp:#a9a59c;--r:#e47d8d}
.st button{color:inherit}.st *{min-width:0}
.st .nom{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400}
.fr{height:34px;position:relative;overflow:hidden;background:var(--ff,#1c1c1a);color:var(--ft,#ecebe7);font:600 10.5px 'Archivo';letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--t10)}
.fr>span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s var(--ease);white-space:nowrap}
.fr>span.on{opacity:1;transform:none}
.fr.mq .tr{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:48px;white-space:nowrap;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.cab{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:62px;padding:0 40px;border-bottom:1px solid var(--s);background:var(--f)}
.cab nav{display:flex;gap:26px;font:500 12px 'Archivo';letter-spacing:.14em;text-transform:uppercase}

function vHoja(){const c=cur(),d=dd(),P=PLANT[d.plantilla]||{n:'',pal:[]},viva=c.estado==='vivo',amb=d.modo==='imagen'?'Mi imagen · botón '+(d.acento||'#9e1d32'):d.modo==='hoy'?'Como está hoy':P.n+' · '+P.pal[d.paleta].n;
 if(S.hoja==='ok')return`<div class="velo"><div class="hj"><div class="hecho-ok"><div class="big"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div><h3>${viva?'Cambios publicados':'Campaña programada'}</h3><p class="baj">${viva?'La tienda los muestra en menos de un minuto.':`La tienda cambiará sola el ${esc(c.iniL.split(' · ')[0])}. No tienes que acordarte.`}</p></div>
  <div class="pie" style="justify-content:center"><button class="btn sec" data-act="verpriv">${ic('eye','s')}Ver cómo se verá</button><button class="btn" data-act="cerrarok">Listo</button></div></div></div>`;
 return`<div class="velo"><div class="hj" role="dialog" aria-label="Programar"><h3>${viva?'Publicar los cambios':'Programar '+esc(c.n)}</h3><p class="baj">${viva?'Aniversario CAYLA ya está en vivo: los cambios reemplazan lo que ven hoy los clientes.':'La tienda cambia sola cuando empieza la campaña y vuelve a lo normal cuando termina.'}</p>
 <div class="hechos"><div><span style="margin-left:0;font-weight:400;color:var(--t65)">Ambiente</span><span>${amb}</span></div><div><span style="margin-left:0;font-weight:400;color:var(--t65)">Empieza</span><span>${esc(c.iniL)}</span></div><div><span style="margin-left:0;font-weight:400;color:var(--t65)">Termina</span><span>${esc(c.finL)}</span></div><div><span style="margin-left:0;font-weight:400;color:var(--t65)">Tiendas</span><span>Arequipa · Trujillo</span></div><div><span style="margin-left:0;font-weight:400;color:var(--t65)">Descuento</span><span>${MENOS}${c.pct}${NB}% <small style="font-weight:400;color:var(--t65)">· viene de Etiquetas</small></span></div></div>
 <div class="hechos"><div class="c">${ic('check')}Todo el texto se lee bien</div><div class="c">${ic('check')}No se cruza con otra campaña con diseño</div><div class="c">${ic('check')}Con «reducir movimiento» la tienda queda quieta</div></div>
 <div class="nota">${ic('info')}<span>${viva?'Puedes volver al diseño anterior desde el historial de la campaña.':'Hasta esa fecha, la tienda se ve como siempre. Puedes quitar el diseño cuando quieras y la tienda vuelve a lo normal.'}</span></div>
 <div class="pie"><button class="btn sec" data-act="cerrarhoja">Cancelar</button><button class="btn" data-act="programar">${viva?'Publicar cambios':'Programar'}</button></div></div></div>`}
function vTienda(){const c=cur(),d=dd(),ctrl=`<div class="ctl"><span>Fecha de hoy en la tienda:</span><div class="grp">${[['antes','Antes · '+(c.id==='aniv'?'10 oct':'22 nov')],['vivo','En vivo'],['ultimo','Último día'],['despues','Terminó']].map(([k,n])=>`<button class="${S.fase===k?'on':''}" data-act="fase" data-v="${k}">${n}</button>`).join('')}</div><span>Pieza:</span><div class="grp">${[['portada','Portada'],['catalogo','Catálogo'],['bolsa','Bolsa']].map(([k,n])=>`<button class="${S.pv===k?'on':''}" data-act="pv" data-v="${k}">${n}</button>`).join('')}</div><button class="btn sec chico" data-act="rm" aria-pressed="${S.rm}" style="${S.rm?'background:var(--tinta);color:var(--crema)':''}">Movimiento reducido</button><button class="btn sec chico" data-act="replay">${ic('replay','s')}Repetir la entrada</button></div>`;
 const t=tienda({d,c,fase:S.fase,pv:S.pv,rm:S.rm});
 return ctrl+`<div class="sx">${S.vista==='cel'?`<div class="tel"><div class="marco cel"><div class="pant" id="pantt">${t}</div></div></div>`:`<div class="marco desk"><div class="pant" id="pantt">${t}</div></div>`}</div>`}
/* ============================================================ pantalla, barra y leyenda */
const LEY={
 lista:'<b>Tienda web ▸ Campañas</b> (módulo nuevo, nace solo para el líder). Ve todas las campañas y cuáles ya tienen diseño. Las campañas se siguen creando en Catálogo ▸ Etiquetas.',
 editor:'<b>Diseñar la campaña</b>: cinco pasos a la izquierda y, a la derecha, la tienda de verdad reaccionando a cada cambio. Elige un ambiente del catálogo o tu propia imagen, y mira la vista previa.',
 programar:'<b>Programar</b>: un resumen de lo que va a pasar y nada más. No hay que acordarse de nada el día de la campaña: la tienda cambia y vuelve sola.',
 tienda:'<b>Lo que ve el cliente</b> en tienda.cayla.pe. Cambia la fecha para ver antes, en vivo, el último día y cuando terminó. Funciona igual en computador y celular.'
};
function spk(){const c=cur();$('#spk').innerHTML=`<span class="tag">Maqueta · Campañas de la tienda web</span><div class="seg" role="group" aria-label="Pantalla">${[['lista','1 Campañas'],['editor','2 Diseñar'],['programar','3 Programar'],['tienda','4 La tienda']].map(([k,n])=>`<button class="${S.pantalla===k?'on':''}" data-go="${k}">${n}</button>`).join('')}</div>
 <label style="display:flex;gap:6px;align-items:center;color:rgba(245,240,232,.78)">Campaña <select id="sel">${CAMPS.map(x=>`<option value="${x.id}" ${x.id===S.camp?'selected':''}>${x.n}</option>`).join('')}</select></label>
 <div class="seg" role="group" aria-label="Tienda">${[['desktop','Tienda: computador'],['cel','Tienda: celular']].map(([k,n])=>`<button class="${S.vista===k?'on':''}" data-vista="${k}">${n}</button>`).join('')}</div>
 <div class="seg" role="group" aria-label="Tema">${[['claro','Claro'],['oscuro','Oscuro']].map(([k,n])=>`<button class="${S.tema===k?'on':''}" data-tema="${k}">${n}</button>`).join('')}</div>`;
 $('#ley').innerHTML=LEY[S.pantalla]+'<span class="ej">Datos de ejemplo</span>'}
function render(keepScroll){
 document.documentElement.dataset.tema=S.tema;spk();
 const m=S.pantalla;let inner,cls='';
 const prev=$('.pant'),top=prev?prev.scrollTop:0;
 if(m==='tienda'){$('#esc').innerHTML=vTienda()}
 else{inner=m==='lista'?vLista():vEditor()+(S.hoja?vHoja():'');$('#esc').innerHTML=`<div class="sx"><div class="marco desk"><div class="pant">${inner}</div>${S.aviso?`<div class="aviso">${ic('check','s')}${esc(S.aviso)}</div>`:''}</div></div>`}
 if(keepScroll&&$('.pant'))$('.pant').scrollTop=top;
 post()}
function pintarPv(){const host=$('#pvsc');if(!host)return;const c=cur();
 host.innerHTML=tienda({d:dd(),c,fase:S.fase,pv:S.pv,rm:S.rm});
 const W=S.vista==='cel'?390:1120,H=$('#pvhost'),k=S.vista==='cel'?.8:Math.min(1,(H.clientWidth)/W);
 host.style.width=W+'px';host.style.transform=`scale(${k})`;const z=$('#pvsz');z.style.width=W*k+'px';
 requestAnimationFrame(()=>{z.style.height=host.offsetHeight*k+'px';alto(host)})}
function alto(root){$$('.h',root).forEach(h=>h.style.setProperty('--alto',(h.offsetHeight+30)+'px'));$$('.fx',root).forEach(f=>f.style.setProperty('--alto',(f.offsetHeight+30)+'px'))}
function post(){
 if($('#pvsc'))pintarPv();
 const pt=$('#pantt');if(pt)requestAnimationFrame(()=>alto(pt));
 tick();
 if(S.aviso){clearTimeout(post.t);post.t=setTimeout(()=>{S.aviso=null;const a=$('.aviso');a&&a.remove()},3200)}}
/* franja que rota y cuenta regresiva */
let T0=Date.now();
function tick(){const s=Math.floor((Date.now()-T0)/1000);
 $$('[data-cr]').forEach(e=>{let r=Math.max(0,+e.dataset.cr-s);const v=[Math.floor(r/86400),Math.floor(r%86400/3600),Math.floor(r%3600/60),r%60];$$('b',e).forEach((b,i)=>b.textContent=String(v[i]).padStart(2,'0'))})}
setInterval(tick,1000);
let ri=0;setInterval(()=>{ri++;$$('[data-rota]').forEach(f=>{if(f.closest('.st.rm')||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const sp=$$('span',f);sp.forEach((e,i)=>e.classList.toggle('on',i===ri%sp.length))})},4500);
/* ============================================================ eventos */
function actualizarVivo(){pintarPv();const p=$('#pie');if(p)p.innerHTML=pieHtml();const d=dd();
 if(propio(d)){const cc=chk(d),cn=$('#cont');if(cn)cn.innerHTML=contHtml(cc);const k=$('#chkc');if(k){k.className=cc.ok?'ok':'no';k.innerHTML=ic(cc.ok?'check':'x')+'<span>Todo el texto se lee bien</span>'}}}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){ir(g.dataset.go);return}
 const v=e.target.closest('[data-vista]');if(v){S.vista=v.dataset.vista;render(true);return}
 const t=e.target.closest('button[data-tema]');if(t){S.tema=t.dataset.tema;render(true);return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,d=dd(),V=a.dataset.v,K=a.dataset.k;
 switch(act){
  case'nada':e.preventDefault();return;
  case'filtro':S.filtro=V;render(true);return;
  case'abrir':S.camp=a.dataset.id;S.pantalla='editor';S.paso=has(dd())?(Object.keys(pasos()).find(n=>pasos()[n]!=='hecho')||1)*1:1;S.fase=cur().estado==='fin'?'vivo':'vivo';S.pv='portada';render();return;
  case'volver':S.pantalla='lista';S.hoja=null;render();return;
  case'paso':{const n=+a.dataset.n;if(pasos()[n]==='blq'){S.aviso='Primero elige un ambiente';render(true);return}S.paso=S.paso===n?0:n;if(S.paso&&n>1)d.visto[n]=true;render(true);return}
  case'irpaso':S.paso=+a.dataset.n;if(S.paso>1)d.visto[S.paso]=true;render(true);requestAnimationFrame(()=>{const el=$(`[data-campo="paso-${S.paso}"]`);el&&el.scrollIntoView({block:'center',behavior:'smooth'})});return;
  case'plant':aplicarPlantilla(d,V);S.paso=2;d.visto[2]=false;render(true);return;
  case'paleta':d.paleta=+V;d.acento=null;render(true);return;
  case'quitaracento':d.acento=null;render(true);return;
  case'mov':d[K]=V;if(K==='efecto'&&V!=='ninguno'&&!d.duracion)d.duracion='una';render(true);return;
  case'modo':d.modo=V;d.acento=null;if(V==='imagen'&&d.heroe==='caen')d.heroe='telon';if(V!=='imagen'&&d.heroe==='aparece')d.heroe='telon';if(V==='hoy')d.visto[1]=true;render(true);return;
  case'muestra':aplicarImagen(d,MUESTRA,'imagen-de-ejemplo.svg');S.paso=2;d.visto[2]=false;render(true);return;
  case'quitarimg':d.img=null;d.imgN='';render(true);return;
  case'muestraM':d.imgM=MUESTRA_V;d.imgMN='imagen-vertical-de-ejemplo.svg';render(true);return;
  case'quitarimgM':d.imgM=null;d.imgMN='';render(true);return;
  case'donde':d.donde[K]=!d.donde[K];render(true);return;
  case'pv':S.pv=V;render(true);return;
  case'vista':S.vista=V;render(true);return;
  case'fase':S.fase=V;render(true);return;
  case'rm':S.rm=!S.rm;render(true);return;
  case'replay':T0=Date.now();render(true);return;
  case'verpriv':S.hoja=null;S.pantalla='tienda';S.fase='vivo';S.pv='portada';render();return;
  case'hoja':if(faltan().length)return;S.hoja='programar';render(true);return;
  case'cerrarhoja':S.hoja=null;render(true);return;
  case'cerrarok':S.hoja=null;render(true);return;
  case'programar':{const c=cur();S.prog[c.id]=true;S.hoja='ok';render(true);return}
 }});
document.addEventListener('input',e=>{const d=dd(),i=e.target;
 if(i.id==='tx-titular'||i.id==='tx-bajada'||i.id==='tx-boton'){const k=i.id.slice(3);d[k]=i.value;const cn=$('#cn-'+k);if(cn)cn.textContent=i.value.length+'/'+i.maxLength;S.prog[S.camp]=S.camp==='aniv'?false:S.prog[S.camp];actualizarVivo();return}
 if(i.id==='acentoC'){d.acento=i.value;$('#acentoT').value=i.value;actualizarVivo();const q=$('[data-act=quitaracento]');q&&q.removeAttribute('hidden');$$('.pale button').forEach(b=>b.classList.remove('on'));return}
 if(i.id==='acentoT'){const v=i.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v)){d.acento=v.toLowerCase();$('#acentoC').value=d.acento;actualizarVivo()}return}
 if(i.id==='sel')return});
document.addEventListener('change',e=>{if(e.target.id==='sel'){S.camp=e.target.value;S.hoja=null;S.paso=1;render()}
 if(e.target.id==='imgMF'&&e.target.files[0]){const f=e.target.files[0],d=dd();d.imgM=URL.createObjectURL(f);d.imgMN=f.name;S.aviso=f.size>307200?'Pesa más de 300 KB: el sistema la aliviana al guardarla':'Versión para celular cargada';render(true)}
 if(e.target.id==='imgF'&&e.target.files[0]){const f=e.target.files[0],d=dd();aplicarImagen(d,URL.createObjectURL(f),f.name);S.paso=2;d.visto[2]=false;S.aviso=f.size>307200?'Pesa más de 300 KB: el sistema la aliviana al guardarla':'Imagen cargada';render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.hoja){S.hoja=null;render(true)}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act=paso]')){e.preventDefault();e.target.click()}});
window.addEventListener('resize',()=>{if($('#pvsc'))pintarPv()});
function ir(p){S.hoja=null;
 if(p==='programar'){const d=dd();if(!has(d)){aplicarPlantilla(d,S.camp==='navi'?'navidad':S.camp==='aniv'?'aniversario':'cyber');[2,3,4,5].forEach(n=>d.visto[n]=true)}S.pantalla='editor';S.hoja='programar'}
 else if(p==='tienda'){const d=dd();if(!has(d)){aplicarPlantilla(d,S.camp==='navi'?'navidad':S.camp==='aniv'?'aniversario':'cyber');[2,3,4,5].forEach(n=>d.visto[n]=true)}S.pantalla='tienda';S.fase='vivo';S.pv='portada'}
 else S.pantalla=p;
 if(p==='editor'){S.paso=pasos()[1]==='hecho'?(Object.keys(pasos()).find(n=>pasos()[n]!=='hecho')||0)*1:1;S.fase='vivo'}
 render()}
render();
</script>
</body>
</html>
