<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi perfil · 3 direcciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · el modal «Mi perfil» (2026-10-31)
   Felipe: «está demasiado básico; 3 maquetas lo más sofisticadas, animadas y con las tendencias actuales, liquid glass y así».
   Lo que hace el modal NO cambia (components/PerfilModal.tsx): ver tus datos (de Dynamic, solo lectura), subir/quitar la foto
   (JPEG, 3 MB), ver tu rol, estado, sede y último acceso, ir a Colaboradores, Configuración y Demo, y cambiar la contraseña.
   Cambia solo cómo se ve y cómo se mueve.
   Colores: SOLO los tokens de apps/web/app/globals.css y estilos/tema.css (ADR-0169 / ADR-0336), copiados abajo.
   Movimiento: una vez, sin rebote (curvas que no pasan de 1), todo se apaga con prefers-reduced-motion (ADR-0136).
   Lo que responde al mouse (el brillo del vidrio, la luz del bento, la inclinación del fotocheck) no es bucle: se mueve solo si tú te mueves.
   Datos inventados (el repo es público).
   ==================================================================== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:-40deg}
@property --arco{syntax:'<number>';inherits:false;initial-value:0}
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;
--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;--borde:#96786a;--sombra:#1a1a18;--vidrio:#ffffff;--tinta-fija:#1a1a18;--crema-fija:#f5f0e8;
--sede-tru:#2f6aa3;--sede-aqp:#c26a2e;--sede-lim:#1d8a72;--efectivo:#d19a12;
--ease:cubic-bezier(.32,.72,.24,1);--ease-sal:cubic-bezier(.4,0,1,1);--lienzo:#ddd5c6}
:root[data-tema="oscuro"]{--crema:#1c1a17;--papel:#26241f;--hueso:#33302a;--sand:#403b34;--tinta:#f5f0e8;--taupe:#c4a898;--borde:#8d7a6e;
--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;--sombra:#000000;--vidrio:#33302a;--lienzo:#0f0e0c}
:root{--t80:color-mix(in srgb,var(--tinta) 80%,transparent);--t65:color-mix(in srgb,var(--tinta) 66%,transparent);--t50:color-mix(in srgb,var(--tinta) 56%,transparent);
--t25:color-mix(in srgb,var(--tinta) 25%,transparent);--t12:color-mix(in srgb,var(--tinta) 12%,transparent);--t06:color-mix(in srgb,var(--tinta) 6%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.m{width:20px;height:20px}
.serif{font-family:'EB Garamond',Georgia,serif;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.vs{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.t65{color:var(--t65)}.t50{color:var(--t50)}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes funde{from{opacity:0}}
@keyframes enfoca{from{opacity:0;filter:blur(8px);transform:translateY(6px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes traza{from{stroke-dashoffset:var(--largo,300)}}
@keyframes ranura{from{transform:translateY(105%)}to{transform:none}}
@keyframes dibuja-x{from{transform:scaleX(0)}}
@keyframes pop-punto{from{opacity:0;transform:scale(.3)}}
@keyframes onda{from{opacity:.55;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
.cas>*{animation:sube .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms + var(--d,0ms))}

/* ---------- barra de la maqueta (no es parte del diseño) ---------- */
.spk{position:sticky;top:0;z-index:300;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.spk .titulo{font-family:'EB Garamond',serif;font-size:18px;margin-right:8px}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk .repetir{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(245,240,232,.25);color:#f5f0e8;font-size:12.5px;margin-left:auto}
.ley{max-width:1320px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ley button{text-align:left;background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:12px 16px;font-size:12.5px;color:var(--t80);transition:border-color .2s,background .2s}
.ley button b{display:block;color:var(--tinta);font-size:14px;margin-bottom:2px;font-family:'EB Garamond',serif;font-weight:500;font-size:19px}
.ley button.on{border-color:var(--tinta);background:var(--hueso)}
@media (max-width:760px){.ley{grid-template-columns:1fr}}
.escena{padding:14px 16px 60px;display:flex;justify-content:center}

/* ---------- el aparato: escritorio o celular ---------- */
.disp{container:disp/inline-size;position:relative;width:min(1320px,100%);height:860px;border-radius:16px;overflow:hidden;background:var(--crema);border:1px solid var(--t25);box-shadow:0 30px 60px -30px color-mix(in srgb,var(--sombra) 40%,transparent)}
.disp[data-ancho="movil"]{width:375px;height:780px;border-radius:40px;border:10px solid #171614}

/* ---------- el ERP de fondo (para que el vidrio tenga algo que refractar) ---------- */
.erp{position:absolute;inset:0;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr)}
.erp-lat{grid-row:1/3;border-right:1px solid var(--sand);padding:18px 14px}
.erp-logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:'EB Garamond',serif;font-size:22px;letter-spacing:.18em}
.erp-logo i{width:24px;height:24px;border-radius:50%;background:var(--rojo)}
.erp-lat .g{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;color:var(--t80);font-size:13.5px}
.erp-lat .g.on{background:var(--hueso);color:var(--tinta);font-weight:600}
.erp-lat .g svg{width:20px;height:20px;stroke-width:1.5}
.erp-cab{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 28px;border-bottom:1px solid var(--sand)}
.erp-cab .p{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;color:var(--t80)}
.erp-yo{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 4px;border-radius:999px;border:1px solid var(--sand);font-size:13px;font-weight:500;position:relative}
.erp-yo .pista{position:absolute;top:calc(100% + 10px);right:0;white-space:nowrap;background:var(--tinta);color:var(--crema);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transform:translateY(-4px);transition:.3s var(--ease);pointer-events:none}
.disp.cerrado .erp-yo .pista{opacity:1;transform:none;transition-delay:.4s}
.erp-cont{padding:28px 36px;overflow:hidden}
.erp-cont h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin:6px 0 6px}
.erp-cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.erp-cifras div{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:14px 16px}
.erp-cifras b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:30px;line-height:1.1}
.erp-prendas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.erp-prendas div{aspect-ratio:3/4;border-radius:14px;position:relative;overflow:hidden}
.erp-prendas span{position:absolute;left:10px;bottom:8px;font-size:12px;font-weight:600;color:var(--crema-fija)}
.erp-prendas div.claro span{color:var(--tinta-fija)}
@container disp (max-width:640px){
  .erp{grid-template-columns:1fr;grid-template-rows:56px 1fr}.erp-lat{display:none}.erp-cab{padding:0 14px;justify-content:space-between}
  .erp-cab .p.oculta{display:none}.erp-cont{padding:18px 16px}.erp-cont h1{font-size:34px}
  .erp-cifras{grid-template-columns:1fr 1fr}.erp-prendas{grid-template-columns:repeat(3,1fr)}
}

/* ---------- capa, velo y lo común de las hojas ---------- */
.capa{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:10}
.disp.cerrado .capa{pointer-events:none}
.velo{position:absolute;inset:0;background:color-mix(in srgb,var(--sombra) 24%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:funde .3s var(--ease) both}
[data-tema="oscuro"] .velo{background:color-mix(in srgb,var(--sombra) 55%,transparent)}
.disp.cerrado .velo,.disp.cerrado .hoja{display:none}
.hoja{position:relative;max-height:100%;overflow:auto;scrollbar-width:none}
.hoja::-webkit-scrollbar{display:none}
.hoja.sale{animation:hoja-sale .18s var(--ease-sal) forwards}
.velo.sale{animation:funde .18s reverse forwards}
@keyframes hoja-sale{to{opacity:0;transform:translateY(10px) scale(.98)}}
.asa{display:none}
.cerrar{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--t80);z-index:5;transition:background .2s,color .2s}
@media (hover:hover){.cerrar:hover{background:var(--t06);color:var(--tinta)}}

/* el celular: la hoja llega desde abajo, con su asa (ADR-0479) */
@container disp (max-width:640px){
  .capa{place-items:end stretch;padding:0}
  .hoja{width:100%!important;max-height:92%;border-radius:26px 26px 0 0!important;padding-top:26px!important}
  .hoja.entra{animation:hoja-movil .5s var(--ease) both!important}
  .asa{display:block;position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:99px;background:var(--t25);z-index:6;touch-action:none;cursor:grab}
  .asa::after{content:"";position:absolute;inset:-12px -30px}
  .cerrar{top:14px;right:12px}
}
@keyframes hoja-movil{from{transform:translateY(100%)}to{transform:none}}

/* piezas del sistema (resumidas) */
.av{width:var(--t);height:var(--t);border-radius:50%;background:var(--sand);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.av .ini{font-family:'EB Garamond',serif;font-weight:500;font-size:calc(var(--t) * .4);color:var(--tinta);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;animation:funde .45s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border:1px solid var(--t12);background:color-mix(in srgb,var(--papel) 60%,transparent)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.verde{color:var(--verde)}.chip.tinta{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:500;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s,color .25s,border-color .25s}
.btn.pri{background:var(--tinta);color:var(--crema)}
.btn.sec{border:1px solid var(--borde);background:color-mix(in srgb,var(--papel) 70%,transparent)}
.btn.chico{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px color-mix(in srgb,var(--sombra) 50%,transparent)}.btn.pri:hover{background:var(--rojo-p)}}
.btn:active{transform:scale(.97)}
.btn.cargando{pointer-events:none;opacity:.85}
.btn.cargando::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:currentColor;opacity:.7;animation:hilo 1s var(--ease) infinite}
@keyframes hilo{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.enlace{font-size:12.5px;color:var(--tinta);text-decoration:underline;text-decoration-color:var(--t25);text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
.enlace.peligro{color:var(--rojo)}
@media (hover:hover){.enlace:hover{color:var(--rojo-p);text-decoration-color:var(--rojo)}}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--hueso);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--t80)}
.nota svg{margin-top:2px;color:var(--taupe)}
.copiar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--t65);flex:none;transition:background .2s,color .2s}
@media (hover:hover){.copiar:hover{background:var(--t06);color:var(--tinta)}}
.copiar.ok{color:var(--verde)}
.disp:not(.con-foto) [data-si-foto],.disp.con-foto [data-sin-foto]{display:none!important}

/* el formulario de contraseña, con su guía de foco (ADR-0284) */
.clave{display:grid;gap:14px}
.campo-et{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-bottom:6px}
.marca{font-size:10px;letter-spacing:.06em;text-transform:none;font-weight:600;padding:1px 8px;border-radius:99px}
.marca[data-e="sigue"]{background:color-mix(in srgb,var(--pizarra) 14%,transparent);color:var(--pizarra)}
.marca[data-e="ok"]{color:var(--verde)}
.marca[data-e="falta"]{color:var(--t50);font-weight:500}
.caja{position:relative;display:flex;align-items:center;height:44px;border-radius:12px;background:var(--hueso);border:1px solid var(--borde);transition:background .25s,box-shadow .25s}
.caja::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--rojo);transform:scaleX(0);transition:transform .35s var(--ease)}
.caja:focus-within{background:var(--papel)}
.caja:focus-within::after{transform:scaleX(1)}
.campo.bien .caja::after{background:var(--verde)}
.campo.sigue .caja{box-shadow:0 0 0 4px color-mix(in srgb,var(--pizarra) 12%,transparent);background:var(--papel)}
.caja input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;padding:0 14px;font-size:14px}
.caja input::placeholder{color:var(--t50)}
.ojo{width:40px;height:40px;display:grid;place-items:center;color:var(--t65)}
.fuerza{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.fuerza i{height:4px;border-radius:4px;background:var(--sand);position:relative;overflow:hidden}
.fuerza i::after{content:"";position:absolute;inset:0;background:var(--c,var(--tinta));transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease),background .3s}
.fuerza i.on::after{transform:none}
.pie-campo{font-size:12px;color:var(--t65);margin-top:6px;min-height:18px}
.pie-campo.error{color:var(--rojo)}
.pie-acciones{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.listo{display:flex;align-items:center;gap:10px;color:var(--verde);font-weight:500;padding:8px 0}
.listo svg{width:22px;height:22px;stroke-dasharray:30;animation:traza .5s var(--ease) both;--largo:30}

/* aviso de éxito (esquina superior derecha) */
.avisos{position:absolute;top:72px;right:20px;z-index:40;display:grid;gap:8px;pointer-events:none}
.aviso{display:flex;align-items:center;gap:10px;min-width:260px;max-width:340px;padding:12px 16px 12px 14px;border-radius:14px;background:var(--papel);border:1px solid var(--sand);box-shadow:0 18px 40px -20px color-mix(in srgb,var(--sombra) 55%,transparent);font-size:13px;animation:aviso-entra .4s var(--ease) both;border-left:3px solid var(--verde)}
.aviso.error{border-left-color:var(--rojo)}.aviso.info{border-left-color:var(--pizarra)}
.aviso svg{color:var(--verde);stroke-dasharray:30;animation:traza .5s .15s var(--ease) both;--largo:30}
.aviso.error svg{color:var(--rojo)}.aviso.info svg{color:var(--pizarra)}
.aviso.sale{animation:aviso-sale .25s var(--ease-sal) forwards}
@keyframes aviso-entra{from{opacity:0;transform:translateX(16px)}}
@keyframes aviso-sale{to{opacity:0;transform:translateX(16px)}}
@container disp (max-width:640px){.avisos{top:64px;left:12px;right:12px}.aviso{min-width:0;max-width:none}}

/* el anillo de subida de la foto (se llena con la subida, no gira) */
.subida{position:absolute;inset:-6px;pointer-events:none;opacity:0;transition:opacity .2s}
.subiendo .subida{opacity:1}
.subida circle{fill:none;stroke:var(--tinta);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:center}
.subiendo .subida circle{transition:stroke-dashoffset 1s var(--ease);stroke-dashoffset:0}

/* ======================================================================
   A · CRISTAL LÍQUIDO
   ====================================================================== */
.disp[data-dir="a"] .velo{background:color-mix(in srgb,var(--sombra) 12%,transparent);backdrop-filter:blur(1.5px)}
[data-tema="oscuro"] .disp[data-dir="a"] .velo{background:color-mix(in srgb,var(--sombra) 40%,transparent)}
.hoja-a{width:576px;padding:30px 30px 28px;border-radius:34px;isolation:isolate;
  background:color-mix(in srgb,var(--vidrio) 52%,transparent);
  -webkit-backdrop-filter:blur(28px) saturate(1.9);backdrop-filter:blur(28px) saturate(1.9) brightness(1.03);
  border:1px solid color-mix(in srgb,var(--vidrio) 55%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--vidrio) 90%,transparent),inset 0 -1px 0 color-mix(in srgb,var(--vidrio) 30%,transparent),
    0 50px 90px -40px color-mix(in srgb,var(--sombra) 55%,transparent),0 0 0 .5px color-mix(in srgb,var(--sombra) 10%,transparent)}
[data-tema="oscuro"] .hoja-a{background:color-mix(in srgb,var(--vidrio) 62%,transparent);border-color:color-mix(in srgb,var(--tinta) 14%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--tinta) 18%,transparent),0 50px 90px -40px var(--sombra)}
/* el filo de luz: un borde que capta la luz y gira hacia donde está el mouse */
.a-filo{position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--ang),transparent 0 8%,color-mix(in srgb,var(--vidrio) 95%,transparent) 16%,transparent 30% 55%,color-mix(in srgb,var(--vidrio) 70%,transparent) 64%,transparent 78%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:--ang .6s var(--ease)}
[data-tema="oscuro"] .a-filo{background:conic-gradient(from var(--ang),transparent 0 8%,color-mix(in srgb,var(--tinta) 45%,transparent) 16%,transparent 30% 55%,color-mix(in srgb,var(--tinta) 25%,transparent) 64%,transparent 78%)}
.hoja-a.entra .a-filo{animation:filo-gira 1.6s .1s var(--ease) both}
@keyframes filo-gira{from{--ang:-160deg}to{--ang:-40deg}}
/* el brillo especular que sigue al mouse */
.a-brillo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(420px circle at var(--mx,30%) var(--my,0%),color-mix(in srgb,var(--vidrio) 55%,transparent),transparent 60%);opacity:.9;transition:opacity .3s}
[data-tema="oscuro"] .a-brillo{background:radial-gradient(420px circle at var(--mx,30%) var(--my,0%),color-mix(in srgb,var(--tinta) 9%,transparent),transparent 60%)}
.hoja-a.entra{animation:a-entra .62s var(--ease) both}
@keyframes a-entra{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.vidrio-boton{background:color-mix(in srgb,var(--vidrio) 40%,transparent);border:1px solid color-mix(in srgb,var(--vidrio) 60%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--vidrio) 90%,transparent)}
[data-tema="oscuro"] .vidrio-boton{background:color-mix(in srgb,var(--tinta) 8%,transparent);border-color:color-mix(in srgb,var(--tinta) 14%,transparent);box-shadow:none}
.a-cab{display:flex;align-items:center;gap:20px;padding-right:40px}
.a-lente{position:relative;flex:none;border-radius:50%;padding:6px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--vidrio) 85%,transparent),color-mix(in srgb,var(--vidrio) 20%,transparent));
  box-shadow:inset 0 1px 1px color-mix(in srgb,var(--vidrio) 95%,transparent),inset 0 -2px 6px color-mix(in srgb,var(--sombra) 10%,transparent),0 14px 30px -14px color-mix(in srgb,var(--sombra) 55%,transparent)}
[data-tema="oscuro"] .a-lente{background:linear-gradient(145deg,color-mix(in srgb,var(--tinta) 22%,transparent),color-mix(in srgb,var(--tinta) 4%,transparent));box-shadow:0 14px 30px -14px var(--sombra)}
.a-lente .av{transition:transform .5s var(--ease)}
.a-lente-cam{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;color:var(--crema-fija);background:color-mix(in srgb,var(--tinta-fija) 45%,transparent);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s var(--ease)}
@media (hover:hover){.a-lente:hover .a-lente-cam{opacity:1}.a-lente:hover .av{transform:scale(1.04)}}
.a-lente:focus-visible .a-lente-cam{opacity:1}
.hoja-a.entra .a-lente{animation:a-lente .8s .12s var(--ease) both}
@keyframes a-lente{from{opacity:0;transform:scale(.7);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.a-nombre{font-size:31px;line-height:1.08;margin:4px 0 10px;overflow:hidden}
.a-nombre span{display:inline-block}
.hoja-a.entra .a-nombre span{animation:ranura .7s var(--ease) backwards;animation-delay:calc(.18s + var(--i) * 70ms)}
.a-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.a-sede{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--t80);margin-left:4px}
.a-foto{display:flex;gap:14px;margin-top:10px}
.hoja-a.entra .a-chips,.hoja-a.entra .a-foto{animation:sube .5s .38s var(--ease) backwards}
/* el segmento de vidrio con su gota que fluye */
.a-seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:24px 0 18px;padding:5px;border-radius:999px;
  background:color-mix(in srgb,var(--tinta) 6%,transparent);box-shadow:inset 0 1px 3px color-mix(in srgb,var(--sombra) 12%,transparent)}
.hoja-a.entra .a-seg{animation:sube .5s .44s var(--ease) backwards}
.a-seg button{position:relative;z-index:1;height:38px;border-radius:999px;font-size:13px;font-weight:500;color:var(--t65);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:color .3s}
.a-seg button[aria-selected="true"]{color:var(--tinta);font-weight:600}
.a-gota{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--vidrio) 95%,transparent),color-mix(in srgb,var(--vidrio) 60%,transparent));
  box-shadow:inset 0 1px 0 var(--vidrio),inset 0 -1px 2px color-mix(in srgb,var(--sombra) 8%,transparent),0 6px 16px -6px color-mix(in srgb,var(--sombra) 35%,transparent)}
[data-tema="oscuro"] .a-gota{background:linear-gradient(180deg,color-mix(in srgb,var(--tinta) 20%,transparent),color-mix(in srgb,var(--tinta) 10%,transparent));box-shadow:inset 0 1px 0 color-mix(in srgb,var(--tinta) 25%,transparent),0 6px 16px -6px var(--sombra)}
.a-panel{position:relative}
.a-lista{display:grid;gap:8px}
.a-fila{display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 10px 8px 16px;border-radius:18px;
  background:color-mix(in srgb,var(--vidrio) 38%,transparent);border:1px solid color-mix(in srgb,var(--vidrio) 55%,transparent);transition:background .25s,transform .25s var(--ease)}
[data-tema="oscuro"] .a-fila{background:color-mix(in srgb,var(--tinta) 5%,transparent);border-color:color-mix(in srgb,var(--tinta) 10%,transparent)}
.a-fila .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tinta) 6%,transparent);color:var(--t80)}
.a-fila .tx{flex:1;min-width:0}.a-fila .tx p:last-child{font-size:14px;color:var(--tinta);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-fila .tx .vs{font-size:10px}
a.a-fila,button.a-fila{width:100%;text-align:left}
@media (hover:hover){a.a-fila:hover,button.a-fila:hover{background:color-mix(in srgb,var(--vidrio) 62%,transparent);transform:translateY(-1px)}
  [data-tema="oscuro"] a.a-fila:hover,[data-tema="oscuro"] button.a-fila:hover{background:color-mix(in srgb,var(--tinta) 10%,transparent)}
  a.a-fila:hover .flecha,button.a-fila:hover .flecha{transform:translateX(4px)}}
.flecha{transition:transform .3s var(--ease);color:var(--t50);margin-right:6px}
.a-fila .tx p.sub{font-size:12px;color:var(--t65);white-space:normal}
.a-mosaico{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.a-mosaico .a-fila{display:block;padding:12px 16px}
.a-mosaico b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:21px;line-height:1.2;margin-top:2px}
.a-sub{margin:16px 0 8px 4px;font-size:10px}
.a-intro{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:13px;color:var(--t80)}
.a-intro .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--verde) 14%,transparent);color:var(--verde);flex:none}
.hoja-a .caja{background:color-mix(in srgb,var(--vidrio) 45%,transparent);border-color:color-mix(in srgb,var(--borde) 80%,transparent)}
.hoja-a .caja:focus-within,.hoja-a .campo.sigue .caja{background:color-mix(in srgb,var(--vidrio) 75%,transparent)}
[data-tema="oscuro"] .hoja-a .caja{background:color-mix(in srgb,var(--crema) 50%,transparent)}
[data-tema="oscuro"] .hoja-a .caja:focus-within,[data-tema="oscuro"] .hoja-a .campo.sigue .caja{background:color-mix(in srgb,var(--papel) 85%,transparent)}
.hoja-a .nota{background:color-mix(in srgb,var(--hueso) 70%,transparent)}
.hoja-a .chip{background:color-mix(in srgb,var(--vidrio) 45%,transparent)}
[data-tema="oscuro"] .hoja-a .chip{background:color-mix(in srgb,var(--tinta) 6%,transparent)}
.hoja-a .chip.tinta{background:var(--tinta)}
@container disp (max-width:640px){
  .hoja-a{padding:30px 18px 24px}.a-cab{flex-direction:column;text-align:center;gap:12px;padding:0}
  .a-chips,.a-foto{justify-content:center}.a-nombre{font-size:27px}.a-mosaico{grid-template-columns:1fr 1fr}
}

/* ======================================================================
   B · BENTO VIVO
   ====================================================================== */
.hoja-b{width:768px;padding:30px 28px 28px;border-radius:28px;background:var(--papel);border:1px solid var(--sand);isolation:isolate;
  box-shadow:0 50px 90px -40px color-mix(in srgb,var(--sombra) 50%,transparent)}
.hoja-b.entra{animation:b-entra .55s var(--ease) both}
@keyframes b-entra{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
/* aurora: tres nubes de los colores de la sede, que llegan una vez y siguen al mouse sin moverse solas */
.b-aurora{position:absolute;inset:0 0 auto 0;height:260px;z-index:-1;overflow:hidden;border-radius:28px 28px 0 0;pointer-events:none;
  -webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent)}
.b-aurora i{position:absolute;border-radius:50%;filter:blur(48px);opacity:.42;transition:transform 1.2s var(--ease)}
[data-tema="oscuro"] .b-aurora i{opacity:.3}
.b-aurora i:nth-child(1){width:340px;height:200px;left:-60px;top:-80px;background:var(--sede-tru);transform:translate(calc(var(--ax,0) * 30px),calc(var(--ay,0) * 16px))}
.b-aurora i:nth-child(2){width:300px;height:200px;left:260px;top:-110px;background:var(--rojo);opacity:.28;transform:translate(calc(var(--ax,0) * -24px),calc(var(--ay,0) * 12px))}
.b-aurora i:nth-child(3){width:300px;height:180px;right:-80px;top:-60px;background:var(--efectivo);opacity:.3;transform:translate(calc(var(--ax,0) * 20px),calc(var(--ay,0) * -14px))}
.hoja-b.entra .b-aurora i{animation:aurora 1.4s var(--ease) backwards}
.hoja-b.entra .b-aurora i:nth-child(2){animation-delay:.1s}.hoja-b.entra .b-aurora i:nth-child(3){animation-delay:.2s}
@keyframes aurora{from{opacity:0;scale:.5}}
.b-cab{padding-right:44px;margin-bottom:22px}
.b-cab h2{font-size:40px;line-height:1.05;margin:4px 0 6px;overflow:hidden}
.b-cab h2 span{display:inline-block}
.hoja-b.entra .b-cab h2 span{animation:ranura .7s var(--ease) backwards;animation-delay:calc(.12s + var(--i) * 70ms)}
.b-cab p.frase{color:var(--t65);font-size:14px}
.hoja-b.entra .b-cab .vs,.hoja-b.entra .b-cab .frase{animation:sube .5s .25s var(--ease) backwards}
.b-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-flow:dense;gap:10px}
.b-t{position:relative;border-radius:22px;padding:18px;background:var(--crema);border:1px solid var(--sand);overflow:hidden;isolation:isolate;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease),border-color .3s}
[data-tema="oscuro"] .b-t{background:var(--hueso)}
.b-t::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--tinta) 45%,transparent),transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.b-t::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(320px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--vidrio) 55%,transparent),transparent 65%)}
[data-tema="oscuro"] .b-t::after{background:radial-gradient(320px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--tinta) 6%,transparent),transparent 65%)}
.b-grid:hover .b-t::before,.b-grid:hover .b-t::after{opacity:1}
.hoja-b.entra .b-t{animation:enfoca .6s var(--ease) backwards;animation-delay:calc(.22s + var(--i) * 55ms)}
.b-id{grid-column:span 3;grid-row:span 2;display:flex;flex-direction:column}
.b-sede{grid-column:span 3}.b-acceso{grid-column:span 2}.b-rol{grid-column:span 1;display:flex;flex-direction:column;justify-content:space-between}
.b-datos{grid-column:span 4}.b-clave{grid-column:span 2;cursor:pointer}.b-ir{grid-column:span 2}
.b-grid.clave-abierta .b-datos{grid-column:span 6}.b-grid.clave-abierta .b-clave{grid-column:span 6;cursor:default}
.b-id-av{position:relative;width:124px;height:124px;display:grid;place-items:center;margin-bottom:16px}
.b-id-av svg.anillo{position:absolute;inset:0;width:124px;height:124px;transform:rotate(-90deg)}
.b-id-av svg.anillo circle{fill:none;stroke:var(--sede-tru);stroke-width:2.5;stroke-dasharray:380;stroke-linecap:round}
.hoja-b.entra .b-id-av svg.anillo circle{animation:traza 1.2s .5s var(--ease) both;--largo:380}
.b-cam{position:absolute;right:2px;bottom:4px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tinta);color:var(--crema);border:3px solid var(--crema);transition:transform .3s var(--ease)}
[data-tema="oscuro"] .b-cam{border-color:var(--hueso)}
@media (hover:hover){.b-cam:hover{transform:scale(1.08) rotate(-8deg)}}
.b-id h3{font-size:30px;line-height:1.08;margin-bottom:10px}
.b-id .acciones{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.b-sede .fila{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.b-sede b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:28px;line-height:1.1}
.b-mapa{display:block;width:100%;height:96px;margin-top:6px}
.b-mapa .hilo{fill:none;stroke:var(--t25);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
.b-mapa .hilo-vivo{fill:none;stroke:var(--sede-tru);stroke-width:1.5;stroke-dasharray:240;stroke-linecap:round}
.hoja-b.entra .b-mapa .hilo-vivo{animation:traza 1.4s .6s var(--ease) both;--largo:240}
.b-mapa text{font-size:10px;font-weight:600;letter-spacing:.1em;fill:var(--t65);font-family:'DM Sans'}
.b-mapa .punto{transform-box:fill-box;transform-origin:center}
.hoja-b.entra .b-mapa .punto{animation:pop-punto .5s var(--ease) backwards}
.b-mapa .onda{fill:none;stroke:var(--sede-tru);stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0}
.hoja-b.entra .b-mapa .onda{animation:onda 1.4s 1.2s var(--ease) both}
.b-hora{font-family:'EB Garamond',serif;font-weight:500;font-size:44px;line-height:1;margin:10px 0 4px}
.b-dia{position:relative;height:6px;border-radius:6px;background:var(--sand);margin-top:14px}
.b-dia i{position:absolute;left:0;top:0;bottom:0;width:40.4%;border-radius:6px;background:var(--tinta);transform-origin:left}
.hoja-b.entra .b-dia i{animation:dibuja-x 1s .6s var(--ease) backwards}
.b-dia span{position:absolute;top:-3px;left:40.4%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--tinta);border:2px solid var(--crema)}
.b-dia-et{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t50);margin-top:6px}
.b-rol b{font-family:'EB Garamond',serif;font-weight:500;font-size:24px;line-height:1.1;display:block;margin:6px 0}
.b-datos .fila{display:flex;align-items:center;gap:12px;min-height:46px;border-top:1px solid var(--sand)}
.b-datos .fila:first-of-type{border-top:0}
.b-datos .fila svg.ic{color:var(--t65)}
.b-datos .fila .et{width:86px;font-size:12px;color:var(--t65)}
.b-datos .fila .va{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-datos .pie{font-size:12px;color:var(--t65);margin-top:8px;display:flex;gap:6px;align-items:center}
.b-clave .cand{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tinta);color:var(--crema);margin-bottom:14px}
.b-clave .cand svg path,.b-clave .cand svg rect{stroke-dasharray:60}
.hoja-b.entra .b-clave .cand svg path{animation:traza .9s .9s var(--ease) both;--largo:60}
.b-clave b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:22px}
.b-clave .cerrada .mas{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.b-clave .cerrada .mas svg{transition:transform .3s var(--ease)}
@media (hover:hover){.b-clave:hover .cerrada .mas svg{transform:translateX(4px)}}
.b-clave .abierta{display:none}
.b-grid.clave-abierta .b-clave .cerrada{display:none}
.b-grid.clave-abierta .b-clave .abierta{display:grid;grid-template-columns:200px 1fr;gap:28px;animation:sube .45s .1s var(--ease) backwards}
.b-ir{display:flex;flex-direction:column;gap:10px;min-height:150px;text-align:left}
.b-ir .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--papel);border:1px solid var(--sand);transition:transform .4s var(--ease),background .3s,color .3s}
[data-tema="oscuro"] .b-ir .ico{background:var(--crema)}
.b-ir b{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.b-ir p{font-size:12.5px;color:var(--t65)}
@media (hover:hover){.b-ir:hover .ico{transform:translateY(-3px) rotate(-6deg);background:var(--tinta);color:var(--crema)}.b-ir:hover b svg{transform:translateX(4px)}}
.b-ir b svg{transition:transform .3s var(--ease)}
@container disp (max-width:640px){
  .hoja-b{padding:30px 14px 20px}.b-cab h2{font-size:32px}.b-grid{grid-template-columns:1fr 1fr}
  .b-id,.b-sede,.b-datos,.b-grid.clave-abierta .b-clave,.b-grid.clave-abierta .b-datos{grid-column:span 2}.b-id{grid-row:auto}
  .b-acceso,.b-rol,.b-clave,.b-ir{grid-column:span 1}.b-ir:last-child{grid-column:span 2}
  .b-grid.clave-abierta .b-clave .abierta{grid-template-columns:1fr;gap:12px}.b-hora{font-size:36px}
  .b-t{transform:none!important}
}

/* ======================================================================
   C · FOTOCHECK
   ====================================================================== */
.hoja-c{width:768px;display:grid;grid-template-columns:300px minmax(0,1fr);border-radius:28px;background:var(--papel);border:1px solid var(--sand);
  box-shadow:0 50px 90px -40px color-mix(in srgb,var(--sombra) 50%,transparent);overflow:auto}
.hoja-c.entra{animation:b-entra .5s var(--ease) both}
.c-izq{position:relative;background:var(--hueso);padding:58px 28px 26px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--sand);overflow:clip}
.c-izq::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23px,var(--t06) 23px 24px),repeating-linear-gradient(0deg,transparent 0 23px,var(--t06) 23px 24px);pointer-events:none}
.c-cuelga{position:relative;width:228px}
.hoja-c.entra .c-cuelga{animation:c-baja .95s .1s var(--ease) both}
@keyframes c-baja{from{transform:translateY(-130%) rotate(-5deg);opacity:.4}to{transform:none;opacity:1}}
.c-cinta{position:absolute;left:50%;width:30px;margin-left:-15px;top:-120px;height:132px;background:repeating-linear-gradient(180deg,var(--rojo) 0 14px,var(--rojo-p) 14px 15px);border-radius:0 0 3px 3px}
.c-cinta::after{content:"";position:absolute;left:50%;bottom:-6px;width:20px;height:16px;margin-left:-10px;border-radius:4px;background:var(--borde)}
.c-tilt{perspective:1000px}
.c-carta{position:relative;width:228px;height:340px;transform-style:preserve-3d;transition:transform .8s var(--ease);
  transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--vuelta,0deg)))}
.c-carta.volteada{--vuelta:180deg}
.c-cara{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--tinta-fija);color:var(--crema-fija);box-shadow:0 30px 50px -24px color-mix(in srgb,var(--sombra) 70%,transparent);padding:18px}
.c-dorso{transform:rotateY(180deg);display:flex;flex-direction:column}
.c-cara .ranura-c{position:absolute;top:10px;left:50%;width:44px;height:7px;margin-left:-22px;border-radius:9px;background:var(--hueso)}
/* el holograma: una lámina de luz que se mueve con la inclinación */
.c-holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;transition:opacity .4s;
  background:linear-gradient(115deg,transparent 22%,color-mix(in srgb,var(--sede-tru) 75%,transparent) 36%,color-mix(in srgb,var(--sede-lim) 75%,transparent) 44%,color-mix(in srgb,var(--efectivo) 80%,transparent) 52%,color-mix(in srgb,var(--sede-aqp) 75%,transparent) 60%,transparent 74%),
  repeating-linear-gradient(60deg,color-mix(in srgb,var(--crema-fija) 6%,transparent) 0 2px,transparent 2px 5px);
  background-size:260% 260%,auto;background-position:var(--px,0%) var(--py,0%),0 0}
.hoja-c.entra .c-holo{animation:holo 1.6s .9s var(--ease) both}
@keyframes holo{from{background-position:-60% -60%,0 0}to{background-position:var(--px,0%) var(--py,0%),0 0}}
.c-top{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.c-logo{display:flex;align-items:center;gap:7px;font-family:'EB Garamond',serif;font-size:16px;letter-spacing:.2em}
.c-logo i{width:14px;height:14px;border-radius:50%;background:var(--rojo)}
.c-top .vs{color:color-mix(in srgb,var(--crema-fija) 62%,transparent);font-size:9px}

function ponerGota(animar) {
  const seg = $('.a-seg'); if (!seg) return;
  const gota = $('.a-gota', seg), b = $(`[data-tab="${E.tab}"]`, seg);
  const to = { left: b.offsetLeft, width: b.offsetWidth };
  const from = { left: gota.offsetLeft, width: gota.offsetWidth };
  gota.style.left = to.left + 'px'; gota.style.width = to.width + 'px';
  if (!animar || quieto() || !from.width) return;
  // La gota se estira hasta tocar la pestaña nueva y recién ahí suelta la vieja: fluye, no salta (y no rebota).
  const izq = Math.min(from.left, to.left), der = Math.max(from.left + from.width, to.left + to.width);
  gota.animate([
    { left: from.left + 'px', width: from.width + 'px', transform: 'scaleY(1)' },
    { left: izq + 'px', width: der - izq + 'px', transform: 'scaleY(.86)', offset: .45 },
    { left: to.left + 'px', width: to.width + 'px', transform: 'scaleY(1)' },
  ], { duration: 520, easing: EASE });
}
function cambiarTab(t) {

}

// FLIP: las tarjetas se corren a su lugar nuevo en vez de saltar cuando la de la contraseña se abre.
function flip(cont, cambio) {
  const hijos = [...cont.children], antes = hijos.map((h) => h.getBoundingClientRect());
  cambio();
  if (quieto()) return;
  hijos.forEach((h, i) => {
    const d = h.getBoundingClientRect(), dx = antes[i].left - d.left, dy = antes[i].top - d.top;
    if (dx || dy) h.animate([{ translate: `${dx}px ${dy}px` }, { translate: '0 0' }], { duration: 520, easing: EASE });
  });
}

}

/* ---------- guía de foco y validación de la contraseña (la regla real: 8 o más y que coincidan) ---------- */
function fuerzaDe(v) {
  if (!v) return [0, '', ''];
  if (v.length < 8) return [1, `Muy corta: te ${8 - v.length === 1 ? 'falta 1 letra' : `faltan ${8 - v.length} letras`}.`, 'var(--rojo)'];
  const tipos = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter((r) => r.test(v)).length;
  if (v.length >= 12 && tipos >= 3) return [4, 'Fuerte.', 'var(--verde)'];
  if (tipos >= 2) return [3, 'Buena.', 'var(--verde)'];
  return [2, 'Suficiente. Con un número quedaría mejor.', 'var(--ambar)'];
}
function evaluar(f) {
  if (!f) return;
  const n = f.querySelector('[data-clave=nueva]'), c = f.querySelector('[data-clave=conf]');
  if (!n || !c) return; // ya se guardó: el formulario dice «listo»
  const okN = n.value.length >= 8, okC = okN && c.value === n.value;
  const [nivel, txt, color] = fuerzaDe(n.value);
  const pintar = (cont) => cont && [...cont.children].forEach((s, i) => { s.classList.toggle('on', i < nivel); s.style.setProperty('--c', color); });
  pintar(f.querySelector('[data-fuerza]')); pintar($('[data-fuerza-espejo]'));
  const est = $('[data-estado-espejo]'); if (est) est.textContent = txt || 'Escríbela a la derecha.';
  const [cn, cc] = [f.querySelector('[data-campo=nueva]'), f.querySelector('[data-campo=conf]')];
  const pieN = cn.querySelector('[data-pie]'), pieC = cc.querySelector('[data-pie]');
  if (!pieN.classList.contains('error')) pieN.textContent = txt || 'Al menos 8 caracteres.';
  if (!pieC.classList.contains('error')) pieC.textContent = c.value && okN && !okC ? 'Todavía no coinciden.' : okC ? 'Coinciden.' : '';
  // Uno solo «Sigue aquí» a la vez; la luz no se va del campo donde la persona está escribiendo.
  const activo = document.activeElement;
  const sigue = !okN ? 'nueva' : !okC ? 'conf' : null;
  [[cn, okN, 'nueva'], [cc, okC, 'conf']].forEach(([el, ok, k]) => {
    const m = el.querySelector('[data-marca]');
    const escribiendo = activo && el.contains(activo);
    const esSigue = sigue === k || (escribiendo && !ok);
    m.dataset.e = ok ? 'ok' : esSigue ? 'sigue' : 'falta';
    m.textContent = ok ? '✓' : esSigue ? 'Sigue aquí' : 'falta';
    el.classList.toggle('bien', ok); el.classList.toggle('sigue', esSigue && !ok);
  });
}
function errorCampo(f, k, txt) {
  const p = f.querySelector(`[data-campo=${k}] [data-pie]`); p.textContent = txt; p.classList.add('error');
  f.querySelector(`[data-campo=${k}] input`).focus();
}

    if (k === 'foto') { E.foto = v === 'si' ? FOTO_EJEMPLO : null; pintarAvatares(); montarSeg(); return; }
    E[k] = v; guardar(k, v); if (k === 'tema') { document.documentElement.dataset.tema = v; montarSeg(); return; }
    montar(); return;
  }
  const ley = e.target.closest('.ley button'); if (ley) { E.dir = ley.dataset.dir; guardar('dir', E.dir); montar(); return; }
  const a = e.target.closest('[data-acc]'); if (!a) return;

  if (acc === 'repetir' || acc === 'abrir') return montar();

  if (acc === 'tab') return cambiarTab(a.dataset.tab);
  if (acc === 'foto') { e.stopPropagation(); return $('#archivo').click(); }

  if (acc === 'ir') return avisar('info', `En el ERP, esto te lleva a ${a.dataset.ir} y cierra la hoja.`);
  if (acc === 'abrir-clave') { if (E.dir === 'b') return claveB(true); return claveC(true); }
  if (acc === 'voltear') { const c = $('#carta'); c.classList.toggle('volteada'); return; }
  if (acc === 'ojo') { const i = a.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; a.setAttribute('aria-label', i.type === 'password' ? 'Mostrar la contraseña' : 'Ocultar la contraseña'); return; }
  if (acc === 'cancelar-clave') {
    e.stopPropagation();
    if (E.dir === 'a') return cambiarTab('cuenta');
    if (E.dir === 'b') return claveB(false);
    return claveC(false);
  }
  if (acc === 'copiar') {
    const v = a.dataset.valor;
    try { await navigator.clipboard.writeText(v); } catch { const t = document.createElement('textarea'); t.value = v; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    a.classList.add('ok'); a.innerHTML = ic('check'); setTimeout(() => { a.classList.remove('ok'); a.innerHTML = ic('copiar'); }, 1600);
  }
});
function montarSeg() {
  $$('.seg').forEach((s) => $$('button', s).forEach((b) => b.classList.toggle('on', b.dataset.v === ({ dir: E.dir, tema: E.tema, ancho: E.ancho, foto: E.foto ? 'si' : 'no' })[s.dataset.ctl])));
}
$('#archivo').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; e.target.value = '';
  if (!f) return;
  if (f.type !== 'image/jpeg') return avisar('error', 'La foto debe ser JPEG (.jpg): es el único formato que acepta el sistema hoy.');
  if (f.size > 3 * 1024 * 1024) return avisar('error', 'La foto pesa más de 3 MB: usa una más liviana.');
  const r = new FileReader(); r.onload = () => ponerFoto(r.result, 'Foto de perfil actualizada'); r.readAsDataURL(f);
});
document.addEventListener('input', (e) => { const f = e.target.closest('[data-form-clave]'); if (f) { f.querySelectorAll('.pie-campo.error').forEach((p) => p.classList.remove('error')); evaluar(f); } });
document.addEventListener('focusin', (e) => { const f = e.target.closest('[data-form-clave]'); if (f) evaluar(f); });
document.addEventListener('focusout', (e) => { const f = e.target.closest('[data-form-clave]'); if (f) setTimeout(() => evaluar(f)); });
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form-clave]'); if (!f) return; e.preventDefault();
  const n = f.querySelector('[data-clave=nueva]').value, c = f.querySelector('[data-clave=conf]').value;
  if (n.length < 8) return errorCampo(f, 'nueva', 'La contraseña debe tener al menos 8 caracteres.');
  if (n !== c) return errorCampo(f, 'conf', 'Las dos contraseñas no coinciden.');
  await cargando(f.querySelector('[type=submit]'), 'Guardando…', 900);
  avisar('exito', 'Contraseña actualizada');
  f.innerHTML = `<p class="listo">${ic('check')}Contraseña actualizada. La usas desde tu próxima entrada.</p>`;
  setTimeout(() => { if (E.dir === 'a') cambiarTab('cuenta'); else if (E.dir === 'b') claveB(false); else claveC(false);
    setTimeout(() => { const nuevo = document.createElement('div'); nuevo.innerHTML = formClave(E.dir); f.replaceWith(nuevo.firstElementChild); }, 600); }, 1500);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !disp.classList.contains('cerrado')) cerrar(); });

// La luz: el vidrio (A), los bordes del bento y las nubes (B), la inclinación del fotocheck (C). Solo se mueve si tú te mueves.
capa.addEventListener('pointermove', (e) => {
  if (quieto() || E.ancho === 'movil') return;
  const h = $('.hoja'); if (!h) return;
  const r = h.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (E.dir === 'a') { h.style.setProperty('--mx', x * 100 + '%'); h.style.setProperty('--my', y * 100 + '%');
    $('.a-filo', h).style.setProperty('--ang', Math.atan2(y - .5, x - .5) * 180 / Math.PI + 90 - 60 + 'deg'); }
  if (E.dir === 'b') {
    h.style.setProperty('--ax', (x - .5) * 2); h.style.setProperty('--ay', (y - .5) * 2);
    $$('.b-t', h).forEach((t) => { const q = t.getBoundingClientRect(); t.style.setProperty('--x', e.clientX - q.left + 'px'); t.style.setProperty('--y', e.clientY - q.top + 'px');
      const dentro = e.clientX > q.left && e.clientX < q.right && e.clientY > q.top && e.clientY < q.bottom;
      t.style.setProperty('--rx', dentro ? ((e.clientY - q.top) / q.height - .5) * -4 + 'deg' : '0deg');
      t.style.setProperty('--ry', dentro ? ((e.clientX - q.left) / q.width - .5) * 4 + 'deg' : '0deg'); });
  }
  if (E.dir === 'c') {
    const t = $('#tilt-c'), carta = $('#carta'); if (!t) return; const q = t.getBoundingClientRect();
    const cx = (e.clientX - q.left) / q.width - .5, cy = (e.clientY - q.top) / q.height - .5;
    const cerca = Math.abs(cx) < 1.1 && Math.abs(cy) < .9;
    carta.style.transition = cerca ? 'transform .15s linear' : 'transform .8s ' + EASE;
    carta.style.setProperty('--rx', cerca ? cy * -16 + 'deg' : '0deg'); carta.style.setProperty('--ry', cerca ? cx * 18 + 'deg' : '0deg');
    $$('.c-holo', carta).forEach((hl) => { hl.style.setProperty('--px', (cx + .5) * 100 + '%'); hl.style.setProperty('--py', (cy + .5) * 100 + '%'); });
  }
});
capa.addEventListener('pointerleave', () => { const c = $('#carta'); if (c) { c.style.transition = ''; c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); } $$('.b-t').forEach((t) => { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); }); });

// En el celular: bajar la hoja con el dedo desde el asa (pasado un tercio, se cierra).
let arrastre = null;
capa.addEventListener('pointerdown', (e) => { const asa = e.target.closest('[data-asa]'); if (!asa) return; const h = $('.hoja'); h.classList.remove('entra'); arrastre = { y: e.clientY, h }; asa.setPointerCapture(e.pointerId); });
capa.addEventListener('pointermove', (e) => { if (!arrastre) return; const dy = Math.max(0, e.clientY - arrastre.y); arrastre.h.style.transform = `translateY(${dy}px)`; arrastre.dy = dy; });
capa.addEventListener('pointerup', () => { if (!arrastre) return; const { h, dy = 0 } = arrastre; arrastre = null;
  if (dy > h.offsetHeight / 3) { h.style.transition = 'transform .2s ' + EASE; h.style.transform = 'translateY(100%)'; setTimeout(() => { h.style.cssText = ''; disp.classList.add('cerrado'); }, 200); }
  else { h.style.transition = 'transform .3s ' + EASE; h.style.transform = ''; setTimeout(() => (h.style.transition = ''), 300); } });

// El fondo: prendas con su color (el color de una prenda es dato: no cambia con el tema).
const PRENDAS = [['#7a2e2a', 'Blusa Emma'], ['#c9a27e', 'Casaca Lía', 1], ['#2f4a3a', 'Vestido Ara'], ['#d8cbb3', 'Polo Nube', 1], ['#1f2f4a', 'Jean Río'], ['#b5643a', 'Falda Inti'],
  ['#e7d7c1', 'Top Brisa', 1], ['#5b3a5e', 'Saco Malva'], ['#8c9a6b', 'Short Oliva', 1], ['#2b2b2b', 'Pantalón Noa'], ['#c2876b', 'Blusa Coral'], ['#4f6f8f', 'Camisa Mar']]; // tema-fijo: colores de prenda, son dato
$('#prendas').innerHTML = PRENDAS.map(([c, n, claro]) => `<div data-color-dato class="${claro ? 'claro' : ''}" style="background:${c}"><span>${n}</span></div>`).join('');

montar();
