<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos web · propuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Maqueta de Tienda web ▸ Pedidos (2026-10-17): crítica y propuesta, con la pantalla de HOY rehecha al lado para comparar.
   Datos inventados. Paleta y letras: la guía «CAYLA Dynamic» (apps/web/app/globals.css y estilos/tema.css).
   Todo lo que se propone se arma con piezas que ya existen (TarjetaCifra, Camino, Tabla, Chip, BarraAvance, BarraApilada,
   Vacio, FiltroPuesto, BotonVerMas, Globito): la maqueta solo cambia qué se muestra y en qué orden. */
:root {
  --crema: #f5f0e8; --papel: #fbf8f2; --hueso: #eae1d2; --sand: #e8e0d0; --tinta: #1a1a18; --taupe: #805c4c;
  --rojo: #b8412d; --rojo-profundo: #8b2a1f; --verde: #48603f; --ambar: #74501a; --pizarra: #4c5d6e;
  --lienzo: #e6ddcd; --vidrio: #ffffff; --sombra: rgba(26, 26, 24, .16);
  --tinta-60: color-mix(in srgb, var(--tinta) 64%, transparent);
  --serif: "EB Garamond", ui-serif, Georgia, serif;
  --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --crema: #1a1a18; --papel: #242422; --hueso: #31302d; --sand: #3d3c38; --tinta: #f5f0e8; --taupe: #c4a898;
    --rojo: #e8806a; --rojo-profundo: #f29a86; --verde: #9ccb8d; --ambar: #e4b968; --pizarra: #a2b8cd;
    --lienzo: #121211; --vidrio: #2c2b28; --sombra: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --crema: #1a1a18; --papel: #242422; --hueso: #31302d; --sand: #3d3c38; --tinta: #f5f0e8; --taupe: #c4a898;
  --rojo: #e8806a; --rojo-profundo: #f29a86; --verde: #9ccb8d; --ambar: #e4b968; --pizarra: #a2b8cd;
  --lienzo: #121211; --vidrio: #2c2b28; --sombra: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lienzo); color: var(--tinta); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; }
.ic-14 { width: 14px; height: 14px; flex: none; }
.ic-20 { width: 20px; height: 20px; flex: none; }
.serif { font-family: var(--serif); }
.tenue { color: var(--taupe); }
.versal { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- El marco de la maqueta ---------- */
.barra { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; background: color-mix(in srgb, var(--lienzo) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--sand); }
@media (max-width: 719px) { .barra { position: static; } }
.barra-titulo { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.barra-titulo b { font-family: var(--serif); font-size: 21px; font-weight: 500; line-height: 1.1; }
.barra-titulo span { font-size: 12px; color: var(--taupe); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--hueso); border: 1px solid var(--sand); }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--taupe); transition: background .2s var(--ease), color .2s var(--ease); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--tinta); color: var(--crema); }
.seg-etq { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--taupe); margin-right: 4px; }
.grupo { display: inline-flex; align-items: center; gap: 6px; }

.lienzo { max-width: 1560px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1280px) { .lienzo { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }

/* ---------- La pantalla del ERP ---------- */
.pantalla { background: var(--crema); border: 1px solid var(--sand); border-radius: 22px; padding: 28px 16px 32px; min-width: 0; }
@media (min-width: 720px) { .pantalla { padding: 36px 40px 40px; } }
.pantalla > * + * { margin-top: 24px; }
.etq-vista { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.etq-vista.hoy { background: var(--hueso); color: var(--taupe); }
.etq-vista.prop { background: var(--tinta); color: var(--crema); }

.cab { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.cab-izq { min-width: 0; max-width: 640px; }
.cab-sede { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); }
.cab-sede::before { content: ""; width: 32px; height: 1px; background: var(--taupe); }
.cab h1 { font-family: var(--serif); font-weight: 500; font-size: 46px; line-height: 1.05; margin: 10px 0 8px; letter-spacing: -.01em; }
.cab-frase { margin: 0; font-size: 15px; color: var(--tinta-60); }
.cab-der { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.cab-cifra { text-align: right; }
.cab-cifra .v { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.cab-cifra .p { font-size: 12px; color: var(--taupe); }

.card { background: var(--papel); border: 1px solid var(--sand); border-radius: 16px; }

/* TarjetaCifra */
.cifra { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; text-align: left; background: var(--papel); border: 1px solid var(--sand); border-radius: 16px; min-height: 132px; transition: border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease); }
button.cifra:hover { border-color: color-mix(in srgb, var(--tinta) 30%, transparent); }
.cifra[aria-pressed="true"] { background: var(--sand); }
.cifra-etq { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); }
.punto { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--taupe) 60%, transparent); flex: none; }
.punto.rojo { background: var(--rojo); } .punto.ambar { background: var(--ambar); } .punto.verde { background: var(--verde); }
.punto.vivo { animation: late 1.6s var(--ease) infinite; }
@keyframes late { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rojo) 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
.cifra-v { font-family: var(--serif); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.cifra-p { font-size: 13px; color: var(--taupe); }
.cifra.quieta { background: transparent; border-style: dashed; }
.cifra.quieta[aria-pressed="true"] { background: var(--sand); border-style: solid; }

/* Camino */
.camino { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tramo, .hueco { display: none; }
@media (min-width: 1024px) {
  .camino.c3 { grid-template-columns: minmax(0, 1fr) 4.75rem minmax(0, 1fr) 4.75rem minmax(0, 1fr) 1.5rem minmax(0, 1fr); gap: 0; align-items: stretch; }
  .camino.c4 { grid-template-columns: minmax(0, 1fr) 6.25rem minmax(0, 1fr) 6.25rem minmax(0, 1fr) 6.25rem minmax(0, .8fr); gap: 0; align-items: stretch; }
  .tramo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; text-align: center; }
  .hueco { display: block; }
}
.tramo > svg { display: block; width: 100%; height: 16px; overflow: visible; }
.tramo .linea { fill: none; stroke: var(--taupe); stroke-width: 1.5; stroke-linecap: round; }
.tramo .linea.punteada { stroke-dasharray: 3 4; }
.tramo .punta { fill: var(--taupe); }
.tramo-verbo { font-size: 12px; font-weight: 600; }
.tramo-plazo { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--taupe); line-height: 1.2; }
.tramo-plazo.duro { color: var(--rojo-profundo); font-weight: 600; }

/* Cómo funciona */
.reglas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 720px) { .reglas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .reglas { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.regla { background: var(--hueso); border-radius: 14px; padding: 14px 16px; font-size: 13px; animation: asoma .32s var(--ease) both; }
.regla b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); margin-bottom: 4px; }
@keyframes asoma { from { opacity: 0; transform: translateY(6px); } }

/* Pestañas (vidrio con la píldora oscura) */
.pestanas { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--vidrio); border: 1px solid var(--sand); }
.pestanas button { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.pestanas button[aria-selected="true"] { background: var(--tinta); color: var(--crema); }
.globito { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--hueso); color: var(--taupe); font-size: 11px; font-weight: 600; letter-spacing: 0; }
.pestanas button[aria-selected="true"] .globito { background: color-mix(in srgb, var(--crema) 18%, transparent); color: var(--crema); }

/* Tabla */
.tabla-cab, .fila { display: grid; gap: 8px 16px; align-items: center; padding: 14px 20px; }
.tabla-cab { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); border-bottom: 1px solid var(--sand); padding-block: 12px; display: none; }
.fila { border-top: 1px solid var(--sand); cursor: pointer; transition: background .18s var(--ease); position: relative; }
.fila:first-of-type { border-top: 0; }
.fila:hover { background: color-mix(in srgb, var(--hueso) 55%, transparent); }
.hoy-g { grid-template-columns: minmax(0, 1fr) auto; }
.prop-g { grid-template-columns: minmax(0, 1fr) auto; }
@media (min-width: 720px) {
  .tabla-cab { display: grid; }
  .hoy-g { grid-template-columns: 6.5rem minmax(0, 1.2fr) 7.5rem 6.5rem minmax(0, 1.5fr); }
  .prop-g { grid-template-columns: 6.5rem minmax(0, 1.5fr) 6.5rem minmax(0, 1.3fr) 9.5rem; }
}
.cod { font-weight: 600; font-variant-numeric: tabular-nums; }
.cod small { display: block; font-weight: 400; font-size: 12px; color: var(--taupe); }
.cliente { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cliente span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--sand); color: var(--tinta); display: grid; place-items: center; font-family: var(--serif); font-size: 11px; flex: none; }
.prendas { display: flex; align-items: center; gap: 6px; }
.mini { width: 26px; height: 32px; border-radius: 6px; display: grid; place-items: center; flex: none; border: 1px solid color-mix(in srgb, var(--tinta) 10%, transparent); }
.mini svg { width: 14px; height: 14px; }
.total { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.total small { display: block; font-weight: 400; font-size: 12px; color: var(--taupe); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip .punto { width: 5px; height: 5px; }
.chip.rojo { background: color-mix(in srgb, var(--rojo) 12%, transparent); color: var(--rojo-profundo); }
.chip.ambar { background: color-mix(in srgb, var(--ambar) 13%, transparent); color: var(--ambar); }
.chip.verde { background: color-mix(in srgb, var(--verde) 13%, transparent); color: var(--verde); }
.chip.pizarra { background: color-mix(in srgb, var(--pizarra) 13%, transparent); color: var(--pizarra); }
.chip.neutro { background: var(--hueso); color: var(--taupe); }
.accion { display: block; margin-top: 2px; font-size: 12px; color: var(--taupe); }
.barra-av { display: block; height: 3px; border-radius: 999px; background: var(--sand); max-width: 11rem; margin-top: 6px; overflow: hidden; }
.barra-av i { display: block; height: 100%; border-radius: 999px; background: var(--tinta); transform-origin: left; animation: llena .8s var(--ease) both; }
.barra-av i.rojo { background: var(--rojo); } .barra-av i.ambar { background: var(--ambar); } .barra-av i.verde { background: var(--verde); }
@keyframes llena { from { transform: scaleX(0); } }
.reloj { font-size: 13px; font-weight: 500; }
.reloj.rojo { color: var(--rojo-profundo); } .reloj.ambar { color: var(--ambar); } .reloj.verde { color: var(--verde); } .reloj.pizarra { color: var(--pizarra); }
.reloj small { display: block; font-weight: 400; font-size: 12px; color: var(--taupe); }
.solo-movil { display: block; }
.solo-esc { display: none; }
@media (min-width: 720px) { .solo-movil { display: none; } .solo-esc { display: block; } }
.fila .col-full { grid-column: 1 / -1; }
@media (min-width: 720px) { .fila .col-full { grid-column: auto; } }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), color .2s var(--ease); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
.btn-prim { background: var(--tinta); color: var(--crema); }
.btn-prim:hover { background: var(--rojo-profundo); color: var(--crema); }
.btn-sec { background: var(--papel); border: 1px solid color-mix(in srgb, var(--taupe) 45%, transparent); }
.btn-sec:hover { border-color: var(--tinta); }
.btn-chico { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-enlace { color: var(--tinta); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--taupe) 50%, transparent); text-underline-offset: 3px; font-size: 13px; }
.btn-enlace:hover { color: var(--rojo-profundo); }
.fila .btn { width: 100%; }
@media (min-width: 720px) { .fila .btn { width: auto; justify-self: end; } }

/* Secciones */
.titulo-sec { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px 20px; border-bottom: 1px solid var(--sand); }
.titulo-sec h2 { font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 0; display: inline-flex; align-items: center; gap: 8px; }
.titulo-sec .dato { margin-left: auto; font-size: 12.5px; color: var(--taupe); }
.filtro-puesto { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 12px; border-radius: 999px; background: var(--tinta); color: var(--crema); font-size: 12px; font-weight: 600; }
.filtro-puesto svg { width: 14px; height: 14px; }
.nota { display: flex; gap: 10px; background: var(--hueso); border-radius: 14px; padding: 14px 18px; font-size: 13px; color: var(--tinta-60); }
.nota svg { flex: none; margin-top: 2px; color: var(--taupe); }
.vacio { text-align: center; padding: 40px 20px 44px; }
.vacio.compacto { padding: 28px 20px 30px; }
.vacio-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; background: var(--hueso); color: var(--taupe); }
.vacio-ic.ok { background: color-mix(in srgb, var(--verde) 14%, transparent); color: var(--verde); }
.vacio h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 6px; }
.vacio p { margin: 0 auto; max-width: 30rem; color: var(--taupe); font-size: 13.5px; }
.vacio .ok-path { stroke-dasharray: 30; animation: dibuja .6s var(--ease) .2s both; }
@keyframes dibuja { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
.enviar li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 20px; border-top: 1px solid var(--sand); }
.enviar li:first-child { border-top: 0; }
.enviar ul { list-style: none; margin: 0; padding: 0; }
.sec-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sec-cab h2 { font-family: var(--serif); font-size: 21px; font-weight: 500; margin: 0; display: inline-flex; gap: 8px; align-items: center; }
.sin-cambios { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--taupe); border: 1px dashed var(--sand); border-radius: 999px; padding: 2px 8px; }

/* Barra apilada (por qué se cerraron) */
.apilada { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--sand); gap: 2px; }
.apilada i { display: block; height: 100%; transform-origin: left; animation: llena .7s var(--ease) both; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--tinta-60); margin-top: 10px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cerrados-res { padding: 16px 20px; border-top: 1px solid var(--sand); }
.ver-mas { display: flex; width: 100%; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-top: 1px solid var(--sand); color: var(--taupe); font-size: 13px; font-weight: 500; border-radius: 0 0 16px 16px; }
.ver-mas:hover { background: color-mix(in srgb, var(--hueso) 55%, transparent); color: var(--tinta); }
.ver-mas svg { transition: transform .25s var(--ease); }
.ver-mas[aria-expanded="true"] svg { transform: rotate(180deg); }

/* ---------- Notas (pines) ---------- */
.con-notas [data-pin] { position: relative; }
.con-notas [data-pin]::before { content: attr(data-pin); position: absolute; z-index: 3; top: -11px; right: -11px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--rojo); color: var(--crema); font-size: 12px; font-weight: 700; font-family: var(--sans); letter-spacing: 0; text-transform: none; box-shadow: 0 0 0 3px var(--crema); pointer-events: none; }
.con-notas .cab-cifra { padding-right: 20px; }
.destello { animation: destello 1.4s var(--ease); border-radius: 16px; }
@keyframes destello { 0%, 60% { box-shadow: 0 0 0 3px var(--rojo); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* ---------- Panel de crítica ---------- */
.panel { display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 1280px) { .panel { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; padding-right: 4px; } }
.panel-cab h2 { font-family: var(--serif); font-size: 24px; font-weight: 500; margin: 0 0 4px; }
.panel-cab p { margin: 0; font-size: 13px; color: var(--taupe); }
.item { text-align: left; display: block; width: 100%; padding: 14px 16px; background: var(--papel); border: 1px solid var(--sand); border-radius: 14px; transition: border-color .2s var(--ease); }
.item:hover { border-color: color-mix(in srgb, var(--tinta) 30%, transparent); }
.item-cab { display: flex; align-items: flex-start; gap: 10px; }
.item-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--rojo); color: var(--crema); font-size: 12px; font-weight: 700; flex: none; }
.item-t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.etqs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.etq { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--hueso); color: var(--taupe); }
.etq.medido { background: color-mix(in srgb, var(--verde) 14%, transparent); color: var(--verde); }
.etq.observado { background: color-mix(in srgb, var(--pizarra) 14%, transparent); color: var(--pizarra); }
.etq.opinion { background: color-mix(in srgb, var(--ambar) 14%, transparent); color: var(--ambar); }
.etq.adr { background: transparent; border: 1px dashed color-mix(in srgb, var(--taupe) 60%, transparent); }

    const nConf = de("confirmar"), nCob = de("cobrar"), nEnt = de("entregar"), nCer = cerrados();
    const faltan = nCob.reduce((a, p) => a + p.falta, 0);
    const est = (k, etq, n, pie, punto, extra = "", pin = "") => `<button type="button" class="cifra ${extra}" data-filtro="${k}" aria-pressed="${S.filtro === k}" ${pin}><span class="cifra-etq"><span class="punto ${punto}"></span>${etq}</span><span class="cifra-v">${n}</span><span class="cifra-p">${pie}</span></button>`;
    const tramo = (verbo, plazo, duro, pin = "") => `<span class="tramo" ${pin}><span class="tramo-verbo">${verbo}</span>${flechaTramo(!duro)}<span class="tramo-plazo${duro ? " duro" : ""}">${duro ? I.candado : I.campana}${plazo}</span></span>`;
    const camino = `<div class="camino c4" data-pin="1">
        ${est("confirmar", "Por confirmar", nConf.length, "El primero se cierra en 2 h 10 min", "rojo vivo")}
        ${tramo("Confirmas", "se cierra a las 24 h", true, 'data-pin="5"')}
        ${est("cobrar", "Por cobrar", nCob.length, `Faltan ${soles(faltan)} · 1 sin pagar hace 2 días`, "rojo", "", 'data-pin="4"')}
        ${tramo("Te paga", "aviso a las 48 h", false)}
        ${est("entregar", "Por entregar", nEnt.length, "1 listo para recoger · 1 espera una prenda", "verde")}
        ${tramo("Lo recoge", "aviso a los 7 días", false)}
        ${est("cerrados", "Cerrados", nCer.length, "Últimos 30 días", "", "quieta")}
      </div>`;
    const lista = S.filtro && S.filtro !== "cerrados" ? de(S.filtro) : ab.slice().sort((a, b) => a.prop.rango - b.prop.rango);
    const titulo = S.filtro ? NOMBRE[S.filtro] : null;
    let tabla;
    if (S.filtro === "cerrados") {
      tabla = seccionCerrados(true);
    } else {
      const filas = lista.map((p, i) => `<div class="fila prop-g" data-abrir="${p.cod}">
          <span class="cod">${p.cod}<small>${p.hace}</small></span>
          <span class="solo-movil total" style="justify-self:end">${soles(p.total)}</span>
          <span class="col-full" style="display:flex;align-items:center;gap:12px;min-width:0"><span class="cliente" style="flex:1"><span class="avatar">${iniciales(p.cli)}</span><span>${p.cli}</span></span>${prendasDe(p)}</span>
          <span class="total solo-esc">${soles(p.total)}${p.falta && p.falta !== p.total ? `<small>falta ${soles(p.falta)}</small>` : ""}</span>
          <span class="col-full" ${i === 0 ? 'data-pin="3"' : ""}><span class="reloj ${p.prop.tono}">${p.prop.reloj}<small>${p.prop.sub}</small></span>${p.prop.pct !== null ? `<span class="barra-av"><i class="${p.prop.bar}" style="width:${p.prop.pct}%"></i></span>` : ""}</span>
          <span class="col-full" style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-sec btn-chico" data-toast="Abre la hoja de ${p.cod} directo en «${p.prop.verbo}» (la hoja es la de hoy, sin cambios).">${p.prop.verbo}${I.flecha}</button></span>
        </div>`).join("");
      tabla = `<section class="card">
          <div class="titulo-sec"><h2>${S.filtro ? titulo : "Lo que te toca"} <span class="globito">${lista.length}</span></h2>
            ${S.filtro ? `<button type="button" class="filtro-puesto" id="b-quitar">${titulo}${I.x}</button>` : ""}
            <span class="dato">${S.filtro ? "Lo que vence primero, arriba" : "Primero lo que se pierde si no actúas"}</span></div>
          <div class="tabla-cab prop-g"><span>Pedido</span><span>Cliente y prendas</span><span style="text-align:right">Total</span><span>Plazo</span><span></span></div>
          ${filas}
          ${S.filtro ? "" : resumenCerrados()}
        </section>`;
    }
    cuerpo = `${camino}${como}${paraEnviar()}${tabla}`;
  }
  return `<span class="etq-vista prop">Propuesta</span>${cabecera(true)}${cuerpo}`;
}

function conteoMotivos(lista) {
  const orden = ["entregado", "sin_confirmar", "sin_stock", "desistio"];
  return orden.map((m) => [m, lista.filter((p) => p.motivo === m).length]).filter(([, n]) => n > 0);
}
function apilada(lista) {
  const total = lista.length;
  return `<div class="apilada" role="img" aria-label="Por qué se cerraron">${conteoMotivos(lista).map(([m, n], i) => `<i style="width:${(n / total) * 100}%;background:${MOTIVOS[m].color};animation-delay:${i * 90}ms"></i>`).join("")}</div>
    <div class="leyenda">${conteoMotivos(lista).map(([m, n]) => `<span><i style="background:${MOTIVOS[m].color}"></i>${n} ${MOTIVOS[m].texto.toLowerCase()}</span>`).join("")}</div>`;
}
function filasCerrados(lista) {
  return lista.map((p) => `<div class="fila prop-g"><span class="cod">${p.cod}<small>${p.cuando}</small></span><span class="solo-movil total" style="justify-self:end">${soles(p.total)}</span><span class="cliente col-full"><span class="avatar">${iniciales(p.cli)}</span><span>${p.cli}</span></span><span class="total solo-esc">${soles(p.total)}</span><span class="col-full"><span class="chip ${MOTIVOS[p.motivo].chip}">${MOTIVOS[p.motivo].texto}</span></span><span class="solo-esc"></span></div>`).join("");
}
// Al pie de «Lo que te toca»: cuántos se cerraron y por qué, en una barra; las filas, a un toque.
function resumenCerrados() {
  const lista = cerrados();
  return `<div class="cerrados-res" data-pin="7"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:10px"><b class="serif" style="font-size:18px;font-weight:500">Cerrados en los últimos 30 días</b><span class="globito">${lista.length}</span></div>${apilada(lista)}</div>
    ${S.cerradosAbiertos ? filasCerrados(lista) : ""}
    <button type="button" class="ver-mas" id="b-ver-mas" aria-expanded="${S.cerradosAbiertos}">${S.cerradosAbiertos ? "Ver menos" : `Ver los ${lista.length}`}${I.abajo}</button>`;
}
// Día tranquilo (o la estación «Cerrados»): la misma barra y las filas a la vista.
function seccionCerrados(abierta) {
  const lista = cerrados();
  const quitar = S.filtro === "cerrados" ? `<button type="button" class="filtro-puesto" id="b-quitar">Cerrados${I.x}</button>` : "";
  const mostrar = abierta && (S.cerradosAbiertos || S.filtro === "cerrados") ? lista : lista.slice(0, 3);
  return `<section class="card"><div class="titulo-sec"><h2>Cerrados en los últimos 30 días <span class="globito">${lista.length}</span></h2>${quitar}<span class="dato">Lo último, arriba</span></div>
    <div class="cerrados-res" style="border-top:0" data-pin="7">${apilada(lista)}${lista.some((p) => p.motivo === "sin_stock") ? `<p style="margin:10px 0 0;font-size:12.5px;color:var(--taupe)">Si «no había stock» crece, la vitrina está mostrando prendas que la tienda no tiene. <button type="button" class="btn-enlace" data-toast="Lleva a Tienda web ▸ Vitrina, filtrada por Tienda TRU.">Revisar la vitrina</button></p>` : ""}</div>
    ${filasCerrados(mostrar)}
    ${mostrar.length < lista.length || S.cerradosAbiertos ? `<button type="button" class="ver-mas" id="b-ver-mas" aria-expanded="${S.cerradosAbiertos}">${S.cerradosAbiertos ? "Ver menos" : `Ver ${lista.length - 3} más`}${I.abajo}</button>` : ""}</section>`;
}

// ---------------------------------------------------------------------------------------------------------------
// Panel de crítica
// ---------------------------------------------------------------------------------------------------------------
const ITEMS = [
  { n: 1, t: "Dos menús para lo mismo", etq: ["medido", "Medido"], adr: true,
    hoy: "Las 3 cifras del camino y 3 de las 4 pestañas llevan al mismo lugar. «Por confirmar» se lee 3 veces en la primera pantalla.",
    prop: "El camino es el único filtro (la cifra elegida se rellena, como ya hace) y se quita la fila de pestañas. Sin filtro, se ve todo lo abierto." },
  { n: 2, t: "Diez formas de decir «nada»", etq: ["medido", "Medido"], esc: "tranquilo",
    hoy: "Con todo en cero: 7 ceros (dos en soles) y 3 frases de vacío. La pregunta «¿tengo algo que hacer?» no tiene una respuesta en una línea, y lo único que hay (9 cerrados) queda escondido en una pestaña.",
    prop: "«Todo al día» + lo último que pasó, y los cerrados a la vista. Mira el día tranquilo." },
  { n: 3, t: "La fila dice su estado tres veces y no dice qué hacer", etq: ["observado", "Observado en código"], esc: "pedidos",
    hoy: "Chip («Por confirmar · vence en 2 h») + frase («Revisa el stock y confírmalo») + barra del plazo. No hay botón: hay que adivinar que la fila se toca.",
    prop: "Dos señales con trabajos distintos: el reloj dice CUÁNDO (y qué pasa si no), el botón dice QUÉ («Confirmar», «Registrar pago», «Entregar»). La lista mezcla los pasos y pone arriba lo que se pierde." },
  { n: 4, t: "La fila de cifras mezcla pedidos con soles", etq: ["medido", "Medido"], adr: true,
    hoy: "0 · S/ 0.00 · 0 · S/ 0.00. «Por cobrar» en soles esconde cuántos pedidos son, y «Cobrado hoy» al final del camino se lee como el paso que sigue a entregar.",
    prop: "Las 4 estaciones cuentan pedidos; la plata va en su línea de abajo («Faltan S/ 426»). «Cobrado hoy» sube a la cabecera, y solo si hay algo." },
  { n: 5, t: "Un plazo que cierra y uno que solo avisa se ven igual", etq: ["observado", "Observado en código"], adr: true,
    hoy: "«en 24 h» cierra el pedido solo (se pierde la venta); «en 48 h» solo enciende un aviso. Las dos flechas son idénticas, y falta el tramo de recoger (7 días).",
    prop: "Flecha llena y reloj en rojo profundo para el que cierra; punteada con campana para los avisos. Tercer tramo «Lo recoge · aviso a los 7 días»." },
  { n: 6, t: "La nota del pie es un manual", etq: ["medido", "Medido · 79 palabras, 5 reglas"],
    hoy: "Cinco reglas en un párrafo al fondo. En el mostrador, con un cliente esperando, nadie llega hasta ahí.",
    prop: "«¿Cómo funciona?» en la cabecera abre una regla por paso, bajo su estación (ley 6: lo difícil a un toque)." },
  { n: 7, t: "Lo cerrado no enseña nada", etq: ["opinion", "Opinión"],
    hoy: "«Cerrados» es una lista plana. En TRU, 4 de los 9 cerrados fueron «no hay stock» (en producción, casi todos de prueba).",
    prop: "Una barra con por qué se cerraron. «Nadie lo confirmó a tiempo» es una venta perdida; si «no había stock» crece, la vitrina muestra lo que la tienda no tiene." },
];
function panel() {
  const items = ITEMS.map((it) => `<button type="button" class="item" data-item="${it.n}">
      <span class="item-cab"><span class="item-n">${it.n}</span><span><span class="item-t">${it.t}</span>
      <span class="etqs"><span class="etq ${it.etq[0]}">${it.etq[1]}</span>${it.adr ? '<span class="etq adr">Toca ADR-0430</span>' : ""}${it.esc === "tranquilo" ? '<span class="etq">Día tranquilo</span>' : ""}</span></span></span>
      <dl><dt>Hoy</dt><dd>${it.hoy}</dd><dt>Propuesta</dt><dd>${it.prop}</dd></dl></button>`).join("");
  return `<div class="panel-cab"><h2>Lo que veo</h2><p>Toca una crítica para ver dónde está. Los números rojos de la pantalla son las mismas notas.</p></div>
    ${items}
    <div class="item estrella">
      <span class="item-cab"><span class="item-n">★</span><span><span class="item-t">Lo que no pediste: el mostrador no ve los pedidos</span>
      <span class="etqs"><span class="etq medido">Medido en producción</span><span class="etq">Decisión tuya</span></span></span></span>
      <dl><dt>Hoy</dt><dd>«Pedidos web» lo tienen solo el rol <b>Terminal Almacén</b> (Almacén Trujillo, Arequipa y Lima) y los líderes. Las 3 terminales <b>Caja</b> y los 9 integrantes de tienda, no. Pero cobrar en efectivo y entregar con el código pasan en el mostrador.</dd></dl>
      <div class="pasos">
        <div class="paso"><span><b>Confirmar</b> · se decide en el almacén</span><span class="tenue">Almacén</span><span class="si">✓ lo ve</span></div>
        <div class="paso"><span><b>Cobrar en efectivo</b> · el cliente paga en caja</span><span class="tenue">Caja</span><span class="no">✕ no lo ve</span></div>
        <div class="paso"><span><b>Entregar con su código</b> · recoge en caja</span><span class="tenue">Caja</span><span class="no">✕ no lo ve</span></div>
      </div>
      <dl><dt>Salida</dt><dd>Colaboradores ▸ Roles y accesos ▸ «Terminal de ventas» ▸ Pedidos web (el módulo es delegable: un clic, sin código).</dd></dl>
    </div>
    <p class="panel-pie">No lo toco aquí: la cifra elegida se rellena de arena y en claro parece apagada. Es de la pieza única <code>TarjetaCifra</code>; si molesta, se decide en <code>/unificar</code>, no en esta pantalla.</p>`;
}

// ---------------------------------------------------------------------------------------------------------------
// Dibujar y escuchar
// ---------------------------------------------------------------------------------------------------------------
const $p = document.getElementById("pantalla");
function render() {
  document.documentElement.toggleAttribute("data-theme", !!S.tema);
  if (S.tema) document.documentElement.setAttribute("data-theme", S.tema);
  $p.classList.toggle("con-notas", S.notas);
  $p.innerHTML = S.vista === "hoy" ? vistaHoy() : vistaProp();
  for (const [id, v] of [["seg-escenario", S.escenario], ["seg-vista", S.vista]])
    document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  document.querySelector("#seg-notas button").setAttribute("aria-pressed", String(S.notas));
  const temaActual = S.tema || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.querySelectorAll("#seg-tema button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === temaActual)));
}
function pestanaInicial() {
  return ["confirmar", "cobrar", "entregar"].find((k) => de(k).length) ?? "confirmar";
}
let tostadaT;
function tostada(t) {
  document.querySelector(".tostada")?.remove();
  const d = document.createElement("div");
  d.className = "tostada"; d.setAttribute("role", "status"); d.textContent = t;
  document.body.appendChild(d);
  clearTimeout(tostadaT); tostadaT = setTimeout(() => d.remove(), 3600);
}
document.querySelector(".barra").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const seg = b.parentElement.id;
  if (seg === "seg-escenario") { S.escenario = b.dataset.v; S.filtro = null; S.cerradosAbiertos = false; S.pestana = pestanaInicial(); guardar("escenario", S.escenario); }
  if (seg === "seg-vista") { S.vista = b.dataset.v; guardar("vista", S.vista); }
  if (seg === "seg-notas") { S.notas = !S.notas; guardar("notas", S.notas ? "si" : "no"); }
  if (seg === "seg-tema") { S.tema = b.dataset.v; guardar("tema", S.tema); }
  render();
});
$p.addEventListener("click", (e) => {
  const b = e.target.closest("button, .fila[data-abrir]"); if (!b) return;
  if (b.dataset.toast) { tostada(b.dataset.toast); return; }
  if (b.dataset.tab) { S.pestana = b.dataset.tab; }
  else if (b.dataset.filtroHoy) { S.pestana = b.dataset.filtroHoy; }
  else if (b.dataset.filtro) { S.filtro = S.filtro === b.dataset.filtro ? null : b.dataset.filtro; S.cerradosAbiertos = false; }
  else if (b.id === "b-quitar") { S.filtro = null; }
  else if (b.id === "b-como") { S.como = !S.como; }
  else if (b.id === "b-ver-mas") { S.cerradosAbiertos = !S.cerradosAbiertos; }
  else if (b.dataset.abrir) { tostada(`Abre la hoja de ${b.dataset.abrir} (la de hoy, sin cambios).`); return; }
  render();
});
document.getElementById("panel").addEventListener("click", (e) => {
  const b = e.target.closest("[data-item]"); if (!b) return;
  const it = ITEMS.find((x) => x.n === Number(b.dataset.item));
  if (it.esc && it.esc !== S.escenario) { S.escenario = it.esc; S.filtro = null; S.pestana = pestanaInicial(); render(); }
  if (!S.notas) { S.notas = true; guardar("notas", "si"); render(); }
  const el = $p.querySelector(`[data-pin="${it.n}"]`);
  if (!el) { tostada(it.n === 7 && S.vista === "hoy" ? "En la vista de hoy, «Cerrados» es la cuarta pestaña." : "Esta nota no está en esta vista: cambia de vista o de día."); return; }
  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  el.classList.remove("destello"); void el.offsetWidth; el.classList.add("destello");
});
document.getElementById("panel").innerHTML = panel();
S.pestana = pestanaInicial();
render();
</script>
</body>
</html>
