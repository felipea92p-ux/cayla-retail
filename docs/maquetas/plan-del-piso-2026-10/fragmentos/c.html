<!-- C · Un grupo, una tarjeta — la unidad es el grupo: todo lo de un grupo vive en SU tarjeta (silueta, rol, cifra, comparación, veredicto y «¿Por qué?»). -->
<style>
/* ============ raíz y contenedor (todo responsive va por @container pc, no por la ventana) ============ */
.pc-raiz{container:pc/inline-size;display:flex;flex-direction:column;gap:16px;color:var(--color-tinta);font-family:var(--sans)}
.pc-raiz button{cursor:pointer}
.pc-raiz :is(h2,h3){font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
.pc-raiz .pc-num{font-variant-numeric:lining-nums tabular-nums}

@keyframes pc-entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pc-llena{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pc-sube{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ============ franja resumen: UNA fila, tres datos ============ */
.pc-resumen{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);background:var(--color-papel);border:1px solid var(--color-sand);border-radius:16px;animation:pc-entra 380ms var(--ease-cayla) both}
.pc-dato{display:flex;flex-direction:column;gap:9px;padding:18px 20px}
.pc-dato+.pc-dato{border-left:1px solid var(--color-sand)}
.pc-dato-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;min-height:22px}
.pc-grande{font-family:var(--serif);font-size:38px;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.pc-grande small{font-size:20px;color:var(--color-tinta-60);letter-spacing:0;margin-left:5px}
/* el protagonista de la pantalla es «78 de 1,800»: la cifra más grande de todas, por encima de las de cada tarjeta */
.pc-dato:first-child .pc-grande{font-size:48px}
.pc-dato:first-child .pc-grande small{font-size:22px}
.pc-fino{height:6px;border-radius:3px;background:var(--color-hueso);overflow:hidden}
.pc-fino i{display:block;height:100%;background:var(--color-tinta);border-radius:3px;transform-origin:left;animation:pc-llena 500ms var(--ease-cayla) 200ms both}
.pc-sub{font-size:13px;line-height:1.4;color:var(--color-tinta-60)}

@container pc (min-width:560px){
  .pc-resumen{grid-template-rows:repeat(4,auto)}
  .pc-dato{display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:9px;align-content:start}
  .pc-dato:not(:first-child) .pc-sub{grid-row:3/5}
}

/* ============ aviso de las categorías por revisar ============ */
.pc-aviso{flex-wrap:wrap;animation:pc-entra 380ms var(--ease-cayla) 60ms both}
.pc-aviso>div{flex:1 1 260px;min-width:0}

/* ============ cabecera de la cuadrícula ============ */
.pc-titulo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 24px;margin-top:6px}
.pc-titulo h2{font-size:26px;line-height:1.15}
.pc-titulo p{font-size:13px;color:var(--color-tinta-60)}

/* ============ cuadrícula de tarjetas de grupo (3 · 2 · 1 columnas) ============ */
.pc-rejilla{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:stretch}
@container pc (min-width:560px){.pc-rejilla{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container pc (min-width:900px){.pc-rejilla{grid-template-columns:repeat(3,minmax(0,1fr))}}

.pc-card{position:relative;display:flex;flex-direction:column;gap:16px;padding:18px;background:var(--color-papel);border:1px solid var(--color-sand);border-radius:16px;animation:pc-entra 420ms var(--ease-cayla) calc(120ms + var(--i)*55ms) both}
/* la tarjeta abierta se marca con un filo de tinta que aparece (solo opacidad) */
.pc-card::after{content:"";position:absolute;inset:-1px;border:1px solid var(--color-tinta);border-radius:16px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-cayla)}
.pc-card[data-abierta]::after{opacity:1}
/* las secciones de las tarjetas de una misma fila quedan alineadas entre sí (subgrid) */
@supports (grid-template-rows:subgrid){
  .pc-card{display:grid;grid-template-rows:subgrid;grid-row:span 5;row-gap:16px;align-content:start}
  .pc-card .pc-pq{align-self:end;justify-self:start}
}

/* cabecera de la tarjeta: silueta + nombre + rol */
.pc-cab{position:relative;display:flex;align-items:center;gap:13px;min-height:56px}
.pc-tile{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--g) 17%,var(--color-papel));color:color-mix(in srgb,var(--g) 82%,var(--color-tinta))}
.pc-tile svg{width:34px;height:34px}
.pc-quien{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.pc-nombre{font-size:20px;line-height:1.14;font-weight:500}
.pc-rol{display:inline-flex;align-items:center;gap:7px;min-height:32px;margin-left:-2px;padding:0 6px 0 2px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--color-taupe-profundo)}
.pc-rol:hover,.pc-rol[aria-expanded=true]{background:var(--color-hueso)}
.pc-q{display:inline-grid;place-items:center;width:17px;height:17px;border:1.5px solid currentColor;border-radius:50%;font-size:11px;font-weight:700;letter-spacing:0;line-height:1}
.pc-ayuda{position:absolute;z-index:6;left:-8px;right:-8px;top:calc(100% + 4px);padding:12px 14px;border-radius:12px;background:var(--color-papel);border:1px solid var(--color-taupe);font-size:13px;line-height:1.45;color:var(--color-tinta);box-shadow:0 14px 30px -12px color-mix(in srgb,var(--color-sombra) 38%,transparent);animation:pc-sube 220ms var(--ease-cayla) both}
.pc-ayuda b{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--color-taupe-profundo);margin-bottom:3px}

/* la cifra: hoy → propuesta. Las dos etiquetas van en la misma línea; las cifras comparten línea de base.
   «Hoy» son PRENDAS según el sistema; «Propuesta» son GANCHOS del riel: la unidad se dice en cada pie. */
.pc-cifras{--pc-g:46px;--pc-h:32px;display:flex;align-items:flex-start;gap:10px}
.pc-cifra{display:flex;flex-direction:column;gap:4px;min-width:0}
.pc-cifra strong{font-family:var(--serif);font-weight:400;font-variant-numeric:lining-nums tabular-nums;line-height:1;letter-spacing:-.01em}
.pc-cifra .pc-pie{font-size:12.5px;line-height:1.3;color:var(--color-tinta-60)}
.pc-cifra.pc-hoy strong{font-size:var(--pc-h);color:var(--color-tinta-60);margin-top:calc(var(--pc-g) - var(--pc-h) - 2px)}
.pc-cifra.pc-hoy .pc-pie{max-width:14ch;text-wrap:balance}
.pc-cifra.pc-prop strong{font-size:var(--pc-g)}
.pc-flecha{flex:none;align-self:flex-start;width:26px;height:26px;color:var(--color-taupe);margin-top:31px}

/* las dos barras, misma escala en todas las tarjetas (la barra llena es el tope que dice el rótulo) */
.pc-barras{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px 10px}
.pc-barras .pc-cap{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 12px;margin-bottom:-1px}
.pc-esc{font-size:12.5px;color:var(--color-tinta-60)}
.pc-et{font-size:12.5px;color:var(--color-tinta-60)}
.pc-val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:lining-nums tabular-nums;min-width:48px}
.pc-pista{position:relative;height:9px;border-radius:5px;background:var(--color-hueso);overflow:hidden}
.pc-pista i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transform-origin:left;animation:pc-llena 500ms var(--ease-cayla) calc(260ms + var(--i)*55ms) both}
.pc-pista.pc-hoy i{background:color-mix(in srgb,var(--color-taupe) 74%,var(--color-papel))}
.pc-pista.pc-prop i{background:var(--color-tinta)}

/* el veredicto de tienda */
.pc-veredicto{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--punto) 13%,var(--color-papel));font-size:13.5px;line-height:1.4;min-height:62px}
.pc-veredicto::before{content:"";flex:none;width:10px;height:10px;margin-top:.38em;border-radius:50%;background:var(--punto)}
.pc-v-verde{--punto:var(--color-verde)}
.pc-v-ambar{--punto:var(--color-ambar)}
.pc-v-pizarra{--punto:var(--color-pizarra)}

.pc-pq{margin-top:auto;align-self:flex-start;min-height:36px;gap:9px}
.pc-pq svg{width:14px;height:14px;transition:transform 240ms var(--ease-cayla)}
.pc-pq[aria-expanded=true]{background:var(--color-sand)}
.pc-pq[aria-expanded=true] svg{transform:rotate(180deg)}

/* ============ el despliegue «¿Por qué?»: baja bajo SU fila, la tarjeta no se mueve ============ */
.pc-detalle{grid-column:1/-1;position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:16px 28px;padding:22px 24px 22px;background:var(--color-papel);border:1px solid var(--color-tinta);border-radius:16px;animation:pc-entra 340ms var(--ease-cayla) both}
.pc-detalle::before{content:"";position:absolute;top:-8px;left:var(--pc-x,40px);width:14px;height:14px;background:var(--color-papel);border-left:1px solid var(--color-tinta);border-top:1px solid var(--color-tinta);transform:translateX(-50%) rotate(45deg)}
.pc-d-cab{grid-column:1/-1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.pc-d-cab h3{font-size:24px;line-height:1.15;margin-top:3px}
.pc-x{flex:none;width:36px;height:36px;margin:-6px -8px 0 0;border-radius:8px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--color-tinta-60)}
.pc-x:hover{background:var(--color-hueso);color:var(--color-tinta)}
.pc-fuentes{list-style:none;display:flex;flex-direction:column}
.pc-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--color-sand)}
.pc-fila:first-child{border-top:0;padding-top:0}
.pc-f-txt{grid-column:1/-1}
.pc-f-txt b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14.5px;font-weight:600}
.pc-f-txt>span{display:block;font-size:12.5px;line-height:1.4;color:var(--color-tinta-60);margin-top:1px}
.pc-f-pista{position:relative;height:12px;border-radius:6px;background:var(--color-hueso)}
.pc-f-pista i.pc-rel{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--color-taupe) 74%,var(--color-papel));transform-origin:left;animation:pc-llena 500ms var(--ease-cayla) 120ms both}
.pc-f-pista i.pc-rel.pc-fuerte{background:var(--color-tinta);animation-delay:320ms}
.pc-f-pista i.pc-banda{position:absolute;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--color-pizarra) 26%,var(--color-papel));border:1px solid color-mix(in srgb,var(--color-pizarra) 55%,var(--color-papel));transform-origin:left;animation:pc-llena 500ms var(--ease-cayla) 220ms both}
.pc-f-pista i.pc-punto{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--color-pizarra);border:3px solid var(--color-papel);animation:pc-sube 300ms var(--ease-cayla) 520ms both}
.pc-f-val{font-family:var(--serif);font-size:28px;line-height:1;text-align:right;min-width:78px;font-variant-numeric:lining-nums tabular-nums}
.pc-f-val.pc-fuerte{font-weight:600}
.pc-f-val.pc-dudoso{color:var(--color-tinta-60)}
.pc-cierre{font-size:13.5px;line-height:1.5}
.pc-cierre b{color:var(--color-tinta);font-weight:600}

@container pc (min-width:560px){
  .pc-fila{grid-template-columns:minmax(210px,1fr) minmax(0,1.1fr) auto}
  .pc-f-txt{grid-column:auto}
}
@container pc (min-width:900px){
  .pc-fila{grid-template-columns:minmax(280px,.8fr) minmax(0,1.6fr) 96px}
}

/* ============ fuera del riel: dos fichas bajas ============ */
.pc-fuera{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pc-fuera-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.pc-fuera-cab .pc-t{font-size:13px;color:var(--color-tinta-60)}
.pc-fichas{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container pc (min-width:560px){.pc-fichas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc-ficha{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px 12px 12px;background:var(--color-hueso);border-radius:14px;animation:pc-entra 380ms var(--ease-cayla) 420ms both}
.pc-ficha .pc-tile{width:42px;height:42px;border-radius:12px;background:var(--color-papel)}
.pc-ficha .pc-tile svg{width:25px;height:25px}
.pc-ficha .pc-nombre{font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:0}
.pc-ficha .pc-quien{gap:0}
.pc-ficha .pc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;font-size:12.5px;color:var(--color-tinta-60)}
.pc-ficha .pc-rol:hover,.pc-ficha .pc-rol[aria-expanded=true]{background:var(--color-sand)}
.pc-ficha .pc-ayuda{left:0;right:0}
.pc-ficha .pc-cuantas{font-family:var(--serif);font-size:30px;line-height:1;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.pc-ficha .pc-cuantas small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--color-tinta-60);margin-top:2px}

/* ============ cómo se calcula: una línea y un toque ============ */
.pc-como{display:flex;flex-direction:column;gap:10px;margin-top:2px;font-size:13px;color:var(--color-tinta-60)}
.pc-enlace{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 4px;margin-left:2px;font-size:13px;font-weight:600;color:var(--color-tinta);text-decoration:underline;text-decoration-color:var(--color-taupe);text-underline-offset:4px;border-radius:6px}
.pc-enlace svg{width:13px;height:13px;transition:transform 240ms var(--ease-cayla)}
.pc-enlace[aria-expanded=true] svg{transform:rotate(180deg)}
.pc-pasos{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;animation:pc-entra 320ms var(--ease-cayla) both}
@container pc (min-width:900px){.pc-pasos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc-pasos li{display:flex;gap:12px;align-items:flex-start;line-height:1.45;color:var(--color-tinta)}
.pc-pasos em{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--color-papel);font-style:normal;font-size:12.5px;font-weight:700;color:var(--color-taupe-profundo)}
.pc-como-nota{display:flex;flex-direction:column;gap:12px;animation:pc-entra 320ms var(--ease-cayla) both}
.pc-como-nota>p{font-size:13px;color:var(--color-tinta-60)}

/* ============ celular / contenedor angosto ============ */
@container pc (max-width:559px){
  .pc-resumen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pc-dato:first-child{grid-column:1/-1;border-bottom:1px solid var(--color-sand)}
  .pc-dato+.pc-dato{border-left:0}
  .pc-dato:nth-child(3){border-left:1px solid var(--color-sand)}
  .pc-dato{padding:16px}
  .pc-dato:nth-child(n+2) .pc-dato-cab{align-items:flex-start;min-height:52px}
  .pc-grande{font-size:34px}
  .pc-dato:first-child .pc-grande{font-size:44px}
  .pc-dato:first-child .pc-grande small{font-size:20px}
  .pc-cifras{--pc-g:42px;--pc-h:30px}
  .pc-flecha{margin-top:28px}
  .pc-card{padding:16px;gap:15px}
  .pc-rol{min-height:36px}
  .pc-pq{min-height:44px}
  .pc-x{width:40px;height:40px}
  .pc-enlace{display:flex;width:fit-content;min-height:40px;margin:2px 0 0;padding-left:0}
  .pc-detalle{padding:20px 16px}
  .pc-d-cab h3{font-size:21px}
  .pc-ficha{grid-template-columns:auto minmax(0,1fr)}
  .pc-ficha .pc-cuantas{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:7px}
  .pc-ficha .pc-cuantas small{display:inline;margin:0}
  .pc-titulo h2{font-size:23px}
}
@container pc (min-width:560px) and (max-width:899px){
  .pc-dato{padding:16px 16px}
  .pc-grande{font-size:32px}
  .pc-grande small{font-size:17px}
  .pc-dato:first-child .pc-grande{font-size:48px}
  .pc-dato:first-child .pc-grande small{font-size:22px}
  .pc-card{padding:16px}
  .pc-nombre{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.pc-raiz *{animation:none!important;transition:none!important}}
</style>

<div class="pc-raiz" id="pc-raiz" data-pc="c"></div>

<script>
(function(){
  var D = window.DATOS, raiz = document.getElementById('pc-raiz');
  if (!D || !raiz) return;

  /* ---------- formato Perú: miles con coma, decimales con punto ---------- */
  function n(x){ return Number(x).toLocaleString('en-US'); }
  function p(x){ return String(+Number(x).toFixed(1)) + ' %'; }
  function pl(c, uno, varios){ return c === 1 ? uno : varios; }

  /* ---------- textos de ayuda del rol: los de ROL_AYUDA (apps/web/lib/plan-piso-grupos.ts) ---------- */
  var ROL_AYUDA = {
    'Destino': 'Lo que el cliente viene a buscar: trae gente a la tienda y la hace volver.',
    'Rutina': 'Lo que se compra seguido y completa el look de lo que trae gente.',
    'Ocasional': 'Un look completo en una sola compra, o un complemento de compra más alta.',
    'De temporada': 'Depende del clima y de la época del año.',
    'Conveniencia': 'Se suma al paso, junto a la caja.'
  };

  /* ---------- siluetas sencillas: la prenda sin foto es el ícono de su grupo sobre su color ---------- */
  var F = 'fill="currentColor" fill-opacity=".16"';
  var ICO = {
    polos_tops_blusas: '<path ' + F + ' d="M11.2 5.2 4.8 8.4l2.4 5 3.4-1.5v14.7h10.8V11.9l3.4 1.5 2.4-5-6.4-3.2C19.9 7.1 18.2 8.2 16 8.2s-3.9-1.1-4.8-3Z"/>',
    jeans: '<path ' + F + ' d="M9.5 4.5h13l1.7 23h-6.6L16 12.8l-1.6 14.7H7.8l1.7-23Z"/><path d="M9.7 8.2h12.6M16 8.2v4.6"/>',
    pantalones_faldas_shorts: '<path ' + F + ' d="M11 5h10l5.5 21.5h-21L11 5Z"/><path d="M11.6 9h8.8M14 9l-1.6 17.5M18 9l1.6 17.5"/>',
    vestidos_conjuntos: '<path ' + F + ' d="M12.9 9.2 10.6 14.2 5.6 27.4h20.8l-5-13.2-2.3-5c-1.1 2.2-5.1 2.2-6.2 0Z"/><path d="M12.4 3.8l.5 5.4M19.6 3.8l-.5 5.4M10.6 14.2h10.8"/>',
    bodys_corsets_lenceria: '<path ' + F + ' d="M11.9 9.6 9.4 15.6c1.5 2 2.8 4 3 6.8l.4 4.6h6.4l.4-4.6c.2-2.800 1.500-4.800 3-6.800l-2.500-6c-.7 2.400-2.100 3.600-4.100 3.600s-3.400-1.200-4.100-3.600Z"/><path d="M11.4 4.2l.5 5.4M20.6 4.2l-.5 5.400M13.600 27h4.800"/>',
    abrigo_y_capas: '<path ' + F + ' d="M12.2 4.4 16 11l3.800-6.600 6.600 3.200-1 17h-3.800V28H10.400v-3.400H6.600l-1-17 6.600-3.200Z"/><path d="M16 11v17"/><circle cx="18.600" cy="16.500" r=".9" fill="currentColor"/><circle cx="18.600" cy="21.500" r=".9" fill="currentColor"/>',
    accesorios_de_impulso: '<rect ' + F + ' x="3.500" y="12" width="25" height="8" rx="2.500"/><rect x="12" y="10.200" width="8" height="11.600" rx="2.200" fill="none"/><path d="M15 16h2"/>',
    bolsos_y_calzado: '<path ' + F + ' d="M7 12h18l1.500 15h-21L7 12Z"/><path d="M11.500 12V9.500C11.500 6.500 13.500 5 16 5s4.500 1.500 4.500 4.500V12"/>'
  };
  function svg(k){ return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (ICO[k] || '') + '</svg>'; }

  /* ---------- cada grupo, su color (solo tokens; el rojo no pinta grupos) ---------- */
  var COLOR = {
    polos_tops_blusas: 'var(--color-taupe)',
    jeans: 'var(--color-pizarra)',
    pantalones_faldas_shorts: 'var(--color-verde)',
    vestidos_conjuntos: 'var(--color-ambar)',
    bodys_corsets_lenceria: 'color-mix(in srgb,var(--color-taupe) 50%,var(--color-pizarra))',
    abrigo_y_capas: 'color-mix(in srgb,var(--color-verde) 50%,var(--color-ambar))',
    accesorios_de_impulso: 'var(--color-taupe)',
    bolsos_y_calzado: 'var(--color-taupe)'
  };

  var CHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.500 6 4.500 4.500L12.500 6"/></svg>';
  var FLECHA = '<svg class="pc-flecha" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h17M15 7l6 6-6 6"/></svg>';

  /* ---------- derivados exactos ---------- */
  var libres = D.capacidad - D.colgadasEnElRiel;
  var llenadoPct = D.colgadasEnElRiel / D.capacidad * 100;      // 4.33 %
  var pesoI = 100 - D.pesoVentaPct;                              // 94 %
  var ESC = Math.ceil(Math.max.apply(null, D.grupos.map(function (g) { return Math.max(g.hoyPct, g.propuestaPct); })) / 10) * 10; // misma escala para todas: 50 %

  /* el veredicto sale de comparar su parte de hoy con su parte propuesta; siempre condicionado a que el piso no cuadró */
  function veredicto(g) {
    var d = g.hoyPct - g.propuestaPct;
    if (!D.cuadrado) {
      if (Math.abs(d) < 2) return { t: 'verde', txt: 'Parece parejo: lleva la parte que le toca.' };
      if (d < 0) return { t: 'ambar', txt: 'Parece que le falta lugar: le tocaría una parte mayor.' };
      return { t: 'pizarra', txt: 'Parece que ocupa de más: le tocaría una parte menor.' };
    }
    if (Math.abs(d) < 2) return { t: 'verde', txt: 'Está parejo: lleva la parte que le toca.' };
    if (d < 0) return { t: 'ambar', txt: 'Le falta lugar: le toca una parte mayor.' };
    return { t: 'pizarra', txt: 'Ocupa de más: le toca una parte menor.' };
  }

  /* ---------- piezas ---------- */
  function rolBtn(rol, id) {
    return '<button type="button" class="pc-rol" aria-expanded="false" aria-controls="' + id + '" aria-label="' + rol + ': qué significa">' + rol + '<span class="pc-q" aria-hidden="true">?</span></button>';
  }
  function rolAyuda(rol, id) {
    return '<div class="pc-ayuda" id="' + id + '" role="note" hidden><b>' + rol + '</b>' + (ROL_AYUDA[rol] || '') + '</div>';
  }

  function resumen() {
    return '<section class="pc-resumen" aria-label="Estado general del riel">' +
      '<div class="pc-dato">' +
        '<div class="pc-dato-cab"><span class="cy-label">Cuelga hoy</span><span class="cy-chip ambar">Por cuadrar</span></div>' +
        '<div class="pc-grande">' + n(D.colgadasEnElRiel) + '<small>de ' + n(D.capacidad) + '</small></div>' +
        '<div class="pc-fino" role="img" aria-label="' + n(D.colgadasEnElRiel) + ' de ' + n(D.capacidad) + ' ganchos, según el sistema"><i style="width:' + llenadoPct.toFixed(2) + '%"></i></div>' +
        '<p class="pc-sub">Es lo que el sistema cree que cuelga. Lo real puede ser mucho más.</p>' +
      '</div>' +
      '<div class="pc-dato">' +
        '<div class="pc-dato-cab"><span class="cy-label">Ventas confirmadas</span></div>' +
        '<div class="pc-grande">' + D.ventasConfirmadas + '<small>en ' + D.dias + ' días</small></div>' +
        '<p class="pc-sub">Otras ' + n(D.ventasSinRegistrar) + ' sin registrar aún no cuentan. Con tan pocas, tus ventas cuentan solo ' + D.pesoVentaPct + ' % en la propuesta.</p>' +
      '</div>' +
      '<div class="pc-dato">' +
        '<div class="pc-dato-cab"><span class="cy-label">Capacidad</span>' + (D.capacidadProvisional ? '<span class="cy-chip ambar">Provisional</span>' : '<span class="cy-chip verde">Contada</span>') + '</div>' +
        '<div class="pc-grande">' + n(D.capacidad) + '<small>ganchos</small></div>' +
        '<p class="pc-sub">' + (D.capacidadProvisional ? 'Falta contar los ganchos del riel de verdad.' : 'Contada en el riel.') + '</p>' +
      '</div>' +
    '</section>';
  }

  function aviso() {
    return '<div class="cy-aviso pc-aviso" role="status"><div><b>' + D.categoriasPorRevisar + ' categorías esperan revisión</b>' +
      '<span>La propuesta usa el grupo que puso el sistema. Confírmalas en la pestaña Grupos.</span></div>' +
      '<button type="button" class="cy-btn">Revisar las ' + D.categoriasPorRevisar + ' categorías <span aria-hidden="true">→</span></button></div>';
  }

  function tarjeta(g, i) {
    var v = veredicto(g), id = 'pc-r-' + i;
    return '<article class="pc-card" data-i="' + i + '" style="--i:' + i + ';--g:' + COLOR[g.clave] + '" aria-labelledby="pc-n-' + i + '">' +
      '<div class="pc-cab">' +
        '<span class="pc-tile" aria-hidden="true">' + svg(g.clave) + '</span>' +
        '<div class="pc-quien"><h3 class="pc-nombre" id="pc-n-' + i + '">' + g.nombre + '</h3>' + rolBtn(g.rol, id) + '</div>' +
        rolAyuda(g.rol, id) +
      '</div>' +
      '<div class="pc-cifras">' +
        '<div class="pc-cifra pc-hoy"><span class="cy-label">Hoy</span><strong>' + n(g.hoy) + '</strong><span class="pc-pie">prendas, según el sistema</span></div>' +
        FLECHA +
        '<div class="pc-cifra pc-prop"><span class="cy-label">Propuesta</span><strong>' + n(g.propuesta) + '</strong><span class="pc-pie">ganchos en el riel</span></div>' +
      '</div>' +
      '<div class="pc-barras" role="group" aria-label="Su parte del riel">' +
        '<div class="pc-cap"><span class="cy-label">Su parte del total</span><span class="pc-esc">barra llena = ' + ESC + ' %</span></div>' +
        '<span class="pc-et">Hoy</span><div class="pc-pista pc-hoy"><i style="width:' + (g.hoyPct / ESC * 100).toFixed(2) + '%"></i></div><span class="pc-val">' + p(g.hoyPct) + '</span>' +
        '<span class="pc-et">Propuesta</span><div class="pc-pista pc-prop"><i style="width:' + (g.propuestaPct / ESC * 100).toFixed(2) + '%"></i></div><span class="pc-val">' + p(g.propuestaPct) + '</span>' +
      '</div>' +
      '<p class="pc-veredicto pc-v-' + v.t + '">' + v.txt + '</p>' +
      '<button type="button" class="cy-btn pc-pq" aria-expanded="false" aria-controls="pc-d-' + i + '" aria-label="¿Por qué? ' + g.nombre + ' queda en ' + p(g.propuestaPct) + '">¿Por qué? ' + CHEV + '</button>' +
    '</article>';
  }

  function detalle(g, i) {
    var lo = g.ventaRango[0], hi = g.ventaRango[1];
    var quien = g.ventas === 0
      ? 'Ninguna de las ' + D.ventasConfirmadas + ' ventas confirmadas fue de este grupo.'
      : g.ventas + pl(g.ventas, ' venta', ' ventas') + ' de las ' + D.ventasConfirmadas + ' confirmadas.';
    var cerca = Math.abs(g.propuestaPct - g.industriaPct) < 1.5;
    var ancho = hi - lo;                                              // cuánto se mueve lo vendido por puro azar
    var duda = ancho > 40;
    var seguro = duda ? 'Casi no sabemos' : (ancho > 20 ? 'Poco seguro' : 'Bastante seguro');
    var pocas = D.pesoVentaPct < 30;
    return '<div class="pc-detalle" id="pc-d-' + i + '" data-i="' + i + '" role="region" aria-label="Por qué ' + g.nombre + ' queda en ' + p(g.propuestaPct) + '" hidden>' +
      '<div class="pc-d-cab"><div><span class="cy-label">¿Por qué?</span><h3>' + g.nombre + ' queda en ' + p(g.propuestaPct) + ' del riel</h3></div>' +
        '<button type="button" class="pc-x" aria-label="Cerrar la explicación">×</button></div>' +
      '<div>' +
        '<ol class="pc-fuentes">' +
          '<li class="pc-fila"><div class="pc-f-txt"><b>Lo habitual en tiendas de ropa</b><span>Lo que suele llevar una tienda como la tuya.</span></div>' +
            '<div class="pc-f-pista" aria-hidden="true"><i class="pc-rel" style="width:' + g.industriaPct + '%"></i></div><div class="pc-f-val">' + p(g.industriaPct) + '</div></li>' +
          '<li class="pc-fila"><div class="pc-f-txt"><b>Lo que vendiste <span class="cy-chip">' + seguro + '</span></b><span>' + quien + ' Podría estar entre ' + p(lo) + ' y ' + p(hi) + '.</span></div>' +
            '<div class="pc-f-pista" aria-hidden="true"><i class="pc-banda" style="left:' + lo + '%;width:' + (hi - lo) + '%"></i><i class="pc-punto" style="left:' + g.ventaPct + '%"></i></div><div class="pc-f-val' + (duda ? ' pc-dudoso' : '') + '">' + p(g.ventaPct) + '</div></li>' +
          '<li class="pc-fila"><div class="pc-f-txt"><b>La propuesta</b><span>La mezcla de las dos.</span></div>' +
            '<div class="pc-f-pista" aria-hidden="true"><i class="pc-rel pc-fuerte" style="width:' + g.propuestaPct + '%"></i></div><div class="pc-f-val pc-fuerte">' + p(g.propuestaPct) + '</div></li>' +
        '</ol>' +
      '</div>' +
      '<p class="cy-nota pc-cierre">' + (pocas ? 'Como hay pocas ventas, tus ventas cuentan solo <b>' : 'Tus ventas cuentan <b>') + D.pesoVentaPct + ' %</b> y lo habitual en tiendas de ropa, <b>' + pesoI + ' %</b>. Por eso la propuesta queda en <b>' + p(g.propuestaPct) + '</b>, ' +
        (cerca ? 'casi igual a lo habitual (' + p(g.industriaPct) + ').' : 'entre lo habitual y lo que vendiste.') + '</p>' +
    '</div>';
  }

  function ficha(f, i) {
    var id = 'pc-rf-' + i;
    return '<article class="pc-ficha" style="--g:' + COLOR[f.clave] + '">' +
      '<span class="pc-tile" aria-hidden="true">' + svg(f.clave) + '</span>' +
      '<div class="pc-quien"><h3 class="pc-nombre">' + f.nombre + '</h3>' +
        '<div class="pc-meta">' + rolBtn(f.rol, id) + '<span>Meta: ' + f.meta + ' de la venta</span></div></div>' +
      '<div class="pc-cuantas">' + n(f.colgadas) + '<small>' + pl(f.colgadas, 'prenda', 'prendas') + '</small></div>' +
      rolAyuda(f.rol, id) +
    '</article>';
  }

  function fuera() {
    return '<section class="pc-fuera" aria-labelledby="pc-fuera-t">' +
      '<div class="pc-fuera-cab"><span class="cy-label" id="pc-fuera-t">Fuera del riel</span><span class="pc-t">No cuelgan del riel: se miden contra lo que venden. Cifras según el sistema.</span></div>' +
      '<div class="pc-fichas">' + D.fuera.map(ficha).join('') + '</div></section>';
  }

  function como() {
    return '<section class="pc-como" aria-label="Cómo se calcula">' +
      '<p>La propuesta reparte los ' + n(D.capacidad) + ' ganchos mezclando lo que suelen llevar las tiendas de ropa (' + pesoI + ' %) con lo que vende tu sede (' + D.pesoVentaPct + ' %). ' +
      '<button type="button" class="pc-enlace" id="pc-como-b" aria-expanded="false" aria-controls="pc-como-d">¿Cómo se calcula? ' + CHEV + '</button></p>' +
      '<div id="pc-como-d" class="pc-como-nota" hidden>' +
        '<ol class="pc-pasos cy-nota">' +
          '<li><em>1</em><span>Tomamos lo que suelen llevar las tiendas de ropa en cada grupo.</span></li>' +
          '<li><em>2</em><span>Miramos lo que tu sede vendió en ' + D.dias + ' días: ' + D.ventasConfirmadas + ' ventas confirmadas. Las ' + n(D.ventasSinRegistrar) + ' sin registrar aún no cuentan.</span></li>' +
          '<li><em>3</em><span>Mezclamos las dos. Con tan pocas ventas, casi manda lo habitual.</span></li>' +
        '</ol>' +
        '<p>El «hoy» es lo que el sistema cree que cuelga. Mientras no cuadres el piso, puede estar lejos de lo real.</p>' +
      '</div>' +
    '</section>';
  }

  raiz.innerHTML =
    resumen() + aviso() +
    '<div class="pc-titulo"><h2>Cómo se reparte el riel</h2><p>Cada tarjeta es un grupo. Las barras usan la misma escala en todas.</p></div>' +
    '<div class="pc-rejilla" id="pc-rejilla">' + D.grupos.map(tarjeta).join('') + D.grupos.map(detalle).join('') + '</div>' +
    fuera() + como();

  /* ---------- comportamiento ---------- */
  var rejilla = raiz.querySelector('#pc-rejilla');
  var cards = [].slice.call(rejilla.querySelectorAll('.pc-card'));
  var dets = [].slice.call(rejilla.querySelectorAll('.pc-detalle'));

  // El despliegue baja bajo SU fila (no mueve la tarjeta que tocaste): se ordena tras la última tarjeta de esa fila.
  function columnas() {
    var c = getComputedStyle(rejilla).gridTemplateColumns.split(' ').filter(Boolean).length;
    return c > 0 && c < 5 ? c : 1;
  }
  function acomoda() {
    if (!raiz.offsetWidth) return;
    var N = columnas();
    cards.forEach(function (c, i) { c.style.order = i * 10; });
    dets.forEach(function (d, i) {
      var ultima = Math.min((Math.floor(i / N) + 1) * N - 1, cards.length - 1);
      d.style.order = ultima * 10 + 1 + (i % N);
      if (!d.hidden) caret(i);
    });
  }
  function caret(i) {
    var rc = cards[i].getBoundingClientRect(), rd = dets[i].getBoundingClientRect();
    if (!rd.width) return;
    dets[i].style.setProperty('--pc-x', Math.round(rc.left + rc.width / 2 - rd.left) + 'px');
  }
  function abre(i, si) {
    dets[i].hidden = !si;
    if (si) { cards[i].setAttribute('data-abierta', ''); } else { cards[i].removeAttribute('data-abierta'); }
    cards[i].querySelector('.pc-pq').setAttribute('aria-expanded', String(si));
    acomoda();
    if (si) caret(i);
  }

  function cierraAyudas(salvo) {
    raiz.querySelectorAll('.pc-rol[aria-expanded=true]').forEach(function (b) {
      if (b === salvo) return;
      b.setAttribute('aria-expanded', 'false');
      var a = document.getElementById(b.getAttribute('aria-controls')); if (a) a.hidden = true;
    });
  }

  raiz.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    var rol = t.closest('.pc-rol');
    if (rol) {
      var a = document.getElementById(rol.getAttribute('aria-controls')), ab = rol.getAttribute('aria-expanded') !== 'true';
      cierraAyudas(rol);
      rol.setAttribute('aria-expanded', String(ab)); a.hidden = !ab;
      return;
    }
    cierraAyudas(null);
    var pq = t.closest('.pc-pq');
    if (pq) { var c = pq.closest('.pc-card'); abre(+c.dataset.i, pq.getAttribute('aria-expanded') !== 'true'); return; }
    var x = t.closest('.pc-x');
    if (x) { abre(+x.closest('.pc-detalle').dataset.i, false); var b = cards[+x.closest('.pc-detalle').dataset.i].querySelector('.pc-pq'); if (b) b.focus(); return; }
    var cb = t.closest('#pc-como-b');
    if (cb) { var ab2 = cb.getAttribute('aria-expanded') !== 'true'; cb.setAttribute('aria-expanded', String(ab2)); document.getElementById('pc-como-d').hidden = !ab2; }
  });
  document.addEventListener('click', function (e) { if (!raiz.contains(e.target)) cierraAyudas(null); });
  raiz.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var abiertas = raiz.querySelectorAll('.pc-rol[aria-expanded=true]');
    if (abiertas.length) { var b = abiertas[0]; cierraAyudas(null); b.focus(); e.stopPropagation(); }
  });

  // Polos, tops y blusas queda ABIERTA de entrada: así se ve el patrón de «¿Por qué?».
  abre(0, true);

  if (window.ResizeObserver) new ResizeObserver(acomoda).observe(raiz);
  window.addEventListener('plan:diseno', function () { requestAnimationFrame(acomoda); });
  acomoda();
})();
</script>
