<script>
(function(){
  var D=window.DATOS,root=document.querySelector('.p0-raiz[data-p0]');
  if(!D||!root)return;

  /* ---------- utilidades (la misma convención de Perú: coma de miles, punto decimal) ---------- */
  function n(x){return x.toLocaleString('en-US',{maximumFractionDigits:1})}
  function pct(x){return n(x)+' %'}
  function prendas(x){return n(x)+(x===1?' prenda':' prendas')}
  var cap=D.capacidad,hoyTotal=D.colgadasEnElRiel,cuadrado=D.cuadrado;
  var pesoPct=D.pesoVentaPct,muestra=Math.round(D.ventasConfirmadas/1.5*10)/10;
  var G=D.grupos,F=D.fuera;
  var ROL_AYUDA={'Destino':'Lo que el cliente viene a buscar: trae gente a la tienda y la hace volver.','Rutina':'Lo que se compra seguido y completa el look de lo que trae gente.','Ocasional':'Un look completo en una sola compra, o un complemento de compra más alta.','De temporada':'Depende del clima y de la época del año.','Conveniencia':'Se suma al paso, junto a la caja.'};

  function chip(rol,extra){return '<span class="p0-chip'+(extra||'')+'" title="'+(ROL_AYUDA[rol]||'')+'">'+rol+'</span>'}

  /* ---------- barra apilada: cada tramo crece por su parte de la pista; lo que sobra es «resto» ---------- */
  function barra(segs,o){
    o=o||{};var suma=segs.reduce(function(a,s){return a+(s.valor>0?s.valor:0)},0);
    var pista=Math.max(o.total||suma,suma),resto=pista>suma&&suma>0?(pista-suma)/pista*100:0;
    var vivos=segs.filter(function(s){return s.valor>0});
    var h='<span class="p0-barra" data-alto="'+(o.alto||12)+'" '+(o.deco?'aria-hidden="true"':'role="group" aria-label="'+(o.etiqueta||'')+'"')+'>';
    vivos.forEach(function(s,i){
      var estilo='flex-grow:'+(s.valor/pista*100)+';--i:'+((o.retraso||0)+i);
      var capa='<i class="'+s.clase+'"></i>';
      if(o.responde){
        h+='<button type="button" class="p0-tr" data-g="'+s.clave+'" aria-pressed="false" title="'+s.titulo+'" aria-label="'+s.etiqueta+'" style="'+estilo+'">'+capa+'</button>';
      }else{
        h+='<span class="p0-tr" style="'+estilo+'">'+capa+'</span>';
      }
    });
    if(resto>0.01)h+='<span class="p0-resto" aria-hidden="true" style="flex-grow:'+resto+'"></span>';
    return h+'</span>';
  }

  /* ---------- 1 · tres tarjetas ---------- */
  var cifras=
    '<div class="p0-cifras">'+
      '<div class="p0-card p0-cifra p0-acento p0-sube" style="--i:0">'+
        '<p class="p0-lbl">Cuelga hoy</p>'+
        '<p class="p0-val"><b>'+n(hoyTotal)+'</b><span>de '+n(cap)+'</span></p>'+
        '<div class="p0-ctx">'+(cuadrado?'prendas en el riel, según el sistema':'por cuadrar: lo real puede ser mucho más')+'</div>'+
        '<div class="p0-pie"><span>caben '+n(cap)+(D.capacidadProvisional?' · provisional: falta contarlas':' · m² × prendas por m²')+'</span>'+
          barra([{clave:'colgadas',valor:hoyTotal,clase:'p0-c-conf'}],{alto:4,deco:true,total:cap})+'</div>'+
      '</div>'+
      '<div class="p0-card p0-cifra p0-sube" style="--i:1">'+
        '<p class="p0-lbl">Ventas confirmadas</p>'+
        '<p class="p0-val"><b>'+n(D.ventasConfirmadas)+'</b></p>'+
        '<div class="p0-ctx">en '+D.dias+' días</div>'+
        '<div class="p0-pie"><span>'+n(D.ventasConfirmadas)+(D.ventasConfirmadas===1?' confirmada':' confirmadas')+(D.ventasSinRegistrar>0?' · '+n(D.ventasSinRegistrar)+' sin registrar, que aún '+(D.ventasSinRegistrar===1?'no cuenta':'no cuentan'):'')+'</span>'+
          barra([{clave:'conf',valor:D.ventasConfirmadas,clase:'p0-c-conf'},{clave:'sin',valor:D.ventasSinRegistrar,clase:'p0-c-sin'}],{alto:4,deco:true})+'</div>'+
      '</div>'+
      '<div class="p0-card p0-cifra p0-sube" style="--i:2">'+
        '<p class="p0-lbl">Peso de la venta</p>'+
        '<p class="p0-val"><b>'+pesoPct+' %</b></p>'+

      var f=indiceDe(foco());var ancho=panel.clientWidth;if(!ancho)return;
      cvs.forEach(function(cv,k){dibujarRiel(cv,k?proG:hoyG,ancho,f,defs[k].atenuado)});
    };
    cvs.forEach(function(cv,k){
      var ganchos=k?proG:hoyG,campo=defs[k].campo;
      function grupoEn(e){
        var r=cv.getBoundingClientRect(),g=cuadricula(ganchos.length,r.width);
        var col=Math.floor((e.clientX-r.left)/r.width*g.columnas),fila=Math.floor((e.clientY-r.top-3)/(g.ancho/g.columnas*1.5));
        if(col<0||col>=g.columnas||fila<0||fila>=g.filas)return null;
        var i=fila*g.columnas+col;return i<ganchos.length?ganchos[i]:null;
      }
      var tip=null;
      cv.addEventListener('mousemove',function(e){
        var gi=grupoEn(e),r=cv.getBoundingClientRect();
        if(gi===null||gi<0){hover=null;if(tip){tip.remove();tip=null}pintar();return}
        hover=G[gi].clave;pintar();
        if(!tip){tip=document.createElement('div');tip.className='p0-tip';tip.setAttribute('role','status');cv.parentNode.appendChild(tip)}
        tip.textContent=G[gi].nombre+' · '+G[gi][campo]+' prendas';
        tip.style.left=Math.max(4,Math.min(e.clientX-r.left+12,r.width-190))+'px';tip.style.top=(e.clientY-r.top+12)+'px';
      });
      cv.addEventListener('mouseleave',function(){hover=null;if(tip){tip.remove();tip=null}pintar()});
      cv.addEventListener('click',function(e){var gi=grupoEn(e);fijo=gi===null||gi<0?null:(fijo===G[gi].clave?null:G[gi].clave);pintar()});
    });
  }
  var ro=null,mo=null;
  boton.addEventListener('click',function(){
    abierto=!abierto;boton.setAttribute('aria-expanded',String(abierto));panel.hidden=!abierto;
    botonT.textContent=abierto?'Ocultar los ganchos':'Ver cada gancho ('+n(cap)+')';
    if(abierto){
      montarGanchos();dib();
      if(window.ResizeObserver){ro=new ResizeObserver(function(){if(abierto&&dib)dib()});ro.observe(panel)}
      mo=new MutationObserver(function(){if(abierto&&dib)dib()});mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-tema']});
    }else{
      if(ro){ro.disconnect();ro=null}if(mo){mo.disconnect();mo=null}panel.innerHTML='';dib=null;
    }
  });
})();
</script>
