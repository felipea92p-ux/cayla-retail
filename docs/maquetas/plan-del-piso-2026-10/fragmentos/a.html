<!-- DIRECCIÓN A · «LA PERCHA» — la pantalla se parece al riel de la tienda.
     Un pictograma de perchas: cada percha dibujada = 50 prendas (1,800 lugares = 36 perchas), agrupadas en tramos por grupo.
     Todo sale de window.DATOS. Colores: solo tokens var(--color-*). Selectores con prefijo pa-. -->
<style>
.pa-raiz{container-type:inline-size;container-name:pa;display:grid;gap:18px;color:var(--color-tinta);font-family:var(--sans);min-width:0}
.pa-raiz *,.pa-raiz *::before,.pa-raiz *::after{box-sizing:border-box}
.pa-raiz button{text-align:left;color:inherit}
.pa-defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- la tarjeta del riel ---------- */
.pa-card{--pa-pad:24px;--pa-banda:14px;--pa-gap:9px;--pa-solape:.4;
  --pa-poste:color-mix(in srgb,var(--color-tinta) 58%,transparent);
  background:var(--color-papel);border:1px solid var(--color-sand);border-radius:var(--radius-xl);padding:var(--pa-pad);display:grid;gap:26px}
@container pa (max-width:760px){.pa-card{--pa-pad:20px;--pa-banda:12px}}
@container pa (max-width:560px){.pa-card{--pa-pad:16px;--pa-banda:10px;gap:22px}}

/* color de cada grupo: solo tokens (el rojo no se usa para pintar un grupo) */
.pa-card [data-g="polos_tops_blusas"]{--pa-c:var(--color-taupe)}
.pa-card [data-g="jeans"]{--pa-c:var(--color-pizarra)}
.pa-card [data-g="pantalones_faldas_shorts"]{--pa-c:var(--color-verde)}
.pa-card [data-g="vestidos_conjuntos"]{--pa-c:color-mix(in srgb,var(--color-ambar) 72%,var(--color-sand))}
.pa-card [data-g="bodys_corsets_lenceria"]{--pa-c:color-mix(in srgb,var(--color-taupe) 80%,var(--color-papel))}
.pa-card [data-g="abrigo_y_capas"]{--pa-c:color-mix(in srgb,var(--color-tinta) 82%,var(--color-papel))}
html[data-tema="oscuro"] .pa-card [data-g="bodys_corsets_lenceria"]{--pa-c:color-mix(in srgb,var(--color-taupe) 58%,var(--color-papel))}

/* ---------- estado: 78 de 1,800 ---------- */
.pa-estado{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 32px}
.pa-est-cifra{display:grid;gap:6px}
.pa-est-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pa-est-n b{font-family:var(--serif);font-weight:400;font-size:68px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.pa-est-n span{font-family:var(--serif);font-size:28px;line-height:1;color:var(--color-tinta-60);font-variant-numeric:lining-nums tabular-nums}
.pa-est-texto{flex:1 1 300px;display:grid;gap:10px;padding-top:2px}
.pa-est-chips{display:flex;flex-wrap:wrap;gap:6px 8px}
.pa-est-texto p{font-size:15px;line-height:1.45;color:var(--color-tinta);max-width:520px}
.pa-est-texto p em{font-style:normal;color:var(--color-tinta-60)}
@container pa (max-width:560px){.pa-est-n b{font-size:54px}.pa-est-n span{font-size:24px}.pa-estado{gap:12px}}

/* ---------- un riel (Hoy / Cómo quedaría) ---------- */
.pa-riel{display:grid;gap:10px;min-width:0}
.pa-rcab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.pa-rtit{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.pa-rsub{font-size:13px;color:var(--color-tinta-60)}
.pa-banda{background:color-mix(in srgb,var(--color-hueso) 52%,var(--color-papel));border-radius:var(--radius-lg);padding:14px var(--pa-banda) 16px;min-width:0}

.pa-rail{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px var(--pa-gap);
  --paso:clamp(15px,calc((100cqi - 2*var(--pa-pad) - 2*var(--pa-banda) - 5*var(--pa-gap) - 8px)/36),34px);
  --gw:calc(var(--paso)*(1 + var(--pa-solape)));--gh:calc(var(--gw)*1.5)}
.pa-blq{position:relative;flex:none;width:max(3px,calc(var(--paso)*var(--n)));padding-top:2px;display:flex;align-items:flex-start}
.pa-blq::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;border-radius:2px;background:var(--pa-poste);transition:opacity 220ms var(--ease-cayla)}
.pa-p{flex:none;display:block;width:calc(var(--gw)*var(--f,1));height:var(--gh);margin-right:calc(var(--gw)*var(--f,1)*var(--pa-solape)/(1 + var(--pa-solape))*-1);
  transform-origin:50% 0;animation:pa-cuelga 420ms var(--ease-cayla) backwards;animation-delay:calc(var(--i,0)*14ms)}
.pa-p{transition:opacity 220ms var(--ease-cayla)}
.pa-p svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes pa-cuelga{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}

/* el espacio libre: riel vacío y tranquilo (rayado = «según el sistema, sin contar») */
.pa-libre{flex:1 1 170px;position:relative;min-height:var(--gh);padding-top:2px;display:grid;place-content:center;justify-items:center;text-align:center;gap:1px;min-width:0}
.pa-libre::before{content:"";position:absolute;left:0;right:0;top:0;border-top:3px dashed color-mix(in srgb,var(--color-tinta) 30%,transparent)}
.pa-libre b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.pa-libre span{font-size:14px;font-weight:500}
.pa-libre small{font-size:12.5px;color:var(--color-tinta-60);max-width:260px;line-height:1.35;margin-top:3px}
.pa-libre{padding-top:10px}

/* etiquetas sobre cada tramo (solo cuando el riel es ancho) */
.pa-et{display:none;position:absolute;left:0;bottom:calc(100% + 7px);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--color-taupe-profundo);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
@container pa (min-width:900px){.pa-riel[data-riel="prop"] .pa-blq{margin-top:22px}.pa-riel[data-riel="prop"] .pa-et{display:block}}

/* resaltado al pasar por un grupo */
.pa-card[data-sel] .pa-blq:not(.pa-on)::before,.pa-card[data-sel] .pa-blq:not(.pa-on) .pa-p{opacity:.22}

/* silueta */
.pa-sil{fill:var(--pa-c);stroke:color-mix(in srgb,var(--color-tinta) 32%,transparent);stroke-width:.7;stroke-linejoin:round}
.pa-d{fill:none;stroke:var(--color-papel);stroke-width:1;opacity:.6;stroke-linecap:round;stroke-linejoin:round}
.pa-hg{fill:none;stroke:var(--color-tinta-60);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.pa-ic{display:block;flex:none;overflow:visible}
.pa-hd{fill:none;stroke:var(--pa-c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* leyenda de «Hoy»: una línea de fichas pequeñas */
.pa-chips{display:flex;flex-wrap:wrap;gap:6px 8px;list-style:none}
.pa-chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:3px 12px 3px 8px;border-radius:999px;border:1px solid var(--color-sand);background:var(--color-papel);font-size:12.5px;line-height:1.2;
}
.pa-chip .pa-ic{width:15px;height:19px}
.pa-chip b{font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.pa-chip:hover,.pa-chip.pa-on{background:color-mix(in srgb,var(--pa-c) 12%,var(--color-papel));border-color:var(--pa-c)}

/* leyenda de «Cómo quedaría» */
.pa-leyenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none}
@container pa (max-width:820px){.pa-leyenda{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container pa (max-width:480px){.pa-leyenda{grid-template-columns:minmax(0,1fr);gap:6px}.pa-lg{min-height:52px;padding:7px 14px 7px 12px}.pa-lg .pa-ic{width:26px;height:33px}.pa-lg-n{font-size:23px}}
.pa-leyenda li{display:flex}
.pa-lg{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 14px 9px 12px;border-radius:var(--radius-lg);border:1px solid var(--color-sand);background:var(--color-papel);
}
.pa-lg .pa-ic{width:30px;height:38px}
.pa-lg-t{display:grid;gap:2px;min-width:0;flex:1}
.pa-lg-t b{font-size:13.5px;font-weight:600;line-height:1.25}
.pa-lg-t small{font-size:12.5px;color:var(--color-tinta-60);line-height:1.3;font-variant-numeric:lining-nums tabular-nums}
.pa-lg-n{font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.pa-lg:hover,.pa-lg.pa-on{background:color-mix(in srgb,var(--pa-c) 10%,var(--color-papel));border-color:var(--pa-c)}
.pa-ic{transition:opacity 220ms var(--ease-cayla)}
.pa-card[data-sel] .pa-lg:not(.pa-on) .pa-ic,.pa-card[data-sel] .pa-chip:not(.pa-on) .pa-ic{opacity:.35}

/* pie del riel: escala + frase que cambia al pasar por un grupo */
.pa-pie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;font-size:12.5px;line-height:1.4;color:var(--color-tinta-60)}
.pa-escala{display:inline-flex;align-items:center;gap:8px}
.pa-escala .pa-ic{width:16px;height:24px}
.pa-escala .pa-hg{stroke-width:1.5}
.pa-cap{min-height:18px}
.pa-cap b{color:var(--color-tinta);font-weight:600}

/* botón «¿Por qué?» */
.pa-porque-btn{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px 4px 6px;border-radius:999px;border:1px solid var(--color-sand);background:var(--color-papel);font-size:12.5px;font-weight:500;line-height:1.2;
}
.pa-porque-btn:hover{background:var(--color-sand)}
.pa-porque-btn[aria-expanded="true"]{background:var(--color-hueso);border-color:var(--color-taupe)}
.pa-q{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--color-sand);font-family:var(--serif);font-size:14px;font-weight:600;line-height:1}

/* panel «cómo se calcula» */
.pa-panel{background:var(--color-hueso);border-radius:var(--radius-lg);padding:16px 18px;display:grid;gap:10px;font-size:13.5px;line-height:1.5;color:var(--color-tinta-60);animation:pa-entra 260ms var(--ease-cayla) both}
.pa-panel p{max-width:620px}
.pa-panel b{color:var(--color-tinta);font-weight:600}
.pa-panel .pa-pt{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--color-taupe-profundo);margin-top:4px}
.pa-panel ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
@container pa (max-width:700px){.pa-panel ul{grid-template-columns:minmax(0,1fr)}}
.pa-panel li{font-size:13px;line-height:1.4}
.pa-panel li b{display:block}
@keyframes pa-entra{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* aviso de las 45 categorías */
.pa-aviso{flex-wrap:wrap}
.pa-aviso>div{flex:1 1 260px;min-width:0}
.pa-aviso b{font-size:14.5px}
.pa-aviso span{line-height:1.4;display:block;margin-top:2px}

/* fuera del riel */
.pa-fuera{display:grid;gap:10px}
.pa-fuera-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.pa-fuera-cab span:last-child{font-size:13px;color:var(--color-tinta-60)}
.pa-fichas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;list-style:none}
@container pa (max-width:640px){.pa-fichas{grid-template-columns:minmax(0,1fr)}}
.pa-ficha{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--color-sand);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--color-hueso) 40%,var(--color-papel))}
.pa-ficha .pa-ic{width:28px;height:36px}
.pa-ficha{--pa-c:color-mix(in srgb,var(--color-tinta) 52%,var(--color-papel))}
.pa-ficha b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.pa-ficha span{display:block;font-size:12.5px;color:var(--color-tinta-60);line-height:1.35;font-variant-numeric:lining-nums tabular-nums}

@media (prefers-reduced-motion:reduce){.pa-p,.pa-panel{animation:none!important}.pa-p,.pa-blq::before,.pa-ic{transition:none!important}}
</style>

<div class="pa-raiz" id="pa-raiz">

<!-- siluetas: la prenda sin foto se dibuja como el ícono de su categoría (nunca el logo) -->
<svg class="pa-defs" aria-hidden="true" focusable="false"><defs>
  <symbol id="pa-h" viewBox="0 0 40 60"><g class="pa-hg"><path d="M20 12 V8 C20 5 21.6 3.2 23.7 3.2 C25.7 3.2 27.2 4.6 27.2 6.4"/><path d="M20 12 L4.5 24.5 H35.5 Z"/></g></symbol>
  <symbol id="pa-s-polos_tops_blusas" viewBox="0 0 40 60"><path d="M14.5 17.5 L4.5 22.5 L8 30 L13 27.5 L13 53.5 Q20 55.5 27 53.5 L27 27.5 L32 30 L35.5 22.5 L25.5 17.5 C24 21.2 16 21.2 14.5 17.5 Z"/></symbol>
  <symbol id="pa-s-jeans" viewBox="0 0 40 60"><path d="M12 17.5 H28 L30.8 55.5 H21.3 L20 31 L18.7 55.5 H9.2 Z"/><path class="pa-d" d="M12.2 22 H27.8 M20 22 V31"/></symbol>
  <symbol id="pa-s-pantalones_faldas_shorts" viewBox="0 0 40 60"><path d="M13 17.5 H27 L27.8 23 L36 53 Q20 57.5 4 53 L12.2 23 Z"/><path class="pa-d" d="M12.4 23 H27.6"/></symbol>

  <symbol id="pa-s-bodys_corsets_lenceria" viewBox="0 0 40 60"><path d="M13.5 16.5 L16.8 16.5 L18 22 C19 24.2 21 24.2 22 22 L23.2 16.5 L26.5 16.5 L27.8 27 C27.8 31.5 25.6 33.5 25.6 37.5 C29 39.5 31 43.5 31 47.5 C27.8 46.8 24.6 47.8 23.2 52 H16.8 C15.4 47.8 12.2 46.8 9 47.5 C9 43.5 11 39.5 14.4 37.5 C14.4 33.5 12.2 31.5 12.2 27 Z"/><path class="pa-d" d="M13.8 28 H26.2"/></symbol>
  <symbol id="pa-s-abrigo_y_capas" viewBox="0 0 40 60"><path d="M14 17 L7.2 20.4 L4 49 H10 L11.4 31.5 V56 H28.6 V31.5 L30 49 H36 L32.8 20.4 L26 17 L20 26.5 Z"/><path class="pa-d" d="M20 26.5 V56 M14.6 18.5 L17.8 32 M25.4 18.5 L22.2 32"/></symbol>
  <symbol id="pa-s-accesorios_de_impulso" viewBox="0 0 40 60"><path d="M5 27 H17.5 V34.5 C17.5 39 14.5 41.5 11.2 41.5 C7.8 41.5 5 39 5 34.5 Z"/><path d="M22.5 27 H35 V34.5 C35 39 32.2 41.5 28.8 41.5 C25.5 41.5 22.5 39 22.5 34.5 Z"/><path class="pa-hd" d="M17.5 29.5 Q20 27.4 22.5 29.5 M5 28 L2.5 25.5 M35 28 L37.5 25.5"/></symbol>
  <symbol id="pa-s-bolsos_y_calzado" viewBox="0 0 40 60"><path d="M7 30 H33 L35.5 52 Q35.5 54.5 33 54.5 H7 Q4.5 54.5 4.5 52 Z"/><path class="pa-hd" d="M13.5 30 V25 C13.5 19.5 26.5 19.5 26.5 25 V30"/><path class="pa-d" d="M5.5 38 H34.5"/></symbol>
</defs></svg>

<section class="pa-card" id="pa-card" aria-label="El riel de la tienda">

  <!-- 1 · el estado, en una línea -->
  <header class="pa-estado">
    <div class="pa-est-cifra">
      <span class="cy-label">Según el sistema, hoy cuelgan</span>
      <div class="pa-est-n"><b id="pa-n-hoy">78</b><span>de <span id="pa-n-cap" style="font-size:inherit;color:inherit">1,800</span> prendas</span></div>
    </div>
    <div class="pa-est-texto">
      <div class="pa-est-chips">
        <span class="cy-chip ambar">Por cuadrar</span>
        <span class="cy-chip" id="pa-chip-prov">Capacidad provisional</span>
        <span class="cy-chip ambar" id="pa-chip-cat"></span>
      </div>
      <p id="pa-frase"></p>
    </div>
  </header>

  <!-- 2 · los dos rieles -->
  <div class="pa-riel" data-riel="hoy">
    <div class="pa-rcab">
      <div class="pa-rtit"><span class="cy-label">Hoy</span><span class="pa-rsub" id="pa-sub-hoy"></span></div>
    </div>
    <div class="pa-banda"><div class="pa-rail" id="pa-rail-hoy" role="img"></div></div>
    <ul class="pa-chips" id="pa-chips-hoy" aria-label="Prendas de hoy por grupo"></ul>
  </div>

  <div class="pa-riel" data-riel="prop">
    <div class="pa-rcab">
      <div class="pa-rtit"><span class="cy-label">Cómo quedaría</span><span class="pa-rsub" id="pa-sub-prop"></span></div>
      <button type="button" class="pa-porque-btn" id="pa-btn-porque" aria-expanded="false" aria-controls="pa-panel"><span class="pa-q" aria-hidden="true">?</span><span id="pa-txt-porque"></span></button>
    </div>
    <div class="pa-banda"><div class="pa-rail" id="pa-rail-prop" role="img"></div></div>
    <ul class="pa-leyenda" id="pa-leyenda" aria-label="Reparto propuesto por grupo"></ul>
    <div class="pa-panel" id="pa-panel" hidden></div>
  </div>

  <div class="pa-pie">
    <span class="pa-escala"><svg class="pa-ic" viewBox="0 0 40 60" aria-hidden="true"><use href="#pa-h"/></svg><span>Cada percha = <b id="pa-unidad" style="color:var(--color-tinta);font-weight:600">50</b> prendas. Una percha angosta es menos de 50.</span></span>
    <span class="pa-cap" id="pa-cap" aria-live="polite">Pasa el cursor o toca un grupo para ver dónde cuelga.</span>
  </div>

  <!-- 3 · lo que toca hacer -->
  <div class="cy-aviso pa-aviso" role="note">
    <div><b id="pa-av-t"></b><span id="pa-av-d"></span></div>
    <button type="button" class="cy-btn" id="pa-av-b">Revisar las 45 categorías</button>
  </div>
</section>

<!-- 4 · lo que no cuelga del riel -->
<section class="pa-fuera" aria-label="Fuera del riel">
  <div class="pa-fuera-cab"><span class="cy-label">Fuera del riel</span><span>No entran en el reparto. Cifras según el sistema.</span></div>
  <ul class="pa-fichas" id="pa-fichas"></ul>
</section>

</div>

<script>
(function(){
  var D=window.DATOS,R=document.getElementById('pa-raiz');
  if(!D||!R)return;
  var UNIDAD=50;
  var CORTO={polos_tops_blusas:'Polos',jeans:'Jeans',pantalones_faldas_shorts:'Pantalones',vestidos_conjuntos:'Vestidos',bodys_corsets_lenceria:'Bodys',abrigo_y_capas:'Abrigo'};
  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return Number(n).toLocaleString('en-US')};
  var pl=function(n,a,b){return n===1?a:b};
  var libres=D.capacidad-D.colgadasEnElRiel;
  var pctHoy=Math.round(D.colgadasEnElRiel/D.capacidad*100);
  var pctInd=100-D.pesoVentaPct;
  var card=$('pa-card');

  function icono(clave){return '<svg class="pa-ic" viewBox="2 15 36 43" aria-hidden="true" focusable="false"><use href="#pa-s-'+clave+'" class="pa-sil"/></svg>'}
  function glifo(clave,f,i){
    return '<span class="pa-p" style="--f:'+f.toFixed(3)+';--i:'+i+'"><svg viewBox="0 0 40 60" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#pa-h"/><use href="#pa-s-'+clave+'" class="pa-sil"/></svg></span>';
  }
  function bloque(g,prendas,etiqueta,idx){
    var n=prendas/UNIDAD,llenas=Math.floor(n+1e-9),resto=n-llenas,h='',i=idx.v;
    for(var k=0;k<llenas;k++)h+=glifo(g.clave,1,i++);
    if(resto>=0.05)h+=glifo(g.clave,resto,i++);
    idx.v=i;
    return '<div class="pa-blq" data-g="'+g.clave+'" style="--n:'+n.toFixed(4)+'">'+(etiqueta?'<span class="pa-et">'+CORTO[g.clave]+'</span>':'')+h+'</div>';
  }

  /* ---- estado ---- */
  $('pa-n-hoy').textContent=fmt(D.colgadasEnElRiel);
  $('pa-n-cap').textContent=fmt(D.capacidad);
  $('pa-unidad').textContent=UNIDAD;
  if(!D.capacidadProvisional)$('pa-chip-prov').hidden=true;
  $('pa-frase').innerHTML='Tu riel estaría casi vacío (<b>'+pctHoy+'\u00a0%</b>). <em>Falta contar tu piso: lo que cuelga de verdad puede ser mucho más.</em>';

  /* ---- riel de hoy ---- */
  var idx={v:0},h='';
  D.grupos.forEach(function(g){h+=bloque(g,g.hoy,false,idx)});
  h+='<div class="pa-libre"><b>'+fmt(libres)+'</b><span>lugares libres</span><small>según el sistema · falta contar tu piso</small></div>';
  var rh=$('pa-rail-hoy');rh.innerHTML=h;
  rh.setAttribute('aria-label','Hoy, según el sistema: '+fmt(D.colgadasEnElRiel)+' de '+fmt(D.capacidad)+' lugares ocupados y '+fmt(libres)+' libres. Falta contar el piso.');
  $('pa-sub-hoy').textContent='según el sistema · '+pctHoy+'\u00a0% del riel';
  $('pa-chips-hoy').innerHTML=D.grupos.map(function(g){
    return '<li><button type="button" class="pa-chip" data-g="'+g.clave+'" aria-pressed="false" aria-label="'+g.nombre+': '+g.hoy+' prendas hoy">'+icono(g.clave)+CORTO[g.clave]+' <b>'+g.hoy+'</b></button></li>';
  }).join('');

  /* ---- riel de la propuesta ---- */
  idx={v:0};h='';
  D.grupos.forEach(function(g){h+=bloque(g,g.propuesta,true,idx)});
  var rp=$('pa-rail-prop');rp.innerHTML=h;
  var repartidas=D.grupos.reduce(function(s,g){return s+g.propuesta},0);
  rp.setAttribute('aria-label','Cómo quedaría: '+D.grupos.map(function(g){return g.nombre+' '+fmt(g.propuesta)}).join(', ')+'. En total '+fmt(repartidas)+' de '+fmt(D.capacidad)+' lugares repartidos.');
  $('pa-sub-prop').textContent='así se repartirían tus '+fmt(repartidas)+' lugares'+(D.capacidadProvisional?' (provisional)':'');
  $('pa-txt-porque').textContent='Casi no usa tus '+D.ventasConfirmadas+' ventas ('+D.pesoVentaPct+'\u00a0%) · ¿Por qué?';
  $('pa-leyenda').innerHTML=D.grupos.map(function(g){
    return '<li><button type="button" class="pa-lg" data-g="'+g.clave+'" aria-pressed="false">'+icono(g.clave)+
      '<span class="pa-lg-t"><b>'+g.nombre+'</b><small>'+g.propuestaPct+'\u00a0% del riel · hoy '+g.hoy+'</small></span>'+
      '<span class="pa-lg-n">'+fmt(g.propuesta)+'</span></button></li>';
  }).join('');

  /* ---- aviso ---- */
  $('pa-chip-cat').textContent=D.categoriasPorRevisar+' categorías por revisar';
  $('pa-av-t').textContent=D.categoriasPorRevisar+' categorías esperan revisión';
  $('pa-av-d').textContent='Esta propuesta usa el grupo que les puso el sistema. Confírmalas en «Grupos» para afinarla.';
  $('pa-av-b').textContent='Revisar las '+D.categoriasPorRevisar+' categorías';

  /* ---- fuera del riel ---- */
  $('pa-fichas').innerHTML=D.fuera.map(function(f){
    return '<li class="pa-ficha">'+icono(f.clave)+'<div><b>'+f.nombre+'</b><span>'+f.colgadas+' prendas · meta '+f.meta+' de la venta</span></div></li>';
  }).join('');

  /* ---- cómo se calcula (en palabras, tras un toque) ---- */
  var ej=D.grupos.filter(function(g){return g.ventas>=2})[0];
  var pn='<p><b>Cada grupo se lleva una parte de los '+fmt(D.capacidad)+' lugares del riel.</b> Esa parte mezcla dos cosas: lo que suele funcionar en tiendas de ropa ('+pctInd+'\u00a0%) y lo que vendiste tú ('+D.pesoVentaPct+'\u00a0%).</p>'+
    '<p>Tus ventas pesan poco porque solo hay <b>'+D.ventasConfirmadas+' ventas confirmadas</b> en '+D.dias+' días. Las '+D.ventasSinRegistrar+' ventas sin registrar todavía no cuentan.'+
    (ej?' Con '+ej.ventas+' ventas, «'+ej.nombre+'» saldría '+ej.ventaPct+'\u00a0%, pero podría ser desde '+ej.ventaRango[0]+' hasta '+ej.ventaRango[1]+'\u00a0%: casi no sabemos.':'')+'</p>'+
    '<p>Los '+fmt(D.capacidad)+' lugares son provisionales (falta contar el riel) y las '+fmt(D.colgadasEnElRiel)+' prendas de «Hoy» son lo que el sistema cree que cuelga, no lo que hay de verdad. Por eso, saber qué grupo tiene de más o de menos depende de contar tu piso.</p>'+
    '<div class="pa-pt">Cómo salió cada grupo</div><ul>'+D.grupos.map(function(g){
      return '<li><b>'+g.nombre+' → '+g.propuestaPct+'\u00a0%</b>lo habitual '+g.industriaPct+'\u00a0% · tus ventas '+g.ventaPct+'\u00a0% ('+g.ventas+' '+pl(g.ventas,'venta','ventas')+')</li>';
    }).join('')+'</ul>';
  $('pa-panel').innerHTML=pn;

  /* ---- interacción ---- */
  var panel=$('pa-panel'),b1=$('pa-btn-porque');
  function alternar(){
    var abrir=panel.hidden;panel.hidden=!abrir;
    b1.setAttribute('aria-expanded',abrir);
  }
  b1.addEventListener('click',alternar);

  var lock=null,cap=$('pa-cap'),capBase=cap.textContent;
  var porClave={};D.grupos.forEach(function(g){porClave[g.clave]=g});
  function mostrar(k){
    card.setAttribute('data-sel',k);
    [].forEach.call(card.querySelectorAll('[data-g]'),function(e){e.classList.toggle('pa-on',e.getAttribute('data-g')===k)});
    var g=porClave[k];
    cap.innerHTML=g?'<b>'+g.nombre+'</b> · hoy '+g.hoy+' → quedaría '+fmt(g.propuesta)+' ('+g.propuestaPct+'\u00a0%)':capBase;
  }
  function limpiar(){
    card.removeAttribute('data-sel');
    [].forEach.call(card.querySelectorAll('.pa-on'),function(e){e.classList.remove('pa-on')});
    cap.textContent=capBase;
  }
  function marcarPresion(){[].forEach.call(card.querySelectorAll('button[data-g]'),function(e){e.setAttribute('aria-pressed',String(e.getAttribute('data-g')===lock))})}
  function grupoDe(e){var t=e.target&&e.target.closest?e.target.closest('[data-g]'):null;return t&&card.contains(t)?t:null}
  card.addEventListener('mouseover',function(e){if(lock)return;var t=grupoDe(e);if(t)mostrar(t.getAttribute('data-g'));else limpiar()});
  card.addEventListener('mouseleave',function(){if(!lock)limpiar()});
  card.addEventListener('focusin',function(e){if(lock)return;var t=grupoDe(e);if(t)mostrar(t.getAttribute('data-g'))});
  card.addEventListener('focusout',function(e){if(lock)return;var t=grupoDe(e);if(t&&!(e.relatedTarget&&card.contains(e.relatedTarget)&&e.relatedTarget.closest('[data-g]')))limpiar()});
  card.addEventListener('click',function(e){
    var t=grupoDe(e);if(!t)return;
    var k=t.getAttribute('data-g');
    if(lock===k){lock=null;limpiar()}else{lock=k;mostrar(k)}
    marcarPresion();
  });
})();
</script>
