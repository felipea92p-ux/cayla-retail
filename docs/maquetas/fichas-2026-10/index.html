<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas · 3 diseños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Maqueta (2026-10-20): tres formas de dibujar Clientes ▸ Fichas (la lista) y la ficha que se abre al tocar un cliente.
   Colores y letras: los tokens del ERP (apps/web/app/globals.css y estilos/tema.css), nada inventado.
   TODOS los clientes, números, puntos y compras de abajo son EJEMPLOS INVENTADOS (no hay un solo dato real).
   En las tres: sin el botón «Más»; «Cartel del club» sale a la cabecera como un botón más. */
:root{--crema:#f5f0e8;--papel:#fbf8f2;--hueso:#eae1d2;--sand:#e8e0d0;--tinta:#1a1a18;--taupe:#805c4c;--rojo:#b8412d;--rojo-p:#8b2a1f;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;--sombra:#1a1a18}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;--sombra:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font:14px/1.5 "DM Sans",system-ui,sans-serif}
.serif{font-family:"EB Garamond",Georgia,serif}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- barra de la maqueta (no es del ERP) ---- */
.barra{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:var(--tinta);color:var(--crema)}
.barra b{font-weight:600;margin-right:8px}
.barra button{border:1px solid color-mix(in srgb,var(--crema) 30%,transparent);background:transparent;color:var(--crema);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.barra button[aria-pressed="true"]{background:var(--crema);color:var(--tinta)}
.barra .sep{flex:1}
.cambia{background:var(--hueso);border-bottom:1px solid var(--sand);padding:12px 24px;font-size:13px}
.cambia ul{margin:4px 0 0;padding-left:18px;columns:2;column-gap:32px}
.cambia li{margin:2px 0;break-inside:avoid}

/* ---- pantalla ---- */
.pagina{max-width:1180px;margin:0 auto;padding:28px 24px 80px;transition:margin .25s}
.sede{display:flex;align-items:center;gap:10px;color:var(--taupe);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sede:after{content:"";height:1px;width:48px;background:var(--taupe)}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 22px}
h1{font:400 46px/1.05 "EB Garamond",Georgia,serif;margin:0 0 6px}
.frase{color:color-mix(in srgb,var(--tinta) 70%,transparent);margin:0;max-width:560px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-size:13.5px;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--tinta);display:inline-flex;align-items:center;gap:8px;background:transparent;transition:background .2s,transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.prim{background:var(--tinta);color:var(--crema)}.btn.prim:hover{background:var(--rojo-p);border-color:var(--rojo-p)}
.btn.sec{border-color:var(--sand)}.btn.sec:hover{border-color:var(--taupe)}
.btn.sutil{border-color:transparent;color:color-mix(in srgb,var(--tinta) 75%,transparent)}.btn.sutil:hover{background:var(--hueso)}
.btn.chico{padding:6px 12px;font-size:13px}
.cab .btn{height:40px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:14px}
.nota{background:var(--hueso);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:20px}
.etq{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--tinta) 62%,transparent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.tenue{color:color-mix(in srgb,var(--tinta) 66%,transparent)}
.chico{font-size:12.5px}

/* chips, avatares, píldoras */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.verde{color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,transparent)}
.chip.neutro{color:var(--tinta);background:var(--hueso)}
.chip.pizarra{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 12%,transparent)}
.chip.ambar{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 12%,transparent)}
.chip.apagado{color:color-mix(in srgb,var(--tinta) 62%,transparent);background:color-mix(in srgb,var(--tinta) 7%,transparent)}
.punto{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.punto:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sand);border:1.5px solid var(--taupe)}
.punto.si:before{background:var(--verde);border-color:var(--verde)}
.av{border-radius:50%;background:var(--sand);display:grid;place-items:center;font:500 18px "EB Garamond",Georgia,serif;flex:none;color:var(--tinta)}
.av.s{width:36px;height:36px}.av.m{width:44px;height:44px;font-size:20px}.av.g{width:60px;height:60px;font-size:26px}.av.xl{width:84px;height:84px;font-size:36px}
.pil{border:1px solid var(--sand);background:transparent;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--tinta);transition:background .2s}
.pil:hover{background:var(--hueso)}
.pil[aria-pressed="true"]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.pil .c{margin-left:6px;opacity:.8;font-variant-numeric:tabular-nums}
.buscador{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:999px;background:var(--hueso);border:1px solid transparent;transition:background .2s,border-color .2s}
.buscador:focus-within{background:var(--papel);border-color:var(--rojo)}
.buscador input{flex:1;border:0;background:transparent;font:inherit;color:var(--tinta);outline:none;min-width:0}
.buscador kbd{font:inherit;font-size:11px;border:1px solid var(--sand);border-radius:6px;padding:1px 6px;color:var(--taupe)}
.tarjetas4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.cifra{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:16px 18px;text-align:left;cursor:default}
.cifra .v{font:400 38px/1.05 "EB Garamond",Georgia,serif;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.cifra .d{font-size:12.5px;color:color-mix(in srgb,var(--tinta) 66%,transparent)}
button.cifra{cursor:pointer;transition:background .2s,border-color .2s}
button.cifra:hover{border-color:var(--taupe)}
button.cifra[aria-pressed="true"]{background:var(--sand);border-color:var(--taupe)}

/* tabla */
.tabla .top{padding:16px;display:grid;gap:12px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.fila,.enc{display:grid;grid-template-columns:var(--cols);gap:16px;align-items:center;padding:12px 20px;text-align:left;width:100%;border:0;background:transparent}
.enc{border-top:1px solid var(--sand);padding-top:10px;padding-bottom:8px}
.enc span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.fila{border-top:1px solid var(--sand);cursor:pointer;transition:background .2s;position:relative}
.fila:hover,.fila[aria-current="true"]{background:var(--hueso)}
.fila[aria-current="true"]:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rojo)}
.fila .nm{font-weight:500;display:block}
.fila .sub{font-size:12px;color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.fila .quien{min-width:0}
.fila .quien>div{min-width:0}
.fila .flecha{opacity:0;transition:opacity .2s,transform .2s;color:var(--taupe)}
.fila:hover .flecha{opacity:1;transform:translateX(3px)}
.pie-tabla{border-top:1px solid var(--sand);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:color-mix(in srgb,var(--tinta) 66%,transparent);gap:12px;flex-wrap:wrap}
.pag{display:flex;gap:4px}
.pag span{min-width:32px;height:32px;display:grid;place-items:center;border-radius:999px;font-size:13px}
.pag span.act{background:var(--tinta);color:var(--crema)}
.vacio{text-align:center;padding:36px 20px;color:color-mix(in srgb,var(--tinta) 70%,transparent)}
.vacio .serif{font-size:22px;color:var(--tinta);display:block;margin:6px 0 2px}

/* ---- hoja (modal) ---- */
.velo{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--sombra) 28%,transparent);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto;animation:velo .25s both}
:root[data-tema="oscuro"] .velo{background:color-mix(in srgb,var(--sombra) 55%,transparent)}
.hoja{position:relative;background:var(--papel);border-radius:18px;width:100%;max-width:760px;padding:28px;animation:sube .32s cubic-bezier(.2,.7,.2,1) both;border:1px solid var(--sand)}
@keyframes velo{from{opacity:0}}
@keyframes sube{from{opacity:0;transform:translateY(18px) scale(.985)}}
.cerrar{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.cerrar:hover{background:var(--hueso)}
.mh{display:flex;gap:16px;align-items:center;padding-right:40px}
.mh .nombre{font:400 30px/1.1 "EB Garamond",Georgia,serif;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.contacto{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:color-mix(in srgb,var(--tinta) 72%,transparent)}
.contacto span{display:inline-flex;align-items:center;gap:6px}
.copiar{border:0;background:transparent;cursor:pointer;padding:2px;border-radius:6px;color:var(--taupe);display:inline-grid}
.copiar:hover{background:var(--hueso)}
.copiar.ok{color:var(--verde)}
.tabs{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--sand);margin:22px 0 18px}
.tabs .fila-t{display:flex;gap:2px}
.tab{border:0;background:transparent;padding:10px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;color:color-mix(in srgb,var(--tinta) 70%,transparent)}
.tab[aria-selected="true"]{color:var(--tinta);font-weight:600;border-bottom-color:var(--tinta)}
.tab .g{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--hueso);font-size:11px;margin-left:6px}
.tabs .btn{margin-bottom:8px}
.bloque{border:1px solid var(--sand);border-radius:14px;padding:18px}
.bloque+.bloque{margin-top:14px}
.bloque h3{margin:0 0 10px;font:400 21px "EB Garamond",Georgia,serif}
.grande{font:400 44px/1 "EB Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.medidor{height:8px;background:var(--hueso);border-radius:999px;overflow:hidden;margin:12px 0 6px}
.medidor i{display:block;height:100%;background:var(--tinta);border-radius:999px}
.medidor i.listo{background:var(--verde)}
.cupon{margin-top:12px;border:1.5px dashed var(--taupe);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cupon .cod{font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px 0 0;margin-top:18px;border-top:1px solid var(--sand)}
.mini b{display:block;font-weight:500;font-size:14.5px;margin-top:2px}
.act-sec{margin-top:18px}.act-sec:first-child{margin-top:0}
.act-fila{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--sand);font-size:13.5px}
.act-fila small{display:block;color:color-mix(in srgb,var(--tinta) 62%,transparent);font-size:12px}
.act-fila .m{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.enlace{border:0;background:transparent;cursor:pointer;color:var(--taupe);padding:4px 0;font-size:13px;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px}
.enlace:hover{color:var(--rojo-p)}
.hist{margin:8px 0 0;padding:0;list-style:none}
.hist li{padding:7px 0 7px 16px;border-left:2px solid var(--sand);font-size:13px;position:relative}
.hist li:before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--taupe)}
.hist small{display:block;color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.pie-ficha{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--sand);flex-wrap:wrap}
.aviso-i{background:var(--hueso);border-radius:12px;padding:12px 14px;font-size:13.5px}
.etiquetas{display:flex;gap:6px;flex-wrap:wrap}
.etiquetas span{background:var(--hueso);border-radius:999px;padding:3px 11px;font-size:12.5px}

/* ---- B · tarjetas ---- */
.b-lista{display:grid;gap:10px;padding:0 16px 16px}
.b-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 18px;background:var(--papel);border:1px solid var(--sand);border-radius:14px;cursor:pointer;text-align:left;width:100%;transition:border-color .2s,transform .2s,background .2s}
.b-card:hover{border-color:var(--taupe);transform:translateY(-2px)}
.b-card .nm{font:500 20px/1.2 "EB Garamond",Georgia,serif;display:block}
.b-card .frasecita{font-size:13.5px;color:color-mix(in srgb,var(--tinta) 72%,transparent);margin-top:2px;display:block}
.b-card .der{text-align:right;font-size:12.5px;color:color-mix(in srgb,var(--tinta) 66%,transparent);display:grid;gap:4px;justify-items:end}
.b-grupo{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.b-grupo>.etq{min-width:68px}
.b-perfil{display:grid;grid-template-columns:230px 1fr;gap:26px}
.b-perfil>section{padding-top:28px}
.b-izq{border-right:1px solid var(--sand);padding-right:22px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.b-izq .nombre{font:400 28px/1.1 "EB Garamond",Georgia,serif;margin:6px 0 0}
.b-izq dl{margin:6px 0 0;display:grid;gap:10px;width:100%}
.b-izq dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.b-izq dd{margin:1px 0 0;font-size:13.5px;display:flex;align-items:center;gap:6px;word-break:break-word}
.b-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.b-tile{background:var(--hueso);border-radius:12px;padding:12px 14px}
.b-tile .v{font:400 28px/1.1 "EB Garamond",Georgia,serif}
.b-tile .d{font-size:12px;color:color-mix(in srgb,var(--tinta) 66%,transparent)}

/* ---- C · cajón lateral ---- */
.con-cajon .cambia{margin-right:544px}
.con-cajon .pagina{margin-right:560px;max-width:none;margin-left:24px}
.cajon{position:fixed;top:48px;right:0;bottom:0;width:544px;z-index:20;background:var(--papel);border-left:1px solid var(--sand);box-shadow:-18px 0 44px -22px color-mix(in srgb,var(--sombra) 35%,transparent);display:flex;flex-direction:column;animation:entra .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes entra{from{transform:translateX(40px);opacity:0}}
.cj-cab{display:flex;gap:14px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--sand)}
.cj-cab .nombre{font:400 25px/1.1 "EB Garamond",Georgia,serif;margin:0}
.cj-cab .cerrar{position:static;margin-left:auto}
.cj-nav{display:flex;gap:6px;padding:10px 22px;border-bottom:1px solid var(--sand);overflow:auto;background:var(--papel)}
.cj-nav .pil{white-space:nowrap}
.cj-cuerpo{flex:1;overflow:auto;padding:6px 22px 24px;scroll-behavior:smooth}
.cj-sec{padding:18px 0;border-top:1px solid var(--sand)}
.cj-sec:first-child{border-top:0}
.cj-sec>h3{margin:0 0 10px;font:400 21px "EB Garamond",Georgia,serif;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cj-sec>h3 small{font:400 12.5px "DM Sans";color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.dl2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0}
.dl2 dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:color-mix(in srgb,var(--tinta) 62%,transparent)}
.dl2 dd{margin:1px 0 0;font-size:14px;display:flex;gap:6px;align-items:center}
.cj-pie{display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--sand);background:var(--papel)}
.cj-pie .cuenta{font-size:12.5px;color:color-mix(in srgb,var(--tinta) 66%,transparent);display:flex;align-items:center;gap:2px}
.cj-pie .cuenta button{border:0;background:transparent;width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.cj-pie .cuenta button:hover{background:var(--hueso)}
.cj-pie .sp{flex:1}
.c-banda{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:baseline;padding:14px 18px;margin-bottom:14px}
.c-banda button{border:0;background:transparent;cursor:pointer;font-size:14px;padding:2px 0;border-bottom:1px dashed var(--taupe);text-align:left}
.c-banda button:hover{color:var(--rojo-p)}
.c-banda button[aria-pressed="true"]{border-bottom:2px solid var(--tinta);font-weight:600}
.c-banda b{font:400 26px "EB Garamond",Georgia,serif;margin-right:4px;font-variant-numeric:tabular-nums}

.diseno-nota{font-size:12px;color:var(--taupe);margin-top:26px}
.solo-m{display:none}
@media(max-width:820px){
  .tarjetas4{grid-template-columns:1fr 1fr}
  .cambia ul{columns:1}
  .fila,.enc{grid-template-columns:1fr auto!important}
  .ocultar-m{display:none!important}.solo-m{display:block}
  .mini{grid-template-columns:1fr 1fr}
  .b-perfil{grid-template-columns:1fr}.b-izq{border-right:0;padding-right:0;border-bottom:1px solid var(--sand);padding-bottom:16px}
  .b-tiles{grid-template-columns:1fr 1fr 1fr}
  .cols2{grid-template-columns:1fr}
  .hoja{padding:20px 16px}
  h1{font-size:38px}
  .b-card{grid-template-columns:auto 1fr}.b-card .der{grid-column:1/-1;justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:6px 12px}
  .con-cajon .pagina{margin-right:auto;margin-left:auto}
  .cajon{top:0;width:100%}
  .dl2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="barra">
  <b>Fichas · 3 diseños</b>
  <button data-act="dis" data-v="A" aria-pressed="true">A · Lista clara y ficha con resumen</button>
  <button data-act="dis" data-v="B" aria-pressed="false">B · Tarjetas y perfil</button>
  <button data-act="dis" data-v="C" aria-pressed="false">C · Cajón: la lista no se va</button>
  <span class="sep"></span>
  <button data-act="tema" aria-pressed="false">Oscuro</button>
</div>
<div class="cambia" id="cambia"></div>
<div class="pagina" id="pagina"></div>
<div id="capa"></div>

<script>
/* ============ datos de ejemplo (INVENTADOS) ============ */
const C = [
 {id:1,n:"Lucía Valdivia Ramos",doc:"DNI 71••••82",cel:"987 ••• 321",mail:"lu•••@gmail.com",cod:"CLUB-0412",club:"14 mar 2026",frec:true,pub:"02 abr 2026",baja:null,sede:"Lima",ult:"hace 4 d",ultF:"16 oct 2026",cumple:"12 nov",pts:340,prefs:["Blusas","Vestidos","Casacas"],talla:"Blusas: M · Pantalones: M",

function bloquePuntos(c){
  if(c.pts==null)return "";
  const pct=Math.min(100,Math.round(c.pts/CANJE*100)), listo=c.pts>=CANJE;
  return `<div class="bloque"><h3>Puntos</h3>
   <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="grande">${c.pts}</span><span>puntos · valen <b>${cuanto(c)}</b> en caja</span></div>

   <div class="chico tenue">${listo?"Ya puede canjear sus puntos por un cupón (desde "+CANJE+" puntos).":`Le faltan <b style="color:var(--tinta)">${CANJE-c.pts} puntos</b> para poder canjear (desde ${CANJE}).`}</div>
   ${c.cupones.map(x=>`<div class="cupon"><span><span class="cod">${x.c}</span> <span class="tenue chico">${x.d}</span></span>${x.pv?chip("Por vencer","ambar"):""}</div>`).join("")}

}

  const lim=verTodas?items.length:5;
  return `<div class="act-sec"><div class="etq">${t} <span class="num">· ${items.length}</span></div>${items.slice(0,lim).map(fmt).join("")}${items.length>5&&!verTodas?`<button class="enlace" data-act="vertodas">Ver las ${items.length} ${I.d}</button>`:""}</div>`;
}
function actividad(c){
  if(!totAct(c))return `<div class="vacio" style="padding:24px">${I.bag}<span class="serif">Todavía no compró</span>Cuando compre, cambie algo o aparte una prenda, lo verás aquí.</div>`;
  const fila=(a,b,d,m)=>`<div class="act-fila"><span><span class="tenue">${a}</span> · ${b}<small>${d}</small></span>${m?`<span class="m">${m}</span>`:""}</div>`;
  return `${seccionAct("Compras",c.compras,x=>fila(x[0],x[1],x[2],x[3]))}${seccionAct("Cambios",c.cambios,x=>fila(x[0],x[1],x[2]))}${seccionAct("Devoluciones",c.devol,x=>fila(x[0],x[1],x[2]))}${seccionAct("Apartados",c.apart,x=>fila(x[0],x[1],x[2],x[3]))}`;
}
const pieArchivar = ()=>`<div class="pie-ficha"><button class="btn sutil" data-act="nada">Archivar a este cliente</button><span class="chico tenue">Archivar no borra nada: la ficha se puede reactivar.</span></div>`;

/* ============ A · hoja ============ */
function hojaA(c){
  const conClub=!!c.club;
  const tab=conClub?tabM:"act";
  return `<div class="velo" data-act="velo"><div class="hoja" role="dialog" aria-label="Ficha de ${c.n}">
   <button class="cerrar" data-act="cerrar" aria-label="Cerrar">${I.x}</button>
   <div class="mh"><span class="av g">${ini(c.n)}</span><div><h2 class="nombre">${c.n}</h2>${chipsFicha(c)}</div></div>
   ${contactoLinea(c)}
   <div class="mini">
    <div><span class="etq">Cumpleaños</span><b>${c.cumple||"Sin dato"}</b></div>
    <div><span class="etq">Miembro desde</span><b>${c.club||"No es miembro"}</b></div>
    <div><span class="etq">Compra seguido</span><b style="${c.frec?"color:var(--verde)":""}">${c.frec?"Sí":c.club?`Le falta ${c.falta} compra${c.falta>1?"s":""}`:"—"}</b></div>
    <div><span class="etq">Compra más en</span><b>${c.sede||"—"}</b></div></div>
   <div class="tabs"><div class="fila-t" role="tablist">${conClub?`<button class="tab" role="tab" aria-selected="${tab==="club"}" data-act="tab" data-t="club">Club y puntos</button>`:""}<button class="tab" role="tab" aria-selected="${tab==="act"}" data-act="tab" data-t="act">Compras y cambios${totAct(c)?`<span class="g num">${totAct(c)}</span>`:""}</button></div>
    <button class="btn sec chico" data-act="nada">${I.pen} Editar</button></div>
   ${tab==="club"?`${bloquePuntos(c)}${bloqueNovedades(c)}${bloquePrefs(c)}${bloqueHistorial(c)}`:`${soloFichaNota(c)}${actividad(c)}`}
   ${pieArchivar()}</div></div>`;
}

/* ============ B · hoja ============ */
function hojaB(c){
  const conClub=!!c.club, tab=conClub?tabM:"act";
  return `<div class="velo" data-act="velo"><div class="hoja" style="max-width:860px" role="dialog" aria-label="Ficha de ${c.n}">
   <button class="cerrar" data-act="cerrar" aria-label="Cerrar">${I.x}</button>
   <div class="b-perfil">
    <aside class="b-izq"><span class="av xl">${ini(c.n)}</span><h2 class="nombre">${c.n}</h2>${chipsFicha(c)}
     <dl>
      <div><dt>Documento</dt><dd>${c.doc}${copiar(c.doc,"documento")}</dd></div>
      <div><dt>Celular</dt><dd>${c.cel?c.cel+copiar(c.cel,"celular"):'<span class="tenue">Sin celular</span>'}</dd></div>
      ${c.mail?`<div><dt>Correo</dt><dd>${c.mail}</dd></div>`:""}
      <div><dt>Cumpleaños</dt><dd>${c.cumple||'<span class="tenue">Sin dato</span>'}</dd></div>
      ${c.cod?`<div><dt>Código de miembro</dt><dd class="num">${c.cod}</dd></div>`:""}</dl>
     <button class="btn sec chico" data-act="nada">${I.pen} Editar datos</button>
     <button class="btn sutil chico" data-act="nada" style="margin-top:auto">Archivar a este cliente</button></aside>
    <section>
     <div class="b-tiles">
      <div class="b-tile"><div class="etq">Puntos</div><div class="v num">${c.pts==null?"—":c.pts}</div><div class="d">${c.pts==null?"No es del club":"valen "+cuanto(c)}</div></div>
      <div class="b-tile"><div class="etq">Compras</div><div class="v num">${c.compras.length}</div><div class="d">${c.frec?"Compra seguido":c.club?`Le falta ${c.falta} para “seguido”`:"registradas"}</div></div>
      <div class="b-tile"><div class="etq">Última compra</div><div class="v" style="font-size:22px;padding:4px 0">${c.ult||"—"}</div><div class="d">${c.sede?"en "+c.sede:"todavía sin compras"}</div></div></div>
     <div class="tabs" style="margin-top:14px"><div class="fila-t" role="tablist">${conClub?`<button class="tab" role="tab" aria-selected="${tab==="club"}" data-act="tab" data-t="club">Club</button>`:""}<button class="tab" role="tab" aria-selected="${tab==="act"}" data-act="tab" data-t="act">Compras y cambios${totAct(c)?`<span class="g num">${totAct(c)}</span>`:""}</button></div></div>
     ${tab==="club"?`${bloquePuntos(c)}${bloqueNovedades(c)}${bloquePrefs(c)}${bloqueHistorial(c)}`:`${soloFichaNota(c)}${actividad(c)}`}
    </section></div></div></div>`;
}

/* ============ C · cajón ============ */
function cajonC(c){
  const i=C.findIndex(x=>x.id===c.id);
  const ancla=(id,t)=>`<button class="pil" data-act="ancla" data-a="${id}">${t}</button>`;
  return `<aside class="cajon" role="dialog" aria-label="Ficha de ${c.n}">
   <div class="cj-cab"><span class="av m">${ini(c.n)}</span><div><span class="etq">Ficha</span><h2 class="nombre">${c.n}</h2></div><button class="cerrar" data-act="cerrar" aria-label="Cerrar">${I.x}</button></div>
   <div class="cj-nav">${ancla("cj-datos","Datos")}${c.club?ancla("cj-club","Club"):""}${c.pts!=null?ancla("cj-puntos","Puntos"):""}${ancla("cj-act","Compras"+(totAct(c)?" · "+totAct(c):""))}</div>
   <div class="cj-cuerpo" id="cjc">
    <section class="cj-sec" id="cj-datos"><h3>Datos <small>${estado(c).ayuda||"Miembro "+(c.frec?"frecuente":"")}</small></h3>
     <dl class="dl2"><div><dt>Documento</dt><dd>${c.doc}${copiar(c.doc,"documento")}</dd></div><div><dt>Celular</dt><dd>${c.cel?c.cel+copiar(c.cel,"celular"):'<span class="tenue">Sin celular</span>'}</dd></div>
     <div><dt>Correo</dt><dd>${c.mail||'<span class="tenue">Sin correo</span>'}</dd></div><div><dt>Cumpleaños</dt><dd>${c.cumple||'<span class="tenue">Sin dato</span>'}</dd></div>
     <div><dt>Compra más en</dt><dd>${c.sede||"—"}</dd></div><div><dt>Compra seguido</dt><dd style="${c.frec?"color:var(--verde)":""}">${c.frec?"Sí":c.club?`Le falta ${c.falta}`:"—"}</dd></div></dl></section>
    ${c.club?`<section class="cj-sec" id="cj-club"><h3>Club <small>${chip(estado(c).t,estado(c).k)}</small></h3>
      <p class="chico tenue" style="margin:0 0 12px">Miembro desde ${c.club}${c.cod?" · "+c.cod:""}.</p>${bloqueNovedades(c).replace('class="bloque"','class="bloque" style="margin:0"')}</section>`:`<section class="cj-sec">${soloFichaNota(c)}</section>`}
    ${c.pts!=null?`<section class="cj-sec" id="cj-puntos"><h3>Puntos y cupones</h3>${bloquePuntos(c).replace("<h3>Puntos</h3>","").replace('class="bloque"','class="bloque" style="margin:0"')}
      <div style="margin-top:14px">${bloquePrefs(c).replace('class="bloque"','class="bloque" style="margin:0"')}</div>${c.hist.length?`<div style="margin-top:14px">${bloqueHistorial(c).replace('class="bloque"','class="bloque" style="margin:0"')}</div>`:""}</section>`:""}
    <section class="cj-sec" id="cj-act"><h3>Compras y cambios</h3>${actividad(c)}</section>
   </div>
   <div class="cj-pie"><button class="btn sutil chico" data-act="nada">Archivar</button><span class="sp"></span>
    <span class="cuenta"><button data-act="nav" data-d="-1" aria-label="Cliente anterior" ${i===0?"disabled style='opacity:.35'":""}>${I.u}</button><span class="num">${i+1} de ${C.length}</span><button data-act="nav" data-d="1" aria-label="Cliente siguiente" ${i===C.length-1?"disabled style='opacity:.35'":""}>${I.d}</button></span>
    <button class="btn sec chico" data-act="nada">${I.pen} Editar</button></div></aside>`;
}

/* ============ pintar ============ */
function pintar(){
  document.body.classList.toggle("con-cajon",D==="C"&&sel!==null);
  $("#cambia").innerHTML=CAMBIA[D];
  $("#pagina").innerHTML={A:listaA,B:listaB,C:listaC}[D]();
  const c=C.find(x=>x.id===sel);
  $("#capa").innerHTML=!c?"":D==="A"?hojaA(c):D==="B"?hojaB(c):cajonC(c);
  document.querySelectorAll(".barra [data-act=dis]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===D));
  const qi=$("#q"); if(qi&&document.activeElement===document.body&&qi.dataset.f==="1"){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  if(qi)qi.addEventListener("input",e=>{q=e.target.value;const pos=e.target.selectionStart;pintar();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)});
}
const $=s=>document.querySelector(s);

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act;
  if(a==="velo"){ if(e.target!==t)return; sel=null; pintar(); return }
  if(a==="dis"){D=t.dataset.v; sel=null; tabM="club"; pintar(); return}
  if(a==="tema"){const o=document.documentElement.dataset.tema==="oscuro";document.documentElement.dataset.tema=o?"":"oscuro";t.setAttribute("aria-pressed",!o);t.textContent=o?"Oscuro":"Claro";return}
  if(a==="filtro"){filtro=t.dataset.k;pintar();return}
  if(a==="limpiar"){q="";filtro="todos";pintar();return}
  if(a==="abrir"){ sel=+t.dataset.id; tabM="club"; verTodas=false; histAbierta=false; pintar(); return}
  if(a==="cerrar"){sel=null;pintar();return}
  if(a==="tab"){tabM=t.dataset.t;verTodas=false;pintar();return}
  if(a==="vertodas"){verTodas=true;pintar();return}
  if(a==="hist"){histAbierta=!histAbierta;pintar();return}
  if(a==="nav"){const i=C.findIndex(x=>x.id===sel)+(+t.dataset.d);if(C[i]){sel=C[i].id;verTodas=false;histAbierta=false;pintar()}return}
  if(a==="ancla"){const el=document.getElementById(t.dataset.a);if(el)el.scrollIntoView({block:"start",behavior:"smooth"});return}
  if(a==="copiar"){t.classList.add("ok");t.innerHTML=I.ok;setTimeout(()=>{t.classList.remove("ok");t.innerHTML=I.cp},1400);return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sel!==null){sel=null;pintar()}
  if(D==="C"&&sel!==null&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();const i=C.findIndex(x=>x.id===sel)+(e.key==="ArrowDown"?1:-1);if(C[i]){sel=C[i].id;pintar()}}
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();const qi=$("#q");if(qi)qi.focus()}
});
pintar();
</script>
</body>
</html>
