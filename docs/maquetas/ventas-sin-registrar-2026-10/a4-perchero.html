<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas sin registrar · A4 · Perchero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<link rel="stylesheet" href="mesa.css">
<style>
/* A4 · PERCHERO — igual que A (talón + hilo), pero la prenda real ya no es una fila: es una prenda COLGADA en su perchero, como en la tienda.
   Las candidatas cuelgan de un riel; la cantidad que hay en TRU se ve como prendas apiladas detrás (3 en stock = 3 prendas), cada una con
   su etiqueta colgante. Pasar el mouse la mece una vez; al elegir, la prenda se levanta y el hilo la busca. Al guardar, la prenda
   se descuelga y viaja hasta el talón; el gancho se queda vacío. Idea: reconocer una prenda es mirarla, no leer un código. */
.mesa .hilos{z-index:2}.col-e{position:relative;z-index:3}
.cab-e{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cab-e p{font-size:12.5px;color:var(--t65)}
.rack{display:flex;flex-direction:column;gap:12px}
.fila-r{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));padding-top:16px;padding-bottom:4px}
.fila-r:before{content:"";position:absolute;left:-4px;right:-4px;top:6px;height:7px;border-radius:4px;background:linear-gradient(color-mix(in srgb,var(--taupe) 80%,var(--papel)),var(--taupe));box-shadow:0 8px 12px -8px color-mix(in srgb,var(--sombra) 45%,transparent);transform-origin:left;animation:escala .9s var(--ease) both}
@keyframes escala{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fila-r:after{content:"";position:absolute;left:-10px;top:2px;width:10px;height:15px;border-radius:3px;background:var(--taupe);box-shadow:calc(100% + var(--ancho,0px)) 0 0 var(--taupe);display:none}
.perc{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px 6px;transform-origin:50% 6px;text-align:center;animation:cuelga .8s var(--ease) both;animation-delay:calc(var(--i,0)*90ms + .25s)}
@keyframes cuelga{from{opacity:0;transform:translateY(-34px) rotate(-4deg)}to{opacity:1;transform:none}}
.oscila{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;position:relative}
.perc:hover .oscila,.perc:focus-visible .oscila{animation:mece 1.1s var(--ease) 1}
@keyframes mece{0%{transform:rotate(0)}22%{transform:rotate(3.2deg)}50%{transform:rotate(-2.2deg)}78%{transform:rotate(.9deg)}100%{transform:rotate(0)}}
.gancho{width:92px;height:42px;color:var(--taupe);position:relative;z-index:2}
.gancho svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pila-p{position:relative;width:118px;height:112px;margin-top:-18px}
.pila-p.acc{margin-top:-4px}
.pila-p .pg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;transition:transform .5s var(--ease),opacity .4s}
.pila-p .pg.f2{transform:translate(8px,-3px) scale(.96);opacity:.5}
.pila-p .pg.f3{transform:translate(16px,-6px) scale(.92);opacity:.3}
.baldosa.sf{background:none;overflow:visible;--aw:100%}
.baldosa.sf svg.arte{width:100%}
.perc[aria-pressed=true] .pg.f1{transform:translateY(-8px) scale(1.04)}
.perc[aria-pressed=true] .gancho{color:var(--tinta)}
.perc.vacio .pg{opacity:0}
.etq{position:relative;margin-top:2px;background:var(--papel);border:1px solid var(--sand);border-radius:11px;padding:6px 10px 7px;min-width:0;width:100%;max-width:156px;transition:border-color .25s,box-shadow .35s var(--ease)}
.etq:before{content:"";position:absolute;left:50%;top:-5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--papel);border:1px solid var(--sand)}
.perc:hover .etq{border-color:var(--taupe)}
.perc[aria-pressed=true] .etq{border-color:var(--tinta);box-shadow:0 0 0 1px var(--tinta)}
.etq b{display:block;font-weight:600;font-size:13px;line-height:1.2}
.etq small{display:block;color:var(--taupe);font-size:11.5px}
.etq .pr{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:12px;margin-top:2px}
.etq .pr b{display:inline;font-size:12.5px}
.etq .pr span{color:var(--t65);font-size:11px}
.etq .pips{display:flex;gap:3px;justify-content:center;margin-top:3px}
.etq .pips i{width:12px;height:3px;border-radius:2px;background:var(--sand)}
.etq .pips i.on{background:var(--verde)}
.perc .sug{position:absolute;left:4px;top:2px;right:auto;z-index:4}
.perc .dif{position:absolute;right:2px;top:4px;z-index:4;background:var(--tinta);color:var(--crema);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .3s var(--ease)}
.perc:hover .dif,.perc[aria-pressed=true] .dif{opacity:1;transform:none}
.perc.sin-stock{opacity:.55}
.vuelo{position:absolute;z-index:88;pointer-events:none}
.vuelo.baldosa.sf{background:none}
.dock{margin-top:6px}
.dock .formas{margin-top:8px}
@container vista (max-width:1180px){.gancho{width:80px;height:36px}.pila-p{width:100px;height:96px}}
@container vista (max-width:700px){.fila-r{--n:2}.etq{max-width:none}}
</style>
</head>
<body>
<script src="comun.js"></script>
<script src="mesa.js"></script>
<script>
(function(){
const {$, $$, soles} = V, st = Mesa.st;
const MOV = () => Mesa.movil();
const ACC = ['Lentes de sol','Relojes'];
/* El gancho: un perchero de verdad para las prendas; un colgador simple para lo que no se cuelga de un perchero */
const PERCHA = '<svg viewBox="0 0 120 48" aria-hidden="true"><path d="M60 14V10.5C60 6.5 66.5 6.5 66.5 3A5.2 5.2 0 0 0 56.2 3"/><path d="M60 14 10 38.5Q5.5 41 10 43.5H110Q114.5 41 110 38.5Z"/></svg>';
const COLGADOR = '<svg viewBox="0 0 120 48" aria-hidden="true"><path d="M60 0V30"/><path d="M60 30c0 8-9 9-9 3.5"/><circle cx="60" cy="3" r="2.4"/></svg>';

function pintarPendiente(v, el, cab){
  const cands = V.candidatas(v,6), sug = V.sugerida(v), per = el.clientWidth < 600 ? 2 : 3, filas = [];
  for (let i=0; i<cands.length; i+=per) filas.push(cands.slice(i,i+per));
  let k = 0;
  el.innerHTML = cab + `<div class="cab-e"><span class="lbl">¿Qué prenda es?</span><p>Mira cuál es en el perchero y tócala. ${sug?'La sugerida es la única que calza en todo.':'Hay más de una que calza: tú la reconoces.'}</p></div>
    <div class="rack">${filas.map(fila=>`<div class="fila-r" style="--n:${per}">${fila.map(({p,calce})=>{ const i=k++, acc=ACC.includes(p.cat), copias=Math.max(1,Math.min(3,p.stock)), d=V.dif(v,p); return `
      <button class="perc ${p.stock<=0?'sin-stock':''}" data-p="${p.id}" style="--i:${i}" aria-pressed="false" aria-label="${p.nombre} ${p.talla} ${p.color}, ${p.stock} en TRU">
        ${sug&&sug.id===p.id?'<span class="sug">Sugerida</span>':''}<span class="dif num">${d===0?'Mismo precio':d<0?'−'+soles(-d):'+'+soles(d)}</span>
        <span class="oscila"><span class="gancho">${acc?COLGADOR:PERCHA}</span>
          <span class="pila-p ${acc?'acc':''}">${Array.from({length:copias},(_,c)=>`<span class="baldosa sf pg f${copias-c}" style="--h:${p.hex};--tx:${V.tx(p.hex)}">${V.arte(p.cat)}</span>`).join('')}</span></span>
        <span class="etq"><b>${p.nombre}</b><small>${p.talla} · ${p.color}</small><span class="pr num"><b>${soles(p.precio)}</b><span>${p.stock} en TRU</span></span><span class="pips">${[0,1,2].map(q=>`<i class="${q<calce?'on':''}"></i>`).join('')}</span></span>
      </button>`; }).join('')}</div>`).join('')}</div><div id="dock-sitio"></div>`;
  $$('.perc', el).forEach(b => { b.onclick = () => elegirPrenda(b.dataset.p); b.onmouseenter = () => redibujar('hover', b); b.onmouseleave = () => redibujar(); });
}

function elegirPrenda(pid){
  st.prenda = pid; st.forma = null;
  $$('.perc').forEach(b => b.setAttribute('aria-pressed', b.dataset.p===pid));
  pintarDock(); redibujar('cand');
}

function pintarDock(){
  const v = Mesa.actual(), p = V.catalogo.find(x=>x.id===st.prenda), host = $('#dock-sitio'); if (!p) { host.innerHTML=''; return; }
  host.innerHTML = `<div class="dock">${Mesa.balanza(v,p)}<div><span class="lbl">¿Cómo estaba esta prenda en el sistema?</span>${Mesa.formasHTML()}</div><div id="cons"></div>${Mesa.finHTML()}</div>`;
  Mesa.atarForma($('.dock', host));
}

function redibujar(modo, hover){
  const svg = $('#hilos'); if (!svg || MOV()) { svg && (svg.innerHTML=''); return; }
  svg.innerHTML = '';
  const tal = $(`.talon[data-id="${st.sel}"]`); if (!tal) return;
  const m = $('#mesa').getBoundingClientRect(), r = tal.getBoundingClientRect(), p1 = [r.right-m.left+1, Mesa.clamp(r.top+r.height/2-m.top, $('#talones'))];
  const hasta = el => { const q = el.querySelector('.pila-p').getBoundingClientRect(); return [q.left-m.left-6, Mesa.clamp(q.top+q.height/2-m.top, $('#elige'))]; };
  const sel = $(`.perc[data-p="${st.prenda}"]`);
  if (hover && hover!==sel) Mesa.curva(svg, p1, hasta(hover), 'h-prev', false);
  if (sel) { const p2 = hasta(sel); Mesa.curva(svg, p1, p2, 'h-sel', modo==='cand'); Mesa.punta(svg, p2, modo==='cand'); }
}

/* Al guardar: la prenda se descuelga, cruza hasta el talón y el gancho se queda vacío */
async function efecto({talon}){
  const perc = $(`.perc[data-p="${st.prenda}"]`); if (!perc || !talon) return;
  const g = $('.pg.f1', perc), vr = $('#vista').getBoundingClientRect(), a = g.getBoundingClientRect(), b = $('.baldosa', talon).getBoundingClientRect();
  const h = $('#hilos .h-sel'); if (h && !V.reducir()) { const L=h.getTotalLength(), l2=h.cloneNode(); l2.setAttribute('class','luz'); h.after(l2); l2.animate([{strokeDasharray:`0 ${L}`},{strokeDasharray:`${L} 0`}],{duration:700,easing:'cubic-bezier(.32,.72,.24,1)',fill:'forwards'}); }
  const clon = g.cloneNode(true); clon.classList.add('vuelo'); clon.classList.remove('pg','f1');
  Object.assign(clon.style, {left:(a.left-vr.left)+'px', top:(a.top-vr.top)+'px', width:a.width+'px', height:a.height+'px'}); $('#vista').appendChild(clon);
  g.style.visibility='hidden'; perc.setAttribute('aria-pressed','false');
  const dx = b.left+b.width/2-(a.left+a.width/2), dy = b.top+b.height/2-(a.top+a.height/2), k = b.width/a.width;
  if (!V.reducir()) {
    perc.querySelector('.oscila').animate([{transform:'rotate(0)'},{transform:'rotate(-5deg)'},{transform:'rotate(3deg)'},{transform:'rotate(0)'}],{duration:900,easing:'ease-out'});
    clon.animate([{transform:'none',opacity:1},{transform:'translate(0,-14px) scale(1.06)',opacity:1,offset:.18},{transform:`translate(${dx}px,${dy}px) scale(${k})`,opacity:1,offset:.85},{transform:`translate(${dx}px,${dy}px) scale(${k})`,opacity:0}],{duration:1100,easing:'cubic-bezier(.32,.72,.24,1)',fill:'forwards'});
  }
  await V.esperar(1150); clon.remove();
  talon.animate && !V.reducir() && talon.animate([{boxShadow:'0 0 0 0 transparent'},{boxShadow:'0 0 0 6px color-mix(in srgb, var(--verde) 28%, transparent)'},{boxShadow:'0 0 0 0 transparent'}],{duration:700,easing:'ease-out'});
}

const c = V.marco({activa:'a4-perchero.html', onRepetir:()=>iniciar(), onReiniciar:()=>iniciar()});
function iniciar(){ Mesa.iniciar(c, {pintarPendiente, redibujar, efecto}); }
iniciar();
$('#seg-modo').addEventListener('click', () => setTimeout(()=>{ $('#pd')?.classList.remove('abierto'); Mesa.pintarElige(); redibujar(); }, 480));
})();
</script>
</body>
</html>
