<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puntos del Club · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · Puntos del Club CAYLA (2026-10-19)
   1 punto por cada S/ 1 pagado · 100 puntos = S/ 5 · no vencen.
   El cliente canjea en la tienda web → recibe un CUPÓN con código → la caja lo canjea con «Código de cupón».
   Tokens = apps/web/app/globals.css y apps/tienda/app/globals.css (ADR-0169), claro y oscuro.
   TODOS los datos (nombre, DNI, boletas, saldos, códigos) son INVENTADOS.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);
--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--oscuro:#171614;--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t10:rgba(245,240,232,.1);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.m{width:20px;height:20px}svg.l{width:24px;height:24px}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.serif{font-family:'EB Garamond',serif;font-weight:500}
@keyframes sube{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}}@keyframes hoja{from{transform:translateY(100%)}}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.q-hoja .velo,.q-hoja .hj{animation:none!important}
.q-vista .barra i,.q-vista .mov div.nuevo,.q-vista .tienda>*{animation:none!important}
/* ---- barra de la maqueta ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.78)}
.spk .go{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(245,240,232,.35);font-size:12.5px;color:#f5f0e8}
.spk .go:hover{background:rgba(245,240,232,.12)}
.paso{background:var(--papel);border-bottom:1px solid var(--sand);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center}
.paso button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid var(--sand);background:var(--crema);font-size:12.5px;color:var(--t80)}
.paso button b{width:20px;height:20px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:11px;font-weight:700}
.paso button.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}.paso button.on b{background:var(--crema);color:var(--tinta)}
.paso button.ok b{background:var(--verde);color:var(--crema)}
.escena{padding:18px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ley{max-width:1180px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t80)}.ley b{font-weight:600}
.ley .ej{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--hueso);font-size:11px;color:var(--taupe);font-weight:600}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.marco{margin:0 auto}
/* ---- marcos ---- */
.marco{container-type:inline-size;flex:none;position:relative;overflow:hidden;background:var(--crema);box-shadow:0 30px 60px -30px var(--sombra)}
.marco.desk{width:1180px;height:780px;border-radius:14px;border:1px solid var(--t30)}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px var(--sombra);flex:none}
.marco.cel{width:375px;height:796px;border-radius:39px}
.pant{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:14px;transition:background .2s,transform .2s var(--ease)}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.chico{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.ancho{width:100%}
.enl{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--taupe);font-size:13px}.enl:hover{color:var(--rojo-p)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hueso);color:var(--t80)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.r{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 12%,transparent)}.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}.chip.nodot::before{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
/* ====================================================================  TIENDA WEB  */
.tienda{font-family:'Heebo',system-ui,sans-serif;min-height:100%;background:var(--crema)}
.t-anuncio{background:var(--oscuro);color:#f5f0e8;text-align:center;font-size:10.5px;letter-spacing:.2em;padding:7px 8px;font-weight:600}
.t-cab{display:flex;align-items:center;gap:28px;padding:0 28px;height:60px;border-bottom:1px solid var(--sand);background:var(--crema);position:sticky;top:0;z-index:5}
.t-marca{font-family:'Heebo';font-weight:700;letter-spacing:.14em;color:var(--rojo);font-size:21px;display:flex;align-items:center;gap:8px}
.t-nav{display:flex;gap:20px;font-size:13px;font-weight:500}.t-nav .of{color:var(--rojo)}
.t-ics{margin-left:auto;display:flex;gap:18px;align-items:center}
.t-ics .n{position:relative}.t-ics .n i{position:absolute;right:-7px;top:-7px;min-width:15px;height:15px;border-radius:8px;background:var(--rojo);color:#fbf8f2;font:700 9.5px 'Heebo';display:grid;place-items:center;font-style:normal}
.t-pag{padding:28px 40px 60px;max-width:1100px;margin:0 auto}
.t-mig{font-size:12.5px;color:var(--t65);margin-bottom:6px}
.t-pag h1{font-family:'EB Garamond',serif;font-weight:500;font-size:40px;line-height:1.1}
.t-sub{color:var(--t65);margin-top:4px}
.w-sec{margin-top:34px}
.w-sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.w-sec-t h2{font-family:'EB Garamond',serif;font-weight:500;font-size:26px}
.w-sec-t .c{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--hueso);font-size:12px;font-weight:600;padding:0 6px}
.w-sec-t .ver{margin-left:auto;font-size:12.5px;color:var(--rojo-p);font-weight:600;display:flex;align-items:center;gap:6px}
.club-fila{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
/* tarjeta del club (igual a apps/tienda/app/globals.css) */
.tarj{position:relative;overflow:hidden;aspect-ratio:1.586;width:100%;max-width:300px;border-radius:18px;padding:18px 18px 14px;color:#f5f0e8;background:radial-gradient(120% 120% at 100% 0%,#5a2a20 0%,#1e1b19 52%,#111010 100%);box-shadow:0 34px 60px -30px rgba(0,0,0,.65);display:flex;flex-direction:column;justify-content:space-between}
.tarj .f{display:flex;justify-content:space-between;align-items:flex-start}
.tarj .m{font-weight:700;letter-spacing:.16em;font-size:13px;color:#f4c3b3}
.tarj .chiporo{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#d9b878,#a37f3e);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.tarj small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;display:block}
.tarj .nom{font-family:'EB Garamond',serif;font-size:21px}
.tarj .pt{font-family:'EB Garamond',serif;font-size:26px;line-height:1}
.pts{background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:18px 20px}
.pts-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pts-n small{font-size:12px;color:var(--t65);display:block}
.pts-n b{font-family:'EB Garamond',serif;font-size:56px;line-height:1;font-weight:500}
.pts-v{padding-bottom:6px;font-size:14px;color:var(--t80)}.pts-v b{font-weight:700;color:var(--verde)}
.pts .btn{margin-left:auto}
.barra{display:block;height:6px;margin-top:14px;border-radius:999px;background:var(--hueso);overflow:hidden}
.barra i{display:block;height:100%;border-radius:inherit;background:var(--verde);transform-origin:left;animation:llena .9s var(--ease) .2s both}
.pts .nota{margin-top:8px;font-size:12.5px;color:var(--t65)}
.reglas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.reglas span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--hueso);font-size:12.5px}
.reglas b{font-weight:600}
.benef{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 14px;border-radius:12px;background:var(--papel);border:1px solid var(--sand);margin-top:10px}
.benef>.ic{width:22px;height:22px;color:var(--rojo-p)}.benef b{display:block;font-size:14px;font-weight:600}.benef small{display:block;color:var(--t65);font-size:13px;line-height:1.4}
.benef.disp{border-color:color-mix(in srgb,var(--verde) 45%,var(--sand))}
.cup-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cup{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);border:1px solid var(--sand);background:var(--papel);border-radius:14px;overflow:hidden}
.cup .izq{display:grid;place-items:center;text-align:center;padding:12px 6px;background:var(--hueso);border-right:2px dashed var(--t30)}
.cup .izq b{font-family:'EB Garamond',serif;font-size:30px;line-height:1;font-weight:500}.cup .izq small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t65);margin-top:2px}
.cup .der{padding:12px 14px;min-width:0}.cup .cod{font-size:15px;font-weight:600;letter-spacing:.08em}
.cup .d{font-size:12.5px;color:var(--t65);margin-top:2px}.cup .ac{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.cup.off{opacity:.62}
.mres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mres>div{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:12px 14px}
.mres small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.mres b{display:block;font-family:'EB Garamond',serif;font-size:30px;line-height:1.15;font-weight:500}.mres b.mas{color:var(--verde)}.mres b.menos{color:var(--rojo-p)}
.mres span{font-size:12.5px;color:var(--t65)}
.mv-fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mv-fil button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--sand);background:var(--papel);font-size:12.5px;font-weight:500;transition:background .2s}
.mv-fil button:hover{background:var(--hueso)}.mv-fil button.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.mov2{border:1px solid var(--sand);border-radius:16px;background:var(--papel);overflow:hidden}
.mv-mes{padding:9px 16px;background:var(--crema);border-bottom:1px solid var(--sand);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--t65)}
.mv{display:grid;grid-template-columns:40px minmax(0,1fr) 110px 110px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--sand);transition:background .2s}
.mv:hover{background:var(--crema)}
.mv.nuevo{animation:entra .5s var(--ease) both;background:color-mix(in srgb,var(--verde) 8%,transparent)}
.mv-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--hueso)}
.mv-i.t-compra{background:color-mix(in srgb,var(--verde) 14%,transparent);color:var(--verde)}.mv-i.t-cumple{background:color-mix(in srgb,var(--ambar) 16%,transparent);color:var(--ambar)}
.mv-i.t-canje{background:color-mix(in srgb,var(--rojo) 12%,transparent);color:var(--rojo-p)}.mv-i.t-vence{background:color-mix(in srgb,var(--pizarra) 15%,transparent);color:var(--pizarra)}
.mv-t{min-width:0}.mv-t b{display:block;font-weight:600;font-size:14px}.mv-t small,.mv-e small,.mv-p small{display:block;font-size:12px;color:var(--t65)}
.mv-e{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.chip.t-compra{color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,transparent)}.chip.t-cumple{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.t-canje{color:var(--rojo-p);background:color-mix(in srgb,var(--rojo) 11%,transparent)}.chip.t-vence{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.mv-p{text-align:right}.mv-p b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}.mv-p b.mas{color:var(--verde)}.mv-p b.menos{color:var(--rojo-p)}
.mv-mas{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;font-size:13px;font-weight:600;color:var(--t80);background:var(--crema)}.mv-mas:hover{background:var(--hueso)}
.mv-vacio{display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 16px;text-align:center}.mv-vacio small{color:var(--t65)}
.mov{border:1px solid var(--sand);border-radius:14px;background:var(--papel);overflow:hidden}
.mov div{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--sand);font-size:13.5px}.mov div:last-child{border:0}
.mov .f{width:54px;color:var(--t65);font-size:12px}.mov .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}.mov .p.mas{color:var(--verde)}.mov .p.menos{color:var(--rojo-p)}
.mov small{display:block;color:var(--t65);font-size:12px}
.mov div.nuevo{animation:entra .5s var(--ease) both;background:color-mix(in srgb,var(--verde) 8%,transparent)}
/* hoja / modal */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.34);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:56px;animation:velo .2s both}
:root[data-tema="oscuro"] .velo{background:rgba(0,0,0,.55)}
.hj{width:470px;max-width:calc(100% - 24px);background:var(--papel);border:1px solid var(--sand);border-radius:22px;padding:22px 24px;animation:sube .38s var(--ease) both;position:relative;max-height:calc(100% - 80px);overflow:auto;color:var(--tinta)}
.hj h3{font-family:'EB Garamond',serif;font-weight:500;font-size:25px;line-height:1.15}
.hj .baj{font-size:13px;color:var(--taupe);margin-top:3px}
.hj .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--t65)}.hj .x:hover{background:var(--hueso)}
.pie{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.paso-c{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0 6px}
.paso-c button{width:48px;height:48px;border-radius:12px;border:1px solid var(--t30);display:grid;place-items:center;background:var(--crema)}.paso-c button:hover:not(:disabled){background:var(--hueso)}.paso-c button:disabled{opacity:.35;cursor:default}
.paso-c .v{text-align:center;min-width:150px}.paso-c .v b{font-family:'EB Garamond',serif;font-size:52px;line-height:1;font-weight:500;display:block}.paso-c .v small{color:var(--t65);font-size:13px}
.hechos{border:1px solid var(--sand);border-radius:12px;background:var(--crema);overflow:hidden;margin-top:14px}
.hechos div{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--sand);font-size:13px}.hechos div:last-child{border:0}.hechos span{margin-left:auto;font-weight:600;text-align:right}
.nota{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--hueso);font-size:12.5px;color:var(--t80)}
.nota.ok{background:color-mix(in srgb,var(--verde) 12%,transparent);color:var(--t80)}.nota.mal{background:color-mix(in srgb,var(--rojo) 11%,transparent)}.nota.am{background:color-mix(in srgb,var(--ambar) 13%,transparent)}
/* cupón grande */
.cupg{margin-top:16px;border:1px solid var(--sand);border-radius:16px;overflow:hidden;background:var(--crema)}
.cupg .arr{padding:18px 20px;text-align:center;background:linear-gradient(var(--hueso),var(--crema))}
.cupg .arr small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t65);font-weight:600}
.cupg .arr b{display:block;font-family:'EB Garamond',serif;font-size:58px;line-height:1;font-weight:500;margin:4px 0}
.cupg .corte{border-top:2px dashed var(--t30);position:relative}
.cupg .corte::before,.cupg .corte::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--papel);border:1px solid var(--sand)}
.cupg .corte::before{left:-10px}.cupg .corte::after{right:-10px}
.cupg .ab{padding:16px 20px;display:flex;gap:16px;align-items:center}
.cupg .code{flex:1;min-width:0}.cupg .code .mono{font-size:21px;font-weight:700;letter-spacing:.1em;display:block;word-break:break-all}
.qr{width:92px;height:92px;flex:none;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--sand)}
/* bolsa */
.bol{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;margin-top:20px;align-items:start}
.bi{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--sand);background:var(--papel);border-radius:14px;margin-bottom:10px}
.foto{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:22px;color:rgba(26,26,24,.5)}

/* El código nunca se repite: sale de un alfabeto sin 0/O/1/I y se revisa contra todos los que existen (en la base: índice único + reintento). */
const ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function nuevoCodigo(){
  const usados=new Set(S.cupones.map(c=>c.codigo));
  for(const c of CODIGOS)if(!usados.has(c))return c;
  let r=S.cupones.length*7919+13,c;
  do{let t='';for(let i=0;i<8;i++){r=(r*1664525+1013904223)>>>0;t+=ALFA[(r>>>24)%ALFA.length]}c='CAY-'+t.slice(0,4)+'-'+t.slice(4)}while(usados.has(c));
  return c}

/* =========================== QR de ilustración =========================== */
function qr(code){
  let h=0;for(const ch of code)h=(h*31+ch.charCodeAt(0))>>>0;
  const N=21;let cel='';
  const finder=(x,y)=>(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
  const dibF=(ox,oy)=>{let s='';for(let y=0;y<7;y++)for(let x=0;x<7;x++){const e=(x==0||y==0||x==6||y==6)||(x>=2&&x<=4&&y>=2&&y<=4);if(e)s+=`<rect x="${ox+x}" y="${oy+y}" width="1" height="1"/>`}return s};
  cel+=dibF(0,0)+dibF(N-7,0)+dibF(0,N-7);
  let r=h||1;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(finder(x,y)||(x==7||y==7||x==N-8||y==N-8)&&finder(Math.min(x,6),Math.min(y,6)))continue;r=(r*1664525+1013904223)>>>0;if(r>>>28&1)cel+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg class="qr" viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges" fill="#1a1a18" role="img" aria-label="Código QR del cupón (ilustración)">${cel}</svg>`;
}

function movimientos(){
  // Saldo después de cada movimiento: se calcula hacia atrás desde el saldo de hoy.
  let acum=S.saldo; const todos=S.hist.map(h=>{const o={...h,tipo:tipoMov(h),despues:acum};acum-=h.p;return o});
  const ganados=todos.filter(h=>h.tipo==='compra'||h.tipo==='cumple').reduce((a,h)=>a+h.p,0);
  const canjeados=todos.filter(h=>h.tipo==='canje').reduce((a,h)=>a-h.p,0);
  const devueltos=todos.filter(h=>h.tipo==='vence').reduce((a,h)=>a+h.p,0);
  const f=S.movFiltro;
  const vis=todos.filter(h=>f==='todos'||(f==='ganados'&&h.p>0&&h.tipo!=='vence')||(f==='canjes'&&(h.tipo==='canje'||h.tipo==='usado'||h.tipo==='vence')));
  const lista=S.movTodos?vis:vis.slice(0,6);
  let mesAnt='',filas='';
  for(const h of lista){
    const m=MESES_L[h.f.split(' ')[1]]+' 2026';
    if(m!==mesAnt){filas+=`<div class="mv-mes">${m}</div>`;mesAnt=m}
    const pts=h.tipo==='usado'?'<span class="chip v">Usado</span>':`<b class="${h.p>0?'mas':'menos'}">${h.p>0?'+':'−'}${fmt(Math.abs(h.p))}</b>`;
    filas+=`<div class="mv ${h.nuevo?'nuevo':''}"><span class="mv-i t-${h.tipo}">${ic(ICO_MOV[h.tipo])}</span><span class="mv-t"><b>${h.t.replace(/ · Tienda \w+/,'')}</b><small>${h.s}${/Tienda (\w+)/.test(h.t)?' · Tienda '+h.t.match(/Tienda (\w+)/)[1]:''}</small></span><span class="mv-e"><span class="chip nodot t-${h.tipo}">${ETQ_MOV[h.tipo]}</span><small>${h.f}</small></span><span class="mv-p">${pts}<small>saldo ${fmt(h.despues)}</small></span></div>`;
  }
  const fil=[['todos','Todos'],['ganados','Ganados'],['canjes','Canjes y devueltos']];
  return `<section class="w-sec"><div class="w-sec-t"><h2>Movimientos de tus puntos</h2><span class="c">${S.hist.length}</span></div>
   <div class="mres"><div><small>Ganaste</small><b class="mas">+${fmt(ganados)}</b><span>en compras y regalos</span></div><div><small>Canjeaste</small><b class="menos">−${fmt(canjeados)}</b><span>en cupones</span></div><div><small>Te devolvimos</small><b>+${fmt(devueltos)}</b><span>de cupones vencidos</span></div></div>

  const C=S.caja, bruto=sumaCaja(), dCup=C.cuponAp?C.cuponAp.valor:0, total=Math.max(0,bruto-dCup), bono=(C.quien==='duena'&&C.cliente&&!S.cumpleRecibido)?S.params.regaloCumple:0;
  const gana=C.cliente?Math.floor(total*S.params.ptsPorSol):0;

/* =========================== acciones =========================== */
const A={
 set(k,v){S[k]=v;if(k==='vista'||k==='t')S.hoja=null;pinta()},
 prendas(n){S.caja.items=n===1?['polo']:['blusa','polo','jean'];S.caja.cuponAp=null;S.caja.res=null;pinta()},
 quien(q){const C=S.caja;C.quien=q;C.cliente=q!=='nadie';C.cuponAp&&C.cuponAp.origen==='caja'&&q!=='duena'&&A.quitarCupon();pinta()},
 tema(){const r=document.documentElement;r.dataset.tema=r.dataset.tema==='oscuro'?'claro':'oscuro';pinta()},
 movFiltro(v){S.movFiltro=v;S.movTodos=false;pinta()},
 movMas(){S.movTodos=!S.movTodos;pinta()},
 aviso(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#171614;color:#f5f0e8;padding:10px 16px;border-radius:12px;font-size:13px;z-index:300;max-width:90vw;text-align:center';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(A._t);A._t=setTimeout(()=>e.style.display='none',3800)},
 pasanDias(){let n=0;S.cupones.forEach(c=>{if(c.estado==='activo'){c.estado='vencido';S.saldo+=c.pts;n++;S.hist.unshift({f:c.vence,t:'Cupón vencido · tus puntos volvieron',s:c.codigo,p:c.pts,nuevo:true})}});A.aviso(n?'Pasaron 8 días: '+n+' cupón(es) vencieron y sus puntos volvieron al saldo.':'No hay cupones activos que vencer.');pinta()},
 dobleToque(){if(S.vista!=='tienda'){A.set('vista','tienda')}A.set('t','perfil');A.abrir('canje');const antes=S.saldo,n=S.cupones.length;A.crearCupon('web');A.crearCupon('web');A.aviso('2 toques → '+(S.cupones.length-n)+' cupón · puntos descontados: '+fmt(antes-S.saldo)+' (una sola vez)')},
 reiniciar(){const d=S.dev,t=document.documentElement.dataset.tema;S=INICIAL();S.dev=d;pinta()},
 irPaso(i){const p=PASOS[i];S.paso=i;S.vista=p.v;S.t=p.s;S.hoja=null;
   if(p.h==='canje'||p.h==='cupon'){if(p.h==='cupon'&&!S.ultimo){const c=A._crear('web',true);}S.hoja=p.h}
   if(p.h==='codigo'){if(!S.ultimo)A._crear('web',true);S.caja.cuponAp=null;S.caja.res=null;S.caja.entrada='';S.hoja='codigo'}
   if(i===4){S.caja.items=['blusa','polo','jean'];if(!S.caja.cuponAp){const c=S.ultimo||A._crear('web',true);A._aplicar(c.codigo)}}
   if(i===5){S.t='perfil';}
   pinta()},
 abrir(h,o){S.hoja=h;S.ver=o?o.ver:null;if(h==='codigo'){S.caja.entrada='';S.caja.res=null}if(h==='canje'||h==='usar'){S.token=(S.token||0)+1;S.canje=Math.max(S.params.minCanje,Math.min(S.canje,maxCanje()))}pinta()},
 cerrar(){S.hoja=null;S.ver=null;pinta()},
 canjeMas(){S.canje=Math.min(maxCanje(),S.canje+100);pinta()},
 canjeMenos(){S.canje=Math.max(S.params.minCanje,S.canje-100);pinta()},
 _crear(origen,silencioso){
   const mx=origen==='caja'?Math.min(maxCanje(),Math.floor(sumaCaja()/S.params.minCompraX/S.params.solesPor100)*100):maxCanje();
   const pts=Math.max(S.params.minCanje,Math.min(S.canje,mx)), valor=soles(pts);
   const c={codigo:nuevoCodigo(),valor,pts,min:Math.ceil(valor*S.params.minCompraX),gen:'hoy',vence:fechaVence(),dias:S.params.vigencia,estado:'activo',origen};
   S.saldo-=pts;S.cupones.push(c);S.ultimo=c;
   S.hist.unshift({f:HOY.split(' ')[0]+' oct',t:'Canje · cupón de '+S2(valor),s:c.codigo,p:-pts,nuevo:true});
   return c},
 crearCupon(origen){
   // Un toque, un cupón: la hoja trae una clave propia; repetirla (doble toque, reintento, otra pestaña) devuelve el MISMO cupón.
   if(S.tokenUsado===S.token&&S.ultimo){A.aviso('Ya estaba creado: es el mismo cupón. Tus puntos se descontaron una sola vez.');if(origen==='web'){S.hoja='cupon';S.ver=null;pinta()}return S.ultimo}
   S.tokenUsado=S.token;const c=A._crear(origen);
   if(origen==='caja'){A._aplicar(c.codigo);S.hoja=null}else{S.hoja='cupon';S.ver=null}
   pinta()},
 async copiar(code){try{await navigator.clipboard.writeText(code)}catch(e){}S.copiado=true;pinta();setTimeout(()=>{S.copiado=false;pinta()},1600)},
 dar(v){let s=v.toUpperCase().replace(/[^A-Z0-9]/g,'');if(s.startsWith('CAY'))s=s.slice(3);s=s.slice(0,8);return s?'CAY-'+(s.length>4?s.slice(0,4)+'-'+s.slice(4):s):''},
 escribe(v){const nv=A.dar(v);S.caja.entrada=nv;S.caja.res=null;const i=document.getElementById('cin');if(i)i.value=nv;document.getElementById('resCod').innerHTML=''},
 probar(c){S.caja.entrada=c;S.caja.res=null;A.validar()},
 validar(){
   const C=S.caja, code=(C.entrada||'').trim(); if(!code){pinta();return}
   const cup=S.cupones.find(c=>c.codigo===code), bruto=sumaCaja();
   if(!cup){C.fallos++;C.res={estado:'noexiste'}}
   else if(cup.estado==='vencido')C.res={estado:'vencido',cupon:cup};
   else if(cup.estado==='usado')C.res={estado:'usado',cupon:cup};
   else if(C.cuponAp&&C.cuponAp.codigo===cup.codigo)C.res={estado:'usado',cupon:{usadoEn:'este mismo ticket'}};
   else if(bruto<cup.min)C.res={estado:'minimo',cupon:cup};
   else C.res={estado:'ok',cupon:cup};
   pinta();const i=document.getElementById('cin');if(i){i.focus();i.setSelectionRange(99,99)}},
 _aplicar(code){const c=S.cupones.find(x=>x.codigo===code);S.caja.cuponAp={codigo:c.codigo,valor:c.valor,origen:c.origen||'web'};c.estado='aplicado'},
 aplicarCupon(code){A._aplicar(code);S.hoja=null;S.caja.res=null;pinta()},
 quitarCupon(){const a=S.caja.cuponAp;if(!a)return;const c=S.cupones.find(x=>x.codigo===a.codigo);if(c)c.estado='activo';S.caja.cuponAp=null;pinta()},
 cobrar(){
   const C=S.caja,bruto=sumaCaja(),dcup=C.cuponAp?C.cuponAp.valor:0,total=Math.max(0,bruto-dcup),bono=(C.quien==='duena'&&C.cliente&&!S.cumpleRecibido)?S.params.regaloCumple:0,gana=C.cliente?Math.floor(total*S.params.ptsPorSol):0;
   if(C.cliente&&gana>0){if(C.quien==='amiga')C.amiga+=gana;else{S.saldo+=gana;S.hist.unshift({f:'19 oct',t:'Compra B004-000231 · Tienda TRU',s:S2c(total)+' pagados',p:gana,nuevo:true})}}
   if(bono){S.saldo+=bono;S.cumpleRecibido=true;S.hist.unshift({f:'19 oct',t:'Regalo de cumpleaños',s:'Tu primera compra de tu mes',p:bono,nuevo:true})}
   if(C.cuponAp&&C.quien!=='duena')S.hist.unshift({f:'19 oct',t:'Tu cupón lo usó otra persona',s:C.cuponAp.codigo+' · Tienda TRU',p:0,nuevo:true});
   if(C.cuponAp){const c=S.cupones.find(x=>x.codigo===C.cuponAp.codigo);if(c){c.estado='usado';c.usadoEn='hoy · Tienda TRU · B004-000231'}}
   C.cobro={total,gana,bono,dcup,cupon:C.cuponAp?C.cuponAp.codigo:null,cliente:C.cliente,quien:C.quien};S.hoja='cobrado';pinta()},
 nuevaVenta(){const C=S.caja;C.cuponAp=null;C.res=null;C.entrada='';C.cobro=null;S.hoja=null;pinta()},
 bolsaUsar(v){const code=A.dar(v||''),c=S.cupones.find(x=>x.codigo===code),sub=258.9;let m='';
   if(!c)m='No encontramos ese cupón.';else if(c.estado==='usado')m='Ese cupón ya se usó.';else if(c.estado==='vencido')m='Ese cupón venció.';else if(sub<c.min)m=`Este cupón pide una compra de ${S2(c.min)} o más.`;
   if(m){const e=document.getElementById('bolsaMsg');if(e)e.textContent=m;return}
   S.bolsaCupon={codigo:c.codigo,valor:c.valor};pinta()},
 bolsaQuitar(){S.bolsaCupon=null;pinta()},
 param(k,v){const n=parseFloat(String(v).replace(',','.'));if(isFinite(n)&&n>0){S.params[k]=(k==='solesPor100'||k==='topeCosto')?n:Math.round(n);S.canje=Math.max(S.params.minCanje,S.canje)}pinta()}
};

/* =========================== dibujo =========================== */
function pantalla(){
  if(S.vista==='tienda'){
    const cuerpo=S.t==='bolsa'?bolsa():perfil();
    const hoja=S.hoja==='canje'?hojaCanje():S.hoja==='cupon'?hojaCupon(S.ver):'';
    return {html:`<div class="tienda">${cabTienda()}${cuerpo}</div>`,hoja};
  }
  if(S.vista==='caja'){
    const hoja=S.hoja==='codigo'?hojaCodigo():S.hoja==='usar'?hojaUsar():S.hoja==='cobrado'?hojaCobrado():'';
    return {html:caja(),hoja};
  }
  return {html:`<div class="tienda erp">${lider()}</div>`,hoja:''};
}
let lastHoja=null,lastK=null;
function pinta(){
  barra();
  const sc=document.querySelector('.pant'), y=sc?sc.scrollTop:0, yTipo=sc?sc.dataset.k:null;
  const {html,hoja}=pantalla();
  const k=S.vista+S.t+S.dev;
  // La animación de entrada solo corre al abrir la hoja o al cambiar de pantalla, no en cada toque de «+» o «−».
  const quieta=(S.hoja&&S.hoja===lastHoja?' q-hoja':'')+(k===lastK?' q-vista':'');
  lastHoja=S.hoja;lastK=k;
  const velo=hoja?`<div class="velo" onclick="if(event.target===this)A.cerrar()">${hoja}</div>`:'';
  const inner=`<div class="pant" data-k="${k}">${html}</div>${velo}`;
  const marco=S.dev==='celular'?`<div class="tel"><div class="marco cel${quieta}">${inner}</div></div>`:`<div class="sx"><div class="marco desk${quieta}">${inner}</div></div>`;
  document.getElementById('esc').innerHTML=marco;
  const n=document.querySelector('.pant');if(n&&yTipo===k)n.scrollTop=y;
  const i=document.getElementById('cin');if(i&&S.hoja==='codigo'&&S.caja.fallos<5){i.focus();i.setSelectionRange(99,99)}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.hoja)A.cerrar()});
A.irPaso(0);
</script>
