<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Existencias en tarjetas · maqueta</title>
<link rel="icon" href="cayla-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<!-- Maqueta del ERP: la columna de módulos, la barra superior y la pantalla Existencias, con datos inventados.
     Lo que se toca aquí (reponer, ajustar, filtrar, cambiar de sede) solo vive en esta pestaña: recargar lo restablece. -->
<div class="app" id="app" data-lat="abierto">
  <aside class="lat" id="lat" aria-label="Módulos">
    <div class="lat-in">
      <a class="logo" href="#" data-ir="Inicio" aria-label="CAYLA Retail">
        <img src="cayla-isotipo.png" alt="">
        <div><b>CAYLA</b><small>RETAIL</small></div>
      </a>
      <nav class="nav" id="nav"></nav>
      <p class="lema">Donde el estilo transforma.</p>
      <div class="usuario">
        <div class="avatar" aria-hidden="true">FA</div>
        <div class="quien"><b>Felipe Alvarez</b><small id="rol-sede">Líder · Tienda TRU</small></div>
        <button class="salir" type="button" data-ir="Salir">SALIR</button>
      </div>
    </div>
  </aside>

  <div class="cuerpo">
    <header class="top">
      <button class="ib" id="alt-lat" type="button" aria-label="Ocultar o mostrar la columna de módulos" title="Ocultar o mostrar los módulos">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path d="M15.5 10l-2 2 2 2"/></svg>
      </button>
      <button class="buscador" id="abrir-paleta" type="button" aria-label="Buscar (Ctrl K)">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Buscar...</span><span class="kb"><kbd>Ctrl</kbd><kbd>K</kbd></span>
      </button>
      <div class="der">
        <button class="actividad" id="abrir-act" type="button" aria-haspopup="dialog">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2"/></svg><span>ACTIVIDAD</span>
        </button>
        <button class="sede" id="abrir-sede" type="button" aria-haspopup="listbox">
          <span id="sede-nombre">TIENDA TRU</span>
          <svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </header>

    <main class="main" id="main">
      <header class="cab">
        <div>
          <p class="hilo" id="hilo"></p>
          <h1 class="tit">Existencias</h1>
          <p class="frase">Qué hay en piso y almacén, qué viene en camino y qué deberías reponer hoy.</p>
        </div>
        <div class="acc">
          <div class="fila">
            <button class="btn btn-sec" type="button" data-ir="Bajar al piso" data-ruta="/inventario/bajar">Bajar al piso</button>
            <button class="btn btn-pri" type="button" data-ir="Nuevo traslado" data-ruta="/inventario/mover">+ Nuevo traslado</button>
          </div>
          <div class="fila" id="atajos"></div>
        </div>
      </header>

      <section class="cifras" id="cifras" aria-label="Cifras de la sede"></section>

      <div class="filtros" id="filtros" role="search"></div>

      <div class="linea">
        <p class="cuenta" id="cuenta" aria-live="polite"></p>
        <div class="orden">
          <button class="btn-vista" id="btn-vista" type="button" aria-pressed="false"></button>
          <span class="rot">Ordenar por:</span>
          <button class="combo" id="cb-orden" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
        </div>
      </div>

      <div id="resultados"></div>
    </main>
  </div>
</div>

<aside class="cajon" id="cajon" aria-label="Detalle de la prenda" aria-hidden="true"></aside>
<div class="barra-sel" id="barra-sel" role="region" aria-label="Prendas seleccionadas"></div>
<div id="capas"></div>
<div class="raiz-flot" id="flot"></div>
<div class="espera" id="espera" hidden role="status" aria-live="polite"><div class="in"><img src="cayla-isotipo.png" alt=""><p id="espera-t">Cargando</p></div></div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<p class="marca-m" id="marca-m">Maqueta · datos inventados</p>

<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
