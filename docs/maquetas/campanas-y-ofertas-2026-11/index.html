<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campañas y ofertas · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Maqueta (docs/): los valores copian los tokens de apps/web/app/globals.css y estilos/tema.css. */
:root{
  --crema:#f5f0e8; --papel:#fbf8f2; --hueso:#eae1d2; --sand:#e8e0d0; --tinta:#1a1a18; --taupe:#805c4c;
  --rojo:#b8412d; --rojo-p:#8b2a1f; --verde:#48603f; --ambar:#74501a; --pizarra:#4c5d6e; --borde:#96786a; --sombra:#1a1a18;
  --vidrio:color-mix(in srgb,var(--papel) 72%,transparent);
  --serif:"EB Garamond",Georgia,serif; --sans:"DM Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-tema="oscuro"]{
  --crema:#1c1a17; --papel:#26241f; --hueso:#33302a; --sand:#403b34; --tinta:#f5f0e8; --taupe:#c4a898;
  --rojo:#e8806a; --rojo-p:#e8806a; --verde:#9ccb8d; --ambar:#e4b968; --pizarra:#a9bccf; --borde:#8d7a6e; --sombra:#000;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--tinta);background:var(--crema);font-size:14px;line-height:1.45;
  background-image:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--rojo) 7%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--taupe) 10%,transparent),transparent 60%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.serif{font-family:var(--serif)}
.vers{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.tenue{color:color-mix(in srgb,var(--tinta) 66%,transparent)}
.taupe{color:var(--taupe)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.ch{width:14px;height:14px} svg.i.gr{width:20px;height:20px}

/* ---------- barra de la maqueta ---------- */
.mq{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#1a1a18;color:#f5f0e8;font-size:12.5px} /* tema-fijo: barra de la maqueta, no es del ERP */
.mq b{font-weight:600}
.mq .sp{flex:1}
.mq button{background:transparent;border:1px solid #5a554c;border-radius:999px;padding:4px 12px;color:#f5f0e8} /* tema-fijo */
.mq button[aria-pressed="true"]{background:#f5f0e8;color:#1a1a18} /* tema-fijo */
.mq .grupo{display:flex;gap:4px;align-items:center}
.mq .grupo span{opacity:.7;margin-right:2px}

/* ---------- marco del ERP ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 44px)}
.lat{padding:20px 14px;border-right:1px solid var(--sand);background:color-mix(in srgb,var(--papel) 55%,transparent)}
.lat .marca{font-family:var(--serif);font-size:24px;letter-spacing:.08em;padding:0 10px 18px}
.lat .grp{padding:14px 10px 6px}
.lat a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:inherit;text-decoration:none;font-size:14px;position:relative}
.lat a.act{background:var(--papel);box-shadow:0 1px 0 color-mix(in srgb,var(--sombra) 6%,transparent),inset 0 0 0 1px var(--sand);font-weight:500}
.lat a .nuevo{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--verde);border:1px solid color-mix(in srgb,var(--verde) 40%,transparent);border-radius:999px;padding:1px 7px}
.lat a.mute{color:color-mix(in srgb,var(--tinta) 64%,transparent)}
.main{padding:22px 32px 60px;min-width:0}

/* cabecera */
.cab{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.cab .sede{display:flex;align-items:center;gap:10px;color:var(--taupe)}
.cab .sede:before{content:"";width:28px;height:1px;background:var(--taupe)}
.cab h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.05;margin:8px 0 0;display:flex;align-items:center;gap:10px}
.ayuda{width:22px;height:22px;border-radius:50%;border:1px solid var(--sand);background:var(--vidrio);font-size:12px;display:inline-grid;place-items:center;font-family:var(--sans)}
.cab .acc{margin-left:auto;display:flex;gap:10px;padding-top:4px}
.frase{margin:6px 0 0;max-width:62ch;color:var(--taupe);font-size:15px}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 18px;border:1px solid var(--borde);background:var(--papel);font-size:13.5px;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--sombra) 40%,transparent)}
.btn.pri{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.btn.pri:hover{background:var(--rojo-p);border-color:var(--rojo-p)}
.btn.cab-v{font-size:11px;letter-spacing:.14em;text-transform:uppercase;height:40px;padding:0 18px}
.btn.chico{padding:6px 12px;font-size:13px}
.btn.sutil{border-color:transparent;background:transparent}
.btn.peligro{color:var(--rojo-p)}
.enlace{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--tinta) 30%,transparent);text-underline-offset:3px}
.enlace:hover{color:var(--rojo-p)}

/* pestañas */
.pest{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--vidrio);border:1px solid var(--sand);margin:22px 0 4px}
.pest button{border:0;background:transparent;border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.pest button[aria-selected="true"]{background:var(--tinta);color:var(--crema)}
.glob{min-width:20px;height:20px;border-radius:999px;background:color-mix(in srgb,var(--tinta) 9%,transparent);font-size:11px;display:inline-grid;place-items:center;padding:0 6px;letter-spacing:0}
.pest button[aria-selected="true"] .glob{background:color-mix(in srgb,var(--crema) 22%,transparent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;background:color-mix(in srgb,var(--tinta) 6%,transparent);white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.sin:before{display:none}
.chip.verde{color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,transparent)}
.chip.ambar{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 13%,transparent)}
.chip.piz{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 12%,transparent)}

/* ---------- lista de campañas ---------- */
.mesa{display:grid;grid-template-columns:400px 1fr;gap:32px;margin-top:18px;align-items:start}
.tit-sec{display:flex;align-items:center;gap:8px;margin:14px 2px 10px}
.pase{display:block;width:100%;text-align:left;border:1px solid var(--sand);background:var(--vidrio);border-radius:20px;padding:14px 16px;margin-bottom:10px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.pase:hover{transform:translateY(-1px);box-shadow:0 10px 24px -16px color-mix(in srgb,var(--sombra) 50%,transparent)}
.pase[aria-current="true"]{border-color:var(--tinta);box-shadow:inset 3px 0 0 var(--rojo)}
.pase.rige{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.pase.rige .tenue{color:color-mix(in srgb,var(--crema) 75%,transparent)}
.pase .fila{display:flex;align-items:center;gap:12px}
.sello{width:42px;height:42px;border-radius:50%;border:1.5px dashed currentColor;display:grid;place-items:center;flex:none;opacity:.85}
.pase .nom{font-weight:600;font-size:15px}
.pase .cnt{margin-left:auto;text-align:right}
.pase .cnt b{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1;display:block}
.pase .cnt span{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.pase .prep{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed color-mix(in srgb,currentColor 25%,transparent)}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.mini .pt{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.mini.ok .pt{background:var(--verde);color:var(--crema)}
.mini.no .pt{border:1.5px solid var(--borde)}
.pase.rige .mini.no .pt{border-color:var(--crema)}
.pase.rige .chip{color:var(--crema);background:color-mix(in srgb,var(--crema) 14%,transparent)}

/* detalle */
.det{background:var(--vidrio);border:1px solid var(--sand);border-radius:28px;padding:28px 32px}
.det .cuando{color:var(--taupe)}
.det h2{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.05;margin:6px 0 4px}
.det .resumen{font-size:16px;max-width:60ch;margin:10px 0 0}
.lista-prep{margin:22px 0 0;border-top:1px solid var(--sand)}
.lp{display:grid;grid-template-columns:28px 160px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--sand);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.lp:hover{background:color-mix(in srgb,var(--tinta) 3%,transparent)}
.lp .pt{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.lp.ok .pt{background:var(--verde);color:var(--crema)}
.lp.no .pt{border:1.5px dashed var(--borde)}
.lp.sig .pt{border:2px solid var(--tinta)}
.lp .q{font-weight:600}
.lp .a{color:color-mix(in srgb,var(--tinta) 72%,transparent)}
.lp .go{display:flex;align-items:center;gap:6px;color:var(--taupe);font-size:13px}
.det .pie{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.det .pie .sp{flex:1}
.etq-mini{display:flex;gap:18px;align-items:center;margin-top:18px}

/* menú más */
.mas{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:6px;box-shadow:0 20px 40px -20px color-mix(in srgb,var(--sombra) 45%,transparent);z-index:5}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left}
.menu button:hover{background:var(--hueso)}

/* ---------- hoja ---------- */
.velo{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--sombra) 28%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:start center;padding:72px 16px 28px;overflow:auto}
.velo.entra{animation:fade .24s var(--ease)}
.velo.entra .hoja{animation:sube .34s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes sube{from{opacity:0;transform:translateY(18px) scale(.985)}}
.hoja{width:min(1240px,100%);background:color-mix(in srgb,var(--papel) 94%,transparent);border:1px solid color-mix(in srgb,var(--crema) 60%,transparent);border-radius:32px;box-shadow:0 40px 80px -40px color-mix(in srgb,var(--sombra) 60%,transparent);overflow:hidden}
.h-cab{display:flex;align-items:flex-start;gap:16px;padding:24px 28px 14px}
.h-cab h3{font-family:var(--serif);font-weight:400;font-size:27px;margin:0;line-height:1.1}
.h-cab p{margin:4px 0 0;color:var(--taupe)}
.cerrar{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--sand);background:var(--papel);display:grid;place-items:center}
.h-cuerpo{display:grid;grid-template-columns:220px 1fr 340px;gap:0;border-top:1px solid var(--sand);min-height:540px}
.riel{padding:18px 14px;border-right:1px solid var(--sand)}
.paso{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:14px;position:relative}
.paso:hover{background:color-mix(in srgb,var(--tinta) 4%,transparent)}
.paso[aria-current="step"]{background:var(--papel);box-shadow:inset 0 0 0 1px var(--sand)}
.paso[aria-current="step"]:before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;background:var(--tinta);border-radius:2px}
.paso .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1.5px solid var(--borde)}
.paso.ok .n{background:var(--verde);border-color:var(--verde);color:var(--crema)}
.paso .t{font-weight:600;font-size:14px}
.paso .s{font-size:13px;color:color-mix(in srgb,var(--tinta) 66%,transparent);margin-top:1px}
.paso .s.sig{color:var(--tinta)}
.paso .s.sig:before{content:"Sigue · ";font-weight:600}
.riel .nota{margin:18px 6px 0;font-size:13px;color:var(--taupe)}
.form{padding:22px 28px 26px;min-width:0}
.form h4{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.form .baj{color:var(--taupe);margin:4px 0 18px;font-size:15px}
.prev{padding:20px 20px;background:color-mix(in srgb,var(--hueso) 55%,transparent);border-left:1px solid var(--sand)}
.h-pie{display:flex;align-items:center;gap:10px;padding:14px 28px;border-top:1px solid var(--sand);background:color-mix(in srgb,var(--papel) 80%,transparent)}
.h-pie .sp{flex:1}
.falta{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.falta b{font-weight:600}

/* opciones (tarjetas) */
.ops{display:grid;gap:10px}
.op{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--sand);background:var(--papel);border-radius:18px;padding:12px 14px;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.op:hover{transform:translateY(-1px)}
.op .ic{width:44px;height:44px;border-radius:14px;background:var(--hueso);display:grid;place-items:center}
.op .ti{font-weight:600;font-size:15px}
.op .tx{font-size:13.5px;color:color-mix(in srgb,var(--tinta) 68%,transparent)}
.op[aria-pressed="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.op[aria-pressed="true"] .ic{background:var(--tinta);color:var(--crema)}
.op.pronto{border-style:dashed;background:transparent;opacity:.75}
.op.pronto:hover{transform:none}
.op .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--borde);display:grid;place-items:center}
.op[aria-pressed="true"] .radio{border-color:var(--tinta)}
.op[aria-pressed="true"] .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--tinta)}
.ops.dos{grid-template-columns:repeat(3,1fr)}
.forma{border:1px solid var(--sand);background:var(--papel);border-radius:16px;padding:12px;text-align:left;display:grid;gap:4px}
.forma .gr{font-family:var(--serif);font-size:24px;line-height:1}
.forma .tx{font-size:12.5px;color:color-mix(in srgb,var(--tinta) 68%,transparent)}
.forma[aria-pressed="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}

.bloque{margin-top:18px;padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--papel) 70%,transparent);border:1px solid var(--sand)}
.bloque.entra{animation:sube .3s var(--ease)}
.bloque .et{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:color-mix(in srgb,var(--tinta) 72%,transparent);margin:0 0 8px}
.frase-campos{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:17px}
.paso-cant{display:inline-flex;align-items:center;border:1px solid var(--borde);background:var(--hueso);border-radius:12px;height:40px;overflow:hidden}
.paso-cant button{width:34px;height:100%;border:0;background:none;display:grid;place-items:center}
.paso-cant button:hover{background:color-mix(in srgb,var(--tinta) 6%,transparent)}
.paso-cant input{width:52px;text-align:center;border:0;background:transparent;font-size:16px;font-weight:600;outline:none}
.caja{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:var(--hueso);border-radius:12px;height:40px;padding:0 12px}
.caja input{border:0;background:transparent;width:80px;outline:none;font-size:16px;font-weight:600}
.caja:focus-within,.paso-cant:focus-within{background:var(--papel);border-color:var(--tinta);box-shadow:0 0 0 4px color-mix(in srgb,var(--tinta) 8%,transparent)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--hueso);border:1px solid var(--sand)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--papel);box-shadow:0 1px 3px color-mix(in srgb,var(--sombra) 18%,transparent);font-weight:600}
.pild{display:flex;flex-wrap:wrap;gap:8px}
.pild button{border:1px solid var(--borde);background:var(--papel);border-radius:999px;padding:7px 14px;font-size:13.5px;display:inline-flex;gap:8px;align-items:center}
.pild button[aria-pressed="true"]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.pild button .c{opacity:.7;font-size:12px}
.ayudita{font-size:13.5px;color:var(--taupe);margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.err{color:var(--rojo-p);font-size:13.5px;margin-top:8px;display:flex;gap:6px;align-items:center}
.escalon{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--sand)}
.escalon:last-child{border-bottom:0}
.radios{display:grid;gap:8px;margin-top:4px}
.radios label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.radios input{margin-top:3px;accent-color:var(--tinta)}

/* vista previa */
.prev .et{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:color-mix(in srgb,var(--tinta) 72%,transparent);margin:0 0 8px}
.etiqueta{position:relative;background:var(--papel);border-radius:18px;padding:22px 18px 16px;text-align:center;border:1px solid var(--sand);margin-top:14px}
.etiqueta:before{content:"";position:absolute;top:-14px;left:50%;width:1px;height:16px;background:var(--tinta)}
.etiqueta:after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--hueso);border:1px solid var(--sand)}
.etiqueta .n{font-family:var(--serif);font-size:20px;margin-top:6px}
.etiqueta .g{font-family:var(--serif);font-size:40px;line-height:1;margin:8px 0 4px;color:var(--rojo-p)}
.etiqueta .g.vacio{font-size:16px;color:var(--taupe);font-family:var(--sans)}
.etiqueta .f{font-size:13px;color:var(--taupe)}
.ticket{margin-top:16px;background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:14px 14px 10px}
.ticket .tt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.tl{display:grid;grid-template-columns:18px 22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--sand);font-size:13px}
.tl input{accent-color:var(--tinta);margin:0}
.tl .sw{width:22px;height:22px;border-radius:6px}
.tl .nm{line-height:1.2}
.tl .nm small{display:block;color:color-mix(in srgb,var(--tinta) 64%,transparent);font-size:11.5px}
.tl .pr{text-align:right;white-space:nowrap}
.tl .pr s{color:color-mix(in srgb,var(--tinta) 55%,transparent);font-size:11.5px;display:block}
.tl .pr .gratis{color:var(--verde);font-weight:600}
.tl.fuera{opacity:.55}
.tl.off{opacity:.4}
.tot{display:flex;justify-content:space-between;padding:6px 0 0;font-size:13px}
.tot.ahorro{color:var(--verde);font-weight:600}
.tot.grande{font-size:16px;font-weight:600;border-top:1px solid var(--sand);margin-top:6px;padding-top:8px}
.consejo{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--ambar) 10%,transparent);color:var(--ambar);display:flex;gap:8px}
.selector{border:1px solid var(--sand);border-radius:18px;padding:12px;background:color-mix(in srgb,var(--papel) 60%,transparent)}
.buscador{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--hueso);border:1px solid var(--borde)}

    case "porcat": avisar("Ya entra por su categoría", "Para quitarla, quita la categoría o elige las prendas una por una."); return;
    case "limpiarq": c.q = ""; break;
    case "todaslista": { const q = c.q.trim().toLowerCase(); const lib = MODELOS.filter(m => (c.filtro === "todas" || m.cat === c.filtro) && (!q || m.n.toLowerCase().includes(q)) && !c.cats[m.cat]); const all = lib.every(m => c.sueltas[m.k]); lib.forEach(m => (c.sueltas[m.k] = !all)); break; }
    case "tipo": st.animBloque = o.tipo !== v; o.tipo = v; break;
    case "pronto": avisar("Llega pronto", "Un regalo y lo del Club vienen después. Hoy puedes registrar una rebaja, un «lleva varias» o un descuento por monto."); return;
    case "pct": o.pct = +v; break;
    case "forma": o.forma = v; break;
    case "grupo": o.grupo = v; break;
    case "menos": o[v] = Math.max(v === "m" ? 1 : 2, o[v] - 1); if (v === "n" && o.m >= o.n) o.m = o.n - 1; break;
    case "mas1": o[v] = Math.min(10, o[v] + 1); if (v === "m" && o.m >= o.n) o.n = o.m + 1; break;
    case "modo": o.modo = v; if (v === "pct") { o.valor = 10; o.esc = o.esc.map((e, i) => ({ ...e, valor: 15 + i * 5 })); } else { o.valor = 30; o.esc = o.esc.map((e, i) => ({ ...e, valor: 70 + i * 50 })); } break;
    case "addesc": { const last = o.esc.length ? o.esc[o.esc.length - 1] : { desde: o.desde, valor: o.valor }; o.esc.push({ desde: last.desde + 200, valor: o.modo === "soles" ? last.valor + 40 : last.valor + 5 }); break; }
    case "quitaresc": o.esc.splice(+v, 1); break;
    case "base": o.base = v; break;
    case "dia": c.dias[+v] = c.dias[+v] ? 0 : 1; break;
    case "tienda": c.tiendas[v] = !c.tiendas[v]; break;
    case "cederbf": C().cedeBF = true; break;
    case "excluir": C().montoExcluye = true; break;
    case "incluir": C().montoExcluye = false; break;
    case "deshacerbf": C().cedeBF = false; break;
    case "todast": { const all = Object.values(c.tiendas).every(Boolean); Object.keys(c.tiendas).forEach(k => (c.tiendas[k] = !all)); break; }
    case "carrito": st.enCarrito[v] = !st.enCarrito[v]; break;
    case "guardar":
      if (faltasTodas().length) { faltasTodas().forEach(p => (st.intento[p] = true)); break; }
      c.estado = v === "activar" ? "activa" : "borrador"; st.vista = "lista"; st.sel = "previos";
      if (v === "activar") { st.estampa = true; pintar(); setTimeout(() => { st.estampa = false; avisar("Listo: Previos al Black Friday está lista", "Empieza sola el martes 17. Hasta entonces puedes cambiarla."); }, 900); return; }
      avisar("Guardada sin activar", "La caja no la cobra hasta que la actives.");
      return;
    case "nada": avisar("No es parte de esta maqueta", "Esta acción queda igual que hoy."); return;
  }
  pintar();
});
// Lo que se escribe actualiza el estado y solo repinta la vista previa y el riel (sin perder el cursor).
R.addEventListener("input", e => {
  if (e.target.dataset.q) { C().q = e.target.value; const g = document.getElementById("grilla"); if (g) g.innerHTML = grilla(); return; }
  const k = e.target.dataset.i; if (!k) return;
  const o = C().oferta, n = parseFloat(String(e.target.value).replace(",", ".")) || 0;
  const m = k.match(/^esc-(desde|valor)-(\d+)$/);
  if (m) o.esc[+m[2]][m[1]] = n; else o[k] = n;
  const prev = document.getElementById("prev"); if (prev) prev.innerHTML = vistaPrevia();
  document.querySelectorAll(".paso .s").forEach((s, i) => (s.textContent = PASOS[i].s()));
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (st.mapa) st.mapa = false; else if (st.migrando) st.migrando = null; else if (st.cajon) st.cajon = false; else if (st.vista === "hoja") st.vista = "lista"; st.menuMas = null; pintar(); } });
pintar();
</script>
