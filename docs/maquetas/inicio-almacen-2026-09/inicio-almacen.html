<!doctype html>
<html lang="es" data-mov="completo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inicio de Almacén · maquetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · Inicio de la cuenta de Almacén (2026-09-30)
   Tres direcciones sobre los mismos datos: A «Cabina», B «Recorrido»,
   C «Radar». La barra oscura de arriba NO existe en el ERP: solo cambia
   de dirección, de ancho, de escenario y de intensidad de movimiento.
   Tokens = los de apps/web/app/globals.css (ADR-0169). Sin hex sueltos
   en la interfaz; los colores de las prendas son DATO (como la tabla
   `colores`), no interfaz. Datos inventados.
   Responsive de verdad: el marco es un contenedor (container queries),
   así que «Tablet» y «Celular» reordenan el diseño igual que lo haría
   una ventana de ese ancho. ADR-0206: en celular el menú es el cajón ☰,
   sin barra inferior; el botón fijo de abajo es una acción de ESTA
   pantalla, no navegación.
   Movimiento: curva --ease-cayla, sin rebote. «Completo» suma bucles
   ambientales que el repo hoy NO aprobaría (ADR-0136): están aislados
   en `.amb` para poder quitarlos con un solo interruptor.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--verde-p:#44583a;--ambar:#74501a;--ambar-p:#734f15;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t12:rgba(26,26,24,.12);--t08:rgba(26,26,24,.08);--t05:rgba(26,26,24,.05);
  --c80:rgba(245,240,232,.8);--c60:rgba(245,240,232,.6);--c14:rgba(245,240,232,.14);--c08:rgba(245,240,232,.08);
  --ease:cubic-bezier(.32,.72,.24,1);--ease-out:cubic-bezier(.4,0,1,1);
  --sans:'DM Sans',system-ui,sans-serif;--serif:'EB Garamond',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:#ddd5c6;color:var(--tinta);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--t65)}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px;border-radius:8px}

/* ── barra del demo (no existe en el ERP) ── */
.spk{position:sticky;top:0;z-index:100;background:var(--tinta);color:var(--crema);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;font-size:12.5px}
.spk .tit{font-family:var(--serif);font-size:21px;align-self:center;margin-right:6px;line-height:1.05}
.spk .tit small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:rgba(245,240,232,.5);margin-top:2px}
.spk .g{display:flex;flex-direction:column;gap:4px}
.spk .g>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:flex;border:1px solid rgba(245,240,232,.25);border-radius:10px;overflow:hidden}
.seg button{padding:6px 11px;color:rgba(245,240,232,.75);white-space:nowrap;transition:background .26s var(--ease),color .26s var(--ease)}
.seg button+button{border-left:1px solid rgba(245,240,232,.18)}
.seg button:hover{background:rgba(245,240,232,.1)}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--tinta);font-weight:600}

/* ── escena y marco ── */
.stage{padding:18px;display:flex;justify-content:center}
.frame{--w:100%;width:var(--w);max-width:100%;height:calc(100dvh - var(--spkh,66px) - 36px);min-height:640px;max-height:1120px;background:var(--crema);border:1px solid var(--t12);border-radius:18px;overflow:hidden;position:relative;container:app/inline-size;transition:width .65s var(--ease),border-radius .65s var(--ease);box-shadow:0 30px 64px -22px rgba(26,26,24,.28)}
.frame[data-v=tablet]{--w:820px}
.frame[data-v=celular]{--w:390px;border-radius:36px}
@media (max-width:700px){
  .stage{padding:0}
  .frame{--w:100%!important;border-radius:0!important;border:0;box-shadow:none;height:calc(100dvh - var(--spkh,66px));min-height:0}
  .spk .g.vista{display:none}
}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
@container app (max-width:1040px){.app{grid-template-columns:76px minmax(0,1fr)}}
@container app (max-width:720px){.app{grid-template-columns:minmax(0,1fr)}}

/* ── lateral ── */
.side{border-right:1px solid var(--t12);padding:20px 12px 18px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.logo{display:flex;align-items:center;gap:12px;padding:2px 10px 24px}
.logo img{height:34px;width:auto}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{letter-spacing:.3em;font-weight:500;font-size:16px}
.logo .wm i{font-style:normal;letter-spacing:.3em;font-size:9.5px;color:var(--taupe);margin-top:7px}
.nav{display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;border-radius:12px;color:var(--t80);position:relative;white-space:nowrap;transition:background .26s var(--ease)}
.nav:hover{background:var(--t05)}
.nav .ic{color:var(--t50);transition:transform .35s var(--ease),color .26s}
.nav:hover .ic{transform:translateX(2px);color:var(--tinta)}
.nav .chev{margin-left:auto;width:14px;height:14px;color:var(--t30)}
.nav .ct{margin-left:auto;font-size:11px;min-width:20px;text-align:center;border-radius:99px;background:var(--ambar);color:var(--crema);padding:1px 6px;font-weight:600}
.nav.act{background:rgba(232,224,208,.75);color:var(--tinta);font-weight:500}
.nav.act::before{content:"";position:absolute;left:-12px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--rojo)}
.side .pie{margin-top:auto;padding:0 10px;font-family:var(--serif);font-style:italic;color:var(--taupe);font-size:15px;line-height:1.3}
@container app (max-width:1040px){
  .nav span.tx,.nav .chev,.logo .wm,.side .pie{display:none}
  .nav{justify-content:center;padding:0}
  .nav .ct{position:absolute;top:5px;right:7px;margin:0;min-width:16px;font-size:10px;padding:0 4px}
  .logo{justify-content:center;padding:2px 0 24px}
}
@container app (max-width:720px){.side{display:none}}

/* ── columna principal y barra superior ── */
.col{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.top{flex:none;height:66px;display:flex;align-items:center;gap:14px;padding:0 clamp(14px,3cqi,32px);border-bottom:1px solid var(--t12);background:rgba(245,240,232,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:5}
.tg{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--t65);transition:background .26s var(--ease);flex:none}
.tg:hover{background:var(--t05)}
.tg.menu{display:none}
.buscar{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;min-width:min(250px,100%);border-radius:99px;background:rgba(232,224,208,.6);color:var(--t65);font-size:15px;transition:background .26s var(--ease)}
.buscar:hover{background:rgba(232,224,208,1)}
.buscar kbd{margin-left:auto;font:600 11px var(--sans);background:var(--papel);border-radius:6px;padding:2px 7px;color:var(--t65)}
.top .sede{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;color:var(--t80);white-space:nowrap}
.top .av{width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:0}
@container app (max-width:720px){
  .tg.menu{display:grid}.tg.panel{display:none}
  .buscar{min-width:0;flex:1}.buscar kbd{display:none}
  .top .sede span{display:none}
}
.scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.page{container:pg/inline-size;padding:30px clamp(16px,4cqi,44px) 96px;max-width:1420px;margin:0 auto;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.page.sale{opacity:0;transform:translateY(8px);transition:opacity .17s var(--ease-out),transform .17s var(--ease-out)}

/* ── movimiento ── */
@keyframes sube{from{opacity:0;transform:translateY(18px)}}
@keyframes latido{0%{opacity:.7;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.9)}}
@keyframes deriva{to{transform:translate(60px,34px) scale(1.12)}}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes barre{to{transform:translateX(130%)}}
@keyframes escanea{from{transform:translateY(0)}to{transform:translateY(420%)}}
@keyframes fluirH{from{background-position:0 0}to{background-position:100% 0}}
@keyframes fluirV{from{background-position:0 0}to{background-position:0 100%}}
@keyframes fluye{to{stroke-dashoffset:-28}}
@keyframes dibuja{to{stroke-dashoffset:0}}
.rv{animation:sube .62s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
.rj{animation:sube .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + var(--j,0)*45ms + 140ms)}
html[data-mov=apagado] *,html[data-mov=apagado] *::before,html[data-mov=apagado] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html[data-mov=sobrio] .amb,html[data-mov=sobrio] .amb::before,html[data-mov=sobrio] .amb::after{animation:none!important}
html[data-mov=sobrio] .tilt{transform:none!important}

/* ── piezas base ── */
.card{background:var(--papel);border:1px solid var(--sand);border-radius:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{font:600 11px var(--sans);letter-spacing:0;background:var(--tinta);color:var(--crema);border-radius:99px;padding:1px 8px}
.ayu{font-size:13px;color:var(--t65);margin:-4px 0 12px;display:flex;gap:8px;align-items:flex-start}
.ayu .ic{width:15px;height:15px;margin-top:3px;color:var(--taupe)}
.enl{font-size:13px;color:var(--taupe);font-weight:500;display:inline-flex;align-items:center;gap:4px;transition:gap .26s var(--ease),color .26s}
.enl:hover{color:var(--rojo);gap:8px}
.enl .ic{width:15px;height:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .26s var(--ease),background .26s var(--ease),color .26s var(--ease),border-color .26s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--tinta);color:var(--crema)}
.btn.pri:hover{background:var(--rojo)}
.btn.pri .ic{transition:transform .5s var(--ease)}
.btn.pri:hover .ic{transform:rotate(90deg)}
.btn.sec{border:1px solid var(--t12)}
.btn.sec:hover{background:var(--t05);border-color:var(--t30)}
.spot{position:relative;isolation:isolate;overflow:hidden}
.spot::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .4s var(--ease);pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(128,92,76,.11),rgba(128,92,76,.04) 50%,transparent 72%)}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;opacity:0;transition:opacity .4s var(--ease);pointer-events:none;background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(128,92,76,.6),transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.spot:hover::after,.spot:hover::before{opacity:1}

/* ── cabecera de página ── */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:26px;flex-wrap:wrap}
.cab .sobre{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--rojo);margin-bottom:8px}
.cab h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,7cqi,48px);line-height:1.04;letter-spacing:-.01em}
.cab .baj{color:var(--taupe);font-size:17px;margin-top:6px}
.cab .acc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t65);padding:7px 13px;border-radius:99px;background:var(--papel);border:1px solid var(--sand);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);position:relative;flex:none}
.sync i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--verde);opacity:0;animation:latido 2.4s var(--ease) infinite}

/* ── hero (A) ── */
.hero{position:relative;isolation:isolate;border-radius:26px;background:var(--h-bg);color:var(--h-fg);overflow:hidden;padding:clamp(20px,3.4cqi,38px);display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,3cqi,34px);margin-bottom:28px;box-shadow:inset 0 0 0 1px var(--h-edge)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;opacity:.6;background-image:linear-gradient(var(--h-grid) 1px,transparent 1px),linear-gradient(90deg,var(--h-grid) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(90% 130% at 18% 0%,#000 18%,transparent 76%);mask-image:radial-gradient(90% 130% at 18% 0%,#000 18%,transparent 76%)}
.aur{position:absolute;z-index:-1;border-radius:50%;filter:blur(56px);pointer-events:none}
.aur.a{width:440px;height:330px;left:-120px;top:-140px;background:radial-gradient(closest-side,var(--h-a),transparent);animation:deriva 15s ease-in-out infinite alternate}
.aur.b{width:480px;height:340px;right:-150px;bottom:-180px;background:radial-gradient(closest-side,var(--h-b),transparent);animation:deriva 19s ease-in-out infinite alternate-reverse}
.hl{position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0;min-height:210px}
.hl .lbl{color:var(--h-60);display:flex;align-items:center;gap:9px}
.hl .lbl::before{content:"";width:22px;height:1px;background:var(--h-60)}
.hl h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7.6cqi,68px);line-height:.98;letter-spacing:-.015em}
.hl .sub{color:var(--h-80);max-width:44ch;font-size:16px;position:relative;z-index:1}
.hl .ac{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-top:10px;position:relative;z-index:1}
.cta{position:relative;display:inline-flex;align-items:center;gap:14px;height:58px;padding:0 10px 0 26px;border-radius:99px;background:var(--h-btn);color:var(--h-btn-fg);font-weight:600;font-size:16px;overflow:hidden;transition:box-shadow .35s var(--ease);will-change:transform}
.cta:hover{box-shadow:0 0 0 6px var(--h-halo)}
.cta .plus{width:40px;height:40px;border-radius:50%;background:var(--h-btn-fg);color:var(--h-btn);display:grid;place-items:center;transition:transform .55s var(--ease)}
.cta:hover .plus{transform:rotate(90deg)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.8) 50%,transparent 64%);transform:translateX(-130%);animation:barre 1.5s var(--ease) 1.1s 1 forwards;pointer-events:none}
.tecla{font:600 12px var(--sans);color:var(--h-60);display:inline-flex;align-items:center;gap:8px}
.tecla kbd{border:1px solid var(--h-line);border-radius:7px;padding:2px 9px;background:var(--h-kbd);color:var(--h-fg);font:600 12px var(--sans)}
.vinc{color:var(--h-80);font-size:14px;display:inline-flex;align-items:center;gap:8px;border-bottom:1px solid var(--h-line);padding-bottom:2px;transition:color .26s,gap .3s var(--ease),border-color .26s;cursor:pointer}
.vinc:hover{color:var(--h-fg);border-color:var(--h-60);gap:12px}
.vinc .ic{width:15px;height:15px}
.ah{border-radius:20px;padding:20px;background:var(--h-glass);border:1px solid var(--h-glass-b);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;min-width:0}
.ah .lbl{color:var(--h-60);display:flex;align-items:center;gap:8px}
.ah .lbl i{width:7px;height:7px;border-radius:50%;background:var(--rojo);position:relative}
.ah .lbl i.ok{background:var(--verde)}
.ah h3{font-weight:500;font-size:20px;line-height:1.25}
.ah .d{color:var(--h-60);font-size:14px}
.ah .fila{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:14px;border-top:1px solid var(--h-line)}
.ah .fila .t{font-size:13px;color:var(--h-80);line-height:1.35}
.ah .fila .t b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--h-fg);line-height:1}
.go{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:12px;background:var(--h-btn);color:var(--h-btn-fg);font-weight:600;font-size:14.5px;width:fit-content;transition:gap .3s var(--ease),transform .26s var(--ease)}
.go:hover{gap:14px}
.go:active{transform:scale(.98)}
.go .ic{width:16px;height:16px}
.ring{width:54px;height:54px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .bg{stroke:var(--h-line)}
.ring .fg{stroke:var(--h-fg);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.3s var(--ease) .3s}
.in .ring .fg{stroke-dashoffset:var(--off)}
.ring.l .bg{stroke:var(--t12)}.ring.l .fg{stroke:var(--verde)}
/* ── color de la cabina: Papel (elegido por Felipe, 2026-09-30). Todo sale de tokens; las variables --h-* permiten cambiarlo en un solo lugar ── */
.hero{--h-bg:var(--papel);--h-solid:var(--papel);--h-fg:var(--tinta);--h-80:var(--t80);--h-60:var(--t65);--h-line:var(--t12);--h-grid:rgba(26,26,24,.07);--h-edge:var(--sand);--h-glass:rgba(234,225,210,.5);--h-glass-b:var(--sand);--h-a:rgba(128,92,76,.24);--h-b:rgba(76,93,110,.16);--h-btn:var(--tinta);--h-btn-fg:var(--crema);--h-halo:rgba(26,26,24,.08);--h-kbd:var(--t05)}
/* ── cabina final (Felipe, 2026-09-30): Nuevo producto, lo último de otras sedes y «Sigue ahora» ── */
.hl.compacto{gap:14px;min-height:0}
.hl.compacto h2{font-size:clamp(36px,5.6cqi,56px)}
.uh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;position:relative;z-index:1}
.uh>span,.desp .lbl2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--h-60)}
.uh .vinc{font-size:12.5px;font-weight:500;border-bottom:0;padding:0;color:var(--h-80)}
.hl .lst{display:grid;gap:8px;position:relative;z-index:1}
.rs{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:14px;background:var(--h-glass);border:1px solid transparent;transition:background .26s var(--ease),border-color .26s,transform .35s var(--ease)}
.rs:hover{border-color:var(--h-line);background:var(--papel);transform:translateX(4px)}
.rs .th{width:44px;height:44px;border-radius:11px;background:var(--hueso);display:grid;place-items:center;flex:none}
.rs .th svg{width:24px;height:28px;color:var(--c);fill:currentColor}
.rs .mtx{min-width:0}
.rs .nm{font-weight:500;font-size:14.5px;line-height:1.2}
.rs .mt{font-size:12.5px;color:var(--h-60);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rs .ya{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--verde-p);white-space:nowrap}
.rs-msg{font-size:14px;color:var(--h-80);padding:10px 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.desp{display:grid;gap:2px}
.desp .lbl2{margin-bottom:4px}
.dp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14px;transition:background .26s var(--ease)}
.dp:hover{background:var(--papel)}
.dp .t{flex:1;min-width:0;color:var(--h-fg)}
.dp .n{font-size:12px;padding:1px 9px;min-width:24px}
.dp .ic{width:15px;height:15px;color:var(--verde);stroke-width:2.2;flex:none}
@container pg (min-width:720px){.hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}

/* ── Te toca ── */
.tt{overflow:hidden}
.ap{display:flex;align-items:center;gap:14px;padding:15px 20px;border-top:1px solid var(--t08);position:relative;transition:background .26s var(--ease);width:100%;text-align:left}
.ap.f{border-top:0}
.ap:hover{background:var(--t05)}
.ap.u::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rojo)}
.pt{width:9px;height:9px;border-radius:50%;flex:none;position:relative}
.pt.urg{background:var(--rojo)}.pt.toca{background:var(--ambar)}.pt.info{background:var(--pizarra)}.pt.dia{background:var(--verde)}.pt.sl{background:var(--t30)}
.pt.urg::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--rojo);opacity:0;animation:latido 2.4s var(--ease) infinite}
.ap .tx{flex:1;min-width:0}
.ap .t{font-weight:500;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;transition:color .26s}
.ap:hover .t{color:var(--rojo)}
.ap .d{font-size:13px;color:var(--t65);margin-top:1px}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rojo)}
.n{min-width:28px;text-align:center;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.n.urg{background:var(--rojo);color:var(--crema)}.n.toca{background:var(--ambar);color:var(--crema)}.n.info{background:var(--pizarra);color:var(--crema)}.n.dia{background:var(--verde);color:var(--crema)}.n.sl{background:var(--t08);color:var(--t80);font-size:12px}
.ap .chev{width:16px;height:16px;color:var(--t30);transition:transform .3s var(--ease),color .26s;flex:none}
.ap:hover .chev{transform:translateX(4px);color:var(--rojo)}
.mas{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.mas.on{grid-template-rows:1fr}
.mas>div{overflow:hidden}
.vm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;font-size:13.5px;color:var(--taupe);border-top:1px solid var(--t08);font-weight:500;transition:background .26s}
.vm:hover{background:var(--t05)}
.vm .ic{width:15px;height:15px;transition:transform .4s var(--ease)}
.vm.on .ic{transform:rotate(180deg)}
.dial{display:flex;gap:10px;align-items:center;padding:13px 20px;font-size:13px;color:var(--t65);border-top:1px solid var(--t08)}
.dial .ic{width:16px;height:16px;color:var(--verde)}
.dial b{color:var(--verde-p);font-weight:600}
.vacio{display:flex;gap:16px;align-items:center;padding:22px 22px}
.vacio .ck{width:46px;height:46px;border-radius:50%;background:rgba(72,96,63,.12);display:grid;place-items:center;flex:none}
.vacio .ck svg{width:24px;height:24px;stroke:var(--verde);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:dibuja .7s var(--ease) .4s forwards}
.vacio b{display:block;font-weight:500;font-size:16px}
.vacio span{font-size:13px;color:var(--t65)}
.err{padding:18px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--t80)}
.err .ic{color:var(--ambar);width:22px;height:22px}
.err p{flex:1;min-width:200px}
.mini{height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--t12);transition:background .26s var(--ease),color .26s,border-color .26s;white-space:nowrap}
.mini:hover{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.mini .ic{width:15px;height:15px}
.mini.foto{border-color:rgba(116,80,26,.4);color:var(--ambar-p)}
.mini.foto:hover{background:var(--ambar);color:var(--crema);border-color:var(--ambar)}

/* ── Nuevo en otras sedes ── */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--t12);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;color:var(--t80);white-space:nowrap;transition:background .26s var(--ease),color .26s,border-color .26s}
.chip:hover{background:var(--t05)}
.chip[aria-pressed=true]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.chip em{font-style:normal;font-size:11px;opacity:.65}
.arr{display:flex;gap:8px}
.arr button{width:38px;height:38px;border-radius:50%;border:1px solid var(--t12);display:grid;place-items:center;transition:background .26s var(--ease),color .26s,transform .26s var(--ease)}
.arr button:hover{background:var(--tinta);color:var(--crema)}
.arr button:active{transform:scale(.92)}
.fd{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;scrollbar-width:none;scroll-behavior:smooth;perspective:1000px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.fd::-webkit-scrollbar{display:none}
.fd.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));overflow:visible;-webkit-mask-image:none;mask-image:none;scroll-snap-type:none;perspective:none}
.dv{flex:0 0 26px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--t12);margin-left:2px}
.dv span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--t50)}
.gr .dv{display:none}
.pc{flex:0 0 min(250px,74cqi);scroll-snap-align:start;position:relative;border-radius:18px;background:var(--papel);border:1px solid var(--sand);overflow:hidden;display:flex;flex-direction:column;transition:transform .45s var(--ease),border-color .3s,box-shadow .4s var(--ease);will-change:transform}
.gr .pc{flex:none}
.pc:hover{border-color:var(--taupe);box-shadow:0 18px 36px -18px rgba(26,26,24,.25)}
.pc.hl2{border-color:var(--tinta);box-shadow:0 0 0 1px var(--tinta)}
.pc .ft{position:relative;aspect-ratio:1/1.02;background:linear-gradient(160deg,var(--hueso),var(--sand));display:grid;place-items:center;overflow:hidden}
.pc .ft svg.g{width:54%;height:auto;color:var(--c);fill:currentColor;filter:drop-shadow(0 12px 14px rgba(26,26,24,.2));transition:transform .7s var(--ease)}
.pc:hover .ft svg.g{transform:scale(1.07) translateY(-4px)}
.pc .ft.sin{background:repeating-linear-gradient(135deg,var(--hueso) 0 10px,rgba(232,224,208,.55) 10px 20px)}
.pc .ft.sin svg.g{fill:none;stroke:var(--taupe);stroke-width:1.4;stroke-dasharray:4 4;filter:none;opacity:.75}
.pc .scan{position:absolute;left:0;right:0;height:36%;top:-40%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.6),transparent);animation:escanea 1.7s var(--ease) calc(var(--i,0)*80ms + .6s) 1 both;pointer-events:none}
.bd{position:absolute;top:10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
.bd .ic{width:12px;height:12px;stroke-width:2}
.bd.nv{left:10px;background:var(--tinta);color:var(--crema)}
.bd.fo{right:10px;background:rgba(251,248,242,.88);color:var(--verde-p)}
.bd.sf{right:10px;background:rgba(251,248,242,.88);color:var(--ambar-p)}
.pc .bd2{padding:14px 16px 6px;display:flex;flex-direction:column;gap:7px;flex:1}
.cod{font:500 11.5px var(--mono);letter-spacing:.04em;color:var(--t65)}
.pc h4{font-weight:600;font-size:15.5px;line-height:1.25}
.qn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t65);flex-wrap:wrap}
.sd{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:99px;padding:2px 9px 2px 7px;background:var(--t05);color:var(--tinta)}
.sd i{width:7px;height:7px;border-radius:50%}
.sd.AQP i{background:var(--pizarra)}.sd.LIM i{background:var(--taupe)}.sd.Taller i{background:var(--tinta)}
.sw{display:flex;align-items:center;padding-left:3px}
.sw i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--papel);box-shadow:0 0 0 1px var(--t12);margin-left:-3px}
.sw b{font-size:11.5px;color:var(--t65);margin-left:8px;font-weight:500}
.pie-pc{margin-top:auto;padding-top:10px;border-top:1px dashed var(--t12);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.pie-pc .pr{font-weight:600;font-variant-numeric:tabular-nums}
.pie-pc .tr{color:var(--t65);text-align:right}
.pie-pc .tr.ok{color:var(--verde-p);font-weight:500}
.pc .ac2{display:flex;gap:8px;padding:12px 16px 16px}
.pc .ac2 .mini{flex:1;padding:0 8px}

/* ── Pulso ── */
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.k{padding:16px;border-radius:18px;background:var(--papel);border:1px solid var(--sand);position:relative;overflow:hidden;min-height:108px}
.k .lbl{font-size:10.5px}
.k .v{font-family:var(--serif);font-size:36px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.k .v small{font-size:18px;margin-left:2px}
.k .s{font-size:12.5px;color:var(--t65);margin-top:2px}
.k .s .up{color:var(--verde-p);font-weight:600}
.k .spark{position:absolute;right:12px;bottom:12px;width:74px;height:28px}
.spark path{fill:none;stroke:var(--taupe);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s var(--ease) .3s}
.in .spark path{stroke-dashoffset:0}
.k .ring{position:absolute;right:12px;top:50%;margin-top:-27px}

/* ── En camino ── */
.ruta{padding:6px 0}
.rr{padding:15px 18px;border-top:1px solid var(--t08);display:grid;gap:10px}
.rr:first-child{border-top:0}
.rr .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rr .hd b{font-weight:600;font-size:14.5px}
.rr .hd span{font-size:12.5px;color:var(--t65)}
.via{position:relative;height:30px;display:flex;align-items:center;justify-content:space-between}
.via .ln{position:absolute;left:14px;right:14px;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--t30) 0 6px,transparent 6px 12px)}
.via .ln i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tinta);transition:width 1.6s var(--ease) .35s}
.in .via .ln i{width:calc(var(--pv)*100%)}
.via .nd{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--papel);border:1.5px solid var(--t30);display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.04em}
.via .nd.on{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.via .tk{position:absolute;z-index:2;top:50%;left:14px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--taupe);color:var(--crema);display:grid;place-items:center;transition:left 1.6s var(--ease) .35s}
.via .tk .ic{width:14px;height:14px}
.in .via .tk{left:calc(14px + (100% - 28px)*var(--pv))}
.via .tk::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--taupe);opacity:0;animation:latido 2.4s var(--ease) 1.6s infinite}
.rr .prog{font-size:12.5px;color:var(--t65);display:flex;justify-content:space-between;gap:10px}

/* ── Reponer a piso ── */
.rp .it{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--t08);transition:background .26s var(--ease);width:100%;text-align:left}
.rp .it.f{border-top:0}
.rp .it:hover{background:var(--t05)}
.rp .mg{width:40px;height:40px;border-radius:11px;background:var(--hueso);display:grid;place-items:center;flex:none}
.rp .mg svg{width:22px;height:26px;color:var(--c);fill:currentColor}
.rp .nm{font-weight:500;font-size:14.5px;line-height:1.25}
.rp .cl{font-size:12.5px;color:var(--t65)}
.tl{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.tl span{font-size:11.5px;padding:0 7px;line-height:21px;border-radius:6px;background:var(--t05);color:var(--t65);font-variant-numeric:tabular-nums}
.tl span.p{background:rgba(116,80,26,.16);color:var(--ambar-p);font-weight:700}
.rp .pie{padding:12px 18px;border-top:1px solid var(--t08);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t65);gap:10px}

/* ── Accesos ── */
.acs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ax{display:flex;flex-direction:column;align-items:center;gap:9px;padding:17px 6px;border-radius:16px;background:var(--papel);border:1px solid var(--sand);font-size:13.5px;font-weight:500;transition:transform .4s var(--ease),border-color .3s,color .26s,box-shadow .4s var(--ease);text-align:center}
.ax svg.ic{width:24px;height:24px;transition:transform .45s var(--ease)}
.ax:hover{transform:translateY(-3px);color:var(--rojo);border-color:var(--taupe);box-shadow:0 14px 26px -16px rgba(26,26,24,.3)}
.ax:hover svg.ic{transform:scale(1.14)}
.ax.esc{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.ax.esc:hover{color:var(--crema);background:var(--taupe);border-color:var(--taupe)}

/* ── layouts ── */
.gA{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
.gA>*,.cL>*,.cR>*,.gB>*,.cR2>*,.r2>*,.r3>*,.gC>*{min-width:0}
.cL,.cR{display:grid;gap:30px;align-content:start;min-width:0}
.cR{grid-template-columns:minmax(0,1fr)}
@container pg (min-width:640px) and (max-width:999px){.cR{grid-template-columns:repeat(2,minmax(0,1fr))}.cR>.full{grid-column:1/-1}}
@container pg (min-width:1000px){.gA{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}}

/* B · recorrido */
.flujo{position:relative;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);padding-left:58px;margin-bottom:34px}
.flujo::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--t12);border-radius:2px}
.flujo::after{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:linear-gradient(to bottom,transparent 38%,var(--taupe) 50%,transparent 62%);background-size:100% 400%;animation:fluirV 3.8s linear infinite}
.et{position:relative;display:flex}
.et .nd{position:absolute;left:-58px;top:0;width:44px;height:44px;border-radius:50%;background:var(--papel);border:1.5px solid var(--t30);display:grid;place-items:center;font-family:var(--serif);font-size:21px;z-index:1;transition:background .4s var(--ease),color .4s,border-color .4s,box-shadow .4s}
.et.cur .nd{background:var(--tinta);color:var(--crema);border-color:var(--tinta);box-shadow:0 0 0 7px rgba(26,26,24,.08)}
.et.ok .nd{background:var(--verde);border-color:var(--verde);color:var(--crema)}
.et.ok .nd svg{width:20px;height:20px;stroke-width:2.2}
.et-c{flex:1;min-width:0;border-radius:18px;background:var(--papel);border:1px solid var(--sand);overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,box-shadow .4s var(--ease)}
.et.cur .et-c{border-color:var(--tinta);box-shadow:0 0 0 1px var(--tinta),0 20px 40px -24px rgba(26,26,24,.35)}
.et-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;cursor:pointer;width:100%;text-align:left}
.et-h h3{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.05}
.et-h p{font-size:13px;color:var(--t65);margin-top:3px}
.et-h .big{margin-left:auto;text-align:right;flex:none}
.et-h .big b{display:block;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.et-h .big span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--t65)}
.sigue{display:flex;align-items:center;justify-content:space-between;gap:14px 18px;padding:16px 18px;margin-bottom:24px;flex-wrap:wrap}
.sigue .t{font-family:var(--serif);font-size:25px;line-height:1.1}
.sigue .d{font-size:13px;color:var(--t65);margin-top:3px;max-width:52ch}
.sigue .btn{flex:0 0 auto}
@container pg (min-width:1000px){.sigue{display:none}}
@container pg (max-width:639px){.sigue .btn{flex:1 1 100%}}
.aqui{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--tinta);color:var(--crema);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:3px 10px}
.st.urg{background:rgba(184,65,45,.1);color:var(--rojo-p)}.st.toca{background:rgba(116,80,26,.12);color:var(--ambar-p)}.st.dia{background:rgba(72,96,63,.12);color:var(--verde-p)}
.st .ic{width:12px;height:12px;stroke-width:2.2}
.et-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease);flex:1}
.et.ab .et-b{grid-template-rows:1fr}
.et-b>div{overflow:hidden;display:flex;flex-direction:column}
.et-b .ap{padding:12px 18px}
.et-b .ap .t{font-size:14.5px}
.et-cta{margin:auto 14px 14px;padding-top:0}
.et-cta .btn{width:100%;height:48px}
@container pg (min-width:1000px){
  .flujo{grid-template-columns:repeat(4,minmax(0,1fr));padding:64px 0 0}
  .flujo::before{left:22px;right:0;top:22px;bottom:auto;width:auto;height:2px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .flujo::after{left:22px;right:0;top:22px;bottom:auto;width:auto;height:2px;background:linear-gradient(90deg,transparent 38%,var(--taupe) 50%,transparent 62%);background-size:400% 100%;animation:fluirH 3.8s linear infinite}
  .et .nd{left:0;top:-64px}
  .et-b{grid-template-rows:1fr}
  .et-h{cursor:default}
}
.gB{display:grid;gap:30px;grid-template-columns:minmax(0,1fr);margin-bottom:30px}
.cR2{display:grid;gap:30px;align-content:start;min-width:0}
@container pg (min-width:1000px){.gB{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
@container pg (min-width:640px) and (max-width:999px){.cR2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.r2{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
@container pg (min-width:700px){.r2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* C · radar */
.gC{display:grid;gap:30px;grid-template-columns:minmax(0,1fr);margin-bottom:30px;align-items:start}
@container pg (min-width:1000px){.gC{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.radar{position:relative;overflow:hidden;padding:0;background:var(--papel);background-image:linear-gradient(var(--t05) 1px,transparent 1px),linear-gradient(90deg,var(--t05) 1px,transparent 1px);background-size:32px 32px}
.radar .hd{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;padding:16px 20px 0;flex-wrap:wrap;position:relative;z-index:2}
.radar .leyenda{display:flex;gap:14px;font-size:12px;color:var(--t65);flex-wrap:wrap}
.radar .leyenda span{display:inline-flex;align-items:center;gap:6px}
.radar .leyenda i{width:14px;height:0;border-top:2px dashed var(--taupe)}
.radar .leyenda i.s{border-top-style:solid;border-color:var(--tinta)}
.rd{display:block;width:100%;height:auto;margin-top:-4px;position:relative;z-index:1}
.rd text{font-family:var(--sans);font-size:13px;fill:var(--tinta);font-weight:600;letter-spacing:.04em}
.rd .sub{font-size:11px;fill:var(--t65);font-weight:400;letter-spacing:0}
.rd .anillo{fill:none;stroke:var(--t12);stroke-width:1}
.rd .anillo.d{stroke-dasharray:2 6}
.rd .tick{stroke:var(--t30);stroke-width:1}
.rd .eje{stroke:var(--t08);stroke-width:1}
.rd .arco{fill:none;stroke-width:2;stroke-linecap:round}
.rd .arco.vivo{stroke:var(--tinta);stroke-dasharray:6 8;animation:fluye 1.1s linear infinite}
.rd .arco.idle{stroke:var(--taupe);stroke-dasharray:3 7;opacity:.85}
.rd .arco.tenue{stroke:var(--t30);stroke-dasharray:2 6}
.rd .bola{fill:var(--tinta)}
.rd .barrido{transform-origin:320px 236px;transform-box:view-box;animation:giro 9s linear infinite}
.rd .nodo{cursor:pointer;outline:none}
.rd .nodo .cuerpo{fill:var(--papel);stroke:var(--tinta);stroke-width:1.6;transition:fill .3s var(--ease),stroke .3s,r .4s var(--ease)}
.rd .nodo .ini{fill:var(--tinta);transition:fill .3s}
.rd .nodo:hover .cuerpo,.rd .nodo.sel .cuerpo,.rd .nodo.hl3 .cuerpo{fill:var(--tinta)}
.rd .nodo:hover .ini,.rd .nodo.sel .ini,.rd .nodo.hl3 .ini{fill:var(--crema)}
.rd .nodo .halo{fill:none;stroke:var(--taupe);stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:.0}
.rd .nodo .halo.p{animation:latido 3.2s var(--ease) infinite}
.rd .nodo .ins{fill:var(--tinta);transition:transform .3s var(--ease)}
.rd .nodo .insx{fill:var(--crema);font-size:11px;font-weight:700;letter-spacing:0}
.rd .nodo:hover .ins{transform:scale(1.15)}
.rd .nodo .ins,.rd .nodo .insx{transform-box:fill-box;transform-origin:center}
.rd .centro .cuerpo{fill:var(--tinta);stroke:var(--tinta)}
.rd .centro .ini{fill:var(--crema);font-size:15px;letter-spacing:.12em}
.radar .info{position:absolute;left:20px;top:58px;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--t65);text-transform:uppercase;line-height:1.7;z-index:2;pointer-events:none}
.radar .flt{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:3}
.radar .flt .btn{height:50px;border-radius:99px;padding:0 24px;background:rgba(26,26,24,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.radar .ft2{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--t08);background:rgba(251,248,242,.9);position:relative;z-index:2}
@container pg (min-width:640px){.radar .ft2{grid-template-columns:repeat(2,minmax(0,1fr))}.radar .ft2 .rr+.rr{border-top:0;border-left:1px solid var(--t08)}}
@container pg (max-width:639px){
  .rd text{font-size:19px}.rd .sub{font-size:15px}.rd .nodo .insx{font-size:15px}.rd .centro .ini{font-size:20px}
  .radar .info{display:none}
  .radar .flt{display:none}
}
.r3{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
@container pg (min-width:700px){.r3{grid-template-columns:repeat(2,minmax(0,1fr))}.r3>.full{grid-column:1/-1}}
@container pg (min-width:1100px){.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.r3>.full{grid-column:auto}}

/* ── móvil ── */
@container pg (max-width:639px){
  .cab{margin-bottom:20px}
  .cab .acc{width:100%}.cab .acc .btn{flex:1}
  .cab .acc .sync{display:none}
  .hero{padding:20px 18px;border-radius:22px}
  .hl{min-height:0}
  .hl h2{font-size:42px}
  .hl .sub{display:none}
  .hl .ac{margin-top:4px}
  .pc .ft{aspect-ratio:1/.8}
  .cta{height:54px;width:100%;justify-content:space-between}
  .tecla{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .arr{display:none}
  .fd.gr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;perspective:1000px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
  .gr .pc{flex:0 0 min(250px,74cqi)}
  .gr .dv{display:flex}
  .ap{padding:14px 16px}
  .k .v{font-size:32px}
  .gA,.cL,.cR{gap:26px}
}

/* ── botón fijo, cajón, aviso ── */
.dock{position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--crema) 58%,rgba(245,240,232,0));display:none;gap:10px;transform:translateY(120%);transition:transform .55s var(--ease);z-index:20;pointer-events:none}
.dock>*{pointer-events:auto}
.dock.on{transform:none}
.dock .btn.pri{flex:1;height:54px;border-radius:16px;font-size:16px}
.dock .ib{width:54px;height:54px;border-radius:16px;border:1px solid var(--t12);background:var(--papel);display:grid;place-items:center;flex:none;transition:background .26s,transform .26s var(--ease)}
.dock .ib:active{transform:scale(.94)}
.dock .ib .ic{width:22px;height:22px}
@container app (max-width:720px){.dock{display:flex}}
.velo{position:absolute;inset:0;background:rgba(26,26,24,.4);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:40}
.velo.on{opacity:1;pointer-events:auto}
.cajon{position:absolute;left:0;top:0;bottom:0;width:min(84%,320px);background:var(--crema);border-right:1px solid var(--t12);transform:translateX(-104%);transition:transform .5s var(--ease);z-index:41;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.cajon.on{transform:none}
.cajon .x{position:absolute;right:10px;top:16px}
.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;background:var(--tinta);color:var(--crema);border-radius:14px;padding:12px 18px;font-size:13.5px;display:flex;gap:12px;align-items:center;z-index:60;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);max-width:calc(100% - 28px);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast code{font:500 12.5px var(--mono);color:var(--c60);overflow:hidden;text-overflow:ellipsis}
.toast .ic{width:16px;height:16px}
@container app (max-width:720px){.toast{bottom:92px}}

/* ── nota bajo el marco ── */
.porque{max-width:1180px;margin:0 auto 40px;padding:0 18px}
.porque .in2{background:var(--papel);border:1px dashed var(--taupe);border-radius:14px;padding:18px 22px;font-size:14px;color:var(--t80);display:grid;gap:18px 34px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.porque h3{font-family:var(--serif);font-weight:400;font-size:26px;grid-column:1/-1;line-height:1.1}
.porque h3 small{font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--taupe);margin-left:10px}
.porque b{font-weight:600;color:var(--tinta)}
.porque ul{margin:6px 0 0 18px;list-style:disc}
.porque li+li{margin-top:3px}
</style>
</head>

    { k: 'conteo', niv: 'dia', t: 'Conteo abierto', d: 'No hay conteos abiertos.', n: 0, go: '/inventario/conteo', ahora: '' },
  ].map(a => ({ ...a }));
  if (aldia) av.forEach(a => { a.n = 0; a.niv = 'dia'; a.tag = ''; });
  if (falla) av.forEach(a => { if (a.k === 'traslados' || a.k === 'recibir') { a.n = null; a.niv = 'sl'; a.d = 'No se pudo leer. Lo demás de esta pantalla sí está al día.'; } });
  const activos = av.filter(a => a.n > 0).sort((x, y) => ORDEN[x.niv] - ORDEN[y.niv]);
  const sinleer = av.filter(a => a.n === null);

  return {
    av, activos, sinleer, alDia, lista, res, pct, porK,
    nuevos: falla ? null : NUEVOS,

        { nm: 'Vestido Midi Sol', cl: 'Vino', k: 'vestido', tono: '#6b2a35', tallas: [['S', 1]] },
      ],
    },
  };
}

function tarjetas(lista, anim) {

  });
  return html;
}

    { n: 1, t: 'Llega', s: 'Lo que entra a tu almacén', go: '/recibir', cta: 'Recibir mercadería', icono: 'truck', it: ['traslados', 'recibir'] },

  ].map(e => {
    const items = e.it.map(k => d.porK[k]);

let io;
function contar(el) {
  const fin = +el.dataset.count;
  if (S.mov === 'apagado') { el.textContent = miles(fin); return; }
  const t0 = performance.now(), dur = 1000;
  const paso = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = miles(Math.round(fin * e)); if (p < 1) requestAnimationFrame(paso); };
  el.textContent = '0'; requestAnimationFrame(paso);
}
function activar(el) { el.classList.add('in'); $$('[data-count]', el).forEach(contar); }
function observar() {

  $$('.onv').forEach(el => io.observe(el));
}
let dockIO;

  dockIO.observe(obj);
}

  if (sc) { e.preventDefault(); const dest = $(sc.dataset.scroll), cont = $('#scroll'); if (dest) cont.scrollTo({ top: cont.scrollTop + dest.getBoundingClientRect().top - cont.getBoundingClientRect().top - 20, behavior: 'smooth' }); return; }
  if (t.closest('#bMenu')) { $('#cajon').classList.add('on'); $('#velo').classList.add('on'); return; }
  if (t.closest('#bCierra') || t.closest('#velo')) { cerrarCajon(); return; }
  const go = t.closest('[data-go]');
  if (go) { e.preventDefault(); cerrarCajon(); toast(go.dataset.go, go.dataset.txt); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarCajon();
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    toast('/productos/nuevo', 'Abre'); const c = $('#cta-principal'); if (c) { c.animate([{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.32,.72,.24,1)' }); }
  }
  const nd = e.target.closest && e.target.closest('[data-nodo]');
  if (nd && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nd.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

/* foco de luz, imán y leve inclinación (solo con mouse y movimiento completo) */
const fino = matchMedia('(hover:hover) and (pointer:fine)');
document.addEventListener('pointermove', e => {
  if (!fino.matches || S.mov === 'apagado') return;
  const sp = e.target.closest && e.target.closest('.spot');
  if (sp) { const r = sp.getBoundingClientRect(); sp.style.setProperty('--mx', (e.clientX - r.left) + 'px'); sp.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
  const tl = e.target.closest && e.target.closest('.tilt');
  if (tl && S.mov === 'completo') { const r = tl.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; tl.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg) translateY(-4px)`; }
  const mg = e.target.closest && e.target.closest('.mag');
  if (mg && S.mov === 'completo') { const r = mg.getBoundingClientRect(); mg.style.transform = `translate(${((e.clientX - r.left) / r.width - .5) * 10}px,${((e.clientY - r.top) / r.height - .5) * 8}px)`; }
});
document.addEventListener('pointerout', e => {
  const tl = e.target.closest && e.target.closest('.tilt'); if (tl && !tl.contains(e.relatedTarget)) tl.style.transform = '';
  const mg = e.target.closest && e.target.closest('.mag'); if (mg && !mg.contains(e.relatedTarget)) mg.style.transform = '';
});
/* cruce entre tarjeta y sede (Radar) */
document.addEventListener('pointerover', e => {
  if (S.dir !== 'C') return;
  const pc = e.target.closest && e.target.closest('.pc');
  const k = pc ? pc.dataset.sede : null;
  if (k !== S.hl) { S.hl = k; $$('.rd .nodo[data-nodo]').forEach(n => n.classList.toggle('hl3', n.dataset.nodo === k)); }
});

/* latido de sincronización (señal, no adorno) */
let seg = 8;
setInterval(() => { seg = (seg + 1) % 34; $$('.synct').forEach(el => el.textContent = seg < 2 ? 'ahora' : `hace ${seg} s`); }, 1000);

/* arranque */
document.documentElement.dataset.mov = S.mov;
$$('#sMov button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.mov));
const ajustaBarra = () => document.documentElement.style.setProperty('--spkh', $('#spk').offsetHeight + 'px');
addEventListener('resize', ajustaBarra); ajustaBarra();
pintarShell(); render();
})();
</script>
</body>
</html>
