<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuevo producto · Buscar primero, escribir después · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA · «Buscar primero, escribir después» (2026-09-30, revisada el mismo día)
   El paso 2 «¿Cómo es?» de Nuevo producto, reordenado (Marca → Nombre → Descripción → Tejido → Patrón), con una ALERTA de prendas parecidas
   en el resumen de la derecha (tarjeta compacta) y la hoja «Ver y comparar» (Felipe, 2026-09-30: en vez de un bloque grande dentro del formulario).
   Tokens = los oficiales de apps/web/app/globals.css (ADR-0169), con sus mismos nombres.
   La guía de foco es la de apps/web/app/estilos/alta-guia.css (ADR-0284), portada tal cual.
   El marco de la página (cabecera, lateral de 17 rem, paso + ficha de 340 px) es el real: así el paso mide lo que mide de verdad
   (724 px con una pantalla de 1440, 564 con 1280, 1204 con 1920).
   Datos: lo REAL sale de producción (solo lectura, 2026-09-30); lo inventado lleva «Ejemplo».
   Lo que lleva la clase .nota-maqueta (o data-solo-maqueta) NO es de la pantalla: es anotación de la maqueta y se quita al portar.
   No es la implementación: no cambia ninguna pantalla.
   ==================================================================== */
:root{
  --color-rojo:#b8412d;--color-rojo-profundo:#8b2a1f;--color-crema:#f5f0e8;--color-tinta:#1a1a18;--color-sand:#e8e0d0;
  --color-papel:#fbf8f2;--color-hueso:#eae1d2;--color-taupe:#805c4c;--color-pizarra:#4c5d6e;--color-verde:#48603f;--color-ambar:#74501a;
  --color-ambar-profundo:#734f15;
  --ease-cayla:cubic-bezier(.32,.72,.24,1);--ease-salida:cubic-bezier(.4,0,1,1);
  --radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-2xl:20px;
  --t75:color-mix(in srgb,var(--color-tinta) 75%,transparent);--t70:color-mix(in srgb,var(--color-tinta) 70%,transparent);
  --t65:color-mix(in srgb,var(--color-tinta) 65%,transparent);--t60:color-mix(in srgb,var(--color-tinta) 60%,transparent);
  --t45:color-mix(in srgb,var(--color-tinta) 45%,transparent);--t25:color-mix(in srgb,var(--color-tinta) 25%,transparent);
  --t15:color-mix(in srgb,var(--color-tinta) 15%,transparent);--t07:color-mix(in srgb,var(--color-tinta) 7%,transparent);
  --t04:color-mix(in srgb,var(--color-tinta) 4%,transparent);
  --hilo-halo:0 0 0 1.5px color-mix(in srgb,var(--color-tinta) 24%,transparent),0 0 0 6px color-mix(in srgb,var(--color-tinta) 5%,transparent);
  --hilo-halo-inicio:0 0 0 1.5px color-mix(in srgb,var(--color-tinta) 24%,transparent),0 0 0 0 color-mix(in srgb,var(--color-tinta) 12%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--color-tinta);background:var(--color-crema);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.disp{font-family:'EB Garamond',Georgia,serif;font-weight:600;letter-spacing:-.005em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.taupe{color:var(--color-taupe)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--color-rojo);outline-offset:2px}
.caja:focus-visible{outline-offset:1px}
@keyframes cayla-revelar{from{opacity:0;transform:translate3d(0,-3px,0)}to{opacity:1;transform:none}}
.revela{animation:cayla-revelar 240ms var(--ease-cayla) both}
/* Modal hoja (ADR-0136; globals.css «REGLA DE MODALES»): velo con desenfoque → hoja que sube 18 px y crece → contenido en cascada → salida corta */
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes velo-sale{from{opacity:1}to{opacity:0}}
@keyframes hoja-movil{from{opacity:0;transform:translate3d(0,24px,0)}to{opacity:1;transform:none}}
@keyframes hoja-entra{from{opacity:0;transform:translate3d(0,18px,0) scale(.965)}to{opacity:1;transform:none}}
@keyframes hoja-sale-movil{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,24px,0)}}
@keyframes hoja-sale{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,10px,0) scale(.98)}}
@keyframes cascada{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes hilo-pulso{from{transform:scale(1);opacity:.6}to{transform:scale(2.2);opacity:0}}
@keyframes hilo-trazo{from{stroke-dashoffset:14}}
@keyframes hilo-luz-llega{from{box-shadow:var(--hilo-halo-inicio)}}
@keyframes hilo-llamado{0%,100%{background-color:transparent}30%{background-color:var(--color-hueso)}}
@keyframes hilo-llamado-ahora{0%,100%{background-color:color-mix(in srgb,var(--color-hueso) 55%,transparent)}30%{background-color:var(--color-hueso)}}
@keyframes hilo-aro{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
/* Con ,quieto (para las capturas) o con movimiento reducido no se anima nada. */
.quieto *,.quieto *::before,.quieto *::after{animation:none!important;transition:none!important}
.quieto .hilo-marca[data-estado="ahora"]::after,.quieto .hilo-seguir::after{opacity:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hilo-marca[data-estado="ahora"]::after,.hilo-seguir::after{opacity:0}
}

/* ====================================================================
   MARCO DE LA PÁGINA (el real): lateral de 17 rem + main con px-10 + rejilla [paso | ficha de 340 px]
   Con menos de 1024 px (o con ,celular) no hay lateral ni ficha lateral: va la barra de la ficha pegada abajo.
   ==================================================================== */
.lateral{display:none}
body:not(.movil):not(.solo) .lateral{display:block;position:fixed;left:0;top:0;bottom:0;width:17rem;background:var(--color-papel);border-right:1px solid var(--color-sand);padding:20px 18px;font-size:12px;color:var(--color-taupe);z-index:1}
.lateral b{display:block;color:var(--color-tinta);font-size:13px;margin-bottom:10px}
.lateral i{display:block;height:9px;border-radius:5px;background:var(--t07);margin:12px 0}
.lateral i:nth-of-type(2n){width:70%}
.principal{position:relative;z-index:2;padding:0 16px}
@media (min-width:640px){.principal{padding:0 40px}}
body.celular .principal{padding:0}
body.solo .principal{padding:0}
body:not(.movil):not(.solo) .principal{margin-left:17rem}
.spike{margin:14px auto 0;padding:0}
body.solo .spike{max-width:1240px;padding:0 24px}
.barra-spike{border:1px dashed var(--t25);border-radius:12px;padding:10px 14px;display:grid;gap:8px;color:var(--t60);font-size:12px}
.barra-spike .fila-b{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.barra-spike .leyenda{color:var(--color-tinta);font-weight:600}
.barra-spike .leyenda .real{font-weight:700}
.barra-spike .nota-fija{margin-left:auto;color:var(--color-taupe)}
.barra-spike summary{cursor:pointer;font-weight:600;color:var(--color-tinta);list-style:none}
.barra-spike summary::-webkit-details-marker{display:none}
.barra-spike summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform 200ms var(--ease-cayla)}
.barra-spike details[open] summary::before{transform:rotate(90deg)}
.barra-spike .estados{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.barra-spike button{border:1px solid var(--t25);border-radius:8px;padding:4px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t75)}
.barra-spike button[aria-pressed=true]{background:var(--color-tinta);color:var(--color-crema);border-color:var(--color-tinta)}
.barra-spike .sep{width:1px;height:18px;background:var(--t25)}
.estado-nota{margin-top:8px;font-size:12.5px;color:var(--color-taupe);padding:0 4px}
.estado-nota b{color:var(--color-tinta);font-weight:600}
/* Marca de lo real y de lo inventado: anotación de la maqueta, NO de la pantalla */
.dato{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--color-taupe);border:1px dashed var(--t25);border-radius:999px;padding:0 8px;line-height:18px;white-space:nowrap;background:var(--color-papel)}
.dato.real{color:var(--color-tinta);border-style:solid;border-color:var(--t25)}
.dato::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.dato.real::before{background:var(--color-tinta)}
.dato.ej::before{border:1.5px solid var(--color-taupe)}

.marco{margin:0 auto;padding:22px 0 90px}
body.solo .marco{max-width:1240px;padding-left:24px;padding-right:24px}
body.celular .marco{max-width:375px;padding:16px 16px 0;border:1px solid var(--color-sand);border-radius:28px;margin-top:18px}
body.celular .spike{max-width:375px}
.app{display:grid;gap:24px}
/* «La cabecera de Ventas, como Productos» (ADR-0254): EncabezadoPagina */
.enc .linea-sede{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--color-taupe)}
.enc .hilo{display:block;width:32px;height:1px;background:var(--color-taupe);flex:none}
.enc h1{font-size:36px;line-height:1;letter-spacing:-.025em;margin-top:12px;font-weight:600}
.enc .sub{margin-top:10px;max-width:28rem;font-size:15px;color:var(--t70)}
.enc .pie-enc{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px 12px}
@media (min-width:640px){.enc h1{font-size:46px}}
.cuerpo-grid{display:grid;gap:24px}
body:not(.movil):not(.solo) .cuerpo-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.pasos{display:grid;gap:10px;min-width:0}

/* ---------- pasos (PasoAlta) ---------- */
.paso{container:paso/inline-size;background:var(--color-papel);border:1px solid var(--color-sand);border-radius:var(--radius-xl)}
.paso.pendiente{background:transparent;border-style:dashed}
.paso-cab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 20px 0}
.paso.hecho .paso-cab{padding:14px 20px}
.paso.pendiente .paso-cab{padding:14px 20px}
.num{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--t25);display:grid;place-items:center;font-size:11px;font-weight:400;color:var(--t60);font-variant-numeric:tabular-nums}
.paso.hecho .num{background:var(--color-verde);border-color:var(--color-verde);color:var(--color-crema)}
.paso.abierto .num{background:var(--color-tinta);border-color:var(--color-tinta);color:var(--color-crema)}
.paso-tit{font-weight:600;font-size:14.5px;white-space:nowrap}
.paso.pendiente .paso-tit{color:var(--t45);font-weight:500}
.paso-tit .tit-cat{display:none;font-weight:400;color:var(--color-taupe)}
.paso-res{flex:1;min-width:0;color:var(--color-taupe);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paso-cab .cambiar{font-size:12.5px;text-decoration:underline;text-underline-offset:2px;flex:none}
.paso-cuerpo{padding:12px 20px 20px 56px;animation:cayla-revelar 240ms var(--ease-cayla)}
.menu-cat{margin:-4px 20px 14px 56px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--color-taupe)}
/* El pie del paso: pegado abajo mientras el paso siga más abajo (solo con la ficha lateral: en celular ya va la barra de la ficha) */
.paso-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px;margin:20px -20px -20px -56px;padding:14px 20px 14px 56px;border-top:1px solid var(--color-sand);background:var(--color-papel);border-radius:0 0 var(--radius-xl) var(--radius-xl);z-index:10}
body:not(.movil) .paso-pie{position:sticky;bottom:0}
.paso-pie .falta{display:grid;gap:6px;min-width:0;margin-right:auto;font-size:12.5px;color:var(--color-taupe)}
.paso-pie .fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.paso-pie .fl .btn-enlace{font-size:12.5px}
.paso-pie .fl.ok{color:var(--color-verde)}

/* ---------- botones y piezas del sistema (globals.css) ---------- */
.btn-cayla{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;border-radius:var(--radius-md);border:1px solid transparent;padding:.5rem 1rem;font-size:13.5px;font-weight:500;line-height:1.25;white-space:nowrap;transition:background-color 150ms,border-color 150ms,color 150ms}
.btn-cayla:disabled{cursor:not-allowed;opacity:.5}
.btn-chico{min-height:2.75rem;padding:.3125rem .75rem;font-size:12.5px}
.btn-primario{background:var(--color-tinta);color:var(--color-crema)}
.btn-primario:hover:not(:disabled){background:var(--color-rojo-profundo)}
.btn-secundario{background:transparent;color:var(--color-tinta);border-color:var(--color-sand)}
.btn-secundario:hover:not(:disabled){border-color:color-mix(in oklab,var(--color-taupe) 40%,transparent);background:color-mix(in oklab,var(--color-sand) 50%,transparent)}
.btn-sutil{background:transparent;color:var(--color-taupe);border-color:var(--color-sand)}
.btn-enlace{background:none;border:none;padding:0;color:var(--color-tinta);text-decoration:underline;text-underline-offset:2px;font-size:13px;font-weight:500}
.btn-enlace:hover{color:var(--color-taupe)}
/* En una pantalla táctil (o angosta) todo lo que se toca llega a 44 px, también los enlaces */
body.movil .btn-enlace.tocable,body.movil .cerrar-cand,body.movil .chip-op,body.movil .acc .btn-cayla{min-height:44px}
body.movil .btn-enlace.tocable{padding:10px 4px;display:inline-flex;align-items:center}
@media (pointer:coarse){.btn-enlace.tocable,.cerrar-cand,.chip-op{min-height:44px}.btn-enlace.tocable{padding:10px 4px;display:inline-flex;align-items:center}}
.caja{width:100%;background:var(--color-hueso);border:1px solid var(--color-sand);border-radius:var(--radius-md);padding:10px 12px;font-size:15px;transition:border-color 150ms;outline:none}
.caja:focus{border-color:color-mix(in oklab,var(--color-taupe) 55%,transparent)}
.caja:focus-visible{outline:2px solid var(--color-rojo);outline-offset:1px}
.caja::placeholder{color:var(--t65);opacity:1}
.caja.grande{font-size:16px;height:48px;padding:0 14px}
.nota-cayla{background:color-mix(in oklab,var(--color-hueso) 85%,transparent);border-radius:var(--radius-xl);padding:.875rem 1.125rem;font-size:13px;line-height:1.6;color:var(--color-taupe)}
/* Chip: insignia con punto (components/ui/Chip.tsx); 13 px como text-xs */
.chip-c{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;font-size:13px;line-height:20px;border-radius:999px;white-space:nowrap;max-width:100%}
.chip-c::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip-c.sin-punto::before{display:none}
.chip-c.neutro{background:var(--color-sand);color:var(--color-taupe)}
.chip-c.pizarra{background:color-mix(in srgb,var(--color-pizarra) 15%,transparent);color:var(--color-pizarra)}
.chip-c.verde{background:color-mix(in srgb,var(--color-verde) 15%,transparent);color:var(--color-verde)}
.chip-c.ambar{background:color-mix(in srgb,var(--color-ambar) 15%,transparent);color:var(--color-ambar)}
.chip-c.rojo{background:color-mix(in srgb,var(--color-rojo) 10%,transparent);color:var(--color-rojo-profundo)}
.chip-c.tinta{background:transparent;font-weight:600;color:var(--color-tinta);box-shadow:inset 0 0 0 1.5px var(--color-tinta)}
.chip-c span{overflow:hidden;text-overflow:ellipsis}
/* AvisoInline (piezas.tsx): SOLO tres tonos; sin ícono */
.aviso{border-radius:var(--radius-md);border:1px solid;padding:10px 12px;font-size:15px;line-height:1.55}
.aviso.rojo{border-color:color-mix(in srgb,var(--color-rojo) 40%,transparent);background:color-mix(in srgb,var(--color-rojo) 5%,transparent);color:var(--color-rojo-profundo)}
.aviso.ambar{border-color:color-mix(in srgb,var(--color-ambar) 40%,transparent);background:color-mix(in srgb,var(--color-ambar) 6%,transparent);color:var(--color-ambar-profundo)}
.aviso.neutro{border-color:var(--t15);background:var(--t04);color:var(--t75)}
.aviso .btn-enlace{color:inherit;font-size:inherit;font-weight:500}
.aviso .sub{display:block;margin-top:2px;font-size:13px}
.aviso.con-boton{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.aviso.con-boton>span{flex:1;min-width:200px}
/* Muestras (MuestraTejido / MuestraPatron / MuestraColor): dibujos y colores de DATO, no colores del sistema */
.muestra{display:block;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--t15);width:100%}
.muestra svg{display:block;width:100%;height:100%}
.muestra.sin{display:flex;align-items:center;justify-content:center;border-style:dashed;border-color:var(--t25);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t45)}
.capsula{display:inline-block;flex:none;width:18px;height:14px;border-radius:999px;border:1px solid var(--t25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.cap-color{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 5px}
.cap-color .nom{font-size:13px;color:var(--t75);margin-left:3px}

/* ---------- LA GUÍA DE FOCO (alta-guia.css, ADR-0284) ---------- */
.hilo-marca{position:relative;display:inline-grid;place-items:center;flex:none;width:18px;height:18px;border-radius:999px;transition:background-color 240ms var(--ease-cayla),border-color 240ms var(--ease-cayla)}
.hilo-marca[data-estado="hecho"]{background:var(--color-verde);color:var(--color-crema)}
.hilo-marca[data-estado="ahora"]{background:var(--color-tinta)}
.hilo-marca[data-estado="ahora"]::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--color-crema)}
.hilo-marca[data-estado="ahora"]::after{content:"";position:absolute;inset:0;border-radius:999px;border:1.5px solid var(--color-tinta);pointer-events:none;opacity:0}
.nuevo .hilo-marca[data-estado="ahora"]::after{animation:hilo-pulso 900ms var(--ease-cayla) 120ms 1 both}
.hilo-marca[data-estado="falta"]{border:1.5px solid color-mix(in srgb,var(--color-tinta) 30%,transparent)}
.hilo-marca[data-estado="opcional"]{border:1.5px dashed color-mix(in srgb,var(--color-tinta) 26%,transparent)}
.hilo-tilde{stroke-dasharray:14}
.nuevo .hilo-tilde{animation:hilo-trazo 320ms var(--ease-cayla) 60ms backwards}
.hilo-fila{margin-inline:-.75rem;padding-inline:.75rem;border-radius:.75rem;transition:background-color 260ms var(--ease-cayla)}
.hilo-fila>.hilo-fila-in{border-top:1px solid var(--color-sand);padding-block:.875rem}
.hilo-fila:first-child>.hilo-fila-in{border-top-width:0;padding-top:.5rem}
.hilo-fila[data-estado="ahora"]{background:color-mix(in srgb,var(--color-hueso) 55%,transparent);box-shadow:var(--hilo-halo)}
.hilo-fila.nuevo[data-estado="ahora"]{animation:hilo-luz-llega 700ms var(--ease-cayla) 1 both}
.hilo-fila[data-estado="ahora"]>.hilo-fila-in{border-top-color:transparent}
.hilo-fila[data-estado="ahora"]+.hilo-fila>.hilo-fila-in{border-top-color:transparent}
.hilo-fila[data-llamado]{animation:hilo-llamado 1100ms var(--ease-cayla) 1}
.hilo-fila[data-llamado][data-estado="ahora"]{animation-name:hilo-llamado-ahora}
.hilo-etiqueta{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;line-height:1.5;text-transform:uppercase;color:var(--color-tinta);background:color-mix(in srgb,var(--color-tinta) 8%,transparent)}
.nuevo .hilo-etiqueta{animation:cayla-revelar 240ms var(--ease-cayla) both}
/* el control que sigue: más claro que sus vecinos y con el borde firme */
.hilo-fila[data-estado="ahora"] :is(.caja,.combo .caja){background-color:var(--color-papel);border-color:color-mix(in srgb,var(--color-tinta) 38%,transparent)}
.hilo-chip{display:inline-flex;align-items:center;gap:.375rem;border-radius:999px;border:1px solid var(--color-sand);background:var(--color-papel);padding:.25rem .625rem .25rem .4rem;font-size:12.5px;font-weight:500;color:var(--color-tinta);transition:border-color 200ms var(--ease-cayla),background-color 200ms var(--ease-cayla)}
.hilo-chip:hover{border-color:color-mix(in srgb,var(--color-tinta) 40%,transparent);background:color-mix(in srgb,var(--color-hueso) 60%,transparent)}
.hilo-chip .hilo-marca{width:14px;height:14px}
.hilo-chip .hilo-marca[data-estado="ahora"]::before{width:4px;height:4px}
.hilo-seguir{position:relative}
.hilo-seguir::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:1.5px solid var(--color-tinta);opacity:0;pointer-events:none;animation:hilo-aro 1000ms var(--ease-cayla) 200ms 1 both}

/* título de un campo (FilaAlta): el título ARRIBA y su ayuda al lado, en la misma línea (ayudas cortas, ≤ 60 caracteres) */
.tit{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-bottom:8px}
.tit .hilo-marca{align-self:center}
.tit .tt{font-size:13px;font-weight:600}
.tit .ay{font-size:12px;line-height:1.4;color:var(--color-taupe)}
.tit .lado{margin-left:auto}
.pie-campo{font-size:12px;color:var(--color-taupe);margin-top:6px;min-height:18px;line-height:1.5}
.pie-campo b{color:var(--color-tinta)}
.ayuda{font-size:12px;color:var(--color-taupe);margin-top:8px}
.rotulo-campo{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t70)}
.campos2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.campos2>div{min-width:0}
.campos2 .fila-rot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;min-height:20px}
.campos2 .fila-rot .btn-enlace{font-size:12px;display:inline!important;min-height:0!important;padding:12px 6px!important;margin:-12px -6px}
@container paso (max-width:560px){.campos2{grid-template-columns:1fr}}

/* combo de marca / proveedor (ComboBuscable caja): lista flotante y opción activa del sistema */
.combo{position:relative}
.elegido{display:flex;align-items:center;gap:10px;background:var(--color-hueso);border:1px solid var(--color-sand);border-radius:var(--radius-md);padding:10px 12px;font-size:15px}
.elegido b{font-weight:600}
.elegido small{color:var(--color-taupe);font-size:12.5px;margin-left:auto}
.lista{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:300px;overflow:auto;padding:4px;border-radius:10px;background:var(--color-papel);border:1px solid color-mix(in srgb,var(--color-tinta) 22%,transparent);box-shadow:0 20px 46px -16px rgb(26 26 24 / .32),0 3px 8px -3px rgb(26 26 24 / .16);animation:cayla-revelar 240ms var(--ease-cayla) both}
.lista .enc-l{font-size:12px;color:var(--color-taupe);padding:6px 10px 4px}
.opcion{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:7px;font-size:14px;min-height:44px}
.opcion:hover{background:color-mix(in srgb,var(--color-rojo) 10%,var(--color-papel))}
.opcion small{margin-left:auto;color:var(--color-taupe);font-size:12px;white-space:nowrap}
/* Resaltado (components/ui/Resaltado.tsx) */
mark{background:color-mix(in srgb,var(--color-rojo) 15%,transparent);color:inherit;padding:0 1px;border-radius:3px;animation:cayla-revelar 240ms var(--ease-cayla) both}

/* Nombre: avisos bajo el campo */
.stack{display:grid;gap:8px}

/* tejido y patrón: la grilla y la tarjeta de GrillaMuestras */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
@container paso (max-width:560px){.grilla{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tx{display:flex;flex-direction:column;gap:4px;min-width:0;border:1px solid var(--t15);border-radius:var(--radius-md);padding:6px;text-align:left;font-size:12.5px;color:var(--t75);transition:border-color 150ms,background 150ms}
.tx:hover{border-color:var(--t45)}
.tx .muestra{height:40px}
.tx>span.nom{padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx[aria-pressed=true]{border-color:var(--color-tinta);background:var(--t07);color:var(--color-tinta)}
.tx[aria-pressed=true]>span.nom::before{content:"✓ ";font-size:11px}
.tx.ver{border:1px dashed var(--t25);align-items:center;justify-content:center;text-align:center;color:var(--color-taupe);min-height:70px;gap:2px}
.tx.ver:hover{border-color:var(--t45);background:var(--t04)}
.tx.ver b{font-size:13px;color:var(--color-tinta);font-weight:600}
.tx.ver span{font-size:12px;font-variant-numeric:tabular-nums}
.plegable{margin-top:4px;border-top:1px solid var(--color-sand);padding-top:12px}
.plegable>button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;font-size:13px;font-weight:600}
.plegable>button .flecha{transition:transform 200ms var(--ease-cayla);display:inline-block}
.plegable.abierto>button .flecha{transform:rotate(90deg)}
.plegable>button small{font-weight:400;color:var(--color-taupe);font-size:13px}
.plegable .dentro{margin-top:10px;display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-op{min-height:36px;display:inline-flex;align-items:center;border:1px solid var(--t15);border-radius:8px;padding:5px 12px;font-size:13.5px;color:var(--t75)}
.chip-op[aria-pressed=true]{border-color:var(--color-tinta);background:var(--t07);color:var(--color-tinta)}

/* ====================================================================
   LA ALERTA «Prendas parecidas» (Felipe, 2026-09-30): vive en el RESUMEN de la derecha, entre la ficha y «Avance»; con menos de 1024 px es una
   tira pegada SOBRE la barra de abajo. Reemplaza al bloque grande «¿Ya la tenemos?» que iba dentro del paso: no estorba y el formulario queda corto.
   Cuatro tonos, los del sistema: pizarra (informa), ámbar (se parece), rojo (frena) y neutro. Entra con UN solo pulso, sin bucles.
   ==================================================================== */
.alerta{--tono:var(--color-pizarra);position:relative;display:grid;gap:8px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--tono) 40%,transparent);border-radius:var(--radius-xl);background:color-mix(in srgb,var(--tono) 6%,var(--color-papel));font-size:13px;line-height:1.45;color:var(--color-tinta)}
.alerta[data-nivel="ambar"]{--tono:var(--color-ambar)}
.alerta[data-nivel="rojo"]{--tono:var(--color-rojo)}
.alerta[data-nivel="neutro"]{--tono:var(--color-tinta);border-color:var(--color-sand);background:color-mix(in oklab,var(--color-hueso) 85%,transparent)}
.alerta.entra{animation:cayla-revelar 240ms var(--ease-cayla) both}
/* el pulso: un aro que se abre y se apaga, una sola vez (el mismo `hilo-aro` de «Seguir»); en reposo no se ve */
.alerta.entra::after{content:"";position:absolute;inset:-3px;border-radius:calc(var(--radius-xl) + 3px);border:1.5px solid var(--tono);pointer-events:none;opacity:0;animation:hilo-aro 900ms var(--ease-cayla) 1 both}
.al-cab{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.alerta .chip-c{white-space:normal;align-items:flex-start;line-height:1.35;padding:3px 10px}
.alerta .chip-c::before{margin-top:6px}
.al-txt{font-size:13px;line-height:1.5;color:var(--t75)}
.al-txt .mono{color:var(--color-tinta);font-weight:600}
.al-gris{font-size:12.5px;line-height:1.5;color:var(--color-taupe)}
.al-filas{display:grid;gap:2px;list-style:none}
.al-fila{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:4px 6px;margin-inline:-6px;width:calc(100% + 12px);border-radius:10px;min-height:44px;transition:background-color 150ms}
.al-fila:hover{background:color-mix(in srgb,var(--color-tinta) 5%,transparent)}
.al-fila.dest{background:var(--color-hueso)}
.al-fila b{display:block;font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-fila small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12.5px;color:var(--color-taupe);font-variant-numeric:tabular-nums;line-height:1.35}
.al-fila small .chip-c{font-size:12px;line-height:18px;padding:0 8px}
.al-fila small .chip-c::before{margin-top:0}
.al-pie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.al-pie .btn-enlace.tocable{font-size:12.5px}
.al-esq{display:grid;gap:8px}
.al-esq i{display:block;border-radius:8px;background:var(--t07);height:40px}
.al-esq i.corto{height:16px;width:60%}
.resumen-mini{display:grid;gap:8px}
.resumen-mini{max-width:340px}
.resumen-mini .marca-maq{justify-self:start}
/* la miniatura de 40 px del resumen y el marcador «sin foto»: el isotipo de CAYLA al 30 %, como `SinFoto` (components/ui/PrendaCelda.tsx) */
.sinfoto{position:relative;display:flex;align-items:center;justify-content:center;flex:none;border-radius:6px;border:1px solid color-mix(in srgb,var(--color-tinta) 10%,transparent);background:color-mix(in srgb,var(--color-sand) 50%,transparent);padding:6px;overflow:hidden}
.sinfoto img{display:block;width:100%;height:100%;object-fit:contain;opacity:.3}
.sinfoto figcaption{position:absolute;left:4px;right:4px;bottom:7px;text-align:center;font-size:11px;font-weight:600;line-height:1.2;color:var(--color-taupe)}
.m40{width:40px;height:40px}
.foto-d{position:relative;display:grid;place-items:center;flex:none;border-radius:6px;border:1px solid var(--color-sand);background:linear-gradient(160deg,var(--color-hueso),var(--color-sand));overflow:hidden}
.foto-d svg{width:58%;fill:none;stroke:var(--color-taupe);stroke-width:1.6;stroke-linejoin:round;opacity:.55}
.foto-d figcaption{position:absolute;left:6px;right:6px;bottom:6px;text-align:center;font-size:10.5px;font-weight:600;line-height:1.25;background:color-mix(in srgb,var(--color-papel) 92%,transparent);border-radius:8px;padding:1px 4px}
.m40.foto-d svg{stroke-width:2.6}
.punto-d{position:absolute;right:2px;top:2px;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--color-papel);border:1.5px solid var(--color-taupe)}
.punto-d.real{background:var(--color-tinta);border-color:var(--color-papel)}
.subr{text-decoration:underline;text-underline-offset:4px}
/* la tira de celular y tablet, sobre la barra pegada */
.tira{--tono:var(--color-pizarra);display:flex;align-items:center;gap:8px;width:calc(100% + 32px);margin:-10px -16px 10px;padding:8px 16px;min-height:44px;text-align:left;font-size:13.5px;line-height:1.35;color:var(--tono);background:color-mix(in srgb,var(--tono) 10%,var(--color-papel));border-bottom:1px solid color-mix(in srgb,var(--tono) 30%,transparent)}
.tira[data-nivel="ambar"]{--tono:var(--color-ambar-profundo)}
.tira[data-nivel="rojo"]{--tono:var(--color-rojo-profundo)}
.tira[data-nivel="neutro"]{--tono:var(--color-taupe)}
.tira{padding-top:0;padding-bottom:0}
.tira button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 0;text-align:left;color:inherit;font:inherit}
.tira .tx-t{min-width:0;flex:1}
.tira .ver{flex:none;margin-left:auto;text-decoration:underline;text-underline-offset:2px;font-weight:600;white-space:nowrap}
.tira.entra{animation:cayla-revelar 240ms var(--ease-cayla) both}
/* aviso bajo el campo Nombre y línea de la pista */
.stack{display:grid;gap:8px}
.salto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* la tarjeta completa del candidato: SOLO vive dentro de la hoja «Ver y comparar» */
.cand{position:relative}
.cand-full{position:relative;display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px 14px;padding:12px;background:var(--color-papel);border:1px solid var(--color-sand);border-radius:14px}
.cand.exacto .cand-full{border-color:var(--color-tinta)}
.cand[data-llamado] .cand-full{animation:hilo-llamado 1100ms var(--ease-cayla) 1}
.cand .dato-c{position:absolute;right:14px;top:-10px;z-index:2}
.foto{width:116px;height:164px;margin:0}
.foto.foto-d svg{width:56%}
.info{min-width:0;display:grid;gap:6px;align-content:start}
.info .l1{display:grid;gap:4px;justify-items:start}
.info .l1 .ev{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.info .l1 .ev:empty{display:none}
.info h4{font-size:17px;font-weight:700;line-height:1.25}
.info .mc{font-size:13px;color:var(--color-taupe);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.cod-pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:700;color:var(--color-tinta);background:var(--color-hueso);border-radius:5px;padding:0 6px;white-space:nowrap}
.info .desc{font-size:13px;color:var(--t75);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .tags{display:flex;flex-wrap:wrap;gap:5px}
.info .fila-i{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--t75)}
.info .fila-i .k{color:var(--color-taupe);min-width:0}
.info .fila-i .k.sepa::before{content:"·";margin-right:10px;color:var(--t45)}
.stock-c{font-variant-numeric:tabular-nums;display:inline-flex;flex-wrap:wrap;gap:0 6px}
.stock-c .cero{color:var(--color-taupe)}
.stock-c b{font-weight:700;color:var(--color-tinta)}
.stock-c .sep{color:var(--t45)}
.cargada{font-size:13px;color:var(--color-taupe)}
.acc{grid-column:1/-1;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
.acc .btn-cayla{white-space:normal}
.acc .linea{flex-basis:100%;order:5;font-size:12.5px;line-height:1.4;color:var(--t70)}
.cand-desc{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:11px 16px;border:1px dashed var(--color-sand);border-radius:12px;font-size:13px;color:var(--color-taupe)}
.cand-desc b{color:var(--color-tinta);font-weight:600}
.cand-desc .ok{color:var(--color-verde);font-weight:700}

/* ---------- la hoja «Ver y comparar» (el <Modal variante="hoja"> del ERP): papel, sin sombra ni ✕, ancho 680 px ---------- */
.velo{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--color-tinta) 35%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:velo 220ms var(--ease-cayla) both;display:flex;align-items:flex-end;justify-content:center}
.hoja{container:hoja/inline-size;position:relative;display:flex;flex-direction:column;width:100%;max-width:680px;max-height:90vh;overflow:hidden;padding:24px;background:var(--color-papel);border:1px solid var(--color-sand);border-radius:var(--radius-2xl) var(--radius-2xl) 0 0;outline:none;animation:hoja-movil 380ms var(--ease-cayla) backwards}
.hoja>*{animation:cascada 500ms var(--ease-cayla) backwards;animation-delay:calc(var(--k,0) * 55ms + 120ms)}
.hoja>:nth-child(1){--k:0}.hoja>:nth-child(2){--k:1}.hoja>:nth-child(3){--k:2}.hoja>:nth-child(4){--k:3}.hoja>:nth-child(5){--k:4}
.hoja.quieta,.hoja.quieta>*{animation:none}
.velo.saliendo{animation:velo-sale 220ms var(--ease-salida) both}
.velo.saliendo .hoja{animation:hoja-sale-movil 220ms var(--ease-salida) both}
.velo.saliendo .hoja>*{animation:none}
@media (min-width:640px){
  .velo{align-items:flex-start;padding:8vh 24px 24px}
  .hoja{max-height:calc(100dvh - 8vh - 1.5rem);border-radius:var(--radius-2xl);animation-name:hoja-entra;animation-duration:420ms}
  .velo.saliendo .hoja{animation-name:hoja-sale}
}
/* Con menos de 1024 px no hay panel a la derecha: la hoja abre a pantalla completa (la tira de abajo la llama) */
@media (max-width:1023px){
  .velo{padding:0;align-items:stretch}
  .hoja{max-width:none;height:100dvh;max-height:100dvh;border:0;border-radius:0}
}
.hoja .hoja-cuerpo{display:flex;flex-direction:column;flex:1;min-height:0}
.hoja .hoja-lista{flex:1;max-height:none;min-height:0}
.hoja h2{font-size:24px;line-height:1.15}
.hoja .baj{margin:4px 0 16px;font-size:13.5px;line-height:1.5;color:var(--color-taupe)}
.hoja .busca{max-width:448px}
.hoja-cuenta{margin-top:8px;font-size:12.5px;color:var(--color-taupe)}
.hoja-av{display:grid;gap:8px;margin-top:10px}
.hoja-lista{margin:10px -4px 0;padding:12px 4px 4px;overflow-y:auto;display:grid;gap:16px;align-content:start}
.hoja-pie{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;border-top:1px solid var(--color-sand);margin-top:12px;padding-top:12px}
.hoja-pie p{font-size:13px;color:var(--color-taupe);max-width:340px}
.hoja .coincide{display:block;margin-top:2px;font-size:12.5px;color:var(--color-taupe)}
.nada{font-size:13px;color:var(--color-taupe);padding:18px 4px}
@container hoja (max-width:470px){
  .cand-full{grid-template-columns:88px minmax(0,1fr)}
  .foto{width:88px;height:128px}
  .cand .dato-c{right:10px}
  .hoja .busca .caja{font-size:13.5px;padding-inline:10px}
  .acc .btn-cayla{flex:1 1 100%;min-height:2.75rem}
  .info .l1 .chip-c{white-space:normal;align-items:flex-start;line-height:1.3;padding:3px 10px}
  .info .l1 .chip-c::before{margin-top:6px}
  .hoja-pie{flex-direction:column;align-items:stretch}
  .hoja-pie .btn-cayla{width:100%;min-height:2.75rem}
}
@media (max-width:660px){
  .hoja .baj.largo{display:none}
  .hoja h2{font-size:22px}
}
/* con menos de 470 px de paso (celular; una pantalla de 1024 con el lateral abierto): el paso se aprieta */
@container paso (max-width:470px){
  .paso-cuerpo{padding-left:16px;padding-right:16px}
  .paso-pie{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;flex-direction:column;align-items:stretch;gap:10px}
  .paso-pie .falta{margin-right:0}
  .paso-pie .btn-cayla{min-height:2.75rem}
  .aviso.con-boton .btn-cayla,.pista-btn{width:100%;min-height:2.75rem}
  .menu-cat{margin-left:16px;margin-right:16px}
  .paso-cab{padding-left:16px;padding-right:16px}
  .paso-res{display:none}
  .paso-tit{white-space:normal}
  .paso-tit .tit-cat{display:inline}
  .hilo-fila{margin-inline:-.5rem;padding-inline:.5rem}
  /* El título del Nombre no cambia de alto cuando le llega «Sigue aquí»: la ayuda va siempre en su línea */
  .hilo-fila[data-fila="nombre"] .tit .ay{flex-basis:100%}
}



/* ---------- la ficha de la derecha (FichaPrevia): SIN cambios, solo se dibuja para que el paso mida lo real ---------- */
.ficha{display:none}
body:not(.movil):not(.solo) .ficha{display:grid;gap:12px;position:sticky;top:24px}
.ficha .marca-maq{justify-self:start}
.f-tarjeta{overflow:hidden;border:1px solid var(--color-sand);border-radius:var(--radius-xl);background:var(--color-papel)}
.f-foto{height:128px;background:var(--color-hueso);display:grid;place-items:center;text-align:center;padding:0 24px;font-size:13px;color:var(--color-taupe)}
.f-cuerpo{padding:14px 16px 16px}
.f-cuerpo .cod{font-size:12.5px;color:var(--color-taupe)}
.f-cuerpo .nom{font-size:24px;line-height:1.15;margin-top:2px}
.f-cuerpo .cat{font-size:13px;color:var(--color-taupe)}
.f-cuerpo .vacio{color:var(--t25)}
.f-dl{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border:1px solid var(--color-sand);border-radius:var(--radius-lg);overflow:hidden}
.f-dl div{padding:8px 10px}.f-dl div+div{border-left:1px solid var(--color-sand)}
.f-dl dt{font-size:11px;color:var(--color-taupe)}.f-dl dd{font-size:17px;font-weight:500}
.f-avance{border:1px solid var(--color-sand);border-radius:var(--radius-xl);background:var(--color-papel);padding:6px}
.f-avance div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:var(--radius-lg)}
.f-avance div.act{background:var(--color-hueso)}
.f-avance .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--t25);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--t60)}
.f-avance .act .n{background:var(--color-tinta);border-color:var(--color-tinta);color:var(--color-crema)}
.f-avance .ok .n{background:var(--color-verde);border-color:var(--color-verde);color:var(--color-crema)}
.f-avance b{display:block;font-size:13px;font-weight:600}
.f-avance .pend b{color:var(--t45);font-weight:500}
.f-avance span.tx2{display:block;font-size:12px;color:var(--color-taupe);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-botones{display:flex;gap:8px}.f-botones .btn-primario{flex:1}
.f-sig{text-align:center;font-size:12.5px;color:var(--color-taupe)}
.barra-ficha{display:none}
body.movil .barra-ficha{display:block;position:sticky;bottom:0;z-index:20;margin:0 -16px;border-top:1px solid var(--color-sand);background:var(--color-papel);padding:10px 16px 12px}
body.movil .barra-ficha .fila-bf{display:flex;align-items:center;gap:10px}
.barra-ficha .txt{min-width:0;flex:1;font-size:12.5px}
.barra-ficha .txt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-ficha .txt span{color:var(--color-taupe)}
.barra-ficha .sig{margin-top:4px;font-size:12px;color:var(--color-taupe)}
.barra-ficha .sig button{text-decoration:underline;text-decoration-color:var(--t25);text-underline-offset:4px;text-align:left;color:inherit}

/* Toast: solo de la maqueta (en la app el aviso es avisar.*, arriba a la derecha y después del loader) */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;max-width:min(600px,92vw);background:var(--color-tinta);color:var(--color-crema);padding:11px 14px 11px 16px;border-radius:12px;font-size:13px;display:flex;gap:14px;align-items:center;animation:cayla-revelar 260ms var(--ease-cayla) both}
.toast button{color:var(--color-crema);text-decoration:underline;text-underline-offset:2px;font-size:12.5px;flex:none;padding:8px 4px}

/* ---------- Hoy vs. propuesta ---------- */
.hoy-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.hoy-grid .col{min-width:0}
.hoy-grid .col>.rotulo{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.hoy-grid .col>.rotulo .chip-c{text-transform:none;letter-spacing:0;font-weight:500}
.hoy-nota{margin-top:12px;border:1px dashed var(--t25);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--t75);display:grid;gap:6px}
.hoy-nota b{color:var(--color-tinta);font-weight:600}
.hoy-nota .pesado{color:var(--color-rojo-profundo);font-weight:600}
@media (max-width:900px){.hoy-grid{grid-template-columns:1fr}}
body.celular .hoy-grid{grid-template-columns:1fr}
@media (max-width:600px){
  .spike{padding:0 12px}
  .barra-spike .nota-fija{margin-left:0}
}
</style>

const cacheM = {};
function muestra(tipo, nombre){
  const k = tipo + nombre; if (cacheM[k]) return cacheM[k];
  const fam = tipo === "tejido" ? FAM_TEJIDO[nombre] : nombre.toLowerCase();
  const dib = (tipo === "tejido" ? DT : DP)[fam];
  // Como la app: un nombre que no reconoce se dice claro («Sin muestra»), no se dibuja una tela que no es.
  if (!dib) return cacheM[k] = `<span class="muestra sin" aria-hidden="true">Sin muestra</span>`;
  const d = dib();
  return cacheM[k] = `<span class="muestra" role="img" aria-label="Muestra del ${tipo} ${nombre}" style="background-color:${d.f}"><svg viewBox="0 0 120 40" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${d.s}</svg></span>`;
}

/* =========================================================================

   ========================================================================= */
const sinTilde = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "");
const norm = t => sinTilde(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
/* La clave del «idéntico» es la de la base, `retail.fn_clave_referencia` (20260918230000): minúsculas, sin tildes (áéíóúüñ), sin espacios NI puntuación.
   «Polo G 44» = «Polo G44»; «WideLeg» = «Wide Leg». `norm` (que conserva los espacios) solo sirve para ordenar lo parecido. */
const clave = t => (t ?? "").toLowerCase().replace(/[áéíóúüñ]/g, c => "aeiouun"["áéíóúüñ".indexOf(c)]).replace(/[^a-z0-9]+/g, "");
const normCod = t => sinTilde(t).toUpperCase().replace(/[^A-Z0-9]/g, "");
const toks = t => norm(t).split(" ").filter(Boolean);
const TIPOS = new Set("camisa camisas blusa blusas polo polos polera poleras palazo palazos culotte culottes jean jeans pantalon pantalones falda faldas vestido vestidos top tops short shorts chompa chompas casaca casacas blazer blazers body bodys enterizo conjunto chaleco abrigo bolso cartera".split(" "));
const COLOR_W = new Set("negro negra blanco blanca rojo roja rosado rosada rosa azul celeste beige gris verde amarillo amarilla morado morada marron crema crudo nude camel terracota mostaza vino lila naranja dorado plateado chocolate caqui salvia coral fucsia turquesa".split(" "));
const TEJ_W = new Set("denim algodon lino seda jersey rib pana drill gabardina lana viscosa poliester popelina licra pique seersucker".split(" "));
const TALLA_W = new Set("xs s m l xl xxl talla".split(" "));
const NO_MODELO = new Set([...COLOR_W, ...TEJ_W, ...TALLA_W]);
const modelo = t => toks(t).filter(w => !TIPOS.has(w) && !NO_MODELO.has(w));
const titular = t => t.trim().replace(/\s+/g," ").toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stockTotal = p => SEDES.reduce((a, k) => a + p.stock[k], 0);
const descontinuada = p => p.estado === "descontinuado";

/* El CÓDIGO de la marca no es un campo: se LEE del texto del nombre o de la descripción (donde hoy viven a mano, en 3 de 8 prendas). Es una pista, no un veto. */
const esCodigo = q => { const c = normCod(q); return c.length >= 3 && /\d/.test(c); };
const llevaCodigo = (p, q) => esCodigo(q) && normCod(`${p.nombre} ${p.desc ?? ""}`).includes(normCod(q));
/* La descripción, sin el código leído (para que no salga dos veces en la tarjeta: en la píldora y en el texto). */
const descLimpia = p => {
  if (!p.desc) return "";
  if (p.codEn !== "desc" || !p.codigo) return p.desc;
  return p.desc.replace(p.codigo, "").replace(/(\s*[-|]\s*){2,}/g, " - ").replace(/^[\s\-|]+|[\s\-|]+$/g, "").trim();
};

function hace(alta, ahora){
  const min = Math.round((ahora - alta) / 60000);
  if (min < 1) return "hace un momento";
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24); if (d < 14) return `hace ${d} ${d === 1 ? "día" : "días"}`;
  if (d < 60) return `hace ${Math.floor(d / 7)} semanas`;
  const m = Math.floor(d / 30); return `hace ${m} ${m === 1 ? "mes" : "meses"}`;
}

const marcaEf = () => (s.marca && !COMODINES.has(s.marca)) ? s.marca : null;
/* D5: sin marca (o con un comodín) solo hay lista de la categoría; se ofrece cuando la persona ya empezó a escribir el nombre. */
const sinMarca = () => !marcaEf() && !!s.nombre.trim();
const todos = () => s.conEj ? [...CATALOGO, NUBE] : CATALOGO;
const catalogo = () => todos().filter(p => !s.hasta || p.alta < s.hasta);
/* El idéntico exacto (misma clave que la base). `sinPausa`: para bloquear «Seguir» al instante. El aviso rojo, en cambio, espera una pausa de 0,6 s tras la última tecla:
   sin eso saltaría a mitad de «Wide Leg» rumbo a «Wide Leg Corto». Si la lectura falló o está en curso, no se puede saber: la base lo revisa al guardar. */
function identico(sinPausa){
  if (s.carga !== "ok" || (s.escribiendo && !sinPausa)) return null;
  const nn = clave(s.nombre); return nn ? catalogo().find(p => clave(p.nombre) === nn) ?? null : null;
}
const coincideQ = (q, texto) => { const n = norm(texto); return toks(q).every(x => n.includes(x)); };

/* ¿El nombre escrito habla del mismo modelo que p? A = lo escrito está dentro del nombre de p (o es igual sin el color);
   B = el nombre de p está dentro de lo escrito, o se parecen a medias. Solo cuentan las palabras del modelo. */
function coincideModelo(p){
  const mt = modelo(s.nombre); if (!mt.length) return {tipo:null, comun:[]};
  const pt = modelo(p.nombre), ult = mt.at(-1), esUlt = toks(s.nombre).at(-1) === ult && ult.length >= 3;
  const enP = t => pt.includes(t) || (esUlt && t === ult && pt.some(x => x.startsWith(t)));
  const comun = mt.filter(enP);
  if (!comun.length) return {tipo:null, comun};
  const typedSubset = comun.length === mt.length;
  const candSubset = pt.length > 0 && pt.every(t => mt.includes(t));
  if (typedSubset) return {tipo:"A", comun};
  if (candSubset) return {tipo:"B", comun};
  if (comun.length / Math.max(mt.length, pt.length) >= .5) return {tipo:"B", comun};
  return {tipo:null, comun};
}

/* La evidencia de cada tarjeta: un chip que dice QUÉ se vio, nunca un veredicto. «Mismo…» solo con nombre o código exactos.
   `cq` = el código tecleado en el buscador de la hoja. «Otro código» es solo un chip: no baja la tarjeta ni la apaga (el código es pista, no veto). */
function evaluar(p, cq = ""){
  const nn = clave(s.nombre);
  if (nn && clave(p.nombre) === nn) return {rank:0, tono:"tinta", texto:"Mismo nombre"};
  if (cq && llevaCodigo(p, cq)) return {rank:1, tono:"verde", texto:`Coincide el código: ${cq}`};
  const m = coincideModelo(p);
  if (m.tipo === "A") return {rank:2, tono:"pizarra", texto:"Nombre parecido"};
  if (m.tipo === "B") return {rank:3, tono:"neutro", texto:"Algo parecido"};
  if (cq && p.codigo) return {rank:4, tono:"pizarra", texto:"Otro código"};
  return {rank:4, tono:null, texto:null};
}
/* El tiempo ordena y rotula; nunca filtra. Una descontinuada va al final de su nivel. */
const ordena = (a, b) => a.rank - b.rank || descontinuada(a.p) - descontinuada(b.p) || b.p.alta - a.p.alta || (stockTotal(b.p) > 0) - (stockTotal(a.p) > 0) || a.p.nombre.localeCompare(b.p.nombre);

/* La lista es la de marca + categoría (sin marca: la de la categoría). Lo demás (el mismo nombre en otra categoría de la marca, o algo parecido en otra marca) solo informa. */
function candidatos(cq = ""){
  const cat = catalogo(), mE = marcaEf();
  const bloque = mE ? cat.filter(p => p.marca === mE && p.cat === s.cat) : sinMarca() ? cat.filter(p => p.cat === s.cat) : [];
  const items = [], otras = [], enOtraCat = [], mt = modelo(s.nombre);
  for (const p of cat) {
    if (bloque.includes(p)) { items.push({p, ...evaluar(p, cq)}); continue; }
    if (!mE) continue;
    if (p.marca === mE) { if (coincideModelo(p).tipo === "A") enOtraCat.push(p); continue; }
    const m = coincideModelo(p);
    if (mt.length && m.comun.length >= 2 && m.comun.length / mt.length >= .6) otras.push(p);
  }
  items.sort(ordena);
  return {items, otras, enOtraCat, nBloque:bloque.length};
}
function listaHoja(){
  const q = s.hoja?.q ?? "", cq = esCodigo(q) ? q.trim() : "";
  if (s.hoja?.todaMarca) return {items: catalogo().filter(p => p.marca === marcaEf()).map(p => ({p, ...evaluar(p, cq)})).sort(ordena), otras:[], enOtraCat:[], cq};
  return {...candidatos(cq), cq};
}

/* Pistas dentro del nombre: un color, un tejido o una talla no son parte del modelo. */
function pistaNombre(){
  for (const w of s.nombre.trim().split(/\s+/).filter(Boolean)) {
    const n = norm(w);
    if (COLOR_W.has(n)) return {w, texto:`“${esc(w)}” es un color y se elige en el paso 3. ¿La quito del nombre?`};
    if (TEJ_W.has(n)) return {w, texto:`“${esc(w)}” es un tejido y se elige más abajo, en Tejido. ¿Lo quito del nombre?`};
    if (TALLA_W.has(n) && n !== "talla") return {w, texto:`“${esc(w)}” es una talla y se elige en el paso 3. ¿La quito del nombre?`};
  }
  return null;
}

/* La guía de foco (lib/alta-producto-guia.ts en el ERP). Lo que esta propuesta le pide: «Marca y proveedor» pasa a SUGERIDO (como los colores:
   la guía la señala pero no bloquea; ADR-0283 la dejó «nunca Sigue aquí»). El paso 2 YA NO lleva una fila «¿Ya la tenemos?»: la alerta vive en el resumen.
   Requerido = sin él no se puede seguir. Sugerido = casi siempre se llena, pero no bloquea. */
const PENDIENTE = {marca:"Elige la marca y el proveedor, o déjalo para después.", nombre:"Escribe el nombre del producto.", tejido:"Elige el tejido.", patron:"Elige el patrón (si no tiene diseño, elige Liso)."};
const NOMBRE_CAMPO = {marca:"Marca y proveedor", nombre:"Nombre", desc:"Descripción", tejido:"Tejido", patron:"Patrón"};
function guia(){
  const f = [
    {id:"marca", req:false, sug:true, ok: s.marca !== null},
    {id:"nombre", req:true, sug:false, ok: !!s.nombre.trim() && !identico(true)},
    {id:"desc", req:false, sug:false, ok: !!s.desc.trim()},
    {id:"tejido", req:true, sug:false, ok: !!s.tejido},
    {id:"patron", req:true, sug:false, ok: !!s.patron},
  ];
  const ahora = f.find(x => !x.ok && (x.req || x.sug))?.id;
  f.forEach(x => { x.tit = NOMBRE_CAMPO[x.id]; x.est = x.ok ? "hecho" : x.id === ahora ? "ahora" : (x.req || x.sug) ? "falta" : "opcional"; });
  return f;
}

/* =========================================================================
   LA ALERTA: qué nivel tiene y qué dice (una sola fuente para la tarjeta del resumen y la tira del celular)
   ========================================================================= */
const revisada = p => s.revisadas.includes(p.id);
const codigosDistintos = its => { const c = its.map(it => it.p).filter(p => p.codigo); for (let i = 0; i < c.length; i++) for (let j = i + 1; j < c.length; j++) if (normCod(c[i].codigo) !== normCod(c[j].codigo)) return [c[i].codigo, c[j].codigo]; return null; };
const TXT_CODIGOS = ([a, b]) => `Tienen códigos distintos (<span class="mono">${esc(a)}</span> y <span class="mono">${esc(b)}</span>). Mira la etiqueta de tu prenda: ¿cuál dice?`;
function calcAlerta(){
  const mE = marcaEf(), sm = sinMarca();
  if (mE && s.carga === "cargando") return {nivel:"cargando", key:"cargando"};
  if (mE && s.carga === "sinred") return {nivel:"neutro", key:"sinred", tono:"neutro", chip:"No pude ver lo que ya hay", txt:"Puedes seguir: la base revisa el nombre otra vez al guardar.", enlace:{txt:"Reintentar", accion:"reintentar"}, tira:"No pude ver lo que ya hay", tiraAcc:"reintentar", tiraVer:"Reintentar"};
  const {items, otras, nBloque} = candidatos("");
  const idc = identico(true);
  if (idc) {
    const enBloque = items.some(it => it.p.id === idc.id), otra = !!idc.marca && !!mE && idc.marca !== mE;
    return {nivel:"rojo", key:`rojo|${idc.id}`, tono:"rojo", chip:`Ya existe «${idc.nombre}»${idc.marca && idc.marca !== mE ? ` en ${idc.marca}` : ""}`,
      txt: otra ? "Hoy la base no acepta el mismo nombre en dos marcas: agrégale el modelo o la marca." : "Un nombre identifica a una sola prenda: ábrela o cámbiale el nombre.",
      filas:[{p:idc, dest:true}], avance:"Ese nombre ya existe: no se puede crear igual.",
      boton: enBloque ? {txt:"Ver y comparar", accion:"abrir-hoja", id:idc.id} : {txt:`Ver ${idc.nombre}${otra ? ` de ${idc.marca}` : ""}`, accion:"ver-ficha", id:idc.id},
      tira:`⚠ «${idc.nombre}» ya existe`};
  }
  if (!mE && !sm) return null;
  if (sm) {
    return {nivel:"neutro", key:`sinmarca|${s.cat}`, tono:"neutro", chip:"Sin marca no puedo reducir la lista", filas:[],
      txt: nBloque ? `Hay ${plural(nBloque, "prenda", "prendas")} de ${s.cat}. Si la tuya es una de ellas, ábrela y súmale tallas o colores.` : `No hay prendas de ${s.cat} todavía.`,
      boton: nBloque ? {txt:`Ver las de ${s.cat}`, accion:"abrir-hoja"} : null, tira:"Sin marca no puedo reducir la lista"};
  }
  if (nBloque === 0) {
    const otrasM = catalogo().filter(p => p.marca === mE);
    return {nivel:"neutro", key:`vacia|${mE}|${s.cat}`, linea:`No hay prendas de ${mE} en ${s.cat} todavía.`, filas:[], enlace: otrasM.length ? {txt:`Ver las de ${mE}`, accion:"ver-marca"} : null};
  }
  const rest = items.filter(it => !revisada(it.p));
  if (!rest.length) return {nivel:"neutro", key:`rev|${mE}|${s.cat}`, tono:"neutro", chip:`Revisaste ${plural(nBloque, "parecida", "parecidas")} ✓`, filas:[], enlace:{txt:"Ver de nuevo", accion:"ver-de-nuevo"}};
  const parecidas = rest.filter(it => s.nombre.trim() && (it.rank === 2 || it.rank === 3));
  const filas = rest.slice(0, 3).map(it => ({p:it.p, dest:parecidas[0] === it}));
  const muchas = rest.length > 8, ejemplo = items.some(it => !it.p.real);
  const avance = muchas ? `Hay ${rest.length} prendas de ${mE}: búscala` : `Hay ${rest.length} ${rest.length === 1 ? "parecida: mírala" : "parecidas: míralas"}`;
  if (parecidas.length) {
    const top = parecidas[0].p, cd = codigosDistintos(filas);
    return {nivel:"ambar", key:`ambar|${top.id}`, tono:"ambar", chip:`Se parece a «${top.nombre}»`,
      txt: cd ? TXT_CODIGOS(cd) : "Compara su foto, sus colores y sus tallas con la prenda que tienes en la mano.",
      filas, boton:{txt:"Ver y comparar", accion:"abrir-hoja"}, avance, restantes:rest.length, ejemplo, tira:`⚠ ${plural(parecidas.length, "prenda parecida", "prendas parecidas")}`};
  }
  const parcial = nBloque - rest.length;
  return {nivel:"info", key:`info|${mE}|${s.cat}`, tono:"pizarra", chip:`Ya hay ${plural(nBloque, "prenda", "prendas")} de ${mE} en ${s.cat}`,
    txt:`${nBloque === 1 ? "Si la tuya es esa, ábrela y súmale tallas o colores." : "Si la tuya es una de ellas, ábrela y súmale tallas o colores."}${parcial ? ` Revisaste ${parcial} de ${nBloque}.` : ""}`,
    filas, boton:{txt:"Ver y comparar", accion:"abrir-hoja"}, avance, restantes:rest.length, ejemplo, tira:`Ya hay ${plural(nBloque, "prenda", "prendas")} de ${mE} en ${s.cat}`};
}
/* Mientras se teclea, la alerta se queda como estaba: se actualiza (y se anuncia) con la pausa de 0,6 s, no en cada tecla. */
function alertaVigente(){
  if (s.escribiendo && s.alertaCache) return s.alertaCache.a;
  const a = calcAlerta(); s.alertaCache = {a}; return a;
}

/* =========================================================================
   PINTAR
   ========================================================================= */
const $ = (sel, r = document) => r.querySelector(sel);
const TILDE = `<svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path class="hilo-tilde" pathLength="14" d="M5 9.4l2.7 2.7L13 6.4"/></svg>`;
const CAMISA = `<svg viewBox="0 0 64 80"><path d="M22 6l-14 8 5 12 6-3v40h26V23l6 3 5-12-14-8c-2 5-5 7-10 7s-8-2-10-7z"/></svg>`;
/* Resaltado de lo buscado, sin tildes ni mayúsculas (components/ui/Resaltado.tsx) */
function marcar(texto, q){
  const t = q.trim(); if (!t) return esc(texto);
  const j = sinTilde(texto).toLowerCase().indexOf(sinTilde(t).toLowerCase()); if (j < 0) return esc(texto);
  return esc(texto.slice(0, j)) + "<mark>" + esc(texto.slice(j, j + t.length)) + "</mark>" + esc(texto.slice(j + t.length));
}
const chip = (tono, texto, sinPunto) => `<span class="chip-c ${tono}${sinPunto ? " sin-punto" : ""}"><span>${esc(texto)}</span></span>`;
const datoTxt = p => p.real ? `<span class="dato real nota-maqueta" data-solo-maqueta title="Producción, solo lectura, 2026-09-30">Dato real de hoy</span>` : `<span class="dato ej nota-maqueta" data-solo-maqueta title="Prenda inventada para la maqueta">Ejemplo</span>`;
const puntoD = p => `<span class="punto-d nota-maqueta ${p.real ? "real" : ""}"></span>`;
const TIT_DISP = "Disponibles: lo que se puede vender hoy, sin apartadas, dañadas ni en camino (ADR-0270)";

/* Sin foto: el isotipo de CAYLA al 30 % (`SinFoto`), no la muestra del tejido: cinco jeans mostrarían el mismo denim, como si fueran iguales. */
const miniFoto = p => p.foto
  ? `<span class="foto-d m40">${CAMISA}${puntoD(p)}</span>`
  : `<span class="sinfoto m40" aria-hidden="true"><img src="${ISOTIPO}" alt="">${puntoD(p)}</span>`;
const fotoCard = p => p.foto
  ? `<figure class="foto foto-d">${CAMISA}<figcaption class="nota-maqueta" data-solo-maqueta>Foto de ejemplo dibujada</figcaption></figure>`
  : `<figure class="foto sinfoto"><img src="${ISOTIPO}" alt=""><figcaption>Sin foto todavía</figcaption></figure>`;
const capsulas = p => `<span class="cap-color">${p.colores.slice(0, 4).map(c => `<i class="capsula" style="background:${COLORES[c]}"></i>`).join("")}<span class="nom">${esc(p.colores.slice(0, 4).join(" · "))}${p.colores.length > 4 ? ` +${p.colores.length - 4}` : ""}</span></span>`;
const sedesHtml = p => `<span class="stock-c">${SEDES.map(k => (p.stock[k] ? `<span>${k} <b>${p.stock[k]}</b></span>` : `<span class="cero">${k} 0</span>`)).join('<span class="sep">·</span>')}</span>`;

/* ---- la tarjeta completa del candidato: vive SOLO dentro de la hoja «Ver y comparar» ---- */
function candHtml(it, q, dentro = ""){
  const p = it.p, exacto = it.rank === 0;
  if (revisada(p) && !exacto) return `<div class="cand-desc" data-id="${p.id}"><span class="ok">✓</span><span>Marcaste <b>${esc(p.nombre)}</b> como otro diseño.</span><button class="btn-enlace tocable" data-accion="deshacer" data-id="${p.id}">Deshacer</button></div>`;
  const cod = p.codigo && p.codEn === "desc" ? `<span class="cod-pill" title="Leído de la descripción">${esc(p.codigo)}</span>` : "";
  const chipEv = it.texto ? chip(it.tono, it.texto) : "";
  const chipDes = descontinuada(p) ? chip("neutro", "Descontinuada") : "";
  const tags = [p.tejido, p.patron, p.temporada].filter(Boolean).map(t => chip("neutro", t, true)).join("");
  const dl = descLimpia(p);
  const linea = descontinuada(p)
    ? "Te lleva a su ficha. Para volver a usarla, cambia ahí «Estado» a «Activo» y guarda: no se activa sola. Lo que llenaste aquí no se guarda."
    : "Te lleva a esa prenda: ahí le sumas tallas y colores. Las unidades se registran en Recibir. Lo que llenaste aquí no se guarda.";
  const btnMismo = `<button class="btn-cayla btn-secundario" data-accion="es-el-mismo" data-id="${p.id}" aria-label="Es el mismo diseño que ${esc(p.nombre)}">Es el mismo diseño</button>`;
  const btnOtro = `<button class="btn-enlace tocable" data-accion="es-otro" data-id="${p.id}" aria-label="No, ${esc(p.nombre)} es otro diseño">No, es otro diseño</button>`;
  // Con el mismo nombre, «No, es otro diseño» no destraba nada: para seguir hay que cambiar el nombre de la tuya.
  const acc = exacto ? `${btnMismo}<p class="linea">${linea}</p>` : `${btnMismo}${btnOtro}<p class="linea">${linea}</p>`;
  return `<article class="cand ${exacto ? "exacto" : ""}" data-id="${p.id}"><div class="cand-full">
      ${datoTxt(p).replace('class="dato', 'class="dato dato-c')}
      ${fotoCard(p)}
      <div class="info">
        <div class="l1"><h4>${marcar(p.nombre, q)}</h4><span class="ev">${chipEv}${chipDes}</span></div>
        <p class="mc"><span>${esc(p.marca)} · ${esc(p.cat)}</span>${cod}</p>${dentro}
        ${dl ? `<p class="desc" title="${esc(p.desc)}">${esc(dl)}</p>` : ""}
        <div class="tags">${tags}</div>
        <div class="fila-i">${capsulas(p)}<span class="k sepa">Tallas: ${esc(p.tallas.join(" · "))}</span></div>
        <div class="fila-i"><span class="k" title="${TIT_DISP}">Disponibles:</span>${sedesHtml(p)}</div>
        <p class="cargada" title="La sede es la actual de quien la cargó (propuesto_por). Si no se puede saber, solo se dice cuándo.">${p.sede ? `Cargada en ${SEDE_LARGA[p.sede]} ${hace(p.alta, s.ahora)}` : `Cargada ${hace(p.alta, s.ahora)}`}</p>
      </div>
      <div class="acc">${acc}</div>
    </div></article>`;
}

/* ---- la alerta del resumen ---- */
function alertaHtml(A, entra){
  if (!A) return "";
  if (A.nivel === "cargando") return `<div class="alerta" data-nivel="neutro" role="status" aria-live="polite" aria-label="Buscando"><p class="al-gris">Buscando lo que ya hay de ${esc(marcaEf())} en ${esc(s.cat)}…</p><div class="al-esq"><i class="corto"></i><i></i><i></i></div></div>`;
  const cab = A.chip ? `<div class="al-cab">${chip(A.tono ?? "neutro", A.chip)}${A.ejemplo ? `<span class="dato ej nota-maqueta" data-solo-maqueta title="Incluye prendas inventadas para la maqueta">Ejemplo</span>` : ""}</div>` : "";
  const linea = A.linea ? `<p class="al-txt">${esc(A.linea)}</p>` : "";
  const txt = A.txt ? `<p class="al-txt">${A.txt}</p>` : "";
  const filas = A.filas?.length ? `<ul class="al-filas">${A.filas.map(f => `<li><button class="al-fila ${f.dest ? "dest" : ""}" data-accion="abrir-hoja" data-id="${f.p.id}" aria-label="${esc(f.p.nombre)}: ver y comparar">${miniFoto(f.p)}<span style="min-width:0;display:block"><b>${esc(f.p.nombre)}</b><small title="${TIT_DISP}">Disp. ${stockTotal(f.p)} · ${hace(f.p.alta, s.ahora)}${descontinuada(f.p) ? chip("neutro", "Descontinuada") : ""}</small></span></button></li>`).join("")}</ul>` : "";
  const pie = A.boton || A.enlace ? `<div class="al-pie">${A.boton ? `<button class="btn-cayla btn-secundario btn-chico" data-accion="${A.boton.accion}"${A.boton.id ? ` data-id="${A.boton.id}"` : ""}>${esc(A.boton.txt)}</button>` : ""}${A.enlace ? `<button class="btn-enlace tocable" data-accion="${A.enlace.accion}">${esc(A.enlace.txt)}</button>` : ""}</div>` : "";
  return `<div class="alerta ${entra ? "entra" : ""}" data-nivel="${A.nivel === "info" ? "pizarra" : A.nivel}" role="status" aria-live="polite">${cab}${linea}${txt}${filas}${pie}</div>`;
}
/* En celular y tablet no hay panel a la derecha: la alerta es una tira pegada SOBRE la barra de abajo; tocarla abre la hoja a pantalla completa. */
function tiraHtml(A, entra){
  if (!A || !A.tira) return "";
  return `<div class="tira ${entra ? "entra" : ""}" data-nivel="${A.nivel === "info" ? "pizarra" : A.nivel}" role="status" aria-live="polite"><button data-accion="${A.tiraAcc ?? "abrir-hoja"}"><span class="tx-t">${esc(A.tira)}</span><span class="ver">${A.tiraVer ?? "Ver"}</span></button></div>`;
}

/* ---- los campos del paso 2, en el orden nuevo: Marca → Nombre → Descripción → Tejido → Patrón ---- */
function campo(g, ayuda, cuerpo, lado){

      ${g.est === "ahora" ? `<span class="hilo-etiqueta">Sigue aquí</span>` : ""}${g.ej ? `<span class="dato ej nota-maqueta" data-solo-maqueta title="Lo escrito es un ejemplo de la maqueta">Ejemplo: lo escrito</span>` : ""}${g.ejLista ? `<span class="dato ej nota-maqueta" data-solo-maqueta title="Las opciones por categoría son un ejemplo de la maqueta; los totales son los de la pantalla real">Ejemplo: lista</span>` : ""}${ayuda ? `<span class="ay">${ayuda}</span>` : ""}${lado ? `<span class="lado">${lado}</span>` : ""}</div>
    <div class="cuerpo-c">${cuerpo}</div></div></div>`;

function tiles(tipo, lista, elegido){

  return `<div class="grilla">${lista.map(t => `<button class="tx" data-${tipo}="${esc(t)}" aria-pressed="${elegido === t}">${muestra(tipo, t)}<span class="nom">${esc(t)}</span></button>`).join("")}<button class="tx ver" data-accion="ver-igual"><b>Ver todos</b><span>${total}</span></button></div>`;
}
const nPrendas = m => catalogo().filter(p => p.marca === m).length;
const tagEj = `<span class="dato ej nota-maqueta" data-solo-maqueta title="Prendas inventadas para la maqueta">Ejemplo</span>`;
/* Marca y proveedor: DOS campos (ElegirMarcaProveedor, ADR-0283), cada uno opcional. El proveedor no cambia en esta propuesta. */
function marcaCuerpo(){
  let cMarca;
  if (s.marca) cMarca = `<div class="elegido"><b>${esc(s.marca)}</b><small>${COMODINES.has(s.marca) ? "Cuenta como sin marca" : `${plural(nPrendas(s.marca), "prenda", "prendas")} en el sistema`}${s.marca === "CAYLA" ? " " + tagEj : ""}</small></div>`;

      ${s.listaMarca || q.trim() ? `<div class="lista"><p class="enc-l">${q.trim() ? plural(res.length, "resultado", "resultados") : "Marcas con prendas · las demás salen al escribir"}</p>${res.map(m => `<button class="opcion" data-marca="${esc(m)}"><b>${marcar(m, q)}</b><small>${COMODINES.has(m) ? "comodín: cuenta como sin marca" : plural(nPrendas(m), "prenda", "prendas")}${m === "CAYLA" ? " " + tagEj : ""}</small></button>`).join("")}${res.length ? "" : `<p class="enc-l">Ninguna con prendas se llama así.</p>`}</div>` : ""}</div>`;

}
/* El aviso rojo en línea, bajo el campo Nombre: un error que frena se ve junto al campo donde se produce (y además va en la tarjeta del resumen). */
function rojoInline(id){
  const mE = marcaEf(), otra = !!id.marca && !!mE && id.marca !== mE;
  if (otra) return `<div class="aviso rojo" role="alert"><p>Ese nombre ya existe en <strong>${esc(id.marca)}</strong>. Agrégale el modelo o la marca para distinguirla (ej.: ${esc(mE)} ${esc(id.nombre)}).</p><button class="btn-enlace tocable" data-accion="ver-ficha" data-id="${id.id}">Ver ${esc(id.nombre)} de ${esc(id.marca)}</button></div>`;
  const enBloque = candidatos("").items.some(it => it.p.id === id.id);
  return `<div class="aviso rojo" role="alert"><p>Ya existe <strong>${esc(id.nombre)}</strong>${id.marca ? ` en ${esc(id.marca)}` : ""}. Un nombre identifica a una sola prenda.</p>${enBloque ? `<button class="btn-enlace tocable" data-accion="abrir-hoja" data-id="${id.id}">Ver y comparar</button><span class="sub">Si es la misma, ábrela con «Es el mismo diseño». Si es otro diseño, ponle un nombre que lo distinga: el largo, el corte, el detalle.</span>` : `<button class="btn-enlace tocable" data-accion="ver-ficha" data-id="${id.id}">Ver ${esc(id.nombre)}</button><span class="sub">Si es otro diseño, ponle un nombre que lo distinga: el largo, el corte, el detalle.</span>`}</div>`;
}

function paso2(A){
  const G = guia(); G.forEach(g => { g.nuevo = prevEst[g.id] !== g.est; });
  prevEst = Object.fromEntries(G.map(g => [g.id, g.est]));
  const by = Object.fromEntries(G.map(g => [g.id, g])), cfg = CONFIG[s.cat] ?? CONFIG.Jeans;
  by.nombre.ej = s.ejEscrito && !!s.nombre.trim(); by.desc.ej = s.ejEscrito && !!s.desc.trim();
  by.tejido.ejLista = true; by.patron.ejLista = true;
  const id = identico(true);
  const falta = G.filter(g => !g.ok && g.req), sinElegir = G.filter(g => !g.ok && !g.req && g.sug);
  const restantes = A && (A.nivel === "info" || A.nivel === "ambar") ? A.restantes : 0;
  const puedeSeguir = !falta.length && !id, listo = puedeSeguir && !sinElegir.length && !restantes;
  const chipG = g => `<button class="hilo-chip" data-accion="ir-campo" data-id="${g.id}" title="${esc(PENDIENTE[g.id])}"><span class="hilo-marca" data-estado="${g.est}" aria-hidden="true"></span>${g.tit}</button>`;
  /* Lenguaje real de la guía (ADR-0284): «Falta:» solo para lo requerido; lo sugerido va aparte, en «Sin elegir: … · puedes seguir así». Ni «Marca y proveedor» ni las parecidas bloquean «Seguir». */
  const lineas = id
    ? `<p class="fl">“${esc(id.nombre)}” ya existe: ábrela o cámbiale el nombre para seguir.</p>`
    : [falta.length ? `<div class="fl"><span>${falta.length === 1 ? "Falta:" : "Faltan:"}</span>${falta.map(chipG).join("")}</div>` : "",
       sinElegir.length ? `<div class="fl"><span>Sin elegir:</span>${sinElegir.map(chipG).join("")}<span>· puedes seguir así</span></div>` : "",
       restantes ? `<div class="fl"><span>Revisa: ${plural(restantes, "parecida", "parecidas")} ·</span><button class="btn-enlace tocable" data-accion="abrir-hoja">Ver</button></div>` : ""].join("") || `<p class="fl ok">Listo. Sigue cuando quieras.</p>`;
  return `
    ${campo(by.marca, "Quién la hace y quién te la trae · opcional", marcaCuerpo())}
    ${campo(by.nombre, "Como se lo dirías a una clienta", nombreCuerpo())}
    ${campo(by.desc, "Opcional · lo que no dice el nombre: corte, largo, detalles", `<input class="caja" data-campo="desc" placeholder="Manga globo, botones forrados…" value="${esc(s.desc)}" autocomplete="off" aria-label="Descripción">`)}
    ${campo(by.tejido, "De qué tela es", tiles("tejido", cfg.tejidos, s.tejido))}
    ${campo(by.patron, "El dibujo de la tela. Si no tiene, elige Liso", tiles("patron", cfg.patrones, s.patron))}
    ${plegableMas()}
    <div class="paso-pie" data-pie-alta><div class="falta">${lineas}</div><button class="btn-cayla btn-primario ${listo ? "hilo-seguir" : ""}" data-accion="seguir" ${puedeSeguir ? "" : "disabled"} ${!puedeSeguir && !id ? `title="Falta lo de arriba"` : ""}>Seguir →</button></div>`;
}

/* ---- la hoja «Ver y comparar» (el <Modal variante="hoja"> del ERP) ---- */
function hojaHtml(){
  if (!s.hoja) return "";
  const q = s.hoja.q, todaM = !!s.hoja.todaMarca, mE = marcaEf();
  const L = listaHoja(), items = L.items, cq = L.cq;
  let filas = items.map(it => ({it, dentro:""}));
  // Un texto (un nombre, un color, un tejido…) filtra; un CÓDIGO no: solo ordena y rotula (es una pista, no un veto).
  if (q.trim() && !cq) {
    filas = items.map(it => {
      const p = it.p, campos = [["descripción", p.desc ?? ""], ["color", p.colores.join(", ")], ["tejido", p.tejido], ["patrón", p.patron], ["temporada", p.temporada ?? ""]];
      if (coincideQ(q, p.nombre)) return {it, dentro:""};
      const c = campos.find(([, v]) => v && coincideQ(q, v));
      return c ? {it, dentro:`<small class="coincide">Coincide en ${c[0]}: ${marcar(c[1], q)}</small>`} : null;
    }).filter(Boolean);
  }
  const titulo = todaM ? `Prendas de ${esc(mE)}` : mE ? `Prendas parecidas de ${esc(mE)} en ${esc(s.cat)}` : `Prendas de ${esc(s.cat)}`;
  let av = "";
  if (cq) {
    const n = items.filter(it => llevaCodigo(it.p, cq)).length;
    av = n ? `<p class="al-gris">${n === 1 ? "1 prenda lleva" : `${n} prendas llevan`} <span class="mono" style="color:var(--color-tinta);font-weight:600">${esc(cq)}</span> en el nombre o la descripción. Las demás siguen abajo: el código es una pista, no una prueba.</p>`
      : `<div class="aviso neutro">Ninguna lleva <b>${esc(cq)}</b> en el nombre ni en la descripción. El código es una pista, no una prueba: mira el diseño igual.</div>`;
  } else {
    const cd = codigosDistintos(items);
    if (cd) av += `<div class="aviso neutro">${TXT_CODIGOS(cd)}</div>`;
    if (!todaM && L.otras.length) av += `<p class="al-gris">Hay una «${esc(L.otras[0].nombre)}» de ${esc(L.otras[0].marca)}.</p>`;
    if (!todaM && L.enOtraCat.length) av += `<p class="al-gris"><b style="color:var(--color-tinta)">${esc(L.enOtraCat[0].nombre)}</b> también está en ${esc(L.enOtraCat[0].cat)}, de ${esc(mE)}. <button class="btn-enlace tocable" data-accion="ver-marca">Ver las de ${esc(mE)}</button></p>`;
  }
  const cuenta = filas.length === items.length ? plural(items.length, "prenda", "prendas") : `${plural(filas.length, "resultado", "resultados")} de ${items.length}`;
  return `<div class="velo" data-accion="velo"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-tit" tabindex="-1">
    <h2 class="disp" id="hoja-tit">${titulo}</h2>
    <p class="baj">Compara el diseño con la prenda que tienes en la mano.</p>
    <div class="hoja-cuerpo"><div class="busca"><input class="caja" data-campo="hojaQ" placeholder="Busca por nombre o por el código de la etiqueta…" value="${esc(q)}" autocomplete="off" aria-label="Buscar en las prendas"></div>
      <p class="hoja-cuenta">${cuenta}</p>
      ${av ? `<div class="hoja-av">${av}</div>` : ""}
      <div class="hoja-lista">${filas.length ? filas.map(({it, dentro}) => candHtml(it, cq ? "" : q, dentro)).join("") : `<p class="nada">Ninguna prenda se llama así. Si no la ves, es nueva.</p>`}</div></div>
    <div class="hoja-pie"><p>Lo que llenaste aquí no se guarda.</p><button class="btn-cayla btn-secundario" data-accion="ninguna-mia">Ninguna es mi prenda</button></div>
  </div></div>`;
}

/* La ficha de la derecha (FichaPrevia): la ficha y «Avance» no cambian; la alerta es lo nuevo (entre las dos). En celular, la barra pegada abajo, con la tira encima. */

      <dl class="f-dl"><div><dt>Variantes</dt><dd class="vacio">—</dd></div><div><dt>Hoy en tienda</dt><dd class="vacio">—</dd></div></dl></div></div>`;
  const seg2 = A?.avance ?? (sig ? PENDIENTE[sig.id] : "Listo");
  const av = `<nav class="f-avance" aria-label="Avance"><div class="ok"><span class="n">✓</span><span><b>¿A qué categoría pertenece?</b><span class="tx2">${esc(cat)}</span></span></div>
      <div class="act"><span class="n">2</span><span><b>¿Cómo es?</b><span class="tx2">${esc(seg2)}</span></span></div>
      <div class="pend"><span class="n">3</span><span><b>¿En qué tallas y colores?</b><span class="tx2">—</span></span></div>
      <div class="pend"><span class="n">4</span><span><b>¿Cuánto cuesta y cuántas hay?</b><span class="tx2">—</span></span></div></nav>`;
  const siguiente = sig ? `Siguiente: ${esc(PENDIENTE[sig.id])}` : "Sigue con el paso 3.";
  return {aside:`<aside class="ficha" aria-label="La prenda que vas a crear"><span class="dato nota-maqueta marca-maq" data-solo-maqueta>Ficha y «Avance»: sin cambios · Nueva: la alerta</span>${tarj}${alertaHtml(A, entra)}${av}<div class="f-botones"><button class="btn-cayla btn-secundario">Cancelar</button><button class="btn-cayla btn-primario" disabled>Crear producto</button></div><p class="f-sig">${siguiente}</p></aside>`,
    barra:`<div class="barra-ficha" data-barra-ficha>${tiraHtml(A, entra)}<div class="fila-bf"><div class="txt"><b>${nom ? esc(nom) : "Nuevo producto"}</b><span>— · 0 var.</span></div><button class="btn-cayla btn-secundario">Ver</button><button class="btn-cayla btn-primario" disabled>Crear</button></div><p class="sig">${sig ? `<button data-accion="ir-campo" data-id="${sig.id}">${siguiente}</button>` : siguiente}</p></div>`};
}
