function render(){
  const act = document.activeElement, foco = act?.dataset?.campo, pos = act?.selectionStart;
  const yaAbierta = !!$(".velo"), scrollHoja = $(".hoja-lista")?.scrollTop ?? 0, scrollPanel = $(".hoja")?.scrollTop ?? 0;
  // FLIP: las filas se reordenan; cada una se desliza de donde estaba a donde queda (con la pausa de 0,6 s, no en cada tecla).
  const clavesFlip = e => e.classList[0] + e.dataset.id;
  const antes = new Map([...document.querySelectorAll(".cand[data-id], .al-fila[data-id]")].map(e => [clavesFlip(e), e.getBoundingClientRect().top]));
  const cat = s.cat, resumen1 = `Indumentaria › ${cat}`;
  document.body.classList.toggle("celular", s.celular);
  document.body.classList.toggle("quieto", s.quieto);
  document.body.classList.toggle("solo", s.solo || s.vista === "hoy");
  document.body.classList.toggle("movil", s.celular || innerWidth < 1024);
  const A = alertaVigente(), entra = !!A && A.key !== prevAlerta; prevAlerta = A ? A.key : "";
  let cuerpo, ficha = {aside:"", barra:""};
  if (s.vista === "hoy") {
    cuerpo = `<div class="hoy-grid">
        <div class="col"><p class="rotulo">Hoy <span class="chip-c neutro sin-punto"><span>main: guía de foco y marca opcional</span></span></p>${pasoHoy()}
          <div class="hoy-nota"><p><b>Lo que hoy dice para «Wide Leg»:</b> <span class="pesado">nada útil sobre el par de Jirish.</span> Todo en verde y «Seguir» abierto.</p>
            <p>El aviso compara solo el texto del nombre y exige 0,5 de parecido. «Wide Leg» contra «Wide Leg Corto Comfo» da 0,474: no avisa. Tampoco puede mostrar foto, stock ni cuándo se cargó.</p>
            <p>El código <b>79-SS24</b> quedó escrito dentro de la descripción, donde nadie lo puede comparar. Y el único aviso que sí saltaba (0,563), el gris de arriba, es contra «Adelle Wide Leg», que es de <b>otra marca</b> (Pilar) y a las 12:04 del 29/09 ya existía.</p></div></div>
        <div class="col"><p class="rotulo">Propuesta <span class="chip-c verde"><span>Alerta en el resumen · «Ver y comparar»</span></span></p>
          <section class="paso abierto"><div class="paso-cab"><span class="num">2</span><h2 class="paso-tit">¿Cómo es?</h2></div><div class="paso-cuerpo">${paso2(A)}</div></section>
          <div class="resumen-mini" style="margin-top:12px"><span class="dato nota-maqueta marca-maq" data-solo-maqueta>Así se ve, en el resumen de la derecha del formulario</span>${alertaHtml(A, false)}</div>
          <div class="hoy-nota"><p><b>Lo que diría la propuesta:</b> en el resumen, una tarjeta ámbar «Se parece a «Wide Leg Corto Comfo»» con lo que la persona necesita para decidir: cuántas hay disponibles (Disp. 2) y que se cargó hace 6 min. «Ver y comparar» abre su tarjeta completa, con el código leído de la descripción (SS25 311) para compararlo con la etiqueta.</p>
            <p>Nada obliga a mirarla: «Seguir» sigue abierto. La alerta no da veredicto: dice qué se parece y la persona decide.</p></div></div>
      </div>`;
  } else {
    ficha = fichaHtml(A, entra);
    cuerpo = `<div class="cuerpo-grid"><div class="pasos">${pasoCab("¿A qué categoría pertenece?", resumen1)}
      <section class="paso abierto"><div class="paso-cab"><span class="num">2</span><h2 class="paso-tit">¿Cómo es?<span class="tit-cat"> · ${esc(cat)}</span></h2></div><div class="paso-cuerpo">${paso2(A)}</div></section>
      ${pasoPendiente(3, "¿En qué tallas y colores?")}${pasoPendiente(4, "¿Cuánto cuesta y cuántas hay?")}</div>${ficha.aside}</div>`;
  }
  $("#raiz").innerHTML = `<div class="marco"><div class="app">${cabeceraHtml()}${cuerpo}</div>${ficha.barra}</div>`;
  $("#capa-hoja").innerHTML = hojaHtml();
  $("#capa-toast").innerHTML = s.toast ? `<div class="toast" role="status"><span>${s.toast}</span><button data-accion="cerrar-toast">Cerrar</button></div>` : "";
  if (yaAbierta && $(".hoja")) { $(".velo").style.animation = "none"; $(".hoja").classList.add("quieta"); $(".hoja").scrollTop = scrollPanel; const hl = $(".hoja-lista"); if (hl) hl.scrollTop = scrollHoja; }
  document.body.style.overflow = s.hoja ? "hidden" : "";
  // Con la hoja abierta, lo de atrás no recibe foco ni clics (el foco queda atrapado en la hoja).
  for (const el of document.querySelectorAll(".principal")) { if (s.hoja) el.setAttribute("inert", ""); else el.removeAttribute("inert"); }
  // La alerta NO roba el foco: solo se devuelve el que ya estaba en un campo.
  if (foco) { const el = $(`input[data-campo="${foco}"]`); if (el) { el.focus({preventScroll:true}); try { el.setSelectionRange(pos, pos); } catch {} } }
  else if (s.hoja && !yaAbierta && !matchMedia("(pointer:coarse)").matches && innerWidth > 660) $('[data-campo="hojaQ"]')?.focus({preventScroll:true});
  else if (s.hoja && !yaAbierta) $(".hoja")?.focus({preventScroll:true});
  if (s.hoja?.foco && !yaAbierta) { const c = $(`.hoja .cand[data-id="${s.hoja.foco}"]`); c?.scrollIntoView({block:"start", behavior:"auto"}); llamar(c); s.hoja.foco = null; }
  if (!s.quieto && !matchMedia("(prefers-reduced-motion:reduce)").matches && antes.size) {
    document.querySelectorAll(".cand[data-id], .al-fila[data-id]").forEach(e => { const y = antes.get(clavesFlip(e)); if (y === undefined) return; const dy = y - e.getBoundingClientRect().top; if (Math.abs(dy) > 1) e.animate([{transform:`translateY(${dy}px)`},{transform:"none"}], {duration:320, easing:"cubic-bezier(.32,.72,.24,1)"}); });
  }
}
function avisar(html){ s.toast = html; render(); }
function llamar(el){ if (!el) return; el.setAttribute("data-llamado", ""); setTimeout(() => el.removeAttribute("data-llamado"), 1150); }
function cerrarHoja(){
  const v = $(".velo");
  const volver = () => { s.hoja = null; render(); $(disparador || '[data-accion="abrir-hoja"]')?.focus({preventScroll:true}); };
  if (!v || s.quieto || matchMedia("(prefers-reduced-motion:reduce)").matches) return volver();
  v.classList.add("saliendo"); setTimeout(volver, 220);
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
function urlEstado(){ const p = [estadoActual]; if (s.celular) p.push("celular"); if (s.quieto) p.push("quieto"); if (s.solo && estadoActual !== "hoy") p.push("solo"); history.replaceState(null, "", "#" + p.join(",")); }
function cargarEstado(nombre, extra = {}){
  const e = ESTADOS[nombre] ?? ESTADOS.inicio; estadoActual = ESTADOS[nombre] ? nombre : "inicio";
  const cel = extra.celular ?? s?.celular ?? false, q = extra.quieto ?? s?.quieto ?? false, solo = extra.solo ?? s?.solo ?? false;
  s = {...base(), cat:ESTADO_CATS[nombre] ?? "Jeans", ...e.p, celular:cel, quieto:q, solo: solo || !!e.p.solo};
  s.ejEscrito = !!(s.nombre || s.desc);
  prevEst = {}; prevAlerta = ""; clearTimeout(pausa);
  if (extra.hoja && !s.hoja) s.hoja = {q:""};
  $("#estado-nota").innerHTML = e.nota;
  document.querySelectorAll(".barra-spike [data-estado]").forEach(b => b.setAttribute("aria-pressed", b.dataset.estado === estadoActual));
  $("#btn-celular").setAttribute("aria-pressed", s.celular);
  render();
}
const idsBloque = () => candidatos("").items.map(it => it.p.id);
const reinicia = () => { s.revisadas = []; };
document.addEventListener("click", e => {
  const b = e.target.closest("button, .velo, a[href]"); if (!b) return;
  if (b.tagName === "A") { e.preventDefault(); return; }
  const d = b.dataset;
  if (d.estado) { estadoActual = d.estado; urlEstado(); return cargarEstado(d.estado); }
  if (b.id === "btn-celular") { s.celular = !s.celular; urlEstado(); b.setAttribute("aria-pressed", s.celular); return render(); }
  if (!b.closest("#raiz, #capa-hoja, #capa-toast")) return;
  // Un clic termina la pausa: la alerta se pone al día enseguida.
  if (s.escribiendo) { clearTimeout(pausa); s.escribiendo = false; }
  const a = d.accion;
  if (a === "velo") { if (e.target === b) cerrarHoja(); return; }
  if (a === "cerrar-toast") { s.toast = ""; return render(); }
  if (a === "menu-cat") { s.menuCat = !s.menuCat; return render(); }
  if (d.cat) { s.cat = d.cat; s.menuCat = false; s.tejido = null; s.patron = null; reinicia(); return render(); }
  if (d.marca !== undefined) { s.marca = d.marca; s.busMarca = ""; s.listaMarca = false; reinicia(); return render(); }
  if (a === "quitar-marca") { s.marca = null; reinicia(); return render(); }
  if (d.tejido) { s.tejido = s.tejido === d.tejido ? null : d.tejido; return render(); }
  if (d.patron) { s.patron = s.patron === d.patron ? null : d.patron; return render(); }
  if (d.temporada) { s.temporada = d.temporada === "Ninguna" ? "" : d.temporada; return render(); }
  if (a === "mas") { s.mas = !s.mas; return render(); }
  if (a === "ver-igual") return avisar("Esto no cambia en la propuesta: queda igual que hoy.");
  if (a === "seguir") return avisar("Sigue el paso 3, «¿En qué tallas y colores?». No cambia en esta propuesta.");
  if (a === "reintentar") { s.carga = "ok"; return render(); }
  if (a === "abrir-hoja") { disparador = `[data-accion="abrir-hoja"]${d.id ? `[data-id="${d.id}"]` : ""}`; s.hoja = {q:"", foco:d.id ?? null}; return render(); }
  if (a === "ver-marca") { disparador = '[data-accion="ver-marca"]'; s.hoja = {q:"", todaMarca:true}; return render(); }
  if (a === "ver-de-nuevo") { reinicia(); disparador = '[data-accion="ver-de-nuevo"]'; s.hoja = {q:""}; return render(); }
  if (a === "ver-ficha") { const p = todos().find(x => x.id === d.id); return avisar(`Se abriría la ficha de <b>${esc(p.nombre)}</b>${p.marca ? ` (${esc(p.marca)})` : ""} solo para mirarla. Lo que llenaste aquí no se guarda. La maqueta termina aquí.`); }
  if (a === "es-el-mismo") { const p = todos().find(x => x.id === d.id); s.hoja = null; disparador = ""; return avisar(descontinuada(p)
    ? `Se abriría la ficha de <b>${esc(p.nombre)}</b>, que está descontinuada: ahí cambias «Estado» a «Activo» y guardas para volver a usarla. No se activa sola, y lo que llenaste aquí no se guarda. La maqueta termina aquí.`
    : `Se abriría la ficha de <b>${esc(p.nombre)}</b> para sumarle tallas y colores con «Agregar tallas» y «Agregar colores». Las unidades se registran en Recibir, y lo que llenaste aquí no se guarda. La maqueta termina aquí.`); }
  if (a === "es-otro") { if (!s.revisadas.includes(d.id)) s.revisadas.push(d.id); return render(); }
  if (a === "deshacer") { s.revisadas = s.revisadas.filter(x => x !== d.id); return render(); }
  if (a === "ninguna-mia") { s.revisadas = [...new Set([...s.revisadas, ...(s.hoja?.todaMarca ? [] : idsBloque())])]; return cerrarHoja(); }
  if (a === "ir-campo") { const f = $(`[data-fila="${d.id}"]`); f?.scrollIntoView({block:"center", behavior:s.quieto ? "auto" : "smooth"}); llamar(f); f?.querySelector("input:not([readonly])")?.focus({preventScroll:true}); return; }
  if (a === "quitar-palabra") { const w = d.w; const partes = s.nombre.trim().split(/\s+/); const i = partes.findIndex(x => x === w); if (i >= 0) partes.splice(i, 1); s.nombre = partes.join(" "); return render(); }
});
document.addEventListener("focusin", e => { if (e.target.dataset?.campo === "busMarca" && !s.listaMarca) { s.listaMarca = true; render(); } });
document.addEventListener("pointerdown", e => { if (s.listaMarca && !e.target.closest('[data-combo="marca"]')) { s.listaMarca = false; render(); } });
document.addEventListener("input", e => {
  const el = e.target, c = el.dataset?.campo; if (!c) return;
  if (c === "hojaQ") { s.hoja.q = el.value; return render(); }
  s[c] = el.value; if (c === "nombre" || c === "desc") s.ejEscrito = false;
  if (c === "nombre") { s.escribiendo = true; clearTimeout(pausa); pausa = setTimeout(() => { s.escribiendo = false; render(); }, 600); }
  render();
});
/* Escape: un control que lo usa (cierra su lista, borra su búsqueda) lo consume; solo el que sobra cierra la hoja (useEscapeLibre). */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const act = document.activeElement?.dataset?.campo;
  if (act === "busMarca" && (s.busMarca || s.listaMarca)) { s.busMarca = ""; s.listaMarca = false; return render(); }
  if (s.hoja) { if (act === "hojaQ" && s.hoja.q) { s.hoja.q = ""; return render(); } cerrarHoja(); }
});

function arrancar(){
  const p = location.hash.slice(1).split(","), nombre = ESTADOS[p[0]] ? p[0] : "inicio";
  cargarEstado(nombre, {celular:p.includes("celular"), quieto:p.includes("quieto"), hoja:p.includes("hoja"), solo:p.includes("solo")});
  if (p.includes("cerrada") && s.hoja) { s.hoja = null; render(); }   // ,cerrada: la hoja de «Ver los 12» / «Código» sin abrir
}
if (innerWidth <= 600) $("#estados-det").removeAttribute("open");
window.addEventListener("hashchange", arrancar);
matchMedia("(max-width:1023px)").addEventListener("change", () => s && render());
arrancar();
</script>
