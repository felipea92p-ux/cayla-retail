<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de la tienda · propuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Public+Sans:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* MAQUETA: nada de esto existe en apps/tienda. Los colores son los tokens de «G · Pasarela» (apps/tienda/app/globals.css). */
:root{--crema:#fff;--papel:#fff;--hueso:#f1f1ef;--sand:#dededb;--tinta:#0b0b0b;--taupe:#666664;--rojo:#b3261e;--verde:#1f6b44;--ambar:#8a5a00;--marfil:#f4f1ea;--logo:#d13730;--placa:#f1f1ef;--escenario:#0b0b0b;
--sans:"Public Sans",ui-sans-serif,system-ui,sans-serif;--nombre:"DM Serif Display",Georgia,ui-serif,serif;--ease:cubic-bezier(.2,.7,.2,1);--cortina:cubic-bezier(.76,0,.24,1);--alto-cab:72px;--alto-bar:44px;--alto-banda:30px}
:root[data-theme="dark"]{--crema:#0b0b0b;--papel:#141413;--hueso:#1b1b1a;--sand:#2e2e2c;--tinta:#f4f1ea;--taupe:#a6a39c;--rojo:#f0786f;--verde:#5fc08c;--ambar:#e0a24a;--escenario:#050505}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--crema);color:var(--tinta);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--nombre);font-weight:400;margin:0;letter-spacing:-.01em}h2 em,h1 em{font-style:italic}p{margin:0}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.ancho{width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(16px,3.5vw,48px)}
.ceja{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 28px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;background:var(--tinta);color:var(--crema);border:1px solid var(--tinta);position:relative;overflow:hidden;transition:color .35s var(--cortina)}
.btn::before{content:"";position:absolute;inset:0;background:var(--crema);transform:translateY(101%);transition:transform .35s var(--cortina)}.btn>*{position:relative}
@media(hover:hover){.btn:hover{color:var(--tinta)}.btn:hover::before{transform:none}.btn.claro:hover{color:var(--marfil)}.btn.fantasma:hover{color:var(--crema)}.btn.linea:hover{color:var(--tinta)}}
.btn.claro{background:var(--marfil);color:#0b0b0b;border-color:var(--marfil)}.btn.claro::before{background:#0b0b0b}
.btn.fantasma{background:transparent;color:var(--tinta);border-color:var(--tinta)}.btn.fantasma::before{background:var(--tinta)}
.btn.linea{background:transparent;color:var(--marfil);border-color:color-mix(in srgb,var(--marfil) 45%,transparent)}.btn.linea::before{background:var(--marfil)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ver{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;display:inline-flex;gap:10px;align-items:center;white-space:nowrap;border-bottom:1px solid var(--tinta);padding-bottom:4px}
.ver i{font-style:normal;transition:transform .3s var(--ease)}@media(hover:hover){.ver:hover i{transform:translateX(4px)}}

/* La barra de la maqueta: no es parte del diseño */
.mq{position:sticky;top:0;z-index:60;height:var(--alto-bar);display:flex;align-items:center;gap:14px;padding:0 clamp(12px,2vw,24px);background:#2a2a28;color:#f4f1ea;font-size:13px}
.mq b{font-weight:600;white-space:nowrap}.mq .nota{opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0}
.mq-seg{display:flex;gap:2px;background:#000;padding:2px;border-radius:999px;flex:none}
.mq-seg a{padding:4px 14px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}.mq-seg a[aria-current]{background:#f4f1ea;color:#0b0b0b}
.mq-hoy{white-space:nowrap;text-decoration:underline;text-underline-offset:3px;flex:none;font-size:12.5px}

/* Cabecera, la de la tienda de hoy */
.banda{height:var(--alto-banda);background:#0b0b0b;color:#f4f1ea;display:flex;align-items:center;justify-content:center;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:0 12px;text-align:center}
.cab{position:sticky;top:var(--alto-bar);z-index:50;background:var(--crema);border-bottom:1px solid var(--sand);height:var(--alto-cab)}
.cab-in{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.cab-nav{display:flex;gap:clamp(16px,2.4vw,38px);align-items:center}.cab-nav>a,.cab-nav>div>button{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:8px 0;position:relative;white-space:nowrap}
.cab-nav>a::after,.cab-nav>div>button::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
@media(hover:hover){.cab-nav>a:hover::after,.cab-nav>div:hover>button::after{transform:none}}
.logo{display:block;color:var(--logo);width:112px}.logo svg{display:block;width:100%;height:auto}
.cab-der{display:flex;justify-content:flex-end;gap:clamp(10px,1.6vw,24px);align-items:center}
.ico{width:40px;height:40px;display:grid;place-items:center;position:relative}.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cuenta{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:99px;background:var(--tinta);color:var(--crema);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}.cuenta.pop{animation:pop .45s var(--ease)}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.sede{display:flex;align-items:center;gap:7px;height:40px;font-size:13px;font-weight:500;white-space:nowrap}.sede img{width:26px;height:26px;object-fit:contain}.sede svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.6}
.menu-pl{position:absolute;top:100%;left:0;right:0;background:var(--papel);border-top:1px solid var(--sand);border-bottom:1px solid var(--sand);display:none;padding:28px 0 34px;z-index:40;animation:baja .28s var(--ease)}@keyframes baja{from{opacity:0;transform:translateY(-8px)}}
.menu-pl.abierto{display:block}.menu-pl ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 28px}.menu-pl a{font:400 22px/1.5 var(--nombre);display:flex;justify-content:space-between;align-items:baseline;gap:12px}.menu-pl small{font:400 13px var(--sans);color:var(--taupe)}
.lista-sede{position:absolute;right:0;top:calc(100% + 6px);background:var(--papel);border:1px solid var(--sand);min-width:210px;z-index:45;display:none;box-shadow:0 18px 40px -22px rgba(0,0,0,.4)}.lista-sede.abierto{display:block;animation:baja .22s var(--ease)}
.lista-sede button{display:flex;width:100%;gap:10px;align-items:center;padding:11px 16px;text-align:left}.lista-sede button[aria-current]{font-weight:600}.lista-sede img{width:22px;height:22px;object-fit:contain}.lista-sede button+button{border-top:1px solid var(--sand)}
@media(hover:hover){.lista-sede button:hover{background:var(--hueso)}}
.buscar{position:absolute;inset:100% 0 auto;background:var(--papel);border-bottom:1px solid var(--sand);padding:18px 0;display:none;z-index:44}.buscar.abierto{display:block;animation:baja .22s var(--ease)}.buscar input{width:100%;border:0;border-bottom:1px solid var(--tinta);background:transparent;color:inherit;font:400 26px var(--nombre);padding:6px 0;outline:0}
.ham{display:none}
.lado{position:fixed;inset:0;z-index:80;display:none}.lado.abierto{display:block}.lado-velo{position:absolute;inset:0;background:rgba(11,11,11,.45);animation:fundido .25s}.lado-caja{position:absolute;inset:0 auto 0 0;width:min(86vw,340px);background:var(--papel);padding:20px;overflow:auto;animation:lateral .32s var(--ease)}@keyframes lateral{from{transform:translateX(-100%)}}@keyframes fundido{from{opacity:0}}
.lado-caja a{display:flex;justify-content:space-between;font:400 23px/2 var(--nombre);border-bottom:1px solid var(--sand)}.lado-caja small{font:400 13px var(--sans);color:var(--taupe);align-self:center}

/* Tarjeta de prenda */
.ph{position:relative;background:var(--placa);aspect-ratio:4/5;overflow:hidden}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .7s var(--ease),opacity .4s}.ph img.dos{opacity:0}
@media(hover:hover){.card:hover .ph img{transform:scale(1.04)}.card:hover .ph img.dos{opacity:1}.card:hover .ph img.uno.hay-dos{opacity:0}}
.card{display:block;min-width:0}.card b{display:block;font:400 19px/1.25 var(--nombre);margin-top:12px}.card .pr{display:flex;gap:8px;align-items:baseline;margin-top:3px;font-size:14.5px;font-weight:500}.card s{color:var(--taupe);font-weight:400;font-size:13px}.card .nt{display:block;font-size:13px;color:var(--taupe);margin-top:1px}
.et{position:absolute;left:10px;top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;background:var(--crema);color:var(--tinta);padding:3px 8px;z-index:2}.et.of{background:var(--rojo);color:#fff}
.grilla{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}
.sec{padding-top:clamp(44px,6vw,84px)}.sec-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px}.sec-cab h2{font-size:clamp(32px,4vw,52px);line-height:1.05}
.fila{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:20px}

/* Lo de abajo, igual en las tres */
.confianza{border-block:1px solid var(--sand);margin-top:clamp(28px,4vw,48px)}.confianza ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr)}.confianza li{padding:20px clamp(12px,2vw,28px);display:flex;gap:12px;align-items:flex-start}.confianza li+li{border-left:1px solid var(--sand)}.confianza b{display:block;font:400 19px/1.25 var(--nombre)}.confianza span{font-size:13.5px;color:var(--taupe)}.confianza svg{flex:none;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3;margin-top:2px}
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--tinta)}.pasos li{padding:22px 22px 0 0}.pasos em{font:italic 400 34px/1 var(--nombre);display:block;margin-bottom:12px}.pasos b{display:block;font-weight:500;margin-bottom:3px}.pasos span{font-size:14px;color:var(--taupe)}
.club{margin-top:clamp(52px,7vw,96px);background:#0b0b0b;color:#f4f1ea;padding:clamp(40px,6vw,76px) 0}.club-in{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}.club h2{font-size:clamp(34px,4.6vw,60px);line-height:1.04}.club p{opacity:.78;margin-top:10px;max-width:46ch}.club ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(244,241,234,.2);border:1px solid rgba(244,241,234,.2)}.club li{background:#0b0b0b;padding:16px;font-size:14px}.club .btn{margin-top:22px}
.tiendas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.tienda{border-top:1px solid var(--tinta);padding-top:16px}.tienda h3{font-size:28px;display:flex;gap:10px;align-items:center}.tienda img{width:30px;height:30px;object-fit:contain}.tienda p{font-size:14px;color:var(--taupe);margin-top:6px}.tienda .ver{margin-top:12px}
.pie{margin-top:clamp(52px,7vw,96px);border-top:1px solid var(--sand);padding:34px 0 54px;font-size:14px}.pie-in{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.pie h3{font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}.pie a{display:block;color:var(--taupe);padding:2px 0}
.reco{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;gap:9px;align-items:center;background:#0b0b0b;color:#f4f1ea;padding:12px 16px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}.reco svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);transition-delay:var(--d,0ms)}.rv.ya{opacity:1;transform:none}

/* A · LA VITRINA */
.a-vit{display:grid;grid-template-columns:minmax(300px,1.22fr) repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:2px;height:calc(100svh - var(--alto-bar) - var(--alto-cab) - var(--alto-banda));min-height:560px;max-height:980px;background:var(--crema)}
.a-pan{grid-row:1/3;background:#0b0b0b;color:#f4f1ea;padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:20px;position:relative;overflow:hidden}
.a-pan .ceja{color:rgba(244,241,234,.72)}.a-pan h1{font-size:clamp(44px,4.7vw,78px);line-height:.98;opacity:0;animation:sube .9s .05s var(--ease) forwards}.a-pan p{color:rgba(244,241,234,.8);max-width:32ch;margin:14px 0 22px;opacity:0;animation:sube .8s .2s var(--ease) forwards}.a-pan .btn{opacity:0;animation:sube .8s .3s var(--ease) forwards}
@keyframes sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.a-t{position:relative;overflow:hidden;display:block;background:color-mix(in srgb,var(--c) 24%,#f4f2ee);opacity:0;animation:aparece .75s calc(var(--i)*70ms + 120ms) var(--ease) forwards}@keyframes aparece{from{opacity:0;clip-path:inset(12% 0 0 0)}to{opacity:1;clip-path:inset(0)}}
.a-t img{position:absolute;inset:6% 6% 15%;width:88%;height:79%;object-fit:contain;mix-blend-mode:multiply;transition:transform .8s var(--ease)}
.a-t .tt{position:absolute;left:16px;right:16px;bottom:13px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#0b0b0b}.a-t .tt b{font:400 clamp(20px,1.85vw,29px)/1.05 var(--nombre);white-space:nowrap}.a-t .tt small{font-size:13px;white-space:nowrap}
.a-t .fl{display:inline-block;transition:transform .35s var(--ease);margin-left:6px}
@media(hover:hover){.a-t:hover img{transform:scale(1.06) translateY(-1.5%)}.a-t:hover .fl{transform:translateX(5px)}}
.a-mas{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}.pil{border:1px solid var(--sand);padding:8px 16px;font-size:13.5px;border-radius:99px;transition:border-color .2s,background .2s}@media(hover:hover){.pil:hover{border-color:var(--tinta)}}

/* B · EL LOOK DE LA SEMANA */
.b-her{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);height:calc(100svh - var(--alto-bar) - var(--alto-cab) - var(--alto-banda) - 110px);min-height:520px;max-height:860px}
.b-pla{position:relative;overflow:hidden;background:var(--fondo,#ece6db);transition:background .7s var(--ease)}
.b-p{mix-blend-mode:multiply;position:absolute;display:block;transform:translate(-50%,-50%);width:var(--w);left:var(--x);top:var(--y);z-index:var(--z,1);opacity:0;animation:cae .85s calc(var(--i)*130ms) var(--ease) forwards}@keyframes cae{from{opacity:0;transform:translate(-50%,-44%) rotate(calc(var(--r,0deg) + 3deg))}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg))}}
.b-p img{width:100%;aspect-ratio:4/5;object-fit:contain;transition:transform .5s var(--ease)}@media(hover:hover){.b-p:hover{z-index:9}.b-p:hover img{transform:scale(1.04)}}
.b-tag{position:absolute;left:min(var(--tx,58%),calc(100% - 96px));top:var(--ty,12%);background:#fff;color:#0b0b0b;font-size:12.5px;font-weight:500;padding:4px 10px;white-space:nowrap;display:flex;gap:7px;box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}.b-tag i{font-style:normal;width:17px;height:17px;border-radius:50%;background:#0b0b0b;color:#fff;font-size:10.5px;display:grid;place-items:center;align-self:center}
.b-pan{background:#0b0b0b;color:#f4f1ea;padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}.b-pan .ceja{color:rgba(244,241,234,.72)}.b-pan h1{font-size:clamp(38px,3.8vw,62px);line-height:1.02}.b-pan h1,.b-pan .b-lis{animation:sube .7s var(--ease)}
.b-lis{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid rgba(244,241,234,.22)}.b-lis a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(244,241,234,.22);font-size:14.5px}.b-lis a span:first-child{display:flex;gap:9px;align-items:center}.b-lis i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#f4f1ea;color:#0b0b0b;font-size:10.5px;display:grid;place-items:center;flex:none}
.b-tot{display:flex;justify-content:space-between;font:500 20px var(--sans);margin-top:2px}.b-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.b-acc .btn{flex:1 1 auto;padding:0 14px}
.b-pun{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:13px;color:rgba(244,241,234,.72)}
.cats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none;border-bottom:1px solid var(--sand)}.cats::-webkit-scrollbar{display:none}
.cat{text-align:center;font-size:13px;display:block;padding:2px}.cat span{display:block;width:62px;height:62px;margin:0 auto 5px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--c) 24%,#f4f2ee);transition:transform .35s var(--ease)}.cat img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:6px}@media(hover:hover){.cat:hover span{transform:translateY(-3px)}}

/* C · LA PASARELA TOCABLE */
.c-esc{background:var(--escenario);color:#f4f1ea;position:relative;overflow:hidden;height:calc(100svh - var(--alto-bar) - var(--alto-cab) - var(--alto-banda) - 110px);min-height:540px;max-height:860px;display:grid;grid-template-columns:1fr minmax(280px,34vh) 1fr;grid-template-rows:minmax(0,1fr) auto;gap:0 clamp(18px,3vw,48px);padding:clamp(18px,2.4vw,32px) clamp(16px,3.5vw,48px) 14px}
.c-izq{display:flex;flex-direction:column;justify-content:center;min-width:0}.c-izq .ceja{color:rgba(244,241,234,.72)}.c-izq h1{font-size:clamp(58px,8.2vw,136px);line-height:.92;margin-top:10px;animation:sube 1s var(--ease)}.c-izq h1 em{display:block;padding-left:.45em}
.c-arco{position:relative;align-self:stretch;border-radius:999px 999px 0 0;background:radial-gradient(ellipse at 50% 28%,#fff,#ecebe7 70%);overflow:hidden;min-height:0}
.c-pr{mix-blend-mode:multiply;position:absolute;inset:8% 5% 3%;display:block;animation:entra .75s var(--ease)}.c-pr img{width:100%;height:100%;object-fit:contain}@keyframes entra{from{opacity:0;transform:translateX(26%) scale(.95)}to{opacity:1;transform:none}}

let ultimaRuta="";
function revela(){
  const els=[...document.querySelectorAll(".rv")];
  if(!("IntersectionObserver"in window)||matchMedia("(prefers-reduced-motion: reduce)").matches){els.forEach(e=>e.classList.add("ya"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("ya");io.unobserve(e.target)}}),{rootMargin:"0px 0px 12% 0px"});
  els.forEach(e=>io.observe(e));
}

/* RONDA 4 (Felipe, 2026-11-05: «la primera pantalla debe ser lo más visual posible y profesional»):
   K, L y M ocupan toda la primera pantalla. Las prendas se recortan del fondo blanco aquí mismo, en el navegador,
   para poder ponerlas sobre color. En la tienda real los recortes se prepararían una vez. Los colores salen de cada prenda. */
const cortes={};
function recortar(n){if(cortes[n])return cortes[n];return cortes[n]=new Promise(ok=>{const im=new Image();im.crossOrigin="anonymous";im.onerror=()=>ok(null);im.onload=()=>{try{
  const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);const I=x.getImageData(0,0,W,H),d=I.data;
  const fondo=new Uint8Array(W*H),esFondo=i=>{const p=i*4,a=d[p+3];if(a<16)return true;const r=d[p],g=d[p+1],b=d[p+2],mi=Math.min(r,g,b),ma=Math.max(r,g,b);return (mi>=168&&ma-mi<=14)||(mi>=225&&ma-mi<=24)};
  const pila=[];const mete=i=>{if(!fondo[i]&&esFondo(i)){fondo[i]=1;pila.push(i)}};
  for(let v=0;v<W;v++){mete(v);mete((H-1)*W+v)}for(let v=0;v<H;v++){mete(v*W);mete(v*W+W-1)}
  const anda=(mar)=>{while(pila.length){const i=pila.pop(),u=i%W;if(u>0)mar(i-1);if(u<W-1)mar(i+1);if(i>=W)mar(i-W);if(i<W*(H-1))mar(i+W)}};anda(mete);
  /* Huecos blancos encerrados (entre el brazo y el cuerpo, la abertura de un cuello) */
  const visto=new Uint8Array(W*H),muyBlanco=i=>{const p=i*4;return d[p+3]>=16&&Math.min(d[p],d[p+1],d[p+2])>=240};
  for(let i=0;i<W*H;i++){if(fondo[i]||visto[i]||!muyBlanco(i))continue;const reg=[i];visto[i]=1;for(let q=0;q<reg.length;q++){const k=reg[q],u=k%W;for(const n2 of [u>0?k-1:-1,u<W-1?k+1:-1,k>=W?k-W:-1,k<W*(H-1)?k+W:-1]){if(n2>=0&&!visto[n2]&&!fondo[n2]&&muyBlanco(n2)){visto[n2]=1;reg.push(n2)}}}if(reg.length>=350)for(const k of reg)fondo[k]=1}
  /* El fondo se vuelve transparente y su gris se queda como sombra de verdad, que funciona sobre cualquier color */
  for(let i=0;i<W*H;i++){if(!fondo[i])continue;const p=i*4;if(d[p+3]<16){d[p+3]=0;continue}const L=(d[p]+d[p+1]+d[p+2])/3;d[p]=d[p+1]=d[p+2]=0;d[p+3]=L>=246?0:Math.min(150,(255-L)*1.1)}
  /* Orilla: quita el halo blanco */
  for(let i=0;i<W*H;i++){if(fondo[i])continue;const u=i%W;if((u>0&&fondo[i-1])||(u<W-1&&fondo[i+1])||(i>=W&&fondo[i-W])||(i<W*(H-1)&&fondo[i+W])){const p=i*4,mi=Math.min(d[p],d[p+1],d[p+2]);const t=Math.max(.25,Math.min(1,(255-mi)/110));for(let q=0;q<3;q++)d[p+q]=Math.max(0,Math.min(255,(d[p+q]-(1-t)*255)/t));d[p+3]=Math.min(d[p+3],t*255)}}
  x.putImageData(I,0,0);
  /* Se quita el aire de la foto: una fila o columna cuenta si tiene varios puntos de prenda, para no agrandar por una mota */
  let iz=W,de=-1,ar=H,ab=-1;const porFila=new Uint32Array(H),porCol=new Uint32Array(W);for(let i=0;i<W*H;i++){if(!fondo[i]){porFila[Math.floor(i/W)]++;porCol[i%W]++}}
  for(let v=0;v<H;v++)if(porFila[v]>=6){if(v<ar)ar=v;if(v>ab)ab=v}for(let u=0;u<W;u++)if(porCol[u]>=6){if(u<iz)iz=u;if(u>de)de=u}
  if(de<=iz||ab<=ar){c.toBlob(b=>ok(b?URL.createObjectURL(b):null),"image/png");return}
  const mx=Math.round(W*.012),ax=Math.max(0,iz-mx),ay=Math.max(0,ar-mx),bx=Math.min(W,de+mx),by=Math.min(H,ab+Math.round(H*.03));const c2=document.createElement("canvas");c2.width=bx-ax;c2.height=by-ay;c2.getContext("2d").drawImage(c,ax,ay,bx-ax,by-ay,0,0,bx-ax,by-ay);
  c2.toBlob(b=>ok(b?URL.createObjectURL(b):null),"image/png")}catch{ok(null)}};im.src=BASE+n})}
function activaCortes(){document.querySelectorAll("img[data-corte]").forEach(im=>{const n=im.dataset.corte;recortar(n).then(u=>{if(!im.isConnected)return;if(u){im.src=u}else{im.src=foto(n,1080);im.classList.add("sin-corte")}im.onload=()=>im.classList.add("cargada");if(im.complete&&im.naturalWidth)im.classList.add("cargada")})})}
const imgC=(p,cl="")=>`<img class="corte ${cl}" data-corte="${p.f[0]}" alt="">`;

/* K · El cartel */
const KS=[{id:"1ba26a3d",f:"#123E33",t:"#F4F1EA"},{id:"858c77d5",f:"#E9D7C8",t:"#2A0E12"},{id:"dea54509",f:"#14284A",t:"#F4F1EA"},{id:"5d48548f",f:"#17110D",t:"#F4F1EA"}];
let kI=0,kParo=false;
const kLista=()=>{const l=KS.filter(x=>ve(ID[x.id]));return l.length?l:KS};
function kPinta(){const l=kLista(),a=l[kI%l.length],pa=ID[a.id],se=document.getElementById("k-sec");if(!se)return;se.style.setProperty("--f",a.f);se.style.setProperty("--t",a.t);se.querySelectorAll(".k-g img").forEach((im,i)=>im.parentElement.classList.toggle("on",i===kI%l.length));se.querySelector(".k-nom").innerHTML=`<a href="${ir("prenda/"+pa.id)}">${pa.n}</a><span>${precioNota(pa)}</span>`;se.querySelectorAll("[data-k]").forEach((b,i)=>b.setAttribute("aria-current",i===kI%l.length))}
function kAnda(){if(kParo||matchMedia("(prefers-reduced-motion: reduce)").matches)return;clearTimeout(window.kReloj);window.kReloj=setTimeout(()=>{if(!document.getElementById("k-sec"))return;kI=(kI+1)%kLista().length;kPinta();kAnda()},6000)}
function homeK(){const l=kLista();if(kI>=l.length)kI=0;const a=l[kI],pa=ID[a.id];
  return `<section class="k-sec" id="k-sec" aria-label="Lo nuevo" style="--f:${a.f};--t:${a.t}"><h1 class="k-t">Lo nuevo</h1><div class="k-gs">${l.map((x,i)=>`<a class="k-g ${i===kI?"on":""}" href="${ir("prenda/"+x.id)}" aria-label="${ID[x.id].n}">${imgC(ID[x.id])}</a>`).join("")}</div><div class="k-pie"><div class="k-nom"><a href="${ir("prenda/"+pa.id)}">${pa.n}</a><span>${precioNota(pa)}</span></div><div class="k-marcas">${l.map((x,i)=>`<button data-k="${i}" aria-label="Ver ${ID[x.id].n}" aria-current="${i===kI}"></button>`).join("")}</div><div class="k-acc"><a class="k-ver" href="${ir("lista/nuevo")}">Ver todo lo nuevo</a><a class="k-btn" href="${ir("arma")}">${ICO_OUT}<span>Arma tu outfit</span></a></div></div></section>`}

/* L · Tres paneles: 9 prendas nuevas que rotan de 3 en 3. Cada grupo es un outfit que se puede recoger en una misma tienda. */
const LS=[
 [{id:"916f4997",f:"#DCCBB8",t:"#17110D",s:"arriba"},{id:"eb8ef57d",f:"#4E1820",t:"#F4F1EA",s:"abajo"},{id:"5952ee51",f:"#191512",t:"#F4F1EA",s:"encima"}],
 [{id:"1ba26a3d",f:"#123E33",t:"#F4F1EA",s:"arriba"},{id:"12145896",f:"#E9D9B6",t:"#17110D",s:"abajo"},{id:"8193cf94",f:"#22303A",t:"#F4F1EA",s:"encima"}],
 [{id:"dea54509",f:"#14284A",t:"#F4F1EA",s:"arriba"},{id:"9dcf03db",f:"#EBD3C8",t:"#2A0E12",s:"abajo"},{id:"d6b5908f",f:"#A8937B",t:"#17110D",s:"encima"}]];
let lI=0,lParo=false;
const lLista=()=>{const l=LS.filter(g=>g.every(x=>ve(ID[x.id])));return l.length?l:LS};
const lTx=p=>`<b>${p.n}</b><small>${sol(p.p)}</small>`;
const lFrase=g=>{const ps=g.map(x=>ID[x.id]),tot=ps.reduce((a,p)=>a+p.p,0),juntas=SEDES.filter((x,i)=>ps.every(p=>p.s[i]!==0)).map(x=>x.n);return `<span class="l-f-d">${dondeSiFalta(juntas)?`Estas tres combinan y hay en ${dondeSiFalta(juntas)}.`:"Estas tres combinan."} <b>${sol(tot)}</b> el outfit.</span><span class="l-f-m"><b>${sol(tot)}</b><small>${juntas.length?(dondeSiFalta(juntas)?`Todo hay en ${dondeSiFalta(juntas)}`:"Este outfit"):"Están en distintas tiendas"}</small></span>`};
const LICO=p=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p?"M7 5l12 7-12 7z":"M8 5v14M16 5v14"}"/></svg>`;
const lEsCel=()=>innerWidth<=900;
const lTot=g=>g.reduce((a,x)=>a+ID[x.id].p,0);
const lDonde=g=>SEDES.filter((x,i)=>g.every(y=>ID[y.id].s[i]!==0)).map(x=>x.n);
/* Debajo de la portada: las mismas 9 prendas, por si alguien no llegó a verlas, con las categorías primero */
function lDebajo(){const G=lLista().flat();return `${tiraCats()}<section class="sec ancho n-debajo"><div class="sec-cab rv"><h2>Lo nuevo</h2><a class="ver" href="${ir("lista/nuevo")}">Ver todo</a></div><div class="grilla n-gr">${G.map((x,k)=>card(ID[x.id],k)).join("")}<a class="n-todo" href="${ir("lista/nuevo")}"><span>Ver todo lo nuevo</span></a></div></section>`}
/* Celular: una prenda grande por pantalla; se desliza con el dedo y no rota sola (Baymard: una prenda puede cambiar justo al tocarla) */
let lS=0;
function homeLCel(){const l=lLista(),G=l.flat();if(lS>=G.length)lS=0;lI=Math.floor(lS/3);const g=l[lI]||l[0];
  return `<section class="n-sec" id="n-sec" aria-label="Lo nuevo"><div class="n-fila" id="n-fila" tabindex="0" aria-label="Prendas nuevas, desliza para ver más">${G.map((x,k)=>{const q=ID[x.id];return `<a class="n-s" href="${ir("prenda/"+q.id)}" aria-label="${q.n}" style="--f:${x.f};--t:${x.t}">${k===0?'<h1 class="n-t">Lo nuevo</h1>':'<span class="n-t" aria-hidden="true">Lo nuevo</span>'}<span class="n-g">${imgC(q)}</span><span class="n-tx"><b>${q.n}</b><small>${sol(q.p)}</small></span></a>`}).join("")}</div><div class="n-bar"><div class="n-mar">${l.map((_,a)=>`<button data-ng="${a}" aria-label="Ver el outfit ${a+1} de ${l.length}">${[0,1,2].map(b=>`<i class="${a*3+b===lS?"on":""}"></i>`).join("")}</button>`).join("")}</div><div class="n-tot" id="n-tot">${nTot(g)}</div><button class="btn claro" id="l-arma">${ICO_OUT}<span>Arma tu outfit</span></button></div></section>`}
function nTot(g){const d=lDonde(g);return `<b>${sol(lTot(g))}</b><small>${d.length?(dondeSiFalta(d)?`Este outfit, en ${dondeSiFalta(d)}`:"Este outfit"):"Este outfit, en distintas tiendas"}</small>`}
function nEnlaza(){const fi=document.getElementById("n-fila");if(!fi)return;const ancho=()=>fi.firstElementChild.offsetWidth;fi.scrollLeft=lS*ancho();let t=0;
  const lee=()=>{const k=Math.min(fi.children.length-1,Math.round(fi.scrollLeft/ancho()));if(k===lS)return;lS=k;const a=Math.floor(k/3);if(a!==lI){lI=a;document.getElementById("n-tot").innerHTML=nTot(lLista()[a])}document.querySelectorAll(".n-mar i").forEach((i,n)=>i.classList.toggle("on",n===k))};
  fi.addEventListener("scroll",()=>{cancelAnimationFrame(t);t=requestAnimationFrame(lee)},{passive:true})}
/* Computadora: «Lo nuevo» cruza los tres paneles; cada panel lo muestra con su color */
function homeL(){if(lEsCel())return homeLCel()+lDebajo();const l=lLista();if(lI>=l.length)lI=0;const a=l[lI];
  return `<section class="l-sec" id="l-sec" aria-label="Lo nuevo"><div class="l-tri">${a.map((x,n)=>`<a class="l-p" data-lp="${n}" href="${ir("prenda/"+x.id)}" aria-label="${ID[x.id].n}" style="--n:${n};--f:${x.f};--t:${x.t}">${n===0?'<h1 class="l-t2">Lo nuevo</h1>':'<span class="l-t2" aria-hidden="true">Lo nuevo</span>'}${l.map((g,k)=>`<span class="l-im ${k===lI?"on":""}">${imgC(ID[g[n].id])}</span>`).join("")}<span class="l-tx">${lTx(ID[x.id])}</span></a>`).join("")}</div><div class="l-bar"><div class="l-iz"><div class="k-marcas l-marcas">${l.map((g,k)=>`<button data-lg="${k}" aria-label="Ver el outfit ${k+1} de ${l.length}" aria-current="${k===lI}"></button>`).join("")}<button class="l-pausa" id="l-pausa" aria-label="${lParo?"Reanudar":"Pausar"} el cambio de prendas">${LICO(lParo)}</button></div><span class="l-fr" id="l-fr">${lFrase(a)}</span></div><span class="l-acc"><a class="ver" href="${ir("lista/nuevo")}">Ver todo lo nuevo</a><button class="btn claro" id="l-arma">${ICO_OUT}<span>Arma tu outfit</span></button></span></div></section>`+lDebajo()}
function lPinta(){const se=document.getElementById("l-sec");if(!se)return;const l=lLista(),a=l[lI];
  se.querySelectorAll("[data-lp]").forEach((pa,n)=>{const x=a[n],p=ID[x.id];pa.style.setProperty("--f",x.f);pa.style.setProperty("--t",x.t);pa.setAttribute("href",ir("prenda/"+p.id));pa.setAttribute("aria-label",p.n);pa.querySelectorAll(".l-im").forEach((im,k)=>im.classList.toggle("on",k===lI));pa.querySelector(".l-tx").innerHTML=lTx(p)});
  se.querySelectorAll("[data-lg]").forEach((b,k)=>b.setAttribute("aria-current",k===lI));se.querySelector("#l-fr").innerHTML=lFrase(a)}
function lAnda(){clearTimeout(window.lReloj);if(lParo||matchMedia("(prefers-reduced-motion: reduce)").matches)return;window.lReloj=setTimeout(()=>{if(!document.getElementById("l-sec"))return;lI=(lI+1)%lLista().length;lPinta();lAnda()},6000)}
/* El título queda quieto en la pantalla aunque los paneles cambien de ancho: cada panel solo muestra su tramo, con su color */
function lTitulo(se){window.lObs?.disconnect();const tri=se.querySelector(".l-tri"),ps=[...tri.querySelectorAll(".l-p")];const ajusta=()=>{const r=tri.getBoundingClientRect();ps.forEach(p=>{const t=p.querySelector(".l-t2");t.style.left=(r.left-p.getBoundingClientRect().left)+"px";t.style.width=r.width+"px"})};ajusta();window.lObs=new ResizeObserver(ajusta);ps.forEach(p=>window.lObs.observe(p));window.lObs.observe(tri)}
function lEnlaza(){const se=document.getElementById("l-sec");if(!se)return;lTitulo(se);const quieto=()=>clearTimeout(window.lReloj);se.addEventListener("pointerenter",quieto);se.addEventListener("pointerleave",lAnda);se.addEventListener("focusin",quieto);se.addEventListener("focusout",lAnda);
  const tri=se.querySelector(".l-tri");let x0=null,y0=0;tri.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;clearTimeout(window.lReloj)},{passive:true});
  tri.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.4){const n=lLista().length;lI=(lI+(dx<0?1:n-1))%n;lPinta()}lAnda()},{passive:true});lAnda()}

/* M · El detalle */
function homeM(){const p=ID["858c77d5"];return `<section class="m-sec" aria-label="Lo nuevo"><a class="m-iz" href="${ir("prenda/"+p.id)}" aria-label="${p.n}"><img src="${BASE+p.f[0]}" alt=""><h1 class="m-t">Lo nuevo</h1></a><div class="m-de"><a class="m-g" href="${ir("prenda/"+p.id)}" aria-label="${p.n}">${imgC(p)}</a><div class="m-tx"><a class="m-nom" href="${ir("prenda/"+p.id)}">${p.n}</a><span class="m-pr">${precioNota(p)}</span><div class="m-acc"><a class="btn" href="${ir("arma")}">${ICO_OUT}<span>Arma tu outfit</span></a><a class="ver" href="${ir("lista/nuevo")}">Ver todo lo nuevo</a></div></div></div></section>`}

function clicksPortada(e){
  const m=e.target.closest("[data-k]");if(m){e.preventDefault();kParo=true;clearTimeout(window.kReloj);kI=+m.dataset.k;kPinta();return}
  const ng=e.target.closest("[data-ng]");if(ng){const fi=document.getElementById("n-fila");fi.scrollTo({left:+ng.dataset.ng*3*fi.firstElementChild.offsetWidth,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  const lg=e.target.closest("[data-lg]");if(lg){lParo=true;clearTimeout(window.lReloj);lI=+lg.dataset.lg;lPinta();const pb=document.getElementById("l-pausa");pb.innerHTML=LICO(true);pb.setAttribute("aria-label","Reanudar el cambio de prendas");return}
  const lp=e.target.closest("#l-pausa");if(lp){lParo=!lParo;lp.innerHTML=LICO(lParo);lp.setAttribute("aria-label",`${lParo?"Reanudar":"Pausar"} el cambio de prendas`);if(lParo)clearTimeout(window.lReloj);return}
  if(e.target.closest("#l-arma")){const n={};lLista()[lI].forEach(x=>n[x.s]=x.id);outfit=n;guardar("mq-outfit",outfit);irRuta(ir("arma"))}
}
app.addEventListener("click",clicksPortada);

app.addEventListener("click",clicks);
addEventListener("hashchange",()=>{rutaMem=location.hash||rutaMem;pinta();scrollTo({top:0,behavior:"instant"})});
let anchoAntes=innerWidth;addEventListener("resize",()=>{if((innerWidth<=900)!==(anchoAntes<=900)||(innerWidth<=700)!==(anchoAntes<=700)){anchoAntes=innerWidth;pinta()}});
pinta();
</script>
