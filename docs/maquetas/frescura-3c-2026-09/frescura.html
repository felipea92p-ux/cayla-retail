<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Frescura del piso · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ======================================================================================================
   MAQUETA · Frescura del piso, paso 4 de ADR-0208 (2026-09-28)
   Para que Felipe ELIJA colores y frases antes de construir la pantalla real. El panel «Elige» (tinta,
   abajo a la derecha) NO existe en el ERP: cambia la maqueta en vivo y arma la respuesta
   («colores B, frases A»).
   · Tokens: copia literal de apps/web/app/globals.css (ADR-0169). Ningún color fuera de ellos: los tintes
     son `color-mix(token N %, transparent)`, igual que `bg-verde/15` de Tailwind.
   · Orden de pantalla (Inventario, ADR-0220): EncabezadoPagina → filtros y tabla en UNA tarjeta → nota.
   · Hoja de detalle: efecto de <Modal variante="hoja"> (ADR-0136): velo con desenfoque, hoja que sube
     18 px y crece, contenido en cascada de 55 ms, salida corta; todo se apaga con movimiento reducido.
   · Combos: sin <select> del navegador (ADR-0209); con más de 8 opciones, buscador.
   · Modelo: lib/frescura-reglas.ts de la rama claude/frescura-3c-lectura (revisión 8).
   TODAS LAS CIFRAS Y PRENDAS SON SIMULADAS.
   ====================================================================================================== */
:root{
  --rojo:#b8412d;--rojo-profundo:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--taupe-profundo:#805c4c;--pizarra:#4c5d6e;--verde:#48603f;--verde-profundo:#44583a;--ambar:#74501a;
  --ambar-profundo:#734f15;--tinta-60:#5b544c;
  --ease-cayla:cubic-bezier(.32,.72,.24,1);--ease-salida:cubic-bezier(.4,0,1,1);
  --shadow-lg:0 18px 44px -14px rgb(26 26 24 / .16);
  --r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:20px;
  /* tintes (bg-x/N de Tailwind) */
  --verde-15:color-mix(in oklab,var(--verde) 15%,transparent);
  --ambar-15:color-mix(in oklab,var(--ambar) 15%,transparent);
  --rojo-10:color-mix(in oklab,var(--rojo) 10%,transparent);
  --pizarra-15:color-mix(in oklab,var(--pizarra) 15%,transparent);
  --taupe-15:color-mix(in oklab,var(--taupe) 15%,transparent);
  --tinta-10:color-mix(in oklab,var(--tinta) 10%,transparent);
  --tinta-35:color-mix(in oklab,var(--tinta) 35%,transparent);
  --tinta-70:color-mix(in oklab,var(--tinta) 70%,transparent);
  --hueso-50:color-mix(in oklab,var(--hueso) 50%,transparent);
  --hueso-85:color-mix(in oklab,var(--hueso) 85%,transparent);
  --sand-40:color-mix(in oklab,var(--sand) 40%,transparent);
  --sand-70:color-mix(in oklab,var(--sand) 70%,transparent);
  --crema-60:color-mix(in oklab,var(--crema) 60%,transparent);
  --lateral:17rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;color:var(--tinta);background:var(--crema);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
a{color:inherit}
.display{font-family:'EB Garamond',ui-serif,Georgia,serif;font-weight:600;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums lining-nums}
.label{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--taupe)}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid color-mix(in oklab,var(--rojo) 60%,transparent);outline-offset:2px;border-radius:6px}

/* ───────── armazón del ERP (lateral + barra) ───────── */
.app{display:grid;grid-template-columns:var(--lateral) minmax(0,1fr);min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;border-right:1px solid var(--sand);padding:22px 14px;overflow:auto;background:var(--crema)}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:600;letter-spacing:.34em;font-size:13px}
.logo i{width:20px;height:16px;border:1.5px solid var(--tinta);border-radius:60% 10% 60% 10%;display:block}
.lateral nav{display:grid;gap:2px}
.lateral a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--tinta-60);font-size:14px;text-decoration:none;cursor:default}
.lateral a.sub{padding-left:38px;font-size:13.5px}
.lateral a.on{background:var(--hueso);color:var(--tinta);font-weight:500}
.lateral a.grupo{color:var(--tinta);font-weight:500}
.barra{height:60px;border-bottom:1px solid var(--sand);display:flex;align-items:center;gap:14px;padding:0 32px;justify-content:flex-end}
.barra .menu{display:none}
.sede-sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sand);border-radius:var(--r-md);padding:5px 11px;font-size:11px;letter-spacing:.12em;font-weight:600;background:var(--papel)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--taupe)}
.main{padding:34px 32px 140px;max-width:1240px}

/* ───────── EncabezadoPagina ───────── */
.enc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 40px}
.enc-izq{min-width:0;flex:1 1 340px}
.hilo{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe-profundo)}
.hilo:before{content:"";display:block;width:32px;height:1px;background:var(--taupe);flex:none;transform-origin:left;animation:dibuja 1.1s var(--ease-cayla) .25s backwards}
h1.titulo{font-family:'EB Garamond',ui-serif,Georgia,serif;font-weight:600;font-size:46px;line-height:1;letter-spacing:-.01em;margin-top:12px}
.frase{margin-top:10px;max-width:30rem;font-size:15px;color:var(--tinta-60)}
.pie-enc{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--taupe)}
.pie-enc b{color:var(--tinta);font-weight:600}
.sube{animation:sube .85s var(--ease-cayla) backwards;animation-delay:calc(var(--i,0)*70ms + 80ms)}
@keyframes sube{from{opacity:0;transform:translate3d(0,16px,0)}}
@keyframes dibuja{from{transform:scaleX(0)}}

/* ResumenSede (sin sombra: va pegado al fondo) */
.resumen{flex:none;border-radius:var(--r-2xl);background:color-mix(in oklab,var(--papel) 70%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--tinta) 7%,transparent);display:flex}
.resumen>*{position:relative;flex:1 1 0;min-width:6.4rem;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 10px}
.resumen>*+*:before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:linear-gradient(to bottom,transparent,color-mix(in oklab,var(--tinta) 20%,transparent),transparent)}
.resumen button{margin:4px;border-radius:16px;transition:background-color .2s}
.resumen button:hover,.resumen button[aria-pressed=true]{background:color-mix(in oklab,var(--hueso) 70%,transparent)}
.cifra-v{font-family:'EB Garamond',serif;font-weight:600;font-size:42px;line-height:1;white-space:nowrap}
.cifra-v small{font-size:22px;margin-left:1px}
.cifra-pre{font-size:11px;color:var(--taupe);height:15px;line-height:15px;margin-bottom:2px}
.cifra-l{margin-top:8px;font-size:12px;line-height:1.25;color:var(--tinta-60);display:flex;align-items:center;justify-content:center;gap:5px;max-width:7.5rem}
.cifra-v .suf{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--taupe);margin-left:4px}
.cifra-l svg{width:14px;height:14px;color:var(--taupe)}
.cifra-v.alerta{color:var(--ambar-profundo)}.cifra-l.alerta{color:var(--ambar-profundo);font-weight:600}.cifra-l.alerta svg{color:currentColor}
.cifra-v.roja{color:var(--rojo)}.cifra-l.roja{color:var(--rojo-profundo);font-weight:600}.cifra-l.roja svg{color:currentColor}

/* ───────── Chip (insignia con punto) ───────── */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:12.5px;line-height:20px;white-space:nowrap;background:var(--sand);color:var(--taupe)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.sin-punto:before{display:none}
.chip.verde{background:var(--verde-15);color:var(--verde-profundo)}
.chip.ambar{background:var(--ambar-15);color:var(--ambar-profundo)}
.chip.rojo{background:var(--rojo-10);color:var(--rojo-profundo)}
.chip.pizarra{background:var(--pizarra-15);color:var(--pizarra)}
.chip.neutro{background:var(--sand);color:var(--taupe)}
.chip.hueso{background:var(--hueso);color:var(--tinta)}
.chip.contorno{background:transparent;box-shadow:inset 0 0 0 1px var(--sand);color:var(--taupe)}
.chip.contorno-punteado{background:transparent;border:1px dashed color-mix(in oklab,var(--taupe) 55%,transparent);color:var(--taupe);padding:0 9px}
.chip.chico{font-size:11.5px;padding:0 8px;line-height:18px}

/* ───────── botones y controles ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);border:1px solid transparent;padding:8px 16px;font-size:13.5px;font-weight:500;line-height:1.25;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn-chico{padding:5px 12px;font-size:12.5px}
.btn-primario{background:var(--tinta);color:var(--crema)}.btn-primario:hover{background:var(--rojo-profundo)}
.btn-secundario{color:var(--tinta);border-color:var(--sand)}.btn-secundario:hover{border-color:color-mix(in oklab,var(--taupe) 40%,transparent);background:color-mix(in oklab,var(--sand) 50%,transparent)}
.btn-sutil{color:var(--taupe);border-color:var(--sand)}.btn-sutil:hover{color:var(--tinta);background:color-mix(in oklab,var(--sand) 30%,transparent)}
.btn-enlace{padding:0;color:var(--tinta);text-decoration:underline;text-underline-offset:2px}.btn-enlace:hover{color:var(--taupe)}
.pildora{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--sand);padding:5px 14px;font-size:13px;font-weight:600;color:var(--taupe);white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.pildora:hover{color:var(--tinta);background:var(--sand-40)}
.pildora[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.pildora .n{font-weight:500;opacity:.8}
.caja{background:var(--hueso);border:1px solid var(--sand);border-radius:var(--r-md);transition:border-color .15s}
.caja:focus-within{border-color:color-mix(in oklab,var(--taupe) 55%,transparent)}
.buscar{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;flex:1 1 220px;min-width:0;max-width:340px}
.buscar input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:14px}
.buscar input::placeholder{color:var(--taupe)}
.buscar svg{color:var(--taupe)}

/* Desplegable (sin <select>) */
.combo{position:relative}
.combo>button{height:38px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;min-width:170px;justify-content:space-between}
.combo>button .que{color:var(--taupe);font-size:12px}
.combo>button svg{color:var(--taupe);width:14px;height:14px}
.lista{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:240px;background:var(--papel);border:1px solid var(--sand);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:6px;animation:revelar 240ms var(--ease-cayla) both}
@keyframes revelar{from{opacity:0;transform:translate3d(0,-3px,0)}}
.lista .busca{display:flex;align-items:center;gap:6px;margin:2px 2px 6px;padding:0 10px;height:34px}
.lista .busca input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13px}
.lista [role=option]{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:7px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.lista [role=option]:hover,.lista [role=option].act{background:color-mix(in oklab,var(--tinta) 4%,transparent)}
.lista [role=option][aria-selected=true]{font-weight:600}
.lista [role=option] .n{color:var(--taupe);font-size:12px;font-weight:400}
.lista .grupo-op{padding:8px 10px 3px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.lista .vacio{padding:8px 10px;color:var(--taupe);font-size:13px}

/* ───────── tarjeta con filtros y tabla ───────── */
.tarjeta{margin-top:30px;background:var(--papel);border:1px solid var(--sand);border-radius:var(--r-xl);overflow:hidden}
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 20px}
.herr .der{margin-left:auto;display:flex;gap:10px;align-items:center}
.d5{display:flex;align-items:flex-start;gap:8px;padding:0 20px 14px;font-size:13px;color:var(--taupe)}
.d5 svg{margin-top:2px;color:var(--taupe)}
.d5 b{color:var(--tinta);font-weight:600}

.grupo-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:16px 20px 12px;border-top:1px solid var(--sand);background:var(--papel)}
.grupo-cab h2{font-family:'EB Garamond',serif;font-weight:600;font-size:22px;line-height:1.1}
.grupo-cab h2 .n{font-family:'DM Sans';font-size:12.5px;font-weight:500;color:var(--taupe);margin-left:6px}
.grupo-cab .comp{flex:1 1 420px;font-size:13.5px;color:var(--tinta)}
.grupo-cab .cayla{flex-basis:100%;font-size:12.5px;color:var(--taupe);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.escala{flex-basis:100%;display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.escala span{font-size:11.5px;color:var(--taupe)}
.escala span b{font-weight:600;color:var(--tinta)}

.cols{grid-template-columns:minmax(170px,1.4fr) 124px 70px minmax(118px,.9fr) minmax(110px,.9fr) 50px minmax(140px,1.2fr);column-gap:14px}
.desliza{overflow-x:auto;scrollbar-width:thin}
.desliza .cols{min-width:868px}
.enc-tabla{display:grid;padding:8px 20px;background:var(--sand-70);font-size:12.5px;color:var(--taupe)}
.enc-tabla span small{display:block;font-size:10.5px;line-height:1.2}
.enc-tabla .der,.fila .der{text-align:right}
.fila{display:grid;align-items:start;padding:12px 20px;border-top:1px solid var(--sand);cursor:pointer;transition:background-color .15s;position:relative}
.filas>.fila:nth-child(even){background:var(--hueso-50)}
.fila:hover{background:var(--crema-60)!important}
.fila:focus-visible{outline-offset:-2px;border-radius:0}
.fila.quieta:after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--tinta-35)}
.prenda{display:flex;gap:10px;min-width:0}
.foto{width:34px;height:42px;border-radius:7px;background:var(--hueso);flex:none;display:grid;place-items:center;color:var(--taupe)}
.foto svg{width:18px;height:18px;stroke-width:1.3}
.prenda .n{font-weight:600;font-size:14px;line-height:1.3}
.prenda .m{font-size:12.5px;color:var(--taupe);line-height:1.35}
.prenda .chips{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center}
.prenda .chips .aux{font-size:11.5px;color:var(--taupe)}
.tallas{display:flex;flex-wrap:wrap;gap:4px}
.tl{display:inline-flex;flex-direction:column;align-items:center;min-width:38px;padding:3px 4px;border-radius:7px;background:var(--hueso);font-size:11.5px;line-height:1.25}
.filas>.fila:nth-child(even) .tl{background:var(--sand)}
.tl b{font-weight:600;font-size:10.5px;color:var(--taupe)}
.tl .q{font-variant-numeric:tabular-nums}
.tl .ap{font-size:10px;color:var(--taupe);font-weight:600}
.tl.mal{box-shadow:inset 0 0 0 1px var(--tinta-35)}
.tl.mal .q{font-weight:700}
.dias{font-size:14px;white-space:nowrap}
.dias b{font-family:'EB Garamond',serif;font-size:20px;font-weight:600;line-height:1}
.dias .pre,.dias .suf{display:block;font-size:11px;color:var(--taupe);line-height:1.3;white-space:normal}
.dias.apagado b{color:var(--taupe)}
.rap .w{font-size:13.5px;line-height:1.35}
.rap .d{font-size:12px;color:var(--taupe)}
.rap .chip{margin-top:4px}
.vend{font-size:14px;text-align:right}
.vend small{display:block;font-size:11px;color:var(--taupe);line-height:1.2}
.sug{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.sug .s{font-size:13px;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.sug .s svg{width:14px;height:14px;margin-top:2px;color:var(--taupe);flex:none}
.sug .nada{font-size:12.5px;color:var(--taupe)}
.mob{display:none}
.rap .mob{display:none}
.pie{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:11px 20px;border-top:1px solid var(--sand);font-size:12.5px;color:var(--taupe)}
.pie .ley{display:flex;flex-wrap:wrap;gap:4px 14px}
.pie b{color:var(--tinta);font-weight:600}
.vacio-tabla{padding:28px 20px;border-top:1px solid var(--sand);color:var(--tinta-60);font-size:14px}

.nota{margin-top:18px;background:var(--hueso-85);border-radius:var(--r-xl);padding:14px 18px;font-size:13px;line-height:1.6;color:var(--taupe)}
.nota b{color:var(--tinta);font-weight:600}
.nota p+p{margin-top:6px}

/* ───────── ESTADOS por opción de color ───────── */
/* A · semáforo cálido: verde → neutro → ámbar → rojo profundo SOLO en texto */
[data-colores=A] .t-nueva{background:var(--verde-15);color:var(--verde-profundo)}
[data-colores=A] .t-vigente{background:var(--sand);color:var(--taupe)}
[data-colores=A] .t-envejecida{background:var(--ambar-15);color:var(--ambar-profundo)}
[data-colores=A] .t-critica{background:transparent;color:var(--rojo-profundo);font-weight:600;padding-left:2px}
/* B · sobrio: tinta / pizarra / taupe; el rojo solo en Crítica (su tinte) y una vez en la cifra */
[data-colores=B] .t-nueva{background:transparent;box-shadow:inset 0 0 0 1px var(--tinta-35);color:var(--tinta)}
[data-colores=B] .t-vigente{background:var(--sand);color:var(--taupe)}
[data-colores=B] .t-envejecida{background:var(--pizarra-15);color:var(--pizarra);font-weight:600}
[data-colores=B] .t-critica{background:var(--rojo-10);color:var(--rojo-profundo);font-weight:600}
.al-menos{border:1px dashed currentColor;padding:0 9px}
.calif{display:block;font-size:11px;line-height:1.35;color:var(--taupe)}
.calif.arriba{margin-bottom:2px}.calif.abajo{margin-top:2px}
[data-colores=A] .t-critica.al-menos{padding-left:9px}
/* especiales: comunes a A y B */
.e-info{background:var(--pizarra-15);color:var(--pizarra)}
.e-clasico{background:var(--hueso);color:var(--tinta)}
.e-dudosa{background:transparent;box-shadow:inset 0 0 0 1px var(--tinta-35);color:var(--tinta);font-weight:600}
/* texto en tinta: el taupe sobre su propio tinte baja a 4,16:1 en las filas con cebra; el punto sigue en taupe */
.e-apartada{background:var(--taupe-15);color:var(--tinta);font-weight:600}
.e-apartada:before{background:var(--taupe)}
.previo{display:block;font-size:11.5px;color:var(--taupe);margin-top:3px}
/* en la celda de estado el chip puede partirse en dos líneas: la columna es angosta y el nombre no se corta */
.c-estado .chip{white-space:normal;align-items:flex-start;line-height:1.35;padding-top:2px;padding-bottom:2px;border-radius:11px}
.c-estado .chip:before{margin-top:6px}
.c-estado .chip svg{margin-top:2px}

const piso=p=>p.tallas.reduce((s,t)=>s+t[1],0);
const alm=p=>p.tallas.reduce((s,t)=>s+t[2],0);
const apart=p=>p.tallas.reduce((s,t)=>s+t[3],0);
const quieta=p=>['wayra','nazca','inti','illari'].includes(p.id); // estaQuieta(): vieja y lenta, o temporada pasada con piso
P.forEach(p=>{p.quieta=quieta(p)});
function cifras(){
  let uds=0,peso=0,suma=0,alMenos=false,nuevas=0,conTramo=0,porDecidir=0;
  for(const p of P){
    if(p.quieta)porDecidir++;
    const n=piso(p); if(n<=0)continue; uds+=n;
    if(p.estado.tipo==='clasico'||p.estado.tipo==='dudosa')continue;
    peso+=n; suma+=n*p.dias; if(p.relojAlMenos)alMenos=true;
    if(p.estado.tipo==='semaforo'){conTramo+=n; if(p.estado.tramo==='nueva')nuevas+=n}
  }
  return {uds,edad:Math.round(suma/peso),alMenos,pctNuevas:Math.round(nuevas/conTramo*100),porDecidir};
}

function estadoHTML(p){

  if(e.tipo==='semaforo'){

    return `<span class="barra-edad ${e.tramo==='critica'?'critica':''}">${seg(n,e.alMenos&&n<4)}<span class="et">${et}</span></span>`;

}

function confianzaChip(nivel){

const OP_CAT=[['todas','Todas'],...Object.entries(CATS).map(([k,c])=>[k,c.nombre])];
const OP_EST=[['todos','Todos',''],['nueva','Nueva','Tramo'],['vigente','Vigente','Tramo'],['envejecida','Envejecida','Tramo'],['critica','Crítica','Tramo'],
  ['sin_tramo','Sin tramo firme','Otros'],['clasico','Clásicos','Otros'],['dudosa','No cuadra','Otros'],['apartada','Apartadas','Otros'],['temporada_pasada','Temporada pasada','Temporada']];
function pasaEstado(p,e){
  if(e==='todos')return true;
  if(e==='apartada')return !!p.apartada;
  if(e==='temporada_pasada')return !!p.temporadaPasada;
  if(e==='clasico')return p.estado.tipo==='clasico';
  if(e==='dudosa')return p.estado.tipo==='dudosa';
  if(e==='sin_tramo')return ['sin_ventas_sede','sin_vara','sin_edad_conocida'].includes(p.estado.tipo)||(p.estado.tipo==='semaforo'&&p.estado.alMenos);
  return p.estado.tipo==='semaforo'&&!p.apartada&&p.estado.tramo===e;
}
const sinTildes=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const visibles=()=>P.filter(p=>(S.cat==='todas'||p.cat===S.cat)&&pasaEstado(p,S.estado)&&(!S.porDecidir||p.quieta)&&(!S.q||sinTildes(`${p.n} ${p.color} ${p.cod}`).includes(sinTildes(S.q))));

function combo(id,etiqueta,ops,valor){
  const v=ops.find(o=>o[0]===valor);

}
function listaCombo(id){
  const ops=id==='cat'?OP_CAT:OP_EST,val=id==='cat'?S.cat:S.estado;
  const buscar=ops.length>8; // ADR-0209: más de 8 opciones → buscador
  const q=S['q_'+id]||'';
  const filtradas=ops.filter(o=>!q||sinTildes(o[1]).includes(sinTildes(q)));
  let html='',grupo=null;
  for(const o of filtradas){
    if(o[2]&&o[2]!==grupo){grupo=o[2];html+=`<div class="grupo-op">${grupo}</div>`}
    const n=id==='cat'?(o[0]==='todas'?P.length:P.filter(p=>p.cat===o[0]).length):P.filter(p=>pasaEstado(p,o[0])).length;
    html+=`<div role="option" tabindex="-1" aria-selected="${o[0]===val}" data-op="${o[0]}">${o[1]}<span class="n">${n}</span></div>`;
  }
  if(!filtradas.length)html=`<div class="vacio">Nada con «${q}»</div>`;
  return `<div class="lista" role="listbox" aria-label="${id==='cat'?'Categoría':'Estado'}">${buscar?`<label class="busca caja">${ic('buscar','width:14px;height:14px;color:var(--taupe)')}<input data-busca-combo="${id}" placeholder="Buscar estado" value="${q}" aria-label="Buscar estado"></label>`:''}<div data-ops>${html}</div></div>`;
}

function regla(p){
  const c=cat(p),s=p.sinElla;
  if(!s||s.p50==null)return '';
  const tope=Math.max((s.p90??s.tMax)*1.2,p.dias*1.12,30);
  const pct=d=>Math.min(100,d/tope*100);
  const cortes=[['nueva',0,s.p50],['vigente',s.p50,s.p75??s.tMax],['envejecida',s.p75,s.p90??(s.p75!=null?s.tMax:null)],['critica',s.p90,tope]];
  let zonas='',x=0;
  const add=(cls,hasta)=>{if(hasta==null||hasta<=x)return;zonas+=`<i class="${cls}" style="width:${pct(hasta)-pct(x)}%"></i>`;x=hasta};
  add('z-nueva',s.p50);
  add('z-vigente',s.p75??s.tMax);
  if(s.p75!=null)add('z-envejecida',s.p90??s.tMax);
  if(s.p90!=null)add('z-critica',tope); else add('z-nada',tope);
  const marcas=[`<span class="ini" style="left:0">0</span>`,`<span style="left:${pct(s.p50)}%">${s.p50} d<br>la mitad</span>`]
    .concat(s.p75!=null?[`<span style="left:${pct(s.p75)}%">${s.p75} d<br>3 de 4</span>`]:[])
    .concat(s.p90!=null?[`<span style="left:${pct(s.p90)}%">${s.p90} d<br>9 de 10</span>`]:[`<span style="left:${pct(s.tMax)}%">${s.tMax} d<br>lo más largo visto</span>`]);
  const ley=[['z-nueva','Nueva'],['z-vigente','Vigente']].concat(s.p75!=null?[['z-envejecida','Envejecida']]:[]).concat(s.p90!=null?[['z-critica','Crítica']]:[['z-nada','todavía sin datos']]);
  return `<div class="regla" aria-label="Dónde cae entre ${c.demas}">
     <span class="ella" style="left:${pct(p.dias)}%">${p.relojAlMenos?'≥ ':''}${p.dias} d</span>
     <div class="pista">${zonas}</div>
     <div class="marcas">${marcas.join('')}</div>
     <div class="ley">${ley.map(([z,t])=>`<span><i class="${z}"></i>${t}</span>`).join('')}</div>
   </div>`;
}
function porqueEstado(p){
  const c=cat(p),s=p.sinElla,e=p.estado,f=F(),T=TRAMO;
  const d=p.dias;
  if(p.apartada)return `Todo lo que tenía colgado (${apart(p)}) está apartado para clientas. Mientras siga apartado no envejece: su reloj se detuvo en <b>${d} días</b>, cuando iba en ${T[e.tramo]}, y sigue desde ahí si alguna se libera. Esas ${apart(p)} cuentan como vendidas.`;
  if(e.tipo==='dudosa')return `El stock de la talla <b>${p.tallaMal}</b> no cuadra: el sistema la tiene en <b>−1</b> en el piso (se vendió una que no figuraba colgada). Con los números así, cualquier juicio sería inventado: no se mide hasta que se cuente.`;
  if(e.tipo==='clasico')return `Es un clásico de verano: no pasa de moda, así que no entra al semáforo de novedad ni se compara con ${c.demas}. Lleva ${d} días colgado. Hoy no es su estación: vuelve el <b>${p.vuelve}</b>.`;
  if(e.tipo==='sin_ventas_sede')return `Ningún ${c.plural.replace(/s$/,'')} con fecha de llegada conocida se vendió todavía en ${SEDE.nombre}: no hay con qué compararlo. Lleva <b>${d} días</b> colgado. Como apoyo, en CAYLA (las 3 tiendas) la mitad de los ${c.plural} se vende antes de ${c.cayla.p50} días.`;
  if(e.tipo==='sin_vara')return `La cabecera dice que la mitad de ${c.art} ${c.plural} se vende antes de ${c.p50} días, pero eso lo hace ella: <b>${p.suyas} de las ${c.vendidas} ventas son suyas</b>. Sin ella, ${c.demas} vendieron ${s.vendidas} de ${s.unidades} en ${s.tMax} días: todavía no hay con qué medirla. Lleva ${d} días colgada.`;
  if(e.tipo==='sin_edad_conocida')return `Vino en la carga inicial, así que no se sabe cuándo llegó de verdad: lleva <b>al menos ${d} días</b>. Todavía no pasa los ${s.p50} días en que ya se vendió la mitad de ${c.demas}, pero no se puede decir que sea nueva.`;
  // semáforo
  let base;
  if(e.tramo==='nueva')base=`Lleva <b>${d} días</b>: todavía no llega a los ${s.p50} en que ya se vendió la mitad de ${c.demas}.`;
  if(e.tramo==='vigente')base=`Lleva <b>${d} días</b>: pasó los ${s.p50} en que se vende la mitad de ${c.demas}`+(s.p75!=null?`, pero no los ${s.p75} en que ya se vendieron 3 de cada 4.`:'.');
  if(e.tramo==='envejecida')base=`Lleva <b>${d} días</b>: pasó los ${s.p75} en que ya se vendieron 3 de cada 4 de ${c.demas}`+(s.p90!=null?`; a los ${s.p90} se vendieron 9 de cada 10.`:'.');
  if(e.tramo==='critica')base=`Lleva <b>${d} días</b>: pasó los ${s.p90} en que ya se vendieron 9 de cada 10 de ${c.demas} de ${SEDE.nombre}.`;
  if(e.alMenos&&p.relojAlMenos)base+=` Vino en la carga inicial: esos ${d} días son lo que se sabe, puede llevar más. Por eso es «${f.alMenos.pre?f.alMenos.pre+' '+T[e.tramo]:T[e.tramo]+' '+f.alMenos.suf}» y nunca «Nueva».`;
  else if(e.alMenos){const sig=e.tramo==='vigente'?'Envejecida':'Crítica';base+=` Lo más largo que se vio de ${c.demas} en ${SEDE.nombre} son ${s.tMax} días, y ella ya los pasó: todavía no hay ventas para saber dónde empieza ${sig}. Por eso es «${f.alMenos.pre?f.alMenos.pre+' '+T[e.tramo]:T[e.tramo]+' '+f.alMenos.suf}».`}
  return base;
}
function porqueRapidez(p){
  const c=cat(p),r=p.rapidez;
  if(!r){
    if(p.estado.tipo==='clasico'||p.estado.tipo==='dudosa')return '';
    if(p.carga)return `Sin dato de rapidez: vino en la carga inicial y no se sabe qué edad tenía lo que vendió.`;
    return `Sin dato de rapidez: su categoría no vendió nada aquí con qué compararla.`;
  }
  const v=r.vendidas,e=fmt(r.esperadas);
  const cuanto=r.indice>=250?'más del doble de':r.indice>=180?'casi el doble de':r.indice>=115?'más de':r.indice>=90?'lo mismo que':r.indice>=45?'menos de':'mucho menos de';
  const conf=nivelPor(r.referencia);
  const confTxt=conf==='solido'?'':` Se midió contra solo ${r.referencia} ${r.referencia===1?'venta':'ventas'} de ${c.demas}: <span class="chip ${conf==='pocos_datos'?'ambar':'neutro'} chico">${conf==='pocos_datos'?'Pocos datos':'Aceptable'}</span>`;
  return `Vendió <b>${v} de las ${e}</b> que se esperaban para ${c.uno} con sus mismos días colgada: ${cuanto} lo que ${c.f?'venden':'venden'} ${c.demas}.${p.recientesApartadas?` Las ${p.recientesApartadas} son apartados: puede estar entre las que mejor se venden sin una sola boleta.`:''}${confTxt}`;
}
function porqueRecientes(p){
  if(p.recientes==null)return '';
  const dias=Math.min(p.dias??30,30);
  const txt=p.dias!=null&&p.dias<30?`En sus ${p.dias} días en el piso vendió <b>${p.recientes}</b>`:`En sus últimos 30 días en el piso vendió <b>${p.recientes}</b>`;
  return `${txt}${p.recientesApartadas?`, contando ${p.recientesApartadas} apartadas`:''}.${p.recientes===0&&p.dias>=30?' Son días con algo colgado: lo que estuvo agotado o guardado no cuenta.':''}`;
}
const EXPLICA={
  revisar_ventas:p=>({p:`En sus últimos 30 días en el piso no se vendió ninguna. Antes de moverla, mira si está a la vista, si tiene sus tallas y su etiqueta de precio.`,ir:[['Ver sus ventas',`/vender/historial?prenda=${p.cod}`]]}),
  cambiar_lugar:p=>({p:`Lleva más tiempo colgada del que tardan ${cat(p).demas} y se vende menos que ${cat(p).f?'ellas':'ellos'}. Pruébala 7 días en la entrada, en un maniquí o en una mesa; cambiarla de lugar no cuesta nada.`,ir:[['Verla en Existencias',`/inventario?q=${p.cod}`]]}),
  trasladar:p=>({p:`Tienes ${alm(p)} en el almacén de ${SEDE.nombre}. La comparación es sólida (${p.rapidez.referencia} ventas de ${cat(p).demas} aquí). En otra sede podría venderse antes: mira allá cómo va su categoría antes de mandarla.`,ir:[['Armar un traslado',`/inventario/mover?variante=${p.cod}`]]}),
  retirar:p=>({p:`Su estación terminó el ${p.finEstacion}. Retirarla con motivo «fin de temporada» deja de pedir que la repongas y le hace lugar a lo nuevo.`,ir:[['Retirar del piso',`/inventario (Retirar del piso · fin de temporada)`]]}),
  sigue_vendiendo:p=>({p:`Su temporada pasó (su ${p.estacion} terminó el ${p.finEstacion}), pero sigue vendiendo: ${p.recientes} en sus últimos 30 días en el piso. Tú decides si la dejas hasta que se agote o la retiras. Mientras siga colgada, sigue en «Por decidir».`,ir:[['Retirar del piso',`/inventario (Retirar del piso · fin de temporada)`]]}),
  guardar_hasta_su_estacion:p=>({p:`Es un clásico de verano: no envejece, pero fuera de su estación ocupa percha. Vuelve a lucir desde el ${p.vuelve}.`,ir:[['Retirar del piso',`/inventario (Retirar del piso · cambio de exhibición)`]]}),
};
function detalleHTML(p){
  const c=cat(p),f=F();
  const temp=p.temporadaPasada?`<span class="chip ambar chico tp">Temporada pasada</span> <span style="color:var(--taupe);font-size:12.5px">${f.tp(p)}</span>`:p.temporada===null?`<span class="chip contorno-punteado chico sin-punto">${f.sinTemp}</span>`:`<span style="color:var(--taupe);font-size:12.5px">${p.temporada}</span>`;
  const conf=c.nivel?confianzaChip(c.nivel):'';
  const sug=p.sug.length?`<div class="bloque"><span class="label">Qué puedes hacer</span><div class="acciones-h">${p.sug.map(s=>{const x=EXPLICA[s](p);return `<div class="acc"><div class="t">${ic(ICONO_SUG[s])}<span>${F().sug[s](p)}</span></div><p>${x.p}</p><div class="ir">${x.ir.map(([t,h])=>`<button class="btn btn-secundario btn-chico" data-ir="${h}" data-que="${t}">${t}</button>`).join('')}</div></div>`}).join('')}</div><p class="parrafo taupe">Son preguntas, no órdenes: la decisión es tuya. Aquí no se rebaja nada.</p></div>`
    :p.estado.tipo==='dudosa'?`<div class="bloque"><span class="label">Qué puedes hacer</span><div class="acc"><div class="t">${ic('contar')}<span>Contar sus tallas</span></div><p>Un conteo de esta prenda corrige el piso y vuelve a medirla desde el día siguiente.</p><div class="ir"><button class="btn btn-secundario btn-chico" data-ir="/inventario/conteo?nuevo=1&producto=${p.cod}" data-que="Contar esta prenda">Contar esta prenda</button></div></div></div>`
    :`<div class="bloque"><span class="label">Qué puedes hacer</span><p class="parrafo" style="margin-top:0">${p.apartada?'Nada: tiene dueña. Vuelve a medirse si alguna se libera.':'Nada por ahora.'}</p></div>`;
  const estadoGrande=S.colores==='C'?barraEdad(p):estadoHTML(p);
  return `<div class="velo" data-cerrar></div>
  <div class="capa"><div class="hoja cascada" role="dialog" aria-modal="true" aria-labelledby="hoja-t" aria-describedby="hoja-b" tabindex="-1">
    <h2 id="hoja-t">${p.n} · ${p.color}</h2>
    <p class="bajada" id="hoja-b">${p.cod} · ${c.nombre} en ${SEDE.nombre} · ${temp}</p>
    <div class="bloque">
      <div class="veredicto">${p.dias!=null?`<span class="dias-g num">${p.relojAlMenos?'≥ ':''}${p.dias}<small>días en el piso${p.apartada?' · '+f.pausa:''}</small></span>`:''}${estadoGrande}</div>
      <p class="parrafo">${porqueEstado(p)}</p>
      ${regla(p)}
      ${p.sinElla?`<div class="d5-hoja">${ic('info')}<span><b>${f.d5}</b> ${p.sinElla.p50!=null?`Sin contarla, ${c.demas}: la mitad se vende antes de ${p.sinElla.p50} días${p.sinElla.p75!=null?`, 3 de cada 4 antes de ${p.sinElla.p75}`:''}${p.sinElla.p90!=null?`, 9 de cada 10 antes de ${p.sinElla.p90}`:''} (la cabecera de ${c.nombre}, con todas: ${c.p50}${c.p75!=null?`, ${c.p75}`:''}${c.p90!=null?` y ${c.p90}`:''}).`:''} ${conf?`Con ${c.vendidas} ventas en ${SEDE.nombre}: ${conf}`:''}</span></div>`:''}
    </div>
    <div class="bloque"><span class="label">Cómo se vende</span>
      ${porqueRapidez(p)?`<p class="parrafo" style="margin-top:0">${porqueRapidez(p)}</p>`:''}
      ${porqueRecientes(p)?`<p class="parrafo">${porqueRecientes(p)}</p>`:''}
      ${!porqueRapidez(p)&&!porqueRecientes(p)?`<p class="parrafo taupe" style="margin-top:0">No se mide.</p>`:''}
    </div>
    <div class="bloque"><span class="label">Tallas en ${SEDE.nombre}</span>
      <div class="tallas-g">${p.tallas.map(([t,pi,al,ap])=>`<div class="${pi<0?'mal':''}"><b>${t}</b><span>Piso</span> ${pi<0?'−'+Math.abs(pi):pi}<br><span>Almacén</span> ${al}${ap?`<br><span>Apartadas</span> ${ap}`:''}</div>`).join('')}</div>
    </div>
    ${sug}
    <div class="bloque"><span class="label">Datos de apoyo</span>
      <dl class="apoyo">
        <dt>Colgada por primera vez en ${SEDE.nombre}</dt><dd>${p.primera}</dd>
        <dt>Llegó a CAYLA</dt><dd>${p.llegadaCayla}</dd>
        <dt>Referencia de CAYLA <span class="chip pizarra chico" style="margin-left:4px">Solo líder</span></dt><dd>La mitad de ${c.art} ${c.plural} se vende antes de ${c.cayla.p50} días en las 3 tiendas juntas${c.cayla.p75!=null?`; 3 de cada 4, antes de ${c.cayla.p75}`:''}.</dd>
      </dl>
    </div>
    <div class="pie-hoja"><button class="btn btn-secundario" data-cerrar>Cerrar</button></div>
  </div></div>`;
}
let ultimoFoco=null;
function abrir(id){
  const p=P.find(x=>x.id===id); if(!p)return;
  S.abierta=id; ultimoFoco=document.activeElement;
  const raiz=document.getElementById('modal-raiz');
  raiz.innerHTML=detalleHTML(p);
  document.body.style.overflow='hidden';
  const hoja=raiz.querySelector('.hoja'); hoja.focus({preventScroll:true});
  pintarElige();
}
function cerrar(){
  if(!S.abierta)return;
  const raiz=document.getElementById('modal-raiz');
  const hoja=raiz.querySelector('.hoja'),velo=raiz.querySelector('.velo');
  const sinMov=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  hoja&&hoja.classList.add('sale'); velo&&velo.classList.add('sale');
  S.abierta=null;
  setTimeout(()=>{raiz.innerHTML='';document.body.style.overflow='';ultimoFoco&&ultimoFoco.focus&&ultimoFoco.focus({preventScroll:true});pintarElige()},sinMov?0:220);
}

/* ════════════════════════════════════════════════════════════════════════════════════════════════════
   PANEL «ELIGE»
   ════════════════════════════════════════════════════════════════════════════════════════════════════ */
function pintarElige(){
  const el=document.getElementById('elige'),c=COLORES[S.colores],fr=FRASES[S.frases];
  const rojos=[...document.querySelectorAll('[data-rojo]')].filter(x=>x.offsetParent!==null&&!x.closest('#elige')).length;
  el.dataset.abierto=String(S.elige);
  el.innerHTML=`<button class="cab" data-act="elige" aria-expanded="${S.elige}"><span class="t">Elige</span><span class="r">colores ${S.colores} · frases ${S.frases}</span>${ic('abajo')}</button>
   <div class="cuerpo">
     <div><h3>Colores de los estados</h3>
       <div class="ops" role="group" aria-label="Colores">${Object.entries(COLORES).map(([k,o])=>`<button aria-pressed="${S.colores===k}" data-colores="${k}"><b>${k}</b><span>${o.nombre}</span></button>`).join('')}</div>
       <div class="gp"><b>Gana</b><span>${c.gana}</span><b>Paga</b><span>${c.paga}</span></div></div>
     <div><h3>Frases</h3>
       <div class="ops" role="group" aria-label="Frases">${Object.entries(FRASES).map(([k,o])=>`<button aria-pressed="${S.frases===k}" data-frases="${k}"><b>${k}</b><span>${o.nombre}</span></button>`).join('')}</div>
       <div class="gp"><b>Gana</b><span>${fr.gana}</span><b>Paga</b><span>${fr.paga}</span></div></div>
     <div class="resp"><output>Tu respuesta: <q>colores ${S.colores}, frases ${S.frases}</q></output><button data-act="copiar">${ic('copiar','width:14px;height:14px;vertical-align:-2px')} Copiar</button></div>
     <p class="rojos">Rojo pleno en pantalla: <b>${rojos} de 2</b> permitidos (los tintes al 10 % y el rojo profundo no cuentan, como en el Chip del ERP).</p>
     <p class="sim">Maqueta: todas las cifras y prendas son simuladas. Este panel no existe en el ERP.</p>
   </div>`;
}

/* ════════════════════════════════════════════════════════════════════════════════════════════════════
   RENDER Y EVENTOS
   ════════════════════════════════════════════════════════════════════════════════════════════════════ */
function render(){
  document.body.dataset.colores=S.colores; document.body.dataset.frases=S.frases;
  pantalla();
  if(S.abierta){const p=P.find(x=>x.id===S.abierta);const raiz=document.getElementById('modal-raiz');const sc=raiz.querySelector('.hoja')?.scrollTop||0;raiz.innerHTML=detalleHTML(p).replace('hoja cascada','hoja');raiz.querySelector('.velo').style.animation='none';raiz.querySelector('.hoja').style.animation='none';raiz.querySelector('.hoja').scrollTop=sc}
  pintarElige();
}
let tAviso;
function aviso(que,ir){
  const a=document.getElementById('aviso');
  a.innerHTML=`<b>${que}</b><code>${ir.startsWith('#')?'en la pantalla real se abre aquí mismo':'iría a '+ir}</code>`;
  a.classList.add('on'); clearTimeout(tAviso); tAviso=setTimeout(()=>a.classList.remove('on'),2800);
}
let comboAbierto=null;
function abrirCombo(id){
  cerrarCombo();
  const cont=document.querySelector(`[data-combo="${id}"]`); if(!cont)return;
  comboAbierto=id; cont.insertAdjacentHTML('beforeend',listaCombo(id));
  cont.querySelector('[aria-expanded]').setAttribute('aria-expanded','true');
  const inp=cont.querySelector('[data-busca-combo]'); (inp||cont.querySelector('[aria-selected=true]')||cont.querySelector('[role=option]'))?.focus();
}
function cerrarCombo(){
  if(!comboAbierto)return;
  const cont=document.querySelector(`[data-combo="${comboAbierto}"]`);
  cont?.querySelector('.lista')?.remove(); cont?.querySelector('[aria-expanded]')?.setAttribute('aria-expanded','false');
  S['q_'+comboAbierto]=''; comboAbierto=null;
}
document.addEventListener('click',e=>{
  const g=k=>e.target.closest(`[data-${k}]`);
  if(g('colores')&&g('colores').tagName==='BUTTON'){S.colores=g('colores').dataset.colores;guardar();render();return}
  if(g('frases')&&g('frases').tagName==='BUTTON'){S.frases=g('frases').dataset.frases;guardar();render();return}
  if(g('abre-combo')){const id=g('abre-combo').dataset.abreCombo;comboAbierto===id?cerrarCombo():abrirCombo(id);return}
  if(g('op')&&comboAbierto){const v=g('op').dataset.op;if(comboAbierto==='cat')S.cat=v;else S.estado=v;const id=comboAbierto;cerrarCombo();pantalla();pintarElige();document.querySelector(`[data-abre-combo="${id}"]`)?.focus();return}
  if(comboAbierto&&!e.target.closest('.combo'))cerrarCombo();
  if(g('cerrar')&&(e.target===g('cerrar')||g('cerrar').tagName==='BUTTON')){cerrar();return}
  if(g('ir')){const b=g('ir');aviso(b.dataset.que,b.dataset.ir);return}
  const a=g('act')?.dataset.act;
  if(a==='porDecidir'){S.porDecidir=!S.porDecidir;pantalla();pintarElige();return}
  if(a==='limpiar'){S.cat='todas';S.estado='todos';S.porDecidir=false;S.q='';pantalla();pintarElige();return}
  if(a==='elige'){S.elige=!S.elige;guardar();pintarElige();return}
  if(a==='copiar'){const t=`colores ${S.colores}, frases ${S.frases}`;try{navigator.clipboard.writeText(t).then(()=>aviso('Copiado',`#«${t}»`),()=>aviso('Cópialo a mano',`#«${t}»`))}catch(err){aviso('Cópialo a mano',`#«${t}»`)}return}
  if(g('abrir')&&!e.target.closest('#modal-raiz')){abrir(g('abrir').dataset.abrir);return}
});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-q]')){S.q=e.target.value;const pos=e.target.selectionStart;pantalla();pintarElige();const i=document.querySelector('[data-q]');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.matches('[data-busca-combo]')){const id=e.target.dataset.buscaCombo;S['q_'+id]=e.target.value;const cont=document.querySelector(`[data-combo="${id}"] [data-ops]`);const tmp=document.createElement('div');tmp.innerHTML=listaCombo(id);cont.innerHTML=tmp.querySelector('[data-ops]').innerHTML}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(comboAbierto){e.stopPropagation();const id=comboAbierto;cerrarCombo();document.querySelector(`[data-abre-combo="${id}"]`)?.focus();return} // el combo usó el Escape (useEscapeLibre)
    if(S.abierta){cerrar();return}
  }
  if(comboAbierto&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const ops=[...document.querySelectorAll(`[data-combo="${comboAbierto}"] [role=option]`)];if(!ops.length)return;
    e.preventDefault();const i=ops.indexOf(document.activeElement);const n=e.key==='ArrowDown'?Math.min(ops.length-1,i+1):Math.max(0,i-1);ops[n].focus();return;
  }
  if(comboAbierto&&e.key==='Enter'&&document.activeElement?.matches('[role=option]')){document.activeElement.click();return}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement?.matches('.fila[data-abrir]')){e.preventDefault();abrir(document.activeElement.dataset.abrir);return}
  if(e.key==='Tab'&&S.abierta){ // foco atrapado en la hoja, como Radix
    const hoja=document.querySelector('.hoja');const fs=[...hoja.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')];if(!fs.length)return;
    const pri=fs[0],ult=fs[fs.length-1];
    if(e.shiftKey&&(document.activeElement===pri||document.activeElement===hoja)){e.preventDefault();ult.focus()}
    else if(!e.shiftKey&&document.activeElement===ult){e.preventDefault();pri.focus()}
  }
});
render();
if(S.abrirAlCargar)abrir(S.abrirAlCargar);
</script>
</body>
</html>
