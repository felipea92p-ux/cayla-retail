<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rendimiento · spike visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Rendimiento (ADR-0219, acta DECISIONES-2026-09-26)
   Pregunta: ¿cómo se ve el módulo que muestra las ventas de cada
   persona, para la encargada (su tienda) y el Admin (todas)?
   Tokens = los de apps/web/app/globals.css (ADR-0169). Solo modo claro.
   Datos inventados: ninguna cifra ni nombre es real.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-prof:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t75:rgba(26,26,24,.75);--t65:rgba(26,26,24,.65);--t55:rgba(26,26,24,.55);--t45:rgba(26,26,24,.45);
  --t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);--t06:rgba(26,26,24,.06);
  --ease:cubic-bezier(.32,.72,.24,1);--ancho:17rem;--bar:44px;--cab:56px;--r-md:6px;--r-xl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.display{font-family:'EB Garamond',Georgia,serif;font-weight:600;letter-spacing:-.005em}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--taupe)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--rojo)}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:15px;height:15px}
@keyframes entrada{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.entra{animation:entrada 360ms var(--ease) both}

/* barra del spike (no existe en el ERP) */
.spk{position:fixed;inset:0 0 auto 0;z-index:80;height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--tinta);color:var(--crema);font-size:13px;overflow-x:auto;white-space:nowrap}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.spk label{display:flex;align-items:center;gap:8px;color:rgba(245,240,232,.7)}
.spk select{height:30px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);background:rgba(245,240,232,.06);color:var(--crema);padding:0 8px;font-size:13px}
.spk select option{color:var(--tinta);background:var(--crema)}
.spk .ej{margin-left:auto;font-size:11.5px;color:rgba(245,240,232,.6)}

/* lateral */
.side{position:fixed;inset:var(--bar) auto 0 0;width:var(--ancho);display:flex;flex-direction:column;background:var(--crema);border-right:1px solid var(--t10);z-index:40}
.logo{display:flex;align-items:center;gap:12px;padding:28px 0 24px 28px}
.logo img{height:32px}.logo span{font-size:14px;letter-spacing:.26em;font-weight:600}
nav.menu{flex:1;overflow-y:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px}
.fila{display:flex;align-items:center;gap:14px;height:48px;padding:0 12px 0 16px;border-radius:8px;color:var(--t80);white-space:nowrap}
.fila.act{background:rgba(232,224,208,.7);color:var(--tinta);font-weight:500;position:relative}
.fila.act::before{content:"";position:absolute;left:0;top:14px;width:2px;height:20px;border-radius:9px;background:var(--rojo)}
.fila .ic{color:rgba(26,26,24,.6)}.fila .chev{margin-left:auto;width:14px;height:14px;color:var(--t45)}
.lema{padding:0 28px 18px;font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:var(--taupe)}
.yo{border-top:1px solid var(--t10);padding:16px 20px;display:flex;align-items:center;gap:12px}
.yo p:first-child{font-size:14px}.yo p:last-child{font-size:11px;letter-spacing:.06em;color:var(--taupe);text-transform:uppercase}

/* cabecera fija */
.top{position:fixed;top:var(--bar);left:var(--ancho);right:0;height:var(--cab);border-bottom:1px solid var(--t10);background:rgba(245,240,232,.85);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 32px;z-index:30;font-size:13px;color:var(--t65);gap:10px}
.top .sede{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);color:var(--tinta)}

/* contenido */
main{margin-left:var(--ancho);padding:calc(var(--bar) + var(--cab) + 36px) 40px 96px}
.pag{max-width:1120px;margin:0 auto}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;align-items:flex-end}
.cab h1{font-size:30px;line-height:1.15;margin-top:6px}
.cab .bajada{font-size:15px;color:var(--taupe);margin-top:6px;max-width:64ch}
.acciones{display:flex;gap:10px;flex-wrap:wrap}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);border:1px solid transparent;padding:8px 16px;font-size:13.5px;font-weight:500;line-height:1.25;white-space:nowrap;transition:background-color 150ms,border-color 150ms,color 150ms}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.chico{padding:5px 12px;font-size:12.5px}
.btn.primario{background:var(--tinta);color:var(--crema)}
.btn.primario:hover:not(:disabled){background:var(--rojo-prof)}
.btn.secundario{border-color:var(--sand)}
.btn.secundario:hover:not(:disabled){background:rgba(232,224,208,.5);border-color:rgba(128,92,76,.4)}
.btn.sutil{border-color:var(--sand);color:var(--taupe)}
.btn.sutil:hover:not(:disabled){color:var(--tinta);background:rgba(232,224,208,.3)}
@keyframes gira{to{transform:rotate(360deg)}}
.gira{animation:gira 800ms linear infinite}

/* píldoras (filtros de toda la página, en UNA fila) */
.filtros{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin-top:22px}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grupo>.lbl{margin-right:6px}
.pildora{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--sand);padding:5px 14px;font-size:13px;font-weight:600;color:var(--taupe);white-space:nowrap;transition:background-color 150ms,border-color 150ms,color 150ms}
.pildora:hover{color:var(--tinta);border-color:rgba(128,92,76,.4)}
.pildora[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}

/* tarjetas y cifras */
.card{background:var(--papel);border:1px solid var(--sand);border-radius:var(--r-xl)}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.cifra{padding:16px 18px}
.cifra .lbl{font-weight:700}
.cifra .v{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:24px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.cifra .d{font-size:12px;color:var(--taupe);margin-top:2px}
.meter{height:6px;border-radius:9px;background:var(--t10);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--verde)}

/* insignias (Chip) */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:1px;margin-left:4px}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.pizarra{background:rgba(76,93,110,.10);color:var(--pizarra)}
.chip.ambar{background:rgba(116,80,26,.10);color:var(--ambar)}
.chip.verde{background:rgba(72,96,63,.10);color:var(--verde)}
.chip.neutro{background:var(--hueso);color:var(--taupe)}

/* secciones y tiendas */
.sec{margin-top:34px}
.sec-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sec-cab h2{font-family:'EB Garamond',serif;font-weight:600;font-size:21px;line-height:1.2}
.sec-cab .d{font-size:13px;color:var(--taupe)}
.bloque{margin-top:34px}
.tienda-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--sand)}
.tienda-cab h2{font-family:'EB Garamond',serif;font-weight:600;font-size:23px;line-height:1.2}
.mini-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--taupe)}
.mini-meta .meter{width:120px;margin-top:0}

/* rankings */
.rankings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rk{padding:18px 20px 12px;display:flex;flex-direction:column}
.rk-cab h3{font-family:'EB Garamond',serif;font-weight:600;font-size:19px;line-height:1.2}
.rk-cab p{font-size:12.5px;color:var(--taupe);margin-top:2px}
.rk ol{list-style:none;margin-top:8px;flex:1}
.rk li{display:grid;grid-template-columns:22px 32px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;padding:9px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;transition:background-color 150ms}
.rk li:hover,.rk li:focus-visible{background:rgba(232,224,208,.45);outline:none}
.rk .pos{font-family:'EB Garamond',serif;font-weight:600;font-size:18px;text-align:center;color:var(--t55)}
.rk li.podio .pos{color:var(--tinta)}
.av{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-weight:600;font-size:13px;color:var(--tinta);flex:none}
.rk .nom{min-width:0}
.rk .nom b{font-weight:500;font-size:14.5px}
.rk .nom .sub{display:block;font-size:12px;color:var(--taupe);font-variant-numeric:tabular-nums}
.rk .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rk .val small{font-size:11.5px;font-weight:500;color:var(--taupe);margin-left:2px}
.barra{grid-column:3 / 5;height:6px;position:relative}
.barra .pista{position:absolute;inset:0;background:var(--t06);border-radius:0 4px 4px 0}
.barra i{position:absolute;left:0;top:0;bottom:0;background:var(--tinta);border-radius:0 4px 4px 0}
.rk-vacio{padding:14px 0 8px;font-size:13.5px;color:var(--t75)}
.rk-pie{border-top:1px solid var(--sand);margin-top:6px;padding-top:10px;font-size:12px;color:var(--taupe)}

/* tabla (Tabla: filtros y tabla en UNA tarjeta) */
.tabla{margin-top:34px}
.herr{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--sand)}
.herr h2{font-family:'EB Garamond',serif;font-weight:600;font-size:19px;line-height:1.2}
.herr .d{font-size:12.5px;color:var(--taupe)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:rgba(232,224,208,.7);font-size:12px;font-weight:400;color:var(--taupe);text-align:right;padding:8px 10px;line-height:1.3;vertical-align:bottom;max-width:92px}
thead th:first-child{text-align:left;padding-left:20px;max-width:none}
thead th button{display:inline-flex;align-items:center;gap:3px;color:inherit;font-weight:inherit}
thead th button:hover{color:var(--tinta)}
thead th button.orden{color:var(--tinta);font-weight:600}
tbody td{padding:10px 10px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;border-top:1px solid var(--sand);white-space:nowrap;vertical-align:middle}
tbody td:first-child{text-align:left;padding-left:20px}
tbody td:last-child{padding-right:20px}
tbody tr.tfila{cursor:pointer;transition:background-color 150ms}
tbody tr.tfila:nth-child(even of .tfila),tbody tr.vfila:nth-child(even of .vfila){background:rgba(234,225,210,.5)}
tbody tr.tfila:hover{background:rgba(245,240,232,.75)}
tbody tr.sub td{text-align:left;padding:16px 20px 8px;font-family:'EB Garamond',serif;font-weight:600;font-size:17px;background:var(--papel)}
tbody tr.total td{font-weight:600;background:rgba(232,224,208,.35)}
.persona{display:flex;align-items:center;gap:10px;min-width:190px}
.persona .av{width:28px;height:28px;font-size:12px}
.persona b{font-weight:500}
td .d2{display:block;font-size:11.5px;color:var(--taupe);font-weight:400;white-space:normal}
tbody td.op{min-width:118px;max-width:150px;white-space:normal}
.persona .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.persona .chips .chip{margin-left:0}
td .d2.ambar{color:var(--ambar)}
.pie{padding:10px 20px;font-size:12px;color:var(--taupe);border-top:1px solid var(--sand);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}

/* desplegable «Ordenar por» (en el ERP: Desplegable, ADR-0209) */
.desp{position:relative}
.desp-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--sand);border-radius:var(--r-md);background:var(--papel);font-size:13.5px}
.desp-btn:hover{border-color:rgba(128,92,76,.45)}
.desp-btn .lbl{font-size:10.5px}
.desp-lista{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:6px;z-index:20;box-shadow:0 12px 32px -12px rgba(26,26,24,.28);animation:entrada 200ms var(--ease) both}
.desp-lista button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;text-align:left}
.desp-lista button:hover{background:rgba(232,224,208,.5)}
.desp-lista button[aria-checked="true"]{font-weight:600}

/* nota en hueso */
.nota{margin-top:32px;background:rgba(234,225,210,.85);border-radius:var(--r-xl);padding:14px 18px;font-size:13px;line-height:1.65;color:var(--taupe)}
.nota b{color:var(--tinta);font-weight:600}
.nota ul{margin:6px 0 0 18px}

/* vacío honesto */
.vacio{margin-top:22px;padding:28px;text-align:center}
.vacio h2{font-size:22px}
.vacio p{font-size:14px;color:var(--t75);margin:8px auto 0;max-width:52ch}

/* ficha de una persona */
.volver{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--taupe);margin-bottom:16px}
.volver:hover{color:var(--tinta)}
.ficha-cab{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ficha-cab .av{width:56px;height:56px;font-size:21px}
.ficha-cab h1{font-size:30px;line-height:1.15;margin-top:4px}
.ficha-cab .bajada{font-size:15px;color:var(--taupe);margin-top:4px}
.linea-op{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--t75)}
.linea-op span{display:inline-flex;align-items:center;gap:6px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--taupe);align-items:center}
.leyenda span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.leyenda i{display:inline-block;width:14px;height:6px;border-radius:0 3px 3px 0}
.leyenda i.ella{background:var(--tinta)}.leyenda i.tienda{background:var(--taupe)}
.leyenda i.linea{height:2px;border-radius:0;background:var(--taupe);position:relative}
.leyenda i.linea::after{content:"";position:absolute;left:3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--taupe);box-shadow:0 0 0 2px var(--papel)}
.compara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cmp{padding:16px 18px}
.cmp .v{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:24px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.cmp .vs{font-size:12.5px;color:var(--taupe)}
.duo{display:grid;gap:3px;margin-top:10px}
.duo span{display:block;height:6px;border-radius:0 4px 4px 0}
.duo .ella{background:var(--tinta)}.duo .tienda{background:var(--taupe)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:8px}
.delta.verde{color:var(--verde)}.delta.ambar{color:var(--ambar)}.delta.neutro{color:var(--taupe)}
.dos{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{padding:18px 20px}
.panel-cab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.panel-cab h3{font-family:'EB Garamond',serif;font-weight:600;font-size:19px;line-height:1.2}
.panel-cab p{font-size:12.5px;color:var(--taupe);margin-top:2px}
.evo svg{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.gemela{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px;font-size:11.5px;color:var(--taupe);text-align:center;font-variant-numeric:tabular-nums}
.gemela b{display:block;color:var(--tinta);font-weight:600}
.pie-panel{margin-top:10px;font-size:12px;color:var(--taupe)}
.cat{display:grid;grid-template-columns:118px minmax(0,1fr) 88px;gap:10px;align-items:center;padding:7px 0}
.cat .n{font-size:13.5px}
.cat .p{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--t75)}
.cat .duo{margin-top:0}
.prendas{list-style:none;margin-top:6px}
.prendas li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--sand);font-size:13.5px}
.prendas li:first-child{border-top:0}
.prendas .c{color:var(--taupe);font-size:12.5px}
.prendas .u{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
tr.pasada td{opacity:.55}
tr.pasada td:nth-child(6),tr.pasada td:last-child{opacity:1}

/* modal (<Modal>, ADR-0136): velo con desenfoque → hoja que sube 18 px y crece → contenido en cascada */
.velo{position:fixed;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:90;animation:velo 220ms ease both}
.velo.sale{animation:velo-sale 220ms ease both}
@keyframes velo{from{opacity:0}}
@keyframes velo-sale{to{opacity:0}}
.hoja{position:fixed;z-index:91;left:50%;top:72px;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:24px 24px 20px;transform:translateX(-50%)}
.hoja.entra{animation:hoja-entra 420ms var(--ease) backwards}
.hoja.sale{animation:hoja-sale 220ms cubic-bezier(.4,0,1,1) both}
@keyframes hoja-entra{from{opacity:0;transform:translate(-50%,18px) scale(.965)}}
@keyframes hoja-sale{to{opacity:0;transform:translate(-50%,10px) scale(.98)}}
.cascada>*{animation:cascada 500ms var(--ease) backwards;animation-delay:calc(var(--k,0) * 55ms + 120ms)}
@keyframes cascada{from{opacity:0;transform:translate3d(0,10px,0)}}
.hoja h2{font-size:24px;line-height:1.2;padding-right:32px}
.hoja .bajada{font-size:14px;color:var(--taupe);margin-top:4px}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--taupe)}
.x:hover{background:rgba(232,224,208,.5);color:var(--tinta)}
.figura{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border:1px solid var(--sand);border-radius:10px;font-size:13.5px}
.figura .av{width:28px;height:28px;font-size:12px}
.campo{margin-top:18px}
.campo>.lbl{display:block;margin-bottom:8px}
.opciones{display:grid;gap:8px}
.opciones.dos-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.opcion{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--sand);border-radius:10px;background:var(--papel);text-align:left;transition:border-color 150ms,background-color 150ms}
.opcion:hover:not(:disabled){border-color:rgba(128,92,76,.45)}
.opcion[aria-checked="true"]{border-color:var(--tinta);background:rgba(232,224,208,.35);box-shadow:inset 0 0 0 1px var(--tinta)}
.opcion:disabled{opacity:.6;cursor:not-allowed}
.opcion .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--taupe);flex:none;display:grid;place-items:center}
.opcion[aria-checked="true"] .radio{border-color:var(--tinta)}
.opcion[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tinta)}
.opcion .av{width:26px;height:26px;font-size:11.5px}
.opcion .t{font-size:13.5px;line-height:1.3}
.opcion .d{display:block;font-size:11.5px;color:var(--taupe);line-height:1.35}
.caja{width:100%;min-height:72px;border:1px solid var(--sand);border-radius:8px;background:rgba(234,225,210,.6);padding:8px 10px;font-size:14px;resize:vertical;margin-top:8px}
.caja:focus{outline:2px solid rgba(26,26,24,.25);outline-offset:1px}
.resp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(234,225,210,.55);font-size:13.5px}
.resp .av{width:28px;height:28px;font-size:12px}
.resp .d{display:block;font-size:12px;color:var(--taupe)}
.chica-nota{font-size:12.5px;color:var(--taupe);margin-top:14px}
.hoja-pie{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--sand)}
.candado{width:44px;height:44px;border-radius:50%;background:rgba(116,80,26,.10);color:var(--ambar);display:grid;place-items:center}

/* aviso de éxito (avisar.exito, arriba a la derecha, después del loader) */
.avisos{position:fixed;top:calc(var(--bar) + 14px);right:16px;z-index:95;display:grid;gap:8px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--papel);border:1px solid var(--sand);border-radius:12px;padding:12px 14px;width:min(360px,calc(100vw - 32px));box-shadow:0 16px 40px -18px rgba(26,26,24,.35);animation:aviso 320ms var(--ease) both;font-size:13.5px}
.aviso.sale{animation:velo-sale 220ms ease both}
.aviso .ok{width:22px;height:22px;border-radius:50%;background:rgba(72,96,63,.12);color:var(--verde);display:grid;place-items:center;flex:none}
.aviso .ok svg{width:13px;height:13px;stroke-width:2}
.aviso b{font-weight:600}.aviso p{color:var(--taupe);font-size:12.5px}
@keyframes aviso{from{opacity:0;transform:translate3d(0,-8px,0)}}

/* tooltip de los gráficos */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tinta);color:var(--crema);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity 120ms;max-width:250px}
.tip.ver{opacity:1}

/* sin acceso */
.anotacion{border:1px dashed var(--taupe);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--taupe);margin-bottom:28px}
.anotacion b{color:var(--tinta)}
.sinacceso{display:flex;min-height:44vh;align-items:center;justify-content:center}
.sinacceso .card{max-width:28rem;padding:32px;text-align:center}
.sinacceso h1{font-size:24px;margin-top:8px}
.sinacceso p{font-size:14px;color:var(--t75);margin-top:12px}
.btn-volver{display:inline-block;margin-top:22px;border-radius:var(--r-md);background:var(--tinta);color:var(--crema);padding:10px 20px;font-size:11px;letter-spacing:.13em;font-weight:600;text-transform:uppercase}

/* celular */
.tabs{display:none}
@media (max-width:1180px){.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1023px){.rankings,.dos{grid-template-columns:1fr}}
@media (max-width:767px){
  .side,.top{display:none}
  main{margin-left:0;padding:calc(var(--bar) + 22px) 16px 100px}
  .cab h1,.ficha-cab h1{font-size:28px}
  .compara{grid-template-columns:1fr 1fr}
  .cat{grid-template-columns:96px minmax(0,1fr) 76px}
  .opciones.dos-col{grid-template-columns:1fr}
  .tabs{display:grid;position:fixed;left:0;right:0;bottom:0;height:64px;background:rgba(245,240,232,.95);backdrop-filter:blur(10px);border-top:1px solid var(--t10);z-index:40}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--t65)}
  .tabs a.act{color:var(--tinta);font-weight:500}
  .hoja{left:0;right:0;bottom:0;top:auto;width:auto;max-height:88vh;border-radius:16px 16px 0 0;transform:none;padding:22px 16px 18px}
  .hoja.entra{animation:hoja-sube 380ms var(--ease) backwards}
  .hoja.sale{animation:hoja-baja 220ms cubic-bezier(.4,0,1,1) both}
  .avisos{left:16px;right:16px}
}
@keyframes hoja-sube{from{transform:translateY(100%)}}
@keyframes hoja-baja{to{transform:translateY(100%)}}
@media (max-width:460px){.cifras,.compara{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ---------------------------------------------------------------- íconos (los trazos de AppShell.tsx) */
const IC={
  inicio:"M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5",

  inventario:"M4 7l8-4 8 4v10l-8 4-8-4V7zm8 4L4 7m8 4l8-4m-8 4v10",
  catalogo:"M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z",

  gastos:"M3 7a2 2 0 012-2h13a1 1 0 011 1v2 M3 7v11a2 2 0 002 2h14a1 1 0 001-1v-3 M3 7h16a1 1 0 011 1v3 M20 11h-4a2 2 0 000 4h4v-4z",
  rendimiento:"M12 14a6 6 0 100-12 6 6 0 000 12zM15.48 12.89L17 22l-5-3-5 3 1.52-9.11",
  chev:"M9 6l6 6-6 6",atras:"M15 18l-6-6 6-6",menu:"M4 7h16M4 12h16M4 17h16",abajo:"M6 9l6 6 6-6",
  descargar:"M12 4v12m0 0l-5-5m5 5l5-5M4 20h16",visto:"M5 12l5 5L20 7",cerrar:"M6 6l12 12M18 6L6 18",
  candado:"M7 11V8a5 5 0 0110 0v3M5 11h14v10H5z",caja:"M3 7h18v12H3zM3 11h18M8 15h3",
  bajar:"M12 4v12m0 0l-4-4m4 4l4-4M5 20h14",reloj:"M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2",
  mas:"M5 12h.01M12 12h.01M19 12h.01",giro:"M21 12a9 9 0 11-3-6.7"
};
const svg=(k,c="ic")=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[k]}"/></svg>`;

/* ---------------------------------------------------------------- datos de ejemplo (septiembre 2026, al día 26) */
const HOY_DIA=26,DIAS_MES=30;
const TIENDAS=[
  {id:"tru",nombre:"Tienda TRU",corto:"TRU",meta:55000,asistencia:true,serie:"B001"},
  {id:"aqp",nombre:"Tienda AQP",corto:"AQP",meta:20000,asistencia:true,serie:"B002"},
  {id:"lim",nombre:"Tienda Lima",corto:"Lima",meta:3000,asistencia:false,serie:"B003"},
];
/* v ventas · s soles · h horas (null: sin asistencia) · pr prendas · pl prendas a precio completo · ds soles de descuento manual
   caja [cierres, con diferencia, neto S/] · baj [prendas bajadas al piso, tarde] · desde: primer mes con datos (0 = abril) */
const BASE=[
  {id:"lm",t:"tru",n:"Lucía Méndez",ini:"LM",v:64,s:9280,h:168,pr:109,pl:96,ds:290,caja:[4,0,0],baj:[120,4]},
  {id:"kr",t:"tru",n:"Karen Ruiz",ini:"KR",v:58,s:7940,h:172,pr:87,pl:79,ds:190,caja:[3,1,-10],baj:[96,12]},
  {id:"ap",t:"tru",n:"Andrea Paredes",ini:"AP",v:49,s:7210,h:120,pr:88,pl:76,ds:290,caja:[2,0,0],baj:[64,2]},
  {id:"mt",t:"tru",n:"Milagros Torres",ini:"MT",v:52,s:6120,h:176,pr:68,pl:49,ds:580,caja:[5,2,-30],baj:[140,22]},
  {id:"fc",t:"tru",n:"Fiorella Castro",ini:"FC",v:44,s:5480,h:150,pr:62,pl:56,ds:110,caja:[0,0,0],baj:[58,1]},
  {id:"sh",t:"tru",n:"Sofía Huamán",ini:"SH",v:33,s:3960,h:96,pr:50,pl:47,ds:50,caja:[1,0,0],baj:[22,0]},
  {id:"cv",t:"tru",n:"Carla Vega",ini:"CV",enc:true,v:21,s:3650,h:180,pr:40,pl:35,ds:120,caja:[8,1,2],baj:[30,0]},
  {id:"pd",t:"tru",n:"Paola Díaz",ini:"PD",v:12,s:1570,h:40,pr:17,pl:15,ds:30,caja:[0,0,0],baj:[8,1],desde:5},
  {id:"rs",t:"aqp",n:"Rocío Salas",ini:"RS",v:57,s:8240,h:176,pr:97,pl:88,ds:210,caja:[6,1,-5],baj:[88,6]},
  {id:"dr",t:"aqp",n:"Diana Ramos",ini:"DR",enc:true,v:48,s:6720,h:184,pr:77,pl:70,ds:160,caja:[9,0,0],baj:[70,3]},
  {id:"af",t:"aqp",n:"Ana Lucía Flores",ini:"AF",v:12,s:1560,h:48,pr:18,pl:18,ds:0,caja:[0,0,0],baj:[10,0],desde:4},
  {id:"gs",t:"lim",n:"Gabriela Soto",ini:"GS",v:18,s:2340,h:null,pr:26,pl:24,ds:40,caja:[7,0,0],baj:[0,0]},
];
const MUESTRA_MIN=40; // D-66 / D-115
const met=p=>({...p,tk:p.s/p.v,upt:p.pr/p.v,pleno:p.pl/p.pr,desc:p.ds/(p.s+p.ds),sph:p.h?p.s/p.h:null,vpj:p.h?p.v/(p.h/8):null,chica:p.v<MUESTRA_MIN});
const PERSONAS=BASE.map(met);
const sum=(xs,f)=>xs.reduce((a,x)=>a+f(x),0);
const deTienda=t=>PERSONAS.filter(p=>p.t===t);
const tienda=id=>TIENDAS.find(t=>t.id===id);
const persona=id=>PERSONAS.find(p=>p.id===id);
/* El total de la tienda es un total (soles de la tienda ÷ horas de la tienda), nunca un promedio de promedios. */
function total(ps){
  const s=sum(ps,p=>p.s),v=sum(ps,p=>p.v),pr=sum(ps,p=>p.pr),pl=sum(ps,p=>p.pl),ds=sum(ps,p=>p.ds);
  const conH=ps.filter(p=>p.h),h=sum(conH,p=>p.h);
  return {s,v,pr,pl,ds,h:h||null,tk:s/v,upt:pr/v,pleno:pl/pr,desc:ds/(s+ds),
    sph:h?sum(conH,p=>p.s)/h:null,vpj:h?sum(conH,p=>p.v)/(h/8):null,
    caja:[sum(ps,p=>p.caja[0]),sum(ps,p=>p.caja[1]),sum(ps,p=>p.caja[2])],baj:[sum(ps,p=>p.baj[0]),sum(ps,p=>p.baj[1])],n:ps.length};
}

/* aleatorio con semilla: el mismo spike dibuja siempre lo mismo */
function rng(semilla){let h=2166136261;for(const c of semilla)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

const MESES=["Abr","May","Jun","Jul","Ago","Sep"],MESES_L=["abril","mayo","junio","julio","agosto","septiembre"];
const FACT_TIENDA=[.86,.91,.88,1.03,.95,1];
function evoPersona(p){const r=rng(p.id+"evo");return MESES.map((m,i)=>{if(i<(p.desde||0))return null;if(i===5)return{sph:p.sph,v:p.v};const f=.8+i*.035+(r()-.5)*.24;return{sph:p.sph?p.sph*f:null,v:Math.round(p.v*(f+(r()-.5)*.12))};});}
function evoTienda(tid){const ps=deTienda(tid),tt=total(ps);return FACT_TIENDA.map(f=>({sph:tt.sph?tt.sph*f:null,v:tt.v/ps.length*f}));}

const CATS=["Blusas","Pantalones y jeans","Vestidos","Casacas","Tops","Accesorios"],CATS_TIENDA=[.29,.23,.17,.13,.10,.08];
function catsPersona(p){const r=rng(p.id+"cat");const w=CATS_TIENDA.map(b=>b*(.55+r()*.9));const s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s);}
const PRENDAS=[["Blusa Lina","Crudo",89],["Jean Recto Mara","Azul medio",149],["Vestido Olivia","Negro",169],["Casaca Emilia","Camel",229],["Top Rita","Vino",59],["Pantalón Sastre Inés","Gris piedra",139],["Blusa Carmen","Blanco",99],["Vestido Lía","Índigo",179],["Aretes Luna","Dorado",39]];
function prendasPersona(p){const r=rng(p.id+"pr");return PRENDAS.map(x=>({n:x[0],c:x[1],u:Math.max(1,Math.round(r()*p.pr*.2)),precio:x[2]})).sort((a,b)=>b.u-a.u).slice(0,5);}
const corto=n=>{const w=n.split(" ");return w[0]+" "+w[w.length-1][0]+".";};
function ventasPersona(p){
  const r=rng(p.id+"vta"),t=tienda(p.t),otros=deTienda(p.t).filter(o=>o.id!==p.id),out=[];
  let dia=HOY_DIA,hora=20,num=420+Math.floor(r()*40);
  for(let i=0;i<8;i++){
    if(i>0&&r()<.55){dia--;hora=20;}
    hora=Math.max(10,hora-1-Math.floor(r()*3));const min=Math.floor(r()*60);
    const pr=1+Math.floor(r()*3),unit=p.s/p.pr,bruto=Math.round(unit*pr*(.82+r()*.36)/10)*10-1;
    const x=r();let desc=null;
    if(x<.16)desc={t:"10 % · cerrar la venta",m:Math.round(bruto*.10)};else if(x<.28)desc={t:"Campaña −15 %",camp:true,m:Math.round(bruto*.15)};
    const nota=r()<.25;num-=1+Math.floor(r()*4);
    const comp=nota?`Nota de venta NV-${String(40+Math.floor(r()*50)).padStart(4,"0")}`:`${t.serie}-${String(num).padStart(6,"0")}`;
    let tag=null;
    if(i===2&&otros.length)tag={tipo:"apartado",txt:`Apartado · lo entregó ${corto(otros[0].n)}`};
    if(i===5&&otros.length>1)tag={tipo:"corregida",txt:`Corregida · antes figuraba ${corto(otros[otros.length-1].n)}`};
    out.push({id:`${p.id}-${i}`,dia,hora,min,pr,total:bruto-(desc?desc.m:0),desc,comp,tag});
  }
  return out;
}

/* ---------------------------------------------------------------- cuentas (D-113, D-114) */
const GRUPOS={venta:["Ventas","venta"],inventario:["Inventario","inventario"],catalogo:["Catálogo","catalogo"],compras:["Compras","compras"],finanzas:["Finanzas","gastos"]};
const PERFILES=[
  {id:"admin",nombre:"Felipe Alvarez",ini:"FA",rol:"Admin",ub:"Central",tiendas:["tru","aqp","lim"],admin:true,grupos:["venta","inventario","catalogo","compras","finanzas"],ve:true},
  {id:"enc_tru",nombre:"Carla Vega",ini:"CV",rol:"Encargada de tienda",ub:"Tienda TRU",persona:"cv",tiendas:["tru"],grupos:["venta","inventario","catalogo","compras"],ve:true},
  {id:"enc_aqp",nombre:"Diana Ramos",ini:"DR",rol:"Encargada de tienda",ub:"Tienda AQP",persona:"dr",tiendas:["aqp"],grupos:["venta","inventario","catalogo","compras"],ve:true},
  {id:"int",nombre:"Lucía Méndez",ini:"LM",rol:"Integrante",ub:"Tienda TRU",tiendas:[],grupos:["venta","inventario","catalogo","compras"],ve:false},
  {id:"lider",nombre:"Jorge Salazar",ini:"JS",rol:"Líder de equipo (no Admin)",ub:"Oficina TRU",tiendas:[],grupos:["venta","inventario","catalogo","compras","finanzas"],ve:false},
];

/* ---------------------------------------------------------------- estado */
const st={perfil:"admin",mes:"sep",tienda:"todas",orden:"sph",vista:"lista",persona:null,evo:"sph",corregidas:{},abierto:null};
const perfil=()=>PERFILES.find(p=>p.id===st.perfil);
const fmtN=(n,d=0)=>n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS=n=>"S/ "+fmtN(Math.round(n));
const pct=(n,d=0)=>fmtN(n*100,d)+" %";
const hora=(h,m)=>`${h}:${String(m).padStart(2,"0")}`;

/* ---------------------------------------------------------------- piezas */
function chips(p,{horas=true}={}){
  let c="";
  if(p.enc)c+=`<span class="chip pizarra"><i></i>Encargada</span>`;
  if(p.chica)c+=`<span class="chip ambar" data-tip="Menos de ${MUESTRA_MIN} ventas en el mes: su puesto depende mucho de la suerte (quién entró, qué compró). Sirve para conversar, no para concluir."><i></i>Muestra chica</span>`;
  if(horas&&p.h==null)c+=`<span class="chip neutro" data-tip="Su tienda no tiene asistencia cargada en Dynamic: sin horas no hay soles por hora."><i></i>Sin horas</span>`;
  return c;
}
function cajaTxt(p){const[c,d,n]=p.caja;if(!c)return`<span class="d2">no cerró caja</span>`;return`${c}<span class="d2 ${d?"ambar":""}">${d?`${d} con diferencia <span style="white-space:nowrap">(${n<0?"−":"+"}S/&nbsp;${Math.abs(n)})</span>`:"cuadraron todas"}</span>`;}
function bajTxt(p){const[u,t]=p.baj;if(!u)return`<span class="d2">no bajó prendas</span>`;return`${fmtN(u)} u.<span class="d2 ${t/u>.1?"ambar":""}">${t?`${t} tarde`:"todas a tiempo"}</span>`;}

function ranking(ps,tipo,t){
  let lista=[...ps];
  const conHoras=lista.filter(p=>p.sph!=null);
  if(tipo==="sph"){
    if(!conHoras.length)return`<div class="rk-vacio">${t.nombre} no tiene asistencia cargada en Dynamic, así que no hay horas para calcular soles por hora. El ranking por número de ventas sí funciona.</div>`;
    lista=[...conHoras.sort((a,b)=>b.sph-a.sph),...lista.filter(p=>p.sph==null)];
  }else lista.sort((a,b)=>b.v-a.v);
  const val=p=>tipo==="sph"?p.sph:p.v,max=Math.max(...lista.map(p=>val(p)||0));
  return`<ol>${lista.map((p,i)=>{
    const v=val(p);
    const txt=v==null?`<span class="d2">—</span>`:tipo==="sph"?`S/ ${fmtN(v)}<small>por hora</small>`:`${v}<small>ventas</small>`;
    const sub=tipo==="sph"?`${p.v} ventas · ${p.h==null?"sin horas":fmtN(p.h)+" h"}`:`${fmtS(p.s)} · ticket ${fmtS(p.tk)}`;
    const tip=tipo==="sph"?`${p.n}: ${fmtS(p.s)} en ${p.h?fmtN(p.h)+" horas":"—"}`:`${p.n}: ${p.v} ventas, ${fmtS(p.s)}`;
    return`<li class="${i<3&&v!=null?"podio":""}" tabindex="0" role="button" data-abrir="${p.id}" aria-label="Abrir la ficha de ${p.n}" data-tip="${tip}">
      <span class="pos">${v==null?"–":i+1}</span><span class="av">${p.ini}</span>
      <span class="nom"><b>${p.n}</b>${chips(p,{horas:tipo==="sph"})}<span class="sub">${sub}</span></span>
      <span class="val">${txt}</span>
      <span class="barra"><span class="pista"></span>${v==null?"":`<i style="width:${Math.max(2,v/max*100)}%"></i>`}</span></li>`;}).join("")}</ol>`;
}
function rankings(ps,t){
  const hayHoras=ps.some(p=>p.sph!=null);
  return`<div class="rankings">

}

const VAL={v:p=>p.v,s:p=>p.s,h:p=>p.h??-1,sph:p=>p.sph??-1,tk:p=>p.tk,upt:p=>p.upt,pleno:p=>p.pleno,desc:p=>p.desc,caja:p=>p.caja[1]*1e4-p.caja[2],baj:p=>p.baj[1]};
const filaTotal=(tt,nombre)=>`<tr class="total"><td>Total ${nombre}</td><td>${fmtN(tt.v)}</td><td>${fmtS(tt.s)}</td><td>${tt.h?fmtN(tt.h):"—"}</td><td>${tt.sph?"S/ "+fmtN(tt.sph):"—"}</td><td>${fmtS(tt.tk)}</td><td>${fmtN(tt.upt,1)}</td><td>${pct(tt.pleno)}</td><td>${pct(tt.desc,1)}</td><td class="op">${cajaTxt({caja:tt.caja})}</td><td class="op">${bajTxt({baj:tt.baj})}</td></tr>`;

/* ---------------------------------------------------------------- vistas */
function vistaLista(){
  const pf=perfil(),admin=!!pf.admin;
  const tids=admin?(st.tienda==="todas"?pf.tiendas:[st.tienda]):pf.tiendas;

      ${admin?`<div class="grupo" role="group" aria-label="Tienda"><span class="lbl">Tienda</span>${[["todas","Todas"],...TIENDAS.map(t=>[t.id,t.corto])].map(([id,et])=>`<button class="pildora" data-tienda="${id}" aria-pressed="${st.tienda===id}">${et}</button>`).join("")}</div>`:""}
    </div>`;
  if(st.mes==="ago")return cab+`<section class="card vacio entra"><h2 class="display">Agosto no tiene a quién atribuirle ventas</h2>
      <p>El ERP guarda quién atendió cada venta desde el 22 de septiembre de 2026. Los meses anteriores quedan vacíos: no se inventan.</p></section>`;
  const chicas=ps.filter(p=>p.chica).length,falta=Math.max(0,meta-tt.s),avance=tt.s/meta;
  const cifras=`<section class="cifras">
    <div class="card cifra"><span class="lbl">Ventas del mes</span><div class="v">${fmtS(tt.s)}</div><div class="d">${fmtN(tt.v)} ventas en ${nombreAlcance}</div></div>
    <div class="card cifra"><span class="lbl">Meta del mes</span><div class="v">${pct(avance)}</div><div class="d">Faltan ${fmtS(falta)} de ${fmtS(meta)} · van ${HOY_DIA} de ${DIAS_MES} días</div><div class="meter" role="img" aria-label="${pct(avance)} de la meta"><i style="width:${Math.min(100,avance*100)}%"></i></div></div>
    <div class="card cifra"><span class="lbl">Vendieron</span><div class="v">${ps.length} personas</div><div class="d">${chicas} con muestra chica (menos de ${MUESTRA_MIN} ventas)</div></div>
    <div class="card cifra"><span class="lbl">Ticket promedio</span><div class="v">${fmtS(tt.tk)}</div><div class="d">${fmtN(tt.upt,1)} prendas por venta</div></div></section>`;
  const bloques=tids.map(tid=>{
    const t=tienda(tid),tp=total(deTienda(tid)),av=tp.s/t.meta;
    return`<section class="bloque">
      ${tids.length>1?`<div class="tienda-cab"><h2>${t.nombre}</h2><div class="mini-meta"><span class="num">${fmtS(tp.s)} · ${pct(av)} de la meta</span><div class="meter"><i style="width:${Math.min(100,av*100)}%"></i></div></div></div>`:""}
      ${rankings(deTienda(tid),t)}</section>`;
  }).join("");

    <ul><li><b>Muestra chica:</b> con menos de ${MUESTRA_MIN} ventas en el mes, el puesto depende mucho de la suerte. Sirve para conversar con ella, no para sacar conclusiones.</li>

function delta(a,b,bueno,tipo){
  if(a==null||b==null)return`<span class="delta neutro">sin horas para comparar</span>`;
  if(tipo==="pts"){const d=(a-b)*100;if(Math.abs(d)<2)return`<span class="delta neutro">parecido a su tienda</span>`;
    return`<span class="delta ${d*bueno>0?"verde":"ambar"}">${d>0?"▲":"▼"} ${fmtN(Math.abs(d),1)} pts ${d>0?"más":"menos"} que su tienda</span>`;}
  const d=(a-b)/b;if(Math.abs(d)<.08)return`<span class="delta neutro">parecido a su tienda</span>`;
  return`<span class="delta ${d*bueno>0?"verde":"ambar"}">${d>0?"▲":"▼"} ${pct(Math.abs(d))} ${d>0?"sobre":"bajo"} su tienda</span>`;
}
const CMP=[
  {k:"sph",t:"Soles por hora",f:v=>"S/ "+fmtN(v),bueno:1},{k:"vpj",t:"Ventas por jornada de 8 h",f:v=>fmtN(v,1),bueno:1},
  {k:"tk",t:"Ticket promedio",f:fmtS,bueno:1},{k:"upt",t:"Prendas por venta",f:v=>fmtN(v,1),bueno:1},
  {k:"pleno",t:"A precio completo",f:v=>pct(v),bueno:1,tipo:"pts"},{k:"desc",t:"Descuento dado",f:v=>pct(v,1),bueno:-1,tipo:"pts"},
];
function graficoEvo(p){
  const ev=evoPersona(p),et=evoTienda(p.t),k=st.evo,W=520,H=190,L=40,R=8,T=18,B=24,pw=W-L-R,ph=H-T-B;
  const vals=[...ev.map(x=>x&&x[k]),...et.map(x=>x[k])].filter(x=>x!=null);
  if(!vals.length)return`<p class="rk-vacio">Sin horas registradas: no se puede calcular soles por hora.</p>`;
  const maxV=Math.max(...vals)*1.12,crudo=maxV/4,mag=10**Math.floor(Math.log10(crudo)),paso=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=crudo),top=Math.ceil(maxV/paso)*paso,y=v=>T+ph-(v/top)*ph,cw=pw/6,bw=Math.min(34,cw*.42);
  let g="";for(let v=0;v<=top+1e-9;v+=paso)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(26,26,24,.10)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#805c4c" style="font-variant-numeric:tabular-nums">${k==="sph"?"S/ "+v:v}</text>`;
  const bars=ev.map((x,i)=>{const cx=L+cw*i+cw/2;if(!x||x[k]==null)return`<text x="${cx}" y="${T+ph-4}" text-anchor="middle" font-size="11" fill="#805c4c">—</text>`;
    const h=Math.max(1,ph-(y(x[k])-T));return`<path d="M${cx-bw/2} ${T+ph} V${T+ph-h+4} q0 -4 4 -4 H${cx+bw/2-4} q4 0 4 4 V${T+ph} Z" fill="#1a1a18"/>`+(i===5?`<text x="${cx}" y="${T+ph-h-6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a1a18">${k==="sph"?"S/ "+fmtN(x[k]):fmtN(x[k])}</text>`:"");}).join("");
  const pts=et.map((x,i)=>[L+cw*i+cw/2,y(x[k])]);
  const linea=`<polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="#805c4c" stroke-width="2" stroke-linejoin="round"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#805c4c" stroke="#fbf8f2" stroke-width="2"/>`).join("");
  const eje=MESES.map((m,i)=>`<text x="${L+cw*i+cw/2}" y="${H-6}" text-anchor="middle" font-size="11.5" fill="${i===5?"#1a1a18":"#805c4c"}" font-weight="${i===5?600:400}">${m}</text>`).join("");
  const hits=MESES.map((m,i)=>{const e=ev[i],tv=et[i][k],f=v=>k==="sph"?"S/ "+fmtN(v)+" por hora":fmtN(v)+" ventas";
    return`<rect x="${L+cw*i}" y="${T}" width="${cw}" height="${ph}" fill="transparent" data-tip="${MESES_L[i]}${i===5?" (al día "+HOY_DIA+")":""} · ${p.n.split(" ")[0]}: ${e&&e[k]!=null?f(e[k]):"sin datos"} · ${k==="sph"?"su tienda":"promedio por persona de su tienda"}: ${f(tv)}"/>`;}).join("");
  const gem=`<div class="gemela" style="padding:0 ${R/W*100}% 0 ${L/W*100}%" aria-label="Valores por mes">${MESES.map((m,i)=>`<span><b>${ev[i]&&ev[i][k]!=null?(k==="sph"?"S/ "+fmtN(ev[i][k]):fmtN(ev[i][k])):"—"}</b></span>`).join("")}</div>`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${ORDEN[k==="sph"?"sph":"v"].toLowerCase()}, abril a septiembre">${g}${bars}${linea}${eje}${hits}</svg>${gem}`;
}
function vistaFicha(){

  const cats=catsPersona(p),prendas=prendasPersona(p),ventas=ventasPersona(p);

      <div class="duo" role="img" aria-label="Ella ${a==null?"sin dato":c.f(a)}, su tienda ${b==null?"sin dato":c.f(b)}"><span class="ella" style="width:${a==null?0:a/mx*100}%"></span><span class="tienda" style="width:${b==null?0:b/mx*100}%"></span></div>${delta(a,b,c.bueno,c.tipo)}</div>`;}).join("");
  const maxC=Math.max(...cats,...CATS_TIENDA)*1.1;
  const catH=CATS.map((c,i)=>`<div class="cat" data-tip="${c}: ${pct(cats[i])} de lo que vende ella · ${pct(CATS_TIENDA[i])} en su tienda"><span class="n">${c}</span>

  const [cc,cd,cn]=p.caja,[bu,bt]=p.baj;
  return`<button class="volver" id="volver">${svg("atras","ic s")}Rendimiento · ${t.nombre}</button>

  ${p.chica?`<div class="nota" style="margin-top:16px">Con <b>${p.v} ventas</b> este mes, estas cifras cambian mucho de un mes a otro. Úsalas para conversar con ${p.n.split(" ")[0]}, no para compararla.</div>`:""}
  <section class="sec"><div class="sec-cab"><h2>Comparada con su tienda</h2><div class="leyenda"><span><i class="ella"></i>${p.n.split(" ")[0]}</span><span><i class="tienda"></i>${t.nombre}</span></div></div>
    <div class="compara">${cmp}</div></section>

      <div class="leyenda" style="margin-top:10px"><span><i class="ella"></i>${p.n.split(" ")[0]}</span><span><i class="linea"></i>${st.evo==="sph"?"su tienda":"promedio por persona de su tienda"}</span></div>
      ${graficoEvo(p)}

/* ---------------------------------------------------------------- modal «Corregir quién atendió» */
let desp=null;
function abrirModal(ventaId){
  const pf=perfil(),p=persona(st.persona),t=tienda(p.t),v=ventasPersona(p).find(x=>x.id===ventaId);
  const yo=pf.persona||null,esMia=!pf.admin&&yo===p.id;
  st.abierto={venta:v,p,elegido:null,motivo:null,texto:""};
  const capa=document.getElementById("capa");
  const cab=`<button class="x" id="cerrar" aria-label="Cerrar">${svg("cerrar","ic s")}</button>`;
  let cuerpo;
  if(esMia){
    cuerpo=`<div class="candado">${svg("candado")}</div>
      <h2 class="display" id="m-tit">Esta venta figura a tu nombre</h2>
      <p class="bajada">Nadie corrige sus propias ventas: si hay que pasarla a otra persona, pídeselo al Admin. Es la misma regla de devoluciones, donde quien registra una no la aprueba (ADR-0177).</p>
      <p class="chica-nota"><span class="chip ambar" style="margin-left:0"><i></i>Propuesta</span> Espera el ok de Felipe (objeción del ADR-0219).</p>
      <div class="hoja-pie"><button class="btn primario" id="cerrar2">Entendido</button></div>`;
  }else{
    const staff=deTienda(p.t);
    cuerpo=`<h2 class="display" id="m-tit">Corregir quién atendió</h2>
      <p class="bajada">${v.comp} · ${v.dia} de septiembre, ${hora(v.hora,v.min)} · ${fmtS(v.total)} · ${v.pr} ${v.pr===1?"prenda":"prendas"}</p>
      <div class="figura"><span class="av">${p.ini}</span><span>Hoy figura <b>${p.n}</b></span></div>
      <div class="campo"><span class="lbl">¿Quién la atendió?</span><div class="opciones dos-col" role="radiogroup" aria-label="Quién la atendió">
        ${staff.map(o=>{const actual=o.id===p.id,soyYo=!pf.admin&&o.id===yo;const off=actual||soyYo;
          return`<button class="opcion" role="radio" aria-checked="false" data-quien="${o.id}" ${off?"disabled":""}><span class="radio"></span><span class="av">${o.ini}</span>
            <span><span class="t">${o.n}</span>${actual?`<span class="d">figura hoy</span>`:soyYo?`<span class="d">no puedes darte una venta: la corrige el Admin</span>`:""}</span></button>`;}).join("")}
      </div></div>
      <div class="campo"><span class="lbl">Motivo</span><div class="opciones" role="radiogroup" aria-label="Motivo">
        ${[["error","Se eligió a otra por error","Al cobrar se tocó el nombre equivocado."],["cobro","La atendió otra y cobró ella","Una atendió a la clienta y otra cobró en caja."],["otro","Otro","Escribe qué pasó."]].map(([k,tx,d])=>`<button class="opcion" role="radio" aria-checked="false" data-motivo="${k}"><span class="radio"></span><span><span class="t">${tx}</span><span class="d">${d}</span></span></button>`).join("")}
      </div><textarea class="caja" id="texto" placeholder="Qué pasó con esta venta" hidden></textarea></div>
      <div class="campo"><span class="lbl">Responsable</span>
        ${pf.admin?`<div class="resp"><span class="av">${pf.ini}</span><span>${pf.nombre}<span class="d">Admin: firma a su nombre sin marcar asistencia (ADR-0178).</span></span></div>`
        :`<div class="resp"><span class="av">${pf.ini}</span><span>${pf.nombre} (tú)<span class="d">Presente en ${t.nombre} desde las 9:02, según la asistencia.</span></span></div>`}</div>
      <p class="chica-nota">Queda registrado quién la corrigió, cuándo y por qué. El dato original no se borra.</p>
      <div class="hoja-pie"><button class="btn secundario" id="cerrar2">Cancelar</button><button class="btn primario" id="guardar" disabled>Guardar corrección</button></div>`;
  }
  capa.innerHTML=`<div class="velo" id="velo"></div><div class="hoja entra" role="dialog" aria-modal="true" aria-labelledby="m-tit">${cab}<div class="cascada">${cuerpo}</div></div>`;
  [...capa.querySelectorAll(".cascada>*")].forEach((el,i)=>el.style.setProperty("--k",i));
  const hoja=capa.querySelector(".hoja");(hoja.querySelector(".opcion:not([disabled])")||hoja.querySelector("#cerrar2")).focus({preventScroll:true});
}
function cerrarModal(){
  const capa=document.getElementById("capa"),hoja=capa.querySelector(".hoja"),velo=capa.querySelector(".velo");
  if(!hoja)return;hoja.classList.remove("entra");hoja.classList.add("sale");velo.classList.add("sale");
  setTimeout(()=>{capa.innerHTML="";},220);st.abierto=null;
}
function validar(){const a=st.abierto,b=document.getElementById("guardar");if(!a||!b)return;b.disabled=!(a.elegido&&a.motivo&&(a.motivo!=="otro"||a.texto.trim().length>3));}
function avisar(titulo,texto){
  const cont=document.getElementById("avisos"),el=document.createElement("div");el.className="aviso";
  el.innerHTML=`<span class="ok">${svg("visto","ic")}</span><div><b>${titulo}</b><p>${texto}</p></div>`;cont.appendChild(el);
  setTimeout(()=>{el.classList.add("sale");setTimeout(()=>el.remove(),220);},4200);
}

/* ---------------------------------------------------------------- eventos */
const sel=document.getElementById("perfil");
sel.innerHTML=PERFILES.map(p=>`<option value="${p.id}">${p.rol} · ${p.nombre} · ${p.ub}</option>`).join("");
sel.onchange=()=>{st.perfil=sel.value;st.vista="lista";st.persona=null;st.tienda="todas";st.mes="sep";window.scrollTo(0,0);pintar();};
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);let el;
  if((el=q("[data-mes]"))){st.mes=el.dataset.mes;pintar();return;}
  if((el=q("[data-tienda]"))){st.tienda=el.dataset.tienda;pintar();return;}
  if((el=q("[data-evo]"))){st.evo=el.dataset.evo;pintar();return;}
  if((el=q("[data-orden]"))){st.orden=el.dataset.orden;pintar();return;}
  if((el=q("#desp"))){e.stopPropagation();const w=el.parentElement;const ab=w.querySelector(".desp-lista");if(ab){ab.remove();el.setAttribute("aria-expanded","false");return;}
    const l=document.createElement("div");l.className="desp-lista";l.setAttribute("role","listbox");
    l.innerHTML=Object.entries(ORDEN).map(([k,t])=>`<button role="option" aria-checked="${st.orden===k}" data-orden="${k}">${t}${st.orden===k?svg("visto","ic s"):""}</button>`).join("");
    w.appendChild(l);el.setAttribute("aria-expanded","true");return;}
  document.querySelectorAll(".desp-lista").forEach(x=>x.remove());
  if((el=q("[data-corregir]"))){abrirModal(el.dataset.corregir);return;}
  if((el=q("[data-abrir]"))){st.vista="ficha";st.persona=el.dataset.abrir;st.evo="sph";window.scrollTo(0,0);pintar();return;}
  if(q("#volver")){st.vista="lista";st.persona=null;window.scrollTo(0,0);pintar();return;}
  if(q("#exportar")){avisar("En el ERP esto baja un CSV","Con la tabla tal como la estás viendo. El spike no descarga nada.");return;}
  if(q("#cerrar")||q("#cerrar2")||e.target.id==="velo"){cerrarModal();return;}
  if((el=q("[data-quien]"))&&st.abierto){el.parentElement.querySelectorAll(".opcion").forEach(o=>o.setAttribute("aria-checked","false"));el.setAttribute("aria-checked","true");st.abierto.elegido=el.dataset.quien;validar();return;}
  if((el=q("[data-motivo]"))&&st.abierto){el.parentElement.querySelectorAll(".opcion").forEach(o=>o.setAttribute("aria-checked","false"));el.setAttribute("aria-checked","true");st.abierto.motivo=el.dataset.motivo;
    const tx=document.getElementById("texto");tx.hidden=st.abierto.motivo!=="otro";if(!tx.hidden)tx.focus();validar();return;}
  if((el=q("#guardar"))&&st.abierto&&!el.disabled){
    const a=st.abierto;el.disabled=true;el.innerHTML=`${svg("giro","ic s gira")}Guardando…`;
    setTimeout(()=>{st.corregidas[a.venta.id]=a.elegido;cerrarModal();
      setTimeout(()=>{pintar();avisar("Corrección guardada",`${a.venta.comp} ahora figura a nombre de ${persona(a.elegido).n}. Queda en su historial de correcciones.`);},240);},700);
  }
});
document.addEventListener("input",e=>{if(e.target.id==="texto"&&st.abierto){st.abierto.texto=e.target.value;validar();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(st.abierto)cerrarModal();document.querySelectorAll(".desp-lista").forEach(x=>x.remove());}
  if(e.key==="Enter"&&e.target.matches("[data-abrir]")){e.target.click();}
});
/* tooltip: se suma a lo que ya está escrito, nunca es la única forma de leer un valor */
const tip=document.getElementById("tip");
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(!el){tip.classList.remove("ver");return;}tip.textContent=el.dataset.tip;tip.classList.add("ver");});
document.addEventListener("mousemove",e=>{if(!tip.classList.contains("ver"))return;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+"px";tip.style.top=(e.clientY+16)+"px";});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");if(!el)return;const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.style.left=Math.min(innerWidth-260,r.left)+"px";tip.style.top=(r.bottom+6)+"px";tip.classList.add("ver");});
document.addEventListener("focusout",()=>tip.classList.remove("ver"));
pintar();
</script>
</body>
</html>
