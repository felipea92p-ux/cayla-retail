  montar(escena, api) {
    const { modelo: m, Modelo: M, est } = api;

    const PASOS = [{ n: 1, t: "Qué llegó" }, { n: 2, t: "Contar" }, { n: 3, t: "Cerrar" }];
    // ---------- el modelo de esta cara: separar por NOMBRE (sin etiqueta), detalle opcional, pendientes ----------
    if (!m.fardo && !m.provElegido) { m.proveedor = null; }
    const prep = (l) => { l.productos ||= {}; l.nuevasSin ||= 0; l.nuevasDesc ||= []; return l; };

    const sinDetalle = (l) => Object.values(prep(l).productos).filter((p) => !p.variantes);
    const ajustar = (l) => { if (l.contadas < separadas(l)) { if (l.contadas > 0) l.corregida = true; l.contadas = separadas(l); } };
    function agregarProducto(l, p, n = 1) { prep(l); const r = (l.productos[p.nombre] ||= { producto: p, n: 0, variantes: null }); r.n += n; if (r.variantes && Object.values(r.variantes).reduce((a, b) => a + b, 0) !== r.n) r.variantes = null; l.visitada = true; ajustar(l); return r; }
    function fijarProductoN(l, nombre, n) { prep(l); const r = l.productos[nombre]; if (!r) return; r.n = Math.max(0, Math.floor(Number(n) || 0)); if (r.n === 0) delete l.productos[nombre]; else if (r.variantes && Object.values(r.variantes).reduce((a, b) => a + b, 0) !== r.n) r.variantes = null; ajustar(l); }
    function detallar(l, nombre, variantes) { prep(l); const r = l.productos[nombre]; if (!r) return; const limpio = Object.fromEntries(Object.entries(variantes).filter(([, n]) => n > 0)); const total = Object.values(limpio).reduce((a, b) => a + b, 0); if (total === 0) return; r.variantes = limpio; r.n = total; ajustar(l); }

    function describirNueva(l, datos) { prep(l); const cant = Object.values(datos.tallas || {}).reduce((a, b) => a + (Number(b) || 0), 0); const n = { id: `d${Date.now()}${Math.random().toString(16).slice(2, 6)}`, ...datos, cant }; l.nuevasDesc.push(n); l.nuevasSin = Math.max(0, l.nuevasSin - cant); ajustar(l); return n; }

    function agregarLineaExtra(cat, provId) {
      const p = provId ? prov(provId) : null;
      const l = { id: `${cat.toLowerCase()}-x${++extraN}`, cat, marca: p ? p.marcas[0] : "Sin marca", prov: provId || null, dijeron: m.fardo ? 0 : null, desc: "", contadas: 0, conocidas: {}, nuevas: [], causa: m.fardo ? "no_pedida" : null, nota: "", cola: [], corregida: false, visitada: false, noAnunciada: !!m.fardo };
      m.lineas.push(l); return l;
    }
    function agregarLineaSin(cat, dijeron = null) { const l = M.agregarLinea(m, cat); l.dijeron = dijeron; return l; }
    const totalEnStock = () => m.lineas.reduce((a, l) => a + enStock(l), 0);
    /** Lo único que frena «Cerrar»: haber contado, las causas y quién contó. Separar y detallar NO (son pendientes). */
    function faltan() {
      const f = [];
      if (M.totalContadas(m) === 0) f.push({ clave: "vacio", texto: "Cuenta lo que llegó" });
      for (const l of m.lineas) { const c = CATS[l.cat]; const d = M.diferencia(l); if (d != null && d !== 0 && l.contadas > 0 && !l.causa) f.push({ clave: "causa", lineaId: l.id, texto: d < 0 ? `Di por qué faltan ${plural(-d, c.una, c.varias)}` : `Di por qué sobran ${plural(d, c.una, c.varias)}` }); }
      if (!m.fardo && m.dijeronTotal != null && M.totalContadas(m) > 0 && M.totalContadas(m) !== m.dijeronTotal && !m.causaTotal && !m.lineas.some((l) => l.dijeron != null)) { const d = M.totalContadas(m) - m.dijeronTotal; f.push({ clave: "causa-total", texto: d < 0 ? `Di por qué faltan ${-d} prendas` : `Di por qué sobran ${d} prendas` }); }
      if (!m.responsable) f.push({ clave: "responsable", texto: "Elige quién contó" });
      return f;
    }
    function faltaChips() {
      const f = faltan(); if (!f.length) return `<div class="falta-chips listo"><span class="chip verde punto">Todo listo para cerrar</span></div>`;
      return `<div class="falta-chips"><span class="label" style="margin-right:4px">Falta</span>${f.map((x) => `<button class="fc" data-falta="${x.clave}" ${x.lineaId ? `data-linea="${x.lineaId}"` : ""}>${icono("der")}${esc(x.texto)}</button>`).join("")}</div>`;
    }
    const frase = "Abre el fardo y cuenta por categoría. Separar cuáles son puede quedar para después: lo esencial es el número.";
    function chipCabecera() { const n = m.cerrado ? pendientes().length : 0; return n ? `<span class="chip pizarra punto vivo">${n} pendientes del fardo</span>` : m.reabierto ? `<span class="chip ambar punto vivo">Fardo reabierto</span>` : m.fardo ? `<span class="chip pizarra punto vivo">1 fardo en camino</span>` : `<span class="chip neutro punto">Sin aviso de Compras</span>`; }
    escena.innerHTML = `<div class="pagina">${api.cabecera({ frase, der: `<span data-chip-cab>${chipCabecera()}</span>` })}
      <nav class="rail" aria-label="Pasos de la recepción"></nav>
      <div class="paso-caja"><section class="paso-pag" id="pag"></section></div></div>`;
    const pagina = () => escena.querySelector("#pag");

    // ---------- el riel ----------
    function estadoPaso(n) { if (n === paso) return "ahora"; if (n === 1) return m.abierto ? "hecho" : "falta"; if (n === 2) return m.lineas.length && m.lineas.every((l) => l.visitada && l.contadas > 0) ? "hecho" : "falta"; return m.cerrado ? "hecho" : "falta"; }
    function subPaso(n) {
      if (n === 1) return m.abierto ? (m.fardo ? `${m.fardo.codigo} · ${M.totalDijeron(m)} prendas` : `${m.proveedor && prov(m.proveedor) ? prov(m.proveedor).nombre.split(" ")[0] : "Proveedor por confirmar"} · sin aviso`) : "Fardo o sin aviso";
      if (n === 2) { const t = M.totalContadas(m); if (!t) return "Por categoría"; const p = m.lineas.flatMap(pendientesDe).length; return `${t} contadas${p ? ` · ${p} para después` : ""}`; }
      return m.cerrado ? "Cerrado" : "Lo que no cuadró y quién contó";
    }
    function pintarRail() {
      const p = Math.min(1, (paso - 1) / 2);
      escena.querySelector(".rail").innerHTML = `<div class="rail-linea"><i style="--p:${p}"></i></div>` + PASOS.map((s) => {
        const e = estadoPaso(s.n); const puede = s.n <= paso || e === "hecho" || (s.n === 2 && m.abierto) || (s.n === 3 && M.totalContadas(m) > 0);
        return `<button class="parada" data-paso="${s.n}" data-estado="${e}" ${puede && !m.cerrado ? "" : "disabled"}><span class="punto">${e === "hecho" ? `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></svg>` : s.n}</span><span class="txt"><b>${s.t}</b><small>${esc(subPaso(s.n))}</small></span></button>`;
      }).join("");
      const ch = escena.querySelector("[data-chip-cab]"); if (ch) ch.innerHTML = chipCabecera();
    }
    async function irPaso(n, { directo = false } = {}) {
      if (n === paso && !directo) { pintarPaso(); return; }
      const atras = n < paso; paso = n;
      if (n === 2) { if (!foco || !M.linea(m, foco)) foco = (m.lineas[0] || {}).id || null; }
      const pag = pagina();
      if (!api.quieto() && !directo) { pag.classList.remove("entra-der", "entra-izq"); pag.classList.add(atras ? "sale-der" : "sale-izq"); await api.pausa(190); }
      pintarPaso(); pag.classList.remove("sale-der", "sale-izq"); pag.classList.add(atras ? "entra-izq" : "entra-der"); escena.scrollTop = 0;
    }
    function pintarPaso() {
      const pag = pagina();
      pag.innerHTML = paso === 1 ? pasoLlego() : paso === 2 ? pasoContar() : m.cerrado ? pantallaCerrado() : pasoCerrar();
      pintarRail();
      if (paso === 2) { const inp = pag.querySelector(".numero input"); if (inp && !api.quieto()) setTimeout(() => { inp.focus(); inp.select(); }, 450); }
    }

    // ---------- paso 1 · ¿qué llegó? ----------
    function cajaSvg() {
      return `<svg class="caja-svg" viewBox="0 0 200 170" aria-hidden="true">
        <g class="prendas"><rect class="prenda" x="62" y="52" width="26" height="40" rx="5" fill="#1f3a5f"/><rect class="prenda" x="90" y="46" width="26" height="46" rx="5" fill="#e8a5b0"/><rect class="prenda" x="118" y="54" width="22" height="38" rx="5" fill="#d8c3a5"/><rect class="prenda" x="76" y="60" width="18" height="32" rx="4" fill="#b0763a"/></g>
        <path class="cuerpo" d="M40 70 100 92 160 70 160 140 100 162 40 140z"/><path class="cara" d="M100 92v70l60-22V70z"/><path class="cinta" d="M100 92v70"/><path class="tapa" d="M40 70 100 92 160 70 100 48z"/></svg>`;
    }
    function pasoLlego() {
      if (m.fardo) {
        const f = m.fardo;
        return `<div class="llego cascada">
          <article class="card fardo-card"><div class="fardo-visual">${cajaSvg()}</div><div>
            <p class="label">En camino hacia ${esc(RF.SEDE)}</p>
            <h2 class="disp">Fardo ${esc(f.codigo)} <span class="chip pizarra punto vivo">Llega hoy</span></h2>
            <p class="tenue" style="margin-top:4px">Lo despachó ${esc(f.por)} desde ${esc(f.desde)} · ${esc(f.cuando)} · guía ${esc(f.guia)} · ${f.ordenes.join(", ")}</p>
            <ul class="manifiesto">${m.lineas.map((l) => `<li><span class="cat-ic">${iconoCat(l.cat)}</span><b>${esc(CATS[l.cat].nombre)}</b><span class="det">${esc(l.marca)} · ${esc(prov(l.prov).nombre)}</span><b class="num">${l.dijeron}</b></li>`).join("")}</ul>
            <p style="margin-top:12px;font-size:14.5px">Dijeron <b class="num disp" style="font-size:22px">${M.totalDijeron(m)}</b> prendas · ${m.lineas.length} categorías · ${new Set(m.lineas.map((l) => l.prov)).size} proveedores · <span class="tenue">todo viene sin etiqueta</span></p>
            <div style="margin-top:14px"><button class="btn pri grande" data-abrir>${icono("caja")}Abrir este fardo${icono("der", "flecha")}</button></div>
          </div></article>
          <aside class="card otra"><h3 class="disp">¿Llegó algo que no está aquí?</h3><p>Si vino sin aviso de Compras (por WhatsApp, o directo del proveedor), se recibe igual: cuentas lo mismo, solo que sin con qué comparar.</p>
            <div style="margin-top:12px"><button class="btn sec" data-sin-aviso>${icono("mensaje")}Recibir sin aviso</button></div>
            <p style="margin-top:14px;font-size:12.5px">Lo que manda otra sede de CAYLA no entra por aquí: se recibe en <b>Traslados</b>.</p></aside>
        </div>`;
      }
      return `<div class="llego cascada">
        <article class="card fardo-card"><div class="fardo-visual">${cajaSvg()}</div><div>
          <p class="label">Sin aviso de Compras</p><h2 class="disp">Llegó mercadería</h2>
          <p class="tenue" style="margin-top:4px">Nadie la despachó desde el sistema. Dime de quién es y, si te lo dijeron, cuántas venían: con eso ya se puede comparar.</p>
          <div class="campo luz" data-estado="${m.proveedor ? "" : "ahora"}" style="margin-top:14px;padding:12px"><div class="fila entre"><span class="fila" style="gap:8px"><span class="marca" data-estado="${m.proveedor ? "hecho" : "ahora"}">${m.proveedor ? `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>` : ""}</span><p class="label">¿De quién es?</p></span>${m.proveedor ? "" : `<span class="sigue">Sigue aquí</span>`}</div>
            <div class="caja" style="margin-top:8px"><span style="color:var(--t55)">${icono("buscar")}</span><input data-buscar-prov placeholder="Busca el proveedor por nombre o marca" autocomplete="off"></div>
            <div class="provs" data-provs>${PROVEEDORES.map((x) => `<button class="resp" data-prov="${x.id}" aria-pressed="${x.id === m.proveedor}"><span class="cat-ic" style="width:32px;height:32px;border-radius:9px">${icono("tienda")}</span><span><b>${esc(x.nombre)}</b><small>${x.marcas.join(", ")}</small></span>${x.id === m.proveedor ? `<span class="marca" data-estado="hecho"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>` : ""}</button>`).join("")}</div>
            <p class="tenue" style="font-size:12.5px;margin-top:8px">¿No está? <button class="btn enlace" data-accion="agregar-proveedor" style="min-height:24px">Agregar proveedor</button> · si no sabes de quién es, elige «Proveedor por confirmar» y Compras lo completa.</p></div>
          <div class="campo" style="padding:12px 12px 4px"><div class="fila" style="gap:8px"><span class="marca" data-estado="opcional"></span><p class="label">¿Cuántas dijeron que venían? <span class="tenue" style="letter-spacing:0;text-transform:none;font-weight:500">· opcional</span></p></div>
            <div class="fila envuelve" style="gap:12px;margin-top:8px;align-items:flex-start"><div class="caja" style="width:150px"><input type="number" inputmode="numeric" data-dijeron value="${m.dijeronTotal ?? ""}" placeholder="Ej. 64"></div><div class="cita" style="margin:0;flex:1;min-width:220px">${icono("mensaje")}<span>${esc(SIN_AVISO.mensaje)}<br><span class="tenue">Si el mensaje dice cuántas de cada categoría, lo pones al contar cada una.</span></span></div></div></div>
          <div class="fila envuelve" style="margin-top:14px;gap:12px"><button class="btn pri grande" data-abrir>${icono("caja")}Empezar a contar${icono("der", "flecha")}</button>${m.proveedor ? "" : `<span class="tenue" style="font-size:12.5px">Sin proveedor queda como «por confirmar»: Compras lo completa.</span>`}</div>
        </div></article>
        <aside class="card otra"><h3 class="disp">Cuando Compras lo despache</h3><p>El fardo aparecerá aquí con lo que dijeron por categoría y marca, y la pantalla comparará sola. Hoy ese dato viaja por WhatsApp; el módulo de Compras lo está cambiando.</p></aside>
      </div>`;
    }

    // ---------- paso 2 · contar (y separar, si quieren) ----------
    function listaCats() {
      const items = m.lineas.map((l) => {
        const c = CATS[l.cat]; const d = M.diferencia(l); const estado = l.visitada && l.contadas > 0 ? "hecho" : foco === l.id ? "ahora" : "falta";
        const dif = d != null && d !== 0 && l.contadas > 0 ? ` <span class="chip ambar" style="font-size:10.5px;padding:1px 7px">${d < 0 ? `−${-d}` : `+${d}`}</span>` : "";
        const pend = pendientesDe(l).length;
        const sub = l.contadas === 0 ? (l.noAnunciada ? `${esc(l.marca)} · <b>no venía en el fardo</b>` : l.dijeron != null ? `${esc(l.marca)} · dijeron ${l.dijeron}` : esc(l.marca)) : `${separadas(l)} separadas${pend ? ` · <b>${pend} para después</b>` : " · todo al día"}${dif}`;
        return `<button class="cat-item" data-linea="${l.id}" aria-current="${foco === l.id}" style="position:relative"><span class="marca" data-estado="${estado}">${estado === "hecho" ? `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>` : ""}</span><span class="cat-ic">${iconoCat(l.cat)}</span><span class="txt"><b>${esc(c.nombre)}</b><small>${sub}</small></span><b class="num cont">${l.contadas}${l.dijeron != null && !l.noAnunciada ? `<small style="color:var(--t45);font-size:12px;font-weight:500">/${l.dijeron}</small>` : ""}</b></button>`;
      }).join("");
      const libres = Object.entries(CATS).filter(([k]) => !m.lineas.some((l) => l.cat === k));
      const provsFardo = m.fardo ? [...new Set(m.lineas.filter((l) => l.prov).map((l) => l.prov))] : [];
      const agregar = `<button class="cat-item agregar" data-agregar aria-expanded="${eligiendo}">${icono("plus")} Agregar categoría${m.fardo ? `<small style="font-size:11px;color:var(--t45);margin-left:4px">· no venía en el fardo</small>` : ""}</button>
        <div class="elige-cat card" ${eligiendo ? "" : "hidden"}><p class="label" style="flex-basis:100%">¿Qué llegó?</p>${libres.map(([k, c]) => `<button class="pildora" data-cat="${k}" aria-pressed="${catElegida === k}">${iconoCat(k)}${esc(c.nombre)}</button>`).join("") || `<span class="tenue" style="font-size:12.5px">No quedan categorías por agregar</span>`}
          ${m.fardo ? `<p class="label" style="flex-basis:100%;margin-top:6px">¿De qué proveedor?</p>${provsFardo.map((id) => `<button class="pildora" data-prov-extra="${id}" aria-pressed="${provExtra === id}">${esc(prov(id).nombre)}</button>`).join("")}<button class="pildora" data-prov-extra="" aria-pressed="${provExtra === ""}">No sé · Compras lo ve</button>` : ""}
          <div style="flex-basis:100%;margin-top:6px"><button class="btn pri" data-agregar-ok ${catElegida ? "" : "disabled"}>${icono("plus", "mas")}Agregar${catElegida ? ` ${esc(CATS[catElegida].nombre)}` : ""}</button></div></div>`;
      return `<aside class="lista-cats"><p class="label" style="padding:0 12px 4px">Categorías${m.fardo ? " del fardo" : ""}</p>${items}${agregar}</aside>`;
    }
    function siguienteLinea() { const i = m.lineas.findIndex((l) => l.id === foco); return m.lineas[i + 1] || null; }
    function anteriorLinea() { const i = m.lineas.findIndex((l) => l.id === foco); return m.lineas[i - 1] || null; }
    function veredictoDe(l) {
      const c = CATS[l.cat]; const d = M.diferencia(l);
      if (l.noAnunciada) return l.contadas ? `${plural(l.contadas, c.una, c.varias)} que no venían en el fardo` : "No venía en el fardo: cuenta y anota";
      return l.dijeron == null ? (l.contadas ? `${plural(l.contadas, c.una, c.varias)} contadas` : "Sin aviso: cuenta y anota") : l.contadas === 0 ? `Dijeron ${l.dijeron}. Cuenta y escribe el número.` : d === 0 ? `Cuadra: llegaron las ${l.dijeron}.` : d < 0 ? `Faltan ${plural(-d, c.una, c.varias)}. Puedes seguir: lo explicas al cerrar.` : `Sobran ${plural(d, c.una, c.varias)}. Puedes seguir: lo explicas al cerrar.`;
    }
    /** El bloque «¿Qué blusas son?»: separar por nombre, detalle opcional, nuevas como cantidad. Se usa en Contar y en «Hacer ahora». */
    function bloqueSeparar(l) {
      prep(l); const c = CATS[l.cat]; const sin = sinSeparar(l);
      const filas = Object.values(l.productos).map((r) => {
        const p = r.producto; const det = r.variantes ? Object.entries(r.variantes).map(([cod, n]) => { const v = p.variantes.find((x) => x.codigo === cod); return v ? `${v.talla} ${v.color} ${n}` : `${n}`; }).join(" · ") : "";
        return `<div class="fila-sep" data-producto="${esc(p.nombre)}">${mini(l.cat, p.hex, "chica")}<span class="nom"><b>${esc(p.nombre)}</b><small>${esc(p.marca)}${r.variantes ? ` · ${esc(det)}` : ` · ${p.variantes.length} tallas y colores en el catálogo`}</small></span>
          <span class="estado">${r.variantes ? `<span class="chip verde punto">Entra al stock</span><button class="btn enlace" data-detallar="${esc(p.nombre)}">Cambiar</button>` : `<button class="btn sut" data-detallar="${esc(p.nombre)}">${icono("lista")}Tallas y colores ahora</button><span class="tenue" style="font-size:12px">o queda pendiente</span>`}</span>
          <span class="fila" style="gap:6px"><span class="paso"><button data-prod-d="-1" data-nombre="${esc(p.nombre)}" aria-label="Una menos">${icono("minus")}</button><span class="num" data-prod-n>${r.n}</span><button data-prod-d="1" data-nombre="${esc(p.nombre)}" aria-label="Una más">${icono("plus")}</button></span><button class="quitar" data-quitar-prod="${esc(p.nombre)}" aria-label="Quitar">${icono("x")}</button></span></div>`;
      }).join("");
      const descritas = l.nuevasDesc.map((n) => `<div class="fila-sep nueva" data-nueva="${n.id}">${mini(l.cat, n.hex || "#b9b2a7", "chica")}<span class="nom"><b>${esc(n.desc)}</b> <span class="chip taupe" style="font-size:11px">${icono("chispa")}Nueva</span><small>${esc(n.color || "sin color")} · ${Object.entries(n.tallas).map(([t, k]) => `${t} ${k}`).join(", ")} · ${n.creada ? "ya creada" : "queda por crear"}</small></span><span class="estado">${n.creada ? `<span class="chip verde punto">Creada · en el stock</span>` : `<span class="chip pizarra punto">Por crear</span>`}</span><span class="fila cant-nueva" style="gap:6px"><b class="num disp" style="font-size:20px">${n.cant}</b>${n.creada ? "" : `<button class="quitar" data-quitar-nueva="${n.id}" aria-label="Quitar">${icono("x")}</button>`}</span></div>`).join("");
      const nuevas = `<div class="fila-sep nueva"><span class="cat-ic" style="width:28px;height:34px;border-radius:6px;background:transparent;border:1.5px dashed var(--t25)">${icono("chispa")}</span><span class="nom"><b>Nuevas, no están en el catálogo</b><small>Solo cuántas; describirlas (nombre, color, tallas) puede quedar para después</small></span>
          <span class="estado">${l.nuevasSin > 0 ? `<button class="btn sut" data-describir>${icono("lapiz")}Describir ahora</button>` : ""}<span class="chip ${l.nuevasSin > 0 ? "pizarra punto" : "neutro"}">${l.nuevasSin > 0 ? "Por crear" : "Ninguna"}</span></span>
          <span class="paso cant-nueva"><button data-nuevas-d="-1" aria-label="Una menos">${icono("minus")}</button><span class="num" data-nuevas-n>${l.nuevasSin}</span><button data-nuevas-d="1" aria-label="Una más">${icono("plus")}</button></span></div>`;
      return `<div class="separar-op" data-separar="${l.id}">
        <div class="fila entre envuelve"><p class="label">¿Qué ${esc(c.varias)} son? <span class="opt">· opcional: puedes dejarlo para después</span></p>${sin > 0 && l.contadas ? `<span class="chip neutro punto">${sin} sin separar</span>` : l.contadas ? `<span class="chip verde punto">Todas separadas</span>` : ""}</div>
        <div class="caja buscador"><span style="color:var(--t55)">${icono("buscar")}</span><input data-buscar placeholder="${(() => { const ej = RF.PRODUCTOS.find((p) => p.cat === l.cat); return ej ? `Busca una prenda conocida por su nombre (Ej. ${esc(ej.nombre)})` : `Busca ${esc(c.una)} conocida por su nombre`; })()}" autocomplete="off"></div>
        <div class="sugerencias" data-sugerencias hidden></div>
        <div class="filas-sep">${filas}${descritas}${nuevas}</div>
        ${sin > 0 && l.contadas ? `<p class="resto">${icono("info")}<span>Las <b>${sin}</b> que no separes quedan como pendiente del fardo: no frenan el cierre.</span></p>` : ""}${l.corregida ? `<p class="resto"><span class="chip ambar" style="font-size:11px">Separaste más de lo que contaste: corregimos el conteo a ${l.contadas}</span></p>` : ""}
      </div>`;
    }
    function pasoContar() {
      const l = M.linea(m, foco);
      if (!l) { eligiendo = true; return `<div class="dos">${listaCats()}<div class="card vacio">${icono("montones")}<h3>¿Qué llegó?</h3><p>Agrega la primera categoría a la izquierda y cuéntala. Una a la vez; después agregas las demás.</p></div></div>`; }
      prep(l); const c = CATS[l.cat]; const d = M.diferencia(l); const sig = siguienteLinea();
      const pct = l.dijeron ? Math.min(100, (l.contadas / l.dijeron) * 100) : (l.contadas ? 100 : 0);
      const tono = l.noAnunciada ? (l.contadas ? "ambar" : "") : l.dijeron == null ? "" : l.contadas === 0 ? "" : d === 0 ? "verde" : "ambar";
      const todasVistas = m.lineas.every((x) => x.visitada && x.contadas > 0);
      return `<div class="dos">${listaCats()}
        <div class="col" style="gap:14px">
        <section class="card contador luz cascada" data-estado="ahora" data-linea="${l.id}">
          ${m.reabierto ? `<div class="nota" data-sin-cascada><span class="i">i</span><span>Reabriste el fardo (se cerró ${esc((m.cierres || []).slice(-1)[0]?.cuando || "antes")}). Corrige lo que haga falta y vuelve a cerrarlo; lo que ya entró al stock no se vuelve a contar y, si Compras ya reclamó una diferencia, el cambio le avisa.</span></div>` : ""}

    function refrescarContador(l) {
      const pag = pagina(); const inp = pag.querySelector("[data-contadas]"); if (inp && document.activeElement !== inp) inp.value = l.contadas;

      const l = M.linea(m, lineaId); if (!l) return;
      if (tipo === "detalle") return hojaDetalle(l, nombre);
      if (tipo === "separar") { const h = api.hoja(`<p class="label">${esc(CATS[l.cat].nombre)} · ${l.contadas} contadas</p><h2>Separar lo que quedó</h2><p class="bajada">Busca cada prenda conocida por su nombre y pon cuántas eran; lo que no esté en el catálogo, como nuevas.</p><div style="margin-top:8px">${bloqueSeparar(l)}</div><div class="pie-hoja"><span></span><button class="btn pri" data-listo-separar>Listo</button></div>`, { clase: "hoja-separar" }); h.querySelector("[data-listo-separar]").addEventListener("click", () => { api.cerrarHoja(); pintarPaso(); }); return; }
      if (tipo === "crear") {
        const n = descId ? l.nuevasDesc.find((x) => x.id === descId) : null;
        if (!n) { api.hojaNueva({ linea: l, sugerida: null, alGuardar: (d) => { describirNueva(l, d); pintarPaso(); api.aviso("Descrita: ahora sí se puede crear", "pizarra"); } }); return; }
        // Crear = Nuevo producto con todo precargado (simulado): la prenda nace y su stock contado entra solo.
        n.creada = true;
        api.aviso(`Abre Nuevo producto con ${esc(n.desc)} (${n.cant}) ya puesto; al guardar, el stock entra solo`, "pizarra"); pintarPaso();
      }
    }
    function cerrar() { M.cerrar(m); if (m.reabierto) m.hora = "11:2" + ((m.cierres || []).length % 10); paso = 3; pintarPaso(); pintarRail(); escena.scrollTop = 0; }

    // ---------- acciones ----------
    function lineaDe(t) { const r = t.closest("[data-separar]"); return r ? r.dataset.separar : foco; }
    escena.addEventListener("click", (e) => {
      const t = e.target.closest("[data-paso],[data-abrir],[data-sin-aviso],[data-prov],[data-linea].cat-item,[data-agregar],[data-agregar-ok],[data-prov-extra],[data-reabrir],[data-cat],.paso-btn,.rapidos button,[data-sig-linea],[data-ant-linea],[data-ir-paso],[data-sug-producto],[data-prod-d],[data-quitar-prod],[data-detallar],[data-nuevas-d],[data-describir],[data-nueva-desde-busqueda],[data-quitar-nueva],[data-causa],[data-causa-total],[data-resp],[data-recibir],[data-falta],[data-hacer],[data-otro],[data-accion]");
      if (!t) return;
      if (t.matches("[data-paso]")) return irPaso(Number(t.dataset.paso));
      if (t.matches("[data-abrir]")) { if (!m.fardo) { const inp = pagina().querySelector("[data-dijeron]"); m.dijeronTotal = inp && inp.value !== "" ? Number(inp.value) : null; } M.abrir(m); const svg = pagina().querySelector(".caja-svg"); if (svg) svg.classList.add("abierta"); t.disabled = true; setTimeout(() => irPaso(2), api.quieto() ? 0 : 820); return; }
      if (t.matches("[data-sin-aviso]")) { const b = document.querySelector('.spike .op[data-g="caso"][data-v="sin"]'); if (b) b.click(); return; }
      if (t.matches("[data-prov]")) { m.proveedor = t.dataset.prov; m.provElegido = true; const dij = pagina().querySelector("[data-dijeron]"); if (dij) m.dijeronTotal = dij.value !== "" ? Number(dij.value) : null; pintarPaso(); return; }
      if (t.matches(".cat-item[data-linea]")) { foco = t.dataset.linea; eligiendo = false; pintarPaso(); return; }
      if (t.matches("[data-agregar]")) { eligiendo = !eligiendo; catElegida = null; pintarPaso(); return; }
      if (t.matches("[data-cat]")) { catElegida = t.dataset.cat; pintarPaso(); return; }
      if (t.matches("[data-prov-extra]")) { provExtra = t.dataset.provExtra; pintarPaso(); return; }
      if (t.matches("[data-agregar-ok]")) { if (!catElegida) return; const l = m.fardo ? agregarLineaExtra(catElegida, provExtra || null) : agregarLineaSin(catElegida); foco = l.id; eligiendo = false; catElegida = null; pintarPaso(); api.aviso(`${CATS[l.cat].nombre} agregada${m.fardo ? ": no venía en el fardo" : ""}`, "neutro"); return; }
      if (t.matches("[data-reabrir]")) return reabrir();
      if (t.matches(".paso-btn")) return contar(foco, { delta: Number(t.dataset.d) });
      if (t.matches(".rapidos button")) { const l = M.linea(m, foco); if (t.dataset.exacto != null) contar(foco, { valor: l.dijeron }); else if (t.dataset.cero != null) contar(foco, { valor: 0 }); else contar(foco, { delta: Number(t.dataset.d) }); return; }
      if (t.matches("[data-sig-linea]")) { const l = M.linea(m, foco); if (l) l.visitada = true; const s = siguienteLinea(); if (s) { foco = s.id; irPaso(paso, { directo: true }); } return; }
      if (t.matches("[data-ant-linea]")) { const a = anteriorLinea(); if (a) { foco = a.id; irPaso(paso, { directo: true }); } return; }
      if (t.matches("[data-ir-paso]")) { const l = M.linea(m, foco); if (l) l.visitada = true; return irPaso(Number(t.dataset.irPaso)); }
      const lid = lineaDe(t); const l = M.linea(m, lid);
      if (t.matches("[data-sug-producto]")) { const p = RF.PRODUCTOS.find((x) => x.nombre === t.dataset.sugProducto); agregarProducto(l, p, 1); repintarTras(l); if (m.cerrado || escena.querySelector(".hoja-separar")) { const h = escena.querySelector(".hoja-separar [data-separar]"); if (h) h.outerHTML = bloqueSeparar(l); } const nb = (escena.querySelector(".hoja-separar") || pagina()).querySelector("[data-buscar]"); if (nb) { nb.value = ""; nb.focus(); } return; }
      if (t.matches("[data-prod-d]")) { const r = l.productos[t.dataset.nombre]; if (r) fijarProductoN(l, t.dataset.nombre, r.n + Number(t.dataset.prodD)); return refrescarSeparar(l); }
      if (t.matches("[data-quitar-prod]")) { fijarProductoN(l, t.dataset.quitarProd, 0); return refrescarSeparar(l); }
      if (t.matches("[data-detallar]")) return hojaDetalle(l, t.dataset.detallar);
      if (t.matches("[data-nuevas-d]")) { nuevasSinN(l, { delta: Number(t.dataset.nuevasD) }); return refrescarSeparar(l); }
      if (t.matches("[data-describir]") || t.matches("[data-nueva-desde-busqueda]")) { const txt = t.matches("[data-nueva-desde-busqueda]") ? ((escena.querySelector(".hoja-separar") || pagina()).querySelector("[data-buscar]") || {}).value || "" : ""; api.hojaNueva({ linea: l, sugerida: txt.trim().length >= 3 ? { desc: txt.trim(), color: "", hex: "", tallas: {} } : null, alGuardar: (d) => { describirNueva(l, d); refrescarSeparar(l); } }); return; }
      if (t.matches("[data-quitar-nueva]")) { quitarNuevaDesc(l, t.dataset.quitarNueva); return refrescarSeparar(l); }
      if (t.matches("[data-causa]")) { M.ponerCausa(m, t.dataset.linea, t.dataset.causa); pintarPaso(); return; }
      if (t.matches("[data-causa-total]")) { m.causaTotal = m.causaTotal === t.dataset.causaTotal ? null : t.dataset.causaTotal; pintarPaso(); return; }
      if (t.matches("[data-resp]")) { m.responsable = t.dataset.resp; pintarPaso(); return; }
      if (t.matches("[data-recibir]")) return cerrar();
      if (t.matches("[data-falta]")) { const k = t.dataset.falta; if (k === "vacio") return irPaso(2); const el = pagina().querySelector(k === "responsable" ? ".responsables" : `[data-causa][data-linea="${t.dataset.linea}"]`); if (el) { el.scrollIntoView({ block: "center", behavior: api.quieto() ? "auto" : "smooth" }); api.destello(el.closest(".card") || el); } return; }
      if (t.matches("[data-hacer]")) return hacerAhora(t.dataset.hacer, t.dataset.linea, t.dataset.nombre, t.dataset.desc, t.dataset.titulo);
      if (t.matches("[data-otro]")) { document.querySelector("[data-reiniciar]").click(); return; }
      if (t.matches("[data-accion]")) { api.aviso({ "agregar-proveedor": "Abre la hoja «Agregar proveedor» (RUC y nombre), como en Llegó mercadería", etiquetas: `Abre Etiquetas de precio con las ${totalEnStock()} prendas cargadas`, colgar: "Abre Colgar en el piso con lo que ya está en stock", avisar: "Lucía recibe el aviso en su Inicio", historial: "Abre «Todo lo recibido»" }[t.dataset.accion] || "Acción de la pantalla real", "pizarra"); }
    });
    /** Redibuja solo el bloque de separar (en la página o en la hoja) y lo que depende de él. */
    function refrescarSeparar(l) {
      const h = escena.querySelector(`.hoja-separar [data-separar="${l.id}"]`); if (h) { h.outerHTML = bloqueSeparar(l); return; }
      if (m.cerrado) return pintarPaso();
      refrescarContador(l);
    }
    escena.addEventListener("input", (e) => {
      if (e.target.matches("[data-contadas]")) { const l = M.linea(m, foco); if (!l) return; M.contar(m, foco, { valor: e.target.value }); ajustar(l); refrescarContador(l); }
      if (e.target.matches("[data-buscar]")) buscarEn(e.target.value, lineaDe(e.target));
      if (e.target.matches("[data-guia]")) m.guia = e.target.value;
      if (e.target.matches("[data-dijeron]")) m.dijeronTotal = e.target.value !== "" ? Number(e.target.value) : null;
      if (e.target.matches("[data-dijeron-linea]")) { const l = M.linea(m, foco); if (!l) return; l.dijeron = e.target.value !== "" ? Math.max(0, Math.floor(Number(e.target.value) || 0)) : null; if (M.diferencia(l) === 0) l.causa = null; refrescarContador(l); }
      if (e.target.matches("[data-buscar-prov]")) { const k = RF.clave(e.target.value); pagina().querySelectorAll("[data-provs] .resp").forEach((b) => { b.hidden = k.length > 0 && !RF.clave(b.textContent).includes(k); }); }
    });
    escena.addEventListener("keydown", (e) => {
      if (e.target.matches("[data-buscar]") && e.key === "Enter") { e.preventDefault(); const raiz = e.target.closest("[data-separar]"); const s = raiz.querySelector(".sug[aria-selected=true]"); if (s) s.click(); else if (e.target.value.trim()) buscarEn(e.target.value, lineaDe(e.target)); }
      if (e.target.matches("[data-contadas]") && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
    });

    // «Abrir en» de la barra: la recepción ya avanzada hasta ese punto.
    function separarReal(l, { detallar: det = "algunas" } = {}) {
      const real = RF.realPorProducto(l.id);
      real.productos.forEach((p, i) => { const prod = RF.PRODUCTOS.find((x) => x.nombre === p.nombre); if (!prod) return; const n = Object.values(p.variantes).reduce((a, b) => a + b, 0); agregarProducto(l, prod, n); if (det === "todas" || (det === "algunas" && i % 2 === 0)) detallar(l, p.nombre, p.variantes); });
      if (real.nuevas) nuevasSinN(l, { valor: real.nuevas });
    }
    function saltarA(en) {
      if (!en || en === "inicio") return;
      if (!m.fardo) { m.proveedor = SIN_AVISO.prov; m.provElegido = true; m.dijeronTotal = null; agregarLineaSin("CMS", 40); agregarLineaSin("VES", 24); }
      M.abrir(m); foco = (m.lineas[0] || {}).id || null;
      if (en === "contar") { paso = 2; return; }
      m.lineas.forEach((l, i) => { M.contarReal(m, l.id); l.visitada = true; if (i !== 1) separarReal(l); }); // la segunda categoría queda sin separar, a propósito
      if (m.fardo) { const x = agregarLineaExtra("TOP", "cds"); M.contar(m, x.id, { valor: 3 }); nuevasSinN(x, { valor: 3 }); } // y llegaron 3 tops que nadie anunció
      if (en === "separar") { paso = 2; return; }
      paso = 3; if (en === "cerrar") return;
      for (const l of m.lineas) if (M.diferencia(l)) M.ponerCausa(m, l.id, "proveedor");
      if (!m.fardo && m.dijeronTotal != null && M.totalContadas(m) !== m.dijeronTotal) m.causaTotal = "proveedor";
      m.responsable = "mari"; M.cerrar(m);
    }
    saltarA(est.en);
    pintarPaso();
    ui = { m, irPaso, contar, setFoco: (id) => { foco = id; }, cerrar, reabrir, pintar: pintarPaso, abrir: () => { const b = pagina().querySelector("[data-abrir]"); if (b) b.click(); }, agregarProducto, detallar, nuevasSinN, refrescar: refrescarContador, separarReal, agregarLineaExtra, agregarLineaSin };
  },

  /** La demo: Mariana cuenta categoría por categoría; separa por nombre lo que reconoce, deja Vestidos para después y cierra. */
  async demo(api, viva) {
    const { modelo: m, Modelo: M, pausa } = api;
    await pausa(900); if (!viva()) return;
    if (!m.fardo) { m.proveedor = RF.SIN_AVISO.prov; m.provElegido = true; ui.pintar(); await pausa(700); }
    ui.abrir(); await pausa(1500); if (!viva()) return;
    if (!m.fardo) { ui.agregarLineaSin("CMS", 40); ui.agregarLineaSin("VES", 24); ui.setFoco(m.lineas[0].id); ui.pintar(); api.aviso("Del WhatsApp: 40 blusas y 24 vestidos", "neutro"); await pausa(900); }
    for (const [i, l] of [...m.lineas].entries()) {
      ui.setFoco(l.id); await ui.irPaso(2, { directo: true }); await pausa(500); if (!viva()) return;
      const real = RF.realPorProducto(l.id); const pasos = Math.min(6, real.total);
      for (let k = 1; k <= pasos; k++) { ui.contar(l.id, { valor: Math.round((real.total * k) / pasos) }); await pausa(160); if (!viva()) return; }
      l.visitada = true; await pausa(500);
      if (i === 1) { api.aviso("Vestidos: solo el número; separarlos queda para después", "neutro"); await pausa(900); continue; }
      for (const [j, p] of real.productos.entries()) { const prod = RF.PRODUCTOS.find((x) => x.nombre === p.nombre); if (!prod) continue; const n = Object.values(p.variantes).reduce((a, b) => a + b, 0); ui.agregarProducto(l, prod, n); ui.refrescar(l); await pausa(650); if (!viva()) return; if (j % 2 === 0) { ui.detallar(l, p.nombre, p.variantes); ui.refrescar(l); api.aviso(`${p.nombre}: tallas y colores puestos, entran al stock`, "verde"); await pausa(800); } }
      if (real.nuevas) { ui.nuevasSinN(l, { valor: real.nuevas }); ui.refrescar(l); api.aviso(`${real.nuevas} ${RF.CATS[l.cat].varias} nuevas: se describen y crean después`, "pizarra"); await pausa(900); }
      await pausa(400);
    }
    if (m.fardo) { const x = ui.agregarLineaExtra("TOP", "cds"); ui.setFoco(x.id); await ui.irPaso(2, { directo: true }); await pausa(500); ui.contar(x.id, { valor: 3 }); await pausa(400); ui.nuevasSinN(x, { valor: 3 }); ui.refrescar(x); api.aviso("3 tops que no venían en el fardo: Compras lo ve con el proveedor", "ambar"); await pausa(1100); if (!viva()) return; }
    await ui.irPaso(3); await pausa(900); if (!viva()) return;
    for (const l of m.lineas) if (M.diferencia(l) && !l.causa) { M.ponerCausa(m, l.id, "proveedor"); ui.pintar(); await pausa(700); }
    if (!m.fardo && m.dijeronTotal != null && M.totalContadas(m) !== m.dijeronTotal) { m.causaTotal = "proveedor"; ui.pintar(); await pausa(600); }
    m.responsable = "mari"; ui.pintar(); await pausa(900); if (!viva()) return;
    const b = document.querySelector("[data-recibir]"); b && b.scrollIntoView({ block: "center", behavior: "smooth" }); await pausa(700); if (!viva()) return;
    ui.cerrar();
  },
});
