<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recibir mercadería · 3 maquetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Las tres maquetas juntas, con pestañas para alternar sin salir. Cada una es un archivo suelto (a-camino.html, b-mesa.html,
   c-hilo.html) que también se abre solo; aquí se cargan en un marco y comparten datos, tema, ancho y movimiento por el hash. */
:root{--rojo:#b8412d;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--taupe:#805c4c;--t60:rgba(26,26,24,.6);--t25:rgba(26,26,24,.25);--ease:cubic-bezier(.32,.72,.24,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--sand);background:var(--papel)}
.top h1{font-family:'EB Garamond',serif;font-weight:600;font-size:22px;line-height:1.1}
.top h1 small{display:block;font-family:'DM Sans',sans-serif;font-weight:400;font-size:12px;color:var(--taupe);margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--t25);border-radius:12px;padding:8px 14px;min-width:210px;transition:background-color 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease)}
.tab b{display:block;font-size:13px}
.tab small{display:block;font-size:11.5px;color:var(--t60);margin-top:1px}
.tab:hover{border-color:var(--tinta)}
.tab[aria-selected=true]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.tab[aria-selected=true] small{color:rgba(245,240,232,.75)}
.nota{margin-left:auto;font-size:11.5px;color:var(--t60);max-width:300px;line-height:1.35}
iframe{flex:1;border:0;width:100%;background:var(--crema)}
</style>
</head>
<body>
<div class="top">
  <h1>Recibir mercadería<small>Inventario ▸ Recibir mercadería · el fardo que manda Compras</small></h1>
  <nav class="tabs" role="tablist" aria-label="Maquetas">
    <button class="tab" role="tab" data-f="a-camino.html?v=2" aria-selected="true"><b>A · Camino</b><small>Cuatro pasos, uno a la vez: qué llegó → contar → separar → cerrar</small></button>
    <button class="tab" role="tab" data-f="b-mesa.html?v=2" aria-selected="false"><b>B · Mesa de conteo</b><small>Todo a la vista: un montón por categoría, las bandejas al lado</small></button>
    <button class="tab" role="tab" data-f="c-hilo.html?v=2" aria-selected="false"><b>C · Hilo de la pistola</b><small>Una sola caja: cada lectura escribe una línea y suma</small></button>
  </nav>
  <p class="nota">Atajos: 1 · 2 · 3 cambian de maqueta. Dentro de cada una: datos (con aviso / sin aviso), tema, ancho, movimiento, «▶ Ver cómo se recibe» y «↻ Reiniciar».</p>
</div>
<iframe id="vista" title="Maqueta" src="a-camino.html?v=2"></iframe>
<script>
  const marco = document.getElementById("vista"), tabs = [...document.querySelectorAll(".tab")];
  let hashMarco = "";
  function ir(i) {
    tabs.forEach((t, j) => t.setAttribute("aria-selected", String(i === j)));
    marco.src = tabs[i].dataset.f + hashMarco;
    try { history.replaceState(null, "", "#" + "abc"[i]); } catch (_) {}
  }
  tabs.forEach((t, i) => t.addEventListener("click", () => ir(i)));
  document.addEventListener("keydown", (e) => { if (e.target.closest("input,textarea")) return; const i = "123".indexOf(e.key); if (i >= 0) ir(i); });
  // La maqueta avisa su hash (datos, tema, ancho…) para que la siguiente no vuelva a empezar.
  window.addEventListener("message", (e) => { if (e.data && typeof e.data.hash === "string") hashMarco = e.data.hash; });
  const ini = "abc".indexOf((location.hash || "").slice(1, 2)); if (ini > 0) ir(ini);
</script>
</body>
</html>
