<body>
<div class="demo" role="region" aria-label="Controles de la demo">
  <b class="marca">Spike · Finanzas</b>
  <div class="grupo"><span>Ver como</span>
    <div class="seg" data-ctl="rol"><button data-v="lider" aria-pressed="true">Líder</button><button data-v="encargada" aria-pressed="false">Encargada de TRU</button></div>
  </div>
  <div class="grupo"><span>Datos</span>
    <div class="seg" data-ctl="fuentes"><button data-v="no" aria-pressed="true">Ocultar origen</button><button data-v="si" aria-pressed="false">De dónde sale cada dato</button></div>
  </div>
  <div class="grupo"><span>Tema</span>
    <div class="seg" data-ctl="tema"><button data-v="light" aria-pressed="false">Claro</button><button data-v="dark" aria-pressed="false">Oscuro</button></div>
  </div>
  <button class="btn btn-sutil btn-sm" id="reiniciar" style="color:var(--crema);border-color:color-mix(in oklab, var(--crema) 28%, transparent)">Reiniciar</button>
  <p class="nota" id="nota"></p>
</div>
<div class="app">
  <aside class="lateral" aria-label="Menú">
    <div class="logo"><svg width="30" height="26" viewBox="0 0 30 26" aria-hidden="true"><path d="M2 5c5 1 9 4 11 9 2-6 7-10 15-12-4 3-7 7-8 12-1 5-4 9-9 10 2-2 3-5 2-8-3 0-7-3-11-11z" fill="none" stroke="var(--rojo)" stroke-width="1.4" stroke-linejoin="round"/></svg>CAYLA</div>
    <button class="btn-nuevo" type="button">+ Nuevo</button>
    <nav class="nav" id="nav"></nav>
    <p class="lema">Donde el estilo transforma.</p>
    <div class="pie"><span class="avatar" id="pieAvatar">FA</span><div><div style="font-size:13.5px" id="pieNombre"></div><div class="etq" style="font-size:9.5px" id="pieRol"></div></div></div>
  </aside>
  <div class="principal">
    <div class="cabecera">
      <label class="ir-movil"><span class="etq">Ir a</span><select class="control" id="irMovil"></select></label>
      <span class="chip-sede" id="chipSede"></span>
    </div>
    <main class="pagina" id="pagina"></main>
  </div>
</div>
