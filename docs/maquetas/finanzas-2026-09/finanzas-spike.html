<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas CAYLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Paleta oficial CAYLA (guía «CAYLA Dynamic», Sala de diseño 2026-09-22) — once tokens, cuatro radios,
     una curva de entrada y una de salida (globals.css). Sin sombras, sin gradientes: la línea sand es el adorno. */
  :root{
    --crema:#f5f0e8; --papel:#fbf8f2; --tinta:#1a1a18; --rojo:#b8412d; --rojo-profundo:#8b2a1f;
    --sand:#e8e0d0; --taupe:#805c4c; --verde:#48603f; --ambar:#74501a; --hueso:#eae1d2; --pizarra:#4c5d6e;
    --velo:rgba(26,26,24,.38);
    --r-control:8px; --r-superficie:16px; --r-flotante:20px; --r-pildora:999px;
    --ease-cayla:cubic-bezier(.32,.72,.24,1); --ease-salida:cubic-bezier(.4,0,1,1);
    --serif:"EB Garamond", ui-serif, Georgia, serif;
    --sans:"DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --crema:#1c1a16; --papel:#26221d; --tinta:#ede7db; --rojo:#d4634a; --rojo-profundo:#e8836b;
      --sand:#332e27; --taupe:#ab9080; --verde:#8fae80; --ambar:#c99a4a; --hueso:#15110d; --pizarra:#9db0c2;
      --velo:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --crema:#1c1a16; --papel:#26221d; --tinta:#ede7db; --rojo:#d4634a; --rojo-profundo:#e8836b;
    --sand:#332e27; --taupe:#ab9080; --verde:#8fae80; --ambar:#c99a4a; --hueso:#15110d; --pizarra:#9db0c2;
    --velo:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--crema);}
  body{color:var(--tinta); font-family:var(--sans); font-size:14px; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;}
  button,input,select{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--rojo); outline-offset:2px;}
  .serif{font-family:var(--serif);}
  .etq{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe);}
  .sub{color:var(--taupe);}

  /* ---------- Barra de la demo (no es parte del ERP) ---------- */
  .demo{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--tinta); color:var(--crema);
    padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;}
  .demo b.marca{font-family:var(--serif); font-size:17px; font-weight:500; margin-right:4px; white-space:nowrap;}
  .demo .grupo{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .demo .grupo > span{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.62;}
  .seg{display:inline-flex; max-width:100%; overflow-x:auto; border:1px solid color-mix(in oklab, var(--crema) 28%, transparent); border-radius:var(--r-control); overflow:hidden;}
  .seg button{background:transparent; border:0; color:var(--crema); padding:6px 11px; font-size:12.5px; font-weight:500; white-space:nowrap; transition:background-color 150ms, color 150ms;}
  .seg button + button{border-left:1px solid color-mix(in oklab, var(--crema) 20%, transparent);}
  .seg button[aria-pressed="true"]{background:var(--crema); color:var(--tinta);}
  .demo .nota{flex-basis:100%; font-size:12.5px; line-height:1.5; opacity:.82; margin:0;}
  .demo .nota b{opacity:1; color:var(--crema);}

  /* ---------- Carcasa del ERP (lateral claro, como hoy) ---------- */
  .app{display:grid; grid-template-columns:248px 1fr; min-height:calc(100vh - 90px);}
  .lateral{border-right:1px solid var(--sand); padding:22px 14px 16px; display:flex; flex-direction:column; gap:18px; background:var(--crema);}
  .logo{display:flex; align-items:center; gap:10px; padding:0 8px; font-size:15px; font-weight:600; letter-spacing:.32em;}
  .btn-nuevo{background:var(--tinta); color:var(--crema); border:0; border-radius:var(--r-control); padding:12px; font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav a{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-control); text-decoration:none; color:var(--tinta); font-size:14px;}
  .nav a svg{width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.4;}
  .nav a .flecha{margin-left:auto; opacity:.4; font-size:11px;}
  .nav .hijo{padding-left:32px;}
  .nav a.activo{background:var(--sand); font-weight:500;}
  .nav a:not(.activo):hover{background:color-mix(in oklab, var(--sand) 50%, transparent);}
  .lateral .pie{margin-top:auto; border-top:1px solid var(--sand); padding:14px 8px 0; display:flex; align-items:center; gap:10px;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--sand); display:grid; place-items:center; font-family:var(--serif); font-size:14px;}
  .lema{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--taupe); padding:0 8px;}

  .principal{min-width:0; display:flex; flex-direction:column;}
  .cabecera{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 32px; border-bottom:1px solid var(--sand);}
  .icono-btn{background:transparent; border:1px solid transparent; border-radius:var(--r-control); width:34px; height:34px; display:grid; place-items:center; color:var(--taupe);}
  .icono-btn:hover{border-color:var(--sand);}
  .chip-sede{border:1px solid var(--sand); background:var(--papel); border-radius:var(--r-control); padding:8px 12px; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; display:inline-flex; gap:8px; align-items:center;}
  .pagina{padding:28px 32px 56px; display:flex; flex-direction:column; gap:22px; max-width:1320px; width:100%;}

  /* ---------- Botones: cinco variantes de la guía ---------- */
  .btn{border-radius:var(--r-control); font-size:13px; font-weight:500; padding:8px 14px; border:1px solid transparent; white-space:nowrap; transition:background-color 150ms, border-color 150ms, color 150ms; display:inline-flex; align-items:center; gap:6px; line-height:1.2;}
  .btn-primario{background:var(--tinta); color:var(--crema);}
  .btn-primario:hover{background:var(--rojo-profundo);}
  .btn-secundario{background:transparent; border-color:var(--sand); color:var(--tinta);}
  .btn-secundario:hover{border-color:color-mix(in oklab, var(--taupe) 40%, transparent); background:color-mix(in oklab, var(--sand) 50%, transparent);}
  .btn-sutil{background:transparent; border-color:var(--sand); color:var(--taupe);}
  .btn-sutil:hover{color:var(--tinta); background:color-mix(in oklab, var(--sand) 30%, transparent);}
  .btn-sutil[aria-pressed="true"]{color:var(--tinta); border-color:var(--tinta);}
  .btn-enlace{background:none; border:0; padding:0; color:var(--tinta); text-decoration:underline; text-underline-offset:3px; font-size:12.5px;}
  .btn-enlace:hover{color:var(--rojo);}
  .btn-enlace.rojo{color:var(--rojo);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  /* ---------- Encabezado de pantalla ---------- */
  .encabezado{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px;}
  .encabezado h1{font-family:var(--serif); font-weight:500; font-size:36px; line-height:1.05; margin:6px 0 8px; text-wrap:balance;}
  .encabezado p{margin:0; max-width:58ch; line-height:1.55;}
  .encabezado .hora{font-size:12px; margin-top:6px; color:var(--taupe);}
  .encabezado .acciones{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---------- Insignias ---------- */
  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--r-pildora); font-size:12px; white-space:nowrap;}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge[data-tono="verde"]{background:color-mix(in oklab, var(--verde) 15%, transparent); color:var(--verde);}
  .badge[data-tono="ambar"]{background:color-mix(in oklab, var(--ambar) 15%, transparent); color:var(--ambar);}
  .badge[data-tono="rojo"]{background:color-mix(in oklab, var(--rojo) 11%, transparent); color:var(--rojo-profundo);}
  .badge[data-tono="pizarra"]{background:color-mix(in oklab, var(--pizarra) 15%, transparent); color:var(--pizarra);}
  .badge[data-tono="taupe"]{background:var(--sand); color:var(--taupe);}
  .badge.sin-punto::before{display:none;}

  /* ---------- Cifras ---------- */
  .cifras{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px;}
  .tile{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:16px 18px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0;}
  button.tile{transition:border-color 150ms, background-color 150ms;}
  button.tile:hover{border-color:color-mix(in oklab, var(--taupe) 45%, transparent);}
  button.tile[aria-pressed="true"]{border-color:var(--tinta); background:color-mix(in oklab, var(--hueso) 45%, var(--papel));}
  .tile .fila-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .tile .valor{font-family:var(--serif); font-size:32px; line-height:1; font-weight:500;}
  .tile .valor small{font-family:var(--sans); font-size:13px; color:var(--taupe); font-weight:400; margin-left:4px;}
  .tile .valor.rojo{color:var(--rojo);} .tile .valor.ambar{color:var(--ambar);}
  .tile .det{font-size:12.5px; color:var(--taupe); line-height:1.45;}
  .tile .ir{font-size:12px; color:var(--taupe);}
  .split{display:flex; height:6px; border-radius:var(--r-pildora); overflow:hidden; background:var(--hueso); margin-top:2px;}
  .split i{display:block; height:100%;}
  .split i.piso{background:var(--tinta);} .split i.alm{background:color-mix(in oklab, var(--taupe) 55%, transparent);}
  .prioridades-cab{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px;}
  .prioridades-cab h2{font-family:var(--serif); font-weight:500; font-size:22px; margin:0;}
  .prioridades-cab p{margin:2px 0 0; font-size:13px; color:var(--taupe);}

  /* ---------- Superficie de la tabla ---------- */
  .superficie{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); overflow:hidden;}
  .herramientas{display:flex; flex-wrap:wrap; gap:10px; padding:14px; align-items:center; border-bottom:1px solid var(--sand);}
  .buscar{flex:1 1 240px; position:relative;}
  .buscar svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--taupe); fill:none; stroke-width:1.6;}
  .control{border-radius:var(--r-control); border:1px solid var(--sand); background:var(--hueso); padding:8px 12px; font-size:13.5px; width:100%; min-height:36px;}
  .buscar .control{padding-left:34px;}
  select.control{width:auto; flex:0 1 150px; appearance:none; padding-right:30px;
    background-image:linear-gradient(45deg, transparent 50%, var(--taupe) 50%), linear-gradient(135deg, var(--taupe) 50%, transparent 50%);
    background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat;}
  .filtro-activo{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--sand); font-size:13px; background:color-mix(in oklab, var(--hueso) 40%, transparent);}

  .tabla-wrap{overflow-x:auto;}
  table.t{width:100%; border-collapse:collapse; font-size:13px; min-width:980px;}
  table.t thead{background:color-mix(in oklab, var(--sand) 70%, transparent);}
  table.t th{text-align:left; font-weight:400; color:var(--taupe); padding:9px 14px; font-size:12px; white-space:nowrap;}
  table.t th.num, table.t td.num{text-align:right;}
  table.t td{padding:11px 14px; border-top:1px solid var(--sand); vertical-align:middle;}
  table.t tbody tr:nth-child(even){background:color-mix(in oklab, var(--hueso) 50%, transparent);}
  table.t tbody tr{transition:background-color 150ms;}
  table.t tbody tr:hover{background:color-mix(in oklab, var(--crema) 60%, transparent);}
  .prenda{display:flex; align-items:center; gap:12px; min-width:0;}
  .tela{width:38px; height:44px; border-radius:6px; flex:none; border:1px solid var(--sand); position:relative; overflow:hidden;}
  .tela::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 5px);}
  .prenda b{font-weight:600; font-size:13.5px; display:block;}
  .prenda span{font-size:12px; color:var(--taupe); display:block;}
  .prenda .sku{font-size:11px; letter-spacing:.02em; opacity:.8;}
  td.c-prenda{min-width:230px;}
  .pa{display:flex; flex-direction:column; gap:5px; min-width:92px;}
  .pa .n{white-space:nowrap;} .pa .n em{font-style:normal; color:var(--taupe);}
  .pa .split{width:92px; height:4px;}
  .disp b{font-family:var(--serif); font-size:20px; font-weight:500;}
  .disp span{display:block; font-size:11.5px; color:var(--taupe); white-space:nowrap;}
  .disp span.alerta{color:var(--rojo-profundo);}
  .red{font-size:12.5px; line-height:1.45; color:var(--taupe); max-width:190px;}
  .red b{color:var(--tinta); font-weight:500; white-space:nowrap;}
  .camino{font-size:12.5px; white-space:nowrap;} .camino span{display:block; color:var(--taupe); font-size:11.5px;}
  .camino .tarde{color:var(--rojo-profundo);}
  .acc{display:flex; justify-content:flex-end; align-items:center; gap:6px; position:relative;}
  .acc-links{display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap;}
  .mas{width:30px; height:30px; padding:0; justify-content:center; font-size:16px; line-height:1;}
  .extras{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .pie-tabla{display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:space-between; align-items:center; padding:12px 14px; border-top:1px solid var(--sand); font-size:12.5px; color:var(--taupe);}
  .leyenda{display:flex; flex-wrap:wrap; gap:6px 16px;}
  .vacio-filtro{padding:32px 16px; text-align:center; color:var(--taupe);}

  /* ---------- Menú «⋯» ---------- */
  .menu{position:absolute; right:0; top:calc(100% + 6px); z-index:20; background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-control); min-width:188px; padding:4px; display:flex; flex-direction:column; animation:sube-menu 200ms var(--ease-cayla) both;}
  .menu button{background:none; border:0; text-align:left; padding:8px 10px; border-radius:6px; font-size:13px;}
  .menu button:hover{background:var(--hueso);}
  .menu hr{border:0; border-top:1px solid var(--sand); margin:4px 0;}
  @keyframes sube-menu{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  /* ---------- Estado vacío: guía de primeros pasos ---------- */
  .guia{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:28px;}
  .guia h2{font-family:var(--serif); font-weight:500; font-size:28px; margin:6px 0 6px; text-wrap:balance;}
  .guia > p{margin:0 0 20px; color:var(--taupe); max-width:62ch; line-height:1.55;}
  .caminos{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  .camino-c{border:1px solid var(--sand); border-radius:var(--r-superficie); padding:18px; display:flex; flex-direction:column; gap:10px; background:var(--crema);}
  .camino-c .ico{width:36px; height:36px; border-radius:50%; background:var(--hueso); display:grid; place-items:center;}
  .camino-c .ico svg{width:18px; height:18px; stroke:var(--tinta); fill:none; stroke-width:1.4;}
  .camino-c h3{margin:0; font-size:15px; font-weight:600;}
  .camino-c p{margin:0; font-size:13px; color:var(--taupe); line-height:1.5; flex:1;}
  .camino-c .dato{font-family:var(--serif); font-size:20px;}
  .aviso-franja{display:flex; gap:12px; align-items:flex-start; margin-top:18px; padding:12px 14px; border-radius:var(--r-control); background:color-mix(in oklab, var(--ambar) 10%, transparent); border:1px solid color-mix(in oklab, var(--ambar) 28%, transparent); font-size:13px; line-height:1.5;}
  .aviso-franja b{color:var(--ambar);}

  /* ---------- Modal (ADR-0136): velo con desenfoque → hoja sube 18px y crece → cascada 55ms ---------- */
  .velo{position:fixed; inset:0; z-index:60; background:var(--velo); backdrop-filter:blur(3px); display:grid; place-items:center; padding:16px; animation:velo-in 220ms var(--ease-cayla) both;}
  .velo.sale{animation:velo-out 220ms var(--ease-salida) both;}
  .hoja{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-flotante); width:min(480px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:24px; animation:hoja-in 380ms var(--ease-cayla) both;}
  .velo.sale .hoja{animation:hoja-out 220ms var(--ease-salida) both;}
  .hoja > *{animation:cascada 320ms var(--ease-cayla) both; animation-delay:calc(120ms + var(--i,0) * 55ms);}
  .hoja h3{font-family:var(--serif); font-weight:500; font-size:24px; margin:0 0 4px;}
  .hoja .bajada{margin:0 0 18px; color:var(--taupe); font-size:13.5px; line-height:1.5;}
  .hoja label{display:block; font-size:12px; color:var(--taupe); margin-bottom:6px;}
  .hoja .campo{margin-bottom:16px;}
  .hoja .botones{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}
  .paso{display:flex; align-items:center; gap:10px;}
  .paso button{width:36px; height:36px; border-radius:var(--r-control); border:1px solid var(--sand); background:var(--hueso); font-size:18px;}
  .paso output{font-family:var(--serif); font-size:28px; min-width:48px; text-align:center;}
  .antes-despues{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .antes-despues div{background:var(--hueso); border-radius:var(--r-control); padding:10px 12px; font-size:12.5px; color:var(--taupe);}
  .antes-despues b{display:block; font-family:var(--serif); font-size:20px; color:var(--tinta); font-weight:500;}
  .lista-mov{list-style:none; margin:0 0 16px; padding:0;}
  .lista-mov li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--sand); font-size:13px;}
  .lista-mov li span{color:var(--taupe); font-size:12px;}
  .radios{display:flex; gap:8px;}
  .radios label{flex:1; margin:0; border:1px solid var(--sand); border-radius:var(--r-control); padding:10px 12px; color:var(--tinta); font-size:13px; display:flex; gap:8px; align-items:center; background:var(--hueso);}
  @keyframes velo-in{from{opacity:0;} to{opacity:1;}}
  @keyframes velo-out{to{opacity:0;}}
  @keyframes hoja-in{from{opacity:0; transform:translate3d(0,18px,0) scale(.965);} to{opacity:1; transform:none;}}
  @keyframes hoja-out{to{opacity:0; transform:translate3d(0,10px,0) scale(.98);}}
  @keyframes cascada{from{opacity:0; transform:translate3d(0,10px,0);} to{opacity:1; transform:none;}}

  /* ---------- Loader único (ADR-0149) y aviso que sale DESPUÉS ---------- */
  .espera{position:fixed; inset:0; z-index:80; background:color-mix(in oklab, var(--crema) 82%, transparent); backdrop-filter:blur(2px); display:grid; place-items:center; animation:velo-in 200ms var(--ease-cayla) both;}
  .espera div{display:flex; flex-direction:column; align-items:center; gap:12px; font-size:13px; color:var(--taupe);}
  .espera svg{animation:aletea 1.6s ease-in-out infinite;}
  @keyframes aletea{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
  .aviso{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:90; background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:12px 16px; display:flex; gap:10px; align-items:center; font-size:13.5px; max-width:calc(100vw - 32px); animation:hoja-in 320ms var(--ease-cayla) both;}
  .aviso svg{flex:none; stroke:var(--verde); fill:none; stroke-width:2;}
  .aviso svg path{stroke-dasharray:24; stroke-dashoffset:24; animation:visto 360ms 120ms var(--ease-cayla) forwards;}
  @keyframes visto{to{stroke-dashoffset:0;}}
  .fila-nueva td{animation:destello 1.4s var(--ease-cayla);}
  @keyframes destello{0%{background:color-mix(in oklab, var(--verde) 14%, transparent);} 100%{background:transparent;}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important;}
  }

  /* ---------- Anchos menores ---------- */
  @media (max-width:1080px){

// ---------- Gráfico de barras de una sola serie, con hover y etiquetas directas ----------
// Una serie en tinta; el rojo solo marca una pérdida o una semana bajo el mínimo, SIEMPRE con su etiqueta.
function barras(items, {alto=190, umbral=null, umbralTxt='', etiquetaValor=v=>S(v)}={}){
  const W = 640, H = alto, pad = {t:34, r:12, b:46, l:12};
  const vals = items.map(i=>i.v);
  const max = Math.max(0, ...vals, umbral||0), min = Math.min(0, ...vals);
  const y = v => pad.t + (max - v) / (max - min || 1) * (H - pad.t - pad.b);
  const bw = (W - pad.l - pad.r) / items.length;
  const barra = (it, i) => {
    const x = pad.l + i*bw + bw*0.2, w = bw*0.6, y0 = y(0), y1 = y(it.v);
    const top = Math.min(y0,y1), h = Math.max(2, Math.abs(y1-y0));
    const malo = it.malo;
    const r = 4;
    // extremo de dato redondeado, anclado a la línea base
    const d = it.v >= 0
      ? `M${x},${y0} V${top+r} q0,-${r} ${r},-${r} h${w-2*r} q${r},0 ${r},${r} V${y0} Z`
      : `M${x},${y0} V${top+h-r} q0,${r} ${r},${r} h${w-2*r} q${r},0 ${r},-${r} V${y0} Z`;
    const ly = it.v >= 0 ? top - 7 : top + h + 14;
    const ly2 = it.v >= 0 ? ly - 14 : ly + 13;
    return `<g class="barra${malo?' mala':''}" tabindex="0" data-tip="${esc(it.tip||'')}">
      <rect x="${pad.l+i*bw}" y="${pad.t-10}" width="${bw}" height="${H-pad.t-pad.b+20}" fill="transparent"/>
      <path d="${d}"/>
      <text x="${x+w/2}" y="${ly}" text-anchor="middle" class="val">${etiquetaValor(it.v)}</text>
      ${malo&&it.maloTxt?`<text x="${x+w/2}" y="${ly2}" text-anchor="middle" class="val">${esc(it.maloTxt)}</text>`:''}
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" class="eje">${esc(it.n)}</text>
    </g>`;
  };
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(items.map(i=>i.n+': '+etiquetaValor(i.v)).join('; '))}">
    <line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" class="base"/>
    ${umbral!=null?`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(umbral)}" y2="${y(umbral)}" class="umbral"/>`:''}
    ${items.map(barra).join('')}
  </svg>${umbral!=null?`<p class="leyenda-g"><i></i>${esc(umbralTxt)}</p>`:''}<div class="tip" hidden></div></div>`;
}
document.addEventListener('mouseover', e => {
  const g = e.target.closest('.barra'); const cont = e.target.closest('.grafico');
  if (!cont) return; const tip = cont.querySelector('.tip');
  if (!g || !g.dataset.tip){ tip.hidden = true; return; }
  tip.innerHTML = g.dataset.tip; tip.hidden = false;
  const r = cont.getBoundingClientRect(), b = g.querySelector('path').getBoundingClientRect();
  tip.style.left = Math.min(r.width - 220, Math.max(0, b.left - r.left + b.width/2 - 110)) + 'px';

});

// ============ Cálculos compartidos ============
// Septiembre «a la fecha» (24 de 30 días): lo variable se escala, lo fijo del mes ya está entero.
const FIJAS = ['alquiler','planilla','depreciacion','personal'];
const AVANCE_MES = 24/30;
function resultadosDe(mes){
  if (mes === '2026-08') return RESULTADOS_AGO;
  const r = {};
  for (const [k, fila] of Object.entries(RESULTADOS_AGO)){
    r[k] = {}; for (const u in fila) r[k][u] = Math.round(fila[u] * (FIJAS.includes(k) ? 1 : AVANCE_MES) * (k==='ventas'&&u==='LIM' ? 1.18 : 1));
  }
  return r;
}
const LINEAS_GASTO = [['planilla','Planilla (Dynamic)'],['alquiler','Alquileres'],['servicios','Servicios básicos'],['personal','Honorarios'],
  ['publicidad','Publicidad'],['transporte','Transporte'],['suministros','Suministros'],['mantenimiento','Mantenimiento'],['depreciacion','Depreciación']];
const TIENDAS = ['TRU','AQP','LIM'];
function totalesDe(r, u){
  const us = u ? [u] : UNIDADES.map(x=>x.k);
  const s = k => us.reduce((a,x)=>a+(r[k][x]||0), 0);
  const margen = s('ventas') - s('costo') - s('flete') - s('mermas');
  const gastos = LINEAS_GASTO.reduce((a,[k])=>a+s(k), 0);
  return {ventas:s('ventas'), margen, gastos, absorbido:s('absorbido'), utilidad: margen - gastos + s('absorbido')};
}
// Punto de equilibrio: cuánto hay que vender en el mes para cubrir los costos, con el margen que se tiene.
function equilibrio(u, r=RESULTADOS_AGO){
  const t = u ? totalesDe(r, u) : totalesDe(r);
  const fijos = t.gastos - t.absorbido, pm = t.ventas ? t.margen / t.ventas : 0;
  const pe = pm ? fijos / pm : null;
  const dia = pe ? Math.ceil(pe / (t.ventas / 31)) : null;
  return {pe, ventas:t.ventas, cubre: pe ? t.ventas / pe : 0, dia, pm, fijos};
}
const disponible = () => CUENTAS.filter(c=>veUnidad(c.unidad||'EMP')||esLider()).reduce((a,c)=>a+c.saldo, 0);
const saldoPorPagar = p => p.total - p.pagado;
const salidasDiarias = () => FLUJO_REAL.salidas.reduce((a,x)=>a+x[1],0) / 24;
// Proyección semana a semana. Con «retrasar Distribuidora Norte», su pago pasa a la semana siguiente.
function proyeccion(esc = {}){
  let saldo = disponible();
  const sem = FLUJO_SEMANAS.map(w=>({...w}));
  if (esc.retrasarNorte){ sem[2].sale -= 15300; sem[3].sale += 15300; }
  if (esc.ventasTodas){ sem.forEach(w=> w.entra = Math.round(w.entra * (1 + esc.ventasTodas/100))); }
  return sem.map(w => { saldo += w.entra - w.sale; return {...w, saldo}; });
}

// ============ Resumen (pieza 4) ============
VISTAS.resumen = () => {
  const todas = verTodas(), u = todas ? null : E.ver;
  const sep = resultadosDe('2026-09'), ago = RESULTADOS_AGO;
  const tAgo = u ? totalesDe(ago, u) : totalesDe(ago);
  const vendidoSep = u ? (sep.ventas[u]||0) : totalesDe(sep).ventas;
  const pp = POR_PAGAR.filter(p=>saldoPorPagar(p)>0 && enVista(p.u));
  const debe7 = pp.filter(p=>dias(p.vence, HOY) <= CONFIG.avisoVenceDias).reduce((a,p)=>a+saldoPorPagar(p),0) + (todas ? 29800 : 0);
  const vencidas = pp.filter(p=>dias(p.vence, HOY) < 0);
  const proy = proyeccion(), riesgo = proy.find(w => w.saldo < minimoCaja());
  const diasCaja = Math.floor(disponible() / salidasDiarias());
  const eq = equilibrio(u);
  const esTienda = !u || TIENDAS.includes(u);
  const metaVentas = u ? PRESUPUESTO.ventas[u] : TIENDAS.reduce((a,x)=>a+PRESUPUESTO.ventas[x],0);
  const proyVentas = Math.round(vendidoSep / AVANCE_MES);
  const efectivoU = u ? (CUENTAS.find(c=>c.unidad===u)?.saldo || 0) : disponible();

  // ---- La salud, en frases (lo primero que se lee) ----
  const frases = [];
  if (todas){
    frases.push({n:`${diasCaja} días`, t:'Si mañana no vendieras nada, tu plata alcanza para pagar esto', d:`${S(disponible())} disponibles contra ${S(Math.round(salidasDiarias()))} que salen en un día normal.`, tono: diasCaja < 10 ? 'rojo' : diasCaja < 20 ? 'ambar' : 'verde'});
    frases.push({n:`día ${eq.dia}`, t:'CAYLA cubre sus costos del mes ese día', d:`Necesita vender ${S(eq.pe)} al mes; en agosto vendió ${S(eq.ventas)}. ${eq.dia >= 31 ? 'No alcanza a cubrirlos en el mes.' : `Lo que vende después ${31-eq.dia===1?'del día '+eq.dia+' (solo 1 día)':'(los últimos '+(31-eq.dia)+' días)'} es la ganancia.`}`, tono: eq.dia > 27 ? 'ambar' : 'verde'});
  } else if (esTienda){

  }
  if (todas) frases.push({n:pct(proyVentas/metaVentas), t:'de la meta de ventas de septiembre, al ritmo de hoy', d:`Meta ${S(metaVentas)}; vas en ${S(vendidoSep)} y al cierre llegarías a ${S(proyVentas)}.`, tono: proyVentas/metaVentas < .9 ? 'ambar' : 'verde'});

  // ---- Para decidir hoy: cada aviso dice cuánto está en juego y a dónde ir ----
  const lim = equilibrio('LIM');
  const decidir = [
    ...vencidas.map(p=>({tono:'rojo', t:`Factura vencida: ${p.prov}`, d:`Saldo ${S(saldoPorPagar(p))}, venció hace ${dias(HOY, p.vence)} días.`, imp:`${S(saldoPorPagar(p))} en juego`, ir:'dinero:porpagar', b:'Pagar'})),

    (todas || u==='LIM') && (() => { const e = escenarioResultado({alqLIM:5000, ventasLIM:15}); const antes = totalesDe(ago,'LIM').utilidad, despues = e.LIM.utilidad;
      return {tono:'ambar', t:`LIM pierde ${S(-antes)} al mes`, d:`Necesita vender ${S(lim.pe)} y vende ${S(lim.ventas)}. Con el alquiler a S/ 5,000 y 15 % más de ventas, ${despues>=0?'dejaría '+S(despues):'perdería '+S(-despues)} al mes.`, imp:`${S(despues-antes)} al mes de diferencia`, ir:'reportes:escenarios', b:'Probar escenario'}; })(),
    ...FIJOS.filter(f=>f.estado==='falta' && enVista(f.u)).map(f=>({tono:'ambar', t:`No se registró la ${f.n.toLowerCase()} de ${nombreUnidad(f.u)}`, d:`Suele llegar el día ${f.dia} por unos ${S(f.monto)}. Si no está, el resultado del mes sale mejor de lo que es.`, imp:`~${S(f.monto)}`, ir:'gastos:fijos', b:'Ver fijos'})),
    ...FIJOS.filter(f=>f.estado==='propuesto' && enVista(f.u)).slice(0,1).map(f=>({tono:'pizarra', t:`${FIJOS.filter(x=>x.estado==='propuesto'&&enVista(x.u)).length} gastos fijos listos para confirmar`, d:`Por ejemplo: ${f.n.toLowerCase()} de ${nombreUnidad(f.u)}, ${S(f.monto)}, vence el ${f.dia}. Se confirman con un clic.`, imp:'', ir:'gastos:fijos', b:'Confirmar'})),
    ...RAROS.filter(x=>x.u==null ? todas : enVista(x.u)).map(x=>({tono:'pizarra', t:x.t, d:x.d, imp:'', ir:x.ir, b:'Revisar', raro:true})),
    EGRESOS.some(e=>enVista(e.u)) && (n => ({tono:'pizarra', t:`${n} ${n===1?'egreso':'egresos'} de caja sin clasificar`, d:'Mientras no se diga si son gasto, depósito o retiro, no cuentan en ningún número.', imp:'', ir:'gastos:egresos', b:'Clasificar'}))(EGRESOS.filter(e=>enVista(e.u)).length),
    todas && Object.keys(E.parejas).length < EXTRACTO_IBK.length && {tono:'pizarra', t:'Interbank tiene 6 movimientos por confirmar', d:'El sistema ya propuso la pareja de cada uno. Confirmar toma un minuto.', imp:'', ir:'dinero:conciliacion', b:'Conciliar'},
    todas && {tono:'pizarra', t:`Vas al ${pct(VENTAS_12M/(300*UIT))} del límite de 300 UIT`, d:'Al cruzarlo, SUNAT exige libros electrónicos. A este ritmo, a mediados de 2027.', imp:'', ir:'impuestos', b:'Ver'},
  ].filter(Boolean);

  const coberturas = TIENDAS.filter(x=>todas).map(x=>{ const e = equilibrio(x); return {n:nombreUnidad(x).replace('Tienda ',''), v:Math.round(e.cubre*100), malo:e.cubre<1, maloTxt:'no cubre',
    tip:`<b>${nombreUnidad(x)}</b><br>Necesita ${S(e.pe)} · vendió ${S(e.ventas)}<br>${e.cubre>=1?'Cubre sus costos el día '+e.dia:'Le faltan '+S(e.pe-e.ventas)+' al mes'}`}; });

  return `
  ${cabecera({sobre:'Finanzas · Resumen', titulo: todas ? 'CAYLA, al jueves 24 de septiembre' : `${nombreUnidad(u)}, al jueves 24`,
    bajada: todas ? 'Cómo está el negocio y qué conviene decidir hoy. Todo sale de lo que ya registran Ventas, Caja, Compras, Producción y Dynamic.' : `Solo ${nombreUnidad(u)}. Para ver el negocio entero, elige «Todas las tiendas».`,
    acciones: filtroVer()})}
  <section class="salud anim-sube">${frases.map(f=>`<div class="frase" data-tono="${f.tono}"><b class="serif">${f.n}</b><div><p class="t">${f.t}</p><p class="d">${f.d}</p></div></div>`).join('')}</section>
  <section class="cifras cinco">
    <div class="tile anim-sube"><span class="etq">Vendido en el mes</span><div class="valor">${esTienda?S(vendidoSep):'—'}</div><div class="det">${todas?TIENDAS.map(x=>x+' '+S(sep.ventas[x])).join(' · '):'Sin IGV'}</div>${F('existe','venta_items')}</div>

    <div class="tile anim-sube"><span class="etq">Debes en ${CONFIG.avisoVenceDias} días</span><div class="valor ${vencidas.length?'rojo':''}">${S(debe7)}</div><div class="det">${todas?'Incluye la planilla del 30. ':''}${vencidas.length} vencida${vencidas.length===1?'':'s'}</div>${F('deriva','compras + comprobantes_produccion')}</div>
    <div class="tile anim-sube"><span class="etq">Utilidad de agosto</span><div class="valor ${tAgo.utilidad<0?'rojo':''}">${S(tAgo.utilidad)}</div><div class="det">${tAgo.ventas?'Margen bruto '+pct(tAgo.margen/tAgo.ventas):'Unidad sin ventas propias'}</div>${F('deriva','fn_estado_resultados')}</div>
    ${todas ? `<div class="tile anim-sube"><span class="etq">IGV estimado de sept.</span><div class="valor">${S(IGV_MESES[5].deb-IGV_MESES[5].cred)}</div><div class="det">Se paga en octubre según tu cronograma</div>${F('deriva','comprobantes − facturas de proveedor')}</div>`
      : esTienda ? `<div class="tile anim-sube"><span class="etq">Meta de ventas</span><div class="valor">${pct(proyVentas/metaVentas)}</div><div class="det">Proyección al cierre ${S(proyVentas)} de ${S(metaVentas)}</div>${F('nuevo','presupuestos (Configuración)')}</div>`
      : `<div class="tile anim-sube"><span class="etq">${u==='TAL'?'Sin absorber en prendas':'Gastos de agosto'}</span><div class="valor">${S(u==='TAL'?tAgo.gastos-tAgo.absorbido:tAgo.gastos)}</div><div class="det">${u==='TAL'?'Costo del Taller que no entró a ninguna prenda':'Lo pagan las tiendas con su margen'}</div></div>`}
  </section>
  <section class="dos-col">
    <div class="superficie pad anim-sube">
      <div class="prioridades-cab"><div><h2>Para decidir hoy</h2><p>Primero lo que más cuesta si se deja pasar. Cada aviso dice cuánto está en juego.</p></div></div>
      <ul class="decidir">${decidir.slice(0, E.verMas ? 99 : 5).map(x=>`<li><span class="punto" data-tono="${x.tono}"></span><div><b>${x.t}</b>${x.raro?' <span class="badge sin-punto" data-tono="pizarra">fuera de lo normal</span>':''}<p>${x.d}</p>${x.imp?`<p class="impacto">${x.imp}</p>`:''}</div><button class="btn btn-sutil btn-sm" data-ir="${x.ir}">${x.b}</button></li>`).join('') || '<li><span></span><div><b>Nada urgente</b><p>No hay vencidas, faltantes ni nada fuera de lo normal.</p></div></li>'}</ul>
      ${decidir.length > 5 ? `<button class="btn btn-enlace" data-accion="ver-mas" style="margin-top:8px">${E.verMas ? 'Ver menos' : `Ver ${decidir.length-5} más`}</button>` : ''}
    </div>
    <div class="columna">
      ${todas ? `<div class="superficie pad anim-sube">
        <div class="prioridades-cab"><div><h2>¿Cada tienda cubre sus costos?</h2><p>Agosto: lo que vendió contra lo que necesitaba vender (100 %).</p></div></div>
        ${barras(coberturas, {alto:190, umbral:100, umbralTxt:'100 % = cubre sus costos justos', etiquetaValor:v=>v+' %'})}

      <div class="superficie pad anim-sube">
        <div class="prioridades-cab"><div><h2>Saldo de las próximas 6 semanas</h2><p>Lo que hay hoy + lo que entra − lo que vence.</p></div></div>
        ${barras(proy.map(w=>({n:w.s.split(' – ')[0], v:w.saldo, malo:w.saldo<minimoCaja(), maloTxt:'bajo el mínimo', tip:`<b>${w.s}</b><br>Entra ${S(w.entra)} · Sale ${S(w.sale)}<br>${esc(w.que)}`})), {alto:200, umbral:minimoCaja(), umbralTxt:'tu mínimo de caja: '+S(minimoCaja())+' (se cambia en Configuración)'})}
      </div>` : esTienda ? `<div class="superficie pad anim-sube">
        <div class="prioridades-cab"><div><h2>Camino al punto de equilibrio</h2><p>Septiembre al día 24 contra lo que necesita vender en el mes.</p></div></div>
        <div class="umbral-barra alto" role="img" aria-label="${pct(vendidoSep/eq.pe)} del punto de equilibrio"><i style="width:${Math.min(100, vendidoSep/eq.pe*100)}%"></i></div>
        <div class="marcas"><span>Vendido ${S(vendidoSep)}</span><span>Necesita ${S(eq.pe)}</span></div>
        <p class="sub" style="font-size:13px;margin:12px 0 0">${vendidoSep >= eq.pe ? `Ya cubrió los costos del mes: desde aquí, cada sol de margen es ganancia.` : `Le faltan ${S(eq.pe - vendidoSep)} en 6 días: unos ${S((eq.pe - vendidoSep)/6)} diarios. Hoy vende ${S(vendidoSep/24)} al día.`}</p>
      </div>
      <div class="superficie pad anim-sube"><div class="prioridades-cab"><div><h2>Presupuesto del mes</h2><p>Gastado a la fecha contra su tope; el % es la proyección al cierre.</p></div><button class="btn btn-sutil btn-sm" data-ir="reportes:presupuesto">Ver todo</button></div>${miniPresupuesto(u)}</div>`
      : `<div class="nota-cayla">${u==='TAL'?'El Taller no vende: lo que cuesta se pega a cada prenda (D-31). Se mide por lo que quedó sin absorber y por el costo de cada prenda (Producción ▸ Eficiencia).':'Lo de la empresa no es de ninguna tienda y no se reparte (D-32). Las tiendas lo pagan con su margen: por eso el punto de equilibrio de CAYLA entera es más alto que la suma de las tiendas.'}</div>`}
    </div>
  </section>`;
};

function miniPresupuesto(u){
  const sep = resultadosDe('2026-09');
  const filas = Object.entries(PRESUPUESTO.gastos).filter(([k,m])=>m[u]).map(([k,m])=>{ const real = sep[k]?.[u]||0, proy = FIJAS.includes(k) ? real : Math.round(real/AVANCE_MES); return {n:cat(k)?.n||k, meta:m[u], real, p:proy/m[u]}; });
  return `<ul class="lista-mov" style="margin:0">${filas.map(f=>`<li>${f.n}<span>${S(f.real)} de ${S(f.meta)} · <b style="color:${f.p>1.05?'var(--rojo-profundo)':f.p>1?'var(--ambar)':'var(--verde)'}">${pct(f.p)}</b></span></li>`).join('')}</ul>`;
}

// ============ Gastos (piezas 1 y 3) ============
const ESTADO_GASTO = {pagado:['verde','Pagado'], porpagar:['ambar','Por pagar'], anulado:['taupe','Anulado']};
const medioTxt = g => g.medio ? cuenta(g.medio).n.replace(' · Cta. corriente','') : '—';

VISTAS.gastos = () => {
  const tab = tabActual('gastos','gastos');
  const gastos = GASTOS.filter(g=>enVista(g.u)).sort((a,b)=>(b.nuevo?1:0)-(a.nuevo?1:0) || b.f.localeCompare(a.f));
  const egresos = EGRESOS.filter(e=>enVista(e.u));
  const activos = ACTIVOS.filter(a=>enVista(a.u));
  const fijosPend = FIJOS.filter(f=>enVista(f.u) && f.estado!=='registrado').length;
  const vig = gastos.filter(g=>g.estado!=='anulado' && g.f.startsWith('2026-09'));
  const total = vig.reduce((a,g)=>a+g.total,0), igv = vig.reduce((a,g)=>a+g.igv,0);
  const sinIgv = vig.filter(g=>g.comp==='Boleta').length;
  const acc = filtroVer() + (tab==='activos'
    ? `<button class="btn btn-primario" data-accion="nuevo-activo">+ Registrar activo</button>`
    : `<button class="btn btn-primario" data-accion="nuevo-gasto">+ Registrar gasto</button>`);

  ${cabecera({sobre:'Finanzas · Gastos', titulo: verTodas()?'Gastos de septiembre':`Gastos de ${nombreUnidad(E.ver)}`,

  <section class="cifras">
    <div class="tile anim-sube"><span class="etq">Gastado en el mes</span><div class="valor">${S(total)}</div><div class="det">${vig.length} gastos vigentes · ${nombreVer()}</div>${F('nuevo','gastos + compras (naturaleza = gasto)')}</div>
    <div class="tile anim-sube"><span class="etq">IGV que puedes descontar</span><div class="valor">${S(igv)}</div><div class="det">Solo de facturas. ${sinIgv} boleta${sinIgv===1?'':'s'} sin IGV descontable.</div>${F('deriva','compras.igv')}</div>
    <div class="tile anim-sube"><span class="etq">Por pagar de gastos</span><div class="valor ambar">${S(gastos.filter(g=>g.estado==='porpagar').reduce((a,g)=>a+g.total,0))}</div><div class="det">${gastos.filter(g=>g.estado==='porpagar').length} con factura a crédito</div>${F('existe','compras_resumen.saldo')}</div>
    <div class="tile anim-sube"><span class="etq">Egresos de caja sin clasificar</span><div class="valor ${egresos.length?'ambar':''}">${egresos.length}</div><div class="det">${egresos.length?'No cuentan en ningún número hasta clasificarlos':'Todo clasificado'}</div>${F('existe','caja_movimientos')}</div>
  </section>
  ${pestanas('gastos', [['gastos','Gastos'],['fijos','Fijos del mes', fijosPend||''],['activos','Activos fijos', activos.length],['egresos','Egresos de caja por clasificar', egresos.length||'']])}
  ${tab==='gastos' ? tablaGastos(gastos) : tab==='fijos' ? vistaFijos() : tab==='activos' ? tablaActivos(activos) : tablaEgresos(egresos)}`;
};

function tablaGastos(gastos){
  return `<div class="superficie anim-sube">
    <div class="herramientas">
      <div class="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="control" placeholder="Buscar por descripción, proveedor o número"></div>
      <select class="control"><option>Todas las categorías</option>${CATEGORIAS.map(c=>`<option>${c.n}</option>`).join('')}</select>

    </div>
    <div class="tabla-wrap"><table class="t"><thead><tr><th>Fecha</th><th>Gasto</th><th>Categoría · cuenta</th>${verTodas()?'<th>Unidad</th>':''}<th>Comprobante</th><th>Cómo se pagó</th><th class="num">Monto</th><th>Estado</th></tr></thead>
    <tbody>${gastos.map(g=>{ const [t,e]=ESTADO_GASTO[g.estado]; const c=cat(g.c); return `<tr class="${g.nuevo?'fila-nueva':''}${g.estado==='anulado'?' anulada':''}" data-accion="ver-gasto" data-id="${g.id}">
      <td data-l="Fecha">${fecha(g.f)}</td>
      <td class="c-prenda" data-l="Gasto"><b>${esc(g.d)}</b><span class="sub" style="display:block;font-size:12px">${esc(g.prov||'Sin proveedor')}</span>${g.raro?`<span class="badge sin-punto" data-tono="pizarra" title="${esc(g.raro)}" style="margin-top:4px">fuera de lo normal · ${esc(g.raro)}</span>`:''}</td>
      <td data-l="Categoría">${c.n} <span class="sub">· ${c.cta}</span></td>
      ${verTodas()?`<td data-l="Unidad">${nombreUnidad(g.u)}</td>`:''}
      <td data-l="Comprobante">${g.comp}${g.num?`<span class="sub" style="display:block;font-size:12px">${g.num}</span>`:''}</td>
      <td data-l="Pago">${g.cond==='credito'&&g.estado==='porpagar'?`<span class="sub">vence ${fecha(g.vence)}</span>`:medioTxt(g)}</td>
      <td class="num" data-l="Monto"><b>${S(g.total,1)}</b>${g.igv?`<span class="sub" style="display:block;font-size:12px">IGV ${S(g.igv,1)}</span>`:''}</td>
      <td data-l="Estado"><span class="badge" data-tono="${t}">${e}</span></td></tr>`; }).join('')}</tbody></table></div>
    <div class="pie-tabla"><span>${gastos.length} gastos · los anulados se quedan a la vista, nunca se borran</span><span>${F('nuevo','fn_gastos_lista (PR #170, adaptada)')}</span></div>
  </div>
  <div class="nota-cayla">La planilla <b>no se registra aquí</b>: se lee de Dynamic (D-33). La mercadería va por Compras y la tela por Producción; aquí solo lo que se consume en el mes. No existe la categoría «Otros»: si un gasto no calza, falta una categoría.</div>`;
}

function mesesUso(a, hasta='2026-09-30'){ const [y1,m1]=a.f.split('-').map(Number), [y2,m2]=hasta.split('-').map(Number); return Math.max(0,(y2-y1)*12 + (m2-m1)); }
function tablaActivos(activos){
  const tot = activos.reduce((x,a)=>x+a.costo,0), dep = activos.reduce((x,a)=>x+Math.min(a.costo, a.costo/a.vida*mesesUso(a)),0);
  return `<div class="superficie anim-sube">
    <div class="tabla-wrap"><table class="t"><thead><tr><th>Bien</th>${esLider()?'<th>Unidad</th>':''}<th>Comprado</th><th>Factura</th><th class="num">Costo</th><th>Vida útil</th><th class="num">Se deprecia al mes</th><th class="num">Vale hoy</th></tr></thead>
    <tbody>${activos.map(a=>{ const m=mesesUso(a), mens=a.costo/a.vida, hoy=a.costo-Math.min(a.costo,mens*m); return `<tr class="${a.nuevo?'fila-nueva':''}">
      <td class="c-prenda" data-l="Bien"><b>${esc(a.n)}</b><span class="sub" style="display:block;font-size:12px">${esc(a.prov)}</span></td>
      ${esLider()?`<td data-l="Unidad">${nombreUnidad(a.u)}</td>`:''}
      <td data-l="Comprado">${fecha(a.f)} ${a.f.slice(0,4)}</td><td data-l="Factura">${a.num}</td>
      <td class="num" data-l="Costo">${S(a.costo)}</td><td data-l="Vida útil">${a.vida/12} años</td>
      <td class="num" data-l="Al mes">${S(mens,1)}</td>
      <td class="num" data-l="Vale hoy"><b>${S(hoy)}</b><div class="split" style="width:90px;margin-left:auto"><i class="piso" style="width:${hoy/a.costo*100}%"></i></div></td></tr>`; }).join('')}</tbody></table></div>
    <div class="pie-tabla"><span>Total ${S(tot)} · depreciado ${S(dep)} · vale hoy ${S(tot-dep)}</span><span>${F('existe','activos_fijos (0 filas hoy)')} ${F('nuevo','activos_fijos.compra_id')}</span></div>
  </div>
  <div class="nota-cayla">Un activo no se resta entero del mes en que se compra: se reparte en su vida útil (<b>depreciación</b>). Así marzo no «pierde» S/ 3,200 por comprar un mostrador que sigue ahí. Las vidas útiles las confirma el contador.</div>`;
}

function tablaEgresos(egresos){

}

function modalMovimiento(a){
  const lider = esLider();
  const tipos = lider ? ['Depósito del cajón','Abono de tarjeta','Entre cuentas','Poner plata del dueño','Sacar plata del dueño'] : ['Depósito del cajón'];
  const inicial = a && a.dataset && a.dataset.id ? a.dataset.id : tipos[0];
  const debe = PRESTAMOS_DUENO.reduce((x,p)=>x+p.monto-p.devuelto,0);
  const origenes = CUENTAS.filter(c=>lider || c.unidad===unidadPropia());
  ventana(`<h3>Registrar movimiento</h3><p class="bajada">La plata cambia de lugar: no es venta ni gasto. ${lider?'':'Tu rol solo registra depósitos de tu cajón.'}</p>
    <div class="campo"><label for="mT">Qué pasó</label><select class="control" id="mT" style="width:100%">${tipos.map(t=>`<option${t===inicial?' selected':''}>${t}</option>`).join('')}</select></div>
    <div class="campo" id="bDueno" hidden><label>¿Cómo entra esta plata?</label>
      <div class="opciones"><label><input type="radio" name="dn" value="aporte" checked><b>Aporte</b><span>Se queda en CAYLA para siempre. Sube lo que es tuyo en el Balance.</span></label>
      <label><input type="radio" name="dn" value="prestamo"><b>Préstamo</b><span>CAYLA te lo devuelve después. Aparece como deuda de CAYLA contigo.</span></label></div></div>
    <div class="campo" id="bSaca" hidden><label>¿Qué es esta salida?</label>
      <div class="opciones"><label><input type="radio" name="sc" value="devolucion" ${debe?'checked':'disabled'}><b>Devolución de préstamo</b><span>CAYLA te debe ${S(debe)}. Baja esa deuda.</span></label>
      <label><input type="radio" name="sc" value="retiro" ${debe?'':'checked'}><b>Retiro de utilidades</b><span>Te llevas ganancia del negocio. No es un gasto: no baja la utilidad.</span></label></div></div>
    <div class="dos-campos"><div class="campo" id="bDe"><label for="mDe">De</label><select class="control" id="mDe" style="width:100%">${origenes.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select></div>
      <div class="campo" id="bA"><label for="mA">A</label><select class="control" id="mA" style="width:100%">${CUENTAS.filter(c=>c.tipo==='banco').map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select></div></div>
    <div class="dos-campos"><div class="campo"><label for="mM">Monto</label><input class="control" id="mM" value="1500"></div><div class="campo"><label for="mR">Voucher o nota</label><input class="control" id="mR" value="Voucher 120441"></div></div>
    ${comboResponsable()}
    <div class="botones"><button class="btn btn-secundario" data-cerrar>Cancelar</button><button class="btn btn-primario" id="okM">Registrar</button></div>`, {ancho:580});
  const v = $('#velo');
  const sync = () => { const t = v.querySelector('#mT').value;
    v.querySelector('#bDueno').hidden = t !== 'Poner plata del dueño'; v.querySelector('#bSaca').hidden = t !== 'Sacar plata del dueño';
    v.querySelector('#bDe').hidden = t === 'Poner plata del dueño'; v.querySelector('#bA').hidden = t === 'Sacar plata del dueño'; };
  v.addEventListener('change', sync); sync();
  $('#okM').onclick = () => {
    const t = $('#mT').value, monto = +$('#mM').value || 0;
    const clase = t==='Poner plata del dueño' ? v.querySelector('[name=dn]:checked').value : t==='Sacar plata del dueño' ? v.querySelector('[name=sc]:checked').value : null;
    const nombre = {aporte:'Aporte del dueño', prestamo:'Préstamo del dueño', devolucion:'Devolución de préstamo al dueño', retiro:'Retiro de utilidades'}[clase] || t;
    const de = t==='Poner plata del dueño' ? null : $('#mDe').value, aCta = t==='Sacar plata del dueño' ? null : $('#mA').value;
    guardar(`${nombre} registrado.`, () => {
      MOV_DINERO.forEach(x=>x.nuevo=false);
      MOV_DINERO.unshift({f:HOY, tipo:nombre, de: de || 'dueno', a:aCta, monto, ref:$('#mR').value, u: de ? (cuenta(de).unidad||null) : null, por:$('#fResp').value, nuevo:true});
      if (de) cuenta(de).saldo -= monto; if (aCta) cuenta(aCta).saldo += monto;
      if (clase==='prestamo') PRESTAMOS_DUENO.unshift({f:HOY, monto, nota:$('#mR').value, devuelto:0});
      if (clase==='devolucion'){ let r = monto; for (const p of PRESTAMOS_DUENO){ const d = Math.min(r, p.monto-p.devuelto); p.devuelto += d; r -= d; } }
    });
  };
}

function vistaResultados(){
  const mes = E.mesResultados, r = resultadosDe(mes), prev = mes==='2026-09' ? RESULTADOS_AGO : null;
  const cols = verTodas() ? [...UNIDADES.map(u=>u.k), 'CONS'] : [E.ver, 'CONS'];
  const val = (fila, u, rr=r) => {
    const us = u==='CONS' ? UNIDADES.map(x=>x.k) : [u];
    if (fila.sub) return us.reduce((a,x)=>a+totalesDe(rr,x).margen,0);
    if (fila.total) return us.reduce((a,x)=>a+totalesDe(rr,x).utilidad,0);
    return us.reduce((a,x)=>a+(rr[fila.k][x]||0),0) * (fila.neg?-1:1);
  };
  const cerrado = u => u==='CONS' ? Object.values(CIERRE['2026-08']).every(x=>x.c) : (CIERRE[mes]||{})[u]?.c;
  const celda = (fila, u) => {
    const v = val(fila, u); if (!v && !fila.total && !(fila.sub && val(FILAS_ER[0],u))) return `<td class="${u==='CONS'?'cons':''} sub">—</td>`;
    const d = E.comparar && prev ? v - val(fila, u, prev) : null;
    return `<td class="${u==='CONS'?'cons ':''}${v<0&&(fila.total||fila.sub)?'neg ':''}${fila.k?'celda':''}" ${fila.k?`data-accion="origen" data-id="${fila.k}|${u}"`:''}>${S(v)}${d!=null&&(fila.total||fila.sub||fila.k==='ventas')?`<span class="delta">${d>=0?'+':'−'}${S(Math.abs(d)).replace('S/ ','')} vs ago.</span>`:''}</td>`;
  };
  return `
  <div class="superficie anim-sube">
    <div class="herramientas">
      <select class="control" data-cambia="mesResultados"><option value="2026-08"${mes==='2026-08'?' selected':''}>Agosto 2026</option><option value="2026-09"${mes==='2026-09'?' selected':''}>Septiembre 2026 · a la fecha</option></select>
      ${mes==='2026-09'?`<label class="btn btn-sutil btn-sm" style="gap:8px"><input type="checkbox" data-cambia="comparar" ${E.comparar?'checked':''}> Comparar con agosto</label>`:''}
      <span class="sub" style="font-size:12.5px;margin-left:auto">Toca una cifra para ver de qué filas sale.</span>
      ${F('deriva','fn_estado_resultados ← fn_asientos (ADR-0120)')} ${F('existe','planilla_por_sede (Dynamic)')}
    </div>
    <div class="tabla-wrap"><table class="eerr">
      <thead><tr><th>Concepto</th><th style="text-align:left">Cuenta</th>${cols.map(u=>`<th class="${u==='CONS'?'cons':''}">${u==='CONS'?'CAYLA':nombreUnidad(u).replace('Tienda ','')}<span class="delta">${u==='CONS'?(Object.values(CIERRE['2026-08']).every(x=>x.c)||mes!=='2026-08'?'':'2 de 5 cerradas'):(mes==='2026-08'?(cerrado(u)?'cerrado':'abierto'):'abierto')}</span></th>`).join('')}</tr></thead>
      <tbody>${FILAS_ER.map(f => {
        if (f.k==='absorbido' && !UNIDADES.some(u=>r.absorbido[u.k])) return '';
        const cls = f.sub ? 'sub' : f.total ? 'total' : '';
        const fila = `<tr class="${cls}"><td>${f.n}</td><td class="cta">${f.cta||''}</td>${cols.map(u=>celda(f,u)).join('')}</tr>`;

function vistaPresupuesto(){

  const bloques = us.map(u => {
    const filas = [];
    if (PRESUPUESTO.ventas[u]){ const real = sep.ventas[u], proy = Math.round(real/AVANCE_MES), meta = PRESUPUESTO.ventas[u];
      filas.push(`<tr class="fila-ventas"><td data-l="Rubro"><b>Ventas</b> <span class="sub">(meta)</span></td><td class="num" data-l="Meta">${S(meta)}</td><td class="num" data-l="A la fecha">${S(real)}</td><td class="num" data-l="Al cierre">${S(proy)}</td>
        <td data-l="Avance"><div class="umbral-barra fina"><i style="width:${Math.min(100,proy/meta*100)}%"></i></div></td><td data-l="Estado">${proy/meta < .95 ? '<span class="badge" data-tono="ambar">bajo la meta</span>' : '<span class="badge" data-tono="verde">en camino</span>'}</td></tr>`); }
    for (const [k, m] of Object.entries(PRESUPUESTO.gastos)){ if (!m[u]) continue;
      const real = sep[k]?.[u] || 0, proy = FIJAS.includes(k) ? real : Math.round(real/AVANCE_MES), p = proy/m[u];
      filas.push(`<tr><td data-l="Rubro">${cat(k)?.n||k} <span class="sub">(tope)</span></td><td class="num" data-l="Tope">${S(m[u])}</td><td class="num" data-l="A la fecha">${S(real)}</td><td class="num" data-l="Al cierre">${S(proy)}</td>

    return `<tbody><tr class="grupo"><td colspan="6">${nombreUnidad(u)}</td></tr>${filas.join('')}</tbody>`;

  return `<div class="superficie anim-sube">

  </div>

}

// Parte de agosto (el último mes cerrado) y le aplica los cambios. Nada se guarda.
function escenarioResultado(esc){
  const r = JSON.parse(JSON.stringify(RESULTADOS_AGO));
  const escala = (u, f) => ['ventas','costo','flete','mermas'].forEach(k => r[k][u] = Math.round(r[k][u] * f));
  if (esc.ventasTodas) TIENDAS.forEach(u => escala(u, 1 + esc.ventasTodas/100));
  if (esc.ventasLIM) escala('LIM', 1 + esc.ventasLIM/100);
  if (esc.alqLIM != null) r.alquiler.LIM = esc.alqLIM;
  if (esc.cerrarLIM) for (const k in r) if (k !== 'depreciacion') r[k].LIM = 0;   // la remodelación se sigue depreciando
  const out = {}; UNIDADES.forEach(u => out[u.k] = totalesDe(r, u.k)); out.CONS = totalesDe(r); out.r = r;
  return out;
}

E.unidadCierre = 'LIM';
function chequeosDe(u){
  const egresoLIM = EGRESOS.some(e=>e.mes==='2026-08' && e.u===u);
  const base = {
    tienda: [
      {t:'Cajas del mes cerradas', d:'31 de 31 días con cierre', ok:true},
      {t:'Egresos de caja clasificados', d: egresoLIM ? 'Falta 1: «Depósito bancario» del 31 ago por S/ 2,300' : 'Todos dicen si son gasto, depósito o retiro', ok:!egresoLIM, ir:'gastos:egresos'},
      {t:'Depósitos del mes registrados', d:'Cada depósito tiene su voucher', ok:true},
      {t:'Conteo de las 20 prendas de más valor', d:'Hecho el 30 ago, sin diferencias', ok:true},
    ],
    taller: [
      {t:'Órdenes del mes cerradas o en curso', d:'4 cerradas, 2 en curso', ok:true},
      {t:'Insumos recibidos con su factura', d:'Sin recepciones sueltas', ok:true},
      {t:'Egresos del fondo fijo clasificados', d:'Todos clasificados', ok:true},
    ],
    empresa: [
      {t:'Bancos conciliados al fin de mes', d: E.conciliado.ibk!=null ? 'BCP e Interbank coinciden' : 'Interbank: faltan confirmar movimientos del extracto', ok:E.conciliado.ibk!=null, ir:'dinero:conciliacion'},
      {t:'Facturas de proveedor del mes registradas', d:'Revisa que no quede ninguna en el cajón', ok:true},
      {t:'Planilla de agosto leída de Dynamic', d:'Período cerrado en Dynamic el 1 sep', ok:true},
    ],
  }[UNIDADES.find(x=>x.k===u).tipo];
  return [...base, {t:'El diario de la unidad cuadra', d:'Debe = haber en todas las líneas', ok:true}];
}

VISTAS.cierre = () => {
  const mes = E.mesCierre, est = CIERRE[mes] || {};
  const todas = UNIDADES.every(u=>est[u.k]?.c);
  const consolidado = est.CONS;
  const u = E.unidadCierre, ch = chequeosDe(u), listo = ch.every(c=>c.ok), cerrada = est[u]?.c;
  return `
  ${cabecera({sobre:'Finanzas · Cierre de mes', titulo:'Cerrar ' + mesLargo(mes), bajada:'Cerrar un mes lo congela: nadie puede registrar ni cambiar nada con fecha de ese mes, y el diario queda guardado con su huella. Se cierra cada tienda y el Taller; CAYLA entera, cuando cerraron todas (ADR-0109).',
    acciones:`${filtroVer('empresa')}<select class="control" data-cambia="mesCierre"><option value="2026-07"${mes==='2026-07'?' selected':''}>Julio 2026</option><option value="2026-08"${mes==='2026-08'?' selected':''}>Agosto 2026</option></select>`})}
  <div class="matriz anim-sube">
    ${UNIDADES.map(x=>{ const s = est[x.k]||{}; return `<button class="unidad-c" data-accion="unidad-cierre" data-id="${x.k}" aria-pressed="${x.k===u}">
      <span class="n">${x.n}</span>${s.c?`<span class="badge" data-tono="verde">cerrado</span><span class="sub" style="font-size:12px">${fecha(s.f)} · ${s.por.split(' ')[0]}</span><span class="h">${s.hash}</span>`
      : `<span class="badge" data-tono="${chequeosDe(x.k).every(c=>c.ok)?'pizarra':'ambar'}">${chequeosDe(x.k).every(c=>c.ok)?'lista para cerrar':chequeosDe(x.k).filter(c=>!c.ok).length+' pendiente'}</span>`}
    </button>`; }).join('')}
    <div class="unidad-c consolidado"><span class="n">CAYLA entera</span>
      ${consolidado||mes==='2026-07'?`<span class="badge" data-tono="verde">cerrado</span><span class="h">${mes==='2026-07'?'f2c9…80d1':consolidado.hash}</span>`
        : todas ? `<button class="btn btn-primario btn-sm" data-accion="cerrar-cons">Cerrar ${MESES_L[+mes.slice(5)-1]}</button>`
        : `<span class="badge" data-tono="taupe">faltan ${UNIDADES.filter(x=>!est[x.k]?.c).length}</span><span class="sub" style="font-size:12px">Se habilita cuando cierran todas</span>`}
    </div>
  </div>
  <section class="dos-col izq">
    <div class="superficie pad anim-sube">
      <div class="prioridades-cab"><div><h2>${nombreUnidad(u)} · ${mesLargo(mes)}</h2><p>${cerrada?`Cerrado el ${fecha(est[u].f)} por ${est[u].por}.`:'Lo que el sistema revisa antes de dejarte cerrar.'}</p></div></div>
      <ul class="chequeos">${ch.map(c=>`<li><span class="ok-ic ${c.ok?'':'no-ic'}">${c.ok?'✓':'!'}</span><div><b>${c.t}</b><p>${c.d}</p></div>${!c.ok&&c.ir&&!cerrada?`<button class="btn btn-sutil btn-sm" data-ir="${c.ir}">Resolver</button>`:'<span></span>'}</li>`).join('')}</ul>
      <div class="botones" style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px">
        ${cerrada ? `<button class="btn btn-sutil" data-accion="reabrir" data-id="${u}">Reabrir…</button>`
          : `<button class="btn btn-primario" data-accion="cerrar-unidad" data-id="${u}" ${listo?'':'disabled'}>Cerrar ${MESES_L[+mes.slice(5)-1]} de ${nombreUnidad(u).replace('Tienda ','')}</button>`}
      </div>
      ${F('nuevo','periodos + asientos (materializa fn_asientos con hash)')}
    </div>
    <div class="superficie pad anim-sube">
      <p class="etq">La rutina de fin de mes</p>
      <div class="pasos-cierre" style="grid-template-columns:1fr;gap:14px;margin-top:8px">
        <div><h3>Día 1 · cada tienda (20 min)</h3><p class="sub" style="margin:0;font-size:13px">Cerrar la última caja, registrar los depósitos que falten y contar las 20 prendas de más valor.</p></div>
        <div><h3>Día 2 · el líder (40 min)</h3><p class="sub" style="margin:0;font-size:13px">Revisar que estén todos los gastos y facturas, conciliar el banco y explicar cualquier diferencia de caja.</p></div>
        <div><h3>Día 3 · el sistema (5 min)</h3><p class="sub" style="margin:0;font-size:13px">Mirar los tres estados contra el mes anterior y cerrar. Desde ahí, el mes ya no cambia.</p></div>
      </div>
      <div class="nota-cayla" style="margin-top:14px">Solo el líder cierra y reabre (el módulo no se puede delegar). Reabrir pide motivo y queda en la historia; reabrir una tienda reabre también CAYLA entera.</div>
    </div>
  </section>`;
};

  'reabrir': a => { const u = a.dataset.id;

  'origen': a => modalOrigen(a.dataset.id),

    $('#okFv').onclick = () => confirmarFijo(f, +$('#fvM').value || f.monto); },
  'marcar-fijo': a => { const d = DETECTADOS.find(x=>x.id===a.dataset.id); guardar(`${d.prov} quedó como gasto fijo.`, () => { DETECTADOS.splice(DETECTADOS.indexOf(d),1); FIJOS.push({id:'f'+Date.now(), n:cat(d.c).n, u:d.u, c:d.c, prov:d.prov, monto:d.monto, dia:20, cuenta:'bcp', estado:'registrado'}); }); },

  'ver-mas': () => { E.verMas = !E.verMas; render(); },
  'esc-reset': () => { E.escenario = {alqLIM:6200, ventasLIM:0, ventasTodas:0, cerrarLIM:false, retrasarNorte:false}; render(); },

};

    <div class="tabla-wrap"><table class="t ppto-edit fija"><thead><tr><th>Rubro</th>${us.map(u=>`<th class="num">${nombreUnidad(u).replace('Tienda ','')}</th>`).join('')}</tr></thead>
    <tbody><tr class="grupo"><td>Meta de ventas</td>${us.map(u=>`<td class="num">${TIENDAS.includes(u)?inp('ventas|'+u, PRESUPUESTO.ventas[u]):'<span class="sub">—</span>'}</td>`).join('')}</tr>
    ${Object.entries(PRESUPUESTO.gastos).map(([k,m])=>`<tr><td>${cat(k).n} <span class="sub">(tope)</span></td>${us.map(u=>`<td class="num">${inp('gastos|'+k+'|'+u, m[u])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="pie-tabla"><span>La planilla no lleva tope aquí: la decide Dynamic.</span>${F('nuevo','presupuestos')}</div>
  </div>`;
}

function cfgImpuestos(){
  return `<section class="dos-col par"><div class="superficie pad anim-sube">
    <div class="prioridades-cab"><div><h2>Tasa de IGV</h2><p>Solo se agregan filas: el pasado no se reescribe.</p></div>${F('nuevo','parametros_tributarios')}</div>
    <ul class="lista-mov" style="margin:0">${CONFIG.tasas.map(t=>`<li>Desde ${fecha(t.desde)} ${t.desde.slice(0,4)}<b>${t.igv} %</b></li>`).join('')}</ul>
    <button class="btn btn-sutil btn-sm" data-accion="exportar" style="margin-top:12px">+ Nueva tasa desde una fecha</button>
  </div><div class="superficie pad anim-sube">
    <div class="prioridades-cab"><div><h2>Valor de la UIT</h2><p>Para el límite de 300 UIT y la renta.</p></div></div>
    <ul class="lista-mov" style="margin:0">${CONFIG.uits.map(t=>`<li>${t.anio}${t.nota?` <span>${t.nota}</span>`:''}<b>${S(t.valor)}</b></li>`).join('')}</ul>
    <button class="btn btn-sutil btn-sm" data-accion="exportar" style="margin-top:12px">+ UIT de un año nuevo</button>
  </div></section>
  <div class="nota-cayla">El régimen de renta y la retención del recibo por honorarios los define el contador. Cuando los confirme, se configuran aquí.</div>`;
}

function modalCuenta(){
  ventana(`<h3>Agregar cuenta</h3><p class="bajada">Un banco, una billetera que no cae a un banco, o un POS.</p>
    <div class="campo"><label for="cN">Nombre</label><input class="control" id="cN" value="BBVA · Cta. corriente"></div>
    <div class="dos-campos"><div class="campo"><label for="cT">Tipo</label><select class="control" id="cT" style="width:100%"><option value="banco">Banco (104)</option><option value="transito">Por abonar (105)</option></select></div>
    <div class="campo"><label for="cS">Saldo con el que empieza</label><input class="control" id="cS" value="0"></div></div>
    <p class="sub" style="font-size:12.5px">El saldo inicial se registra una vez; después el saldo solo cambia con movimientos.</p>
    ${comboResponsable()}
    <div class="botones"><button class="btn btn-secundario" data-cerrar>Cancelar</button><button class="btn btn-primario" id="okCu">Agregar</button></div>`);
  $('#okCu').onclick = () => { const t = $('#cT').value;
    guardar('Cuenta agregada.', () => { CUENTAS.forEach(c=>c.nuevo=false); CUENTAS.splice(2,0,{id:'c'+Date.now(), n:$('#cN').value, tipo:t, cta:t==='banco'?'104':'105', saldo:+$('#cS').value||0, conciliado:HOY, recibe:'Sin cobros asignados todavía', nuevo:true}); }); };
}

// ============ Acciones: un solo escuchador para toda la demo ============
document.addEventListener('click', e => {
  const irA = e.target.closest('[data-ir]');
  if (irA){ e.preventDefault(); const [r, t] = irA.dataset.ir.split(':'); if (t) E.tab[r] = t; ir(r); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab){ const [r, t] = tab.dataset.tab.split(':'); E.tab[r] = t; render(); return; }
  const seg = e.target.closest('.seg button');
  if (seg){
    const ctl = seg.parentElement.dataset.ctl, v = seg.dataset.v;
    seg.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===seg));
    if (ctl==='rol'){ E.rol = v; E.seleccion.clear(); E.ver = v==='lider' ? E.sedeActiva : 'TRU'; if (!puedeVer(E.ruta)) E.ruta = 'gastos'; }
    if (ctl==='fuentes') E.fuentes = v==='si';
    if (ctl==='tema') document.documentElement.dataset.theme = v;
    render(); return;
  }
  if (e.target.closest('#reiniciar')){ location.hash=''; location.reload(); return; }
  const a = e.target.closest('[data-accion]');
  if (!a) return;
  const id = a.dataset.id;
  ({
    'nuevo-gasto': modalGasto, 'cfg-cuenta': modalCuenta, 'nuevo-activo': modalActivo, 'ver-gasto': () => modalVerGasto(id),
    'clasificar': () => modalClasificar(id), 'nuevo-mov': a => modalMovimiento(a), 'pagar': modalPagar,
    'conciliar': () => { const v = parseFloat(($('#b-'+id).value||'').replace(/,/g,'')); if (isNaN(v)) return; E.conciliado[id] = v; render(); avisar(v===cuenta(id).saldo?'Coincide con el banco.':'Hay una diferencia: revisa los movimientos sin pareja.'); },
    ...(typeof ACCIONES_EXTRA === 'object' ? ACCIONES_EXTRA : {}),
  }[a.dataset.accion] || (()=>{}))(a);
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]');
  if (s){ s.checked ? E.seleccion.add(s.dataset.sel) : E.seleccion.delete(s.dataset.sel); render(); return; }
  if (e.target.id === 'irMovil') ir(e.target.value);
  const m = e.target.closest('[data-cambia]');
  if (m){
    const k = m.dataset.cambia; E[k] = m.type==='checkbox' ? m.checked : m.value;
    // Cambiar la sede de la cabecera = cambiar dónde trabajas: el filtro de la pantalla la sigue (ADR-0149: con loader).
    if (k === 'sedeActiva'){ E.ver = m.value; guardar(`Ahora trabajas en ${nombreUnidad(m.value)}.`); return; }
    render(); return;
  }
  const esc_ = e.target.closest('[data-esc]');
  if (esc_){ E.escenario[esc_.dataset.esc] = +esc_.value; render(); return; }
  const chk = e.target.closest('[data-esc-check]');
  if (chk){ E.escenario[chk.dataset.escCheck] = chk.checked; render(); return; }
  const cfg = e.target.closest('[data-cfg]');
  if (cfg){ const v = parseFloat(cfg.value.replace(/[^0-9.]/g,'')); if (!isNaN(v)){ CONFIG[cfg.dataset.cfg] = v; avisar('Guardado. Todas las pantallas ya usan el valor nuevo.'); } return; }
  const emp = e.target.closest('[data-cfg-emp]');
  if (emp){ CONFIG.empresa[emp.dataset.cfgEmp] = emp.value; avisar('Guardado.'); return; }
  const pp = e.target.closest('[data-ppto]');
  if (pp){ const r = pp.dataset.ppto.split('|'), v = parseFloat(pp.value.replace(/[^0-9.]/g,'')) || null;
    if (r[0]==='ventas') PRESUPUESTO.ventas[r[1]] = v; else { PRESUPUESTO.gastos[r[1]][r[2]] = v; if (v==null) delete PRESUPUESTO.gastos[r[1]][r[2]]; }
    avisar('Presupuesto guardado.'); return; }
  const md = e.target.closest('[data-medio]');
  if (md){ const [u,k] = md.dataset.medio.split('|'); MEDIOS.find(x=>x.u===u)[k] = md.value; avisar(`Desde hoy, ${k} de ${nombreUnidad(u)} entra a ${cuenta(md.value).n}.`); return; }
});
// Mientras se arrastra un deslizador, solo cambia su número; al soltar, se recalcula todo.
document.addEventListener('input', e => { const r = e.target.closest('[data-esc]'); if (!r) return;
  const b = r.previousElementSibling?.querySelector('b'); if (!b) return; const k = r.dataset.esc, v = +r.value;
  b.textContent = k==='alqLIM' ? S(v) : (v>0?'+':'')+v+' %'; });
// #ruta o #ruta:pestaña
function leerHash(){ const [r, t] = location.hash.slice(1).split(':'); if (!MENU.some(m=>m.r===r)) return false; E.ruta = r; if (t) E.tab[r] = t; return true; }
window.addEventListener('hashchange', () => { if (leerHash()) render(); });
leerHash(); render();

</script>
</body>
</html>
