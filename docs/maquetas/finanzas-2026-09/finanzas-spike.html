<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas CAYLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Paleta oficial CAYLA (guía «CAYLA Dynamic», Sala de diseño 2026-09-22) — once tokens, cuatro radios,
     una curva de entrada y una de salida (globals.css). Sin sombras, sin gradientes: la línea sand es el adorno. */
  :root{
    --crema:#f5f0e8; --papel:#fbf8f2; --tinta:#1a1a18; --rojo:#b8412d; --rojo-profundo:#8b2a1f;
    --sand:#e8e0d0; --taupe:#805c4c; --verde:#48603f; --ambar:#74501a; --hueso:#eae1d2; --pizarra:#4c5d6e;
    --velo:rgba(26,26,24,.38);
    --r-control:8px; --r-superficie:16px; --r-flotante:20px; --r-pildora:999px;
    --ease-cayla:cubic-bezier(.32,.72,.24,1); --ease-salida:cubic-bezier(.4,0,1,1);
    --serif:"EB Garamond", ui-serif, Georgia, serif;
    --sans:"DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --crema:#1c1a16; --papel:#26221d; --tinta:#ede7db; --rojo:#d4634a; --rojo-profundo:#e8836b;
      --sand:#332e27; --taupe:#ab9080; --verde:#8fae80; --ambar:#c99a4a; --hueso:#15110d; --pizarra:#9db0c2;
      --velo:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --crema:#1c1a16; --papel:#26221d; --tinta:#ede7db; --rojo:#d4634a; --rojo-profundo:#e8836b;
    --sand:#332e27; --taupe:#ab9080; --verde:#8fae80; --ambar:#c99a4a; --hueso:#15110d; --pizarra:#9db0c2;
    --velo:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--crema);}
  body{color:var(--tinta); font-family:var(--sans); font-size:14px; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;}
  button,input,select{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--rojo); outline-offset:2px;}
  .serif{font-family:var(--serif);}
  .etq{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe);}
  .sub{color:var(--taupe);}

  /* ---------- Barra de la demo (no es parte del ERP) ---------- */
  .demo{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--tinta); color:var(--crema);
    padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;}
  .demo b.marca{font-family:var(--serif); font-size:17px; font-weight:500; margin-right:4px; white-space:nowrap;}
  .demo .grupo{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .demo .grupo > span{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.62;}
  .seg{display:inline-flex; max-width:100%; overflow-x:auto; border:1px solid color-mix(in oklab, var(--crema) 28%, transparent); border-radius:var(--r-control); overflow:hidden;}
  .seg button{background:transparent; border:0; color:var(--crema); padding:6px 11px; font-size:12.5px; font-weight:500; white-space:nowrap; transition:background-color 150ms, color 150ms;}
  .seg button + button{border-left:1px solid color-mix(in oklab, var(--crema) 20%, transparent);}
  .seg button[aria-pressed="true"]{background:var(--crema); color:var(--tinta);}
  .demo .nota{flex-basis:100%; font-size:12.5px; line-height:1.5; opacity:.82; margin:0;}
  .demo .nota b{opacity:1; color:var(--crema);}

  /* ---------- Carcasa del ERP (lateral claro, como hoy) ---------- */
  .app{display:grid; grid-template-columns:248px 1fr; min-height:calc(100vh - 90px);}
  .lateral{border-right:1px solid var(--sand); padding:22px 14px 16px; display:flex; flex-direction:column; gap:18px; background:var(--crema);}
  .logo{display:flex; align-items:center; gap:10px; padding:0 8px; font-size:15px; font-weight:600; letter-spacing:.32em;}
  .btn-nuevo{background:var(--tinta); color:var(--crema); border:0; border-radius:var(--r-control); padding:12px; font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav a{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-control); text-decoration:none; color:var(--tinta); font-size:14px;}
  .nav a svg{width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.4;}
  .nav a .flecha{margin-left:auto; opacity:.4; font-size:11px;}
  .nav .hijo{padding-left:32px;}
  .nav a.activo{background:var(--sand); font-weight:500;}
  .nav a:not(.activo):hover{background:color-mix(in oklab, var(--sand) 50%, transparent);}
  .lateral .pie{margin-top:auto; border-top:1px solid var(--sand); padding:14px 8px 0; display:flex; align-items:center; gap:10px;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--sand); display:grid; place-items:center; font-family:var(--serif); font-size:14px;}
  .lema{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--taupe); padding:0 8px;}

  .principal{min-width:0; display:flex; flex-direction:column;}
  .cabecera{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 32px; border-bottom:1px solid var(--sand);}
  .icono-btn{background:transparent; border:1px solid transparent; border-radius:var(--r-control); width:34px; height:34px; display:grid; place-items:center; color:var(--taupe);}
  .icono-btn:hover{border-color:var(--sand);}
  .chip-sede{border:1px solid var(--sand); background:var(--papel); border-radius:var(--r-control); padding:8px 12px; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; display:inline-flex; gap:8px; align-items:center;}
  .pagina{padding:28px 32px 56px; display:flex; flex-direction:column; gap:22px; max-width:1320px; width:100%;}

  /* ---------- Botones: cinco variantes de la guía ---------- */
  .btn{border-radius:var(--r-control); font-size:13px; font-weight:500; padding:8px 14px; border:1px solid transparent; white-space:nowrap; transition:background-color 150ms, border-color 150ms, color 150ms; display:inline-flex; align-items:center; gap:6px; line-height:1.2;}
  .btn-primario{background:var(--tinta); color:var(--crema);}
  .btn-primario:hover{background:var(--rojo-profundo);}
  .btn-secundario{background:transparent; border-color:var(--sand); color:var(--tinta);}
  .btn-secundario:hover{border-color:color-mix(in oklab, var(--taupe) 40%, transparent); background:color-mix(in oklab, var(--sand) 50%, transparent);}
  .btn-sutil{background:transparent; border-color:var(--sand); color:var(--taupe);}
  .btn-sutil:hover{color:var(--tinta); background:color-mix(in oklab, var(--sand) 30%, transparent);}
  .btn-sutil[aria-pressed="true"]{color:var(--tinta); border-color:var(--tinta);}
  .btn-enlace{background:none; border:0; padding:0; color:var(--tinta); text-decoration:underline; text-underline-offset:3px; font-size:12.5px;}
  .btn-enlace:hover{color:var(--rojo);}
  .btn-enlace.rojo{color:var(--rojo);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  /* ---------- Encabezado de pantalla ---------- */
  .encabezado{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px;}
  .encabezado h1{font-family:var(--serif); font-weight:500; font-size:36px; line-height:1.05; margin:6px 0 8px; text-wrap:balance;}
  .encabezado p{margin:0; max-width:58ch; line-height:1.55;}
  .encabezado .hora{font-size:12px; margin-top:6px; color:var(--taupe);}
  .encabezado .acciones{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---------- Insignias ---------- */
  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--r-pildora); font-size:12px; white-space:nowrap;}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge[data-tono="verde"]{background:color-mix(in oklab, var(--verde) 15%, transparent); color:var(--verde);}
  .badge[data-tono="ambar"]{background:color-mix(in oklab, var(--ambar) 15%, transparent); color:var(--ambar);}
  .badge[data-tono="rojo"]{background:color-mix(in oklab, var(--rojo) 11%, transparent); color:var(--rojo-profundo);}
  .badge[data-tono="pizarra"]{background:color-mix(in oklab, var(--pizarra) 15%, transparent); color:var(--pizarra);}
  .badge[data-tono="taupe"]{background:var(--sand); color:var(--taupe);}
  .badge.sin-punto::before{display:none;}

  /* ---------- Cifras ---------- */
  .cifras{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px;}
  .tile{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:16px 18px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0;}
  button.tile{transition:border-color 150ms, background-color 150ms;}
  button.tile:hover{border-color:color-mix(in oklab, var(--taupe) 45%, transparent);}
  button.tile[aria-pressed="true"]{border-color:var(--tinta); background:color-mix(in oklab, var(--hueso) 45%, var(--papel));}
  .tile .fila-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .tile .valor{font-family:var(--serif); font-size:32px; line-height:1; font-weight:500;}
  .tile .valor small{font-family:var(--sans); font-size:13px; color:var(--taupe); font-weight:400; margin-left:4px;}
  .tile .valor.rojo{color:var(--rojo);} .tile .valor.ambar{color:var(--ambar);}
  .tile .det{font-size:12.5px; color:var(--taupe); line-height:1.45;}
  .tile .ir{font-size:12px; color:var(--taupe);}
  .split{display:flex; height:6px; border-radius:var(--r-pildora); overflow:hidden; background:var(--hueso); margin-top:2px;}
  .split i{display:block; height:100%;}
  .split i.piso{background:var(--tinta);} .split i.alm{background:color-mix(in oklab, var(--taupe) 55%, transparent);}
  .prioridades-cab{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px;}
  .prioridades-cab h2{font-family:var(--serif); font-weight:500; font-size:22px; margin:0;}
  .prioridades-cab p{margin:2px 0 0; font-size:13px; color:var(--taupe);}

  /* ---------- Superficie de la tabla ---------- */
  .superficie{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); overflow:hidden;}
  .herramientas{display:flex; flex-wrap:wrap; gap:10px; padding:14px; align-items:center; border-bottom:1px solid var(--sand);}
  .buscar{flex:1 1 240px; position:relative;}
  .buscar svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--taupe); fill:none; stroke-width:1.6;}
  .control{border-radius:var(--r-control); border:1px solid var(--sand); background:var(--hueso); padding:8px 12px; font-size:13.5px; width:100%; min-height:36px;}
  .buscar .control{padding-left:34px;}
  select.control{width:auto; flex:0 1 150px; appearance:none; padding-right:30px;
    background-image:linear-gradient(45deg, transparent 50%, var(--taupe) 50%), linear-gradient(135deg, var(--taupe) 50%, transparent 50%);
    background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat;}
  .filtro-activo{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--sand); font-size:13px; background:color-mix(in oklab, var(--hueso) 40%, transparent);}

  .tabla-wrap{overflow-x:auto;}
  table.t{width:100%; border-collapse:collapse; font-size:13px; min-width:980px;}
  table.t thead{background:color-mix(in oklab, var(--sand) 70%, transparent);}
  table.t th{text-align:left; font-weight:400; color:var(--taupe); padding:9px 14px; font-size:12px; white-space:nowrap;}
  table.t th.num, table.t td.num{text-align:right;}
  table.t td{padding:11px 14px; border-top:1px solid var(--sand); vertical-align:middle;}
  table.t tbody tr:nth-child(even){background:color-mix(in oklab, var(--hueso) 50%, transparent);}
  table.t tbody tr{transition:background-color 150ms;}
  table.t tbody tr:hover{background:color-mix(in oklab, var(--crema) 60%, transparent);}
  .prenda{display:flex; align-items:center; gap:12px; min-width:0;}
  .tela{width:38px; height:44px; border-radius:6px; flex:none; border:1px solid var(--sand); position:relative; overflow:hidden;}
  .tela::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 5px);}
  .prenda b{font-weight:600; font-size:13.5px; display:block;}
  .prenda span{font-size:12px; color:var(--taupe); display:block;}
  .prenda .sku{font-size:11px; letter-spacing:.02em; opacity:.8;}
  td.c-prenda{min-width:230px;}
  .pa{display:flex; flex-direction:column; gap:5px; min-width:92px;}
  .pa .n{white-space:nowrap;} .pa .n em{font-style:normal; color:var(--taupe);}
  .pa .split{width:92px; height:4px;}
  .disp b{font-family:var(--serif); font-size:20px; font-weight:500;}
  .disp span{display:block; font-size:11.5px; color:var(--taupe); white-space:nowrap;}
  .disp span.alerta{color:var(--rojo-profundo);}
  .red{font-size:12.5px; line-height:1.45; color:var(--taupe); max-width:190px;}
  .red b{color:var(--tinta); font-weight:500; white-space:nowrap;}
  .camino{font-size:12.5px; white-space:nowrap;} .camino span{display:block; color:var(--taupe); font-size:11.5px;}
  .camino .tarde{color:var(--rojo-profundo);}
  .acc{display:flex; justify-content:flex-end; align-items:center; gap:6px; position:relative;}
  .acc-links{display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap;}
  .mas{width:30px; height:30px; padding:0; justify-content:center; font-size:16px; line-height:1;}
  .extras{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .pie-tabla{display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:space-between; align-items:center; padding:12px 14px; border-top:1px solid var(--sand); font-size:12.5px; color:var(--taupe);}
  .leyenda{display:flex; flex-wrap:wrap; gap:6px 16px;}
  .vacio-filtro{padding:32px 16px; text-align:center; color:var(--taupe);}

  /* ---------- Menú «⋯» ---------- */
  .menu{position:absolute; right:0; top:calc(100% + 6px); z-index:20; background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-control); min-width:188px; padding:4px; display:flex; flex-direction:column; animation:sube-menu 200ms var(--ease-cayla) both;}
  .menu button{background:none; border:0; text-align:left; padding:8px 10px; border-radius:6px; font-size:13px;}
  .menu button:hover{background:var(--hueso);}
  .menu hr{border:0; border-top:1px solid var(--sand); margin:4px 0;}
  @keyframes sube-menu{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

  /* ---------- Estado vacío: guía de primeros pasos ---------- */
  .guia{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:28px;}
  .guia h2{font-family:var(--serif); font-weight:500; font-size:28px; margin:6px 0 6px; text-wrap:balance;}
  .guia > p{margin:0 0 20px; color:var(--taupe); max-width:62ch; line-height:1.55;}
  .caminos{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  .camino-c{border:1px solid var(--sand); border-radius:var(--r-superficie); padding:18px; display:flex; flex-direction:column; gap:10px; background:var(--crema);}
  .camino-c .ico{width:36px; height:36px; border-radius:50%; background:var(--hueso); display:grid; place-items:center;}
  .camino-c .ico svg{width:18px; height:18px; stroke:var(--tinta); fill:none; stroke-width:1.4;}
  .camino-c h3{margin:0; font-size:15px; font-weight:600;}
  .camino-c p{margin:0; font-size:13px; color:var(--taupe); line-height:1.5; flex:1;}
  .camino-c .dato{font-family:var(--serif); font-size:20px;}
  .aviso-franja{display:flex; gap:12px; align-items:flex-start; margin-top:18px; padding:12px 14px; border-radius:var(--r-control); background:color-mix(in oklab, var(--ambar) 10%, transparent); border:1px solid color-mix(in oklab, var(--ambar) 28%, transparent); font-size:13px; line-height:1.5;}
  .aviso-franja b{color:var(--ambar);}

  /* ---------- Modal (ADR-0136): velo con desenfoque → hoja sube 18px y crece → cascada 55ms ---------- */
  .velo{position:fixed; inset:0; z-index:60; background:var(--velo); backdrop-filter:blur(3px); display:grid; place-items:center; padding:16px; animation:velo-in 220ms var(--ease-cayla) both;}
  .velo.sale{animation:velo-out 220ms var(--ease-salida) both;}
  .hoja{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-flotante); width:min(480px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:24px; animation:hoja-in 380ms var(--ease-cayla) both;}
  .velo.sale .hoja{animation:hoja-out 220ms var(--ease-salida) both;}
  .hoja > *{animation:cascada 320ms var(--ease-cayla) both; animation-delay:calc(120ms + var(--i,0) * 55ms);}
  .hoja h3{font-family:var(--serif); font-weight:500; font-size:24px; margin:0 0 4px;}
  .hoja .bajada{margin:0 0 18px; color:var(--taupe); font-size:13.5px; line-height:1.5;}
  .hoja label{display:block; font-size:12px; color:var(--taupe); margin-bottom:6px;}
  .hoja .campo{margin-bottom:16px;}
  .hoja .botones{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}
  .paso{display:flex; align-items:center; gap:10px;}
  .paso button{width:36px; height:36px; border-radius:var(--r-control); border:1px solid var(--sand); background:var(--hueso); font-size:18px;}
  .paso output{font-family:var(--serif); font-size:28px; min-width:48px; text-align:center;}
  .antes-despues{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .antes-despues div{background:var(--hueso); border-radius:var(--r-control); padding:10px 12px; font-size:12.5px; color:var(--taupe);}
  .antes-despues b{display:block; font-family:var(--serif); font-size:20px; color:var(--tinta); font-weight:500;}
  .lista-mov{list-style:none; margin:0 0 16px; padding:0;}
  .lista-mov li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--sand); font-size:13px;}
  .lista-mov li span{color:var(--taupe); font-size:12px;}
  .radios{display:flex; gap:8px;}
  .radios label{flex:1; margin:0; border:1px solid var(--sand); border-radius:var(--r-control); padding:10px 12px; color:var(--tinta); font-size:13px; display:flex; gap:8px; align-items:center; background:var(--hueso);}
  @keyframes velo-in{from{opacity:0;} to{opacity:1;}}
  @keyframes velo-out{to{opacity:0;}}
  @keyframes hoja-in{from{opacity:0; transform:translate3d(0,18px,0) scale(.965);} to{opacity:1; transform:none;}}
  @keyframes hoja-out{to{opacity:0; transform:translate3d(0,10px,0) scale(.98);}}
  @keyframes cascada{from{opacity:0; transform:translate3d(0,10px,0);} to{opacity:1; transform:none;}}

  /* ---------- Loader único (ADR-0149) y aviso que sale DESPUÉS ---------- */
  .espera{position:fixed; inset:0; z-index:80; background:color-mix(in oklab, var(--crema) 82%, transparent); backdrop-filter:blur(2px); display:grid; place-items:center; animation:velo-in 200ms var(--ease-cayla) both;}
  .espera div{display:flex; flex-direction:column; align-items:center; gap:12px; font-size:13px; color:var(--taupe);}
  .espera svg{animation:aletea 1.6s ease-in-out infinite;}
  @keyframes aletea{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
  .aviso{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:90; background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:12px 16px; display:flex; gap:10px; align-items:center; font-size:13.5px; max-width:calc(100vw - 32px); animation:hoja-in 320ms var(--ease-cayla) both;}
  .aviso svg{flex:none; stroke:var(--verde); fill:none; stroke-width:2;}
  .aviso svg path{stroke-dasharray:24; stroke-dashoffset:24; animation:visto 360ms 120ms var(--ease-cayla) forwards;}
  @keyframes visto{to{stroke-dashoffset:0;}}
  .fila-nueva td{animation:destello 1.4s var(--ease-cayla);}
  @keyframes destello{0%{background:color-mix(in oklab, var(--verde) 14%, transparent);} 100%{background:transparent;}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important;}
  }

  /* ---------- Anchos menores ---------- */
  @media (max-width:1080px){

/* ---------- Lo propio de Finanzas, sobre la base de la guía oficial ---------- */
body{margin:0;}
.nav a.grupo-activo{font-weight:500;}
.ir-movil{display:none; align-items:center; gap:8px;}
.ir-movil select{width:auto;}
.pad{padding:18px 20px;}
.sub{color:var(--taupe);}
.cifras.cinco{grid-template-columns:repeat(5,minmax(0,1fr));}
.tile .valor{font-size:28px;}

/* Pestañas */
.pestanas{display:flex; gap:4px; border-bottom:1px solid var(--sand); overflow-x:auto; margin-bottom:-6px;}
.pestanas button{background:none; border:0; border-bottom:2px solid transparent; padding:10px 14px; font-size:13.5px; color:var(--taupe); white-space:nowrap; margin-bottom:-1px;}
.pestanas button[aria-selected="true"]{color:var(--tinta); border-bottom-color:var(--tinta); font-weight:500;}
.pestanas button:hover{color:var(--tinta);}
.cuenta-tab{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:var(--r-pildora); background:var(--sand); font-size:11.5px; color:var(--tinta); margin-left:4px;}

/* Resumen */
.dos-col{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; align-items:start;}
.dos-col.par{grid-template-columns:1fr 1fr;} .dos-col.der{grid-template-columns:1fr 1.3fr;} .dos-col.izq{grid-template-columns:1.2fr 1fr;}
.columna{display:flex; flex-direction:column; gap:16px; min-width:0;}
.decidir{list-style:none; margin:0; padding:0;}
.decidir li{display:grid; grid-template-columns:10px 1fr auto; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--sand);}
.decidir li:first-child{border-top:0; padding-top:4px;}
.decidir b{font-weight:600; font-size:13.5px;}
.decidir p{margin:3px 0 0; font-size:12.5px; color:var(--taupe); line-height:1.45;}
.punto{width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--taupe);}
.punto[data-tono="rojo"]{background:var(--rojo);} .punto[data-tono="ambar"]{background:var(--ambar);} .punto[data-tono="pizarra"]{background:var(--pizarra);}

/* Gráfico: una serie en tinta; el rojo solo marca pérdida o riesgo, siempre con texto */
.grafico{position:relative;}
.grafico svg{width:100%; height:auto; display:block; overflow:visible;}
.grafico .barra path{fill:var(--tinta); transition:opacity 150ms;}
.grafico .barra.mala path{fill:var(--rojo);}
.grafico .barra:hover path, .grafico .barra:focus path{opacity:.8;}
.grafico .barra:focus{outline:none;}
.grafico text{font-family:var(--sans); font-size:11.5px; fill:var(--tinta);}
.grafico text.eje{fill:var(--taupe); font-size:11px;}
.grafico .barra.mala text.val{fill:var(--rojo-profundo);}
.grafico line.base{stroke:var(--sand); stroke-width:1;}
.grafico line.umbral{stroke:var(--taupe); stroke-width:1; stroke-dasharray:4 4;}
.tip{position:absolute; width:220px; background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-control); padding:8px 10px; font-size:12px; line-height:1.45; pointer-events:none; z-index:5;}

/* Notas y ayudas */
.nota-cayla{background:var(--hueso); border-radius:var(--r-superficie); padding:14px 18px; font-size:13px; line-height:1.55; color:var(--tinta);}
.ayuda{display:block; font-size:11.5px; color:var(--taupe); margin-top:5px; line-height:1.4;}
.dos-campos{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.radios{flex-wrap:wrap;}
.radios label{flex:1 1 120px; cursor:pointer;}
.radios label:has(input:checked){border-color:var(--tinta); background:var(--papel);}
.opciones{display:grid; gap:8px; margin-bottom:16px;}
.opciones label{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; border:1px solid var(--sand); border-radius:var(--r-control); padding:10px 12px; background:var(--hueso); cursor:pointer; margin:0; color:var(--tinta);}
.opciones label:has(input:checked){border-color:var(--tinta); background:var(--papel);}
.opciones input{grid-row:span 2; margin-top:3px;}
.opciones span{font-size:12.5px; color:var(--taupe);}
output.control{min-height:36px;}

/* Tablas */
table.t tr.anulada td{color:var(--taupe);}
table.t tr.anulada b{text-decoration:line-through; font-weight:500;}
table.t tbody tr[data-accion]{cursor:pointer;}
table.medios{min-width:720px;}
.metodo{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px;}
:root{--metodo-efectivo:#d19a12; --metodo-yape:#6d3fa3; --metodo-plin:#1c6b56; --metodo-tarjeta:#525a64; --metodo-transferencia:#2f6aa3;} /* = --color-metodo-* de globals.css */
.metodo[data-m="efectivo"]{background:var(--metodo-efectivo);} .metodo[data-m="yape"]{background:var(--metodo-yape);} .metodo[data-m="plin"]{background:var(--metodo-plin);}
.metodo[data-m="tarjeta"]{background:var(--metodo-tarjeta);} .metodo[data-m="transferencia"]{background:var(--metodo-transferencia);}
table.t td.num span{white-space:nowrap;}

/* Cuentas */
.cuentas, .conciliar{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.conciliar{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
.cuenta-c{background:var(--papel); border:1px solid var(--sand); border-radius:var(--r-superficie); padding:16px 18px; display:flex; flex-direction:column; gap:6px; min-width:0;}
.cuenta-c .fila-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.cuenta-c .fila-top b{font-weight:600; font-size:13.5px;}
.cuenta-c .valor{font-family:var(--serif); font-size:30px; line-height:1.05; font-weight:500;}
.cuenta-c p{margin:0; font-size:12.5px; color:var(--taupe); line-height:1.45;}

/* Estado de resultados */
table.eerr{width:100%; border-collapse:collapse; font-size:13px; min-width:860px;}
table.eerr th{font-weight:400; color:var(--taupe); font-size:12px; text-align:right; padding:10px 14px; white-space:nowrap; background:color-mix(in oklab, var(--sand) 70%, transparent);}
table.eerr th:first-child, table.eerr td:first-child{text-align:left;}
table.eerr td{padding:8px 14px; text-align:right; border-top:1px solid var(--sand); white-space:nowrap;}
table.eerr td.celda{cursor:pointer;} table.eerr td.celda:hover{background:var(--hueso);}
table.eerr tr.sub td{font-weight:600; background:color-mix(in oklab, var(--hueso) 55%, transparent);}
table.eerr tr.total td{font-family:var(--serif); font-size:18px; font-weight:500; border-top:2px solid var(--tinta);}
table.eerr tr.pct td{color:var(--taupe); font-size:12px; border-top:0; padding-top:0;}
table.eerr td.neg{color:var(--rojo-profundo);}
table.eerr td.cta{color:var(--taupe); font-size:11.5px; width:44px; text-align:left;}
table.eerr th.cons, table.eerr td.cons{background:color-mix(in oklab, var(--sand) 35%, transparent);}
.delta{display:block; font-size:11px; color:var(--taupe); font-family:var(--sans);}

/* Balance */
.balance{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.balance h3{font-family:var(--serif); font-weight:500; font-size:20px; margin:0 0 8px;}
.balance ul{list-style:none; margin:0; padding:0;}
.balance li{display:grid; grid-template-columns:46px 1fr auto; gap:8px; padding:8px 0; border-top:1px solid var(--sand); font-size:13px;}
.balance li span:first-child{color:var(--taupe); font-size:11.5px;}
.balance li.tot{font-family:var(--serif); font-size:18px; border-top:2px solid var(--tinta);}
.chequeos{list-style:none; margin:0; padding:0; display:grid; gap:8px;}
.chequeos li{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:start; font-size:13px; padding:10px 12px; border:1px solid var(--sand); border-radius:var(--r-control); background:var(--papel);}
.chequeos li p{margin:2px 0 0; color:var(--taupe); font-size:12px;}
.ok-ic{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:color-mix(in oklab, var(--verde) 16%, transparent); color:var(--verde); font-size:12px;}
.no-ic{background:color-mix(in oklab, var(--rojo) 12%, transparent); color:var(--rojo-profundo);}

/* Impuestos: barra de avance hacia el umbral */
.umbral-barra{height:12px; border-radius:var(--r-pildora); background:var(--hueso); position:relative; overflow:hidden; margin:12px 0 6px;}
.umbral-barra i{position:absolute; inset:0 auto 0 0; background:var(--tinta); border-radius:var(--r-pildora);}
.umbral-barra i.proy{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--taupe) 55%, transparent) 0 4px, transparent 4px 8px);}
.marcas{display:flex; justify-content:space-between; font-size:11.5px; color:var(--taupe);}

/* Cierre de mes */
.matriz{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px;}
.unidad-c{border:1px solid var(--sand); border-radius:var(--r-superficie); padding:14px; background:var(--papel); display:flex; flex-direction:column; gap:8px; text-align:left; min-width:0;}
button.unidad-c{transition:border-color 150ms;}
button.unidad-c[aria-pressed="true"]{border-color:var(--tinta);}
.unidad-c .n{font-weight:600; font-size:13.5px;}
.unidad-c .h{font-size:11.5px; color:var(--taupe); font-family:ui-monospace, Menlo, monospace;}
.unidad-c.consolidado{background:color-mix(in oklab, var(--hueso) 45%, var(--papel));}
.pasos-cierre{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
.pasos-cierre h3{font-family:var(--serif); font-weight:500; font-size:19px; margin:0 0 2px;}

/* Origen de cada dato (botón de la demo) */
.fuente{display:none;}
.ver-fuentes .fuente{display:inline-flex; gap:5px; align-items:center; align-self:flex-start; font-size:11px; line-height:1.3; padding:2px 8px; border-radius:var(--r-pildora); border:1px dashed color-mix(in oklab, var(--pizarra) 55%, transparent); color:var(--pizarra); background:color-mix(in oklab, var(--pizarra) 7%, transparent); white-space:nowrap; margin:2px 0;}
.ver-fuentes .fuente[data-k="nuevo"]{border-color:color-mix(in oklab, var(--rojo) 55%, transparent); color:var(--rojo-profundo); background:color-mix(in oklab, var(--rojo) 6%, transparent);}
.ver-fuentes .fuente[data-k="deriva"]{border-color:color-mix(in oklab, var(--ambar) 55%, transparent); color:var(--ambar); background:color-mix(in oklab, var(--ambar) 7%, transparent);}
.fuente b{font-weight:600;}

@media (max-width:1180px){
  .cifras.cinco{grid-template-columns:repeat(3,minmax(0,1fr));}
  .dos-col, .dos-col.par, .dos-col.der, .dos-col.izq{grid-template-columns:1fr;}
  .matriz{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (max-width:860px){
  .ir-movil{display:flex;}
  .cifras.cinco{grid-template-columns:repeat(2,minmax(0,1fr));}

  .matriz{grid-template-columns:repeat(2,minmax(0,1fr));}
  .decidir li{grid-template-columns:10px 1fr;}

.h-flujo{font-weight:500; font-size:20px; margin:14px 0 4px;}
.lista-mov li b{white-space:nowrap;}
.unidad-c .badge{align-self:flex-start;}

// ---------- Gráfico de barras de una sola serie, con hover y etiquetas directas ----------
// Una serie en tinta; el rojo solo marca una pérdida o una semana bajo el mínimo, SIEMPRE con su etiqueta.
function barras(items, {alto=190, umbral=null, umbralTxt='', etiquetaValor=v=>S(v)}={}){
  const W = 640, H = alto, pad = {t:34, r:12, b:46, l:12};
  const vals = items.map(i=>i.v);
  const max = Math.max(0, ...vals, umbral||0), min = Math.min(0, ...vals);
  const y = v => pad.t + (max - v) / (max - min || 1) * (H - pad.t - pad.b);
  const bw = (W - pad.l - pad.r) / items.length;
  const barra = (it, i) => {
    const x = pad.l + i*bw + bw*0.2, w = bw*0.6, y0 = y(0), y1 = y(it.v);
    const top = Math.min(y0,y1), h = Math.max(2, Math.abs(y1-y0));
    const malo = it.malo;
    const r = 4;
    // extremo de dato redondeado, anclado a la línea base
    const d = it.v >= 0
      ? `M${x},${y0} V${top+r} q0,-${r} ${r},-${r} h${w-2*r} q${r},0 ${r},${r} V${y0} Z`
      : `M${x},${y0} V${top+h-r} q0,${r} ${r},${r} h${w-2*r} q${r},0 ${r},-${r} V${y0} Z`;
    const ly = it.v >= 0 ? top - 7 : top + h + 14;
    const ly2 = it.v >= 0 ? ly - 14 : ly + 13;
    return `<g class="barra${malo?' mala':''}" tabindex="0" data-tip="${esc(it.tip||'')}">
      <rect x="${pad.l+i*bw}" y="${pad.t-10}" width="${bw}" height="${H-pad.t-pad.b+20}" fill="transparent"/>
      <path d="${d}"/>
      <text x="${x+w/2}" y="${ly}" text-anchor="middle" class="val">${etiquetaValor(it.v)}</text>
      ${malo&&it.maloTxt?`<text x="${x+w/2}" y="${ly2}" text-anchor="middle" class="val">${esc(it.maloTxt)}</text>`:''}
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" class="eje">${esc(it.n)}</text>
    </g>`;
  };
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(items.map(i=>i.n+': '+etiquetaValor(i.v)).join('; '))}">
    <line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" class="base"/>
    ${umbral!=null?`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(umbral)}" y2="${y(umbral)}" class="umbral"/>`:''}
    ${items.map(barra).join('')}
  </svg>${umbral!=null?`<p class="leyenda-g"><i></i>${esc(umbralTxt)}</p>`:''}<div class="tip" hidden></div></div>`;
}
document.addEventListener('mouseover', e => {

// Septiembre «a la fecha» (24 de 30 días): lo variable se escala, lo fijo del mes ya está entero.
function resultadosDe(mes){
  if (mes === '2026-08') return RESULTADOS_AGO;
  const f = 0.8, r = {};
  for (const [k, fila] of Object.entries(RESULTADOS_AGO)){
    const fijo = ['alquiler','planilla','depreciacion','personal'].includes(k);
    r[k] = {}; for (const u in fila) r[k][u] = Math.round(fila[u] * (fijo ? 1 : f) * (k==='ventas'&&u==='LIM' ? 1.18 : 1));
  }
  return r;
}
const LINEAS_GASTO = [['planilla','Planilla (Dynamic)'],['alquiler','Alquileres'],['servicios','Servicios básicos'],['personal','Honorarios'],
  ['publicidad','Publicidad'],['transporte','Transporte'],['suministros','Suministros'],['mantenimiento','Mantenimiento'],['depreciacion','Depreciación']];
function totalesDe(r, u){
  const us = u ? [u] : UNIDADES.map(x=>x.k);
  const s = k => us.reduce((a,x)=>a+(r[k][x]||0), 0);
  const margen = s('ventas') - s('costo') - s('flete') - s('mermas');
  const gastos = LINEAS_GASTO.reduce((a,[k])=>a+s(k), 0);
  return {ventas:s('ventas'), margen, gastos, absorbido:s('absorbido'), utilidad: margen - gastos + s('absorbido')};
}
const disponible = () => CUENTAS.filter(c=>veUnidad(c.unidad||'EMP')||esLider()).reduce((a,c)=>a+c.saldo, 0);

function vistaResultados(){
  const mes = E.mesResultados, r = resultadosDe(mes), prev = mes==='2026-09' ? RESULTADOS_AGO : null;
  const cols = [...UNIDADES.map(u=>u.k), 'CONS'];
  const val = (fila, u, rr=r) => {
    const us = u==='CONS' ? UNIDADES.map(x=>x.k) : [u];
    if (fila.sub) return us.reduce((a,x)=>a+totalesDe(rr,x).margen,0);
    if (fila.total) return us.reduce((a,x)=>a+totalesDe(rr,x).utilidad,0);
    return us.reduce((a,x)=>a+(rr[fila.k][x]||0),0) * (fila.neg?-1:1);
  };
  const cerrado = u => u==='CONS' ? Object.values(CIERRE['2026-08']).every(x=>x.c) : (CIERRE[mes]||{})[u]?.c;
  const celda = (fila, u) => {
    const v = val(fila, u); if (!v && !fila.total && !(fila.sub && val(FILAS_ER[0],u))) return `<td class="${u==='CONS'?'cons':''} sub">—</td>`;
    const d = E.comparar && prev ? v - val(fila, u, prev) : null;
    return `<td class="${u==='CONS'?'cons ':''}${v<0&&(fila.total||fila.sub)?'neg ':''}${fila.k?'celda':''}" ${fila.k?`data-accion="origen" data-id="${fila.k}|${u}"`:''}>${S(v)}${d!=null&&(fila.total||fila.sub||fila.k==='ventas')?`<span class="delta">${d>=0?'+':'−'}${S(Math.abs(d)).replace('S/ ','')} vs ago.</span>`:''}</td>`;
  };
  return `
  <div class="superficie anim-sube">
    <div class="herramientas">
      <select class="control" data-cambia="mesResultados"><option value="2026-08"${mes==='2026-08'?' selected':''}>Agosto 2026</option><option value="2026-09"${mes==='2026-09'?' selected':''}>Septiembre 2026 · a la fecha</option></select>
      ${mes==='2026-09'?`<label class="btn btn-sutil btn-sm" style="gap:8px"><input type="checkbox" data-cambia="comparar" ${E.comparar?'checked':''}> Comparar con agosto</label>`:''}
      <span class="sub" style="font-size:12.5px;margin-left:auto">Toca una cifra para ver de qué filas sale.</span>
      ${F('deriva','fn_estado_resultados ← fn_asientos (ADR-0120)')} ${F('existe','planilla_por_sede (Dynamic)')}
    </div>
    <div class="tabla-wrap"><table class="eerr">
      <thead><tr><th>Concepto</th><th style="text-align:left">Cuenta</th>${cols.map(u=>`<th class="${u==='CONS'?'cons':''}">${u==='CONS'?'CAYLA':nombreUnidad(u).replace('Tienda ','')}<span class="delta">${u==='CONS'?(Object.values(CIERRE['2026-08']).every(x=>x.c)||mes!=='2026-08'?'':'2 de 5 cerradas'):(mes==='2026-08'?(cerrado(u)?'cerrado':'abierto'):'abierto')}</span></th>`).join('')}</tr></thead>
      <tbody>${FILAS_ER.map(f => {
        if (f.k==='absorbido' && !UNIDADES.some(u=>r.absorbido[u.k])) return '';
        const cls = f.sub ? 'sub' : f.total ? 'total' : '';
        const fila = `<tr class="${cls}"><td>${f.n}</td><td class="cta">${f.cta||''}</td>${cols.map(u=>celda(f,u)).join('')}</tr>`;
        const pctFila = (f.sub||f.total) ? `<tr class="pct"><td></td><td></td>${cols.map(u=>{ const vt = val(FILAS_ER[0],u); return `<td class="${u==='CONS'?'cons':''}">${vt?pct(val(f,u)/vt)+' de la venta':''}</td>`; }).join('')}</tr>` : '';
        return fila + pctFila;
      }).join('')}</tbody>
    </table></div>
  </div>
  <div class="dos-col par">
    <div class="nota-cayla"><b>El Taller no le vende a las tiendas</b> (D-31): lo que cuesta producir se pega a cada prenda y aparece en el «costo de lo vendido» de la tienda que la vende. Por eso su columna muestra lo que gastó y, en positivo, lo que absorbieron sus prendas: si queda en negativo, es costo que <b>no</b> alcanzó a entrar a ninguna prenda (eficiencia).</div>
    <div class="nota-cayla"><b>«De la empresa»</b> son los gastos que no son de ninguna tienda (contador, publicidad, software, sueldo de oficina, D-32). Aparecen solo aquí y en CAYLA. No se reparten entre tiendas: repartirlos sería inventar un número.</div>
  </div>`;
}

    </div>
    <div class="superficie pad anim-sube">
      <div class="prioridades-cab"><div><h2>Para revisar antes de declarar</h2><p>Lo que puede hacer que pagues de más.</p></div></div>
      <ul class="decidir">
        <li><span class="punto" data-tono="ambar"></span><div><b>${boletas.length} ${boletas.length===1?'gasto':'gastos'} con boleta este mes</b><p>Una boleta no da IGV descontable. Si el proveedor emite factura, pídela: ${boletas.map(b=>esc(b.prov)).join(', ')}.</p></div><button class="btn btn-sutil btn-sm" data-ir="gastos">Ver gastos</button></li>
        <li><span class="punto" data-tono="pizarra"></span><div><b>2 ventas de agosto sin comprobante aceptado</b><p>El IGV se reconoce al vender, pero SUNAT debe tenerlos. Siguen reintentándose solos.</p></div><button class="btn btn-sutil btn-sm">Ver en Facturación</button></li>
        <li><span class="punto" data-tono="pizarra"></span><div><b>Recibos por honorarios: retención del 8 %</b><p>El contador define si CAYLA debe retener. Mientras tanto, se paga el total.</p></div></li>
      </ul>
    </div>
  </section>
  <div class="superficie anim-sube">
    <div class="herramientas"><b>Últimos 6 meses</b><span class="sub" style="font-size:12.5px">Septiembre (*) va a la fecha y todavía puede cambiar.</span></div>
    <div class="tabla-wrap"><table class="t" style="min-width:560px"><thead><tr><th>Mes</th><th class="num">IGV cobrado</th><th class="num">IGV descontado</th><th class="num">A pagar</th><th>Estado</th></tr></thead>
    <tbody>${IGV_MESES.map((m,i)=>`<tr><td data-l="Mes">${m.m}</td><td class="num" data-l="Cobrado">${S(m.deb)}</td><td class="num" data-l="Descontado">${S(m.cred)}</td><td class="num" data-l="A pagar"><b>${S(m.deb-m.cred)}</b></td>
      <td data-l="Estado">${i<4?'<span class="badge" data-tono="verde">declarado</span>':i===4?'<span class="badge" data-tono="ambar">por declarar</span>':'<span class="badge" data-tono="pizarra">en curso</span>'}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
};

// ============ Cierre de mes (pieza 11) ============
E.unidadCierre = 'LIM';
function chequeosDe(u){
  const egresoLIM = EGRESOS.some(e=>e.mes==='2026-08' && e.u===u);
  const base = {
    tienda: [
      {t:'Cajas del mes cerradas', d:'31 de 31 días con cierre', ok:true},
      {t:'Egresos de caja clasificados', d: egresoLIM ? 'Falta 1: «Depósito bancario» del 31 ago por S/ 2,300' : 'Todos dicen si son gasto, depósito o retiro', ok:!egresoLIM, ir:'gastos:egresos'},
      {t:'Depósitos del mes registrados', d:'Cada depósito tiene su voucher', ok:true},
      {t:'Conteo de las 20 prendas de más valor', d:'Hecho el 30 ago, sin diferencias', ok:true},
    ],
    taller: [
      {t:'Órdenes del mes cerradas o en curso', d:'4 cerradas, 2 en curso', ok:true},
      {t:'Insumos recibidos con su factura', d:'Sin recepciones sueltas', ok:true},
      {t:'Egresos del fondo fijo clasificados', d:'Todos clasificados', ok:true},
    ],
    empresa: [
      {t:'Bancos conciliados al fin de mes', d: E.conciliado.ibk!=null ? 'BCP e Interbank coinciden' : 'Interbank sin conciliar desde el 29 ago', ok:E.conciliado.ibk!=null, ir:'dinero:conciliacion'},
      {t:'Facturas de proveedor del mes registradas', d:'Revisa que no quede ninguna en el cajón', ok:true},
      {t:'Planilla de agosto leída de Dynamic', d:'Período cerrado en Dynamic el 1 sep', ok:true},
    ],
  }[UNIDADES.find(x=>x.k===u).tipo];
  return [...base, {t:'El diario de la unidad cuadra', d:'Debe = haber en todas las líneas', ok:true}];
}

VISTAS.cierre = () => {
  const mes = E.mesCierre, est = CIERRE[mes] || {};
  const todas = UNIDADES.every(u=>est[u.k]?.c);
  const consolidado = est.CONS;
  const u = E.unidadCierre, ch = chequeosDe(u), listo = ch.every(c=>c.ok), cerrada = est[u]?.c;
  return `
  ${cabecera({sobre:'Finanzas · Cierre de mes', titulo:'Cerrar ' + mesLargo(mes), bajada:'Cerrar un mes lo congela: nadie puede registrar ni cambiar nada con fecha de ese mes, y el diario queda guardado con su huella. Se cierra cada tienda y el Taller; CAYLA entera, cuando cerraron todas (ADR-0109).',
    acciones:`<select class="control" data-cambia="mesCierre"><option value="2026-07"${mes==='2026-07'?' selected':''}>Julio 2026</option><option value="2026-08"${mes==='2026-08'?' selected':''}>Agosto 2026</option></select>`})}
  <div class="matriz anim-sube">
    ${UNIDADES.map(x=>{ const s = est[x.k]||{}; return `<button class="unidad-c" data-accion="unidad-cierre" data-id="${x.k}" aria-pressed="${x.k===u}">
      <span class="n">${x.n}</span>${s.c?`<span class="badge" data-tono="verde">cerrado</span><span class="sub" style="font-size:12px">${fecha(s.f)} · ${s.por.split(' ')[0]}</span><span class="h">${s.hash}</span>`
      : `<span class="badge" data-tono="${chequeosDe(x.k).every(c=>c.ok)?'pizarra':'ambar'}">${chequeosDe(x.k).every(c=>c.ok)?'lista para cerrar':chequeosDe(x.k).filter(c=>!c.ok).length+' pendiente'}</span>`}
    </button>`; }).join('')}
    <div class="unidad-c consolidado"><span class="n">CAYLA entera</span>
      ${consolidado||mes==='2026-07'?`<span class="badge" data-tono="verde">cerrado</span><span class="h">${mes==='2026-07'?'f2c9…80d1':consolidado.hash}</span>`
        : todas ? `<button class="btn btn-primario btn-sm" data-accion="cerrar-cons">Cerrar ${MESES_L[+mes.slice(5)-1]}</button>`
        : `<span class="badge" data-tono="taupe">faltan ${UNIDADES.filter(x=>!est[x.k]?.c).length}</span><span class="sub" style="font-size:12px">Se habilita cuando cierran todas</span>`}
    </div>
  </div>
  <section class="dos-col izq">
    <div class="superficie pad anim-sube">
      <div class="prioridades-cab"><div><h2>${nombreUnidad(u)} · ${mesLargo(mes)}</h2><p>${cerrada?`Cerrado el ${fecha(est[u].f)} por ${est[u].por}.`:'Lo que el sistema revisa antes de dejarte cerrar.'}</p></div></div>
      <ul class="chequeos">${ch.map(c=>`<li><span class="ok-ic ${c.ok?'':'no-ic'}">${c.ok?'✓':'!'}</span><div><b>${c.t}</b><p>${c.d}</p></div>${!c.ok&&c.ir&&!cerrada?`<button class="btn btn-sutil btn-sm" data-ir="${c.ir}">Resolver</button>`:'<span></span>'}</li>`).join('')}</ul>
      <div class="botones" style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px">
        ${cerrada ? `<button class="btn btn-sutil" data-accion="reabrir" data-id="${u}">Reabrir…</button>`
          : `<button class="btn btn-primario" data-accion="cerrar-unidad" data-id="${u}" ${listo?'':'disabled'}>Cerrar ${MESES_L[+mes.slice(5)-1]} de ${nombreUnidad(u).replace('Tienda ','')}</button>`}
      </div>
      ${F('nuevo','periodos + asientos (materializa fn_asientos con hash)')}
    </div>
    <div class="superficie pad anim-sube">
      <p class="etq">La rutina de fin de mes</p>
      <div class="pasos-cierre" style="grid-template-columns:1fr;gap:14px;margin-top:8px">
        <div><h3>Día 1 · cada tienda (20 min)</h3><p class="sub" style="margin:0;font-size:13px">Cerrar la última caja, registrar los depósitos que falten y contar las 20 prendas de más valor.</p></div>
        <div><h3>Día 2 · el líder (40 min)</h3><p class="sub" style="margin:0;font-size:13px">Revisar que estén todos los gastos y facturas, conciliar el banco y explicar cualquier diferencia de caja.</p></div>
        <div><h3>Día 3 · el sistema (5 min)</h3><p class="sub" style="margin:0;font-size:13px">Mirar los tres estados contra el mes anterior y cerrar. Desde ahí, el mes ya no cambia.</p></div>
      </div>
      <div class="nota-cayla" style="margin-top:14px">Solo el líder cierra y reabre (el módulo no se puede delegar). Reabrir pide motivo y queda en la historia; reabrir una tienda reabre también CAYLA entera.</div>
    </div>
  </section>`;
};

const huella = () => Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6);
const ACCIONES_EXTRA = {
  'unidad-cierre': a => { E.unidadCierre = a.dataset.id; render(); },
  'cerrar-unidad': a => { const u = a.dataset.id;
    ventana(`<h3>Cerrar ${mesLargo(E.mesCierre)} de ${nombreUnidad(u)}</h3>
      <p class="bajada">Desde ahora nadie podrá registrar ni cambiar ventas, gastos, pagos ni movimientos de ${nombreUnidad(u)} con fecha de ese mes. Se guarda el diario con su huella.</p>
      ${comboResponsable()}<div class="botones"><button class="btn btn-secundario" data-cerrar>Cancelar</button><button class="btn btn-primario" id="okCi">Cerrar el mes</button></div>`);
    $('#okCi').onclick = () => guardar(`${mesLargo(E.mesCierre)} de ${nombreUnidad(u)} quedó cerrado.`, () => { CIERRE[E.mesCierre][u] = {c:true, por:$('#fResp').value, f:HOY, hash:huella()}; const sig = UNIDADES.find(x=>!CIERRE[E.mesCierre][x.k]?.c); if (sig) E.unidadCierre = sig.k; }); },
  'cerrar-cons': () => { ventana(`<h3>Cerrar ${mesLargo(E.mesCierre)} de CAYLA entera</h3><p class="bajada">Todas las unidades ya cerraron. El consolidado queda congelado y es el que se le entrega al contador.</p>
      ${comboResponsable()}<div class="botones"><button class="btn btn-secundario" data-cerrar>Cancelar</button><button class="btn btn-primario" id="okCc">Cerrar consolidado</button></div>`);
    $('#okCc').onclick = () => guardar(`${mesLargo(E.mesCierre)} de CAYLA quedó cerrado.`, () => { CIERRE[E.mesCierre].CONS = {c:true, hash:huella()}; }); },
  'reabrir': a => { const u = a.dataset.id;
    ventana(`<h3>Reabrir ${mesLargo(E.mesCierre)} de ${nombreUnidad(u)}</h3><p class="bajada">Los números de ese mes pueden volver a cambiar. Queda en la historia quién, cuándo y por qué.</p>
      <div class="campo"><label for="fMotR">Motivo (obligatorio)</label><input class="control" id="fMotR" placeholder="Ej. llegó una factura de agosto tarde"></div>${comboResponsable()}
      <div class="botones"><button class="btn btn-secundario" data-cerrar>Cancelar</button><button class="btn btn-primario" id="okRe">Reabrir</button></div>`);
    $('#okRe').onclick = () => { if (!$('#fMotR').value.trim()){ $('#fMotR').focus(); $('#fMotR').style.borderColor='var(--rojo)'; return; }
      guardar('Mes reabierto. El motivo quedó en la historia.', () => { CIERRE[E.mesCierre][u] = {c:false}; delete CIERRE[E.mesCierre].CONS; }); }; },
  'origen': a => modalOrigen(a.dataset.id),
  'exportar': () => avisar('En el sistema real se descarga el archivo. En el spike no se genera nada.'),
};

// ============ Acciones: un solo escuchador para toda la demo ============
document.addEventListener('click', e => {
  const irA = e.target.closest('[data-ir]');
  if (irA){ e.preventDefault(); const [r, t] = irA.dataset.ir.split(':'); if (t) E.tab[r] = t; ir(r); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab){ const [r, t] = tab.dataset.tab.split(':'); E.tab[r] = t; render(); return; }
  const seg = e.target.closest('.seg button');
  if (seg){
    const ctl = seg.parentElement.dataset.ctl, v = seg.dataset.v;
    seg.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===seg));
    if (ctl==='rol'){ E.rol = v; E.seleccion.clear(); if (!puedeVer(E.ruta)) E.ruta = 'gastos'; }
    if (ctl==='fuentes') E.fuentes = v==='si';
    if (ctl==='tema') document.documentElement.dataset.theme = v;
    render(); return;
  }
  if (e.target.closest('#reiniciar')){ location.hash=''; location.reload(); return; }
  const a = e.target.closest('[data-accion]');
  if (!a) return;
  const id = a.dataset.id;
  ({
    'nuevo-gasto': modalGasto, 'nuevo-activo': modalActivo, 'ver-gasto': () => modalVerGasto(id),
    'clasificar': () => modalClasificar(id), 'nuevo-mov': modalMovimiento, 'pagar': modalPagar,
    'conciliar': () => { const v = parseFloat(($('#b-'+id).value||'').replace(/,/g,'')); if (isNaN(v)) return; E.conciliado[id] = v; render(); avisar(v===cuenta(id).saldo?'Coincide con el banco.':'Hay una diferencia: revisa los movimientos sin pareja.'); },
    ...(typeof ACCIONES_EXTRA === 'object' ? ACCIONES_EXTRA : {}),
  }[a.dataset.accion] || (()=>{}))(a);
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]');
  if (s){ s.checked ? E.seleccion.add(s.dataset.sel) : E.seleccion.delete(s.dataset.sel); render(); return; }
  if (e.target.id === 'irMovil') ir(e.target.value);
  const m = e.target.closest('[data-cambia]');
  if (m){ E[m.dataset.cambia] = m.type==='checkbox' ? m.checked : m.value; render(); }
});
// #ruta o #ruta:pestaña
function leerHash(){ const [r, t] = location.hash.slice(1).split(':'); if (!MENU.some(m=>m.r===r)) return false; E.ruta = r; if (t) E.tab[r] = t; return true; }
window.addEventListener('hashchange', () => { if (leerHash()) render(); });
leerHash(); render();

</script>
</body>
</html>
