<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja cerrada · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Vender con la caja cerrada (2026-10-01)
   Pedido de Felipe: con la caja cerrada, el POS ya no solo se apaga
   (opacity .5): todo el fondo se desenfoca y en el medio aparece un aviso
   grande de «Abrir caja», sofisticado y con mucho movimiento.
   Tres maquetas para elegir: A Vitrina · B Persiana · C Pulso.
   Fondo = el POS del spike «ticket a lo alto» (docs/maquetas/punto-venta-ticket-alto-2026-09/).
   Tokens = apps/web/app/globals.css (ADR-0169). Datos inventados.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.1);--ease:cubic-bezier(.32,.72,.24,1);--telon:cubic-bezier(.6,.02,.2,1)}
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#ddd5c6}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}svg.s{width:14px;height:14px}svg.l{width:22px;height:22px}

/* ---------- barra del spike ---------- */
.spk{position:sticky;top:0;z-index:100;background:var(--tinta);color:var(--crema);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.7)}.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk label{display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.75)}
.spk .acc{height:30px;padding:0 12px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);color:var(--crema);font-size:12.5px}
.spk .acc:hover{background:rgba(245,240,232,.08)}
.escena{padding:22px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ley{max-width:1320px;width:100%;background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--t80)}.ley b{font-weight:600;color:var(--tinta)}
.ley h2{font-family:'EB Garamond',serif;font-weight:500;font-size:22px;color:var(--tinta);margin-bottom:2px}
.ley ul{margin:6px 0 0 18px}.ley li{margin:2px 0}
.ley .ojo{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--hueso);font-size:12.5px}
.sx{width:100%;overflow-x:auto;display:flex}.sx>.desk{margin:0 auto}

/* ---------- el POS de fondo (escritorio) ---------- */
.desk{width:1320px;height:820px;flex:none;position:relative;overflow:hidden;border-radius:14px;background:var(--crema);border:1px solid var(--t30);box-shadow:0 30px 60px -30px rgba(26,26,24,.45)}
.top{position:relative;z-index:45;height:54px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:10px;padding:0 22px;font-size:11px;letter-spacing:.12em;color:var(--t65);background:var(--crema)}
.top .marca{font-weight:700;letter-spacing:.24em;color:var(--tinta);margin-right:auto;display:flex;align-items:center;gap:10px}
.top .sede{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);color:var(--tinta);font-weight:600}
.pos{position:absolute;inset:72px 22px 18px;display:flex;flex-direction:column;border:1px solid var(--sand);border-radius:18px;background:var(--crema);overflow:hidden}
.lugar{color:var(--taupe);font-size:11px;white-space:nowrap}
.b{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--sand);background:var(--crema);font-size:12.5px;color:var(--t80);white-space:nowrap}
.b.fuerte{background:var(--tinta);color:var(--crema);border-color:var(--tinta);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.cat{min-height:0;overflow:hidden;padding:14px 18px;display:flex;flex-direction:column}
.fila-cat{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.fila-cat .hoy-t{margin-left:auto;font-size:12px;color:var(--t65);display:flex;align-items:center;gap:5px}
.busca-f{display:flex;gap:8px}.busca{flex:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);color:var(--t50);font-size:15px}
.busca.foco{border-color:var(--tinta);animation:foco 1.4s var(--ease) both}
@keyframes foco{0%{box-shadow:0 0 0 0 rgba(26,26,24,.18)}40%{box-shadow:0 0 0 6px rgba(26,26,24,.10)}100%{box-shadow:0 0 0 3px rgba(26,26,24,.06)}}
.busca .cursor{width:1.5px;height:20px;background:var(--tinta);margin-left:-6px;order:-1;animation:parpadeo 1.1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.sinreg{height:50px;padding:0 14px;border:1px solid var(--sand);border-radius:14px;background:var(--papel);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.filt{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:11.5px;color:var(--t65)}.sw{width:34px;height:19px;border-radius:10px;background:var(--tinta);position:relative}.sw::after{content:"";position:absolute;right:3px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--crema)}
.pills{display:flex;gap:6px;margin-bottom:12px}.pl{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--sand);background:var(--papel);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center}.pl.on{background:var(--tinta);color:var(--crema)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:9px;position:relative}
.foto{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:22px;color:rgba(26,26,24,.35);position:relative}
.foto .c{position:absolute;left:6px;bottom:6px;font:600 9px 'DM Sans';letter-spacing:.12em;color:var(--t65);background:rgba(251,248,242,.8);padding:2px 5px;border-radius:4px}
.card h4{font-weight:500;font-size:13.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .co{font-size:11.5px;color:var(--t65)}
.tl{display:flex;gap:4px;margin:6px 0}.t{min-width:22px;height:21px;padding:0 5px;border-radius:5px;border:1px solid var(--sand);background:var(--hueso);font-size:10px;font-weight:600;display:grid;place-items:center}
.pie{display:flex;justify-content:space-between;font-size:13px}.pie b{font-weight:600}.pie span{font-size:10.5px;color:var(--t65)}
.tk{min-height:0;display:flex;flex-direction:column;background:var(--papel);border-left:1px solid var(--sand)}
.tk-cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--sand);flex:none}
.tk-cab h3{font-family:'EB Garamond',serif;font-weight:500;font-size:23px}
.cli{margin:10px 18px 0;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px dashed var(--t30);border-radius:12px;font-size:13px;color:var(--t65);flex:none}.cli span{margin-left:auto;font-size:11px;color:var(--t50)}
.vacio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--t65);font-size:13px}.vacio b{color:var(--tinta);font-weight:500;font-size:14px}
.tpie{padding:10px 18px 16px;border-top:1px solid var(--sand);flex:none}
.tot{display:flex;align-items:flex-end}.tot .d{font-size:12px;color:var(--t65);line-height:1.6}.tot .g{margin-left:auto;text-align:right}.tot .g .v{font-family:'EB Garamond',serif;font-size:42px;line-height:1;font-weight:500}
.cobrar{margin-top:10px;width:100%;height:54px;border-radius:12px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.4}.cobrar b{margin-left:auto;font-family:'EB Garamond',serif;font-size:21px;letter-spacing:0;font-weight:500}
/* el POS «vuelve a la vida» al abrir */
.vive .card{animation:vive .55s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 80ms)}
.vive .fila-cat,.vive .busca-f,.vive .filt,.vive .pills{animation:vive .5s var(--ease) both}
.vive .busca-f{animation-delay:40ms}.vive .filt{animation-delay:80ms}.vive .pills{animation-delay:120ms}
.vive .tk{animation:vive-x .6s .1s var(--ease) both}
@keyframes vive{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes vive-x{from{opacity:0;transform:translate3d(14px,0,0)}}

/* ---------- celular ---------- */
.tels{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.tel{width:391px;height:812px;border-radius:46px;background:#1b1a18;padding:8px;box-shadow:0 30px 60px -30px rgba(26,26,24,.55)}
.pn{width:375px;height:796px;border-radius:39px;overflow:hidden;position:relative;background:var(--crema)}
.mtop{position:relative;z-index:45;height:50px;padding:14px 16px 0;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em;font-weight:600;background:var(--crema)}.mtop .sd{margin-left:auto;font-size:10.5px;letter-spacing:.1em;border:1px solid var(--sand);border-radius:8px;padding:5px 9px;background:var(--papel)}
.pn .sc{position:absolute;inset:50px 0 0;overflow:hidden}
.mcab{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px 4px}
.mcab .lugar{width:100%;margin:0 0 4px 2px}
.mcab .hoy-m{margin-left:auto;font-size:11.5px;color:var(--t65)}
.mbusca{display:flex;gap:6px;padding:6px 12px}.mqr{flex:1;height:48px;border-radius:12px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}.mi{width:48px;height:48px;border-radius:12px;border:1px solid var(--sand);background:var(--papel);display:grid;place-items:center}
.mqr.foco{animation:foco 1.4s var(--ease) both}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px}
.mgrid .card h4{font-size:13px}

/* =====================================================================
   LA CAPA DE «CAJA CERRADA» (común a las tres)
   Cubre todo lo que está bajo la barra de arriba. La barra (menú y sede)
   queda nítida a propósito: con la caja cerrada se puede cambiar de sede.
   ===================================================================== */
.capa{position:absolute;left:0;right:0;bottom:0;top:54px;z-index:40;overflow:hidden}
.pn .capa{top:50px}
.capa .velo{position:absolute;inset:0}
.cas{animation:cascada .55s var(--ease) both}
@keyframes cascada{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes aparece{from{opacity:0}}
@keyframes entra{from{opacity:0;transform:translate3d(0,18px,0) scale(.965)}}
kbd{font:600 11px 'DM Sans';border:1px solid var(--sand);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--crema);color:var(--tinta)}
.atajo{margin-top:10px;font-size:12px;color:var(--t65)}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rojo);position:relative;flex:none}
.punto.bucle::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--rojo);animation:late 2.4s var(--ease) infinite}
@keyframes late{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.8);opacity:0}}

/* ---------- el formulario «Abrir caja» (el de hoy, AbrirCajaFormV2) ---------- */
.form{text-align:left}
.eti-f{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.h-f{font-family:'EB Garamond',serif;font-weight:500;font-size:28px;line-height:1.1;margin-top:2px}
.baj-f{font-size:13.5px;color:var(--t80);margin-top:8px}.baj-f b{font-weight:600;color:var(--tinta);white-space:nowrap}
.ops{display:grid;gap:8px;margin-top:14px}
.op{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 14px;border:1px solid var(--sand);border-radius:14px;background:var(--crema);transition:border-color .2s,background .2s}
.op small{display:block;font-size:12px;color:var(--t65)}
.op .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--t30);margin-top:1px;flex:none;position:relative;transition:border-color .2s}
.op .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--tinta);transform:scale(0);transition:transform .3s var(--ease)}
.op.on{border-color:var(--tinta);background:var(--papel)}.op.on .rd{border-color:var(--tinta)}.op.on .rd::after{transform:scale(1)}
.op b{font-weight:600}
.lab-f{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t65);margin-top:14px}
.inp{display:flex;align-items:center;gap:8px;height:52px;margin-top:6px;padding:0 14px;border-radius:12px;background:var(--hueso);border:1px solid var(--sand)}
.inp span{color:var(--t65)}.inp input{flex:1;border:0;background:transparent;outline:0;font-family:'EB Garamond',serif;font-size:26px}
.inp:focus-within{border-color:var(--tinta);background:var(--papel)}
.otro{overflow:hidden;animation:cascada .35s var(--ease) both}
.pie-f{display:flex;gap:8px;margin-top:18px}
.sec{height:50px;padding:0 18px;border-radius:12px;border:1px solid rgba(26,26,24,.25);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.prim{flex:1;height:50px;border-radius:12px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;transition:background .25s}
.prim b{font-family:'EB Garamond',serif;font-size:18px;letter-spacing:0;font-weight:500;text-transform:none}
.prim:hover{background:var(--rojo)}
.prim:disabled{opacity:.4;pointer-events:none}

/* ---------- la hoja (modal estándar de la casa, para B y C) ---------- */
.modal-capa{position:absolute;inset:0;z-index:5;display:flex;justify-content:center;align-items:flex-start;padding-top:70px}
.modal-capa .velo2{position:absolute;inset:0;background:rgba(26,26,24,.22);backdrop-filter:blur(3px);animation:aparece .22s both}
.modal-capa .hoja{position:relative;width:460px;background:var(--papel);border-radius:20px;padding:24px 26px;animation:entra .42s var(--ease) both;box-shadow:0 30px 64px -22px rgba(26,26,24,.35)}
.modal-capa .hoja>*{animation:cascada .5s var(--ease) both}
.modal-capa.abajo{align-items:flex-end;padding:0}
.modal-capa.abajo .hoja{width:100%;border-radius:22px 22px 0 0;animation:hoja-sube .38s var(--ease) both;padding:22px 18px 26px}
@keyframes hoja-sube{from{transform:translateY(100%)}}
.modal-capa.sale .velo2{animation:aparece .22s reverse both}
.modal-capa.sale .hoja{animation:hoja-sale .22s var(--ease) both}
@keyframes hoja-sale{to{opacity:0;transform:translate3d(0,10px,0) scale(.98)}}
.modal-capa.abajo.sale .hoja{animation:hoja-baja .26s var(--ease) both}
@keyframes hoja-baja{to{transform:translateY(100%)}}

/* ---------- aviso de éxito (sale DESPUÉS de que la capa se va, ADR-0149) ---------- */
.aviso{position:absolute;right:28px;top:66px;z-index:60;background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:12px 16px 12px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 18px 44px -14px rgba(26,26,24,.25);animation:aviso .45s var(--ease) both;font-size:13px}
.aviso .ok{width:28px;height:28px;border-radius:50%;background:rgba(72,96,63,.14);color:var(--verde);display:grid;place-items:center}
.aviso small{display:block;color:var(--t65);font-size:12px}
.aviso.fuera{animation:aviso-sale .3s var(--ease) both}
.pn .aviso{left:12px;right:12px;top:58px}
@keyframes aviso{from{opacity:0;transform:translate3d(16px,0,0)}}
@keyframes aviso-sale{to{opacity:0;transform:translate3d(0,-8px,0)}}
.visto path{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja .5s .1s var(--ease) both}

/* =====================================================================
   A · VITRINA — vidrio empañado crema + tarjeta de papel que se vuelve el formulario
   ===================================================================== */
@keyframes A-velo{from{-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1);background:rgba(245,240,232,0)}to{-webkit-backdrop-filter:blur(18px) saturate(.7);backdrop-filter:blur(18px) saturate(.7);background:rgba(245,240,232,.52)}}
@keyframes A-velo-out{from{-webkit-backdrop-filter:blur(18px) saturate(.7);backdrop-filter:blur(18px) saturate(.7);background:rgba(245,240,232,.52)}to{-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1);background:rgba(245,240,232,0)}}
.A .velo{animation:A-velo .9s var(--ease) both}
.A.fuera .velo{animation:A-velo-out .85s var(--ease) both}
.A .luz{position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:radial-gradient(closest-side,rgba(251,248,242,.9),rgba(251,248,242,0));animation:aparece 1.2s .2s both;pointer-events:none}
.A.fuera .luz{animation:aparece .5s reverse both}
.A .centro{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px}
.A .tarjeta{width:min(540px,100%);background:var(--papel);border:1px solid var(--sand);border-radius:28px;padding:34px 40px 30px;text-align:center;box-shadow:0 40px 80px -30px rgba(26,26,24,.28),0 0 0 8px rgba(251,248,242,.55);animation:entra .62s .25s var(--ease) both;overflow:hidden;transition:height .48s var(--ease)}
.A .tarjeta.cambia>*{transition:opacity .18s,transform .18s;opacity:0;transform:translateY(-6px)}
.A .tarjeta.sale-t{animation:t-sale .45s var(--ease) both}
@keyframes t-sale{to{opacity:0;transform:translate3d(0,-14px,0) scale(.97)}}
.ilus{width:150px;height:112px;margin:0 auto 4px;position:relative}
.ilus svg{width:100%;height:100%;overflow:visible;position:relative}
.ilus .aura{position:absolute;left:50%;top:56%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:radial-gradient(closest-side,rgba(184,65,45,.10),rgba(184,65,45,0));animation:aparece 1s .9s both}
.ilus .aura.bucle{animation:aparece 1s .9s both,respira 4.5s 1.9s ease-in-out infinite alternate}
@keyframes respira{from{transform:scale(.9);opacity:.7}to{transform:scale(1.12);opacity:1}}
.dib{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja 1.1s var(--ease) both}
@keyframes dibuja{to{stroke-dashoffset:0}}
.candado .dib{stroke:var(--rojo-p);stroke-width:1.9}
.candado .cuerpo{fill:var(--papel)}
.grillete{transform-origin:132px 80px;transition:transform .6s var(--ease)}
.ilus.abierta .grillete{transform:translateY(-6px) rotate(28deg)}
.ilus.abierta .candado .dib{stroke:var(--verde);transition:stroke .4s}
.A .eti{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--taupe);margin-top:6px}
.A .eti i{height:1px;width:46px;background:var(--taupe);opacity:.55;transform:scaleX(0);animation:hilo .8s .7s var(--ease) both}
.A .eti i:first-child{transform-origin:right}.A .eti i:last-child{transform-origin:left}
@keyframes hilo{to{transform:scaleX(1)}}

<script>
/* ---------- estado del spike ---------- */
const S={m:'A',vista:'escritorio',fondo:true,bucle:true,rm:false,fase:'cerrada',vivo:false,posAbierta:false,op:'igual',monto:''};
const D={sede:'Tienda TRU',persona:'Carla',cierre:'ayer, 21:04',quien:'Rosa',fondo:200};
const $=(s,r=document)=>r.querySelector(s);
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const T=ms=>S.rm?20:ms;
const soles=n=>'S/ '+Number(n).toFixed(2);
const hora=()=>new Date().toLocaleTimeString('es-PE',{hour:'numeric',minute:'2-digit'});
const hoy=()=>new Date().toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
const saludo=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
const movil=()=>S.vista==='celular';
const B=()=>S.bucle?' bucle':'';
let timers=[];const luego=(f,ms)=>timers.push(setTimeout(f,T(ms)));
const limpiar=()=>{timers.forEach(clearTimeout);timers=[]};
/* monto con el que se abre: lo que eligió en el formulario */
const montoApertura=()=>S.fondo&&S.op==='igual'?D.fondo:(parseFloat(S.monto.replace(',','.'))||0);

const MAQ={
  A:{nombre:'A · Vitrina',idea:'El POS se empaña como un vidrio de vitrina y una tarjeta de papel dice qué pasa y qué hacer. Es la más sobria de las tres: crema sobre crema, sin oscurecer la tienda.',
     mov:['El vidrio se empaña en 0,9 s (desenfoque 0 → 18 px) y una luz suave se abre detrás de la tarjeta.','La caja registradora y su candado se dibujan solos, trazo a trazo.','El hilo taupe se traza a los lados de «Caja cerrada»; el título sube palabra por palabra; la cifra del cajón cuenta de S/ 0 a S/ 200.','Al tocar «Abrir caja», <b>la misma tarjeta se transforma en el formulario</b> (crece hasta su nuevo alto, sin otra ventana encima).','Al confirmar, el candado se abre y se pone verde, el vidrio se aclara y el catálogo entra en cascada con el cursor listo en el buscador.'],
     bucle:'un halo rojo muy tenue que respira detrás del candado, el punto rojo de «Caja cerrada» que late y un brillo que cruza el botón cada 6 s.'},
  B:{nombre:'B · Persiana',idea:'La metáfora de la tienda física: baja una persiana oscura sobre el POS y se cuelga un cartel «Cerrado», como en la puerta de la boutique. Se entiende sin leer una palabra.',
     mov:['La persiana baja en 1 s sobre el POS desenfocado (oscuro, desenfoque 12 px), con su barra y su manija al pie.','El cartel cae colgado de su clavo y se mece hasta quedar quieto.','Debajo entran el texto y el botón, en crema sobre la persiana.','Al tocar «Abrir caja» sube la hoja estándar de la casa (la de hoy) para contar el cajón.','Al confirmar, <b>el cartel gira y dice «Abierto»</b>, la persiana sube llevándose el cartel y la tienda aparece nítida.'],
     bucle:'un reflejo de luz que barre la persiana cada 8 s, el cartel que se mece apenas (±0,9°) y el punto rojo que late.'},
  C:{nombre:'C · Pulso',idea:'Sin tarjeta: el texto grande flota sobre el POS empañado y un solo botón redondo late en el centro. Abajo, los tres pasos del día con la guía de foco («Sigue aquí» en el que toca, ADR-0284).',
     mov:['El POS se empaña con una viñeta (más claro al centro, desenfoque 22 px).','«La caja está cerrada» aparece letra por letra, de borroso a nítido.','El botón redondo crece y de él salen ondas, como un sonar.','Al tocarlo, <b>el formulario nace del propio botón</b> y crece hasta ser la hoja; el paso 1 queda en verde y el «Sigue aquí» pasa a «Cuenta el cajón».','Al confirmar, la hoja vuelve al botón, que se pone verde con su visto, y <b>el POS reaparece desde el botón hacia afuera, como un iris</b>.'],
     bucle:'las ondas que salen del botón (una cada 1,1 s) y el punto rojo que late.'}
};

/* ---------- barra ---------- */
function barra(){
  const seg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button class="${S[k]===v?'on':''}" onclick="cambia('${k}','${v}')">${t}</button>`).join('')}</div>`;

/* ---------- transiciones ---------- */
/* La tarjeta de A cambia de contenido creciendo o encogiendo hasta su nuevo alto. */
function morph(el,html,despues){
  const h1=el.getBoundingClientRect().height;el.style.height=h1+'px';el.classList.add('cambia');
  luego(()=>{el.innerHTML=html;el.classList.remove('cambia');el.style.height='auto';const h2=el.getBoundingClientRect().height;el.style.height=h1+'px';el.offsetHeight;el.style.height=h2+'px';
    luego(()=>{el.style.height='';despues&&despues()},500)},180);
}
function contar(el,a,ms){const t0=performance.now();const paso=t=>{const k=Math.min(1,(t-t0)/T(ms));const e=1-Math.pow(1-k,3);el.textContent=soles(a*e);if(k<1)requestAnimationFrame(paso)};requestAnimationFrame(paso)}
function marcarPaso(n){document.querySelectorAll('.paso').forEach((li,i)=>{li.classList.toggle('hecho',i<n-1);li.classList.toggle('ahora',i===n-1);const e=li.querySelector('.eti-p');e.textContent=i<n-1?'✓ Hecho':i===n-1?'Sigue aquí':''})}
function centroRel(el,capa){const a=el.getBoundingClientRect(),c=capa.getBoundingClientRect();return {x:a.left+a.width/2-c.left,y:a.top+a.height/2-c.top}}
/* C: la hoja nace del botón redondo (y vuelve a él). */
function desdeDisco(hoja,volviendo){
  const d=$('#disco').getBoundingClientRect(),h=hoja.getBoundingClientRect();
  const dx=(d.left+d.width/2)-(h.left+h.width/2),dy=(d.top+d.height/2)-(h.top+h.height/2),s=d.width/h.width;
  const ini={transform:`translate(${dx}px,${dy}px) scale(${s},${d.height/h.height})`,borderRadius:'50%',opacity:.4};
  const fin={transform:'none',borderRadius:movil()?'22px 22px 0 0':'20px',opacity:1};
  return hoja.animate(volviendo?[fin,ini]:[ini,fin],{duration:T(volviendo?420:560),easing:'cubic-bezier(.32,.72,.24,1)',fill:'both'});
}

function abrir(){
  if(S.fase!=='cerrada')return;S.fase='contando';
  const capa=$('.capa');
  if(S.m==='A'){morph($('.tarjeta'),formHTML(),enfocar);return}
  const mc=document.createElement('div');mc.className='modal-capa'+(movil()?' abajo':'');
  mc.innerHTML=`<div class="velo2" onclick="volver()"></div><div class="hoja">${formHTML()}</div>`;
  capa.appendChild(mc);
  if(S.m==='C'){const hoja=$('.hoja',mc);hoja.style.animation='none';desdeDisco(hoja,false);$('#pulso').classList.add('apagado');marcarPaso(2)}
  luego(enfocar,500);
}
function enfocar(){const i=$('#monto');if(i)i.focus({preventScroll:true})}
function volver(){
  if(S.fase!=='contando')return;S.fase='cerrada';
  if(S.m==='A'){morph($('.tarjeta'),tarjetaA(false));return}
  const mc=$('.modal-capa');
  if(S.m==='C'){desdeDisco($('.hoja',mc),true).onfinish=()=>mc.remove();$('#pulso').classList.remove('apagado');marcarPaso(1);return}
  mc.classList.add('sale');luego(()=>mc.remove(),260);
}
function confirmar(){
  if(S.fase!=='contando'||!(montoApertura()>0))return;S.fase='abriendo';
  const capa=$('.capa');
  if(S.m==='A'){
    morph($('.tarjeta'),`<div class="listo">${ilus(false,false)}<h3>Caja abierta</h3><p>${D.sede} · ${hora()} · ${soles(montoApertura())} en el cajón</p></div>`,null);
    luego(()=>{const il=$('.tarjeta .ilus');il&&il.classList.add('abierta')},780);
    luego(()=>{$('.tarjeta').classList.add('sale-t');capa.classList.add('fuera');posListo()},1900);
    luego(fin,2650);return;
  }
  const mc=$('.modal-capa');
  if(S.m==='B'){
    mc.classList.add('sale');luego(()=>mc.remove(),260);
    luego(()=>{$('#cartel').classList.add('vuelta');capa.classList.add('abierto')},300);
    luego(()=>{capa.classList.add('fuera');posListo()},1500);
    luego(fin,2600);return;
  }
  /* C */
  const pulso=$('#pulso'),disco=$('#disco');
  desdeDisco($('.hoja',mc),true).onfinish=()=>mc.remove();
  luego(()=>{pulso.classList.remove('apagado');pulso.querySelectorAll('.onda').forEach(o=>o.remove());disco.classList.add('ok');disco.innerHTML=`<svg class="visto" viewBox="0 0 24 24"><path pathLength="1" d="M20 6 9 17l-5-5"/></svg><span>Abierta</span>`;marcarPaso(3)},380);
  luego(()=>{const c=centroRel(disco,capa),v=$('#velo');v.style.setProperty('--cx',c.x+'px');v.style.setProperty('--cy',c.y+'px');v.classList.add('iris');capa.classList.add('fuera');posListo()},1350);
  luego(fin,2450);
}
/* Al empezar la salida, el POS de atrás ya es el abierto: el catálogo entra en cascada mientras la capa se va. */
function posListo(){S.posAbierta=true;S.vivo=true;const dev=$('#dispositivo');const v=$(movil()?'.sc':'.pos',dev);v.outerHTML=movil()?posMovil():posEscritorio()}
function fin(){
  S.fase='abierta';const m=montoApertura();const c=$('.capa');c&&c.remove();
  /* El aviso sale DESPUÉS de que la capa se fue (ADR-0149: nunca encima de la espera). */
  luego(()=>{const a=document.createElement('div');a.className='aviso';a.innerHTML=`<span class="ok">${ic('check','s')}</span><span><b>Caja abierta con ${soles(m)}</b><small>${D.sede} · ${hora()} · ya puedes vender</small></span>`;$('#dispositivo').appendChild(a);luego(()=>a.classList.add('fuera'),3600);luego(()=>a.remove(),3950)},350);
}
function repetir(){limpiar();S.fase='cerrada';S.vivo=false;S.posAbierta=false;S.op='igual';S.monto='';pinta()}
function cerrarCaja(){limpiar();S.fase='abierta';S.vivo=false;S.posAbierta=false;S.op='igual';S.monto='';pinta();luego(()=>{S.fase='cerrada';const v=$(movil()?'.sc':'.pos',$('#dispositivo'));v.outerHTML=movil()?posMovil():posEscritorio();ponerCapa()},700)}

  <br><b>Igual en las tres:</b> la barra de arriba (menú y sede) queda nítida, para poder cambiar de sede o ir a otra pantalla; todo lo de abajo se desenfoca y no se puede tocar. <kbd>Enter</kbd> abre la caja y <kbd>Esc</kbd> vuelve atrás desde el formulario. El formulario de contar el cajón es el de hoy (ADR-0186): no cambia qué se pide.</div></div>`;

function pinta(){
  barra();
  const esc=$('#esc');esc.className='escena'+(S.bucle?'':' sin-bucle')+(S.rm?' rm':'');
  const dev=movil()
    ?`<div class="tels"><div class="tel"><div class="pn" id="dispositivo"><div class="mtop">${ic('menu','s')} CAYLA<span class="sd">${D.sede.toUpperCase()} ⌄</span></div>${posMovil()}</div></div></div>`
    :`<div class="sx"><div class="desk" id="dispositivo"><div class="top"><span class="marca">${ic('menu','s')} CAYLA</span>${ic('clock','s')} ACTIVIDAD <span class="sede">${D.sede.toUpperCase()} ${ic('down','s')}</span></div>${posEscritorio()}</div></div>`;
  esc.innerHTML=leyenda()+dev;
  if(S.fase!=='abierta')ponerCapa();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S.fase==='cerrada'&&!e.target.closest('.spk')){e.preventDefault();abrir()}
  else if(e.key==='Enter'&&S.fase==='contando'&&e.target.tagName!=='BUTTON'){e.preventDefault();confirmar()}
  else if(e.key==='Escape'&&S.fase==='contando'){volver()}
});
setInterval(()=>document.querySelectorAll('.reloj').forEach(r=>r.textContent=hora()),20000);
pinta();
</script>
</body>
</html>
