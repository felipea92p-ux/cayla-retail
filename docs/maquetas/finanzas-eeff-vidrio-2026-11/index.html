<title>Estados financieros en vidrio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap">
<style>
/* Finanzas ▸ Estados financieros · maqueta de vidrio (2026-11-05). Cifras de ejemplo.
   Composición: un fondo de tela con pliegues (CAYLA es textil) le da al vidrio algo que desviar; encima, una cifra enorme,
   una frase que la interpreta y un solo gráfico. Colores: los tokens del ERP. Movimiento: una vez, sin rebote ni bucle. */
@property --giro{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --crema:#f5f0e8;--papel:#fbf8f2;--hueso:#eae1d2;--sand:#e8e0d0;--control:#96786a;--tinta:#1a1a18;--taupe:#805c4c;--rojo:#b8412d;--rojo-p:#8b2a1f;--rojo-t:#8b2a1f;--verde:#48603f;--ambar:#74501a;
  --s1:color-mix(in srgb,var(--tinta) 76%,var(--taupe));--s2:#805c4c;--s3:#b49c88;--s4:#d8c9b4;--sec:#6f4e40;--pista:rgba(26,26,24,.08);
  --vid:rgba(251,248,242,.5);--vid-fuerte:rgba(251,248,242,.8);--luz:rgba(255,255,255,.95);--luz2:rgba(255,255,255,.42);--sombra:rgba(74,50,34,.2);--oscurece:rgba(74,50,34,.12);
  --t-resp:100ms;--t-cambio:160ms;--t-hoja:260ms;--t-momento:480ms;--esc:.35;--vid-cal:rgba(251,248,242,.88);--blur:16px;--blur-l:9px;--ease:cubic-bezier(.22,.8,.24,1);--letra:"Inter",ui-sans-serif,system-ui,sans-serif;--titulo:"EB Garamond",ui-serif,Georgia,serif;--cuerpo:"DM Sans",ui-sans-serif,system-ui,sans-serif;
}
:root[data-tema="oscuro"]{
  --crema:#1c1a17;--papel:#26241f;--hueso:#33302a;--sand:#403b34;--control:#8d7a6c;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#c95a44;--rojo-t:color-mix(in srgb,#e8806a 62%,#f5f0e8);--verde:#9ccb8d;--ambar:#e0b872;
  --s1:color-mix(in srgb,var(--tinta) 82%,var(--taupe));--s2:#c4a898;--s3:#8d7a6c;--s4:#5d5247;--sec:#d3bcae;--pista:rgba(245,240,232,.1);
  --vid:rgba(34,31,27,.52);--vid-fuerte:rgba(30,27,23,.72);--vid-cal:rgba(30,27,23,.9);--luz:rgba(255,250,240,.62);--luz2:rgba(255,250,240,.14);--sombra:rgba(0,0,0,.5);--oscurece:rgba(0,0,0,.34);color-scheme:dark;
}
:root{--blur:6px;--blur-l:5px;--vid:rgba(251,248,242,.66);--sec:#5d4034}
:root[data-tema="oscuro"]{--vid:rgba(30,27,23,.68);--sec:#dcc6b9}
:root[data-mov="completo"]{--t-resp:200ms;--t-cambio:320ms;--t-hoja:550ms;--t-momento:1000ms;--esc:1}
/* Vidrio que aguanta: sin transparencia o con más contraste. También lo activan los ajustes del sistema. */
:root[data-vidrio="solido"],:root[data-vidrio="contraste"]{--vid:var(--papel);--vid-fuerte:var(--papel);--vid-cal:var(--papel)}
:root[data-vidrio="solido"] .tela canvas{opacity:.28!important}
:root[data-vidrio="contraste"] .tela canvas{opacity:0!important}
:root[data-vidrio="solido"] :is(.vidrio,.cal,.tip,.globito),:root[data-vidrio="contraste"] :is(.vidrio,.cal,.tip,.globito){-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root[data-vidrio="contraste"]{--sec:var(--tinta);--taupe:var(--tinta);--control:var(--tinta);--pista:color-mix(in srgb,var(--tinta) 10%,transparent);--luz2:transparent}
:root[data-vidrio="contraste"] :is(.vidrio,.pozo,.opciones,.btn,.btn-p,.fecha-b,.op-c.activa){box-shadow:inset 0 0 0 1.5px var(--tinta)!important}
:root[data-vidrio="contraste"] .vidrio::before,:root[data-vidrio="contraste"] .vidrio::after{display:none}
/* Tamaños para el dedo: también los activa una pantalla táctil */
:root[data-tacto="dedo"] :is(.redondo,.cerrar,.enviar){width:44px;height:44px}
:root[data-tacto="dedo"] :is(.btn,.seg-p button,.q-falta button,.op-c,.cal-c .acc-c button,.tb-acc button){min-height:44px}
:root[data-tacto="dedo"] .dia{height:44px}:root[data-tacto="dedo"] .tubo{height:48px}
:root[data-tacto="dedo"] .tb tr{--fila:52px}:root[data-tacto="dedo"] .tb-chk{width:44px;height:44px}
:root[data-zonas] :is(#campos,#vista,#cal,.fecha,.probar,.pestanas) :is(button:not(:disabled),input:not([type=file]),textarea,label.subir){outline:1.5px dashed var(--acento-z);outline-offset:0}
:root{--acento-z:#b8412d}
*{box-sizing:border-box}
html{height:100%}
body{background:var(--crema);color:var(--tinta);font:400 15px/1.5 var(--cuerpo);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 124px;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
h1,h2,p{margin:0}
.tela{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--crema)}
.tela canvas{position:absolute;left:-8%;top:-8%;width:116%;height:116%;display:block;transition:transform 1.5s var(--ease),opacity .6s ease;will-change:transform}
.marco{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.riel{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:24px}
.riel span{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--sec)}
.riel span.activo{color:var(--tinta);background:var(--luz2);box-shadow:inset 0 1px 0 var(--luz2)}
.riel svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.columna{position:relative;display:flex;flex-direction:column;gap:16px;min-width:0}

/* El vidrio: una sola receta */
.vidrio{position:relative;isolation:isolate;background:linear-gradient(135deg,var(--luz2),transparent 34%),var(--vid);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.35);backdrop-filter:blur(var(--blur)) saturate(1.35);border-radius:30px;box-shadow:0 26px 60px -22px var(--sombra),0 2px 6px var(--oscurece),inset 0 1px 0 var(--luz2),inset 0 -14px 26px -18px var(--oscurece)}
.vidrio::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--giro),var(--luz) 0deg,var(--luz2) 70deg,transparent 150deg,var(--luz2) 210deg,var(--luz) 300deg,var(--luz) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:filo calc(var(--t-momento)*1.6) var(--ease) both}
.vidrio::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:var(--brillo,0);transition:opacity var(--t-cambio) ease;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),var(--luz2),transparent 70%)}
@keyframes filo{from{--giro:-140deg}to{--giro:30deg}}
.entra{animation:subir var(--t-momento) var(--ease) both;animation-delay:calc(var(--i,0)*70ms*var(--esc))}
@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* Cabecera */
.cabecera{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:16px 24px;border-radius:26px;z-index:3}
.sede{display:flex;align-items:center;gap:10px;color:var(--sec);font-size:14px}
.sede i{width:24px;height:1px;background:var(--sec);display:block}
h1{font:400 clamp(32px,3.2vw,46px)/1.06 var(--titulo);margin-top:2px}
.fecha[hidden]{display:none}
.fecha{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--pista);box-shadow:inset 0 2px 6px var(--oscurece),inset 0 -1px 0 var(--luz2)}
.fecha-b{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;border-radius:999px;text-align:left;background:linear-gradient(180deg,var(--luz2),transparent 72%),color-mix(in srgb,var(--vid-fuerte) 60%,transparent);box-shadow:inset 0 1px 0 var(--luz),inset 0 -1px 0 var(--oscurece),0 8px 18px -10px var(--sombra);transition:transform var(--t-resp) var(--ease),box-shadow var(--t-resp)}
@media (hover:hover){.fecha-b:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--luz),inset 0 -1px 0 var(--oscurece),inset 0 0 0 1px var(--luz),0 14px 26px -12px var(--sombra)}}
.fecha-b:active{transform:scale(.98)}
.fecha-b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fecha-b .chv{width:16px;height:16px;stroke-width:2;transition:transform var(--t-hoja) var(--ease)}
.fecha-b[aria-expanded="true"] .chv{transform:rotate(180deg)}
.fecha-txt{display:flex;flex-direction:column;min-width:172px;line-height:1.2}
.fecha-txt b{font-family:var(--letra);font-weight:600;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.fecha-txt small{font-size:14px;color:var(--sec);white-space:nowrap}
/* El calendario de vidrio */
.cal{position:absolute;right:0;z-index:25;width:min(868px,100%);display:grid;grid-template-columns:186px minmax(0,1fr);gap:16px 20px;padding:22px 24px 20px;border-radius:30px;--vid:var(--vid-cal);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 40px 80px -30px var(--sombra),0 4px 12px var(--oscurece),inset 0 1px 0 var(--luz);transform-origin:calc(100% - 180px) 0;animation:calEntra var(--t-hoja) var(--ease) both}
@keyframes calEntra{from{opacity:0;transform:translateY(-10px) scale(.975)}to{opacity:1;transform:none}}
.cal-cab{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;padding-right:44px;position:relative}
.cal-cab>div{min-width:0;flex:0 1 auto}
.cal-cab h2{font:500 clamp(24px,2.6vw,34px)/1.1 var(--letra);letter-spacing:-.035em;margin-top:4px}
.cal-cab .chip{margin:0 0 3px}
.cal-cab .cerrar{top:-4px;right:-6px}
.cal-paso{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sec);transition:color var(--t-cambio)}
.cal-paso::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--control)}
.cal-paso.sigue{color:var(--rojo-t);font-weight:500}.cal-paso.sigue::before{background:var(--rojo-t)}
.cal-atajos{display:flex;flex-direction:column;gap:3px;padding-right:14px;border-right:1px solid var(--pista)}
.ataj{display:grid;text-align:left;padding:9px 12px;border-radius:15px;transition:background var(--t-resp),box-shadow var(--t-resp),transform var(--t-resp) var(--ease);animation:subir var(--t-hoja) var(--ease) both;animation-delay:calc(var(--i)*38ms*var(--esc) + 80ms*var(--esc))}
.ataj b{font-weight:500;font-size:15px;line-height:1.25}.ataj small{font-size:14px;color:var(--sec);line-height:1.25}
@media (hover:hover){.ataj:hover{background:var(--luz2)}}
.ataj[aria-pressed="true"]{background:linear-gradient(180deg,var(--luz2),transparent 80%),color-mix(in srgb,var(--vid-fuerte) 60%,transparent);box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),0 8px 16px -10px var(--sombra)}
.cal-cuerpo{position:relative;min-width:0;display:flex;flex-direction:column;gap:10px}
.cal-hilo-t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:14px}.cal-hilo-t span{font-weight:500}.cal-hilo-t small{font-size:14px;color:var(--sec)}
.cal-hilo{position:relative;display:grid;grid-template-columns:repeat(13,minmax(34px,1fr));gap:3px;padding:4px;border-radius:18px;background:var(--pista);box-shadow:inset 0 2px 6px var(--oscurece);touch-action:pan-x;overflow-x:auto;scrollbar-width:none}
.mh{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:66px;padding:5px 1px 4px;border-radius:13px;font-size:13px;color:var(--sec);user-select:none;transition:background var(--t-resp),color var(--t-resp),box-shadow var(--t-resp)}
.mh u{display:block;width:62%;max-width:20px;min-height:3px;height:var(--h);border-radius:6px 6px 3px 3px;background:var(--f);opacity:.62;text-decoration:none;transform-origin:bottom;animation:brota var(--t-momento) var(--ease) both;animation-delay:calc(var(--i)*28ms*var(--esc) + 100ms*var(--esc));transition:opacity var(--t-resp)}
.mh.anio::before{content:attr(data-a);position:absolute;top:3px;left:4px;font-size:11px;color:var(--sec)}
@media (hover:hover){.mh:hover{background:var(--luz2);color:var(--tinta)}.mh:hover u{opacity:1}}
.mh.en{background:linear-gradient(180deg,var(--luz2),transparent 90%),color-mix(in srgb,var(--vid-fuerte) 70%,transparent);color:var(--tinta);font-weight:600;box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2)}
.mh.en u{opacity:1}
.mh.parte{box-shadow:inset 0 0 0 1px var(--control);color:var(--tinta)}
.cal-nav{position:absolute;right:0;display:flex;gap:2px;z-index:2}
.cal-nav .redondo{width:36px;height:36px}
.cal-meses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.cm-t{height:36px;display:flex;align-items:center;font-weight:500;font-size:15px}
.cm-s,.cm-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cm-s span{text-align:center;font-size:13px;color:var(--sec);padding-bottom:4px}
.dia{position:relative;height:36px;font:500 14px var(--letra);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tinta);isolation:isolate;animation:calDia var(--t-hoja) var(--ease) both;animation-delay:calc(var(--i,0)*7ms*var(--esc))}
@keyframes calDia{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dia::before{content:"";position:absolute;inset:3px 0;z-index:-2;background:transparent;transition:background var(--t-resp)}
.dia::after{content:"";position:absolute;inset:2px 3px;z-index:-1;border-radius:13px;transition:background var(--t-resp),box-shadow var(--t-resp)}
.dia i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--verde);opacity:calc(var(--n)*.9)}
.dia:disabled{color:var(--sec);opacity:.34;cursor:default}.dia:disabled i{display:none}
@media (hover:hover){.dia:not(:disabled):not(.ini):not(.fin):not(.pend):hover::after{background:var(--luz2);box-shadow:inset 0 0 0 1px var(--luz)}}
.dia.ran::before{background:color-mix(in srgb,var(--tinta) 9%,transparent)}
.dia.ini::before{left:50%;border-radius:0}.dia.fin::before{right:50%}.dia.ini.fin::before{display:none}
.dia.pl::before{border-radius:13px 0 0 13px}.dia.ul::before{border-radius:0 13px 13px 0}
.dia.ini,.dia.fin,.dia.pend{color:var(--crema)}
.dia.ini::after,.dia.fin::after,.dia.pend::after{background:linear-gradient(180deg,color-mix(in srgb,var(--tinta) 86%,var(--taupe)),var(--tinta));box-shadow:inset 0 1px 0 var(--luz2),0 8px 14px -8px var(--sombra)}
.dia.ini i,.dia.fin i,.dia.pend i{background:var(--crema)}
.dia.hoy:not(.ini):not(.fin):not(.pend)::after{box-shadow:inset 0 0 0 1.5px var(--rojo-t)}
.cal-ley{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--sec)}
.ley-p,.ley-h{display:inline-flex;align-items:center;gap:4px}
.ley-p i{width:5px;height:5px;border-radius:50%;background:var(--verde);opacity:var(--n)}.ley-p i:last-of-type{margin-right:4px}
.ley-h i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--rojo-t);margin-right:3px}
.redondo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background var(--t-resp),transform var(--t-resp) var(--ease)}
.redondo svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.redondo:disabled{opacity:.32;cursor:default}
.redondo[hidden],.guia[hidden],.punto[hidden]{display:none}
@media (hover:hover){.redondo:not(:disabled):hover{background:var(--luz2)}}
.redondo:not(:disabled):active{transform:scale(.92)}

/* Pestañas con la gota */
.pestanas{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:999px;z-index:2}
.pestanas button{position:relative;z-index:1;min-height:48px;padding:6px 10px;border-radius:999px;font-weight:500;font-size:15px;color:var(--sec);transition:color var(--t-cambio)}
.pestanas button[aria-selected="true"]{color:var(--tinta)}
.pestanas .c{display:none}
.gota{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--luz2);box-shadow:inset 0 1px 0 var(--luz),inset 0 -1px 0 var(--oscurece),0 8px 18px -8px var(--sombra);transition:left var(--t-hoja) var(--ease),width var(--t-hoja) var(--ease),transform var(--t-hoja) var(--ease)}

/* La cifra */
.cifra{font-family:var(--letra);font-weight:500;letter-spacing:-.045em;line-height:1.02;display:flex;align-items:baseline;flex-wrap:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.cifra .moneda{font-size:.42em;letter-spacing:-.02em;margin-right:.28em;color:var(--sec);font-weight:500}
.cifra .signo{font-size:.5em;margin-right:.12em;color:var(--sec)}
.cifra.mal .rueda,.cifra.mal .moneda,.cifra.mal .signo{color:var(--rojo)}
.rueda{display:inline-flex}
.dig{display:inline-block;height:1.02em;overflow:hidden}
.dig>span{display:block;transition:transform var(--t-momento) var(--ease);transition-delay:calc(var(--d,0ms)*var(--esc))}
.dig>span>i{display:block;height:1.02em;font-style:normal}
.sep{display:inline-block}

/* El estado */
.heroe{padding:28px 32px 0;min-height:clamp(420px,56vh,560px);display:flex;flex-direction:column;overflow:hidden}
.heroe-top{display:flex;align-items:center;gap:12px}
.heroe .nombre{font-weight:500;font-size:16px;color:var(--sec)}
.heroe .cifra{font-size:clamp(68px,9.4vw,148px);margin-top:10px}
.heroe .frase{font-size:clamp(18px,1.7vw,23px);line-height:1.3;max-width:34ch;margin-top:10px;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:7px;width:fit-content;margin-top:12px;padding:5px 12px;border-radius:999px;font-weight:500;font-size:14px;background:var(--pista)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.bien{color:var(--verde)}.chip.mal{color:var(--rojo-t)}
.grafico{flex:1;min-height:210px;margin:16px -32px 0;position:relative}
.grafico.con-aire{margin:16px 0 24px}

/* Línea y área */
.linea{position:absolute;inset:0 0 34px}
.linea svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:dibuja var(--t-momento) var(--ease) both}
@keyframes dibuja{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.meses{position:absolute;left:0;right:0;bottom:6px;height:24px;display:block}
.meses span{position:absolute;top:0;transform:translateX(-50%);font-size:13px;color:var(--sec);transition:color var(--t-cambio)}
.meses span.on{color:var(--tinta);font-weight:600}
.cero{position:absolute;left:32px;right:32px;height:0;border-top:1px dashed var(--control);opacity:.7}
.cero small{position:absolute;left:0;top:-20px;font-size:13px;color:var(--sec)}
.banda{position:absolute;top:0;bottom:0;display:block;border-radius:14px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--verde) 16%,transparent));box-shadow:inset 1px 0 0 var(--luz),inset -1px 0 0 var(--luz);transition:left var(--t-momento) var(--ease),width var(--t-momento) var(--ease)}
.guia{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(transparent,var(--control) 25%,var(--control));opacity:.6;transition:left var(--t-hoja) var(--ease)}
.punto{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 5px color-mix(in srgb,var(--verde) 24%,transparent),0 0 0 1.5px var(--papel) inset;transition:left var(--t-hoja) var(--ease),top var(--t-hoja) var(--ease),background var(--t-cambio)}
.punto.mal{background:var(--rojo);box-shadow:0 0 0 5px color-mix(in srgb,var(--rojo) 24%,transparent)}
.globito{position:absolute;transform:translate(-50%,calc(-100% - 16px));padding:7px 13px;border-radius:14px;white-space:nowrap;font-size:14px;line-height:1.25;background:var(--vid-fuerte);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 var(--luz),0 10px 22px -10px var(--sombra);transition:left var(--t-hoja) var(--ease),top var(--t-hoja) var(--ease);pointer-events:none;z-index:2}
.globito b{font-family:var(--letra);font-weight:600;letter-spacing:-.02em;display:block;font-size:16px}
.globito span{color:var(--sec)}
.linea-zona{position:absolute;inset:0;touch-action:pan-y}
.linea-zona.mouse .guia,.linea-zona.mouse .punto,.linea-zona.mouse .globito{transition-duration:var(--t-resp)}

/* Cascada de columnas */
.cascada{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,2vw,28px);padding:0 4px}
.cc{position:relative;display:flex;flex-direction:column;min-width:0;cursor:pointer;background:none;padding:0;text-align:center;border-radius:14px}
.cc.encendido .col{box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1.5px var(--luz),0 14px 26px -10px color-mix(in srgb,var(--c) 60%,var(--sombra))}
.cc.encendido .nom{color:var(--tinta);font-weight:500}
.cc .plano{position:relative;flex:1}
.cc .col{position:absolute;left:50%;width:min(100%,148px);margin-left:calc(min(100%,148px)/-2);border-radius:12px;min-height:4px;transition:bottom var(--t-momento) var(--ease),height var(--t-momento) var(--ease),background var(--t-hoja);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,var(--luz)),var(--c));box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),0 10px 18px -12px var(--sombra);animation:brota var(--t-momento) var(--ease) both;animation-delay:calc(var(--i,0)*90ms*var(--esc));transform-origin:bottom}
@keyframes brota{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.cc .val{position:absolute;left:0;right:0;text-align:center;font-family:var(--letra);font-weight:600;letter-spacing:-.02em;font-size:clamp(13px,1.2vw,17px);transition:bottom var(--t-momento) var(--ease);white-space:nowrap}
.cc .nom{min-height:40px;padding-top:8px;text-align:center;font-size:14px;line-height:1.2;color:var(--sec)}
.cc .enlace{position:absolute;left:calc(50% + min(100%,148px)/2);width:calc(100% - min(100%,148px) + clamp(8px,2vw,28px));border-top:1px dashed var(--control);opacity:.8;transition:bottom var(--t-momento) var(--ease)}

/* Tubos de vidrio */
.tubos{display:flex;flex-direction:column;gap:22px;height:100%;justify-content:center}
.fila-tubo .rotulo{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:500}
.fila-tubo .rotulo b{font-family:var(--letra);font-weight:600;letter-spacing:-.02em}
.tubo{display:flex;gap:2px;height:40px;padding:3px;border-radius:999px;background:var(--pista);box-shadow:inset 0 2px 6px var(--oscurece),inset 0 -1px 0 var(--luz2)}
.seg{position:relative;display:block;min-width:4px;height:100%;padding:0;background:var(--c);flex:1 1 0;cursor:pointer;animation:llena var(--t-momento) var(--ease) both;transition:flex-grow var(--t-momento) var(--ease),opacity var(--t-cambio) ease,filter var(--t-cambio) ease,transform var(--t-cambio) var(--ease),box-shadow var(--t-cambio) ease;border-radius:5px}
.seg:first-child{border-radius:999px 5px 5px 999px}.seg:last-child{border-radius:5px 999px 999px 5px}.seg:only-child{border-radius:999px}
.seg::after{content:"";position:absolute;inset:2px 3px auto;height:40%;border-radius:999px;background:linear-gradient(var(--luz2),transparent);pointer-events:none}
.seg.hueco{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--pista) 6px 8px);box-shadow:inset 0 0 0 1.5px var(--verde)}
.seg.hueco::after{display:none}
@keyframes llena{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-8px -8px -8px -8px)}}
[data-k]{transition:opacity var(--t-cambio) ease,filter var(--t-cambio) ease,background var(--t-cambio) ease,box-shadow var(--t-cambio) ease,transform var(--t-cambio) var(--ease)}
.apagado{opacity:.26;filter:saturate(.5)}
[data-foco="elegido"] .apagado{opacity:.55;filter:saturate(.75)}
.seg.encendido{transform:scaleY(1.2);z-index:2;box-shadow:0 0 0 1.5px var(--luz),0 8px 20px -6px color-mix(in srgb,var(--c) 70%,transparent)}
.seg.hueco.encendido{box-shadow:inset 0 0 0 1.5px var(--verde),0 0 0 1.5px var(--luz)}
.tip{position:fixed;z-index:30;transform:translate(-50%,calc(-100% - 12px));padding:7px 13px;border-radius:14px;white-space:nowrap;font-size:14px;line-height:1.25;background:var(--vid-fuerte);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--luz),0 12px 24px -10px var(--sombra);pointer-events:none;transition:left var(--t-resp) var(--ease),top var(--t-resp) var(--ease),opacity var(--t-resp)}
.tip b{font-family:var(--letra);font-weight:600;letter-spacing:-.02em;display:block;font-size:16px}
.tip span{color:var(--sec)}

/* Lo de abajo */
.debajo{padding:24px 32px 26px}
.titulo-d{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.titulo-d h2{font:500 16px var(--cuerpo)}
.titulo-d small{font-size:14px;color:var(--sec)}
.cats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;margin-top:12px}
.cat{display:grid;grid-template-columns:12px minmax(0,1fr);gap:0 9px;align-items:baseline;text-align:left;width:100%;padding:10px 12px;border-radius:18px;position:relative}
.cat i{width:12px;height:12px;border-radius:4px;background:var(--c);align-self:center;box-shadow:inset 0 1px 0 var(--luz2)}
.cat>span{color:var(--sec);font-size:14px}
.cat b{grid-column:2;font-family:var(--letra);font-weight:600;font-size:clamp(19px,1.6vw,24px);letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.cat small{grid-column:2;color:var(--sec);font-size:14px}
.cat b.bien{color:var(--verde)}.cat b.mal{color:var(--rojo-t)}
.cat.encendido{background:linear-gradient(180deg,var(--luz2),transparent 70%),color-mix(in srgb,var(--c) 10%,transparent);box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),0 10px 20px -14px var(--sombra)}

/* El detalle, justo debajo */
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-hoja) var(--ease),margin var(--t-hoja) var(--ease)}
.det.abierto{grid-template-rows:1fr;margin-top:14px}
.det>div{min-height:0;overflow:hidden}
.det.abierto>div{padding-top:10px;margin-top:-10px}
.det:not(.abierto) .pico{opacity:0}
.det-vidrio{position:relative;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.7fr) minmax(170px,.7fr);gap:20px 36px;padding:24px 26px;border-radius:26px;background:radial-gradient(90% 130% at 8% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 62%),linear-gradient(180deg,var(--luz2),transparent 34%);box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),inset 0 -18px 28px -24px var(--oscurece);transition:background var(--t-hoja) ease}
.pico{position:absolute;top:-6px;left:var(--x,40px);width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);border-radius:3px 0 0 0;background:color-mix(in srgb,var(--c) 22%,var(--vid-fuerte));box-shadow:inset 1px 1px 0 var(--luz);transition:left var(--t-hoja) var(--ease),background var(--t-hoja)}
.det-nombre{font-weight:500;font-size:16px;color:var(--sec);display:flex;align-items:center;gap:8px}
.det-nombre i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.det .cifra{font-size:clamp(40px,4.4vw,64px);margin-top:8px}
.det-que{margin-top:8px;font-size:15px;line-height:1.4;max-width:34ch}
.det .chip{margin-top:10px}
.cerrar{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--luz2),transparent 70%);box-shadow:inset 0 1px 0 var(--luz),0 6px 14px -8px var(--sombra);z-index:2;transition:transform var(--t-resp) var(--ease)}
.cerrar svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media (hover:hover){.cerrar:hover{transform:rotate(90deg)}}
.filas-d{display:flex;flex-direction:column;gap:10px;min-width:0;padding-right:28px}
.fd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;animation:subir var(--t-hoja) var(--ease) both;animation-delay:calc(var(--i,0)*55ms*var(--esc));transition:opacity var(--t-resp) ease}
.fd span{font-size:15px}.fd b{font-family:var(--letra);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.fd b.mal{color:var(--rojo-t)}.fd b.bien{color:var(--verde)}
.fd u{grid-column:1/-1;display:block;height:10px;border-radius:999px;background:var(--pista);box-shadow:inset 0 1px 3px var(--oscurece);text-decoration:none;overflow:hidden}
.fd u i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,color-mix(in srgb,var(--f) 86%,var(--luz)),var(--f));animation:llena var(--t-momento) var(--ease) both;animation-delay:calc(var(--i)*55ms*var(--esc) + 120ms*var(--esc))}
.fd small{grid-column:1/-1;font-size:14px;color:var(--ambar)}
@media (hover:hover){.filas-d:hover .fd:not(:hover){opacity:.42}}
.meses-d{display:flex;flex-direction:column;min-width:0}
.meses-d>span{font-size:14px;color:var(--sec)}
.mc{flex:1;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px;min-height:120px;margin-top:8px}
.mc div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.mc p{width:100%;max-width:48px;height:var(--h);min-height:4px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--f) 84%,var(--luz)),var(--f));box-shadow:inset 0 1px 0 var(--luz2);opacity:.4;transition:height var(--t-momento) var(--ease),opacity var(--t-cambio),background var(--t-cambio)}
.mc .sel p{opacity:1}
.mc small{font-size:13px;color:var(--sec)}.mc .sel small{color:var(--tinta);font-weight:600}
.mc em{font:600 13px var(--letra);font-style:normal;letter-spacing:-.02em;white-space:nowrap}

.nota-fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--pista)}
.nota{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.35;flex:1 1 340px;min-width:0}
.nota svg{flex:none;width:20px;height:20px;margin-top:2px;fill:none;stroke:var(--sec);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* El campo de texto: un pozo de vidrio que sube al escribir */
.pozo{--tono:var(--rojo-t);position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:end;padding:12px 12px 13px 20px;border-radius:24px;cursor:text;background:linear-gradient(180deg,var(--oscurece),transparent 42%),var(--pista);box-shadow:inset 0 2px 7px var(--oscurece),inset 0 -1px 0 var(--luz2);transition:background var(--t-cambio) ease,box-shadow var(--t-cambio) ease,transform var(--t-cambio) var(--ease)}
.pozo::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(260px circle at var(--mx,20%) var(--my,0%),var(--luz2),transparent 72%);transition:opacity var(--t-cambio) ease}
@media (hover:hover){.pozo:hover::before{opacity:1}}
.pozo:focus-within{transform:translateY(-1px);background:linear-gradient(180deg,var(--luz2),transparent 56%),var(--vid-fuerte);box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),0 20px 36px -22px var(--sombra),0 0 0 4px color-mix(in srgb,var(--tono) 13%,transparent)}
.pozo-hilo{position:absolute;left:22px;right:22px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--tono) 18%,var(--tono) 82%,transparent);transform:scaleX(0);opacity:0;transition:transform var(--t-hoja) var(--ease),opacity var(--t-resp) ease,background var(--t-cambio)}
.pozo:focus-within .pozo-hilo{transform:scaleX(1);opacity:1}
.pozo.bien{--tono:var(--verde)}
.pozo.pasado{--tono:var(--rojo-t);box-shadow:inset 0 2px 7px var(--oscurece),inset 0 0 0 1.5px var(--rojo-t)}
.pozo.pasado .pozo-hilo{transform:scaleX(1);opacity:1}
.pozo-et{grid-column:1;display:flex;flex-wrap:wrap;gap:0 7px;font-size:14px;font-weight:500;color:var(--sec);cursor:text;transition:color var(--t-resp)}
.pozo-et small{font-size:14px;font-weight:400}
.pozo:focus-within .pozo-et{color:var(--tinta)}
.pozo textarea{grid-column:1;display:block;width:100%;min-width:0;min-height:26px;max-height:168px;padding:0;margin:0;border:0;outline:0;resize:none;background:none;overflow:auto;field-sizing:content;font:400 17px/1.45 var(--cuerpo);letter-spacing:-.005em;color:var(--tinta);caret-color:var(--tono);scrollbar-width:thin}
.pozo textarea:focus-visible{outline:0}
.pozo textarea::placeholder{color:var(--sec);opacity:1;transition:color var(--t-resp)}
.pozo-acc{grid-column:2;grid-row:1/span 2;display:flex;align-items:center;gap:9px;align-self:end}
.aro{position:relative;display:grid;place-items:center;width:30px;height:30px;opacity:0;transform:scale(.8);transition:opacity var(--t-resp) ease,transform var(--t-cambio) var(--ease)}
.pozo.con-texto .aro{opacity:1;transform:none}
.aro svg{width:30px;height:30px;transform:rotate(-90deg)}
.aro circle{fill:none;stroke-width:2.5}.aro .fondo{stroke:var(--pista)}
.aro .lleno{stroke:var(--aro,var(--verde));stroke-linecap:round;stroke-dasharray:75.4;stroke-dashoffset:var(--off,75.4);transition:stroke-dashoffset var(--t-cambio) var(--ease),stroke var(--t-cambio)}
.aro b{position:absolute;font:600 12px var(--letra);letter-spacing:-.03em;color:var(--aro,var(--tinta));font-variant-numeric:tabular-nums}
.enviar{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;color:var(--sec);background:var(--pista);transform:scale(.9);transition:transform var(--t-cambio) var(--ease),background var(--t-resp) ease,color var(--t-resp) ease,box-shadow var(--t-resp) ease}
.enviar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t-cambio) var(--ease)}
.enviar:disabled{cursor:default;opacity:.6}
.enviar:not(:disabled){transform:none;color:var(--crema);background:linear-gradient(180deg,color-mix(in srgb,var(--tinta) 84%,var(--taupe)),var(--tinta));box-shadow:inset 0 1px 0 var(--luz2),0 10px 18px -9px var(--sombra)}
@media (hover:hover){.enviar:not(:disabled):hover{background:linear-gradient(180deg,var(--rojo-p),color-mix(in srgb,var(--rojo-p) 82%,var(--tinta)));color:var(--crema)}.enviar:not(:disabled):hover svg{transform:translateY(-2px)}}
.enviar:not(:disabled):active{transform:scale(.93)}
.ayuda{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:21px;padding-left:20px;font-size:14px;color:var(--sec);transition:color var(--t-resp)}
.ayuda.mal{color:var(--rojo-t);font-weight:500}.ayuda.bien{color:var(--verde);font-weight:500}
.ayuda svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;animation:visto var(--t-hoja) var(--ease) both}
@keyframes visto{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.ayuda kbd{font:500 13px var(--letra);padding:1px 7px;border-radius:7px;background:var(--pista);box-shadow:inset 0 -1px 0 var(--oscurece)}
.ayuda .deshacer{font-weight:500;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}

/* Los campos de Finanzas */
.pozo{min-height:68px}
.pozo input,.pozo textarea{grid-column:1;display:block;width:100%;min-width:0;padding:0;margin:0;border:0;outline:0;background:none;font:400 17px/1.45 var(--cuerpo);letter-spacing:-.005em;color:var(--tinta);caret-color:var(--tono)}
.pozo input:focus-visible,.pozo textarea:focus-visible{outline:0}
.pozo input::placeholder{color:var(--sec);opacity:1}
.pozo.is-foco{transform:translateY(-1px);background:linear-gradient(180deg,var(--luz2),transparent 56%),var(--vid-fuerte);box-shadow:inset 0 1px 0 var(--luz),inset 0 0 0 1px var(--luz2),0 20px 36px -22px var(--sombra),0 0 0 4px color-mix(in srgb,var(--tono) 13%,transparent)}
.pozo.is-foco .pozo-hilo{transform:scaleX(1);opacity:1}
.pozo.bien .pozo-hilo{transform:scaleX(1);opacity:.85}
.pozo.mal{--tono:var(--rojo-t);box-shadow:inset 0 2px 7px var(--oscurece),inset 0 0 0 1.5px var(--rojo-t)}.pozo.mal .pozo-hilo{transform:scaleX(1);opacity:1}
.pozo.ambar{--tono:var(--ambar);box-shadow:inset 0 2px 7px var(--oscurece),inset 0 0 0 1.5px var(--ambar)}
.pozo.apag{opacity:.55;cursor:not-allowed}.pozo.apag input{cursor:not-allowed}
.pozo.consulta .pozo-hilo{left:0;right:0;transform:none;opacity:1;background:linear-gradient(90deg,transparent 0,var(--tono) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat;animation:barre 1s linear infinite}
@keyframes barre{from{background-position:-40% 0}to{background-position:140% 0}}
.pozo-der{grid-column:2;grid-row:1/span 2;align-self:center;display:flex;align-items:center;gap:8px;color:var(--sec);font-size:14px;white-space:nowrap}
.pozo-der svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pozo-der .visto{color:var(--verde);stroke-dasharray:24;animation:visto var(--t-hoja) var(--ease) both}
.pozo-der .alerta{color:var(--rojo-t)}
.pozo-et small{color:var(--sec)}
.pie-c{display:flex;flex-wrap:wrap;gap:3px 8px;min-height:0;padding:0 0 0 20px;font-size:14px;color:var(--sec);line-height:1.35}
.pie-c:empty{display:none}.pie-c.mal{color:var(--rojo-t);font-weight:500}.pie-c.ambar{color:var(--ambar);font-weight:500}.pie-c.bien{color:var(--verde);font-weight:500}
@keyframes visto{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
/* Monto: la cifra manda */
.monto{min-height:112px;padding:14px 18px 16px 22px;align-items:center}
.monto .fila-m{grid-column:1;display:flex;align-items:baseline;gap:12px;min-width:0}
.monto .fila-m span{font:500 clamp(24px,2.6vw,32px)/1 var(--letra);color:var(--sec);letter-spacing:-.02em}
.monto input{font:500 clamp(42px,5.2vw,68px)/1.05 var(--letra);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.monto input::placeholder{color:color-mix(in srgb,var(--sec) 80%,transparent)}
/* Bloque con su guía */
.form-g{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.95fr);gap:16px;align-items:start}
.hoja-g{padding:26px 28px 28px;display:flex;flex-direction:column;gap:6px}
.bloque{position:relative;display:flex;flex-direction:column;gap:9px;padding:14px;margin-inline:-14px;border-radius:26px;transition:background var(--t-hoja) ease,box-shadow var(--t-hoja) ease}
.bloque.sigue{background:color-mix(in srgb,var(--rojo-t) 6%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rojo-t) 42%,transparent)}
.bloque.resalta{animation:resalta var(--t-momento) var(--ease)}
@keyframes resalta{30%{background:color-mix(in srgb,var(--rojo-t) 14%,transparent)}}
.bloque-t{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:22px;font-size:15px;font-weight:500}
.marca{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:400;color:var(--sec)}
