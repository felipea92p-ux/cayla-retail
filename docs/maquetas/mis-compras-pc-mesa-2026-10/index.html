<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis compras · la mesa de la ronda · PC y celular</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap">
<style>
/* Mis compras con la ronda abierta, en ESCRITORIO y en CELULAR (Felipe 2026-10-28: «se ve tan básico» y «en celular también debe verse bien»).
   La propuesta se adapta SOLA al ancho de su ventana (consultas de contenedor): a 760 px o menos la tabla pasa a lista, las columnas se apilan
   y el camino de la ronda se vuelve las rayitas de hoy. Mismos datos de tu captura (RC-000004, Compra a Moda Mia S/ 198.00, Te transfirieron
   S/ 5,700.00, 9 prendas por mandar a TRU). Tokens de la guía «CAYLA Dynamic» (apps/web/app/globals.css) y su oscuro (estilos/tema.css).
   Lo marcado «ejemplo» es inventado para esta maqueta. */
:root {
  --crema: #f5f0e8; --papel: #fbf8f2; --tinta: #1a1a18; --sand: #e8e0d0; --hueso: #eae1d2; --taupe: #805c4c; --borde-control: #a89a86;
  --rojo: #b8412d; --verde: #48603f; --verde-suave: #e3e4d9; --ambar: #74501a; --ambar-suave: #ece0cf;
  --pizarra: #4c5d6e; --pizarra-suave: #e1e1dc; --sobre: #f5f0e8;
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --crema: #1c1a17; --papel: #26241f; --tinta: #f5f0e8; --sand: #3a3730; --hueso: #2e2c27; --taupe: #c7a894; --borde-control: #7a7064;
  --rojo: #d9674f; --verde: #9db48f; --verde-suave: #2c3328; --ambar: #d9b27a; --ambar-suave: #3a3022;
  --pizarra: #a9b8c6; --pizarra-suave: #2b2f33; --sobre: #1c1a17; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--crema); color: var(--tinta); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding: 24px 20px 56px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--taupe); font-weight: 600; }
.mini { font-size: 12px; color: var(--taupe); }
.tab { font-variant-numeric: tabular-nums; }

/* ---------- barra de la maqueta ---------- */
.marco { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.marco h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; margin: 4px 0 4px; }
.marco .bajada { color: var(--taupe); max-width: 80ch; margin: 0; }
.mando { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; background: var(--papel); border: 1px solid var(--sand); border-radius: 16px; padding: 10px 16px; }
.mando .grupo { display: flex; align-items: center; gap: 8px; }
.mando .grupo > span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--taupe); font-weight: 600; }
.seg { display: inline-flex; background: var(--hueso); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 34px; padding: 0 14px; font-weight: 500; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--tinta); color: var(--sobre); }
.nota-op { font-size: 13.5px; background: var(--hueso); border-radius: 14px; padding: 12px 16px; display: grid; gap: 4px; }
.nota-op b.t { font-family: var(--serif); font-weight: 400; font-size: 21px; }
.nota-op ul { margin: 2px 0 0; padding-left: 18px; color: var(--taupe); display: grid; gap: 2px; }
.nota-op ul b { color: var(--tinta); font-weight: 600; }

/* solo el teléfono (para capturas): ?solo=1 */
.solo body { padding: 12px 0; } .solo .marco > :not(.ajuste) { display: none; } .solo .ajuste.cel { margin: 0 auto; }

/* ---------- la «ventana»: el área de contenido del ERP (1160 px a 1440) o un celular (375 px) ---------- */
.ajuste { width: 100%; max-width: 1160px; margin: 0 auto; border: 1px solid var(--sand); border-radius: 18px; background: var(--crema); overflow: hidden; container-type: inline-size; container-name: pantalla; }
.ajuste.cel { max-width: 375px; border-radius: 32px; border-width: 2px; }
.pc { padding: 26px 30px 36px; display: flex; flex-direction: column; gap: 18px; }
.cabeza { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; }
.cabeza h2 { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: 1.02; margin: 6px 0 6px; }
.cabeza p { margin: 0; color: var(--taupe); font-size: 13.5px; }

/* piezas del ERP */
.card { background: var(--papel); border: 1px solid var(--sand); border-radius: 18px; }
.tit { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tit h3 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0; display: flex; align-items: center; gap: 8px; }
.globo { min-width: 22px; height: 22px; border-radius: 11px; background: var(--hueso); color: var(--taupe); font: 600 12px var(--sans); display: inline-grid; place-items: center; padding: 0 6px; }
.globo.pide { background: var(--ambar-suave); color: var(--ambar); }
.ver { color: var(--rojo); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; border: 0; background: transparent; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--borde-control); background: transparent; border-radius: 12px; min-height: 40px; padding: 0 16px; font-weight: 500; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--tinta); color: var(--sobre); border-color: var(--tinta); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--pizarra-suave); color: var(--pizarra); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ambar { background: var(--ambar-suave); color: var(--ambar); }
.chip.verde { background: var(--verde-suave); color: var(--verde); }
.circulo { width: 40px; height: 40px; border-radius: 50%; background: var(--hueso); color: var(--tinta); display: grid; place-items: center; flex: none; }
.pista { height: 6px; border-radius: 3px; background: var(--sand); overflow: hidden; display: flex; }
.pista > i { display: block; height: 100%; }
.muestra { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--papel); display: inline-block; margin-left: -8px; }
.muestra:first-child { margin-left: 0; }
.ej { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px dashed var(--borde-control); color: var(--taupe); border-radius: 999px; padding: 1px 8px; font-weight: 600; white-space: nowrap; }

/* el camino de la ronda: en PC un paso a paso con rayas; en celular las rayitas de hoy (CaminoDePasos) */
.camino { display: flex; align-items: center; gap: 0; }
.camino .paso { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--taupe); white-space: nowrap; }
.camino .paso b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--sand); color: var(--taupe); }
.camino .paso.hecho b { background: var(--verde-suave); color: var(--verde); }
.camino .paso.ahora { color: var(--tinta); font-weight: 600; }
.camino .paso.ahora b { background: var(--tinta); color: var(--sobre); }
.camino .raya { flex: 1; height: 2px; background: var(--sand); margin: 0 12px; min-width: 20px; border-radius: 1px; }
.camino .raya.hecha { background: var(--verde); opacity: .55; }
.camino-movil { display: none; }
.camino-movil ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.camino-movil li { display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 1.2; color: var(--taupe); }
.camino-movil li i { display: block; height: 4px; border-radius: 2px; background: var(--sand); }
.camino-movil li.hecho { color: var(--verde); } .camino-movil li.hecho i { background: var(--verde); }
.camino-movil li.ahora { color: var(--tinta); font-weight: 600; } .camino-movil li.ahora i { background: var(--tinta); }

/* la billetera (tal cual la real: tinta sobre crema; en oscuro se invierte sola) */
.bill { background: var(--tinta); color: var(--crema); border-radius: 22px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.bill .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; opacity: .8; }
.bill .grande { font-family: var(--serif); font-size: 46px; line-height: 1; white-space: nowrap; margin: 0; }
.bill .grande small { font-size: 24px; opacity: .7; margin-right: 4px; vertical-align: .35em; }
.bill dl { margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); padding-top: 10px; font-size: 12px; }
.bill dt { opacity: .78; } .bill dd { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.bill .nota { display: flex; gap: 8px; align-items: center; font-size: 12px; background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 10px; padding: 8px 10px; margin: 0; }
.bill .pista { background: color-mix(in srgb, currentColor 22%, transparent); }

/* ¿qué hiciste? */
.acc { border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--sand); background: var(--papel); }
.acc .t { font-family: var(--serif); font-size: 21px; line-height: 1.1; display: block; }
.acc .d { font-size: 12.5px; color: var(--taupe); }
.acc.grande { background: var(--tinta); color: var(--crema); border-color: var(--tinta); }
.acc.grande .circulo { background: var(--crema); color: var(--tinta); }
.acc.grande .d { color: color-mix(in srgb, var(--crema) 75%, transparent); }

/* franja ámbar de «falta mandar» (la de hoy) */
.franja { display: flex; align-items: center; gap: 12px; background: var(--ambar-suave); color: var(--tinta); border-radius: 18px; padding: 14px 16px; text-align: left; border: 0; width: 100%; min-height: 56px; }
.franja .t { font-weight: 600; font-size: 14px; display: block; } .franja .d { font-size: 12px; color: var(--taupe); }
.franja .ir { margin-left: auto; font-weight: 600; font-size: 13.5px; color: var(--ambar); display: inline-flex; gap: 6px; align-items: center; }

/* lista de hoy */
.fila-hoy { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--sand); }
.fila-hoy:first-of-type { border-top: 0; }
.fila-hoy .q { flex: 1; min-width: 0; } .fila-hoy .q b { display: block; font-weight: 600; font-size: 15px; } .fila-hoy .q span { font-size: 12.5px; color: var(--taupe); }
.fila-hoy .m { text-align: right; font-size: 15px; font-weight: 500; }
.vacio-hoy { display: flex; gap: 12px; align-items: flex-start; padding: 8px 4px; font-size: 13.5px; color: var(--taupe); }
.vacio-hoy .circulo { width: 32px; height: 32px; }

/* ---------- la propuesta ---------- */
.g2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: stretch; }
.g3 { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 16px; align-items: stretch; }
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: stretch; }
.acciones .grande { grid-column: 1 / -1; }
.acciones .acc { min-height: 84px; }
.tabla { padding: 4px 0 0; overflow: hidden; }
.tabla .encab, .tabla .fila { display: grid; grid-template-columns: 64px minmax(0, 1.5fr) minmax(0, 1.2fr) 112px; gap: 14px; align-items: center; padding: 0 20px; }
.tabla .encab { min-height: 36px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--taupe); font-weight: 600; border-bottom: 1px solid var(--sand); }
.tabla .fila { min-height: 68px; border-bottom: 1px solid var(--sand); position: relative; }
.tabla .fila:hover { background: color-mix(in srgb, var(--hueso) 55%, transparent); }
.tabla .fila:hover::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--rojo); }
.tabla .quien { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tabla .quien b { display: block; font-weight: 600; } .tabla .quien span { font-size: 12.5px; color: var(--taupe); }
.tabla .quien .hh { display: none; }
.tabla .monto .hm { display: none; }
.tabla .est { display: flex; flex-wrap: wrap; gap: 6px; }
.tabla .monto { text-align: right; font-weight: 600; font-size: 15px; white-space: nowrap; }
.tabla .monto.mas { color: var(--verde); }
.tabla .pie { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; font-size: 13px; color: var(--taupe); background: color-mix(in srgb, var(--hueso) 45%, transparent); }
.tabla .pie b { color: var(--tinta); font-weight: 600; }
.mandar { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.mandar .tienda { display: flex; align-items: center; gap: 12px; }
.mandar .tienda b { display: block; font-weight: 600; } .mandar .tienda span { font-size: 12.5px; color: var(--taupe); }
.mandar .quieta { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--taupe); border-top: 1px dashed var(--borde-control); padding-top: 12px; }
.envio { display: flex; align-items: center; gap: 12px; border: 1px solid var(--sand); border-radius: 14px; padding: 10px 12px; }
.envio code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.cierre { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.cierre p { margin: 0; font-size: 13.5px; color: var(--taupe); display: flex; align-items: center; gap: 10px; }
.cierre p b { color: var(--tinta); font-weight: 600; }
.anteriores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ant { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.ant .c { font-family: var(--serif); font-size: 19px; line-height: 1.1; }
.ant .n { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--taupe); }
.ant .n b { color: var(--tinta); font-weight: 600; }
.ant.todas { align-items: center; justify-content: center; color: var(--taupe); border-style: dashed; min-height: 96px; }

/* la pantalla de HOY (3 columnas en PC, una en celular) */
.hoy3 { display: grid; grid-template-columns: 21rem minmax(0, 1fr) minmax(0, 1fr); gap: 16px 28px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; }
.hoy-camino { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--taupe); }
.hoy-camino .puntos { display: flex; gap: 4px; } .hoy-camino .puntos i { flex: 1; height: 4px; border-radius: 2px; background: var(--sand); } .hoy-camino .puntos i.on { background: var(--tinta); }

/* ---------- a 760 px o menos (tablet angosta y celular): todo se apila y la tabla pasa a lista ---------- */
@container pantalla (max-width: 760px) {
  .pc { padding: 18px 16px 28px; gap: 16px; }
  .cabeza h2 { font-size: 36px; margin: 4px 0; }
  .g2, .anteriores, .hoy3 { grid-template-columns: 1fr; }
  .g3 { display: flex; flex-direction: column; }
  .g3 .mandar { order: -1; } /* lo urgente (falta mandar) va antes de la lista, como la franja de hoy */
  .camino { display: none; }
  .camino-movil { display: flex; flex-direction: column; gap: 8px; }
  .btn { min-height: 44px; }
  .acciones { gap: 10px; }
  .acciones .acc:not(.grande) { flex-direction: column; align-items: flex-start; gap: 10px; min-height: 0; padding: 14px; }
  .acciones .acc:not(.grande) .t { font-size: 18px; }
  .tabla .encab { display: none; }
  .tabla .fila { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "q m" "e e"; gap: 8px 12px; align-items: start; padding: 14px 16px; min-height: 0; }
  .tabla .fila > .hora { display: none; }
  .tabla .quien { grid-area: q; align-items: flex-start; }
  .tabla .monto { grid-area: m; }
  .tabla .monto .hm { display: block; font-size: 12px; font-weight: 400; color: var(--taupe); margin-top: 2px; }
  .tabla .est { grid-area: e; padding-left: 52px; }
  .tabla .pie { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; }
  .tit { flex-wrap: wrap; row-gap: 4px; }
  .tit h3 { font-size: 20px; white-space: nowrap; }
  .mandar { padding: 16px; }
  .cierre { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px; }
  .cierre .btn { width: 100%; min-width: 0 !important; }
  .ant.todas { min-height: 48px; }
  .bill { padding: 16px 16px 14px; }
}
</style>
</head>
<body>
<div class="marco">
  <div>
    <div class="eyebrow">Maqueta · Mis compras · con la ronda abierta</div>
    <h1>La mesa de la ronda</h1>
    <p class="bajada">Alterna «Ahora» y «Propuesta», y el ancho PC o Celular. Los datos son los de tu captura. Nada de esto está en la app: es solo para que mires y elijas.</p>
  </div>
  <div class="mando">
    <div class="grupo"><span>Vista</span><div class="seg" id="seg-vista"></div></div>
    <div class="grupo"><span>Ancho</span><div class="seg" id="seg-ancho"></div></div>
    <div class="grupo"><span>Estado</span><div class="seg" id="seg-estado"></div></div>
    <div class="grupo"><span>Tema</span><div class="seg" id="seg-tema"><button data-t="light" aria-pressed="true">Claro</button><button data-t="dark" aria-pressed="false">Oscuro</button></div></div>
  </div>
  <div class="nota-op" id="nota"></div>
  <div class="ajuste" id="ajuste"><div class="pc" id="pc"></div></div>
</div>

<script>
const I = {
  bolsa: '<svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  camion: '<svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
  mano: '<svg viewBox="0 0 24 24"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>',
  recibo: '<svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>',
  flecha: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  caja: '<svg viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></svg>',
  ok: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  baja: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
};
const S = (n) => 'S/ ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COLORES = ['#8f4a3c', '#d8c9a6', '#44574a'];
const muestras = () => '<span style="display:inline-flex;padding-left:8px">' + COLORES.map(c => `<i class="muestra" style="background:${c}"></i>`).join('') + '</span>';

let vista = 'propuesta', estado = 'sin', ancho = 'pc';
const el = (id) => document.getElementById(id);

const cabeza = () => `<div class="cabeza"><div>
  <div class="eyebrow" style="display:flex;align-items:center;gap:10px">Tu sede <i style="display:block;width:36px;height:1px;background:var(--taupe)"></i> miércoles 28 de octubre</div>
  <h2>Mis compras</h2>
  <p>Lo que tienes para comprar, lo que compraste y lo que mandas a la tienda.</p></div></div>`;

/* ------------------------------ piezas compartidas ------------------------------ */
const billAhora = () => `<div class="bill"><div class="lab"><span>Tienes para comprar</span><span style="text-transform:none;letter-spacing:0;font-weight:400">Ronda RC-000004</span></div>
  <p class="grande tab"><small>S/</small>5,502.00</p>
  <dl><div><dt>Te dieron</dt><dd class="tab">${S(5700)}</dd></div><div><dt>Compraste</dt><dd class="tab">− ${S(198)}</dd></div><div><dt>Gastaste</dt><dd class="tab">S/ 0.00</dd></div></dl></div>`;
const billProp = () => `<div class="bill"><div class="lab"><span>Tienes para comprar</span><span style="text-transform:none;letter-spacing:0;font-weight:400">Ronda RC-000004</span></div>
  <p class="grande tab"><small>S/</small>5,502.00</p>
  <div><div class="pista" role="img" aria-label="Del dinero de la ronda, 198 comprados, 0 gastados y 5,502 libres"><i style="width:3.5%;background:currentColor"></i></div>
    <div class="mini" style="color:inherit;opacity:.78;margin-top:6px">Usaste el 3 % de lo que te dieron</div></div>
  <dl><div><dt>Te dieron</dt><dd class="tab">${S(5700)}</dd></div><div><dt>Compraste</dt><dd class="tab">− ${S(198)}</dd></div><div><dt>Gastaste</dt><dd class="tab">S/ 0.00</dd></div></dl>
  <p class="nota">${I.info} Compras todavía confirma ${S(5700)}. Ya la puedes usar.</p></div>`;
const accionesAhora = () => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <button class="acc grande" style="grid-column:1/-1"><span class="circulo">${I.bolsa}</span><span><span class="t">Apunte de compras</span><span class="d">A un proveedor, en la calle o por pedido</span></span></button>
  <button class="acc" style="flex-direction:column;align-items:flex-start;gap:10px;padding:14px"><span class="circulo">${I.mano}</span><span class="t" style="font-size:18px">Me dieron plata</span></button>
  <button class="acc" style="flex-direction:column;align-items:flex-start;gap:10px;padding:14px"><span class="circulo">${I.recibo}</span><span class="t" style="font-size:18px">Gasté en otra cosa</span></button></div>`;
const accionesProp = () => `<div class="acciones">
  <button class="acc grande"><span class="circulo">${I.bolsa}</span><span><span class="t">Apunte de compras</span><span class="d">A un proveedor, en la calle o por pedido</span></span><span style="margin-left:auto">${I.flecha}</span></button>
  <button class="acc"><span class="circulo">${I.mano}</span><span><span class="t" style="font-size:18px">Me dieron plata</span><span class="d">Anota lo que te mandaron</span></span></button>
  <button class="acc"><span class="circulo">${I.recibo}</span><span><span class="t" style="font-size:18px">Gasté en otra cosa</span><span class="d">Pasajes, bolsas, comida</span></span></button></div>`;
const filasHoy = (con) => `
  <div class="fila-hoy"><span class="circulo">${I.bolsa}</span><div class="q"><b>Compra a Moda Mia</b><span class="tab">17:44 · 9 prendas · Nota de venta · ${con ? 'enviada a Tienda TRU' : 'falta mandar a Tienda TRU'}</span></div><div class="m tab">− ${S(198)}<br><span class="chip" style="margin-top:4px">Compras la revisa</span></div></div>
  <div class="fila-hoy"><span class="circulo">${I.mano}</span><div class="q"><b>Te transfirieron</b><span class="tab">17:38 · Transferencia</span></div><div class="m tab">+ ${S(5700)}<br><span class="chip" style="margin-top:4px">Compras la confirma</span></div></div>`;

/* ------------------------------ AHORA ------------------------------ */
function ahora() {
  const con = estado === 'con';
  const camino = `<div class="hoy-camino"><div class="puntos"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>Tu ronda, paso a paso</div>`;
  const franja = con ? '' : `<button class="franja"><span class="circulo" style="background:transparent;width:28px;height:28px">${I.camion}</span><span><span class="t">Falta mandar 9 prendas</span><span class="d">TRU 9</span></span><span class="ir">Mandar ${I.flecha}</span></button>`;
  const envios = `<div><div class="tit"><h3>Envíos de esta ronda <span class="globo">${con ? 1 : 0}</span></h3><button class="ver">Ver todos ${I.flecha}</button></div>
    ${con ? `<div class="envio" style="margin-top:10px"><span class="circulo" style="width:32px;height:32px">${I.caja}</span><div style="flex:1"><code>ENV-000012</code><div class="mini">9 prendas a Tienda TRU · hoy 18:05</div></div><span class="chip">En camino</span></div>`
    : `<div class="vacio-hoy"><span class="circulo">${I.caja}</span><span>Todavía no mandaste nada en la ronda RC-000004. Cuando mandes un envío, aparece aquí con su código.</span></div>`}</div>`;
  const lista = `<div><div class="tit"><h3>En esta ronda <span class="globo">2</span></h3><span class="mini">desde hoy 17:36</span></div><div style="margin-top:4px">${filasHoy(con)}</div></div>`;
  const cerrar = `<button class="btn" ${con ? '' : 'disabled'} style="justify-content:flex-start;width:100%">Cerrar mi ronda RC-000004</button>`;
  const ant = `<div class="tit"><h3 style="font-size:19px">Rondas anteriores</h3><button class="ver" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--tinta)">Ver 2 ${I.baja}</button></div>`;
  // En el celular de hoy: una sola columna, en este orden (camino y plata · acciones · falta mandar · envíos · lista · cerrar · anteriores).
  if (ancho === 'cel') return cabeza() + `<div class="col">${camino}${billAhora()}${accionesAhora()}${franja}${envios}${lista}${cerrar}${ant}</div>`;
  return cabeza() + `<div class="hoy3"><div class="col">${camino}${billAhora()}${accionesAhora()}${cerrar}</div><div class="col">${franja}${envios}</div><div class="col">${lista}${ant}</div></div>`;
}

/* ------------------------------ PROPUESTA ------------------------------ */
function propuesta() {
  const con = estado === 'con';
  const paso = (n, t, c) => `<span class="paso ${c}"><b>${c === 'hecho' ? I.ok.replace('<svg', '<svg style="width:13px;height:13px"') : n}</b>${t}</span>`;
  const pasos = [['Abre tu ronda', 'hecho'], ['Anota', 'hecho'], ['Manda', con ? 'hecho' : 'ahora'], ['Ciérrala', con ? 'ahora' : '']];
  const camino = `<div><div class="camino" aria-label="Tu ronda, paso a paso">
    ${paso(1, pasos[0][0], pasos[0][1])}<i class="raya hecha"></i>${paso(2, pasos[1][0], pasos[1][1])}<i class="raya hecha"></i>${paso(3, pasos[2][0], pasos[2][1])}<i class="raya ${con ? 'hecha' : ''}"></i>${paso(4, pasos[3][0], pasos[3][1])}
    <span class="mini" style="margin-left:20px;white-space:nowrap">Ronda RC-000004 · abierta hoy 17:36</span></div>
    <div class="camino-movil"><ol aria-label="Tu ronda, paso a paso">${pasos.map(([t, c]) => `<li class="${c}"><i></i><span>${c === 'hecho' ? '✓ ' : ''}${t}</span></li>`).join('')}</ol>
    <span class="mini">Ronda RC-000004 · abierta hoy 17:36</span></div></div>`;
  const hh = () => '';
  const tabla = `<section class="card tabla" aria-label="En esta ronda">
      <div class="tit" style="padding:16px 20px 10px"><h3>En esta ronda <span class="globo">2</span></h3><span class="mini">desde hoy 17:36</span></div>
      <div class="encab"><span>Hora</span><span>Movimiento</span><span>Estado</span><span style="text-align:right">Monto</span></div>
      <div class="fila"><span class="mini tab hora">17:44</span>
        <div class="quien"><span class="circulo">${I.bolsa}</span><div><b>Compra a Moda Mia</b><span>${hh('17:44')}9 prendas · Nota de venta</span></div></div>
        <div class="est">${con ? '<span class="chip verde">Enviada a TRU</span>' : '<span class="chip ambar">Falta mandar a TRU</span>'}<span class="chip">Compras la revisa</span></div>
        <div class="monto tab">− ${S(198)}<span class="hm">17:44</span></div></div>
      <div class="fila" style="border-bottom:0"><span class="mini tab hora">17:38</span>
        <div class="quien"><span class="circulo">${I.mano}</span><div><b>Te transfirieron</b><span>${hh('17:38')}Transferencia</span></div></div>
        <div class="est"><span class="chip">Compras la confirma</span></div>
        <div class="monto mas tab">+ ${S(5700)}<span class="hm">17:38</span></div></div>
      <div class="pie"><span>Entró <b class="tab">${S(5700)}</b> · salió <b class="tab">${S(198)}</b></span><span>Quedan <b class="tab">${S(5502)}</b></span></div></section>`;
  const mandar = con
    ? `<section class="card mandar" aria-label="Para mandar"><div class="tit"><h3>Para mandar <span class="globo">0</span></h3><span class="chip verde">Todo mandado</span></div>
        <div class="envio"><span class="circulo" style="width:32px;height:32px">${I.caja}</span><div style="flex:1;min-width:0"><code>ENV-000012</code><div class="mini">9 prendas a Tienda TRU · hoy 18:05</div></div><span class="chip">En camino</span></div>
        <div><div class="pista"><i style="width:100%;background:var(--verde)"></i></div><div class="mini tab" style="margin-top:6px">9 de 9 prendas mandadas</div></div>
        <button class="ver" style="align-self:flex-start;min-height:32px">Ver todos los envíos ${I.flecha}</button></section>`
    : `<section class="card mandar" aria-label="Para mandar"><div class="tit"><h3>Para mandar <span class="globo pide">9</span></h3><span class="mini">1 tienda</span></div>
        <div class="tienda"><span class="circulo" style="background:var(--ambar-suave);color:var(--ambar)">${I.camion}</span><div style="flex:1;min-width:0"><b>Tienda TRU</b><span class="tab">9 prendas · de Moda Mia</span></div>${muestras()}</div>
        <button class="btn pri" style="width:100%">Mandar a TRU ${I.flecha}</button>
        <div><div class="pista"><i style="width:0"></i></div><div class="mini tab" style="margin-top:6px">0 de 9 prendas mandadas</div></div>
        <div class="quieta">${I.caja}<span>Aún no mandas nada. Cuando mandes un envío, aparece aquí con su código.</span></div></section>`;
  const cierre = `<section class="card cierre" aria-label="Cerrar mi ronda"><p>${con ? I.ok + '<span><b>Todo está mandado.</b> Al cerrar, Compras recibe la cuenta de la ronda.</span>' : I.camion + '<span><b>Último paso: cerrar la ronda.</b> Antes, manda las 9 prendas a TRU.</span>'}</p>
      <button class="btn ${con ? 'pri' : ''}" ${con ? '' : 'disabled'} style="min-width:240px">Cerrar mi ronda RC-000004</button></section>`;
  const ant = `<div><div class="tit" style="margin-bottom:10px"><h3>Rondas anteriores <span class="globo">2</span></h3><span class="ej">ejemplo · datos inventados</span></div>
      <div class="anteriores">
        <div class="card ant"><span class="c">RC-000003</span><div class="n"><span>Cerrada el 24 de octubre</span><span>3 compras</span></div><div class="n"><span>Compraste</span><b class="tab">S/ 1,240.00</b></div><div class="n"><span>Te sobró</span><b class="tab">S/ 60.00</b></div></div>
        <div class="card ant"><span class="c">RC-000002</span><div class="n"><span>Cerrada el 21 de octubre</span><span>5 compras</span></div><div class="n"><span>Compraste</span><b class="tab">S/ 2,910.00</b></div><div class="n"><span>Te sobró</span><b class="tab">S/ 0.00</b></div></div>
        <button class="card ant todas">Ver todas</button></div></div>`;
  // Celular: el mismo orden que hoy (camino y plata · acciones · mandar · lista · cerrar · anteriores). PC: la rejilla de la maqueta.
  return cabeza() + camino + `<div class="g2">${billProp()}${accionesProp()}</div><div class="g3">${tabla}${mandar}</div>${cierre}` + ant;
}

/* ------------------------------ mando ------------------------------ */
const NOTAS = {
  ahora: `<b class="t">Así está hoy</b><ul><li>En PC, tres columnas angostas con el mismo peso: lo que importa (qué falta mandar) queda en el medio y el registro, al fondo.</li><li>«Envíos de esta ronda» ocupa una sección entera para decir que no hay ninguno.</li><li>Los montos son cifras sueltas y los estados, píldoras idénticas.</li><li>En celular, una sola columna larga en este orden: camino y plata · acciones · falta mandar · envíos · lista · cerrar · rondas anteriores.</li></ul>`,
  propuesta: `<b class="t">Qué cambia en la propuesta</b><ul>
    <li><b>Arriba, de un vistazo:</b> el camino de la ronda en una línea (en el celular, las rayitas de hoy) y la billetera con una barra que dice cuánto de lo que te dieron ya usaste.</li>
    <li><b>Lo que haces, junto a tu plata:</b> «Apunte de compras» grande y las otras dos acciones.</li>
    <li><b>«En esta ronda»:</b> en PC, una tabla (hora, movimiento, estado, monto) con el total al pie; en celular, la misma información en una lista: nombre y monto arriba, hora y detalle debajo, y los estados en chips en su propia línea.</li>
    <li><b>«Para mandar» y los envíos, en una sola tarjeta</b> con el botón «Mandar a TRU» y cuántas prendas ya salieron. «Cerrar mi ronda» dice por qué está apagado.</li>
    <li><b>En celular:</b> una columna, botones de 44 px, «Cerrar mi ronda» a todo el ancho y las rondas anteriores apiladas. Todo con tokens y piezas del ERP.</li></ul>`,
};
function pinta() {
  el('ajuste').classList.toggle('cel', ancho === 'cel');
  el('pc').innerHTML = vista === 'ahora' ? ahora() : propuesta();
  el('nota').innerHTML = NOTAS[vista];
  [['seg-vista', [['ahora', 'Ahora'], ['propuesta', 'Propuesta']], vista, (v) => (vista = v)],
   ['seg-ancho', [['pc', 'PC'], ['cel', 'Celular (375 px)']], ancho, (v) => (ancho = v)],
   ['seg-estado', [['sin', 'Sin envíos (tu captura)'], ['con', 'Ya mandé el envío']], estado, (v) => (estado = v)]].forEach(([id, ops, act, set]) => {
    el(id).innerHTML = ops.map(([k, t]) => `<button data-k="${k}" aria-pressed="${k === act}">${t}</button>`).join('');
    el(id).querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.k); pinta(); });
  });
}
document.querySelectorAll('#seg-tema button').forEach(b => b.onclick = () => {
  document.documentElement.dataset.theme = b.dataset.t;
  document.querySelectorAll('#seg-tema button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
const q = new URLSearchParams(location.search);
if (q.get('vista')) vista = q.get('vista'); if (q.get('estado')) estado = q.get('estado'); if (q.get('ancho')) ancho = q.get('ancho'); if (q.get('solo')) document.documentElement.classList.add('solo'); if (q.get('tema')) document.documentElement.dataset.theme = q.get('tema');
pinta();
</script>
</body>
</html>
