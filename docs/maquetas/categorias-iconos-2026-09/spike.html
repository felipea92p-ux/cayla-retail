<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Íconos en Categorías · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:wght@500;600&display=swap">
<style>
  /* Paleta oficial «CAYLA Dynamic» (apps/web/app/globals.css, ADR-0169). Sin modo oscuro. Ningún hex suelto fuera de esta lista.
     Aquí no hay rojo ni ámbar: el color está reservado para estado y esta pantalla no tiene estados. */
  :root {
    color-scheme: light;
    --crema:#f5f0e8; --papel:#fbf8f2; --hueso:#eae1d2; --sand:#e8e0d0;
    --tinta:#1a1a18; --taupe:#805c4c; --rojo:#b8412d;
    --t80:color-mix(in srgb,var(--tinta) 80%,transparent); --t70:color-mix(in srgb,var(--tinta) 70%,transparent);
    --t65:color-mix(in srgb,var(--tinta) 65%,transparent); --t55:color-mix(in srgb,var(--tinta) 55%,transparent);
    --t40:color-mix(in srgb,var(--tinta) 40%,transparent); --t30:color-mix(in srgb,var(--tinta) 30%,transparent);
    --t25:color-mix(in srgb,var(--tinta) 25%,transparent); --t10:color-mix(in srgb,var(--tinta) 10%,transparent);
    --sand60:color-mix(in srgb,var(--sand) 60%,transparent);
    --ease:cubic-bezier(.32,.72,.24,1);
    --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;
    --serif:"EB Garamond",ui-serif,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--crema);color:var(--tinta);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:10px 16px 40px}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
  svg.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .etq{font:600 11px/1.3 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--t65);margin:0}

  /* ============ Barra de la maqueta (no es parte del ERP) ============ */
  .mando{position:sticky;top:8px;z-index:60;display:grid;gap:8px;padding:10px 14px;margin:0 auto 14px;max-width:1440px;border:1px dashed var(--taupe);border-radius:12px;background:color-mix(in srgb,var(--crema) 93%,transparent);backdrop-filter:blur(6px)}
  .mando-fila{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .etq-g{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--taupe)}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--sand);border-radius:999px;background:var(--papel);padding:3px;gap:2px}
  .seg button{border:0;background:transparent;font:500 12.5px var(--sans);color:var(--taupe);padding:5px 11px;border-radius:999px}
  .seg button[aria-pressed="true"]{background:var(--tinta);color:var(--crema)}
  @media (max-height:760px){.mando{position:static}}
  .notas{max-width:1440px;margin:0 auto 12px;padding:0 4px;display:grid;gap:4px}
  .decidido{font-size:12.5px;color:var(--taupe);margin:0;max-width:1100px}
  .decidido b{color:var(--tinta)}

  /* ============ Marco: la pantalla real, a distintos anchos ============ */
  .marco{position:relative;margin:0 auto;width:100%;border:1px solid var(--sand);border-radius:16px;overflow:clip;background:var(--crema);container:marco / inline-size}
  .marco[data-ancho="escritorio"]{max-width:1180px}
  .marco[data-ancho="tablet"]{max-width:820px}
  .marco[data-ancho="celular"]{max-width:390px}
  .pagina{padding:26px 36px 28px}
  @container marco (max-width:600px){.pagina{padding:20px 16px 24px}}
  .h1{font:600 26px/1.15 var(--serif);margin:4px 0 0}
  .sub{font-size:12px;color:var(--t55);margin:4px 0 0}
  .barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin:16px 0 12px}
  .busca{position:relative;margin-left:auto;flex:0 1 288px;min-width:0}
  @container marco (max-width:600px){.busca{flex-basis:100%}}
  .busca input{width:100%;height:36px;border:0;border-bottom:1px solid var(--t25);background:transparent;padding:0 24px;font:14px var(--sans);color:var(--tinta);outline:none}
  .busca input:focus{border-bottom-color:var(--tinta)}
  .busca svg{position:absolute;left:2px;top:50%;translate:0 -50%;width:14px;height:14px;color:var(--t40)}
  .btn-agregar{font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;background:var(--tinta);color:var(--crema);border:0;border-radius:8px;padding:12px 16px;flex:none}
  .cuenta-busq{font-size:14px;color:var(--t70);margin:0}
  .card{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
  .fam{padding:20px;margin-top:12px}
  .fam-cab{display:flex;align-items:center;justify-content:space-between}
  .fam-cab .n{display:flex;align-items:center;gap:8px;color:var(--t70)}
  .fam-cab .n b{font-weight:500;font-size:14px;color:var(--tinta)}
  .fam-cab .c{font-size:11px;color:var(--t65)}
  .rejilla{display:grid;margin-top:12px;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
  @container marco (min-width:560px){.rejilla{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @container marco (min-width:780px){.rejilla{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @container marco (min-width:1000px){.rejilla{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .chip-p{font:600 10.5px var(--mono);background:var(--sand);color:var(--t70);border-radius:6px;padding:2px 6px;letter-spacing:0}
  .nota{margin-top:14px;background:var(--hueso);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--t80)}

  /* ============ HOY y A: la misma tarjeta; solo cambia el ícono ============ */
  .t{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;text-align:left;cursor:pointer;background:var(--papel);border:1px solid var(--sand);border-radius:16px;transition:transform 260ms var(--ease),box-shadow 260ms var(--ease)}
  .t:hover{transform:translateY(-2px);box-shadow:0 4px 12px -4px var(--t25)}
  .t .arr{display:flex;width:100%;align-items:center;justify-content:space-between}
  .t .ico{color:var(--t30);transition:color 200ms var(--ease)}
  .t:hover .ico{color:var(--t55)}
  .t .nom{font:500 15px/1.15 var(--serif);margin:0}
  .t .cnt{margin:4px 0 0;font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--t65)}
  .t .tem{margin:2px 0 0;font-size:11px;color:var(--taupe)}
  /* A: el mismo hueco, ícono más grande y más oscuro (a 20 px y 30 % de tinta no se distingue un blazer de un abrigo) */
  .marco[data-v="a"] .t .ico{color:var(--t55)}
  .marco[data-v="a"] .t:hover .ico{color:var(--t80)}

  /* ============ B: «muestra» como en Atributos, en chico ============ */
  .rejilla.b{gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
  @container marco (min-width:560px){.rejilla.b{grid-template-columns:repeat(5,minmax(0,1fr))}}
  @container marco (min-width:780px){.rejilla.b{grid-template-columns:repeat(6,minmax(0,1fr))}}
  @container marco (min-width:1000px){.rejilla.b{grid-template-columns:repeat(8,minmax(0,1fr))}}
  .tb{display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px;text-align:left;cursor:pointer;background:var(--papel);border:1px solid var(--sand);border-radius:16px;transition:transform 260ms var(--ease),border-color 260ms var(--ease)}
  .tb:hover{transform:translateY(-2px);border-color:var(--t25)}
  .tb .mu{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:10px;background:var(--sand60);color:var(--t70);transition:color 200ms var(--ease)}
  .tb:hover .mu{color:var(--tinta)}
  .tb .mu .chip-p{position:absolute;left:5px;top:5px;font-size:9.5px;padding:1px 5px}
  .tb .nom{font:500 13px/1.2 var(--serif);margin:0 2px}
  .tb .cnt{margin:auto 2px 0;padding-top:2px;font-size:10.5px;color:var(--t55);font-variant-numeric:tabular-nums}
  .marco[data-cifras="no"] .tb .cnt{display:none}



  /* Prueba sin etiqueta (NN/g): se ocultan nombre, prefijo y cifras; solo queda el ícono. Sirve para preguntarle a 5 colaboradoras «¿qué esperas encontrar?». */
  .marco[data-ciego="1"] .nom,.marco[data-ciego="1"] .cnt,.marco[data-ciego="1"] .det,.marco[data-ciego="1"] .tem,.marco[data-ciego="1"] .chip-p,.marco[data-ciego="1"] .tp{visibility:hidden}


  /* ============ Layout de Atributos (C y D): píldoras, título de grupo con punto, sin tarjeta que envuelva la familia ============ */
  .barra-at{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin:16px 0 4px}
  .pildoras{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .pil{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--sand);padding:5px 14px;background:transparent;font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--taupe);white-space:nowrap;transition:background-color 150ms,color 150ms}
  .pil:hover{color:var(--tinta);background:color-mix(in srgb,var(--sand) 40%,transparent)}
  .pil[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
  .pil .n{font-weight:400;opacity:.55;font-variant-numeric:tabular-nums}
  .acciones{display:flex;align-items:center;gap:12px;margin-left:auto}
  @container marco (max-width:600px){.acciones{width:100%;margin-left:0}}
  .grupo{margin-top:26px}
  .tit{display:flex;align-items:center;gap:6px;margin:0;font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--t65)}
  .tit .dot{width:6px;height:6px;border-radius:50%;background:var(--t25)}
  .tit .n{font-weight:400;color:var(--t40);font-variant-numeric:tabular-nums}
  .pila{display:grid;gap:12px;margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
  @container marco (min-width:560px){.pila{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @container marco (min-width:780px){.pila{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @container marco (min-width:1000px){.pila{grid-template-columns:repeat(5,minmax(0,1fr))}}

  /* D = TarjetaAtributo tal cual (components/atributos/kit.tsx): muestra 3:1 arriba, nombre de 15 px, líneas chicas */
  .ta{display:flex;flex-direction:column;gap:8px;padding:16px;text-align:left;cursor:pointer;background:var(--papel);border:1px solid var(--sand);border-radius:16px;transition:transform 260ms var(--ease),border-color 260ms var(--ease)}
  .ta:hover{transform:translateY(-2px);border-color:var(--t25)}
  .ta .mu{aspect-ratio:3/1;width:100%;overflow:hidden;border-radius:8px}
  .ta .nom{font:500 15px/1.3 var(--sans);margin:0;color:var(--tinta)}
  .ta .det{margin:0;font-size:12px;color:var(--t65);font-variant-numeric:tabular-nums}
  .ta .det .pre{font:600 10.5px var(--mono);color:var(--t55);margin-right:6px}
  .ta .tem{margin:0;font-size:12px;color:var(--taupe)}
  .mu svg,.mb svg{display:block;width:100%;height:100%}
  .mu .pri,.mb .pri,.mu .eco,.mb .eco{transition:transform 500ms var(--ease);transform-box:fill-box;transform-origin:center}
  .ta:hover .pri,.tc:hover .pri{transform:translateY(-2px) scale(1.06)}
  .ta:hover .eco-l,.tc:hover .eco-l{transform:translateX(-6px)}
  .ta:hover .eco-r,.tc:hover .eco-r{transform:translateX(6px)}

  /* C con banner: la misma receta en chico, a la izquierda; el nombre manda */
  .pila.c{gap:10px;grid-template-columns:repeat(1,minmax(0,1fr))}
  @container marco (min-width:640px){.pila.c{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @container marco (min-width:1000px){.pila.c{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .pila.c[data-mini="caja"],.pila.c[data-mini="foto"]{grid-template-columns:repeat(1,minmax(0,1fr))}
  @container marco (min-width:430px){.pila.c[data-mini="caja"],.pila.c[data-mini="foto"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @container marco (min-width:780px){.pila.c[data-mini="caja"],.pila.c[data-mini="foto"]{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @container marco (min-width:1000px){.pila.c[data-mini="caja"],.pila.c[data-mini="foto"]{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .tc{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px;text-align:left;cursor:pointer;background:var(--papel);border:1px solid var(--sand);border-radius:16px;transition:transform 260ms var(--ease),border-color 260ms var(--ease)}
  .tc:hover{transform:translateY(-2px);border-color:var(--t25)}
  .tc .mb{flex:none;width:104px;aspect-ratio:104/64;overflow:hidden;border-radius:8px}
  .tc .cj{display:flex;flex:none;align-items:center;justify-content:center;width:var(--cj,44px);height:var(--cj,44px);border-radius:10px;overflow:hidden;background:var(--sand60);color:var(--t70)}
  .tc .cj img{width:100%;height:100%;object-fit:cover;display:block}
  .tc .tx{min-width:0}
  .tc .nom{font:500 15px/1.25 var(--sans);margin:0}
  .tc .cnt{margin:2px 0 0;font-size:12px;color:var(--t65);font-variant-numeric:tabular-nums}
  .tc .cnt .pre{font:600 10.5px var(--mono);color:var(--t55);margin-right:6px}
  .tc .tem{margin:1px 0 0;font-size:12px;color:var(--taupe)}
  .pila.c[data-mini="foto"] .tc{--cj:64px}

  /* Solo texto (H&M: 36 categorías en píldoras de 48 px, sin una imagen) */
  .textos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tp{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;cursor:pointer;background:var(--papel);border:1px solid var(--sand);border-radius:999px;font:500 15px var(--sans);transition:border-color 200ms var(--ease)}
  .tp:hover{border-color:var(--t25)}
  .tp .pt{width:8px;height:8px;border-radius:50%;background:var(--t25);flex:none}
  .tp .k{font-size:12px;color:var(--t55);font-variant-numeric:tabular-nums}

  /* ============ Hoja de íconos ============ */
  .hoja{display:grid;gap:8px;margin-top:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
  @container marco (min-width:560px){.hoja{grid-template-columns:repeat(5,minmax(0,1fr))}}
  @container marco (min-width:1000px){.hoja{grid-template-columns:repeat(7,minmax(0,1fr))}}
  .hc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;text-align:center;background:var(--papel);border:1px solid var(--sand);border-radius:12px}
  .hc .peq{display:flex;align-items:center;gap:10px}
  .hc b{font:500 12px/1.2 var(--sans)}
  .hc i{font:10px var(--mono);font-style:normal;color:var(--taupe)}

  /* ============ Vista rápida (para ver el mismo ícono en grande) ============ */
  .velo{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px;background:color-mix(in srgb,var(--tinta) 30%,transparent);backdrop-filter:blur(3px)}
  .hoja-vr{width:100%;max-width:440px;background:var(--papel);border:1px solid var(--sand);border-radius:20px;padding:22px;animation:sube 260ms var(--ease) both}
  @keyframes sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .hoja-vr h2{font:600 22px/1.15 var(--serif);margin:0}
  .hoja-vr .fila{display:grid;grid-template-columns:auto 1fr;gap:18px;margin-top:14px}
  .bloque{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .bloque .caja{display:flex;height:64px;width:64px;align-items:center;justify-content:center;border-radius:12px;background:var(--sand60);color:var(--t65)}
  .vr-cierra{margin-top:18px;display:flex;justify-content:flex-end;border-top:1px solid var(--t10);padding-top:12px}
  .vr-cierra button{border:1px solid var(--t25);background:transparent;border-radius:8px;padding:8px 14px;font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){.hoja-vr{animation:none}.t,.tb,.tc,.ta,.mu .pri,.mb .pri,.mu .eco,.mb .eco{transition:none}}
</style>
</head>
<body>

<div class="mando">
  <div class="mando-fila">
    <div class="grp"><span class="etq-g">Versión</span>
      <div class="seg" id="seg-v">
        <button data-v="hoy">Hoy</button><button data-v="a">A</button><button data-v="b">B</button><button data-v="c">C · Banner a la izquierda</button><button data-v="d">D · Banner arriba (Atributos)</button><button data-v="iconos">Los 42 íconos</button>
      </div></div>
    <div class="grp"><span class="etq-g">Ancho</span>
      <div class="seg" id="seg-ancho">
        <button data-ancho="escritorio">Escritorio</button><button data-ancho="tablet">Tablet 820</button><button data-ancho="celular">Celular 390</button>
      </div></div>
  </div>
  <div class="mando-fila" id="fila-opc">
    <div class="grp" id="g-tam"><span class="etq-g">Ícono en A</span>
      <div class="seg" id="seg-tam"><button data-tam="20">20 px (como hoy)</button><button data-tam="28">28 px</button></div></div>
    <div class="grp" id="g-cifras"><span class="etq-g">Cifras en B</span>
      <div class="seg" id="seg-cifras"><button data-cifras="si">Con «N productos»</button><button data-cifras="no">Solo nombre</button></div></div>
    <div class="grp" id="g-mini"><span class="etq-g">Miniatura</span>
      <div class="seg" id="seg-mini"><button data-mini="banner">Banner chico</button><button data-mini="caja">Cajón 44 px</button><button data-mini="foto">Foto si existe</button><button data-mini="texto">Solo texto</button></div></div>
    <div class="grp" id="g-color"><span class="etq-g">Color por familia</span>
      <div class="seg" id="seg-color"><button data-color="si">Sí</button><button data-color="no">No, neutro</button></div></div>
    <div class="grp" id="g-barra"><span class="etq-g">Barra</span>
      <div class="seg" id="seg-barra"><button data-barra="pildoras">Píldoras + buscador</button><button data-barra="solo">Solo buscador</button></div></div>
    <div class="grp" id="g-ciego"><span class="etq-g">Prueba sin etiqueta</span>
      <div class="seg" id="seg-ciego"><button data-ciego="0">Con nombres</button><button data-ciego="1">Solo íconos</button></div></div>
    <div class="grp"><span class="etq-g">Categoría nueva sin ícono</span>
      <div class="seg" id="seg-nueva"><button data-nueva="0">No</button><button data-nueva="1">Sí (ejemplo)</button></div></div>
  </div>
</div>
<div class="notas"><p class="decidido" id="decidido"></p>
  <p class="decidido" id="opciones"></p></div>

<div class="marco" id="marco" data-ancho="escritorio" data-v="hoy" data-cifras="si" data-ciego="0">
  <div class="pagina" id="pagina"></div>
  <div class="velo" id="velo" hidden></div>
</div>

<script>
/* Los 42 íconos de categoría (borrador de trabajo). Cuadrícula 24×24, trazo 1,5, sin relleno, esquinas redondas:
   el mismo lenguaje que `IconoFamilia`. La clave es el PREFIJO (no el nombre): el nombre de una categoría se renombra
   (Poleras/Sudaderas → Poleras), el prefijo queda fijo apenas hay un producto. */
window.ICONOS = [
  /* ---------- Indumentaria ---------- */
  { p: "POL", n: "Polos", f: "indumentaria",
    s: '<path d="M8.6 3.5 3 6.6l2 4.4 2.5-1.2V20.5h9V9.8L19 11l2-4.4-5.6-3.1a3.6 3.6 0 0 1-6.8 0z"/>' },
  { p: "SUD", n: "Poleras", f: "indumentaria",

    return '<g fill="none" stroke="' + a + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.167) translate(-12 -12)">' + s + "</g>";
  }
  // Banner 3:1 de la tarjeta de Atributos (viewBox 180×60): el dibujo grande al centro y dos ecos tenues a los lados.
  function banner(c, w, h, cx, cy, escala, ecoL, ecoR, ecoEsc) {
    var t = tono(c.f), d = dibujo(c, t.a);
    return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="' + w + '" height="' + h + '" fill="' + t.f + '"/>' +
      '<g transform="translate(' + ecoL[0] + " " + ecoL[1] + ") rotate(-14) scale(" + ecoEsc + ')" opacity=".18"><g class="eco eco-l">' + d + "</g></g>" +
      '<g transform="translate(' + ecoR[0] + " " + ecoR[1] + ") rotate(12) scale(" + ecoEsc + ')" opacity=".18"><g class="eco eco-r">' + d + "</g></g>" +
      '<g transform="translate(' + cx + " " + cy + ") scale(" + escala + ')"><g class="pri">' + d + "</g></g></svg>";
  }
  var bannerGrande = function (c) { return banner(c, 180, 60, 90, 30, 1.6, [34, 38], [146, 22], 0.85); };
  var bannerChico = function (c) { return banner(c, 104, 64, 52, 32, 1.45, [15, 46], [91, 17], 0.8); };
  // Foto de mentira: la silueta de la categoría rellena con el color de una prenda, sobre blanco.
  function fotoSrc(c) {
    var col = FOTO[c.p];
    var g = '<g transform="translate(48 50) scale(3.3) translate(-12 -12)" fill="none" stroke="rgba(0,0,0,.32)" stroke-width=".45" stroke-linejoin="round" stroke-linecap="round">' +
      (c.s || FAM_SVG[c.f]).replace(/<(path|rect|circle) /, '<$1 fill="' + col + '" ') + "</g>";
    var sv = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#fff"/><ellipse cx="48" cy="88" rx="26" ry="3" fill="rgba(0,0,0,.08)"/>' + g + "</svg>";
    return "data:image/svg+xml;utf8," + encodeURIComponent(sv);
  }

  /* ---------- tarjetas ---------- */
  function tarjetaHoyA(c) {
    var ico = estado.v === "hoy" ? iconoFam(c.f, 20) : iconoCat(c, +estado.tam);
    return '<button type="button" class="t" data-p="' + c.p + '"><div class="arr"><span class="chip-p">' + c.p + "</span>" + ico + "</div><div>" +
      '<p class="nom">' + c.n + '</p><p class="cnt">' + txtCant(c.cant) + "</p>" + (c.tem ? '<p class="tem">' + c.tem + "</p>" : "") + "</div></button>";
  }
  function tarjetaB(c) {
    return '<button type="button" class="tb" data-p="' + c.p + '"><div class="mu"><span class="chip-p">' + c.p + "</span>" + iconoCat(c, 36) + "</div>" +
      '<p class="nom">' + nombreCorto(c.n) + '</p><p class="cnt">' + txtCant(c.cant) + "</p></button>";
  }
  function tarjetaD(c) {
    return '<button type="button" class="ta" data-p="' + c.p + '"><div class="mu">' + bannerGrande(c) + "</div>" +
      '<p class="nom">' + nombreCorto(c.n) + '</p><p class="det"><span class="pre">' + c.p + "</span>" + txtCant(c.cant) + "</p>" + (c.tem ? '<p class="tem">' + c.tem + "</p>" : "") + "</button>";
  }
  function tarjetaC(c) {
    var t = tono(c.f), izq;
    if (estado.mini === "banner") izq = '<span class="mb">' + bannerChico(c) + "</span>";
    else if (estado.mini === "foto" && FOTO[c.p]) izq = '<span class="cj"><img alt="" src="' + fotoSrc(c) + '"></span>';
    else izq = '<span class="cj" style="background:' + t.f + ";color:" + t.a + '">' + svg(c.s || FAM_SVG[c.f], estado.mini === "foto" ? 32 : 28, "ico") + "</span>";
    return '<button type="button" class="tc" data-p="' + c.p + '">' + izq + '<span class="tx"><p class="nom">' + nombreCorto(c.n) + '</p><p class="cnt"><span class="pre">' + c.p + "</span>" + txtCant(c.cant) + "</p>" +
      (c.tem ? '<p class="tem">' + c.tem + "</p>" : "") + "</span></button>";
  }
  function pildoraTexto(c) {
    return '<button type="button" class="tp" data-p="' + c.p + '"><span class="pt" style="background:' + (estado.color === "si" ? tono(c.f).a : "") + '"></span>' + nombreCorto(c.n) + '<span class="k">' + c.cant + "</span></button>";
  }

  /* ---------- páginas ---------- */
  function cabecera(total) {
    return '<p class="etq">Productos · Catálogo</p><h1 class="h1">Categorías</h1>' +
      '<p class="sub">' + total + " categorías activas · " + Object.keys(CANT).reduce(function (s, k) { return s + CANT[k]; }, 0) + ' productos activos clasificados <span style="color:var(--taupe)">(cifras inventadas)</span></p>';
  }
  function buscador() {
    return '<div class="busca"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Categoría o prefijo" aria-label="Buscar categoría o prefijo" value="' + estado.q.replace(/"/g, "&quot;") + '"></div>' +
      '<button class="btn-agregar" type="button">+ Agregar categoría</button>';
  }
  function filtrar(todas, conFamilia) {
    var q = sinTildes(estado.q.trim());
    return todas.filter(function (c) {
      return (!q || sinTildes(c.n).indexOf(q) >= 0 || sinTildes(c.p).indexOf(q) >= 0) && (!conFamilia || estado.fam === "todas" || c.f === estado.fam);
    });
  }

  function paginaCategorias() {
    var todas = lista(), xs = filtrar(todas, false), q = estado.q.trim();
    var h = cabecera(todas.length);
    h += '<div class="barra">' + (q ? '<p class="cuenta-busq">' + xs.length + " de " + todas.length + " categorías</p>" : "") + '<div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap">' + buscador() + "</div></div>";
    Object.keys(FAM).forEach(function (f) {
      var de = xs.filter(function (c) { return c.f === f; });
      if (q && !de.length) return;
      h += '<section class="card fam"><div class="fam-cab"><div class="n">' + svg(FAM_SVG[f], 18) + "<b>" + FAM[f] + '</b></div><span class="c">' + de.length + (de.length === 1 ? " categoría" : " categorías") + "</span></div>" +
        '<div class="rejilla ' + (estado.v === "b" ? "b" : "") + '">' + de.map(estado.v === "b" ? tarjetaB : tarjetaHoyA).join("") + "</div></section>";
    });
    if (q && !xs.length) h += '<div class="card fam" style="text-align:center;padding:40px 20px;font-size:14px;color:var(--t70)">Ninguna categoría coincide con «' + q + "».</div>";
    return h;
  }

  // C y D: el layout de Atributos (ADR-0261) — píldoras de familia, buscador y «+ Agregar» a la derecha, título de grupo con punto.
  function paginaAtributos() {
    var todas = lista(), pildoras = estado.barra === "pildoras", xs = filtrar(todas, pildoras), q = estado.q.trim();
    var h = cabecera(todas.length) + '<div class="barra-at">';
    if (pildoras) {
      var pil = ['<button type="button" class="pil" data-fam="todas" aria-pressed="' + (estado.fam === "todas") + '">Todas <span class="n">' + todas.length + "</span></button>"];
      Object.keys(FAM).forEach(function (f) {
        var n = todas.filter(function (c) { return c.f === f; }).length;
        pil.push('<button type="button" class="pil" data-fam="' + f + '" aria-pressed="' + (estado.fam === f) + '">' + FAM[f] + ' <span class="n">' + n + "</span></button>");
      });
      h += '<div class="pildoras" role="group" aria-label="Filtrar por familia">' + pil.join("") + "</div>";
    } else if (q) h += '<p class="cuenta-busq">' + xs.length + " de " + todas.length + " categorías</p>";
    h += '<div class="acciones">' + buscador() + "</div></div>";
    Object.keys(FAM).forEach(function (f) {
      var de = xs.filter(function (c) { return c.f === f; });
      if (!de.length) return;
      var punto = estado.color === "si" ? tono(f).a : "";
      var cuerpo;
      if (estado.v === "d") cuerpo = '<div class="pila">' + de.map(tarjetaD).join("") + "</div>";
      else if (estado.mini === "texto") cuerpo = '<div class="textos">' + de.map(pildoraTexto).join("") + "</div>";
      else cuerpo = '<div class="pila c" data-mini="' + estado.mini + '">' + de.map(tarjetaC).join("") + "</div>";
      h += '<section class="grupo"><p class="tit"><span class="dot" style="' + (punto ? "background:" + punto : "") + '"></span>' + FAM[f] + ' <span class="n">' + de.length + "</span></p>" + cuerpo + "</section>";
    });
    if (!xs.length) h += '<div class="card fam" style="text-align:center;padding:40px 20px;font-size:14px;color:var(--t70)">Ninguna categoría coincide con «' + q + "».</div>";
    return h;
  }

  function paginaIconos() {
    var h = '<p class="etq">Productos · Catálogo</p><h1 class="h1">Los íconos de categoría</h1>' +
      '<p class="sub">Cada uno, en grande y en los dos tamaños reales de la tarjeta (28 px y 20 px). La clave es el prefijo, no el nombre.</p>';
    Object.keys(FAM).forEach(function (f) {
      var de = ICONOS.filter(function (c) { return c.f === f; });
      h += '<section class="card fam"><div class="fam-cab"><div class="n">' + svg(FAM_SVG[f], 18) + "<b>" + FAM[f] + '</b></div><span class="c">' + de.length + '</span></div><div class="hoja">' +
        de.map(function (c) {
          return '<div class="hc" style="color:var(--tinta)">' + svg(c.s, 56) + '<div class="peq">' + svg(c.s, 28) + '<span style="color:var(--t30)">' + svg(c.s, 20) + "</span></div><b>" + c.n + "</b><i>" + c.p + "</i></div>";
        }).join("") + "</div></section>";
    });
    return h;
  }

  var NOTAS = {
    hoy: "<b>Hoy.</b> La misma percha en las 18 tarjetas de Indumentaria: el ícono es de la familia, no de la prenda, así que no ayuda a distinguir una categoría de otra.",
    a: "<b>A · Ícono por prenda.</b> La misma tarjeta de hoy con el ícono de la prenda. A 20 px y 30 % de tinta no se distingue un blazer de un abrigo (interruptor «Ícono en A»).",
    b: "<b>B · Muestra chica.</b> El lenguaje de Atributos en chico: 8 por fila, pero no ahorra alto y no cabe la temporada.",
    c: "<b>C · Banner a la izquierda.</b> Tu C, vestida como Atributos ▸ Etiquetas: mismo banner (dibujo grande y dos ecos tenues sobre el tinte del grupo), píldoras de familia, título de grupo con punto. El nombre manda y la tarjeta es más baja. Es una forma de tarjeta nueva.",
    d: "<b>D · Banner arriba.</b> Exactamente la tarjeta de Atributos (<code>TarjetaAtributo</code> + <code>MuestraIcono</code>, las piezas que ya existen): muestra 3:1 arriba, nombre de 15 px, líneas chicas. No inventa ningún componente de tarjeta; es la más alta.",
    iconos: "<b>Los 42 íconos</b> de las categorías activas. Mismo trazo (1,5), sin relleno y esquinas redondas que la percha de hoy."
  };
  var FUENTES = {
    mini: {
      banner: "<b>Banner chico:</b> el molde de Etiquetas/Temporadas (ADR-0261) en chico. Es lo que ya conocen.",
      caja: "<b>Cajón 44 px:</b> Odoo POS y el <code>Thumbnail</code> de Shopify Polaris — un cajón cuadrado, foto o ícono. Caben 4 por fila.",
      foto: "<b>Foto si existe:</b> Uniqlo, Odoo POS («Show category images») y Polaris — foto de un producto de la categoría; sin foto, la silueta sobre el color de su familia. Aquí 7 categorías tienen foto <i>de mentira</i>.",
      texto: "<b>Solo texto:</b> H&amp;M lista 36 categorías en píldoras de 48 px sin una imagen; Zara, Zalando y Ripley, igual. NN/g: en niveles amplios el texto navega más rápido."
    },
    color: {
      si: "<b>Color por familia:</b> Odoo POS, Loyverse, Square y Clover dan a cada categoría un color como identidad. Aquí, los tonos que ya usa Atributos (nunca rojo).",
      no: "<b>Neutro:</b> todo en el tono «General» de Etiquetas; el color deja de decir algo."
    }
  };

  function pintar() {
    var m = $("marco"), v = estado.v;
    m.dataset.ancho = estado.ancho; m.dataset.v = v; m.dataset.cifras = estado.cifras; m.dataset.ciego = estado.ciego;
    $("pagina").innerHTML = v === "iconos" ? paginaIconos() : (v === "c" || v === "d") ? paginaAtributos() : paginaCategorias();
    $("decidido").innerHTML = NOTAS[v] || "";
    var cd = v === "c" || v === "d";
    $("opciones").innerHTML = cd ? (v === "c" ? FUENTES.mini[estado.mini] + " · " : "") + FUENTES.color[estado.color] : "";
    [["seg-v", "v"], ["seg-ancho", "ancho"], ["seg-tam", "tam"], ["seg-cifras", "cifras"], ["seg-mini", "mini"], ["seg-color", "color"], ["seg-barra", "barra"], ["seg-ciego", "ciego"], ["seg-nueva", "nueva"]].forEach(function (p) {
      $(p[0]).querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset[p[1]] === String(estado[p[1]]))); });
    });
    $("g-tam").hidden = v !== "a";
    $("g-cifras").hidden = v !== "b";
    $("g-mini").hidden = v !== "c";
    $("g-color").hidden = !cd;
    $("g-barra").hidden = !cd;
    $("g-ciego").hidden = v === "hoy" || v === "iconos";
    var q = $("q");
    if (q) q.addEventListener("input", function (e) { estado.q = e.target.value; var pos = e.target.selectionStart; pintar(); var n = $("q"); n.focus(); n.setSelectionRange(pos, pos); });
    try { history.replaceState(null, "", "#v=" + v + "&ancho=" + estado.ancho); } catch (e) {}
  }

  ["seg-v", "seg-ancho", "seg-tam", "seg-cifras", "seg-mini", "seg-color", "seg-barra", "seg-ciego", "seg-nueva"].forEach(function (id) {
    $(id).addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      Object.keys(b.dataset).forEach(function (k) { estado[k] = b.dataset[k]; });
      pintar();
    });
  });

  // Píldoras de familia y vista rápida
  $("pagina").addEventListener("click", function (e) {
    var f = e.target.closest("[data-fam]");
    if (f) { estado.fam = f.dataset.fam; pintar(); return; }
    var t = e.target.closest("[data-p]"); if (!t) return;
    var c = lista().filter(function (x) { return x.p === t.dataset.p; })[0]; if (!c) return;
    var cd = estado.v === "c" || estado.v === "d";
    var ico = estado.v === "hoy" ? iconoFam(c.f, 32) : iconoCat(c, 40);
    var caja = cd ? '<div class="caja" style="background:' + tono(c.f).f + ";color:" + tono(c.f).a + '">' + ico + "</div>" : '<div class="caja" style="color:var(--t70)">' + ico + "</div>";
    $("velo").innerHTML = '<div class="hoja-vr" role="dialog" aria-label="' + c.n + '"><h2>' + c.n + '</h2><p class="sub" style="margin-top:2px">' + FAM[c.f] + "</p>" +
      '<div class="fila"><div class="bloque">' + caja + '<span class="chip-p">' + c.p + "</span></div>" +
      '<div style="font-size:14px;color:var(--t70);align-self:center">' + txtCant(c.cant) + " activos</div></div>" +
      '<div class="vr-cierra"><button type="button" id="cerrar">Cerrar</button></div></div>';
    $("velo").hidden = false; $("cerrar").focus();
  });
  var cerrarVelo = function () { $("velo").hidden = true; };
  $("velo").addEventListener("click", function (e) { if (e.target === $("velo") || e.target.id === "cerrar") cerrarVelo(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarVelo(); });

  (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) { var p = kv.split("="); if (p[0] in estado && p[1]) estado[p[0]] = p[1]; });
  pintar();
})();
</script>
</body>
</html>
