<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambios · demo comparativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   DEMO COMPARATIVO · Cambios, computadora y celular (2026-09-26)
   Pedido de Felipe: sumar a Cambios las pantallas que trabajan con ella
   (Traslados, Apartados, Pedidos no atendidos, Clientas, Devoluciones) y
   ver en un demo tres cosas abiertas: la tarjeta de «Actividad reciente»,
   qué va fijo abajo en el celular y qué pasa al terminar un cambio.
   La barra oscura NO existe en el ERP: solo cambia la opción que se mira.
   Tokens = los de apps/web/app/globals.css (ADR-0169). Datos inventados.
   Respeta ADR-0206 (en celular el menú es el cajón ☰, sin barra de
   navegación: lo fijo abajo es una ACCIÓN de esta pantalla) y ADR-0136
   (hojas: velo con desenfoque, hoja que sube, sin rebote).
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);--t06:rgba(26,26,24,.06);
  --ease:cubic-bezier(.32,.72,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:#ddd5c6;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
.serif{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--t65)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:15px;height:15px}svg.ic.xs{width:13px;height:13px}svg.ic.l{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}

/* ── barra del demo (no existe en el ERP) ── */
.spk{position:sticky;top:0;z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;font-size:12.5px}
.spk .tit{font-family:'EB Garamond',serif;font-size:19px;margin-right:6px;align-self:center}
.spk .g{display:flex;flex-direction:column;gap:4px}
.spk .g>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;color:rgba(245,240,232,.75);white-space:nowrap}
.seg button+button{border-left:1px solid rgba(245,240,232,.18)}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--tinta);font-weight:600}

.escena{display:grid;grid-template-columns:minmax(0,1fr) 395px;gap:28px;padding:24px;align-items:start}
@media (max-width:1100px){.escena{grid-template-columns:1fr}.marco-tel{justify-self:center}}
.rot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--t65);margin:0 0 8px 4px}
.porque{margin-top:14px;background:var(--papel);border:1px dashed var(--taupe);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--t80)}
.porque b{font-weight:600;color:var(--tinta)}
.porque ul{margin:6px 0 0 18px}.porque li+li{margin-top:3px}

/* ── marco computadora ── */
.pc{background:var(--crema);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(26,26,24,.35);display:grid;grid-template-columns:220px minmax(0,1fr);height:900px;position:relative}
.pc .side{border-right:1px solid var(--t10);display:flex;flex-direction:column;padding:20px 10px;gap:2px;font-size:14px}
.pc .logo{display:flex;align-items:center;gap:10px;padding:0 10px 16px}
.pc .logo img{height:28px}.pc .logo span{letter-spacing:.26em;font-weight:600;font-size:13px}
.pc .fila{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:8px;color:var(--t80)}
.pc .fila.sub{padding-left:28px}.pc .fila.sub2{padding-left:44px}
.pc .fila.act{background:rgba(232,224,208,.8);color:var(--tinta);font-weight:500;box-shadow:inset 2px 0 0 var(--rojo)}
.pc .fila .ic{color:var(--t50)}
.pc .yo{margin-top:auto;border-top:1px solid var(--t10);padding:14px 10px 0;display:flex;gap:10px;align-items:center;font-size:13px}
.pc .der{display:flex;flex-direction:column;min-width:0;position:relative}
.pc .top{height:56px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:12px;padding:0 24px;flex:none}
.pc .top .esp{flex:1}
.chipcab{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);font-size:11px;letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.chipcab.llano{border:0;background:none;color:var(--t65)}
.pc .cuerpo{overflow-y:auto;padding:26px 32px 40px;flex:1}
.pc .pag{max-width:1120px;margin:0 auto}

/* ── marco celular ── */
.marco-tel{position:sticky;top:84px}
.tel{width:375px;height:780px;border-radius:40px;border:10px solid #1a1a18;background:var(--crema);overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(26,26,24,.45)}
.tel .top{height:54px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(245,240,232,.94);position:absolute;inset:0 0 auto 0;z-index:5}
.tel .top img{height:22px}.tel .top .esp{flex:1}
.tel .cuerpo{position:absolute;inset:54px 0 0 0;overflow-y:auto;padding:16px 14px 110px}
.tel .cuerpo.sinfijo{padding-bottom:28px}
.tel .fijo{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 16px;background:linear-gradient(to top,var(--crema) 72%,rgba(245,240,232,0));z-index:6;display:flex;gap:8px}
.bfijo{flex:1;height:52px;border-radius:14px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px}
.bcuad{width:auto;padding:0 16px;height:52px;border-radius:14px;border:1px solid var(--sand);background:var(--papel);display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}

/* ── piezas comunes ── */
h1{font-family:'EB Garamond',Georgia,serif;font-weight:400;line-height:1.05}
.pc h1{font-size:46px;margin-top:6px}.tel h1{font-size:32px;margin-top:4px}
.sobre{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.sobre::before{content:"";width:32px;height:1px;background:var(--taupe)}
.bajada{color:var(--t80);font-size:14.5px;margin-top:6px}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:14px}
.cab{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.resumen{display:flex;border:1px solid var(--sand);background:var(--papel);border-radius:18px;padding:16px 6px;box-shadow:0 10px 30px -18px rgba(26,26,24,.25)}
.resumen>div{padding:0 22px;text-align:center}.resumen>div+div{border-left:1px solid var(--sand)}
.resumen .v{font-family:'EB Garamond',serif;font-size:38px;line-height:1.05}
.resumen .d{font-size:12.5px;color:var(--t80);display:flex;gap:5px;align-items:center;justify-content:center;margin-top:3px}
.franja{display:grid;grid-template-columns:1fr 1fr 1.2fr;padding:12px 2px;margin-top:14px}
.franja>div{padding:0 10px}.franja>div+div{border-left:1px solid var(--sand)}
.franja .v{font-family:'EB Garamond',serif;font-size:24px;line-height:1.1}
.franja .d{font-size:11.5px;color:var(--t65)}

.pildora{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-verde{background:rgba(72,96,63,.12);color:var(--verde)}.p-ambar{background:rgba(116,80,26,.12);color:var(--ambar)}
.p-pizarra{background:rgba(76,93,110,.12);color:var(--pizarra)}.p-rojo{background:rgba(184,65,45,.1);color:var(--rojo-p)}
.p-verde::before,.p-ambar::before,.p-pizarra::before,.p-rojo::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.buscador{display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 20px;border:1px solid var(--sand);background:var(--papel);border-radius:14px}
.buscador .ph{flex:1;color:var(--t50);font-size:15px}
.kbd{font-size:11px;border:1px solid var(--sand);border-radius:5px;padding:1px 7px;color:var(--t50);background:var(--hueso)}
.btn{height:40px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--tinta);color:var(--crema)}
.btn.caps{letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;font-weight:600}
.btn.sec{border:1px solid var(--sand);background:var(--papel)}
.btn.sutil{color:var(--taupe)}
.btn.rojo{background:var(--rojo);color:var(--crema)}
.acc-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.estado-caja{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t65)}

.sec-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:36px 0 16px}
.sec-cab h2{font-family:'EB Garamond',serif;font-weight:400;font-size:30px;line-height:1}
.tel .sec-cab{margin:26px 0 12px}.tel .sec-cab h2{font-size:24px}
.sec-cab p{font-size:13.5px;color:var(--t80);margin-top:4px}
.filtros{display:flex;gap:2px;background:var(--hueso);border-radius:12px;padding:3px}
.filtros button{padding:6px 12px;border-radius:9px;font-size:13.5px;color:var(--t80);white-space:nowrap}
.filtros button.on{background:var(--papel);color:var(--tinta);font-weight:600;box-shadow:0 1px 2px var(--t10)}
.filtros .n{color:var(--t50);margin-left:3px}.filtros .n.amb{color:var(--ambar);font-weight:600}
.tel .filtros{overflow-x:auto;scrollbar-width:none;width:100%}

/* línea de tiempo */
.dia{position:relative;padding-left:44px}
.dia::before{content:"";position:absolute;left:11px;top:22px;bottom:-6px;width:1px;background:var(--taupe);opacity:.6}
.dia:last-child::before{bottom:12px}
.dia .punto{position:absolute;left:3px;top:5px;width:17px;height:17px;border-radius:50%;border:1px solid var(--taupe);background:var(--crema);display:grid;place-items:center}
.dia .punto::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--taupe)}
.dia .fecha{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--taupe);margin-bottom:10px;padding-top:5px}
.dia+.dia{margin-top:22px}
.tel .dia{padding-left:26px}.tel .dia::before{left:7px}.tel .dia .punto{left:0;width:15px;height:15px}

.grilla{display:grid;gap:12px}
.pc .grilla.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pc .grilla.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* tarjeta A: toda tocable, con fotos */
.tA{display:block;padding:14px 16px;transition:border-color .2s,background .2s;position:relative;width:100%}
.tA:hover{border-color:var(--taupe);background:#fdfbf7}
.tA .l1{display:flex;align-items:baseline;gap:8px;font-size:13px}
.tA .l1 b{font-weight:600;white-space:nowrap}.tA .l2{font-size:12.5px;color:var(--t65);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tA .l1 .pl{margin-left:auto}
.tA .cli{display:inline-flex;align-items:center;gap:4px;color:var(--t80);border-bottom:1px dotted var(--t30)}
.tA .cli:hover{color:var(--tinta);border-color:var(--tinta)}
.tA .fotos{display:flex;gap:8px;margin-top:12px}
.foto{width:46px;height:58px;border-radius:8px;flex:none;position:relative;overflow:hidden;display:grid;place-items:end start}
.foto i{position:absolute;inset:0;opacity:.9}
.foto em{position:relative;font-style:normal;font-size:10px;font-weight:600;background:rgba(251,248,242,.92);border-radius:4px;padding:0 4px;margin:3px}
.foto.hecho::after{content:"Cambiada";position:absolute;inset:auto 0 0 0;background:rgba(26,26,24,.72);color:var(--crema);font-size:9px;text-align:center;padding:1px 0;letter-spacing:.04em}
.tA .prendas{font-size:12.5px;color:var(--t80);margin-left:4px;align-self:center;line-height:1.35}
.tA .l3{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--t10)}
.tA .tot{font-size:14px}
.tA .ir{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--tinta)}

/* tarjeta C: como hoy */
.tC{padding:18px 22px}
.tC .l1{font-size:13px}.tC .l1 b{font-weight:600}.tC .l1 span{color:var(--t65)}
.tC .l2{font-size:13px;color:var(--t65);margin-top:6px}
.tC .l3{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.tC .l3 .tot{font-size:15px}
.tC .l3 .btn{margin-left:auto;height:44px;padding:0 20px}

/* lista B */
.lista{overflow:hidden}
.lista .fh,.lista .fr{display:grid;grid-template-columns:78px 150px minmax(0,1fr) 150px 90px 128px 24px;gap:12px;align-items:center;padding:0 16px}
.lista .fh{height:38px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t65);border-bottom:1px solid var(--sand);background:var(--hueso)}
.lista .fr{min-height:58px;border-bottom:1px solid var(--t10);font-size:13px}
.lista .fr:hover{background:#fdfbf7}
.lista .fr:last-child{border-bottom:0}
.lista .dh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--taupe);padding:10px 16px 4px;background:var(--papel)}
.mini{display:flex;gap:4px}.mini .foto{width:26px;height:32px;border-radius:5px}.mini .foto em{display:none}
.tel .lista .fr{grid-template-columns:30px minmax(0,1fr) auto;padding:10px 12px;gap:10px}
.tel .lista .fr .foto{width:30px;height:38px;border-radius:6px}.mini .foto.hecho::after{content:"";height:4px;padding:0;background:var(--rojo)}
.tel .lista .fr .sub{font-size:12px;color:var(--t65)}

/* flujo */
.pasos{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--t65);flex-wrap:wrap}
.pasos .p{display:flex;align-items:center;gap:6px}
.pasos .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--t30);display:grid;place-items:center;font-size:11px;font-weight:600}
.pasos .p.ok .n{background:var(--verde);border-color:var(--verde);color:var(--crema)}
.pasos .p.act{color:var(--tinta);font-weight:600}.pasos .p.act .n{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.pasos .sep{width:22px;height:1px;background:var(--t30)}
.flujo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.bloque{padding:18px 20px}
.bloque h3{font-size:15px;font-weight:600}
.bloque .sub{font-size:13px;color:var(--t65)}
.prenda-sel{display:flex;gap:14px;align-items:center}
.prenda-sel .foto{width:64px;height:80px}
.opciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.talla{min-width:48px;height:44px;border-radius:10px;border:1px solid var(--sand);background:var(--papel);display:grid;place-items:center;font-weight:500;position:relative}
.talla.sel{border:2px solid var(--tinta)}
.talla.sin{color:var(--t50);background:var(--hueso)}
.talla.sin::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--t30);transform:rotate(-18deg)}
.color{width:44px;height:44px;border-radius:50%;border:1px solid var(--sand);display:grid;place-items:center}
.color i{width:32px;height:32px;border-radius:50%}
.color.sel{border:2px solid var(--tinta)}
.colnom{font-size:12px;color:var(--t65);margin-top:4px}
.falta{margin-top:16px;border:1px solid rgba(116,80,26,.35);background:rgba(116,80,26,.06);border-radius:12px;padding:14px 16px}
.falta .t{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;color:var(--ambar)}
.salidas{display:grid;gap:8px;margin-top:12px}
.salida{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--papel);border:1px solid var(--sand);border-radius:10px;width:100%}
.salida:hover{border-color:var(--taupe)}
.salida .ico{width:36px;height:36px;border-radius:10px;background:var(--hueso);display:grid;place-items:center;flex:none}
.salida .tx{flex:1;min-width:0}.salida .tx p:first-child{font-size:14px;font-weight:600}.salida .tx p+p{font-size:12.5px;color:var(--t65)}
.salida .mod{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-weight:600;flex:none}
.salida.prin{border-color:var(--tinta)}
.salida.prin .ico{background:var(--tinta);color:var(--crema)}
.resumen-lado .fila{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0}
.resumen-lado .fila+.fila{border-top:1px solid var(--t10)}
.resumen-lado .fila span:first-child{color:var(--t65)}
.otra{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--sand);font-size:13px;color:var(--taupe)}
.cliente-mini{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--hueso);border-radius:10px;margin-top:12px}
.avt{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px;flex:none}
.cliente-mini .tx{flex:1;font-size:13px;line-height:1.35}.cliente-mini .tx span{color:var(--t65);font-size:12px}

/* terminado */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px}
.hoja{width:min(520px,100%);background:var(--crema);border-radius:18px;padding:22px 22px 18px;animation:sube 380ms var(--ease) both;max-height:calc(100% - 40px);overflow:auto}
@keyframes sube{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hoja h2{font-family:'EB Garamond',serif;font-weight:400;font-size:28px;line-height:1.1}
.visto{width:44px;height:44px;border-radius:50%;background:var(--verde);color:var(--crema);display:grid;place-items:center;margin-bottom:10px}
.ticket{margin-top:14px;background:var(--papel);border:1px solid var(--sand);border-radius:12px;padding:14px 16px;font-size:13px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;left:-8px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--crema);border:1px solid var(--sand);transform:translateY(-50%);clip-path:inset(0 0 0 50%)}
.ticket::after{left:auto;right:-8px;clip-path:inset(0 50% 0 0)}
.ticket .lin{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.ticket .lin span:first-child{color:var(--t65)}
.ticket .corte{border-top:1px dashed var(--sand);margin:8px 0}
.ticket .pl{font-size:12px;color:var(--t65);margin-top:6px}
.acciones{display:grid;gap:8px;margin-top:16px}
.acciones.dos{grid-template-columns:1fr 1fr}
.acciones .btn{height:46px}
.velo-tel{position:absolute;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end}
.hoja-tel{width:100%;max-height:92%;overflow:auto;background:var(--crema);border-radius:20px 20px 0 0;padding:10px 16px 20px;animation:subeTel 420ms var(--ease) both}
.hoja-tel::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--t30);margin:0 auto 12px}
.hoja-tel h2{font-family:'EB Garamond',serif;font-weight:400;font-size:24px;line-height:1.1}
@keyframes subeTel{from{transform:translateY(100%)}to{transform:none}}

/* éxito de hoy (opción C) */
.exito-hoy{max-width:620px;margin:30px auto 0;text-align:center}
.exito-hoy .datos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;text-align:left}
.exito-hoy .datos>div{padding:12px 14px}

/* escáner */
.camara{position:absolute;inset:0;z-index:30;background:#141412;color:var(--crema);display:flex;flex-direction:column}
.camara .vista{flex:1;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#3a3630,#141412 70%)}
.camara .marco{width:250px;height:150px;border-radius:16px;position:relative}
.camara .marco::before{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:0 0 0 999px rgba(20,20,18,.55)}
.camara .marco i{position:absolute;width:28px;height:28px;border:3px solid var(--crema)}
.camara .marco i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.camara .marco i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.camara .marco i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.camara .marco i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.camara .laser{position:absolute;left:14px;right:14px;height:2px;background:var(--rojo);top:50%;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:18%}to{top:82%}}
.camara .etq{position:absolute;bottom:26%;left:0;right:0;text-align:center;font-size:14px}
.camara .pie{padding:14px 16px 22px;display:grid;gap:8px;background:#141412}
.camara .hallado{background:var(--crema);color:var(--tinta);border-radius:14px;padding:12px 14px;animation:subeTel 380ms var(--ease) both}
@media (prefers-reduced-motion:reduce){.hoja,.hoja-tel,.camara .hallado{animation:none}.camara .laser{animation:none}}

.marca{position:absolute;top:10px;right:10px;z-index:40;background:var(--rojo);color:var(--crema);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:6px}
.nota{background:var(--hueso);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--t80);margin-top:22px}
</style>
</head>
<body>

<div class="spk" id="spk"></div>

<div class="escena">
  <div>
    <p class="rot">Computadora · 1440 px</p>
    <div class="pc" id="pc"></div>
    <div class="porque" id="porque"></div>
    <div class="porque" id="otros" style="border-style:solid;border-color:var(--sand)"></div>
  </div>
  <div class="marco-tel">
    <p class="rot">Celular · 375 px (desplázalo por dentro)</p>
    <div class="tel" id="tel"></div>
  </div>
</div>

    <div class="l2"><span class="h">${v.h} · ${v.vend.split(' ')[0]}</span> · ${v.cli ? `<span class="cli">${ic('user','xs')}${v.cli}</span>` : `<span style="color:var(--t50)">Sin clienta</span>`}</div>

// ── otros sistemas (se llena con la investigación) ─────────────────────────────────────
const OTROS = `<p class="lbl" style="margin-bottom:6px">Así lo resuelven otros (investigación 2026-09-26 · fuentes en README.md)</p>
  <ul>
    <li><b>Shopify POS:</b> encuentra la compra <b>escaneando el ticket con la cámara</b> o por nombre de clienta. Marca cada artículo «Elegible / No elegible + motivo» (fuera de plazo). El botón principal dice el saldo: «Cobrar S/ X», «Reembolsar» o cambio par. → aquí: escáner real y «Quedan N días».</li>
    <li><b>Lightspeed:</b> si no hay la talla, hace un <b>pedido especial «entregar después»</b> más un traslado desde otra tienda, a nombre de la clienta. También exige clienta en toda devolución. → aquí: «Pedirla a AQP» y «Apartarla para Dani».</li>
    <li><b>Square for Retail:</b> todo en una transacción, también en el iPhone. La diferencia se cobra, queda par o se devuelve, <b>también como saldo en tarjeta regalo</b>.</li>
    <li><b>Bsale</b> (Chile/México): la diferencia a favor sale como <b>nota de crédito usable como pago</b> en una venta nueva (saldo a favor). → para CAYLA es la decisión de dinero pendiente, no de este spike.</li>
    <li><b>Loop:</b> <b>premia elegir cambio</b> en vez de reembolso con crédito extra. <b>Zara:</b> el cambio vale en cualquier tienda.</li>

function pintar(){

  const cuerpoPC = S.escena==='lista' ? listaPC() : S.escena==='falta' ? faltaPC() : (S.final==='C' ? finHoy(false) : faltaPC());
  document.getElementById('pc').innerHTML = `${lateral()}<div class="der"><div class="top"><button class="chipcab llano" style="padding:0">${ic('menu','s')}</button><span class="esp"></span><span class="chipcab llano">${ic('hist','s')}Actividad</span><span class="chipcab">Tienda TRU ${ic('abajo','xs')}</span></div>
    <div class="cuerpo"><div class="pag">${cuerpoPC}</div></div>${S.escena==='fin'&&S.final!=='C'?hojaFinal(false):''}</div>`;
  const cuerpoTel = S.escena==='lista' ? listaTel() : S.escena==='falta' ? faltaTel() : (S.final==='C' ? finHoy(true) : faltaTel());
  const fijo = fijoTel();
  document.getElementById('tel').innerHTML = `<div class="top">${ic('menu')}<img src="${LOGO}" alt=""><span class="esp"></span><span class="chipcab" style="height:30px">TRU ${ic('abajo','xs')}</span></div>
    <div class="cuerpo ${fijo?'':'sinfijo'}">${cuerpoTel}</div>${fijo}${S.escena==='fin'&&S.final!=='C'?hojaFinal(true):''}${camara()}`;
  document.getElementById('porque').innerHTML = PORQUE[S.escena]();
  document.getElementById('otros').innerHTML = OTROS;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-k],[data-ir],[data-cam],[data-cerrar]'); if(!b) return;
  if (b.dataset.k){ const v = b.dataset.v; S[b.dataset.k] = v==='true'?true:v==='false'?false:v; S.camara=0; }
  else if (b.dataset.ir){ S.escena = b.dataset.ir; S.camara = 0; document.querySelectorAll('.cuerpo').forEach(c=>c.scrollTop=0); }
  else if (b.dataset.cam){ S.camara = 1; pintar(); setTimeout(()=>{ if(S.camara===1){ S.camara=2; pintar(); } }, 1400); return; }
  else if (b.dataset.cerrar){ S.camara = S.camara===2 ? 1 : 0; if(S.camara===1) setTimeout(()=>{ if(S.camara===1){S.camara=2;pintar();} },1400); }
  pintar();
});
