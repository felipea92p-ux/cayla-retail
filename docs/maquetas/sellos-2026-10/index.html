<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo ▸ Sellos · maqueta v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA v3 · Catálogo ▸ Sellos (2026-10-22, noche)
   Felipe: «No me gusta ninguna (v2), elabora 3 más y cambia el diseño en general: sofisticado, elegante y con full animaciones».
   Se mantiene SOLO lo que eligió de la v1: cambiar de vista con las pestañas de vidrio de la «A».
   Tres direcciones: I · Editorial (la revista), II · Pases (la billetera), III · Pasarela (el escenario).
   Tokens de apps/web/app/globals.css y estilos/tema.css (ADR-0169 / ADR-0336). Sin rebote (las curvas no se pasan de 1).
   El único bucle es el punto que respira junto a «en tienda ahora»: es una señal de «está vivo» y, como todo bucle, lo aprueba
   Felipe (ADR-0136). Con prefers-reduced-motion todo aparece quieto y las cifras ya contadas.
   Datos REALES de producción del 2026-10-22 (sellos, fechas, %, prendas marcadas, unidades en tiendas, lo vendido, diseño web).
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t15:rgba(26,26,24,.15);--t08:rgba(26,26,24,.08);
--tinta-fija:#1a1a18;--crema-fija:#f5f0e8;--vidrio:rgba(255,255,255,.5);--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);
--ease:cubic-bezier(.32,.72,.24,1);--suave:cubic-bezier(.16,1,.3,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t15:rgba(245,240,232,.15);--t08:rgba(245,240,232,.08);
--vidrio:rgba(49,48,45,.6);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.m{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums lining-nums}
.g{font-family:'EB Garamond',serif}
.it{font-family:'EB Garamond',serif;font-style:italic}
.kick{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--t65)}

/* ---- el vocabulario del movimiento: entra una vez, sin rebote ---- */
.ap{opacity:0;transform:translateY(16px);transition:opacity .8s var(--suave),transform .9s var(--suave);transition-delay:calc(var(--i,0) * 70ms)}
.visto.ap,.visto .ap{opacity:1;transform:none}
.lin{display:block;overflow:hidden;padding-bottom:.08em}
.lin>span{display:block;transform:translateY(108%);transition:transform 1s var(--suave);transition-delay:calc(var(--i,0) * 90ms)}
.visto .lin>span,.visto.lin>span{transform:none}
.regla{height:1px;background:var(--t15);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--suave);transition-delay:calc(var(--i,0) * 80ms)}
.visto .regla,.visto.regla{transform:none}
.sello{position:relative;display:inline-block;flex:none;color:var(--a);opacity:0;transform:scale(1.35) rotate(calc(var(--giro,-5deg) - 14deg));transition:opacity .5s var(--suave),transform .7s var(--suave);transition-delay:calc(var(--i,0) * 70ms + 120ms)}
.sello svg{display:block;width:100%;height:100%;overflow:visible}
.sello::after{content:"";position:absolute;inset:-4%;border-radius:50%;border:2px solid currentColor;opacity:0;transform:scale(.7)}
.visto .sello,.visto.sello{opacity:1;transform:rotate(var(--giro,-5deg))}
.visto .sello::after{animation:tinta .9s var(--suave) both;animation-delay:calc(var(--i,0) * 70ms + 300ms)}
@keyframes tinta{0%{opacity:.45;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.sello .tx{font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;fill:currentColor}
.sello.apag{filter:grayscale(1);opacity:.55}
[data-estampa]:hover .sello{transform:rotate(0deg) scale(.95);transition-delay:0s}
.vivo{position:relative;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde)}
.vivo::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--verde);animation:respira 2.6s var(--ease) infinite}
@keyframes respira{0%{opacity:.7;transform:scale(.5)}70%,100%{opacity:0;transform:scale(1.5)}}
@keyframes sale{to{opacity:0;transform:translateY(10px)}}
.saliendo{animation:sale .2s var(--ease) forwards}
@keyframes funde{from{opacity:0;transform:translateY(10px)}}
.funde>*{animation:funde .7s var(--suave) both;animation-delay:calc(var(--i,0) * 60ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ap,.lin>span,.regla,.sello{opacity:1!important;transform:none!important}}

/* ---- barra de la maqueta (no es parte del diseño) ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.ley{max-width:1400px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ley button{text-align:left;background:var(--papel);border:1px solid var(--sand);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--t80);transition:border-color .2s,background .2s}
.ley button b{display:block;color:var(--tinta);font-size:13.5px;margin-bottom:2px}
.ley button.on{border-color:var(--tinta);background:var(--hueso)}
.escena{padding:14px 16px 60px}
.ajuste{margin:0 auto;position:relative}
.marco{position:absolute;top:0;left:0;transform-origin:top left;display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);background:var(--crema);border:1px solid var(--t30);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px var(--sombra)}

/* ---- el marco del ERP ---- */
.lat{grid-row:1/3;border-right:1px solid var(--sand);background:var(--crema);padding:18px 14px;overflow:auto;scrollbar-width:none}
.lat .logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:'EB Garamond',serif;font-size:22px;letter-spacing:.18em}
.lat .logo i{width:26px;height:26px;border-radius:50%;background:var(--rojo);display:inline-block}
.lat .gr{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;color:var(--t80);font-size:13.5px}
.lat .gr svg{width:20px;height:20px;stroke-width:1.5}
.lat .gr.ab{color:var(--tinta);font-weight:600}
.lat .hs{margin:2px 0 8px 20px;padding-left:12px;border-left:1px solid var(--sand)}
.lat .h{position:relative;display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--t65)}
.lat .h.on{background:var(--hueso);color:var(--tinta);font-weight:600}
.lat .h.on::before{content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--tinta)}
.lat .h .nuevo{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--verde)}
.cab{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 28px;border-bottom:1px solid var(--sand)}
.cab .p{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;color:var(--t80)}
.cab .av{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px}
.pant{overflow:auto;scrollbar-width:thin;container-type:inline-size;container-name:pant;scroll-behavior:smooth}
.pag{padding:28px 40px 90px}

/* ---- piezas del ERP ---- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .25s,transform .25s var(--suave),border-color .25s,box-shadow .25s}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--crema) 22%,transparent) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--suave)}
.btn:hover::before{transform:translateX(120%)}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px);box-shadow:0 10px 20px -12px var(--sombra)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.sut{background:var(--hueso);color:var(--tinta);border-color:transparent}.btn.sut:hover{background:var(--sand);color:var(--tinta)}
.btn.ch{height:34px;padding:0 13px;font-size:12.5px;border-radius:10px;gap:6px}
.btn svg.fl{transition:transform .3s var(--suave)}.btn:hover svg.fl{transform:translateX(4px)}
.voz-cab .btn{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.enl{position:relative;font-size:12.5px;color:var(--t80);font-weight:500}
.enl::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--t30);transform-origin:left;transition:background .3s,transform .4s var(--suave)}
.enl:hover{color:var(--rojo-p)}.enl:hover::after{background:var(--rojo);animation:hilo .5s var(--suave)}
@keyframes hilo{from{transform:scaleX(0)}}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}
.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.glo{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hueso);font-size:11px;font-weight:600;color:var(--t80);letter-spacing:0;font-variant-numeric:tabular-nums}

/* ---- cabecera (EncabezadoPagina) y pestañas de vidrio (las de la A) ---- */
.enc{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.enc-s{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.enc-s .hilo{width:34px;height:1px;background:var(--taupe);opacity:.6}.enc-s .t{color:var(--t65)}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:10px}
.enc p.fr{color:var(--t65);margin-top:6px;max-width:680px;font-size:14px}
.enc .acc{display:flex;gap:10px;flex-wrap:wrap}
.pest{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--vidrio);border:1px solid var(--t08);backdrop-filter:blur(22px)}
.pest .pi{position:absolute;top:4px;bottom:4px;left:0;border-radius:10px;background:var(--tinta);box-shadow:0 8px 18px -10px var(--sombra);transition:transform .45s var(--ease),width .45s var(--ease)}
.pest button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--t80);transition:color .3s}
.pest button.on{color:var(--crema)}
.pest button.on .glo{background:color-mix(in srgb,var(--crema) 20%,transparent);color:var(--crema)}
.pest button svg{width:16px;height:16px}

/* ---- la prenda (MosaicoPrenda) ---- */
.baldosa{position:relative;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--t08);transition:transform .6s var(--suave),box-shadow .4s}
.baldosa svg{width:36%;max-width:46px;height:auto;stroke-width:1.3;transition:transform .6s var(--suave)}
.baldosa:hover{transform:translateY(-4px)}.baldosa:hover svg{transform:scale(1.08)}
.baldosa .et{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;gap:6px;align-items:center;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--crema-fija) 90%,transparent);color:var(--tinta-fija);font-size:10.5px;line-height:1.25;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .45s var(--suave)}
.baldosa:hover .et,.baldosa.con-et .et{opacity:1;transform:none}
.baldosa .et b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.baldosa .u{position:absolute;right:8px;top:8px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--crema-fija) 90%,transparent);color:var(--tinta-fija)}
.baldosa.ago{opacity:.45}
.baldosa.con-et .u{display:none}
.vacio{position:relative;display:grid;place-items:center;text-align:center;padding:24px;min-height:220px}
.vacio .esq{position:absolute;width:22px;height:22px;border:0 solid var(--t50);transform:scale(0);transition:transform .8s var(--suave);transition-delay:calc(var(--i,0)*80ms + 200ms)}
.visto .vacio .esq,.vacio.visto .esq{transform:none}
.vacio .e1{top:0;left:0;border-top-width:1px;border-left-width:1px;transform-origin:top left}
.vacio .e2{top:0;right:0;border-top-width:1px;border-right-width:1px;transform-origin:top right}
.vacio .e3{bottom:0;left:0;border-bottom-width:1px;border-left-width:1px;transform-origin:bottom left}
.vacio .e4{bottom:0;right:0;border-bottom-width:1px;border-right-width:1px;transform-origin:bottom right}
.vacio .it{font-size:24px;color:var(--tinta);line-height:1.2}
.vacio p{font-size:12.5px;color:var(--t65);max-width:34ch;margin:6px auto 14px}

/* ===== I · Editorial ===== */
.portada{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:26px;border-top:1px solid var(--t15);border-bottom:1px solid var(--t15)}
@container pant (max-width: 1000px){.portada{grid-template-columns:1fr}.portada .pagina+.pagina{border-left:0!important;border-top:1px solid var(--t15)}}
.pagina{padding:30px 34px 32px;position:relative;display:flex;flex-direction:column;gap:18px}
.pagina:first-child{padding-left:0}.pagina:last-child{padding-right:0}
.pagina+.pagina{border-left:1px solid var(--t15)}
.titular{font-family:'EB Garamond',serif;font-weight:400;font-size:64px;line-height:.95;letter-spacing:-.015em}
.deck{font-family:'EB Garamond',serif;font-style:italic;font-size:21px;line-height:1.3;color:var(--t65);max-width:32ch}
.cuenta{display:flex;align-items:flex-end;gap:16px}
.cuenta b{font-family:'EB Garamond',serif;font-weight:400;font-size:118px;line-height:.78;letter-spacing:-.03em}
.cuenta>span{padding-bottom:6px;font-size:12.5px;color:var(--t65);line-height:1.45}
.cuenta>span strong{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--tinta)}
.collage{display:grid;grid-template-columns:1.55fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:300px}
.collage .baldosa:first-child{grid-row:span 2}
.collage .baldosa{height:100%}
.collage .mas{border-radius:12px;background:var(--hueso);display:grid;place-items:center;text-align:center;color:var(--t65);font-size:12.5px;transition:background .3s}
.collage .mas b{display:block;font-family:'EB Garamond',serif;font-weight:400;font-size:34px;color:var(--tinta);line-height:1}
.collage .mas:hover{background:var(--sand)}
.datos{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--t15)}
.datos div{padding:12px 0 0;font-size:11.5px;color:var(--t65)}
.datos strong{display:block;font-family:'EB Garamond',serif;font-weight:400;font-size:32px;line-height:1.1;color:var(--tinta)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.seccion{display:flex;align-items:baseline;gap:14px;margin:46px 0 4px}
.seccion h2{font-family:'EB Garamond',serif;font-weight:400;font-size:30px;letter-spacing:-.01em}
.seccion .it{font-size:17px;color:var(--t65)}
.prox{border-top:1px solid var(--t15)}
.fila{position:relative;border-bottom:1px solid var(--t15);cursor:pointer}
.fila .lin-f{display:grid;grid-template-columns:130px minmax(0,1fr) 230px 190px 24px;gap:20px;align-items:center;padding:20px 0}
.fila .n{font-family:'EB Garamond',serif;font-weight:400;font-size:64px;line-height:.8;letter-spacing:-.02em;transition:transform .6s var(--suave)}
.fila .n small{font-family:'DM Sans';font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--t65);margin-left:6px;vertical-align:top}
.fila h3{font-family:'EB Garamond',serif;font-weight:400;font-size:30px;line-height:1.05;transition:transform .6s var(--suave)}
.fila .fecha{font-family:'EB Garamond',serif;font-style:italic;font-size:16px;color:var(--t65)}
.fila .flecha{color:var(--t50);transition:transform .5s var(--suave),color .3s}
.fila::before{content:"";position:absolute;inset:0 -16px;border-radius:14px;background:var(--papel);opacity:0;transition:opacity .4s}
.fila>*{position:relative}
.fila:hover::before,.fila.ab::before{opacity:1}
.fila:hover .n{transform:translateX(8px)}.fila:hover h3{transform:translateX(4px)}
.fila:hover .flecha,.fila.ab .flecha{color:var(--tinta);transform:rotate(90deg)}
.cajon{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--suave)}
.fila.ab .cajon{grid-template-rows:1fr}
.cajon>div{overflow:hidden}
.tira{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:0 0 22px 150px}
.tira .baldosa{aspect-ratio:4/5}
.fila.ab .tira .baldosa{animation:funde .7s var(--suave) both;animation-delay:calc(var(--i,0) * 50ms + 150ms)}
.tira-vacia{padding:0 0 22px 150px;display:flex;align-items:center;gap:14px;color:var(--t65);font-size:13px}
.indice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px;margin-top:14px}
@container pant (max-width: 1000px){.indice{grid-template-columns:1fr}}
.ent{display:flex;align-items:baseline;gap:12px;padding:11px 0}
.ent .g{font-size:19px;white-space:nowrap}
.ent .punteo{flex:1;height:1px;border-bottom:1px dotted var(--t30);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--suave);transition-delay:calc(var(--i,0)*60ms + 200ms)}
.visto .ent .punteo,.ent.visto .punteo{transform:none}
.ent .cap{white-space:nowrap}
.ed-sello{border-bottom:1px solid var(--t15);padding:26px 0}
.ed-sello .top{display:grid;grid-template-columns:110px minmax(0,1fr) 170px auto;gap:24px;align-items:center}
.ed-sello h3{font-family:'EB Garamond',serif;font-weight:400;font-size:40px;line-height:1}

<script>
/* ============================ datos (producción, 2026-10-22) ============================ */

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const S = [
  ["aniv","Aniversario CAYLA","campana","2026-10-01","2026-10-25",10,0,[],"estrella",0,0,"programado"],
  ["hall","Halloween","campana","2026-09-15","2026-10-31",null,47,["Maquillaje"],"calabaza",167,23],
  ["gato","Día Internacional del Gato","campana","2026-10-24","2026-10-30",null,4,[],"gato",8,0],
  ["bf","Black Friday","campana","2026-11-09","2026-11-30",null,0,[],"bolsa",0,0],
  ["nav","Navidad","campana","2026-12-11","2026-12-25",null,0,[],"arbol",0,0],

  ["ult","Últimas unidades","urgencia","2026-09-01","2027-01-31",null,2,[],"reloj",1,2],
  ["liq","Para liquidar","urgencia","2026-09-01","2026-12-31",20,0,[],"porciento",0,0],
  ["mano","Hecho a mano","positivo",null,null,null,0,[],"aguja",0,0],
  ["unica","Pieza única","positivo",null,null,null,0,[],"diamante",0,0],
  ["reed","Reedición","positivo",null,null,null,7,[],"vuelta",9,3],
  ["estreno","Estreno","neutral",null,null,null,13,[],"estrellita",5,20],

].map(([id,n,g,d,h,pct,prendas,cats,ic,u,vend,web=null,activo=true])=>({id,n,g,d,h,pct,prendas,cats,ic,u,vend,web,activo}));
const P = {
  hall:[["Pañoleta Delgada",null,"BUF",67],["Tatuaje Falso Heridas","#BD332D","ACC",20],["Stickers Brillos","#f5f5f4","ACC",6],["Collares Estilo Gargantilla","#2D2C2F","ACC",6],["Tiaras Princesa","#B8BCC0","ACC",5],["Antifaz Encaje","#2D2C2F","ACC",4],["Antifaz Encaje","#ffffff","ACC",4],["Orejas Leopardo Aterciopelado","#B0885B","ACC",3],["Medias con Lazo de Red","#ffffff","ACC",3],["Guantes Encaje","#2D2C2F","ACC",3],["Polvo de Hada","#BCA4CB","MAQ",1],["Pañoleta Pirata","#EB3C27","BUF",1]],
  gato:[["Adelle Wide Leg","#2A304E","JEA",7],["Adelle Wide Leg","#A9CADA","JEA",1],["Blusa Crop Manga Larga","#4B342F","CMS",0],["Blusa de Rayas Diplomáticas","#2D2C2F","CMS",0]],
  nuevo:[["Chaleco Cayla","#ece2c6","CHA",14],["Chaleco Cayla","#2D2C2F","CHA",13],["Chaleco Cayla","#ffffff","CHA",12],["Chaleco Cayla","#4B342F","CHA",11],["Chaleco Cayla","#F7D1D1","CHA",11],["Pantalón Cayla con Vena","#48464A","PAN",8],["Short Sastre Cayla","#F0A1BF","SHO",6],["Top Verónica Floreado","#A9CADA","TOP",5],["Crop Cuello Camisero","#ffffff","POL",5],["Body Sonali","#4B342F","BOD",4],["Body Amir","#82776B","BOD",4],["Capa Larga Encaje","#4B342F","CAP",1]],
  top:[["Adelle Wide Leg","#2A304E","JEA",7],["Camisa Lara","#D5BA98","CMS",2],["Camisa Lara","#48464A","CMS",2],["Adelle Wide Leg","#A9CADA","JEA",1],["Camisa Lara","#A9CADA","CMS",0],["Camisa Lara","#F0A1BF","CMS",0]],
  ult:[["Wide Leg","#A9CADA","JEA",1],["Wide Leg","#5979A2","JEA",0]],

  estreno:[["Top Rib","#ffffff","TOP",3],["Top Rib","#694833","TOP",1],["Top Rib","#4B342F","TOP",1],["Top Rib","#F0A1BF","TOP",0],["Top Rib","#F2E6B1","TOP",0],["Blusa Encaje","#F0C05A","CMS",0],["Blusa Encaje","#D5BA98","CMS",0],["Blusa Encaje","#ffffff","CMS",0],["Blusa Encaje","#2D2C2F","CMS",0],["Blusa Encaje","#6C2831","CMS",0]],
  sorteo:[["Blusa con Lazo","#F3ECE0","CMS",1]],
};

/* ============================ reglas (las de lib/sellos-campanas.ts y lib/etiqueta-campana.ts) ============================ */
const dia = (f)=>new Date(f+"T12:00:00");
const dias = (a,b)=>Math.round((dia(b)-dia(a))/864e5);
const fc = (f)=>{const x=dia(f);return `${x.getDate()} ${MESES[x.getMonth()]}`};
const fl = (f)=>{const x=dia(f);return `${DIAS_L[x.getDay()]} ${x.getDate()} de ${MESES_L[x.getMonth()]}`};
const rango = (s)=>!s.d&&!s.h?null:`${s.d?fc(s.d):"…"} – ${s.h?fc(s.h):"…"}${s.h&&s.h.slice(0,4)!==HOY.slice(0,4)?" "+s.h.slice(0,4):""}`;
function tramo(s){ if(!s.d&&!s.h) return "sin_fechas"; if(s.d&&HOY<s.d) return "proximas"; if(s.h&&HOY>s.h) return "pasaron"; return "ahora"; }
const alcance = (s)=>s.prendas + s.cats.length;
const deVista = (v)=>S.filter(s=>GRUPOS[s.g].vista===v && s.activo);
const camp = ()=>deVista("campanas");
const ahora = ()=>camp().filter(s=>tramo(s)==="ahora").sort((a,b)=>a.h.localeCompare(b.h));
const proximas = ()=>camp().filter(s=>tramo(s)==="proximas").sort((a,b)=>a.d.localeCompare(b.d));
const pasadas = ()=>camp().filter(s=>tramo(s)==="pasaron").sort((a,b)=>a.d.localeCompare(b.d));
const sinFechas = ()=>camp().filter(s=>tramo(s)==="sin_fechas");
const plural = (n,a,b)=>`${n.toLocaleString("es-PE")} ${n===1?a:b}`;
const quedan = (s)=>dias(HOY,s.h), faltan = (s)=>dias(HOY,s.d);
// La frase de la campaña, en lenguaje de tienda (sale de sus datos, no promete nada que la base no diga).
function frase(s){
  const t = tramo(s), cats = s.cats.length ? ` y toda ${s.cats.join(", ")}` : "";
  if(s.g!=="campana") return alcance(s) ? `${plural(s.prendas,"prenda","prendas")} · ${s.u} en las tiendas.` : "Ninguna prenda lo lleva todavía.";
  if(t==="ahora") return alcance(s) ? `${plural(s.prendas,"prenda","prendas")}${cats}${s.pct?`, con ${s.pct} % menos.`:", a su precio de siempre."}` : `${s.pct?`Un ${s.pct} % que`:"Una campaña que"} todavía no llega a ninguna prenda.`;
  if(t==="proximas") return alcance(s) ? `${plural(s.prendas,"prenda lista","prendas listas")} para el ${DIAS_L[dia(s.d).getDay()]}.` : "Todavía sin prendas.";
  if(t==="pasaron") return `Pasó el ${fc(s.h)}.`;
  if(t==="sin_fechas" && s.g==="campana") return "Sin fechas todavía.";
  return alcance(s) ? `${plural(s.prendas,"prenda","prendas")} · ${s.u} en las tiendas.` : "Ninguna prenda lo lleva todavía.";
}
function listo(s){
  const l = [{k:"Fechas",ok:!!(s.d&&s.h),det:rango(s)||"sin fechas"},{k:"Prendas",ok:alcance(s)>0,det:alcance(s)?`${plural(s.prendas,"prenda","prendas")}${s.cats.length?` + ${s.cats.join(", ")}`:""}`:"ninguna todavía"},{k:"Descuento",ok:s.pct!==null,op:true,det:s.pct!==null?`${s.pct} %`:"sin descuento"}];
  if(s.pct!==null) l.push({k:"Diseño en la tienda web",ok:!!s.web,op:true,det:s.web?"programado":"sin armar"});
  return l;
}

let uid = 0;
// El sello de tinta: se ESTAMPA al aparecer (baja, gira a su lugar y deja un anillo de tinta que se abre).
function sello(s, tam=72, giro=-6, i=0){
  const id = "a"+(++uid), color = GRUPOS[s.g].color;
  if(tam < 56) return `<span class="sello ${s.activo?"":"apag"}" style="--a:${color};--giro:${giro}deg;--i:${i};width:${tam}px;height:${tam}px" role="img" aria-label="Sello ${s.n}"><svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="color-mix(in srgb, currentColor 10%, var(--papel))" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.5 3.5" opacity=".7"/>
      <g transform="translate(50 50) scale(1.85)">${D[s.ic]||D.estrellita}</g></svg></span>`;
  const abajo = s.g==="campana" ? (s.d ? s.d.slice(0,4) : "CAYLA") : GRUPOS[s.g].nombre;
  return `<span class="sello ${s.activo?"":"apag"}" style="--a:${color};--giro:${giro}deg;--i:${i};width:${tam}px;height:${tam}px" role="img" aria-label="Sello ${s.n}"><svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="${id}t" d="M 13 50 A 37 37 0 0 1 87 50"/><path id="${id}b" d="M 10 52 A 40 40 0 0 0 90 52"/></defs>
      <circle cx="50" cy="50" r="47" fill="color-mix(in srgb, currentColor 9%, var(--papel))" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 2.2" opacity=".8"/>
      <text class="tx" font-size="${s.n.length>15?8:9.6}"><textPath href="#${id}t" startOffset="50%" text-anchor="middle" ${s.n.length>19?'textLength="112" lengthAdjust="spacingAndGlyphs"':""}>${s.n}</textPath></text>
      <text class="tx" font-size="7" opacity=".75"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">★ ${abajo} ★</textPath></text>
      <g transform="translate(50 52) scale(1.25)">${D[s.ic]||D.estrellita}</g></svg></span>`;
}
const vacio = (s, texto="Esta página todavía no tiene prendas")=>`<div class="vacio"><i class="esq e1"></i><i class="esq e2"></i><i class="esq e3"></i><i class="esq e4"></i>

function acciones(s){
  const t = tramo(s);

    <button class="btn sut ch" data-toast="Abre la hoja de ${s.n}">${t==="pasaron"?"Repetir en 2027":"Configurar"}</button>
    ${s.pct!==null&&t==="ahora"?`<button class="btn sec ch" data-toast="Imprime sus etiquetas de precio">${ic("impresora","s")} Etiquetas de precio</button>`:""}
    ${s.g==="campana"&&s.pct!==null?`<button class="btn sec ch" data-toast="Lleva a su diseño en Tienda web ▸ Campañas">Diseño web ${ic("flecha","fl s")}</button>`:""}`;
}
const kicker = (s)=>{
  const t = tramo(s);
  if(t==="ahora") return `<span class="vivo"></span>En tienda · hasta el ${fl(s.h)}`;
  if(t==="proximas") return `Empieza el ${fl(s.d)}`;
  if(t==="pasaron") return `Pasó el ${fc(s.h)}`;
  if(s.g==="campana") return "Sin fechas";
  return GRUPOS[s.g].nombre;
};

function paginaEditorial(s, i){
  const l = P[s.id]||[], t = tramo(s);

    ? `<div class="collage">${l.slice(0,4).map((p,j)=>baldosa(p,{i:j+i*2,cls:"ap",etiqueta:j===0})).join("")}${s.prendas>4?`<button class="mas ap" style="--i:${5+i*2}" data-toast="Abre «Prendas» de ${s.n}"><span><b class="num">+${s.prendas-4}</b>prendas más</span></button>`:""}</div>`
    : vacio(s);
  return `<article class="pagina ap" style="--i:${i}" data-estampa>
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
      <div><div class="kick">${kicker(s)}</div>
        <h2 class="titular" style="margin-top:14px"><span class="lin" style="--i:${i*2+1}"><span>${s.n}</span></span></h2>

}

        <div style="display:flex;flex-direction:column;gap:6px">${acciones(s)}</div></div>
      ${pr.length?`<div class="tira">${pr.slice(0,9).map((p,j)=>baldosa(p,{i:j,cls:"ap"})).join("")}</div>`:`<div style="padding:16px 0 0 134px" class="it"><span style="font-size:19px;color:var(--t65)">Ninguna prenda lo lleva todavía.</span></div>`}
    </article>`;}).join("")}</div>`;
}

/* ============================ II · Pases ============================ */
function pase(s, cls, i){
  const t = tramo(s), ab = estado.pase===s.id;
  const der = t==="ahora"?`${quedan(s)}<br><small>días</small>`:t==="proximas"?`${faltan(s)}<br><small>faltan</small>`:t==="pasaron"?`<small>${fc(s.h)}</small>`:s.g==="campana"?`<small>sin fechas</small>`:`${s.vend}<br><small>en 30 d</small>`;
  const tot = s.d&&s.h ? dias(s.d,s.h) : 1, ya = s.d&&s.h ? Math.max(0,Math.min(tot,dias(s.d,HOY))) : 0, p = ya/tot;
  return `<article class="pase ${cls} ${ab?"ab":""} ap" style="--i:${i};--a:${GRUPOS[s.g].color}" data-pase="${s.id}" data-estampa>
    <div class="cab-p">${sello(s,44,0,i)}<div style="min-width:0"><h4>${s.n}</h4><small>${t==="ahora"?`<span class="vivo" style="margin-right:6px"></span>hasta el ${fl(s.h)}`:t==="proximas"?fl(s.d):t==="pasaron"?rango(s):s.g==="campana"?"ponle cuándo rige":frase(s)}</small></div><div class="der num">${der}</div></div>
    <div class="cuerpo"><div><div class="perfo"></div><div class="dentro">
      ${t==="ahora"||t==="proximas"?`<div class="grande"><b class="num">${t==="ahora"?quedan(s):faltan(s)}</b><span>${t==="ahora"?`días para que termine`:`días para que empiece`}</span></div>`:""}
      ${t==="ahora"?`<div><div class="recorrido" style="--p:${p};--pp:${p*100}%"><span class="riel"></span><span class="hecho" style="width:100%"></span><span class="hoy"></span></div><div class="recorrido-l num"><span>${fc(s.d)}</span><span>hoy, día ${ya+1} de ${tot+1}</span><span>${fc(s.h)}</span></div></div>`:""}
      <div class="mini-datos"><div><strong class="num">${s.vend}</strong>${s.g==="campana"?"vendidas":"vendidas en 30 d"}</div><div><strong class="num">${s.u}</strong>en las tiendas</div><div><strong class="num">${s.pct!==null?s.pct+" %":"—"}</strong>descuento</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${acciones(s)}</div>
    </div></div></div>
  </article>`;
}
function detallePase(){
  const s = S.find(x=>x.id===estado.pase); if(!s) return "";
  const l = P[s.id]||[];
  return `<div class="funde">
    <div class="kick" style="--i:0">${kicker(s)}</div>
    <h2 class="titular" style="--i:1;margin-top:12px">${s.n}</h2>
    <p class="deck" style="--i:2;margin-top:10px">${frase(s)}</p>
    ${l.length?`<div class="lookbook" style="--i:3">${l.slice(0,11).map((p,j)=>baldosa(p,{i:j,style:`animation:funde .7s var(--suave) both;animation-delay:${200+j*55}ms`})).join("")}${s.prendas>11?`<button class="baldosa" style="background:var(--hueso);color:var(--t65);aspect-ratio:4/5" data-toast="Abre «Prendas» de ${s.n}"><span><b class="g num" style="display:block;font-size:30px;font-weight:400;color:var(--tinta)">+${s.prendas-11}</b>más</span></button>`:""}</div>`
      : `<div style="--i:3;margin-top:22px">${vacio(s, s.g==="campana"?"Esta campaña todavía no tiene prendas":"Ninguna prenda lleva este sello").replace('class="vacio"','class="vacio visto"')}</div>`}
    ${s.g==="campana"?`<div class="lista-lista" style="--i:4"><div class="cap" style="padding:14px 0 6px">Lo que ya tiene</div>${listo(s).map((x,j)=>`<div class="it-l ${x.ok?"ok":x.op?"op":"no"}" style="--i:${j}"><span class="c"><svg class="ic s" viewBox="0 0 24 24"><path d="${x.ok?"M6 12.5l4 4L18 8.5":x.op?"M8 12h8":"M12 7v6M12 16.5v.1"}"/></svg></span><span>${x.k}</span><span class="der" style="color:var(--t65);font-size:12.5px">${x.det}</span></div>`).join("")}</div>`:""}
  </div>`;
}
function vista2(){
  const v = vistaAct();
  let grupos;
  if(v.clave==="campanas"){
    if(!estado.pase || !camp().some(s=>s.id===estado.pase)) estado.pase = ahora()[0]?.id;
    let i = 0;
    grupos = [["Rigen hoy",ahora(),"viva"],["Lo que viene",proximas(),"prox"],["Guardadas",[...sinFechas(),...pasadas()],"guard"]]
      .map(([t,l,c])=>`<div class="grupo-pases"><div class="kick">${t} · ${l.length}</div>${l.map(s=>pase(s,c,i++)).join("")}</div>`).join("");
  } else {
    const l = deVista(v.clave);
    if(!estado.pase || !l.some(s=>s.id===estado.pase)) estado.pase = l[0]?.id;
    grupos = `<div class="grupo-pases"><div class="kick">${v.nombre} · ${l.length}</div>${l.map((s,i)=>pase(s,"",i)).join("")}</div>`;
  }
  return `${v.frase?`<p class="deck ap" style="margin-top:22px;max-width:60ch">${v.frase}</p>`:""}
    <div class="bill"><div id="pila">${grupos}</div><aside class="detalle" id="detalle">${detallePase()}</aside></div>`;
}

/* ============================ III · Pasarela ============================ */
function listaPasarela(){
  const v = vistaAct();
  return v.clave==="campanas" ? [...pasadas(), ...ahora().slice().sort((a,b)=>a.d.localeCompare(b.d)), ...proximas(), ...sinFechas()] : deVista(v.clave);
}
function tarjetaPasarela(s, k, i){
  const l = P[s.id]||[], ab = Math.abs(k), t = tramo(s), n = Math.min(l.length,5);
  const abanico = l.length ? l.slice(0,5).map((p,j)=>{const jj=j-(n-1)/2;return baldosa(p,{style:`--j:${jj};--aj:${Math.abs(jj)}`});}).join("") : `<div class="sin">${s.g==="campana"&&t!=="pasaron"?"Todavía sin prendas":"Sin prendas"}</div>`;
  return `<article class="pc ${k===0?"foco visto":""} ${t==="ahora"?"viva":""}" data-ir="${i}" style="--k:${k};--e:${1-Math.min(ab,3)*.13};--o:${ab>3?0:1-ab*.24};--z:${20-ab}">
    <div class="kick">${s.g==="campana"?kicker(s):`${GRUPOS[s.g].nombre}${s.pct!==null?` · ${s.pct} %`:""}`}</div>
    ${sello(s,96,-6,0)}
    <h3>${s.n}</h3>
    <div class="it">${t==="ahora"?`quedan ${quedan(s)} días`:t==="proximas"?`en ${faltan(s)} días`:t==="pasaron"?rango(s):s.g==="campana"?"sin fechas":`${s.vend} vendidas en 30 días`}</div>
    <div class="abanico">${abanico}</div>
  </article>`;
}
function detallePasarela(s){
  const l = P[s.id]||[], t = tramo(s);
  return `<div class="pas-det funde" id="pasdet">
    <div style="--i:0"><div class="kick">${kicker(s)}</div><h2 class="titular" style="margin-top:12px">${s.n}</h2><p class="deck" style="margin-top:8px">${frase(s)}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">${acciones(s)}</div></div>
    <div style="--i:1"><div class="datos" style="grid-template-columns:1fr 1fr">${t==="ahora"?`<div><strong>${cuenta(quedan(s))}</strong>días para que termine</div>`:t==="proximas"?`<div><strong>${cuenta(faltan(s))}</strong>días para que empiece</div>`:`<div><strong>${cuenta(s.prendas)}</strong>prendas</div>`}<div><strong>${cuenta(s.vend)}</strong>${s.g==="campana"?"vendidas":"vendidas en 30 días"}</div><div><strong>${cuenta(s.u)}</strong>unidades en las tiendas</div><div><strong>${s.pct!==null?cuenta(s.pct," %"):"—"}</strong>descuento</div></div></div>
    <div style="--i:2">${s.g==="campana"&&t!=="pasaron"?`<div class="lista-lista" style="margin-top:0">${listo(s).map((x,j)=>`<div class="it-l ${x.ok?"ok":x.op?"op":"no"}" style="--i:${j}"><span class="c"><svg class="ic s" viewBox="0 0 24 24"><path d="${x.ok?"M6 12.5l4 4L18 8.5":x.op?"M8 12h8":"M12 7v6M12 16.5v.1"}"/></svg></span><span>${x.k}</span><span class="der" style="color:var(--t65);font-size:12.5px">${x.det}</span></div>`).join("")}</div>`:`<p class="it" style="font-size:18px;color:var(--t65)">${t==="pasaron"?"«Repetir en 2027» la vuelve a armar con las mismas prendas y fechas del próximo año.":"Sus prendas, abajo."}</p>`}</div>
    ${l.length?`<div class="lookbook" style="--i:3">${l.map((p,j)=>baldosa(p,{i:j,style:`animation:funde .7s var(--suave) both;animation-delay:${250+j*45}ms`})).join("")}</div>`:""}
  </div>`;
}
function vista3(){
  const v = vistaAct(), l = listaPasarela();
  if(estado.foco===null || estado.foco>=l.length) estado.foco = v.clave==="campanas" ? l.indexOf(ahora()[0]) : 0;
  const f = estado.foco;
  return `${v.frase?`<p class="deck ap" style="margin-top:22px;max-width:60ch">${v.frase}</p>`:""}
    <div class="pasarela ap" id="pasarela" tabindex="0" aria-label="Pasarela de ${v.nombre.toLowerCase()}: usa las flechas">
      ${l.map((s,i)=>tarjetaPasarela(s,i-f,i)).join("")}
      <button class="nav-p izq" data-mover="-1" ${f===0?"disabled":""} aria-label="Anterior">${ic("izq")}</button>
      <button class="nav-p der" data-mover="1" ${f===l.length-1?"disabled":""} aria-label="Siguiente">${ic("der")}</button>
    </div>
    <div class="puntos ap">${l.map((s,i)=>`<button class="${i===f?"on":""} ${tramo(s)==="ahora"&&s.g==="campana"?"viva":""}" data-ir="${i}" aria-label="${s.n}"></button>`).join("")}</div>
    ${v.clave==="campanas"?`<div class="leyenda-p ap"><span>${ic("izq","s")} ya pasaron</span><span><span class="vivo"></span> en tienda ahora</span><span>lo que viene ${ic("der","s")}</span></div>`:""}
    <div id="detP">${detallePasarela(l[f])}</div>`;
}
function moverPasarela(nuevo){
  const l = listaPasarela(); nuevo = Math.max(0,Math.min(l.length-1,nuevo)); if(nuevo===estado.foco) return;
  estado.foco = nuevo;
  document.querySelectorAll("#pasarela .pc").forEach((c,i)=>{const k=i-nuevo, a=Math.abs(k);
    c.style.setProperty("--k",k); c.style.setProperty("--e",1-Math.min(a,3)*.13); c.style.setProperty("--o",a>3?0:1-a*.24); c.style.setProperty("--z",20-a);
    c.classList.toggle("foco",k===0); if(k===0){c.classList.remove("visto"); void c.offsetWidth; c.classList.add("visto");}});
  document.querySelectorAll(".puntos button").forEach((b,i)=>b.classList.toggle("on",i===nuevo));
  document.querySelector('[data-mover="-1"]').disabled = nuevo===0; document.querySelector('[data-mover="1"]').disabled = nuevo===l.length-1;
  document.getElementById("detP").innerHTML = detallePasarela(l[nuevo]); contar(document.getElementById("detP"));
}

/* ============================ pintar y animar ============================ */
const marco = document.getElementById("marco"), ajuste = document.getElementById("ajuste");
const ALTOS = {1024:768,1440:900,1920:1080};
let obs;
function pintar({conservar=false}={}){
  const viejo = marco.querySelector(".pant"), y = conservar && viejo ? viejo.scrollTop : 0;
  uid = 0;
  marco.innerHTML = `<aside class="lat">${lateral()}</aside><div class="cab"><span class="p">Actividad</span><span class="p">◐ Tema</span><span class="p">Tienda TRU ${ic("chevron","s")}</span><span class="av">FA</span></div>
    <main class="pant"><div class="pag">${encabezado()}<div id="vista">${({1:vista1,2:vista2,3:vista3})[estado.dir]()}</div></div></main>`;
  const pant = marco.querySelector(".pant"); pant.style.scrollBehavior="auto"; pant.scrollTop = y; pant.style.scrollBehavior="";
  medir(); moverPildora(); observar();
}
function pintarVista(){
  const v = document.getElementById("vista");
  v.classList.add("saliendo");
  setTimeout(()=>{ uid = 100; v.classList.remove("saliendo"); v.innerHTML = ({1:vista1,2:vista2,3:vista3})[estado.dir](); observar(); }, 200);
}
function observar(){
  obs?.disconnect();
  const pant = marco.querySelector(".pant");
  obs = new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("visto"); contar(e.target); obs.unobserve(e.target); } }),{root:pant,threshold:.12});
  requestAnimationFrame(()=>marco.querySelectorAll(".ap,.regla,.vacio,.ent,.visto-pronto").forEach(el=>obs.observe(el)));
}
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
function contar(raiz){
  raiz.querySelectorAll("[data-n]:not([data-hecho])").forEach(el=>{
    el.dataset.hecho = 1; const fin = +el.dataset.n, suf = el.dataset.suf||"";
    if(reducir || fin===0){ el.textContent = fin.toLocaleString("es-PE")+suf; return; }
    const t0 = performance.now(), dur = 1100;
    const paso = (t)=>{ const x = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-x,4); el.textContent = Math.round(fin*e).toLocaleString("es-PE")+suf; if(x<1) requestAnimationFrame(paso); };
    el.textContent = "0"+suf; requestAnimationFrame(paso);
  });
}
function medir(){
  const W = estado.ancho, H = ALTOS[W], k = Math.min(1, Math.min(window.innerWidth - 32, 1600) / W);
  marco.style.width = W+"px"; marco.style.height = H+"px"; marco.style.transform = `scale(${k})`;
  ajuste.style.width = W*k+"px"; ajuste.style.height = H*k+"px";
}
function moverPildora(){
  const p = document.getElementById("pest"); if(!p) return;
  const on = p.querySelector("button.on"), pi = document.getElementById("pi");
  pi.style.width = on.offsetWidth+"px"; pi.style.transform = `translateX(${on.offsetLeft-4}px)`;
}
let tt;
function toast(t){
  document.querySelector(".toast")?.remove(); clearTimeout(tt);
  const d = document.createElement("div"); d.className="toast"; d.innerHTML = `<b style="color:var(--tinta)">En la maqueta no se guarda nada.</b><br>${t}.`;
  document.body.appendChild(d); tt = setTimeout(()=>d.remove(), 3200);
}
document.addEventListener("click",(e)=>{
  const ts = e.target.closest("[data-toast]"); if(ts){ toast(ts.dataset.toast); return; }
  const vb = e.target.closest("[data-vista]");
  if(vb){ if(vb.dataset.vista===estado.vista) return; estado.vista = vb.dataset.vista; estado.foco = null; estado.pase = null; estado.abiertaFila = null;
    document.querySelectorAll("#pest button").forEach(b=>{b.classList.toggle("on",b===vb); b.setAttribute("aria-selected",b===vb);}); moverPildora();
    const acc = document.querySelector(".enc .acc"); if(acc){ const v=vistaAct(); acc.innerHTML = `${v.clave==="campanas"?`<button class="btn sec" data-toast="Lleva a Tienda web ▸ Campañas">Cómo se ven en la web ${ic("flecha","fl")}</button>`:""}<button class="btn" data-toast="Abre la hoja «${v.nuevo}»">${ic("mas")} ${v.nuevo}</button>`; }
    pintarVista(); return; }
  const fila = e.target.closest("[data-fila]");
  if(fila){ const id = fila.dataset.fila; estado.abiertaFila = estado.abiertaFila===id?null:id; document.querySelectorAll("[data-fila]").forEach(f=>f.classList.toggle("ab",f.dataset.fila===estado.abiertaFila)); return; }
  const pa = e.target.closest("[data-pase] .cab-p");
  if(pa){ const id = pa.parentElement.dataset.pase; if(id===estado.pase) return; estado.pase = id;
    document.querySelectorAll("[data-pase]").forEach(x=>x.classList.toggle("ab",x.dataset.pase===id));
    const det = document.getElementById("detalle"); det.innerHTML = detallePase(); return; }
  const mv = e.target.closest("[data-mover]"); if(mv){ moverPasarela(estado.foco + +mv.dataset.mover); return; }
  const ir = e.target.closest("[data-ir]"); if(ir){ moverPasarela(+ir.dataset.ir); return; }
});
document.addEventListener("keydown",(e)=>{ if(estado.dir==="3" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ e.preventDefault(); moverPasarela(estado.foco + (e.key==="ArrowRight"?1:-1)); } });
function seg(id, fn){ document.getElementById(id).addEventListener("click",(e)=>{ const b = e.target.closest("button"); if(!b) return; document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b)); fn(b.dataset.v); }); }
function elegirDir(v){ estado.dir = v; estado.foco = null; estado.pase = null; document.querySelectorAll("#ctlDir button,#ley button").forEach(x=>x.classList.toggle("on",x.dataset.v===v)); pintar(); }
seg("ctlDir", elegirDir);
document.getElementById("ley").addEventListener("click",(e)=>{const b=e.target.closest("button");if(b) elegirDir(b.dataset.v);});
seg("ctlTema", (v)=>{document.documentElement.dataset.tema=v;});
seg("ctlAncho", (v)=>{estado.ancho=+v; pintar();});
document.getElementById("repetir").addEventListener("click",()=>pintar());
window.addEventListener("resize", medir);
pintar();
document.fonts?.ready.then(()=>moverPildora());
</script>
</body>
</html>
