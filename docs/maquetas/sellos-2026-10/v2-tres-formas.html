<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo ▸ Sellos · maqueta v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   MAQUETA v2 · Catálogo ▸ Sellos (2026-10-22, tarde)
   Felipe eligió de la v1 (v1-tres-estilos.html) SOLO cómo se cambia de vista: las pestañas de vidrio de la «A». Pidió rehacer
   todo lo demás y sacar «Tu año de campañas». Aquí, tres formas nuevas de ver las campañas de hoy y las que vienen —y los
   sellos—, todas bajo esas mismas pestañas.
   Lo nuevo que comparten: el sello se dibuja como un SELLO de tinta (redondo, con su nombre en el borde) y se ve por las
   PRENDAS que lo llevan (la baldosa de MosaicoPrenda: el color de la prenda con el ícono de su categoría).
   Tokens de apps/web/app/globals.css y estilos/tema.css (ADR-0169 / ADR-0336). El color de una prenda es dato: no cambia con el tema.
   Datos REALES de producción del 2026-10-22: sellos, fechas, %, prendas marcadas (modelo + color), sus unidades en las tiendas,
   lo vendido (desde que empezó la campaña, o en 30 días para un sello) y qué campaña tiene su diseño web armado.
   ==================================================================== */
:root{--rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;--taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
--t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.66);--t50:rgba(26,26,24,.55);--t30:rgba(26,26,24,.3);--t15:rgba(26,26,24,.15);--t08:rgba(26,26,24,.08);
--tinta-fija:#1a1a18;--crema-fija:#f5f0e8;--vidrio:rgba(255,255,255,.5);--lienzo:#ddd5c6;--sombra:rgba(26,26,24,.35);--ease:cubic-bezier(.32,.72,.24,1)}
:root[data-tema="oscuro"]{--crema:#1a1a18;--papel:#242422;--hueso:#31302d;--sand:#3d3c38;--tinta:#f5f0e8;--taupe:#c4a898;--rojo:#e8806a;--rojo-p:#f29a86;--verde:#9ccb8d;--ambar:#e4b968;--pizarra:#a2b8cd;
--t80:rgba(245,240,232,.85);--t65:rgba(245,240,232,.68);--t50:rgba(245,240,232,.58);--t30:rgba(245,240,232,.3);--t15:rgba(245,240,232,.15);--t08:rgba(245,240,232,.08);
--vidrio:rgba(49,48,45,.6);--lienzo:#0f0f0e;--sombra:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--lienzo)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:14px;height:14px}svg.ic.m{width:20px;height:20px}
.serif{font-family:'EB Garamond',serif;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.vs{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t65)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
@keyframes traza{from{stroke-dashoffset:var(--largo)}}
@keyframes punto{from{opacity:0;transform:scale(.4)}}
.cas>*{animation:entra .42s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- barra de la maqueta (no es parte del diseño) ---- */
.spk{position:sticky;top:0;z-index:200;background:#171614;color:#f5f0e8;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.72)}
.seg button.on{background:#f5f0e8;color:#1a1a18;font-weight:600}
.ley{max-width:1400px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ley button{text-align:left;background:var(--papel);border:1px solid var(--sand);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--t80);transition:border-color .2s,background .2s}
.ley button b{display:block;color:var(--tinta);font-size:13.5px;margin-bottom:2px}
.ley button.on{border-color:var(--tinta);background:var(--hueso)}
.escena{padding:14px 16px 60px}
.ajuste{margin:0 auto;position:relative}
.marco{position:absolute;top:0;left:0;transform-origin:top left;display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);background:var(--crema);border:1px solid var(--t30);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px var(--sombra)}

/* ---- el marco del ERP (lateral + cabecera) ---- */
.lat{grid-row:1/3;border-right:1px solid var(--sand);background:var(--crema);padding:18px 14px;overflow:auto;scrollbar-width:none}
.lat .logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:'EB Garamond',serif;font-size:22px;letter-spacing:.18em}
.lat .logo i{width:26px;height:26px;border-radius:50%;background:var(--rojo);display:inline-block}
.lat .g{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;color:var(--t80);font-size:13.5px}
.lat .g svg{width:20px;height:20px;stroke-width:1.5}
.lat .g.ab{color:var(--tinta);font-weight:600}
.lat .hs{margin:2px 0 8px 20px;padding-left:12px;border-left:1px solid var(--sand)}
.lat .h{position:relative;display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--t65)}
.lat .h.on{background:var(--hueso);color:var(--tinta);font-weight:600}
.lat .h.on::before{content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--tinta)}
.lat .h .nuevo{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--verde)}
.cab{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 28px;border-bottom:1px solid var(--sand)}
.cab .p{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--sand);border-radius:999px;font-size:12.5px;color:var(--t80)}
.cab .av{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px}
.pant{overflow:auto;scrollbar-width:thin;container-type:inline-size;container-name:pant}
.pag{padding:28px 40px 80px}

/* ---- piezas del ERP ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--tinta);background:var(--tinta);color:var(--crema);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .2s,transform .2s,border-color .2s,box-shadow .2s}
.btn:hover{background:var(--rojo-p);border-color:var(--rojo-p);color:#fbf8f2;transform:translateY(-2px);box-shadow:0 8px 16px -10px var(--sombra)}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--t30)}.btn.sec:hover{background:var(--hueso);color:var(--tinta);border-color:var(--t30)}
.btn.sut{background:var(--hueso);color:var(--tinta);border-color:transparent}.btn.sut:hover{background:var(--sand);color:var(--tinta);border-color:transparent}
.btn.ch{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px;gap:6px}
.voz-cab .btn{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.enl{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--t30);font-size:12.5px;color:var(--t80)}.enl:hover{color:var(--rojo-p);text-decoration-color:var(--rojo)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--hueso);color:var(--t80);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.v{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}
.chip.a{color:var(--ambar);background:color-mix(in srgb,var(--ambar) 14%,transparent)}
.chip.p{color:var(--pizarra);background:color-mix(in srgb,var(--pizarra) 14%,transparent)}
.glo{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hueso);font-size:11px;font-weight:600;color:var(--t80);letter-spacing:0;font-variant-numeric:tabular-nums}
.glo.pide{background:color-mix(in srgb,var(--ambar) 18%,transparent);color:var(--ambar)}
.nota{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--hueso);font-size:12.5px;color:var(--t80)}
.nota .i{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--taupe);color:var(--taupe);display:grid;place-items:center;font-family:'EB Garamond',serif;font-weight:600;font-size:12px;margin-top:1px}
.tit-sec{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.tit-sec h2{font-family:'EB Garamond',serif;font-weight:500;font-size:21px;line-height:1.2}
.tit-sec .der{margin-left:auto;font-size:12.5px;color:var(--t65)}
.tarjeta{background:var(--papel);border:1px solid var(--sand);border-radius:18px}
.barra{height:3px;border-radius:999px;background:var(--sand);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:inherit;background:var(--tinta);transform-origin:left;animation:llena .7s var(--ease) both}
.mas{display:flex;justify-content:center;margin-top:10px}
.mas button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;font-size:12.5px;color:var(--taupe);font-weight:600;border-radius:999px}
.mas button:hover{background:var(--hueso)}
.mas svg{transition:transform .3s var(--ease)}.mas button.ab svg{transform:rotate(180deg)}
.bajada{margin-top:14px;font-size:13.5px;color:var(--t65);max-width:780px}

/* ---- cabecera de pantalla (EncabezadoPagina) ---- */
.enc{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.enc-s{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--taupe)}
.enc-s .hilo{width:34px;height:1px;background:var(--taupe);opacity:.6}.enc-s .t{color:var(--t65)}
.enc h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:10px}
.enc p.fr{color:var(--t65);margin-top:6px;max-width:680px;font-size:14px}
.enc .acc{display:flex;gap:10px;flex-wrap:wrap}

/* ---- pestañas de vidrio (Pestanas) — lo que Felipe eligió de la A ---- */
.pest{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--vidrio);border:1px solid var(--t08);backdrop-filter:blur(22px)}
.pest .pi{position:absolute;top:4px;bottom:4px;left:0;border-radius:10px;background:var(--tinta);box-shadow:0 8px 18px -10px var(--sombra);transition:transform .45s var(--ease),width .45s var(--ease)}
.pest button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--t80);transition:color .3s}
.pest button.on{color:var(--crema)}
.pest button.on .glo{background:color-mix(in srgb,var(--crema) 20%,transparent);color:var(--crema)}
.pest button svg{width:16px;height:16px}

/* ---- el SELLO de tinta (nuevo: reemplaza la tira de dibujo) ---- */
.sello{position:relative;flex:none;color:var(--a);transform:rotate(var(--giro,-5deg));transition:transform .25s var(--ease)}
.sello svg{display:block;width:100%;height:100%;overflow:visible}
.sello .tx{font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;fill:currentColor}
.sello.apag{opacity:.5}
[data-estampa]:hover .sello{transform:rotate(0deg) scale(.96)}

/* ---- la baldosa de la prenda (MosaicoPrenda) ---- */
.prenda{display:flex;flex-direction:column;gap:6px;min-width:0}
.prenda .b{position:relative;aspect-ratio:4/5;border-radius:10px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--t08)}
.prenda .b svg{width:42%;height:42%;stroke-width:1.4}
.prenda .b .u{position:absolute;right:6px;bottom:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--crema-fija) 88%,transparent);color:var(--tinta-fija)}
.prenda .b.ago{opacity:.5}
.prenda span.n{font-size:11.5px;line-height:1.25;color:var(--t80);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prenda.mas .b{background:var(--hueso);box-shadow:none;color:var(--t65);font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.pila{display:flex;align-items:center}
.pila .b{width:30px;height:36px;border-radius:7px;margin-left:-8px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--papel)}
.pila .b:first-child{margin-left:0}
.pila .b svg{width:16px;height:16px;stroke-width:1.5}
.pila .mas-n{margin-left:8px;font-size:12px;color:var(--t65)}

/* ===== 1 · Vitrinas ===== */
.vit{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;overflow:hidden}
@container pant (max-width: 980px){.vit{grid-template-columns:1fr}}
.vit .id{padding:20px 22px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--sand)}
.vit .id .top{display:flex;gap:14px;align-items:center}
.vit .id h3{font-family:'EB Garamond',serif;font-weight:500;font-size:28px;line-height:1.05}
.vit .quedan{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.vit .quedan b{font-family:'EB Garamond',serif;font-weight:500;font-size:40px;line-height:1}
.vit .quedan span{font-size:12.5px;color:var(--t65)}
.vit .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.vit .cifras div{font-size:11px;color:var(--t65);line-height:1.3}
.vit .cifras strong{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:22px;color:var(--tinta)}
.vit .acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.vit .esc{padding:18px 20px;background:color-mix(in srgb,var(--hueso) 55%,var(--papel));position:relative}
.vit .esc .riel{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vit .esc .riel i{flex:1;height:2px;border-radius:2px;background:var(--sand)}
.fila-prendas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));grid-auto-rows:auto}
.vacia{height:100%;min-height:180px;border:1.5px dashed var(--t30);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--t65)}
.vacia svg{width:30px;height:30px;color:var(--taupe);stroke-width:1.4}
.vacia b{font-family:'EB Garamond',serif;font-weight:500;font-size:20px;color:var(--tinta)}
.vacia p{font-size:12.5px;max-width:420px}
.viene1{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.vc1{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--papel);border:1px solid var(--sand)}
.vc1 .top{display:flex;gap:12px;align-items:center}
.vc1 h4{font-weight:600;font-size:15px;line-height:1.2}
.vc1 p{font-size:12px;color:var(--t65)}
.vc1 .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vc1 .mini .vacia{min-height:96px;grid-column:1/-1;padding:12px}
.vc1 .mini .vacia b{font-size:16px}
.vc1 .pie{display:flex;gap:6px;align-items:center;margin-top:auto}
.guard{display:flex;flex-wrap:wrap;gap:8px}
.guard .g{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:999px;background:var(--papel);border:1px solid var(--sand);font-size:12.5px}
.guard .g small{color:var(--t65)}

/* ===== 2 · Qué toca hacer ===== */
.porhacer{padding:6px 0}
.porhacer .cab2{display:flex;align-items:center;gap:10px;padding:10px 18px 6px}
.porhacer .cab2 h2{font-family:'EB Garamond',serif;font-weight:500;font-size:21px}
.ph{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--sand)}
.ph:first-of-type{border-top:0}
.ph .ic2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ambar) 13%,transparent);color:var(--ambar)}
.ph .ic2.ok{background:color-mix(in srgb,var(--verde) 13%,transparent);color:var(--verde)}
.ph b{font-weight:600}
.ph p{font-size:13px;color:var(--t80)}
.ph small{display:block;font-size:12px;color:var(--t65)}
.dos{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@container pant (max-width: 1000px){.dos{grid-template-columns:1fr}}
.vivo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:18px;margin-bottom:12px}
.anillo{position:relative;width:96px;height:96px}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:7}
.anillo .pista{stroke:var(--hueso)}
.anillo .arco{stroke:var(--tinta);stroke-linecap:round;animation:traza 1s var(--ease) both}
.anillo .cen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.anillo .cen b{font-family:'EB Garamond',serif;font-weight:500;font-size:32px}
.anillo .cen small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--t65);margin-top:3px}
.vivo h3{font-family:'EB Garamond',serif;font-weight:500;font-size:24px;line-height:1.1}
.vivo .linea{font-size:12.5px;color:var(--t65);margin:4px 0 10px}
.vivo .linea strong{color:var(--tinta);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--t80);margin-bottom:12px}
.checks span{display:inline-flex;align-items:center;gap:6px}
.checks .si svg{color:var(--verde)}
.checks .no{color:var(--ambar)}.checks .no svg{color:var(--ambar)}
.checks .op{color:var(--t50)}
.camino{position:relative;padding-left:0}
.paso{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding-bottom:16px}
.paso::before{content:"";position:absolute;left:31px;top:68px;bottom:0;width:1.5px;background:var(--sand)}
.paso:last-child::before{display:none}
.fecha{width:64px;border-radius:14px;background:var(--papel);border:1px solid var(--sand);text-align:center;padding:7px 0 8px;line-height:1.05}
.fecha small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t65)}
.fecha b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:28px;margin:2px 0}
.paso .cuerpo{padding:12px 16px;border-radius:16px;background:var(--papel);border:1px solid var(--sand)}
.paso .cuerpo .t{display:flex;align-items:center;gap:10px}
.paso .cuerpo h4{font-weight:600;font-size:15px}
.paso .cuerpo .cuando{margin-left:auto;font-size:12px;color:var(--t65);white-space:nowrap}
.paso .cuerpo .checks{margin:8px 0 10px}
.salud{display:grid;grid-template-columns:56px minmax(0,1.4fr) minmax(0,1fr) repeat(3,92px) auto;gap:18px;align-items:center;padding:14px 18px;border-top:1px solid var(--sand)}
.salud:first-child{border-top:0}
@container pant (max-width: 1100px){.salud{grid-template-columns:48px minmax(0,1.4fr) repeat(3,72px) auto}.salud .pila{display:none}}

/* ============================ reglas (las de lib/sellos-campanas.ts y lib/etiqueta-campana.ts) ============================ */
const dia = (f)=>new Date(f+"T12:00:00");
const dias = (a,b)=>Math.round((dia(b)-dia(a))/864e5);
const fc = (f)=>{const x=dia(f);return `${x.getDate()} ${MESES[x.getMonth()]}`};
const fl = (f)=>{const x=dia(f);return `${DIAS_L[x.getDay()]} ${x.getDate()} de ${MESES_L[x.getMonth()]}`};
const rango = (s)=>!s.d&&!s.h?null:`${s.d?fc(s.d):"…"} – ${s.h?fc(s.h):"…"}${s.h&&s.h.slice(0,4)!==HOY.slice(0,4)?" "+s.h.slice(0,4):""}`;
function tramo(s){ if(!s.d&&!s.h) return "sin_fechas"; if(s.d&&HOY<s.d) return "proximas"; if(s.h&&HOY>s.h) return "pasaron"; return "ahora"; }
const alcance = (s)=>s.prendas + s.cats.length;
const deVista = (v,activos=true)=>S.filter(s=>GRUPOS[s.g].vista===v && s.activo===activos);
const camp = ()=>deVista("campanas");
const ahora = ()=>camp().filter(s=>tramo(s)==="ahora").sort((a,b)=>a.h.localeCompare(b.h));
const proximas = ()=>camp().filter(s=>tramo(s)==="proximas").sort((a,b)=>a.d.localeCompare(b.d));
const guardadas = ()=>camp().filter(s=>["sin_fechas","pasaron"].includes(tramo(s))).sort((a,b)=>tramo(a)==="sin_fechas"?-1:tramo(b)==="sin_fechas"?1:(a.d||"").localeCompare(b.d||""));
const plural = (n,a,b)=>`${n.toLocaleString("es-PE")} ${n===1?a:b}`;
const textoAlcance = (s)=>[s.prendas?plural(s.prendas,"prenda","prendas"):"", s.cats.length?`toda ${s.cats.join(", ")}`:""].filter(Boolean).join(" + ") || "ninguna prenda";
// Lo que una campaña ya tiene listo: sale de los mismos datos que ya decide la pantalla (fechas, prendas, % y su diseño web).
function listo(s){
  const l = [
    {k:"Fechas", ok:!!(s.d&&s.h)},
    {k:alcance(s)?`Prendas · ${textoAlcance(s)}`:"Prendas", ok:alcance(s)>0},
    {k:s.pct!==null?`Descuento · ${s.pct} %`:"Sin descuento", ok:s.pct!==null, opcional:true},
  ];
  if(s.pct!==null) l.push({k:s.web?"Diseño en la web":"Diseño en la web", ok:!!s.web, opcional:true});
  return l;
}
const falta = (s)=>listo(s).filter(x=>!x.ok && !x.opcional);
function chip(s){
  const t = tramo(s);
  if(t==="ahora") return alcance(s)===0?[["Vigente",""],["Sin prendas","a"]]:[["Vigente","v"]];
  if(t==="proximas"){const n=dias(HOY,s.d);const q=n===1?"Mañana":`En ${n} días`;return alcance(s)===0?[[q,""],["Sin preparar","a"]]:[[q,"p"]];}
  if(t==="pasaron") return [[`Pasó el ${fc(s.h)}`,""]];
  return [];
}

function vitrina(s, maxPrendas){
  const l = P[s.id]||[], t = tramo(s);
  const cifras = s.g==="campana"
    ? [[s.u,"unidades en las tiendas"],[s.vend,`vendidas desde el ${fc(s.d)}`],[s.pct!==null?s.pct+" %":"—","descuento"]]
    : [[s.u,"unidades en las tiendas"],[s.vend,"vendidas en 30 días"],[s.pct!==null?s.pct+" %":"—","descuento"]];
  const quedan = t==="ahora" ? dias(HOY,s.h) : null;
  const vacia = !alcance(s);
  const esc = vacia
    ? `<div class="vacia">${ic("percha")}<b>La vitrina está vacía</b><p>${s.g==="campana"&&t==="ahora"?`Rige hasta el ${fl(s.h)}${s.pct?` con ${s.pct} % de descuento`:""}${s.web?" y su diseño ya se ve en la tienda web":""}, pero no está en ninguna prenda: no rebaja nada.`:"Ninguna prenda lleva este sello todavía."}</p><button class="btn ch" data-toast="Abre «Prendas» de ${s.n}">Elegir prendas</button></div>`
    : `<div class="riel"><span class="vs">${plural(s.prendas,"prenda","prendas")}${s.cats.length?` + toda ${s.cats.join(", ")}`:""}</span><i></i><button class="enl" data-toast="Abre «Prendas» de ${s.n}">Ver todas</button></div>
       <div class="fila-prendas cas">${l.slice(0,maxPrendas).map((p,i)=>baldosa(p).replace('class="prenda"',`class="prenda" style="--i:${i}"`)).join("")}${s.prendas>maxPrendas?`<div class="prenda mas"><div class="b">+${s.prendas-maxPrendas}<br>más</div></div>`:""}</div>`;
  return `<article class="tarjeta vit" data-estampa style="margin-bottom:14px">
    <div class="id">
      <div class="top">${sello(s,84)}<div style="min-width:0"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${chipHTML(s)}</div><h3>${s.n}</h3></div></div>
      ${quedan!==null?`<div class="quedan"><b class="num">${quedan}</b><span>día${quedan===1?"":"s"} para que termine<br>${fl(s.h)}</span></div><div class="barra"><i style="width:${Math.round(dias(s.d,HOY)/dias(s.d,s.h)*100)}%"></i></div>`
        : rango(s)?`<span style="font-size:12.5px;color:var(--t65)" class="num">${rango(s)}</span>`:""}

      <div class="acc">${botones(s)}</div>
    </div>
    <div class="esc">${esc}</div>
  </article>`;
}

      const t = tramo(s), n = t==="ahora"?dias(HOY,s.h):dias(HOY,s.d);
      return {texto: t==="ahora"
          ? `<b>${s.n}</b> rige hasta el ${fl(s.h)}${s.pct?` con ${s.pct} %`:""}, pero no está en ninguna prenda: no rebaja nada.`
          : `<b>${s.n}</b> empieza en ${n} días (${fl(s.d)}) y todavía no tiene prendas.`,
        det: t==="ahora"&&s.web ? "Su diseño ya se ve en la tienda web." : null,
        accion: "Elegir prendas", toast:`Abre «Prendas» de ${s.n}`};
    });
    cuerpo = `${porHacer(items)}
      <div class="dos">
        <div><div class="tit-sec"><h2>Rigen hoy</h2><span class="glo">${a.length}</span></div>
          <div class="cas">${a.map((s,i)=>{const tot=dias(s.d,s.h), ya=dias(s.d,HOY), q=dias(HOY,s.h), C=2*Math.PI*44, pct=ya/tot;
            return `<article class="tarjeta vivo" style="--i:${i}" data-estampa>
              <div><div class="anillo"><svg viewBox="0 0 100 100"><circle class="pista" cx="50" cy="50" r="44"/><circle class="arco" cx="50" cy="50" r="44" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-pct)};--largo:${C}"/></svg>
                <div class="cen"><div><b class="num">${q}</b><small>día${q===1?"":"s"}</small></div></div></div>
                <div style="text-align:center;font-size:11px;color:var(--t65);margin-top:6px">quedan</div></div>
              <div style="min-width:0">
                <div style="display:flex;gap:10px;align-items:center">${sello(s,40,0)}<div><h3>${s.n}</h3><div style="display:flex;gap:6px;margin-top:4px">${chipHTML(s)}</div></div></div>
                <p class="linea num">${rango(s)} · <strong>${s.vend} vendidas</strong> desde que empezó · <strong>${s.u} u</strong> en las tiendas</p>
                ${checksHTML(s)}
                <div style="display:flex;gap:6px;flex-wrap:wrap">${botones(s)}</div>
              </div></article>`;}).join("")}</div></div>
        <div><div class="tit-sec"><h2>Lo que viene</h2><span class="glo">${p.length}</span></div>
          <div class="camino cas">${p.map((s,i)=>{const x=dia(s.d), n=dias(HOY,s.d), f=falta(s);return `<div class="paso" style="--i:${i}">
              <div class="fecha"><small>${DIAS_C[x.getDay()]}</small><b class="num">${x.getDate()}</b><small>${MESES[x.getMonth()]}</small></div>
              <div class="cuerpo" data-estampa><div class="t">${sello(s,34,0)}<h4>${s.n}</h4><span class="cuando">${n===1?"mañana":`en ${n} días`}</span></div>
                ${checksHTML(s)}
                <div style="display:flex;gap:6px;align-items:center">${f.length?`<span class="chip a">Falta preparar</span>`:`<span class="chip v">Lista</span>`}<span style="margin-left:auto;display:flex;gap:6px">${botones(s,{imprimir:false,web:false})}</span></div></div></div>`;}).join("")}</div></div>
      </div>
      <div class="tit-sec"><h2>Sin fechas y ya pasaron</h2><span class="glo">${g.length}</span></div>
      ${plegable("guard",estado.guardAbiertas,"las campañas guardadas",g.length,`<div class="tarjeta" style="overflow:hidden">${g.map(s=>`<div class="salud" style="grid-template-columns:40px minmax(0,1fr) auto">${sello(s,36,0)}<div><h4>${s.n}</h4><span style="font-size:12px;color:var(--t65)" class="num">${tramo(s)==="sin_fechas"?"Sin fechas: ponle cuándo rige":`Pasó el ${fc(s.h)} · ${rango(s)}`}</span></div><button class="btn sut ch" data-toast="Abre la hoja">${tramo(s)==="sin_fechas"?"Ponle fechas":"Repetir en 2027"}</button></div>`).join("")}</div>`)}`;
  } else {
    const l = deVista(v.clave);
    const items = l.filter(s=>!alcance(s)).map(s=>({texto:`<b>${s.n}</b> no está en ninguna prenda${s.pct?` (tiene ${s.pct} % de descuento que no se usa)`:""}.`, accion:"Elegir prendas", toast:`Abre «Prendas» de ${s.n}`}));
    cuerpo = `${porHacer(items)}
      <div class="tit-sec"><h2>${v.nombre}</h2><span class="glo">${l.length}</span><span class="der">${v.frase}</span></div>
      <div class="tarjeta cas" style="overflow:hidden">${l.map((s,i)=>`<div class="salud" style="--i:${i}" data-estampa>${sello(s,52)}
          <div style="min-width:0"><h4>${s.n}</h4><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${chipHTML(s)}${s.pct!==null?`<span class="chip">${s.pct} % de descuento</span>`:""}${!alcance(s)&&!chipHTML(s).includes("Sin prendas")?`<span class="chip a">Sin prendas</span>`:""}</div></div>
          ${pila(s,6)}
          <div class="n num">${s.prendas}<small>prendas</small></div><div class="n num">${s.u}<small>en tiendas</small></div><div class="n num">${s.vend}<small>vendidas 30 d</small></div>
          <div class="acc">${botones(s,{web:false})}</div></div>`).join("")}</div>
      ${deVista(v.clave,false).length?plegable("desact",estado.desactAbiertos,"los desactivados",deVista(v.clave,false).length,`<div class="guard">${deVista(v.clave,false).map(s=>`<span class="g">${sello(s,30,0)}<span>${s.n}</span><button class="btn sec ch" data-toast="Reactiva ${s.n}">Reactivar</button></span>`).join("")}</div>`):""}`;
  }
  return `<div class="pag">${encabezado()}<div style="margin-top:22px">${pestanas()}</div>${cuerpo}</div>`;
}

/* ============================ 3 · Cuenta regresiva ============================ */
function puntos(s){
  const tot = dias(s.d,s.h)+1, ya = dias(s.d,HOY);
  return `<div><div class="dias" aria-label="${ya} días pasaron, hoy y ${tot-ya-1} por delante">${Array.from({length:tot},(_,i)=>`<i class="${i<ya?"":i===ya?"hoy":"vie"}" style="animation-delay:${Math.min(i,60)*12}ms"></i>`).join("")}</div>
    <div class="dias-l num"><span>Empezó el ${fc(s.d)}</span><span>Hoy es el día ${ya+1} de ${tot}</span><span>Termina el ${fc(s.h)}</span></div></div>`;
}
function vista3(){
  const v = vistaAct();
  let cuerpo;
  if(v.clave==="campanas"){
    const a = ahora(), p = proximas(), g = guardadas();
    cuerpo = `<p class="bajada">${v.frase}</p>
      <div class="tit-sec"><h2>Rigen hoy</h2><span class="glo">${a.length}</span><span class="der">Un punto por día · el rojo es hoy</span></div>
      <div class="ahora3 cas">${a.map((s,i)=>{const q=dias(HOY,s.h);return `<article class="tarjeta cr" style="--i:${i}" data-estampa>
          <div class="top">${sello(s,60)}<div style="min-width:0;flex:1"><h3>${s.n}</h3><div style="display:flex;gap:6px;margin-top:6px">${chipHTML(s)}</div></div></div>
          <div class="grande"><b class="num">${q}</b><span><strong>día${q===1?"":"s"} para que termine</strong>${fl(s.h)}</span></div>
          ${puntos(s)}
          <div class="met"><div><strong class="num">${s.vend}</strong>vendidas desde que empezó</div><div><strong class="num">${s.u}</strong>unidades en las tiendas</div><div><strong class="num">${s.pct!==null?s.pct+" %":"—"}</strong>descuento</div></div>
          ${alcance(s)?`<div style="display:flex;align-items:center;gap:10px">${pila(s,7)}<span style="font-size:12px;color:var(--t65)">${textoAlcance(s)}</span></div>`
            :`<div class="alerta">${ic("alerta","s")}<span><b>No está en ninguna prenda:</b> ${s.pct?`su ${s.pct} % no rebaja nada${s.web?" aunque la web ya la muestra":""}.`:"no cambia nada en caja."} Elige sus prendas.</span></div>`}
          <div class="pie">${botones(s)}</div></article>`;}).join("")}</div>
      <div class="tit-sec"><h2>Lo que viene</h2><span class="glo">${p.length}</span><span class="der">Prepáralas antes de que empiecen</span></div>
      <div class="boletos cas">${p.map((s,i)=>{const n=dias(HOY,s.d);return `<article class="boleto" style="--i:${i}" data-estampa>
          <div class="talon"><small>faltan</small><b class="num">${n}</b><small>día${n===1?"":"s"}</small></div>
          <div class="cuerpo"><div class="t">${sello(s,40,0)}<div style="min-width:0"><h4>${s.n}</h4><p class="num">${fl(s.d)} – ${fc(s.h)}</p></div></div>
            ${alcance(s)?`<div style="display:flex;align-items:center;gap:8px">${pila(s,4)}<span style="font-size:12px;color:var(--t65)">${plural(s.u,"unidad","unidades")}</span></div>`:`<p style="color:var(--ambar);font-weight:600">Todavía sin prendas</p>`}
            <div class="pie">${botones(s,{imprimir:false,web:false})}</div></div></article>`;}).join("")}</div>
      <div class="tit-sec"><h2>Guardadas</h2><span class="glo">${g.length}</span><span class="der">Sin fechas o ya pasaron</span></div>
      <div class="talones">${g.map(s=>`<span class="tl" data-estampa>${sello(s,30,0)}<span><b style="font-weight:600">${s.n}</b><small class="num">${tramo(s)==="sin_fechas"?"Sin fechas":`Pasó el ${fc(s.h)}`}</small></span><button class="btn sut ch" data-toast="Abre la hoja">${tramo(s)==="sin_fechas"?"Ponle fechas":"Repetir"}</button></span>`).join("")}</div>`;
  } else {
    const l = deVista(v.clave), off = deVista(v.clave,false);
    cuerpo = `<p class="bajada">${v.frase}</p>
      <div class="tit-sec"><h2>${v.nombre}</h2><span class="glo">${l.length}</span><span class="der">Últimos 30 días</span></div>
      <div class="marc cas">${l.map((s,i)=>`<article class="tarjeta mc" style="--i:${i}" data-estampa>
          <div class="top">${sello(s,56)}<div style="min-width:0"><h4>${s.n}</h4><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${chipHTML(s)}${s.pct!==null?`<span class="chip">${s.pct} %</span>`:""}</div></div></div>
          <div class="grande"><b class="num">${s.vend}</b><span>vendidas<br>en 30 días</span></div>
          <span class="sub num">${s.u} unidades en las tiendas · ${plural(s.prendas,"prenda","prendas")}</span>
          ${alcance(s)?pila(s,7):`<div class="alerta">${ic("alerta","s")}<span><b>No está en ninguna prenda.</b></span></div>`}
          <div class="pie">${botones(s,{web:false})}</div></article>`).join("")}</div>
      ${off.length?plegable("desact",estado.desactAbiertos,"los desactivados",off.length,`<div class="talones">${off.map(s=>`<span class="tl">${sello(s,30,0)}<span>${s.n}</span><button class="btn sec ch" data-toast="Reactiva ${s.n}">Reactivar</button></span>`).join("")}</div>`):""}`;
  }
  return `<div class="pag">${encabezado()}<div style="margin-top:22px">${pestanas()}</div>${cuerpo}</div>`;
}

/* ============================ pintar ============================ */
const marco = document.getElementById("marco"), ajuste = document.getElementById("ajuste");
const ALTOS = {1024:768,1440:900,1920:1080};
function pintar(conservar=false){
  const viejo = marco.querySelector(".pant"), y = conservar && viejo ? viejo.scrollTop : 0;
  uid = 0;
  marco.innerHTML = `<aside class="lat">${lateral()}</aside><div class="cab">${cabeceraERP()}</div><main class="pant">${({1:vista1,2:vista2,3:vista3})[estado.dir]()}</main>`;
  marco.querySelector(".pant").scrollTop = y;
  medir(); moverPildora();
}
function medir(){
  const W = estado.ancho, H = ALTOS[W], k = Math.min(1, Math.min(window.innerWidth - 32, 1600) / W);
  marco.style.width = W+"px"; marco.style.height = H+"px"; marco.style.transform = `scale(${k})`;
  ajuste.style.width = W*k+"px"; ajuste.style.height = H*k+"px";
}
function moverPildora(){
  const p = document.getElementById("pest"); if(!p) return;
  const on = p.querySelector("button.on"), pi = document.getElementById("pi");
  pi.style.width = on.offsetWidth+"px"; pi.style.transform = `translateX(${on.offsetLeft-4}px)`;
}
let tt;
function toast(t){
  document.querySelector(".toast")?.remove(); clearTimeout(tt);
  const d = document.createElement("div"); d.className="toast"; d.innerHTML = `<b style="color:var(--tinta)">En la maqueta no se guarda nada.</b><br>${t}.`;
  document.body.appendChild(d); tt = setTimeout(()=>d.remove(), 3200);
}
document.addEventListener("click",(e)=>{
  const vb = e.target.closest("[data-vista]");
  if(vb){ estado.vista = vb.dataset.vista; const p=document.getElementById("pest"); p.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===vb)); moverPildora(); setTimeout(()=>pintar(true),180); return; }
  const pl = e.target.closest("[data-plegar]");
  if(pl){ if(pl.dataset.plegar==="guard") estado.guardAbiertas=!estado.guardAbiertas; else estado.desactAbiertos=!estado.desactAbiertos; pintar(true); return; }
  const ts = e.target.closest("[data-toast]"); if(ts){ toast(ts.dataset.toast); return; }
});
function seg(id, fn){
  document.getElementById(id).addEventListener("click",(e)=>{
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b)); fn(b.dataset.v);
  });
}
function elegirDir(v){ estado.dir = v; document.querySelectorAll("#ctlDir button,#ley button").forEach(x=>x.classList.toggle("on",x.dataset.v===v)); pintar(); }
seg("ctlDir", elegirDir);
document.getElementById("ley").addEventListener("click",(e)=>{const b=e.target.closest("button");if(b) elegirDir(b.dataset.v);});
seg("ctlTema", (v)=>{document.documentElement.dataset.tema=v; pintar(true);});
seg("ctlAncho", (v)=>{estado.ancho=+v; pintar();});
window.addEventListener("resize", medir);
pintar();
document.fonts?.ready.then(()=>moverPildora());
</script>
</body>
</html>
