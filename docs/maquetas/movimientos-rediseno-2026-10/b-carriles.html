<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movimientos · B · Tres carriles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
/* ====================================================================
   OPCIÓN B · «TRES CARRILES» — el día corre de arriba abajo por un hilo de horas;
   cada movimiento cuelga del carril que le toca: SALIÓ de la tienda · SE MOVIÓ
   DENTRO · ENTRÓ. Se reconoce por la POSICIÓN antes de leer una palabra. Una
   línea del color del tipo une la hora con su tarjeta (como un mapa de metro).
   ==================================================================== */
.l-sale{--lc:var(--taupe)}
.l-dentro{--lc:var(--pizarra)}
.l-entra{--lc:var(--verde-2)}

/* Balance del día: una sola barra apilada */
.balance{margin-top:24px;padding:18px 20px 16px}
.balance .tit{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.balance h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2}
.balance .sub{font-size:12.5px;color:var(--t65)}
.pila-dia{display:flex;gap:6px;height:30px}
.pila-dia .seg-l{display:flex;gap:2px;min-width:0;flex:var(--u) 1 0;transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .8s var(--ease),opacity .4s;transition-delay:calc(var(--k)*120ms + 200ms)}
.balance.in .pila-dia .seg-l{transform:none;opacity:1}
.pila-dia .seg-l i{display:block;flex:var(--u) 1 0;background:var(--c);border-radius:6px;min-width:6px;transition:flex-grow .3s}
.pila-dia .seg-l i:hover{filter:brightness(1.12)}
.etq{display:flex;gap:6px;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.etq span{flex:var(--u) 1 0;color:var(--lc);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Controles */
.controles{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
.controles .campo{flex:1 1 240px;max-width:420px}

/* Cabeza de carriles (pegajosa) */
.cabs{display:grid;grid-template-columns:var(--cols);column-gap:14px;position:sticky;top:54px;z-index:12;padding:12px 0 10px;margin-top:14px;background:linear-gradient(var(--crema) 86%,transparent);transition:grid-template-columns .55s var(--ease)}
.lane{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 16px 13px;background:var(--papel);border:1.5px solid var(--sand);border-radius:16px;min-width:0;overflow:hidden;transition:border-color .25s,background .25s}
.lane:hover{border-color:color-mix(in srgb,var(--lc) 40%,var(--sand));background:color-mix(in srgb,var(--lc) 5%,var(--papel))}
.lane[aria-pressed=true]{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 9%,var(--papel))}
.lane .lt{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lc)}
.lane .lt svg{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--lc);color:var(--crema);stroke-width:2.2}
.lane .ln{display:flex;align-items:baseline;gap:8px}
.lane .ln b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1}
.lane .ln small{font-size:12px;color:var(--t65)}
.lane .lc{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--t65)}
.lane .lc span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lane .lc span:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.lane .corta{position:absolute;right:12px;top:12px;font-size:11px;color:var(--t50);opacity:0;transition:opacity .2s}
.lane[aria-pressed=true] .corta{opacity:1}
.cabs[data-foco] .lane[aria-pressed=false] .ln b{font-size:30px}
.cabs[data-foco] .lane[aria-pressed=false] .lc{display:none}

/* Los carriles */
.carriles{display:grid;grid-template-columns:var(--cols);column-gap:14px;position:relative;margin-top:2px;transition:grid-template-columns .55s var(--ease)}
.pista{border-radius:18px;background:color-mix(in srgb,var(--lc) 5%,transparent);border:1px dashed color-mix(in srgb,var(--lc) 22%,transparent);pointer-events:none;grid-row:1/-1;z-index:0}
.dsep{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:20px 0 10px 4px;z-index:2;position:relative}
.dsep b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.02em}
.dsep span{font-size:13px;color:var(--t65)}
.dsep i{flex:1;height:1px;background:var(--sand)}
.h{grid-column:1;position:relative;display:flex;align-items:center;min-height:68px;z-index:1}
.h time{font-size:12px;font-weight:600;color:var(--t65);width:42px}
.h:before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--sand)}
.h .nd{position:absolute;left:54px;top:50%;width:12px;height:12px;margin:-6px 0 0 -5px;border-radius:50%;background:var(--papel);border:3px solid var(--c);transition:transform .25s var(--ease),background .2s}
.h.hl .nd{transform:scale(1.35);background:var(--c)}
.cx{align-self:center;height:3px;border-radius:3px;background:var(--c);margin-left:55px;margin-right:-14px;opacity:.38;z-index:1;transform-origin:left;transition:opacity .2s,height .2s}
.cx.rev{opacity:.38;transform:scaleX(0);transition:transform .6s var(--ease),opacity .2s,height .2s;transition-delay:calc(var(--i,0)*45ms)}
.cx.rev.in{transform:scaleX(1)}
.cx.hl{opacity:1;height:4px}
.cardb{align-self:center;margin:7px 0;z-index:2;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--papel);border:1.5px solid var(--c-ln);border-radius:16px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .25s,transform .35s var(--ease),opacity .25s;width:100%;min-width:0}
.cardb:hover{background:var(--c-bg);border-color:var(--c);transform:translateY(-2px)}
.cardb .sello{--sz:44px}
.cardb .mid{min-width:0}
.cardb .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cardb .tn{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.cardb .q{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--t65)}
.cardb .nombre{font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardb .det{font-size:12px;color:var(--t65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardb .ref{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t65);margin-top:5px}
.cardb .ref svg{color:var(--taupe);width:13px;height:13px}
.cardb .cant{text-align:right}
.cardb .cant b{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;color:var(--c);display:block}
.cardb .cant small{font-size:10.5px;color:var(--t65)}
.cardb .pila{margin-top:6px}

/* Foco: un carril se ensancha y los otros se vuelven fichas */
.carriles[data-foco="sale"] .cardb:not([data-lane="sale"]) .mid,
.carriles[data-foco="dentro"] .cardb:not([data-lane="dentro"]) .mid,
.carriles[data-foco="entra"] .cardb:not([data-lane="entra"]) .mid,
.carriles[data-foco="sale"] .cardb:not([data-lane="sale"]) .niv,
.carriles[data-foco="dentro"] .cardb:not([data-lane="dentro"]) .niv,
.carriles[data-foco="entra"] .cardb:not([data-lane="entra"]) .niv{display:none}
.carriles[data-foco="sale"] .cardb:not([data-lane="sale"]),
.carriles[data-foco="dentro"] .cardb:not([data-lane="dentro"]),
.carriles[data-foco="entra"] .cardb:not([data-lane="entra"]){grid-template-columns:auto auto;justify-content:space-between;opacity:.8;padding:9px 10px}

/* «Dos niveles»: Almacén arriba, Piso abajo; una prenda baja (colgada en piso) o sube (guardada en almacén) */
.niv{display:grid;justify-items:center;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.niv .n{padding:2px 9px;border-radius:99px;border:1.5px solid var(--c-ln);color:var(--t65);white-space:nowrap}
.niv .n.dest{background:var(--c);border-color:var(--c);color:var(--crema)}
.niv .v{position:relative;width:2px;height:22px;background:var(--c-ln)}
.niv .v:after{content:"";position:absolute;left:50%;width:7px;height:7px;border:2px solid var(--c);border-width:0 2px 2px 0}
.niv.baja .v:after{bottom:-1px;transform:translateX(-50%) rotate(45deg)}
.niv.sube .v:after{top:1px;transform:translateX(-50%) rotate(-135deg)}
.niv .dot{position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--c);opacity:0}
.niv.go.baja .dot{animation:nv-baja .95s .1s var(--ease) both}
.niv.go.sube .dot{animation:nv-sube .95s .1s var(--ease) both}
@keyframes nv-baja{0%{top:-3px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:20px;opacity:0}}
@keyframes nv-sube{0%{top:20px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:-3px;opacity:0}}
.cardb .niv{grid-column:2;justify-self:start;margin-top:4px;flex-direction:row}

.vacio{padding:56px 24px;text-align:center;color:var(--t65);grid-column:1/-1}
.vacio b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--tinta);margin-bottom:4px}

@container vista (max-width:960px){
  .lane .ln b{font-size:32px}
  .lane{padding:10px 12px}
  .cardb{grid-template-columns:auto minmax(0,1fr)}
  .cardb .cant{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:6px}
  .cardb .cant b{font-size:26px}
}
@container vista (max-width:760px){
  .cabs{display:flex;overflow-x:auto;gap:8px;padding:10px 0 8px;margin-top:10px;scrollbar-width:none}
  .cabs::-webkit-scrollbar{display:none}
  .cabs .esp{display:none}
  .lane{flex:0 0 150px;gap:4px;padding:10px 12px}
  .lane .lc{display:none}
  .lane .ln b{font-size:30px}
  .carriles{grid-template-columns:46px minmax(0,1fr) !important;column-gap:8px}
  .pista{display:none}
  .h:before{left:40px}.h .nd{left:40px}
  .h time{width:34px;font-size:11px}
  .cx{grid-column:1 !important;margin-left:41px;margin-right:-8px}
  .cardb{grid-column:2 !important}
  .carriles[data-foco="sale"] .cardb:not([data-lane="sale"]),.carriles[data-foco="sale"] .cx:not([data-lane="sale"]),.carriles[data-foco="sale"] .h:not([data-lane="sale"]),
  .carriles[data-foco="dentro"] .cardb:not([data-lane="dentro"]),.carriles[data-foco="dentro"] .cx:not([data-lane="dentro"]),.carriles[data-foco="dentro"] .h:not([data-lane="dentro"]),
  .carriles[data-foco="entra"] .cardb:not([data-lane="entra"]),.carriles[data-foco="entra"] .cx:not([data-lane="entra"]),.carriles[data-foco="entra"] .h:not([data-lane="entra"]){display:none}
  .balance{padding:14px}
  .balance h2{font-size:21px}
  .etq{font-size:9.5px;letter-spacing:.06em}
  .cardb .sello{--sz:40px}
}
@media (prefers-reduced-motion:reduce){.cx.rev{transform:none}}
</style>
</head>
<body>
<script src="comun.js"></script>
<script>
const LANES = [
  { id:'sale',   n:'Salió',            pref:'−', flecha:'<path d="M7 17 17 7M9 7h8v8"/>', cls:'l-sale' },
  { id:'dentro', n:'Se movió dentro',  pref:'',  flecha:'<path d="M8 20V6M5 9l3-3 3 3M16 4v14M13 15l3 3 3-3"/>', cls:'l-dentro' },
  { id:'entra',  n:'Entró',            pref:'+', flecha:'<path d="M17 7 7 17M15 17H7V9"/>', cls:'l-entra' },
];
const laneDe = o => ({ venta:'sale', traslado:'sale', colgada:'dentro', subida:'dentro', llegada:'entra', devolucion:'entra', cambio:'entra' }[o.tipo] || (o.delta < 0 ? 'sale' : 'entra'));
const est = { dia:'hoy', foco:null };
const diasDe = d => d === 'hoy' ? ['hoy'] : d === 'ayer' ? ['ayer'] : ['hoy','ayer'];
const COLS = { null:'60px 1fr 1fr 1fr', sale:'60px 1.9fr .62fr .62fr', dentro:'60px .62fr 1.9fr .62fr', entra:'60px .62fr .62fr 1.9fr' };

M.montar({ opcion:'B', nombre:'Tres carriles', dibujar(raiz){
  raiz.innerHTML = M.encabezado({ frase:'Mira hacia dónde se mueve la ropa: lo que salió, lo que cambió de lugar y lo que entró.' }) + `
    <section class="tarjeta balance rev" id="balance"></section>
    <div class="controles">
      <div class="pils" id="dias"></div>
      <label class="campo">${M.ic('buscar')}<input id="q" type="search" placeholder="Busca una prenda, una boleta o a quien lo hizo" autocomplete="off"></label>
    </div>
    <div class="cabs" id="cabs" style="--cols:${COLS.null}"></div>
    <div class="carriles" id="car" style="--cols:${COLS.null}"></div>
    <p class="nota-pie"><b>Cómo se lee:</b> la posición ya lo dice —izquierda, salió de la tienda; centro, solo cambió de lugar; derecha, entró—. Toca un carril para ensancharlo y dejar los otros en fichas. Una <b>colgada</b> baja del almacén al piso; una <b>guardada en almacén</b> lo devuelve: el pequeño esquema de dos niveles lo muestra con la prenda que viaja.</p>`;
  let q = '';
  const dias = M.$('#dias', raiz);
  [['hoy','Hoy'],['ayer','Ayer'],['2','Los dos días']].forEach(([v, t]) => {
    const b = M.el('button', 'pil' + (est.dia === v ? ' on' : ''), t);
    b.onclick = () => { est.dia = v; M.$$('.pil', dias).forEach(x => x.classList.toggle('on', x === b)); pintar(); };
    dias.append(b);
  });
  M.$('#q', raiz).oninput = e => { q = e.target.value; pintarCarriles(); };

  const opsDelDia = () => M.OPS.filter(o => diasDe(est.dia).includes(o.dia));

  function pintar(){ pintarBalance(); pintarCabs(); pintarCarriles(); }

  /* ── balance ── */
  function totales(ops){
    const t = { sale:{ u:0, por:{} }, dentro:{ u:0, por:{} }, entra:{ u:0, por:{} } };
    ops.forEach(o => {
      if (o.tipo === 'cambio') { t.entra.u += o.entran; t.sale.u += o.salen; (t.entra.por.cambio = (t.entra.por.cambio || 0) + o.entran); (t.sale.por.cambio = (t.sale.por.cambio || 0) + o.salen); return; }
      const l = laneDe(o), u = l === 'dentro' ? o.u : Math.abs(o.delta);
      t[l].u += u; t[l].por[o.tipo] = (t[l].por[o.tipo] || 0) + u;
    });
    return t;
  }
  function pintarBalance(){
    const b = M.$('#balance', raiz), t = totales(opsDelDia()), total = t.sale.u + t.dentro.u + t.entra.u;
    b.classList.remove('in');
    b.innerHTML = `
      <div class="tit"><h2>${est.dia === 'ayer' ? 'Ayer' : est.dia === 'hoy' ? 'Hoy' : 'Estos dos días'}, la tienda movió ${total} prendas</h2><span class="sub">cada franja es un tipo de movimiento; su ancho, cuántas prendas</span></div>
      <div class="pila-dia">${LANES.map((l, k) => `<div class="seg-l ${l.cls}" style="--u:${Math.max(t[l.id].u, 1)};--k:${k}">${Object.entries(t[l.id].por).sort((a, b) => b[1] - a[1]).map(([tp, n]) => `<i class="t-${tp}" style="--u:${n}" title="${M.TIPOS[tp].pl}: ${n}"></i>`).join('')}</div>`).join('')}</div>
      <div class="etq">${LANES.map(l => `<span class="${l.cls}" style="--u:${Math.max(t[l.id].u, 1)}">${l.n} ${l.pref}${t[l.id].u}</span>`).join('')}</div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('in')));
  }

  /* ── cabezas de carril ── */
  function pintarCabs(){
    const c = M.$('#cabs', raiz), t = totales(opsDelDia());
    c.innerHTML = '<span class="esp"></span>';
    LANES.forEach(l => {
      const por = Object.entries(t[l.id].por).sort((a, b) => b[1] - a[1]);
      const b = M.el('button', 'lane ' + l.cls, `
        <span class="lt"><svg class="ic" viewBox="0 0 24 24">${l.flecha}</svg>${l.n}</span>
        <span class="ln"><b class="num" data-cuenta="${t[l.id].u}" data-pref="${l.pref}">0</b><small>prendas</small></span>
        <span class="lc">${por.map(([tp, n]) => `<span class="t-${tp}">${M.TIPOS[tp].pl} ${n}</span>`).join('')}</span>
        <span class="corta">quitar</span>`);
      b.setAttribute('aria-pressed', est.foco === l.id);
      b.onclick = () => { est.foco = est.foco === l.id ? null : l.id; aplicarFoco(); };
      c.append(b);
      M.contar(M.$('.ln b', b), t[l.id].u, 800, l.pref);
    });
    aplicarFoco(true);
  }
  function aplicarFoco(sin){
    const c = M.$('#cabs', raiz), car = M.$('#car', raiz);
    [c, car].forEach(x => { x.style.setProperty('--cols', COLS[est.foco]); if (est.foco) x.dataset.foco = est.foco; else delete x.dataset.foco; });
    M.$$('.lane', c).forEach((b, i) => b.setAttribute('aria-pressed', est.foco === LANES[i].id));
  }

  /* ── los carriles ── */
  const nivel = (o) => {
    const baja = o.tipo === 'colgada';
    return `<span class="niv ${baja ? 'baja' : 'sube'}" data-go><span class="n ${baja ? '' : 'dest'}">Almacén</span><span class="v"><i class="dot"></i></span><span class="n ${baja ? 'dest' : ''}">Piso</span></span>`;
  };
  function pintarCarriles(){
    const car = M.$('#car', raiz); car.innerHTML = '';
    const ops = opsDelDia().filter(o => M.coincide(o, q));
    let fila = 1; // la 1 es el espacio de las pistas
    const frag = document.createDocumentFragment();
    if (!ops.length) { car.innerHTML = `<div class="vacio"><b>Nada con esa búsqueda</b>Prueba con otra prenda o con otro día.</div>`; return; }
    let dia = null; const items = [];
    ops.forEach(o => {
      if (o.dia !== dia) { dia = o.dia; const cuantas = ops.filter(x => x.dia === dia).length; const d = M.el('div', 'dsep rev', `<b>${M.DIA[dia].etiqueta}</b><span>${M.DIA[dia].largo} · ${cuantas} ${M.plural(cuantas, 'operación', 'operaciones')}</span><i></i>`); d.style.gridRow = ++fila; frag.append(d); }
      const lane = laneDe(o), col = LANES.findIndex(l => l.id === lane) + 2, r = ++fila, t = M.TIPOS[o.tipo], pr = M.resumenPrendas(o);
      const h = M.el('div', `h t-${o.tipo} rev`, `<time class="num">${o.hora}</time><i class="nd"></i>`);
      h.style.gridRow = r; h.dataset.lane = lane;
      const cx = M.el('div', `cx t-${o.tipo} rev`); cx.style.gridRow = r; cx.style.gridColumn = `1 / ${col}`; cx.dataset.lane = lane;
      const c = M.el('article', `cardb t-${o.tipo} rev`, `
        <span class="sello" data-go>${M.glifo(o.tipo)}</span>
        <div class="mid">
          <div class="l1"><span class="tn">${t.n}${o.motivo ? ' · ' + o.motivo : ''}</span><span class="q"><i class="av">${M.inicial(o)}</i>${M.persona(o)}</span></div>
          <div class="nombre">${pr.principal}</div>
          <div class="det">${pr.tallas}${pr.mas ? ` · y ${pr.mas} ${M.plural(pr.mas, 'prenda', 'prendas')} más` : ''}</div>
          ${o.tipo === 'colgada' || o.tipo === 'subida' ? '' : `<div class="ref">${o.destino ? `${M.pt(o.origen)}<span>→</span>${M.pt(o.destino)}` : M.pt(o.origen)}</div>`}
        </div>
        <div class="cant"><b class="num">${M.textoDelta(o)}</b><small>${o.tipo === 'cambio' ? 'prendas' : M.plural(o.u, 'prenda', 'prendas')}</small></div>`);
      if (o.tipo === 'colgada' || o.tipo === 'subida') M.$('.mid', c).insertAdjacentHTML('beforeend', nivel(o));
      c.style.gridRow = r; c.style.gridColumn = col; c.dataset.lane = lane; c.dataset.go = ''; c.dataset.goHover = 1;
      c.tabIndex = 0;
      const enc = x => { h.classList.toggle('hl', x); cx.classList.toggle('hl', x); };
      c.onmouseenter = () => enc(true); c.onmouseleave = () => enc(false);
      c.onclick = () => M.cajon(o);
      c.onkeydown = e => { if (e.key === 'Enter') M.cajon(o); };
      frag.append(h, cx, c);
    });
    LANES.forEach((l, i) => { const p = M.el('div', 'pista ' + l.cls); p.style.gridColumn = i + 2; p.style.gridRow = `1 / ${fila + 2}`; frag.prepend(p); });
    car.append(frag);
    M.revelar(car);
  }
  pintar();
}});
</script>
</body>
</html>
