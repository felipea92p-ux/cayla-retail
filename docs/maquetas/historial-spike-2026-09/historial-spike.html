<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Ventas ▸ Historial (2026-09-26)
   Pregunta: ¿cómo se ve /vender/historial si (1) ayuda a ENCONTRAR una venta
   y a ACTUAR sobre ella llevando a las pantallas que trabajan de la mano con
   él (Cambios, Devoluciones, Comprobantes, Apartados, Clientas, Punto de Venta)
   y (2) el celular deja de ser «el escritorio apilado»?
   Todo se conmuta desde la barra negra (no existe en el ERP): «Hoy» reproduce
   la pantalla actual (capturas del 2026-09-26); «Propuesta» enciende lo marcado.
   Tokens = los de apps/web/app/globals.css (ADR-0169). Datos inventados.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;--t60:#5b544c;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t55:rgba(26,26,24,.55);--t40:rgba(26,26,24,.4);--t10:rgba(26,26,24,.10);--t07:rgba(26,26,24,.07);
  --m-efectivo:#d19a12;--m-tarjeta:#525a64;--m-yape:#6d3fa3;--m-plin:#1c6b56;--m-transf:#2f6aa3;--m-anticipo:#805c4c;
  --ease:cubic-bezier(.32,.72,.24,1);--bar:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd5c6}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;min-height:100vh}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:inherit}
input{outline:none}
.serif{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:11px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:15px;height:15px}svg.ic.xs{width:13px;height:13px}svg.ic.l{width:22px;height:22px}
@keyframes sube{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes hoja{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes lado{from{transform:translate3d(100%,0,0)}to{transform:none}}
@keyframes cascada{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:sticky;top:0;z-index:100;background:var(--tinta);color:var(--crema);font-size:13px}
.spk-f{display:flex;align-items:center;gap:14px;padding:8px 16px;overflow-x:auto;white-space:nowrap;min-height:var(--bar)}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:inline-flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden;flex:none}
.seg button{height:30px;padding:0 12px;font-size:12.5px;color:rgba(245,240,232,.7)}
.seg button.on{background:var(--crema);color:var(--tinta);font-weight:600}
.spk-op{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px 10px;border-top:1px solid rgba(245,240,232,.12);font-size:12.5px}
.spk-op label{cursor:pointer;display:flex;align-items:center;gap:6px;color:rgba(245,240,232,.8)}.spk-op input{accent-color:var(--rojo)}
.spk-op .pide{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid rgba(245,240,232,.3);color:rgba(245,240,232,.6)}
.spk-op.off{display:none}
.spk .sep{width:1px;height:22px;background:rgba(245,240,232,.18);flex:none}

.escena{padding:24px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.leyenda{max-width:1360px;width:100%;font-size:13px;color:var(--t80);background:var(--papel);border:1px solid var(--sand);border-radius:10px;padding:10px 14px}
.leyenda b{font-weight:600}

/* ---------- marco de escritorio ---------- */
.escritorio{width:1360px;max-width:100%;height:900px;background:var(--crema);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:248px 1fr;box-shadow:0 30px 60px -30px rgba(26,26,24,.35);position:relative}
.lat{border-right:1px solid var(--sand);padding:22px 12px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.lat .logo{display:flex;align-items:center;gap:10px;padding:0 12px 26px;color:var(--rojo);letter-spacing:.3em;font-weight:600;font-size:15px}
.lat a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--t80);text-decoration:none}
.lat a.sub{padding-left:34px;font-size:14.5px}
.lat a.on{background:var(--sand);color:var(--tinta);font-weight:500}
.lat a .flecha{margin-left:auto;opacity:.45}
.main{overflow-y:auto;position:relative}
.top{height:66px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 30px;border-bottom:1px solid var(--sand);position:sticky;top:0;background:rgba(245,240,232,.92);backdrop-filter:blur(8px);z-index:5}
.top .sede{border:1px solid var(--sand);border-radius:8px;padding:6px 12px;font-size:11.5px;letter-spacing:.14em;font-weight:600;background:var(--papel);display:flex;gap:8px;align-items:center}
.pag{padding:34px 40px 60px}

/* ---------- cabecera (EncabezadoPagina, ADR-0220) ---------- */
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:26px}
.cab .ruta{display:flex;align-items:center;gap:12px;color:var(--taupe);font-size:11.5px;letter-spacing:.16em;font-weight:600;text-transform:uppercase}
.cab .ruta:before{content:"";width:32px;height:1.5px;background:var(--taupe)}
.cab h1{font-family:'EB Garamond',serif;font-weight:500;font-size:46px;line-height:1.1;margin-top:8px}
.cab p{color:var(--t65);margin-top:4px;font-size:15px}
.cifras{display:flex;background:var(--papel);border-radius:20px;box-shadow:0 8px 24px -14px rgba(26,26,24,.25);padding:16px 26px;gap:28px}
.cifras div{text-align:center}.cifras div+div{border-left:1px solid var(--sand);padding-left:28px}
.cifras b{display:block;font-family:'EB Garamond',serif;font-weight:500;font-size:38px;line-height:1.1}
.cifras span{font-size:12.5px;color:var(--t65)}
.cifras .ayer{display:block;font-size:11px;color:var(--verde);margin-top:1px}

/* ---------- herramientas ---------- */
.rejilla{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:28px;align-items:start}
.buscador{display:flex;align-items:center;gap:10px;background:var(--hueso);border-radius:14px;padding:0 14px;height:48px;border:1.5px solid transparent;transition:border-color .2s}
.buscador:focus-within{border-color:var(--taupe);background:var(--papel)}
.buscador input{flex:1;background:none;border:0;font-size:15px;min-width:0}
.buscador input::placeholder{color:var(--t55)}
.buscador kbd{font:500 11px 'DM Sans';border:1px solid var(--sand);border-radius:5px;padding:1px 6px;color:var(--t55);background:var(--papel)}
.buscador .x{color:var(--t55);display:flex}
.fila-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{height:30px;padding:0 13px;border-radius:99px;border:1px solid var(--t40);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:transparent}
.pill.on{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.pill .cnt{font-size:10px;background:var(--ambar);color:var(--crema);border-radius:99px;padding:0 6px;letter-spacing:0;line-height:16px}
.pill.on .cnt{background:var(--crema);color:var(--tinta)}
.pill.mas{border-style:dashed;color:var(--t65)}
.sep-v{width:1px;height:20px;background:var(--sand);flex:none}
.btn{height:38px;padding:0 14px;border-radius:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--t40);white-space:nowrap}
.btn.prim{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.btn.sutil{border-color:var(--sand);background:var(--papel)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pop{position:absolute;z-index:20;background:var(--papel);border-radius:14px;box-shadow:0 20px 40px -18px rgba(26,26,24,.4);border:1px solid var(--sand);padding:12px;width:290px;animation:sube .25s var(--ease)}
.pop h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin:4px 6px 8px}
.pop label{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.pop label:hover{background:var(--hueso)}
.pop input{accent-color:var(--tinta);width:16px;height:16px}
.pop .fijo{margin-left:auto;font-size:10.5px;color:var(--t55)}
.pop small{display:block;color:var(--t55);font-size:12px;margin:6px 8px 2px}

/* ---------- avisos ---------- */
.avisos{display:grid;gap:8px;margin-top:16px}
.aviso{display:flex;align-items:center;gap:12px;background:var(--hueso);border-radius:12px;padding:10px 14px;font-size:13.5px}
.aviso .punto{width:8px;height:8px;border-radius:99px;flex:none}
.aviso a{margin-left:auto;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:4px}
.aviso .cerrar{color:var(--t55);display:flex}

.resultado{margin-top:18px;font-size:13px;color:var(--t65);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.resultado b{color:var(--tinta)}
.resultado button{text-decoration:underline;text-underline-offset:3px;color:var(--tinta);font-weight:500}

/* ---------- lista (hilo + días) ---------- */
.lista{position:relative;padding-left:44px;margin-top:22px}
.lista:before{content:"";position:absolute;left:11px;top:6px;bottom:0;width:1.5px;background:linear-gradient(var(--taupe),rgba(128,92,76,.15))}
.dia{margin-bottom:30px;animation:sube .45s var(--ease) both}
.dia h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;position:relative}
.dia h3 .et{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe)}
.dia h3 .et:before{content:"";position:absolute;left:-40px;top:1px;width:14px;height:14px;border-radius:99px;background:var(--crema);box-shadow:0 0 0 1.5px var(--taupe) inset, 0 0 0 4px var(--crema) inset;}
.dia h3 .et:after{content:"";position:absolute;left:-35px;top:6px;width:4px;height:4px;border-radius:99px;background:var(--taupe)}
.dia h3 .tot{font-size:12px;color:var(--t60)}.dia h3 .tot b{font-family:'EB Garamond',serif;font-size:18px;font-weight:500;color:var(--tinta)}
.hoja-dia{background:var(--papel);border-radius:20px;box-shadow:0 0 0 1px var(--t07);padding:6px}
.venta{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;padding:14px 20px;border-radius:16px;cursor:pointer;transition:background .2s}
.venta:hover{background:rgba(26,26,24,.025)}
.venta+.venta{border-top:1px dashed var(--t10)}
.venta.sel{background:rgba(128,92,76,.08)}
.racimo{display:flex;align-items:flex-start;grid-row:span 2}
.mini{width:40px;height:40px;border-radius:8px;box-shadow:0 0 0 2px var(--papel),inset 0 0 0 1px rgba(26,26,24,.12);flex:none;position:relative;background-size:cover}
.mini+.mini{margin-left:-14px}
.mini .x2{position:absolute;right:-6px;bottom:-6px;background:var(--tinta);color:var(--crema);font-size:10px;font-weight:600;border-radius:99px;padding:0 5px;line-height:16px;box-shadow:0 0 0 2px var(--papel)}
.venta .tit{font-family:'EB Garamond',serif;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venta .sub{font-size:14px;color:var(--t65);margin-top:1px}
.venta .meta{font-size:12px;color:var(--t55);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venta .der{text-align:right}
.venta .der b{font-family:'EB Garamond',serif;font-weight:500;font-size:22px;line-height:1}
.venta .der span{display:block;font-size:12px;color:var(--t55);margin-top:5px}
.venta .comp{grid-column:2/4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:500}
.venta.anulada .tit,.venta.anulada .der b{color:var(--t40)}.venta.anulada .der b{text-decoration:line-through}
.venta .ir{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s;color:var(--t40)}
mark{background:rgba(209,154,18,.28);color:inherit;border-radius:3px;padding:0 1px}

.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--hueso);color:var(--t80)}
.chip:before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.9}
.chip.verde{background:rgba(72,96,63,.12);color:var(--verde)}
.chip.ambar{background:rgba(116,80,26,.12);color:var(--ambar)}
.chip.rojo{background:rgba(184,65,45,.1);color:var(--rojo-p)}
.chip.pizarra{background:rgba(76,93,110,.12);color:var(--pizarra)}
.chip.apagado{background:transparent;box-shadow:inset 0 0 0 1px var(--sand);color:var(--t55)}
.chip.apagado.tach{text-decoration:line-through}
.chip.sinpunto:before{display:none}
.chip.link{cursor:pointer;position:relative;z-index:2}
.chip.link:hover{box-shadow:inset 0 0 0 1px currentColor}

/* ---------- pulso ---------- */
.pulso{background:var(--papel);border-radius:20px;box-shadow:0 0 0 1px var(--t07);padding:20px;position:sticky;top:90px}
.pulso h4{font-size:15px;font-weight:600}.pulso .p-sub{font-size:13px;color:var(--t60)}
.pulso .mejor{margin-top:14px;font-size:12.5px;color:var(--t60)}
.pulso .mejor b{display:block;font-family:'EB Garamond',serif;font-size:26px;font-weight:500;color:var(--tinta)}
.pulso .kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px dashed var(--sand);border-bottom:1px dashed var(--sand);padding:14px 0;margin:14px 0}
.pulso .kpis span{font-size:12.5px;color:var(--t60)}.pulso .kpis b{display:block;font-family:'EB Garamond',serif;font-size:19px;font-weight:500}
.barra-pago{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--sand);margin:10px 0 12px}
.leyp{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 10px;font-size:12.5px;align-items:center}
.leyp i{width:7px;height:7px;border-radius:99px;display:block}
.leyp .pc{color:var(--t55);text-align:right}.leyp .mt{text-align:right}
.enlaces-pulso{display:grid;gap:4px;margin-top:14px;border-top:1px dashed var(--sand);padding-top:12px}
.enlaces-pulso a{display:grid;grid-template-columns:1fr auto;align-items:center;font-size:13px;padding:6px 6px;color:var(--tinta);text-decoration:none;border-radius:8px;font-weight:500}
.enlaces-pulso a:hover{background:var(--hueso)}
.enlaces-pulso a span{grid-column:1;color:var(--t55);font-size:12px;font-weight:400}
.enlaces-pulso a svg{grid-row:1/3;grid-column:2}

.nota{margin-top:24px;font-size:12px;color:var(--t60);max-width:640px;line-height:1.6}.nota b{color:var(--tinta);font-weight:500}

/* ---------- detalle (Modal variante hoja, ADR-0136) ---------- */
.velo{position:absolute;inset:0;background:rgba(26,26,24,.28);backdrop-filter:blur(3px);z-index:30;animation:velo .25s var(--ease);display:flex;justify-content:center;align-items:flex-start;padding-top:70px}
.modal{width:540px;max-height:calc(100% - 100px);overflow:auto;background:var(--papel);border-radius:22px;box-shadow:0 30px 60px -20px rgba(26,26,24,.45);animation:sube .42s var(--ease)}
.modal>*{animation:cascada .4s var(--ease) both}
.modal>*:nth-child(2){animation-delay:55ms}.modal>*:nth-child(3){animation-delay:110ms}.modal>*:nth-child(4){animation-delay:165ms}.modal>*:nth-child(5){animation-delay:220ms}.modal>*:nth-child(6){animation-delay:275ms}
.m-cab{padding:22px 24px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.m-cab h2{font-family:'EB Garamond',serif;font-weight:500;font-size:26px;line-height:1.15}
.m-cab p{font-size:13px;color:var(--t60);margin-top:2px}
.m-cab .cerrar{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--hueso);flex:none}
.m-sec{padding:6px 24px 14px}
.m-sec h5{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:8px}
.linea{display:flex;align-items:center;gap:12px;padding:8px 0}
.linea+.linea{border-top:1px dashed var(--t10)}
.linea .n{flex:1;min-width:0}.linea .n b{font-weight:500;display:block;font-size:14px}.linea .n span{font-size:12.5px;color:var(--t55)}
.linea .p{font-variant-numeric:tabular-nums;font-size:14px}
.linea .pv{font-size:11.5px;color:var(--pizarra);display:block}
.tot-m{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--sand);padding-top:10px;margin-top:4px}
.tot-m b{font-family:'EB Garamond',serif;font-size:26px;font-weight:500}
.pagos-m{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13px}
.datos span{display:block;color:var(--t55);font-size:11.5px}
.datos a{color:var(--tinta);text-underline-offset:3px}
.datos .chip{width:fit-content}
.traza{position:relative;padding-left:20px}
.traza:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--sand)}
.traza div{position:relative;font-size:13px;padding:3px 0}
.traza div:before{content:"";position:absolute;left:-19px;top:9px;width:9px;height:9px;border-radius:99px;background:var(--papel);box-shadow:inset 0 0 0 1.5px var(--taupe)}
.traza div.ok:before{background:var(--verde);box-shadow:none}.traza div.aviso-t:before{background:var(--ambar);box-shadow:none}.traza div.pv:before{background:var(--pizarra);box-shadow:none}
.traza span{color:var(--t55);font-size:12px;margin-left:6px}
.acciones{padding:14px 24px 22px;background:var(--hueso);border-radius:0 0 22px 22px}
.acciones h5{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600;margin-bottom:10px}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{background:var(--papel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px;font-weight:500;min-height:74px;position:relative;box-shadow:0 0 0 1px var(--t07);transition:box-shadow .2s}
.acc:hover{box-shadow:0 0 0 1.5px var(--taupe)}
.acc small{font-weight:400;font-size:11.5px;color:var(--t55);line-height:1.3}
.acc.dest{background:var(--tinta);color:var(--crema)}.acc.dest small{color:rgba(245,240,232,.65)}
.acc.peligro{color:var(--rojo-p)}
.acc[disabled]{opacity:.45;cursor:not-allowed}
.acc .pide{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--t40);border-radius:99px;padding:0 5px;color:var(--t55);font-weight:600}
.acc.dest .pide{border-color:rgba(245,240,232,.4);color:rgba(245,240,232,.7)}
.imprimir-hoy{display:flex;gap:10px;padding:16px 24px 22px}

/* toast de destino (demo) */

<script>
/* =====================================================================

const HOY = "2026-09-26";
const COLAB = "Angie Chavez";           // la colaboradora que mira en modo «Colaboradora»

    pagos: [["tarjeta", 150], ["efectivo", 41.8]], comp: { tipo: "Factura", num: "F004-000011", estado: "rechazado" } },
  { id: "b12", fecha: "2026-08-02", hora: "12:05", sede: "AQP", vendedor: "Nicole Blas",
    clienta: { nombre: "María Quispe", doc: "DNI 41877620" },

    pagos: [["plin", 149.9]], comp: { tipo: "Boleta", num: "B002-000012", estado: "aceptado" } },
];
const total = v => v.prendas.reduce((s, p) => s + p.precio, 0);
const METODO = { efectivo: ["Efectivo", "--m-efectivo"], tarjeta: ["Tarjeta", "--m-tarjeta"], yape: ["Yape", "--m-yape"], plin: ["Plin", "--m-plin"], transferencia: ["Transferencia", "--m-transf"], anticipo: ["Anticipo", "--m-anticipo"] };
const ESTADO = { aceptado: ["Aceptado", "verde"], pendiente: ["Pendiente de enviar", "ambar"], rechazado: ["Rechazado", "rojo"], interna: ["Interna — no va a SUNAT", "apagado tach"] };

/* =====================================================================
   ESTADO DEL SPIKE
   ===================================================================== */
const S = {
  vista: "escritorio", modo: "propuesta", rol: "lider", cel: "hoja",
  o: { buscador: true, rapidas: true, avisos: true, acciones: true, marcas: true, traza: true, whatsapp: false, volver: false, exportar: false, operacion: false, nota: false },
  q: "", periodo: "30", atajos: new Set(), fijados: ["mias", "porEnviar"], pop: false, filtros: false,
  abierta: null, celAbierta: {}, avisosCerrados: new Set(), resumenAbierto: false,
};
const prop = k => S.modo === "propuesta" && S.o[k];
// Atajos: tres de fábrica (fijos) y el resto a elección de cada colaboradora (en el ERP, recordado por persona).
const ATAJOS = {
  mias:       { et: "Mis ventas", fijo: true, f: v => v.vendedor === (S.rol === "colab" ? COLAB : "Felipe Alvarez") },
  porEnviar:  { et: "Por enviar", fijo: true, cuenta: true, f: v => ["pendiente", "rechazado"].includes(v.comp?.estado) },
  sinComp:    { et: "Sin comprobante", f: v => !v.comp },
  posventa:   { et: "Con cambio o devolución", f: v => !!v.posventa },
  apartado:   { et: "Desde apartado", f: v => !!v.apartado },
  facturas:   { et: "Facturas", f: v => v.comp?.tipo === "Factura" },
  clienta:    { et: "Con clienta", f: v => !!v.clienta },
  anuladas:   { et: "Anuladas", f: v => !!v.anulada },
  yape:       { et: "Pagó con Yape", f: v => v.pagos.some(p => p[0] === "yape") },
};

/* =====================================================================
   FILTRADO Y BÚSQUEDA
   ===================================================================== */
const sinTilde = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const diasAtras = f => Math.round((new Date(HOY) - new Date(f)) / 864e5);
function enPeriodo(v) {
  if (S.periodo === "hoy") return v.fecha === HOY;
  return diasAtras(v.fecha) < Number(S.periodo);
}
function coincide(v, q) {
  const t = sinTilde(q.trim()); if (!t) return true;
  const campos = [v.comp?.num, v.comp?.num?.replace(/-0+/, "-"), v.clienta?.nombre, v.clienta?.doc, v.vendedor, ...v.prendas.flatMap(p => [p.nombre, p.sku, p.color])];
  return campos.some(c => c && sinTilde(c).includes(t));
}
function ventasVisibles() {
  const buscando = prop("buscador") && S.q.trim();
  let l = VENTAS.filter(v => (buscando ? coincide(v, S.q) : enPeriodo(v)));
  if (S.rol === "colab") l = l.filter(v => v.sede === "TRU");
  if (prop("rapidas")) for (const a of S.atajos) l = l.filter(ATAJOS[a].f);
  return l;
}
const fueraDePeriodo = () => (prop("buscador") && S.q.trim()) ? ventasVisibles().filter(v => !enPeriodo(v)).length : 0;
function resaltar(texto) {
  const q = prop("buscador") ? S.q.trim() : ""; if (!q) return esc(texto);
  const i = sinTilde(texto).indexOf(sinTilde(q)); if (i < 0) return esc(texto);
  return esc(texto.slice(0, i)) + "<mark>" + esc(texto.slice(i, i + q.length)) + "</mark>" + esc(texto.slice(i + q.length));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const soles = n => "S/ " + n.toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"], MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "setiembre", "octubre", "noviembre", "diciembre"];
function etiquetaDia(f) {
  const d = diasAtras(f); if (d === 0) return "Hoy"; if (d === 1) return "Ayer";
  const x = new Date(f + "T12:00:00"); return `${DIAS[x.getDay()]}, ${x.getDate()} de ${MESES[x.getMonth()]}`;
}
function agrupar(l) { const m = new Map(); for (const v of l) { if (!m.has(v.fecha)) m.set(v.fecha, []); m.get(v.fecha).push(v); } return [...m]; }

/* Título de la venta: «Test de Produto 2 ×2», no «Test de Produto 2, Test de Produto 2» (hallazgo 8). */
function titulo(v) {
  if (S.modo === "hoy") return v.prendas.map(p => p.nombre).join(", ");
  const c = new Map(); for (const p of v.prendas) c.set(p.nombre, (c.get(p.nombre) || 0) + 1);
  return [...c].map(([n, k]) => k > 1 ? `${n} ×${k}` : n).join(", ");
}

function miniaturas(v) {
  const vis = []; const vistos = new Map();
  for (const p of v.prendas) { const k = p.nombre + p.color; vistos.set(k, (vistos.get(k) || 0) + 1); if (vistos.get(k) === 1) vis.push(p); }
  return `<div class="racimo">${vis.slice(0, 3).map(p => {
    const k = vistos.get(p.nombre + p.color); const x2 = S.modo === "propuesta" && k > 1 ? `<span class="x2">×${k}</span>` : "";
    const bg = p.hex === "foto" ? "background:linear-gradient(135deg,#c93a32 0 30%,#eee 30% 60%,#3b3b3b 60%)" : `background:${p.hex}`;
    // «Hoy» dibuja un mosaico por prenda (dos celestes encimados); la propuesta junta iguales con ×N.
    if (S.modo === "hoy" && k > 1) return `<span class="mini" style="${bg}"></span>`.repeat(k);
    return `<span class="mini" style="${bg}">${x2}</span>`;
  }).join("")}</div>`;
}
function chipComp(v, enlazar) {

  return `<span>${v.comp.tipo} ${resaltar(v.comp.num)}</span><span class="chip ${tono}${accionable ? " link" : ""}" ${accionable ? `data-ir="reintentar" data-id="${v.id}" title="Ir a Comprobantes ▸ Por reintentar"` : ""}>${t}${accionable ? " →" : ""}</span>`;

function chipsMarcas(v) {

  if (v.apartado) h += `<span class="chip pizarra link" data-ir="apartado" data-id="${v.id}">Desde apartado ${v.apartado.cod}</span>`;

function metaTexto(v) {

  }
  const periodos = S.modo === "hoy" ? [["7", "7 días"], ["30", "30 días"], ["90", "90 días"], ["p", "Personalizado"]] : [["hoy", "Hoy"], ["7", "7 días"], ["30", "30 días"], ["90", "90 días"], ["p", "Personalizado"]];

    const perTxt = periodos.find(p => p[0] === S.periodo)?.[1] ?? "30 días";

      ${(v.posventa || []).map(pv => `<div class="pv">${pv.texto}<span>${pv.cuando}</span></div>`).join("")}

  const acciones = prop("acciones") ? accionesVenta(v, movil) : `<div class="imprimir-hoy"><button class="btn sutil">${ic("impr", "s")} Imprimir ticket</button><button class="btn sutil">${ic("impr", "s")} Imprimir ${v.comp?.tipo === "Factura" ? "factura" : "boleta"} A4</button></div>`;

function listaAcciones(v) {

document.getElementById("spk").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.v) S.vista = b.dataset.v; if (b.dataset.m) S.modo = b.dataset.m; if (b.dataset.r) S.rol = b.dataset.r; if (b.dataset.c) { S.cel = b.dataset.c; S.celAbierta = {}; }
  if (S.modo === "hoy") { S.atajos.clear(); S.q = ""; if (S.periodo === "hoy") S.periodo = "30"; }
  for (const seg of b.parentElement.children) seg.classList.toggle("on", seg === b);
  S.abierta = null; pintar();
});
document.getElementById("spk-op").addEventListener("change", ev => { const k = ev.target.dataset.o; if (k) { S.o[k] = ev.target.checked; pintar(); } });
document.getElementById("escena").addEventListener("input", ev => { if (ev.target.matches("[data-q]")) { S.q = ev.target.value; pintar(); } });
document.getElementById("escena").addEventListener("change", ev => {
  const k = ev.target.dataset.fijar; if (!k) return;
  S.fijados = ev.target.checked ? [...S.fijados, k] : S.fijados.filter(x => x !== k); if (!ev.target.checked) S.atajos.delete(k); pintar();
});
document.getElementById("escena").addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest(".pop")) return;
  const ir = t.closest("[data-ir]"); if (ir) { ev.preventDefault(); ev.stopPropagation(); aviso(ir.dataset.ir, ir.dataset.id); return; }
  if (t.closest("[data-limpiar]")) { S.q = ""; return pintar(); }
  const per = t.closest("[data-periodo]"); if (per) { S.periodo = per.dataset.periodo === "p" ? S.periodo : per.dataset.periodo; return pintar(); }
  const at = t.closest("[data-atajo]"); if (at) { const k = at.dataset.atajo; S.atajos.has(k) ? S.atajos.delete(k) : S.atajos.add(k); return pintar(); }
  if (t.closest("[data-ciclo]")) { const o = ["hoy", "7", "30", "90"]; S.periodo = o[(o.indexOf(S.periodo) + 1) % o.length]; return pintar(); }
  if (t.closest("[data-pop]")) { S.pop = !S.pop; return pintar(); }
  if (t.closest("[data-filtros]")) { S.filtros = !S.filtros; return pintar(); }
  const ca = t.closest("[data-cerrar-aviso]"); if (ca) { S.avisosCerrados.add(ca.dataset.cerrarAviso); return pintar(); }
  if (t.closest("[data-resumen]")) { S.resumenAbierto = !S.resumenAbierto; return pintar(); }
  const cc = t.closest("[data-cel-cerrar]"); if (cc && (t === cc || t.closest("button[data-cel-cerrar]"))) { delete S.celAbierta[cc.dataset.celCerrar]; return pintar(); }
  const ca2 = t.closest("[data-cel-abrir]"); if (ca2 && !t.closest(".t-velo,.t-pagina")) { S.celAbierta[ca2.dataset.variante] = ca2.dataset.celAbrir; return pintar(); }
  if (t.closest("[data-cerrar-btn]") || t.matches("[data-cerrar]")) { S.abierta = null; return pintar(); }
  const ab = t.closest("[data-abrir]"); if (ab) { S.abierta = ab.dataset.abrir; return pintar(); }
  if (S.pop) { S.pop = false; pintar(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (S.pop) S.pop = false; else if (S.abierta) S.abierta = null; else S.celAbierta = {}; pintar(); }
  if (ev.key === "/" && !ev.target.matches("input") && S.vista === "escritorio") { ev.preventDefault(); document.querySelector("[data-q]")?.focus(); }
});
pintar();
</script>
</body>
</html>
