<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rendimiento: propuesta final con notas en «!» · spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Rendimiento, PROPUESTA FINAL (2026-10-03): pestañas por tienda + proyección del mes, ventas por hora y prendas por venta
   Pregunta de Felipe: ¿tres vistas (una por tienda, abriendo la de la sesión activa) o todas apiladas como hoy?
   A · Pestañas por tienda (la idea de Felipe)   B · Tienda activa + las otras al costado
   C · Tablero de la cadena (comparar)           D · Día en vivo, hora a hora
   Reglas que NO se tocan (acta 2026-09-26 / 2026-09-29): reconocer y acompañar, sin dinero ni bono; las devoluciones no
   restan; el rojo no se usa para juzgar (solo «Adelante / En ritmo / Por debajo»); una líder ve solo su tienda.
   NO es una implementación: no toca la web ni la base. Datos INVENTADOS. Tokens = apps/web/app/globals.css (ADR-0169).
   La barra oscura de arriba no existe en el ERP.
   ==================================================================== */
:root{
  --rojo:#b8412d;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf8f2;--hueso:#eae1d2;
  --taupe:#805c4c;--verde:#48603f;--ambar:#74501a;--pizarra:#4c5d6e;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);--t06:rgba(26,26,24,.06);
  --ease:cubic-bezier(.32,.72,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:#ddd5c6;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px;color:var(--t65)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'EB Garamond',Georgia,serif;font-weight:400;line-height:1.15}

/* barra del demo */
.spk{position:sticky;top:0;z-index:90;background:var(--tinta);color:var(--crema);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;font-size:12.5px}
.spk .tit{font-family:'EB Garamond',serif;font-size:19px;align-self:center}
.spk .g{display:flex;flex-direction:column;gap:4px}
.spk .g>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.seg{display:flex;border:1px solid rgba(245,240,232,.25);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;color:rgba(245,240,232,.75);white-space:nowrap}
.seg button+button{border-left:1px solid rgba(245,240,232,.18)}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--tinta);font-weight:600}
.spk label{display:flex;gap:6px;align-items:center;color:rgba(245,240,232,.85);cursor:pointer}

.mundo{padding:22px;display:grid;gap:18px;justify-items:center}
.marco{width:100%;max-width:1180px;background:var(--crema);border-radius:14px;box-shadow:0 20px 50px -20px rgba(26,26,24,.35);overflow:hidden;transition:max-width .35s var(--ease)}
.marco.cel{max-width:395px;border:10px solid #1a1a18;border-radius:38px}
.cab-erp{height:54px;border-bottom:1px solid var(--t10);display:flex;align-items:center;gap:12px;padding:0 24px;font-size:13px}
.cab-erp .esp{flex:1}
.chipcab{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--sand);border-radius:8px;background:var(--papel);font-size:11px;letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.vista{container-type:inline-size;padding:26px 30px 40px}
.cel .vista{padding:18px 14px 30px}
.sobre{color:var(--rojo);text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.vista h1{font-size:34px;margin-top:4px}
.bajada{color:var(--taupe);font-size:14px;margin-top:6px;max-width:620px}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:12px}
.sec{margin-top:24px}
.sec h3{font-size:21px;margin-bottom:10px}
.mt{margin-top:14px}

/* píldoras y pestañas */
.pil{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pil button{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--sand);background:var(--papel);font-size:13px;color:var(--t80);transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.pil button:hover{border-color:var(--taupe)}
.pil button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:18px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;border-radius:99px;padding:0 8px;background:var(--hueso);white-space:nowrap;line-height:19px}
.chip.pz{background:rgba(76,93,110,.14);color:var(--pizarra)}
.chip.am{background:rgba(116,80,26,.12);color:var(--ambar)}
.chip.vd{background:rgba(72,96,63,.14);color:var(--verde)}
.chip.tx{background:rgba(128,92,76,.14);color:var(--taupe)}
.pto{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--t30)}
.pto.vd{background:var(--verde)}.pto.am{background:var(--ambar)}.pto.pz{background:var(--pizarra)}

/* barras de avance */
.bar{height:8px;border-radius:9px;background:var(--t10);position:relative}
.bar i{display:block;height:100%;border-radius:9px;background:var(--verde);transition:width .5s var(--ease)}
.bar i.pz{background:var(--pizarra)}.bar i.am{background:var(--ambar)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);border-radius:2px}

/* cifras */
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@container (max-width:700px){.cifras{grid-template-columns:1fr 1fr}}
.cifra{padding:14px 16px}
.cifra .v{font-family:'EB Garamond',serif;font-size:28px;line-height:1.1;margin-top:4px}
.cifra .d{font-size:12.5px;color:var(--t65);margin-top:3px}
.cifra .bar{margin-top:9px}

/* pestañas por tienda (variante A) */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
@container (max-width:700px){.tabs{gap:6px}.tab{padding:10px}.tab .t1{flex-direction:column;align-items:flex-start;gap:4px;font-size:13px}.tab .t2{font-size:19px}.tab .t3{display:none}}
.tab{text-align:left;padding:13px 16px;border:1px solid var(--sand);border-radius:12px;background:var(--papel);position:relative;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.tab:hover{border-color:var(--taupe)}
.tab[aria-selected=true]{border-color:var(--tinta);box-shadow:inset 0 -3px 0 var(--tinta)}
.tab .t1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tab .t2{font-family:'EB Garamond',serif;font-size:26px;line-height:1.1;margin-top:2px}
.tab .t3{font-size:12px;color:var(--t65);margin-top:2px}
.tab .bar{margin-top:8px}

/* tabla de personas */
.tp{overflow:hidden}
.fp,.cab-t{display:grid;grid-template-columns:minmax(0,1.6fr) 100px 100px minmax(0,1.4fr) 92px;gap:10px;align-items:center;padding:12px 16px}
.cab-t{background:var(--hueso);font-size:12px;color:var(--t65);padding-top:9px;padding-bottom:9px}
.fp+.fp{border-top:1px solid var(--t10)}
.avt{width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:15px;flex:none}
.per{display:flex;gap:11px;align-items:center;min-width:0}
.per .nom{font-size:14px;font-weight:500;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.per .sub{font-size:12px;color:var(--t65)}
.cv{font-size:14px}.cv small{display:block;font-size:11px;color:var(--t65)}
@container (max-width:700px){
  .cab-t{display:none}
  .fp{grid-template-columns:1fr 1fr;row-gap:8px}
  .fp .per{grid-column:1/-1}
  .fp .av{grid-column:1/-1}
}

/* gráfico */
.graf{padding:16px 18px}
.graf svg{width:100%;height:200px;display:block}
.graf .ejes text{font-size:11px;fill:var(--t65);font-family:'DM Sans'}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t65);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* variante B */
.dosCol{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px;align-items:start}
@container (max-width:900px){.dosCol{grid-template-columns:1fr}}
.otra{padding:14px 16px;text-align:left;width:100%;border:1px solid var(--sand);border-radius:12px;background:var(--papel);display:block;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.otra:hover{border-color:var(--taupe);transform:translateY(-1px)}
.otra+.otra{margin-top:10px}
.otra .t1{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.otra .t2{font-family:'EB Garamond',serif;font-size:24px;margin-top:2px}
.otra .t3{font-size:12px;color:var(--t65)}
.otra svg{width:100%;height:34px;display:block;margin-top:6px}

/* variante C */
.cad{overflow:hidden}
.cad .filaT{display:grid;grid-template-columns:minmax(0,1.2fr) 120px minmax(0,1.6fr) 110px 40px;gap:12px;align-items:center;padding:14px 16px;width:100%;text-align:left}
.cad .filaT.cab{background:var(--hueso);font-size:12px;color:var(--t65);padding:9px 16px}
.cad .bloque+.bloque{border-top:1px solid var(--t10)}
.cad .det{padding:4px 16px 16px 16px;border-top:1px dashed var(--sand);background:rgba(251,248,242,.6)}
.cad .flecha{transition:transform .25s var(--ease);justify-self:end;color:var(--t50)}
.cad .abierto .flecha{transform:rotate(90deg)}
@container (max-width:700px){.cad .filaT{grid-template-columns:1fr 1fr}.cad .filaT.cab{display:none}.cad .filaT .barra{grid-column:1/-1}}

/* variante D */
.cinta{padding:14px 16px}
.turno{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.turno+.turno{border-top:1px solid var(--t06)}
.pista{height:22px;border-radius:7px;background:var(--t06);position:relative;overflow:hidden}
.pista .tr{position:absolute;top:0;bottom:0;background:rgba(72,96,63,.2);border-left:2px solid var(--verde);border-radius:4px}
.pista .ahora{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tinta)}
@container (max-width:700px){.turno{grid-template-columns:90px 1fr 70px}}

/* bloques extra */
.ext{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:10px}
.ext .card{padding:14px 16px}
.ext .v{font-family:'EB Garamond',serif;font-size:26px;line-height:1.1;margin:4px 0}
.ext .d{font-size:12.5px;color:var(--t65)}
.hh{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px}
.hh i{flex:1;background:var(--sand);border-radius:3px 3px 0 0;position:relative}
.hh i.top{background:var(--taupe)}

.nota{margin-top:22px;background:var(--hueso);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--t80)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--t06),var(--t10),var(--t06));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.bar i,.otra,.tab{transition:none}}

/* «!» de ayuda (como Productos): se toca y explica; cierra al tocar afuera o con Escape */
.ay{position:relative;display:inline-block;vertical-align:middle;margin-left:8px}
.ay>button{width:22px;height:22px;border-radius:50%;background:var(--rojo);color:var(--crema);font-weight:700;font-size:13px;line-height:22px;text-align:center;transition:transform .2s var(--ease)}
.ay>button:hover{transform:scale(1.08)}
.ay .globo{display:none;position:absolute;z-index:40;top:30px;left:-8px;width:min(340px,80vw);background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px -12px rgba(26,26,24,.35);font-size:13.5px;line-height:1.55;color:var(--t80);text-align:left;font-weight:400;text-transform:none;letter-spacing:0}
.ay.abierto .globo{display:block}
.ay .globo b.t{display:block;font-family:'DM Sans';color:var(--rojo);text-transform:uppercase;letter-spacing:.13em;font-size:11px;margin-bottom:6px}
.ay .globo .par{display:block}.ay .globo .par+.par{margin-top:8px}
/* rankings */
.rk{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@container (max-width:760px){.rk{grid-template-columns:1fr}}
.rk h4{font-family:'DM Sans';font-weight:600;font-size:14px;color:var(--taupe);margin-bottom:8px}
.rk .tab{display:block;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--papel);border:1px solid var(--sand);position:static;box-shadow:none}
.rk .cab{display:flex;justify-content:space-between;padding:9px 16px;background:var(--hueso);font-size:12px;color:var(--t65)}
.rk .f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;font-size:14px}
.rk .f+.f{border-top:1px solid var(--t10)}
.rk .cota{display:block;font-size:11px;color:var(--t50);text-align:right}
.rk .pos{color:var(--t50);font-size:12px;width:16px;display:inline-block}
.nota-demo{margin-top:8px;font-size:12px;color:var(--t65)}
/* panel «por qué» (solo del demo) */
.porque{width:100%;max-width:1180px;background:var(--papel);border:1px dashed var(--taupe);border-radius:12px;padding:16px 20px;font-size:13.5px;color:var(--t80)}
.porque h4{font-family:'EB Garamond',serif;font-weight:400;font-size:20px;margin-bottom:6px}
.porque .dos{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
@media (max-width:760px){.porque .dos{grid-template-columns:1fr}}
.porque b{font-weight:600}
.porque ul{margin:4px 0 0 18px}
</style>
</head>
<body>

<div class="spk" id="barra">
  <span class="tit">Rendimiento · propuesta final</span>
  <div class="g"><span>Ver como</span><div class="seg" data-k="rol"><button data-v="admin">Admin (3 tiendas)</button><button data-v="lider">Líder de una tienda</button></div></div>
  <div class="g"><span>Sesión activa en</span><div class="seg" data-k="sesion"><button data-v="TRU">TRU</button><button data-v="AQP">AQP</button><button data-v="LIM">LIM</button></div></div>
  <div class="g"><span>Período</span><div class="seg" data-k="per"><button data-v="hoy">Hoy</button><button data-v="sem">Semana</button><button data-v="mes">Mes</button></div></div>
  <div class="g"><span>Hora de hoy</span><div class="seg" data-k="hora"><button data-v="11">11:00 a. m.</button><button data-v="17">5:40 p. m.</button></div></div>
  <div class="g"><span>Demo</span><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="chkCota"> Mostrar la cota del ranking</label></div>
  <div class="g"><span>Ancho</span><div class="seg" data-k="ancho"><button data-v="pc">Computadora</button><button data-v="cel">Celular 375</button></div></div>
</div>

<div class="mundo">
  <div class="marco" id="marco">
    <div class="cab-erp"><b style="letter-spacing:.24em;font-size:13px">CAYLA</b><span class="esp"></span><span class="chipcab" id="chipSesion"></span></div>
    <div class="vista" id="vista"></div>
  </div>
  <div class="porque" id="porque"></div>
</div>

<script>
/* ---------- Datos INVENTADOS ---------- */
// persona: [nombre, rol, turno, hoy, sem, mes, metaMes, nVentasMes, prendasMes]
const T = {
  TRU:{n:'Tienda TRU', metaMes:14000, metaHoy:540, horario:true, gente:[
    ['Chiara','Encargada','9:00 – 18:00',150,650,2650,3000,31,58],
    ['Mateo','','10:00 – 19:00',120,600,2480,2800,28,52],
    ['Lucía','','Descanso',0,520,2210,2800,25,44],
    ['Renzo','','12:00 – 20:00',80,450,1980,2600,22,36],
    ['Valeria','','10:00 – 19:00',90,540,2260,2800,26,47]]},
  AQP:{n:'Tienda AQP', metaMes:16000, metaHoy:615, horario:false, gente:[
    ['Camila','Encargada','9:00 – 18:00',250,1500,6240,6000,41,83],
    ['Diego','','10:00 – 19:00',150,1020,4310,5000,29,51],
    ['Sofía','','10:00 – 19:00',130,1180,4890,5000,33,60]]},
  LIM:{n:'Tienda LIM', metaMes:5000, metaHoy:192, horario:false, gente:[
    ['Andrea','','10:00 – 19:00',80,520,2100,2500,12,21],
    ['Joaquín','','10:00 – 19:00',50,400,1650,2500,9,15]]}
};
const DIA_MES = 23, DIAS = 30;               // «hoy» es el día 23 de 30
const SEMANA = [290,330,350,380,420,520,440];  // TRU, últimos 7 días (hoy = último)
const HORAS = [0,15,50,95,140,185,235,300,390,470,520,550,560]; // acumulado de 9 a 21 h; a las 17:40 lleva S/ 440
const CURVA = [0,.03,.09,.17,.25,.33,.42,.54,.70,.84,.93,.98,1]; // cuánto de la venta del día suele estar hecho a cada hora // acumulado TRU de 9 a 20 h (hoy)
const S = {demoCota:false,vista:'A',rol:'admin',sesion:'TRU',per:'hoy',hora:'17',ancho:'pc',tab:'TRU',cargadas:new Set(['TRU']),abierta:'TRU',x:{proy:true,hora:true,prend:true}};
const f = n => 'S/ ' + Math.round(n).toLocaleString('es-PE');
const frac = () => S.hora==='11' ? CURVA[2] : CURVA[8]+(CURVA[9]-CURVA[8])*.67;   // cuánto de la venta del día ya debería estar hecho
const hoyK = () => S.hora==='11' ? HORAS[2]/440 : 1;   // cuánto de lo vendido hoy ya está a esa hora
const $ = s => document.querySelector(s);

/* ---------- Cálculos ---------- */
function persona(p,escala=1){ // → cifras de una persona en el período elegido
  const [nom,rol,turno,h,s,m,metaM,nv,pr]=p;
  const descanso=turno==='Descanso'&&S.per==='hoy';
  const k = S.per==='hoy' ? h*hoyK() : S.per==='sem' ? s : m;
  const meta = S.per==='hoy' ? (descanso?0:metaM/26*escala) : S.per==='sem' ? metaM/26*6 : metaM;
  const esp = S.per==='hoy' ? meta*frac() : S.per==='sem' ? meta*(5.2/6) : meta*(DIA_MES/DIAS);
  const nvp = Math.max(k>0?1:0,Math.round(nv/DIA_MES*(S.per==='hoy'?hoyK():S.per==='sem'?6:DIA_MES)));
  return {nom,rol,turno,vend:k,meta,esp,nv:nvp,pr:Math.round(pr*nvp/nv),descanso};
}
function tienda(id){
  const t=T[id], act=t.gente.filter(g=>g[2]!=='Descanso').reduce((a,g)=>a+g[6],0), escala=t.metaMes/act, ps=t.gente.map(g=>persona(g,escala));
  const vend=ps.reduce((a,p)=>a+p.vend,0), meta=ps.reduce((a,p)=>a+p.meta,0), esp=ps.reduce((a,p)=>a+p.esp,0);
  const nv=ps.reduce((a,p)=>a+p.nv,0), pr=ps.reduce((a,p)=>a+p.pr,0);
  const mesV=t.gente.reduce((a,g)=>a+g[5],0);
  return {id,t,ps,vend,meta,esp,nv,pr,ticket:vend/nv,pct:meta?vend/meta:0,estado:estado(vend,esp),mesV,
    proy:mesV/(DIA_MES/DIAS)};
}
function estado(v,e){ if(!e) return ['sin meta','']; const r=v/e; return r>=1.05?['Adelante','vd']:r>=.9?['En ritmo','pz']:['Por debajo','am']; }
const visibles = () => S.rol==='admin' ? ['TRU','AQP','LIM'] : [S.sesion];
const orden = () => { const v=visibles(); return [S.sesion,...v.filter(x=>x!==S.sesion)].filter(x=>v.includes(x)); }; // la de la sesión primero

/* ---------- Piezas ---------- */
const chip=(e)=>`<span class="chip ${e[1]}"><i class="pto ${e[1]}"></i>${e[0]}</span>`;
const barra=(v,meta,esp,cls='')=>`<div class="bar"><i class="${cls}" style="width:${Math.min(100,meta?v/meta*100:0)}%"></i>${esp?`<b style="left:${Math.min(100,esp/meta*100)}%"></b>`:''}</div>`;

function graficoSemana(d){

}

function ayuda(titulo,html){html=html.replace(/<p>/g,'<span class="par">').replace(/<\/p>/g,'</span>');return `<span class="ay"><button type="button" aria-label="Ayuda: ${titulo}" data-ay>!</button><span class="globo" role="dialog"><b class="t">${titulo}</b>${html}</span></span>`;}
// Mes completo de cada persona: [nombre, ventas, soles, horas]. Lucía tiene pocas ventas y un número alto (la «racha de suerte»).
const MES_P={TRU:[['Chiara',31,2650,150],['Mateo',28,2480,150],['Lucía',8,700,30],['Renzo',22,1980,120],['Valeria',26,2260,140]],AQP:[['Camila',41,6240,150],['Diego',29,4310,140],['Sofía',33,4890,150]],LIM:[['Andrea',12,2100,120],['Joaquín',9,1650,100]]};
const Z=2,CV=1,K=40;
function rankingHora(id){
  const P=MES_P[id], H=P.reduce((a,p)=>a+p[3],0), S=P.reduce((a,p)=>a+p[2],0), V=P.reduce((a,p)=>a+p[1],0), hp=K/(V/H);
  const filas=P.map(([n,v,s,h])=>{const y=s/h; let th=y,N=v,contra=false; if(P.length>=2){const w=h/(h+hp); th=w*y+(1-w)*(S/H); N=v+K; contra=true;} const cota=th*Math.max(0,1-Z*Math.sqrt((1+CV*CV)/N)); return {n,v,y,th,cota};});
  return filas.sort((a,b)=>b.cota-a.cota||b.th-a.th);
}
function rankings(id){
  const r=rankingHora(id), porVentas=[...MES_P[id]].sort((a,b)=>b[1]-a[1]);
  const chica=v=>v<40?`<span class="chip am"><i class="pto am"></i>Muestra chica${S.demoCota?'':''} (${v})</span>`:'';
  const hora=r.map((x,i)=>`<div class="f"><span><span class="pos">${i+1}</span>${x.n} ${chica(x.v)}</span><span class="num" style="text-align:right">S/ ${x.th.toFixed(1)}${S.demoCota?`<span class="cota">asegurado ≥ S/ ${x.cota.toFixed(1)} · crudo ${x.y.toFixed(1)}</span>`:''}</span></div>`).join('');
  const ven=porVentas.map((p,i)=>`<div class="f"><span><span class="pos">${i+1}</span>${p[0]} ${p[1]<40?`<span class="chip am"><i class="pto am"></i>Muestra chica</span>`:''}</span><span class="num">${p[1]}</span></div>`).join('');
  return `<div class="sec"><span class="lbl">Rankings del mes</span><div class="rk mt">
    <div><h4>Vende más por hora${ayuda('Vende más por hora','<p>El número no es el crudo: se corrige hacia el promedio de la tienda, tanto menos cuanto más horas tenga cada persona (contracción de Efron-Morris).</p><p><b>El orden</b> no es por ese número sino por lo que podemos asegurar de él (el número menos su margen de error): quien tiene poca evidencia queda más abajo que quien tiene mucha, aunque su número sea mayor.</p><p>«Muestra chica» es menos de 40 ventas en el mes.</p>')}</h4><div class="card tab"><div class="cab"><span>Integrante</span><span>Soles por hora</span></div>${hora}</div></div>
    <div><h4>Cierra más ventas${ayuda('Cierra más ventas','<p>Número de ventas del mes, sin corregir: funciona igual con o sin horas registradas.</p><p>«Muestra chica» es menos de 40 ventas en el mes.</p>')}</h4><div class="card tab"><div class="cab"><span>Integrante</span><span>Ventas</span></div>${ven}</div></div>
  </div>${S.demoCota?'<p class="nota-demo">Solo del demo: la pantalla real muestra únicamente el número corregido; aquí se agrega la cota para que se vea por qué el orden no sigue al número.</p>':''}</div>`;
}

document.addEventListener('click',e=>{
  const sg=e.target.closest('#barra .seg button');
  if(sg){const k=sg.parentElement.dataset.k; S[k]=sg.dataset.v; if(k==='sesion'||k==='rol'){S.tab=S.sesion;S.cargadas=new Set([S.sesion]);S.abierta=S.sesion;} pintar(); return;}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const y=window.scrollY, act=a.dataset.act, v=a.dataset.v;
  if(act==='per'){S.per=v;pintar();}

});
document.getElementById('chkCota').addEventListener('change',e=>{S.demoCota=e.target.checked;pintar();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ay]');document.querySelectorAll('.ay.abierto').forEach(x=>{if(!b||x!==b.parentElement)x.classList.remove('abierto')});if(b){const ay=b.parentElement;ay.classList.toggle('abierto');if(ay.classList.contains('abierto')){const g=ay.querySelector('.globo');g.style.left='-8px';const r=g.getBoundingClientRect();if(r.right>innerWidth-8)g.style.left=(-8-(r.right-(innerWidth-8)))+'px';const r2=g.getBoundingClientRect();if(r2.left<8)g.style.left=(parseFloat(g.style.left)+(8-r2.left))+'px';}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ay.abierto').forEach(x=>x.classList.remove('abierto'));});
document.querySelectorAll('[data-x]').forEach(c=>c.addEventListener('change',()=>{S.x[c.dataset.x]=c.checked;pintar();}));
pintar();
</script>
