<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista rápida · B · Color primero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
/* ====================================================================
   MAQUETA B · «Color primero» — las 18 variantes dejan de ser una lista: son DOS PASOS.
   Paso 1: el color (una fila de fichas con su swatch, las unidades y un punto por talla: se ve de un vistazo qué colores
   todavía tienen algo). Paso 2: las tallas DE ESE COLOR, en fichas grandes con la cifra de stock bien visible.
   Nunca hay más de 3–6 cosas en pantalla a la vez, aunque la prenda tenga 45 variantes.
   · La foto ocupa TODO el alto de la hoja, a la izquierda (es la prop `lateral` que `<Modal>` ya tiene, hoy usada en
     Reponer / Subir a almacén / Ajustar): la foto manda porque en el piso la pregunta es «¿tengo ESTA en M?».
   · Cambiar de color cruza la foto y re-arma las tallas (cada ficha entra con 40 ms de desfase, y la cifra cuenta);
     el color de la foto y el de las fichas son siempre el mismo (antes la foto y la tabla no se hablaban).
   · La etiqueta se imprime desde UN solo lugar: la tira de «lo elegido» (esta talla, o todo el color). Se fueron las 18
     impresoras iguales. Si no hay unidades en la sede, el botón lo dice ANTES de tocarlo (la regla ya existe en
     EnlaceEtiquetas: sin unidades no navega; hoy lo descubres con un botón rojo después del clic).
   · Pie fijo con Editar / Etiquetas / Ver en Existencias / Eliminar: siempre a la vista.
   Movimiento: ADR-0136 (cascada, cruce de foto, cifras que cuentan, barra que se llena). Nada en bucle.
   ==================================================================== */
.hoja{max-width:62rem;background:var(--crema);border:1px solid var(--sand);border-radius:var(--r-2xl);box-shadow:0 30px 64px -22px rgb(26 26 24 / .2);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);--fondo-hoja:var(--crema)}
.lat{position:relative;background:var(--hueso);min-height:0;overflow:hidden}
.lat .visual{position:absolute;inset:0;animation:cruce 320ms var(--ease) both}
@keyframes cruce{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}
.lat .rotulo{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;background:rgb(251 248 242 / .92);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.lat .rotulo .sw{width:26px;height:26px}
.lat .rotulo b{display:block;font-size:15px;line-height:1.2}
.lat .rotulo small{display:block;font-size:12px;color:var(--t60)}
.lat .rotulo .est{margin-left:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--taupe)}

.panel{min-height:0;min-width:0;overflow-y:auto;padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:var(--sand);border-radius:3px}
.cab{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.cab h2{font-size:27px;line-height:1.08}
.cab .sub{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;color:var(--taupe);font-size:13px}
.cab .cod{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--t60)}
.cerrar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--t55);transition:background-color 200ms var(--ease),color 200ms var(--ease)}
.cerrar:hover{background:var(--t04);color:var(--rojo)}.cerrar svg{width:18px;height:18px}
.resumen{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;align-items:baseline}
.resumen .it{font-size:13.5px;color:var(--t60)}.resumen .it b{color:var(--tinta);font-weight:600}
.resumen .gr{display:flex;align-items:baseline;gap:7px}
.resumen .gr b.disp{font-size:30px;line-height:.95}.resumen .gr b.cero{color:var(--t35)}
.resumen .ex{color:var(--ambar);font-weight:600}

.aviso{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--hueso);border-radius:var(--r-lg);padding:5px 6px 5px 14px;font-size:13px;color:var(--t80)}
.aviso .btn{min-height:32px;padding:0 12px;font-size:10.5px}

.paso{display:flex;flex-direction:column;gap:8px}
.paso-t{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--t60)}
.paso-t .num{width:22px;height:22px;border-radius:50%;border:1px solid var(--t25);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--t60);letter-spacing:0}
.paso-t .nom{color:var(--tinta)}
.paso-t .cuenta{margin-left:auto;font-weight:500;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--t55)}

/* paso 1: fichas de color */
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ficha{position:relative;text-align:left;background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:8px 10px 8px;display:flex;flex-direction:column;gap:6px;
  transition:border-color 220ms var(--ease),background-color 220ms var(--ease),transform 220ms var(--ease)}
.ficha:hover{border-color:var(--t45)}
.ficha .l1{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ficha .sw{width:26px;height:26px}
.ficha .n{font-weight:600;font-size:13.5px;line-height:1.15}
.ficha .l2{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:12px;color:var(--t60);line-height:1.1}
.ficha .pt{display:flex;gap:4px}
.ficha .pt i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.4px var(--t35)}
.ficha .pt i.on{background:var(--tinta);box-shadow:none}
.ficha .pt i.ret{box-shadow:none;background:repeating-linear-gradient(135deg,var(--t35) 0 1px,transparent 1px 3px)}
.ficha.vacio .l2 .u{color:var(--t45)}
.ficha[aria-checked=true]{border:1.5px solid var(--tinta);background:color-mix(in srgb,var(--rojo) 6%,var(--papel))}
.ficha .ok{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:var(--tinta);color:var(--crema);display:none;place-items:center}
.ficha .ok svg{width:10px;height:10px}
.ficha[aria-checked=true] .ok{display:grid;animation:ok 160ms var(--ease) backwards}
@keyframes ok{from{transform:scale(.4);opacity:0}}

/* paso 2: fichas de talla */
.tallas{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.tl{position:relative;text-align:left;background:var(--papel);border:1px solid var(--sand);border-radius:16px;padding:8px 12px 8px;min-height:80px;display:flex;flex-direction:column;
  transition:border-color 220ms var(--ease),background-color 220ms var(--ease);animation:cascada 420ms var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.tl:hover{border-color:var(--t45)}
.tl .t{font-family:'EB Garamond',serif;font-weight:600;font-size:24px;line-height:1}
.tl .n{font-family:'EB Garamond',serif;font-weight:600;font-size:32px;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.tl .c{font-size:11.5px;color:var(--t60);margin-top:2px}
.tl .bar{height:3px;border-radius:2px;background:var(--sand);margin-top:8px;overflow:hidden}
.tl .bar i{display:block;height:100%;background:var(--taupe);transform-origin:left;animation:barra 520ms var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms + 200ms)}
@keyframes barra{from{transform:scaleX(0)}}
.tl.cero .n{color:var(--t35)}.tl.cero .bar{visibility:hidden}
.tl.ret{background:repeating-linear-gradient(135deg,var(--sand) 0 2px,transparent 2px 6px);border-style:dashed;cursor:not-allowed}
.tl.ret .n{font-size:16px;margin-top:auto;color:var(--t45)}
.tl[aria-checked=true]{border:1.5px solid var(--tinta);background:color-mix(in srgb,var(--rojo) 6%,var(--papel))}
.tl .ok{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:var(--tinta);color:var(--crema);display:none;place-items:center}
.tl .ok svg{width:10px;height:10px}
.tl[aria-checked=true] .ok{display:grid;animation:ok 160ms var(--ease) backwards}

/* lo elegido: la ÚNICA puerta para imprimir etiquetas de una talla o de un color */
.elegido{background:var(--papel);border:1px solid var(--sand);border-radius:var(--r-xl);padding:9px 12px;display:flex;flex-direction:column;gap:7px}
.elegido .f1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.elegido .f1 .sw{width:20px;height:20px}
.elegido .f1 b{font-weight:600}
.elegido .cod{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--hueso);padding:2px 8px;border-radius:6px;color:var(--t75)}
.elegido .f1 .u{margin-left:auto;color:var(--t60);font-size:13px}
.elegido .f2{display:flex;gap:8px;flex-wrap:wrap}
.elegido .btn{min-height:34px;font-size:10.5px;padding:0 12px}
.elegido .porque{flex-basis:100%;font-size:12.5px;color:var(--t60);display:flex;gap:8px;align-items:center}
.elegido .porque svg{width:15px;height:15px;color:var(--taupe);flex:none}

.pie{position:sticky;bottom:-24px;z-index:3;margin:auto -24px -24px;padding:12px 24px 22px;background:var(--fondo-hoja)}
.pie::before{content:"";position:absolute;inset-inline:0;bottom:100%;height:16px;background:linear-gradient(to top,var(--fondo-hoja),transparent);pointer-events:none}
.pie .fila-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pie .espacio{flex:1}
.pie .motivo{flex-basis:100%;font-size:12.5px;color:var(--t60);display:flex;gap:8px;align-items:center}
.pie .motivo[hidden]{display:none}
.pie .motivo svg{width:15px;height:15px;color:var(--taupe);flex:none}

/* celular: la foto es una cinta arriba; las fichas de color se deslizan de lado */
@container escena (max-width:640px){
  .hoja{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);max-width:none}
  .lat{height:120px}
  .lat .rotulo{left:10px;right:auto;bottom:10px;padding:7px 12px}.lat .rotulo .est{display:none}
  .panel{padding:16px;gap:14px}
  .cab h2{font-size:24px}.resumen .gr b.disp{font-size:28px}
  .rail{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:4px 16px 8px}
  .rail .ficha{flex:none;width:120px;scroll-snap-align:start}
  .tl{min-height:96px;padding:9px 10px}.tl .n{font-size:32px}
  .pie{margin:auto -16px -16px;padding:12px 16px 16px;bottom:-16px}
  .pie .fila-b{display:grid;grid-template-columns:1fr 1fr}.pie .espacio{display:none}.pie .btn{padding:0 8px;font-size:10.5px}
}
</style>
</head>
<body>
<div class="spike" id="spike"></div>
<div id="marco"><div id="escena">
  <div id="fondo"></div>
  <div class="velo" id="velo"></div>
  <div class="capa"><div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="t" tabindex="-1"></div></div>
</div></div>

<script src="_datos.js"></script>
<script>
(function () {
  const C = CAYLA;
  let P = null, color = null, talla = null, hover = null;

  const modo = (p) => { const f = {}; p.variantes.filter(v => v.activo).forEach(v => f[v.precio] = (f[v.precio] || 0) + 1); return +Object.entries(f).sort((a, b) => b[1] - a[1])[0][0]; };

  function render(p) {
    if (P && P.clave !== p.clave) { color = null; talla = null; }
    P = p; hover = null;
    if (!p.colores.some(c => c.nombre === color)) { color = (p.colores.find(c => c.total > 0) || p.colores[0]).nombre; talla = null; }
    const nAct = p.variantes.filter(v => v.activo).length;
    const sinAqui = p.total === 0;
    const otras = p.otras.map(o => `${o.sede} ${o.n}`).join(" · ");
    const fichas = p.colores.map(c => `
      <button type="button" role="radio" class="ficha ${c.total === 0 ? "vacio" : ""}" data-color="${c.nombre}" aria-checked="false" aria-label="${c.nombre}: ${C.unidades(c.total)} en ${p.sedeCorta}">
        <span class="l1"><span class="sw" style="background:${c.hex}"></span><span class="n">${c.nombre}</span></span>
        <span class="l2"><span class="u tab">${c.total === 0 ? "sin stock" : c.total + " u."}</span>
          <span class="pt" aria-hidden="true">${c.variantes.map(v => `<i class="${!v.activo ? "ret" : v.stock > 0 ? "on" : ""}" title="${v.talla}"></i>`).join("")}</span></span>
        <span class="ok">${C.svg("ok", "", 3)}</span>
      </button>`).join("");
    return `
    <div class="lat" data-sin-cascada id="lat"></div>
    <div class="panel cascada">
      <header class="cab">
        <div style="min-width:0">
          <h2 class="disp" id="t">${p.nombre}</h2>
          <div class="sub"><span class="cod">${p.codigo}</span><span>·</span><span>${p.categoria}</span><span class="chip verde">Activo</span></div>
          <div class="resumen">
            <span class="gr"><b class="disp tab ${sinAqui ? "cero" : ""}" id="kn">0</b><span class="it">en ${p.sedeCorta}${!sinAqui && p.otrasTotal ? ` · +${p.otrasTotal} en otras sedes` : ""}</span></span>
            <span class="it">${p.precioUnico ? `<b class="tab">${C.sol(p.precioMin)}</b> en las ${nAct} variantes` : `<b class="tab">${C.sol(p.precioMin)} – ${p.precioMax.toFixed(2)}</b> <span class="ex">· cambia por color</span>`}</span>
          </div>
        </div>
        <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">${C.svg("x")}</button>
      </header>

      ${sinAqui && p.otrasTotal ? `<div class="aviso"><span><b style="font-weight:600">Sin unidades aquí.</b> Hay en ${otras}.</span><button type="button" class="btn sec" data-aviso="Abre «Pedir a otra sede» (ya existe en la tarjeta)">Pedir a otra sede</button></div>` : ""}

      <section class="paso" aria-labelledby="p1">
        <div class="paso-t versal"><span class="num">1</span><span class="nom" id="p1">Color</span><span class="cuenta">${p.colores.length} ${p.colores.length === 1 ? "color" : "colores"} · cada punto es una talla con unidades</span></div>
        <div class="rail" role="radiogroup" aria-label="Color" id="rail">${fichas}</div>
      </section>

      <section class="paso" aria-labelledby="p2">
        <div class="paso-t versal"><span class="num">2</span><span class="nom" id="p2">Talla de <span id="p2c"></span></span><span class="cuenta" id="p2u"></span></div>
        <div class="tallas" role="radiogroup" aria-label="Talla" id="tallas"></div>
        <div class="elegido" id="elegido" aria-live="polite"></div>
      </section>

      <footer class="pie">
        <div class="motivo" id="motivo" hidden>${C.svg("info")}<span></span></div>
        <div class="fila-b">
          ${p.puedeEditar ? `<a class="btn sec" href="#" data-aviso="Abre /productos/PAN-0014/editar">${C.svg("lapiz")}Editar</a>` : ""}
          <a class="btn sec" href="#" id="bEtq" data-aviso="Abre Etiquetas de precio de toda la prenda">${C.svg("imprimir")}Etiquetas</a>
          ${p.veExistencias ? `<a class="btn pri" href="#" id="bExi" data-aviso="Abre Existencias">${C.svg("caja")}Ver en Existencias</a>` : ""}
          <span class="espacio"></span>
          ${p.puedeEliminar ? `<button type="button" class="btn sut" data-aviso="Abre «Eliminar»: la base dice si se puede borrar o solo descontinuar">${C.svg("papelera")}Eliminar</button>` : ""}
        </div>
      </footer>
    </div>`;
  }

  /* ---------- pintado de lo que cambia al elegir ---------- */
  function mostrarFoto() {
    const nombre = hover || color; const c = P.colores.find(x => x.nombre === nombre);
    const lat = document.getElementById("lat");
    if (lat.dataset.c !== nombre) {
      lat.dataset.c = nombre;
      lat.innerHTML = `<div class="visual">${C.visual(nombre, { rotulo: true })}</div>
        <div class="rotulo"><span class="sw" style="background:${c.hex}"></span><span><b>${nombre}</b><small>${c.total === 0 ? "sin unidades" : C.unidades(c.total)} en ${P.sedeCorta}</small></span><span class="est">${hover && hover !== color ? "vista previa" : ""}</span></div>`;
    }
  }
  function pintarTallas(animar) {
    const c = P.colores.find(x => x.nombre === color);
    // la talla elegida se conserva al cambiar de color si existe y se vende; si no, la primera con unidades
    if (!c.variantes.some(v => v.talla === talla && v.activo)) talla = (c.variantes.find(v => v.stock > 0 && v.activo) || c.variantes.find(v => v.activo) || c.variantes[0]).talla;
    document.getElementById("p2c").textContent = color;
    document.getElementById("p2u").textContent = c.total === 0 ? "sin unidades en este color" : `${C.unidades(c.total)} en este color`;
    const cont = document.getElementById("tallas");
    cont.innerHTML = c.variantes.map((v, i) => {
      if (!v.activo) return `<span class="tl ret" style="--i:${i}" title="Talla retirada: no se vende"><span class="t">${v.talla}</span><span class="n">retirada</span></span>`;
      return `<button type="button" role="radio" class="tl ${v.stock === 0 ? "cero" : ""}" style="--i:${i}" data-talla="${v.talla}" aria-checked="false" aria-label="Talla ${v.talla}: ${C.unidades(v.stock)}">
        <span class="t">${v.talla}</span><span class="n" data-n="${v.stock}">${animar ? 0 : v.stock}</span>
        <span class="c">${v.stock === 0 ? "sin stock" : v.stock === 1 ? "unidad" : "unidades"}</span>
        <span class="bar"><i style="width:${Math.round(v.stock / P.maximo * 100)}%"></i></span><span class="ok">${C.svg("ok", "", 3)}</span></button>`;
    }).join("");
    if (animar) cont.querySelectorAll(".n[data-n]").forEach(n => C.contar(n, +n.dataset.n, 380));
    document.querySelectorAll(".ficha").forEach(f => f.setAttribute("aria-checked", String(f.dataset.color === color)));
    pintarTalla();
    mostrarFoto();
  }
  function pintarTalla() {
    document.querySelectorAll(".tl[data-talla]").forEach(t => t.setAttribute("aria-checked", String(t.dataset.talla === talla)));
    const c = P.colores.find(x => x.nombre === color), v = c.variantes.find(x => x.talla === talla);
    const sinU = v.stock === 0, sinColor = c.total === 0;
    document.getElementById("elegido").innerHTML = `
      <div class="f1"><span class="sw" style="background:${c.hex}"></span><b>${color} · ${talla}</b><span class="cod">${v.codigo}</span><span class="tab">${C.sol(v.precio)}</span><span class="u">${C.unidades(v.stock)} en ${P.sedeCorta}</span></div>
      <div class="f2">
        <a class="btn sec" href="#" data-aviso="Abre Etiquetas de precio · ${v.codigo}" aria-disabled="${sinU}">${C.svg("imprimir")}Etiqueta de ${color} ${talla}</a>
        <a class="btn sec" href="#" data-aviso="Abre Etiquetas de precio · todo ${color}" aria-disabled="${sinColor}">${C.svg("imprimir")}Etiquetas de todo ${color}${sinColor ? "" : ` · ${c.total} u.`}</a>
      </div>
      ${sinU ? `<div class="porque">${C.svg("info")}<span>Sin unidades de ${talla} en ${P.sedeCorta}: no hay etiqueta que imprimir aquí.</span></div>` : ""}`;
    const b = document.getElementById("bEtq"), m = document.getElementById("motivo");
    b.setAttribute("aria-disabled", String(P.total === 0)); m.hidden = P.total !== 0;
    m.querySelector("span").textContent = `Sin unidades en ${P.sedeCorta}: no hay nada que etiquetar aquí.`;
  }

  function elegirColor(n) { if (n === color) return; color = n; pintarTallas(true); }

  function listo(hoja, p) {
    C.contar(document.getElementById("kn"), p.total, 600);
    pintarTallas(true);
    hoja.onclick = (e) => {
      const f = e.target.closest(".ficha"); if (f) return elegirColor(f.dataset.color);
      const t = e.target.closest(".tl[data-talla]"); if (t) { talla = t.dataset.talla; return pintarTalla(); }
      const av = e.target.closest("[data-aviso]");
      if (av) { e.preventDefault(); if (av.getAttribute("aria-disabled") === "true") return; toast(av.dataset.aviso + (av.id === "bExi" ? ` · en ${color}` : "")); }
    };
    const rail = document.getElementById("rail");
    // vista previa al pasar el mouse: la foto muestra ese color; al salir vuelve al elegido
    rail.addEventListener("mouseover", (e) => { const f = e.target.closest(".ficha"); const n = f ? f.dataset.color : null; if (n !== hover) { hover = n; mostrarFoto(); } });
    rail.addEventListener("mouseleave", () => { hover = null; mostrarFoto(); });
    // teclado: flechas mueven el color elegido (radiogroup)
    rail.addEventListener("keydown", (e) => {
      const k = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!k) return;
      e.preventDefault(); const i = P.colores.findIndex(c => c.nombre === color); const nx = P.colores[(i + k + P.colores.length) % P.colores.length].nombre;
      elegirColor(nx); rail.querySelector(`[data-color="${nx}"]`).focus();
    });
  }

  let tm;
  function toast(t) {
    let el = document.getElementById("toast");
