<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tráfico — maqueta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="estilos.css" />
    <link rel="stylesheet" href="a-hilo.css" />
    <link rel="stylesheet" href="b-cien.css" />
    <link rel="stylesheet" href="c-vitrina.css" />
  </head>
  <body>
    <!-- La barra negra es de la maqueta, no del diseño: cambia de dirección, de tema y de ancho. -->
    <div class="mq-barra" role="region" aria-label="Controles de la maqueta">
      <span class="mq-titulo">Tráfico · maqueta</span>
      <div class="mq-grupo" role="group" aria-label="Dirección">
        <span class="mq-grupo__nombre" aria-hidden="true">Dirección</span>
        <button type="button" class="mq-btn" data-mq-dir="a">A · El hilo</button>
        <button type="button" class="mq-btn" data-mq-dir="b">B · De cada 100</button>
        <button type="button" class="mq-btn" data-mq-dir="c" aria-label="C · La vitrina, la elegida">C · La vitrina ✓</button>
      </div>
      <div class="mq-grupo" role="group" aria-label="Tema">
        <span class="mq-grupo__nombre" aria-hidden="true">Tema</span>
        <button type="button" class="mq-btn" data-mq-tema="claro">Claro</button>
        <button type="button" class="mq-btn" data-mq-tema="oscuro">Oscuro</button>
      </div>
      <div class="mq-grupo" role="group" aria-label="Ancho de la pantalla">
        <span class="mq-grupo__nombre" aria-hidden="true">Ancho</span>
        <button type="button" class="mq-btn" data-mq-ancho="1024">1024</button>
        <button type="button" class="mq-btn" data-mq-ancho="1440">1440</button>
        <button type="button" class="mq-btn" data-mq-ancho="1920">1920</button>
      </div>
      <button type="button" class="mq-btn mq-btn--borde" data-mq-entrada>Ver la entrada otra vez</button>
      <span class="mq-nota">Visitas inventadas (semilla fija) · prendas reales del catálogo</span>
    </div>

    <div class="mq-escenario" id="escenario">
      <div class="mq-marco" id="marco">
        <div class="erp" data-tema="claro"></div>
      </div>
    </div>

    <script src="datos.js"></script>
    <script src="piezas.js"></script>
    <script src="a-hilo.js"></script>
    <script src="b-cien.js"></script>
    <script src="c-vitrina.js"></script>
    <script>
      window.TRAFICO_UI.arrancar();
    </script>
  </body>
</html>
