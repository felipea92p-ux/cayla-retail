<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción · módulo padre · spike visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE · Módulo padre «Producción» (2026-09-19)
   Tokens = los reales de apps/web/app/globals.css. Sin gradientes, sin
   rebote, sin color nuevo. Keyframes existentes conservan su nombre;
   los gestos NUEVOS llevan prefijo `nv-`.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf6ec;
  --taupe:#a47865;--taupe-p:#805c4c;--verde:#556e49;--verde-p:#44583a;--ambar:#8c631f;--ambar-p:#734f15;
  --t75:rgba(26,26,24,.75);--t65:rgba(26,26,24,.65);--t55:rgba(26,26,24,.55);--t45:rgba(26,26,24,.45);
  --t25:rgba(26,26,24,.25);--t15:rgba(26,26,24,.15);--t10:rgba(26,26,24,.10);--t04:rgba(26,26,24,.04);
  --ease:cubic-bezier(.32,.72,.24,1);--ease-out:cubic-bezier(.4,0,1,1);
  --sh:0 2px 8px -2px rgb(26 26 24/.07);--sh-md:0 8px 24px -8px rgb(26 26 24/.11);--sh-xl:0 30px 64px -22px rgb(26 26 24/.20);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.disp{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--t65)}.m55{color:var(--t55)}
.rojo{color:var(--rojo-p)}.ambar{color:var(--ambar-p)}.verde{color:var(--verde-p)}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}

@keyframes cayla-entrada{from{opacity:0;transform:translate3d(0,8px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes cayla-velo{from{opacity:0}to{opacity:1}}
@keyframes cayla-hilo-barrido{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(300%,0,0)}}
@keyframes cayla-brillo{from{opacity:1;transform:translate3d(-120%,0,0) skewX(-12deg)}to{opacity:1;transform:translate3d(320%,0,0) skewX(-12deg)}}
@keyframes nv-trazo{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes nv-trazo1{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes nv-destello{0%{background:rgba(184,65,45,.14)}100%{background:transparent}}
@keyframes nv-pulso{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
@keyframes nv-progreso{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes nv-entra-lado{from{opacity:0;transform:translate3d(-10px,0,0)}to{opacity:1;transform:none}}
.e{animation:cayla-entrada 420ms var(--ease) backwards;animation-delay:calc(var(--i,0)*38ms)}
.flash{animation:nv-destello 1400ms var(--ease-out) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:nv-trazo1 1100ms var(--ease) 200ms both}
html.reducir *,html.reducir *::before,html.reducir *::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

/* ---------- marco: lateral + contenido ---------- */
.hilo{position:fixed;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:80;pointer-events:none}
.hilo::after{content:"";position:absolute;inset:0 auto 0 0;width:34%;background:var(--rojo);opacity:0}
.hilo.trab::after{opacity:1;animation:cayla-hilo-barrido 1.1s var(--ease) infinite}
.lat{position:fixed;inset:0 auto 0 0;width:17rem;border-right:1px solid var(--t10);background:var(--crema);padding:24px 14px;overflow:auto;z-index:20}
.lat .logo{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.lat .logo img{height:30px}.lat .logo span{font-size:13px;letter-spacing:.26em;font-weight:600}
.lat .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--t75);transition:background 200ms,color 200ms}
.lat .it:hover{background:var(--t04);color:var(--tinta)}
.lat .it.est{color:var(--t45);cursor:default}.lat .it.est:hover{background:none;color:var(--t45)}
.lat .it[aria-current=page]{background:var(--sand);color:var(--tinta);font-weight:500}
.lat .ct{margin-left:auto;font-size:10px;font-weight:600;border-radius:999px;padding:1px 7px;background:rgba(140,99,31,.14);color:var(--ambar-p)}
.lat .ct.r{background:rgba(184,65,45,.12);color:var(--rojo-p)}
.lat .grupo{margin:4px 0}
.lat .grupo>.it{font-weight:600;color:var(--tinta)}
.lat .hijos{margin:4px 0 8px 22px;border-left:1px solid var(--sand);padding-left:8px}
.lat .sec{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t45);padding:10px 12px 3px}
.lat .movido{margin:8px 10px 0;font-size:11.5px;color:var(--t55);border:1px dashed var(--t25);border-radius:10px;padding:8px 10px}
.main{margin-left:17rem;min-width:0}
.spike{padding:14px 40px 0;max-width:1320px}
.spike>div{border:1px dashed var(--t25);border-radius:12px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--t65);font-size:12px}
.spike .lbl{font-size:10.5px}
.spike button{border:1px solid var(--t25);border-radius:8px;padding:5px 11px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--t75);transition:all 200ms}
.spike button:hover{border-color:var(--rojo);color:var(--rojo)}
.spike button[aria-pressed=true]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.spike .sep{width:1px;height:18px;background:var(--t15)}
.cont{padding:22px 40px 100px;max-width:1320px}

/* ---------- piezas ---------- */
.card{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:12px 16px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;white-space:nowrap;transition:background 220ms,border-color 220ms,color 220ms,transform 160ms var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--tinta);color:var(--crema)}
.btn.pri .brillo{position:absolute;top:0;bottom:0;left:0;width:34%;background:rgba(245,240,232,.22);opacity:0;pointer-events:none}
.btn.pri:hover .brillo{animation:cayla-brillo 600ms var(--ease) both}
.btn.dis{border:1px solid rgba(26,26,24,.2);color:var(--t75)}
.btn.dis:hover{border-color:var(--rojo);color:var(--rojo)}
.btn.s{padding:7px 11px}
.btn[disabled]{background:rgba(26,26,24,.3);color:var(--crema);border-color:transparent;cursor:not-allowed}
.chip{display:inline-block;white-space:nowrap;border-radius:999px;border:1px solid;padding:2px 10px;font-size:10px;line-height:16px;text-transform:uppercase;letter-spacing:.13em;font-weight:600}
.chip.neutro{border-color:var(--t15);background:var(--t04);color:var(--t75)}
.chip.ambar{border-color:rgba(140,99,31,.3);background:rgba(140,99,31,.10);color:var(--ambar-p)}
.chip.verde{border-color:rgba(85,110,73,.45);background:rgba(85,110,73,.10);color:var(--verde-p)}
.chip.rojo{border-color:rgba(184,65,45,.3);background:rgba(184,65,45,.10);color:var(--rojo-p)}
.dot{position:relative;width:6px;height:6px;border-radius:50%;background:var(--t25);flex:none;display:inline-block}
.dot.ambar{background:var(--ambar)}.dot.verde{background:var(--verde)}.dot.rojo{background:var(--rojo)}
.dot.vivo::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:nv-pulso 2.2s var(--ease) infinite}
.rev{background:var(--tinta);color:var(--crema);border-radius:999px;font-size:9.5px;padding:1px 7px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
h1.t{font-family:'EB Garamond',serif;font-size:28px;font-weight:500;margin-top:4px;line-height:1.15}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.cab p.bajada{color:var(--t65);margin-top:5px;max-width:660px}
.cab .acc{display:flex;gap:8px;flex-wrap:wrap}
h2.s{font-family:'EB Garamond',serif;font-size:21px;font-weight:500;margin:28px 0 10px;display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap}
h2.s small{font-family:'DM Sans';font-size:12px;color:var(--t55)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.kpi{padding:16px;transition:border-color 240ms var(--ease),transform 260ms var(--ease)}
.kpi:hover{border-color:var(--t25);transform:translateY(-2px)}
.kpi .row{display:flex;align-items:center;gap:7px}.kpi .lbl{color:var(--t65)}
.kpi .n{font-family:'EB Garamond',serif;font-size:29px;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-size:12px;margin-top:3px;color:var(--t65)}
.kpi .d.ambar{color:var(--ambar-p)}.kpi .d.verde{color:var(--verde-p)}.kpi .d.rojo{color:var(--rojo-p)}
.aviso{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:11px 16px;border-radius:12px;border:1px solid rgba(140,99,31,.3);background:rgba(140,99,31,.07);color:var(--ambar-p);font-size:13px}
.aviso .btn{margin-left:auto}

/* ---------- fuentes del dato (para decidir qué construir) ---------- */
.src{display:none;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
body.fuentes .src{display:inline-block}
.src.hoy{background:rgba(85,110,73,.15);color:var(--verde-p)}
.src.deriva{background:rgba(140,99,31,.15);color:var(--ambar-p)}
.src.nuevo{background:rgba(184,65,45,.13);color:var(--rojo-p)}

/* ---------- decisiones ---------- */
.dec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;margin-bottom:10px;transition:border-color 240ms var(--ease),transform 260ms var(--ease)}
.dec:hover{border-color:var(--t25);transform:translateY(-1px)}
.dec .sev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sand)}
.dec .sev.s3{background:rgba(184,65,45,.13);color:var(--rojo-p)}.dec .sev.s2{background:rgba(140,99,31,.14);color:var(--ambar-p)}.dec .sev.s1{background:rgba(85,110,73,.14);color:var(--verde-p)}
.dec h3{font-size:15px;font-weight:600;line-height:1.35}
.dec p{font-size:13px;color:var(--t65);margin-top:2px}
.dec .ops{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- tablas ---------- */
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--t55);padding:10px 12px;border-bottom:1px solid var(--sand);white-space:nowrap}
.tb td{padding:11px 12px;border-bottom:1px solid var(--t10);vertical-align:middle}
.tb tr:last-child td{border:0}
.tb tbody tr{transition:background 200ms}
.tb tbody tr.click{cursor:pointer}.tb tbody tr.click:hover{background:var(--t04)}
.tb .r{text-align:right;font-variant-numeric:tabular-nums}
.tb .nm b{font-weight:500;display:block}.tb .nm span{font-size:12px;color:var(--t65)}
.barra{position:relative;height:8px;border-radius:4px;background:var(--sand);min-width:120px}
.barra .fill{position:absolute;inset:0;display:flex;border-radius:4px;overflow:hidden;transform-origin:left;transition:transform 900ms var(--ease)}
.barra .fill i{display:block;height:100%}
.barra .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta);border-radius:1px}
.c-tela{background:var(--tinta)}.c-avio{background:var(--taupe)}.c-maq{background:var(--t25)}
.c-ok{background:var(--verde)}.c-al{background:var(--ambar)}.c-no{background:var(--rojo)}
.c-prod{background:var(--taupe)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.opt{border:1px solid var(--t15);border-radius:999px;padding:6px 12px;font-size:12.5px;transition:all 200ms var(--ease);color:var(--t75)}
.opt:hover{border-color:var(--tinta)}.opt[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.opt small{opacity:.7;margin-left:5px}
.dos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.pad{padding:16px 18px}

/* ---------- tablero de órdenes ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;margin-top:20px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:rgba(232,224,208,.32);border-radius:16px;padding:10px;min-height:190px}
.col header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px}
.col header .lbl{color:var(--t65)}.col header .k{font-size:12px;color:var(--t55)}
.col .vacia{border:1px dashed var(--t25);border-radius:12px;padding:22px 12px;text-align:center;color:var(--t55);font-size:12.5px}
.oc{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;box-shadow:var(--sh);transition:border-color 240ms var(--ease),transform 260ms var(--ease),box-shadow 260ms var(--ease)}
.oc:hover{border-color:var(--t25);transform:translateY(-2px);box-shadow:var(--sh-md)}
.oc .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oc h3{font-family:'EB Garamond',serif;font-weight:500;font-size:18px;line-height:1.2}
.oc .sub{font-size:12px;color:var(--t65);margin-top:1px}
.oc .cpp{text-align:right}.oc .cpp b{font-family:'EB Garamond',serif;font-weight:500;font-size:18px;display:block;line-height:1.2}
.oc .cpp span{font-size:10.5px;color:var(--t55);white-space:nowrap}
.seg{display:flex;gap:4px;margin:12px 0 10px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--sand);position:relative;overflow:hidden}
.seg i.hecho{background:var(--verde)}.seg i.terc{background:rgba(140,99,31,.4)}.seg i.actual{background:var(--t25)}
.seg i.actual::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:var(--tinta);animation:cayla-hilo-barrido 1.8s var(--ease) infinite}
.oc .pie{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t65);gap:8px}
.oc .riesgo{margin-top:8px;font-size:12px}
.sem{display:inline-flex;align-items:center;gap:6px;color:var(--t75)}
.stack{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--t10);gap:1px;margin-top:10px}
.stack i{display:block;height:100%}
.vence{color:var(--rojo-p);font-weight:600}
@media(max-width:1200px){.dos{grid-template-columns:1fr}}

/* ---------- matriz talla × color ---------- */
.mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.mx th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t55);font-weight:600;text-align:center;padding:2px}
.mx th.f{text-align:left;font-size:12px;text-transform:none;letter-spacing:0;color:var(--tinta);font-weight:500;white-space:nowrap;padding-right:8px}
.mx td{text-align:center}
.mx input{width:100%;min-width:44px;height:38px;text-align:center;border:1px solid var(--t15);border-radius:8px;background:var(--crema);font-variant-numeric:tabular-nums;outline:none;transition:border-color 200ms}
.mx input:focus{border-color:var(--rojo)}
.mx td.ro{height:38px;border-radius:8px;background:var(--t04);font-variant-numeric:tabular-nums;line-height:38px}
.mx tfoot td{font-size:11.5px;color:var(--t65);padding-top:2px}
.mx .tot{font-weight:600;color:var(--tinta)}
.curva{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.curva div{font-size:11.5px;color:var(--t65);text-align:center}
.curva .bar{height:46px;display:flex;align-items:flex-end;gap:3px;justify-content:center;margin-bottom:4px}
.curva .bar i{width:14px;border-radius:3px 3px 0 0;transform-origin:bottom;transition:transform 800ms var(--ease)}

/* ---------- lista de insumos ---------- */
.ins{margin-bottom:8px;overflow:hidden}
.ins>button.cab2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto auto;gap:18px;align-items:center;width:100%;padding:14px 16px;text-align:left}
.ins .nom b{font-weight:500;font-size:15px;display:block}.ins .nom span{font-size:12px;color:var(--t65)}
.saldo .tk{height:8px;border-radius:4px;background:var(--sand);position:relative}
.saldo .fl{position:absolute;inset:0;border-radius:4px;transform-origin:left;transition:transform 900ms var(--ease);background:var(--verde)}
.saldo .fl.ambar{background:var(--ambar)}.saldo .fl.rojo{background:var(--rojo)}
.saldo .mn{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta);border-radius:1px}
.saldo .tx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t65);margin-top:6px}
.ins .num{font-family:'EB Garamond',serif;font-size:22px;text-align:right;white-space:nowrap}
.ins .num small{font-family:'DM Sans';font-size:12px;color:var(--t55);margin-left:3px}
.caret{transition:transform 300ms var(--ease);color:var(--t45)}.ins.abierto .caret{transform:rotate(90deg)}
.lotes{display:grid;grid-template-rows:0fr;transition:grid-template-rows 360ms var(--ease)}
.ins.abierto .lotes{grid-template-rows:1fr}.lotes>div{overflow:hidden}
.lotes .in{border-top:1px solid var(--sand);padding:6px 16px 12px}
.lote{display:grid;grid-template-columns:70px minmax(0,1fr) 96px 118px;gap:14px;align-items:center;padding:9px 0;font-size:12.5px;border-bottom:1px solid var(--t04)}
.lote:last-child{border:0}.lote .mb{height:4px;border-radius:2px;background:var(--sand);overflow:hidden}
.lote .mb i{display:block;height:100%;background:var(--tinta);transform-origin:left;transition:transform 800ms var(--ease)}
.lote .cs{white-space:nowrap;display:flex;gap:8px;justify-content:flex-end;align-items:center}.lote .tab{white-space:nowrap}
.libro{padding:6px 16px 10px}.libro h3{font-family:'EB Garamond',serif;font-size:19px;font-weight:500;padding:12px 0 4px}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:9px 6px;margin:0 -6px;border-radius:8px;font-size:12.5px;align-items:center}
.mov .q{font-variant-numeric:tabular-nums;font-weight:600}.mov .q.mas{color:var(--verde-p)}
.mov small{display:block;color:var(--t55);font-size:11.5px}
.mov.nuevo{animation:nv-destello 1600ms var(--ease-out) both,nv-entra-lado 420ms var(--ease) both}
.tipo{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sand)}.tipo .ic{width:13px;height:13px}

/* ---------- panel lateral ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(26,26,24,.28);opacity:0;pointer-events:none;transition:opacity 300ms var(--ease)}
.veil.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px,100vw);background:var(--crema);border-left:1px solid var(--sand);box-shadow:var(--sh-xl);display:flex;flex-direction:column;transform:translate3d(100%,0,0);transition:transform 420ms var(--ease),width 300ms var(--ease);visibility:hidden}
.drw.ancho{width:min(760px,100vw)}
.drw.on{transform:none;visibility:visible}
.drw .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--sand)}
.drw .hd h2{font-family:'EB Garamond',serif;font-size:26px;font-weight:500;line-height:1.15}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t65);transition:background 200ms}

const S = n => 'S/ ' + Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const S0 = n => 'S/ ' + Number(n).toLocaleString('es-PE',{minimumFractionDigits:0,maximumFractionDigits:0});
const N = (n,d=0) => Number(n).toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fechaCorta = iso => new Date(iso+'T12:00:00').toLocaleDateString('es-PE',{day:'numeric',month:'short'}).replace('.','');
const dias = iso => Math.round((new Date(iso+'T12:00:00') - new Date(HOY+'T12:00:00'))/864e5);
const sumaDias = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function repartir(total,w){ const s=sum(w)||1, raw=w.map(x=>total*x/s), base=raw.map(Math.floor); let r=total-sum(base);
  raw.map((v,i)=>[v-base[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,r).forEach(([,i])=>base[i]++); return base; }

/* ---------- catálogo e insumos ---------- */
const modelo = id => MODELOS.find(m=>m.id===id);
const insumo = id => D.insumos.find(i=>i.id===id);
const prov = n => D.provs.find(p=>p.n===n);
const orden = id => D.ordenes.find(o=>o.id===id) || D.cerradas.find(o=>o.id===id);
const nombreOrden = o => o.ref || modelo(o.modelo).n;
const planDe = o => o.lineas ? sum(Object.values(o.lineas)) : o.plan0;
const consumidoLote = (iid,lid) => D.consumos.filter(c=>c.insumo===iid&&c.lote===lid).reduce((a,c)=>a+c.qty,0);
const saldoLote = (i,l) => l.cant - consumidoLote(i.id,l.id);
const saldo = i => sum(i.lotes.map(l=>saldoLote(i,l)));
const loteActivo = i => [...i.lotes].sort((a,b)=>a.ingreso.localeCompare(b.ingreso)).find(l=>saldoLote(i,l)>0);
const loteDe = c => insumo(c.insumo).lotes.find(l=>l.id===c.lote);
const costoC = c => c.qty * loteDe(c).costo;
const totalComp = c => sum(c.lineas.map(l=>l.total!=null?l.total:l.qty*l.costo));
const enCamino = iid => sum(D.comps.filter(c=>!c.recibido).flatMap(c=>c.lineas).filter(l=>l.ins===iid).map(l=>l.qty));
const consumoSem = i => sum(D.consumos.filter(c=>c.insumo===i.id).map(c=>c.qty)) / (19/7);
const estadoIns = i => { const s=saldo(i); return s<=0?{t:'Sin saldo',c:'rojo'}: s<i.min?{t:'Bajo mínimo',c:'ambar'}:{t:'Bien',c:'verde'}; };
const precioRef = iid => { const l=loteActivo(insumo(iid)) || insumo(iid).lotes.slice(-1)[0]; return l.costo; };

/* ---------- órdenes ---------- */
function costos(o, extra){
  const cs = D.consumos.filter(c=>c.orden===o.id);
  let tela=0, avio=0;
  cs.forEach(c=>{ const v=costoC(c); insumo(c.insumo).tipo==='tela'?tela+=v:avio+=v; });
  if(extra){ extra.tipo==='tela'?tela+=extra.v:avio+=extra.v; }
  const n = o.buenas || planDe(o), total = tela+avio+o.maquila;
  return {tela,avio,maq:o.maquila,total,cpp:total/n};
}
const margen = (precio,cpp) => (precio<=0||cpp<=0)?null:(precio-cpp)/precio;
const semaforo = m => m==null?null: m>=UMBRAL_GANA?{c:'verde',t:'Gana'}: m>=UMBRAL_FILO?{c:'ambar',t:'Al filo'}:{c:'rojo',t:'Pierde'};
const etapaActual = o => { const e=ETAPAS.find(e=>o.etapas[e.k]!=='hecho'); return e?e.k:'listo'; };
function riesgo(o){
  const rest = sum(ETAPAS.filter(e=>o.etapas[e.k]!=='hecho').map(e=>e.d + (o.etapas[e.k]==='terc'?2:0)));
  const d = dias(o.entrega), tarde = rest - d;
  return {rest, d, tarde, vencida: d<0 && rest>0, filo: rest>0 && tarde===0 || (tarde<0 && tarde>=-1 && rest>0)};
}
function demandaTela(){   // metros de cada tela que piden las órdenes que aún no se cortan
  const dem = {};
  D.ordenes.filter(o=>o.etapas.corte!=='hecho').forEach(o=>{ const m=modelo(o.modelo);
    dem[m.tela] = (dem[m.tela]||0) + planDe(o)*m.rend*(1+(MERMA[m.tela]||0)); });
  return dem;
}

/* ---------- decisión de qué producir ---------- */
const ventasSem = m => sum(Object.values(m.v60))/8.57;
const stockTot = m => sum(Object.values(m.st));
const enProd = m => sum(D.ordenes.filter(o=>o.modelo===m.id).map(planDe));
function estadoModelo(m){
  const vs=ventasSem(m), c=stockTot(m)/vs, cp=(stockTot(m)+enProd(m))/vs;
  if(enProd(m)===0 && c<SEM_LEAD) return {t:'Producir ya',c:'rojo',o:0,c1:c,cp};
  if(cp<4) return {t:'Producir más',c:'ambar',o:1,c1:c,cp};
  if(cp>16) return {t:'Sobrestock',c:'ambar',o:3,c1:c,cp};
  return {t:'Cubierto',c:'verde',o:2,c1:c,cp};
}
function curva(m){   // pesos por talla: lo que se vende en 8 semanas menos lo que ya hay
  const need = {}; TALLAS.forEach(t=>need[t]=Math.max(0, m.v60[t]/8.57*SEM_OBJ - m.st[t]));
  const tot = sum(Object.values(need));
  const w = tot>0 ? need : m.v60;
  return {w, sugerido: Math.max(0, Math.round((tot - enProd(m))/6)*6), need};
}
function distribuir(m,total,w){
  const perT = repartir(total, TALLAS.map(t=>w[t])), out={};
  TALLAS.forEach((t,i)=>{ const cols=Object.keys(m.colores), perC=repartir(perT[i], cols.map(c=>m.colores[c]));
    cols.forEach((c,j)=>out[c+'|'+t]=perC[j]); });
  return out;
}
// Órdenes iniciales: sus líneas salen de la misma curva de ventas
D.ordenes.forEach(o=>{ const m=modelo(o.modelo); o.lineas = distribuir(m,o.plan0,m.v60); });

/* ---------- eficiencia del Taller (D-31) ---------- */
const FIJOS_MES = 3800;       // dato nuevo: sueldos fijos del Taller + servicios (hoy no se registran)
function eficienciaMes(){
  const cerr = D.cerradas.filter(o=>o.cerrada && o.cerrada.startsWith('2026-09'));
  const absorbido = sum(cerr.map(o=>costos(o).total));
  const proceso = sum(D.ordenes.map(o=>{ const c=costos(o); return c.tela+c.avio+ (o.etapas.confeccion==='hecho'||o.etapas.confeccion==='terc'? o.maquila:0); }));
  const gasto = absorbido + proceso + FIJOS_MES;
  return {absorbido, proceso, fijos:FIJOS_MES, gasto, ef:(absorbido+proceso)/gasto};
}
const HIST_MESES = [{m:'Abr',ef:.62,cpp:41.2},{m:'May',ef:.66,cpp:39.8},{m:'Jun',ef:.71,cpp:38.5},{m:'Jul',ef:.68,cpp:39.4},{m:'Ago',ef:.74,cpp:37.9}];
function comparaMaquila(m){
  const interno = m.rend*precioRef(m.tela) + sum(Object.entries(m.avios).map(([k,q])=>q*precioRef(k))) + m.maq;
  const externo = m.rend*precioRef(m.tela) + sum(Object.entries(m.avios).map(([k,q])=>q*precioRef(k))) + m.refMaq;
  const d = (interno-externo)/externo;
  return {interno, externo, d, v: d<=-.05?{t:'Conviene fabricar',c:'verde'}: d>=.05?{t:'Conviene maquilar',c:'ambar'}:{t:'Parejo',c:'neutro'}};
}

/* ---------- animación de números, barras y medidor ---------- */
const numCache = {}, barCache = {}, gaugeCache = {};
function tween(el,from,to,fmt,dur=800){
  if(REDUCE()||from===to){el.textContent=fmt(to);return}
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(f)})(t0);
}
function post(){
  document.querySelectorAll('[data-num]').forEach(el=>{
    const k=el.dataset.num, v=parseFloat(el.dataset.val), d=+(el.dataset.d||0), pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    const fmt = x => pre==='S/ ' ? (d===0?S0(x):S(x)) : N(x,d)+suf;
    const from = k in numCache ? numCache[k] : v;
    tween(el, from, v, fmt); numCache[k]=v;
  });
  document.querySelectorAll('[data-bar]').forEach(el=>{
    const k=el.dataset.bar, v=Math.max(0,Math.min(1,parseFloat(el.dataset.val)));
    const from = k in barCache ? barCache[k] : 0;
    const eje = el.dataset.eje==='y'?'Y':'X';
    el.style.transform=`scale${eje}(${from})`; barCache[k]=v;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`scale${eje}(${v})`}));
  });
  document.querySelectorAll('[data-gauge]').forEach(el=>{
    const k=el.dataset.gauge, v=Math.max(0,Math.min(1,parseFloat(el.dataset.val)));
    const from = k in gaugeCache ? gaugeCache[k] : 0;
    el.style.left=(from*100)+'%'; gaugeCache[k]=v;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.left=(v*100)+'%'}));
  });
}
function flip(mutar){
  const antes={};
  document.querySelectorAll('.oc[data-id]').forEach(el=>antes[el.dataset.id]=el.getBoundingClientRect());
  mutar();
  if(REDUCE()) return;
  document.querySelectorAll('.oc[data-id]').forEach(el=>{
    const a=antes[el.dataset.id]; if(!a) return;
    const b=el.getBoundingClientRect(), dx=a.left-b.left, dy=a.top-b.top;
    el.style.animation='none';
    if(Math.abs(dx)+Math.abs(dy)>2) el.animate([{transform:`translate(${dx}px,${dy}px)`,boxShadow:'0 18px 44px -14px rgb(26 26 24/.22)'},{transform:'none'}],{duration:620,easing:'cubic-bezier(.32,.72,.24,1)'});
  });
}

/* ====================================================================
   RESUMEN — «¿Qué necesita mi decisión hoy?»
   Cada tarjeta nace de datos que ya existen o se derivan; ninguna es
   un texto fijo. Al recibir tela, pagar o cerrar una orden, cambian.
   ==================================================================== */
function decisiones(){
  const out = [];
  const nom = nombreOrden;
  // 1 · órdenes vencidas o que llegarán tarde
  D.ordenes.forEach(o=>{ const r=riesgo(o); if(r.rest===0) return;
    if(r.vencida) out.push({sev:3, ico:'alerta', t:`«${nom(o)}» debía entregarse hace ${-r.d} día${-r.d>1?'s':''} y aún no se corta`,
      p:`Faltan ~${r.rest} días de trabajo. Cada día de atraso son ${N(ventasSem(modelo(o.modelo))/7,1)} ventas perdidas de ${modelo(o.modelo).n} en tienda.`,
      ops:[{t:'Ver la orden',a:`data-orden="${o.id}"`,pri:1}]});
    else if(r.tarde>0) out.push({sev:2, ico:'reloj', t:`«${nom(o)}» llegará ~${r.tarde} días tarde a su entrega (${fechaCorta(o.entrega)})`,
      p:`Faltan ~${r.rest} días de trabajo y hay ${r.d}.${Object.values(o.etapas).includes('terc')?' La confección está con maquila externa (Confecciones Rosales, puntualidad 74 %).':''}`,
      ops:[{t:'Ver la orden',a:`data-orden="${o.id}"`,pri:1}]});
  });
  // 2 · tela que las órdenes sin cortar necesitan
  const dem = demandaTela();
  Object.entries(dem).forEach(([tid,need])=>{ const i=insumo(tid), s=saldo(i), cam=enCamino(tid);
    if(need<=s) return;
    const falta = need-s;
    const cf = D.comps.find(c=>!c.recibido && c.lineas.some(l=>l.ins===tid));
    if(cam>=falta && cf) out.push({sev:3, ico:'caja', t:`Faltan ${N(falta)} m de ${i.nombre} para cortar lo pendiente — pero ya llegó ${cf.doc}`,
      p:`Las órdenes por cortar piden ${N(need)} m (con merma) y hay ${N(s)} m. ${cf.prov} entregó ${N(cam)} m que aún no se reciben: recibirlos destraba el corte.`,
      ops:[{t:'Recibir '+cf.doc,a:'data-v-ir="recibir"',pri:1}]});
    else out.push({sev:3, ico:'caja', t:`Faltan ${N(falta)} m de ${i.nombre} para cortar lo pendiente`,
      p:`Las órdenes por cortar piden ${N(need)} m (con merma) y hay ${N(s)} m${cam?` más ${N(cam)} m en camino`:''}.`,
      ops:[{t:'Pedir '+i.nombre.toLowerCase(),a:`data-pedir="${tid}"`,pri:1}]});
  });
  // 3 · plata que vence
  const venc = D.comps.filter(c=>saldoComp(c)>0 && c.vence && dias(c.vence)<0);
  const prox = D.comps.filter(c=>saldoComp(c)>0 && c.vence && dias(c.vence)>=0 && dias(c.vence)<=7);
  if(venc.length||prox.length){ const tv=sum(venc.map(saldoComp)), tp=sum(prox.map(saldoComp));
    out.push({sev: venc.length?3:2, ico:'plata', t:`${venc.length?`${S(tv)} vencidos`:''}${venc.length&&prox.length?' y ':''}${prox.length?`${S(tp)} por vencer en 7 días`:''}`,
      p: venc.length? `${venc.map(c=>c.prov+' '+c.doc).join(', ')}. Pagar tarde a un proveedor de tela pone en riesgo el crédito del que depende el Taller.` : `Vence: ${prox.map(c=>c.prov+' '+fechaCorta(c.vence)).join(', ')}.`,
      ops:[{t:'Ir a Por pagar',a:'data-v-ir="porpagar"',pri:1}]}); }
  // 4 · qué producir
  MODELOS.forEach(m=>{ const e=estadoModelo(m);
    if(e.t==='Producir ya'){ const w=TALLAS.filter(t=>m.st[t]/(m.v60[t]/8.57)<SEM_LEAD).join(', ');
      out.push({sev:3, ico:'tendencia', t:`«${m.n}» se agota en ~${N(e.c1,1)} semanas y no hay orden abierta`,
        p:`Vendes ${N(ventasSem(m),1)}/semana y quedan ${stockTot(m)}. Tallas más apretadas: ${w}. Una corrida tarda ~${SEM_LEAD} semanas.`,
        ops:[{t:'Abrir orden sugerida',a:`data-nueva="${m.id}"`,pri:1}]}); }
    if(e.t==='Sobrestock') out.push({sev:1, ico:'pausa', t:`«${m.n}» tiene ${N(e.c1,0)} semanas de stock: no produzcas más`,
      p:`Vendes ${N(ventasSem(m),1)}/semana y hay ${stockTot(m)} en tiendas y almacén. Es capital parado: ${S0(stockTot(m)*costoModelo(m))} a costo.`,
      ops:[{t:'Ver qué producir',a:'data-scroll="produce"'}]});
  });
  // 5 · avíos bajo mínimo sin pedido en camino
  const bajos = D.insumos.filter(i=>estadoIns(i).c!=='verde' && !enCamino(i.id) && !(i.tipo==='tela' && dem[i.id]>saldo(i)));
  if(bajos.length) out.push({sev:2, ico:'caja', t:`${bajos.map(i=>i.nombre).join(' y ')} ${bajos.length>1?'están':'está'} bajo el mínimo`,
    p:bajos.map(i=>`${i.nombre}: ${N(saldo(i),i.u==='m'?1:0)} ${i.u} (mínimo ${i.min}, alcanza ~${N(saldo(i)/Math.max(.1,consumoSem(i)),1)} semanas)`).join(' · '),
    ops:[{t:'Pedir '+bajos[0].nombre.toLowerCase(),a:`data-pedir="${bajos[0].id}"`,pri:1}]});
  // 6 · producir o maquilar
  const cm = MODELOS.map(m=>({m,c:comparaMaquila(m)})).filter(x=>x.c.v.c==='ambar').sort((a,b)=>b.c.d-a.c.d)[0];
  if(cm) out.push({sev:1, ico:'balanza', t:`Para «${cm.m.n}», maquilar afuera costaría ${N(cm.c.d*100,0)} % menos que fabricarlo`,
    p:`Interno ${S(cm.c.interno)} contra ${S(cm.c.externo)} con la cotización externa. Es la mitad del criterio D-31 para medir al Taller.`,
    ops:[{t:'Ver eficiencia',a:'data-v-ir="eficiencia"',pri:1}]});
  return out.sort((a,b)=>b.sev-a.sev).slice(0,7);
}

function spark(serie,w=90,h=28){

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline class="draw" pathLength="1" points="${pts}" fill="none" stroke="${sube?'var(--ambar)':'var(--tinta)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

    const bloq = c.lineas.filter(l=>l.k==='ins'&&(dem[l.ins]||0)>saldo(insumo(l.ins))).map(l=>D.ordenes.filter(o=>o.etapas.corte!=='hecho'&&modelo(o.modelo).tela===l.ins).map(nombreOrden)).flat();

function tarjetaOrden(o,i){

  const seg=ETAPAS.map(e=>{const s=o.etapas[e.k]; return `<i class="${s==='hecho'?'hecho':s==='terc'?'terc':(e.k===act?'actual':'')}" title="${e.t}"></i>`}).join('');
  const ent = r.d<0&&r.rest>0 ? `<span class="vence">entrega pasada</span>` : `entrega ${fechaCorta(o.entrega)} · ${r.d} d`;
  const sinIns = (c.tela+c.avio)===0;
  const estado = o.etapas[act]==='terc' ? `<span class="chip ambar">Maquila externa</span>` : (L()&&sinIns) ? `<span class="chip ambar">Sin insumos</span>` : (L()&&sm?`<span class="sem"><span class="dot ${sm.c}"></span>${sm.t} ${Math.round(mg*100)}%</span>`:'');
  const rie = r.rest===0 ? '' : r.tarde>0 ? `<div class="riesgo ambar"><b>~${r.tarde} d tarde:</b> faltan ~${r.rest} d de trabajo</div>` : '';

    <div class="r1"><div><h3>${nombreOrden(o)}</h3><div class="sub">${m.cat} · ${planDe(o)} prendas</div></div>${L()?`<div class="cpp"><b>${c.total?S(c.cpp):'—'}</b><span>costo / prenda</span></div>`:''}</div>
    <div class="seg">${seg}</div><div class="pie"><span>${ent}</span>${estado}</div>${rie}
    ${L()?(c.total>0?`<div class="stack"><i class="c-tela" style="width:${c.tela/tot*100}%"></i><i class="c-avio" style="width:${c.avio/tot*100}%"></i><i class="c-maq" style="width:${c.maq/tot*100}%"></i></div>`:''):''}</button>`;
}
function vOrdenes(){

function matrizHTML(m, vals, {editable=true, id='mx', pie=''}={}){

function refrescarMatriz(m, vals){

}

function prevConsumo(o){
  const i=ui.form.insumo?insumo(ui.form.insumo):null, q=+ui.form.qty||0;

  const sl=saldoLote(i,l);
  if(q>sl) return {error:`El lote ${l.id} solo tiene ${N(sl,1)} ${i.u}. Registra ${N(sl,1)} y luego el resto: sale del siguiente lote, con su propio costo.`};
  const v=q*l.costo, a=costos(o), b=costos(o,{tipo:i.tipo,v}), m=modelo(o.modelo);
  return {i,l,sl,q,v,a,b, ma:margen(m.precio,a.cpp), mb:margen(m.precio,b.cpp)};
}

/* ---------- Nueva orden: decidir antes de abrir ---------- */
function abrirNueva(id){
  const m = (id&&id!=='auto') ? modelo(id) : MODELOS.map(x=>({x,e:estadoModelo(x)})).sort((a,b)=>a.e.o-b.e.o||a.e.c1-b.e.c1)[0].x;
  const cv=curva(m), total=cv.sugerido||24;
  ui.no={modelo:m.id, total, mx:distribuir(m,total,cv.w)};
  abrirDrawer('nueva');
}
function analisisNueva(){
  const no=ui.no, m=modelo(no.modelo), n=sum(Object.values(no.mx)), tela=insumo(m.tela);
  const necTela = n*m.rend*(1+MERMA[m.tela]), sTela=saldo(tela), cam=enCamino(m.tela), otros=(demandaTela()[m.tela]||0);
  const libre = sTela - otros;
  const estTela = necTela<=libre ? {c:'verde',t:'Alcanza'} : necTela<=libre+cam ? {c:'ambar',t:'Alcanza si llega lo que viene'} : {c:'rojo',t:`Faltan ${N(necTela-libre-cam)} m`};
  const av = Object.entries(m.avios).map(([k,q])=>{ const i=insumo(k), need=n*q, s=saldo(i); return {i,need,s,ok:s>=need}; });
  const cTela = m.rend*precioRef(m.tela), cAv=sum(av.map(a=>a.need/Math.max(n,1)*precioRef(a.i.id))), cpp=cTela+cAv+m.maq, mg=margen(m.precio,cpp);
  const cm=comparaMaquila(m), dur=sum(ETAPAS.map(e=>e.d)), fecha=sumaDias(HOY,dur);
  return {m,n,necTela,sTela,cam,otros,libre,estTela,av,cTela,cAv,cpp,mg,cm,dur,fecha,capital:n*cpp};
}

  $('#drw').innerHTML = `

    <div class="sec"><span class="lbl">2 · ¿Cuántas y en qué tallas? ${src('deriva','ventas + stock')}</span>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div class="qty"><button type="button" data-nt="-6" aria-label="Menos">−</button><input id="ntotal" inputmode="numeric" value="${a.n}" aria-label="Total"><button type="button" data-nt="6" aria-label="Más">+</button><span>prendas</span></div>

/* ====================================================================

function topModelo(iid){ return MODELOS.filter(m=>m.tela===iid||m.avios[iid]).sort((a,b)=>ventasSem(b)-ventasSem(a))[0]; }
function filaInsumo(i,idx){
  const s=saldo(i), est=estadoIns(i), tope=Math.max(i.min*3,s,1), abierto=!!ui.insAbierto[i.id];
  const lotes=[...i.lotes].sort((a,b)=>a.ingreso.localeCompare(b.ingreso)), primero=loteActivo(i), cam=enCamino(i.id);
  const cs=consumoSem(i), sem=cs>0?s/cs:null, tm=topModelo(i.id);
  const rinde = tm ? Math.floor(s/(i.tipo==='tela'?tm.rend:tm.avios[i.id])) : null;
  const dur = est.c!=='verde' && !cam ? `<button class="btn dis s" data-pedir="${i.id}" type="button" style="margin-top:8px">Pedir</button>` : cam?`<span class="chip neutro" style="margin-top:8px">${N(cam)} ${i.u} en camino</span>`:'';
  return `<article class="card ins e ${abierto?'abierto':''} ${ui.nuevoIns===i.id?'flash':''}" style="--i:${idx}">
    <button class="cab2" type="button" aria-expanded="${abierto}" data-tog="${i.id}">
      <div class="nom"><b>${i.nombre}</b><span>${i.lotes.length} lote${i.lotes.length>1?'s':''}${sem?` · alcanza ~${N(sem,1)} sem.`:''}${rinde?` · ≈ ${N(rinde)} prendas de ${tm.n}`:''}</span></div>
      <div class="saldo"><div class="tk"><div class="fl ${est.c==='verde'?'':est.c}" data-bar="ins-${i.id}" data-val="${Math.min(1,s/tope)}"></div><div class="mn" style="left:${i.min/tope*100}%" title="Mínimo ${i.min} ${i.u}"></div></div>
        <div class="tx"><span>mínimo ${N(i.min)} ${i.u}</span><span class="${est.c}">${est.t}</span></div></div>
      <div class="num"><span data-num="s-${i.id}" data-val="${s}" data-d="${i.u==='m'?1:0}">${N(s,i.u==='m'?1:0)}</span><small>${i.u}</small></div><span class="caret">${ic('chev')}</span></button>
    <div class="lotes"><div><div class="in">
      ${lotes.map(l=>{const sl=saldoLote(i,l); return `<div class="lote ${ui.nuevoIns===i.id&&l.id===ui.nuevoLote?'flash':''}"><b>${l.id}</b>
        <div><div class="mb"><i data-bar="lt-${l.id}" data-val="${sl/l.cant}"></i></div><small class="muted">${l.prov} · ${l.doc}</small></div>
        <span class="tab">${N(sl,1)} / ${N(l.cant)}</span>${L()?`<span class="cs tab muted">${S(l.costo)}${l===primero?' <span class="chip neutro" style="font-size:9.5px" title="Se descuenta primero">1º</span>':''}</span>`:'<span class="cs"></span>'}</div>`}).join('')}
      ${dur?`<div style="padding-top:10px">${dur}</div>`:''}
    </div></div></div></article>`;
}
function vInsumos(){
  const bajos=D.insumos.filter(i=>estadoIns(i).c!=='verde').length, cap=sum(D.insumos.map(i=>sum(i.lotes.map(l=>saldoLote(i,l)*l.costo))));
  const grupo=(tipo,titulo,sub,base)=>`<div><h2 class="s e">${titulo}<small>${sub}</small></h2>${D.insumos.filter(i=>i.tipo===tipo).map((i,k)=>filaInsumo(i,base+k)).join('')}</div>`;
  const movs=[];
  D.insumos.forEach(i=>i.lotes.forEach(l=>movs.push({id:'ing-'+l.id,f:l.ingreso,t:'in',txt:`Entra ${l.id}`,sub:`${i.nombre} · ${l.prov}`,q:`+${N(l.cant)} ${i.u}`})));
  D.consumos.forEach(c=>{const i=insumo(c.insumo),o=orden(c.orden); movs.push({id:c.id,f:c.fecha,t:'out',txt:'Sale al cortar',sub:`${i.nombre} · ${nombreOrden(o)}`,q:`−${N(c.qty,i.u==='m'?1:0)} ${i.u}`})});
  movs.sort((a,b)=>b.f.localeCompare(a.f)||(b.id===ui.nuevoMov?1:0)-(a.id===ui.nuevoMov?1:0));
  return `${cab('Insumos','Tela y avíos del Taller: lo que hay por lote, cuánto dura y qué pedir. El saldo siempre es la suma de movimientos.',
      `<button class="btn dis" data-nuevocomp="1" type="button">${ic('cart')}Pedir a proveedor</button>`)}
    <div class="kpis">${kpi(0,bajos?'ambar':'verde','Bajo el mínimo','k1',bajos,'',bajos?'pide o espera lo que viene':'todo sobre el mínimo',bajos?'ambar':'verde',src('hoy'))}
      ${L()?kpi(1,'verde','Capital en insumos','k2',cap,'S/ ','a costo de cada lote','',src('deriva')):''}
      ${kpi(2,'verde','En camino','k3',D.comps.filter(c=>!c.recibido&&c.dest==='taller').length,'','comprobantes por recibir','',src('hoy'))}</div>
    <div class="dos"><div>${grupo('tela','Telas','se compran por metro',0)}${grupo('avio','Avíos','botones, cierres y etiquetas',4)}</div>
    <aside class="card libro e" style="margin-top:28px"><h3>Libro de movimientos</h3><p class="muted" style="font-size:12px;margin-bottom:6px">Solo se agrega, nunca se edita.</p>
      ${movs.slice(0,9).map(m=>`<div class="mov ${m.id===ui.nuevoMov?'nuevo':''}"><span class="tipo">${ic(m.t==='in'?'in':'out')}</span><span>${m.txt}<small>${m.sub}</small></span><span class="q ${m.t==='in'?'mas':''}">${m.q}</span></div>`).join('')}</aside></div>`;
}

/* ---------- Eficiencia del Taller ---------- */
function vEficiencia(){
  const ef=eficienciaMes(), mx=ef.gasto;
  const serie=[...HIST_MESES.map(h=>({m:h.m,cpp:h.cpp,ef:h.ef})), {m:'Sep',cpp:ef.absorbido? (D.cerradas.filter(o=>o.cerrada).reduce((a,o)=>a+costos(o).cpp,0)/D.cerradas.filter(o=>o.cerrada).length):37.4, ef:ef.ef}];
  const W=340,H=140,xs=i=>26+i*(W-52)/(serie.length-1), mn=34, mxc=44, ys=v=>H-16-(v-mn)/(mxc-mn)*(H-40);
  const pts=serie.map((s,i)=>`${xs(i).toFixed(1)},${ys(s.cpp).toFixed(1)}`).join(' ');
  const lin=`<svg class="lin" viewBox="0 0 ${W} ${H+12}"><polyline class="draw" pathLength="1" points="${pts}" fill="none" stroke="var(--tinta)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${serie.map((s,i)=>`<circle cx="${xs(i)}" cy="${ys(s.cpp)}" r="3.5" fill="var(--crema)" stroke="var(--tinta)" stroke-width="1.6"/><text x="${xs(i)}" y="${ys(s.cpp)-10}" text-anchor="middle">${N(s.cpp,1)}</text><text x="${xs(i)}" y="${H+6}" text-anchor="middle">${s.m}</text>`).join('')}</svg>`;
  const cas=[['Gastado',ef.gasto,'c-tela'],['Ya es prenda',ef.absorbido,'c-ok'],['En proceso',ef.proceso,'c-prod'],['No absorbido',ef.fijos,'c-no']];
  const modelos=MODELOS.map(m=>({m,c:comparaMaquila(m)})).sort((a,b)=>b.c.d-a.c.d);
  const filas=modelos.map(({m,c},i)=>`<tr class="e" style="--i:${i}"><td class="nm"><b>${m.n}</b><span>${m.cat}</span></td><td class="r">${S(c.interno)}</td><td class="r">${S(c.externo)}</td>
    <td class="r ${c.d>=.05?'ambar':c.d<=-.05?'verde':''}">${c.d>0?'+':''}${N(c.d*100,1)} %</td><td><span class="chip ${c.v.c}">${c.v.t}</span></td></tr>`).join('');
  const rend=MODELOS.map((m,i)=>{ const d=(m.real.rend/m.rend-1); const merma=MERMA[m.tela]; return `<tr class="e" style="--i:${i}"><td class="nm"><b>${m.n}</b><span>${insumo(m.tela).nombre}</span></td><td class="r">${m.rend}</td><td class="r">${m.real.rend}</td>
    <td class="r ${d>.05?'ambar':''}">${d>0?'+':''}${N(d*100,1)} %</td><td class="r">${N(m.real.seg*100)} %</td><td>${d>merma?`<span class="chip ambar">Gasta más que la merma (${N(merma*100)} %)</span>`:'<span class="chip verde">Dentro de la merma</span>'}</td></tr>`; }).join('');
  return `${cab('Eficiencia del Taller','¿Conviene fabricar acá o mandarlo a maquilar? El Taller se mide por lo gastado contra lo que absorbió en prendas (D-31), y contra una cotización real de maquila externa.','')}
    <div class="kpis">${kpi(0,ef.ef>=.7?'verde':'ambar','Eficiencia de septiembre','k1',Math.round(ef.ef*100),'','(ya es prenda + en proceso) ÷ gastado',ef.ef>=.7?'verde':'ambar',src('nuevo','falta gastos'),0,' %')}
      ${kpi(1,'verde','Ya es prenda','k2',ef.absorbido,'S/ ','órdenes cerradas este mes','',src('deriva'))}${kpi(2,'ambar','No absorbido','k3',ef.fijos,'S/ ','sueldos fijos y servicios del Taller','ambar',src('nuevo','gasto Taller'))}</div>
    <div class="dos" style="margin-top:8px"><div><h2 class="s e">¿A dónde fue lo gastado en septiembre? <small>lo que no llega a ser prenda es la capacidad que sobra ${src('nuevo')}</small></h2>
      <div class="card pad e"><div class="cascada">${cas.map(([t,v,cl])=>`<div class="c"><em class="tab">${S0(v)}</em><i class="${cl}" data-bar="ca-${t}" data-eje="y" data-val="1" style="height:${Math.max(4,v/mx*120)}px"></i><span>${t}</span></div>`).join('')}</div></div></div>
      <div><h2 class="s e">Costo por prenda, mes a mes <small>${src('deriva')}</small></h2><div class="card pad e">${lin}</div></div></div>
    <h2 class="s e">¿Fabricar o maquilar? <small>costo interno contra tela y avíos propios + la cotización externa de la confección ${src('nuevo','cotización')}</small></h2>
    <div class="card e"><table class="tb"><thead><tr><th>Modelo</th><th class="r">Interno</th><th class="r">Externo</th><th class="r">Diferencia</th><th>Veredicto</th></tr></thead><tbody>${filas}</tbody></table></div>
    <h2 class="s e">Rendimiento de tela <small>metros por prenda: estándar contra lo que realmente se gasta ${src('deriva')}</small></h2>
    <div class="card e"><table class="tb"><thead><tr><th>Modelo</th><th class="r">Estándar</th><th class="r">Real</th><th class="r">Desvío</th><th class="r">Segundas</th><th>Lectura</th></tr></thead><tbody>${rend}</tbody></table></div>`;
}

function ir(v){ ui.vista=v; ui.nuevoComp=null; render(); window.scrollTo({top:0,behavior:REDUCE()?'auto':'smooth'}); }
function abrirDrawer(modo,id){
  ui.drawer=modo; ui.abierto=id||ui.abierto;

}

/* ---------- Registrar comprobante (de tela o avíos) ---------- */
function abrirComprobante(iid){
  const i = iid?insumo(iid):insumo('lino');
  const provs = D.provs.filter(p=>p.rubro===(i.tipo==='tela'?'Tela':'Avíos'));
  const mejor = [...provs].sort((a,b)=>a.serie[a.serie.length-1]-b.serie[b.serie.length-1])[0];
  const cobertura = i.tipo==='tela' ? Math.max(0,Math.ceil(((demandaTela()[i.id]||0)+i.min-saldo(i)-enCamino(i.id))/10)*10) : Math.max(50,Math.ceil((i.min*2-saldo(i))/50)*50);
  ui.rcmp={ins:i.id, prov:mejor.n, qty:cobertura||50, costo:mejor.serie[mejor.serie.length-1], cond:'credito', doc:''};
  abrirDrawer('comp');
}

  <div class="bd"><span class="lbl muted">¿Qué compraste?</span><div class="opts">${D.insumos.map(x=>`<button class="opt" data-rins="${x.id}" aria-pressed="${x.id===i.id}">${x.nombre}</button>`).join('')}</div>
    <div class="g2"><label class="fld"><span>Cantidad (${i.u})</span><input id="rcQty" inputmode="decimal" value="${r.qty}"></label>
      <label class="fld"><span>Costo por ${i.u==='m'?'metro':i.u} (sin IGV)</span><input id="rcCosto" inputmode="decimal" value="${r.costo}"></label></div>
    <div class="g2"><label class="fld"><span>Proveedor</span><select id="rcProv">${provs.map(x=>`<option ${x.n===p.n?'selected':''}>${x.n}</option>`).join('')}</select></label>
      <label class="fld"><span>N.º de documento</span><input id="rcDoc" placeholder="F004-0000" value="${r.doc}"></label></div>
    <span class="lbl muted">Condición</span><div class="opts"><button class="opt" data-rcond="credito" aria-pressed="${r.cond==='credito'}">Crédito ${p.plazo?p.plazo+' d':''}</button><button class="opt" data-rcond="contado" aria-pressed="${r.cond==='contado'}">Contado</button></div>
    <div class="pv"><div class="fila"><span>Total sin IGV<small>el IGV (${S(total*.18)}) es crédito fiscal, no costo del insumo</small></span><span class="de"><b>${S(total)}</b></span></div>
      <div class="fila"><span>${venc?'Vence':'Se paga hoy'}<small>${venc?'entra a Por pagar':'sale de la cuenta de la empresa'}</small></span><span class="de"><b>${venc?fechaCorta(venc):'hoy'}</b></span></div>
      <div class="fila"><span>Llegada estimada<small>${p.n} suele entregar en ${p.dias} días (puntual ${p.puntual} %)</small></span><span class="de"><b>${fechaCorta(llega)}</b></span></div>
      ${otro?`<div class="fila"><span>Comparado con ${otro.n}<small>por ${i.u==='m'?'metro':i.u}, último precio</small></span><span class="de ${pu>po?'ambar':'verde'}"><b>${pu>po?'+':''}${N((pu/po-1)*100,1)} %</b></span></div>`:''}</div>

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-comp],[data-nueva],tr.click,input[data-sel]'); if(!t) return;
  const d=t.dataset;
  if(d.v){ return ir(d.v); }
  if(d.vIr) return ir(d.vIr);
  if(d.scroll){ const el=document.getElementById(d.scroll); return el&&el.scrollIntoView({behavior:REDUCE()?'auto':'smooth'}); }
  if(d.orden){ if(ui.vista!=='ordenes') ir('ordenes'); return abrirDrawer('orden',d.orden); }
  if(t.classList.contains('oc')) return abrirDrawer('orden',d.id);
  if(d.nueva!==undefined) return abrirNueva(d.nueva);
  if(d.pedir) return abrirComprobante(d.pedir);
  if(d.nuevocomp) return abrirComprobante();
  if(d.comp){ ui.abierto=d.comp; return abrirDrawer('detalle',d.comp); }
  if(t.hasAttribute('data-cerrar')||t.id==='veil') return cerrarDrawer();
  if(d.cf){ ui.cf=d.cf; return render(); }
  if(d.tog){ ui.insAbierto[d.tog]=!ui.insAbierto[d.tog]; t.closest('.ins').classList.toggle('abierto'); return t.setAttribute('aria-expanded',ui.insAbierto[d.tog]); }
  if(d.rol){ ui.rol=d.rol; document.querySelectorAll('[data-rol]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rol===ui.rol)); cerrarDrawer(); return render(); }
  if(t.id==='btnFuentes'){ const on=document.body.classList.toggle('fuentes'); return t.setAttribute('aria-pressed',on); }
  if(t.id==='btnMov'){ const on=document.documentElement.classList.toggle('reducir'); return t.setAttribute('aria-pressed',on); }
  if(t.id==='btnReset'){ D=datosIniciales(); D.ordenes.forEach(o=>{o.lineas=distribuir(modelo(o.modelo),o.plan0,modelo(o.modelo).v60)}); ui.insAbierto={};ui.sel={};ui.rc={};ui.nuevoMov=null;ui.nuevoIns=null;ui.nuevoComp=null;
    [numCache,barCache,gaugeCache].forEach(c=>Object.keys(c).forEach(k=>delete c[k])); cerrarDrawer(); render(); return aviso('<b>Demo reiniciada</b>'); }

  /* --- Recibir / Por pagar --- */
  if(d.recibir){ const c=D.comps.find(x=>x.id===d.recibir); const cortables=[];
    c.lineas.forEach((l,j)=>{ if(l.k!=='ins') return; const it=insumo(l.ins), q=parseFloat(ui.rc[c.id+j]!==undefined?ui.rc[c.id+j]:l.qty)||0; if(q<=0) return;
      const cod=it.id[0].toUpperCase()+'-'+String(921+D.seq++).padStart(4,'0'); it.lotes.push({id:cod,prov:c.prov,ingreso:HOY,cant:q,costo:l.costo,doc:c.doc});
      ui.nuevoIns=it.id; ui.nuevoLote=cod; ui.nuevoMov='ing-'+cod; ui.insAbierto[it.id]=true; });
    c.recibido=true; ui.rc={}; trabajando();
    const dem=demandaTela(), destr=D.ordenes.filter(o=>o.etapas.corte!=='hecho'&&saldo(insumo(modelo(o.modelo).tela))>=(dem[modelo(o.modelo).tela]||0)&&c.lineas.some(l=>l.ins===modelo(o.modelo).tela)).map(nombreOrden);
    render(); return aviso(`<b>${c.doc} recibido</b>`,{sub:c.dest==='taller'?`Se abrió el lote y el saldo subió. ${destr.length?`Ya se puede cortar: ${destr.join(', ')}.`:''}`:'Entró al almacén de las tiendas.',dur:8}); }
  if(d.sel!==undefined){ ui.sel[d.sel]=t.checked; const pb=$('#pagbar'); const sel=D.comps.filter(c=>ui.sel[c.id]&&saldoComp(c)>0);
    pb.classList.toggle('on',sel.length>0); pb.querySelector('span').innerHTML=`${sel.length} comprobante${sel.length>1?'s':''} · <b class="tab">${S(sum(sel.map(saldoComp)))}</b>`; return; }
  if(d.pagar) return abrirDrawer('pagar');
  if(t.id==='btnConfirmarPago'){ const cs=D.comps.filter(c=>ui.sel[c.id]&&saldoComp(c)>0), tot=sum(cs.map(saldoComp)); cs.forEach(c=>c.pagado=totalComp(c)); ui.sel={}; cerrarDrawer(); trabajando(); render();
    return aviso(`<b>${cs.length} comprobante${cs.length>1?'s':''} pagado${cs.length>1?'s':''}</b>`,{sub:`${S(tot)} salieron de la cuenta de la empresa.`,dur:7}); }

  /* --- Registrar comprobante --- */
  if(d.rins){ const i=insumo(d.rins); ui.rcmp.ins=i.id; const provs=D.provs.filter(p=>p.rubro===(i.tipo==='tela'?'Tela':'Avíos')); ui.rcmp.prov=provs[0].n; ui.rcmp.costo=provs[0].serie[5]; return renderRegistrar(); }
  if(d.rcond){ ui.rcmp.cond=d.rcond; return renderRegistrar(); }
  if(t.id==='btnGuardarComp'){ const r=ui.rcmp, i=insumo(r.ins), p=prov(r.prov); if(!(r.qty>0&&r.costo>0)) return;
    const id='c'+(D.comps.length+1), n=D.comps.length+1; const doc=r.doc||('F00'+(4+(n%3))+'-0'+(900+n));
    D.comps.push({id,prov:r.prov,doc,fecha:HOY,dest:'taller',vence:r.cond==='credito'?sumaDias(HOY,p.plazo):null,pagado:r.cond==='contado'?r.qty*r.costo:0,recibido:false,lineas:[{k:'ins',ins:i.id,qty:r.qty,costo:r.costo}]});
    ui.nuevoComp=id; cerrarDrawer(); trabajando(); if(ui.vista==='insumos'||ui.vista==='resumen') render(); else ir('comprobantes');
    return aviso(`<b>Comprobante ${doc} registrado</b>`,{sub:`${N(r.qty)} ${i.u} de ${i.nombre} por ${S(r.qty*r.costo)}. ${r.cond==='credito'?`Vence el ${fechaCorta(sumaDias(HOY,p.plazo))}.`:'Pagado al contado.'} Aparece en Recibir.`,dur:8}); }

  /* --- Nueva orden --- */
  if(d.nmodelo){ const m=modelo(d.nmodelo), cv=curva(m), total=cv.sugerido||24; ui.no={modelo:m.id,total,mx:distribuir(m,total,cv.w)}; return renderNueva(); }
  if(d.nt){ const m=modelo(ui.no.modelo), cv=curva(m), nt=Math.max(6,sum(Object.values(ui.no.mx))+(+d.nt)); ui.no.mx=distribuir(m,nt,cv.w); return renderNueva(); }
  if(d.ncurva){ const m=modelo(ui.no.modelo), cv=curva(m); ui.no.mx=distribuir(m,cv.sugerido||24,cv.w); return renderNueva(); }
  if(t.id==='btnAbrirOrden'){ const a=analisisNueva(), m=a.m; if(a.n<=0) return; const id='o'+(D.ordenes.length+D.cerradas.length+1)+'n';
    flip(()=>{ D.ordenes.push({id,modelo:m.id,entrega:a.fecha,maquila:Math.round(a.n*m.maq),plan0:a.n,lineas:{...ui.no.mx},etapas:{corte:'pendiente',confeccion:'pendiente',acabado:'pendiente'}}); });
    cerrarDrawer(); trabajando(); if(ui.vista!=='ordenes') ir('ordenes'); else render();
    return aviso(`<b>Orden abierta: ${m.n}</b>`,{sub:`${a.n} prendas · entrega estimada ${fechaCorta(a.fecha)} · ${a.estTela.c==='verde'?'la tela alcanza':a.estTela.t.toLowerCase()}.`,dur:8}); }

  /* --- Orden: etapas, consumo, cierre --- */
  const o=ui.abierto&&D.ordenes.find(x=>x.id===ui.abierto);
  if(d.hecho&&o){ trabajando(); flip(()=>{o.etapas[d.hecho]='hecho'; renderLateral(); if(ui.vista==='ordenes') $('#vista').innerHTML=vOrdenes();}); const n=etapaActual(o); renderOrden();
    return aviso(`<b>${ETAPAS.find(x=>x.k===d.hecho).t} hecho</b>`,{sub:n==='listo'?`${nombreOrden(o)} está lista para cerrar al inventario`:`${nombreOrden(o)} pasa a ${COLS.find(c=>c.k===n).t.toLowerCase()}`,
      deshacer:()=>{flip(()=>{o.etapas[d.hecho]='pendiente'; if(ui.vista==='ordenes') $('#vista').innerHTML=vOrdenes(); renderLateral();}); if(ui.abierto===o.id) renderOrden();}}); }
  if(d.terc&&o){ const k=d.terc; o.etapas[k]=o.etapas[k]==='terc'?'pendiente':'terc'; render(); return aviso(o.etapas[k]==='terc'?`<b>${nombreOrden(o)}</b> salió a maquila externa`:`<b>${nombreOrden(o)}</b> volvió al Taller`); }
  if(d.pick&&o){ ui.form.insumo=d.pick; ui.form.qty=0; return renderOrden(); }
  if(d.q&&o){ const i=ui.form.insumo?insumo(ui.form.insumo):null; if(!i) return; const paso=i.u==='m'?.5:10; ui.form.qty=Math.max(0,+(((+ui.form.qty||0)+(+d.q)*paso).toFixed(2))); $('#qty').value=ui.form.qty||''; $('#prev').innerHTML=previewConsumo(o); $('#btnCons').disabled=!prevConsumo(o).v; return; }
  if(t.id==='btnCons'&&o){ const p=prevConsumo(o); if(!p.v) return; const id='m'+(D.consumos.length+1)+'n';
    D.consumos.push({id,orden:o.id,insumo:p.i.id,lote:p.l.id,qty:p.q,fecha:HOY}); ui.nuevoMov=id; ui.nuevoIns=p.i.id; trabajando(); ui.form={insumo:null,qty:0}; render();
    return aviso(`<b>${N(p.q,1)} ${p.i.u} de ${p.i.nombre}</b> descontados`,{sub:`Sale del lote ${p.l.id}.${L()?` ${nombreOrden(o)} ahora cuesta ${S(costos(o).cpp)} por prenda.`:''}`,deshacer:()=>{D.consumos=D.consumos.filter(x=>x.id!==id); ui.nuevoMov=null; render();},dur:7}); }
  if(t.id==='btnCerrarOrd'&&o){ ui.cierre={buenas:{...o.lineas}}; return renderOrden(); }
  if(t.id==='btnCancelarCierre'&&o){ ui.cierre=null; return renderOrden(); }
  if(t.id==='btnConfirmarCierre'&&o){ const b=sum(Object.values(ui.cierre.buenas)); if(b<=0) return; const cpp=costos({...o,buenas:b}).cpp; trabajando(1200);
    o.buenas=b; o.cerrada=HOY; D.stockTaller+=b; D.cerradas.push(o); cerrarDrawer();
    setTimeout(()=>{ flip(()=>{ D.ordenes=D.ordenes.filter(x=>x.id!==o.id); render(); }); aviso(`<b>${b} prendas entran al stock del Taller</b>`,{sub:`${nombreOrden(o)}${L()?` · costo real ${S(cpp)} por prenda, ya recalculado en cada variante`:''}. Siguiente paso: trasladarlas a las tiendas.`,dur:8}); },380); return; }
  if(t.id==='btnAnular'&&o){ cerrarDrawer(); setTimeout(()=>{ D.ordenes=D.ordenes.filter(x=>x.id!==o.id); D.consumos=D.consumos.filter(x=>x.orden!==o.id); render(); aviso(`<b>${nombreOrden(o)} anulada</b>`,{sub:'Lo consumido volvió a sus lotes con un movimiento de devolución.'}); },300); return; }
});
document.addEventListener('input',e=>{
  const o=ui.abierto&&D.ordenes.find(x=>x.id===ui.abierto), id=e.target.id, el=e.target;
  if(id==='qty'&&o){ ui.form.qty=parseFloat(el.value.replace(',','.'))||0; $('#prev').innerHTML=previewConsumo(o); $('#btnCons').disabled=!prevConsumo(o).v; }
  if(el.dataset.rc){ ui.rc[el.dataset.rc.replace('|','')]=el.value; }
  if(el.dataset.mx==='cierre'&&o){ const tope=o.lineas[el.dataset.k]||0, v=Math.min(tope,Math.max(0,parseInt(el.value)||0)); if(String(v)!==el.value) el.value=v; ui.cierre.buenas[el.dataset.k]=v; refrescarMatriz(modelo(o.modelo),ui.cierre.buenas);
    const c=costos(o), b=sum(Object.values(ui.cierre.buenas)), cpp=b?c.total/b:0, mg=margen(modelo(o.modelo).precio,cpp); const a=$('#ccpp'), z=$('#cmg'), ok=$('#cok'), sg=planDe(o)-b; if(ok) ok.innerHTML=`${ic('in')} Entran al stock del Taller · ${sg>0?`<span class="ambar">${sg} segunda${sg>1?'s':''} o perdida${sg>1?'s':''}</span>`:'sin segundas'}`; if(a) a.textContent=S(cpp); if(z) z.textContent=`costo real por prenda${mg!=null?` · margen ${Math.round(mg*100)}%`:''}`; }
  if(el.dataset.mx==='nueva'){ ui.no.mx[el.dataset.k]=Math.max(0,parseInt(el.value)||0); refrescarMatriz(modelo(ui.no.modelo),ui.no.mx); $('#ntotal').value=sum(Object.values(ui.no.mx)); $('#nprev').innerHTML=previewNueva(analisisNueva()); }
  if(id==='ntotal'){ const m=modelo(ui.no.modelo), n=Math.max(0,parseInt(el.value)||0); ui.no.mx=distribuir(m,n,curva(m).w); $('#nmx').innerHTML=matrizHTML(m,ui.no.mx,{id:'nueva'}); $('#nprev').innerHTML=previewNueva(analisisNueva()); }
  if(id==='rcQty'){ ui.rcmp.qty=parseFloat(el.value)||0; renderRegistradoLigero(); }
  if(id==='rcCosto'){ ui.rcmp.costo=parseFloat(el.value)||0; renderRegistradoLigero(); }
  if(id==='rcDoc') ui.rcmp.doc=el.value;
});
function renderRegistradoLigero(){ const f=document.activeElement, id=f&&f.id, pos=f&&f.selectionStart; renderRegistrar(); if(id){ const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} } } }
document.addEventListener('change',e=>{ if(e.target.id==='rcProv'){ ui.rcmp.prov=e.target.value; ui.rcmp.costo=prov(e.target.value).serie.slice(-1)[0]; renderRegistrar(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ui.drawer) cerrarDrawer(); });

render();

</script>
