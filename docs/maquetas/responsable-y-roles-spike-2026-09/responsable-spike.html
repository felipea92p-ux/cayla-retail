<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responsable y roles · spike visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SPIKE VISUAL · Responsable por operación + roles a medida (ADR-0161)
   Cuatro preguntas, una por pantalla:
     1. Roles y accesos — ¿cómo se configura qué MÓDULOS ve y qué ACCIONES
        hace cada rol (personas y terminales)?
     2. Punto de venta — ¿cómo se elige al responsable en cada operación?
     3. Cierre de caja — ¿cómo queda firmado el cierre y cada movimiento?
     4. Nadie de turno — ¿qué ve la tienda cuando no hay nadie marcado?
   Tokens = los reales de apps/web/app/globals.css. Datos inventados;
   nada de esto toca el ERP ni la base.
   ==================================================================== */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--tinta:#1a1a18;--sand:#e8e0d0;--papel:#fbf6ec;
  --taupe-p:#805c4c;--verde:#556e49;--verde-p:#44583a;--ambar:#8c631f;--ambar-p:#734f15;
  --t80:rgba(26,26,24,.8);--t65:rgba(26,26,24,.65);--t50:rgba(26,26,24,.5);--t30:rgba(26,26,24,.3);--t10:rgba(26,26,24,.10);
  --ease:cubic-bezier(.32,.72,.24,1);
  --bar:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.disp{font-family:'EB Garamond',Georgia,serif;font-weight:400}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.tp{color:var(--taupe-p)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
@keyframes entrada{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes subir{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes revelar{from{opacity:0;transform:translate3d(0,-4px,0)}to{opacity:1;transform:none}}
@keyframes visto{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- barra del spike (no existe en el ERP) ---------- */
.spk{position:fixed;inset:0 0 auto 0;z-index:80;min-height:var(--bar);display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--tinta);color:var(--crema);font-size:13px;overflow-x:auto;white-space:nowrap}
.spk .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(245,240,232,.55)}
.spk label{display:flex;align-items:center;gap:8px;color:rgba(245,240,232,.7)}
.spk select{height:30px;border-radius:8px;border:1px dashed rgba(245,240,232,.4);background:rgba(245,240,232,.06);color:var(--crema);padding:0 8px;font-size:13px;cursor:pointer}
.spk select option{color:var(--tinta);background:var(--crema)}
.spk .sep{width:1px;height:18px;background:rgba(245,240,232,.2);flex:none}

main{padding:calc(var(--bar) + 28px) 28px 80px;max-width:1320px;margin:0 auto}
.pagina.entra{animation:entrada 360ms var(--ease) both}
.nota{margin:0 0 22px;padding:12px 16px;border:1px dashed var(--t30);border-radius:12px;font-size:13.5px;color:var(--t65);max-width:92ch}
.nota b{color:var(--tinta);font-weight:600}
h1.t{font-family:'EB Garamond',Georgia,serif;font-weight:400;font-size:clamp(34px,4.4vw,48px);line-height:1.05}
.sub{color:var(--t65);margin-top:8px;max-width:70ch}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;background:var(--sand);font-size:11.5px;font-weight:500;white-space:nowrap}
.chip.lock{background:transparent;border:1px solid var(--t10);color:var(--t65)}
.chip.verde{background:rgba(85,110,73,.14);color:var(--verde-p)}
.chip.ambar{background:rgba(140,99,31,.13);color:var(--ambar-p)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;background:var(--tinta);color:var(--crema);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;transition:background 220ms var(--ease)}
.btn:hover{background:var(--rojo)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--t10)}
.btn.sec:hover{background:rgba(232,224,208,.5);color:var(--rojo)}
.btn[disabled]{opacity:.38;pointer-events:none}

/* ---------- 1. Roles y accesos ---------- */
.rgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start;margin-top:26px}
.rol{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;text-align:left;transition:all 220ms var(--ease)}
.rol:hover{background:rgba(232,224,208,.45)}
.rol[aria-pressed=true]{background:var(--papel);border-color:var(--sand)}
.rol .n{font-weight:500}
.rol .d{font-size:12px;color:var(--t65)}
.rcab{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--sand)}
.rcab h2{font-family:'EB Garamond',serif;font-weight:400;font-size:30px;line-height:1.1}
.rcab .s{font-size:13px;color:var(--t65);margin-top:4px;max-width:60ch}
.rcab .der{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cuentas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.avm{width:22px;height:22px;border-radius:50%;background:var(--papel);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:11px;flex:none}
/* Matriz: una fila por módulo, columnas Ver · Crear · Editar · Eliminar · Más acciones */
.mx{width:100%;border-collapse:collapse;font-size:14px}
.mx th{font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe-p);text-align:center;padding:10px 6px;background:rgba(232,224,208,.35)}
.mx th:first-child{text-align:left;padding-left:20px}
.mx td{border-top:1px solid var(--sand);padding:8px 6px;text-align:center;vertical-align:middle}
.mx td:first-child{text-align:left;padding-left:20px}
.mx tr.grupo td{background:rgba(232,224,208,.2);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--t65);padding:10px 20px}
.mx .mn{font-weight:500}
.mx .mn small{display:block;font-weight:400;font-size:12px;color:var(--t65)}
.mx tr.off .mn{color:var(--t50)}
.mx input[type=checkbox]{width:18px;height:18px;accent-color:var(--tinta);cursor:pointer}
.mx input:disabled{cursor:not-allowed;opacity:.35}
.na{color:var(--t30)}
.mas{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--sand);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mas:hover{border-color:var(--t30)}
.mas b{font-weight:600}
.mas[disabled]{opacity:.35;pointer-events:none}
tr.det td{background:var(--crema);text-align:left;padding:4px 20px 16px 20px}
.det .col{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 18px;margin-top:6px}
.ac{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:13.5px}
.ac:hover{background:rgba(232,224,208,.45)}
.ac input{width:17px;height:17px;accent-color:var(--tinta);flex:none}
.ac.solo{color:var(--t50)}
.det .sig{font-size:12.5px;color:var(--t65);margin-top:8px}
.det .sig b{color:var(--tinta);font-weight:500}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--t30);transition:background 220ms var(--ease);flex:none;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 220ms var(--ease)}
.sw[aria-checked=true]{background:var(--tinta)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.sw[disabled]{opacity:.35;cursor:not-allowed}
.aviso-rol{margin:14px 20px 0;padding:10px 14px;border-radius:12px;background:rgba(232,224,208,.45);font-size:13px;color:var(--t80);display:flex;gap:8px;align-items:flex-start}
.menuprev{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 18px;border-top:1px solid var(--sand)}
.menuprev span{padding:5px 10px;border-radius:8px;background:rgba(232,224,208,.55);font-size:13px}
/* ---------- 2/4. Punto de venta ---------- */
.pdv{border:1px solid var(--sand);border-radius:22px;background:var(--crema);overflow:hidden}
.pdv .top{min-height:64px;border-bottom:1px solid var(--sand);background:var(--papel);display:flex;align-items:center;gap:18px;padding:0 20px;flex-wrap:wrap}
.pdv .top .lks{margin-left:auto;display:flex;gap:16px;font-size:13.5px;color:var(--t65)}
.pdv .top .cc{height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(26,26,24,.25);font-size:13px}
/* Altura fija como el ERP real (PuntoDeVenta.tsx: calc(100dvh-9rem)): el catálogo se desplaza, el ticket no. */
.pdv .body{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:max(560px,calc(100vh - 230px))}
.cat{padding:20px;border-right:1px solid var(--sand);overflow-y:auto}
.tk{overflow:visible;min-height:0}
.bus{height:56px;border-radius:16px;border:1px solid var(--sand);background:var(--papel);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--t50)}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.prod{border:1px solid var(--sand);border-radius:16px;padding:10px;background:var(--papel)}
.prod .ph{aspect-ratio:4/5;border-radius:12px;background:rgba(232,224,208,.6);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:26px;color:var(--taupe-p)}
.prod p{font-size:13.5px;margin-top:8px}
.prod b{font-size:14px}
.tk{background:var(--papel);display:flex;flex-direction:column}
.tk .h{min-height:72px;border-bottom:1px solid var(--sand);display:flex;align-items:center;gap:10px;padding:0 20px}
.tk .it{padding:14px 20px;border-bottom:1px solid var(--sand);display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tk .it small{display:block;color:var(--t65);font-size:12px}
.tk .pie{margin-top:auto;border-top:1px solid var(--sand);padding:16px 20px 20px}
.tot{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.tot .n{font-family:'EB Garamond',serif;font-size:44px;line-height:1}
.cobrar{height:56px;width:100%;border-radius:8px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:space-between;padding:0 18px;transition:background 220ms var(--ease),opacity 220ms var(--ease)}
.cobrar:hover{background:var(--rojo)}
.cobrar[disabled]{opacity:.35;pointer-events:none}
.cobrar .lbl{font-size:12px}
.cobrar .m{font-family:'EB Garamond',serif;font-size:24px}

/* ---------- El combo Responsable (la pieza nueva) ---------- */
.resp{position:relative;margin-bottom:12px}
.resp .lbl{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.resp .lbl .req{color:var(--rojo)}
.rbtn{width:100%;height:48px;border-radius:8px;border:1px solid var(--sand);background:var(--crema);display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left;transition:border-color 220ms var(--ease),box-shadow 220ms var(--ease)}
.rbtn:hover{border-color:rgba(26,26,24,.3)}
.rbtn.vacio{border-style:dashed;border-color:rgba(184,65,45,.55);color:var(--rojo-p)}
.rbtn.puesto{border-color:var(--tinta)}
.rbtn .av{width:28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px;flex:none}
.rbtn .v{flex:1;min-width:0}
.rbtn .v small{display:block;font-size:11.5px;color:var(--t65)}
.rbtn.bloq{border-style:solid;border-color:rgba(140,99,31,.45);background:rgba(140,99,31,.07);color:var(--ambar-p);cursor:default}
.pista{font-size:12px;color:var(--t65);margin-top:6px}
.lista{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:20;background:var(--papel);border:1px solid var(--sand);border-radius:12px;box-shadow:0 18px 44px -14px rgb(26 26 24/.22);padding:8px;animation:subir 260ms var(--ease) both}
.lista.abajo{bottom:auto;top:calc(100% + 6px)}
.lista .cab{padding:6px 8px 8px;font-size:11px}
.op{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:8px;text-align:left;font-size:14px;transition:background 180ms var(--ease)}
.op:hover{background:rgba(232,224,208,.55)}
.op .av{width:28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:'EB Garamond',serif;font-size:14px;flex:none}
.op .v{flex:1}
.op .v small{display:block;font-size:11.5px;color:var(--t65)}
.op .pt{width:8px;height:8px;border-radius:50%;background:var(--verde);flex:none}
.op[disabled]{opacity:.45;cursor:not-allowed}
.op[disabled]:hover{background:none}
.op[disabled] .pt{background:var(--ambar)}
.lista .fuera{border-top:1px solid var(--sand);margin-top:6px;padding:8px 8px 2px;font-size:12px;color:var(--t65)}

/* bloqueo «nadie de turno» */
.bloqueo{border:1px solid rgba(140,99,31,.35);background:rgba(140,99,31,.07);border-radius:12px;padding:14px;margin-bottom:12px;animation:entrada 300ms var(--ease) both}
.bloqueo p.t{font-weight:600;color:var(--ambar-p);display:flex;gap:8px;align-items:center}
.bloqueo p.x{font-size:13px;color:var(--t80);margin-top:6px}
.bloqueo ol{font-size:13px;color:var(--t80);margin:8px 0 0 18px}
.bloqueo .btn{margin-top:12px;height:36px;font-size:10.5px}

/* aviso de éxito (esquina superior derecha, como avisar.exito) */
.aviso{position:fixed;top:calc(var(--bar) + 16px);right:16px;z-index:90;display:flex;align-items:center;gap:10px;background:var(--tinta);color:var(--crema);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 18px 44px -14px rgb(26 26 24/.3);animation:subir 300ms var(--ease) both}
.aviso path{stroke-dasharray:24;stroke-dashoffset:24;animation:visto 400ms var(--ease) 150ms forwards}

/* ---------- 3. Caja ---------- */
.caja{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;margin-top:22px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--papel);border:1px solid var(--sand);border-left:3px solid var(--sand);border-radius:12px;padding:12px}
.kpi .n{font-family:'EB Garamond',serif;font-size:26px;margin-top:4px}
.movs{margin-top:16px;padding:6px 0}
.movs h3{font-family:'EB Garamond',serif;font-weight:400;font-size:22px;padding:12px 18px 2px}
.movs .s{font-size:13px;color:var(--t65);padding:0 18px 8px}
.mv{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--sand)}
.mv .ico{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;background:rgba(85,110,73,.13);color:var(--verde-p);flex:none}
.mv .ico.eg{background:rgba(184,65,45,.1);color:var(--rojo)}
.mv .v{flex:1;min-width:0;font-size:14px}
.mv .v small{display:block;font-size:12.5px;color:var(--t65)}
.mv .v small b{color:var(--tinta);font-weight:500}
.mv .m{font-weight:600;font-size:14px;color:var(--verde-p)}
.mv .m.eg{color:var(--rojo)}
.modal{background:var(--papel);border:1px solid var(--sand);border-radius:22px;padding:24px;box-shadow:0 18px 44px -14px rgb(26 26 24/.16)}
.modal h2{font-family:'EB Garamond',serif;font-weight:400;font-size:30px}
.modal .s{color:var(--t65);font-size:14px;margin-top:4px}
.campo{margin-top:18px}
.campo .lbl{display:block;margin-bottom:6px}
.campo input{width:100%;height:48px;border-radius:8px;border:1px solid var(--sand);background:var(--crema);padding:0 14px;font-size:16px}
.modal .acc2{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.res .fila{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--sand);font-size:14px}
.res .fila:first-of-type{border-top:0}

@media (max-width:1100px){
  .rgrid{grid-template-columns:1fr}
  .pdv .body{grid-template-columns:1fr;height:auto}
  .cat{border-right:0;border-bottom:1px solid var(--sand)}
  .caja{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  main{padding:calc(var(--bar) + 20px) 16px 60px}
  .prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pdv .top .lks{display:none}
}
</style>
</head>
<body>

<div class="spk" role="toolbar" aria-label="Controles del spike">
  <span class="tag">Spike · ADR-0161</span>
  <label>Pantalla
    <select id="sel-pant">
      <option value="roles">1 · Roles y accesos</option>
      <option value="pdv">2 · Punto de venta</option>
      <option value="caja">3 · Cierre de caja</option>
      <option value="nadie">4 · Nadie de turno</option>
    </select>
  </label>
  <span class="sep"></span>
  <label>Cuenta
    <select id="sel-cuenta">
      <option value="tv">Terminal Ventas TRU</option>
      <option value="ta">Terminal Administrativa TRU</option>
      <option value="felipe">Felipe (líder, cuenta personal)</option>
    </select>
  </label>
  <span class="sep"></span>
  <label>Asistencia hoy en TRU
    <select id="sel-asis">
      <option value="normal">3 presentes · 1 en pausa · 1 salió</option>
      <option value="felipe">Felipe también marcó en TRU</option>
      <option value="vacia">Nadie marcó entrada</option>
    </select>
  </label>
</div>

<main id="app"></main>

<script>
/* ============================================================
   Datos inventados. Estados = los que ya devuelve
   retail.fn_asesoras_de_turno en producción:
   presente | en_pausa | salio | programada
   ============================================================ */
const ASISTENCIA = {
  normal: [
    { id: 'maria',  nombre: 'María P.',   rol: 'Integrante',        estado: 'presente', desde: 'Entrada 09:02' },
    { id: 'lucia',  nombre: 'Lucía R.',   rol: 'Integrante',        estado: 'presente', desde: 'Entrada 09:10' },
    { id: 'carmen', nombre: 'Carmen T.',  rol: 'Líder de equipo',   estado: 'presente', desde: 'Entrada 08:55' },
    { id: 'rosa',   nombre: 'Rosa M.',    rol: 'Integrante',        estado: 'en_pausa', desde: 'Salió a almorzar 13:05' },
    { id: 'diana',  nombre: 'Diana Q.',   rol: 'Integrante',        estado: 'salio',    desde: 'Salida 14:00' },
  ],
};
ASISTENCIA.felipe = [...ASISTENCIA.normal, { id: 'felipe', nombre: 'Felipe A.', rol: 'Líder de equipo', estado: 'presente', desde: 'Entrada 11:40' }];
ASISTENCIA.vacia = [];

const CUENTAS = {
  tv:     { nombre: 'Terminal Ventas TRU',         tipo: 'Terminal de ventas' },
  ta:     { nombre: 'Terminal Administrativa TRU', tipo: 'Terminal administrativa' },
  felipe: { nombre: 'Felipe A.',                   tipo: 'Líder de equipo' },
};

/* ---- Catálogo de módulos. Cada módulo dice qué significa en él crear / editar / eliminar
   (null = no aplica) y sus acciones propias. «Eliminar» en CAYLA nunca borra: archiva o anula.
   `solo` = decisión 4 del ADR-0150 (anular y series de SUNAT solo el líder) o administrar roles. ---- */
const MODULOS = [
  { g: 'Ventas', id: 'vender', n: 'Punto de venta', crear: 'Registrar una venta', editar: null, eliminar: 'Anular una venta',
    mas: [['desc', 'Aplicar descuento hasta su tope'], ['descsobre', 'Autorizar descuento sobre el tope'], ['espera', 'Dejar un ticket en espera'], ['manual', 'Cobrar un monto manual']] },

/* ¿Esta casilla es de las que nunca se delegan? */
function esSolo(m, clave) {
  if (m.soloTodo) return true;
  if (clave === 'eliminar' && m.eliminarSolo) return true;
  const x = m.mas.find(([id]) => id === clave);
  return !!(x && x[2]);
}

/* ¿Quiénes pueden firmar? Regla de ADR-0161: solo «presente» (marcó entrada y no salida)
   en la sede activa. En pausa se ve pero no se elige (pregunta abierta en el README). */
function deTurno() { return ASISTENCIA[est.asis]; }
function firmables() { return deTurno().filter((p) => p.estado === 'presente'); }

/* ================= El combo Responsable (se reusa en todas las pantallas) ================= */
function comboResponsable(abajo = false) {
  const lista = deTurno();
  if (firmables().length === 0) {
    return `<div class="bloqueo" role="alert">
      <p class="t">${ICO.reloj} Nadie de turno en Tienda TRU</p>
      <p class="x">Para guardar, quien atiende tiene que haber marcado su <b>entrada</b> hoy en esta tienda. Nadie lo ha hecho todavía${est.cuenta === 'felipe' ? ' — tampoco tú: la regla es la misma para los líderes' : ''}.</p>
      <ol><li>Marca tu entrada en el kiosco de asistencia de la tienda.</li><li>Vuelve aquí y toca «Actualizar lista».</li></ol>
      <button class="btn sec" data-a="actualizar">Actualizar lista</button>
    </div>`;
  }
  const el = est.elegido && lista.find((p) => p.id === est.elegido);
  const boton = el
    ? `<button class="rbtn puesto" data-a="abrir" aria-haspopup="listbox"><span class="av">${ini(el.nombre)}</span><span class="v">${el.nombre}<small>${el.rol} · ${el.desde}</small></span>${ICO.chev}</button>`
    : `<button class="rbtn vacio" data-a="abrir" aria-haspopup="listbox">${ICO.user}<span class="v">¿Quién hace esta operación?</span>${ICO.chev}</button>`;
  const opciones = lista.filter((p) => p.estado !== 'salio').map((p) => {
    const pausa = p.estado === 'en_pausa';
    return `<button class="op" role="option" data-a="elegir" data-id="${p.id}" ${pausa ? 'disabled' : ''}>
      <span class="av">${ini(p.nombre)}</span><span class="v">${p.nombre}<small>${pausa ? 'En pausa · ' : ''}${p.desde}</small></span><span class="pt"></span></button>`;
  }).join('');
  const salieron = lista.filter((p) => p.estado === 'salio').length;
  return `<div class="resp">
    <span class="lbl tp">Responsable <span class="req">*</span></span>
    ${boton}
    ${est.abierto ? `<div class="lista ${abajo ? 'abajo' : ''}" role="listbox">
      <p class="cab lbl tp">De turno ahora · Tienda TRU</p>${opciones}
      ${salieron ? `<p class="fuera">${salieron} persona${salieron > 1 ? 's' : ''} ya marcó su salida y no aparece.</p>` : ''}
    </div>` : ''}
    ${el ? '' : '<p class="pista">Obligatorio. Viene vacío en cada operación.</p>'}
  </div>`;
}

/* ================= 1. Roles y accesos ================= */
function tiene(rol, m, clave) {
  if (rol.fijo) return true;
  return !!(rol.perm[m.id] && rol.perm[m.id].has(clave));
}
function pantallaRoles() {
  const rol = ROLES.find((r) => r.id === est.rol);
  let grupo = '';
  const filas = MODULOS.map((m) => {
    const ve = tiene(rol, m, 'ver');
    const bloq = rol.fijo;
    let cab = '';
    if (m.g !== grupo) { grupo = m.g; cab = `<tr class="grupo"><td colspan="6">${grupo}</td></tr>`; }
    const celdas = VERBOS.map((v) => {
      if (!m[v]) return '<td><span class="na" title="No aplica en este módulo">—</span></td>';
      const solo = esSolo(m, v) && !rol.fijo;
      if (solo) return `<td><span class="na" title="${m[v]}: solo líder" aria-label="${m.n}: ${m[v]}, solo líder">${ICO.lock}</span></td>`;
      return `<td><input type="checkbox" title="${m[v]}${solo ? ' · solo líder' : ''}" aria-label="${m.n}: ${m[v]}"
        ${tiene(rol, m, v) ? 'checked' : ''} ${bloq || solo || !ve ? 'disabled' : ''} data-a="perm" data-m="${m.id}" data-k="${v}"></td>`;
    }).join('');
    const nMas = m.mas.filter(([id]) => tiene(rol, m, id)).length;
    const abierto = est.detalle === m.id;
    const det = abierto ? `<tr class="det"><td colspan="6">
      <p class="sig">En <b>${m.n}</b>: ${VERBOS.filter((v) => m[v]).map((v) => `<b>${v === 'crear' ? 'Crear' : v === 'editar' ? 'Editar' : 'Eliminar'}</b> = ${m[v].toLowerCase()}`).join(' · ') || 'solo se mira'}.${m.eliminar ? ' Eliminar nunca borra: queda archivado o anulado, con su historial.' : ''}</p>
      ${m.mas.length ? `<div class="col">${m.mas.map(([id, n]) => {
        const solo = esSolo(m, id) && !rol.fijo;
        return `<label class="ac ${solo ? 'solo' : ''}"><input type="checkbox" ${tiene(rol, m, id) ? 'checked' : ''} ${bloq || solo || !ve ? 'disabled' : ''}
          data-a="perm" data-m="${m.id}" data-k="${id}"><span style="flex:1">${n}</span>${solo ? `<span class="chip lock">${ICO.lock} Solo líder</span>` : ''}</label>`;
      }).join('')}</div>` : ''}
    </td></tr>` : '';
    return `${cab}<tr class="${ve ? '' : 'off'}">
      <td><span class="mn">${m.n}${m.soloTodo && !rol.fijo ? ` <span class="chip lock">${ICO.lock} Solo líder</span>` : ''}</span></td>
      <td><button class="sw" role="switch" aria-checked="${ve}" aria-label="Ver ${m.n}" data-a="ver" data-m="${m.id}" ${bloq || (m.soloTodo) ? 'disabled' : ''}></button></td>
      ${celdas}
      <td>${m.mas.length || m.eliminar || m.crear ? `<button class="mas" data-a="det" data-m="${m.id}" ${!ve && !rol.fijo ? 'disabled' : ''} aria-expanded="${abierto}">
        ${m.mas.length ? `<b>${nMas}/${m.mas.length}</b> acciones` : 'Detalle'} ${ICO.chev}</button>` : ''}</td>
    </tr>${det}`;
  }).join('');
  const menu = MODULOS.filter((m) => tiene(rol, m, 'ver'));
  return `<div class="pagina">
    <div class="nota"><b>Qué mirar:</b> una fila por módulo. <b>Ver</b> lo pone en el menú; <b>Crear, Editar y Eliminar</b> significan algo distinto en cada módulo
      (pasa el mouse o abre «acciones»); cada módulo tiene además sus <b>acciones propias</b>. «—» = no existe en ese módulo. Solo el <b>Líder</b> es fijo.
      «Solo líder» se reserva a administrar roles y a anular o configurar comprobantes de SUNAT (ADR-0150, decisión 4).</div>
    <p class="lbl tp">Colaboradores</p>
    <h1 class="t">Roles y accesos</h1>
    <p class="sub">Qué ve y qué puede hacer cada cuenta, módulo por módulo. Solo un líder de equipo cambia esto.</p>
    <div class="rgrid">
      <div>${ROLES.map((r) => `<button class="rol" aria-pressed="${r.id === est.rol}" data-a="rol" data-id="${r.id}">
          <span class="n">${r.n}</span><span class="d">${r.d} · ${r.cuentas.length} cuenta${r.cuentas.length === 1 ? '' : 's'}</span>
          ${r.fijo ? `<span class="chip lock">${ICO.lock} No se edita</span>` : ''}</button>`).join('')}
        <button class="btn sec" style="margin-top:10px;width:100%">+ Nuevo rol</button>
      </div>
      <div class="card" style="overflow:hidden">
        <div class="rcab"><div><h2>${rol.n}</h2><p class="s">${rol.fijo
          ? 'Ve y hace todo, siempre. No se edita para que nunca falte alguien que pueda administrar los accesos.'
          : rol.id === 'integ' ? 'Rol que recibe una persona nueva al darle acceso. Sus permisos se editan como los de cualquier rol; lo único que no se puede es archivarlo.'
          : 'Rol a medida. Se edita, se duplica y se archiva (nunca se borra).'}</p>
          <div class="cuentas">${rol.cuentas.map((c) => `<span class="chip"><span class="avm">${ini(c)}</span>${c}</span>`).join('') || '<span class="chip lock">Nadie tiene este rol</span>'}</div></div>
          ${rol.fijo ? '' : `<div class="der"><button class="btn sec" style="height:36px">Duplicar</button>${rol.id === 'integ' ? '' : '<button class="btn sec" style="height:36px">Archivar</button>'}</div>`}
        </div>
        <div style="overflow-x:auto"><table class="mx">
          <thead><tr><th>Módulo</th><th>Ver</th><th>Crear</th><th>Editar</th><th>Eliminar</th><th>Más</th></tr></thead>
          <tbody>${filas}</tbody></table></div>
        <p class="lbl tp" style="padding:16px 20px 0">Así queda su menú</p>
        <div class="menuprev">${menu.map((m) => `<span>${m.n}</span>`).join('') || '<span>Solo Inicio</span>'}</div>
      </div>
    </div>
  </div>`;
}

    <div class="caja">
      <div>
        <div class="kpis">${[['Apertura', 'S/ 200.00'], ['Ventas efectivo', 'S/ 1,012.00'], ['Ventas otro método', 'S/ 1,480.00'], ['Ingresos', 'S/ 50.00'], ['Egresos', 'S/ 12.00']]
          .map(([l, n]) => `<div class="kpi"><p class="lbl tp" style="font-size:10px">${l}</p><p class="n">${n}</p></div>`).join('')}</div>
        <div class="card movs"><h3>Movimientos recientes</h3><p class="s">Últimos registros de esta caja</p>
          ${movs.map(([t, n, h, q, m]) => `<div class="mv"><span class="ico ${t === 'eg' ? 'eg' : ''}">${t === 'eg' ? ICO.menos : ICO.mas}</span>
            <span class="v">${n}<small>${h} · <b>${q}</b></small></span><span class="m ${t === 'eg' ? 'eg' : ''}">${m}</span></div>`).join('')}
        </div>
      </div>
      ${modal}
    </div>
  </div>`;
}

/* ================= 4. Nadie de turno ================= */
const NOTA_NADIE = `<b>Qué mirar (asistencia forzada a «Nadie marcó»):</b> no hay combo que elegir: la operación se <b>bloquea</b>
  y la pantalla dice qué hacer. Vale igual para la terminal y para un líder con su cuenta personal, incluso trabajando desde casa.`;
function pantallaNadie() {
  const guardado = est.asis;
  est.asis = 'vacia';
  const html = pantallaPdv(NOTA_NADIE);
  est.asis = guardado;
  return html;
}

// La entrada se anima solo al cambiar de pantalla, no en cada clic (ADR-0136: nada decorativo).
let ultimaPantalla = null;
function pintar() {
  const p = { roles: pantallaRoles, pdv: pantallaPdv, caja: pantallaCaja, nadie: pantallaNadie }[est.pant];
  const nueva = ultimaPantalla !== est.pant;
  ultimaPantalla = est.pant;
  $('#app').innerHTML = p().replace('<div class="pagina">', `<div class="pagina${nueva ? ' entra' : ''}">`) + (est.aviso ? `<div class="aviso" role="status"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>${est.aviso}</div>` : '');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b) { if (est.abierto && !e.target.closest('.lista')) { est.abierto = false; pintar(); } return; }
  const a = b.dataset.a;
  if (a === 'abrir') est.abierto = !est.abierto;
  if (a === 'elegir') { est.elegido = b.dataset.id; est.abierto = false; }
  if (a === 'actualizar') { est.aviso = null; }
  if (a === 'cobrar') {
    const el = firmables().find((p) => p.id === est.elegido);
    est.aviso = `Venta registrada · atendió ${el.nombre}`;
    est.elegido = null; // vuelve vacío para la siguiente
    setTimeout(() => { est.aviso = null; pintar(); }, 2600);
  }
  if (a === 'cerrarcaja') est.cajaPaso = 'resultado';
  if (a === 'reiniciarcaja') { est.cajaPaso = 'contar'; est.elegido = null; }
  if (a === 'rol') est.rol = b.dataset.id;
  if (a === 'det') est.detalle = est.detalle === b.dataset.m ? null : b.dataset.m;
  if (a === 'ver' || a === 'perm') {
    const rol = ROLES.find((r) => r.id === est.rol);
    const m = b.dataset.m;
    const set = rol.perm[m] || (rol.perm[m] = new Set());
    if (a === 'ver') {
      // Apagar «Ver» apaga todo el módulo: no se puede editar lo que no se ve.
      if (set.has('ver')) set.clear(); else set.add('ver');
    } else {
      b.checked ? set.add(b.dataset.k) : set.delete(b.dataset.k);
    }
  }
  pintar();
});

for (const [id, k] of [['#sel-pant', 'pant'], ['#sel-cuenta', 'cuenta'], ['#sel-asis', 'asis']]) {
  $(id).addEventListener('change', (e) => {
    est[k] = e.target.value; est.abierto = false; est.elegido = null; est.aviso = null; est.cajaPaso = 'contar';
    
    pintar();
  });
}
pintar();
</script>
</body>
</html>
