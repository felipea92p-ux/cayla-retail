<title>Separaciones · Tienda TRU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=EB+Garamond:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Tokens copiados de apps/web/app/globals.css. El ERP es de un solo tema (crema): se pinta explícito. */
:root{
  --rojo:#b8412d;--rojo-p:#8b2a1f;--crema:#f5f0e8;--papel:#fbf6ec;--tinta:#1a1a18;--t60:#5b544c;--sand:#e8e0d0;
  --taupe:#a47865;--taupe-p:#805c4c;--verde:#556e49;--verde-p:#44583a;--ambar:#8c631f;--ambar-p:#734f15;
  --m-efectivo:#d19a12;--m-efectivo-t:#6b4a00;--m-tarjeta:#525a64;--m-yape:#6d3fa3;--m-plin:#1c6b56;--m-transferencia:#2f6aa3;
  --ease:cubic-bezier(.32,.72,.24,1);--ease-s:cubic-bezier(.4,0,1,1);
  --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;--serif:"EB Garamond",ui-serif,Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px;border-radius:6px}
.lbl{text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:11px}
.disp{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.card{background:var(--papel);border:1px solid var(--sand);border-radius:16px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:14px;height:14px}
.scroll{scrollbar-width:thin;scrollbar-color:var(--sand) transparent}

/* ---------- Armazón (lateral + cabecera), igual al ERP ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%;border-top:4px solid #3a2b22}
.lateral{border-right:1px solid var(--sand);display:flex;flex-direction:column;padding:22px 12px 0;position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:12px;padding:0 16px 22px}
.marca span{letter-spacing:.42em;font-weight:600;font-size:14px}
.nuevo{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--tinta);color:var(--crema);border-radius:8px;height:42px;margin-bottom:26px}
.menu{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.it{display:flex;align-items:center;gap:14px;height:46px;padding:0 16px;border-radius:10px;color:var(--tinta);font-size:15px;text-align:left;width:100%;position:relative}
.it:hover{background:rgba(232,224,208,.5)}
.it .fl{margin-left:auto;color:var(--t60)}
.it.hijo{padding-left:36px;height:44px}
.it.activo{background:#efe5d4}
.it.activo::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--rojo)}
.contador{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:#8c631f;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.contador.rojo{background:var(--rojo)}
.nuevo-tag{margin-left:8px;font-size:9px;letter-spacing:.12em;font-weight:600;color:var(--rojo);border:1px solid #e6c6bc;border-radius:999px;padding:1px 6px}
.lema{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--t60);padding:18px 16px}
.usuario{display:flex;align-items:center;gap:12px;border-top:1px solid var(--sand);padding:16px 16px 18px}
.avatar{width:36px;height:36px;border-radius:50%;background:#ece3d3;display:grid;place-items:center;font-family:var(--serif);font-size:14px;flex:none}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;height:66px;padding:0 32px;border-bottom:1px solid var(--sand)}
.sede{display:flex;align-items:center;gap:10px;border:1px solid var(--sand);border-radius:8px;height:36px;padding:0 12px;background:var(--papel)}
.reloj{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t60)}
.reloj button{border:1px dashed var(--sand);border-radius:999px;padding:3px 10px;font-size:11px}
.reloj button:hover{border-color:var(--taupe);color:var(--tinta)}
main{padding:34px 32px 40px;min-width:0}

/* ---------- Hoja de trabajo (misma forma que «Venta en tienda») ---------- */
.hoja{background:var(--papel);border:1px solid var(--sand);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding:0 24px;border-bottom:1px solid var(--sand)}
.subnav{display:flex;align-items:center;gap:22px}
.subnav button{height:64px;position:relative;color:var(--t60)}
.subnav button[aria-current="page"]{color:var(--tinta)}
.subnav button[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--tinta)}
.subnav .b{margin-left:6px;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:999px;background:var(--rojo);color:#fff;font-size:10px;letter-spacing:0;padding:0 5px}
.accion-contorno{border:1px solid rgba(26,26,24,.25);border-radius:8px;height:38px;padding:0 14px}
.accion-contorno:hover{border-color:var(--rojo);color:var(--rojo)}
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 420px;flex:1;min-height:0}
.izq{padding:18px 24px 24px;display:flex;flex-direction:column;gap:16px;min-width:0;border-right:1px solid var(--sand)}
.der{display:flex;flex-direction:column;min-height:0;background:var(--papel)}

.buscador{display:flex;gap:10px}
.campo-scan{flex:1;display:flex;align-items:center;gap:12px;border:1px solid var(--sand);border-radius:12px;height:56px;padding:0 16px;background:var(--papel);transition:border-color .2s var(--ease)}
.campo-scan:focus-within{border-color:var(--taupe)}
.campo-scan input{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-width:0}
.campo-scan input::placeholder{color:#9a928a}
.btn-lateral{border:1px solid var(--sand);border-radius:12px;height:56px;padding:0 16px;background:var(--papel)}
.btn-lateral:hover{border-color:var(--taupe)}
.aviso-linea{font-size:13px;min-height:20px}
.aviso-linea.err{color:var(--rojo-p)}
.aviso-linea.ok{color:var(--verde-p)}

/* Ficha de la prenda escaneada */
.ficha{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;border:1px solid var(--sand);border-radius:16px;padding:14px;background:var(--papel);animation:revelar .26s var(--ease) both}
.foto{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(180deg,#f3ede3,#ebe3d6);display:grid;place-items:center;max-width:100%;overflow:hidden}
.foto svg{width:78%;height:auto}
.ficha h3{font-weight:500;font-size:22px;margin:4px 0 2px}
.tallas{display:flex;gap:6px;margin:12px 0}
.talla{min-width:34px;height:34px;border:1px solid var(--sand);border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600}
.talla.sel{border-color:var(--tinta);background:var(--tinta);color:var(--crema)}
.talla.agot{color:#b9b0a5;text-decoration:line-through}
.fila-dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--sand);font-size:13px}
.fila-dato span:first-child{color:var(--t60)}
.recientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mini{border:1px solid var(--sand);border-radius:12px;padding:8px;display:flex;gap:10px;align-items:center;text-align:left;background:var(--papel)}
.mini:hover{border-color:var(--taupe)}
.mini .foto{width:44px;aspect-ratio:3/4;border-radius:8px;flex:none}
.vacio-scan{flex:1;min-height:280px;border:1px dashed var(--sand);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px}
.vacio-scan .disp{font-size:26px}
.pistola{width:64px;height:64px;border-radius:50%;background:#efe7d8;display:grid;place-items:center;margin:0 auto 14px}
.pistola svg{width:28px;height:28px}
.pie-izq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--t60);margin-top:auto}
.chip{border:1px dashed var(--sand);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11px;color:var(--t60)}
.chip:hover{border-color:var(--taupe);color:var(--tinta)}

/* Panel derecho */
.panel-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 18px;border-bottom:1px solid var(--sand);min-height:84px}
.panel-cab h2{display:flex;align-items:center;gap:10px;font-size:25px;line-height:1;margin:0}
.panel-cab h2 .ico{width:24px;height:24px;color:rgba(26,26,24,.7)}
.volver{height:32px;padding:0 8px;margin-left:-8px;border-radius:6px;color:rgba(26,26,24,.7)}
.volver:hover{background:rgba(232,224,208,.4);color:var(--tinta)}
.panel-scroll{flex:1;overflow-y:auto;min-height:160px}
.revela{animation:revelar .24s var(--ease) both}
@keyframes revelar{from{opacity:0;transform:translate3d(0,6px,0)}}
.linea{padding:16px 22px;border-bottom:1px solid var(--sand)}
.linea-top{display:flex;justify-content:space-between;gap:10px}
.linea-top b{font-weight:600;font-size:15px}
.quitar{display:flex;align-items:center;gap:4px;color:var(--rojo-p);font-size:10.5px}
.linea-grid{display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:end;margin-top:10px}
.mini-lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t60)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--sand);border-radius:8px;height:34px}
.stepper button{width:32px;height:32px;display:grid;place-items:center;color:var(--t60)}
.stepper span{min-width:22px;text-align:center;font-weight:600}
.pista{font-size:11px;color:var(--taupe-p);margin-top:8px}
.nota{padding:16px 22px}
.nota label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t60);margin-bottom:8px}
.nota input{width:100%;border:1px solid var(--sand);border-radius:10px;background:transparent;height:42px;padding:0 12px;outline:0}
.panel-pie{border-top:1px solid var(--sand);padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.resumen{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.resumen .desg{font-size:12.5px;color:var(--t60);display:grid;grid-template-columns:auto auto;gap:1px 14px}
.resumen .desg b{color:var(--tinta);font-weight:500}
.total{text-align:right}
.total .disp{font-size:44px;line-height:1}
.btn-negro{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tinta);color:var(--crema);border-radius:10px;height:56px;padding:0 20px;width:100%;transition:background .2s var(--ease)}
.btn-negro:hover:not(:disabled){background:var(--rojo)}
.btn-negro:disabled{background:#8a8780;cursor:not-allowed}
.btn-negro .disp{font-size:19px;letter-spacing:0;text-transform:none}
.motivo{text-align:center;font-size:12px;color:var(--t60);margin-top:-6px}

/* Formulario del paso (fieldsets como en el cobro real) */
.pasos{display:flex;gap:6px}
.pasos i{flex:1;height:4px;border-radius:4px;background:var(--sand);transition:background .5s}
.pasos i.hecho{background:var(--tinta)} .pasos i.toca{background:var(--rojo)}
.paso-txt{font-size:13px;color:var(--taupe-p);margin-top:8px}
.form{padding:18px 22px;display:flex;flex-direction:column;gap:22px}
.leyenda{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(26,26,24,.55);margin-bottom:10px}
.pastilla{font-size:10.5px;color:var(--rojo-p);background:#f6e3dc;border-radius:999px;padding:1px 8px}
.falta{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rojo);color:var(--rojo);display:grid;place-items:center;font-size:10px;font-weight:700}
.linea-campo{display:flex;flex-direction:column;gap:2px}
.linea-campo span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:rgba(26,26,24,.7)}
.linea-campo input{border:0;border-bottom:1px solid rgba(26,26,24,.2);background:transparent;padding:8px 2px;outline:0;font-size:14px;border-radius:0}
.linea-campo input:focus{border-bottom-color:var(--rojo)}
.linea-campo input.mono{font-family:var(--mono);letter-spacing:.06em}
.linea-campo em{font-style:normal;font-size:11.5px;color:var(--rojo-p);min-height:0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;gap:4px;background:rgba(232,224,208,.5);border-radius:12px;padding:4px}
.seg button{height:38px;border-radius:9px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:rgba(26,26,24,.6);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--papel);color:var(--tinta);box-shadow:0 1px 2px rgba(26,26,24,.08)}
.personas{display:flex;flex-wrap:wrap;gap:8px}
.persona{display:flex;align-items:center;gap:8px;border:1px solid var(--sand);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;transition:border-color .2s}
.persona .avatar{width:28px;height:28px;font-size:12px}
.persona[aria-pressed="true"]{border-color:var(--tinta);background:var(--tinta);color:var(--crema)}
.persona[aria-pressed="true"] .avatar{background:#3a3934;color:var(--crema)}
.persona .turno{width:6px;height:6px;border-radius:50%;background:var(--verde)}
.medios{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(232,224,208,.5);border-radius:12px;padding:4px}
.medio{position:relative;height:56px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:rgba(26,26,24,.6);transition:background .2s}
.medio:hover{background:rgba(251,246,236,.6)}
.medio .k{position:absolute;top:3px;right:5px;font-size:8px;font-weight:600;opacity:.45}
.medio[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--papel));color:var(--cd);box-shadow:0 1px 2px rgba(26,26,24,.08);animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.04)}}
.pagos{border:1px solid var(--sand);border-radius:10px;background:var(--crema);margin-top:8px}
.pago{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--sand)}
.pago:first-child{border-top:0}
.pago .nombre{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cd)}
.monto{display:flex;align-items:center;gap:4px;justify-self:end;border-bottom:1px solid rgba(26,26,24,.2)}
.monto input{width:84px;border:0;background:transparent;text-align:right;outline:0;padding:4px 0;font-variant-numeric:tabular-nums}
.basura{color:var(--rojo-p);padding:4px}
.atajos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.atajo{border:1px solid var(--sand);border-radius:999px;padding:4px 11px;font-size:12px;font-variant-numeric:tabular-nums}
.atajo:hover{border-color:var(--taupe)}
.barra{height:6px;background:var(--sand);border-radius:6px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--tinta);border-radius:6px;transition:width .45s var(--ease)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:rgba(26,26,24,.85)}
.check input{margin-top:3px;accent-color:var(--tinta)}
.vuelto{display:flex;justify-content:space-between;align-items:baseline;border:1px solid rgba(26,26,24,.15);border-radius:12px;padding:10px 14px;background:var(--papel)}
.vuelto .disp{font-size:28px}

/* ---------- Bandeja ---------- */
.bandeja{padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--sand);border-radius:16px;overflow:hidden}
.kpi{padding:16px 18px;border-left:1px solid var(--sand);display:flex;flex-direction:column;gap:2px}
.kpi:first-child{border-left:0}
.kpi .disp{font-size:32px;line-height:1.1}
.kpi small{font-size:12px;color:var(--t60)}
.kpi.custodia{background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(232,224,208,.35) 9px 10px)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtro{border:1px solid var(--sand);border-radius:8px;height:34px;padding:0 13px;color:rgba(26,26,24,.7)}
.filtro[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
.filtros .campo-scan{height:40px;max-width:360px;margin-left:auto;border-radius:10px}
.filtros .campo-scan input{font-size:13.5px}
.grupo h4{margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.grupo h4 .n{font-family:var(--sans);font-size:11px;color:var(--t60)}
.lista{border:1px solid var(--sand);border-radius:16px;overflow:hidden}
.fila{display:grid;grid-template-columns:minmax(200px,1.3fr) minmax(150px,1fr) 150px 170px auto;gap:18px;align-items:center;padding:14px 18px;border-top:1px solid var(--sand);animation:revelar .3s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.fila:first-child{border-top:0}
.fila:hover{background:rgba(245,240,232,.6)}
.quien{display:flex;align-items:center;gap:12px;min-width:0}
.quien b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien small{color:var(--t60);font-size:12px}
.pilas{display:flex;align-items:center;gap:8px;min-width:0}
.pilas .foto{width:34px;aspect-ratio:3/4;border-radius:6px;flex:none;border:1px solid var(--papel)}
.pilas .foto+.foto{margin-left:-14px}
.pilas span{font-size:12.5px;color:var(--t60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plata b{font-weight:600}
.plata small{display:block;color:var(--t60);font-size:12px}
.plazo{display:flex;flex-direction:column;gap:5px}
.dias{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.dias i{height:6px;border-radius:2px;background:var(--sand)}
.dias i.p{background:#cfc3ad} .dias i.h{background:var(--tinta)} .dias i.g{background:#e8c7bc} .dias i.gv{background:var(--rojo)}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.estado::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.e-vigente{color:var(--verde-p)} .e-porvencer{color:var(--ambar-p)} .e-vencida{color:var(--rojo-p)} .e-devolver{color:var(--rojo-p)} .e-cerrada{color:var(--t60)}
.e-vencida::before{animation:late 1.6s infinite}
@keyframes late{50%{opacity:.3}}
.acciones{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.b-chico{height:32px;padding:0 12px;border-radius:7px;border:1px solid rgba(26,26,24,.25);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.b-chico:hover{border-color:var(--rojo);color:var(--rojo)}
.b-chico.negro{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.b-chico.negro:hover{background:var(--rojo);border-color:var(--rojo);color:var(--crema)}
.b-chico:disabled{opacity:.4;cursor:not-allowed}
.vacio-lista{padding:28px;text-align:center;color:var(--t60)}

/* ---------- Entregar ---------- */
.resultados{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--sand);border-radius:14px;padding:12px 14px;text-align:left;background:var(--papel);animation:revelar .26s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.res:hover{border-color:var(--taupe)}
.expediente{border:1px solid var(--sand);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:revelar .26s var(--ease) both}
.exp-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.exp-cab .avatar{width:48px;height:48px;font-size:18px}
.linea-tiempo{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;padding-top:18px}
.linea-tiempo::before{content:"";position:absolute;top:5px;left:8px;right:8px;height:2px;background:var(--sand)}
.linea-tiempo .avance{position:absolute;top:5px;left:8px;height:2px;background:var(--tinta);transition:width .5s var(--ease)}
.hito{position:relative;font-size:12px;color:var(--t60)}
.hito::before{content:"";position:absolute;top:-17px;left:0;width:10px;height:10px;border-radius:50%;background:var(--papel);border:2px solid var(--tinta)}
.hito:nth-child(3){text-align:center} .hito:nth-child(3)::before{left:calc(50% - 5px);background:var(--tinta)}
.hito:nth-child(4){text-align:right} .hito:nth-child(4)::before{left:auto;right:0;border-color:var(--rojo)}
.hito b{display:block;color:var(--tinta);font-weight:600}
.prenda-fila{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--sand)}
.prenda-fila .foto{width:46px;aspect-ratio:3/4;border-radius:8px;flex:none}
.prenda-fila .d{flex:1;min-width:0}
.verifica{display:flex;gap:10px;align-items:flex-start;background:var(--crema);border:1px solid var(--sand);border-radius:12px;padding:10px 12px;font-size:12.5px;color:rgba(26,26,24,.8)}
.billetes{display:flex;flex-wrap:wrap;gap:6px}
.billete{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--sand);background:var(--papel);font-variant-numeric:tabular-nums;font-size:13px}
.billete:hover{border-color:var(--m-efectivo)}

/* ---------- Modal (ADR-0136: velo con desenfoque, hoja que sube 18 px y crece, cascada de 55 ms) ---------- */
.velo{position:fixed;inset:0;background:rgba(26,26,24,.35);backdrop-filter:blur(2px);z-index:40;animation:velo .22s var(--ease) both}
.velo.sale{animation:velo-sale .22s var(--ease-s) both}
@keyframes velo{from{opacity:0}} @keyframes velo-sale{to{opacity:0}}
.hoja-modal-caja{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.hoja-modal{pointer-events:auto;position:relative;width:100%;max-width:448px;max-height:90vh;overflow-y:auto;background:var(--crema);border:1px solid var(--sand);border-radius:18px;padding:24px;box-shadow:0 24px 60px rgba(26,26,24,.18);animation:hoja .42s var(--ease) both}
.hoja-modal.ancha{max-width:560px}
.hoja-modal.sale{animation:hoja-sale .22s var(--ease-s) both}
@keyframes hoja{from{opacity:0;transform:translate3d(0,18px,0) scale(.965)}}
@keyframes hoja-sale{to{opacity:0;transform:translate3d(0,14px,0) scale(.985)}}
.hoja-modal>*{animation:cascada .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*55ms + 120ms)}
@keyframes cascada{from{opacity:0;transform:translate3d(0,10px,0)}}
.hoja-modal h2{font-size:19px;margin:0}
.hoja-modal .sub{font-size:12px;color:rgba(26,26,24,.7);margin:3px 0 0}
.cerrar-x{position:absolute;right:14px;top:14px;border-radius:50%;padding:6px;color:rgba(26,26,24,.55)}
.cerrar-x:hover{color:var(--rojo);background:rgba(26,26,24,.04)}
.pila{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.listo{text-align:center;padding:20px}
.listo .disp{font-size:32px;margin-top:6px}
.plazo-card{padding:16px 18px;display:flex;align-items:center;gap:16px}
.cal{width:58px;border-radius:10px;overflow:hidden;border:1px solid var(--sand);text-align:center;flex:none;background:var(--papel)}
.cal b{display:block;background:var(--rojo);color:#fff;font-size:10px;letter-spacing:.14em;padding:3px 0;font-weight:600}
.cal span{display:block;font-family:var(--serif);font-size:28px;line-height:1.2}
.cal small{display:block;font-size:10px;color:var(--t60);padding-bottom:4px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.semana i{height:5px;border-radius:3px;background:var(--sand)}
.semana i.hoy{background:var(--tinta)}
.semana i.fin{background:var(--rojo)}
.comp{padding:14px 16px;font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.comp .r{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:rgba(26,26,24,.75)}
.comp .sep{border-top:1px solid var(--sand);padding-top:10px;display:flex;flex-direction:column;gap:3px}
details.ver{border:1px solid var(--sand);border-radius:12px;font-size:12.5px}
details.ver summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;justify-content:space-between;color:rgba(26,26,24,.8)}
details.ver summary::-webkit-details-marker{display:none}
details.ver[open] summary span:last-child{transform:rotate(180deg)}
details.ver .dentro{border-top:1px solid var(--sand);padding:14px;display:grid;place-items:center;background:#efe8dc;border-radius:0 0 12px 12px}
.pasos-fisicos{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pasos-fisicos label{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.pasos-fisicos input{margin-top:3px;accent-color:var(--tinta)}
.pasos-fisicos label.hecho span{color:var(--t60);text-decoration:line-through}
.botones{display:flex;flex-direction:column;gap:8px}
.dos-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bp{height:44px;border-radius:7px;background:var(--tinta);color:var(--crema);display:flex;align-items:center;justify-content:center;gap:8px}
.bp:hover{background:var(--rojo)}
.bc{height:44px;border-radius:7px;border:1px solid rgba(26,26,24,.25)}
.bc:hover{border-color:var(--rojo);color:var(--rojo)}
.pie-modal{text-align:center;font-size:11px;color:rgba(26,26,24,.55)}
.nota-suave{text-align:center;font-size:12px;color:rgba(26,26,24,.65)}

/* Ticket térmico 80 mm */
.ticket{width:280px;max-width:100%;background:#fff;color:#111;font-family:var(--mono);font-size:10.5px;line-height:1.5;padding:16px 14px;box-shadow:0 1px 0 var(--sand),0 8px 24px rgba(26,26,24,.08)}
.ticket .c{text-align:center}.ticket .b{font-weight:600}
.ticket hr{border:0;border-top:1px dashed #999;margin:7px 0}
.ticket .r{display:flex;justify-content:space-between;gap:8px}
.ticket .sello{border:1.5px solid #111;text-align:center;padding:4px;margin:6px 0;font-weight:600;letter-spacing:.08em}
.ticket .tyc{font-size:9px;line-height:1.4}
.ticket .qr{width:58px;height:58px;margin:6px auto;background:repeating-linear-gradient(90deg,#111 0 4px,transparent 4px 7px),repeating-linear-gradient(0deg,#111 0 3px,transparent 3px 6px)}

/* Avisos (esquina superior derecha) */
.avisos{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--papel);border:1px solid var(--sand);border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px rgba(26,26,24,.12);max-width:360px;animation:aviso .38s var(--ease) both}
.aviso.sale{animation:aviso-sale .22s var(--ease-s) both}
@keyframes aviso{from{opacity:0;transform:translate3d(0,-8px,0)}} @keyframes aviso-sale{to{opacity:0;transform:translate3d(0,-6px,0)}}
.visto{width:28px;height:28px;border-radius:50%;background:#ece7dc;display:grid;place-items:center;flex:none}
.visto path{stroke-dasharray:14;animation:trazo .52s var(--ease) .12s backwards}
@keyframes trazo{from{stroke-dashoffset:14}}
.aviso b{font-weight:600;display:block}
.aviso small{color:var(--t60);font-size:12px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;animation-iteration-count:1!important}}
@media (max-width:1180px){.cuerpo{grid-template-columns:minmax(0,1fr) 380px}.fila{grid-template-columns:minmax(180px,1.3fr) minmax(120px,1fr) 130px auto}.fila .plazo{display:none}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}.lateral{display:none}
  .cab{padding:0 16px}main{padding:16px}
  .cuerpo{grid-template-columns:1fr}.izq{border-right:0;border-bottom:1px solid var(--sand)}
  .kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--sand)}
  .fila{grid-template-columns:1fr auto}.fila .pilas,.fila .plata{display:none}
  .ficha{grid-template-columns:1fr}.ficha .foto{max-width:220px}
  .hoja-cab{height:auto;flex-wrap:wrap;padding:12px 16px}.subnav button{height:44px}
}
@media (max-width:520px){.buscador{flex-direction:column}.btn-lateral{height:44px}.dos{grid-template-columns:1fr}.reloj span{display:none}.medio{font-size:9px}.filtros .campo-scan{max-width:none;margin-left:0;width:100%}}

<script>
(() => {
  // ================= Reglas (irán a lib/separaciones-reglas.ts) =================
  // Decisiones de Felipe (2026-09-22): boleta de anticipo, monto libre, 100% devuelto por Yape/Plin/transferencia, una extensión.
  const PLAZO = 7, AVISO = 2, GRACIA = 2, EXT_MAX = 1, DIA = 864e5;
  const MEDIOS = [
    { id:'efectivo', nom:'Efectivo', ico:'i-cash', c:'var(--m-efectivo)', cd:'var(--m-efectivo-t)' },
    { id:'tarjeta', nom:'Tarjeta', ico:'i-card', c:'var(--m-tarjeta)', cd:'var(--m-tarjeta)' },
    { id:'yape', nom:'Yape', ico:'i-yape', c:'var(--m-yape)', cd:'var(--m-yape)' },
    { id:'plin', nom:'Plin', ico:'i-plin', c:'var(--m-plin)', cd:'var(--m-plin)' },
    { id:'transferencia', nom:'Transferencia', ico:'i-bank', c:'var(--m-transferencia)', cd:'var(--m-transferencia)' },
  ];
  const medio = id => MEDIOS.find(m => m.id === id);
  // En el ERP: fn_asesoras_de_turno(ubicacion) — quienes marcaron asistencia hoy en la tienda.
  const DE_TURNO = [ { n:'Camila Rojas', i:'CR' }, { n:'Lucía Paredes', i:'LP' }, { n:'Andrea Vásquez', i:'AV' }, { n:'Felipe Alvarez', i:'FA' } ];

  const S_ = n => 'S/' + (Math.round(n * 100) / 100).toFixed(2);
  const f = (d, o) => new Date(d).toLocaleDateString('es-PE', { timeZone:'UTC', ...o });
  const fLarga = d => f(d, { weekday:'short', day:'numeric', month:'short' }).replace('.', '');
  const fNum = d => f(d, { day:'2-digit', month:'2-digit', year:'numeric' });
  const dia = s => Date.parse(s + 'T00:00:00Z');
  const entre = (a, b) => Math.round((b - a) / DIA);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const ini = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  const igv = t => ({ base: t / 1.18, igv: t - t / 1.18 });
  const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const ico = (id, cls = 'ico') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

  function estadoDe(s, hoy) {

        ${intento && Object.keys(e).length ? `<div class="motivo" style="color:var(--rojo-p)">${Object.values(e)[0]}</div>` : `<div class="motivo">${TXT_PASO[actual]}</div>`}

  function agregar(cod, msgOk = true) {
    const p = P(cod), ya = sep.lin.find(l => l.cod === cod), enT = ya ? ya.n : 0;
    ultimo = cod;
    if (!S.recientes.includes(cod)) S.recientes = [cod, ...S.recientes].slice(0, 4);
    if (disp(cod) - enT <= 0) {
      const sp = separado(cod);
      pintar();
      msg('err', `${p.nom} ${p.col} ${p.t}: ${sp ? `las que hay están separadas para otra clienta (${sp}).` : 'agotada en Tienda TRU.'}`);
      return;
    }
    if (ya) ya.n++; else sep.lin.push({ cod, n:1 });
    paso = 'ticket'; pintar();
    if (msgOk) msg('ok', `Agregada: ${p.nom} ${p.col} · ${p.t}`);
  }
  function msg(k, t) { const m = document.getElementById('scanMsg'); if (m) { m.className = 'aviso-linea ' + k; m.textContent = t; } }
  function buscarPrenda(t) {
    t = t.trim(); if (!t) return;
    const ex = CAT.find(p => p.cod.toLowerCase() === t.toLowerCase());
    if (ex) return agregar(ex.cod);
    const hits = CAT.filter(p => (p.nom + ' ' + p.col + ' ' + p.cod).toLowerCase().includes(t.toLowerCase()));
    if (!hits.length) return msg('err', `Ninguna prenda de Tienda TRU coincide con «${t}». Revisa el código de la etiqueta.`);
    if (hits.length === 1) return agregar(hits[0].cod);
    ultimo = hits[0].cod; pintar();
    msg('', `${hits.length} coinciden con «${t}»: elige la talla en la ficha o escanea la etiqueta.`);
  }

  function bindSeparar(raiz) {
    const $ = s => raiz.querySelector(s), $$ = s => raiz.querySelectorAll(s);
    $('#fScan').addEventListener('submit', e => { e.preventDefault(); const i = $('#scan'); buscarPrenda(i.value); i.value = ''; });
    $('#aEntregar').addEventListener('click', () => irA('entregar'));
    $$('[data-add]').forEach(b => b.addEventListener('click', () => agregar(b.dataset.add)));
    $$('[data-probar]').forEach(b => b.addEventListener('click', () => buscarPrenda(b.dataset.probar)));
    $$('[data-quitar]').forEach(b => b.addEventListener('click', () => { sep.lin.splice(+b.dataset.quitar, 1); pintar(); }));
    $$('[data-menos]').forEach(b => b.addEventListener('click', () => { const l = sep.lin[+b.dataset.menos]; if (--l.n <= 0) sep.lin.splice(+b.dataset.menos, 1); pintar(); }));
    $$('[data-mas]').forEach(b => b.addEventListener('click', () => agregar(sep.lin[+b.dataset.mas].cod, false)));
    $('#nota')?.addEventListener('input', e => sep.nota = e.target.value);
    $('#aSeparar')?.addEventListener('click', () => { paso = 'form'; pintar(); raiz.querySelector('#c_nombres')?.focus(); });
    $('#aTicket')?.addEventListener('click', () => { paso = 'ticket'; pintar(); });
    const campo = (id, obj, k) => { const i = $(id); if (!i) return; i.addEventListener('input', () => { obj[k] = i.value; actualizarEnVivo(i); }); };
    campo('#c_nombres', sep.cl, 'nombres'); campo('#c_apellidos', sep.cl, 'apellidos'); campo('#c_cel', sep.cl, 'cel'); campo('#c_dni', sep.cl, 'dni');
    campo('#c_ruc', sep, 'ruc'); campo('#c_razon', sep, 'razon'); campo('#d_cci', sep.dev, 'cci'); campo('#d_num', sep.dev, 'num');
    $$('[data-comp]').forEach(b => b.addEventListener('click', () => { sep.comprobante = b.dataset.comp; refrescarForm(); }));
    $$('[data-at]').forEach(b => b.addEventListener('click', () => { sep.at = b.dataset.at; refrescarForm(); }));
    $$('[data-dev]').forEach(b => b.addEventListener('click', () => { sep.dev.m = b.dataset.dev; refrescarForm(); }));
    $$('[data-medio]').forEach(b => b.addEventListener('click', () => {
      const i = sep.pagos.findIndex(p => p.m === b.dataset.medio);
      if (i >= 0) sep.pagos.splice(i, 1); else sep.pagos.push({ m:b.dataset.medio, v: sep.pagos.length ? Math.max(0, totalSep() - pagado()) : Math.ceil(totalSep() / 2) });
      refrescarForm();
    }));
    $$('[data-v]').forEach(i => i.addEventListener('change', () => { sep.pagos[+i.dataset.v].v = Number(i.value.replace(',', '.')) || 0; refrescarForm(); }));
    $$('[data-q]').forEach(b => b.addEventListener('click', () => { sep.pagos.splice(+b.dataset.q, 1); refrescarForm(); }));
    $$('[data-atajo]').forEach(b => b.addEventListener('click', () => {
      const k = +b.dataset.atajo, v = k === 1 ? totalSep() : Math.ceil(totalSep() * k);
      if (!sep.pagos.length) sep.pagos.push({ m:'yape', v }); else { sep.pagos.length = 1; sep.pagos[0].v = v; }
      refrescarForm();
    }));
    $('#acepta')?.addEventListener('change', e => { sep.acepta = e.target.checked; refrescarForm(); });
    $('#aConfirmar')?.addEventListener('click', confirmar);
  }
  // Escribir en un campo no redibuja el panel (perdería el foco): solo mueve la barra de pasos y
  // borra el error de ese campo cuando ya quedó bien.
  function actualizarEnVivo(input) {
    const der = document.querySelector('.der'); if (!der) return;
    const e = faltas(), actual = pasoActual(e);
    der.querySelectorAll('.pasos i').forEach((x, i) => x.className = i < actual ? 'hecho' : i === actual ? 'toca' : '');
    const t = der.querySelector('.paso-txt'); if (t) t.textContent = TXT_PASO[actual];
    const clave = { c_nombres:'nombres', c_apellidos:'apellidos', c_cel:'cel', c_dni:'dni', c_ruc:'ruc', d_cci:'dev', d_num:'dev' }[input.id];
    const em = input.parentElement.querySelector('em');
    if (em && clave && !e[clave]) em.remove();
  }
  // Repinta solo el panel derecho conservando el scroll (el formulario no «salta»).
  function refrescarForm(focoId) {
    const der = document.querySelector('.der'), sc = der.querySelector('.panel-scroll')?.scrollTop || 0;
    der.innerHTML = panelSeparar();
    der.querySelectorAll('.revela').forEach(x => x.style.animation = 'none');
    der.querySelector('.panel-scroll').scrollTop = sc;
    bindSeparar(document.getElementById('vista'));
  }
  function confirmar() {
    intento = true;
    const e = faltas();
    if (Object.keys(e).length) { refrescarForm(); const primero = document.querySelector('.der em'); primero?.closest('fieldset,label')?.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
    const t = totalSep(), adel = Math.min(pagado(), t);
    const s = { id:'SEP-TRU-' + String(S.corrSep++).padStart(4, '0'), cl:{ ...sep.cl }, at:sep.at, lin:sep.lin.map(l => ({ ...l })), total:t, adel,
      medios:sep.pagos.map(p => ({ ...p })), creada:S.hoy, vence:S.hoy + PLAZO * DIA, estado:'abierta', ext:0,
      comp:(sep.comprobante === 'factura' ? 'F004-' : 'B004-') + String(S.corrB++).padStart(6, '0'), dev:{ m:sep.dev.m, num:sep.dev.num || sep.cl.cel, cci:sep.dev.cci } };
    const vuelto = Math.max(0, pagado() - t);
    S.seps.unshift(s);
    sep = nuevaSep(); paso = 'ticket'; intento = false; ultimo = null;
    pintar();
    modalSeparada(s, vuelto);
  }
  function modalSeparada(s, vuelto) {

      ${vuelto > 0 ? `<div class="vuelto"><span class="lbl" style="color:rgba(26,26,24,.7)">Entregar vuelto</span><span class="disp num">${S_(vuelto)}</span></div>` : ''}

        <div style="flex:1"><div class="lbl" style="color:var(--t60)">Recoger hasta</div><div style="font-size:14px;margin-top:2px">${fLarga(s.vence)} · 7 días</div><div class="semana">${semana}</div><div style="font-size:11.5px;color:var(--t60);margin-top:6px">Te avisaremos el ${fLarga(s.vence - AVISO * DIA)} para escribirle.</div></div></div>

        <div class="sep"><div class="r num"><span>Op. gravada</span><span>${S_(igv(s.adel).base)}</span></div><div class="r num"><span>IGV (18%)</span><span>${S_(igv(s.adel).igv)}</span></div></div>
        <div class="sep">${s.medios.map(p => `<div class="r num"><span>${medio(p.m).nom}</span><span>${S_(Math.min(p.v, s.total))}</span></div>`).join('')}</div>

        ${['Pega la etiqueta «SEPARADO · ' + s.id + '» (sale con la boleta).', 'Guárdala en «Separados» del almacén, no en el piso.', 'Envía la boleta por WhatsApp al ' + s.cl.cel + '.'].map(t => `<label><input type="checkbox"><span>${esc(t)}</span></label>`).join('')}</div>
      <div class="botones"><button type="button" class="bp lbl" data-cerrar autofocus>${ico('i-printer', 'ico s')}Imprimir y nueva separación</button><div class="dos-b"><button type="button" class="bc lbl">Solo imprimir</button><button type="button" class="bc lbl" data-cerrar>Sin imprimir</button></div>
      <div class="pie-modal">Enter imprime y abre una separación nueva · Esc sigue sin imprimir</div></div>`,
      alAbrir: h => h.querySelectorAll('.pasos-fisicos input').forEach(c => c.addEventListener('change', () => c.closest('label').classList.toggle('hecho', c.checked))) });

  // ================= Vista: ENTREGAR =================
  function coincide(s, t) {
    if (!t) return true;
    t = t.toLowerCase().replace(/\s/g, '');
    return [s.id, s.comp, s.compFinal, s.cl.nombres + s.cl.apellidos, s.cl.dni, s.cl.cel].some(v => (v || '').toLowerCase().replace(/\s/g, '').includes(t));
  }
  function vistaEntregar() {
    const s = entregaSel && porId(entregaSel);

      <form class="buscador" id="fEnt" autocomplete="off"><label class="campo-scan">${ico('i-search')}<input id="qEnt" placeholder="Nombre, DNI, celular o N.º de boleta (B004-…) de la clienta" value="${esc(qEnt)}" aria-label="Buscar separación"></label></form>

  }
  function listaEntregables() {
    const hits = abiertas().filter(s => coincide(s, qEnt)).sort((a, b) => a.vence - b.vence);
    return `<div class="lbl" style="color:var(--t60)">${qEnt ? 'Coinciden' : 'Por recoger en Tienda TRU'} · ${hits.length}</div>
      <div class="resultados">${hits.map((s, i) => { const e = estadoDe(s, S.hoy); return `<button type="button" class="res" style="--i:${i}" data-elegir="${s.id}"><span class="avatar">${ini(s.cl.nombres + ' ' + s.cl.apellidos)}</span>
        <span style="min-width:0"><b style="font-weight:600">${esc(s.cl.nombres + ' ' + s.cl.apellidos)}</b> <span class="mono" style="font-size:11px;color:var(--t60)">${s.id}</span><br><span style="font-size:12.5px;color:var(--t60)">${s.lin.map(l => P(l.cod).nom + ' ' + P(l.cod).col + ' ' + P(l.cod).t).join(' · ')}</span></span>
        <span style="text-align:right"><span class="estado e-${e.k}">${e.t}</span><br><span class="num" style="font-size:13px">saldo <b>${S_(s.total - s.adel)}</b></span></span></button>`; }).join('')
        || `<div class="vacio-scan" style="min-height:180px"><div><div class="disp" style="font-size:20px">Nadie con «${esc(qEnt)}»</div><p style="color:var(--t60);margin:6px 0 0;font-size:13px">Si ya venció y se liberó, está en «Todas».</p></div></div>`}</div>`;
  }
  function expediente(s) {
    const e = estadoDe(s, S.hoy), total = entre(s.creada, s.vence), pas = Math.max(0, Math.min(total, entre(s.creada, S.hoy)));
    return `<div class="expediente"><div class="exp-cab"><div style="display:flex;gap:14px;align-items:center"><span class="avatar">${ini(s.cl.nombres + ' ' + s.cl.apellidos)}</span>

      <div style="text-align:right"><span class="estado e-${e.k}">${e.t}</span><div class="mono" style="font-size:11px;color:var(--t60);margin-top:4px">${s.id} · ${s.comp}</div><button type="button" class="volver lbl" id="otra" style="margin:6px -8px 0 0">Otra clienta</button></div></div>

    const ab = abiertas(), ef = ab.reduce((a, s) => a + s.medios.filter(p => p.m === 'efectivo').reduce((x, p) => x + Math.min(p.v, s.total), 0), 0);
    modal({ titulo:'Separaciones en la caja de hoy', sub:'Tienda TRU · así lo verá el cierre', ancha:true, cuerpo:`
      <div class="kpis" style="grid-template-columns:1fr 1fr 1fr"><div class="kpi"><span class="lbl" style="color:var(--t60)">Ventas</span><span class="disp num" style="font-size:26px">${S_(S.seps.filter(s => s.estado === 'entregada').reduce((a, s) => a + s.total, 0))}</span><small>separaciones entregadas</small></div>
      <div class="kpi custodia"><span class="lbl" style="color:var(--t60)">En custodia</span><span class="disp num" style="font-size:26px">${S_(ab.reduce((a, s) => a + s.adel, 0))}</span><small>de ellos ${S_(ef)} en el cajón</small></div>
      <div class="kpi"><span class="lbl" style="color:var(--t60)">Por devolver</span><span class="disp num" style="font-size:26px">${S_(S.seps.filter(s => s.estado === 'liberada').reduce((a, s) => a + s.adel, 0))}</span><small>no se toca</small></div></div>
      <div class="verifica">${ico('i-cash', 'ico s')}<span>El efectivo de los adelantos <b>sí está en el cajón</b> y el arqueo lo cuenta, pero <b>no suma a «Ventas del día»</b>. El día que la clienta recoge, el total pasa a venta.</span></div>
      <button type="button" class="bp lbl" data-cerrar autofocus>Entendido</button>` });
  }

  // ================= Navegación =================
  function irA(v) { vista = v; pintar(); }
  function pintar() {
    document.getElementById('hoy').textContent = fLarga(S.hoy);
    document.querySelectorAll('.subnav [data-vista]').forEach(b => b.setAttribute('aria-current', b.dataset.vista === vista ? 'page' : 'false'));
    const n = S.seps.filter(s => ['porvencer', 'vencida', 'devolver'].includes(estadoDe(s, S.hoy).k)).length;
    ['menuContador', 'subContador'].forEach(id => { const el = document.getElementById(id); el.hidden = !n; el.textContent = n; });
    const raiz = document.getElementById('vista');
    raiz.innerHTML = vista === 'separar' ? vistaSeparar() : vista === 'entregar' ? vistaEntregar() : vistaBandeja();
    if (vista === 'separar') bindSeparar(raiz); else if (vista === 'entregar') bindEntregar(raiz); else bindBandeja(raiz);
  }
  document.querySelectorAll('.subnav [data-vista]').forEach(b => b.addEventListener('click', () => irA(b.dataset.vista)));
  document.getElementById('irCaja').addEventListener('click', modalCaja);
  document.getElementById('masDia').addEventListener('click', () => {
    S.hoy += DIA; const lib = vencerSolas(); pintar();
    if (lib.length) avisar(lib.length === 1 ? `${lib[0].cl.nombres}: se liberó sola` : `${lib.length} separaciones se liberaron solas`, 'Nadie decidió en 2 días. La prenda volvió al stock; falta devolver el adelanto.');
  });
  document.getElementById('reiniciar').addEventListener('click', () => { semilla(); sep = nuevaSep(); paso = 'ticket'; ultimo = null; entregaSel = null; pintar(); });
  document.addEventListener('keydown', e => {
    if (vista !== 'separar' || paso !== 'form' || document.getElementById('capa').children.length) return;
    const k = /^F([1-5])$/.exec(e.key); if (!k) return;
    e.preventDefault(); document.querySelector(`[data-medio="${MEDIOS[+k[1] - 1].id}"]`)?.click();
  });

  // Arranca con una prenda ya escaneada: la primera vista muestra el flujo, no un cascarón vacío.
  semilla(); sep = nuevaSep(); agregar('CAS-0002-NEG-M', false); pintar();
})();
</script>
