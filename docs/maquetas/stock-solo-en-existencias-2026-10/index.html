<header class="barra">
  <b>Maqueta · El stock solo en Existencias</b>
  <div class="grupo" id="g-dir"><span>Dirección</span>
    <button data-dir="A" class="on">A · Candado y puerta</button><button data-dir="B">B · El espejo</button><button data-dir="C">C · El cajón</button><button data-dir="D">D · Sin pestaña</button></div>
  <div class="grupo" id="g-esc"><span>Pantalla</span>
    <button data-esc="editar" class="on">Editar producto</button><button data-esc="nuevo">Nuevo producto</button><button data-esc="existencias">Existencias</button></div>
  <div class="grupo" id="g-nace"><span>Variante nueva nace</span>
    <button data-nace="unidades" class="on">Con sus unidades</button><button data-nace="cero">En cero</button></div>
  <div class="grupo fin" id="g-fin"><span>Tema</span>
    <button data-tema="claro">Claro</button><button data-tema="oscuro" class="on">Oscuro</button>
    <span style="margin-left:10px">Ancho</span>
    <button data-w="100%" class="on">Pleno</button><button data-w="1024px">1024</button><button data-w="375px">375</button>
    <button id="b-lento" style="margin-left:10px">Cámara lenta</button><button id="b-rep">↻ Repetir</button></div>
</header>

<main class="lienzo">
  <section class="estrado" id="estrado"><div class="erp" id="erp"></div></section>
  <aside class="notas" id="notas"></aside>
</main>
<div id="capas"></div>
<script src="maqueta.js?v=3"></script>
