<!doctype html>
<html lang="es">
  <!--
    El correo con el código para confirmar un correo NUEVO de una cuenta de la tienda online (Felipe 2026-10-15): «Cambiar mi correo» en
    Mi cuenta, o «Restablecer acceso» que pidió en una tienda CAYLA. Lo manda el proyecto de inicio de sesión de los clientes con su
    «cambio de correo» (plantilla «Change email address»), SOLO al correo nuevo («Secure email change» apagado): el correo de entrada
    cambia recién cuando la persona escribe este código en la tienda, y al correo anterior le llega `correo-cambiado.html`.
    `{{ .Token }}` es el código de 6 cifras (vence a los 30 minutos; uno nuevo anula el anterior). `{{ .RedirectTo }}` es la página donde
    se escribe (`/cuenta/correo` o `/restablecer-acceso`, la manda la tienda).
    NUNCA `{{ .ConfirmationURL }}`: ese enlace confirmaría el cambio directo en el proyecto, sin pasar por la tienda ni por sus topes.
    Los colores van escritos (son los de la paleta CAYLA): un correo no lee las variables de la hoja de estilos de la tienda.
  -->
  <body style="margin:0;padding:24px 12px;background:#f5f0e8;font-family:Arial,Helvetica,sans-serif;color:#1a1a18">
    <div style="max-width:480px;margin:0 auto;background:#fbf8f2;border:1px solid #e8e0d0;border-radius:14px;padding:28px 24px">
      <p style="margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#805c4c;font-weight:bold">CAYLA · Tienda online</p>
      <h1 style="margin:0 0 14px;font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:28px;line-height:1.1">Tu código para confirmar tu correo</h1>
      <p style="margin:0 0 18px;font-size:15px;line-height:1.5">Escríbelo en la tienda online para que tu cuenta CAYLA entre con este correo:</p>
      <p style="margin:0 0 22px;font-family:Arial,Helvetica,sans-serif;font-size:36px;font-weight:bold;letter-spacing:.24em;line-height:1">{{ .Token }}</p>
      <p style="margin:0 0 22px">
        <a href="{{ .RedirectTo }}" style="display:inline-block;background:#1a1a18;color:#f5f0e8;text-decoration:none;font-weight:bold;font-size:14px;padding:14px 26px;border-radius:999px">Abrir la tienda online</a>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#5b5b55">Vence en 30 minutos. Si no pediste cambiar el correo de una cuenta CAYLA, ignora este correo: sin este código, nada cambia.</p>
    </div>
  </body>
</html>
